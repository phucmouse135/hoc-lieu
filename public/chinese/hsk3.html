<style>
:root{--paper:#F2F4F3;--card:#FFFFFF;--ink:#17202A;--mute:#5B6770;--line:#D5DBDD;--grid:#E0A9A2;--ai:#1D4E6B;--ai-soft:#E2EDF2;--shu:#C0272D;--shu-soft:#FAE6E4;--hl:#FBEFB4;--ok:#2F7A55;--ok-soft:#E1F2E8;
 --zh:"Noto Serif SC","Songti SC","SimSun","STSong",serif;--ui:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--hd:"Source Serif 4","Noto Serif SC",Georgia,serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#12171B;--card:#1A2127;--ink:#E6EBEE;--mute:#97A4AD;--line:#2B363E;--grid:#6B3F3C;--ai:#8FC1DC;--ai-soft:#1B3140;--shu:#F0736B;--shu-soft:#3B2120;--hl:#564C14;--ok:#62C596;--ok-soft:#17352A}}
:root[data-theme="dark"]{--paper:#12171B;--card:#1A2127;--ink:#E6EBEE;--mute:#97A4AD;--line:#2B363E;--grid:#6B3F3C;--ai:#8FC1DC;--ai-soft:#1B3140;--shu:#F0736B;--shu-soft:#3B2120;--hl:#564C14;--ok:#62C596;--ok-soft:#17352A}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.55 var(--ui);-webkit-text-size-adjust:100%}
.zh{font-family:var(--zh);font-weight:500}
.py{color:var(--mute);font-size:.92em}
.nopy .vlist .py{display:none}
a{color:var(--ai)}
h1{font:600 1.9rem/1.2 var(--hd);margin:.2em 0 .35em}
h2{font:600 1.25rem/1.3 var(--hd);margin:0 0 .6em;display:flex;align-items:center;gap:.5em;flex-wrap:wrap}
h3{font-size:1.08rem;margin:0 0 .25em}
p{margin:.4em 0 .8em;max-width:70ch}
.mute{color:var(--mute);font-size:.94rem}.lead{font-size:1.08rem}
mark{background:var(--hl);color:inherit;padding:0 .15em;border-radius:3px}
:focus-visible{outline:3px solid var(--ai);outline-offset:2px}
#app{display:grid;grid-template-columns:214px minmax(0,1fr);min-height:100%}
.nav{position:sticky;top:0;align-self:start;height:100vh;padding:20px 12px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;background:var(--card)}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:600}
.nav a .zh{width:28px;height:28px;display:grid;place-items:center;border:1.5px solid var(--grid);border-radius:3px;font-size:1rem}
.nav a.on{background:var(--ai-soft);color:var(--ai)}.nav a.on .zh{border-color:var(--ai)}
.nav .brand{margin-bottom:14px;flex-direction:column;align-items:flex-start;gap:0;line-height:1.3;font-family:var(--hd)}
.nav .brand .zh{border:0;width:auto;height:auto;font-size:1.45rem;font-weight:700;color:var(--shu)}
main{padding:28px clamp(16px,4vw,48px) 96px;max-width:920px;width:100%}
.onb{max-width:480px;margin:0 auto;padding:7vh 20px;grid-column:1/-1}
.onb label,.form label{display:block;font-weight:600;margin:14px 0}
input:not([type=checkbox]),select,textarea{display:block;width:100%;margin-top:4px;padding:10px 12px;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:8px}
textarea{font-family:var(--zh);font-size:1.15rem;line-height:1.9;min-height:210px;resize:vertical}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0 16px}
.mz-row{display:flex;margin-bottom:18px}.mz-row span{width:66px;height:66px;display:grid;place-items:center;border:1.5px solid var(--grid);margin-right:-1.5px;font:700 2.2rem var(--zh);color:var(--shu);background:linear-gradient(var(--grid),var(--grid)) 50% 0/1px 100% no-repeat,linear-gradient(var(--grid),var(--grid)) 0 50%/100% 1px no-repeat,var(--card)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border:1.5px solid var(--ai);border-radius:8px;background:var(--ai);color:var(--card);font:600 1rem var(--ui);text-decoration:none;cursor:pointer}
.btn.line{background:transparent;color:var(--ai)}.btn.sm{padding:6px 12px;font-size:.9rem}.btn.wide{width:100%;margin-top:10px}
.btn.danger{background:transparent;border-color:var(--shu);color:var(--shu)}.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0}
.note{background:var(--shu-soft);border-left:4px solid var(--shu);padding:10px 14px;border-radius:0 8px 8px 0;max-width:none}
.tip{background:var(--hl);padding:8px 12px;border-radius:8px;font-size:.96rem;max-width:none}
.tip::before{content:"Watch out: ";font-weight:700}.tip.mem::before{content:"Memory hook: "}
.sec{margin:34px 0;padding-top:22px;border-top:1.5px solid var(--line)}
.crumb{font-size:.9rem;color:var(--mute);margin:0}
.hero{display:flex;gap:28px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.hero>div:last-child{flex:1;min-width:260px}.hero-k{display:flex}.hero-k .mz{width:clamp(84px,17vw,124px);margin-right:-1.5px;cursor:pointer;padding:0}
.mz{aspect-ratio:1;border:1.5px solid var(--grid);background:var(--card);position:relative;display:block}
.mz.txt{display:grid;place-items:center;font:700 clamp(3rem,10vw,4.4rem) var(--zh);color:var(--shu)}
.hsvg{display:block;width:100%;height:100%}
.hsvg path{fill:var(--ink)}.hsvg path.hgrid{fill:none;stroke:var(--grid);stroke-width:5;stroke-dasharray:22 20}
.hsvg path.hi{fill:var(--shu)}.hsvg path.ghost{fill:var(--line)}
.hsvg path.hm{fill:none;stroke:var(--ink);stroke-width:150;stroke-linecap:round;stroke-linejoin:round}
.hsvg text{font:700 58px var(--ui);fill:var(--shu)}
.hsvg.st .hgrid{display:none}
.seal{display:inline-grid;place-items:center;width:2em;height:2em;border:2px solid var(--shu);border-radius:5px;color:var(--shu);font:700 .95rem var(--zh);transform:rotate(-8deg);flex:none}
.seal.sm{font-size:.75rem}.seal.big{width:5.4rem;height:5.4rem;font-size:1.6rem;border-width:3px;margin:10px auto;border-radius:8px}
.seal.fail{border-color:var(--mute);color:var(--mute)}
.todo,.outl,.vlist,.gx,.kw{list-style:none;padding:0;margin:10px 0}
.todo li,.outl li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:9px 2px;border-bottom:1px dashed var(--line)}
.todo li.done a{color:var(--mute);text-decoration:line-through}.todo span{color:var(--mute);font-size:.92rem}
.outl li>span{flex:1;color:var(--mute)}.outl li>b{min-width:8em}.outl small{color:var(--shu)}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));flex:1}
.cell{aspect-ratio:1;border:1.5px solid var(--grid);margin:0 -1.5px -1.5px 0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:3px;text-decoration:none;color:var(--ink);background:var(--card);position:relative;min-width:0}
.cell small{font-size:.64rem;color:var(--mute);line-height:1.2}.cell b{font:500 clamp(1rem,3.4vw,1.55rem)/1 var(--zh);opacity:.88}
.cell.nl b{color:var(--ai)}
.cell.today{outline:3px solid var(--ai);outline-offset:-3px;z-index:1}
.cell .seal{position:absolute;inset:0;margin:auto;width:66%;height:66%;font-size:clamp(.8rem,2.6vw,1.2rem);background:color-mix(in srgb,var(--card) 72%,transparent)}
.wk{display:flex;align-items:center;gap:10px;margin-bottom:1.5px}.wkl{width:78px;flex:none;font-weight:600;font-size:.88rem}.wkl small{display:block;font-weight:400;color:var(--mute);font-size:.72rem}
.pbar{display:grid;grid-template-columns:74px 1fr 62px;gap:10px;align-items:center;margin:6px 0;font-size:.92rem}
.pbar div,.qbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.pbar i,.qbar i{display:block;height:100%;background:var(--ok)}
.gcard{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:16px 18px;margin:14px 0}
.gcard h3{font:700 1.3rem var(--zh);color:var(--ai)}.gm{font-weight:600;margin:0 0 8px}
.gs{background:var(--ai-soft);padding:8px 12px;border-radius:8px;max-width:none}
.gx li,.vlist li,.kw li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px dashed var(--line)}
.gx .zh,.pass{font-size:1.18rem;line-height:1.9}.gx .en{display:block;color:var(--mute);font-size:.95rem}
.say{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:transparent;color:var(--ai);display:grid;place-items:center;cursor:pointer;margin-top:3px}
.vlist li{cursor:pointer;align-items:baseline;flex-wrap:wrap;gap:4px 12px}.vlist .say{align-self:center;margin:0}
.vlist .zh{font-size:1.22rem;min-width:4.6em}.vlist .py{min-width:7em}.vlist .vm{flex:1 1 12em}
.vlist.hidden li:not(.show) .vm,.vlist.hidden li:not(.show) .py{filter:blur(6px)}
.vlist li.cut{border-top:2px solid var(--grid)}
.kw .zh{min-width:4.5em;font-size:1.12rem}
.chk{display:flex;gap:8px;align-items:center;margin:10px 0;font-size:.97rem}
.kcard{display:grid;grid-template-columns:200px minmax(0,1fr);gap:14px 22px;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:16px;margin:14px 0}
.kcard .hv{color:var(--shu);font-size:1.3rem;margin-right:.3em}
.steps{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px}.steps svg{width:52px;height:52px;border:1px solid var(--line);background:var(--card)}
.kgridv{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr))}
.kgridv button{aspect-ratio:1;border:1.5px solid var(--grid);margin:0 -1.5px -1.5px 0;background:var(--card);color:var(--ink);font:500 1.5rem var(--zh);cursor:pointer;padding:0}
.kgridv button.w{background:var(--shu-soft)}.kgridv button:hover{background:var(--ai-soft)}
.pn{display:flex;justify-content:space-between;margin-top:40px}
#modal,#quiz{position:fixed;inset:0;z-index:50;display:none;overflow:auto}
#modal.on{display:grid;place-items:center;background:rgba(10,18,28,.55);padding:16px}
.sheet{background:var(--paper);border-radius:12px;padding:22px;width:min(680px,100%);max-height:92vh;overflow:auto;position:relative}
.sheet .kcard{border:0;padding:0;background:transparent;margin:0}
.x{position:absolute;top:8px;right:10px;width:36px;height:36px;border:0;background:transparent;font-size:1.6rem;color:var(--mute);cursor:pointer;z-index:2}
.pad{position:relative;width:min(320px,80vw);margin:10px auto}.pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
#quiz.on{display:block;background:var(--paper)}
.qwrap{max-width:720px;margin:0 auto;padding:16px 18px 90px}
.qhead{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:6px 0 10px}.qhead .x{position:static}.qhead b{flex:1}
.qtag{display:inline-block;margin:18px 0 6px;font-size:.84rem;font-weight:600;color:var(--ai);background:var(--ai-soft);padding:2px 10px;border-radius:99px}
.qtext{font-size:1.05rem}.qs{font-size:1.4rem;line-height:1.9;margin:10px 0}.qs.huge,.qs .huge{font-size:4rem;line-height:1.3}
.pass{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:14px 16px;margin:10px 0 12px;white-space:pre-line}
.bl{display:inline-block;min-width:2.6em;border-bottom:2px solid var(--ink);text-align:center;color:var(--shu);margin:0 2px;font-family:var(--ui);font-weight:700}
.opts{display:grid;gap:10px;margin:12px 0 18px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:500 1.1rem/1.7 var(--zh);cursor:pointer}
.opt.lat{font:400 1.02rem/1.5 var(--ui)}
.opt .on{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:600 .8rem var(--ui);flex:none}
.opt:not(:disabled):hover{border-color:var(--ai)}
.opt.sel{border-color:var(--ai);background:var(--ai-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.no{border-color:var(--shu);background:var(--shu-soft)}
.subq{margin-top:16px;font-weight:600}
.fb{padding:12px 16px;border-radius:10px;margin:8px 0}.fb.good{background:var(--ok-soft)}.fb.bad{background:var(--shu-soft)}.fb p{margin:.3em 0;max-width:none}
.fb.good b{color:var(--ok)}.fb.bad b{color:var(--shu)}
.result{text-align:center;padding:10px 0 20px}.result p{margin-inline:auto}
.rev{border-top:1px dashed var(--line);padding:10px 0}.rev .qs{font-size:1.15rem}.rev .huge{font-size:2.2rem}.rev .pass{font-size:1rem}
span.ok{color:var(--ok)}span.no{color:var(--shu)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:99;font-size:.94rem;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
.guide{padding-left:1.3em;max-width:72ch}.guide li{margin:.45em 0}
.kwl .spk{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ai-soft);color:var(--ai);display:grid;place-items:center;font-size:.85rem;margin-top:5px}
.kwl.veil div{filter:blur(7px);user-select:none}
.gxl{font-size:1.3rem;line-height:1.9}
.chipsb{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chip{padding:5px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:500 1.1rem/1.8 var(--zh);cursor:pointer}
.chip:disabled{opacity:.35;cursor:default}.chip:not(:disabled):hover{border-color:var(--ai)}
.nw{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0}.nw span{font-size:.88rem;background:var(--ai-soft);border-radius:6px;padding:1px 8px}
#din{font:500 1.2rem var(--zh);padding:12px 14px;margin-top:12px}
.czb{font:inherit;background:var(--ai-soft);border:0;border-bottom:2px solid var(--ai);border-radius:4px 4px 0 0;color:var(--ai);cursor:pointer;padding:0 8px;min-width:3em}
.czb.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}.czb.no{background:var(--shu-soft);border-color:var(--shu);color:var(--shu)}
.bl.cur{background:var(--hl)}
.flash{background:var(--card);border:1.5px solid var(--grid);border-radius:10px;padding:24px 18px;text-align:center;margin:14px 0;min-height:170px}
.flash .huge{font-size:4.6rem;line-height:1.2}.flash p{margin-inline:auto}.flash .pass{text-align:left}
.fback{border-top:1px dashed var(--line);margin-top:16px;padding-top:14px}
.tb{width:100%;border-collapse:collapse;margin:14px 0;font-size:.95rem;text-align:left}
.tb th,.tb td{border:1px solid var(--line);padding:7px 10px;vertical-align:top}.tb th{background:var(--ai-soft)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin:18px 0}
.pcard{display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px 16px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;text-decoration:none;cursor:pointer}
.pcard:hover{border-color:var(--ai)}.pcard b{color:var(--ai)}.pcard span{color:var(--mute);font-size:.92rem}
.panels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.panels.p3{grid-template-columns:repeat(3,1fr)}
.panel{border:1.5px solid var(--line);border-radius:8px;background:var(--card);padding:8px 4px;text-align:center;position:relative}
.panel i{font-style:normal;font-size:clamp(1.5rem,5vw,2.3rem);line-height:1.5;display:block}
.panel small{display:block;color:var(--mute);font-size:.78rem;line-height:1.3;padding:0 4px}.panel b{position:absolute;top:2px;left:7px;font-size:.78rem;color:var(--shu)}
.panels.hide small{display:none}
.ord{display:grid;gap:8px;margin:12px 0}
.ordp{display:flex;gap:10px;text-align:left;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:500 1.05rem/1.8 var(--zh);cursor:pointer}
.ordp b{font:700 .95rem var(--ui);color:var(--ai);flex:none;width:1.4em}.ordp:disabled{opacity:.45}
.ordp.ok{border-color:var(--ok);background:var(--ok-soft);opacity:1}.ordp.no{border-color:var(--shu);background:var(--shu-soft);opacity:1}
.seq{font-weight:700;letter-spacing:.08em;color:var(--ai)}
.cnt{font-weight:700}.cnt.low{color:var(--shu)}
.ai{border:1.5px solid var(--ai);border-radius:10px;padding:12px 16px;margin:12px 0;background:var(--card);white-space:pre-wrap}
@media (max-width:820px){
 #app{display:block}
 .nav{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;justify-content:space-around;padding:6px 2px calc(6px + env(safe-area-inset-bottom,0px));border:0;border-top:1px solid var(--line);z-index:20}
 .nav .brand{display:none}.nav a{flex-direction:column;gap:2px;font-size:.66rem;padding:4px 2px}.nav a .zh{width:26px;height:26px}
 main{padding-top:18px}h1{font-size:1.5rem}

}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.rb{line-height:2.3}.opt .rb,.chip .rb,.czb .rb{line-height:2}

.kgridv.big small{font:400 .8rem var(--ui);color:var(--mute)}
.panels.p1{grid-template-columns:minmax(0,240px)}

</head>
<body>
<a href="../index.html" id="homebtn" aria-label="Về trang chủ">‹ Trang chủ</a>
<div id="app"></div>
<div id="modal"></div>
<div id="quiz" role="dialog" aria-label="Exercise"></div>

般","被","调","海"],["换","借","哭"],["凉","难","瓶","特"],["夏","假","答","渴"]],"g":"##1\n@老—、—子、—员、—家 · 咱们|Word-building pieces; \"we\" including you|老 + surname/noun · noun + 子 · verb/noun + 员 · field + 家 · 咱们\n老 before a surname is a friendly way to address an older acquaintance (老王); it is also fixed in words like 老师. 子 ends many everyday nouns (桌子、裙子). 员 marks a member of staff or of a group (服务员、运动员); 家 marks a specialist (画家、科学家). 咱们 means \"we\" and always includes the person spoken to; 我们 may or may not.\n!A host says 欢迎你们来我们家 (the guests are not part of 我们), but 咱们走吧 when everyone leaves together.\n>这位是住在我们楼上的邻居，【老|小子|员|家】王。=This is the neighbour who lives above us, Lao Wang.\n>客人都到了，【咱们|别人|他们|大人们】开始吃饭吧。=The guests have all arrived; let's start eating.\n~王阿姨的爱人是一位很有名的画【家|员|子|人们】。=Auntie Wang's husband is a very famous painter.\n##2\n@A 跟 B 一样（+ adjective）· 像|The same as; to look like|A + 跟 + B + 一样 · A + 跟 + B + 一样 + adjective · A + 像 + B\nA 跟 B 一样 says two things are the same; add an adjective to say in what respect: 他跟我一样高 (he is as tall as I am). The negative is 不一样. 像 means \"to resemble\": 她长得像妈妈.\n!The adjective comes after 一样: 一样高, never 高一样.\n>我弟弟跟我【一样|比较|一起|一定】高，但是他比我瘦。=My younger brother is as tall as I am, but he is thinner than me.\n>她的头发跟她妈妈的不【一样|像|长|可爱】，是短的。=Her hair is not like her mum's; it is short.\n~这个孩子长得很【像|跟|比|一样】他爸爸。=This child looks very much like his dad.\n##3\n@比较、挺、更、特别、极 · 越来越|Degrees; more and more|比较/挺/特别 + adjective · A 比 B 更 + adjective · adjective + 极了 · 越来越 + adjective\n比较 = rather, fairly; 挺…(的) = quite (spoken); 特别 = especially; 更 = even more, used in comparisons: 他比我更高. 极 follows the adjective with 了: 好极了. 越来越 + adjective = more and more: 天气越来越冷.\n!With 比, only 更 or 还 can stand before the adjective: 他比我更高 ✓, 他比我很高 ✗.\n>今天比昨天【更|很|挺|比较】冷，你多穿一点儿。=Today is even colder than yesterday; put on a bit more.\n>这个地方挺安全【的|了|极|更】，晚上出门也没问题。=This place is quite safe; going out at night is no problem either.\n~他的汉语说得【越来越|越多越|更来更|比较来】好了。=His spoken Chinese is getting better and better.\n##4\n@Adjective + 得很 · 极了|\"Very…\", \"extremely…\" after the adjective|adjective + 得很 · adjective/verb + 极了\nBoth put the degree after the adjective. 得很 = very: 我的腿疼得很. 极了 = extremely: 好极了、累极了. They are a little stronger and more colloquial than 很 + adjective.\n!Do not add 很 in front as well: 很疼得很 ✗.\n>我感冒了，头疼【得很|很得|极得|得极】，想请假休息。=I've caught a cold and my head hurts badly; I'd like to take time off to rest.\n>医生说我的身体健康【极了|得了|很了|极得】，不用担心。=The doctor says I'm in excellent health; no need to worry.\n~他发烧了，脸红【得很|很得|极|比较】。=He has a fever and his face is very red.\n##5\n@应该、必须、得、需要、不用 · 该……了|Should, must, need; it's time to|S + 应该/必须/得/需要 + verb · 不用 + verb · 该 + verb + 了\n应该 = should (advice or expectation). 必须 = must (no choice). 得 (děi, spoken) = have to. 需要 = need. The negative of 必须 and 得 is 不用 (no need to), not 不必须 or 不得. 该…了 = it's time to: 该睡觉了.\n!得 has three readings: de after a verb (跑得快), dé \"to get\", and děi \"must\" before a verb.\n>你发烧了，【应该|不用|当然|一定的】去医院检查一下。=You have a fever; you should go to the hospital for a check-up.\n>明天不上班，你【不用|必须|不行|不该】这么早起床。=There's no work tomorrow; you needn't get up so early.\n~已经十二点了，我们【该|应|需|必】睡觉了。=It's already twelve; it's time we went to bed.\n##6\n@一点儿也不…… · 一 + measure word + 也/都 + 不/没……|Not at all; not even one|一点儿 + 也/都 + 不/没 + adjective/verb · 一 + measure word (+ noun) + 也/都 + 不/没 + verb\nPutting the smallest amount before 也 or 都 and a negative denies something completely: 我一点儿也不害怕 (I'm not afraid at all), 他一句话也没说 (he didn't say a single word).\n!The \"一…\" part comes before the verb, not after it: 我一个人也不认识.\n>你放心，我【一点儿|有点儿|一些|一下】也不生气。=Don't worry, I'm not angry at all.\n>昨天的晚会上，我一个人【也|就|才|还】不认识。=At the party yesterday I didn't know a single person.\n~他心里很难过，一句话【都没|没都|也不要|都别】说。=He was very sad and didn't say a word.\n##7\n@对……感兴趣 · 认为、以为|Interested in; think vs wrongly think|S + 对 + something + (很) 感兴趣 / 有兴趣 · S + 认为 + opinion · S + 以为 + mistaken belief\n对 introduces what a feeling or attitude is directed at: 我对历史很感兴趣, 他对我很关心, 我对这个结果很满意. 认为 states a considered opinion. 以为 says what you believed before finding out you were wrong: 我以为你不来了.\n!感兴趣 cannot take an object after it: 我感兴趣音乐 ✗ → 我对音乐感兴趣.\n>我弟弟【对|跟|比|向】画画儿特别感兴趣。=My younger brother is especially interested in drawing.\n>我【以为|认为|相信|愿意】今天是星期五，其实是星期四。=I thought today was Friday; actually it's Thursday.\n~老师【认为|以为|奇怪|满意】他是一个很聪明的学生。=The teacher considers him a very clever student.\n##8\n@如果……（的话），就……|If|如果 + condition (+ 的话)，(S) + 就 + result\n如果 introduces a condition; the result clause usually has 就 after its subject. 的话 can close the condition, with or without 如果: 你不想去的话，就别去了.\n!就 comes after the subject of the second clause: 如果下雨，我们就不去, not 就我们不去.\n>【如果|可是|而且|不但】明天下雨，我们就不去公园了。=If it rains tomorrow, we won't go to the park.\n>你有时间【的话|如果|只有|可是】，就来我家玩儿吧。=If you have time, come over to my place.\n~如果你不相信，【就|才|可|只】自己去看看。=If you don't believe it, go and see for yourself.\n@只要……就…… · 只有……才……|As long as; only if|只要 + sufficient condition，就 + result · 只有 + necessary condition，才 + result\n只要…就… = this one condition is enough: 只要努力，就能学好. 只有…才… = nothing less will do: 只有努力，才能学好. Remember the pairs: 只要 with 就, 只有 with 才.\n!才 by itself often means \"not until, only then\": 他十点才来 (he didn't come until ten).\n>只要你愿意，我【就|才|可|只】帮你。=As long as you are willing, I'll help you.\n>只有多听多说，【才|就|可是|而且】能学好汉语。=Only by listening and speaking a lot can you learn Chinese well.\n~【只要|只有|只是|只能】不下雨，我们就去爬山。=As long as it doesn't rain, we'll go hiking.\n##9\n@Verb + 了 + object + 就 + verb|\"As soon as I've…, I…\"|S + verb 1 + 了 + (object) + 就 + verb 2\nTwo actions in a row: the second starts once the first is completed. 了 after the first verb marks its completion, even in the future: 我吃了饭就去 (I'll go once I've eaten), 他洗了澡就睡觉了.\n!The object of the first verb comes after 了: 下了课就走.\n>我每天吃【了|过|着|的】早饭就去锻炼。=Every day I go and exercise as soon as I've had breakfast.\n>他昨天洗了澡【就|才不|可|又没】睡觉了。=Yesterday he went to bed right after his shower.\n~你到了北京【就|可是|只有|而且】给我打电话。=Phone me as soon as you get to Beijing.\n##10\n@又……又…… · 不但……而且……|Both… and…; not only… but also…|又 + adjective/verb + 又 + adjective/verb · S + 不但 + A，而且 + B\n又…又… gives two qualities or actions that hold together: 这个西瓜又大又甜. 不但…而且… adds a further, stronger point: 这儿的蛋糕不但好吃，而且很便宜.\n!With one subject, 不但 comes after it: 他不但会说汉语，而且会写汉字.\n>这个西瓜【又|也|还|更】大又甜，你尝尝。=This watermelon is both big and sweet; have a taste.\n>这家店的冰激凌不但好吃，【而且|可是|如果|只有】不贵。=This shop's ice cream is not only tasty but also inexpensive.\n~牛肉又新鲜【又|也|而且|更】便宜，我们多买一点儿吧。=The beef is both fresh and cheap; let's buy a bit more.\n##11\n@Containers as measure words|A bowl of, a plate of, a bottle of|number + 碗/盘/瓶/杯 + noun\nWords for containers serve as measure words: 一碗米饭 (a bowl of rice), 一盘饺子, 两瓶啤酒, 一杯水. As nouns they take 子 or their own measure word: 一个碗、一个盘子、一个瓶子. 把 counts things with a handle: 一把勺子、一把伞.\n!一碗米饭 = a bowl of rice; 一个碗 = a bowl.\n>服务员，请给我们来两【瓶|把|双|张】啤酒。=Waiter, two bottles of beer for us, please.\n>我饿了，今天吃了三【碗|只|条|本】米饭。=I was hungry; I ate three bowls of rice today.\n~桌子上有两双筷子和一【把|瓶|碗|口】勺子。=On the table there are two pairs of chopsticks and a spoon.\n##12\n@先……，再/然后……|First… then…|S + 先 + verb 1，再/然后 + verb 2\nGives the order of two or more actions: 先洗手，再吃饭. 然后 = \"after that\" and can be followed by 再. 最后 introduces the last step.\n!先 and 再 are adverbs and stand after the subject: 我先走, not 先我走.\n>我们【先|刚|才|后来】去吃饭，然后去看电影，好吗？=Let's eat first and then go to see a film, shall we?\n>你先做作业，【然后|以前|刚才|最近】再玩儿游戏。=Do your homework first, and after that play games.\n~我先坐地铁，再坐公交车，【最后|刚刚|以前|马上的】走十分钟。=First I take the metro, then a bus, and finally I walk for ten minutes.\n@才 · 就 · 刚|Later than expected; sooner than expected; just now|time + 才 + verb · time + 就 + verb + 了 · 刚 + verb\n才 says something happened late or with difficulty: 他十点才起床. 就 says it happened early or easily: 他六点就起床了. Sentences with 才 take no 了. 刚 (or 刚刚) = only a moment ago: 我刚到. 刚才 is a time noun, \"a moment ago\": 刚才谁来了？\n!以后 looks forward from a point (下课以后); 后来 only narrates the past (后来他搬家了).\n>电影七点开始，他七点半【才|就|刚|先】来。=The film started at seven; he didn't arrive until half past.\n>我今天五点【就|才|再|然后】起床了，现在很累。=I got up as early as five today, so I'm very tired now.\n~我【刚|才能|后来|以后】到家，还没吃饭呢。=I've only just got home and haven't eaten yet.\n##13\n@Verb + 得/不 + result|Can or cannot manage|verb + 得 + result (can) · verb + 不 + result (cannot)\nInsert 得 or 不 between a verb and its result or direction to say whether the result can be reached: 看得见 (can see), 听不懂 (cannot understand), 穿不上 (cannot get it on), 买不到 (cannot manage to buy). The question repeats both: 听得懂听不懂？\n!听不懂 = unable to understand (general ability); 没听懂 = did not understand (that time).\n>这条裙子太小了，我穿不【上|下去|起来|完成】。=This skirt is too small; I can't get into it.\n>黑板上的字太小，我看不【清楚|干净|合适|明白了】。=The writing on the board is too small; I can't see it clearly.\n~这双鞋现在很难买【得到|不得|到得|得不】吗？=Is this pair of shoes hard to get hold of now?\n##14\n@大概 · two numbers in a row|Roughly|大概 + number/verb · 三四 + measure word\n大概 before a number or a statement means \"about, probably\": 大概五公斤、他大概不来了. Two neighbouring numbers also give an estimate: 三四斤 (three or four jin), 七八个人, 十五六岁. Money in speech: 块 and 毛 (written 元 and 角): 三块五(毛).\n!一斤 is half a kilogram (公斤). 两 is used before 斤: 两斤.\n>这些苹果【大概|一共的|差|合适】有三公斤。=These apples weigh about three kilograms.\n>我买了【三四|三和四|三或四个|三到】斤香蕉，一共十二块五。=I bought three or four jin of bananas, twelve yuan fifty altogether.\n~这双鞋有点儿小，可以【换|试试看|大小|一共】一双大的吗？=These shoes are a bit small; can I change them for a bigger pair?\n##15\n@把 + object + verb + result|Doing something to a definite thing|S + 把 + object + verb + result/direction/了\nThe 把 sentence brings the object before the verb and says what is done to it and with what result: 我把作业做完了 (I've finished the homework), 请把门关上. The object is definite, and the verb cannot stand alone: it needs a result, a direction, 了 or a reduplication.\n!Negatives and modal verbs go before 把: 我没把书带来、你应该把房间打扫一下.\n>我已经【把|被|向|对】今天的作业做完了。=I've already finished today's homework.\n>请你把门关【上|在|了着|过】，外面太冷了。=Please close the door; it's too cold outside.\n~他没【把|被|对|为】这件事告诉别人。=He didn't tell anyone else about this.\n##16\n@Something appears or disappears|\"A new family has moved in upstairs\"|place/time + verb + result/direction + 了 + number + noun\nTo report that someone or something has appeared or gone, Chinese starts with the place and puts the new (indefinite) person or thing last: 楼上搬来了一家人 (a family has moved in upstairs), 前面开过来一辆车, 我们小区搬走了两家人.\n!The noun at the end is new information, so it takes a number and measure word, not 这 or 那.\n>我们楼上搬【来了|来着|在了|过来的】一位年轻的画家。=A young painter has moved in upstairs.\n>沙发上放【着|在|到|过了】两件大衣。=Two overcoats are lying on the sofa.\n~小区门口开过来一【辆|把|层|张】车。=A car drove up to the entrance of the estate.\n##17\n@把 + object + verb + 在/到/给 + place/person|Putting things somewhere, giving them to someone|S + 把 + object + 放/搬/带 + 在/到 + place · S + 把 + object + 送/还/交 + 给 + person\nWhen the verb is followed by 在, 到 or 给 plus a place or a person, the object must go before the verb with 把: 把箱子放在门口 (put the box by the door), 把行李搬到楼上, 把礼物送给她.\n!放箱子在门口 ✗: there is no room for the object after the verb here.\n>请把这个箱子放【在|着|了|过】沙发旁边。=Please put this box next to the sofa.\n>我们把旧洗衣机搬【到|给|在了|得】楼下去了。=We moved the old washing machine downstairs.\n~我想【把|被|让|对】这件礼物送给我的邻居。=I'd like to give this present to my neighbour.\n##18\n@或者 · 还是|\"Or\" in statements and in questions|A + 或者 + B (statement) · A + 还是 + B？(question)\nBoth mean \"or\". 还是 offers a choice in a question; 或者 (or the shorter 或) lists alternatives in a statement: 你今天来还是明天来？ — 今天或者明天都可以.\n!In \"I don't know whether A or B\", Chinese uses 还是: 我不知道他来还是不来.\n>周末我在家看书【或者|还是|而且|如果】去公园走走。=At weekends I read at home or go for a walk in the park.\n>你想喝啤酒【还是|或者|或|以外】饮料？=Would you like beer or a soft drink?\n~你明天【或者|还是|除了|为了】后天来都可以。=You can come either tomorrow or the day after.\n@除了……以外 · 为了|Besides, except; in order to|除了 + X (+ 以外)，S + 还/也 … (in addition) · 除了 + X (+ 以外)，S + 都 … (except) · 为了 + purpose，…\nWith 还 or 也, 除了 adds: 除了汉语，他还会说英语 (besides Chinese, he also speaks English). With 都, it excludes: 除了他，我们都去了 (everyone except him). 为了 introduces a purpose and usually opens the sentence: 为了健康，他每天锻炼.\n!为了 gives the aim; 因为 gives the cause.\n>除了数学以外，他【还|都|就|才】喜欢历史。=Besides maths, he also likes history.\n>【除了|为了|关于|根据】小王，别的同学都到了。=Everyone has arrived except Xiao Wang.\n~【为了|除了|因为了|比如】提高汉语水平，她每天看中文新闻。=To improve her Chinese, she watches the news in Chinese every day.\n##19\n@Verb-object words|请假, 放假, 见面, 结婚, 洗澡|verb + (了/过/number/duration) + object part · 跟 + person + 见面/结婚\nThese \"verbs\" are really verb + object, so extra elements go in the middle and no second object can follow: 请两天假 (take two days off), 放了三天假, 见过一次面, 洗了一个澡. The other person is introduced by 跟: 跟朋友见面, 跟她结婚.\n!见面他 ✗ → 跟他见面. 结婚她 ✗ → 跟她结婚.\n>我想跟老师请两天【假|请|期|放】。=I'd like to ask the teacher for two days off.\n>我们明天下午在图书馆门口【见面|见面你|遇见面|面见】吧。=Let's meet at the library entrance tomorrow afternoon.\n~这个学期我们一共放了三次【假|学|课|期】。=We've had three holidays in all this term.\n##20\n@More measure words · reduplication|页, 句, 段, 张, 本 · \"every single one\"|number + measure word + noun · measure word doubled + 都\n页 pages · 句 sentences (一句话) · 段 paragraphs, stretches (一段课文、一段时间) · 张 flat things (一张纸、一张地图) · 本 books · 种 kinds · 把 things with handles. Doubling a measure word means \"every one without exception\" and takes 都: 个个都很聪明, 张张都好看, 天天都来.\n!The doubled form is the subject or stands right after it, before 都.\n>请大家把课本打开，看第二十【页|句|段|张】。=Open your textbooks, everyone, and look at page twenty.\n>这段课文不长，一共只有八【句|页|本|种】话。=This passage isn't long: only eight sentences in all.\n~我们班的同学【个个|个子|一个|每】都很认真。=Every single student in our class is conscientious.\n##21\n@Verb + number + 遍/次 · verb repeated with 得|How many times; how well|verb + number + 遍/次 (+ object) · S + verb + object + verb + 得 + comment\n次 counts occasions; 遍 counts complete run-throughs from beginning to end: 这段对话我读了三遍. When a verb has both an object and a 得-comment, say the verb twice: 他说汉语说得很好, 她写字写得很清楚.\n!遍 implies the whole thing each time; 看了一次 may mean you saw only part of it.\n>这篇课文太难了，我读了三【遍|页|句|段】才明白。=This text is too hard; I only understood it after reading it three times.\n>他回答问题回答【得|的|地|了】又快又好。=He answers questions both quickly and well.\n~老师讲了两【遍|个|张|种】，我还是没记住。=The teacher explained it twice and I still couldn't remember it.\n##22\n@Question word + 都/也|Anyone, anything, anywhere|谁/什么/哪儿/怎么 + 都/也 + (不) + verb\nA question word followed by 都 (or 也 in negatives) stops asking and means \"every\" or \"any\": 谁都知道 (everybody knows), 我什么都不想吃 (I don't want to eat anything), 哪儿都找不到. Two matching question words mean \"whatever/whoever\": 你想吃什么就吃什么.\n!The question word goes before the verb, even when it is the object: 我什么都吃.\n>这个难题太难了，【谁|哪|怎么的|什么人们】都不会做。=This problem is too hard; nobody can do it.\n>他对数学不感兴趣，上课什么【也|就|才|又】不听。=He isn't interested in maths and doesn't listen to anything in class.\n~周末你想去【哪儿|这儿|那儿|哪个】就去哪儿，我都可以。=At the weekend go wherever you want; anything is fine with me.\n##23\n@Verb + 到/住/走/上|Results: reach, hold fast, away, shut|verb + 到 · verb + 住 · verb + 走 · verb + 上\n到 = the action reaches its goal (找到、听到、买到、学到第五课). 住 = firmly, so that it stays (记住、站住、拿住). 走 = away (拿走、带走、搬走). 上 = closed or attached (关上、穿上、写上名字).\n!记了 = made an effort to remember; 记住了 = it has stuck.\n>这些词很重要，你一定要记【住|走|上|到了】。=These words are important; you must memorise them.\n>我找了半天，终于找【到|住|走|上】了我的笔记本。=After searching for ages I finally found my notebook.\n~请把窗户关【上|住了|走|到】，认真听我说。=Please close the window and listen to me carefully.\n##24\n@一边……一边…… · 又 and 再|Two things at once; \"again\"|S + 一边 + verb 1，一边 + verb 2 · 又 + verb + 了 (again, already happened) · 再 + verb (again, not yet)\n一边…一边… = doing two things at the same time: 他一边吃饭，一边看手机. 又 and 再 both mean \"again\": 又 for a repetition that has happened (他又迟到了), 再 for one still to come (明天再来).\n!总是 (always) often goes with 又 in complaints: 你怎么总是迟到？ 今天又迟到了！\n>她喜欢一边听音乐，【一边|一块儿|一般|一起的】做作业。=She likes doing her homework while listening to music.\n>你昨天迟到了，今天怎么【又|再|常|总】迟到了？=You were late yesterday; how come you're late again today?\n~这个电影很好看，我想【再|又|总是|到处】看一遍。=This film is very good; I'd like to watch it once more.\n##25\n@被|The passive|receiver + 被 + (doer) + verb + result\n被 sentences put the thing affected first: 我的手机被弟弟拿走了 (my phone was taken by my brother). The doer may be left out: 邮件被发出去了. As with 把, the verb needs a result or 了. The passive often reports something unwelcome.\n!Negatives and modal verbs come before 被: 文件没被拿走.\n>我的邮箱【被|把|向|为】同事用了，我现在不能发邮件。=My mailbox has been used by a colleague; I can't send emails now.\n>办公室的灯被经理关【上|在|着|过去】了。=The office lights were switched off by the manager.\n~今天的会议没【被|把|让得|给了】安排在上午。=Today's meeting was not scheduled for the morning.\n##26\n@Verb + 出来 · 起来|Extended meanings: work out; recall|想出来 · 看出来 · 听出来 · 想起来\n出来 after 想, 看, 听 means producing or identifying something that was not there or not clear before: 想出来一个办法 (think up a way), 我看出来了 (I can tell), 听出来是谁. 想起来 means recalling something you once knew: 我想起来了，他姓王.\n!想出来 = invent something new; 想起来 = remember something old.\n>我们想了一个下午，终于想【出来|起来|下来|过来】一个好办法。=We thought all afternoon and finally came up with a good way.\n>我想【起来|出来|上来|进来】了，这个人是我以前的同事。=Now I remember: this person is a former colleague of mine.\n~你能看【出来|起来了|进去|回来】这是谁写的字吗？=Can you tell whose handwriting this is?\n##27\n@向 · 往|Towards|向/往 + direction + verb · 向 + person + verb\nBoth give the direction of movement: 向前走、往左拐. Only 向 can take a person: 向老师问好、向他学习. 往 is common in directions on the street.\n!At a crossing: 到了路口往右走。\n>你一直【向|为|把|被】前走，到了红绿灯就能看见银行。=Go straight ahead; at the traffic lights you'll see the bank.\n>到了第二个路口，再【往|为|对了|跟】左走，就是公园。=At the second crossing, turn left and there is the park.\n~我们应该【向|往|把|被】他学习，每天锻炼身体。=We should learn from him and exercise every day.\n##28\n@Compass directions|East, south, west, north|place + 的 + 东/南/西/北 + 边/面 · 东南、西北 · A 在 B 的 + direction\nAdd 边 or 面 to make a place word: 学校的东边 (to the east of the school). Chinese names the in-between directions east/west first: 东南、东北、西南、西北. 中间 = in the middle, between: 银行和书店的中间.\n!English says \"northeast\"; Chinese says 东北 (\"east-north\").\n>图书馆在学校的西【边|方向|中|附近的】。=The library is on the west side of the school.\n>银行在超市和药店的【中间|方向|东北的|附近是】。=The bank is between the supermarket and the pharmacy.\n~中国的【东北|北东|东方北|北边东】冬天特别冷。=The northeast of China is especially cold in winter.\n##29\n@Several descriptions before one noun|Order of modifiers|whose + this/that + number + measure word + description + 的 + noun\nWhen several things describe a noun, the usual order is: possessor → 这/那 → number + measure word → descriptive phrase with 的 → noun: 我的那两个中国朋友 (those two Chinese friends of mine), 南方的一个小城市.\n!A long description with 的 can also come first for emphasis, but the number + measure word never follows the noun.\n>他来自中国南方的【一个小|小一个|一小个|个一小】城市。=He comes from a small city in the south of China.\n>我想买一张【大一点儿的世界|世界大一点儿的|大的一点儿世界|一点儿大世界的】地图。=I'd like to buy a slightly bigger map of the world.\n~这是我【那两位外地|两位那外地|外地那两位的|那外地两位】朋友。=These are those two friends of mine from out of town.\n##30\n@别的 · 其他|Other|别的 + noun · 其他 (+ 的) + noun · 用 + tool + verb\n别的 = other, different ones (unspecified): 你还要别的吗？ 其他 = the remaining ones of a known group: 其他同学都到了. 用 + something + verb says what you use to do it: 用筷子吃饭、用汉语回答.\n!别的 does not take a number directly: 别的三个人 ✗ → 其他三个人.\n>这种方法不行，我们试试【别的|其他个|不同|另】方法吧。=This method won't work; let's try another one.\n>小王已经到了，【其他|别的个|以上|有用】同学还在路上。=Xiao Wang has arrived; the other students are still on their way.\n~中国人一般【用|把|被|向】筷子吃饭。=Chinese people generally eat with chopsticks.\n##31\n@Time since an event|\"It's been three years since…\"|S + verb (+ object) + duration + 了\nFor verbs that happen in an instant (来, 去, 到, 离开, 结婚, 毕业), a duration after them counts the time since the event: 我来北京三年了 (I've been in Beijing three years), 飞机起飞半个小时了, 他离开公司两个月了.\n!Do not say 我来了三年北京. The object stays with the verb, and the duration comes last.\n>我们出发已经两个小时【了|过|着|的】，怎么还没到？=We set off two hours ago already; why aren't we there yet?\n>他离开公司三个【月|个月|月的|时候】了，现在在外地工作。=He left the company three months ago and now works in another part of the country.\n~高铁晚点半个【小时|点|时候|分】了，司机说马上就开。=The high-speed train is half an hour late; the driver says it will leave any minute.\n##32\n@Verb 1 + 着 + verb 2|Doing one thing while in the state of another|S + verb 1 + 着 (+ object) + verb 2\nThe first verb with 着 gives the manner or accompanying state of the main action: 她笑着说 (she said with a smile), 他带着相机去旅游, 站着吃饭.\n!The main action is the second verb; the 着 phrase only describes how.\n>游客们拿【着|了|过|得】护照，在门口等着检票。=The tourists are waiting at the gate for the ticket check, passports in hand.\n>她笑着【对|把|被|为了】我们说：“欢迎来北京！”=She said to us with a smile, \"Welcome to Beijing!\"\n~小心，别走【着|了|过来|上】路看手机。=Careful: don't look at your phone while walking.\n##33\n@越……越……|The more… the more…|S + 越 + verb/adjective + 越 + adjective\nThe second quality grows as the first increases: 雨越下越大 (the rain is getting heavier and heavier), 他越说越快, 汉语越学越有意思. With two subjects: 天气越冷，我越不想出门.\n!越来越 + adjective is the same pattern with 来 standing for the passing of time.\n>外面的风【越|更|挺|极】刮越大，我们快回家吧。=The wind outside is blowing harder and harder; let's hurry home.\n>到了秋天，天气越来越【凉快|凉快了很|很凉快|凉快极】。=Once autumn comes, the weather gets cooler and cooler.\n~这儿的夏天，越到中午太阳【越|也|又|更的】大。=In summer here, the closer to noon it gets, the stronger the sun.\n##34\n@Question words that do not ask|Something, somewhere, sometime|verb + 什么/哪儿/谁/几 (no question intended)\nIn statements and in yes/no questions, question words can mean \"some, any\": 我想吃点儿什么 (I'd like something to eat), 我们找个时间去哪儿走走吧, 你有什么问题吗？ (do you have any questions?).\n!With 吗 at the end the sentence is a yes/no question, and 什么 means \"any\".\n>周末天气好的话，我们去【哪儿|这儿|那么|哪些人】爬爬山吧。=If the weather is fine at the weekend, let's go hiking somewhere.\n>你养过【什么|怎么|哪儿|多少的】动物吗？=Have you ever kept any animals?\n~我好像在【哪儿|什么的|怎样|哪里边】见过这种树。=I seem to have seen this kind of tree somewhere.\n##35\n@不是……吗？|\"Isn't it…?\" as a reminder|S + 不是 + fact + 吗？\nA rhetorical question that reminds the listener of something obvious or expresses surprise: 你不是去过吗？ (you've been there, haven't you?), 今天不是星期六吗？ It expects agreement, not information.\n!The speaker already believes the fact; the tone can be mildly reproachful.\n>你【不是|是不|没是|不有】说后天来吗？怎么今天就到了？=Didn't you say you were coming the day after tomorrow? How come you're here today already?\n>明天不是节日【吗|呢|吧了|的】？银行为什么开门？=Isn't tomorrow a holiday? Why is the bank open?\n~我们前天不是见过面吗？你怎么【不认识|认识|想起|记住】我了？=Didn't we meet the day before yesterday? How come you don't recognise me?\n##36\n@Number + measure word, doubled|One by one|一 + measure word + 一 + measure word + 地 + verb\nRepeating \"one + measure word\" shows that things are done one after another, in order: 一张一张地看 (look through them sheet by sheet), 一遍一遍地练习 (practise time after time), 一个一个地进来.\n!The whole phrase works as an adverbial, usually with 地 before the verb.\n>他把以前的信一封一【封|张|节|刻】地读了一遍。=He read through his old letters one by one.\n>老师一遍一【遍|次|下|米】地讲，直到大家都明白。=The teacher explained it time after time until everyone understood.\n~雨突然下大了，我没带【伞|米|刻|号码】。=It suddenly started raining heavily, and I had no umbrella with me.\n##37\n@借 · 还 · 把……还给……|Borrowing, lending, giving back|跟 + person + 借 + thing (borrow from) · 借给 + person + thing (lend to) · 把 + thing + 还给 + person\n借 covers both directions; the particle shows which: 我跟他借了一本书 (I borrowed a book from him), 他借给我一本书 (he lent me a book). 还 (huán) = to give back: 我把书还给他了.\n!还 is hái when it means \"still, also\" and huán when it means \"to return something\".\n>我的铅笔找不到了，可以【跟|把|被|为】你借一下吗？=I can't find my pencil; may I borrow yours?\n>这本书是别人借【给|跟|还|把】我的，下周要还。=This book was lent to me by someone else; I have to return it next week.\n~你什么时候把自行车【还给|借跟|还把|给还】我？=When are you going to give my bicycle back?\n##38\n@关于 · 看来 · 听说|About; it seems; I hear|关于 + topic，… · 关于 + topic + 的 + noun · 看来，… · 在 + person + 看来 · 听说 + news\n关于 introduces the topic and opens the sentence or modifies a noun: 关于这个问题，我们明天再谈; 一个关于动物的节目. 看来 draws a conclusion from what one sees: 看来他不来了. 在我看来 = in my view. 听说 passes on news heard from others.\n!关于 cannot follow the subject: 我关于这件事不知道 ✗ → 关于这件事，我不知道.\n>我昨天看了一个【关于|为了|根据的|除了】中国文化的节目。=Yesterday I watched a programme about Chinese culture.\n>已经九点了，【看来|听见|关注|表演】他今天不会来了。=It's already nine; it looks as if he isn't coming today.\n~我【听说|看来|关于|认得】你喜欢音乐，这个周末有一个晚会。=I hear you like music; there's a party this weekend.\n##39\n@Verb + 起来 · 上|Starting up|verb/adjective + 起来 · verb + 上\n起来 after a verb or adjective shows that an action or state begins and goes on: 大家聊起来了 (everyone started chatting), 她笑起来, 天气热起来了. With an object, 来 goes last: 聊起天来. 上 can show the beginning of a lasting state: 爱上、喜欢上、关注上.\n!开始 + verb is neutral; verb + 起来 adds the feeling that the action really gets going.\n>两个老同学一见面就聊【起来|出来|下去|上去】了。=The two old classmates started chatting the moment they met.\n>听了他的话，大家都笑【起来|出去|过来|下来】了。=Hearing what he said, everyone burst out laughing.\n~他最近喜欢【上|起|出|下】了网球，每个周末都去打。=He has taken to tennis recently and plays every weekend.\n##40\n@Verb + 下去 · 下来|Carrying on; staying|verb + 下去 (continue from now) · verb + 下来 (settle, keep)\n下去 after a verb means the action continues into the future: 坚持下去 (keep it up), 说下去, 学下去. 下来 can mean that something comes to rest or is kept: 停下来、留下来、记下来.\n!下去 looks forward from now; 下来 looks at something that has come down to a stable state.\n>虽然很累，但是他还是坚持跑了【下去|下来了|起来|出来】。=Although he was very tired, he still kept on running.\n>比赛结束后，很多人留了【下来|下去|上来|出去】，想跟运动员照相。=After the match many people stayed behind, hoping for a photo with the athletes.\n~这个比赛很有意思，请你说【下去|下来了|上去|过来】。=This match is very interesting; please go on.\n##41\n@看起来 · 看上去|It looks…|S + 看起来/看上去 + description\nBoth give an impression based on appearance: 他看起来很年轻 (he looks young), 这个箱子看上去很重. They do not claim that the impression is true.\n!看来 (lesson 38) draws a conclusion about a situation; 看起来 and 看上去 describe how someone or something looks.\n>你今天【看起来|看来了|看见|看出来】很累，昨天没睡好吗？=You look tired today. Didn't you sleep well last night?\n>这个蛋糕看【上去|下去|过去|进去】很好吃，我们选这个吧。=This cake looks delicious; let's choose this one.\n~他看起来【不到|没到了|不去|到不】三十岁，其实已经四十了。=He looks under thirty, but in fact he's already forty.\n##42\n@不怎么样 · 一般来说|Not up to much; generally speaking|S + 不怎么样 · 一般来说，…\n不怎么样 is a polite-sounding but clear way to say something is not good: 这个电影不怎么样. 不怎么 + adjective/verb = not very: 不怎么难、不怎么喜欢. 一般来说 opens a general statement: 一般来说，南方比北方热.\n!不怎么样 is already negative. 怎么样 by itself asks \"how is it?\".\n>这首歌不【怎么样|怎样的|什么样|那么样的】，有点儿难听。=This song isn't up to much; it sounds a bit unpleasant.\n>【一般来说|一样来说|一边来说|一直来说】，孩子长得像爸爸妈妈。=Generally speaking, children look like their parents.\n~今天的菜我不【怎么|什么|怎样的|那样】喜欢，太甜了。=I don't much like today's dishes; they're too sweet.\n","kw":"##1 New neighbours come to visit\nA:王叔叔、王阿姨，欢迎你们来我们家做客！=Uncle Wang, Auntie Wang, welcome to our home!\nB:谢谢。我们是上个月搬来的，就住在你们楼上。=Thank you. We moved in last month; we live just above you.\nA:我听我爱人说了。你们夫妻两个人住吗？=My husband told me. Is it just the two of you?\nB:对，孩子们都在外地工作。=Yes, our children all work in other parts of the country.\nA:以后咱们是邻居了，有什么事就来找我们。=We're neighbours from now on; if you need anything, just come to us.\nB:你们太热情了！=You're so kind!\n?王叔叔住在哪儿？|女的家楼上|女的家楼下|外地\n##2 Who does she look like?\nA:这是你妹妹的照片吗？她长得真可爱！=Is this a photo of your younger sister? She's really cute!\nB:是啊。大家都说她长得像我妈妈。=Yes. Everyone says she looks like my mum.\nA:她的头发很长，脸小小的。她多高？=Her hair is long and her face is small. How tall is she?\nB:她的身高跟我一样，一米七。=She's the same height as me: one metre seventy.\nA:你们一样高？可是她看起来比你瘦多了。=You're the same height? But she looks much thinner than you.\nB:她年轻嘛！我以前也不胖。=Well, she's young! I wasn't fat before either.\n?妹妹长得像谁？|妈妈|爸爸|哥哥\n##3 Which flat is better?\nA:这两个房子你更喜欢哪个？=Which of these two flats do you like better?\nB:第一个比较大，但是离公司特别远。=The first is fairly big, but it's especially far from the office.\nA:第二个呢？=And the second?\nB:第二个小一点儿，可是附近挺安全的，离地铁站也更近。=The second is a bit smaller, but the area is quite safe and it's closer to the metro too.\nA:两个房子的钱差不多吗？=Do the two cost about the same?\nB:差不多。现在房子越来越贵了，好像每个月都在变。=About the same. Flats are getting dearer and dearer; it seems to change every month.\n?第二个房子怎么样？|比较小，离地铁站近|比较大，离公司远|很便宜\n##4 At the doctor's\nA:医生，我感冒了，头疼得很，还有点儿发烧。=Doctor, I've caught a cold; my head hurts badly and I have a slight fever.\nB:我检查一下。张开嘴，说“啊”。=Let me examine you. Open your mouth and say \"ah\".\nA:我的耳朵也不舒服，腿和脚都没有力气。=My ears are uncomfortable too, and my legs and feet have no strength.\nB:问题不大，不用住院。吃三天药，多喝水。=Nothing serious; no need to stay in hospital. Take the medicine for three days and drink plenty of water.\nA:太好了。我明天可以上班吗？=Great. Can I go to work tomorrow?\nB:最好在家休息两天，身体健康最重要。=You'd better rest at home for two days; your health matters most.\n?医生让女的怎么做？|在家休息，吃药|马上住院|明天去上班\n##5 You must rest\nA:你怎么还在工作？医生说你必须休息。=Why are you still working? The doctor said you must rest.\nB:我知道，可是这个工作今天一定得做完。=I know, but this job absolutely has to be finished today.\nA:不行，你应该先睡觉。需要我帮忙吗？=No, you should sleep first. Do you need my help?\nB:不用，再有半个小时就好了。=No need; another half an hour and it'll be done.\nA:那我给你做点儿吃的吧。已经八点了，该吃晚饭了。=Then I'll make you something to eat. It's already eight; time for dinner.\nB:行，谢谢你。吃了饭我一定休息。=OK, thank you. I'll definitely rest after eating.\n?男的为什么还不休息？|工作今天必须做完|他不累|他不同意医生的话\n##6 Why is she crying?\nA:你妹妹怎么哭了？=Why is your younger sister crying?\nB:她的小狗不见了，她心里很难过。=Her little dog has disappeared, and she's very upset.\nA:别着急，我们一起去找找。=Don't worry, let's go and look for it together.\nB:我已经找了一个小时了，一点儿也不知道它去哪儿了。=I've been looking for an hour already and have no idea at all where it went.\nA:你看，那不是它吗？在那个孩子旁边！=Look, isn't that it? Next to that child!\nB:太好了！妹妹，别哭了，不用担心了！=Wonderful! Sis, stop crying; no need to worry any more!\n?妹妹为什么哭？|她的小狗不见了|她害怕小狗|哥哥生气了\n##7 What are you interested in?\nA:你对什么感兴趣？=What are you interested in?\nB:我对中国历史特别感兴趣，你呢？=I'm especially interested in Chinese history. And you?\nA:我喜爱画画儿。我以为你只喜欢运动呢。=I love drawing. I thought you only liked sport.\nB:其实我的兴趣很多。我爸爸认为多学一点儿东西很有用。=Actually I have lots of interests. My dad believes it's useful to learn a bit of everything.\nA:你爸爸对你的成绩满意吗？=Is your dad satisfied with your marks?\nB:很满意。他说我比他小时候聪明多了。=Very. He says I'm much cleverer than he was as a child.\n?女的以为男的喜欢什么？|只喜欢运动|只喜欢历史|喜欢画画儿\n##8 If it rains\nA:明天我们去爬山吧。=Let's go hiking tomorrow.\nB:如果明天下雨的话，怎么办？=What if it rains tomorrow?\nA:只要不下大雨，我们就去。=As long as it doesn't rain hard, we'll go.\nB:可是我只有一双运动鞋，昨天洗了，还没干。=But I have only one pair of trainers; I washed them yesterday and they're not dry yet.\nA:那只能穿别的鞋了。=Then you'll just have to wear other shoes.\nB:好吧。不过只有天气好，我才想去。=All right. But I only want to go if the weather is good.\n?男的为什么不太想去？|他的运动鞋还没干|他不喜欢爬山|他明天要上班\n##9 A healthy routine\nA:你平时几点起床？=What time do you usually get up?\nB:六点。我起了床就去锻炼，然后洗澡、刷牙、吃早饭。=Six. As soon as I'm up I go and exercise, then I shower, brush my teeth and have breakfast.\nA:你的生活习惯真好！我周末常常睡到十点。=Your habits are really good! At weekends I often sleep until ten.\nB:睡那么长时间，你不饿吗？=Sleeping that long, don't you get hungry?\nA:饿啊！所以我一起床就吃很多东西，吃得很饱。=I do! So as soon as I get up I eat a lot, until I'm completely full.\nB:这样对身体不好。=That's not good for your health.\n?男的起床后先做什么？|锻炼|洗澡|吃早饭\n##10 Something sweet\nA:今天是你的生日，我给你买了一个蛋糕！=It's your birthday today; I've bought you a cake!\nB:谢谢！这个蛋糕又大又漂亮。=Thank you! This cake is both big and pretty.\nA:你尝尝，里面有香蕉，很甜。=Have a taste; there's banana inside, and it's very sweet.\nB:真好吃！不但很甜，而且很新鲜。=Delicious! Not only sweet but also very fresh.\nA:冰箱里还有冰激凌和西瓜呢。=There's ice cream and watermelon in the fridge as well.\nB:太多了，我吃不了这么多糖！=That's too much; I can't eat this much sugar!\n?蛋糕里面有什么？|香蕉|西瓜|冰激凌\n##11 Ordering dinner\nA:服务员，请给我们菜单。=Waiter, the menu, please.\nB:好的。两位想喝点儿什么？有啤酒、饮料和矿泉水。=Certainly. What would you two like to drink? We have beer, soft drinks and mineral water.\nA:来一瓶啤酒，要冰的。再来两碗米饭。=A bottle of beer, chilled. And two bowls of rice.\nB:好。筷子和盘子都在桌子上，需要勺子吗？=Fine. The chopsticks and plates are on the table. Do you need spoons?\nA:要两把勺子。今天我请客，你多吃一点儿。=Two spoons, please. It's my treat today, so eat up.\nB:对不起，我是服务员…… 您的朋友还没到。=Sorry, I'm the waiter… Your friend hasn't arrived yet.\n?女的要了什么？|一瓶啤酒和两碗米饭|两瓶矿泉水|一盘饺子\n##12 Before and after\nA:你以前在哪儿工作？=Where did you work before?\nB:我以前在上海工作，后来搬到了北京。=I used to work in Shanghai; later I moved to Beijing.\nA:你是什么时候来的？=When did you come?\nB:去年刚来的。最近工作很忙，昨天晚上十点才下班。=I only came last year. Work has been busy lately; I didn't finish until ten last night.\nA:那你先休息一下，然后我们再去吃饭。=Then have a rest first, and after that we'll go and eat.\nB:好，我马上就好。=OK, I'll be ready right away.\n?男的昨天几点下班？|晚上十点|下午五点|晚上八点\n##13 Trying on clothes\nA:你看，这条裙子怎么样？=Look, how's this skirt?\nB:颜色不错，可是好像有点儿短。你穿得上吗？=The colour's nice, but it seems a bit short. Can you get into it?\nA:穿得上，很合适。那件蓝衬衫你喜欢吗？=I can, and it fits well. Do you like that blue shirt?\nB:喜欢，可是我的旧衬衫还能穿。我想买一双鞋。=I do, but my old shirt is still wearable. I'd like to buy a pair of shoes.\nA:那双黄色的运动鞋很好看。=Those yellow trainers look good.\nB:太小了，我一定穿不上。=Too small; I definitely couldn't get them on.\n?女的觉得裙子怎么样？|很合适|有点儿短|太小了\n##14 At the checkout\nA:这些香蕉怎么卖？=How much are these bananas?\nB:三块五一斤。你要多少？=Three yuan fifty a jin. How many would you like?\nA:来三四斤吧。再要一公斤苹果。=Three or four jin, please. And a kilogram of apples.\nB:好，一共大概三十块。你用银行卡还是用手机？=Fine, about thirty yuan altogether. Bank card or phone?\nA:我没带卡，用手机吧。这双鞋的大小不合适，可以换吗？=I haven't got my card; phone, please. These shoes are the wrong size; can I change them?\nB:可以，你先试试这双大一点儿的。=Yes; try this slightly bigger pair first.\n?女的怎么付钱？|用手机|用银行卡|用信用卡\n##15 Everything has changed\nA:好久不见！你的变化真大，我差点儿没认出来。=   if(!ln){openModal(`<h3>End of the dialogue</h3><p>Swap roles, then hide the text and retell the whole conversation.</p><div class="row"><button class="btn" data-act="role" data-l="${RP.L}" data-r="${other}">Now play ${other}</button></div>`);return}
  const mine=ln.s===RP.r,head=`<h3>You are ${RP.r}</h3><p class="mute">Line ${RP.i+1} of ${k.lines.length}</p>`;
  openModal(head+(mine?`<p><b>Your turn.</b> Say this in Chinese:</p><p class="lead">${esc(ln.en)}</p><p class="zh gxl" id="rpa" hidden>${esc(ln.zh)}</p>
    <div class="row"><button class="btn line" data-act="rpshow">Show and play the line</button><button class="btn" data-act="rpnext">Next line</button></div>`
   :`<p>${ln.s} says:</p><p class="zh gxl">${esc(ln.zh)}</p><p class="mute">${esc(ln.en)}</p><div class="row">${sayBtn(ln.zh)}<button class="btn" data-act="rpnext">Next line</button></div>`));
  if(!mine)speak([{t:ln.zh,v:VOI[ln.s]}]);
}
const RDN=C.rdn;
function day(n){
  n=Math.max(1,Math.min(TOTAL,n));const d=D(n),x=P().done[n]||{},dt=dayDate(n);
  const qb=(s,label)=>`<div class="row"><button class="btn${x[s]!=null?' line':''}" data-act="quiz" data-n="${n}" data-sec="${s}">${label}</button>${x[s]!=null?`<span class="mute">Last score: ${x[s]}%</span>`:''}</div>`;
  let h=`<p class="crumb"><a href="#/plan">Plan</a> / Week ${d.w}</p><h1>Day ${n}: ${esc(dayLabel(d))} ${seal(isDone(n))}</h1><p class="mute">${DOW[dt.getDay()]}, ${fmtY(dt)}${d.type==='lesson'?`. Lesson ${d.L} of ${NL}, ${(C.dur||['about 2 hours; split it into two sittings if you can','about 2 hours 15 minutes; split it into two sittings if you can'])[d.read?1:0]}.`:''}</p>`;
  if(d.type==='lesson'){
    if(n>1)h+=`<section class="sec"><h2>Review ${seal(x.r!=null,'sm')}</h2><p>12 items from the lessons you studied 1, 2, 4, 7, 14 and 30 days ago, plus items from your error notebook.</p>${qb('r','Start the review')}</section>`;
    h+=`<section class="sec"><h2>Grammar ${seal(x.g!=null,'sm')}</h2>${d.gram.map(g=>`<article class="gcard"><h3>${esc(g.t)}</h3><p class="gm">${esc(g.m)}</p><p class="gs zh">${esc(g.s)}</p><p>${esc(g.ex)}</p>${g.tip?`<p class="tip">${esc(g.tip)}</p>`:''}
      <ul class="gx">${g.x.filter(e=>!e.fresh).map(e=>`<li>${sayBtn(exText(e))}<div><span class="zh">${exFull(e,1)}</span><span class="en">${esc(e.en)}</span></div></li>`).join('')}</ul></article>`).join('')}${qb('g','Practise the grammar')}</section>`;
    h+=`<section class="sec"><h2>Vocabulary: ${esc(d.theme)} ${seal(x.v!=null,'sm')}</h2><p class="mute">${d.vocab.length} new Level ${C.lv} words. ${C.vtxt||`The first ${d.core} belong to today's theme; below the red line are general-purpose verbs, adjectives, abstract nouns and function words.`}</p><label class="chk"><input type="checkbox" data-act="hide"> Hide pinyin and meaning to test yourself (tap a row to reveal it)</label>
      <ul class="vlist">${d.vocab.map((w,i)=>`<li data-act="reveal"${i===d.core?' class="cut"':''}>${sayBtn(w.w)}<span class="zh">${w.w}</span><span class="py">${w.p}</span><span class="vm">${esc(w.m)}</span></li>`).join('')}</ul>${qb('v','Practise the words')}</section>`;
    if(d.chars.length)h+=C.compact?`<section class="sec"><h2>New characters ${seal(x.k!=null,'sm')}</h2><p class="mute">${C.chtxt}</p><div class="kgridv big">${d.chars.map(c=>`<button data-act="kopen" data-k="${c}">${c}<small>${hp(HZ[c])}</small></button>`).join('')}</div>`:`<section class="sec"><h2>Characters to write by hand ${seal(x.k!=null,'sm')}</h2><p class="mute">${C.hwtxt||`The new syllabus asks you to handwrite 150 new characters at Level ${C.lv}.`} These ${d.chars.length} are today's.</p>${d.chars.map(c=>kCard(HZ[c])).join('')}${qb('k','Practise the characters')}</section>`;
    if(d.kw)h+=dialog(d,x,qb);
    if(d.read)h+=`<section class="sec"><h2>Reading ${seal(x.d!=null,'sm')}</h2><p>${C.rdtxt||`Today's task is ${RDN[d.read.type]}. Read the questions first, work without a dictionary, and aim to finish in ${d.read.type==='a'?4:5} minutes: the exam gives you one minute per item.`}</p>${qb('d','Start the reading task')}</section>`;
    h+=`<section class="sec"><h2>Daily quiz ${seal(x.q!=null,'sm')}</h2><p>A mix of today's words, characters and grammar, one dictation, and ${freshOf([d.L]).length} grammar item${freshOf([d.L]).length===1?'':'s'} built on sentences you have not seen, to check that you know the pattern and not just the example.</p>${qb('q','Take the daily quiz')}</section>`;
  }else if(d.type==='review'){
    const p=wPrompt(d);
    h+=`<section class="sec"><h2>Weekly test, week ${d.w} ${seal(x.q!=null,'sm')}</h2><p>${C.wktxt||"About 35 items from this week's six lessons: words, characters, grammar with unseen sentences, two recordings played once, two dictations and one reading task. 60% is a pass."}</p>
    <ul class="outl">${[6,5,4,3,2,1].map(i=>{const e=D(n-i);return `<li><a href="#/day/${n-i}">Day ${n-i}</a><span>${esc(dayLabel(e))} <span class="zh">${e.chars.join(' ')}</span></span></li>`}).join('')}</ul>${qb('q','Take the weekly test')}</section>`;
    if(p)h+=`<section class="sec"><h2>Writing task ${seal(x.w!=null,'sm')}</h2><p>${C.wk[d.w%2?0:1]} Afterwards compare with the model answer${AI?', or ask Claude to mark it':''}.</p>${qb('w','Start the writing task')}</section>`;
  }else if(d.type==='write'){
    h+=`<section class="sec"><h2>${WRT[d.no-1]}</h2>${C.ws[d.no-1]}${qb('w','Start writing')}</section>`;
  }else if(d.type==='speak'){
    h+=`<section class="sec"><h2>Speaking mock ${d.no}</h2><p>${C.spk}</p>${qb('s','Start the speaking mock')}</section>`;
  }else if(d.type==='mock'||d.type==='remix'){
    const no=d.type==='mock'?d.no:0,r=(P().exams||{})[no];
    h+=`<section class="sec"><h2>${exName(no)}</h2><p>${no?C.mock:'The same format, with items mixed from both mock papers. Use it to check that the mistakes from last time are gone.'}</p>
    ${r?`<p class="mute">Last result: ${r.tot}/${r.max||300} on ${fmtY(pd(r.d))}.</p>`:''}<div class="row"><button class="btn" data-act="exam" data-no="${no}" data-n="${n}">Start ${exName(no).toLowerCase()}</button></div></section>`;
  }else{
    h+=`<section class="sec"><h2>${dayLabel(d)}</h2><p>${d.type==='err'?'First go back through the items you missed in yesterday\'s mock exam. Then this drill takes up to 20 items from your error notebook and adds a mixed set from the whole course.':d.type==='rest'?'A short mixed set to stay warm. Then check your admission ticket, ID, pencils and the route to the test centre, and stop early.':'About 40 items drawn from all ${NL} lessons, with two recordings played once, two dictations and a reading task.'}</p>${qb('q','Start')}
    <div class="row"><a class="btn line" href="#/wrong">Open the error notebook</a><a class="btn line" href="#/prac">Practise one skill</a></div></section>`;
  }
  return h+`<nav class="pn">${n>1?`<a href="#/day/${n-1}">Day ${n-1}</a>`:'<span></span>'}${n<TOTAL?`<a href="#/day/${n+1}">Day ${n+1}</a>`:''}</nav>`;
}
function pracV(){
  const p=P();
  return `<h1>Practise one skill</h1><p class="lead">Extra practice on top of the daily lesson. Pick a skill, then choose the range, the question type, the number of items and how answers are shown before you start. Every round has the number you asked for. Your last choices are remembered.</p>
  <div class="cards">${PR.map(([m,t,s])=>`<button class="pcard" data-act="prac" data-m="${m}"><b>${t}</b><span>${(PM[m]&&PM[m].desc)||s}</span></button>`).join('')}
  <a class="pcard" href="#/wrong"><b>Error notebook</b><span>${Object.keys(p.wrong).length} items you got wrong, drilled until they are gone.</span></a></div>`;
}

  const ex=P().exams||{},card=(i,t,s)=>`<button class="pcard" data-act="exam" data-no="${i}"><b>${t}</b><span>${ex[i]?`${ex[i].tot}/${ex[i].max||300} on ${fmtY(pd(ex[i].d))}`:s}</span></button>`;

  <div class="cards">${[...Array(NM)].map((_,i)=>card(i+1,'Mock exam '+(i+1),'Not taken yet')).join('')}${NM>1?card(0,'Remix exam','Items mixed from both papers. Take it last.'):''}
  ${[1,2].map(i=>`<button class="pcard" data-act="spk" data-no="${i}"><b>Speaking mock ${i}</b><span>${C.spkCard||'Five tasks with timers, self-marked.'}</span></button>`).join('')}</div>`;
}

  <div class="kgridv">${ORD.map(c=>`<button class="${P().wrong['k:'+c]?'w':''}" data-act="kopen" data-k="${c}" title="${HZ[c].p}: ${esc(HZ[c].m)}">${c}</button>`).join('')}</div>

}
function wrongV(){
  const ks=Object.keys(P().wrong);
  const row=k=>{if(k[0]==='k'){const x=HZ[k.slice(2)];return x&&`<b class="zh">${x.c}</b><span>${x.p}: ${esc(x.m)}</span>`}
    if(k[0]==='w'){const x=W[k];return x&&`<b class="zh">${x.w}</b><span>${x.p}: ${esc(x.m)}</span>`}
    const e=GEX[k];return e&&`<b class="zh">${esc(e.g.t)}</b><span class="zh">${exFull(e,1)}</span>`};
  return `<h1>Error notebook</h1><p class="lead">Words, characters and grammar items you answered wrongly are kept here. An item leaves once you have got it right as many times as you got it wrong.</p>
  ${ks.length?`<div class="row"><button class="btn" data-act="wquiz">Drill ${Math.min(20,ks.length)} items</button></div><ul class="outl">${ks.map(k=>{const r=row(k);return r?`<li>${r}<small>missed ${P().wrong[k]}×</small></li>`:''}).join('')}</ul>`:'<p class="note">The notebook is empty. Do any day\'s exercises and the items you miss will appear here.</p>'}`;
}

let lastHash=null;
function render(keep){
  const app=$('#app');
  if(!P()){app.innerHTML=onboard();return}
  const p=P();if(p.theme)document.documentElement.dataset.theme=p.theme;else delete document.documentElement.dataset.theme;
  document.body.classList.toggle('nopy',p.py===false&&!C.pyOff);
  const [r,a]=(location.hash.slice(2)||'').split('/'),y=scrollY;
  const v=r==='plan'?plan():r==='day'?day(+a||todayN()):r==='prac'?pracV():r==='exam'?examV():r==='chars'?charsV():r==='wrong'?wrongV():r==='set'?setV():home();
  app.innerHTML=`<nav class="nav"><a class="brand" href="#/"><span class="zh">${C.zh}</span>${C.title}</a>${NAV.map(([h,t,g])=>`<a href="#/${h}" class="${(r||'')===h||(h==='plan'&&r==='day')||(h==='prac'&&r==='wrong')?'on':''}"><span class="zh">${g}</span>${t}</a>`).join('')}</nav>
  <main>${LS.ok||CLOUD?'':'<p class="note">This browser is blocking storage here, so progress will be lost when the page closes.</p>'}${v}</main>`;
  scrollTo(0,keep&&lastHash===location.hash?y:0);lastHash=location.hash;
}

/* ================= Events ================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,p=P(),z=QZ,q=z&&z.qs&&z.qs[z.i];
  if(a==='create'){const s=$('#o-start').value;if(!s){toast('Choose your first study day.');return}newProfile($('#o-name').value.trim()||'Learner',s,$('#o-exam').value);location.hash='#/';render()}
  else if(a==='back'){DB.cur=Object.keys(DB.profiles)[0];render()}
  else if(a==='say'){e.stopPropagation();say(t.dataset.t)}
   else if(a==='ttstest')speak([{t:'你好，欢迎参加中文水平考试。',v:'f'},{t:'听力考试现在开始，请大家注意。',v:'m'}]);
   else if(a==='ahelp')audioHelp();
  else if(a==='anim')animate(t.closest('.kcard').querySelector('.mz svg'));
  else if(a==='kopen'){openModal(kCard(HZ[t.dataset.k]));animate($('#modal .mz svg'))}
  else if(a==='pad')openPad(t.dataset.k);
  else if(a==='padclr'){const c=$('#modal canvas');c.getContext('2d').clearRect(0,0,c.width,c.height)}
  else if(a==='close'){stopAudio();closeModal()}
  else if(a==='reveal')t.classList.toggle('show');
  else if(a==='kwall')speak(KW[t.dataset.l].lines.map(l=>({t:l.zh,v:VOI[l.s]})));
  else if(a==='kwshow')t.closest('.sec').querySelector('.kwl').classList.toggle('veil');
  else if(a==='role'){RP={L:+t.dataset.l,r:t.dataset.r,i:0};roleStep()}
  else if(a==='rpshow'){$('#rpa').hidden=false;const ln=KW[RP.L].lines[RP.i];speak([{t:ln.zh,v:VOI[ln.s]}])}
  else if(a==='rpnext'){RP.i++;roleStep()}
  else if(a==='quiz'){const n=+t.dataset.n,s=t.dataset.sec,d=D(n);startQuiz(`Day ${n}: ${d.type==='lesson'||secs(d).length>1?SECN[s]:dayLabel(d)}`,buildSec(n,s),{done:pct=>markDone(n,s,pct)})}
  else if(a==='exam'){const n=+t.dataset.n;startExam(+t.dataset.no,n?pct=>markDone(n,'q',pct):null)}
  else if(a==='exgo'){const ex=EXS,pt=ex.parts[ex.i];startQuiz(`${exName(ex.no)} · ${pt.title}`,pt.qs,{exam:true,limit:pt.min*60,chain:zz=>{zz.title=pt.title;ex.done.push(zz);QZ=null;if(++ex.i<ex.parts.length)examIntro();else examResult()}})}
  else if(a==='spk')startQuiz('Speaking mock '+t.dataset.no,speakSet(+t.dataset.no));
  else if(a==='prac')openSetup(t.dataset.m);
  else if(a==='pgo')startPrac();
  else if(a==='wquiz')startQuiz('Error notebook drill',shuf(Object.keys(p.wrong)).slice(0,20).map(qFromKey));
  else if(a==='qplay')playQ();
  else if(a==='pick'){if(z.shown)return;(z.ans[z.i]=z.ans[z.i]||[])[+t.dataset.j]=+t.dataset.i;if(q.subs.length===1)grade();else drawQ()}
  else if(a==='mcheck')grade();
  else if(a==='dchip'){$('#din').value+=t.dataset.t}
  else if(a==='dclr')$('#din').value='';
  else if(a==='dcheck'){const v=$('#din').value;answer(v,dictOk(q,v))}
  else if(a==='czadd'){const st=z.ans[z.i],b=q.sol.findIndex((_,j)=>st.f[j]==null);if(b<0)return;const i=+t.dataset.i;st.f[b]=q.bank[i];st.u[b]=i;drawQ()}
  else if(a==='czrm'){const st=z.ans[z.i],b=+t.dataset.b;st.f[b]=null;st.u[b]=null;drawQ()}
  else if(a==='czcheck'){const st=z.ans[z.i];z.res[z.i]=q.sol.every((s,j)=>st.f[j]===s);if(z.opt.late)nextQ();else{z.shown=true;drawQ()}}
  else if(a==='opick'){z.ans[z.i].push(+t.dataset.x);drawQ()}
  else if(a==='oundo'){z.ans[z.i].pop();drawQ()}
  else if(a==='ocheck'){const s=z.ans[z.i],c=s.filter((x,k)=>q.sh[x]===k).length;answer(s,c===q.paras.length?true:c)}
  else if(a==='wdone'){keep();if(z.opt.exam)nextQ();else{z.shown=true;drawQ()}}
  else if(a==='aimark'){t.disabled=true;if(EXR){const i=+t.dataset.i;aiMark(EXR.wq[i],EXR.wt[i],$('#aiout'+i),(s,txt)=>{EXR.fb[i]=txt;if(s!=null){EXR.ws[i]=s;drawExamResult()}})}else aiMark(q,z.ans[z.i]||'',$('#aiout'))}
  else if(a==='tm'){let s=+t.dataset.s;clearInterval(tmI);t.disabled=true;t.textContent=clock(s)+' left';tmI=setInterval(()=>{s--;t.textContent=s>0?clock(s)+' left':'Time is up';if(s<=0)clearInterval(tmI)},1000)}
  else if(a==='flip'){clearInterval(tmI);z.flip=true;drawQ();if(q.say)say(q.say)}
  else if(a==='fyes'||a==='fno'){z.res[z.i]=a==='fyes';nextQ()}
  else if(a==='qnext')nextQ();
  else if(a==='qclose'){if((EXS||(z&&!z.fin&&z.res&&z.res.length))&&!confirm('Leave this exercise? The result will not be saved.'))return;clearInterval(tmI);closeQuiz()}
  else if(a==='saveset'){const s=$('#s-start').value;if(!s){toast('Choose your first study day.');return}p.name=$('#s-name').value.trim()||p.name;p.start=s;p.exam=$('#s-exam').value;save();render();toast('Changes saved.')}
  else if(a==='ttstest')speak([{t:'你好，欢迎参加中文水平考试。',v:'f'},{t:'听力考试现在开始，请大家注意。',v:'m'}]);
  else if(a==='switch'){DB.cur=t.dataset.id;save();render();toast('Profile switched.')}
  else if(a==='addp'){DB.cur=null;render()}
  else if(a==='export'){const j=JSON.stringify(DB);if(DL)DL.save({filename:C.doc+'-backup.json',data:j}).then(()=>toast('Backup downloaded.')).catch(()=>toast('The backup was not saved.'));
    else{const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));l.download=C.doc+'-backup.json';l.click()}}
  else if(a==='reset'){if(confirm('Erase all progress and the error notebook for this profile?')){p.done={};p.wrong={};p.act={};p.exams={};save();render();toast('Progress erased.')}}
  else if(a==='delp'){if(confirm(`Delete the profile “${p.name}”?`)){delete DB.profiles[p.id];DB.cur=Object.keys(DB.profiles)[0];save();render()}}
});
document.addEventListener('change',e=>{
  const t=e.target,a=t.dataset.act;
  if(t.dataset.ps){setPS(t);return}
  if(a==='hide')t.closest('.sec').querySelector('.vlist').classList.toggle('hidden',t.checked);
  else if(a==='py'){P().py=t.checked;save();render(true)}
  else if(a==='theme'){P().theme=t.value;save();render(true)}
  else if(a==='rate'){P().rate=+t.value;save()}
  else if(a==='scope'){P().scope=t.value;save()}
  else if(a==='wscore'&&EXR){EXR.ws[+t.dataset.i]=+t.value;drawExamResult()}
  else if(t.id==='imp'&&t.files[0]){const f=new FileReader();f.onload=()=>{try{const d=JSON.parse(f.result);if(!d.profiles||!Object.keys(d.profiles).length)throw 0;DB=d;if(!P())DB.cur=Object.keys(DB.profiles)[0];save();render();toast('Progress restored.')}catch(x){toast('That file is not a backup from this plan.')}};f.readAsText(t.files[0])}
});
document.addEventListener('input',e=>{if(e.target.id==='wtx'){const c=$('#wcnt'),q=QZ.qs[QZ.i],n=zlen(e.target.value);c.textContent=n;c.classList.toggle('low',n<q.min)}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#modal').classList.contains('on')){stopAudio();closeModal()}return}
  const z=QZ;if(!z||z.fin||!z.qs)return;const q=z.qs[z.i],k=q.kind||'mc';
  if(k==='mc'&&q.subs.length===1&&/^[1-4]$/.test(e.key)&&!z.shown){z.ans[z.i]=[+e.key-1];grade()}
  else if(e.key==='Enter'&&e.target.id!=='wtx'){if(z.shown&&k!=='write'){e.preventDefault();nextQ()}else if(k==='dict'){e.preventDefault();const v=$('#din').value;answer(v,dictOk(q,v))}}
});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'){stopAudio();closeModal()}});
addEventListener('hashchange',()=>render());
if(!P()&&Object.keys(DB.profiles).length)DB.cur=Object.keys(DB.profiles)[0];
render();

</script>
</body>
</html>
