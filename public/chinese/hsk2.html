<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HSK 2 in 6 weeks</title>
<meta name="description" content="A 6-week plan for the new HSK 2 (HSK 3.0): the 200 new words with pinyin, the Level 2 grammar, the 100 handwriting characters with stroke order, listening, reading, the new writing section and two full mock exams.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F2F4F3;--card:#FFFFFF;--ink:#17202A;--mute:#5B6770;--line:#D5DBDD;--grid:#E0A9A2;--ai:#1D4E6B;--ai-soft:#E2EDF2;--shu:#C0272D;--shu-soft:#FAE6E4;--hl:#FBEFB4;--ok:#2F7A55;--ok-soft:#E1F2E8;
 --zh:"Noto Serif SC","Songti SC","SimSun","STSong",serif;--ui:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--hd:"Source Serif 4","Noto Serif SC",Georgia,serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#12171B;--card:#1A2127;--ink:#E6EBEE;--mute:#97A4AD;--line:#2B363E;--grid:#6B3F3C;--ai:#8FC1DC;--ai-soft:#1B3140;--shu:#F0736B;--shu-soft:#3B2120;--hl:#564C14;--ok:#62C596;--ok-soft:#17352A}}
:root[data-theme="dark"]{--paper:#12171B;--card:#1A2127;--ink:#E6EBEE;--mute:#97A4AD;--line:#2B363E;--grid:#6B3F3C;--ai:#8FC1DC;--ai-soft:#1B3140;--shu:#F0736B;--shu-soft:#3B2120;--hl:#564C14;--ok:#62C596;--ok-soft:#17352A}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.55 var(--ui);-webkit-text-size-adjust:100%}
.zh{font-family:var(--zh);font-weight:500}
.py{color:var(--mute);font-size:.92em}
.nopy .vlist .py{display:none}
a{color:var(--ai)}
h1{font:600 1.9rem/1.2 var(--hd);margin:.2em 0 .35em}
h2{font:600 1.25rem/1.3 var(--hd);margin:0 0 .6em;display:flex;align-items:center;gap:.5em;flex-wrap:wrap}
h3{font-size:1.08rem;margin:0 0 .25em}
p{margin:.4em 0 .8em;max-width:70ch}
.mute{color:var(--mute);font-size:.94rem}.lead{font-size:1.08rem}
mark{background:var(--hl);color:inherit;padding:0 .15em;border-radius:3px}
:focus-visible{outline:3px solid var(--ai);outline-offset:2px}
#app{display:grid;grid-template-columns:214px minmax(0,1fr);min-height:100%}
.nav{position:sticky;top:0;align-self:start;height:100vh;padding:20px 12px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;background:var(--card)}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:600}
.nav a .zh{width:28px;height:28px;display:grid;place-items:center;border:1.5px solid var(--grid);border-radius:3px;font-size:1rem}
.nav a.on{background:var(--ai-soft);color:var(--ai)}.nav a.on .zh{border-color:var(--ai)}
.nav .brand{margin-bottom:14px;flex-direction:column;align-items:flex-start;gap:0;line-height:1.3;font-family:var(--hd)}
.nav .brand .zh{border:0;width:auto;height:auto;font-size:1.45rem;font-weight:700;color:var(--shu)}
main{padding:28px clamp(16px,4vw,48px) 96px;max-width:920px;width:100%}
.onb{max-width:480px;margin:0 auto;padding:7vh 20px;grid-column:1/-1}
.onb label,.form label{display:block;font-weight:600;margin:14px 0}
input:not([type=checkbox]),select,textarea{display:block;width:100%;margin-top:4px;padding:10px 12px;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:8px}
textarea{font-family:var(--zh);font-size:1.15rem;line-height:1.9;min-height:210px;resize:vertical}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0 16px}
.mz-row{display:flex;margin-bottom:18px}.mz-row span{width:66px;height:66px;display:grid;place-items:center;border:1.5px solid var(--grid);margin-right:-1.5px;font:700 2.2rem var(--zh);color:var(--shu);background:linear-gradient(var(--grid),var(--grid)) 50% 0/1px 100% no-repeat,linear-gradient(var(--grid),var(--grid)) 0 50%/100% 1px no-repeat,var(--card)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border:1.5px solid var(--ai);border-radius:8px;background:var(--ai);color:var(--card);font:600 1rem var(--ui);text-decoration:none;cursor:pointer}
.btn.line{background:transparent;color:var(--ai)}.btn.sm{padding:6px 12px;font-size:.9rem}.btn.wide{width:100%;margin-top:10px}
.btn.danger{background:transparent;border-color:var(--shu);color:var(--shu)}.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0}
.note{background:var(--shu-soft);border-left:4px solid var(--shu);padding:10px 14px;border-radius:0 8px 8px 0;max-width:none}
.tip{background:var(--hl);padding:8px 12px;border-radius:8px;font-size:.96rem;max-width:none}
.tip::before{content:"Watch out: ";font-weight:700}.tip.mem::before{content:"Memory hook: "}
.sec{margin:34px 0;padding-top:22px;border-top:1.5px solid var(--line)}
.crumb{font-size:.9rem;color:var(--mute);margin:0}
.hero{display:flex;gap:28px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.hero>div:last-child{flex:1;min-width:260px}.hero-k{display:flex}.hero-k .mz{width:clamp(84px,17vw,124px);margin-right:-1.5px;cursor:pointer;padding:0}
.mz{aspect-ratio:1;border:1.5px solid var(--grid);background:var(--card);position:relative;display:block}
.mz.txt{display:grid;place-items:center;font:700 clamp(3rem,10vw,4.4rem) var(--zh);color:var(--shu)}
.hsvg{display:block;width:100%;height:100%}
.hsvg path{fill:var(--ink)}.hsvg path.hgrid{fill:none;stroke:var(--grid);stroke-width:5;stroke-dasharray:22 20}
.hsvg path.hi{fill:var(--shu)}.hsvg path.ghost{fill:var(--line)}
.hsvg path.hm{fill:none;stroke:var(--ink);stroke-width:150;stroke-linecap:round;stroke-linejoin:round}
.hsvg text{font:700 58px var(--ui);fill:var(--shu)}
.hsvg.st .hgrid{display:none}
.seal{display:inline-grid;place-items:center;width:2em;height:2em;border:2px solid var(--shu);border-radius:5px;color:var(--shu);font:700 .95rem var(--zh);transform:rotate(-8deg);flex:none}
.seal.sm{font-size:.75rem}.seal.big{width:5.4rem;height:5.4rem;font-size:1.6rem;border-width:3px;margin:10px auto;border-radius:8px}
.seal.fail{border-color:var(--mute);color:var(--mute)}
.todo,.outl,.vlist,.gx,.kw{list-style:none;padding:0;margin:10px 0}
.todo li,.outl li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:9px 2px;border-bottom:1px dashed var(--line)}
.todo li.done a{color:var(--mute);text-decoration:line-through}.todo span{color:var(--mute);font-size:.92rem}
.outl li>span{flex:1;color:var(--mute)}.outl li>b{min-width:8em}.outl small{color:var(--shu)}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));flex:1}
.cell{aspect-ratio:1;border:1.5px solid var(--grid);margin:0 -1.5px -1.5px 0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:3px;text-decoration:none;color:var(--ink);background:var(--card);position:relative;min-width:0}
.cell small{font-size:.64rem;color:var(--mute);line-height:1.2}.cell b{font:500 clamp(1rem,3.4vw,1.55rem)/1 var(--zh);opacity:.88}
.cell.nl b{color:var(--ai)}
.cell.today{outline:3px solid var(--ai);outline-offset:-3px;z-index:1}
.cell .seal{position:absolute;inset:0;margin:auto;width:66%;height:66%;font-size:clamp(.8rem,2.6vw,1.2rem);background:color-mix(in srgb,var(--card) 72%,transparent)}
.wk{display:flex;align-items:center;gap:10px;margin-bottom:1.5px}.wkl{width:78px;flex:none;font-weight:600;font-size:.88rem}.wkl small{display:block;font-weight:400;color:var(--mute);font-size:.72rem}
.pbar{display:grid;grid-template-columns:74px 1fr 62px;gap:10px;align-items:center;margin:6px 0;font-size:.92rem}
.pbar div,.qbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.pbar i,.qbar i{display:block;height:100%;background:var(--ok)}
.gcard{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:16px 18px;margin:14px 0}
.gcard h3{font:700 1.3rem var(--zh);color:var(--ai)}.gm{font-weight:600;margin:0 0 8px}
.gs{background:var(--ai-soft);padding:8px 12px;border-radius:8px;max-width:none}
.gx li,.vlist li,.kw li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px dashed var(--line)}
.gx .zh,.pass{font-size:1.18rem;line-height:1.9}.gx .en{display:block;color:var(--mute);font-size:.95rem}
.say{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:transparent;color:var(--ai);display:grid;place-items:center;cursor:pointer;margin-top:3px}
.vlist li{cursor:pointer;align-items:baseline;flex-wrap:wrap;gap:4px 12px}.vlist .say{align-self:center;margin:0}
.vlist .zh{font-size:1.22rem;min-width:4.6em}.vlist .py{min-width:7em}.vlist .vm{flex:1 1 12em}
.vlist.hidden li:not(.show) .vm,.vlist.hidden li:not(.show) .py{filter:blur(6px)}
.vlist li.cut{border-top:2px solid var(--grid)}
.kw .zh{min-width:4.5em;font-size:1.12rem}
.chk{display:flex;gap:8px;align-items:center;margin:10px 0;font-size:.97rem}
.kcard{display:grid;grid-template-columns:200px minmax(0,1fr);gap:14px 22px;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:16px;margin:14px 0}
.kcard .hv{color:var(--shu);font-size:1.3rem;margin-right:.3em}
.steps{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px}.steps svg{width:52px;height:52px;border:1px solid var(--line);background:var(--card)}
.kgridv{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr))}
.kgridv button{aspect-ratio:1;border:1.5px solid var(--grid);margin:0 -1.5px -1.5px 0;background:var(--card);color:var(--ink);font:500 1.5rem var(--zh);cursor:pointer;padding:0}
.kgridv button.w{background:var(--shu-soft)}.kgridv button:hover{background:var(--ai-soft)}
.pn{display:flex;justify-content:space-between;margin-top:40px}
#modal,#quiz{position:fixed;inset:0;z-index:50;display:none;overflow:auto}
#modal.on{display:grid;place-items:center;background:rgba(10,18,28,.55);padding:16px}
.sheet{background:var(--paper);border-radius:12px;padding:22px;width:min(680px,100%);max-height:92vh;overflow:auto;position:relative}
.sheet .kcard{border:0;padding:0;background:transparent;margin:0}
.x{position:absolute;top:8px;right:10px;width:36px;height:36px;border:0;background:transparent;font-size:1.6rem;color:var(--mute);cursor:pointer;z-index:2}
.pad{position:relative;width:min(320px,80vw);margin:10px auto}.pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
#quiz.on{display:block;background:var(--paper)}
.qwrap{max-width:720px;margin:0 auto;padding:16px 18px 90px}
.qhead{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:6px 0 10px}.qhead .x{position:static}.qhead b{flex:1}
.qtag{display:inline-block;margin:18px 0 6px;font-size:.84rem;font-weight:600;color:var(--ai);background:var(--ai-soft);padding:2px 10px;border-radius:99px}
.qtext{font-size:1.05rem}.qs{font-size:1.4rem;line-height:1.9;margin:10px 0}.qs.huge,.qs .huge{font-size:4rem;line-height:1.3}
.pass{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:14px 16px;margin:10px 0 12px;white-space:pre-line}
.bl{display:inline-block;min-width:2.6em;border-bottom:2px solid var(--ink);text-align:center;color:var(--shu);margin:0 2px;font-family:var(--ui);font-weight:700}
.opts{display:grid;gap:10px;margin:12px 0 18px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:500 1.1rem/1.7 var(--zh);cursor:pointer}
.opt.lat{font:400 1.02rem/1.5 var(--ui)}
.opt .on{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:600 .8rem var(--ui);flex:none}
.opt:not(:disabled):hover{border-color:var(--ai)}
.opt.sel{border-color:var(--ai);background:var(--ai-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.no{border-color:var(--shu);background:var(--shu-soft)}
.subq{margin-top:16px;font-weight:600}
.fb{padding:12px 16px;border-radius:10px;margin:8px 0}.fb.good{background:var(--ok-soft)}.fb.bad{background:var(--shu-soft)}.fb p{margin:.3em 0;max-width:none}
.fb.good b{color:var(--ok)}.fb.bad b{color:var(--shu)}
.result{text-align:center;padding:10px 0 20px}.result p{margin-inline:auto}
.rev{border-top:1px dashed var(--line);padding:10px 0}.rev .qs{font-size:1.15rem}.rev .huge{font-size:2.2rem}.rev .pass{font-size:1rem}
span.ok{color:var(--ok)}span.no{color:var(--shu)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:99;font-size:.94rem;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
.guide{padding-left:1.3em;max-width:72ch}.guide li{margin:.45em 0}
.kwl .spk{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ai-soft);color:var(--ai);display:grid;place-items:center;font-size:.85rem;margin-top:5px}
.kwl.veil div{filter:blur(7px);user-select:none}
.gxl{font-size:1.3rem;line-height:1.9}
.chipsb{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chip{padding:5px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:500 1.1rem/1.8 var(--zh);cursor:pointer}
.chip:disabled{opacity:.35;cursor:default}.chip:not(:disabled):hover{border-color:var(--ai)}
.nw{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0}.nw span{font-size:.88rem;background:var(--ai-soft);border-radius:6px;padding:1px 8px}
#din{font:500 1.2rem var(--zh);padding:12px 14px;margin-top:12px}
.czb{font:inherit;background:var(--ai-soft);border:0;border-bottom:2px solid var(--ai);border-radius:4px 4px 0 0;color:var(--ai);cursor:pointer;padding:0 8px;min-width:3em}
.czb.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}.czb.no{background:var(--shu-soft);border-color:var(--shu);color:var(--shu)}
.bl.cur{background:var(--hl)}
.flash{background:var(--card);border:1.5px solid var(--grid);border-radius:10px;padding:24px 18px;text-align:center;margin:14px 0;min-height:170px}
.flash .huge{font-size:4.6rem;line-height:1.2}.flash p{margin-inline:auto}.flash .pass{text-align:left}
.fback{border-top:1px dashed var(--line);margin-top:16px;padding-top:14px}
.tb{width:100%;border-collapse:collapse;margin:14px 0;font-size:.95rem;text-align:left}
.tb th,.tb td{border:1px solid var(--line);padding:7px 10px;vertical-align:top}.tb th{background:var(--ai-soft)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin:18px 0}
.pcard{display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px 16px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;text-decoration:none;cursor:pointer}
.pcard:hover{border-color:var(--ai)}.pcard b{color:var(--ai)}.pcard span{color:var(--mute);font-size:.92rem}
.panels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.panels.p3{grid-template-columns:repeat(3,1fr)}
.panel{border:1.5px solid var(--line);border-radius:8px;background:var(--card);padding:8px 4px;text-align:center;position:relative}
.panel i{font-style:normal;font-size:clamp(1.5rem,5vw,2.3rem);line-height:1.5;display:block}
.panel small{display:block;color:var(--mute);font-size:.78rem;line-height:1.3;padding:0 4px}.panel b{position:absolute;top:2px;left:7px;font-size:.78rem;color:var(--shu)}
.panels.hide small{display:none}
.ord{display:grid;gap:8px;margin:12px 0}
.ordp{display:flex;gap:10px;text-align:left;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:500 1.05rem/1.8 var(--zh);cursor:pointer}
.ordp b{font:700 .95rem var(--ui);color:var(--ai);flex:none;width:1.4em}.ordp:disabled{opacity:.45}
.ordp.ok{border-color:var(--ok);background:var(--ok-soft);opacity:1}.ordp.no{border-color:var(--shu);background:var(--shu-soft);opacity:1}
.seq{font-weight:700;letter-spacing:.08em;color:var(--ai)}
.cnt{font-weight:700}.cnt.low{color:var(--shu)}
.ai{border:1.5px solid var(--ai);border-radius:10px;padding:12px 16px;margin:12px 0;background:var(--card);white-space:pre-wrap}
@media (max-width:820px){
 #app{display:block}
 .nav{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;justify-content:space-around;padding:6px 2px calc(6px + env(safe-area-inset-bottom,0px));border:0;border-top:1px solid var(--line);z-index:20}
 .nav .brand{display:none}.nav a{flex-direction:column;gap:2px;font-size:.66rem;padding:4px 2px}.nav a .zh{width:26px;height:26px}
 main{padding-top:18px}h1{font-size:1.5rem}
 .kcard{grid-template-columns:1fr}.kfig{max-width:220px}
 .wk{flex-direction:column;align-items:stretch;gap:2px;margin-bottom:10px}.wkl{width:auto}.wkl small{display:inline;margin-left:8px}
 .outl li{flex-wrap:wrap}.tb{font-size:.84rem}.panels{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
ruby{ruby-position:over}ruby{margin:0 .1em}rt{font:400 .58em/1.2 var(--ui);color:var(--mute);letter-spacing:0;user-select:none}
.rb{line-height:2.3}.opt .rb,.chip .rb,.czb .rb{line-height:2}
.opts.pics{grid-template-columns:repeat(3,1fr)}
.opt.pic{flex-direction:column;justify-content:center;font-size:2.6rem;line-height:1.3;padding:10px 4px;gap:4px}
.kgridv.big{grid-template-columns:repeat(auto-fill,minmax(76px,1fr));margin:12px 0}
.kgridv.big button{aspect-ratio:auto;padding:10px 0 6px;font-size:2rem;display:flex;flex-direction:column;align-items:center;gap:2px}
.kgridv.big small{font:400 .8rem var(--ui);color:var(--mute)}

#homebtn{position:fixed;top:env(safe-area-inset-top,10px);left:14px;z-index:999;background:var(--card);border:1px solid var(--line);color:var(--ink);font:600 13px/1 var(--ui);padding:9px 12px;border-radius:999px;text-decoration:none;box-shadow:0 2px 8px rgba(27,40,54,.12)}#homebtn:hover{opacity:.85}
.pset>label{display:block;font-weight:600;margin:14px 0}
.pset>label.chk{display:flex;font-weight:400}
.picks{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:-6px 0 14px}
.pick{display:inline-flex;align-items:center;gap:6px;margin:0;padding:3px 12px 3px 8px;border:1.5px solid var(--line);border-radius:99px;background:var(--card);font-size:.9rem;font-weight:500;cursor:pointer}
.pick:has(input:checked){border-color:var(--ai);background:var(--ai-soft);color:var(--ai)}
.pick input{margin:0}
</style>
</head>
<body>
<a href="index.html" id="homebtn" aria-label="Back to level selection">‹ HSK</a>
<div id="app"></div>
<div id="modal"></div>
<div id="quiz" role="dialog" aria-label="Exercise"></div>

8 320,660 575,710 706,729 744,729 779,714 799,687 726,596","334,550 383,544 580,584 640,580","471,503 438,502 341,410 278,372 224,351","414,434 431,434 463,413 504,376 529,341 554,282 563,241 565,144 549,56 539,30 516,-2 492,-1 386,45","431,410 436,373 405,339 317,272 239,235","508,333 496,278 412,197 306,122 189,70","666,498 686,463 616,390 562,345","558,339 589,300 674,220 755,158 816,121 849,114 975,114"],"w":[["大家","dàjiā","everyone"],["家人","jiārén","family members"]]}},"HL":[["一","八","儿"],["二","几","九"],["了","七","人","十"],["大","个","工"],["口","么","三"],["上","习","下","小"],["也","子","女"],["比","不","分"],["今","六","日","少"],["什","书","天"],["为","文","五"],["午","以","月","长"],["中","半","边"],["打","对","汉"],["叫","可","们","去"],["生","四","他"],["写","百","地"],["多","过","好","后"],["会","妈","吗"],["名","那","年"],["岁","她","同","有"],["在","字","还"],["间","男","来"],["两","没","你","时"],["我","这","作"],["爸","的","国"],["和","姐","现","学"],["茶","点","很"],["是","说","要"],["语","爱","哥","家"]],"g":"##1\n@姓 · 位 · 名|Surnames; polite counting of people|您贵姓？ · 我姓王 · 这位 + noun · number + 名 + noun\n姓 is a verb: 我姓王 (my surname is Wang). The polite question is 您贵姓？ and the answer is 我姓…, never 我贵姓. 位 is the respectful measure word for people: 这位是李老师, 两位先生. 名 counts people by role or job: 一名学生, 三名医生.\n!叫 takes the full name or the given name (我叫王月); 姓 takes only the surname (我姓王).\n>您好，您贵【姓|叫|名|位】？=Hello, what is your surname?\n>我来介绍一下，这【位|名|口|本】是我们的汉语老师。=Let me introduce you: this is our Chinese teacher.\n~我们班有二十【名|条|口|本】学生。=There are twenty students in our class.\n##2\n@Verb reduplication|Doing something briefly or casually|AA · A一A · A了A · ABAB\nDoubling a verb makes the action short, light or tentative: 看看 (have a look), 打打球 (play a bit of ball). One-syllable verbs can insert 一 (看一看) or, for the past, 了 (看了看). Two-syllable verbs repeat as a whole: 介绍介绍, 休息休息.\n!A verb with its object doubles only the verb: 打打球, not 打球打球.\n>星期天我喜欢打【打|一|了|的】篮球，看看书。=On Sundays I like to play a bit of basketball and do some reading.\n>这是我朋友，我给你们介绍【介绍|一介绍|介介|绍绍】。=This is my friend; let me introduce you.\n~你听【一|的|也|个】听，这个歌很好听。=Have a listen; this song is lovely.\n##3\n@跟……一起 · verb-object words|Doing things together|A + 跟 + B + 一起 + verb · 游泳、跑步、跳舞\n跟 means \"with\" (and also \"and\"): 我跟朋友一起游泳. 一起 (together) stands before the verb. 游泳, 跑步 and 跳舞 are verb + object inside one word, so a length of time or a number goes in the middle: 游一个小时泳, 跳一会儿舞.\n!These words cannot take another object: 我游泳了一个小时 is avoided; say 我游了一个小时。\n>我每天早上跟爸爸【一起|一些|一点儿|一下】跑步。=I go running with my dad every morning.\n>你想【跟|比|从|往】我们一起去游泳吗？=Would you like to go swimming with us?\n~她喜欢跳【舞|泳|步|画】，也喜欢画画儿。=She likes dancing, and she likes drawing too.\n##4\n@每……都…… · 次 · 经常、有时|Every; how many times; often, sometimes|每 + (measure word) + noun + 都 + verb · verb + number + 次 · S + 经常/有时 + verb\n每 (every) usually pairs with 都: 我每天都上网. 次 counts occasions and follows the verb: 我去过一次, 每周两次. 经常 = often, 有时(候) = sometimes; both stand before the verb.\n!每天, 每年, 每周 need no measure word; other nouns do: 每个人, 每本书.\n>我【每|都|次|经常的】天都喝一杯牛奶。=I drink a glass of milk every day.\n>他每周打两【次|个|天|周】篮球。=He plays basketball twice a week.\n~我【经常|每|一次|都有】上网买东西。=I often shop online.\n##5\n@The 的 phrase|\"The red one\", \"mine\"|adjective/noun/pronoun + 的 (no noun after it)\nWhen the noun is clear from the context, drop it and keep 的: 红色的 (the red one), 我的 (mine), 新的 (the new one), 大的 (the big one). 条 is the measure word for long, flexible things: 一条裤子, 一条鱼, 一条路.\n!的 cannot be dropped here: 我要红色 means \"I want the colour red\"; 我要红色的 means \"I want the red one\".\n>这条黑色的裤子是我【的|了|吗|条】。=These black trousers are mine.\n>我不喜欢白色的，我要绿色【的|条|件|个】。=I don't like the white one; I want the green one.\n~这【条|位|本|口】裤子多少钱？=How much are these trousers?\n##6\n@还是|\"Or\" in questions; \"had better\"|A + 还是 + B？ · 还是 + verb … 吧\nIn a question that offers a choice, \"or\" is 还是: 你喝茶还是喝咖啡？ Do not add 吗. Answer with one of the choices. 还是…吧 gives the choice you finally prefer after thinking: 还是喝茶吧 (let's have tea after all).\n!还是 asks. In a statement \"or\" is a different word, taught at Level 3.\n>你喝红茶【还是|和|也|都】绿茶？=Will you have black tea or green tea?\n>今天我们吃鱼还是吃【肉|茶|水|咖啡】？=Shall we have fish or meat today?\n~咖啡太贵了，我们【还是|也是|都是|就是】喝奶茶吧。=Coffee is too expensive; let's have milk tea instead.\n##7\n@Approximate numbers|\"Seventy-odd\", \"a dozen or so\"|number + 多 + measure word · 十几 + measure word · 几十 + measure word\n多 after a round number means \"and more\": 七十多岁 (seventy-odd years old), 二十多个人, 一百多块. 几 can stand for an unknown digit: 十几个 (between 11 and 19), 几十个 (several dozen).\n!多 comes before the measure word after tens and hundreds: 三十多个, not 三十个多.\n>我爷爷今年七十【多|几|很|太】岁了。=My grandfather is over seventy this year.\n>他们班有三十【多|都|些|大】个孩子。=There are thirty-odd children in their class.\n~教室里有十【几|多少|什么|每】个女孩儿。=There are a dozen or so girls in the classroom.\n##8\n@比|Comparison|A + 比 + B + adjective (+ difference)\nA 比 B + adjective: 哥哥比我高 (my brother is taller than me). The amount of difference comes after the adjective: 高一点儿, 大三岁. Do not put 很 or 非常 before the adjective.\n!Not 他比我很高. For \"much taller\" use 高得多 or 高多了 (later levels); at this level say 高一点儿 or give a number.\n>我哥哥【比|跟|离|从】我高。=My older brother is taller than me.\n>姐姐的手比我的【大|很大|非常大|太大】。=My older sister's hands are bigger than mine.\n~他比我大三【岁|个|次|条】。=He is three years older than me.\n##9\n@Subject + (subject + predicate) · 最|\"As for me, my head hurts\"; the most|topic + part/aspect + adjective · 最 + adjective/verb\nChinese often names the person first and then says something about a part or aspect of them: 我头疼 (literally \"I, head hurts\"), 他身体很好, 她个子很高. 最 makes a superlative: 最好, 最喜欢.\n!There is no 的 and no 有: 我头疼, not 我有头疼.\n>我今天【头|的头有|有头|头是】疼，不想吃东西。=I have a headache today and don't feel like eating.\n>爷爷身体【很好|是好|有好|好的】，每天都去跑步。=Grandpa is in good health; he goes running every day.\n~这个药店的药【最|比|太多|每】便宜。=This pharmacy's medicine is the cheapest.\n##10\n@Exclamations · adjective reduplication|\"How…!\"; vivid description|真/太/好 + adjective + 啊 · AA + 的\n啊 at the end of a sentence adds feeling: 真有意思啊！ 好 before an adjective means \"so\" in exclamations: 好漂亮！ Doubling a one-syllable adjective and adding 的 paints a vivid, friendly picture: 高高的个子, 大大的眼睛.\n!A doubled adjective already expresses degree, so it takes no 很: 很高高的 ✗.\n>这个电影真有意思【啊|吗|呢|的】！=This film is really interesting!\n>她有一双大大【的|地|得|了】眼睛。=She has big, big eyes.\n~你看，他笑得【好|比|每|从】快乐啊！=Look, how happily he is laughing!\n##11\n@Verb phrase + 的 + noun|\"The teacher who teaches us\"|(subject +) verb (+ object) + 的 + noun\nEverything that describes a noun comes before it, linked by 的, including whole verb phrases: 教我们汉语的老师 (the teacher who teaches us Chinese), 我买的书 (the book I bought), 昨天考的题 (the questions tested yesterday). Chinese has no word like \"who\" or \"which\".\n!Find the last 的 before the noun: what stands before it is the description.\n>教我们汉语【的|得|地|了】老师姓王。=The teacher who teaches us Chinese is called Wang.\n>这是我昨天买的【本子|买|很好|教】。=This is the notebook I bought yesterday.\n~今天考【的|了|过|着】题不多。=There were not many questions in today's test.\n##12\n@Result complements|Verb + outcome|verb + 完/懂/错/好/会 · 没 + verb + result\nA second word right after the verb tells the result: 写完 (finish writing), 听懂 (understand by listening), 写错 (write wrongly), 做好 (do properly, get ready), 学会 (learn and master). The negative uses 没: 我没听懂. The object follows the whole pair: 我做完题了.\n!Nothing can come between the verb and its result: 听懂了, not 听了懂.\n>老师说的话，我都听【懂|完了|错|忘】了。=I understood everything the teacher said.\n>对不起，这个词我写【错|懂|好|会】了。=Sorry, I wrote this word wrongly.\n~今天的题你做【完|懂|忘|对不】了吗？=Have you finished today's exercises?\n##13\n@—面|Position words with 面|noun + (的) + 前面/后面/上面/下面/里面/外面/旁边 · place + 有/是 + noun\n前面, 后面, 上面, 下面, 里面, 外面 and 旁边 are nouns of position. They follow the reference point: 学校(的)前面 (in front of the school). With 有 you say what exists there: 桌子上面有一本书; with 是 you identify what occupies the place: 学校旁边是一个药店.\n!The reference point comes first: \"behind the door\" = 门后面.\n>教室【里面|外面的|旁边在|前面是在】有很多学生。=There are many students inside the classroom.\n>我家【旁边|里面|上面|下面】是一个大商店。=Next to my home is a big shop.\n~你的本子在书包【里面|旁边的|外面在|上边是】。=Your notebook is inside the schoolbag.\n##14\n@离 · 左、右|Distance; left and right|A + 离 + B + 远/近 · 在 + 左边/右边\n离 measures the distance between two places or times: 我家离学校很近 (my home is close to the school). 从 marks a starting point; 离 only states how far apart. 左边 and 右边 behave like the other position words: 医院在商店的右边.\n!Say A 离 B 远, not A 从 B 远.\n>我家【离|从|往|比】学校不远。=My home is not far from the school.\n>药店在饭店的左【边|近|远|离】。=The pharmacy is to the left of the restaurant.\n~机场离这儿很【远|右|左|旁边】，我们坐车去吧。=The airport is far from here; let's go by car.\n##15\n@从……到…… · 往|From… to…; towards|从 + A + 到 + B · 往 + direction + verb\n从 marks the starting point in space or time, 到 the end point: 从我家到学校, 从八点到十点. 往 gives the direction of movement: 往前走 (go straight on), 往左走.\n!The 从/往 phrase stands before the verb: 往右走, not 走往右.\n>【从|离|往|比】我家到学校走路要十分钟。=It takes ten minutes to walk from my home to the school.\n>你【往|从|离|跟】前走，书店就在路的右边。=Go straight ahead; the bookshop is on the right of the road.\n~我们从上午九点【到|往|离|在】十二点上课。=We have class from nine to twelve in the morning.\n##16\n@是……的|Emphasising when, where or how|S + 是 + time/place/manner + verb + 的\nFor an action already known to have happened, 是…的 highlights a detail of it: when, where, how or with whom: 你是怎么来的？ 我是坐地铁来的. 是 may be dropped, 的 may not. Negative: 不是…的.\n!Do not use 了 in this pattern. 我坐地铁来了 reports the event; 我是坐地铁来的 stresses how.\n>你是怎么来【的|了|过|着】？=How did you get here?\n>我【是|在|有|也】昨天下午到的。=I arrived yesterday afternoon.\n~他不是坐公交车来的，是打车【来的|来了|去|来过】。=He didn't come by bus; he came by taxi.\n##17\n@Verb + 来 / 去|Direction relative to the speaker|verb + 来 (towards me) · verb + 去 (away from me)\n来 and 去 after a verb of movement show its direction from where the speaker is: 进来 (come in: I am inside), 进去 (go in: I am outside), 出来, 出去, 过来. A place word goes between the verb and 来/去: 进教室来, 回家去.\n!Choose by the speaker's position, not by the mover's.\n>我在房间里。外面很冷，你快进【来|去|过|出】吧。=I'm in the room. It's cold outside; come in quickly.\n>老师不在教室里，他出【去|来|进|过】了。=The teacher isn't in the classroom; he has gone out.\n~我在这儿，你【过|比|离|往】来吧。=I'm over here; come over.\n##18\n@Compound direction complements|\"Walk back\", \"run up\"|verb + 上/下/进/出/回/过 + 来/去\nTwo direction words can follow another verb: the first gives the path, 来/去 the direction from the speaker: 走回来 (walk back here), 跑上去 (run up there), 拿下来 (take down), 走过来 (walk over here).\n!The path word and 来/去 keep their order: 走回来, never 走来回.\n>他从楼上跑【下来|下去来|来下|去下】了。=He ran down from upstairs (towards me).\n>车站不远，我们走【回去|去回|回了|来去】吧。=The station isn't far; let's walk back.\n~那个孩子走【过来|来过|过了|去来】，问我几点了。=The child walked over and asked me what time it was.\n##19\n@过|Experience: \"have (ever) done\"|S + verb + 过 (+ object) · S + 没(有) + verb + 过\n过 (guo, neutral tone) after a verb says that something has happened at least once in one's life: 我去过北京 (I have been to Beijing). The negative is 没…过: 我没去过. Ask with 吗 or 没有: 你去过上海吗？\n!了 reports one completed event; 过 reports experience. 我去了北京 = I went (this time); 我去过北京 = I have been there.\n>你去【过|了|着|的】外国吗？=Have you ever been abroad?\n>我没吃【过|了|完|着】这个菜。=I have never eaten this dish.\n~这个酒店我住过两【次|个|条|位】。=I have stayed at this hotel twice.\n##20\n@Topic first|\"The door is open\", \"the clothes are washed\"|thing + (已经) + verb + result/了\nThe thing affected can open the sentence as its topic, with no word for \"by\" and no passive marker: 门开了 (the door is open), 衣服洗了 (the clothes have been washed), 饭做好了 (the meal is ready).\n!It looks like a passive in English but is an ordinary Chinese sentence: topic first, then what happened to it.\n>用 unknown; use: 衣服都洗【好|去|来|进】了，你休息吧。=The clothes are all washed; have a rest.\n>门打【开|起|过|洗】了，我们进去吧。=The door is open; let's go in.\n~饭做好了，你快起【来|去|开|过】吃吧。=The meal is ready; get up and eat.\n##21\n@给|\"For\", \"to\"; giving|给 + person + verb · verb + 给 + person + thing\nBefore a verb, 给 + person means \"for\" or \"to\": 我给妈妈买了一个包 (I bought a bag for Mum), 给他打电话. After verbs such as 送 and 拿, 给 introduces the receiver: 送给他一个手表 (give him a watch as a present).\n!The person comes right after 给: 送给妈妈一个包.\n>我想【给|比|离|往】爸爸买一个手表。=I want to buy a watch for Dad.\n>这个书包是奶奶送【给|在|到|过】我的。=This schoolbag was a present from Grandma to me.\n~买这个包花了我三百【块|次|位|条】钱。=Buying this bag cost me three hundred yuan.\n##22\n@Duration after the verb|\"Wait ten minutes\", \"sit a while\"|verb + (了) + length of time (+ object)\nHow long an action lasts is said after the verb: 等十分钟, 坐一会儿, 学了两年. With an object, the duration goes between verb and object: 等了一会儿公交车; or repeat the verb: 等车等了一会儿.\n!When something happens comes before the verb; how long comes after it: 我昨天等了一个小时.\n>请您在这儿等一【会儿|起|下去|点钟】，我去拿菜。=Please wait here a moment; I'll go and fetch the dishes.\n>我们在饭馆坐了两个【小时|点|号|次】。=We sat in the restaurant for two hours.\n~我学了一年【汉语|很好|中国|说】。=I have studied Chinese for a year.\n##23\n@要/快要/就要……了 · 已经……了|About to happen; already|S + 要/快要/就要 + verb + 了 · S + 已经 + verb + 了\n要…了, 快要…了 and 就要…了 all say that something will happen very soon: 快要下雨了 (it's about to rain), 我们就要考试了. With an exact time word, only 就要 works: 明天就要开学了. 已经…了 = already: 他已经走了.\n!明天快要开学了 ✗: use 就要 after a time word.\n>快【要|就|已经|正】下雨了，我们回家吧。=It's about to rain; let's go home.\n>他【已经|快要|正|准备】到机场了，现在在等我们。=He has already reached the airport and is waiting for us now.\n~下周我们【就要|快要|已经|正在】开始考试了。=Our exams begin next week.\n##24\n@Verb + 着|A state that continues|verb + 着 (+ object) · place + verb + 着 + noun\n着 (zhe) after a verb shows a state that lasts: 门开着 (the door is open), 他穿着一件白衣服 (he is wearing white). Place + verb + 着 + noun describes what is found somewhere: 门口站着一个人 (someone is standing at the door).\n!在/正在 shows an action in progress (他在穿衣服 = he is getting dressed); 着 shows the resulting state (他穿着白衣服 = he has white clothes on).\n>教室的门开【着|过|完|得】，里面没有人。=The classroom door is open, but nobody is inside.\n>她今天穿【着|了着|在|地】一条红色的裤子。=She is wearing red trousers today.\n~门口站【着|过去|起来|出来】两个男孩儿。=Two boys are standing at the door.\n##25\n@Verb + 得 + adjective · 地|How well, how fast|verb + 得 + (很) + adjective · adjective + 地 + verb\n得 links a verb to a comment on how it is done: 他跑得很快 (he runs fast), 你说得不错. With an object, repeat the verb or put the object first: 他说汉语说得很好 / 他汉语说得很好. Negative: 跑得不快. 地 turns a describing word into an adverbial before the verb: 慢慢地走.\n!Three particles, all read de: 的 before nouns, 得 after verbs, 地 before verbs.\n>他跑【得|的|地|着】非常快。=He runs extremely fast.\n>你汉语说得这么【好|很好|不错的|好地】，学了多长时间了？=You speak Chinese so well; how long have you been learning?\n~孩子慢慢【地|得|的|过】走过来了。=The child slowly walked over.\n##26\n@因为……所以…… · 虽然……但是……|Cause and result; concession|因为 + cause，所以 + result · 虽然 + fact，但是 + contrast\nChinese likes both halves of the pair: 因为下雨，所以我没去 (because it rained, I didn't go). Either half can be used alone. 虽然…但是… = although…, (but)…: 虽然很累，但是很快乐. 但 is a shorter 但是.\n!English forbids \"although… but…\"; Chinese wants both words.\n>【因为|所以|虽然|但是】今天下雨，所以我们没去踢足球。=Because it rained today, we didn't go to play football.\n>虽然这个包很贵，【但是|所以|因为|还是】我很喜欢。=Although this bag is expensive, I like it a lot.\n~你【为什么|怎么样|什么|多少】不吃肉？=Why don't you eat meat?\n##27\n@让/叫/请 + person + verb · 别|Getting someone to do something; don't|S + 让/叫/请 + person + verb · 别 + verb\n让 = to let or to ask someone to do something: 老师让我们多说汉语. 叫 is more of an order; 请 invites: 我请你喝咖啡. The person is the object of the first verb and the doer of the second. 别 + verb = don't: 别说话, 别忘了.\n!Negate the first verb: 妈妈不让我去.\n>妈妈【让|给|比|跟】我早一点儿回家。=Mum told me to come home a bit earlier.\n>【别|没|不是|不要的】忘了告诉他明天的事情。=Don't forget to tell him about tomorrow.\n~不好意思，你能帮我一个【忙|帮|次|位】吗？=Excuse me, could you do me a favour?\n##28\n@一……就…… · 自己|As soon as; oneself|S + 一 + verb 1，就 + verb 2 · 自己 + verb\n一…就… links two events that follow at once, or a condition and its regular result: 我一到家就给你打电话 (I'll phone you as soon as I get home), 他一上课就想睡觉. 自己 stresses \"by oneself, one's own\": 我自己做饭, 自己的事情.\n!一 and 就 stand after the subject and directly before the verbs.\n>我一下课【就|一|也|都】去找你。=I'll come and find you as soon as class is over.\n>他从小就【自己|一起|经常|可能】洗衣服。=He has washed his own clothes since he was little.\n~小时候，我【一|就|都|也】过年就很快乐。=When I was little, I was happy whenever New Year came.\n##29\n@A 没有 B（这么/那么）+ adjective · 跟|\"Not as… as\"; with|A + 没有 + B + (这么/那么) + adjective · 跟 + person + verb\nThe negative of a 比 comparison is 没有: 我没有哥哥高 (I am not as tall as my brother). 这么 or 那么 may be added: 今天没有昨天那么冷. 跟 + person introduces the partner of an action: 跟他说, 跟老师学.\n!不比 exists but means something else; for \"not as… as\" use 没有.\n>这个本子【没有|不有|没比|不跟】那个好。=This notebook is not as good as that one.\n>今天没有昨天【那么|那个|这些|怎么】热。=Today is not as hot as yesterday.\n~这个问题你可以【跟|比|离|往】老师说一下。=You can mention this problem to the teacher.\n##30\n@就 · 还|\"Right away\", \"exactly\", \"only\"; \"still\"|就 + verb · 就 + 是/在 · 还 + verb/没\n就 has several uses: soon, right away (我就来 = I'm coming right now); precisely (这就是我家 = this is my home); only (我就有一个 = I have just one); and \"then\" after a condition. 还 before a verb can mean \"still\": 他还在睡觉, 我还没吃饭.\n!还没…呢 = not yet. 就 and 还 always stand after the subject.\n>你等一下，我【就|比|最|每】来。=Wait a moment, I'm coming right away.\n>已经十点了，他【还|就|正|已经】没起床。=It's already ten o'clock, and he still hasn't got up.\n~你别找了，这【就|还|也|一起】是你的本子。=Stop looking; this is your notebook right here.\n","kw":"##1 A new classmate\nA:您好！请问，您贵姓？=Hello! May I ask your surname?\nB:我姓李，叫李明。你呢？=My surname is Li; my name is Li Ming. And you?\nA:我姓王，叫王月。你也是这个班的学生吗？=I'm Wang, Wang Yue. Are you a student in this class too?\nB:对。我们班有二十名学生。=Yes. There are twenty students in our class.\nA:我来介绍一下，这位是我们的张老师。=Let me introduce you: this is our teacher, Ms Zhang.\nB:张老师好！=Hello, Ms Zhang!\n?王月介绍的那位是谁？|张老师|李明的同学|王月的朋友\n##2 What are your hobbies?\nA:李明，你有什么爱好？=Li Ming, what are your hobbies?\nB:我喜欢运动，最爱打篮球。你呢？=I like sport; I love basketball most. And you?\nA:我不会打篮球。我喜欢看看书、听听歌。=I can't play basketball. I like reading a bit and listening to songs.\nB:你喜欢看球吗？星期六有足球…… 我们去看看？=Do you like watching ball games? There's football on Saturday… Shall we go and have a look?\nA:好啊！你会踢足球吗？=Sure! Can you play football?\nB:会一点儿，踢得不好。=A little, but I don't play well.\n?男的最喜欢什么运动？|打篮球|踢足球|看书\n##3 Let's go swimming\nA:明天你想做什么？=What do you want to do tomorrow?\nB:我想去游泳。你跟我一起去吧。=I want to go swimming. Come with me.\nA:我不会游泳。我们一起去跑步，怎么样？=I can't swim. How about going running together?\nB:跑步太累了。你不是喜欢跳舞吗？=Running is too tiring. Don't you like dancing?\nA:是啊，我每个星期天都去跳舞。=Yes, I go dancing every Sunday.\nB:那我明天跟你一起去学跳舞吧。=Then tomorrow I'll go with you and learn to dance.\n?明天他们一起做什么？|跳舞|游泳|跑步\n##4 How often?\nA:你经常运动吗？=Do you exercise often?\nB:经常。我每周打两次篮球，有时也去游泳。=Often. I play basketball twice a week, and sometimes I go swimming too.\nA:你每天都上网吗？=Do you go online every day?\nB:每天都上。我喜欢在网上看电影、买东西。=Every day. I like watching films and shopping online.\nA:我也是。我每天晚上上一个小时网。=Me too. I spend an hour online every evening.\nB:我一周在网上买三四次东西！=I shop online three or four times a week!\n?男的一周打几次篮球？|两次|一次|三四次\n##5 Which colour?\nA:你喜欢什么颜色？=What colour do you like?\nB:我最喜欢绿色。你看，这条裤子是绿色的。=I like green best. Look, these trousers are green.\nA:这条绿色的有点儿贵。那条黑色的呢？=The green ones are a bit expensive. What about those black ones?\nB:黑色的也不错。有没有白色的？=The black ones aren't bad either. Are there any white ones?\nA:有，白色的两百块，红色的一百八。=Yes. The white ones are two hundred yuan, the red ones a hundred and eighty.\nB:那我买红色的吧。=Then I'll take the red ones.\n?男的买了什么颜色的裤子？|红色的|绿色的|白色的\n##6 Tea or coffee?\nA:你想喝咖啡还是喝茶？=Would you like coffee or tea?\nB:我喝茶。你们这儿有什么茶？=Tea, please. What teas do you have here?\nA:有红茶、绿茶，还有奶茶。=Black tea, green tea, and milk tea as well.\nB:我要一杯红茶。你呢？=I'll have a black tea. And you?\nA:我喝咖啡。中午我们吃鱼还是吃肉？=I'll have coffee. Shall we have fish or meat for lunch?\nB:昨天吃肉了，今天还是吃鱼吧。=We had meat yesterday; let's have fish today.\n?他们中午吃什么？|鱼|肉|面条儿\n##7 A family photo\nA:这是你们家的人吗？这两位是谁？=Is this your family? Who are these two?\nB:是我爷爷和奶奶。爷爷今年七十多岁了。=My grandfather and grandmother. Grandpa is over seventy this year.\nA:这是你哥哥吧？他后边的女孩儿是谁？=This must be your older brother? Who is the girl behind him?\nB:那是我哥哥的妻子。=That's my brother's wife.\nA:这个小男孩儿真漂亮，是他们的孩子吗？=This little boy is lovely. Is he their child?\nB:对，他今年三岁，是我们家最小的小孩儿。=Yes, he's three this year, the youngest child in our family.\n?那个小男孩儿是谁的孩子？|哥哥的|爷爷的|女的\n##8 Who is taller?\nA:你弟弟个子真高！他比你高吧？=Your younger brother is really tall! Taller than you, isn't he?\nB:对，他比我高一点儿，可是我比他大三岁。=Yes, a little taller than me, though I'm three years older.\nA:他的眼睛很大，很漂亮。=His eyes are big and very handsome.\nB:他的手也大，很会打篮球。=His hands are big too, and he's good at basketball.\nA:你妹妹呢？她也很高吗？=And your younger sister? Is she tall too?\nB:她不高，她的头小小的，眼睛大大的。=She isn't tall. She has a small head and big eyes.\n?男的比弟弟大几岁？|三岁|一岁|两岁\n##9 At the pharmacy\nA:你怎么了？身体不舒服吗？=What's the matter? Aren't you feeling well?\nB:我头疼，眼睛也疼，觉得很累。=My head hurts, my eyes hurt too, and I feel very tired.\nA:你昨天晚上睡得太少了吧？吃药了吗？=You slept too little last night, didn't you? Have you taken any medicine?\nB:没有。我家没有药了。=No. There's no medicine left at home.\nA:学校旁边有一个药店，那儿的药最便宜。=There's a pharmacy next to the school; the medicine there is the cheapest.\nB:好，我现在去买。谢谢你！=OK, I'll go and buy some now. Thank you!\n?男的哪儿不舒服？|头和眼睛|手|他没有不舒服\n##10 How was the film?\nA:昨天的电影怎么样？有意思吗？=How was yesterday's film? Was it interesting?\nB:真有意思啊！我笑了两个小时。=Really interesting! I laughed for two hours.\nA:是吗？我看的那个很没意思，我睡觉了。=Really? The one I watched was very boring; I fell asleep.\nB:电影里有一个词，我不知道是什么意思。=There was a word in the film whose meaning I didn't know.\nA:什么词？=What word?\nB:“生日快乐”。=“生日快乐”。\nA:意思是 happy birthday！=It means \"happy birthday\"!\n?男的觉得昨天的电影怎么样？|很有意思|没意思|不错，可是太长\n##11 Our teacher\nA:教你们汉语的老师姓什么？=What's the surname of the teacher who teaches you Chinese?\nB:姓张。她也在一个高中教学生。=Zhang. She also teaches students at a senior secondary school.\nA:你们什么时候开学的？=When did your term start?\nB:上周一开学的。我们每天上午在三号教室上课。=Last Monday. We have class every morning in classroom 3.\nA:你们经常考试吗？=Do you have exams often?\nB:每周考一次。张老师考的题不多，都很有意思。=Once a week. Ms Zhang doesn't set many questions, and they are all interesting.\n?他们多长时间考一次试？|每周一次|每天一次|每月一次\n##12 After the test\nA:今天的考试你都做完了吗？=Did you finish everything in today's test?\nB:做完了，可是有两个题我做错了。=I did, but I got two questions wrong.\nA:老师说的话你都听懂了吗？=Did you understand everything the teacher said?\nB:听懂了。可是有一个词我忘了怎么写。=I did. But I forgot how to write one word.\nA:我也是！我记得那个词在本子上。我今天没拿本子。=Me too! I remember that word is in my notebook. I didn't bring my notebook today.\nB:明天老师还要考这些词，我们今天晚上一起学习吧。=The teacher is testing these words again tomorrow; let's study together tonight.\n?男的做错了几个题？|两个|一个|没有做错\n##13 Where is the pharmacy?\nA:请问，这儿有药店吗？=Excuse me, is there a pharmacy around here?\nB:有。你看，前面有一个大商店，药店在商店的后面。=Yes. Look, there's a big shop in front; the pharmacy is behind the shop.\nA:药店旁边是什么？=What's next to the pharmacy?\nB:旁边是一个饭店，饭店外面有很多车。=A restaurant, with lots of cars outside it.\nA:药店上面是不是有一个书店？=Is there a bookshop above the pharmacy?\nB:对，书店在药店的上面，下面是药店。=Right, the bookshop is above and the pharmacy is below.\n?药店在哪儿？|在商店的后面|在饭店的里面|在书店的上面\n##14 Near or far?\nA:你家离学校远吗？=Is your home far from the school?\nB:不远，很近，走路十分钟就到。 =Not far, very near: ten minutes on foot.\nA:真好！我家离学校很远，要坐一个小时的车。=Lucky you! My home is far from the school; it takes an hour by bus.\nB:学校左边是我家，右边是一个医院。=To the left of the school is my home; to the right is a hospital.\nA:医院离你家这么近，真好。=The hospital is so close to your home; that's really good.\nB:是啊。明天你来我家玩儿吧。=Yes. Come over to my place tomorrow.\n?女的家离学校远吗？|很远|很近|走路十分钟\n##15 Asking the way\nA:请问，从这儿到书店怎么走？=Excuse me, how do I get from here to the bookshop?\nB:你往前走，到了前面的路往右走。=Go straight ahead; at the road in front, turn right.\nA:远吗？走路要多长时间？=Is it far? How long does it take on foot?\nB:不远，走路五分钟。书店就在学校门口。=Not far, five minutes on foot. The bookshop is right at the school gate.\nA:路上有商店吗？我想买水。=Are there any shops on the way? I'd like to buy some water.\nB:有，路的左边有一个小商店。=Yes, there's a small shop on the left of the road.\n?书店在哪儿？|在学校门口|在路的左边|在商店里面\n##16 How did you get here?\nA:你今天是怎么来的？=How did you get here today?\nB:我是坐地铁来的。我家旁边就有地铁站。=I came by metro. There's a metro station right next to my home.\nA:我是坐公交车来的，车上人太多了。=I came by bus; it was far too crowded.\nB:明天我去机场，你知道怎么去最快吗？=I'm going to the airport tomorrow. Do you know the fastest way to get there?\nA:打车最快。你的机票是几点的？=A taxi is fastest. What time is your flight?\nB:上午十点的。我七点就从家里走。=Ten in the morning. I'll leave home at seven.\n?男的今天是怎么来的？|坐地铁|坐公交车|打车\n##17 Come in!\nA:请进！外面冷，快进来吧。=Come in! It's cold outside; come in quickly.\nB:谢谢。王老师在吗？=Thanks. Is Mr Wang in?\nA:他出去了，一会儿就回来。你进来等他吧。=He has gone out and will be back in a moment. Come in and wait for him.\nB:好。我可以过去看看那些书吗？=OK. May I go over and look at those books?\nA:可以。你看，他从外面进来了。=Sure. Look, he's coming in from outside.\nB:王老师，您好！我过来问您一个问题。=Hello, Mr Wang! I've come over to ask you a question.\n?王老师去哪儿了？|出去了|在教室上课|回家了\n##18 Up and down the stairs\nA:你在哪儿呢？我到你家楼下了。=Where are you? I'm downstairs at your building.\nB:我在楼上。你上来吧。=I'm upstairs. Come up.\nA:我的东西太多了，你能下来帮我吗？=I've got too many things; could you come down and help me?\nB:好，我现在就下去。=OK, I'm coming down right now.\nA:你妈妈回来了吗？=Is your mum back?\nB:还没回来。她七点下班，八点回来。=Not yet. She finishes work at seven and gets back at eight.\n?女的为什么不上去？|东西太多了|她不知道在哪儿|她想回家\n##19 Have you ever been there?\nA:你去过中国吗？=Have you ever been to China?\nB:去过两次。去年我跟家人一起去旅游了。=Twice. Last year I went travelling there with my family.\nA:你们住的酒店怎么样？=What was the hotel you stayed in like?\nB:酒店不错，离地铁站很近。我们还看了很多好玩儿的东西。=The hotel was good, and close to the metro. We also went to see lots of fun things.\nA:门票贵吗？=Were the entrance tickets expensive?\nB:不贵。你出过国吗？=No. Have you ever been abro function passes(its,vars,ty,ord){
  const per=its.map(x=>{let v=vars(x).filter(Boolean);if(ty)v=v.filter(a=>a[0]===ty);return shuf(v.filter(a=>a[2])).concat(shuf(v.filter(a=>!a[2])))});
  const out=[],mx=Math.max(0,...per.map(v=>v.length));
  for(let p=0;p<mx;p++){const row=[];per.forEach((v,i)=>{if(v[p])row.push([its[i],v[p][1]])});out.push(ord(row))}
  return out;
}
function spreadOut(a){
  for(let i=1;i<a.length;i++){if(a[i].id!==a[i-1].id)continue;let j=-1;
    for(let k=i+1;k<a.length;k++)if(a[k].id!==a[i].id&&(k+1>=a.length||a[k+1].id!==a[i].id)){j=k;break}
    if(j<0)for(let k=0;k<i-1;k++)if(a[k].id!==a[i].id&&a[k+1].id!==a[i].id&&(!k||a[k-1].id!==a[i].id)){j=k;break}
    if(j>=0){const t=a[i];a[i]=a[j];a[j]=t}}
}
/* Builds one round. own = units made from the chosen range, bor = units taken from the
   nearest lessons outside it, again = units that ask an earlier item a second time. */
function buildPrac(c){
  const m=c.m,pm=PM[m],n=pracN(c),ty=c.ty[m]||'',p=P(),R={out:[],ok:[],own:0,bor:0,again:0};
  if(pm.fixed){const q=fixedPrac(m,ty).filter(Boolean);return {qs:q,units:q.length?1:0,own:1,bor:0,again:0}}
  const wf=c.wf&&pm.wf,byWrong=a=>wf?a.sort((x,y)=>(p.wrong[y[0]&&y[0].key]||0)-(p.wrong[x[0]&&x[0].key]||0)):a;
  const ord=row=>byWrong(shuf(row)).map(([x,f,id])=>({x,f,id:id===undefined?x:id}));
  const mk=t=>{let q=null;try{q=t.f()}catch(e){}if(Array.isArray(q)){q=q.filter(Boolean);if(!q.length)q=null}return q||null};
  const run=(th,own)=>{for(const t of th){if(R.out.length>=n)return;const q=mk(t);if(q){R.out.push({q,id:t.id});own?R.own++:R.bor++;R.ok.push(t)}}};
  const days=pracDays(c);
  modeTiers(m,ty,days,ord).forEach(th=>run(th,1));
  if(pm.bor&&days.length){const nd=nearDays(m,days);for(let i=0;i<nd.length&&R.out.length<n;i+=3)modeTiers(m,ty,nd.slice(i,i+3),ord).forEach(th=>run(th,0))}
  for(let g=0;R.out.length<n&&R.ok.length&&g<80;g++)
    for(const t of byWrong(shuf(R.ok.map(t=>[t.x,t]))).map(a=>a[1])){if(R.out.length>=n)break;const q=mk(t);if(q){R.out.push({q,id:t.id});R.again++}}
  spreadOut(R.out);
  return {qs:R.out.flatMap(x=>x.q),units:R.out.length,own:R.own,bor:R.bor,again:R.again};
}

function startPrac(){

    <div class="row"><a class="btn line" href="#/wrong">Open the error notebook</a><a class="btn line" href="#/prac">Practise one skill</a></div></section>`;
  }
  return h+`<nav class="pn">${n>1?`<a href="#/day/${n-1}">Day ${n-1}</a>`:'<span></span>'}${n<TOTAL?`<a href="#/day/${n+1}">Day ${n+1}</a>`:''}</nav>`;
}
function pracV(){
  const p=P();
  return `<h1>Practise one skill</h1><p class="lead">Extra practice on top of the daily lesson. Pick a skill, then choose the range, the question type, the number of items and how answers are shown before you start. Every round has the number you asked for. Your last choices are remembered.</p>
  <div class="cards">${PR.map(([m,t,s])=>`<button class="pcard" data-act="prac" data-m="${m}"><b>${t}</b><span>${(PM[m]&&PM[m].desc)||s}</span></button>`).join('')}
  <a class="pcard" href="#/wrong"><b>Error notebook</b><span>${Object.keys(p.wrong).length} items you got wrong, drilled until they are gone.</span></a></div>`;
}
function examV(){
  const ex=P().exams||{},card=(i,t,s)=>`<button class="pcard" data-act="exam" data-no="${i}"><b>${t}</b><span>${ex[i]?`${ex[i].tot}/${ex[i].max||300} on ${fmtY(pd(ex[i].d))}`:s}</span></button>`;
  return `<h1>Mock exams</h1><p class="lead">Papers built to the structure and timing of the new HSK ${C.lv}, first held on 13 December 2026. No item repeats anything from the lessons.</p>
  <table class="tb"><tr><th>Section</th><th>Time</th><th>What you do</th><th>Items</th></tr>${C.examRows}</table>
  <p class="mute">${C.examNote}</p>
  <div class="cards">${[...Array(NM)].map((_,i)=>card(i+1,'Mock exam '+(i+1),'Not taken yet')).join('')}${NM>1?card(0,'Remix exam','Items mixed from both papers. Take it last.'):''}
  ${[1,2].map(i=>`<button class="pcard" data-act="spk" data-no="${i}"><b>Speaking mock ${i}</b><span>${C.spkCard||'Five tasks with timers, self-marked.'}</span></button>`).join('')}</div>`;
}
function charsV(){
  return `<h1>${C.compact?'Characters':'Handwriting characters'}</h1><p class="lead">${C.chlead?C.chlead.replace('{n}',ORD.length):`The ${ORD.length} characters the new syllabus adds to the handwriting list at Level ${C.lv}, in the order the lessons teach them.`} Tap one for stroke order, a memory hook and tracing practice. Shaded squares are in your error notebook.</p>
  <div class="kgridv">${ORD.map(c=>`<button class="${P().wrong['k:'+c]?'w':''}" data-act="kopen" data-k="${c}" title="${HZ[c].p}: ${esc(HZ[c].m)}">${c}</button>`).join('')}</div>
  <div class="row"><button class="btn" data-act="prac" data-m="kf">Turn character cards</button><button class="btn line" data-act="prac" data-m="kq">Character quiz</button></div>`;
}
function wrongV(){
  const ks=Object.keys(P().wrong);
  const row=k=>{if(k[0]==='k'){const x=HZ[k.slice(2)];return x&&`<b class="zh">${x.c}</b><span>${x.p}: ${esc(x.m)}</span>`}
    if(k[0]==='w'){const x=W[k];return x&&`<b class="zh">${x.w}</b><span>${x.p}: ${esc(x.m)}</span>`}
    const e=GEX[k];return e&&`<b class="zh">${esc(e.g.t)}</b><span class="zh">${exFull(e,1)}</span>`};
  return `<h1>Error notebook</h1><p class="lead">Words, characters and grammar items you answered wrongly are kept here. An item leaves once you have got it right as many times as you got it wrong.</p>
  ${ks.length?`<div class="row"><button class="btn" data-act="wquiz">Drill ${Math.min(20,ks.length)} items</button></div><ul class="outl">${ks.map(k=>{const r=row(k);return r?`<li>${r}<small>missed ${P().wrong[k]}×</small></li>`:''}).join('')}</ul>`:'<p class="note">The notebook is empty. Do any day\'s exercises and the items you miss will appear here.</p>'}`;
}
function setV(){
  const p=P();
  return `<h1>Settings</h1>
  <section class="sec"><h2>Your profile</h2><div class="form"><label>Name<input id="s-name" value="${esc(p.name)}"></label><label>First study day<input id="s-start" type="date" value="${p.start}"></label><label>Exam date<input id="s-exam" type="date" value="${p.exam||''}"></label></div>
  <div class="row"><button class="btn" data-act="saveset">Save changes</button></div></section>
  <section class="sec"><h2>Display and voice</h2><label class="chk"><input type="checkbox" data-act="py" ${p.py!==false?'checked':''}> ${C.ruby?'Show pinyin above Chinese text':'Show pinyin in word lists'}</label>
  <div class="form"><label>Theme <select data-act="theme"><option value="">Match my device</option><option value="light"${p.theme==='light'?' selected':''}>Light</option><option value="dark"${p.theme==='dark'?' selected':''}>Dark</option></select></label>
  <label>Reading speed in lessons <select data-act="rate">${[[.75,'Slow'],[.9,'Steady'],[1,'Natural'],[1.15,'Fast']].map(([v,t])=>`<option value="${v}"${(p.rate||1)==v?' selected':''}>${t}</option>`).join('')}</select></label></div>
  <div class="row"><button class="btn line" data-act="ttstest">${SPK} Test the voice</button><button class="btn line" data-act="ahelp">💡 Can't hear?</button></div>
  <p class="mute">Listening uses the Mandarin voice installed on your device; exam recordings always play at natural speed. If the test is silent or sounds like English, add a Chinese (Mandarin) voice in your device's language settings, or open the page in Chrome, Edge or Safari.</p></section>
  <section class="sec"><h2>Profiles on this device</h2><p class="mute">Each profile has its own progress and error notebook. ${CLOUD?'Progress is saved to your Claude account, so it follows you to other devices.':'Progress is saved in this browser.'}</p>
  <ul class="outl">${Object.values(DB.profiles).map(q=>`<li><b>${esc(q.name)}</b><span>started ${fmtY(pd(q.start))}</span>${q.id===p.id?'<small>in use</small>':`<button class="btn sm line" data-act="switch" data-id="${q.id}">Switch</button>`}</li>`).join('')}</ul>
  <div class="row"><button class="btn line" data-act="addp">Add a profile</button></div></section>
  <section class="sec"><h2>Backup</h2><p class="mute">Download a backup now and then, or use one to move your progress to another browser.</p>
  <div class="row"><button class="btn line" data-act="export">Download backup</button><label class="btn line">Restore from file<input type="file" accept="application/json" id="imp" hidden></label></div>
  <div class="row"><button class="btn sm danger" data-act="reset">Erase this profile's progress</button>${Object.keys(DB.profiles).length>1?'<button class="btn sm danger" data-act="delp">Delete this profile</button>':''}</div></section>
  <section class="sec"><h2>Sources</h2><p class="mute">Word list, handwriting characters and grammar points follow the new HSK syllabus published by Chinese Testing International in November 2025; explanations, example sentences, dialogues and exam items were written for this plan and are not official materials. English glosses adapted from CC-CEDICT (CC BY-SA 4.0). Stroke data from Make Me a Hanzi (Arphic Public License) with character notes from the same project (LGPL).</p></section>`;
}
let lastHash=null;
function render(keep){
  const app=$('#app');
  if(!P()){app.innerHTML=onboard();return}
  const p=P();if(p.theme)document.documentElement.dataset.theme=p.theme;else delete document.documentElement.dataset.theme;
  document.body.classList.toggle('nopy',p.py===false);
  const [r,a]=(location.hash.slice(2)||'').split('/'),y=scrollY;
  const v=r==='plan'?plan():r==='day'?day(+a||todayN()):r==='prac'?pracV():r==='exam'?examV():r==='chars'?charsV():r==='wrong'?wrongV():r==='set'?setV():home();
  app.innerHTML=`<nav class="nav"><a class="brand" href="#/"><span class="zh">${C.zh}</span>${C.title}</a>${NAV.map(([h,t,g])=>`<a href="#/${h}" class="${(r||'')===h||(h==='plan'&&r==='day')||(h==='prac'&&r==='wrong')?'on':''}"><span class="zh">${g}</span>${t}</a>`).join('')}</nav>
  <main>${LS.ok||CLOUD?'':'<p class="note">This browser is blocking storage here, so progress will be lost when the page closes.</p>'}${v}</main>`;
  scrollTo(0,keep&&lastHash===location.hash?y:0);lastHash=location.hash;
}

/* ================= Events ================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,p=P(),z=QZ,q=z&&z.qs&&z.qs[z.i];
  if(a==='create'){const s=$('#o-start').value;if(!s){toast('Choose your first study day.');return}newProfile($('#o-name').value.trim()||'Learner',s,$('#o-exam').value);location.hash='#/';render()}
  else if(a==='back'){DB.cur=Object.keys(DB.profiles)[0];render()}
  else if(a==='say'){e.stopPropagation();say(t.dataset.t)}
   else if(a==='ttstest')speak([{t:'你好，欢迎参加中文水平考试。',v:'f'},{t:'听力考试现在开始，请大家注意。',v:'m'}]);
   else if(a==='ahelp')audioHelp();
  else if(a==='anim')animate(t.closest('.kcard').querySelector('.mz svg'));
  else if(a==='kopen'){openModal(kCard(HZ[t.dataset.k]));animate($('#modal .mz svg'))}
  else if(a==='pad')openPad(t.dataset.k);
  else if(a==='padclr'){const c=$('#modal canvas');c.getContext('2d').clearRect(0,0,c.width,c.height)}
  else if(a==='close'){stopAudio();closeModal()}
  else if(a==='reveal')t.classList.toggle('show');
  else if(a==='kwall')speak(KW[t.dataset.l].lines.map(l=>({t:l.zh,v:VOI[l.s]})));
  else if(a==='kwshow')t.closest('.sec').querySelector('.kwl').classList.toggle('veil');
  else if(a==='role'){RP={L:+t.dataset.l,r:t.dataset.r,i:0};roleStep()}
  else if(a==='rpshow'){$('#rpa').hidden=false;const ln=KW[RP.L].lines[RP.i];speak([{t:ln.zh,v:VOI[ln.s]}])}
  else if(a==='rpnext'){RP.i++;roleStep()}
  else if(a==='quiz'){const n=+t.dataset.n,s=t.dataset.sec,d=D(n);startQuiz(`Day ${n}: ${d.type==='lesson'||secs(d).length>1?SECN[s]:dayLabel(d)}`,buildSec(n,s),{done:pct=>markDone(n,s,pct)})}
  else if(a==='exam'){const n=+t.dataset.n;startExam(+t.dataset.no,n?pct=>markDone(n,'q',pct):null)}
  else if(a==='exgo'){const ex=EXS,pt=ex.parts[ex.i];startQuiz(`${exName(ex.no)} · ${pt.title}`,pt.qs,{exam:true,limit:pt.min*60,chain:zz=>{zz.title=pt.title;ex.done.push(zz);QZ=null;if(++ex.i<ex.parts.length)examIntro();else examResult()}})}
  else if(a==='spk')startQuiz('Speaking mock '+t.dataset.no,speakSet(+t.dataset.no));
  else if(a==='prac')openSetup(t.dataset.m);
  else if(a==='pgo')startPrac();
  else if(a==='wquiz')startQuiz('Error notebook drill',shuf(Object.keys(p.wrong)).slice(0,20).map(qFromKey));
  else if(a==='qplay')playQ();
  else if(a==='pick'){if(z.shown)return;(z.ans[z.i]=z.ans[z.i]||[])[+t.dataset.j]=+t.dataset.i;if(q.subs.length===1)grade();else drawQ()}
  else if(a==='mcheck')grade();
  else if(a==='dchip'){$('#din').value+=t.dataset.t}
  else if(a==='dclr')$('#din').value='';
  else if(a==='dcheck'){const v=$('#din').value;answer(v,dictOk(q,v))}
  else if(a==='czadd'){const st=z.ans[z.i],b=q.sol.findIndex((_,j)=>st.f[j]==null);if(b<0)return;const i=+t.dataset.i;st.f[b]=q.bank[i];st.u[b]=i;drawQ()}
  else if(a==='czrm'){const st=z.ans[z.i],b=+t.dataset.b;st.f[b]=null;st.u[b]=null;drawQ()}
  else if(a==='czcheck'){const st=z.ans[z.i];z.res[z.i]=q.sol.every((s,j)=>st.f[j]===s);if(z.opt.late)nextQ();else{z.shown=true;drawQ()}}
  else if(a==='opick'){z.ans[z.i].push(+t.dataset.x);drawQ()}
  else if(a==='oundo'){z.ans[z.i].pop();drawQ()}
  else if(a==='ocheck'){const s=z.ans[z.i],c=s.filter((x,k)=>q.sh[x]===k).length;answer(s,c===q.paras.length?true:c)}
  else if(a==='wdone'){keep();if(z.opt.exam)nextQ();else{z.shown=true;drawQ()}}
  else if(a==='aimark'){t.disabled=true;if(EXR){const i=+t.dataset.i;aiMark(EXR.wq[i],EXR.wt[i],$('#aiout'+i),(s,txt)=>{EXR.fb[i]=txt;if(s!=null){EXR.ws[i]=s;drawExamResult()}})}else aiMark(q,z.ans[z.i]||'',$('#aiout'))}
  else if(a==='tm'){let s=+t.dataset.s;clearInterval(tmI);t.disabled=true;t.textContent=clock(s)+' left';tmI=setInterval(()=>{s--;t.textContent=s>0?clock(s)+' left':'Time is up';if(s<=0)clearInterval(tmI)},1000)}
  else if(a==='flip'){clearInterval(tmI);z.flip=true;drawQ();if(q.say)say(q.say)}
  else if(a==='fyes'||a==='fno'){z.res[z.i]=a==='fyes';nextQ()}
  else if(a==='qnext')nextQ();
  else if(a==='qclose'){if((EXS||(z&&!z.fin&&z.res&&z.res.length))&&!confirm('Leave this exercise? The result will not be saved.'))return;clearInterval(tmI);closeQuiz()}
  else if(a==='saveset'){const s=$('#s-start').value;if(!s){toast('Choose your first study day.');return}p.name=$('#s-name').value.trim()||p.name;p.start=s;p.exam=$('#s-exam').value;save();render();toast('Changes saved.')}
  else if(a==='ttstest')speak([{t:'你好，欢迎参加中文水平考试。',v:'f'},{t:'听力考试现在开始，请大家注意。',v:'m'}]);
  else if(a==='switch'){DB.cur=t.dataset.id;save();render();toast('Profile switched.')}
  else if(a==='addp'){DB.cur=null;render()}
  else if(a==='export'){const j=JSON.stringify(DB);if(DL)DL.save({filename:C.doc+'-backup.json',data:j}).then(()=>toast('Backup downloaded.')).catch(()=>toast('The backup was not saved.'));
    else{const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));l.download=C.doc+'-backup.json';l.click()}}
  else if(a==='reset'){if(confirm('Erase all progress and the error notebook for this profile?')){p.done={};p.wrong={};p.act={};p.exams={};save();render();toast('Progress erased.')}}
  else if(a==='delp'){if(confirm(`Delete the profile “${p.name}”?`)){delete DB.profiles[p.id];DB.cur=Object.keys(DB.profiles)[0];save();render()}}
});
document.addEventListener('change',e=>{
  const t=e.target,a=t.dataset.act;
  if(t.dataset.ps){setPS(t);return}
  if(a==='hide')t.closest('.sec').querySelector('.vlist').classList.toggle('hidden',t.checked);
  else if(a==='py'){P().py=t.checked;save();render(true)}
  else if(a==='theme'){P().theme=t.value;save();render(true)}
  else if(a==='rate'){P().rate=+t.value;save()}
  else if(a==='scope'){P().scope=t.value;save()}
  else if(a==='wscore'&&EXR){EXR.ws[+t.dataset.i]=+t.value;drawExamResult()}
  else if(t.id==='imp'&&t.files[0]){const f=new FileReader();f.onload=()=>{try{const d=JSON.parse(f.result);if(!d.profiles||!Object.keys(d.profiles).length)throw 0;DB=d;if(!P())DB.cur=Object.keys(DB.profiles)[0];save();render();toast('Progress restored.')}catch(x){toast('That file is not a backup from this plan.')}};f.readAsText(t.files[0])}
});
document.addEventListener('input',e=>{if(e.target.id==='wtx'){const c=$('#wcnt'),q=QZ.qs[QZ.i],n=zlen(e.target.value);c.textContent=n;c.classList.toggle('low',n<q.min)}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#modal').classList.contains('on')){stopAudio();closeModal()}return}
  const z=QZ;if(!z||z.fin||!z.qs)return;const q=z.qs[z.i],k=q.kind||'mc';
  if(k==='mc'&&q.subs.length===1&&/^[1-4]$/.test(e.key)&&!z.shown){z.ans[z.i]=[+e.key-1];grade()}
  else if(e.key==='Enter'&&e.target.id!=='wtx'){if(z.shown&&k!=='write'){e.preventDefault();nextQ()}else if(k==='dict'){e.preventDefault();const v=$('#din').value;answer(v,dictOk(q,v))}}
});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'){stopAudio();closeModal()}});
addEventListener('hashchange',()=>render());
if(!P()&&Object.keys(DB.profiles).length)DB.cur=Object.keys(DB.profiles)[0];
render();

</script>
</body>
</html>
