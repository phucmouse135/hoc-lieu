 364Q603 413 619 478Q623 488 602 504Q566 523 542 527Q526 531 518 522Q511 515 519 499Q543 465 543 440Q544 397 546 351L547 303Q547 207 543 101C542 71 583 75 585 105Z","M543 101Q428 89 298 75Q276 74 292 55Q307 40 326 34Q348 27 365 32Q515 69 848 70Q867 70 887 69Q909 68 914 77Q921 90 903 105Q846 147 807 140Q725 124 585 105L543 101Z"],"md":["475,815 570,766 602,726","338,605 356,596 447,601 724,656 771,655","259,638 281,618 297,586 278,411 250,289 215,190 171,105 117,28 85,-6","383,321 406,314 457,313 606,338 702,362 734,365 761,359","530,513 568,483 578,462 566,131 549,109","295,65 348,55 479,74 808,105 866,98 902,84"],"w":[["村庄","cūnzhuāng","village; hamlet"],["庄稼","zhuāngjia","farm crop"]],"t":"Meaning part 广 (house) + sound part 壯."},"壮":{"p":"zhuàng","m":"big, large; robust, strong; the name of a tribe","s":["M179 576Q210 548 243 513Q258 498 275 498Q287 498 293 513Q299 529 290 562Q284 584 250 603Q169 637 152 631Q146 627 147 613Q151 600 179 576Z","M342 397Q135 238 84 220Q72 214 74 203Q75 190 88 185Q116 178 155 171Q165 171 175 184Q191 212 341 361C362 382 366 415 342 397Z","M341 361Q337 201 321 136Q305 70 327 13L328 10Q335 -8 343 -11Q349 -18 356 -9Q383 7 383 70Q382 118 391 561Q392 652 409 714Q418 729 415 742Q408 752 354 785Q332 801 311 787Q307 783 313 767Q343 722 344 648Q344 488 342 397L341 361Z","M676 399Q745 412 892 427Q905 426 916 441Q917 454 891 467Q846 494 785 472Q686 451 677 448L629 438Q581 432 426 414Q392 410 417 389Q454 361 480 363Q513 375 629 390L676 399Z","M667 173Q671 290 676 399L677 448Q677 596 703 701Q707 714 685 730Q645 751 619 755Q601 759 592 749Q583 740 593 724Q626 675 625 643Q629 544 629 438L629 390Q628 282 621 166C619 136 666 143 667 173Z","M621 166Q545 156 460 142Q439 139 455 123Q468 110 486 105Q507 101 522 105Q637 138 856 137Q875 137 880 146Q884 156 869 170Q812 209 749 191Q713 184 667 173L621 166Z"],"md":["156,624 248,561 274,518","89,206 147,211 327,367 332,379","322,781 373,727 366,370 349,107 348,2","420,402 475,391 633,414 816,450 852,452 904,442","606,737 657,696 659,674 647,213 645,192 628,173","458,132 495,125 776,166 837,162 869,151"],"w":[["强壮","qiángzhuàng","strong; sturdy; robust"]],"t":"Meaning part 士 (soldier) + sound part 丬."}},"HL":[["昂","官","纠"],["畅","迫","启"],["编","侧","枝"],["策","抵","拐","纳"],["岸","呈","匆","轨"],["纯","呆","托"],["财","串","诞"],["寸","德","戒","抗"],["肠","寿","肿"],["恶","犯","妨","肺"],["奉","辅","肩"],["肝","攻","舌","予"],["悲","凡","巩","归"],["愁","孤","罕","恨"],["骨","宏","盼","佩"],["击","尖","委"],["饥","讶","庄"],["劣","盲","壮"],["摆","奔","杰","宅"],["闯","吊","夹","妆"],["夸","拦","迈","扭"],["劲","吐","吞","仰"],["抄","轮"],["幻","牢"],["拟","忧"],["仓","灭","扑"],["氛","岗","妙"],["抛","晕"],["泡","旬"],["岛","旱","朴","圈"],["拔","尘","井","兰"],["顶","雷"],["龟","坡","闪","乌"],["披","尚","汰","炎"],["瞧","亡"],["麦","坛","谓"],["泥","吓"],["径","讯","仪"],["兵","贯","刊","仗"],["股","匀"],["贸","贫","枪","抑"],["券","央","州"],["丧","孕"],["审","雄","异","英"],["夺","灾"],["臣","皇","吉"],["沃","扎"],["帆","杀"]],"g":"##1\n@于|at; in; to; from; than (formal)|V/Adj + 于 + time/place/object · 于 + time/place + V\n于 is the all-purpose preposition of written Chinese. After a verb it marks place or time (生于1990年、位于市中心), a target (有利于、适用于), a source (源于、出于) or a comparison (高于、低于). Before the verb it replaces 在: 会议于上午九点举行.\n!In speech 于 survives mainly inside fixed words (对于、关于、由于、等于、善于). In the writing tasks it is a quick way to sound formal.\n>本行已【于|在于|至于|对于】昨日收到您的贷款申请，将在五个工作日内给予答复。=The bank received your loan application yesterday and will reply within five working days.\n>今年的贷款利息明显低【于|比|过|对】去年。=This year's loan interest is clearly lower than last year's.\n~提前还款有利【于|在|给|为】减轻今后的经济压力。=Repaying early helps to reduce financial pressure later on.\n##2\n@因|because of; owing to (formal)|因 + cause +（而）+ result\n因 as a preposition gives the reason in compact written style, often paired with 而 before the result: 因天气原因而取消. It is the form used in notices, news and apologies; in speech people say 因为.\n!因 is followed directly by the cause. 因此 and 因而 (therefore) are conjunctions that open the result clause instead.\n>各位旅客，我们抱歉地通知您，您乘坐的航班【因|由|凭|趁】天气原因推迟起飞。=Passengers, we regret to inform you that your flight is delayed owing to the weather.\n>他因工作出色【而|就|却|则】被公司派往海外分部。=Because of his outstanding work he was sent by the company to its overseas branch.\n~不少航班【因|据|凭|除】台风而被迫取消。=Many flights were forced to cancel because of the typhoon.\n##3\n@至于|as for; (not) go so far as to|至于 + new aspect，… · 不至于 + verb\nAs a preposition 至于 turns the talk to a related but different matter: 至于价格，我们可以再商量. As a verb it appears mostly in the negative or in rhetorical questions: 不至于 = it won't get that bad; 至于吗？ = is it really worth all that?\n!至于 opens a new aspect of something already under discussion; to announce a topic for the first time use 关于.\n>手机可以免费修理，【至于|关于|由于|对于】能不能换新的，要等检测结果出来才知道。=The phone can be repaired free of charge; as for whether it can be replaced, we will know only when the test results are out.\n>屏幕上只是有一点儿痕迹，不【至于|在于|终于|等于】影响使用吧？=There is only a slight mark on the screen; surely that won't actually affect use?\n~我只负责登记投诉，【至于|以至|甚至|至今】怎么处理，得由主管决定。=I only register complaints; as for how they are handled, that is for the supervisor to decide.\n##4\n@除|besides; except; apart from|除（了）+ X +（以）外，都/还/也 …\n除 is the shorter, written form of 除了. With 都 in the main clause it excludes X (everything but X); with 还 or 也 it adds to X (X and more). In formal texts it often pairs with 外 alone: 除周一外.\n!The meaning depends on the adverb that follows: 除…外，都 = except; 除…外，还 = in addition to.\n>体检结果显示，【除|凡|虽|趁】血压稍高外，您的其他检查结果都很正常。=The check-up shows that apart from slightly high blood pressure, all your other results are normal.\n>除定期检查外，医生【还|都|才|却】建议他每天坚持散步。=Besides regular check-ups, the doctor also advised him to take a walk every day.\n~体检中心除周日【外|内|上|里】，每天上午都开放。=The health-check centre is open every morning except Sunday.\n##5\n@特、异常、较为|really · extraordinarily · relatively|特 + adjective (spoken) · 异常 + adjective · 较为 + two-syllable adjective\n特 is the casual short form of 特别 (特好吃). 异常 as an adverb means \"abnormally, extremely\" and belongs to written description (异常激烈). 较为 is the formal 比较 and needs a two-syllable word after it (较为复杂).\n!较为 cannot precede a single syllable: 较为好 ✗ → 较好 or 较为理想. 异常 can also be an adjective: 情况异常.\n>这款车的性能【较为|特地|不禁|再三】稳定，适合第一次买车的人。=This model's performance is relatively stable; it suits first-time buyers.\n>受大雾影响，今天早上高速公路的路况【异常|干脆|特意|总算】复杂。=Because of heavy fog, conditions on the motorway were extremely complicated this morning.\n~我跟你说，那个二手车市场【特|未必|再三|不禁】大，逛一天都逛不完。=I tell you, that used-car market is really huge; you can't get round it in a day.\n##6\n@未必|not necessarily|未必 + verb/adjective\n未必 politely doubts a statement: it may not be so. It is softer than 不一定 and common in argument and opinion writing; 未必不 is a cautious affirmative (未必不是好事 = may well be a good thing).\n!未必 questions a judgement or prediction. For a guess about a past action say 可能没…: 他昨天可能没来.\n>就算材料交齐了，签证也【未必|未曾|不禁|一向】能马上办下来，你最好提前一个月申请。=Even with all the documents handed in, the visa won't necessarily be issued at once; you had better apply a month ahead.\n>价格高的保险【未必|务必|必定|何必】适合你，关键要看保障的内容。=Expensive insurance isn't necessarily right for you; the key is what it covers.\n~这次没通过未必【不是|没有|不会|不要】好事，至少你知道了材料该怎么准备。=Failing this time may well be a good thing; at least you now know how to prepare the documents.\n##7\n@人家|other people · he/she/they · I (coy)|人家 (rénjia) as a pronoun\n人家 has three uses: (1) other people in general (人家的东西别动); (2) a third person already mentioned, often with respect or sympathy (快给人家道歉); (3) \"I\", in a slightly complaining or coy tone, mostly used by women and children (人家不想去嘛).\n!Read rénjia with a neutral second syllable. 人家 rénjiā with full tones means \"household\": 山下有几户人家.\n>楼下的邻居已经来敲过两次门了，咱们得替【人家|大家|本人|各自】想想，别再跳了。=The downstairs neighbour has knocked twice already; we should think of them and stop jumping.\n>你看【人家|彼此|自身|某些】小王，才搬来半年就和邻居们处得这么好。=Look at Xiao Wang: he moved in only six months ago and gets on so well with the neighbours.\n~你别催了，【人家|彼此|他人|众人】还没准备好呢！=Stop rushing me, I'm not ready yet!\n##8\n@啦、嘛|modal particles: lively 了 · \"obviously\"|sentence + 啦 · sentence + 嘛\n啦 is 了 + 啊 fused: it reports a change or news with feeling (下雪啦！) and strings items in a list (书啦、报啦). 嘛 marks something as obvious (这很正常嘛), softens advice or a request (别着急嘛), and pauses after a topic (学习嘛，就得下功夫).\n!嘛 is not the question particle 吗. In listening, 嘛 signals that the speaker thinks the point needs no argument.\n>妈，您就歇一会儿【嘛|吗|的|着】，这些碗我来洗。=Mum, do have a rest; I'll wash these dishes.\n>孩子们都回来【啦|嘛|吗|呢】！快把饺子下锅吧。=The children are all back! Quick, put the dumplings in the pot.\n~有困难就说出来【嘛|吗|啦|过】，一家人有什么不好意思的？=If you have a problem, just say so; what is there to be shy about within the family?\n##9\n@A这A那 · 左A右B|this and that · over and over, from every side|V + 这 + V + 那 · 左 + V1 + 右 + V2\nV这V那 shows an action spread over all sorts of things, often with a hint of fuss (问这问那、买这买那). 左A右B uses two similar verbs to show doing something repeatedly or from all sides (左思右想、左看右看、左挑右选).\n!Both are four-character frames that take single-syllable verbs, and both usually set up a result that follows.\n>设计师量【这|哪|怎|多】量那，在我们家忙了整整一个上午。=The designer measured this and that and was busy in our flat the whole morning.\n>沙发的颜色我们左挑右【选|买|卖|放】，最后还是定了最初看中的那一款。=We went back and forth over the sofa colour and in the end settled on the one we had liked at first.\n~他左思右【想|念|说|愁】，还是觉得厨房应该重新装修。=He turned it over and over in his mind and still felt the kitchen ought to be redone.\n##10\n@好（不）容易|with great difficulty; at long last|好容易 / 好不容易 + 才 + verb\nBoth forms mean exactly the same: something was achieved only after much effort or waiting. They stand before the verb and are almost always followed by 才.\n!好不容易 is not a negative here. As a predicate, though, it keeps its literal sense: 他一个人带大三个孩子，好不容易 (= really not easy).\n>我们跑了七八家养老院，【好不容易|好不简单|多么容易|不太容易】才找到一家条件和价格都合适的。=We visited seven or eight care homes before we finally found one with the right conditions and price.\n>爷爷好容易【才|就|便|还】同意去试住一个月，你可别再提反对意见了。=It took a lot to get Grandpa to agree to a one-month trial stay, so don't raise any more objections.\n~排了两个小时的队，我【好不容易|未必|不料|干脆】才挂上了专家号。=After queuing for two hours, I finally managed to get an appointment with a specialist.\n##11\n@那倒（也）是|that's true, I suppose|A: argument — B: 那倒（也）是\nA reply that concedes the other person's point after some initial doubt: \"now that you put it that way, you're right\". 倒 carries the sense of \"contrary to what I first thought\".\n!It accepts one point without necessarily giving up the whole argument; listen for 不过 or 可是 right after it.\n>“养孩子不能光看花多少钱，陪伴更重要。”“【那倒也是|那可不行|那倒未必|那怎么会】，再贵的玩具也比不上父母的陪伴。”=\"Raising a child isn't just about how much you spend; being there matters more.\" \"That's true: no toy, however dear, can match time with one's parents.\"\n>“现在报名虽然贵一点儿，可是能多学半年。”“那【倒|却|则|便】是，早学早受益。”=\"Signing up now costs a bit more, but he gets an extra six months of lessons.\" \"True enough: the earlier he starts, the more he gains.\"\n~“你自己小时候不也不爱写作业吗？”“那倒【也是|不是|可是|就是】，我确实没资格批评他。”=\"Didn't you hate homework yourself as a child?\" \"Fair point, I really have no right to criticise him.\"\n##12\n@算了 · 得了|forget it · that'll do; come off it|算了（吧）· …就算了 · 得了（吧）· …就得了\n算了 drops a matter: let it go, never mind. 得了 (déle) either cuts someone short (\"enough, stop it\") or, at the end of a clause, means \"and that will do\": 买一个新的得了.\n!Both can sound impatient. 得了吧 often rejects what was just said as untrue or exaggerated.\n>【算了|对了|完了|来了】，别为这点儿小钱吵了，下个月省着点儿花就是了。=Forget it, let's not quarrel over such a small sum; we'll just be careful with money next month.\n>【得了|算是|为了|除了】吧，你每次都说要存钱，哪次存下来了？=Oh come off it, you say every time that you'll save, and when have you ever managed?\n~他既然不愿意去就【算了|得很|透了|极了】，咱们自己去。=Since he doesn't want to go, never mind; we'll go by ourselves.\n##13\n@凡是……，都……|all; any … that|凡是 + noun phrase / clause，都/一律 + predicate\n凡是 stands at the head of the sentence and sweeps up every member of a group without exception; the main clause needs 都 or 一律. Typical of rules, notices and generalisations.\n!凡是 precedes the group it sums up (凡是报名的学生都…); it cannot follow the subject as 都 does.\n>【凡是|除非|就算|要么】平均成绩在九十分以上的学生，都可以申请这项奖学金。=All students with an average of ninety or above may apply for this scholarship.\n>凡是申请材料不齐全的，学院【一律|未必|倒是|干脆】不接受。=Any application with incomplete documents will be turned down by the college without exception.\n~凡是上过她的课的人，【都|才|却|倒】对她的学问十分佩服。=Everyone who has taken her class greatly admires her learning.\n##14\n@除非……，才……|only if|除非 + necessary condition，才 + result\n除非 names the one condition that must be met; 才 introduces what then becomes possible. Without that condition the result will not happen.\n!除非…才… states the result positively. With 否则/不然 (next lesson) the second clause says what happens when the condition is not met.\n>【除非|凡是|就算|以便】语言成绩达到要求，学校才会发正式的录取通知书。=Only if your language score meets the requirement will the university issue a formal offer.\n>除非有两位教授写推荐信，申请【才|就|却|也】有可能通过。=Only with recommendation letters from two professors does the application stand a chance.\n~除非导师同意，你【才|便|倒|还】能提前一个学期毕业。=Only if your supervisor agrees can you graduate a semester early.\n##15\n@除非……，否则/不然……|unless …, otherwise …|除非 + condition，否则/不然 + what happens without it\nThe same condition from the opposite angle: the second clause gives the consequence if the condition is not met. The two halves can be swapped: 我不会去，除非他道歉.\n!Do not put 才 after 否则. Compare: 除非你去，他才去 / 除非你去，否则他不去.\n>除非你能证明这些数据是自己做实验得到的，【否则|才能|以便|从而】论文不能通过。=Unless you can prove you obtained these data from your own experiments, the thesis cannot pass.\n>【除非|凡是|要么|虽】写明这段话是从哪儿来的，不然用别人的观点就算是抄。=Unless you state where the passage comes from, using someone else's ideas counts as copying.\n~我不会在这份报告上签字，【除非|否则|以免|就算】你把抄来的部分全部删掉。=I won't sign this report unless you delete all the copied parts.\n##16\n@……，以便……|so that; to make it easier to|action，以便 + intended result\n以便 opens the second clause and gives the purpose the first action serves, with the nuance \"to make it convenient to\". Written and formal. Its opposite is 以免 (so as to avoid).\n!以便 never starts a sentence. To put the purpose first, use 为了.\n>课程视频都配有字幕，【以便|以免|以往|以及】不同水平的学员理解内容。=All course videos have subtitles so that learners of different levels can follow the content.\n>请在周五以前提交作业，【以便|否则|除非|凡是】老师有足够的时间批改。=Please submit your homework before Friday so that the teacher has enough time to mark it.\n~平台会记录每个人的学习进度，【以便|以免|未必|不料】及时发现问题。=The platform records everyone's progress so that problems can be spotted in time.\n##17\n@一再、再三|again and again · over and over (earnestly)|一再 + verb · 再三 + verb / verb + 再三\nBoth stress repetition. 一再 is neutral or critical: the same thing keeps happening (一再推迟、一再犯错). 再三 goes with deliberate acts of speaking or thinking (再三强调、再三考虑) and can follow the verb: 考虑再三.\n!再三 needs a conscious agent: 价格再三上涨 ✗ → 一再上涨.\n>老师【再三|一时|一向|未必】强调，成绩不是衡量孩子的唯一标准。=The teacher stressed again and again that marks are not the only measure of a child.\n>由于种种原因，家长会的时间【一再|特意|恰好|干脆】推迟。=For various reasons the date of the parents' meeting has been postponed time after time.\n~考虑【再三|一再|不时|仍旧】，他们决定不给孩子报那么多补习班了。=After thinking it over and over, they decided not to sign the child up for so many extra classes.\n##18\n@所|nominalising particle 所|所 + V + 的 (+ noun) · 为/被 + doer + 所 + V\nBefore a transitive verb, 所 turns it into \"that which is V-ed\": 我所知道的 = what I know; 所需材料 = the materials needed. In the formal passive 为/被…所…, it marks the verb: 为实验所证明.\n!所 adds formality, not meaning: 我所了解的情况 = 我了解的情况. It cannot precede an intransitive verb or an adjective.\n>这个课题【所|被|把|于】涉及的领域很广，需要不同专业的人一起合作。=The fields this research topic touches on are very broad and call for people from different disciplines to work together.\n>他的观点已被大量实验数据【所|而|则|于】证实。=His view has been confirmed by a large body of experimental data.\n~据我【所|被|以|则】知，目前还没有人做过类似的研究。=As far as I know, nobody has yet done similar research.\n##19\n@要么……，要么……|either … or …|要么 + choice 1，要么 + choice 2\nOffers two alternatives of which one must be taken; there is no third way. It is more decisive than 或者…或者… and is common when pressing for a choice.\n!A single 要么 can also make a suggestion: 要么你先走？ In questions asking the listener to choose, use 还是.\n>你【要么|凡是|除非|以便】接受这家公司的条件，要么继续找别的工作，不能再拖了。=Either accept this company's terms or go on looking for another job; you can't put it off any longer.\n>这个岗位要么经常出差，【要么|还是|而是|以及】长期加班，你得有心理准备。=This post means either frequent business trips or long-term overtime; you need to be prepared.\n~要么去大公司当普通职员，【要么|不然|否则|除非】去小公司当主管，你自己选吧。=Either join a big firm as an ordinary employee or a small one as a manager: it's your choice.\n##20\n@就算……，也……|even if|就算 + supposition/concession，也 + unchanged result\nThe spoken equivalent of 即使: grant the point, and the conclusion still stands. The supposition may be unreal or already true.\n!就算 is a conjunction here. As verb + adverb it means \"count as\": 这就算完成了.\n>【就算|凡是|除非|要么】这个季度的销量增加一倍，也很难达到全年的目标。=Even if sales double this quarter, it will be hard to reach the annual target.\n>就算考核的结果不理想，你【也|才|就|却】用不着这么灰心。=Even if the appraisal result is disappointing, there is no need to be so downhearted.\n~【就算|除非|以便|不料】你说得都对，也应该注意一下说话的方式。=Even if everything you say is right, you should still watch how you say it.\n##21\n@虽……，但/可/却/也……|although …, yet …|S + 虽 + fact，但/可/却/也 + contrast\n虽 is the one-syllable, written form of 虽然. It comes after the subject (虽然 may come before it) and is answered by 但、可、却 or 也 in the second clause.\n!Word order: 价格虽高，但… ✓. Fixed phrases keep it alive in speech: 话虽这么说.\n>对方提出的价格【虽|就算|凡是|除非】高，但产品质量确实有保障。=The price they propose is high, but the product quality really is guaranteed.\n>这次谈判虽没达成协议，【却|便|就|才】让双方加深了了解。=Although this round of talks produced no agreement, it did deepen mutual understanding.\n~话【虽|倒|净|特】这么说，合同上的内容还是得一条一条看清楚。=That may be so, but the contract still has to be read carefully, clause by clause.\n##22\n@不料|unexpectedly; to one's surprise|expectation or plan，不料 + what actually happened\n不料 opens the second clause and reports that events turned out contrary to what was expected. The first clause gives the plan or assumption. Story-telling style; the spoken equivalent is 没想到.\n!不料 is a conjunction, so it comes before the subject of the second clause: 不料他已经走了 ✓ 他不料已经走了 ✗.\n>公司本以为这批产品会很畅销，【不料|以便|未必|凡是】上市一周就收到了大量投诉。=The company had assumed this batch would sell well; unexpectedly, complaints poured in within a week of launch.\n>我们正准备把产品收回来，【不料|除非|就算|以免】媒体已经把这件事报道出去了。=We were just preparing to recall the product when, to our surprise, the media had already reported the matter.\n~原以为事情到此结束了，【不料|否则|以便|恰好】又出现了新的问题。=We thought that was the end of it, but then a new problem appeared.\n##23\n@恰好、总算|as luck would have it · at long last|恰好 + verb/number · 总算 + verb/adjective\n恰好 = exactly, by a fortunate coincidence of time, number or condition (written; the spoken word is 正好). 总算 expresses relief that something hoped for has finally happened, or that a minimum standard is met (总算没迟到).\n!总算 carries the speaker's relief; 终于 simply reports the eventual result and suits neutral or bad outcomes too.\n>加了三天班，这份方案【总算|恰好|未必|不料】在截止日期前交上去了。=After three days of overtime, the proposal was finally handed in before the deadline.\n>客户能接受的价格【恰好|总算|再三|一再】和我们提出的一样，合同很快就签了。=The price the client could accept happened to be exactly what we had proposed, so the contract was signed quickly.\n~你来得【恰好|总算|干脆|不禁】，我们正需要一个懂技术的人。=You have come at just the right moment; we need someone who understands the technology.\n##24\n@倒是、干脆、明明|actually; mind you · simply; just · obviously (yet)|倒是 + comment · 干脆 + decisive action · 明明 + fact，(却/可) + contradiction\n倒是 marks a mild contrast with what was said or expected, or presses someone to act (你倒是说话呀). 干脆 = cut through the hesitation and take the direct solution. 明明 stresses that something is plainly true and is followed by a clause that conflicts with it.\n!明明 demands a second clause or a rhetorical question: 你明明知道，为什么不说？\n>你【明明|干脆|倒是|总算】已经很累了，为什么还要接那份兼职？=You are obviously exhausted already, so why take on that side job as well?\n>每天这么来回跑太辛苦了，你【干脆|明明|恰好|未必】在公司附近租个房子吧。=Going back and forth like this every day is too tiring; why not simply rent a place near the office?\n~工资不算高，【倒是|干脆|明明|再三】能学到不少东西。=The pay isn't high, but you do learn quite a lot.\n##25\n@类前缀：超、多、反、无、亚、准|quasi-prefixes|超/多/反/无/亚/准 + noun or verb\nThese productive elements build new words freely: 超 super-, ultra- (超市、超低温) · 多 multi- (多功能、多媒体) · 反 anti-, counter- (反作用、反季节) · 无 -less, without (无污染、无人机) · 亚 sub- (亚健康、亚热带) · 准 quasi-, -to-be (准妈妈、准决赛).\n!Knowing them lets you decode unlisted words in reading passages: 无糖 = sugar-free; 超大型 = extra-large.\n>这家超市只卖【无|反|亚|准】污染的绿色蔬菜，价格比普通的贵一些。=This supermarket sells only pollution-free green vegetables, somewhat dearer than ordinary ones.\n>长期熬夜、缺少运动的人很容易处于【亚|超|多|反】健康状态。=People who stay up late and lack exercise easily fall into a state of sub-health.\n~冬天吃的西瓜属于【反|无|准|亚】季节水果，生产过程要消耗更多的能源。=Watermelon eaten in winter is out-of-season fruit, and producing it uses more energy.\n##26\n@类后缀：化、式、型、性|quasi-suffixes|X + 化 / 式 / 型 / 性\n化 turns nouns and adjectives into verbs of becoming (数字化、现代化、老龄化). 式 = -style, manner (中式、开放式). 型 = -type, model, size (大型、节能型). 性 makes abstract qualities (可能性、重要性、一次性).\n!X化 behaves like a verb (美化环境、进一步简化); X性 is a noun; X型 and X式 mostly modify nouns directly.\n>这座城市的交通管理已经基本实现了数字【化|性|型|式】。=Traffic management in this city has basically gone digital.\n>新建的住宅全部安装了节能【型|化|性|度】的照明设备。=All newly built housing has energy-saving lighting installed.\n~专家们正在讨论这个方案的可行【性|化|型|式】。=The experts are discussing the feasibility of this plan.\n##27\n@主语（非生物体）+ 把 + 宾语 + 动词 + 其他成分|把 sentences with a non-living subject|thing/event + 把 + O + V + result\nThe subject of a 把 sentence need not be a person. A natural force, an event, a sound or a piece of news can \"do\" something to the object, which presents cause and result vividly: 大风把树吹倒了、这个消息把大家吓了一跳.\n!The verb still needs a result or other element after it, and the object is definite.\n>连续几天的暴雨【把|被|让|由】村口唯一的一座桥冲坏了。=Several days of torrential rain washed out the only bridge at the entrance to the village.\n>洪水把整个村子都【淹没了|淹没|被淹了|淹着】，救援人员只能坐船进去。=The flood submerged the whole village; rescuers could get in only by boat.\n~一声巨大的响声【把|使|对|向】正在睡觉的村民都吓醒了。=A tremendous crash frightened all the sleeping villagers awake.\n##28\n@到……为止|up to; until; as of|到 + time/point + 为止，… · 到目前为止 · 到此为止\nMarks the end point of a period or process, in time or in extent. 到目前为止 (so far) and 到此为止 (stop here) are the most frequent forms; 截至 is the formal variant used with dates.\n!为止 comes after the time expression and cannot stand alone: 到昨天为止 ✓ 为止昨天 ✗.\n>到目前【为止|以来|以内|以便】，人工智能还无法完全代替人的创造力。=So far, artificial intelligence still cannot fully replace human creativity.\n>【到|在|于|对】去年年底为止，这家公司已经申请了两百多项专利。=As of the end of last year, the company had applied for over two hundred patents.\n~今天的讨论就到此【为止|以后|而已|结果】，下次我们再谈机器人的安全问题。=Let's stop today's discussion here; next time we'll talk about robot safety.\n##29\n@净、一同、大都|only; nothing but · together · mostly|净 + verb · 一同 + verb · 大都 + predicate\n净 (spoken) = only, all the time, nothing but: 别净说好听的. 一同 = together, at the same time and place (written style for 一起). 大都 (dàdōu) = for the most part, the majority.\n!净 as an adverb usually carries complaint. 大都 describes most members of a plural subject; it cannot modify a single item.\n>保护区里的动物【大都|一同|净|特】是国家重点保护的野生动物。=The animals in the reserve are for the most part wild species under key state protection.\n>你怎么【净|大都|一同|较为】拍些花花草草？我们是来观察鸟类的。=Why do you photograph nothing but flowers and plants? We came to watch birds.\n~科学家和当地的村民【一同|大都|净|未必】参加了这次野外考察。=Scientists and local villagers took part in this field survey together.\n##30\n@一时、不时|for the moment · from time to time|一时 + verb (often negative) · 不时 + verb\n一时 = for a short while, for the moment: 一时想不起来 (can't recall just now), 一时冲动 (a momentary impulse). 不时 = now and then, at irregular intervals (written; 不时地 + verb).\n!一时 often explains a temporary failure or a slip; 一时半会儿 = within a short time (spoken).\n>地面的工作人员【不时|一时|一向|仍旧】能听到从太空传来的声音。=From time to time the ground staff could hear voices coming from space.\n>这个问题太专业了，我【一时|不时|再三|大都】回答不上来。=The question is too technical; I can't answer it offhand.\n~火箭升空的那一刻，观众们【一时|不时|净|特地】激动得说不出话来。=At the moment the rocket lifted off, the spectators were for a moment too moved to speak.\n##31\n@仍旧、依旧、一向|still, as before · unchanged · always (up to now)|仍旧/依旧 + predicate · 一向 + habit/quality\n仍旧 and 依旧 say that a state continues unchanged despite time or events; 依旧 is the more literary and can also be a predicate (风景依旧). 一向 describes a consistent habit or quality from the past up to now.\n!一向 is about lasting traits, not single actions, and cannot refer to the future: 他明天一向早起 ✗.\n>退休十年了，他【依旧|恰好|再三|不料】保持着每天六点起床的习惯。=Ten years after retiring, he still keeps his habit of getting up at six every day.\n>我父亲【一向|一时|总算|干脆】反对把老人送进养老院，这次居然主动提了出来。=My father has always been against sending the elderly to care homes, yet this time he brought it up himself.\n~尽管子女一再劝说，老人【仍旧|一向|恰好|特意】坚持一个人住在乡下。=Although his children urged him repeatedly, the old man still insisted on living alone in the countryside.\n##32\n@也好|might as well · whether … or …|clause + 也好 · A 也好，B 也好，都 …\nAt the end of a clause 也好 accepts a situation as not bad after all. Used twice it lists examples and says that the conclusion holds for every one of them (= 无论 A 还是 B).\n!The doubled form needs a main clause with 都、总之 or 反正: 股票也好，基金也好，都有风险.\n>股票【也好|为止|而已|的话】，基金也好，都不能保证只赚不亏。=Whether stocks or funds, neither can guarantee that you only gain and never lose.\n>这次没赶上买那只股票【也好|就好|才好|还好】，现在跌得那么厉害。=It's just as well we didn't manage to buy that stock this time; it has fallen so sharply now.\n~你自己学理财也好，请专业人士帮忙【也好|为止|才行|就算】，总之不能把钱全放在一个地方。=Whether you learn to manage money yourself or get professional help, in any case you mustn't keep all your money in one place.\n##33\n@X归X，Y归Y|X is X, but … · A is one thing, B another|X 归 X，(可是) … · X 归 X，Y 归 Y\nX归X concedes a point and then states that it does not change something else: 批评归批评，工作还得做. The paired form keeps two things strictly apart: 朋友归朋友，生意归生意.\n!It is spoken style; the clause that follows usually begins with 可是、但 or 还是.\n>方便【归|是|算|倒】方便，可是把这么多个人信息交给一个软件，你放心吗？=Convenient it may be, but are you comfortable handing so much personal information to one app?\n>担心归【担心|放心|小心|安心】，该用的功能还是得用。=Worry is one thing; you still have to use the functions you need.\n~朋友归朋友，工作归【工作|朋友|职业|岗位】，他的隐私我不能随便告诉你。=Friendship is friendship and work is work; I can't just tell you his private details.\n##34\n@放着X不Y|have X and yet not Y it|放着 + available thing + 不 + verb，(却/非要) …\nCriticises or wonders at someone who ignores a good or obvious option and does something else instead: 放着现成的不用，非要自己做.\n!X is something ready to hand; the sentence usually continues with the odd choice the person made.\n>他【放着|凭着|趁着|沿着】城里的高薪工作不干，回村里种起了有机蔬菜。=He turned his back on a well-paid city job and went home to his village to grow organic vegetables.\n>村里人都不理解：放着大城市的好日子【不过|不想|没过|别过】，回来吃这个苦干什么？=The villagers couldn't understand: why give up the good life in a big city and come back to this hardship?\n~你放着现成的房子【不住|没住|别住|不在】，为什么非要到外面去租？=You have a house ready and waiting; why insist on renting somewhere else?\n##35\n@这/那也不X，那/这也不Y|not this, not that either|这也不 + X，那也不 + Y，(到底) …\nLists refusals or complaints about everything on offer, showing that the person is hard to please or that nothing works. A summing-up question or comment usually follows.\n!The two halves are parallel and may use the same or different predicates: 这也不行，那也不行.\n>这套嫌贵，那套嫌远，【这也不满意，那也不满意|这也满意，那也满意|这不满意，那才满意|这也不满意，那就满意】，你到底想买什么样的房子？=This one is too dear, that one too far; nothing satisfies you. What kind of flat do you actually want?\n>他这也不敢投，那【也|才|就|却】不敢投，钱在银行里放了十年。=He didn't dare invest in this or in that, so the money sat in the bank for ten years.\n~这也不让做，那也不让做，【到底|干脆|未必|恰好】让我们怎么办？=We're not allowed to do this, not allowed to do that; what exactly are we supposed to do?\n##36\n@主语 + 把 + 宾语（施事）+ 动词 + 其他成分|把 sentences whose object is the one who ends up feeling or acting|cause + 把 + person + V/Adj + 得 … / result\nHere the 把 object is the person who ends up doing or feeling something, and the subject is what caused it: 孩子把妈妈气得睡不着觉 (the child made the mother too angry to sleep); 这个故事把大家感动哭了.\n!The predicate describes the object's state, typically with 得 or a result complement: 把我急坏了、把他累得直不起腰.\n>孩子们写给她的信【把|被|对|向】这位年轻的志愿者感动得流下了眼泪。=The letters the children wrote moved the young volunteer to tears.\n>山路又长又难走，把我们几个城里人【累得|累着|累了|累的】连话都说不出来。=The mountain path was long and hard going and left us city folk too exhausted even to speak.\n~他突然说要留在山区再教一年，把父母急【坏了|过了|着了|起了】。=He suddenly announced he would stay in the mountains to teach for another year, which worried his parents sick.\n##37\n@不禁、赶忙|can't help (doing) · hurriedly|不禁 + verb (emotional reaction) · 赶忙 + verb\n不禁 (bùjīn) = an emotion or reaction arises before one can stop it (不禁笑了起来、不禁想起). 赶忙 = act at once in response, like 连忙; narrative style, only for what has happened.\n!不禁 takes a verb phrase, not a noun. Neither word is used in commands.\n>听到那首熟悉的乐曲，全场观众【不禁|赶忙|特意|恰好】跟着唱了起来。=Hearing that familiar tune, the whole audience couldn't help singing along.\n>演出快开始了，我们【赶忙|不禁|一向|仍旧】找到自己的座位坐了下来。=The performance was about to begin, so we hurried to find our seats and sat down.\n~看到台上的老艺人七十多岁了还在坚持演出，我【不禁|赶忙|未必|干脆】对他十分佩服。=Seeing that the old artist on stage, over seventy, was still performing, I couldn't help admiring him deeply.\n##38\n@特地、特意、偷偷|specially · on purpose (thoughtfully) · secretly|特地/特意 + verb · 偷偷（地）+ verb\n特地 and 特意 both mean doing something specially for one purpose; 特地 stresses the special trip or effort, 特意 the deliberate intention. 偷偷 = without others knowing.\n!Both 特地 and 特意 are positive (a kindness, care). For deliberate wrongdoing use 故意.\n>为了拍好这场戏，导演【特地|偷偷|不禁|未必】请来了一位研究唐代历史的专家。=To shoot this scene well, the director specially brought in an expert on Tang history.\n>拍摄期间，他常常【偷偷|特意|一同|大都】跑到外面去练习，怕别人笑话他。=During filming he often slipped outside to practise in secret, afraid others would laugh at him.\n~这个镜头是导演【特意|偷偷|赶忙|恰好】留给老观众的一个惊喜。=This shot is a surprise the director deliberately kept for long-time fans.\n##39\n@动词/形容词 + 透 + 了|utterly; through and through|Adj/V + 透了\nAs a degree complement 透了 means \"to the extreme\", almost always of something bad or unpleasant: 糟透了、坏透了、伤透了心. 熟透了 (fully ripe) and 湿透了 (soaked through) keep the literal sense of \"all the way through\".\n!Do not use it for praise: 好透了 ✗ → 好极了.\n>上半场我们队的表现糟【透了|得了|着了|过了】，连一次像样的进攻都没有。=Our team's performance in the first half was utterly dreadful; there wasn't a single decent attack.\n>一场大雨把运动员们的衣服都淋【透|极|很|够】了。=A downpour soaked the players' shirts right through.\n~裁判那个错误的决定让球迷们伤【透|完|遍|满】了心。=The referee's wrong decision broke the fans' hearts completely.\n##40\n@一时……一时……|now … now …|一时 + state 1，一时 + state 2\nThe paired form shows states or actions alternating quickly and unpredictably, like 一会儿…一会儿… but in written style: 天气一时晴，一时雨.\n!The two parts are usually opposites or sharply contrasting, and the subject is shared.\n>展厅里的灯光一时明，【一时|一同|一向|不时】暗，给人一种神秘的感觉。=The lighting in the exhibition hall was now bright, now dim, giving a sense of mystery.\n>面对这件作品，观众【一时|一再|再三|恰好】觉得亲切，一时又觉得陌生。=Before this work, viewers feel at one moment that it is familiar, at the next that it is strange.\n~他对自己的设计一时充满信心，一时【又|才|就|便】怀疑它毫无价值。=One moment he was full of confidence in his design, the next he doubted it had any value at all.\n##41\n@看/瞧 + 把 + 宾语 + X得 · 看你X的 / 瞧他X的|look how … you are!|看/瞧把 + person + Adj/V + 得（…）· 看你/瞧他 + Adj/V + 的\nBoth are spoken exclamations about someone's visible state: amusement, affection or mild mockery. The sentence can simply stop at 得 or 的 and leave the degree to the imagination: 看把你高兴得！ 瞧他得意的！\n!The tone decides the meaning: warm teasing among friends, sarcasm about a third person.\n>不就是拿了个冠军吗？瞧把他得意【得|着|过|地】！=It's only a championship, isn't it? Look how pleased with himself he is!\n>我跟你开玩笑呢，【看你|让你|把你|给你】紧张的！=I was only joking; look how nervous you are!\n~看把孩子们高兴【得|地|着|过】，一个个又跳又叫。=Look how happy the children are, every one of them jumping and shouting.\n##42\n@X了就X了，（没）有……|what's done is done|V + 了就 + V + 了，(没)有什么(好) …\nAccepts something that has already happened as not worth fretting over; the second clause dismisses the worry with 没什么大不了的、有什么好难过的 and the like.\n!The same verb appears twice. The pattern comforts or brushes off; it is not used for future events.\n>稿子丢了就【丢了|丢着|丢的|丢过】，没什么大不了的，我再写一遍就是了。=The manuscript's lost and that's that; it's no great matter, I'll simply write it again.\n>比赛输了【就|才|还|却】输了，有什么好难过的？下次再来。=We lost the match, and that's that; what is there to be sad about? There's always next time.\n~话说了就说【了|着|的|过】，现在后悔也没有用。=What's said is said; regretting it now is no use.\n##43\n@专用名量词：串、滴、枝、扇、卷|special measure words|number + measure word + noun\n串 strings and bunches (一串葡萄、一串钥匙) · 滴 drops (一滴水、几滴眼泪) · 枝 things with stems (一枝花) · 扇 doors and windows (一扇门) · 卷 juǎn rolls (一卷纸、一卷画) and 卷 juàn volumes of a book (第三卷).\n!卷 changes tone with meaning: juǎn for something rolled up, juàn for a volume or an exam paper (试卷).\n>茶室的墙上挂着一【卷|串|滴|扇】还没打开的古画。=On the wall of the tea room hangs an old painting, still rolled up.\n>推开那【扇|卷|枝|滴】木门，就能闻到一股淡淡的茶香。=Push open that wooden door and you catch a faint fragrance of tea.\n~他在瓷瓶里插了一【枝|串|扇|卷】梅花，整个房间顿时有了生气。=He put a spray of plum blossom in the porcelain vase, and the whole room at once came alive.\n##44\n@番|measure word 番: a round of · a kind of|verb + 一番 (+ noun) · 别有一番 + noun · 翻（了）一番\nAs a verbal measure, 一番 means doing something once but thoroughly, with time and effort (考虑一番、打扮一番). With nouns it means \"a kind of\" for abstract things (一番话、一番心意、别有一番风味). 翻一番 = to double.\n!Only 一 and 几 normally precede 番; it suits actions that take effort, not instantaneous ones.\n>师父把他叫到跟前，认真地教导了一【番|卷|串|扇】。=The master called him over and gave him a thorough talking-to.\n>在小剧场里听戏，别有一【番|滴|枝|扇】风味。=Listening to opera in a small theatre has a flavour all of its own.\n~经过三年的苦练，他每个月的演出场次翻了一【番|卷|串|滴】。=After three years of hard practice, the number of his performances each month doubled.\n##45\n@不X不……，一X……|you don't … until you X, and once you X …|不 + V + 不知道，一 + V + result\nThe first half says that without doing X one would never know; the second says that the moment X is done, a surprising result appears: 不看不知道，一看吓一跳.\n!The same verb is used in both halves, and the result is something unexpected.\n>不看不知道，【一看|不看|看了|再看】吓一跳：这件不起眼的陶罐居然有五千年的历史。=You'd never know without looking, and one look gives you a start: this unremarkable clay jar is actually five thousand years old.\n>考古这门学问，不学不觉得，一【学|听|看|做】才发现里面的知识太丰富了。=Archaeology is a subject you don't appreciate until you study it; once you do, you discover how rich it is.\n~这茶不尝不知道，一尝【就|才能|却|还】喜欢上了。=You don't know this tea until you taste it, and one taste is enough to make you love it.\n##46\n@A一 + 量词，B一 + 量词 · 东一A，西一A|one after another from all sides · here and there, all over the place|你一言，我一语 · 左一句，右一句 · 东一 + M，西一 + M\n你一言，我一语 / 左一个，右一个: different people or directions each contribute one, so that things pile up quickly. 东一A，西一A: things are scattered untidily or done without any system (东一件，西一件；东一句，西一句).\n!The first frame is lively and neutral; the second usually criticises disorder.\n>年夜饭桌上，大家你一言，我一【语|嘴|说|谈】，热闹极了。=At the New Year's Eve dinner everyone chimed in one after another; it was wonderfully lively.\n>孩子们的玩具和灯笼东一个，【西|南|右|外】一个，扔得满院子都是。=The children's toys and lanterns lay one here, one there, all over the courtyard.\n~亲戚们左一个红包，【右|西|后|下】一个红包，把孩子高兴坏了。=With relatives pressing red envelopes on him from every side, the child was beside himself with joy.\n##47\n@早（也）不X，晚（也）不X|of all the times to X!|早(也)不 + V，晚(也)不 + V，偏偏/刚 + bad timing\nComplains that something happened at exactly the wrong moment: not earlier, not later, but just when it was least convenient. The third clause states the awkward timing.\n!It is an idiomatic grumble, not a real negation: the event did happen.\n>你早不来，晚不来，【偏偏|未必|总算|以便】在我们刚把元宵吃完的时候来了。=Of all the times to come, you turn up just when we've finished the sweet dumplings.\n>这雨早也不下，晚【也不|才不|就不|却不】下，灯会刚开始就下起来了。=Of all moments for it to rain: it started just as the lantern fair began.\n~电早不停，晚不停，客人【刚|曾|未|将】进门就停了。=Of all times for a power cut: it went off just as the guests came through the door.\n##48\n@X到Y头上来了 · 好你个X|how dare you X me! · why, you …!|V + 到 + person + 头上来了 · 好你个 + name/noun，…\nV到…头上来了 protests that an unwelcome action (cheating, blaming, testing) has been aimed at a person who should have been safe from it. 好你个X opens an accusation with mock or real indignation at someone caught out.\n!Both are strongly colloquial and common in comic dialogue (相声) and drama; among friends they are often playful.\n>我教了三十年方言，你居然考【到|在|给|往】我头上来了？=I've taught dialects for thirty years, and you actually think you can test me?\n>【好你个|好不容易|真有个|算了个】小李，原来昨天那个电话是你故意学我的口音打的！=Why, you rascal, Xiao Li! So yesterday's phone call was you putting on my accent on purpose!\n~明明是他自己说错了，怎么怪到我头上【来了|去吧|上了|起来】？=He's plainly the one who got it wrong, so how come the blame lands on me?\n","kw":"##1 A mortgage at the bank\nA:您好，我想咨询一下住房贷款的事。我看中了一套一百二十平方米的房子。=Hello, I'd like to ask about a home loan. I've set my heart on a flat of 120 square metres.\nB:好的。请问您打算贷多少年？目前的年利息是百分之三点五，略低于去年。=Certainly. Over how many years do you plan to borrow? The annual interest is currently 3.5%, slightly lower than last year.\nA:我想贷二十年。每个月还多少比较合适？=Twenty years. How much is it sensible to repay each month?\nB:一般建议每月还款不超过家庭收入的一半，否则会影响正常的生活。=We generally advise that monthly repayments stay under half the household income; otherwise normal life is affected.\nA:明白了。如果以后手头宽裕了，可以提前还款吗？=I see. If I'm better off later, can I repay early?\nB:可以，不过得于还款满一年之后提出申请，并且提前一个月通知银行。=Yes, but you must apply after a full year of repayments and give the bank one month's notice.\n?关于提前还款，可以知道什么？|还款满一年后才能申请|任何时候都可以申请|需要支付很高的费用|银行不允许\n##2 A cancelled flight\nA:你好，我刚收到短信，说我的航班取消了，到底是怎么回事？=Hello, I've just had a text saying my flight is cancelled. What exactly is going on?\nB:非常抱歉，昆明那边有雷雨，航班因天气原因无法起飞。=I'm very sorry. There are thunderstorms over Kunming, and the flight cannot take off owing to the weather.\nA:可是我明天上午有一个重要的谈判，今天必须赶到。=But I have an important negotiation tomorrow morning; I must get there today.\nB:我帮您查一下……今晚八点有一班经成都转机的，凌晨一点能到，您看行吗？=Let me check… There's one at eight tonight via Chengdu, arriving at one in the morning. Would that do?\nA:只能这样了。换航班需要另外付费吗？=It will have to. Is there an extra charge for changing flights?\nB:因天气原因造成的变更是免费的，我们还会为您提供一张晚餐券。=Changes caused by weather are free, and we will also give you a dinner voucher.\n?女的最后决定怎么办？|改乘经成都转机的航班|明天再出发|取消这次出差|改坐高铁去昆明\n##3 A faulty phone\nA:我上个月在你们店买的手机，才用了三个星期，屏幕就自己黑了。=The phone I bought in your shop last month went black by itself after only three weeks.\nB:您先别急。请问您带发票和保修卡了吗？=Please don't worry. Have you brought the receipt and the warranty card?\nA:都带了。我要求换一部新的，不想修。=Both. I want a new one, not a repair.\nB:按照规定，购买十五天之内出现质量问题可以换货，超过十五天只能免费保修。=Under the rules, a quality fault within fifteen days of purchase means an exchange; after fifteen days we can only repair it free.\nA:可是这明显是质量问题，不是我使用不当造成的。=But this is plainly a quality problem, not something I caused by misuse.\nB:我理解您的心情。我们先送去检测，至于能不能换新的，要等检测报告出来再决定。=I understand how you feel. We'll send it for testing first; as for whether it can be replaced, that will be decided once the report is out.\n?店员为什么不能马上给女的换新手机？|购买已经超过十五天|女的没带发票|手机是女的摔坏的|店里没有新手机了\n##4 Health check results\nA:张医生，我的体检报告出来了吗？=Dr Zhang, is my check-up report ready?\nB:出来了。总的来说问题不大，除血压偏高以外，其他检查结果都在正常范围之内。=Yes. On the whole nothing serious: apart from rather high blood pressure, every other result is within the normal range.\nA:血压高需要吃药吗？我父亲也有这个毛病。=Do I need medicine for it? My father has the same problem.\nB:暂时用不着。你这种情况跟遗传有一定关系，但更主要的是生活习惯。=Not for now. In your case heredity plays some part, but lifestyle matters more.\nA:我确实经常熬夜，吃得也比较咸。=I do often stay up late, and my food is on the salty side.\nB:所以除了少吃盐以外，你还得保证睡眠，每周至少运动三次，三个月以后再来复查。=So besides eating less salt, you must get enough sleep and exercise at least three times a week; come back for another check in three months.\n?医生建议女的怎么做？|改变生活习惯，三个月后复查|马上开始吃药|住院做进一步检查|让父亲也来体检\n##5 Buying a used car\nA:你不是说要买车吗？看得怎么样了？=Weren't you going to buy a car? How is the search going?\nB:新车太贵，我打算买辆二手的。昨天去看了一辆，才开了三万公里，价格特合适。=New ones are too dear, so I'm going for a used one. I saw one yesterday with only 30,000 kilometres on it, and the price is really good.\nA:买二手车可得小心。有没有请懂车的人帮你检查一下？=You need to be careful with used cars. Did you get someone who knows cars to check it?\nB:请了。师傅说发动机的状况较为理想，就是刹车有点儿问题，需要换零件。=I did. The mechanic says the engine is in fairly good shape, but the brakes have a problem and need parts replaced.\nA:那可不是小事。刹车要是出了故障，后果异常严重。=That's no small matter. If the brakes fail, the consequences are extremely serious.\nB:我知道，所以我跟卖家说了，必须先把刹车修好，我才付款。=I know, so I told the seller the brakes must be fixed before I pay.\n?男的看中的那辆车有什么问题？|刹车需要修理|开的公里数太多|价格太高|发动机状况不好\n##6 Waiting for a visa\nA:我下个月要去欧洲参加一个博览会，签证还没办下来，急死了。=I'm going to a trade fair in Europe next month and my visa still hasn't come through. I'm frantic.\nB:你是什么时候递交的材料？=When did you hand in your documents?\nA:两个星期以前。旅行社说一般十个工作日就能出来。=Two weeks ago. The travel agency said it normally takes ten working days.\nB:现在是旅游高峰，申请的人多，十个工作日未必够。你买机票了吗？=It's peak travel season and lots of people are applying; ten working days may not be enough. Have you bought your ticket?\nA:还没有，我想等签证下来再买。=Not yet. I want to wait until the visa is issued.\nB:这样做是对的。另外，你最好再准备一份公司的工作证明，万一要求补充材料，可以马上交上去。=That's the right thing to do. Also, you'd better get a letter of employment from your company ready, so that if more documents are requested you can hand it in at once.\n?男的建议女的做什么？|准备一份工作证明|马上买机票|换一家旅行社|取消这次出国\n##7 Noisy neighbours\nA:都晚上十一点了，楼上怎么还在搬东西？吵得我头疼。=It's eleven at night; why are they still moving things upstairs? The noise is giving me a headache.\nB:人家刚搬来，估计还没收拾完。再忍一忍吧。=They've only just moved in and probably haven't finished unpacking. Bear with it a little longer.\nA:已经连续三天了！我明天一早还要开会呢。=It's been three days in a row! And I have a meeting first thing tomorrow.\nB:那我上去跟人家说一声？不过态度得好一点儿，以后还要做邻居。=Shall I go up and have a word with them? We should be polite, though; we'll be neighbours from now on.\nA:你去说吧，我怕我一开口就跟人家吵起来。=You go. I'm afraid I'd start a quarrel the moment I opened my mouth.\nB:行。我顺便带点儿水果上去，就当是欢迎新邻居了。=All right. I'll take some fruit up while I'm at it, as a welcome to the new neighbours.\n?男的打算怎么处理这件事？|客气地跟邻居沟通|打电话找物业|报警|搬到别的地方住\n##8 Dad and the housework\nA:爸，您的腰还没好，怎么又在擦地板啦？=Dad, your back isn't better yet. Why are you mopping the floor again?\nB:地上都是灰，我看着难受。躺了一个星期，骨头都硬了。=The floor's covered in dust and I can't bear to look at it. After a week in bed my bones have gone stiff.\nA:医生不是说了嘛，这个月不能干重活儿。=The doctor told you, didn't he: no heavy work this month.\nB:擦擦地算什么重活儿？你们上班那么忙，家里总得有人收拾。=Since when is mopping heavy work? You're all so busy at work; someone has to keep the place tidy.\nA:我们请个钟点工不就行了嘛，一个星期来两次，花不了多少钱。=We can simply hire a cleaner by the hour, can't we? Twice a week won't cost much.\nB:好啦好啦，听你的。不过人家擦得干不干净，我可得检查。=All right, all right, have it your way. But I'm going to check whether they clean properly.\n?女儿建议怎么解决做家务的问题？|请钟点工|自己辞职回家|让妈妈来做|等爸爸的腰好了再说\n##9 Renovating the flat\nA:咱们家的装修方案你到底定了没有？设计师都催了好几次了。=Have you actually settled on the renovation plan? The designer has chased us several times.\nB:我左思右想，还是觉得客厅的墙不应该拆，拆了以后冬天不保暖。=I've thought it over and over, and I still feel the living-room wall shouldn't come down; without it the room won't keep warm in winter.\nA:可是不拆的话，客厅显得太小了。=But if it stays, the living room looks too small.\nB:要不这样，墙留一半，改成一个书架，既宽敞又实用。=How about this: keep half the wall and turn it into a bookcase. Spacious and practical.\nA:这个主意不错。那厨房呢？你上次不是嫌柜子太少吗？=Good idea. And the kitchen? Didn't you complain last time that there were too few cupboards?\nB:厨房就按设计师说的做吧。咱们别再改这改那了，再拖下去，过年都搬不进去。=Let's do the kitchen as the designer says. No more changing this and that; if we drag on, we won't be in by New Year.\n?关于客厅的墙，他们最后怎么决定的？|留一半，改成书架|全部拆掉|完全不动|等过年以后再说\n##10 A care home for Grandpa\nA:给爷爷找养老院的事有进展了吗？=Any progress on finding a care home for Grandpa?\nB:我跑了七八家，好不容易才找到一家合适的，离咱们家只有两站地。=I went to seven or eight and finally found a suitable one, only two stops from our place.\nA:条件怎么样？有没有专门的医生？=What are the conditions like? Is there a doctor on site?\nB:有，二十四小时值班。房间是单人间，朝南，还带一个小阳台。=Yes, on duty round the clock. The rooms are singles, south-facing, each with a little balcony.\nA:听起来不错。可是爷爷一向不愿意离开家，他能同意吗？=Sounds good. But Grandpa has never wanted to leave home. Will he agree?\nB:我带他去参观了一次，他看到那儿有人下象棋、练书法，态度就没那么坚决了，答应先试住一个月。=I took him to see it once. When he saw people there playing chess and practising calligraphy, he softened and agreed to a one-month trial.\n?爷爷为什么改变了态度？|看到那儿的生活挺丰富|家人坚决要求|养老院是免费的|他的身体变差了\n##11 Too many hobby classes\nA:你们打算给孩子报几个兴趣班？我儿子已经报了四个了。=How many hobby classes are you signing your child up for? My son already has four.\nB:四个？孩子才七岁，周末连玩儿的时间都没有了吧？=Four? He's only seven. He can't have any time left to play at weekends.\nA:我也心疼，可是别的孩子都在学，我怕他输在起点上。=It hurts me too, but all the other children are learning, and I'm afraid he'll fall behind at the starting line.\nB:学得多不等于学得好。我觉得与其样样都学，不如让他专心学一两样真正喜欢的。=Learning a lot isn't the same as learning well. Rather than a bit of everything, I'd let him focus on one or two things he truly likes.\nA:那倒也是。他最近一提起钢琴课就发愁，画画儿倒是很主动。=That's true. Lately he frets at the mere mention of piano lessons, yet he's keen on drawing.\nB:那就把钢琴停了吧。孩子有兴趣，才能坚持下去。=Then drop the piano. A child only keeps going when he's interested.\n?男的的主要观点是什么？|让孩子专心学真正喜欢的|兴趣班报得越多越好|孩子不应该上兴趣班|钢琴比画画儿更重要\n##12 A quarrel about money\nA:这个月的信用卡账单怎么又超了三千多？=How come this month's credit card bill is over by three thousand again?\nB:我给我爸妈买了一台按摩椅，他们年纪大了，腰腿都不好。=I bought my parents a massage chair. They're getting on, and their backs and legs are bad.\nA:关心父母我不反对，可是这么大的支出，你是不是应该先跟我商量一下？=I've nothing against looking after your parents, but shouldn't you talk to me first about spending that much?\nB:我怕你不同意嘛。再说，上次你给你弟弟转了一万块，不也没告诉我吗？=I was afraid you'd say no. Besides, you transferred ten thousand to your brother last time without telling me, didn't you?\nA:得了得了，咱们别再提以前的事了。以后超过两千块的开支，谁都得先说一声，行不行？=Enough, enough, let's not rake up the past. From now on, anything over two thousand, we each say so first. Agreed?\nB:行，算了，这次是我不对。下个月我少买两件衣服，把钱省回来。=Agreed. Never mind, I was in the wrong this time. Next month I'll buy fewer clothes and save the money back.\n?他们最后达成了什么约定？|大的开支要先互相商量|以后不再用信用卡|每个月给父母两千块|各自管理自己的钱\n##13 Scholarship rules\nA:老师，我想了解一下国家奖学金的申请条件。=Sir, I'd like to know the conditions for applying for the national scholarship.\nB:凡是二年级以上、平均成绩排在专业前百分之十的学生，都有资格申请。=Any student in the second year or above whose average is in the top ten per cent of the major is eligible.\nA:我的成绩符合要求。除了成绩以外，还看别的方面吗？=My marks qualify. Is anything considered besides marks?\nB:还要看科研成果和社会实践。比如发表过论文，或者参加过志愿服务，都可以加分。=Research output and community work too. A published paper or volunteer service, for example, earns extra points.\nA:我去年在山区当了一个月的志愿者老师，这个算吗？=Last year I spent a month as a volunteer teacher in the mountains. Does that count?\nB:当然算。你把证明材料准备好，于本月二十号之前交到学院办公室。=Of course. Get the supporting documents ready and hand them in at the college office before the 20th of this month.\n?申请奖学金除了看成绩，还看什么？|科研成果和社会实践|家庭的经济情况|老师的推荐信|外语水平\n##14 Applying abroad\nA:听说你在申请国外的研究生？准备得怎么样了？=I hear you're applying for a postgraduate course abroad. How are the preparations going?\nB:压力很大。我想去的那所大学，除非语言考试达到七分，才会考虑你的申请。=I'm under a lot of pressure. The university I want will only consider your application if you score seven in the language test.\nA:你上次考了多少？=What did you get last time?\nB:六分半，就差零点五。写作部分总是拿不到高分。=Six and a half, just half a point short. I can never score high on the writing part.\nA:我有个同学去年考了八分，要不要我介绍你们认识？=A classmate of mine got eight last year. Shall I introduce you?\nB:太好了！要是她能给我一些指导，我有信心下个月再考一次。=That would be great! With some guidance from her, I'd feel confident about taking it again next month.\n?男的申请遇到了什么困难？|语言成绩还没达到要求|没有教授愿意推荐|学费太贵|错过了申请时间\n##15 Too much borrowed text\nA:李老师，学院检查了我的论文，说有三分之一的内容和别人的文章重复。=Professor Li, the college checked my thesis and says a third of it duplicates other people's writing.\nB:这个比例太高了。除非降到百分之十五以下，否则学院不会允许你毕业。=That proportion is far too high. Unless you get it below fifteen per cent, the college will not let you graduate.\nA:可是很多内容是我引用的资料，并不是抄的。=But much of it is material I quoted, not copied.\nB:引用可以，但必须写明来源，而且不能一大段一大段地照着写，要用自己的话重新表达。=Quoting is fine, but you must state the source, and you can't reproduce whole paragraphs; you have to put it in your own words.\nA:我明白了。那我还有多长时间修改？=I understand. How long do I have to revise?\nB:两个星期。你先把第二章和第四章重写一遍，写完发给我看。=Two weeks. Rewrite chapters two and four first and send them to me when you're done.\n?老师要求学生怎么做？|用自己的话重写部分内容|换一个论文题目|删掉所有引用的资料|推迟一年毕业\n##16 Designing an online course\nA:王老师，我们打算把您的“中国古代文学”做成网络课程，想听听您的意见。=Professor Wang, we plan to turn your \"Classical Chinese Literature\" into an online course and would like your views.\nB:我很支持。不过在网上上课，学生的注意力很容易分散，一节课最好不要超过十五分钟。=I'm all for it. But online, students' attention wanders easily; a lesson had better not exceed fifteen minutes.\nA:我们也是这么考虑的。另外，每一节课后面都会安排几道练习题，以便学生检查自己的学习效果。=That's our thinking too. Each lesson will also be followed by a few exercises so that students can check what they've learned.\nB:这个设计很好。还可以开设一个论坛，以便大家交流读书的感想。=A good design. You could also set up a forum so that everyone can exchange thoughts on their reading.\nA:那考试怎么办呢？有人担心网上考试不够公平。=And the exam? Some people worry that online exams aren't fair enough.\nB:可以把平时的讨论和作业也算进成绩里，不能只看最后一次考试。=Count regular discussion and homework towards the mark as well; don't look only at the final exam.\n?王老师对考试有什么建议？|把平时表现也算进成绩|取消考试|只看最后一次考试|让学生到学校来考\n##17 A worried parent\nA:张老师，我女儿最近一再说不想上学，我很担心。=Mr Zhang, my daughter keeps saying she doesn't want to go to school. I'm very worried.\nB:我也注意到了。她这学期的成绩下降得比较明显，上课的时候常常发呆。=I've noticed too. Her marks have dropped noticeably this term, and she often stares into space in class.\nA:是不是我们给她的压力太大了？我再三告诉她必须考进前五名。=Are we putting too much pressure on her? I've told her again and again she must make the top five.\nB:恐怕是的。这个年龄的孩子很要面子，目标定得过高，反而会让她失去信心。=I'm afraid so. Children of this age care a great deal about face; a target set too high can make her lose confidence instead.\nA:那我们应该怎么办？=Then what should we do?\nB:先别谈名次，多听听她心里的想法。必要的话，可以请学校的心理老师跟她聊一聊。=Leave rankings aside for now and listen more to what's on her mind. If need be, the school counsellor can have a chat with her.\n?老师认为孩子不想上学的原因可能是什么？|父母的要求太高|和同学关系不好|身体不舒服|不喜欢老师\n##18 Presenting a research project\nA:下面请陈博士介绍一下他的研究课题。=Next, Dr Chen will introduce his research topic.\nB:谢谢。我所研究的是城市噪声对儿童睡眠的影响。我们跟踪调查了三百个家庭，时间长达两年。=Thank you. What I study is the effect of urban noise on children's sleep. We followed three hundred families over two years.\nA:你们得出了什么结论？=What conclusion did you reach?\nB:数据显示，长期生活在噪声较大环境中的儿童，入睡时间平均要长二十分钟，记忆力也受到一定影响。=The data show that children who live long-term in noisier surroundings take on average twenty minutes longer to fall asleep, and their memory is affected to some degree.\nA:这个结论已经被其他研究所证实了吗？=Has this conclusion been confirmed by other research?\nB:国外有类似的研究，但调查的人数较少。就我所知，这是国内第一次大规模的调查。=There is similar research abroad, but with fewer subjects. As far as I know, this is the first large-scale survey in this country.\n?关于这项研究，下列哪项正确？|调查了三百个家庭|只进行了两个月|研究对象是老年人|国外从来没有人研究过\n##19 Two job offers\nA:听说你同时收到了两家公司的录用通知？恭喜啊！=I hear you've had offers from two companies at once? Congratulations!\nB:别提了，我正发愁呢。一家是大型国有企业，稳定但是工资一般；一家是新兴的科技公司，薪水高一倍，可是风险也大。=Don't. I'm fretting over it. One is a big state-owned firm, stable but with average pay; the other is an up-and-coming tech company with double the salary but a lot of risk.\nA:你自己更倾向于哪一家？=Which do you lean towards yourself?\nB:我想去科技公司闯一闯，可是父母坚决反对，说那种公司说倒闭就倒闭。=I'd like to try my luck at the tech company, but my parents are dead against it; they say firms like that go bust overnight.\nA:你才二十五岁，要么趁年轻去冒一次险，要么一辈子都不敢冒险了。=You're only twenty-five. Either take a risk while you're young, or you'll never dare take one in your life.\nB:你说得对。就算失败了，积累的经验也是别人拿不走的。=You're right. Even if I fail, the experience I gain is something nobody can take away.\n?女的是什么态度？|支持男的去科技公司|认为国有企业更好|建议男的听父母的|觉得两家都不合适\n##20 The annual appraisal\nA:小周，这是你今年的考核结果，总体评价是“良好”。=Xiao Zhou, here is your appraisal for this year. The overall rating is \"good\".\nB:谢谢经理。不过我有点儿意外，我以为今年能评上“优秀”。=Thank you. I'm a little surprised, though; I thought I'd be rated \"excellent\" this year.\nA:你的业务能力是公认的，问题在于团队合作。有同事反映，你很少跟别人分享信息。=Your professional ability is acknowledged by all. The issue is teamwork. Colleagues report that you seldom share information.\nB:我只是觉得每个人把自己的工作做好就够了。=I just felt it was enough for each person to do their own job well.\nA:就算你一个人做得再出色，也代替不了整个团队。明年公司打算让你带一个项目组，这方面必须加强。=However brilliantly you work alone, you can't replace a whole team. Next year the company plans to have you lead a project group, so you must strengthen this.\nB:我明白了。我会主动和大家多沟通的。=I understand. I'll take the initiative to communicate more with everyone.\n?经理认为小周需要改进什么？|团队合作|业务能力|工作态度|上班的时间\n##21 Negotiating a price\nA:贵公司的产品我们很感兴趣，不过价格方面，希望能再降百分之八。=We're very interested in your products, but on price we hope you can come down another eight per cent.\nB:我们的价格虽不是最低的，但包含了三年的免费维修，算起来其实很划算。=Our price isn't the lowest, but it includes three years of free maintenance; all told, it's actually good value.\nA:可是我们的订货量很大，第一批就要五千台。=But our order is large: five thousand units in the first batch alone.\nB:这样吧，如果贵方能把订货量提高到八千台，并且先付一半货款，我们可以降百分之五。=Let's say this: if you raise the order to eight thousand units and pay half up front, we can come down five per cent.\nA:百分之五……我需要向总部汇报一下。=Five per cent… I'll need to report to head office.\nB:没问题。我们的条件保留到本周五，希望能听到好消息。=No problem. Our offer stands until this Friday; we hope to hear good news.\n?男的提出了什么条件？|增加订货量并先付一半货款|延长维修的时间|降价百分之八|本周五以前付全部货款\n##22 A product crisis\nA:王总，出事了。我们上个月出口的那批玩具，被检测出材料不合格。=Mr Wang, something's happened. The batch of toys we exported last month has been found to contain substandard materials.\nB:怎么会这样？出厂前不是都检验过了吗？=How can that be? Weren't they all inspected before leaving the factory?\nA:是检验过。不料供应原料的厂家中途换了原料，却没有通知我们。=They were. But the raw-material supplier unexpectedly changed materials midway without notifying us.\nB:现在追究责任没有意义。那批货一共有多少？卖出去了多少？=There's no point assigning blame now. How many were in the batch? How many have been sold?\nA:两万件，已经卖出去大约三千件。=Twenty thousand, of which about three thousand have been sold.\nB:立刻发布公告，全部收回，损失由公司承担。信用比利润更重要。=Issue a notice at once and recall them all; the company will bear the loss. Trust matters more than profit.\n?王总决定怎么处理这件事？|把产品全部收回|追究厂家的责任|先不对外公布|降价继续销售\n##23 The bid is in\nA:方案总算交上去了！这三天我加起来只睡了十个小时。=The proposal is in at last! I've slept ten hours in total over these three days.\nB:辛苦了。我听说这次一共有六家公司参加竞争？=Well done. I hear six companies are competing this time?\nA:是啊，而且有两家是行业里的老企业，实力比我们强得多。=Yes, and two are long-established firms in the industry, far stronger than we are.\nB:那我们的优势在哪儿？=So where is our advantage?\nA:我们的方案把完成的时间缩短了两个月，这恰好是对方最看重的一点。=Our plan cuts the completion time by two months, which happens to be exactly what the client values most.\nB:要是真能拿下这个项目，我请整个部门去海边度假。=If we really win this project, I'll take the whole department on a seaside holiday.\n?他们公司的方案有什么优势？|完成的时间更短|价格最低|公司历史最长|参加的人最多\n##24 A side job\nA:你最近脸色很差，是不是又接了什么兼职？=You've looked terrible lately. Have you taken on another side job?\nB:晚上帮一家公司翻译资料，一个月能多挣五千块。=I translate documents for a company in the evenings; it brings in an extra five thousand a month.\nA:你明明白天的工作已经够累了，为什么还要这么拼命呢？=Your day job is plainly tiring enough already. Why push yourself so hard?\nB:还房贷的压力大啊。再说，翻译倒是不算辛苦，就是时间不够用。=The mortgage is a heavy burden. Besides, translating isn't actually hard work; there just aren't enough hours.\nA:我看你干脆跟领导谈谈，申请调到翻译部去，把爱好变成正式工作。=If you ask me, just talk to your boss and apply for a transfer to the translation department; turn your hobby into your proper job.\nB:这我倒没想过。翻译部最近确实在招人，我明天就去问问。=I hadn't thought of that. The translation department is in fact recruiting; I'll go and ask tomorrow.\n?女的建议男的怎么做？|申请调到翻译部|辞掉现在的工作|不要再还房贷|再多做一份兼职\n##25 A low-carbon household\nA:你怎么自己带着购物袋和饭盒来超市？=Why have you brought your own shopping bags and lunch boxes to the supermarket?\nB:我们家正在尝试“低碳生活”：少用一次性用品，多买无包装的蔬菜。=Our family is trying \"low-carbon living\": fewer disposables, more vegetables without packaging.\nA:听起来很麻烦。一个人这样做，对环境能有多大作用？=Sounds like a lot of bother. How much difference can one person make to the environment?\nB:一个家庭一年能少扔两百多个塑料袋。要是全市有十分之一的家庭这样做，数字就很惊人了。=One household can throw away two hundred fewer plastic bags a year. If a tenth of the city's households did the same, the figure would be striking.\nA:那倒也是。不过反季节的水果你还买吗？我听说运输过程排放很大。=True enough. Do you still buy out-of-season fruit, though? I hear the transport produces a lot of emissions.\nB:尽量不买。我现在只挑本地当季的，价格便宜，味道也好。=I avoid it as far as I can. I now pick only local, seasonal produce: cheaper, and it tastes better too.\n?男的为什么自己带购物袋？|为了减少使用一次性用品|超市不提供袋子|为了省钱|家人要求的\n##26 Parents in a smart community\nA:你父母适应新小区的生活了吗？我听说那儿是个“智慧社区”。=Have your parents settled into the new estate? I hear it's a \"smart community\".\nB:刚开始很不习惯。进门要识别面部，交水电费要用手机，连垃圾桶都是自动式的。=Not at all at first. Face recognition at the door, utility bills paid by phone; even the rubbish bins are automatic.\nA:老年人面对数字化的东西，确实需要一个过程。=For older people, digital things do take some getting used to.\nB:好在社区想得很周到，专门保留了人工窗口，还定期给老人上培训课。=Luckily the community is thoughtful: it has deliberately kept staffed service windows and runs regular training classes for the elderly.\nA:这一点很重要。技术再先进，也不能把一部分人挡在外面。=That matters. However advanced the technology, it mustn't shut some people out.\nB:是啊。我妈现在已经学会用手机挂号了，还说要教别的老人呢。=Quite. My mum has now learned to book hospital appointments by phone, and says she wants to teach the others.\n?社区为老年人做了什么？|保留人工窗口并提供培训|免费送智能手机|取消了面部识别|派人上门收水电费\n##27 Rescue after the flood\nA:你们救援队是什么时候到达灾区的？=When did your rescue team reach the disaster area?\nB:接到通知后两个小时就出发了。可是洪水把公路冲断了，我们只能步行进山。=We set off two hours after getting the call. But the flood had cut the road, so we could only go into the mountains on foot.\nA:当时村里的情况怎么样？=What was the situation in the village then?\nB:大水把一楼全淹没了，一百多位村民被困在屋顶上，其中有不少老人和孩子。=The water had submerged every ground floor, and over a hundred villagers were trapped on rooftops, many of them old people and children.\nA:你们是怎么把他们转移出来的？=How did you get them out?\nB:用橡皮船一趟一趟地运，从下午一直干到第二天凌晨，总算一个不少地都救了出来。=We ferried them trip after trip in rubber boats, from the afternoon until the small hours, and in the end got every single one out.\n?救援队为什么步行进山？|公路被洪水冲断了|没有救援车辆|山里不允许开车|为了节省时间\n##28 Will AI take our jobs?\nA:你觉得人工智能会让我们这些做翻译的失业吗？=Do you think artificial intelligence will put translators like us out of work?\nB:到目前为止，机器翻译说明书、合同这类文件已经相当准确了，速度更是人比不上的。=So far, machine translation of things like manuals and contracts is already quite accurate, and no human can match its speed.\nA:那我们不是很快就没工作了吗？=Then won't we soon be out of a job?\nB:也不至于。小说、诗歌里的感情和文化背景，机器还理解不了。=It won't come to that. The feeling and cultural background in novels and poetry are still beyond machines.\nA:这么说，今后只会简单翻译的人会被淘汰，高水平的反而更受欢迎？=So in future those who can only do simple translation will be weeded out, while the highly skilled will be even more in demand?\nB:没错。与其担心被代替，不如想想怎么利用它提高自己的效率。=Exactly. Rather than worrying about being replaced, think about how to use it to raise your own efficiency.\n?男的认为翻译这个职业的未来怎么样？|高水平的翻译仍然有价值|很快会完全消失|不会受到任何影响|只有机器能做好\n##29 In the nature reserve\nA:这次去自然保护区考察，收获大吗？=Did you get a lot out of this field trip to the nature reserve?\nB:很大。我们和当地的工作人员一同在山里住了半个月，拍到了金丝猴的活动画面。=A great deal. We lived in the mountains for half a month together with the local staff and filmed golden monkeys in action.\nA:听说那儿的野生动物大都很怕人，你们是怎么拍到的？=I hear most of the wild animals there are very shy of people. How did you manage to film them?\nB:靠的是耐心。我们在树上搭了一个隐藏的小棚子，每天天不亮就躲进去，一待就是十几个小时。=Patience. We built a small hidden shelter in a tree, slipped into it before dawn each day and stayed for well over ten hours.\nA:真不容易。那儿的生态保护得怎么样？=That can't have been easy. How well is the ecology protected there?\nB:比十年前好多了。以前游客净往山里扔垃圾，现在实行了预约制度，每天限制人数。=Far better than ten years ago. Tourists used to do nothing but drop litter in the hills; now there is a booking system with a daily cap on numbers.\n?保护区的生态为什么比以前好了？|限制了游客人数|增加了工作人员|禁止任何人进山|动物不再怕人了\n##30 A lesson from space\nA:昨晚太空课堂的直播你看了吗？=Did you watch the live broadcast of the lesson from space last night?\nB:看了，太精彩了。他们在太空里做实验，一滴水居然变成了一个圆球。=I did; it was brilliant. They did experiments in space, and a drop of water actually turned into a round ball.\nA:我女儿看的时候不时发出惊叹，看完以后一直追着我问为什么。=My daughter kept gasping as she watched, and afterwards she wouldn't stop asking me why.\nB:那你是怎么解释的？=So how did you explain it?\nA:我一时也说不清楚，只好陪她上网查资料，查到半夜十二点。=I couldn't explain it offhand either, so I sat with her looking things up online until midnight.\nB:这就是这种课的意义：它不一定能教会多少知识，却能在孩子心里种下一颗好奇的种子。=That's the point of lessons like this: they may not teach much knowledge, but they plant a seed of curiosity in a child's mind.\n?男的认为太空课堂的意义是什么？|激发孩子的好奇心|教给孩子很多知识|让父母多陪孩子|宣传国家的科技成就\n##31 Retiring later\nA:听说国家要逐步推迟退休年龄，你怎么看？=I hear the state is going to raise the retirement age step by step. What do you think?\nB:我能理解。现在人均寿命延长了，六十岁的人身体依旧很好，完全可以继续工作。=I can understand it. Average life expectancy is longer now; people of sixty are still in good health and perfectly able to go on working.\nA:可是年轻人会不会因此更难找到工作？=But won't that make it harder for young people to find jobs?\nB:这种担心一向存在，不过研究显示，老年人和年轻人从事的岗位大都不一样，影响没有想象的那么大。=That worry has always been there, but research shows that older and younger people mostly do different jobs, so the effect is smaller than imagined.\nA:我母亲今年退休，她倒是盼望着早点儿回家带孙子。=My mother retires this year, and she, for her part, can't wait to go home and look after her grandson.\nB:所以政策应该灵活一些，愿意工作的可以继续干，想休息的也能按时退。=So the policy should be flexible: those who want to work can carry on, and those who want to rest can retire on time.\n?男的对推迟退休是什么看法？|可以理解，但政策应该灵活|坚决反对|认为对年轻人影响很大|认为老年人不应该工作\n##32 What to do with savings\nA:我手里有二十万存款，放在银行利息太低，想拿去做点儿投资。=I have savings of 200,000. Bank interest is too low, so I'm thinking of investing it.\nB:你对理财了解多少？=How much do you know about managing money?\nA:不太懂。同事说买股票赚得快，他去年赚了百分之四十。=Not much. A colleague says shares make money fast; he made forty per cent last year.\nB:股票也好，基金也好，收益高的风险一定也高。你同事没告诉你他前年亏了多少吧？=Shares or funds, whatever pays more also carries more risk. I bet your colleague didn't tell you how much he lost the year before?\nA:那倒没说。那你建议我怎么办？=He didn't, actually. So what do you suggest?\nB:先留出半年的生活费，剩下的钱分散投资，别全放在一个地方。亏了就亏了，至少不会影响生活。=First set aside six months' living expenses, then spread the rest; don't put it all in one place. If you lose some, so be it; at least your daily life won't suffer.\n?男的给了女的什么建议？|留出生活费，分散投资|把钱全部买股票|继续存在银行|跟着同事一起买\n##33 Convenience and privacy\nA:你发现没有？我昨天刚跟朋友聊到想买跑步机，今天手机上就全是跑步机的广告。=Have you noticed? I was telling a friend only yesterday that I wanted a treadmill, and today my phone is full of treadmill adverts.\nB:这很正常，很多软件都会收集用户的数据，然后推荐相关的内容。=That's normal. Lots of apps collect user data and then recommend related content.\nA:方便归方便，可是我总觉得有人在偷听我说话，心里很不舒服。=Convenient it may be, but I keep feeling someone is listening in on me, and I don't like it.\nB:你可以在设置里把麦克风关掉，不用的时候不让它工作。=You can switch the microphone off in the settings so that it doesn't work when you're not using it.\nA:关了以后会不会影响使用？=Will that affect how the phone works?\nB:有些功能确实用不了。不过隐私归隐私，方便归方便，你得自己衡量哪个更重要。=Some functions really won't work. But privacy is one thing and convenience another; you have to weigh up which matters more to you.\n?女的为什么感到不舒服？|担心自己的隐私没有得到保护|手机上的广告太多|跑步机的价格太贵|朋友把她的秘密告诉了别人\n##34 Back to the village\nA:听说你表弟辞掉了北京的工作，回老家种地去了？=I hear your cousin quit his job in Beijing and went home to farm?\nB:是啊，亲戚们都想不通：放着月薪两万的工作不干，回去跟泥土打交道，为的是什么呢？=Yes, and the relatives can't fathom it: giving up a job paying twenty thousand a month to go back and work with mud. What for?\nA:他自己是怎么想的？=What does he say himself?\nB:他学的是农业专业，说一直想用学到的技术改造家乡的果园。=He studied agriculture, and says he always wanted to use what he learned to transform the orchards back home.\nA:现在干得怎么样？=How is it going now?\nB:头一年亏了不少，今年他通过网络直播卖水果，订单多得忙不过来，还请了十几个村民帮忙。=He lost a good deal in the first year. This year he's selling fruit by live-stream; there are more orders than he can handle, and he's taken on a dozen villagers to help.\n?关于表弟，下列哪项正确？|今年水果卖得很好|已经回北京工作了|学的是计算机专业|亲戚们一开始就支持他\n##35 Never satisfied\nA:我们已经看了二十多套房子了，你这也不满意，那也不满意，到底想要什么样的？=We've seen more than twenty flats and you're satisfied with none of them. What exactly do you want?\nB:我不是故意找毛病，买房子是一辈子的大事，总得谨慎一点儿。=I'm not finding fault for the sake of it. Buying a home is the event of a lifetime; one has to be careful.\nA:上周那套不是挺好的吗？光线好，楼层也合适。=Wasn't last week's one fine? Good light, and the right floor.\nB:可是离学校太远了，孩子上学每天要多花一个小时。=But it's too far from the school; the child would spend an extra hour a day getting there.\nA:那昨天看的那套离学校近的呢？=And the one near the school that we saw yesterday?\nB:那套倒是近，可是房子已经三十年了，连电梯都没有。算了，咱们把最看重的三个条件列出来，再重新筛选吧。=That one is close, true, but the building is thirty years old and has no lift. Never mind: let's list the three conditions we care about most and sift through them again.\n?男的最后提出了什么办法？|列出最重要的条件再选|买上周看的那一套|暂时不买房子了|再多看二十套\n##36 A year of volunteer teaching\nA:你在山区当志愿者老师的那一年，印象最深的是什么？=In your year as a volunteer teacher in the mountains, what impressed you most?\nB:是离开的那一天。全班四十个孩子走了两个小时的山路来送我，把我感动得说不出话来。=The day I left. All forty children in the class walked two hours over mountain paths to see me off; I was too moved to speak.\nA:那儿的条件一定很艰苦吧？=Conditions there must have been hard?\nB:冬天没有暖气，教室里冷得写不了字。可是孩子们学习的热情特别高，把我这个当老师的都感染了。=No heating in winter, and the classroom too cold to write in. But the children's eagerness to learn was so great that it rubbed off on me, the teacher.\nA:回来以后你还和他们保持联系吗？=Have you kept in touch since you came back?\nB:每个月都通信。去年有两个学生考上了县里最好的中学，把我高兴坏了。=We write every month. Last year two pupils got into the best secondary school in the county; I was over the moon.\n?什么让男的印象最深？|离开那天孩子们来送他|冬天教室里特别冷|学生考上了好中学|山路非常难走\n##37 A concert of traditional music\nA:昨晚的民族音乐会怎么样？=How was last night's concert of Chinese traditional music?\nB:太精彩了。那首有名的二胡曲子一响起来，我旁边的一位老先生不禁流下了眼泪。=Wonderful. When that famous erhu piece began, the old gentleman next to me couldn't hold back his tears.\nA:我一直以为年轻人不爱听民族音乐。=I always thought young people didn't care for traditional music.\nB:恰恰相反，现场一半以上是年轻观众。乐团把传统乐器和电子音乐结合在一起，效果出人意料。=Quite the opposite: over half the audience was young. The orchestra combined traditional instruments with electronic music, and the effect was a surprise.\nA:听你这么一说，我也想去听听了。还有票吗？=Hearing you say that, I'd like to go too. Are there tickets left?\nB:周六还有最后一场，你得赶紧订，我昨天看的时候只剩几十张了。=There's one last performance on Saturday. Book quickly: when I looked yesterday only a few dozen were left.\n?关于这场音乐会，可以知道什么？|年轻观众很多|演出已经全部结束|只演奏电子音乐|观众大都是老年人\n##38 Interview with a director\nA:导演，这部电影的大部分镜头是在一个小渔村拍的，为什么不在摄影棚里拍？=Director, most of this film was shot in a small fishing village. Why not in a studio?\nB:我想要真实的感觉。为了这部戏，我特地在那个村子住了半年，观察渔民的生活。=I wanted it to feel real. For this film I specially lived in that village for six months, observing the fishermen's lives.\nA:听说影片中的几位老人都不是专业演员？=I hear several of the old people in the film aren't professional actors?\nB:对，他们就是当地的村民。一开始面对镜头很紧张，我们只好偷偷地拍，等他们习惯了再正式开始。=That's right, they're local villagers. At first they were nervous in front of the camera, so we had to film on the quiet and start properly once they were used to it.\nA:影片的结尾没有说明主角最后去了哪儿，这是特意设计的吗？=The ending doesn't say where the main character finally goes. Was that deliberate?\nB:是的。我希望把想象的空间留给观众，每个人心里都可以有自己的答案。=Yes. I wanted to leave room for the audience's imagination; everyone can have their own answer.\n?导演为什么在渔村住了半年？|为了观察渔民的真实生活|为了寻找专业演员|在摄影棚拍费用太高|他是在那个村子长大的\n##39 Losing the final\nA:昨晚的决赛你看了吗？我们队居然输了。=Did you watch the final last night? Our team actually lost.\nB:看了，气死我了。上半场踢得糟透了，防守连续出现失误。=I did, and I was furious. The first half was dreadful, with one defensive error after another.\nA:不过下半场换人以后，局面完全不一样了，差一点儿就追平了。=But after the substitutions in the second half things were completely different; we very nearly equalised.\nB:可惜最后那个球没踢进。你看到那个年轻运动员下场时的表情了吗？=A pity that last shot didn't go in. Did you see that young player's face as he left the pitch?\nA:看到了，他难过得一直低着头。其实他已经尽力了，才二十岁就能在决赛上场。=I did; he was so upset he kept his head down. He did his best, really; playing in a final at only twenty.\nB:是啊，输了就输了，这支球队平均年龄只有二十三岁，未来还长着呢。=Yes. A loss is a loss; the team's average age is just twenty-three, and they have a long future ahead.\n?关于这场比赛，下列哪项正确？|下半场比上半场踢得好|我们队最后赢了|两队最后打平了|年轻运动员最后踢进了球\n##40 At a modern art show\nA:这个现代艺术展你看懂了吗？我怎么觉得有些作品莫名其妙。=Did you understand this modern art exhibition? Some of the works make no sense to me.\nB:我也不敢说全看懂了。你看这幅画，颜色一时浓，一时淡，据说表现的是城市人的焦虑。=I wouldn't claim to have understood it all either. Look at this painting: the colour is now dense, now pale; it's said to express the anxiety of city dwellers.\nA:要是没有旁边的文字说明，我根本猜不出来。=Without the caption beside it, I'd never have guessed.\nB:现代艺术本来就不追求“像”，它更在乎能不能引起观众的思考。=Modern art was never about likeness; it cares more about whether it makes the viewer think.\nA:这么说，看不懂也没关系？=So it doesn't matter if you don't understand it?\nB:没错。同一件作品，一百个人可以有一百种理解，这恰恰是它有意思的地方。=Right. A hundred people can read the same work in a hundred ways, and that is precisely what makes it interesting.\n?男的认为现代艺术的特点是什么？|重在引起观众的思考|画得越像越好|必须有文字说明|只有专家才能欣赏\n##41 My sister, the champion\nA:快看，颁奖仪式开始了！那不是你妹妹吗？=Look, the medal ceremony is starting! Isn't that your sister?\nB:是她！站在最高的那个位置上！我的天，她真的拿了冠军！=It is! On the very top step! Good heavens, she really is the champion!\nA:看把你激动得，手机都拿反了。=Look how excited you are; you're holding your phone the wrong way round.\nB:你不知道，她为了这次比赛，三年没回家过过一个春节。=You don't know: for this competition she hasn't been home for a single Spring Festival in three years.\nA:这块金牌来得真不容易。她接下来有什么打算？=That gold medal was hard won. What are her plans now?\nB:她说先好好休息一个月，然后准备明年的世界比赛。瞧她笑的，我好久没见她这么开心了。=She says she'll have a good month's rest and then prepare for next year's world championships. Look at that smile; I haven't seen her so happy in ages.\n?关于男的的妹妹，可以知道什么？|她为比赛付出了很多|她明年就不比赛了|她得了亚军|她每年都回家过春节\n##42 The lost manuscript\nA:听说您的新小说写到一半，电脑坏了，十几万字的稿子全没了？=I hear that halfway through your new novel your computer broke down and over a hundred thousand characters of manuscript vanished?\nB:是有这么回事。当时我在书房里坐了一下午，一个字也不想写。=That did happen. I sat in my study a whole afternoon, not wanting to write a word.\nA:换了别人，可能就放弃了。=Someone else might have given up.\nB:丢了就丢了，后悔也没有用。我干脆从头再写，没想到第二遍的人物比第一遍更鲜明。=What's lost is lost; regret is no use. I simply started again from the beginning, and to my surprise the characters came out more vivid the second time.\nA:这么说，坏事倒变成了好事？=So a bad thing turned into a good one?\nB:可以这么说。写作和生活一样，有时候从头再来，反而能走得更远。不过我现在每天都把稿子存三份。=You could say so. Writing is like life: sometimes starting over takes you further. Mind you, I now save three copies of the manuscript every day.\n?作家丢了稿子以后是怎么做的？|从头重新写了一遍|放弃了这部小说|请人修好了电脑|改写别的题材\n##43 A gift for the professor\nA:下周去拜访陈教授，你说带什么礼物比较合适？=We're calling on Professor Chen next week. What would be a suitable gift?\nB:陈教授爱喝茶，我托人从福建带了两罐好茶，再配一把名贵的茶壶怎么样？=He loves tea. I've had two tins of good tea brought from Fujian; how about adding a fine teapot?\nA:茶是不错，不过茶壶太贵重了，他未必肯收。=The tea is a good idea, but the teapot is too valuable; he may well not accept it.\nB:那换成一卷好纸吧？他不是每天都练书法吗？=Then a roll of good paper instead? Doesn't he practise calligraphy every day?\nA:这个主意好，又实用又不显得太贵重。我再去花店买一枝梅花，他书房里正好有个空花瓶。=Good idea: practical, and not too lavish. I'll also get a spray of plum blossom from the florist; there happens to be an empty vase in his study.\nB:行。礼物不在多，关键是用心。=Fine. It's not how much you give; it's the thought that counts.\n?他们最后决定送什么礼物？|茶、纸和梅花|茶和茶壶|一幅书法作品|一个花瓶\n##44 Learning opera from a master\nA:师父，这段戏我已经练了两个月了，为什么您还是不让我上台？=Master, I've practised this scene for two months. Why won't you let me go on stage yet?\nB:你唱得没有问题，可是眼睛里没有戏。这个人物刚失去亲人，我却看不到你的悲伤。=Your singing is fine, but there's no drama in your eyes. This character has just lost a loved one, yet I see no grief in you.\nA:我怎么才能找到那种感觉呢？=How can I find that feeling?\nB:光靠练习是练不出来的。你去读读这出戏的历史背景，再好好体会一番。=Practice alone won't give it to you. Go and read up on the history behind this play, and then reflect on it deeply.\nA:我明白了。您当年学戏的时候也是这样吗？=I understand. Was it like this when you were learning?\nB:我师父让我在后台站了整整三年，只许看，不许唱。他的那番苦心，我到四十岁才真正懂得。=My master had me stand backstage for three whole years, allowed to watch but not to sing. I didn't truly understand the pains he took until I was forty.\n?师父为什么不让徒弟上台？|表演缺少感情|唱得不够好|年龄太小|没有合适的角色\n##45 Bamboo slips in the museum\nA:这个遗址博物馆平时人不多，没想到今天排这么长的队。=This site museum is usually quiet; I never expected such a long queue today.\nB:最近这里发现了一批两千年前的文物，上面的文字保存得相当完整，引起了很大的关注。=A batch of two-thousand-year-old relics was found here recently, with the writing on them quite well preserved; it has drawn a lot of attention.\nA:上面写的是什么？=What does the writing say?\nB:不看不知道，一看才发现，古人记录的内容跟我们的生活很接近：有借钱的合同，有医生开的药，还有写给家人的信。=You'd never guess until you look: what the ancients recorded is very close to our own lives. There are loan contracts, doctors' prescriptions, even letters home.\nA:真有意思。那这些文字现在的人能读懂吗？=How interesting. Can people today read that writing?\nB:大部分能。汉字虽经历了多次变化，但基本结构一直延续到今天，这在世界上是很罕见的。=Most of it. Chinese characters have gone through many changes, yet their basic structure has continued to this day, which is very rare in the world.\n?这批文物上记录的主要是什么？|古人日常生活的内容|皇帝的命令|战争的经过|神话故事\n##46 New Year's Eve at home\nA:今年春节你们家是怎么过的？=How did your family spend Spring Festival this year?\nB:热闹得不得了。除夕那天，一大家子二十多口人都回来了，你一言我一语，屋顶都快被吵翻了。=It was incredibly lively. On New Year's Eve the whole clan, over twenty of us, came home; with everyone talking at once the roof nearly came off.\nA:年夜饭是谁做的？=Who cooked the New Year's Eve dinner?\nB:每家做两个最拿手的菜，摆了满满两大桌。孩子们的玩具东一个西一个，扔得到处都是，我妈却高兴得合不上嘴。=Each household made its two best dishes, enough to cover two big tables. The children's toys were scattered all over the place, yet my mum couldn't stop smiling.\nA:现在很多人嫌麻烦，都去饭店吃年夜饭了。=Lots of people find it too much trouble now and have the dinner in a restaurant.\nB:去饭店是省事，可是我觉得一家人挤在厨房里忙来忙去，才是过年的味道。=A restaurant does save trouble, but to me the family squeezed into the kitchen, bustling about, is the real flavour of New Year.\n?男的家的年夜饭是怎么准备的？|每家做两个菜带来|在饭店订的|全部由妈妈一个人做|请了厨师到家里做\n##47 Late for the Lantern Festival\nA:你怎么才来？我们等了你一个多小时，汤圆都煮好了。=Why are you so late? We've waited over an hour for you, and the sweet dumplings are already cooked.\nB:别提了。我的车早不坏，晚不坏，偏偏在高速公路上出了故障。=Don't ask. Of all the times for my car to break down, it had to be on the motorway.\nA:人没事吧？后来怎么解决的？=You're all right, aren't you? How did you sort it out?\nB:人没事。我打电话叫了救援，车被拖走以后，我又换乘出租车才赶过来。=I'm fine. I phoned for roadside rescue, and once the car had been towed away I took a taxi to get here.\nA:辛苦了。快坐下吃吧，一会儿我们还要去广场看灯会呢。=What a time you've had. Sit down and eat; in a while we're off to the square to see the lantern fair.\nB:太好了，我特地给孩子们带了两个灯笼，幸亏没落在车上。=Lovely. I brought two lanterns specially for the children; thank goodness I didn't leave them in the car.\n?男的为什么来晚了？|车在路上出了故障|忘了聚会的时间|去买灯笼了|路上堵车\n##48 Dialect against fraud\nA:昨天有人打电话，用四川话说是我的老同学，要跟我借钱，我差点儿就信了。=Someone phoned yesterday claiming in Sichuan dialect to be an old classmate and asked to borrow money. I nearly believed him.\nB:后来呢？你怎么发现是骗子的？=And then? How did you find out he was a swindler?\nA:我用四川话问了他几句家乡的事，他一句也答不上来。我在成都长大，他居然骗到我头上来了。=I asked him a few things about our home town in dialect and he couldn't answer one. I grew up in Chengdu, and he actually tried it on with me.\nB:哈哈，好你个老王，原来方言还能防骗子！=Ha, good for you, Lao Wang! So dialect can keep swindlers at bay!\nA:可不是嘛。不过说实话，现在会说方言的年轻人越来越少了，我儿子就只会说普通话。=Can't it just. But to tell the truth, fewer and fewer young people speak dialect now; my son speaks only Mandarin.\nB:是啊，方言里保存着很多古老的文化，要是没人说了，实在太可惜。=Yes. Dialects preserve a great deal of ancient culture; it would be a real pity if nobody spoke them.\n?女的是怎么发现对方是骗子的？|对方答不出家乡的事|对方的声音很陌生|朋友提醒了她|对方说的是普通话\n","seg":["您好|，|我|想|咨询|一下|住房贷款|的|事|。|我|看中|了|一套|一百二十|平方米|的|房子|。","好|的|。|请问|您|打算|贷|多少|年|？|目前|的|年|利息|是|百分之三点|五|，|略低于|去年|。","我想贷|二十年|。|每个|月|还|多少|比较|合适|？","一般|建议|每月|还款|不|超过|家庭收入|的|一半|，|否则|会|影响|正常|的|生活|。","明白|了|。|如果|以后|手头|宽裕|了|，|可以|提前|还款|吗|？","可以|，|不过|得|于|还款|满|一年|之后|提出申请|，|并且|提前|一个月|通知|银行|。","你好|，|我刚|收到|短信|，|说|我|的|航班|取消|了|，|到底|是|怎么回事|？","非常|抱歉|，|昆明|那边|有|雷雨|，|航班|因|天气|原因|无法|起飞|。","可是|我|明天|上午|有|一个|重要|的|谈判|，|今天|必须|赶到|。","我|帮|您|查|一下|…|…|今晚|八点|有|一班|经|成都|转机|的|，|凌晨|一点|能|到|，|您|看行|吗|？","只能|这样|了|。|换|航班|需要|另外|付费|吗|？","因|天气|原因|造成|的|变更|是|免费|的|，|我们|还会|为|您|提供|一张|晚餐|券|。","我|上个月|在|你们|店|买|的|手机|，|才|用|了|三个|星期|，|屏幕|就|自己|黑|了|。","您|先|别急|。|请问|您|带|发票|和|保修卡|了|吗|？","都|带|了|。|我|要求|换|一部|新|的|，|不想|修|。","按照|规定|，|购买|十五天|之内|出现|质量|问题|可以|换货|，|超过|十五天|只能|免费|保修|。","可是|这|明显|是|质量|问题|，|不是|我|使用不当|造成|的|。","我|理解|您|的|心情|。|我们|先送|去|检测|，|至于|能|不能|换|新|的|，|要|等|检测|报告|出来|再|决定|。","张|医生|，|我|的|体检|报告|出来|了|吗|？","出来|了|。|总的来说|问题|不|大|，|除|血压|偏高|以外|，|其他|检查|结果|都|在|正常|范围|之内|。","血压高|需要|吃药|吗|？|我|父亲|也|有|这个|毛病|。","暂时|用不着|。|你|这种|情况|跟|遗传|有|一定|关系|，|但|更|主要|的|是|生活习惯|。","我|确实|经常|熬夜|，|吃|得|也|比较|咸|。","所以|除了|少|吃盐|以外|，|你|还|得|保证|睡眠|，|每周|至少|运动|三次|，|三个|月|以后|再|来|复查|。","你|不是|说|要买车|吗|？|看|得|怎么样|了|？","新车|太贵|，|我
