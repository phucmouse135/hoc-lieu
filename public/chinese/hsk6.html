<style>

.steps{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px}.steps svg{width:52px;height:52px;border:1px solid var(--line);background:var(--card)}
.kgridv{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr))}

.pn{display:flex;justify-content:space-between;margin-top:40px}

.subq{margin-top:16px;font-weight:600}
.fb{padding:12px 16px;border-radius:10px;margin:8px 0}.fb.good{background:var(--ok-soft)}.fb.bad{background:var(--shu-soft)}.fb p{margin:.3em 0;max-width:none}

const DATA={"cfg":{"lv":6,"zh":"六级","hz":"汉语六级","key":"hsk6-v1","doc":"hsk6","nw":1800,"title":"HSK 6 in 10 weeks","desc":"A 10-week study plan for the new HSK 6 (HSK 3.0): all 1,800 new words, the 50 official grammar points, 150 handwriting characters, listening, reading, writing, speaking and full mock exams.","fmt":{"L1":"s","WL":"s","L2":"b","L3":"b","R1":"r","R2":"r","R3":"b"},"parts":[{"t":"Listening","min":30,"secs":[["L1","h","Listening · Part 1 · matching statement"],["L2","h","Listening · Part 2"],["L3","h","Listening · Part 3"]]},{"t":"Reading","min":40,"secs":[["R1","c","Reading · Part 1 · gap fill"],["R2","i","Reading · Part 2 · sentence insertion"],["R3","a","Reading · Part 3 · comprehension"]]},{"t":"Writing","min":45}],"w":[150,300],"wt":["Writing 1 · practical writing","Writing 2 · essay"],"wi":["Practical writing: write about 150 characters for the situation below. Use the proper format and a polite, formal tone.","Write at least 300 characters on the topic below."],"chk":["the right format (salutation, purpose in the first lines, the necessary details, polite closing, name and date); a formal, courteous tone throughout","a clear position or story line; two developed points or stages, each with an example; a conclusion that returns to the opening"],"ai":["Task 1 (practical writing of about 150 Chinese characters; judge format and register as well as language):","Task 2 (argumentative or narrative essay of at least 300 Chinese characters):"],"wintro":"Type in Chinese. Task 1 is practical writing of about 150 characters; task 2 is an essay of at least 300. Leave about 15 minutes for task 1 and 30 for task 2.","wk":["A piece of practical writing of about 150 characters. Give yourself 15 minutes.","An essay of at least 300 characters. Give yourself 30 minutes."],"wsT":["Writing workshop: practical writing","Writing workshop: the 300-character essay","Timed writing: both tasks in 45 minutes"],"ws":["<p>Task 1 gives a real-life situation and asks for about 150 characters: an email, a letter of thanks or apology, an invitation, a notice, a request. Format and tone are judged before vocabulary. A reliable shape:<\/p><ol class=\"guide\"><li><b>Salutation<\/b> on its own line (尊敬的王经理： / 各位同事：), then 您好！<\/li><li><b>Purpose first<\/b>: one sentence saying why you are writing (我写这封信是想…… / 现将有关事项通知如下).<\/li><li><b>The necessary details<\/b> in two or three sentences: time, place, reason, what you ask of the reader.<\/li><li><b>A polite close<\/b> (给您带来不便，请多理解 / 期待您的回复 / 此致 敬礼), then your name and the date.<\/li><\/ol><p>Today, rewrite two pieces you met in weeks 1 and 5 and beat your first version.<\/p>","<p>Task 2 asks for at least 300 characters, either arguing a view or telling an experience and what it taught you. Five short paragraphs fill the length without padding:<\/p><ol class=\"guide\"><li><b>Opening<\/b>: the issue and your position in two sentences.<\/li><li><b>First point<\/b> with a concrete example.<\/li><li><b>Second point<\/b>, or the other side of the question (话虽这么说…… / ……虽……，却……).<\/li><li><b>What follows<\/b>: a consequence or a suggestion, using 凡是…都…、除非…否则…、就算…也…、以便.<\/li><li><b>Conclusion<\/b> that returns to the opening (总之 / 由此可见).<\/li><\/ol>","<p>Do both tasks back to back as in the exam: about 15 minutes for the practical writing, 30 for the essay. Do not look anything up.<\/p>"],"spk":"The Level 6 speaking test is taken separately from the written paper. It has five tasks: two recordings to retell (1.5 minutes each), one story from four pictures (2 minutes) and two questions to answer (2.5 minutes each). Record yourself on your phone, then compare with the text or the suggested points and mark yourself.","mock":"A full paper in the new format: 40 listening items in about 30 minutes, 40 reading items in 40 minutes and two writing tasks in 45 minutes. Every item is new to you. Sit it in one go, somewhere quiet, with sound on.","onb":"A day-by-day plan for the new HSK 6 format: 82 items, a piece of practical writing, a 300-character essay and a separate speaking test. Eight weeks of lessons cover all 1,800 new Level 6 words and the official grammar list; two weeks of mock exams follow.","phd":["48 lessons. Each has one grammar point from the official Level 6 list, 37 or 38 new words (theme words first, then general-purpose words), 2 to 4 handwriting characters with stroke order, and a dialogue for listening, dictation and role-play. The second and fifth lesson of each week add a reading task in one of the three exam formats. Day 7 is a weekly test plus one timed writing task.","Full mock exams in the new 82-item format, writing workshops for practical writing and the 300-character essay, two speaking mocks, and review days built from your error notebook."],"examRows":"<tr><td>Listening<\/td><td>about 30 min<\/td><td>Part 1: 8 short recordings; choose the statement that matches each. Part 2: short talks with three or four questions each, 20 in all. Part 3: three long interviews with four questions each.<\/td><td>40<\/td><\/tr><tr><td>Reading<\/td><td>40 min<\/td><td>Part 1: fill 10 gaps in two longer texts. Part 2: put the missing sentences back into two texts, 10 items. Part 3: five texts with four questions each.<\/td><td>40<\/td><\/tr><tr><td>Writing<\/td><td>45 min<\/td><td>Task 1: practical writing of about 150 characters. Task 2: an argumentative or narrative essay of at least 300 characters.<\/td><td>2<\/td><\/tr><tr><td>Speaking (separate test)<\/td><td>about 23 min<\/td><td>Retell two recordings, tell a story from four pictures, answer two questions.<\/td><td>5<\/td><\/tr>","examNote":"Listening uses your device's Chinese voice, played once at natural speed; it is clearer and more even than the real recording, so also work through the official sample paper before the exam. How the 20 and 12 items of Listening Parts 2 and 3 are divided among recordings follows public descriptions of the new format, not the official paper itself. Scores are scaled to
