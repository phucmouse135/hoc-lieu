有关：对一个五岁的孩子来说，一年是他全部人生的五分之一；而对一个五十岁的人来说，一年只是五十分之一，自然显得短暂。另一种更有说服力的解释是，我们对时间长短的判断，取决于这段时间里留下了多少新鲜的记忆。童年时，几乎每天都有“第一次”：第一次上学，第一次看海，第一次骑自行车，大脑需要记录大量的新信息，回忆起来内容十分丰富。成年以后，生活逐渐变得重复，上班、吃饭、睡觉，大脑不再费力去记录这些熟悉的事情，于是一个月和一天似乎没有什么区别。\n由此看来，想让时间“慢”下来并不是不可能的。研究者建议，可以经常尝试新的事物：换一条路上班，学一门新的技能，去一个没去过的地方。新的体验越多，留下的记忆就越多，生命在感觉上也就越长。\n?这段话主要讨论的是什么？|为什么长大后觉得时间过得快|怎样才能记住童年的事|时间的速度为什么会变|成年人为什么工作忙\n?根据“比例”的解释，为什么五十岁的人觉得一年很短？|一年只占他人生的五十分之一|他的记忆力下降了|他的工作太忙了|他每天睡得太多\n?童年的记忆为什么特别丰富？|有很多第一次的新鲜经历|孩子的大脑比成年人大|孩子不需要上班|父母帮助孩子记录\n?研究者建议怎样让时间“慢”下来？|经常尝试新的事物|每天多睡一会儿|尽量减少工作|多回忆童年的事\n##\n带着一台电脑，在海边的小城或山里的村庄一边工作一边生活——这种生活方式近年来吸引了越来越多的年轻人。他们大都从事设计、翻译、写作等可以通过网络完成的工作，不必每天到固定的办公室打卡。\n云南的一个古镇是国内较早出现这类人群的地方。这里气候舒适，房租只有大城市的五分之一，网络条件也相当不错。镇上的一家共享办公室里，常年有来自全国各地的上百位年轻人。他们白天各自工作，晚上一同做饭、看电影，或者举办分享会，交流各自的专业知识。一位在这里住了两年的设计师说，她的收入比在上海时少了三分之一，可是每天能多出四个小时属于自己的时间，生活的质量反而提高了。\n然而，这种生活并不是人人都适合。收入不稳定、缺乏社会保障、职业发展受到限制，都是他们必须面对的现实问题。一位研究者指出，它更像是人生中的一个阶段，而不是长久的选择；多数人在体验几年之后，还是会回到城市，只是他们对工作与生活的关系，有了不一样的理解。\n?这些年轻人的工作有什么特点？|可以通过网络完成，不必去固定的办公室|必须每天到公司打卡|主要是体力劳动|只能在大城市做\n?云南的那个古镇为什么吸引他们？|气候好、房租低、网络条件不错|工资比大城市高|有很多大公司|离上海很近\n?那位设计师搬到古镇以后有什么变化？|收入减少了，但自由的时间多了|收入增加了三分之一|工作时间更长了|不再做设计工作了\n?研究者怎样看待这种生活方式？|更像人生中的一个阶段|适合所有的年轻人|应该被禁止|比在城市工作更稳定\n##\n四合院是中国北方传统民居的代表，其中以北京的四合院最为典型。所谓“四合”，指的是东、西、南、北四面的房屋围在一起，中间形成一个方形的院子。院子的大门通常开在东南角，而不是正中间，这样从外面就无法直接看到院内的情形，既保护了隐私，也挡住了冬天的寒风。\n四合院的布置体现了传统的家庭观念。北面的房间高大明亮，由家中的长辈居住；东西两侧的房间给子女住；南面的房间则用作客房或书房。一家几代人生活在同一个院子里，既各有空间，又能互相照顾。院子中央往往种着几棵树，夏天全家人在树下休息、吃饭，孩子们在一旁玩儿，这是许多老北京人最温暖的记忆。\n随着城市的发展，大量四合院被高楼取代，剩下的也大都住进了多户人家，变得十分拥挤。近些年，北京开始对保存较好的四合院进行修复，有的改造成了博物馆和文化空间。人们逐渐意识到，四合院保存的不仅是一种建筑形式，更是一种邻居亲近、几代人共同生活的生活方式。\n?四合院的大门为什么通常不开在正中间？|为了保护隐私和挡风|为了方便停车|为了节省材料|为了让院子更大\n?在四合院里，北面的房间一般由谁居住？|家中的长辈|子女|客人|邻居\n?随着城市的发展，四合院发生了什么变化？|很多被高楼取代了|数量越来越多|都变成了饭店|全部被政府买走了\n?人们现在认为四合院保存的是什么？|一种传统的生活方式|古代的建筑材料|北京的交通规划|现代的家庭观念\n##\n有一种竹子，在种下去的头四年里，只长了三厘米。不了解情况的人看了，很可能以为它已经停止了生长。然而从第五年开始，它以每天三十厘米的速度迅速生长，仅仅用六个星期，就长到了十五米高。原来，在前四年里，它并不是没有长，而是把根在土壤里延伸了数百平方米。\n这种现象常常被用来说明积累的意义。很多人在学习一门技能时，最初的进步往往十分缓慢，付出了大量时间，却看不到明显的效果。于是有人怀疑自己没有才能，有人抱怨方法不对，更多的人干脆放弃了。他们不知道，那段看似毫无收获的日子，恰恰是在“长根”。\n当然，仅仅懂得等待是不够的。竹子之所以能在第五年迅速生长，是因为它的根确实在一刻不停地向下延伸；假如一个人只是每天重复同样的错误，却期望有一天突然成功，那不过是自己安慰自己。真正有价值的积累，离不开正确的方法和不断的反思。\n所以，当你在某件事上努力了很久却依旧看不到成果时，可以问自己两个问题：我的根是不是在继续往下长？我长的方向对不对？如果答案都是肯定的，那么请再多一点儿耐心。\n?那种竹子在头四年里主要在做什么？|把根在土壤里延伸|长出很多叶子|停止了生长|每天长高三十厘米\n?作者用竹子的例子主要想说明什么？|积累的意义|植物生长的规律|种竹子的方法|才能的重要性\n?作者认为真正有价值的积累需要什么？|正确的方法和不断的反思|很长的等待时间|很高的才能|别人的帮助\n?作者建议努力很久却看不到成果的人怎么做？|检查方向是否正确，再多一点儿耐心|马上放弃|换一件事做|去请教专家\n[L1.2]\n很多人习惯把没吃完的热饭菜放凉以后再放进冰箱。其实，食物在室温下放的时间越长，细菌繁殖得越快。正确的做法是，饭菜稍微凉一点儿就应尽快放进冰箱。?|饭菜不应在室温下放太久|热饭菜放进冰箱会变质|冰箱里没有细菌|饭菜放得越久越安全\n一位著名的钢琴家每次演出前都要练习八个小时。有人问他，已经这么有名了，为什么还要这么辛苦。他回答：“一天不练，我自己知道；两天不练，我的老师知道；三天不练，观众就都知道了。”?|这位钢琴家认为必须坚持练习|这位钢琴家已经不练琴了|观众听不出演奏的好坏|钢琴家的老师不让他休息\n城市里鸟的叫声正在变得越来越高。研究人员发现，为了不被汽车和机器的噪声盖住，生活在城市里的鸟提高了叫声，有的还把“唱歌”的时间改到了比较安静的深夜。?|城市的鸟为适应噪声改变了叫声|城市里已经没有鸟了|鸟只在白天叫|噪声对鸟没有影响\n这座图书馆规定，读者每借一本书，就要在卡片上写下一句推荐的话，留给下一位读者。几年下来，许多书里都夹着十几张卡片，读者常常说，读这些卡片的乐趣一点儿也不比读书少。?|读者借书时要给后来的人留言|图书馆不允许在书里夹东西|读者不喜欢看卡片|每本书只能借一次\n人在饥饿的时候去超市，往往会买回比平时多得多的东西，而且不只是食品。研究者认为，饥饿会让人产生“想要得到”的强烈欲望，这种欲望会扩展到其他商品上。?|饥饿时购物容易买得更多|饥饿的人只买食品|吃饱以后更想买东西|饥饿对购物没有影响\n很多人把“忙”当作一种荣誉，仿佛日程排得越满，人生就越有价值。可是一位管理学家指出，忙碌并不等于高效，真正重要的事情往往只占全部工作的两成，其余的大都可以简化甚至取消。?|忙碌不一定代表有效率|日程越满的人越成功|所有的工作都同样重要|管理学家建议多加班\n这种鱼生活在几千米深的海底，那里没有一点儿阳光。它的头上长着一个会发光的“小灯笼”，其他小鱼被光吸引过来，就成了它的食物。?|这种鱼靠发光来吸引食物|这种鱼生活在很浅的水里|深海里阳光很充足|这种鱼只吃海草\n以前，这个小镇的居民过了晚上八点就很少出门。自从广场上装了灯、摆了桌椅，并且每周末放映电影以来，晚上出来散步、聊天的人明显多了，附近小店的生意也跟着好了起来。?|改造广场以后，小镇的夜晚热闹了|小镇的居民晚上不允许出门|广场上的电影需要买票|附近的小店都关门了\n[L2.2]\n##\n据本台消息，本市最大的旧书市场将于下月初搬到城东的文化园区。这个市场已有三十多年的历史，目前共有两百多家店铺，每到周末，前来买书的市民多达上万人。由于原来的场地过于拥挤，消防设施也比较落后，市政府决定为它寻找新的地点。新市场的面积是原来的两倍，除书店以外，还设有咖啡馆、讲座厅和儿童阅读区。不少老顾客表示舍不得离开老地方，但也有店主认为，环境改善以后，有可能吸引更多年轻读者。\n?旧书市场为什么要搬走？|原来的场地拥挤，消防设施落后|租金上涨得太快|来买书的人太少|市政府要在那儿修路\n?关于新市场，可以知道什么？|面积是原来的两倍|只卖新出版的书|位于城市的西边|不对儿童开放\n?有的店主对这次搬走是什么看法？|可能吸引更多年轻读者|生意肯定会变差|应该留在老地方|新市场离家太远\n##\n很多人相信“左脑负责逻辑，右脑负责艺术”，并据此把人分成“左脑型”和“右脑型”。然而，科学家对一千多人的大脑进行检查后发现，这种说法并没有依据。无论是做数学题还是画画，大脑的两个部分都在同时工作，只是不同区域的活跃程度有所差别。一个人擅长逻辑还是擅长艺术，主要取决于后来的训练和兴趣，而不是哪一边的大脑更“发达”。专家提醒，一些培训机构以“开发右脑”为名收取很高的费用，家长应当谨慎对待。\n?很多人相信的那种说法是什么？|左右脑各自负责不同的 n[R2.2]\n在成都的一条老街上，有一家只做一种生意的邮局：【帮人把信寄给未来】。顾客写好信以后，可以指定一年、五年甚至二十年后的某一天，【到时候邮局会把信寄到指定的地址】。来这里写信的人各种各样：有的写给十年后的自己，【有的写给还没出生的孩子】，还有的写给将来的妻子或丈夫。店主说，在什么都追求速度的今天，【人们反而更渴望一种需要等待的感情】。一位顾客在留言本上写道：【写信的时候，我第一次认真地想了想，十年后我希望成为什么样的人】。\n你注意过吗？飞机的窗户都是圆角的，【没有一扇是方形的】。其实，早期客机的窗户和普通房屋的一样是方的，【直到二十世纪五十年代接连发生了几起严重的事故】。调查人员经过反复试验终于发现，问题就出在窗户的形状上。飞机在高空飞行时，飞机内外的压力相差很大，【方形窗户的四个角承受的压力比其他部位高出好几倍】。时间一长，角上就会出现细小的裂痕，【并且迅速向四周扩展】，最终造成严重的后果。而圆形的边缘能把压力均匀地分散开，【因此后来的飞机窗户全部改成了圆角】。\n[R3.2]\n##\n中午十二点，上海一个老小区的社区食堂里坐满了人。七十八岁的周阿姨端着盘子找到座位，一个肉菜、一个素菜、一个汤，只花了十二块钱。“自己做饭，买菜、洗碗太麻烦，一个人又吃不了多少。”她说，自从食堂开业以来，她几乎天天来。\n像这样的社区食堂，近年来在全国各地大量出现。它们最初是为了解决老年人“吃饭难”的问题，没想到也吸引了不少年轻的上班族。食堂的价格比普通餐厅低三成左右，菜的种类多，口味清淡，而且用的油和盐都有严格的标准。\n不过，低价也给经营带来了压力。有的食堂开业不到一年，就因为亏损而关门。经营较好的食堂大都采取了灵活的办法：中午主要服务老年人，晚上和周末则向所有人开放，提供聚餐和送餐服务；有的还和附近的农场合作，直接采购蔬菜，以降低成本。\n专家认为，社区食堂的意义不只是提供一顿饭。对独自生活的老人来说，每天走出家门，和邻居坐在一起边吃边聊，本身就是一种重要的社会交往。如何在保持低价的同时实现长期经营，是今后需要继续探索的问题。\n?周阿姨为什么常来社区食堂吃饭？|自己做饭太麻烦|食堂离医院近|她不会做饭|子女要求她来\n?社区食堂有什么特点？|价格低、口味清淡|只对老年人开放|菜的种类很少|比普通餐厅贵\n?经营较好的食堂采取了什么办法？|不同时间服务不同的顾客|提高饭菜的价格|减少菜的种类|只在中午营业\n?专家认为社区食堂还有什么意义？|为独自生活的老人提供交往的机会|增加政府的收入|帮助年轻人找工作|推广上海的饮食文化\n##\n植物不会说话，也不能移动，但这并不意味着它们之间没有交流。科学家发现，当一棵树的叶子被虫子咬了以后，它会向空气中释放一种特殊的气体。附近的树“闻”到这种气体，就会提前在叶子里产生让虫子讨厌的物质，从而减少损失。\n更令人惊讶的发现来自地下。森林里，不同树木的根通过一种极细的生物连接在一起，形成了一张巨大的网络。通过这张网，高大的老树可以把多余的营养输送给见不到阳光的小树；一棵树生病时，还能向周围的树发出“警告”。\n这些发现改变了人们对森林的认识。过去，人们常常把生长缓慢的老树砍掉，为小树让出空间；现在看来，老树恰恰是整个网络的中心，砍掉它们，周围小树的生存率反而会下降。\n当然，科学界对此也有不同的声音。有学者提醒，用“说话”“帮助”这样的词语描述植物，容易让人误以为植物具有和人类一样的意识。到目前为止，我们只能确定植物之间存在物质和信息的传递，至于这种传递是否有“目的”，仍需要更多的研究。\n?树叶被虫子咬了以后，树会怎么做？|向空气中释放特殊的气体|把叶子全部掉光|停止生长|把虫子赶走\n?森林的地下网络有什么作用？|在树木之间输送营养和信息|帮助树木移动|阻止虫子进入森林|让树木长得更高\n?根据新的发现，砍掉老树会有什么后果？|周围小树的生存率下降|小树长得更快|森林里的虫子减少|地下的网络更发达\n?有的学者提醒人们注意什么？|不要误以为植物有和人一样的意识|植物之间根本没有交流|森林里不能砍任何树|研究植物没有意义\n##\n每周只工作四天，工资却一分不少——这听起来像是不可能实现的愿望，但近年来已有多个国家的企业进行了尝试。在英国的一次大规模试验中，六十多家公司的近三千名员工参加了为期半年的“四天工作制”。结果显示，公司的收入基本没有受到影响，员工请病假的次数减少了三分之二，辞职的人数也下降了一半以上。试验结束后，九成以上的公司决定继续实行这一制度。\n为什么工作时间减少了，成果却没有下降？研究者认为，关键在于效率的提高。为了在四天内完成任务，公司取消了许多不必要的会议，员工也更加专注；充足的休息使他们精力更好，犯的错误更少。\n然而，这一制度并不适合所有行业。医院、工厂、餐厅等需要随时有人工作的单位，如果缩短每个人的工作时间，就必须增加人手，成本会明显上升。此外，也有员工反映，把五天的工作压缩到四天，每天的强度太大，反而更累。\n看来，“四天工作制”能否推广，还要根据行业的特点来决定。不过，这场试验至少说明了一点：工作时间长，并不等于工作成果多。\n?英国的那次试验结果怎么样？|公司收入基本不变，辞职的人减少|公司的收入大幅下降|员工请病假的次数增加|多数公司决定放弃\n?工作时间减少了，为什么成果没有下降？|工作效率提高了|员工晚上在家加班|公司多招了员工|任务减少了一半\n?这一制度为什么不适合所有行业？|有些单位需要随时有人工作，成本会上升|有些员工不愿意休息|有些公司不想发工资|有些国家的法律不允许\n?这场试验说明了什么？|工作时间长不等于成果多|工作时间越短越好|所有公司都应该每周工作四天|员工不需要休息\n##\n苏州园林是中国古典园林的代表。与西方园林追求整齐、对称不同，中国园林讲究的是：园子虽然是人工建造的，看上去却应当像自然形成的一样。\n走进苏州的任何一座园林，你都很难一眼看到全部的景色。设计者特意用墙壁、石头和树木把空间分开，游人沿着弯曲的小路往前走，每拐一个弯，眼前就出现一幅新的画面。园中的窗户也很有讲究，它们的形状各不相同，透过每一扇窗望出去，都是一幅精心安排的风景画。\n园林的主人大都是退休的官员或读书人。他们把园林当作远离官场、亲近自然的地方，在这里读书、画画、会见朋友。因此，园中的每一处建筑、每一块石头，往往都有一个像诗一样的名字，体现着主人的理想与追求。\n如今，苏州有九座古典园林被列为世界文化遗产。有学者认为，苏州园林留给今天的启示是：好的居住环境并不在于面积的大小，而在于人与自然之间是否达到了和谐。\n?与西方园林相比，中国园林追求什么？|看上去像自然形成的|整齐和对称|面积越大越好|建筑越高越好\n?根据这段话，在苏州园林里游览有什么特点？|每拐一个弯就看到新的景色|站在门口能看到全部风景|园林里的路都是直的|游人必须走得很快\n?园林的主人把园林当作什么样的地方？|亲近自然、读书会友的地方|做生意的地方|举办比赛的地方|种植粮食的地方\n?学者认为苏州园林给今天的启示是什么？|居住环境的关键是人与自然的和谐|房子的面积越大越好|应该多修建古典园林|城市里不需要园林\n##\n古人说：“行百里者半九十。”意思是，走一百里路，走到九十里才算走了一半。这句话刚听起来不合道理，仔细想想却很有道理：一件事越接近完成，往往越困难，也越容易被放弃。\n我曾经参加过一次登山活动。出发时大家有说有笑，体力充足；爬到一半，虽然累，但看着不断升高的位置，还能互相鼓励。最难的是最后那一段：山顶似乎就在眼前，可是空气越来越少，每走一步都要停下来休息，脑子里只剩下一个想法——放弃吧，已经爬得够高了。同行的二十个人中，有七个就是在离山顶不到三百米的地方选择了下山。\n工作和学习也是如此。写一篇论文，第一遍写完时人们往往松一口气，以为已经成功了；其实，反复修改、检查每一个数据，才是决定质量的关键，而这恰恰是最枯燥、最考验耐心的部分。许多本来可以做到优秀的事情，最后只停留在“还可以”的水平，原因就在这里。\n所以，当你觉得“差不多了”的时候，可以提醒自己：真正的后一半，也许才刚刚开始。\n?“行百里者半九十”这句话想说明什么？|事情越接近完成越困难|走路要走一百里|做事只要完成一半就行|九十里比一百里更远\n?登山时最难的是哪一段？|快到山顶的最后一段|刚出发的时候|爬到一半的时候|下山的时候\n?作者认为决定论文质量的关键是什么？|第一遍写完后的反复修改|写完第一遍的速度|论文的长度|题目的选择\n?作者建议人们觉得“差不多了”的时候怎么做？|提醒自己最难的部分可能才开始|马上停下来休息|把事情交给别人|换一个新的目标\n","rd":"##L2 a\n近年来，“先消费、后付款”的支付方式在年轻人中十分流行。只要在手机上点击几下，就可以把一笔较大的支出分成十二期甚至二十四期付清，看上去每个月只需支付很少的金额。然而，这种便捷的背后隐藏着不小的风险。首先，分期付款并不是免费的，各种手续费加在一起，实际的利息往往高于银行贷款。其次，由于付款时感觉不到“疼”，人们很容易购买超出自己能力的商品，等到账单一张接一张地到来，才发现已经难以承受。一位金融专家提醒，分期本身没有错，它适用于确实必要的大额支出，比如教育和医疗；但如果只是为了满足一时的欲望，那么今天省下的每一分力气，都将成为明天加倍的负担。\n?根据这段话，分期付款的实际成本怎么样？|往往比银行贷款的利息还高|完全免费|只收很少的手续费|和一次付清没有区别\n?专家认为分期付款适合用在什么地方？|教育、医疗等必要的大额支出|购买最新款的手机|满足一时的消费欲望|所有的日常消费\n##L5 c\n很多司机都有这样的体会：自己排的那条车道似乎总是最慢的，于是频繁地变换车道。然而研究表明，这种做法【未必|务必|必定|何必】能节省时间。在拥挤的道路上，各条车道的平均速度其实相差不大，司机之所以觉得旁边更快，是因为超过别人只需几秒钟，而被别人超过的过程却显得格外【漫长|短暂|匆忙|迅速】。更严重的是，频繁变换车道会迫使后面的车辆刹车，【从而|以便|除非|凡是】引起一连串的减速，使整条道路变得更堵。\n##L8 a\n在中国，由祖父母照顾孙子孙女的现象相当普遍。年轻父母工作繁忙，把孩子交给老人，既放心又节省开支。不过，两代人在教育观念上的差异，常常引发家庭矛盾。老人大都心疼孩子，容易满足孩子的各种要求；而年轻父母更强调规则，希望从小培养孩子的独立能力。孩子很快就会发现，在爷爷奶奶那儿行得通的办法，在爸爸妈妈那儿却行不通，于是学会了“看人说话”。教育专家指出，解决这一问题的关键不在于谁对谁错，而在于全家人事先就一些基本原则达成一致，比如看电视的时间、吃零食的数量等。只有大人的态度保持一致，孩子才能建立起稳定的行为习惯。\n?两代人在教育孩子方面的主要差异是什么？|老人容易满足孩子，父母更强调规则|老人比父母更严格|父母不愿意照顾孩子|老人不同意孩子上学\n?专家认为解决问题的关键是什么？|全家人对基本原则达成一致|让老人回自己的家|完全听年轻父母的|不让孩子看电视\n##L11 i\n钓鱼是一项古老的休闲活动。在外人看来，钓鱼的人一坐就是大半天，【既不说话，也不走动】，实在枯燥得很。可是钓鱼的人却说，他们享受的正是这份安静。水面上的任何一点儿变化，【都需要集中全部注意力去观察】，平时工作中的烦恼自然就被抛到了脑后。更有意思的是，【很多人把辛苦钓上来的鱼又放回了水里】。对他们来说，重要的不是收获了多少，【而是等待过程中内心的平静】。\n##L14 a\n十年前，大规模的网络公开课刚出现时，人们曾预言它将彻底改变高等教育：任何人只要能上网，就可以免费学习世界一流大学的课程。然而十年过去了，传统大学依旧存在，网络课程的完成率却始终不到百分之十。为什么会这样？研究者发现，网络学习最缺乏的不是优质的内容，而是约束和陪伴。在教室里，有老师的监督、同学的竞争和固定的时间表；而一个人面对屏幕时，除非有极强的自律能力，否则很难长期坚持下去。因此，近年来不少平台开始调整做法：把学员分成小组，安排助教定期解答问题，并设置截止日期。实践证明，凡是采取了这些措施的课程，完成率都有了显著的提高。\n?网络课程的完成率为什么很低？|缺乏约束和陪伴|课程内容质量太差|收费太高|上网不方便\n?一些平台采取了什么措施？|分组学习并设置截止日期|降低课程的难度|取消所有考试|把课程改为收费\n##L17 c\n心理学上有一个著名的实验。研究人员给每个孩子一块糖，并告诉他们：如果能等十五分钟再吃，就可以得到第二块。结果，有的孩子马上就把糖吃掉了，有的则想尽办法【转移|转让|转交|转动】自己的注意力，坚持到了最后。多年以后的跟踪调查显示，当年能够等待的孩子，在学习和工作上的表现普遍更为【出色|枯燥|脆弱|尴尬】。不过，后来的研究者对这一结论提出了【质疑|期望|承诺|赞赏】：孩子能不能等待，在很大程度上取决于家庭环境，而不仅仅是个人的意志。\n##L20 a\n下班以后，手机上的工作群依旧响个不停——这是许多职员的日常。有调查显示，超过六成的职员曾在休息时间通过手机处理工作，平均每天多付出一个多小时。这种“看不见的加班”既没有加班费，也很难被计算在工作量之内。支持者认为，在竞争激烈的行业，随时保持联系是职业精神的体现；反对者则指出，长期处于随时准备工作的状态，会使人无法真正放松，最终反而降低工作效率。目前，已有一些企业明确规定：除非遇到紧急情况，否则晚上八点以后不得在工作群里发布任务。专家认为，把工作与生活清楚地分开，不仅是对员工的保护，从长远来看也有利于企业自身的发展。\n?“看不见的加班”指的是什么？|休息时间用手机处理工作|在办公室加班到深夜|周末到公司开会|没有完成当天的任务\n?一些企业做出了什么规定？|晚上八点后一般不在工作群发布任务|员工下班后必须关机|加班必须支付三倍工资|取消所有的工作群\n##L23 i\n一家公司招聘销售主管，最后剩下三位应聘者。总经理给他们出了同一道题：【想办法把梳子卖给山上寺庙里的和尚】。第一个人觉得这根本不可能，【当场就放弃了】。第二个人跑了三座山，好不容易才卖出去一把。第三个人却带回了一千把的订单。原来，他对寺庙的负责人说：前来参观的游客很多，【如果在梳子上刻上寺庙的名字作为纪念品】，一定很受欢迎。总经理最后录用了第三个人，因为他明白：【销售的关键不是推销产品，而是发现需求】。\n##L26 a\n随着新能源汽车的普及，一个新的问题逐渐引起人们的关注：数量庞大的旧电池该如何处理？一辆电动汽车的电池通常在使用八年左右后，容量会下降到原来的百分之八十以下，不再适合继续装在车上。如果随意丢弃，电池中的金属会对土壤和水源造成严重污染。实际上，这些“退休”的电池并不是毫无用处。经过检测和重新组合，它们可以用于储存太阳能和风力发电产生的电力；等到彻底不能使用时，其中的金属材料还可以被提取出来，再次用于生产新电池。有专家估计，到二〇三〇年，电池回收将形成一个规模上千亿元的产业。不过，目前正规的回收渠道还不够健全，不少旧电池流入了缺乏技术的小工厂，这是今后需要重点解决的问题。\n?旧电池如果被随意丢弃，会造成什么后果？|污染土壤和水源|引起爆炸|浪费大量电力|影响汽车的销量\n?目前电池回收存在的主要问题是什么？|正规的回收渠道不够健全|旧电池没有任何用处|回收的成本太高|没有人愿意买电动汽车\n##L29 c\n北极的冰正在以惊人的速度融化。科学家通过卫星【监测|监督|检验|鉴定】发现，过去四十年里，夏季海冰的面积减少了将近一半。冰面能把大部分阳光挡回太空，而深色的海水却会吸收热量，因此冰越少，海水升温越快，冰的融化也【进而|以便|除非|未必】加速，形成一种难以打破的循环。这一变化的影响并不【限于|属于|易于|勇于】北极地区：它会改变全球的大气流动，使许多地方出现更加频繁的极端天气。\n##L32 a\n提起老年人的消费，人们往往只想到保健品和医药。然而，一个被称为“银发经济”的新市场正在迅速兴起。如今六十多岁的人大都受过良好的教育，退休金稳定，子女也已独立，他们愿意为提高生活质量而花钱。老年大学里的摄影班、舞蹈班常常一开始报名就满了；专为老年人设计的旅游线路节奏较慢，并配有医生，很受欢迎；一些企业还开发了字体更大、操作更简单的智能手机。不过，这个市场也存在不少问题。有的商家抓住老年人关心健康的心理，夸大产品的功效，甚至进行欺骗。专家建议，一方面要加强监督，严厉惩罚违法行为；另一方面，子女也应多关心父母，帮助他们提高识别能力。\n?“银发经济”兴起的原因之一是什么？|现在的老年人有稳定的收入和消费意愿|老年人的身体越来越差|保健品的价格下降了|子女给父母很多钱\n?这个市场存在什么问题？|有的商家夸大功效欺骗老年人|老年人不愿意花钱|适合老年人的产品太多|老年大学招不到学生\n##L35 i\n二十年前，这个村子里的年轻人几乎都外出打工了，【留下的只有老人和孩子】。田地没人种，房子没人修，整个村庄显得毫无生气。转变发生在五年前。村里利用山上的茶园和古老的民居发展旅游业，【并把空着的老房子改造成了民宿】。消息传出去以后，【不少在城里工作的年轻人陆续回到了家乡】。他们有的开饭店，有的做导游，有的通过网络销售茶叶。如今，村里的人均收入比五年前翻了一番，【更重要的是，孩子们终于可以和父母生活在一起了】。\n##L38 a\n近几年，以中国神话和古典文学为题材的动画电影接连取得成功，观众一部比一部多。这些影片的共同特点是：故事来自人人熟悉的传统作品，表现手法却十分现代。创作者没有照着原著拍，而是对人物进行了大胆的改编，使几百年前的英雄有了当代年轻人的烦恼与追求。有评论认为，这种改编赋予了传统文化新的生命力；也有人担心，过度的改编会让观众误解原著。一位导演在访谈中表示，传承并不意味着一点儿不变地保存，每个时代都可以用自己的方式重新讲述古老的故事，关键在于是否尊重原作的精神。他还说，一部动画电影从策划到上映往往需要五年以上，技术虽然重要，但真正打动观众的，永远是故事本身。\n?这些动画电影有什么共同特点？|传统的故事，现代的表现手法|完全照着原著拍|只面向儿童观众|由外国公司制作\n?那位导演认为改编的关键是什么？|尊重原作的精神|使用最先进的技术|不改变任何情节|尽量缩短制作时间\n##L41 c\n在马拉松比赛中，许多业余选手都会在三十公里左右遇到一种特别的情况：双腿变得十分沉重，每迈一步都异常【艰难|坚固|枯燥|尴尬】。这是因为身体里储存的能量已经基本【消耗|消除|消灭|消毒】完了。有经验的选手会在赛前几天调整饮食，比赛中【定时|顿时|一时|当场】补充水分和糖分，把这种情况出现的时间尽量往后推。\n##L44 a\n二十四节气是中国古人通过长期观察太阳的运行而总结出来的时间制度。它把一年平均分为二十四段，每段大约十五天，并根据气候和自然现象的变化分别命名，如“立春”“清明”“冬至”等。在没有天气预报的古代，农民正是依靠节气来安排播种和收获的。直到今天，尽管现代农业已经不再完全依赖节气，它仍旧深刻地影响着人们的日常生活：清明前后，人们外出游玩、纪念祖先；冬至这一天，北方人吃饺子，南方人吃汤圆。二〇一六年，二十四节气被列为联合国的文化遗产。有学者指出，节气所体现的，是中国人尊重自然、适应自然的生活智慧，这一理念在强调环境保护的今天，依旧具有现实意义。\n?古代农民依靠节气做什么？|安排播种和收获|预测地震|计算税收|决定结婚的日子\n?学者认为节气体现了什么？|尊重自然的生活智慧|古人对太阳的崇拜|南北方饮食的差异|现代农业的先进技术\n##L47 i\n瓷器是中国古代最重要的发明之一。早在一千多年前，【中国的瓷器就通过海上和陆上的商路运往世界各地】。在当时的欧洲，一件来自东方的瓷器比同样重量的黄金还要贵重，【只有王宫和贵族家庭才用得起】。欧洲人花了几百年的时间研究瓷器的制作方法，【直到十八世纪初才终于获得成功】。有意思的是，英语里“瓷器”和“中国”是同一个单词，【可见瓷器在世界眼中曾经就是中国的象征】。\n","wr":"#P A request for leave\n?你是某公司市场部的职员小李。由于父亲突然住院，你需要请假三天。请给部门的王经理写一封请假的电子邮件，说明原因、时间以及工作安排。\n+因、特向您申请、于……至……、转交、如有紧急情况、望批准、此致 敬礼\n=尊敬的王经理：\n=您好！\n=我是市场部的小李。因我父亲突然生病住院，需要有人照顾，特向您申请于本月十二日至十四日请假三天。\n=请假期间，我手上的客户资料已全部整理好，并转交给同事小张，他会替我处理日常事务。如有紧急情况，您可以随时通过手机与我联系。十五日我将按时回到公司上班。\n=给工作带来不便，请您理解。望批准！\n=此致\n=敬礼！\n=小李\n=十月十日\n#P A community notice\n?你所在的社区下周六将举办一次旧物交换活动。请你以社区服务中心的名义写一份通知，说明活动的时间、地点、内容和注意事项。\n+为……，定于……、凡是……均可……、不在……范围之内、如遇……、欢迎积极参与\n=通知\n=各位居民：\n=为提倡节约、减少浪费，本社区定于十月十八日（周六）上午九点至十二点，在小区中心广场举办旧物交换活动。\n=凡是家中不再使用的图书、玩具、小家电等，均可带到现场与邻居交换。请确保物品干净、能够正常使用；食品、药品不在交换范围之内。\n=活动当天将设置登记处，请大家有序参加。如遇下雨，活动推迟一周举行。\n=欢迎各位居民积极参与！\n=社区服务中心\n=十月十日\n#P A letter of complaint\n?你上个月在网上买了一台空气净化器，使用不到两周就出现了故障，联系客服后一直没有得到解决。请给该公司写一封投诉信，说明情况并提出要求。\n+于……购买、不料、一再、到目前为止、现要求……、否则、期待您的答复\n=尊敬的负责人：\n=您好！\n=我于九月五日在贵公司的网上商店购买了一台空气净化器。不料使用不到两周，机器就无法启动了。我先后三次联系客服，对方一再表示“尽快处理”，但到目前为止仍未解决。\n=这件事已严重影响了我的正常生活。现要求贵公司在一周之内为我更换一台新机器，或者全额退款。否则，我将向消费者协会投诉。\n=期待您的答复。\n=顾客：张华\n=十月十日\n#P Congratulations and an invitation\n?你的好朋友小林最近获得了全国青年摄影比赛的一等奖。请给他写一封信，表达你的祝贺，并邀请他来你所在的大学做一次交流。\n+听说……，真心为你高兴、付出、荣誉、盼望、不知……是否方便、往返、期待你的回复\n=小林：\n=你好！\n=听说你在全国青年摄影比赛中获得了一等奖，我真心为你高兴！这些年你背着相机跑遍了大大小小的村庄，付出的辛苦大家都看在眼里，这个荣誉来得一点儿也不意外。\n=我们学校的摄影协会下个月将举办一次作品展，同学们都盼望能听听你的创作经验。不知你十一月中旬是否方便来做一次交流？往返的交通和住宿都由协会安排。\n=期待你的回复，也祝你今后拍出更多打动人的作品！\n=你的朋友 王明\n=十月十日\n#P Rescheduling a meeting\n?你原定于本周五下午与客户陈经理见面，讨论合作方案，但因临时有重要会议无法前往。请给陈经理写一封邮件，表示歉意，说明原因，并提出新的见面时间。\n+原定于、因……无法……、在此表示歉意、以便、不知……是否方便、给您带来不便\n=尊敬的陈经理：\n=您好！\n=非常抱歉地通知您，原定于本周五下午三点的见面，因公司临时安排了一场重要会议，我无法按时前往，在此向您表示真诚的歉意。\n=关于合作方案，我方已根据上次的讨论做了修改，稍后会把文件发给您，以便您提前了解。不知下周二或周三下午您是否方便？具体的时间和地点都按您的安排来定。\n=给您带来不便，请多理解。期待您的回复。\n=此致\n=敬礼！\n=李明\n=十月十日\n#P An anniversary invitation\n?你们公司计划在下个月举办成立十周年的庆祝活动。请以公司办公室的名义，给一位长期合作的客户写一封邀请信，说明活动的时间、地点和主要内容。\n+十年来、离不开、信赖、定于、特邀请您参加、如您能够出席、以便、期待您的到来\n=尊敬的赵总经理：\n=您好！\n=今年是本公司成立十周年。十年来，公司的每一步发展都离不开贵公司的支持与信赖。为表达感谢，我们定于十一月八日（周六）晚六点，在国际饭店三层举办十周年庆祝活动，特邀请您参加。\n=活动内容包括公司发展回顾、为优秀合作伙伴颁奖以及晚宴。如您能够出席，请于十月三十日前告知，以便我们安排座位和接待。\n=期待您的到来！\n=此致\n=敬礼！\n=新华科技公司办公室\n=十月十日\n#E Big city or home town?\n?有人认为，年轻人应该留在大城市发展；也有人认为，回到家乡同样可以实现自己的价值。请谈谈你的看法。\n+在我看来、优势、然而、相比之下、不仅……还……、凡是……都……、就算……也……\n=大学毕业以后，是留在大城市，还是回到家乡？在我看来，这个问题没有标准答案，关键在于哪里更适合自己的发展。\n=大城市的优势是明显的：机会多，信息流通快，各行各业的优秀人才聚集在一起，年轻人能在竞争中迅速成长。我的表姐毕业后留在上海，五年之内就从普通职员做到了部门主管，这在小城市是很难想象的。\n=然而，大城市的生活成本高，工作节奏快，不少人每天花三个小时在路上，身心都十分疲劳。相比之下，家乡的生活压力较小，而且随着网络和交通的发展，许多小城市同样出现了新兴产业。我的一位同学回到老家，利用直播销售当地的农产品，不仅自己创业成功，还带动了村民的收入。\n=因此，我认为选择的依据不应是“别人都怎么做”，而应是自己的专业、性格和长远目标。凡是能让人发挥特长、内心踏实的地方，都值得留下。无论在哪里，只要不断学习、认真做事，就算起点不高，也能实现自己的价值。\n#E An experience that changed me\n?请以“一次改变我的经历”为题，写一篇文章。\n+凡是……一律……、左思右想、不料、恰好、虽……却……、从那以后、未必\n=高中二年级以前，我是一个非常害怕失败的人。凡是没有把握的事情，我一律不做，课堂上从不主动发言，更不用说参加比赛了。\n=改变发生在那年的秋天。学校举办辩论比赛，班里原定的一位选手突然生病，老师临时让我代替他上场。我左思右想，找了各种理由想推掉，可老师只说了一句话：“输了就输了，没有人会笑话一个敢于尝试的人。”\n=比赛那天，我紧张得手心全是汗，第一次发言时甚至忘了准备好的内容。不料对方提出的一个问题恰好是我熟悉的，我一下子有了信心，越说越流利。最后我们队虽没有获得冠军，我却被评为“最佳选手”。\n=这次经历让我明白，很多时候把我们挡在门外的不是能力，而是对失败的恐惧。从那以后，我开始主动争取各种机会：竞选学生会主席，报名去山区做志愿者。当然，我也失败过不少次，但每一次失败都让我比以前更强大。\n=如今回想起来，我仍旧感激那位老师。假如没有他当时的那句话，我未必有勇气迈出第一步。\n#E Will machines take our jobs?\n?随着人工智能的发展，有人担心许多工作将被机器取代。你怎么看这个问题？\n+凡是……都……、一再证明、在……的同时、到目前为止、与其……不如……、就算……也……\n=近年来，人工智能发展迅速，不少人担心自己的工作有一天会被机器取代。我认为，这种担心有一定道理，但没有必要过于悲观。\n=首先应该承认，凡是重复性强、规则明确的工作，机器确实做得比人更快、更准确。工厂里的生产线、银行的窗口、文件的初步翻译，都已经大量使用了智能设备。从这个角度看，一部分岗位的消失是难以避免的。\n=然而，历史一再证明，新技术在淘汰旧职业的同时，也会创造出新的职业。汽车代替了马车，却带来了司机、修理工和整个汽车产业。同样，人工智能的普及也需要大量的人来设计、管理和监督它。更重要的是，创造力、同情心以及与人沟通的能力，是到目前为止机器无法具备的。医生对病人的安慰、教师对学生的鼓励，都不是数据所能代替的。\n=因此，与其害怕被取代，不如主动学习，把人工智能当作提高效率的工具。就算技术再先进，决定未来的仍旧是懂得使用技术的人。\n#E Preserve tradition or renew it?\n?有人说，传统文化应该原样保存；也有人说，传统文化只有不断创新才能传下去。请谈谈你的看法。\n+之所以……是因为……、一旦、加以保护、虽……却……、X归X，Y归Y、总之\n=对于传统文化，是原样保存，还是大胆创新？我的看法是：保存是基础，创新是出路，二者都不能缺少。\n=传统文化之所以珍贵，是因为它记录了一个民族的历史与智慧。古老的建筑、文物和技艺一旦消失，就再也无法恢复，因此必须认真地加以保护。在这一点上，任何“创新”都不能以破坏为代价。\n=但是，仅仅把传统锁在博物馆里是远远不够的。文化只有被人们了解、喜爱和使用，才算真正活着。近年来，一些博物馆把文物上的图案设计成日常用品，戏曲演员尝试用现代音乐重新表演经典作品，结果吸引了大批年轻观众。这些做法虽引起过争议，却让更多人愿意走近传统。\n=当然，创新归创新，原则归原则。如果为了商业利益而随意改变历史事实，或者把严肃的文化变成低级的娱乐，那就不是传承，而是伤害。\n=总之，我认为传统文化就像一棵大树：根必须深深地留在土里，枝叶却应当朝着新的阳光生长。\n#E Knowledge from short videos\n?现在很多人习惯通过短视频获取信息和知识。有人认为这很方便，也有人认为这会让人失去深入思考的能力。请谈谈你的看法。\n+应当从两个方面来看、优势、毫无、然而、净、片面、以便、关键在于\n=如今，打开手机看几分钟短视频，已经成为许多人获取信息的主要方式。对于这种现象，我认为应当从两个方面来看。\n=不能否认，短视频有它的优势。它形式生动，时间短，适合在坐车、排队的空闲时间观看。一些科普工作者把复杂的知识压缩成两三分钟的讲解，使原本对科学毫无兴趣的人也愿意了解。我自己就是通过短视频第一次接触到天文学，并由此产生了浓厚的兴趣。\n=然而，短视频的问题同样不能忽略。几分钟的内容只能提供结论，很难展示思考的过程；长期习惯于这种方式，人的注意力会变得越来越难以集中，读一本书、看一篇长文章都觉得吃力。此外，平台总是推荐我们喜欢的内容，时间一长，我们听到的净是和自己相同的声音，看问题就容易片面。\n=因此，我的态度是：把短视频当作“入口”，而不是“终点”。对某个话题产生兴趣以后，应当进一步阅读相关的书籍和文章，以便获得完整、系统的认识。工具本身没有好坏，关键在于使用它的人是否保持了独立思考的习惯。\n#E What success means to me\n?请以“我眼中的成功”为题，写一篇文章，谈谈你对成功的理解。\n+提起、凡是……没有不……、一番、未必、踏踏实实、长久\n=提起成功，很多人首先想到的是金钱、地位和名气。小时候我也这样认为，直到认识了我的邻居陈爷爷，我对成功的理解才发生了改变。\n=陈爷爷是一名普通的修鞋师傅，在我们那条街上工作了四十年。他没有店铺，收入也不高，按照一般的标准，实在算不上“成功人士”。然而，凡是找他修过鞋的人，没有不夸他技艺高的。一双在别人看来只能扔掉的旧鞋，经他的手修补一番，往往还能再穿好几年。遇到生活困难的老人，他常常只收一半的钱，甚至不收钱。\n=有一次我问他：“您干了一辈子，就没想过换个轻松又赚钱的工作吗？”他笑着说：“把一件小事做好，让别人需要你，我就很满足了。”这句话我一直记到今天。\n=在我眼中，成功未必意味着站在最高的地方，而是找到自己擅长并且热爱的事，踏踏实实地把它做好，同时给周围的人带来一点儿温暖。金钱和名气也许会随着时间消失，但一个人认真生活所留下的价值，却会长久地留在别人心里。\n#R\n有一位年轻人向一位老师傅学做家具。头三年，师傅只让他磨工具，别的什么也不教。年轻人很不耐烦，觉得是在浪费时间。三年后，师傅才开始教他做家具。这时他发现，因为工具用得极其熟练，别人半年才能学会的技术，他一个月就掌握了。他这才明白，看似简单的基础，恰恰决定了一个人能走多远。\n#R\n一项调查显示，超过七成的城市居民每天使用手机的时间在五个小时以上。专家指出，长时间低头看手机，不但容易造成颈椎疼痛和视力下降，还会减少面对面的交流。他们建议，吃饭时和睡觉前一个小时最好把手机放在别的房间，每天至少留出半个小时进行户外活动。\n#R\n小陈的工作是给顾客送餐。一天深夜，他到一位顾客家门口，敲了半天门却没有人回应。他闻到屋里有一股很浓的奇怪气味，立刻报了警，并叫来了邻居。救援人员赶到后把门打开，发现一位老人已经晕倒在地上。由于抢救及时，老人很快脱离了危险。事后，小陈只说了一句：“换了谁都会这么做的。”\n#R\n很多城市为了缓解交通拥挤，不断修建更宽的道路。然而研究发现，道路越宽，开车出行的人反而越多，过不了几年，新修的道路又会变得同样拥挤。因此，越来越多的专家主张，解决交通问题的根本办法不是修路，而是发展公共交通，鼓励市民乘坐地铁和公共汽车。\n#S The umbrella\n🌧️🚏😟|It is raining hard; a young woman without an umbrella waits at a bus stop.\n👵☂️🏢|An old lady shares her umbrella and walks her to her office building.\n💼😮|A week later, at work, the young woman meets an important new client.\n🤝😊|The client turns out to be the old lady's son; they sign the contract happily.\n=一个下着大雨的早晨，小张没带伞，站在公共汽车站发愁。这时，一位老太太走过来，把伞举到她头上，还特地陪她走到了公司楼下。小张十分感激，可是忘了问老人的名字。一个星期以后，公司来了一位重要的客户。交谈中，客户提起自己的母亲前几天送一个姑娘去上班的事，小张这才发现，那位老太太恰好就是他的母亲。因为这件事，双方很快就建立了信任，顺利地签了合同。\n#S The lost child\n🛍️👦😭|In a crowded shopping centre a little boy is crying; he has lost his parents.\n👨‍🎓🤝👦|A student comforts him and leads him to the service desk.\n📢👩‍💼|The staff make an announcement over the loudspeaker.\n👨‍👩‍👦🙏|The parents rush over, hug the boy and thank the student.\n=周末的商场里人山人海。一个小男孩和父母走散了，站在原地大哭。一位大学生看见了，赶忙走过去安慰他，并牵着他的手来到服务台。工作人员立刻通过广播寻找孩子的父母。没过多久，一对年轻夫妇匆匆忙忙地跑了过来，一把抱住孩子，眼泪都流了下来。他们再三向大学生表示感谢，大学生却只是笑了笑，说这是他应该做的。\n#Q\n?有人认为，网络让人与人之间的交流变得更加方便；也有人认为，网络让人变得更加孤独。你怎么看？\n+State your position. One benefit with an example (family abroad, interest groups). One harm (quick contact replacing real talk). A condition for healthy use. Conclusion.\n#Q\n?在你看来，一个好的领导应该具备哪些素质？请举例说明。\n+Two or three qualities (listens, takes responsibility, develops people). A leader you have known as an example. What happens without these qualities. Conclusion.\n#Q\n?你认为保护环境和发展经济之间有矛盾吗？应该怎样处理二者的关系？\n+Short-term conflict (cost, jobs) against long-term agreement (health, new industries). One example such as new energy. What government, companies and individuals can each do. Conclusion.\n#Q\n?很多国家的人口正在老龄化。你认为社会应该怎样应对这一变化？\n+What ageing changes (workforce, pensions, care). Measures: flexible retirement, community care, technology, lifelong learning. The role of the family. Conclusion.\n"};
</script>
<script>
'use strict';
const C=DATA.cfg;
let RNG=Math.random;
const $=s=>document.querySelector(s);
const rnd=n=>Math.floor(RNG()*n);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const uniq=a=>[...new Set(a)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lines=s=>(s||'').split('\n').map(x=>x.trim()).filter(Boolean);

/* ================= Data ================= */
const W={},V=[],HZ=DATA.HZ,HL=DATA.HL,G={},GEX={},KW={},RD={},EX={},WR={P:[],E:[],R:[],S:[],Q:[]};
DATA.V.forEach((l,i)=>V.push({t:l.t,n:l.n,items:l.w.map((x,j)=>W['w:'+i+'.'+j]={w:x[0],p:x[1],m:x[2],L:i+1,key:'w:'+i+'.'+j})}));
const WALL=Object.values(W),ORD=HL.flat();
Object.keys(HZ).forEach(c=>{const h=HZ[c];h.c=c;h.key='k:'+c;h.w=h.w.map(x=>({w:x[0],p:x[1],m:x[2]}))});
HL.forEach((a,i)=>a.forEach(c=>HZ[c].L=i+1));
function blocks(ls){const out=[];let b;for(const ln of ls){if(ln.startsWith('##')){b={h:ln.slice(2).trim(),t:[],qs:[]};out.push(b)}else if(ln[0]==='?'){const p=ln.slice(1).split('|');b.qs.push({q:p[0],opts:p.slice(1)})}else b.t.push(ln)}return out}
function l1(ln){const i=ln.indexOf('?'),p=ln.slice(i+1).split('|');return {t:ln.slice(0,i).split('/'),qs:[{q:p[0],opts:p.slice(1)}]}}
(function load(){
  let L,pt,cur,si=0,sec;const buf={};
  for(const ln of lines(DATA.g)){
    if(ln.startsWith('##')){L=+ln.slice(2);G[L]=[];continue}
    const c=ln[0];
    if(c==='@'){const [t,m,s]=ln.slice(1).split('|');pt={t,m,s,ex:'',tip:'',x:[]};G[L].push(pt);continue}
    if(c==='!'){pt.tip=ln.slice(1);continue}
    if(c==='>'||c==='~'){const j=ln.lastIndexOf('=');let opts;const raw=ln.slice(1,j).replace(/【([^】]+)】/,(_,s)=>{opts=s.split('|');return '\u0001'});
      const e={raw,opts,en:ln.slice(j+1),g:pt,L,fresh:c==='~',key:`g:${L}:${G[L].length-1}:${pt.x.length}`};pt.x.push(e);GEX[e.key]=e;continue}
    pt.ex+=(pt.ex?' ':'')+ln;
  }
  for(const ln of lines(DATA.kw)){
    if(ln.startsWith('##')){const sp=ln.indexOf(' ');cur=KW[+ln.slice(2,sp)]={title:ln.slice(sp+1),lines:[],q:null};continue}
    if(ln[0]==='?'){const p=ln.slice(1).split('|');cur.q={q:p[0],opts:p.slice(1)};continue}
    const j=ln.lastIndexOf('=');cur.lines.push({s:ln[0],zh:ln.slice(2,j),en:ln.slice(j+1),seg:(DATA.seg[si++]||'').split('|')});
  }
  for(const ln of lines(DATA.ex)){if(/^\[[\w.]+\]$/.test(ln)){sec=ln.slice(1,-1);buf[sec]=[];continue}buf[sec].push(ln)}
  for(const k in buf){const f=C.fmt[k.split('.')[0]];EX[k]=f==='s'?buf[k].map(l1):f==='r'?buf[k]:blocks(buf[k])}
  blocks(lines(DATA.rd)).forEach(b=>{const [l,t]=b.h.split(' ');b.type=t;RD[+l.slice(1)]=b});
  let b;for(const ln of lines(DATA.wr)){const c=ln[0];
    if(c==='#'){b={title:ln.slice(2).trim(),pan:[],hint:'',model:'',prompt:'',text:''};WR[ln[1]].push(b)}
    else if(c==='+')b.hint=ln.slice(1);else if(c==='=')b.model+=(b.model?'\n':'')+ln.slice(1);else if(c==='?')b.prompt=ln.slice(1);
    else if(ln.includes('|')&&!/[\u4e00-\u9fff]/.test(ln.split('|')[0])){const p=ln.split('|');b.pan.push({e:p[0],n:p[1]})}
    else b.text+=(b.text?'\n':'')+ln}
})();
const NM=Object.keys(EX).filter(k=>k.startsWith('L1.')).length;
const WIDX={};WALL.forEach(w=>{if(w.w.length>1)(WIDX[w.w[0]]=WIDX[w.w[0]]||[]).push(w)});
Object.values(WIDX).forEach(a=>a.sort((x,y)=>y.w.length-x.w.length));
function newWords(t){const out=[];for(let i=0;i<t.length;i++){const c=WIDX[t[i]];if(!c)continue;const w=c.find(x=>t.startsWith(x.w,i));if(w){if(!out.includes(w))out.push(w);i+=w.w.length-1}}return out}
const nwHtml=t=>{const ws=newWords(t);return ws.length?`<div class="nw">${ws.map(w=>`<span><b class="zh">${w.w}</b> ${w.p} · ${esc(w.m)}</span>`).join('')}</div>`:''};

/* ================= Plan ================= */
const NL=48,TOTAL=70,LAST=56,cache={};
const FIN=['final','write','mock','err','write','speak','final','mock','err','write','speak','remix','final','rest'];
const PH=[{title:'Lessons',w:8,desc:C.phd[0]},{title:'Exam practice',w:2,desc:C.phd[1]}];
function D(n){
  if(cache[n])return cache[n];
  const w=Math.ceil(n/7),dow=(n-1)%7,d={n,w,dow,chars:[],vocab:[],theme:'',gram:[],kw:null,read:null};
  if(n>LAST){d.type=FIN[n-LAST-1];d.no=FIN.slice(0,n-LAST).filter(t=>t===d.type).length;if(d.type==='mock')d.no=Math.min(d.no,NM||1)}
  else if(dow===6)d.type='review';
  else{d.type='lesson';const L=d.L=(w-1)*6+dow+1,v=V[L-1];d.chars=HL[L-1];d.gram=G[L]||[];d.read=RD[L]||null;d.vocab=v.items;d.theme=v.t;d.core=v.n;d.kw=KW[L]||null}
  return cache[n]=d;

function loadVoices(){try{const v=speechSynthesis.getVoices();VO=v.filter(x=>/^(zh[-_](CN|Hans)|cmn)/i.test(x.lang));if(!VO.length)VO=v.filter(x=>/^zh/i.test(x.lang)&&!/HK|yue/i.test(x.lang))}catch(e){}}
loadVoices();try{speechSynthesis.addEventListener('voiceschanged',loadVoices)}catch(e){}
function speak(segs,fix){
  try{speechSynthesis.cancel();const rate=fix||(P()&&P().rate)||1;
    segs.forEach(s=>{const u=new SpeechSynthesisUtterance(s.t.replace(/[\u0001“”]/g,''));u.lang='zh-CN';u.rate=rate;
      if(VO.length)u.voice=VO[s.v==='m'&&VO.length>1?1:0];u.pitch=s.v==='m'?.7:s.v==='f'?1.25:1;speechSynthesis.speak(u)});
  }catch(e){toast('This browser cannot read Chinese aloud.')}
}
const say=t=>speak([{t,v:'n'}]);
function stopAudio(){try{speechSynthesis.cancel()}catch(e){}}

/* ================= Building each exercise ================= */
function lessonBefore(n){while(n>=1&&D(n).type!=='lesson')n--;return n}
function reviewQs(n,cnt){
  const days=uniq([1,2,4,7,14,30].map(o=>lessonBefore(n-o)).filter(x=>x>=1));
  const wr=shuf(Object.keys(P().wrong)).slice(0,4).map(qFromKey).filter(Boolean);
  return wr.concat(balanced(merge(days),cnt-wr.length));
}
const freshOf=Ls=>Ls.flatMap(L=>(G[L]||[]).flatMap(p=>p.x.filter(e=>e.fresh)));
const pk=(a,i)=>a.length?a[i%a.length]:null;
function buildSec(n,sec){
  const d=D(n),it=items(n),L=d.L;let qs=[];
  if(sec==='k'){it.k.forEach(k=>qs.push(qHan(k,0),qHan(k,1),qHan(k,2)));qs=shuf(qs)}
  else if(sec==='v')qs=shuf(d.vocab).map(w=>qWord(w));
  else if(sec==='g')d.gram.forEach(p=>p.x.filter(e=>!e.fresh).forEach(e=>qs.push(qGram(e))));
  else if(sec==='r')qs=reviewQs(n,12);
  else if(sec==='c')qs=[qListen(L),...shuf(SENT.filter(s=>s.L===L)).slice(0,3).map(qDict),qCloze(L)];
  else if(sec==='d')qs=[qRead(d.read)];
  else if(sec==='s')qs=speakSet(d.no);
  else if(sec==='w'){const p=wPrompt(d);
    qs=p?[qWrite(p,d.w%2===1)]:d.no===1?[qWrite(pk(WR.P,0),1),qWrite(pk(WR.P,2),1)]:d.no===2?[qWrite(pk(WR.E,1),0),qWrite(pk(WR.E,3),0)]:[qWrite(pk(WR.P,3),1),qWrite(pk(WR.E,2),0)];
    qs=qs.filter(q=>q.w)}
  else if(d.type==='lesson')qs=balanced(it,12).concat(freshOf([L]).map(qGram),shuf(SENT.filter(s=>s.L===L)).slice(0,1).map(qDict));
  else if(d.type==='review'){
    const days=[];for(let i=n-6;i<n;i++)days.push(i);const Ls=days.map(x=>D(x).L);
    qs=balanced(merge(days),20).concat(reviewQs(n-6,4),shuf(freshOf(Ls)).slice(0,5).map(qGram),(EX.WL||[]).slice(d.w-1,d.w).map(b=>qHear(b,'Listening · exam style',1)),
      shuf(Ls).slice(0,1).map(x=>qListen(x,1)),shuf(SENT.filter(s=>Ls.includes(s.L))).slice(0,2).map(qDict),shuf(Ls.filter(x=>RD[x])).slice(0,1).map(x=>qRead(RD[x])));
  }else{
    const all=lessonDays(LAST),wr=d.type==='err'?shuf(Object.keys(P().wrong)).slice(0,20).map(qFromKey):[];
    qs=wr.concat(balanced(merge(shuf(all).slice(0,16)),d.type==='final'?24:12),shuf(freshOf(all.map(x=>D(x).L))).slice(0,6).map(qGram));
    if(d.type!=='rest')qs.push(...shuf(Object.keys(KW)).slice(0,2).map(x=>qListen(+x,1)),...shuf(SENT).slice(0,2).map(qDict),...shuf(Object.values(RD)).slice(0,1).map(b=>qRead(b)));
  }
  return qs.filter(Boolean);
}

/* ================= Mock exam ================= */
function buildExam(no){
  const g=(s,k)=>EX[s+'.'+k]||[],src=s=>no?g(s,no):g(s,1).map((x,i)=>g(s,i%NM+1)[i]||x),k=no||1;
  const mk={h:b=>qHear(b,'',1),c:x=>qPass(x),o:b=>qOrder(b),a:b=>qArt(b),i:x=>qIns(x)};
  return C.parts.map(p=>({title:p.t,min:p.min,qs:p.secs?p.secs.flatMap(([s,t,tag])=>src(s).map(mk[t]).filter(Boolean).map(q=>(q.tag=tag,q))):[qWrite(pk(WR.P,3+k),1),qWrite(pk(WR.E,3+k),0)].filter(q=>q.w)})).filter(p=>p.qs.length);
}
let EXS=null,EXR=null,QZ=null;
const exName=no=>no?'Mock exam '+no:'Remix exam';
function startExam(no,cb){EXS={no,parts:buildExam(no),i:0,done:[],cb};if(!EXS.parts.length){EXS=null;toast('No mock exam is available yet.');return}examIntro()}
function examIntro(){
  const e=EXS,p=e.parts[e.i];stopAudio();$('#quiz').classList.add('on');
  const n=p.qs.reduce((a,q)=>a+qpts(q),0);
  $('#quiz').innerHTML=`<div class="qwrap"><header class="qhead"><button class="x" data-act="qclose" aria-label="Leave">×</button><b>${exName(e.no)}</b><span>${e.i+1}/${e.parts.length}</span></header>
  <div class="result"><h2 style="justify-content:center">${p.title}</h2><p>${p.title==='Writing'?'2 tasks':n+' items'} in ${p.min} minutes. No answers are shown along the way, and the section is handed in automatically when time runs out.</p>
  ${p.title==='Listening'?'<p class="note" style="text-align:left">Turn your sound on. Each recording can be played once only, as in the exam, and the question is spoken after the recording, so read the four options first. The higher voice is the woman, the lower voice is the man.</p>':''}
  ${p.title==='Writing'?`<p class="note" style="text-align:left">${C.wintro}</p>`:''}
  <button class="btn" data-act="exgo">${e.i?'Start the next section':'Start the exam'}</button></div></div>`;
}
function examResult(){
  const e=EXS,sc=z=>{let g=0,m=0;z.qs.forEach((q,i)=>{g+=earned(q,z.res[i]);m+=qpts(q)});return [g,m]},by=t=>e.done.find((z,i)=>e.parts[i].title===t);
  const lz=by('Listening'),rz=by('Reading'),wz=by('Writing'),[lg,lm]=lz?sc(lz):[0,1],[rg,rm]=rz?sc(rz):[0,1];
  EXR={no:e.no,cb:e.cb,lg,lm,rg,rm,lis:Math.round(lg/lm*100),rea:Math.round(rg/rm*100),wq:wz?wz.qs:[],wt:wz?wz.qs.map((q,i)=>wz.ans[i]||''):[],fb:[],rev:[lz,rz].filter(Boolean)};
  EXR.ws=EXR.wq.map((q,i)=>{const n=zlen(EXR.wt[i]);return n>=q.min?60:n>=q.min*.6?40:n?20:0});
  EXS=null;QZ={fin:true};drawExamResult(true);
}
function drawExamResult(top){
  const r=EXR,wri=r.ws.length?Math.round(r.ws.reduce((a,b)=>a+b,0)/r.ws.length):0,tot=r.lis+r.rea+wri,pass=tot>=180,p=P();
  if(r.no)(p.exams=p.exams||{})[r.no]={d:today(),tot,lis:r.lis,rea:r.rea,wri,pass};p.act[today()]=1;save();if(r.cb)r.cb(Math.round(tot/3));

  <div class="result"><div class="seal big ${pass?'':'fail'}">${pass?'合格':'再练'}</div><h2 style="justify-content:center">${tot}/300</h2>
  <table class="tb"><tr><th>Section</th><th>Correct</th><th>Scaled score</th></tr>
  <tr><td>Listening</td><td>${r.lg}/${r.lm}</td><td>${r.lis}/100</td></tr><tr><td>Reading</td><td>${r.rg}/${r.rm}</td><td>${r.rea}/100</td></tr>
  <tr><td>Writing</td><td>${r.ws.length} tasks, marked below</td><td>${wri}/100</td></tr></table>
  <p class="mute">Each section is scaled to 100 from the share of items you got right. 180 was the pass line of the previous HSK ${C.lv}; the official pass mark for the new format had not been published when this plan was written, so treat the stamp as a guide.</p></div>
  ${r.wq.map((q,i)=>`<div class="rev"><p class="qtag">${q.tag}</p><div class="qtext">${q.pic?panels(q.w):`<div class="pass zh">${esc(q.w.prompt)}</div>`}</div><h3>Your text (${zlen(r.wt[i])} characters)</h3><div class="pass zh">${esc(r.wt[i])||'(blank)'}</div>
    <h3>Model answer</h3><div class="pass zh">${esc(q.w.model)}</div>
    <label>Your mark for this task <select data-act="wscore" data-i="${i}">${(bands.some(b=>b[0]===r.ws[i])?bands:[[r.ws[i],r.ws[i]+' · marked by Claude'],...bands]).map(b=>`<option value="${b[0]}"${b[0]===r.ws[i]?' selected':''}>${b[1]}</option>`).join('')}</select></label>
    ${AI?`<div class="row"><button class="btn line" data-act="aimark" data-i="${i}">Ask Claude to mark it</button></div>`:''}<div id="aiout${i}">${r.fb[i]?`<div class="ai">${esc(r.fb[i])}</div>`:''}</div></div>`).join('')}
  ${r.rev.map(z=>{const bad=z.qs.map((q,j)=>z.res[j]===true?'':revItem(q,z.ans[j])).join('');return bad?`<h3 style="margin-top:28px">${z.title}: items to review</h3>${bad}`:''}).join('')}
  <div class="row"><button class="btn" data-act="qclose">Done</button></div></div>`;
  if(top)$('#quiz').scrollTop=0;
}
async function aiMark(q,text,out,done){
  if(!AI)return;if(zlen(text)<15){toast('Write a few sentences first.');return}
  out.innerHTML='<p class="mute">Claude is reading your text. This can take up to a minute.</p>';
  const task=q.pic?`Task 1: write a story of at least ${C.w[0]} Chinese characters based on four pictures. The pictures show: `+q.w.pan.map((x,i)=>`${i+1}) ${x.n}`).join(' '):C.ai[q.first?0:1]+' '+q.w.prompt;
  try{
    const r=await AI(`You are an experienced examiner for the writing section of the new HSK Level ${C.lv} (HSK 3.0). ${task}\n\nCandidate's text:\n${text}\n\nMark it out of 100, where 60 is an adequate Level ${C.lv} answer: task completed, coherent, mostly accurate Level ${C.lv-1}-${C.lv} vocabulary and grammar, required length met. Reply in English as plain text in exactly this layout:\nSCORE: <number>\nOVERALL: <two sentences>\nCORRECTIONS:\n- <original phrase> → <corrected phrase> (<short reason>)\n(list up to 6 real errors only)\nUPGRADE: <two or three Level ${C.lv} words or patterns that would lift this text, each shown in a rewritten sentence from the text>\nIMPROVED VERSION: <the candidate's text rewritten to a strong Level ${C.lv} standard at similar length>`);
    out.innerHTML=`<div class="ai">${esc(r.text)}</div>`;const m=r.text.match(/SCORE:\s*(\d+)/);if(done)done(m?Math.min(100,+m[1]):null,r.text);
  }catch(e){out.innerHTML=`<p class="note">${e&&e.code==='not_granted'?'Marking by Claude was not allowed for this page.':'Claude could not mark the text just now. Try again in a minute.'}</p>`}
}

/* ================= Quiz engine ================= */
const clock=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
const qpts=q=>q.kind==='order'?q.paras.length:q.subs?q.subs.length:1;
const earned=(q,r)=>r===true?qpts(q):typeof r==='number'?r:0;
function keep(){const z=QZ;if(!z||!z.qs)return;const q=z.qs[z.i],e=$('#wtx');if(q&&q.kind==='write'&&e)z.ans[z.i]=e.value}
function startQuiz(title,qs,opt={}){
  qs=qs.filter(Boolean);if(!qs.length){toast('Nothing to practise here yet. Try the whole course as the range.');return}
  if(QZ)clearInterval(QZ.timer);QZ={title,qs,i:0,ans:[],res:[],plays:{},opt,left:opt.limit||0,shown:false,flip:false};
  if(opt.limit)QZ.timer=setInterval(()=>{QZ.left--;const e=$('#qtime');if(e)e.textContent=clock(Math.max(0,QZ.left));if(QZ.left<=0){keep();finishQuiz()}},1000);
  $('#quiz').classList.add('on');drawQ(true);
}
const isOnce=(z,q)=>!!(z.opt.exam||q.once);
function playQ(){
  const z=QZ,q=z.qs[z.i];if(!q.audio)return;const once=isOnce(z,q);
  if(once&&z.plays[z.i]&&!z.shown&&!z.flip){toast('This recording can be played once only.');return}
  z.plays[z.i]=(z.plays[z.i]||0)+1;speak(q.audio,once?1:0);if(once&&!z.shown)drawQ();
}
function optsHtml(q,a,show){
  return q.subs.map((s,j)=>{const t=q.lab?s.q:q.hideq&&!show?'':s.q||'',n=q.subs.length>1&&!q.lab?j+1+'. ':'';
    return `${n||t?`<p class="subq">${n}<span class="${q.lab?'':'zh'}">${esc(t)}</span></p>`:''}<div class="opts">${s.opts.map((o,i)=>`<button class="opt${q.lat?' lat':''}${show?(i===s.a?' ok':i===a[j]?' no':''):i===a[j]?' sel':''}" data-act="pick" data-j="${j}" data-i="${i}" ${show?'disabled':''}><span class="on">${'ABCDE'[i]}</span>${esc(o)}</button>`).join('')}</div>`}).join('');
}
function writeBack(q){
  return `<h3>Model answer</h3><div class="pass zh">${esc(q.w.model)}</div><p class="mute">Check your text against it: ${C.chk[q.first?0:1]}; ${C.lv>5&&q.first?'about':'at least'} ${q.min} characters; no pinyin and few wrong characters.</p>
  ${AI?'<div class="row"><button class="btn line" data-act="aimark">Ask Claude to mark it</button></div>':''}<div id="aiout"></div>
  <div class="row"><button class="btn line" data-act="fno">Needs another go</button><button class="btn" data-act="fyes">Met the brief</button></div>`;
}
function drawQ(auto){
  const z=QZ,q=z.qs[z.i],show=z.shown,k=q.kind||'mc',ex=z.opt.exam||z.opt.late;let a=z.ans[z.i],body='',fb='';
  if(k==='mc'){a=a||(z.ans[z.i]=[]);body=optsHtml(q,a,show)+(show||q.subs.length<2?'':`<div class="row"><button class="btn" data-act="mcheck">${ex?'Next':'Check answers'}</button></div>`)}
  else if(k==='dict')body=`<input id="din" value="${esc(a||'')}" placeholder="Write what you hear" autocomplete="off" autocapitalize="off" ${show?'disabled':''}>
    <div class="chipsb">${q.bank.map(c=>`<button class="chip" data-act="dchip" data-t="${esc(c)}" ${show?'disabled':''}>${esc(c)}</button>`).join('')}</div>
    ${show?'':'<div class="row"><button class="btn line sm" data-act="dclr">Clear</button><button class="btn" data-act="dcheck">'+(z.opt.late?(z.i+1<z.qs.length?'Next':'Finish'):'Check')+'</button></div>'}`;
  else if(k==='cloze'){const st=a||(z.ans[z.i]={f:[],u:[]});
    body=`<div class="pass zh">${q.parts.map(p=>typeof p==='string'?esc(p):p.b==null?esc(p):`<button class="bl czb${show?(st.f[p.b]===q.sol[p.b]?' ok':' no'):''}" data-act="czrm" data-b="${p.b}" ${show?'disabled':''}>${st.f[p.b]!=null?esc(st.f[p.b]):p.b+1}</button>`).join('')}</div>
    <div class="chipsb">${q.bank.map((c,i)=>`<button class="chip" data-act="czadd" data-i="${i}" ${show||st.u.includes(i)?'disabled':''}>${esc(c)}</button>`).join('')}</div>
    ${show?'':'<div class="row"><button class="btn" data-act="czcheck">'+(z.opt.late?(z.i+1<z.qs.length?'Next':'Finish'):'Check')+'</button></div>'}`}
  else if(k==='order'){a=a||(z.ans[z.i]=[]);const L='ABCDEFG';
    body=`<p>Your order: <span class="seq">${a.map(x=>L[x]).join(' → ')||'tap the paragraph that comes first'}</span></p><div class="ord">${q.sh.map((pi,x)=>`<button class="ordp${show?(a.indexOf(x)===pi?' ok':' no'):''}" data-act="opick" data-x="${x}" ${show||a.includes(x)?'disabled':''}><b>${L[x]}</b><span>${esc(q.paras[pi])}</span></button>`).join('')}</div>
    ${show?'':`<div class="row"><button class="btn line sm" data-act="oundo">Undo</button><button class="btn" data-act="ocheck" ${!ex&&a.length<q.paras.length?'disabled':''}>${ex?'Next':'Check order'}</button></div>`}`}
  else if(k==='write'){const t=a||'';
    body=`<textarea id="wtx" ${show?'disabled':''} placeholder="在这里写……">${esc(t)}</textarea><p class="mute"><span class="cnt${zlen(t)<q.min?' low':''}" id="wcnt">${zlen(t)}</span> of ${C.lv>5&&q.first?'about':'at least'} ${q.min} characters${q.w.hint&&!ex?`<br>Useful: <span class="zh">${esc(q.w.hint)}</span>`:''}</p>`+(show?writeBack(q):`<div class="row"><button class="btn" data-act="wdone">${ex?(z.i+1<z.qs.length?'Next task':'Hand in'):'Finish and compare'}</button></div>`)}
  else body=`<div class="flash">${q.front}${z.flip?`<div class="fback">${q.back}</div>`:''}</div>`+(z.flip?'<div class="row"><button class="btn line" data-act="fno">Not yet</button><button class="btn" data-act="fyes">Got it</button></div>':`<button class="btn wide" data-act="flip">${(q.audio&&!q.card)||/Speaking/.test(q.tag)?'I have finished speaking':'Turn the card'}</button>`);
  if(show&&k!=='write'){const r=z.res[z.i],ok=r===true,n=qpts(q);
    const more=k==='dict'?`<p>Answer: <span class="zh">${esc(q.raw)}</span><br>${esc(q.en)}</p>`:k==='cloze'?`<p>Answer: <span class="zh">${q.sol.map(esc).join(' ／ ')}</span></p>`:k==='order'?`<p>Correct order: <b>${q.paras.map((_,i)=>'ABCDEFG'[q.sh.indexOf(i)]).join(' → ')}</b></p>`:q.exp?`<p>${q.exp}</p>`:'';
    fb=`<div class="fb ${ok?'good':'bad'}"><b>${ok?'◯ Correct':n>1?`${earned(q,r)} of ${n} correct`:'✕ Not quite'}</b>${more}</div><button class="btn wide" data-act="qnext">${z.i+1<z.qs.length?'Next':'See result'}</button>`}
  const once=isOnce(z,q);
  $('#quiz').innerHTML=`<div class="qwrap"><header class="qhead"><button class="x" data-act="qclose" aria-label="Leave">×</button><b>${esc(z.title)}</b><span>${z.opt.limit?`<span id="qtime">${clock(z.left)}</span> · `:''}${z.i+1}/${z.qs.length}</span></header>
  <div class="qbar"><i style="width:${z.i/z.qs.length*100}%"></i></div><p class="qtag">${q.tag}</p>${q.html?`<div class="qtext">${q.html}</div>`:''}
  ${q.audio?`<div class="row"><button class="btn line" data-act="qplay" ${once&&z.plays[z.i]&&!show&&!z.flip?'disabled':''}>${SPK} ${once&&!show&&!z.flip?(z.plays[z.i]?'Played. No replay':'Play the recording (once only)'):'Play again'}</button></div>`:''}${body}${fb}</div>`;
  if(auto){$('#quiz').scrollTop=0;if(q.audio&&!once)playQ()}
}
function grade(){const z=QZ,q=z.qs[z.i],a=z.ans[z.i]||[],c=q.subs.filter((s,j)=>a[j]===s.a).length;z.res[z.i]=c===q.subs.length?true:c;stopAudio();if(z.opt.exam||z.opt.late)nextQ();else{z.shown=true;drawQ()}}
function answer(val,ok){const z=QZ;z.ans[z.i]=val;z.res[z.i]=ok;stopAudio();if(z.opt.exam||z.opt.late)nextQ();else{z.shown=true;drawQ()}}
function nextQ(){const z=QZ;z.shown=false;z.flip=false;stopAudio();if(++z.i>=z.qs.length)finishQuiz();else drawQ(true)}
function revItem(q,a){
  const k=q.kind||'mc',h=`<div class="rev"><p class="qtag">${q.tag}</p>`;
  if(k==='mc')return h+`<div class="qtext">${q.html}</div>${q.subs.map((s,j)=>`<p>${q.subs.length>1?j+1+'. ':''}${s.q&&!q.lab?`<span class="zh">${esc(s.q)}</span><br>`:''}You: <span class="${q.lat?'':'zh '}${a&&a[j]===s.a?'ok':'no'}">${a&&a[j]!=null?esc(s.opts[a[j]]):'(no answer)'}</span> · Answer: <span class="${q.lat?'':'zh '}ok">${esc(s.opts[s.a])}</span></p>`).join('')}${q.exp?`<p class="mute">${q.exp}</p>`:''}</div>`;
  if(k==='dict')return h+`<p>You wrote: <span class="zh no">${esc(a||'(nothing)')}</span></p><p>Answer: <span class="zh ok">${esc(q.raw)}</span><br><span class="mute">${esc(q.en)}</span></p></div>`;
  if(k==='cloze')return h+`<p>Gaps in order: <span class="zh ok">${q.sol.map(esc).join(' ／ ')}</span></p><p class="mute">${q.exp}</p></div>`;
  if(k==='order')return h+`<div class="pass zh">${q.paras.map(esc).join('\n')}</div><p class="mute">The paragraphs above are in the correct order.</p></div>`;
  if(k==='write')return h+`<div class="qtext">${q.html}</div><p>Model answer:</p><div class="pass zh">${esc(q.w.model)}</div></div>`;
  return h+q.front+q.back+'</div>';
}
function finishQuiz(){
  const z=QZ;clearInterval(z.timer);stopAudio();const p=P();let got=0,max=0;
  z.qs.forEach((q,i)=>{const r=z.res[i];got+=earned(q,r);max+=qpts(q);
    if(q.key){if(r===true){if(p.wrong[q.key]&&--p.wrong[q.key]<=0)delete p.wrong[q.key]}else p.wrong[q.key]=(p.wrong[q.key]||0)+1}});
  p.act[today()]=1;save();
  if(z.opt.chain){z.opt.chain(z);return}

function plan(){
  const tn=todayN();let n=1,h=`<h1>The 10-week plan</h1><p class="lead">One square is one day. Six lesson days, then a weekly test; the last two weeks are exam practice. A square gets its 完 seal when every part of that day is done.</p>`;

    h+=`<section class="sec"><h2>${ph.title}</h2><p class="mute">${ph.w} weeks, ${fmtY(dayDate(n))} to ${fmtY(dayDate(n+ph.w*7-1))}</p><p>${ph.desc}</p>`;

function dialog(d,x,qb){

  <li><b>Role-play.</b> Take A or B. The other part is read to you; for your own lines you see only the English and say them in Chinese.</li>
  <li><b>Retell.</b> Hide the text and retell the conversation in 90 seconds, as in part 1 of the speaking test. Record yourself on your phone and listen back.</li></ol>

  const mine=ln.s===RP.r,head=`<h3>You are ${RP.r}</h3><p class="mute">Line ${RP.i+1} of ${k.lines.length}</p>`;
  openModal(head+(mine?`<p><b>Your turn.</b> Say this in Chinese:</p><p class="lead">${esc(ln.en)}</p><p class="zh gxl" id="rpa" hidden>${esc(ln.zh)}</p>

   :`<p>${ln.s} says:</p><p class="zh gxl">${esc(ln.zh)}</p><p class="mute">${esc(ln.en)}</p><div class="row">${sayBtn(ln.zh)}<button class="btn" data-act="rpnext">Next line</button></div>`));

let lastHash=null;
function render(keep){
  const app=$('#app');
  if(!P()){app.innerHTML=onboard();return}
  const p=P();if(p.theme)document.documentElement.dataset.theme=p.theme;else delete document.documentElement.dataset.theme;
  document.body.classList.toggle('nopy',p.py===false);
  const [r,a]=(location.hash.slice(2)||'').split('/'),y=scrollY;
  const v=r==='plan'?plan():r==='day'?day(+a||todayN()):r==='prac'?pracV():r==='exam'?examV():r==='chars'?charsV():r==='wrong'?wrongV():r==='set'?setV():home();
  app.innerHTML=`<nav class="nav"><a class="brand" href="#/"><span class="zh">${C.zh}</span>${C.title}</a>${NAV.map(([h,t,g])=>`<a href="#/${h}" class="${(r||'')===h||(h==='plan'&&r==='day')||(h==='prac'&&r==='wrong')?'on':''}"><span class="zh">${g}</span>${t}</a>`).join('')}</nav>
  <main>${LS.ok||CLOUD?'':'<p class="note">This browser is blocking storage here, so progress will be lost when the page closes.</p>'}${v}</main>`;
  scrollTo(0,keep&&lastHash===location.hash?y:0);lastHash=location.hash;
}

/* ================= Events ================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,p=P(),z=QZ,q=z&&z.qs&&z.qs[z.i];
  if(a==='create'){const s=$('#o-start').value;if(!s){toast('Choose your first study day.');return}newProfile($('#o-name').value.trim()||'Learner',s,$('#o-exam').value);location.hash='#/';render()}
  else if(a==='back'){DB.cur=Object.keys(DB.profiles)[0];render()}
  else if(a==='say'){e.stopPropagation();say(t.dataset.t)}
  else if(a==='anim')animate(t.closest('.kcard').querySelector('.mz svg'));
  else if(a==='kopen'){openModal(kCard(HZ[t.dataset.k]));animate($('#modal .mz svg'))}
  else if(a==='pad')openPad(t.dataset.k);
  else if(a==='padclr'){const c=$('#modal canvas');c.getContext('2d').clearRect(0,0,c.width,c.height)}
  else if(a==='close'){stopAudio();closeModal()}
  else if(a==='reveal')t.classList.toggle('show');
  else if(a==='kwall')speak(KW[t.dataset.l].lines.map(l=>({t:l.zh,v:VOI[l.s]})));
  else if(a==='kwshow')t.closest('.sec').querySelector('.kwl').classList.toggle('veil');
  else if(a==='role'){RP={L:+t.dataset.l,r:t.dataset.r,i:0};roleStep()}
  else if(a==='rpshow'){$('#rpa').hidden=false;const ln=KW[RP.L].lines[RP.i];speak([{t:ln.zh,v:VOI[ln.s]}])}
  else if(a==='rpnext'){RP.i++;roleStep()}
  else if(a==='quiz'){const n=+t.dataset.n,s=t.dataset.sec,d=D(n);startQuiz(`Day ${n}: ${d.type==='lesson'||secs(d).length>1?SECN[s]:dayLabel(d)}`,buildSec(n,s),{done:pct=>markDone(n,s,pct)})}
  else if(a==='exam'){const n=+t.dataset.n;startExam(+t.dataset.no,n?pct=>markDone(n,'q',pct):null)}
  else if(a==='exgo'){const ex=EXS,pt=ex.parts[ex.i];startQuiz(`${exName(ex.no)} · ${pt.title}`,pt.qs,{exam:true,limit:pt.min*60,chain:zz=>{zz.title=pt.title;ex.done.push(zz);QZ=null;if(++ex.i<ex.parts.length)examIntro();else examResult()}})}
  else if(a==='spk')startQuiz('Speaking mock '+t.dataset.no,speakSet(+t.dataset.no));
  else if(a==='prac')openSetup(t.dataset.m);
  else if(a==='pgo')startPrac();
  else if(a==='wquiz')startQuiz('Error notebook drill',shuf(Object.keys(p.wrong)).slice(0,20).map(qFromKey));
  else if(a==='qplay')playQ();
  else if(a==='pick'){if(z.shown)return;(z.ans[z.i]=z.ans[z.i]||[])[+t.dataset.j]=+t.dataset.i;if(q.subs.length===1)grade();else drawQ()}
  else if(a==='mcheck')grade();
  else if(a==='dchip'){$('#din').value+=t.dataset.t}
  else if(a==='dclr')$('#din').value='';
  else if(a==='dcheck'){const v=$('#din').value;answer(v,dictOk(q,v))}
  else if(a==='czadd'){const st=z.ans[z.i],b=q.sol.findIndex((_,j)=>st.f[j]==null);if(b<0)return;const i=+t.dataset.i;st.f[b]=q.bank[i];st.u[b]=i;drawQ()}
  else if(a==='czrm'){const st=z.ans[z.i],b=+t.dataset.b;st.f[b]=null;st.u[b]=null;drawQ()}
  else if(a==='czcheck'){const st=z.ans[z.i];z.res[z.i]=q.sol.every((s,j)=>st.f[j]===s);if(z.opt.late)nextQ();else{z.shown=true;drawQ()}}
  else if(a==='opick'){z.ans[z.i].push(+t.dataset.x);drawQ()}
  else if(a==='oundo'){z.ans[z.i].pop();drawQ()}
  else if(a==='ocheck'){const s=z.ans[z.i],c=s.filter((x,k)=>q.sh[x]===k).length;answer(s,c===q.paras.length?true:c)}
  else if(a==='wdone'){keep();if(z.opt.exam)nextQ();else{z.shown=true;drawQ()}}
  else if(a==='aimark'){t.disabled=true;if(EXR){const i=+t.dataset.i;aiMark(EXR.wq[i],EXR.wt[i],$('#aiout'+i),(s,txt)=>{EXR.fb[i]=txt;if(s!=null){EXR.ws[i]=s;drawExamResult()}})}else aiMark(q,z.ans[z.i]||'',$('#aiout'))}
  else if(a==='tm'){let s=+t.dataset.s;clearInterval(tmI);t.disabled=true;t.textContent=clock(s)+' left';tmI=setInterval(()=>{s--;t.textContent=s>0?clock(s)+' left':'Time is up';if(s<=0)clearInterval(tmI)},1000)}
  else if(a==='flip'){clearInterval(tmI);z.flip=true;drawQ();if(q.say)say(q.say)}
  else if(a==='fyes'||a==='fno'){z.res[z.i]=a==='fyes';nextQ()}
  else if(a==='qnext')nextQ();
  else if(a==='qclose'){if((EXS||(z&&!z.fin&&z.res&&z.res.length))&&!confirm('Leave this exercise? The result will not be saved.'))return;clearInterval(tmI);closeQuiz()}
  else if(a==='saveset'){const s=$('#s-start').value;if(!s){toast('Choose your first study day.');return}p.name=$('#s-name').value.trim()||p.name;p.start=s;p.exam=$('#s-exam').value;save();render();toast('Changes saved.')}
  else if(a==='ttstest')speak([{t:'你好，欢迎参加中文水平考试。',v:'f'},{t:'听力考试现在开始，请大家注意。',v:'m'}]);
  else if(a==='switch'){DB.cur=t.dataset.id;save();render();toast('Profile switched.')}
  else if(a==='addp'){DB.cur=null;render()}
  else if(a==='export'){const j=JSON.stringify(DB);if(DL)DL.save({filename:C.doc+'-backup.json',data:j}).then(()=>toast('Backup downloaded.')).catch(()=>toast('The backup was not saved.'));
    else{const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));l.download=C.doc+'-backup.json';l.click()}}
  else if(a==='reset'){if(confirm('Erase all progress and the error notebook for this profile?')){p.done={};p.wrong={};p.act={};p.exams={};save();render();toast('Progress erased.')}}
  else if(a==='delp'){if(confirm(`Delete the profile “${p.name}”?`)){delete DB.profiles[p.id];DB.cur=Object.keys(DB.profiles)[0];save();render()}}
});
document.addEventListener('change',e=>{
  const t=e.target,a=t.dataset.act;
  if(t.dataset.ps){setPS(t);return}
  if(a==='hide')t.closest('.sec').querySelector('.vlist').classList.toggle('hidden',t.checked);
  else if(a==='py'){P().py=t.checked;save();render(true)}
  else if(a==='theme'){P().theme=t.value;save();render(true)}
  else if(a==='rate'){P().rate=+t.value;save()}
  else if(a==='scope'){P().scope=t.value;save()}
  else if(a==='wscore'&&EXR){EXR.ws[+t.dataset.i]=+t.value;drawExamResult()}
  else if(t.id==='imp'&&t.files[0]){const f=new FileReader();f.onload=()=>{try{const d=JSON.parse(f.result);if(!d.profiles||!Object.keys(d.profiles).length)throw 0;DB=d;if(!P())DB.cur=Object.keys(DB.profiles)[0];save();render();toast('Progress restored.')}catch(x){toast('That file is not a backup from this plan.')}};f.readAsText(t.files[0])}
});
document.addEventListener('input',e=>{if(e.target.id==='wtx'){const c=$('#wcnt'),q=QZ.qs[QZ.i],n=zlen(e.target.value);c.textContent=n;c.classList.toggle('low',n<q.min)}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#modal').classList.contains('on')){stopAudio();closeModal()}return}
  const z=QZ;if(!z||z.fin||!z.qs)return;const q=z.qs[z.i],k=q.kind||'mc';
  if(k==='mc'&&q.subs.length===1&&/^[1-4]$/.test(e.key)&&!z.shown){z.ans[z.i]=[+e.key-1];grade()}
  else if(e.key==='Enter'&&e.target.id!=='wtx'){if(z.shown&&k!=='write'){e.preventDefault();nextQ()}else if(k==='dict'){e.preventDefault();const v=$('#din').value;answer(v,dictOk(q,v))}}
});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'){stopAudio();closeModal()}});
addEventListener('hashchange',()=>render());
if(!P()&&Object.keys(DB.profiles).length)DB.cur=Object.keys(DB.profiles)[0];
render();

</script>
