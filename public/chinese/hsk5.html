 529Q676 530 672 528Q587 506 517 495C487 490 487 462 517 463Z","M739 257Q766 335 793 350Q809 369 794 386Q778 399 726 423Q708 430 687 422Q626 397 518 377C489 371 488 344 518 347Q528 347 677 373Q692 377 698 370Q707 363 705 347Q699 304 690 267C683 238 729 229 739 257Z","M512 202Q522 201 535 203Q602 216 747 226Q757 227 759 235Q759 242 739 257L690 267Q686 267 683 266Q592 245 516 236C486 232 482 203 512 202Z","M247 709Q275 684 306 651Q322 636 341 636Q354 637 360 653Q366 671 356 706Q344 742 242 766Q223 770 216 768Q210 764 212 748Q216 735 247 709Z","M300 170Q310 179 315 193Q327 233 284 301Q253 355 326 443Q329 447 334 451Q356 470 336 485Q315 501 281 515Q259 528 240 510Q212 488 172 473Q120 451 104 453Q97 454 94 449Q93 445 101 439Q143 421 232 457Q241 460 250 449Q271 427 249 400Q201 352 243 288Q274 234 275 201Q275 183 270 172C262 143 281 147 300 170Z","M270 172Q233 173 193 161Q156 151 102 150Q95 151 91 142Q88 135 96 125Q112 106 135 92Q145 85 165 97Q237 142 309 125Q370 112 497 57Q716 -42 797 -15Q858 7 911 46Q935 62 910 61Q688 52 524 99Q458 118 381 147Q342 165 300 170L270 172Z"],"md":["597,824 620,809 631,792 591,718 540,642 524,633","457,632 490,593 498,524 498,334 480,190 483,148","512,619 529,611 625,635 681,656 705,654 738,624 711,548 687,534","524,468 541,483 668,507 735,501","519,355 536,365 690,398 713,396 747,366 722,288 697,272","517,207 532,220 554,225 690,244 730,242 749,235","221,760 312,701 338,658","101,446 153,449 250,483 264,484 290,465 279,411 255,369 249,342 257,306 294,229 295,195 278,177","103,138 147,122 249,151 330,143 560,59 723,23 791,22 901,53"],"w":[["追求","zhuīqiú","to pursue stubbornly; to seek after; to woo"]],"t":"Meaning part 辶 (walk) + sound part 㠯."}},"HL":[["宝","含","织"],["挡","局","欠"],["补","册","叉"],["采","良","抓"],["称","承","豆","玉"],["沉","亿","追"],["充","丑","臭"],["代","范"],["独","立","宿"],["吨","疯","贡","柜"],["挥","架","退","拖"],["布","佛","映"],["斗","泪","配"],["防","疗","胃","治"],["胆","搞","哈"],["闭","忍","舍"],["贝","甲","艰"],["伴","妇"],["巨","义","造"],["靠","益"],["宽","似"],["扮","吵","冲","抽"],["挤","亏","骂"],["领","令","碰","晒"],["某","派","闲","咬"],["尺","括","析"],["念","匹","拼"],["烈","劝","余"],["创","设","席"],["劳","神"],["秘","升","训"],["盆","守","团","召"],["虫","冻","湖","私"],["陆","石"],["挑","政","猪","竹"],["测","录","伟"],["版","形","制"],["均","未","显","状"],["传","宣"],["势","寻","依","圆"],["旦","敌","访","致"],["构","权","乙"],["币","府","素","县"],["军","曲"],["胜","占"],["类","齐","诗"],["古","胡","夕","载"],["华","龙","武"]],"g":"##1\n@自从 / （自）……以来|since; ever since|自从 + time/event，… · （自）+ event + 以来，…\n自从 marks the starting point of a situation that is still true now, so the main clause describes a lasting change, not a one-off event. （自）……以来 is its formal twin, common in news and reports; 自 can be dropped, 以来 cannot.\n!自从 only looks back from now. For a future starting point use 从 (从明天起), never 自从.\n>【自从|从而|一旦|假如】搬到这个小区，我每天都步行去上班。=Ever since I moved to this neighbourhood, I have walked to work every day.\n>这家便利店开业【以来|以前|以内|以及】，生意一直很好。=Since it opened, this convenience store has always done good business.\n~【自|在|朝|凭】今年年初以来，物价上涨得比较快。=Since the beginning of this year, prices have risen fairly quickly.\n##2\n@立刻、连忙、急忙、尽快|at once · hurriedly · as soon as possible|立刻/连忙/急忙/尽快 + verb\n立刻 = immediately; it works for past, future and commands. 连忙 and 急忙 describe someone reacting in a hurry and only narrate what has happened: 连忙 stresses a quick response to another person, 急忙 the rush itself. 尽快 = as soon as possible and looks forward: requests, promises, plans.\n!连忙 and 急忙 cannot be used in commands. Say 请你立刻/尽快回电话, not 请你连忙回电话.\n>服务员发现上错了菜，【连忙|尽快|即将|始终】向客人道歉。=Realising she had brought the wrong dish, the waitress hurriedly apologised to the customers.\n>我们会【尽快|连忙|急忙|曾经】处理您的问题，请您耐心等待。=We will deal with your problem as soon as possible; please wait patiently.\n>听到孩子的哭声，她【急忙|尽量|格外|早晚】跑进了卧室。=Hearing the child cry, she rushed into the bedroom.\n~收到通知后，请【立刻|连忙|渐渐|曾经】到三楼办公室报到。=After receiving the notice, please report to the third-floor office at once.\n##3\n@曾经、早已、即将、早晚|once · long since · about to · sooner or later|曾经 + V + 过 · 早已 + V + 了 · 即将 + V · 早晚 + 会/要 + V\n曾经 says something happened at some time in the past and is over (usually with 过). 早已 says it happened long before now. 即将 is a formal \"about to\", common in announcements. 早晚 as an adverb means \"sooner or later\" and usually comes with 会 or 要.\n!The negative of 曾经 is 不曾 or simply 没(有)…过; 没曾经 is wrong. 即将 does not take a time word: 明天即将开始 ✗.\n>我【曾经|即将|早晚|尽快】在保险公司工作过两年。=I once worked at an insurance company for two years.\n>各位旅客，列车【即将|曾经|早已|连忙】到达终点站，请带好您的行李。=Passengers, the train is about to arrive at the terminus; please take your luggage.\n>等我赶到车站时，最后一班车【早已|即将|早晚|尽量】开走了。=By the time I got to the station, the last bus had long since left.\n~你这样不注意安全，【早晚|曾经|早已|立刻】会出事故的。=If you keep ignoring safety like this, sooner or later there will be an accident.\n##4\n@始终、时刻、渐渐|all along · at every moment · gradually|始终/时刻/渐渐 + verb/adjective\n始终 = from beginning to end, without change (often with 没/不). 时刻 as an adverb = constantly, at every moment (时刻注意、时刻准备). 渐渐 = little by little, and is usually followed by a change: …了, …起来, …下来.\n!始终 cannot take a duration after the verb: 始终等了两个小时 ✗ (use 一直). It suits negatives well: 始终没回复.\n>我给客服打了三次电话，问题【始终|渐渐|时常|即将】没有解决。=I called customer service three times, but the problem was never solved.\n>修好以后，洗衣机的声音【渐渐|始终|时刻|立刻】小了下来。=After the repair, the washing machine gradually got quieter.\n~开车的时候要【时刻|渐渐|曾经|早已】注意路上的情况。=When driving you must pay attention to the road at every moment.\n@老是、通常、时常|always (annoyingly) · usually · often|老是/通常/时常 + verb\n老是 = always, said as a complaint, spoken style. 通常 = as a rule, in normal circumstances. 时常 = frequently, slightly formal (the everyday word is 常常).\n!通常 describes a regular pattern, so it cannot describe one specific past event: 昨天我通常八点起床 ✗.\n>这台电脑【老是|通常|即将|早已】自动关机，真让人头疼。=This computer keeps shutting down by itself; it's a real headache.\n>退货申请【通常|老是|曾经|连忙】在三个工作日内处理完。=Return requests are normally processed within three working days.\n~退休以后，他【时常|即将|早已|格外】去看望以前的同事。=After retiring, he often went to visit his former colleagues.\n##5\n@过于、极其、格外、相当|too · extremely · especially · quite|过于/极其/格外/相当 + adjective / mental verb\n过于 = excessively, and implies a bad result. 极其 = extremely, formal, only before words of two or more syllables. 格外 = more than usual, more than the rest. 相当 = quite, considerably: strong, but below 非常. The syllabus also lists 较 (rather, written style: 较大) and spoken 可…了 (可好吃了).\n!极其 never precedes a single syllable: 极其好 ✗ → 极其重要. 过于 is not praise: 过于漂亮 sounds like a criticism.\n>医生说我的病是【过于|格外|相当|渐渐】劳累引起的。=The doctor said my illness was caused by excessive tiredness.\n>手术之后，头三天的护理【极其|过于|老是|早已】重要。=After the operation, care in the first three days is extremely important.\n>今天急诊室的病人【格外|过于|时刻|即将】多，我们等了两个多小时。=There are far more patients than usual in the emergency room today; we waited over two hours.\n~这位医生的技术【相当|过于|时刻|连忙】不错，很多病人都专门来找他。=This doctor is quite skilled; many patients come specially to see him.\n##6\n@尽量、亲自|as far as possible · in person|尽量 + verb · 亲自 + verb\n尽量 = do as much as conditions allow; it softens requests and promises. 亲自 = personally, rather than through someone else, and stresses that the matter is important to the doer.\n!尽量 is \"do what you can\"; 尽快 is \"as fast as you can\". 亲自 needs someone who could have delegated: 我亲自吃饭 ✗.\n>睡觉前【尽量|亲自|过于|曾经】不要看手机，这样更容易入睡。=Try not to look at your phone before bed; it makes falling asleep easier.\n>院长【亲自|尽量|格外|渐渐】给这位病人做了手术。=The hospital director performed the operation on this patient himself.\n~压力大的时候，【尽量|亲自|极其|早已】找朋友聊聊，别一个人忍着。=When you are under pressure, try to talk to a friend; don't bear it alone.\n@量词（一）：册、朵、颗、匹、架、支、根、届|measure words (1)|number + measure word + noun\n册 volumes of books · 朵 flowers, clouds · 颗 small round things, also hearts and stars · 匹 horses, cloth · 架 planes, machines, pianos · 支 pens, songs, teams · 根 long thin things (hair, rope, bananas) · 届 graduating classes, sessions of meetings and games.\n!颗 is for small, roughly round objects (一颗牙、一颗星星); 棵 with the tree radical is for plants (一棵树). They sound the same.\n>咨询室的桌子上放着一【朵|颗|匹|届】白色的花。=On the table in the counselling room there is a white flower.\n>他是我们学校第一【届|册|架|根】心理学专业的毕业生。=He is from our school's first graduating class in psychology.\n>医生让我每天吃两【颗|根|支|朵】药，连续吃一个星期。=The doctor told me to take two pills a day for a week.\n~窗外传来一【支|匹|册|届】熟悉的歌，让他慢慢平静下来。=A familiar song drifted in from outside and slowly calmed him down.\n##7\n@居然、果然、的确|unexpectedly · as expected · indeed|居然/果然/的确 + predicate\n居然 = contrary to expectation (surprise, often displeasure). 果然 = the result matches what was predicted or said. 的确 = really, indeed: it confirms that a statement is true.\n!Choose by expectation: predicted and it happened → 果然; not predicted at all → 居然. 的确 only confirms and carries no surprise.\n>楼上漏水这么严重，物业【居然|果然|的确|尽量】三天都没派人来。=The leak from upstairs is this bad, yet the property office hasn't sent anyone for three days!\n>师傅说是水管老化了，打开一看，【果然|居然|亲自|渐渐】是这个原因。=The repairman said the pipe was worn out; when we opened it up, sure enough, that was the cause.\n~这个小区的环境【的确|居然|即将|连忙】不错，就是物业费有点儿高。=This estate's environment really is nice; it's just that the management fee is a bit high.\n##8\n@毕竟、反正、根本|after all · anyway · (not) at all|毕竟 + decisive fact · 反正 + conclusion · 根本 + 不/没\n毕竟 points to the decisive fact that explains or excuses something. 反正 = whatever happens, the result is the same; it often follows 不管/无论 or opens a firm statement. 根本 as an adverb goes almost only with negatives: 根本不、根本没 = not at all.\n!根本 in a positive sentence is rare. If there is no 不 or 没 after the blank, the answer is probably not 根本.\n>房租贵一点儿也正常，【毕竟|反正|根本|居然】这里离地铁站只有两百米。=It's normal for the rent to be a bit higher; after all, it's only 200 metres from the metro.\n>你看不看都行，【反正|毕竟|果然|的确】我已经决定租这套了。=Whether you look at it or not, I've decided to rent this flat anyway.\n~中介说的那些优惠，合同里【根本|毕竟|反正|尽量】没有写。=The discounts the agent mentioned are not in the contract at all.\n##9\n@简直、绝对、刚好|simply · absolutely · just right|简直 + exaggerated comment · 绝对 + judgement · 刚好 + verb/number\n简直 introduces an exaggeration: \"it is virtually…\". 绝对 = absolutely, with no exception or doubt. 刚好 = exactly, by lucky coincidence (time, amount, fit). The syllabus groups two more mood adverbs here: 白 (in vain; for free: 白跑一趟、白吃) and emphatic 可 (你可别忘了).\n!简直 needs a strong expression after it (太…了、像…一样、不敢相信), not a plain fact: 他简直是老师 ✗.\n>新娘今天太美了，【简直|刚好|绝对|毕竟】像电影明星一样。=The bride is so beautiful today, she's just like a film star.\n>这家酒店的服务【绝对|简直|刚好|居然】可靠，我们公司每年都在这儿办活动。=This hotel's service is absolutely reliable; our company holds events here every year.\n>我们订了二十桌，来的客人【刚好|简直|绝对|反正】两百位，一个座位也没多。=We booked twenty tables and exactly two hundred guests came; not one seat was left over.\n~婚礼改时间了你怎么不早说？我今天【白|可|刚好|简直】请了一天假。=Why didn't you tell me earlier that the wedding had been rescheduled? I took a day off today for nothing.\n##10\n@似乎、仿佛、……似的|seem · as if|似乎 + clause · 仿佛/好像 + … + 似的\n似乎 = it seems (a cautious judgement; written style for 好像). 仿佛 = as if; it introduces an imaginative comparison and often pairs with 似的 or 一样 at the end. ……似的 follows the thing compared and is commonly preceded by 像、好像、仿佛.\n!似的 is read shìde. 似乎 gives a guess about reality; 仿佛 paints a picture you know is not literally true.\n>孩子今天不太说话，【似乎|仿佛|简直|刚好】有什么心事。=The child isn't talking much today; he seems to have something on his mind.\n>一走进森林，我们【仿佛|似乎|毕竟|的确】来到了另一个世界。=As soon as we walked into the forest, it was as if we had entered another world.\n~儿子玩得满头大汗，脸红得像苹果【似的|似乎|仿佛|一旦】。=My son played until he was dripping with sweat, his face as red as an apple.\n##11\n@动词/形容词 + 下来 / 下去|extended uses: settle into a state · keep going|V/Adj + 下来 · V/Adj + 下去\nBeyond direction, 下来 shows a change that settles from active to calm, fast to slow, bright to dark (安静下来、停下来、暗下来), or something being fixed and kept (记下来、留下来). 下去 shows an action or state continuing into the future (坚持下去、说下去、这样下去).\n!下来 looks from the past up to now; 下去 looks from now onward. 坚持下来了 = I made it through; 坚持下去 = keep it up.\n>太阳下山以后，山里的天很快就暗了【下来|下去|起来|过来】。=After the sun went down, it quickly grew dark in the mountains.\n>学摄影不难，难的是每天练习，一直坚持【下去|下来|过去|上来】。=Learning photography isn't hard; the hard part is practising every day and keeping at it.\n~这么美的风景，我一定要用相机拍【下来|下去|起来|过去】。=Such beautiful scenery: I must capture it with my camera.\n##12\n@动词/形容词 + 起来 / 过来 / 过去|extended uses: begin · come round · pass out|V/Adj + 起来 · V + 过来 · V + 过去\n起来 marks a state beginning and growing (热闹起来、忙起来), or gathers things together (收起来、组织起来). 过来 = return to a normal, conscious or correct state (醒过来、明白过来、改过来). 过去 = leave the normal state (晕过去、昏过去).\n!With an object, 起来 splits: 下起雨来、聊起天来. 忙不过来 = too much to cope with.\n>志愿者一到，社区活动室马上热闹了【起来|下来|过去|下去】。=As soon as the volunteers arrived, the community activity room came alive.\n>经过医生的抢救，晕倒的老人终于醒了【过来|过去|起来|下去】。=After emergency treatment by the doctor, the old man who had fainted finally came round.\n~周末报名的人太多，三个志愿者根本忙不【过来|起来|下去|过去】。=So many people signed up at the weekend that three volunteers simply couldn't cope.\n##13\n@假如……，（就）……|if; supposing|假如 + condition，（那么/就）+ result\n假如 introduces a supposition, including ones contrary to fact. It is more formal than 如果 and 要是; the result clause often has 就、那么 or 会.\n!假如 states a pure hypothesis. For \"once X happens, Y follows at once\" use 一旦; for an unwanted possibility use 万一.\n>【假如|自从|毕竟|从而】这门课的学分不够，你就得下学期再选一门。=If this course doesn't give enough credits, you'll have to take another one next semester.\n>假如时间可以重来，我【就|才|却|而】会选一个自己真正感兴趣的专业。=If I could turn back time, I would choose a major I am truly interested in.\n~【假如|自从|尽管|由于】你是老师，你会怎么安排这门课的内容？=Suppose you were the teacher: how would you organise the content of this course?\n##14\n@一旦……，就……|once (and then inevitably)|一旦 + condition，就/便 + consequence\n一旦 marks a turning point: the moment the condition comes true, the consequence follows and is hard to reverse. The condition may be hoped for or feared; the second clause usually contains 就.\n!一旦 is for a condition that would make a real difference, not for routine events: 一旦我下课就去吃饭 ✗ (use 一…就…).\n>论文题目【一旦|自从|尽量|似乎】确定下来，就不能随便更改了。=Once the thesis topic is settled, it cannot be changed casually.\n>一旦发现数据有问题，【就|才|却|还】要立刻告诉导师。=As soon as you find a problem with the data, tell your supervisor immediately.\n~这种习惯【一旦|毕竟|反正|果然】养成，再想改就很难了。=Once this kind of habit is formed, it is very hard to change.\n##15\n@……，便……|then; and so (formal 就)|event 1，便 + event 2 · 一 + V + 便 + V\n便 is the written-style equivalent of 就. It links two actions that follow closely, or a condition and its natural result, and appears constantly in reading passages and stories.\n!便 is an adverb, so it stands after the subject of the second clause: 他便走了 ✓, 便他走了 ✗.\n>实验一结束，他【便|才|却|仍】赶回宿舍整理数据去了。=As soon as the experiment ended, he hurried back to the dormitory to sort out the data.\n>老师稍微提醒了一下，她【便|而|即将|始终】明白自己错在哪儿了。=With just a small hint from the teacher, she understood where she had gone wrong.\n~他从小喜欢化学，上大学后【便|却|而|将】选择了这个专业。=He had liked chemistry since childhood, so when he went to university he chose it as his major.\n##16\n@从而、因而|thereby · therefore|method/cause，从而 + further result · cause，因而 + result\n因而 = therefore; it simply gives the result of a cause (often after 由于). 从而 = thereby: the first clause is a method or condition, and the second is the further result or goal it leads to. Both are written style and cannot open a reply in conversation.\n!With 从而 the two clauses normally share one subject, and 从而 goes straight before the verb: …，从而提高了效率.\n>社团改变了宣传方式，【从而|自从|假如|然而】吸引了更多新生报名。=The club changed the way it advertised, thereby attracting more freshmen to sign up.\n>由于报名人数太多，【因而|然而|反而|假如】活动改在体育馆举行。=Because too many people signed up, the event was therefore moved to the gymnasium.\n~多参加社团活动可以认识不同专业的同学，【从而|然而|哪怕|毕竟】扩大自己的交际范围。=Joining more club activities lets you meet students from other majors and so widen your social circle.\n##17\n@……，可见……|which shows that; evidently|fact(s)，可见 + conclusion\n可见 draws a conclusion from the evidence just mentioned. Everything before it is the proof; what follows is the judgement. 由此可见 is the fuller, more formal form.\n!可见 introduces a conclusion, not an event that resulted: 他病了，可见没来上课 ✗ (use 所以).\n>讲座还没开始，教室里就坐满了人，【可见|总之|从而|便】大家对这个话题很感兴趣。=The lecture hadn't started and the room was already full, which shows how interested everyone is in the topic.\n>连小学生都能回答这个问题，【可见|假如|反正|一旦】它并不难。=Even primary pupils can answer this question, so clearly it isn't hard.\n~他提的问题教授想了半天才回答，【可见|然而|一旦|毕竟】这个问题很有深度。=The professor had to think for a long time before answering his question, which shows it was a deep one.\n@总之 · 不管怎样说|in short · whatever the case|…（several points）…，总之，+ summary · 不管怎样说，+ final judgement\n总之 sums up what has been listed, or cuts the details short to give the bottom line. 不管怎样说 (also 不管怎么说) sets all the earlier arguments aside and insists on one point that stays true anyway.\n!总之 summarises what came before; it cannot open a topic. Listen for it at the end of talks: the main idea usually follows.\n>有人支持，有人反对，【总之|可见|从而|一旦】，大家的看法很不一致。=Some are for it, some against; in short, opinions differ widely.\n>他的观点你可以不同意，但【不管怎样说|由此可见|假如|一旦】，他的研究方法是值得学习的。=You may disagree with his views, but whatever you say, his research method is worth learning from.\n~多读、多听、多练，【总之|可见|便|因而】，学语言没有别的好办法。=Read more, listen more, practise more; in short, there is no other good way to learn a language.\n##18\n@凭|by; on the strength of; on what grounds|凭 + basis + verb · 凭什么……？\n凭 introduces what someone relies on to do something: ability, experience, a document, a feeling. 凭什么 challenges the other person's right: \"on what grounds?\".\n!凭 stresses the personal means you rely on (凭经验、凭票入场). For the source of information use 据 (据报道); for rules use 依据 or 根据.\n>他【凭|据|朝|替】自己的技术找到了一份不错的工作，并不是靠学历。=He found a good job on the strength of his skills, not his degree.\n>参观职业学校的那天，学生可以【凭|沿|同|较】学生证免费入场。=On the vocational school's open day, students can get in free with their student card.\n~我们的条件一样，【凭|据|替|自从】什么只录取他不录取我？=Our qualifications are the same; on what grounds did they admit him and not me?\n@从……来看|judging from; from the point of view of|从 + aspect/evidence + 来看，+ judgement\nThis frame names the angle or the evidence before giving a judgement: 从目前的情况来看、从长远来看、从结果来看. It is typical of reports, discussions and essays.\n!Do not mix frames: 从…来看 ✓ (angle), 对…来说 ✓ (for someone), 从…来说看 ✗.\n>【从|凭|据|朝】就业情况来看，职业教育的毕业生很受企业欢迎。=Judging from employment figures, vocational graduates are very popular with companies.\n>从长远【来看|以来|起来|下来】，学一门技术比只拿一张证书更重要。=In the long run, learning a skill matters more than just getting a certificate.\n~从这次调查的结果【来看|以来|为止|似的】，多数家长已经改变了看法。=Judging from the results of this survey, most parents have already changed their minds.\n##19\n@朝、沿（着）|towards · along|朝 + direction/person + verb · 沿（着）+ route + verb\n朝 gives the direction a person or thing faces or moves in; with a person it means \"to, at\" (朝我笑、朝他挥手). 沿（着） means following a line: a road, a river, a wall, or abstractly a direction of development.\n!朝 only marks direction and cannot follow the verb (走朝 ✗). 沿着 needs something long: 沿着河边 ✓, 沿着广场 ✗.\n>你出了电梯【朝|沿|替|凭】右拐，第二间就是人事部。=When you come out of the lift, turn right; the second room is HR.\n>【沿着|凭着|替|据】这条走廊一直走，就能看到会议室。=Go straight along this corridor and you will see the meeting room.\n~新同事看见我，【朝|沿|较|据】我笑了笑，算是打了招呼。=When the new colleague saw me, she smiled at me by way of greeting.\n@替、同、较|for (on behalf of) · with · than (formal)|替 + person + verb · 同 + person/thing + verb / 一样 · A + 较 + B + comparison\n替 = in place of, or for the benefit of, someone (替我请假、替你高兴). 同 as a preposition = 跟/和, written style (同客户谈、同去年一样). 较 as a preposition = 比 in reports (较上月增长10%).\n!较 as a preposition appears with figures and periods in written reports; in speech people say 比.\n>我明天要去见客户，你能【替|朝|较|凭】我参加一下部门会议吗？=I have to meet a client tomorrow; could you attend the department meeting for me?\n>这件事我得先【同|替|沿|较】经理商量一下，才能回复你。=I have to discuss this with the manager first before I can reply to you.\n~公司今年第一季度的销量【较|同|替|朝】去年同期增长了百分之二十。=The company's first-quarter sales grew 20% compared with the same period last year.\n##20\n@以及、同|and; as well as · together with|A、B 以及 C · A 同 B（一起）+ verb\n以及 joins nouns, verb phrases or clauses in written style; what follows 以及 is often less central or simply the last item of a list. 同 as a conjunction = 和/跟, mostly joining people or things that act together.\n!以及 cannot join two adjectives describing one thing: 高以及瘦 ✗. It typically precedes the last item of a list.\n>请把项目的计划、进度【以及|以来|从而|因而】目前遇到的困难都写进报告里。=Please put the project plan, its progress and the difficulties met so far into the report.\n>这次培训要求部门主任同新员工【一起|以及|以来|彼此】参加。=This training requires department heads to attend together with the new staff.\n~会上讨论了产品的价格、包装【以及|以来|似的|可见】售后服务等问题。=The meeting discussed the product's price, packaging, after-sales service and other issues.\n##21\n@把 + 宾语 + 一 + 动词 · 把 + 宾语1 + 动词 + 宾语2|two special 把 sentences|S + 把 + O + 一 + V，（就）… · S + 把 + O1 + V + O2\n(1) 把…一V shows a quick, decisive action that leads straight into the next event: 他把门一关，走了. (2) In 把 O1 V O2, the first object is what is handled and the second is the receiver, the result or the use: 把这件事告诉经理、把存款买了车、把他当朋友.\n!After 把…一V the sentence is unfinished; a second clause must say what happened next.\n>他把辞职信往桌上【一|又|才|也】放，转身就离开了办公室。=He put his resignation letter down on the desk, turned and left the office.\n>我打算【把|被|替|朝】这个决定先告诉部门主任，再通知其他同事。=I plan to tell the department head about this decision first, and then inform the other colleagues.\n~离职以前，请【把|对|同|凭】手上的工作交给小李。=Before you leave the company, please hand your current work over to Xiao Li.\n##22\n@被/叫/让 + 宾语 + 给 + 动词|spoken passive with 给|S + 被/叫/让 + doer + 给 + V + result\nIn speech 给 is often added before the verb of a passive sentence. It adds no meaning but makes the tone more colloquial and the result more vivid. 叫 and 让 are the spoken passives and must be followed by the doer; 被 may omit it.\n!A bare verb is not enough: the verb needs a result (了, a complement). 手机被他给摔 ✗ → 摔坏了.\n>我准备了一个星期的资料，全【让|把|替|对】电脑病毒给删除了。=The material I had spent a week preparing was all deleted by a computer virus.\n>他太紧张，面试官问的第一个问题就被他【给|把|得|着】答错了。=He was so nervous that he got the interviewer's very first question wrong.\n~真倒霉，我的简历叫前台【给|被|把|让】弄丢了，只好重新打印一份。=What bad luck: the front desk lost my CV, so I had to print another copy.\n##23\n@哪怕……，也……|even if|哪怕 + extreme condition，也/都 + unchanged result\n哪怕 raises an extreme or unfavourable supposition and says the result stays the same. It is the spoken partner of 即使. The 哪怕 clause can also come second: 我也要试试，哪怕失败.\n!哪怕 is hypothetical; for a fact that is already true use 虽然 or 尽管.\n>【哪怕|假如|一旦|既然】只有百分之一的希望，我们也要去见见那位投资人。=Even if there is only a one per cent chance, we should still go and meet that investor.\n>哪怕所有人都反对，他【也|却|就|才】不会放弃创业的想法。=Even if everyone objects, he won't give up the idea of starting a business.\n~我每天都要抽时间陪孩子，【哪怕|可见|从而|因而】只有半个小时。=I make time for my child every day, even if it is only half an hour.\n@再……也……|no matter how…, still…|再 + adjective/verb + 也 + result\nA compressed concession: however far the condition goes, the result does not change. 再 here means \"to whatever degree\", not \"again\".\n!Do not add 很 or 非常 after 再: 再很忙也 ✗ → 再忙也.\n>创业【再|更|很|越】辛苦，他也没有后悔过。=However hard running a start-up was, he never regretted it.\n>条件再好的公司，【也|却|才|便】不可能让每个人都满意。=Even a company with the best conditions cannot satisfy everyone.\n~产品再好，没有人知道【也|就|才|而】卖不出去。=However good a product is, it won't sell if nobody knows about it.\n##24\n@不但不/不但没有……，反而……|not only not…, but on the contrary…|S + 不但不/没（有）+ expected result，反而 + opposite result\n反而 marks a result opposite to what would normally be expected. The frame first denies the expected result, then states the surprising opposite. 反而 can also be used alone after a clause.\n!The subject comes before 不但 when both clauses share it: 他不但没生气，反而笑了.\n>听了大家的批评，他不但没有生气，【反而|而且|然而|从而】向大家表示了感谢。=After hearing everyone's criticism, he not only didn't get angry but actually thanked them.\n>人多不一定力量大，配合不好，效率【反而|而且|以及|总之】会降低。=More people doesn't necessarily mean more strength; if cooperation is poor, efficiency actually falls.\n~开会讨论了一下午，问题【不但|不管|哪怕|假如】没解决，反而更复杂了。=After a whole afternoon of meetings, the problem wasn't solved; on the contrary, it became more complicated.\n##25\n@万一……，（就）……|in case; if by any chance|万一 + unlikely, unwanted event，（就）+ what happens / what to do\n万一 supposes something that is unlikely but would be a problem, so it is the natural word for precautions and worries. As a noun: 以防万一 = just in case.\n!万一 is not used for good news you are hoping for: 万一我考上了 sounds as if passing were a risk.\n>把充电宝带上吧，【万一|哪怕|既然|自从】停电了，手机还能用。=Take the power bank; if there is a power cut, you can still use your phone.\n>台风天最好别开车出门，万一路上被水困住【就|才|也|却】麻烦了。=It's best not to drive in a typhoon; if you got trapped by water on the road, you would be in trouble.\n~多准备一些食物和水吧，以防【万一|一旦|假如|不然】。=Prepare some extra food and water, just in case.\n@……，要不然/不然……|otherwise; or else|advice/fact，要不然/不然 + bad consequence\n要不然, 不然 and 要不 all mean \"if not so\". They follow advice, an order or a fact, and introduce what would happen otherwise. 要不 can also offer an alternative: 要不我们明天再去？\n!The clause before 不然 states what should be done or what is true; the clause after it is hypothetical and often has 就 or 会.\n>快把阳台上的花盆搬进来，【要不然|哪怕|从而|以及】会被大风吹下去的。=Quick, bring the flowerpots in from the balcony, or they will be blown down by the wind.\n>幸亏我们提前出发了，【不然|万一|一旦|可见】肯定赶不上最后一班飞机。=Luckily we set off early; otherwise we would certainly have missed the last flight.\n~出门记得看天气预报，【不然|虽然|从而|因而】很容易着凉。=Remember to check the forecast before going out, or you will easily catch a chill.\n##26\n@……，为的是……|the purpose is; in order to|action，为的是 + purpose\nThe first clause gives an action that has been taken or is planned; 为的是 then explains the purpose behind it. It answers an unspoken \"why?\".\n!The order is fixed: action first, purpose second. To put the purpose first, use 为了: 为了保护水资源，…\n>这里的农民改种用水少的作物，【为的是|要不然|可见|以及】节约有限的水资源。=Farmers here have switched to crops that need less water, in order to save limited water resources.\n>我们天不亮就出发，为的【是|就|把|也】在中午以前走出沙漠。=We set off before dawn so as to get out of the desert before noon.\n~政府在河边种了大量树木，【为的是|不然|哪怕|万一】防止沙子被风吹进城市。=The government planted large numbers of trees along the river to stop sand being blown into the city.\n##27\n@没有……就没有…… · 不……不……|without A, no B · if not A, then not B|没有 + A + 就没有 + B · 不 + V1 + 不 + V2/Adj\nBoth are compressed conditionals. 没有A就没有B: A is the necessary condition for B. 不A不B: unless A happens, B is not the case (不问不知道、不修不安全). Because they are short, they sound like sayings.\n!不……不…… can also simply join two opposites as \"neither… nor…\" (不多不少、不冷不热); let the context decide.\n>没有大家的共同努力，【就|才|也|却】没有今天这么干净的小区。=Without everyone's joint effort, we would not have such a clean neighbourhood today.\n>垃圾分类并不麻烦，【不|没|别|未】试不知道，试了才发现只要几分钟。=Sorting rubbish is no bother; you don't know until you try, and then you find it takes only a few minutes.\n~【没有|假如|不然|哪怕】干净的水，就没有健康的生活。=Without clean water there is no healthy life.\n##28\n@或是……，或是……|either… or…; some… others…|或是 + option 1，或是 + option 2\nLists alternatives in statements: one of them holds, or different members of a group do different things. It is a slightly more formal 或者…或者…. In questions use 还是.\n!或是 states possibilities and never asks: 你喝茶或是咖啡？ ✗ → 还是.\n>周末我们【或是|还是|不是|哪怕】去动物园看大熊猫，或是去郊外观察鸟类，很少待在家里。=At weekends we either go to the zoo to see the pandas or go to the countryside to watch birds; we seldom stay at home.\n>保护区里的志愿者【或是|以及|从而|因而】来自附近的大学，或是来自环保组织。=The volunteers in the reserve come either from nearby universities or from environmental organisations.\n~纪录片的拍摄地点，或是在高山，【或是|还是|而是|就是】在沙漠，条件都非常艰苦。=The documentary was shot either in high mountains or in deserts; conditions were very hard in both.\n@不是……，还/还是……|… is not enough; … is still needed|不是 + insufficient condition + 就 + …，还/还是 + what is also required\nThe first clause denies that something is enough or that easy; the second adds what is still required. It pushes an argument one step further.\n!Do not confuse it with 不是A，而是B (correction: not A but B) or 不是A就是B (either A or B).\n>保护动物不是光喊口号就可以的，【还|而|却|便】要有实际行动。=Protecting animals is not something you can do just by shouting slogans; real action is needed too.\n>这个问题不是一个国家就能解决的，【还是|或是|可见|要不】需要各国共同合作。=This is not a problem one country can solve alone; cooperation among all countries is still needed.\n~拍好动物不是有一台好相机【就|才|也|还】行，还得有足够的耐心。=Photographing animals well takes more than a good camera; you also need plenty of patience.\n##29\n@主语 + 有着 + 宾语 · 主语 + 动词 + 有 + 宾语|written 有 patterns: possess · bear|S + 有着 + (modifier 的) abstract noun · place/thing + 写/印/装/挂/刻/存 + 有 + noun\n有着 states that something has an abstract quality or relationship, in written style; its object needs a modifier (有着重要的作用、有着悠久的历史). V+有 says that something is attached to or kept in a place as the result of an action (包装上印有二维码).\n!有着 does not take simple concrete objects: 我有着一部手机 ✗. Neither pattern is negated with 没.\n>智能机器人在老年人的生活中【有着|在于|充满|属于】越来越重要的作用。=Smart robots play an increasingly important role in the lives of the elderly.\n>这款手表里【装有|装得|装成|属于】多个传感器，可以随时测量心跳。=This watch contains several sensors and can measure your heartbeat at any time.\n~直播和传统的电视购物【有着|在于|属于|充满】很大的差别。=Live-streaming is very different from traditional TV shopping.\n##30\n@A + 形容词 + B + 数量补语|comparison without 比|A + 高/大/小/重/轻/早/晚 + B + amount\nWith a few measurable adjectives, the thing compared can follow the adjective directly, and the difference comes last: 他大我两岁 = 他比我大两岁. It is compact and common in speech.\n!Only one-syllable measurable adjectives work, and the amount is obligatory: 他高我 ✗.\n>我弟弟【小|比|较|同】我三岁，可是每天睡得比我还少。=My brother is three years younger than me, yet he sleeps even less than I do every day.\n>研究发现，睡眠充足的学生平均成绩【高|比|更|较】别人五分左右。=Research found that students who sleep enough score on average about five points higher than others.\n~这种新电池【轻|比|更|较】旧电池二十克，用的时间却更长。=This new battery is twenty grams lighter than the old one, yet it lasts longer.\n##31\n@动词/形容词 + 得 + 动词短语 / 主谓短语 / 固定短语|complement of state with a long description|V/Adj + 得 + what it led to\nAfter 得 you can put a whole verb phrase (急得直哭), a subject–predicate phrase (累得腿都抬不起来) or a set phrase (高兴得手舞足蹈). The part after 得 pictures the degree through its result.\n!The subject inside the complement may differ from the main subject: 他说得大家都笑了 (he spoke, everyone laughed).\n>搬家那天，我们忙【得|地|的|着】连午饭都没时间吃。=On moving day we were so busy that we didn't even have time for lunch.\n>这座城市变化大得连本地人都【认不出来|来不及|看不起|舍不得】了。=The city has changed so much that even locals can't recognise it.\n~听说要去省会工作，他高兴【得|地|的|了】一晚上没睡着。=Hearing he was going to work in the provincial capital, he was so happy he couldn't sleep all night.\n##32\n@不得了 · 形容词/心理动词 + 得 + 不得了|how terrible! · extremely|Adj/mental verb + 得 + 不得了 · 不得了，+ bad news\nAs a complement, 不得了 means the degree is extreme, good or bad (热闹得不得了). On its own it is an exclamation that something serious has happened: 不得了了，着火了！\n!不得了 (bùdéliǎo) ≠ 了不起 (liǎobuqǐ, admirable). 好得了不起 ✗.\n>展览会第一天，参观的人多得【不得了|了不起|不得不|来不及】，入口排了几百米的队。=On the first day of the fair there was an incredible number of visitors; the queue at the entrance was hundreds of metres long.\n>【不得了|了不起|舍不得|用不着】，我把合同忘在出租车上了！=Oh no, I left the contract in the taxi!\n~听说自己的产品被选中参加博览会，她激动【得|地|的|着】不得了。=Hearing that her product had been chosen for the expo, she was beside herself with excitement.\n##33\n@动词 + 得 / 不得|may / must not (because of the consequences)|V + 不得 (it would be wrong or risky) · V + 得 (it is all right)\nThis potential complement judges whether an action is permissible or advisable, not whether one is physically able: 这种话说不得、急不得、马虎不得. Positive V得 mostly appears in questions or contrasts. Some forms are words in their own right: 舍不得、怪不得、顾不得.\n!吃不得 = must not eat (it is bad for you); 吃不了 = can't finish; 吃不下 = too full to eat.\n>找工作这件事急【不得|不了|不起|不下】，要一步一步来。=Job-hunting can't be rushed; you have to take it one step at a time.\n>简历上的信息必须真实，一点儿也马虎【不得|不到|不上|不过】。=The information on a CV must be true; you can't be careless about it in the slightest.\n~这份工作去【得|了|过|着】去不得，你最好先问问在那儿工作的朋友。=Whether you should take this job or not, you had better first ask friends who work there.\n@用不着|no need; have no use for|用不着 + verb / noun\n用不着 says that something is unnecessary, often to decline help or to tell someone not to worry. Its positive form 用得着 appears in questions and for things that may come in handy.\n!用不着 is about need; 用不了 is about quantity or time (用不了这么多钱、用不了一个小时).\n>这点儿小事【用不着|用不了|来不及|舍不得】麻烦老师，我们自己就能解决。=There's no need to trouble the teacher over such a small matter; we can sort it out ourselves.\n>面试穿得整齐就行，【用不着|不得了|了不起|怪不得】专门去买一套很贵的西装。=For an interview it's enough to dress neatly; you needn't buy an expensive suit specially.\n~这些资料先别扔，说不定以后还【用得着|用不着|用不了|来得及】。=Don't throw these materials away yet; they may still come in useful.\n##34\n@多项状语|order of several adverbials|S + time + adverb (也/都/已经/就) + place + 跟/对/向/给 phrase + manner 地 + V\nWhen several adverbials precede one verb, the usual order is: time → mood, frequency or scope adverbs (也、都、已经) → place → prepositional phrases of company, target or direction (跟、对、向、给) → manner describing the action (认真地) → verb. Purpose phrases with 为了 usually come first.\n!Words that describe the action itself stay closest to the verb: 在车上跟乘客热情地交谈.\n>我们【昨天在火车上|在火车上昨天|火车上在昨天|昨天火车在上】跟一位工程师聊了很久。=Yesterday on the train we chatted for a long time with an engineer.\n>他为了赶第一班高铁，【每天五点就|就每天五点|五点每天就|就五点每天】起床。=To catch the first high-speed train, he gets up at five every day.\n~工人们【已经在山里|在已经山里|山里在已经|已经山里在】连续工作了三个月。=The workers have already been working in the mountains for three months without a break.\n##35\n@连动句（因果、转折、条件）|verb phrases in a row with a hidden logical link|S + VP1 + VP2 (no connective)\nTwo verb phrases can share one subject with no connective, while the relation between them is cause (生病住院了 = fell ill and so was hospitalised), contrast (出门忘了带钥匙 = went out but forgot the keys) or condition (有问题找我 = if there is a problem, come to me). You read the logic from the meaning.\n!The order of the verb phrases follows time and logic and cannot be swapped.\n>她逛街忘了【带|有|在|把】手机，结果什么也没买成。=She went shopping but forgot to bring her phone, and ended up buying nothing.\n>有什么不明白的地方【找|对|向|给】我，不用客气。=If there is anything you don't understand, come to me; don't stand on ceremony.\n~他投资失败【欠了|欠着了|把欠|被欠】一大笔钱，只好把房子卖了。=His investment failed and left him owing a large sum, so he had to sell his flat.\n##36\n@彼此、如此、本|each other · so; like this · this (formal)|彼此 + verb / 彼此的 + noun · 如此 + adjective · 本 + noun\n彼此 = each other, both sides (彼此了解). 如此 = 这样/这么 in written style (如此重要、原来如此). 本 before a noun means \"this, the present, our own\" in formal notices: 本店、本人、本次列车、本月.\n!互相 is only an adverb (互相帮助); 彼此 is a pronoun, so it can be an object or take 的: 关心彼此、彼此的想法.\n>两代人只有多沟通，才能真正理解【彼此|互相|如此|本】的想法。=Only by communicating more can two generations really understand each other's ideas.\n>没想到农村的变化【如此|彼此|这些|本】巨大，连快递都能送到家门口了。=I never expected the countryside to have changed so enormously; even parcels are delivered to the door now.\n~【本|彼此|如此|其】店所有商品一律八折，欢迎选购。=All goods in this shop are 20% off; you are welcome to browse and buy.\n@—头|noun suffix 头|noun/verb/adjective/location + 头 (neutral tone)\n头 (tou) forms nouns: things (木头、石头、骨头), locations (里头、外头、上头、前头) and abstract nouns from verbs or adjectives meaning \"something worth …-ing\" (看头、想头、甜头、念头).\n!The suffix is unstressed. 没什么看头 = not worth seeing; 尝到了甜头 = got a taste of the benefits.\n>这部电视剧没什么看【头|子|儿|者】，才看了两集我就不想看了。=This TV series isn't worth watching; after just two episodes I didn't want to go on.\n>老人们尝到了网上购物的甜【头|子|儿|者】。=The old people have had a taste of the benefits of online shopping.\n~盒子里【头|子|者|性】装的是他年轻时写的信。=Inside the box are letters he wrote when he was young.\n##37\n@A来A去 · X来X去，都是/就是……|back and forth; over and over · it all comes down to|V + 来 + V + 去 · V来V去，都是/就是/还是 + conclusion\nV来V去 shows an action repeated many times or moving back and forth (走来走去、想来想去). Followed by 都是/就是/还是, it says that after all the repetition the outcome is one and the same.\n!Mostly single-syllable verbs. After the frame comes what the repetition leads to (or fails to lead to).\n>我想【来|去|过|起】想去，还是觉得这本小说的结尾最感人。=I've thought it over and over, and I still find the ending of this novel the most moving.\n>他在书架前走来走【去|来|开|出】，半天也没决定买哪一本。=He walked back and forth in front of the bookshelves and couldn't decide for ages which one to buy.\n~大家说来说去，【都是|或是|要不|可见】那几个老问题，没有什么新看法。=Everyone talked round and round, but it was all the same old issues; nobody had anything new to say.\n##38\n@A着A着|while doing A (something unexpected happens)|V + 着 + V + 着，+ new event\nThe repeated V着 pictures an action going on; in the middle of it, without anyone noticing, something new happens or the situation changes. The second clause often has 就、突然 or 不知不觉.\n!The second clause is necessary, and the verb is a single syllable: 看着看着就睡着了.\n>她看着那些老照片，看【着|了|过|得】看着就流下了眼泪。=Looking at those old photos, before she knew it she was in tears.\n>我们在展览馆里走着走着，【就|才|再|并】跟其他人走散了。=As we walked along in the exhibition hall, we got separated from the others.\n~他们聊【着聊着|来聊去|的聊的|了又聊】，才发现天已经黑了。=As they chatted on, they suddenly realised it had got dark.\n##39\n@没A没B · 说A就A|without A or B · no sooner said than done|没 + A + 没 + B · 说 + V + 就 + V\n没A没B with two related words stresses a complete lack (没日没夜 = day and night without rest); with opposites it criticises someone for ignoring a proper difference (没大没小 = no respect for seniority). 说A就A means something happens at once or without warning (说走就走、说变就变).\n!These are fixed frames with set fillers; learn them as whole chunks rather than inventing new ones.\n>为了准备这次马拉松，他没日没【夜|天|晚|月】地训练了三个月。=To prepare for this marathon, he trained day and night for three months.\n>山里的天气【说|讲|想|要】变就变，刚才还是晴天，现在已经下起雨来了。=Mountain weather changes without warning: it was sunny just now and it is already raining.\n~这孩子在教练面前也没大没【小|少|老|高】，真该好好教育一下。=This child shows no respect even in front of the coach; he really needs a good talking-to.\n##40\n@A的A，B的B|some do A, others do B|V1 的 V1，V2 的 V2 · Adj1 的 Adj1，Adj2 的 Adj2\nDescribes the members of a group each doing something different, or each in a different state. It usually follows a general statement about the group and paints a lively or messy scene.\n!The frame needs a group as its topic: 同学们唱歌的唱歌，跳舞的跳舞. It cannot describe one person.\n>电影节开幕那天，观众们拍照的拍照，【签名的签名|签名的签字|签名着签名|签的名签】，热闹极了。=On the opening day of the film festival, some of the audience took photos and others got autographs; it was extremely lively.\n>这些旧游戏机，坏【的|得|地|了】坏，丢的丢，现在一台也找不到了。=As for these old game consoles, some broke and some got lost; now you can't find a single one.\n~下课以后，学生们打球的打球，【回家的回家|回家的回去|回的家回家|回家地回家】，教室里很快就没人了。=After class some students went to play ball and others went home; the classroom was soon empty.\n##41\n@X也不是，Y也不是 · X也X不得，Y也Y不得|caught in a dilemma|V1 也不是，V2 也不是 · V1 也 V1 不得，V2 也 V2 不得\nBoth frames show someone stuck between two opposite choices, neither of which works: 站也不是，坐也不是 (too uneasy to stand or sit); 哭也哭不得，笑也笑不得 (can neither cry nor laugh).\n!X and Y are opposites or the only two options. The idiom 哭笑不得 is built on the same idea.\n>比赛前一天他受伤了，教练让他上场【也不是|又不是|并不是|可不是】，不让他上场也不是。=He got injured the day before the match; the coach could neither let him play nor keep him out.\n>面对记者的问题，他说也不是，【不说也不是|没说也不行|别说也不好|不说可不是】。=Faced with the reporter's question, he could neither speak nor stay silent.\n~听到这个消息，她哭也哭【不得|不到|不上|不过】，笑也笑不得。=Hearing this news, she didn't know whether to laugh or cry.\n##42\n@动词 + 什么（就）是什么|whatever is said goes|S + V + 什么 +（就）是什么\nThe first 什么 is indefinite (\"whatever\"), and 就是什么 says that it is accepted exactly as it is, with no room for discussion: 他说什么就是什么. It can show obedience, trust, or a lack of choice.\n!Compare V什么 + V什么 with the verb used twice: 有什么吃什么 = eat whatever there is.\n>在我们家，奶奶说什么【就是|才是|而是|还是】什么，谁也不敢反对。=In our family, whatever Grandma says goes; nobody dares object.\n>刚到国外的时候，我一句当地话也不会说，房东给什么【就是|而是|或是|可是】什么。=When I first went abroad I couldn't speak a word of the local language; whatever the landlord gave me, that was that.\n~菜单是对方准备的，他们做【什么|怎么|哪儿|多少】，我们就吃什么。=The menu was prepared by our hosts; whatever they cooked, we ate.\n##43\n@X是它，Y也是它 · X着也是X着|it's the one for everything · since we're just …-ing anyway|X 是它，Y 也是它 · V 着也是 V 着，（不如）+ suggestion\nX是它，Y也是它: whatever the case or use, it is the same thing or person; there is no alternative. X着也是X着: the present idle state is pointless, so one may as well do something useful: 闲着也是闲着，不如……\n!The second frame nearly always leads into a suggestion with 不如 or 干脆.\n>这本成语词典我用了十年，预习是它，复习【也是|就是|还是|才是】它。=I've used this idiom dictionary for ten years: I preview with it and I review with it too.\n>这些旧报纸放着【也是|就是|可是|而是】放着，不如拿来练毛笔字。=These old newspapers are just lying around anyway; why not use them to practise brush writing?\n~周末闲着也是闲【着|了|过|的】，我们去听听那个成语故事讲座吧。=We've nothing to do at the weekend anyway; let's go to that talk on idiom stories.\n##44\n@真有你/他/她的 · X什么X|you're really something! · what's there to X about?|真有你的！ · V/Adj + 什么 + V/Adj！\n真有你的 is a spoken exclamation of admiration, sometimes of mock blame, at what someone has managed to do. X什么X rejects or scolds what the other person is doing or has just said: 笑什么笑！ 急什么急，还早呢。\n!X什么X is blunt. Use it only with people close to you; in listening it signals annoyance or disagreement.\n>三十个粽子你一个人一上午就包完了？【真有你的|不得了了|用不着你|没什么的】！=You wrapped thirty zongzi by yourself in one morning? You're really something!\n>急【什么|怎么|那么|这么】急，龙舟比赛十点才开始，现在才八点。=What's the hurry? The dragon boat race doesn't start until ten, and it's only eight now.\n~笑什么【笑|哭|说|看】！我第一次包粽子，包成这样已经不错了。=What are you laughing at! It's my first time wrapping zongzi; this is already not bad.\n##45\n@什么X不X（的） · 不X白不X|never mind whether X or not · it'd be a waste not to X|什么 + X + 不 + X（的），+ what really matters · 不 + V + 白不 + V\n什么X不X的 brushes aside a concern the other person has raised: 什么贵不贵的，喜欢就买. 不X白不X: since it costs nothing or the chance is there, not doing it would be a loss: 不吃白不吃、不看白不看.\n!白 here means \"for nothing\": if you don't take it, you go without for nothing.\n>什么远【不|没|别|非】远的，只要能陪老人登高看看风景，再远也值得。=Never mind how far it is: as long as we can take the old folks up the hill to enjoy the view, it's worth it however far.\n>公园今天免费开放，不去【白|就|才|也】不去，咱们一起去看菊花吧。=The park is free today; it would be a waste not to go. Let's go and see the chrysanthemums together.\n~【什么|怎么|多么|那么】谢不谢的，都是老邻居，别这么客气。=Never mind thanking me; we're old neighbours, don't be so polite.\n##46\n@量词（二）：行、群、批、束、副、集、周 · 动量词：眼|measure words (2)|number + measure word + noun · verb + 一眼\n行 háng lines of text, rows · 群 crowds, herds, flocks · 批 batches of goods or people · 束 bunches of flowers, beams of light · 副 pairs and sets (glasses, gloves, couplets), also facial expressions · 集 episodes · 周 laps, circuits · 眼 counts looks: 看了一眼.\n!双 is for natural pairs worn on two limbs (一双鞋、一双手); 副 is for sets made as one item (一副眼镜、一副手套、一副对联).\n>老师在纸上写了两【行|群|批|束】字，让我们照着练习。=The teacher wrote two lines of characters on the paper for us to copy.\n>这【副|双|束|集】对联是爷爷亲手写的，每年春节都贴在门上。=This pair of couplets was written by Grandpa himself; it goes up on the door every Spring Festival.\n>演出结束后，观众送给演员一【束|副|行|批】鲜花。=After the performance the audience presented the performer with a bunch of flowers.\n~这幅画我只看了一【眼|集|周|行】，就被深深地吸引了。=I took just one look at this painting and was deeply drawn to it.\n##47\n@由……组成|be made up of|whole + 由 + parts + 组成 / 构成\nIntroduces the components of a whole in written style. 由 marks what does the forming; the same 由 also marks the person responsible: 由他负责、由你决定.\n!The whole comes first. 组成 can also be active, with the parts as subject: 五个人组成了一个小组.\n>长城主要【由|被|把|以】城墙、城楼和烽火台组成。=The Great Wall is mainly made up of walls, gate towers and beacon towers.\n>这支考察队由十二名历史学家和考古学家【组成|成立|造成|完成】。=This expedition team is made up of twelve historians and archaeologists.\n~唐代的长安城【由|据|凭|朝】一百多个坊组成，每个坊都有围墙。=Chang'an in the Tang dynasty was made up of more than a hundred wards, each with its own walls.\n##48\n@据、依据|according to · on the basis of|据 + source（说/报道/记载/统计），… · 依据 + rule/fact + verb\n据 introduces the source of information: 据说、据报道、据记载、据统计、据我所知. 依据 names the law, rule, theory or fact on which an action or judgement rests; it is formal and can also be a noun (科学依据).\n!据 does not take a bare person: 据他 ✗ → 据他说、据他介绍. With a rule or document, 根据 and 依据 are both fine.\n>【据|凭|朝|替】史书记载，张衡在一千八百多年前就发明了地动仪。=According to historical records, Zhang Heng invented the seismoscope more than 1,800 years ago.\n>中医通常【依据|据说|由于|按时】病人的脸色、舌头和脉搏来判断病情。=Doctors of Chinese medicine usually judge a patient's condition on the basis of complexion, tongue and pulse.\n~【据|凭|沿|较】统计，这家中医院每年接待的外国病人超过一万人次。=According to statistics, this hospital of Chinese medicine receives over ten thousand visits from foreign patients each year.\n","kw":"##1 At the post office: a parcel abroad\nA:您好，我想往国外寄一个包裹，里面是茶叶和几本书。=Hello, I'd like to send a parcel abroad. It contains tea and a few books.\nB:好的。自从上个月开始，寄往国外的包裹都要先填一张海关申报单。=Sure. Since last month, every parcel going abroad needs a customs declaration form first.\nA:原来是这样。那大概多长时间能到？=I see. Roughly how long will it take to arrive?\nB:普通邮寄要三个星期左右，快递一个星期就能到，不过运费贵一倍。=Ordinary post takes about three weeks; express gets there in a week, but the postage is double.\nA:不着急，寄普通的吧。需要买保险吗？=No hurry, ordinary post then. Do I need insurance?\nB:东西不贵的话用不着。您先称一下重量吧。=If the contents aren't valuable, there's no need. Let's weigh it first.\n?女的最后选择了哪种方式？|普通邮寄|快递|不寄了|买了保险再寄\n##2 Complaining in a restaurant\nA:服务员，我们点的菜已经等了四十分钟了，怎么还没上？=Waiter, we've been waiting forty minutes for our dishes. Why haven't they come?\nB:实在抱歉，今天客人格外多。我立刻去厨房帮您催一下。=I'm truly sorry, we have far more customers than usual today. I'll go to the kitchen right away and hurry them up.\nA:还有，这盘鱼我们没点，是不是上错了？=Also, we didn't order this fish. Was it brought by mistake?\nB:哎呀，真对不起，这是隔壁桌的。我马上给您换。=Oh dear, I'm so sorry, that's for the next table. I'll change it at once.\nA:我们一会儿还要赶火车，请尽快吧。=We have a train to catch later, so please be as quick as you can.\nB:好的。为了表示歉意，今天的饮料免费。=Of course. By way of apology, today's drinks are on the house.\n?关于这家餐厅，可以知道什么？|今天客人很多|菜的味道不好|饮料卖完了|不能换菜\n##3 An insurance claim\nA:喂，是保险公司吗？我的车刚才在停车场被人撞了。=Hello, is this the insurance company? My car was just hit in a car park.\nB:您先别着急。人受伤了吗？对方车主还在现场吗？=Please don't worry. Is anyone hurt? Is the other driver still at the scene?\nA:人没事。可是等我发现的时候，那辆车早已开走了。=Nobody's hurt. But by the time I noticed, that car had long gone.\nB:那请您先报警，再拍几张照片。我们的工作人员半小时内到。=Then please call the police first and take a few photos. Our staff will be there within half an hour.\nA:对了，我的保险下个月即将到期，这次还能赔吗？=By the way, my insurance is about to expire next month. Can I still claim this time?\nB:只要在保险期内就没问题，您放心。=As long as it's within the insured period there's no problem; don't worry.\n?男的让女的先做什么？|报警|修车|交保险费|去公司登记\n##4 After-sales service\nA:你好，我上周买的空调老是自动关机，想申请退货。=Hello, the air conditioner I bought last week keeps switching itself off. I'd like to apply for a return.\nB:给您带来不便，非常抱歉。请问您联系过维修师傅吗？=We're very sorry for the inconvenience. Have you contacted a repair technician?\nA:师傅来过两次了，可是问题始终没解决。=A technician has come twice, but the problem has never been solved.\nB:明白了。按照规定，七天之内可以退货，超过七天只能换。=I understand. Under the rules you can return it within seven days; after that we can only exchange it.\nA:今天刚好是第七天。退款通常多久能到账？=Today is exactly the seventh day. How long does a refund usually take to arrive?\nB:通常三到五个工作日，我们会用短信通知您。=Normally three to five working days; we'll notify you by text.\n?女的为什么要退货？|空调一直有毛病|空调太贵了|买错了型号|师傅没来修理\n##5 In the emergency room\nA:医生，我丈夫从昨晚开始胃疼得厉害，还吐了两次。=Doctor, my husband has had a terrible stomach ache since last night, and he has vomited twice.\nB:我看看。他最近饮食怎么样？是不是工作过于劳累？=Let me see. How has his diet been lately? Has he been overworking?\nA:他这个月天天熬夜加班，吃饭也很不规律。=He's worked late every night this month and eats at very irregular times.\nB:初步判断是急性肠胃炎。先去验血，结果出来以后我再做诊断。=My first judgement is acute gastroenteritis. Go for a blood test first; I'll make a diagnosis when the results are out.\nA:严重吗？需不需要住院？=Is it serious? Does he need to be hospitalised?\nB:目前看不算严重，不过这几天一定要好好休息，吃得淡一点儿。=It doesn't look serious at the moment, but he must rest well for a few days and eat lightly.\n?医生认为病人的病和什么有关？|太累、饮食不规律|吃了过期的食物|运动时受了伤|对药物过敏\n##6 Talking to a counsellor\nA:老师，我最近压力特别大，每天晚上都失眠。=Sir, I've been under a lot of pressure lately and can't sleep at night.\nB:能具体说说吗？压力主要来自哪些方面？=Can you be more specific? Where does the pressure mainly come from?\nA:快毕业了，论文没写完，工作也没找到，心里很不安。=I'm about to graduate, my thesis isn't finished and I haven't found a job, so I feel very uneasy.\nB:这种情绪很正常。你可以把要做的事一件一件写下来，每天只完成一两件。=Those feelings are quite normal. You could write down the things you have to do one by one, and finish just one or two each day.\nA:我试试。那睡不着的时候怎么办？=I'll try. And what should I do when I can't sleep?\nB:睡前尽量别看手机，听一支轻松的歌，慢慢让自己平静下来。=Try not to look at your phone before bed; listen to a relaxing song and let yourself slowly calm down.\n?男的建议女的怎么做？|把事情写下来，一件一件完成|马上去医院看病|先别写论文|换一个专业\n##7 A leak and the property office\nA:喂，物业吗？我家卫生间的天花板漏水了，你们能派人来看看吗？=Hello, property management? My bathroom ceiling is leaking. Could you send someone to have a look?\nB:好的。请问是从什么时候开始的？=Certainly. When did it start?\nA:前天就开始了。我给楼上的邻居留了言，他居然到现在都没回复。=The day before yesterday. I left a message for the neighbour upstairs, and he still hasn't replied!\nB:楼上那家最近在装修，估计是水管出了问题。我们的师傅下午三点上门。=The flat upstairs is being renovated; the pipes are probably the problem. Our repairman will come at 3 p.m.\nA:维修的费用由谁来承担？=Who will bear the cost of the repair?\nB:如果的确是楼上造成的，应该由他们负责。=If it really was caused by the flat upstairs, they should be responsible.\n?漏水的原因可能是什么？|楼上装修弄坏了水管|女的忘了关水|下了大暴雨|物业没有按时检查\n##8 Renting a flat\nA:这套公寓离地铁站很近，就是租金比别的贵五百块。=This flat is very close to the metro, but the rent is 500 yuan more than the others.\nB:贵一点儿也值得，毕竟你每天能多睡半个小时。=It's worth paying a bit more; after all, you get an extra half hour of sleep every day.\nA:中介说要先交三个月的押金，我觉得太多了。=The agent says I have to pay three months' deposit first. I think that's too much.\nB:押金反正退房的时候会退还，关键是合同要看清楚。=You get the deposit back when you move out anyway; the key thing is to read the contract carefully.\nA:你说得对。上次我租房子，合同里根本没写谁负责维修。=You're right. Last time I rented, the contract didn't say at all who was responsible for repairs.\nB:所以这次签字以前，一定要把这些问题问明白。=So this time, be sure to ask about all these things before you sign.\n?男的提醒女的注意什么？|把合同看清楚|别租这套公寓|押金不能退|换一个中介\n##9 Planning a wedding\nA:婚礼的日子定了吗？=Have you fixed the date of the wedding?\nB:定了，十月二号，刚好是我们认识五周年的纪念日。=Yes, 2 October, which happens to be the fifth anniversary of the day we met.\nA:太有意义了！酒店订好了没有？国庆期间可不好订。=How meaningful! Have you booked the hotel? It's really hard to book during National Day.\nB:别提了，我们跑了七八家，简直累坏了，昨天才订到一家。=Don't mention it. We went to seven or eight places and were simply exhausted; we only managed to book one yesterday.\nA:需要帮忙的话尽管说，我那天绝对有空。=If you need help just say so; I'm absolutely free that day.\nB:那太好了，你来当主持人吧，大家都说你幽默。=Great, then be our host. Everyone says you're funny.\n?男的请女的做什么？|在婚礼上当主持人|帮忙订酒店|帮忙选日子|陪新娘买衣服\n##10 A weekend with the kids\nA:周末带儿子去科技馆了，他高兴得像过年似的。=I took our son to the science museum at the weekend; he was as happy as if it were New Year.\nB:我发现他最近似乎对机器人特别感兴趣。=I've noticed he seems to be particularly interested in robots lately.\nA:是啊，他在机器人展区待了两个小时，怎么叫都不走。=Yes, he stayed in the robot section for two hours and wouldn't leave however much I called him.\nB:要不给他报一个机器人兴趣班？=How about signing him up for a robotics class?\nA:我也想过，不过先问问他自己的想法吧，不能我们说什么就是什么。=I've thought about it too, but let's ask what he thinks first; it can't just be whatever we say.\nB:你说得对，尊重孩子的选择更重要。=You're right; respecting the child's choice matters more.\n?他们打算怎么做？|先听听孩子的想法|马上报兴趣班|不让孩子去科技馆|给孩子买一个机器人\n##11 Learning photography\nA:你拍的这张日出太美了，是在哪儿拍的？=This sunrise photo of yours is so beautiful. Where did you take it?\nB:在黄山。为了把这个画面拍下来，我夜里三点就上山了。=On Mount Huangshan. To capture this scene I went up the mountain at three in the morning.\nA:我也想学摄影，可是总担心自己坚持不下去。=I'd like to learn photography too, but I always worry I won't be able to keep it up.\nB:刚开始用不着买很贵的相机，用手机多拍、多观察就行。=At the start there's no need to buy an expensive camera; just shoot and observe a lot with your phone.\nA:那你有什么经验可以分享吗？=Do you have any experience you can share?\nB:光线最重要。每天早晚各拍一张，一个月下来，进步会很明显。=Light matters most. Take one photo every morning and evening; after a month your progress will be obvious.\n?男的认为刚开始学摄影的人应该怎么做？|用手机多拍多观察|先买一台好相机|先去黄山旅行|每天拍一百张照片\n##12 Volunteering in the community\nA:王大爷，听说您退休以后一直在社区当志愿者？=Uncle Wang, I hear you've been a community volunteer ever since you retired?\nB:是啊，闲着也是闲着，帮大家做点儿事，心里高兴。=Yes. I'd only be sitting idle anyway; doing a bit for everyone makes me happy.\nA:最近社区里忙什么呢？=What's keeping the community busy these days?\nB:我们办了一个“周末课堂”，教老人用手机挂号、付款。来的人越来越多，热闹起来了。=We've set up a \"weekend class\" teaching old people to book hospital appointments and pay by phone. More and more people come; it's getting lively.\nA:那你们几个人忙得过来吗？=Can the few of you cope?\nB:忙不过来，所以正想找几个年轻人帮忙呢，你有兴趣吗？=No, we can't, so we're looking for a few young people to help. Are you interested?\n?关于“周末课堂”，下列哪项正确？|教老人使用手机|只在工作日上课|来的人越来越少|是年轻人组织的\n##13 Choosing courses\nA:下学期的课你选好了吗？我还差四个学分。=Have you chosen next semester's courses? I'm still four credits short.\nB:我选了“中国经济概况”，听说内容很实用，就是作业多。=I picked \"Overview of the Chinese Economy\". I hear the content is practical, but there's a lot of homework.\nA:我在犹豫要不要选统计学。假如考试不及格，会影响毕业的。=I'm hesitating over statistics. If I failed the exam, it would affect my graduation.\nB:你数学基础那么好，用不着担心。而且以后写论文肯定用得上。=Your maths is so good, you needn't worry. And you'll certainly need it for your thesis later.\nA:那倒也是。这门课什么时候停止报名？=That's true. When does registration for this course close?\nB:本周五下午五点，你抓紧时间吧。=This Friday at 5 p.m., so hurry up.\n?女的担心什么？|统计学考试不及格|学分太多|作业写不完|错过报名时间\n##14 A thesis proposal\nA:张老师，这是我的论文题目和提纲，请您看看。=Professor Zhang, here are my thesis title and outline. Please have a look.\nB:题目不错，不过范围太大了，一篇论文很难把这么多问题讲清楚。=The topic is good, but the scope is too wide; one thesis can hardly make so many questions clear.\nA:那我只研究最近十年的情况，可以吗？=Then I'll only study the last ten years. Would that be all right?\nB:可以。另外，题目一旦交上去就不能改了，你再好好想想。=Yes. Also, once the title is submitted it can't be changed, so think it over carefully.\nA:明白。那参考资料方面您有什么建议？=Understood. Do you have any suggestions about reference materials?\nB:我发你一份书单，你先读前五本，下个月我们再讨论。=I'll send you a reading list. Read the first five, and we'll discuss again next month.\n?老师觉得论文题目怎么样？|范围太大|没有意义|资料太少|已经有人写过\n##15 An experiment goes wrong\nA:昨天的实验结果怎么样？=How did yesterday's experiment turn out?\nB:别提了。我刚把温度升高，设备便自动关闭了，数据全没了。=Don't ask. As soon as I raised the temperature, the equipment shut itself down and all the data was lost.\nA:是不是操作的时候哪个步骤错了？=Did you get one of the steps wrong while operating it?\nB:我检查了三遍，步骤没问题。后来才发现是那台设备本身出了毛病。=I checked three times and the steps were fine. Only later did I find that the equipment itself was faulty.\nA:那就不是你的责任了。你跟实验室的老师报告了吗？=Then it wasn't your fault. Have you reported it to the lab teacher?\nB:报告了，他说周末以前会修好，我只好下周重新做。=Yes. He says it will be fixed before the weekend, so I'll just have to redo it next week.\n?实验为什么失败了？|设备出了毛病|男的操作错了|温度太低|数据记错了\n##16 Recruiting for a student club\nA:今年摄影社团招新的情况怎么样？=How is recruitment going for the photography club this year?\nB:不太理想。我们只贴了几张海报，因而知道的人很少。=Not ideal. We only put up a few posters, so few people know about it.\nA:我建议你们在网上发一些活动的短视频，从而吸引更多新生。=I suggest you post short videos of your activities online, and so attract more freshmen.\nB:好主意！可是我们没有人会做视频。=Good idea! But none of us knows how to make videos.\nA:我们班有个同学很擅长这个，我可以介绍你们认识。=A classmate of mine is very good at that; I can introduce you.\nB:太感谢了！要是这次能招到三十个人，我请你吃饭。=Thanks so much! If we manage to recruit thirty people this time, dinner's on me.\n?女的建议社团怎么做？|在网上发短视频|多贴一些海报|减少社团活动|请老师帮忙宣传\n##17 Questions after a lecture\nA:教授，您刚才说“兴趣比成绩更重要”，可是找工作的时候，公司首先看的还是成绩。=Professor, you said just now that interest matters more than grades, but when we look for jobs, companies still look at grades first.\nB:这个问题提得很好。成绩能帮你得到面试的机会，但决定你能走多远的是兴趣。=That's a very good question. Grades can get you an interview, but it is interest that decides how far you go.\nA:您能举个例子吗？=Could you give an example?\nB:我有个学生成绩一般，可是他从大一开始就自己设计软件，现在已经是公司的技术主管了。可见，兴趣带来的动力是长期的。=I had a student with average grades, but he designed software on his own from his first year, and now he is a company's head of technology. Clearly, the motivation that interest brings is long-lasting.\nA:那成绩不好也没关系吗？=So it doesn't matter if your grades are poor?\nB:我不是这个意思。总之，成绩和兴趣都不能放弃，但别只为了分数学习。=That's not what I mean. In short, give up neither grades nor interest, but don't study for marks alone.\n?教授的主要观点是什么？|不要只为了分数而学习|成绩一点儿也不重要|找工作不用看成绩|学软件设计最有前途\n##18 Vocational school or university?\nA:我弟弟想上职业学校学汽车维修，可我父母坚决不同意。=My brother wants to go to a vocational school to learn car repair, but my parents are firmly against it.\nB:为什么？从就业情况来看，现在技术工人比大学生还好找工作。=Why? Judging from the job market, skilled workers now find work more easily than university graduates.\nA:他们觉得上大学才有前途。=They think only university gives you a future.\nB:这种观念该改改了。凭技术吃饭，收入不一定低。=That idea needs to change. Earning a living by your skills doesn't necessarily mean a low income.\nA:我也这么想。关键是他自己喜欢，学起来才有动力。=I think so too. The key is that he likes it himself; only then will he be motivated to learn.\nB:你可以带父母去那所学校参观一下，让他们亲自了解了解。=You could take your parents to visit that school and let them find out for themselves.\n?男的对职业教育是什么看法？|有前途，值得选择|不如上大学|学费太贵|毕业后很难就业\n##19 First day as an intern\nA:你好，我是新来的实习生李静，今天第一天报到。=Hello, I'm Li Jing, the new intern. Today is my first day.\nB:欢迎欢迎！我是市场部的小陈，主任让我替他带你熟悉一下环境。=Welcome! I'm Xiao Chen from marketing. The director asked me to show you around on his behalf.\nA:太麻烦你了。我的座位在哪儿？=Sorry to trouble you. Where is my seat?\nB:沿着这条走廊一直走，朝左拐，靠窗的那个位置就是。=Go straight along this corridor and turn left; it's the seat by the window.\nA:好的。今天我主要做什么工作？=OK. What will I mainly be doing today?\nB:上午先同我一起参加部门会议，下午再学习怎么使用公司的系统。=This morning, attend the department meeting with me; this afternoon, learn how to use the company system.\n?李静上午要做什么？|参加部门会议|学习使用系统|见市场部主任|一个人熟悉环境\n##20 A project meeting\nA:我先报告一下项目的进度：设计已经全部完成，测试完成了百分之六十。=Let me first report on the project's progress: the design is completely finished and testing is 60% done.\nB:比计划慢了一个星期，原因是什么？=That's a week behind schedule. What's the reason?\nA:主要是客户临时增加了两个功能，以及有一位同事请了病假。=Mainly that the client added two functions at short notice, and one colleague is on sick leave.\nB:那月底以前能完成吗？=Then can it be finished by the end of the month?\nA:如果能从别的部门调两个人过来，应该没问题。=If two people can be transferred from another department, there should be no problem.\nB:好，这件事我去同人事部商量。你们把剩下的工作再分配一下。=Fine, I'll discuss that with HR. You reassign the remaining work.\n?项目为什么比计划慢？|客户增加了功能，还有人请假|设计方案被否定了|测试设备坏了|人事部不同意加人\n##21 Handing in a resignation\nA:王经理，这是我的辞职信。我考虑了很久，还是决定离开。=Manager Wang, this is my letter of resignation. I've thought about it for a long time and have decided to leave.\nB:太突然了。是对待遇不满意，还是工作上遇到了什么困难？=This is so sudden. Are you unhappy with the pay, or have you met some difficulty at work?\nA:都不是。我想回老家创业，把父母的小店搬到网上去。=Neither. I want to go back to my home town and start a business, moving my parents' little shop online.\nB:有想法是好事。不过你走以前，得把手上的项目交给合适的人。=Having ideas is a good thing. But before you go, you must hand your current projects over to the right person.\nA:您放心，我已经把所有资料整理好了，小周可以接手。=Don't worry, I've already put all the materials in order; Xiao Zhou can take over.\nB:那好吧。以后有什么需要帮忙的，随时找我。=All right then. If you ever need help, come to me any time.\n?女的为什么辞职？|想回老家创业|对工资不满意|和同事有矛盾|工作压力太大\n##22 A job interview\nA:你的简历我们看过了。能说说你为什么离开上一家公司吗？=We've read your CV. Can you tell us why you left your last company?\nB:上一家公司去年被另一家企业给买下了，我所在的部门整个被取消了。=My last company was bought by another firm last year, and my whole department was abolished.\nA:原来如此。你对待遇有什么要求？=I see. What are your expectations regarding pay?\nB:我希望每月工资不低于一万五，当然，我更看重发展的空间。=I hope for a monthly salary of no less than 15,000, though of course I value room to grow even more.\nA:我们的试用期是三个月，试用期工资是正式工资的百分之八十。=Our probation period is three months, and probation pay is 80% of the regular salary.\nB:可以接受。请问什么时候能知道结果？=That's acceptable. When will I know the result?\n?男的为什么离开了原来的公司？|部门被取消了|工资太低|没有发展空间|试用期没通过\n##23 Looking for investors\nA:听说你们公司正在找投资？进行得顺利吗？=I hear your company is looking for investment. Is it going well?\nB:见了十几位投资人，只有两位表示有兴趣。=We've met a dozen investors, and only two showed interest.\nA:创业初期都这样。你们的产品有什么优势？=It's always like that in the early days. What advantages does your product have?\nB:我们的软件能帮小商店管理货物，价格只有同类产品的一半。=Our software helps small shops manage their stock, at only half the price of similar products.\nA:听起来不错。不过资金再紧张，也别随便降低对质量的要求。=Sounds good. But however tight money gets, don't casually lower your quality standards.\nB:这个我明白。哪怕发展得慢一点儿，我们也要把产品做好。=I understand that. Even if we grow a little more slowly, we must make the product well.\n?关于男的的公司，可以知道什么？|产品价格比较低|已经得到了大量投资|产品质量出了问题|主要客户是大企业\n##24 A quarrel in the team\nA:小刘和小赵又吵起来了，就为了方案里的一个数字。=Xiao Liu and Xiao Zhao are quarrelling again, all over one figure in the proposal.\nB:我去劝过，结果不但没用，他们反而吵得更厉害了。=I tried to calm them down, but it didn't help; on the contrary, they argued even more fiercely.\nA:其实两个人都是为了工作，只是沟通的方式有问题。=Actually both of them mean well for the work; it's just that the way they communicate is the problem.\nB:要不这样，明天开会时让他们各自说明理由，大家一起讨论。=How about this: at tomorrow's meeting let each explain his reasons, and we'll all discuss it together.\nA:好主意。有了矛盾就应该摆到桌面上来解决。=Good idea. When there's a conflict it should be put on the table and resolved.\nB:对，一个团队最怕的不是有不同意见，而是谁都不说。=Right. What a team should fear most is not different opinions, but nobody speaking up.\n?他们打算怎么解决这个问题？|开会时让两人说明理由|让其中一个人离开团队|请经理批评他们|不再管他们的事\n##25 Before the typhoon\nA:天气预报说台风明天下午到达本市，学校已经通知停课了。=The forecast says the typhoon will reach our city tomorrow afternoon; the school has already announced that classes are cancelled.\nB:那咱们得赶紧去超市买点儿吃的，万一停水停电就麻烦了。=Then we'd better hurry to the supermarket and buy some food; if the water and electricity were cut off, we'd be in trouble.\nA:我下班的时候去过了，面包和矿泉水早就卖光了。=I went after work; the bread and mineral water had sold out long before.\nB:那先把阳台上的东西搬进来吧，不然会被风吹下去伤到人。=Then let's bring in the things on the balcony first, or they'll be blown off and hurt someone.\nA:好。对了，手机和充电宝也要充满电。=OK. Oh, and the phones and power bank need to be fully charged too.\nB:你想得真周到。窗户我也检查一下，该关的都关好。=How thoughtful of you. I'll check the windows as well and shut everything that should be shut.\n?他们接下来最可能先做什么？|把阳台上的东西搬进屋|去超市买面包|去学校接孩子|开车出去看台风\n##26 Trees at the edge of the desert\nA:这次去西北旅行，给我印象最深的是沙漠边上的那片树林。=On this trip to the north-west, what impressed me most was the stretch of forest on the edge of the desert.\nB:沙漠边上还能种树？那儿不是极其缺水吗？=They can plant trees on the edge of a desert? Isn't water extremely scarce there?\nA:当地人种的是一种特别的树，根很深，用很少的水就能活。=The locals plant a special kind of tree with very deep roots that survives on very little water.\nB:他们花这么大力气种树，为的是什么？=What do they go to so much trouble planting trees for?\nA:为的是挡住风沙，保护后面的农田和村子。=To hold back the wind and sand and protect the farmland and villages behind.\nB:真了不起。看来保护环境靠的是一代又一代人的坚持。=Remarkable. It seems protecting the environment depends on the persistence of generation after generation.\n?当地人种树的目的是什么？|挡住风沙，保护农田 ticise the book for its slow pace, though; hardly anything happens in the first hundred pages.\nA:我倒觉得慢一点儿才有味道，就像喝茶，得慢慢品。=I rather think a slower pace gives it flavour. It's like drinking tea: you have to savour it slowly.\nB:那周六讨论的时候，咱们俩可以好好交流一下。=Then on Saturday at the discussion the two of us can have a good exchange of views.\n?女的喜欢这本小说的什么？|结尾|很快的节奏|前一百页|封面设计\n##38 A photo exhibition\nA:这个老北京摄影展你觉得怎么样？=What do you think of this photo exhibition on old Beijing?\nB:太有意思了。我看着看着，仿佛回到了小时候住的胡同。=Fascinating. As I looked, I felt as if I were back in the hutong where I lived as a child.\nA:这些照片都是同一位摄影师拍的吗？=Were all these photos taken by the same photographer?\nB:对，他花了四十年时间，记录了同一条胡同的变化。=Yes. He spent forty years recording the changes in one single hutong.\nA:四十年！你看这两张，同一个地方，以前是小卖部，现在成了咖啡馆。=Forty years! Look at these two: the same spot, once a corner shop, now a café.\nB:所以说，照片保存的不只是画面，更是一个时代的记忆。=That's why they say photos preserve not just images but the memory of an era.\n?关于这位摄影师，可以知道什么？|拍了同一条胡同四十年|小时候住在咖啡馆旁边|只拍黑白照片|现在已经不拍照了\n##39 Training for a marathon\nA:听说你报名参加下个月的马拉松了？你以前不是最讨厌跑步吗？=I hear you've signed up for next month's marathon? Didn't you use to hate running?\nB:人是会变的。去年体检，医生说我再不运动身体就要出问题了。=People change. At last year's check-up, the doctor said that if I didn't start exercising my health would be in trouble.\nA:所以你说跑就跑了？=So you just started running, just like that?\nB:刚开始跑一公里都累得不行，现在每个周末能跑二十公里。=At first even one kilometre wore me out; now I can run twenty every weekend.\nA:真佩服你。不过别没日没夜地练，受伤就不值得了。=I really admire you. But don't train day and night; it's not worth getting injured.\nB:放心，我有教练指导，每周休息两天。=Don't worry, I have a coach guiding me and I rest two days a week.\n?男的为什么开始跑步？|医生提醒他要运动|朋友约他一起跑|想减肥|公司组织比赛\n##40 A film festival\nA:昨天电影节的开幕式你去了吗？=Did you go to the film festival's opening ceremony yesterday?\nB:去了。现场热闹极了，观众拍照的拍照，要签名的要签名。=I did. It was incredibly lively: some of the audience were taking photos, others asking for autographs.\nA:听说今年有一部根据电子游戏改编的电影，评价 =Teacher, what does the idiom 画蛇添足 mean?\nB:它来自一个古代故事：几个人比赛画蛇，谁先画完谁喝酒。=It comes from an ancient story: several people held a contest to draw a snake, and whoever finished first would drink the wine.\nA:然后呢？=And then?\nB:有个人最先画完，他看别人还没画好，心想闲着也是闲着，就给蛇加上了脚。=One man finished first. Seeing the others weren't done, he thought he might as well do something, so he added feet to his snake.\nA:蛇本来没有脚啊！=But snakes don't have feet!\nB:对，所以他反而输了。这个成语比喻做了多余的事，不但没好处，反而把事情弄坏。=Exactly, so he lost instead. The idiom describes doing something unnecessary that brings no benefit and actually spoils things.\n?那个人为什么输了比赛？|给蛇画上了脚|画得太慢了|没有画完|喝了别人的酒\n##44 Dragon Boat Festival\nA:你尝尝，这是我第一次自己包的粽子。=Have a taste. These are the first zongzi I've ever wrapped myself.\nB:味道不错啊！真有你的，连这个都会做。=They taste good! You're really something; you can even make these.\nA:是跟房东奶奶学的。她说端午节吃粽子，是为了纪念古代的诗人屈原。=I learned from my landlady. She says we eat zongzi at the Dragon Boat Festival to commemorate the ancient poet Qu Yuan.\nB:对，除了吃粽子，很多地方还要赛龙舟。下午河边就有比赛，一起去看吧。=Yes. Besides eating zongzi, many places hold dragon boat races too. There's a race by the river this afternoon; let's go and watch.\nA:那咱们快走吧，去晚了就没位置了。=Then let's go quickly; if we're late there'll be no room.\nB:急什么急，三点才开始，把粽子吃完再走也来得及。=What's the hurry? It doesn't start until three; there's time to finish the zongzi first.\n?他们下午打算做什么？|去河边看龙舟比赛|去房东家学包粽子|去商店买粽子|去参加诗歌比赛\n##45 Double Ninth Festival\nA:后天是重阳节，公司给每位员工发了两张公园的免费门票。=The day after tomorrow is the Double Ninth Festival; the company has given every employee two free park tickets.\nB:重阳节有什么特别的习俗吗？=Are there any special customs for the Double Ninth?\nA:传统上要登高、看菊花，现在也是“老人节”，提倡大家多陪陪长辈。=Traditionally people climb hills and admire chrysanthemums. It's now also Seniors' Day, when everyone is encouraged to spend more time with their elders.\nB:那你正好带父母去公园走走。=Then it's the perfect chance to take your parents for a walk in the park.\nA:我也是这么想的，票不用白不用。只是那个公园有点儿远，怕他们累。=That's what I thought too; it would be a waste not to use the tickets. It's just that the park is a bit far, and I'm afraid they'll get tired.\nB:什么远不远的，老人最在乎的是有人陪。你开车慢一点儿就行了。=Never mind how far it is. What old people care about most is having company. Just drive slowly.\n?男的认为老人最在乎什么？|有人陪伴|公园的风景|门票的价钱|路程的远近\n##46 A calligraphy lesson\nA:老师，我写的这两行字怎么样？=Teacher, how are these two lines I've written?\nB:比上周有进步。不过你看这个“永”字，最后一笔太急了。=Better than last week. But look at this character 永: the last stroke was too rushed.\nA:我总是控制不好毛笔，写着写着手就开始抖。=I can never control the brush properly; as I write, my hand starts to shake.\nB:练书法急不得。你先深呼吸，把心静下来，再下笔。=Calligraphy can't be rushed. Take a deep breath first, calm your mind, and then put brush to paper.\nA:怪不得人们说练书法能让人变得有耐心。=No wonder people say practising calligraphy makes you patient.\nB:是啊，古人说“字如其人”，从一个人的字里能看出他的性格。=Yes. The ancients said \"the writing is like the person\": you can see someone's character in their handwriting.\n?老师认为女的的字有什么问题？|最后一笔写得太急|字写得太小|没有进步|用的毛笔不好\n##47 On the Great Wall\nA:导游，长城真的是秦始皇修建的吗？=Guide, was the Great Wall really built by the First Emperor of Qin?\nB:不完全对。早在秦朝以前，各个国家就修了自己的城墙，秦始皇把它们连接了起来。=Not entirely. Long before the Qin dynasty, the various states had built their own walls; the First Emperor linked them together.\nA:那我们现在看到的这一段呢？=And what about the section we're looking at now?\nB:这一段是明朝修建的，由城墙、城楼和烽火台组成，至今已有五百多年。=This section was built in the Ming dynasty. It's made up of walls, gate towers and beacon towers, and is over five hundred years old.\nA:古代没有机器，这么多石头是怎么运上山的？=There were no machines in ancient times. How did they get so many stones up the mountain?\nB:主要靠人背，也用羊和驴来运。所以说，长城是无数普通人用汗水建成的。=Mainly on people's backs, and goats and donkeys were used too. That's why they say the Great Wall was built with the sweat of countless ordinary people.\n?关于他们参观的这段长城，可以知道什么？|是明朝修建的|是秦始皇修建的|有两千多年的历史|主要是用机器建成的\n##48 Seeing a doctor of Chinese medicine\nA:我最近老是没精神，想去看看中医，可又不知道有没有效果。=I've been low on energy lately and I'd like to see a doctor of Chinese medi
