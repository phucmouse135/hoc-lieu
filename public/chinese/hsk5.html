n?这个故事想说明什么？|怀疑会影响人对事情的判断|邻居之间应该互相帮助|做事不能太粗心|孩子不应该说谎\n##\n你有没有发现，坐火车的时候，窗外近处的树很快就过去了，远处的山却好像走得很慢？其实，这是眼睛和大脑共同造成的错觉。物体离我们越近，它在我们眼睛里移动的角度就越大，大脑便认为它的速度很快；相反，远处的物体移动的角度很小，看起来就慢得多。同样的道理，飞机在高空飞行时速度极快，可是我们在地面上看，却觉得它在天上慢慢地移动。\n?这段话主要解释了什么现象？|近处和远处的物体看起来速度不同|火车为什么比汽车快|飞机为什么能飞得很高|人的眼睛为什么会累\n?为什么近处的树看起来移动得快？|它在眼睛里移动的角度大|它本身在快速移动|火车正在加速|窗户的玻璃有问题\n?说话人举飞机的例子是为了说明什么？|远处的物体看起来移动得慢|飞机的速度并不快|坐飞机比坐火车安全|在地面上看不清飞机\n##\n各位居民请注意：为了改善小区的环境，物业将从本周六开始对地下车库进行维修，预计需要十天。维修期间，车库暂时关闭，请各位车主在周五晚上十点以前把车开出来，停到小区东门外的临时停车场。临时停车场免费使用，并有保安二十四小时值班。给大家带来的不便，请多多理解。如有疑问，请拨打物业服务电话。\n?这是一个什么通知？|车库维修的通知|停水停电的通知|小区活动的通知|物业费涨价的通知\n?车主应该在什么时候以前把车开出来？|周五晚上十点|周六上午十点|周日晚上|十天以后\n?关于临时停车场，可以知道什么？|可以免费使用|在小区的西门外|没有人值班|只能停十辆车\n##\n现在不少年轻人喜欢“断舍离”，也就是把家里用不着的东西送人、卖掉或者扔掉，只留下真正需要的。支持的人说，东西少了，房间变得整齐，心情也跟着轻松了，而且买东西的时候会更加谨慎。不过，也有人提出了不同的看法：有些人刚扔完旧的，马上又买新的，结果反而造成了更大的浪费。看来，重要的不是扔掉多少东西，而是弄清楚自己到底需要什么。\n?“断舍离”指的是什么？|处理掉不需要的东西|买更多的新东西|把房间重新装修|把东西都存起来\n?支持的人认为这样做有什么好处？|房间整齐，心情轻松|可以挣很多钱|能认识新朋友|不用再打扫房间\n?说话人的观点是什么？|关键是清楚自己需要什么|东西越少越好|旧东西都应该扔掉|年轻人不应该买东西\n[R1.2]\n一项调查显示，超过六成的大学生有“拖延”的习惯，也就是总把该做的事情往后推。心理学家认为，拖延的原因往往不是懒，而是害怕失败：由于担心做不好，【便|却|才|仍】迟迟不愿开始。要改变这种习惯，可以试着把一个大任务分成几个小【步骤|概念|范围|趋势】，每完成一步就给自己一点儿奖励。【一旦|尽管|哪怕|以及】开始行动，你就会发现事情并没有想象的那么难。\n在中国，茶不仅是一种饮料，更是一种文化。客人来了，主人首先要做的就是泡一杯热茶，以【表示|表现|表明|表演】对客人的尊重。倒茶的时候不能倒得太满，一般七分满就可以了，这样客人端杯子时才不会烫手。喝茶讲究慢，要一小口一小口地【品|吞|咬|吹】，如果一口气喝完，【反而|从而|因而|以及】会被认为不懂礼貌。\n从前有个农民，他养了一匹马。有一天，马跑丢了，邻居们都来安慰他，他却说：“这不一定是坏事。”过了几个月，那匹马【居然|始终|尽量|亲自】带着另一匹好马回来了。邻居们又来祝贺，他却说：“这也不一定是好事。”【果然|毕竟|反正|简直】，他的儿子骑新马的时候从马背上摔了下来，把腿摔断了。不久，国家发生了战争，年轻人都被派去打仗，很多人再也没有回来，而他的儿子由于腿受了伤，【留在了家里|也去了战场|买了一匹新马|搬到了别的地方】。这个故事告诉我们，好事和坏事在一定的条件下是可以互相【转变|代替|交流|配合】的。\n[R2.2]\n##\n很久以前，人们把字刻在骨头或者竹片上，既不方便书写，也不方便携带。\n到了西汉时期，中国已经出现了最早的纸，但是这种纸很粗糙，不适合写字。\n东汉的蔡伦总结了前人的经验，改用树皮、破布等便宜的材料，造出了又轻又薄的纸。\n这种纸质量好、成本低，很快就在全国推广开来。\n后来，造纸技术又陆续传到了亚洲其他国家和欧洲，对世界文化的发展产生了巨大的影响。\n##\n每到年底，很多人都会给自己制订一份新年计划，比如每天跑步、每月读两本书。\n然而调查发现，这些计划中有八成坚持不到二月就被放弃了。\n专家分析，主要原因是目标定得太高、太多，一旦有几天没完成，人就容易失去信心。\n因此，他们建议一次只定一个目标，并且从最容易做到的小事开始。\n等这件小事变成了习惯，再增加新的内容，成功的可能性就大得多了。\n[R3.2]\n##\n最近，上海、成都等城市的“夜校”突然受到了年轻人的欢迎。这些夜校一般在工作日晚上七点到九点上课，内容包括书法、摄影、做蛋糕、弹吉他等几十种，一个学期十二次课，学费只要五百元左右。由于价格便宜、课程有趣，很多热门课程一开放报名，几秒钟之内就报满了。一位在银行工作的学员说，以前下班后只会躺在沙发上看手机，越看越累；现在每周两个晚上去上课，不但学到了新技能，还认识了一群有共同爱好的朋友，整个人都变得有精神了。有专家认为，夜校的流行反映了年轻人生活观念的变化：他们不再只关心工作和收入，也开始重视精神上的满足。\n?关于夜校的课程，下列哪项正确？|种类多，学费便宜|只教和工作有关的技能|都在周末上课|一个学期只有两次课\n?那位银行职员上夜校以后有什么变化？|变得更有精神了|工作更忙了|收入增加了|不再用手机了\n?专家认为夜校的流行说明了什么？|年轻人开始重视精神生活|年轻人的收入提高了|年轻人对工作不满意|学校的数量不够\n##\n小林在一家公司做了三年销售，成绩一直是部门里最差的。他很努力，每天打一百多个电话，可是客户总是没听几句就挂了。有一天，他去拜访一位老客户，对方正忙着搬办公室，没时间理他。小林没有离开，而是脱下西装，帮着搬了一下午的箱子。临走时，客户问他：“你今天不是来推销的吗？怎么一句产品都没提？”小林笑着说：“您今天需要的不是产品，是有人帮忙。”一个星期以后，那位客户不仅自己签了一份大合同，还把小林介绍给了好几位朋友。从那以后，小林每次见客户以前，都先问自己一个问题：对方现在最需要的是什么？\n?小林以前的销售成绩怎么样？|在部门里最差|一直是第一名|有时好有时坏|比同事稍好一点儿\n?那天小林在客户那儿做了什么？|帮客户搬东西|介绍新产品|签了一份合同|等了一下午\n?这个故事主要想告诉我们什么？|要先了解别人真正的需要|打电话是最好的销售方法|销售工作很辛苦|搬家时应该请人帮忙\n##\n每年秋天，成千上万只候鸟从北方飞往南方过冬，有的要连续飞行几千公里。它们是怎样找到方向的呢？科学家经过多年研究发现，候鸟至少有三种判断方向的办法。白天，它们根据太阳的位置判断方向；晚上，它们依靠星星；遇到阴天，它们还能感受到地球的磁场，就像身体里装有一个指南针。然而，城市的发展给候鸟带来了新的麻烦。夜间明亮的灯光会让它们分不清方向，不少鸟因此撞上高楼。为了保护候鸟，一些城市在它们经过的季节，会要求高层建筑在深夜关闭不必要的灯光。\n?根据这段话，候鸟在阴天依靠什么判断方向？|地球的磁场|太阳的位置|星星|风的方向\n?城市给候鸟带来了什么麻烦？|灯光让它们分不清方向|食物越来越少|空气受到了污染|气温越来越高\n?一些城市采取了什么保护措施？|深夜关闭不必要的灯光|禁止修建高楼|为候鸟提供食物|建立自然保护区\n##\n京剧是中国最有代表性的传统戏剧，至今已有两百多年的历史。第一次看京剧的人，往往会被演员脸上五颜六色的图案吸引。这些图案叫作“脸谱”，不同的颜色代表着人物不同的性格：红色表示忠诚、勇敢，黑色表示正直、严肃，白色则常常用来表现狡猾的坏人。因此，有经验的观众只要看一眼演员的脸，就能大概知道这个角色是好人还是坏人。除了脸谱，京剧的动作也很有特点。舞台上往往没有真实的门、马或者船，演员仅仅通过几个简单的动作，就能让观众“看到”开门、骑马、划船的情景，给人留下了很大的想象空间。\n?京剧脸谱的颜色代表什么？|人物的性格|演员的年龄|故事发生的季节|演员的水平\n?根据这段话，白色的脸谱常用来表现什么样的人？|狡猾的坏人|勇敢的英雄|严肃的官员|善良的老人\n?关于京剧的表演，可以知道什么？|用简单的动作表现各种情景|舞台上有真实的马和船|演员一般不化妆|观众很难看懂人物的好坏\n##\n十年前，出门忘了带钱包是一件很麻烦的事；如今在中国，很多人已经记不清上一次用现金是什么时候了。无论是在商场购物、在路边买水果，还是坐公共汽车，只要用手机扫一下二维码，就能完成付款。移动支付不仅方便了消费者，也降低了商家的经营成本，他们不必再准备大量的零钱，也不用担心收到假钱。不过，这种变化也给一部分人带来了困难。一些老年人不会使用智能手机，外国游客刚到中国时也常常不知道怎么付款。针对这些问题，有关部门要求商家不得拒绝收现金，同时简化了外国人使用移动支付的手续。\n?这段话主要谈的是什么？|移动支付带来的变化和问题|怎样保护好自己的钱包|老年人怎样学习用手机|外国游客在中国的生活\n?移动支付给商家带来了什么好处？|降低了经营成本|增加了顾客的数量|提高了商品的价格|减少了工作人员\n?有关部门采取了什么措施？|要求商家不能拒绝现金|禁止使用现金|为老年人免费提供手机|不允许外国游客用手机付款\n","rd":"##L2 a\n近年来，越来越多的餐厅开始提供“半份菜”。所谓半份菜，就是把一份菜的量减少一半，价格也相应降低。一家餐厅的经理介绍，以前很多客人点菜时怕不够吃，结果常常剩下一大半，造成了严重的浪费。自从推出半份菜以来，客人可以用同样的钱尝到更多种类的菜，餐厅每天倒掉的食物也减少了三分之一。不过，也有人担心半份菜会增加厨房的工作量。对此，这位经理表示，只要安排合理，成本并不会明显上升，而节约带来的好处却是长期的。\n?餐厅为什么推出“半份菜”？|为了减少食物浪费|为了提高菜的价格|为了减少厨房的工作|为了吸引外国客人\n?关于半份菜，下列哪项正确？|客人能尝到更多种类的菜|价格和一份菜一样|使餐厅的成本大大增加|客人普遍不欢迎\n##L5 c\n很多人认为，感冒了就应该马上吃药，其实这种看法并不完全正确。普通感冒【通常|曾经|即将|连忙】一个星期左右就能自己好，药物只能【缓解|避免|导致|促进】头疼、咳嗽等症状，并不能缩短生病的时间。医生建议，感冒期间最重要的是多喝水、多休息，保证充足的睡眠。【一旦|尽量|始终|毕竟】出现高烧不退或者呼吸困难等情况，就要立刻去医院检查。\n##L8 a\n上海的一个小区最近出现了一个“共享工具箱”。箱子里放着剪刀、梯子等三十多种日常工具，居民只要用手机扫一下二维码，就可以免费借用，用完以后放回原处。这个主意是一位退休工程师提出来的。他发现，很多家庭一年只用一两次工具，专门去买既浪费钱又占地方。工具箱刚放出来的时候，有人担心东西会丢，可是三个月过去了，工具不但一件没少，反而多了十几件，都是居民从自己家里拿来的。物业的工作人员说，一个小小的工具箱，让邻居之间的关系比以前亲近多了。\n?关于“共享工具箱”，可以知道什么？|居民可以免费借用工具|是物业公司提出来的|借用时需要交押金|只有退休老人可以使用\n?三个月以后，工具箱里的工具怎么样了？|比原来多了|丢了十几件|大部分坏了|全部换成了新的\n##L11 o\n小张是一名普通的公司职员，三年前，他迷上了爬山。\n刚开始，他只是为了减肥，每个周末去爬城市附近的小山。\n后来，他渐渐发现，站在山顶看到的风景，能让一个星期的工作压力完全消失。\n于是，他开始挑战更高的山，还加入了一个户外运动俱乐部，认识了许多有同样爱好的朋友。\n如今，爬山已经不只是他的爱好，更成了他生活中不可缺少的一部分。\n##L14 a\n一所大学的图书馆最近公布了去年的借书数据，结果让很多人感到意外：借书最多的不是文学专业的学生，而是计算机专业的。图书馆的老师分析说，这可能和学校两年前开始实行的一项制度有关。按照这项制度，理工科的学生毕业前必须读完二十本专业以外的书，并且写出读书报告。一开始，不少学生抱怨这是浪费时间，可是慢慢地，他们发现阅读历史和哲学方面的书，能帮助自己从不同的角度思考问题。一位学生说：“写程序需要逻辑，而读这些书让我明白了为什么要写这个程序。”\n?借书数据为什么让人感到意外？|计算机专业的学生借书最多|去年借书的人数减少了|文学专业的学生不借书|历史书没有人借\n?那位学生认为读专业以外的书有什么好处？|能从不同的角度思考问题|能更快地写完程序|能提高考试成绩|能少写读书报告\n##L17 c\n“学习金字塔”理论认为，不同的学习方法，效果有很大的【差别|范围|程度|比例】。只听老师讲课，两个星期以后能记住的内容只有百分之五；【假如|从而|毕竟|以及】学生能够亲自动手实践，就可以记住百分之七十五；而效果最好的方法，是把学到的知识讲给别人听。【可见|然而|反而|哪怕】，想真正掌握一门知识，光听是远远不够的。\n##L20 a\n很多公司规定员工必须在办公室工作，但最近的一项调查显示，每周在家工作两天的员工，工作效率平均提高了百分之十三。研究人员认为，原因主要有两个：一是节省了上下班路上的时间，二是在家更容易集中精力，不会被同事打断。不过，在家工作也带来了新的问题。调查中有三分之一的人表示，长期一个人工作让他们感到孤独，与团队的沟通也变少了。因此，专家建议企业采取灵活的方式，把在家工作和到办公室工作结合起来，这样既能保证效率，又不影响团队合作。\n?在家工作效率提高的原因之一是什么？|更容易集中精力|工资增加了|工作时间变短了|不用参加会议\n?专家对企业有什么建议？|把两种工作方式结合起来|让员工全部在家工作|取消在家工作的制度|减少团队合作\n##L23 o\n大学毕业那年，李娜放弃了银行的工作，决定回家乡开一家书店。\n亲戚朋友都劝她，现在看书的人越来越少，书店根本挣不到钱。\n但她没有改变主意，而是把书店设计成了一个可以看书、喝咖啡、听讲座的地方。\n没想到，这种新的经营方式吸引了大量年轻人，书店的生意一天比一天好。\n现在，她已经在三个城市开了分店，还打算明年把书店开到大学校园里去。\n##L26 a\n在中国西北的一些地区，每年的降水量还不到二百毫米，而蒸发量却是它的十倍以上。为了解决用水问题，当地人很早以前就发明了一种特别的工程——坎儿井。人们在地下挖出一条条长长的通道，把高山上融化的雪水引到村子和农田里。由于水是在地下流动的，不会被太阳晒干，也不容易被风沙污染。据统计，这样的地下通道总长度超过五千公里，被称为“地下长城”。直到今天，仍然有不少村子依靠它来生活和种植葡萄。\n?坎儿井的水主要来自哪里？|高山上融化的雪|当地的降雨|附近的大河|很深的地下\n?水在地下流动的好处是什么？|不容易被晒干和污染|水流的速度更快|可以用来发电|修建起来比较容易\n##L29 c\n如今，扫地机器人已经走进了许多家庭。它的身上【装有|属于|充满|在于】多个传感器，能够自动发现并绕开桌子、椅子等障碍。工作的时候，它会【沿着|凭着|朝|替】墙边一点儿一点儿地打扫，不放过任何一个角落；电量不足时，还会自己回到充电的地方。虽然目前它还不能完全【代替|称赞|承认|促使】人工打扫，但的确为人们节省了不少时间。\n##L32 a\n每年秋天在上海举办的进口博览会，是世界上第一个以进口为主题的大型展览会。在这里，人们可以看到来自一百多个国家和地区的产品，从非洲的咖啡、欧洲的汽车到最新的医疗设备，种类十分丰富。对外国企业来说，博览会是进入中国市场的一个重要机会；对普通消费者来说，则意味着不出国门就能买到世界各地的商品。一位连续参加了五届博览会的商人说，他第一次来的时候只带了一种产品，展位只有九平方米，而今年他的展位已经扩大到了一百平方米。\n?关于进口博览会，下列哪项正确？|每年秋天在上海举办|主要展出中国的产品|只对企业开放|已经举办了一百届\n?那位商人的例子说明了什么？|他的生意越做越大|参加博览会的费用很高|他的产品种类减少了|他只参加过一次\n##L35 o\n过去，人们买东西时最关心的是价格，越便宜越好。\n随着收入的提高，消费者开始更加重视商品的质量和品牌。\n而最近几年，又出现了一种新的变化：年轻人不再只追求名牌，而是更愿意为“体验”花钱。\n比如，他们宁可少买几件衣服，也要去听一场音乐会，或者来一次说走就走的旅行。\n由此可见，消费观念的变化，其实反映了人们对幸福的不同理解。\n##L38 a\n在很多人的印象中，博物馆是一个严肃、安静的地方。然而最近几年，中国的许多博物馆却在年轻人中“火”了起来。他们把文物上的图案印在笔记本、雨伞和手机壳上，还推出了以古代人物为主角的动画和游戏。有的博物馆一年光是文化产品的收入就超过了十亿元。有人批评说，这样做太商业化了，会让文物失去原来的意义。但博物馆的工作人员认为，文物只有被人们了解和喜爱，才能真正地“活”下来；如果一件文物永远只是放在玻璃柜里，那它离普通人的生活就太远了。\n?博物馆为什么在年轻人中受欢迎？|推出了很多有趣的文化产品|门票比以前便宜了|展出了更多的文物|取消了参观的限制\n?博物馆的工作人员是什么观点？|应该让文物走进人们的生活|文物只应该放在柜子里|文化产品太商业化了|年轻人不了解文物\n##L41 c\n许多人以为，运动的时间越长，对身体越好。其实，运动【过度|充分|适当|不足】同样会伤害身体。专家指出，普通人每周运动三到五次、每次三十分钟到一个小时比较合适。运动以后如果第二天还觉得很累，就说明运动量太大了，应该【及时|曾经|居然|仿佛】调整。另外，运动前的准备活动也马虎【不得|不了|不起|不住】，否则很容易受伤。\n##L44 a\n端午节是中国最古老的传统节日之一，在每年农历的五月初五。关于它的来历，流传最广的说法是为了纪念诗人屈原。据说屈原去世以后，人们划着船到江上去找他，并把米饭包起来扔进水里喂鱼，希望鱼不要伤害他的身体，后来就渐渐形成了赛龙舟和吃粽子的习俗。有意思的是，各地粽子的味道差别很大：北方人喜欢吃甜的，里面包着红枣；南方人则更爱吃咸的，里面有肉和鸡蛋。每到端午节，“甜粽子好吃还是咸粽子好吃”都会成为网上的热门话题。\n?根据这段话，赛龙舟的习俗是怎么来的？|人们划船去江上寻找屈原|古代的一种体育比赛|为了庆祝粮食丰收|渔民为了打更多的鱼\n?关于粽子，可以知道什么？|南方和北方的口味不同|各地的味道都一样|北方人喜欢吃咸的|南方人不吃粽子\n##L47 o\n两千多年前，一位名叫张骞的人受汉朝皇帝的派遣，从长安出发前往西域。\n一路上，他克服了无数困难，前后花了十三年时间，才回到长安。\n他带回了有关西域各国的大量信息，使汉朝第一次了解了外面的世界。\n此后，越来越多的商人沿着他走过的路线，把中国的丝绸和茶叶运往西方。\n这条连接东西方的贸易通道，就是后来闻名世界的“丝绸之路”。\n","wr":"#P A wallet in the park\n🚶‍♂️👛|A young man walking in a park drops his wallet without noticing.\n👧👀|A girl behind him sees the wallet on the ground and picks it up.\n🏃‍♀️📢|She runs after him, calling out.\n🤝😊|He gets the wallet back and thanks her warmly.\n+钱包、掉、发现、捡、追、感谢\n=星期天下午，小李在公园里散步。他一边走一边看手机，钱包从口袋里掉了出来，可是他一点儿也没发现。走在后面的一个小女孩看见了，连忙把钱包捡了起来。她一边追一边喊：“叔叔，您的钱包掉了！”小李这才发现钱包不见了。他接过钱包，感动地对小女孩说：“太感谢你了！”这件事让小李明白，走路的时候不能只顾着看手机。\n#P Late for the interview\n⏰😴|A man oversleeps; the alarm clock shows 8:30.\n🏃‍♂️🚌💨|He runs to the stop, but the bus is just leaving.\n🚕😰|He takes a taxi, looking anxiously at his watch.\n🏢😅|He reaches the company just in time for his interview.\n+闹钟、急忙、赶、出租车、面试、幸亏\n=今天上午九点，小王有一个重要的面试。可是他昨晚熬夜准备资料，早上没听见闹钟，醒来时已经八点半了。他急忙穿上衣服跑到车站，公共汽车却刚好开走了。小王急得不得了，只好叫了一辆出租车。一路上，他不停地看手表，心里非常紧张。幸亏路上没有堵车，他到公司的时候，刚好九点。通过这件事，小王决定以后再也不熬夜了。\n#P Cleaning up the beach\n🏖️🥤🗑️|A family arrives at a beach and finds rubbish everywhere.\n👦🤔|The little boy frowns and asks why nobody cleans it up.\n🧤🛍️|The parents and the boy start picking up the rubbish together.\n👨‍👩‍👦✨|Other visitors join in, and the beach is clean again.\n+海边、垃圾、捡、纷纷、干净、保护环境\n=暑假的一天，明明和爸爸妈妈去海边玩儿。到了以后，他们发现沙滩上到处都是垃圾，有饮料瓶，还有塑料袋。明明不高兴地问：“这么美的地方，为什么没有人打扫呢？”爸爸想了想说：“我们自己来吧。”于是，一家人戴上手套，开始捡垃圾。其他游客看见了，也纷纷过来帮忙。没过多久，沙滩又变得干干净净了。明明明白了，保护环境要从自己做起。\n#P Grandpa's first video call\n👴📱❓|A grandfather looks at his new smartphone, confused.\n👧👉📱|His granddaughter patiently shows him how to use it.\n👴✍️📒|He writes each step down in a notebook and practises.\n👴📹😊|He makes a video call to his son's family abroad, smiling.\n+智能手机、耐心、步骤、记、视频、学会\n=爷爷的儿子一家住在国外，爷爷很想念他们。上个月，孙女给爷爷买了一部智能手机。可是爷爷看着手机，不知道怎么用。孙女耐心地一步一步教他，爷爷怕忘了，就把每个步骤都记在本子上，每天练习。一个星期以后，爷爷终于学会了视频通话。当他在手机里看到儿子一家的笑脸时，高兴得像个孩子似的。爷爷说，只要愿意学，多大年纪都不晚。\n#P A birthday dinner\n📅🎂💡|A boy sees on the calendar that it is his mother's birthday and has an idea.\n👦🍳📖|He cooks in the kitchen, following a recipe.\n🔥🍲😱|The dish burns and the kitchen fills with smoke.\n👩🤗👦|His mother comes home, laughs and hugs him.\n+生日、惊喜、亲自、做菜、不但没…反而…、感动\n=今天是妈妈的生日，小明想给妈妈一个惊喜，决定亲自做一顿饭。放学以后，他连忙赶回家，一边看菜谱一边做菜。可是他是第一次做饭，一不小心，锅里的菜烧糊了，厨房里到处是烟。小明急得快哭了。这时候，妈妈下班回来了。她看到厨房里的情况，不但没有生气，反而笑着抱住了小明，说：“这是我收到的最好的生日礼物。”\n#P The phone in the taxi\n🚕📱|A woman gets out of a taxi, leaving her phone on the seat.\n😨🔍👜|At home she searches her bag and cannot find the phone.\n👨‍✈️📞|The driver finds the phone and answers when she calls it.\n🚕🙏😊|He drives back to return it, and she thanks him.\n+出租车、座位、翻来翻去、拨打、司机、亲自、感动\n=昨天晚上，王小姐下班后坐出租车回家。下车的时候，她不小心把手机忘在了座位上。回到家，她把包翻来翻去，怎么也找不到手机，急得不得了。她连忙用家里的电话拨打自己的号码。没想到，电话很快就通了，原来是司机发现了手机。半个小时以后，司机亲自把手机送了回来。王小姐非常感动，想给他一些钱表示感谢，可司机笑着说：“用不着，这是我应该做的。”\n#E A trip to remember\n?请以“一次难忘的旅行”为题，写一篇短文，谈谈你的经历和感受。\n+计划、迷路、渐渐、幸亏、不但…还…、仿佛、让我明白\n=去年暑假，我和朋友去云南旅行，那是我最难忘的一次经历。出发以前，我们做了详细的计划，可是到了当地才发现，很多事情和想象的完全不同。第三天，我们在山里迷路了，手机也没有信号，天渐渐暗了下来，我心里非常害怕。幸亏遇到了一位当地的老人，他不但给我们指了路，还亲自把我们送到了山下的村子，并且请我们在他家吃了晚饭。那天晚上，我们坐在院子里，一边喝茶一边听他讲当地的故事，仿佛回到了小时候。这次旅行让我明白，旅行中最美的风景往往不是山水，而是人与人之间的温暖。从那以后，每到一个新地方，我都愿意多和当地人交流。\n#E What failure teaches\n?很多人说“失败是成功之母”。请结合自己的经历，谈谈你对失败的看法。\n+曾经、由于、没有…就没有…、渐渐、哪怕…也…、总之\n=我认为，失败并不可怕，可怕的是失败以后不再尝试。上大学的时候，我曾经参加过一次演讲比赛。由于准备得不够充分，我一上台就紧张得说不出话来，结果连第一轮都没通过。当时我非常难过，甚至想以后再也不参加这种活动了。后来，一位老师对我说：“没有失败，就没有进步。”他建议我把演讲的过程录下来，找出自己的问题。我照他说的做了，每天对着镜子练习，渐渐地，我不再害怕面对观众了。第二年，我又报名参加了比赛，并且得了第二名。这次经历让我明白，失败其实是一位严格的老师，它告诉我们哪里做得还不够。总之，只要不放弃，哪怕失败了很多次，也总有成功的一天。\n#E Shopping online\n?现在越来越多的人喜欢在网上购物。请谈谈网上购物给你的生活带来了哪些变化，以及你的看法。\n+随着、无论…都…、不但…而且…、差别、从而、关键在于\n=随着科技的发展，网上购物已经成为我生活中的一部分。以前，买东西要专门去商场，既花时间又花力气；现在只要打开手机，无论是衣服、图书还是蔬菜，都能很快送到家门口。上个月我搬家，家具和电器全是在网上买的，不但价格便宜，而且可以比较不同商家的评价，非常方便。不过，网上购物也有不少问题。有一次，我买的鞋子和图片上的样子差别很大，退货又等了一个多星期。另外，由于付款太容易，我常常买回一些根本用不着的东西，从而造成了浪费。因此我认为，网上购物本身没有好坏，关键在于我们怎么使用它。买东西以前多想一想自己是否真的需要，才能既享受方便，又不乱花钱。\n#E A traditional festival\n?请介绍一个你了解的中国传统节日或你们国家的传统节日，并谈谈你的感受。\n+据说、象征、尽量、传说、格外、不只是…更是…\n=在中国的传统节日中，我最喜欢的是中秋节。中秋节在每年农历的八月十五，据说已经有一千多年的历史了。这一天的月亮又圆又亮，象征着一家人的团圆，所以无论离家多远，人们都会尽量赶回去和家人一起过节。去年中秋节，我的中国朋友邀请我去他家做客。晚饭以后，我们坐在阳台上，一边吃月饼一边看月亮，他的奶奶还给我讲了嫦娥的传说。虽然我听得不是很明白，可是那种温暖的气氛让我格外想念自己的家人。那天晚上，我给父母打了很长时间的电话。通过这次经历，我发现，不管在哪个国家，节日最重要的意义都是和亲人在一起。传统节日保存的不只是习俗，更是人们对家的感情。\n#E Phones: closer or lonelier?\n?有人说，手机让人与人之间的距离更近了；也有人说，手机让人们更孤独了。请谈谈你的看法。\n+一方面…另一方面…、的确、仿佛、过于、反而、总之\n=我认为，手机既拉近了人与人之间的距离，也可能让人变得更孤独，关键要看我们怎么用它。一方面，手机的确给交流带来了方便。我在国外留学，每个周末都和父母视频通话，他们能看到我住的房间，我也能看到家里的小狗，仿佛我们并没有分开。另一方面，过于依靠手机也会影响面对面的交流。上次同学聚会，大家好不容易见一次面，却各自低头看手机，说话的人反而很少，这让我觉得很可惜。从那以后，我给自己定了一个规定：和朋友吃饭的时候，把手机放进包里。这样做了一段时间，我发现自己和朋友聊得更多了，关系也更亲密了。总之，手机只是一种工具。只有合理地使用它，我们才能真正享受科技带来的好处。\n#E The person I admire most\n?请以“我最敬佩的一个人”为题，写一篇短文，介绍这个人并说明理由。\n+根本、不但没…反而…、替、渐渐、始终、不只是…更是…\n=我最敬佩的人是我的中学数学老师张老师。他个子不高，说话的声音也不大，可是全班同学都很尊敬他。我上中学的时候数学成绩很差，对这门课根本没有信心。有一次考试，我只得了四十分，心里难过极了。张老师不但没有批评我，反而每天放学后留下来，耐心地替我分析每一道错题。他常说：“学习急不得，一步一步来。”在他的帮助下，我的成绩渐渐提高了，更重要的是，我不再害怕困难了。后来我才知道，那段时间张老师的母亲正在住院，他每天辅导完我，还要赶到医院去照顾母亲。张老师让我明白，一个好老师教给学生的不只是知识，更是对待工作和生活的态度。现在我自己也成了一名老师，我始终把他当作自己的榜样。\n#R\n小王每天坐地铁上班。有一天，他在地铁上看到一位老人站着，就连忙把座位让给了他。老人下车的时候，把一把雨伞忘在了座位上。小王追下车，把伞还给了老人。结果他上班迟到了十分钟，可是他觉得很值得。\n#R\n研究人员发现，每天散步半个小时对身体有很多好处。散步不但可以帮助消化，还能缓解压力，改善睡眠。专家建议，最好在晚饭后半小时再出门，速度不用太快，关键是要每天坚持。\n#R\n小李大学毕业后，没有留在大城市，而是回到了农村老家。他利用网络直播，把家乡的水果卖到了全国各地。三年来，他不但自己挣了钱，还带动村里几十户人家增加了收入。\n#R\n很多人以为熊猫只吃竹子，其实它们偶尔也吃肉。熊猫每天要花十几个小时吃东西，因为竹子的营养很少。为了保护熊猫，中国建立了六十多个自然保护区，现在野生熊猫的数量已经超过了一千八百只。\n#S The birthday cake\n🎂🛒|A girl buys a cake for her friend's birthday.\n🚲💥🎂|On the way her bicycle hits a stone and the cake falls.\n👭😄🍰|Her friend laughs, and they eat the broken cake together.\n=今天是好朋友的生日，小美买了一个漂亮的蛋糕，骑着自行车去朋友家。没想到，路上自行车撞到了一块石头，蛋糕掉在地上，摔坏了。小美难过得快哭了。到了朋友家，朋友不但没有不高兴，反而笑着说：“样子不重要，味道一样好！”于是两个人开心地把蛋糕吃完了。\n#S Helping a tourist\n🧳🗺️❓|A foreign tourist with a suitcase looks at a map, lost.\n👨‍🎓👉|A student stops and explains the way.\n🚇👋|He walks the tourist to the metro station, and they wave goodbye.\n=一位外国游客拉着行李箱站在路边，他看着地图，好像迷路了。一个大学生看见了，主动走过去问他需要什么帮助。原来游客要去火车站。大学生怕他找不到，就亲自把他送到了地铁站，还告诉他在哪一站下车。游客非常感谢，两个人挥手告别。\n#Q\n?你认为年轻人应该先工作几年再创业，还是毕业后马上创业？为什么？\n+Give your view. Working first brings experience, savings and contacts; starting young means more energy and fewer burdens. Add one example, then sum up with 总之.\n#Q\n?随着科技的发展，很多工作可能被机器人代替。你怎么看待这个问题？\n+Which jobs go first (repetitive, dangerous). New jobs that appear. Why people must keep learning. Your own field as an example. A balanced conclusion.\n#Q\n?有人喜欢住在大城市，有人喜欢住在小城市或农村。你更喜欢哪一种？请说明理由。\n+State your choice. Compare opportunities, transport and culture with cost, pressure and environment. One personal experience. Conclusion.\n#Q\n?你觉得保护传统文化重要吗？年轻人可以做些什么？\n+Why it matters (identity, history). Concrete actions: learn a craft, share it online, take part in festivals. One example you know. Conclusion.\n"};

function l1(ln){const i=ln.indexOf('?'),p=ln.slice(i+1).split('|');return {t:ln.slice(0,i).split('/'),qs:[{q:p[0],opts:p.slice(1)}]}}

      const e={raw,opts,en:ln.slice(j+1),g:pt,L,fresh:c==='~',key:`g:${L}:${G[L].length-1}:${pt.x.length}`};pt.x.push(e);GEX[e.key]=e;continue}

    else if(c==='+')b.hint=ln.slice(1);else if(c==='=')b.model=ln.slice(1);else if(c==='?')b.prompt=ln.slice(1);
    else if(ln.includes('|')&&!/[\u4e00-\u9fff]/.test(ln.split('|')[0])){const p=ln.split('|');b.pan.push({e:p[0],n:p[1]})}
    else b.text+=(b.text?'\n':'')+ln}
})();

Object.values(WIDX).forEach(a=>a.sort((x,y)=>y.w.length-x.w.length));

 {title:'Exam practice',w:2,desc:'Full mock exams in the new 72-item format, writing workshops for the picture story and the 200-character essay, two speaking mocks, and review days built from your error notebook.'}];

function loadVoices(){try{const v=speechSynthesis.getVoices();VO=v.filter(x=>/^(zh[-_](CN|Hans)|cmn)/i.test(x.lang));if(!VO.length)VO=v.filter(x=>/^zh/i.test(x.lang)&&!/HK|yue/i.test(x.lang))}catch(e){}}
loadVoices();try{speechSynthesis.addEventListener('voiceschanged',loadVoices)}catch(e){}
function speak(segs,fix){
  try{speechSynthesis.cancel();const rate=fix||(P()&&P().rate)||1;
    segs.forEach(s=>{const u=new SpeechSynthesisUtterance(s.t.replace(/[\u0001“”]/g,''));u.lang='zh-CN';u.rate=rate;
      if(VO.length)u.voice=VO[s.v==='m'&&VO.length>1?1:0];u.pitch=s.v==='m'?.7:s.v==='f'?1.25:1;speechSynthesis.speak(u)});
  }catch(e){toast('This browser cannot read Chinese aloud.')}
}
const say=t=>speak([{t,v:'n'}]);
function stopAudio(){try{speechSynthesis.cancel()}catch(e){}}

/* ================= Building each exercise ================= */
function lessonBefore(n){while(n>=1&&D(n).type!=='lesson')n--;return n}
function reviewQs(n,cnt){
  const days=uniq([1,2,4,7,14,30].map(o=>lessonBefore(n-o)).filter(x=>x>=1));
  const wr=shuf(Object.keys(P().wrong)).slice(0,4).map(qFromKey).filter(Boolean);
  return wr.concat(balanced(merge(days),cnt-wr.length));
}
const freshOf=Ls=>Ls.flatMap(L=>(G[L]||[]).flatMap(p=>p.x.filter(e=>e.fresh)));
const pk=(a,i)=>a.length?a[i%a.length]:null;
function buildSec(n,sec){
  const d=D(n),it=items(n),L=d.L;let qs=[];
  if(sec==='k'){it.k.forEach(k=>qs.push(qHan(k,0),qHan(k,1),qHan(k,2)));qs=shuf(qs)}
  else if(sec==='v')qs=shuf(d.vocab).map(w=>qWord(w));
  else if(sec==='g')d.gram.forEach(p=>p.x.filter(e=>!e.fresh).forEach(e=>qs.push(qGram(e))));
  else if(sec==='r')qs=reviewQs(n,12);
  else if(sec==='c')qs=[qListen(L),...shuf(SENT.filter(s=>s.L===L)).slice(0,3).map(qDict),qCloze(L)];
  else if(sec==='d')qs=[qRead(d.read)];
  else if(sec==='s')qs=speakSet(d.no);
  else if(sec==='w'){const p=wPrompt(d);
    qs=p?[qWrite(p,d.w%2===1)]:d.no===1?[qWrite(pk(WR.P,0),1),qWrite(pk(WR.P,2),1)]:d.no===2?[qWrite(pk(WR.E,1),0),qWrite(pk(WR.E,3),0)]:[qWrite(pk(WR.P,3),1),qWrite(pk(WR.E,2),0)];
    qs=qs.filter(q=>q.w)}
  else if(d.type==='lesson')qs=balanced(it,12).concat(freshOf([L]).map(qGram),shuf(SENT.filter(s=>s.L===L)).slice(0,1).map(qDict));
  else if(d.type==='review'){
    const days=[];for(let i=n-6;i<n;i++)days.push(i);const Ls=days.map(x=>D(x).L);
    qs=balanced(merge(days),20).concat(reviewQs(n-6,4),shuf(freshOf(Ls)).slice(0,5).map(qGram),(EX.WL||[]).slice(d.w-1,d.w).map(b=>qHear(b,'Listening · exam style',1)),
      shuf(Ls).slice(0,1).map(x=>qListen(x,1)),shuf(SENT.filter(s=>Ls.includes(s.L))).slice(0,2).map(qDict),shuf(Ls.filter(x=>RD[x])).slice(0,1).map(x=>qRead(RD[x])));
  }else{
    const all=lessonDays(LAST),wr=d.type==='err'?shuf(Object.keys(P().wrong)).slice(0,20).map(qFromKey):[];
    qs=wr.concat(balanced(merge(shuf(all).slice(0,16)),d.type==='final'?24:12),shuf(freshOf(all.map(x=>D(x).L))).slice(0,6).map(qGram));
    if(d.type!=='rest')qs.push(...shuf(Object.keys(KW)).slice(0,2).map(x=>qListen(+x,1)),...shuf(SENT).slice(0,2).map(qDict),...shuf(Object.values(RD)).slice(0,1).map(b=>qRead(b)));
  }
  return qs.filter(Boolean);
}

/* ================= Mock exam ================= */
function buildExam(no){
  const g=(s,k)=>EX[s+'.'+k]||[],src=s=>no?g(s,no):g(s,1).map((x,i)=>g(s,i%NM+1)[i]||x);
  const tg=(qs,t)=>qs.filter(Boolean).map(q=>(q.tag=t,q)),k=no||1;
  const lis=[...tg(src('L1').map(b=>qHear(b,'',1)),'Listening · Part 1'),...tg(src('L2').map(b=>qHear(b,'',1)),'Listening · Part 2')];
  const rea=[...tg(src('R1').map(x=>qPass(x)),'Reading · Part 1 · gap fill'),...tg(src('R2').map(b=>qOrder(b)),'Reading · Part 2 · paragraph order'),...tg(src('R3').map(b=>qArt(b)),'Reading · Part 3 · comprehension')];
  const wri=[qWrite(pk(WR.P,3+k),1),qWrite(pk(WR.E,3+k),0)].filter(q=>q.w);
  return [{title:'Listening',min:25,qs:lis},{title:'Reading',min:35,qs:rea},{title:'Writing',min:40,qs:wri}].filter(p=>p.qs.length);
}
let EXS=null,EXR=null,QZ=null;
const exName=no=>no?'Mock exam '+no:'Remix exam';
function startExam(no,cb){EXS={no,parts:buildExam(no),i:0,done:[],cb};if(!EXS.parts.length){EXS=null;toast('No mock exam is available yet.');return}examIntro()}
function examIntro(){
  const e=EXS,p=e.parts[e.i];stopAudio();$('#quiz').classList.add('on');
  const n=p.qs.reduce((a,q)=>a+qpts(q),0);
  $('#quiz').innerHTML=`<div class="qwrap"><header class="qhead"><button class="x" data-act="qclose" aria-label="Leave">×</button><b>${exName(e.no)}</b><span>${e.i+1}/${e.parts.length}</span></header>
  <div class="result"><h2 style="justify-content:center">${p.title}</h2><p>${p.title==='Writing'?'2 tasks':n+' items'} in ${p.min} minutes. No answers are shown along the way, and the section is handed in automatically when time runs out.</p>
  ${p.title==='Listening'?'<p class="note" style="text-align:left">Turn your sound on. Each recording can be played once only, as in the exam, and the question is spoken after the recording, so read the four options first. The higher voice is the woman, the lower voice is the man.</p>':''}
  ${p.title==='Writing'?'<p class="note" style="text-align:left">Type in Chinese. Task 1 needs at least 100 characters, task 2 at least 200. Leave about 15 minutes for task 1 and 25 for task 2.</p>':''}
  <button class="btn" data-act="exgo">${e.i?'Start the next section':'Start the exam'}</button></div></div>`;
}
function examResult(){
  const e=EXS,sc=z=>{let g=0,m=0;z.qs.forEach((q,i)=>{g+=earned(q,z.res[i]);m+=qpts(q)});return [g,m]},by=t=>e.done.find((z,i)=>e.parts[i].title===t);
  const lz=by('Listening'),rz=by('Reading'),wz=by('Writing'),[lg,lm]=lz?sc(lz):[0,1],[rg,rm]=rz?sc(rz):[0,1];
  EXR={no:e.no,cb:e.cb,lg,lm,rg,rm,lis:Math.round(lg/lm*100),rea:Math.round(rg/rm*100),wq:wz?wz.qs:[],wt:wz?wz.qs.map((q,i)=>wz.ans[i]||''):[],fb:[],rev:[lz,rz].filter(Boolean)};
  EXR.ws=EXR.wq.map((q,i)=>{const n=zlen(EXR.wt[i]);return n>=q.min?60:n>=q.min*.6?40:n?20:0});
  EXS=null;QZ={fin:true};drawExamResult(true);
}
function drawExamResult(top){
  const r=EXR,wri=r.ws.length?Math.round(r.ws.reduce((a,b)=>a+b,0)/r.ws.length):0,tot=r.lis+r.rea+wri,pass=tot>=180,p=P();
  if(r.no)(p.exams=p.exams||{})[r.no]={d:today(),tot,lis:r.lis,rea:r.rea,wri,pass};p.act[today()]=1;save();if(r.cb)r.cb(Math.round(tot/3));

  <div class="result"><div class="seal big ${pass?'':'fail'}">${pass?'合格':'再练'}</div><h2 style="justify-content:center">${tot}/300</h2>
  <table class="tb"><tr><th>Section</th><th>Correct</th><th>Scaled score</th></tr>

  ${r.wq.map((q,i)=>`<div class="rev"><p class="qtag">${q.tag}</p><div class="qtext">${q.pic?panels(q.w):`<div class="pass zh">${esc(q.w.prompt)}</div>`}</div><h3>Your text (${zlen(r.wt[i])} characters)</h3><div class="pass zh">${esc(r.wt[i])||'(blank)'}</div>
    <h3>Model answer</h3><div class="pass zh">${esc(q.w.model)}</div>
    <label>Your mark for this task <select data-act="wscore" data-i="${i}">${(bands.some(b=>b[0]===r.ws[i])?bands:[[r.ws[i],r.ws[i]+' · marked by Claude'],...bands]).map(b=>`<option value="${b[0]}"${b[0]===r.ws[i]?' selected':''}>${b[1]}</option>`).join('')}</select></label>
    ${AI?`<div class="row"><button class="btn line" data-act="aimark" data-i="${i}">Ask Claude to mark it</button></div>`:''}<div id="aiout${i}">${r.fb[i]?`<div class="ai">${esc(r.fb[i])}</div>`:''}</div></div>`).join('')}
  ${r.rev.map(z=>{const bad=z.qs.map((q,j)=>z.res[j]===true?'':revItem(q,z.ans[j])).join('');return bad?`<h3 style="margin-top:28px">${z.title}: items to review</h3>${bad}`:''}).join('')}
  <div class="row"><button class="btn" data-act="qclose">Done</button></div></div>`;
  if(top)$('#quiz').scrollTop=0;

async function aiMark(q,text,out,done){
  if(!AI)return;if(zlen(text)<15){toast('Write a few sentences first.');return}
  out.innerHTML='<p class="mute">Claude is reading your text. This can take up to a minute.</p>';
  const task=q.pic?'Task 1: write a story of at least 100 Chinese characters based on four pictures. The pictures show: '+q.w.pan.map((x,i)=>`${i+1}) ${x.n}`).join(' '):'Task 2: write at least 200 Chinese characters on this topic: '+q.w.prompt;
  try{
    const r=await AI(`You are an experienced examiner for the writing section of the new HSK Level 5 (HSK 3.0). ${task}\n\nCandidate's text:\n${text}\n\nMark it out of 100, where 60 is an adequate Level 5 answer: task completed, coherent, mostly accurate Level 4-5 vocabulary and grammar, required length met. Reply in English as plain text in exactly this layout:\nSCORE: <number>\nOVERALL: <two sentences>\nCORRECTIONS:\n- <original phrase> → <corrected phrase> (<short reason>)\n(list up to 6 real errors only)\nUPGRADE: <two or three Level 5 words or patterns that would lift this text, each shown in a rewritten sentence from the text>\nIMPROVED VERSION: <the candidate's text rewritten to a strong Level 5 standard at similar length>`);
    out.innerHTML=`<div class="ai">${esc(r.text)}</div>`;const m=r.text.match(/SCORE:\s*(\d+)/);if(done)done(m?Math.min(100,+m[1]):null,r.text);
  }catch(e){out.innerHTML=`<p class="note">${e&&e.code==='not_granted'?'Marking by Claude was not allowed for this page.':'Claude could not mark the text just now. Try again in a minute.'}</p>`}
}

/* ================= Quiz engine ================= */
const clock=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
const qpts=q=>q.kind==='order'?q.paras.length:q.subs?q.subs.length:1;
const earned=(q,r)=>r===true?qpts(q):typeof r==='number'?r:0;
function keep(){const z=QZ;if(!z||!z.qs)return;const q=z.qs[z.i],e=$('#wtx');if(q&&q.kind==='write'&&e)z.ans[z.i]=e.value}
function startQuiz(title,qs,opt={}){
  qs=qs.filter(Boolean);if(!qs.length){toast('Nothing to practise here yet. Try the whole course as the range.');return}
  if(QZ)clearInterval(QZ.timer);QZ={title,qs,i:0,ans:[],res:[],plays:{},opt,left:opt.limit||0,shown:false,flip:false};
  if(opt.limit)QZ.timer=setInterval(()=>{QZ.left--;const e=$('#qtime');if(e)e.textContent=clock(Math.max(0,QZ.left));if(QZ.left<=0){keep();finishQuiz()}},1000);
  $('#quiz').classList.add('on');drawQ(true);
}
const isOnce=(z,q)=>!!(z.opt.exam||q.once);
function playQ(){
  const z=QZ,q=z.qs[z.i];if(!q.audio)return;const once=isOnce(z,q);
  if(once&&z.plays[z.i]&&!z.shown&&!z.flip){toast('This recording can be played once only.');return}
  z.plays[z.i]=(z.plays[z.i]||0)+1;speak(q.audio,once?1:0);if(once&&!z.shown)drawQ();
}
function optsHtml(q,a,show){
  return q.subs.map((s,j)=>{const t=q.lab?s.q:q.hideq&&!show?'':s.q||'',n=q.subs.length>1&&!q.lab?j+1+'. ':'';
    return `${n||t?`<p class="subq">${n}<span class="${q.lab?'':'zh'}">${esc(t)}</span></p>`:''}<div class="opts">${s.opts.map((o,i)=>`<button class="opt${q.lat?' lat':''}${show?(i===s.a?' ok':i===a[j]?' no':''):i===a[j]?' sel':''}" data-act="pick" data-j="${j}" data-i="${i}" ${show?'disabled':''}><span class="on">${'ABCD'[i]}</span>${esc(o)}</button>`).join('')}</div>`}).join('');
}
function writeBack(q){
  return `<h3>Model answer</h3><div class="pass zh">${esc(q.w.model)}</div><p class="mute">Check your text against it: ${q.pic?'all four pictures covered in order; time words and connectors such as 后来、于是、结果; a clear ending':'a clear main idea; one concrete experience or example; your feeling or conclusion at the end'}; at least ${q.min} characters; no pinyin and few wrong characters.</p>
  ${AI?'<div class="row"><button class="btn line" data-act="aimark">Ask Claude to mark it</button></div>':''}<div id="aiout"></div>
  <div class="row"><button class="btn line" data-act="fno">Needs another go</button><button class="btn" data-act="fyes">Met the brief</button></div>`;
}
function drawQ(auto){
  const z=QZ,q=z.qs[z.i],show=z.shown,k=q.kind||'mc',ex=z.opt.exam;let a=z.ans[z.i],body='',fb='';
  if(k==='mc'){a=a||(z.ans[z.i]=[]);body=optsHtml(q,a,show)+(show||q.subs.length<2?'':`<div class="row"><button class="btn" data-act="mcheck">${ex?'Next':'Check answers'}</button></div>`)}
  else if(k==='dict')body=`<input id="din" value="${esc(a||'')}" placeholder="Write what you hear" autocomplete="off" autocapitalize="off" ${show?'disabled':''}>
    <div class="chipsb">${q.bank.map(c=>`<button class="chip" data-act="dchip" data-t="${esc(c)}" ${show?'disabled':''}>${esc(c)}</button>`).join('')}</div>
    ${show?'':'<div class="row"><button class="btn line sm" data-act="dclr">Clear</button><button class="btn" data-act="dcheck">Check</button></div>'}`;
  else if(k==='cloze'){const st=a||(z.ans[z.i]={f:[],u:[]});
    body=`<div class="pass zh">${q.parts.map(p=>typeof p==='string'?esc(p):p.b==null?esc(p):`<button class="bl czb${show?(st.f[p.b]===q.sol[p.b]?' ok':' no'):''}" data-act="czrm" data-b="${p.b}" ${show?'disabled':''}>${st.f[p.b]!=null?esc(st.f[p.b]):p.b+1}</button>`).join('')}</div>
    <div class="chipsb">${q.bank.map((c,i)=>`<button class="chip" data-act="czadd" data-i="${i}" ${show||st.u.includes(i)?'disabled':''}>${esc(c)}</button>`).join('')}</div>
    ${show?'':'<div class="row"><button class="btn" data-act="czcheck">Check</button></div>'}`}
  else if(k==='order'){a=a||(z.ans[z.i]=[]);const L='ABCDEFG';
    body=`<p>Your order: <span class="seq">${a.map(x=>L[x]).join(' → ')||'tap the paragraph that comes first'}</span></p><div class="ord">${q.sh.map((pi,x)=>`<button class="ordp${show?(a.indexOf(x)===pi?' ok':' no'):''}" data-act="opick" data-x="${x}" ${show||a.includes(x)?'disabled':''}><b>${L[x]}</b><span>${esc(q.paras[pi])}</span></button>`).join('')}</div>
    ${show?'':`<div class="row"><button class="btn line sm" data-act="oundo">Undo</button><button class="btn" data-act="ocheck" ${!ex&&a.length<q.paras.length?'disabled':''}>${ex?'Next':'Check order'}</button></div>`}`}
  else if(k==='write'){const t=a||'';
    body=`<textarea id="wtx" ${show?'disabled':''} placeholder="在这里写……">${esc(t)}</textarea><p class="mute"><span class="cnt${zlen(t)<q.min?' low':''}" id="wcnt">${zlen(t)}</span> of at least ${q.min} characters${q.w.hint&&!ex?`<br>Useful: <span class="zh">${esc(q.w.hint)}</span>`:''}</p>`+(show?writeBack(q):`<div class="row"><button class="btn" data-act="wdone">${ex?(z.i+1<z.qs.length?'Next task':'Hand in'):'Finish and compare'}</button></div>`)}
  else body=`<div class="flash">${q.front}${z.flip?`<div class="fback">${q.back}</div>`:''}</div>`+(z.flip?'<div class="row"><button class="btn line" data-act="fno">Not yet</button><button class="btn" data-act="fyes">Got it</button></div>':`<button class="btn wide" data-act="flip">${q.audio||/Speaking/.test(q.tag)?'I have finished speaking':'Turn the card'}</button>`);
  if(show&&k!=='write'){const r=z.res[z.i],ok=r===true,n=qpts(q);
    const more=k==='dict'?`<p>Answer: <span class="zh">${esc(q.raw)}</span><br>${esc(q.en)}</p>`:k==='cloze'?`<p>Answer: <span class="zh">${q.sol.map(esc).join(' ／ ')}</span></p>`:k==='order'?`<p>Correct order: <b>${q.paras.map((_,i)=>'ABCDEFG'[q.sh.indexOf(i)]).join(' → ')}</b></p>`:q.exp?`<p>${q.exp}</p>`:'';
    fb=`<div class="fb ${ok?'good':'bad'}"><b>${ok?'◯ Correct':n>1?`${earned(q,r)} of ${n} correct`:'✕ Not quite'}</b>${more}</div><button class="btn wide" data-act="qnext">${z.i+1<z.qs.length?'Next':'See result'}</button>`}
  const once=isOnce(z,q);
  $('#quiz').innerHTML=`<div class="qwrap"><header class="qhead"><button class="x" data-act="qclose" aria-label="Leave">×</button><b>${esc(z.title)}</b><span>${z.opt.limit?`<span id="qtime">${clock(z.left)}</span> · `:''}${z.i+1}/${z.qs.length}</span></header>
  <div class="qbar"><i style="width:${z.i/z.qs.length*100}%"></i></div><p class="qtag">${q.tag}</p>${q.html?`<div class="qtext">${q.html}</div>`:''}
  ${q.audio?`<div class="row"><button class="btn line" data-act="qplay" ${once&&z.plays[z.i]&&!show&&!z.flip?'disabled':''}>${SPK} ${once&&!show&&!z.flip?(z.plays[z.i]?'Played. No replay':'Play the recording (once only)'):'Play again'}</button></div>`:''}${body}${fb}</div>`;
  if(auto){$('#quiz').scrollTop=0;if(q.audio&&!once)playQ()}
}
function grade(){const z=QZ,q=z.qs[z.i],a=z.ans[z.i]||[],c=q.subs.filter((s,j)=>a[j]===s.a).length;z.res[z.i]=c===q.subs.length?true:c;stopAudio();if(z.opt.exam)nextQ();else{z.shown=true;drawQ()}}
function answer(val,ok){const z=QZ;z.ans[z.i]=val;z.res[z.i]=ok;stopAudio();if(z.opt.exam)nextQ();else{z.shown=true;drawQ()}}
function nextQ(){const z=QZ;z.shown=false;z.flip=false;stopAudio();if(++z.i>=z.qs.length)finishQuiz();else drawQ(true)}
function revItem(q,a){
  const k=q.kind||'mc',h=`<div class="rev"><p class="qtag">${q.tag}</p>`;
  if(k==='mc')return h+`<div class="qtext">${q.html}</div>${q.subs.map((s,j)=>`<p>${q.subs.length>1?j+1+'. ':''}${s.q&&!q.lab?`<span class="zh">${esc(s.q)}</span><br>`:''}You: <span class="${q.lat?'':'zh '}${a&&a[j]===s.a?'ok':'no'}">${a&&a[j]!=null?esc(s.opts[a[j]]):'(no answer)'}</span> · Answer: <span class="${q.lat?'':'zh '}ok">${esc(s.opts[s.a])}</span></p>`).join('')}${q.exp?`<p class="mute">${q.exp}</p>`:''}</div>`;
  if(k==='dict')return h+`<p>You wrote: <span class="zh no">${esc(a||'(nothing)')}</span></p><p>Answer: <span class="zh ok">${esc(q.raw)}</span><br><span class="mute">${esc(q.en)}</span></p></div>`;
  if(k==='cloze')return h+`<p>Gaps in order: <span class="zh ok">${q.sol.map(esc).join(' ／ ')}</span></p><p class="mute">${q.exp}</p></div>`;
  if(k==='order')return h+`<div class="pass zh">${q.paras.map(esc).join('\n')}</div><p class="mute">The paragraphs above are in the correct order.</p></div>`;
  if(k==='write')return h+`<div class="qtext">${q.html}</div><p>Model answer:</p><div class="pass zh">${esc(q.w.model)}</div></div>`;
  return h+q.front+q.back+'</div>';
}
function finishQuiz(){
  const z=QZ;clearInterval(z.timer);stopAudio();const p=P();let got=0,max=0;
  z.qs.forEach((q,i)=>{const r=z.res[i];got+=earned(q,r);max+=qpts(q);
    if(q.key){if(r===true){if(p.wrong[q.key]&&--p.wrong[q.key]<=0)delete p.wrong[q.key]}else p.wrong[q.key]=(p.wrong[q.key]||0)+1}});
  p.act[today()]=1;save();
  if(z.opt.chain){z.opt.chain(z);return}

    const e=GEX[k];return e&&`<b class="zh">${esc(e.g.t)}</b><span class="zh">${exFull(e,1)}</span>`};
  return `<h1>Error notebook</h1><p class="lead">Words, characters and grammar items you answered wrongly are kept here. An item leaves once you have got it right as many times as you got it wrong.</p>
  ${ks.length?`<div class="row"><button class="btn" data-act="wquiz">Drill ${Math.min(20,ks.length)} items</button></div><ul class="outl">${ks.map(k=>{const r=row(k);return r?`<li>${r}<small>missed ${P().wrong[k]}×</small></li>`:''}).join('')}</ul>`:'<p class="note">The notebook is empty. Do any day\'s exercises and the items you miss will appear here.</p>'}`;
}
function setV(){
  const p=P();
  return `<h1>Settings</h1>
  <section class="sec"><h2>Your profile</h2><div class="form"><label>Name<input id="s-name" value="${esc(p.name)}"></label><label>First study day<input id="s-start" type="date" value="${p.start}"></label><label>Exam date<input id="s-exam" type="date" value="${p.exam||''}"></label></div>
  <div class="row"><button class="btn" data-act="saveset">Save changes</button></div></section>
  <section class="sec"><h2>Display and voice</h2><label class="chk"><input type="checkbox" data-act="py" ${p.py!==false?'checked':''}> Show pinyin in word lists</label>
  <div class="form"><label>Theme <select data-act="theme"><option value="">Match my device</option><option value="light"${p.theme==='light'?' selected':''}>Light</option><option value="dark"${p.theme==='dark'?' selected':''}>Dark</option></select></label>
  <label>Reading speed in lessons <select data-act="rate">${[[.75,'Slow'],[.9,'Steady'],[1,'Natural'],[1.15,'Fast']].map(([v,t])=>`<option value="${v}"${(p.rate||1)==v?' selected':''}>${t}</option>`).join('')}</select></label></div>
  <div class="row"><button class="btn line" data-act="ttstest">${SPK} Test the voice</button></div>
  <p class="mute">Listening uses the Mandarin voice installed on your device; exam recordings always play at natural speed. If the test is silent or sounds like English, add a Chinese (Mandarin) voice in your device's language settings, or open the page in Chrome, Edge or Safari.</p></section>
  <section class="sec"><h2>Profiles on this device</h2><p class="mute">Each profile has its own progress and error notebook. ${CLOUD?'Progress is saved to your Claude account, so it follows you to other devices.':'Progress is saved in this browser.'}</p>
  <ul class="outl">${Object.values(DB.profiles).map(q=>`<li><b>${esc(q.name)}</b><span>started ${fmtY(pd(q.start))}</span>${q.id===p.id?'<small>in use</small>':`<button class="btn sm line" data-act="switch" data-id="${q.id}">Switch</button>`}</li>`).join('')}</ul>
  <div class="row"><button class="btn line" data-act="addp">Add a profile</button></div></section>
  <section class="sec"><h2>Backup</h2><p class="mute">Download a backup now and then, or use one to move your progress to another browser.</p>
  <div class="row"><button class="btn line" data-act="export">Download backup</button><label class="btn line">Restore from file<input type="file" accept="application/json" id="imp" hidden></label></div>
  <div class="row"><button class="btn sm danger" data-act="reset">Erase this profile's progress</button>${Object.keys(DB.profiles).length>1?'<button class="btn sm danger" data-act="delp">Delete this profile</button>':''}</div></section>
  <section class="sec"><h2>Sources</h2><p class="mute">Word list, handwriting characters and grammar points follow the new HSK syllabus published by Chinese Testing International in November 2025; explanations, example sentences, dialogues and exam items were written for this plan and are not official materials. English glosses adapted from CC-CEDICT (CC BY-SA 4.0). Stroke data from Make Me a Hanzi (Arphic Public License) with character notes from the same project (LGPL).</p></section>`;
}
let lastHash=null;
function render(keep){
  const app=$('#app');
  if(!P()){app.innerHTML=onboard();return}
  const p=P();if(p.theme)document.documentElement.dataset.theme=p.theme;else delete document.documentElement.dataset.theme;
  document.body.classList.toggle('nopy',p.py===false);
  const [r,a]=(location.hash.slice(2)||'').split('/'),y=scrollY;
  const v=r==='plan'?plan():r==='day'?day(+a||todayN()):r==='prac'?pracV():r==='exam'?examV():r==='chars'?charsV():r==='wrong'?wrongV():r==='set'?setV():home();
  app.innerHTML=`<nav class="nav"><a class="brand" href="#/"><span class="zh">五级</span>HSK 5 in 10 weeks</a>${NAV.map(([h,t,g])=>`<a href="#/${h}" class="${(r||'')===h||(h==='plan'&&r==='day')||(h==='prac'&&r==='wrong')?'on':''}"><span class="zh">${g}</span>${t}</a>`).join('')}</nav>
  <main>${LS.ok||CLOUD?'':'<p class="note">This browser is blocking storage here, so progress will be lost when the page closes.</p>'}${v}</main>`;
  scrollTo(0,keep&&lastHash===location.hash?y:0);lastHash=location.hash;
}

/* ================= Events ================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,p=P(),z=QZ,q=z&&z.qs&&z.qs[z.i];
  if(a==='create'){const s=$('#o-start').value;if(!s){toast('Choose your first study day.');return}newProfile($('#o-name').value.trim()||'Learner',s,$('#o-exam').value);location.hash='#/';render()}
  else if(a==='back'){DB.cur=Object.keys(DB.profiles)[0];render()}
  else if(a==='say'){e.stopPropagation();say(t.dataset.t)}
  else if(a==='anim')animate(t.closest('.kcard').querySelector('.mz svg'));
  else if(a==='kopen'){openModal(kCard(HZ[t.dataset.k]));animate($('#modal .mz svg'))}
  else if(a==='pad')openPad(t.dataset.k);
  else if(a==='padclr'){const c=$('#modal canvas');c.getContext('2d').clearRect(0,0,c.width,c.height)}
  else if(a==='close'){stopAudio();closeModal()}
  else if(a==='reveal')t.classList.toggle('show');
  else if(a==='kwall')speak(KW[t.dataset.l].lines.map(l=>({t:l.zh,v:VOI[l.s]})));
  else if(a==='kwshow')t.closest('.sec').querySelector('.kwl').classList.toggle('veil');
  else if(a==='role'){RP={L:+t.dataset.l,r:t.dataset.r,i:0};roleStep()}
  else if(a==='rpshow'){$('#rpa').hidden=false;const ln=KW[RP.L].lines[RP.i];speak([{t:ln.zh,v:VOI[ln.s]}])}
  else if(a==='rpnext'){RP.i++;roleStep()}
  else if(a==='quiz'){const n=+t.dataset.n,s=t.dataset.sec,d=D(n);startQuiz(`Day ${n}: ${d.type==='lesson'||secs(d).length>1?SECN[s]:dayLabel(d)}`,buildSec(n,s),{done:pct=>markDone(n,s,pct)})}
  else if(a==='exam'){const n=+t.dataset.n;startExam(+t.dataset.no,n?pct=>markDone(n,'q',pct):null)}
  else if(a==='exgo'){const ex=EXS,pt=ex.parts[ex.i];startQuiz(`${exName(ex.no)} · ${pt.title}`,pt.qs,{exam:true,limit:pt.min*60,chain:zz=>{zz.title=pt.title;ex.done.push(zz);QZ=null;if(++ex.i<ex.parts.length)examIntro();else examResult()}})}
  else if(a==='spk')startQuiz('Speaking mock '+t.dataset.no,speakSet(+t.dataset.no));
  else if(a==='prac')practice(t.dataset.m);
  else if(a==='wquiz')startQuiz('Error notebook drill',shuf(Object.keys(p.wrong)).slice(0,20).map(qFromKey));
  else if(a==='qplay')playQ();
  else if(a==='pick'){if(z.shown)return;(z.ans[z.i]=z.ans[z.i]||[])[+t.dataset.j]=+t.dataset.i;if(q.subs.length===1)grade();else drawQ()}
  else if(a==='mcheck')grade();
  else if(a==='dchip'){$('#din').value+=t.dataset.t}
  else if(a==='dclr')$('#din').value='';
  else if(a==='dcheck'){const v=$('#din').value;answer(v,dictOk(q,v))}
  else if(a==='czadd'){const st=z.ans[z.i],b=q.sol.findIndex((_,j)=>st.f[j]==null);if(b<0)return;const i=+t.dataset.i;st.f[b]=q.bank[i];st.u[b]=i;drawQ()}
  else if(a==='czrm'){const st=z.ans[z.i],b=+t.dataset.b;st.f[b]=null;st.u[b]=null;drawQ()}
  else if(a==='czcheck'){const st=z.ans[z.i];z.res[z.i]=q.sol.every((s,j)=>st.f[j]===s);z.shown=true;drawQ()}
  else if(a==='opick'){z.ans[z.i].push(+t.dataset.x);drawQ()}
  else if(a==='oundo'){z.ans[z.i].pop();drawQ()}
  else if(a==='ocheck'){const s=z.ans[z.i],c=s.filter((x,k)=>q.sh[x]===k).length;answer(s,c===q.paras.length?true:c)}
  else if(a==='wdone'){keep();if(z.opt.exam)nextQ();else{z.shown=true;drawQ()}}
  else if(a==='aimark'){t.disabled=true;if(EXR){const i=+t.dataset.i;aiMark(EXR.wq[i],EXR.wt[i],$('#aiout'+i),(s,txt)=>{EXR.fb[i]=txt;if(s!=null){EXR.ws[i]=s;drawExamResult()}})}else aiMark(q,z.ans[z.i]||'',$('#aiout'))}
  else if(a==='tm'){let s=+t.dataset.s;clearInterval(tmI);t.disabled=true;t.textContent=clock(s)+' left';tmI=setInterval(()=>{s--;t.textContent=s>0?clock(s)+' left':'Time is up';if(s<=0)clearInterval(tmI)},1000)}
  else if(a==='flip'){clearInterval(tmI);z.flip=true;drawQ();if(q.say)say(q.say)}
  else if(a==='fyes'||a==='fno'){z.res[z.i]=a==='fyes';nextQ()}
  else if(a==='qnext')nextQ();
  else if(a==='qclose'){if((EXS||(z&&!z.fin&&z.res&&z.res.length))&&!confirm('Leave this exercise? The result will not be saved.'))return;clearInterval(tmI);closeQuiz()}
  else if(a==='saveset'){const s=$('#s-start').value;if(!s){toast('Choose your first study day.');return}p.name=$('#s-name').value.trim()||p.name;p.start=s;p.exam=$('#s-exam').value;save();render();toast('Changes saved.')}
  else if(a==='ttstest')speak([{t:'你好，欢迎参加中文水平考试。',v:'f'},{t:'听力考试现在开始，请大家注意。',v:'m'}]);
  else if(a==='switch'){DB.cur=t.dataset.id;save();render();toast('Profile switched.')}
  else if(a==='addp'){DB.cur=null;render()}
  else if(a==='export'){const j=JSON.stringify(DB);if(DL)DL.save({filename:'hsk5-backup.json',data:j}).then(()=>toast('Backup downloaded.')).catch(()=>toast('The backup was not saved.'));
    else{const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));l.download='hsk5-backup.json';l.click()}}
  else if(a==='reset'){if(confirm('Erase all progress and the error notebook for this profile?')){p.done={};p.wrong={};p.act={};p.exams={};save();render();toast('Progress erased.')}}
  else if(a==='delp'){if(confirm(`Delete the profile “${p.name}”?`)){delete DB.profiles[p.id];DB.cur=Object.keys(DB.profiles)[0];save();render()}}
});
document.addEventListener('change',e=>{
  const t=e.target,a=t.dataset.act;
  if(a==='hide')t.closest('.sec').querySelector('.vlist').classList.toggle('hidden',t.checked);
  else if(a==='py'){P().py=t.checked;save();render(true)}
  else if(a==='theme'){P().theme=t.value;save();render(true)}
  else if(a==='rate'){P().rate=+t.value;save()}
  else if(a==='scope'){P().scope=t.value;save()}
  else if(a==='wscore'&&EXR){EXR.ws[+t.dataset.i]=+t.value;drawExamResult()}
  else if(t.id==='imp'&&t.files[0]){const f=new FileReader();f.onload=()=>{try{const d=JSON.parse(f.result);if(!d.profiles||!Object.keys(d.profiles).length)throw 0;DB=d;if(!P())DB.cur=Object.keys(DB.profiles)[0];save();render();toast('Progress restored.')}catch(x){toast('That file is not a backup from this plan.')}};f.readAsText(t.files[0])}
});
document.addEventListener('input',e=>{if(e.target.id==='wtx'){const c=$('#wcnt'),q=QZ.qs[QZ.i],n=zlen(e.target.value);c.textContent=n;c.classList.toggle('low',n<q.min)}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#modal').classList.contains('on')){stopAudio();closeModal()}return}
  const z=QZ;if(!z||z.fin||!z.qs)return;const q=z.qs[z.i],k=q.kind||'mc';
  if(k==='mc'&&q.subs.length===1&&/^[1-4]$/.test(e.key)&&!z.shown){z.ans[z.i]=[+e.key-1];grade()}
  else if(e.key==='Enter'&&e.target.id!=='wtx'){if(z.shown&&k!=='write'){e.preventDefault();nextQ()}else if(k==='dict'){e.preventDefault();const v=$('#din').value;answer(v,dictOk(q,v))}}
});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'){stopAudio();closeModal()}});
addEventListener('hashchange',()=>render());
if(!P()&&Object.keys(DB.profiles).length)DB.cur=Object.keys(DB.profiles)[0];
render();

</script>
