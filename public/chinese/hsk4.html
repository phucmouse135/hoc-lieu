<!doctype html>
<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F2F4F3;--card:#FFFFFF;--ink:#17202A;--mute:#5B6770;--line:#D5DBDD;--grid:#E0A9A2;--ai:#1D4E6B;--ai-soft:#E2EDF2;--shu:#C0272D;--shu-soft:#FAE6E4;--hl:#FBEFB4;--ok:#2F7A55;--ok-soft:#E1F2E8;
 --zh:"Noto Serif SC","Songti SC","SimSun","STSong",serif;--ui:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--hd:"Source Serif 4","Noto Serif SC",Georgia,serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#12171B;--card:#1A2127;--ink:#E6EBEE;--mute:#97A4AD;--line:#2B363E;--grid:#6B3F3C;--ai:#8FC1DC;--ai-soft:#1B3140;--shu:#F0736B;--shu-soft:#3B2120;--hl:#564C14;--ok:#62C596;--ok-soft:#17352A}}
:root[data-theme="dark"]{--paper:#12171B;--card:#1A2127;--ink:#E6EBEE;--mute:#97A4AD;--line:#2B363E;--grid:#6B3F3C;--ai:#8FC1DC;--ai-soft:#1B3140;--shu:#F0736B;--shu-soft:#3B2120;--hl:#564C14;--ok:#62C596;--ok-soft:#17352A}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.55 var(--ui);-webkit-text-size-adjust:100%}
.zh{font-family:var(--zh);font-weight:500}
.py{color:var(--mute);font-size:.92em}
.nopy .vlist .py{display:none}
a{color:var(--ai)}
h1{font:600 1.9rem/1.2 var(--hd);margin:.2em 0 .35em}
h2{font:600 1.25rem/1.3 var(--hd);margin:0 0 .6em;display:flex;align-items:center;gap:.5em;flex-wrap:wrap}
h3{font-size:1.08rem;margin:0 0 .25em}
p{margin:.4em 0 .8em;max-width:70ch}
.mute{color:var(--mute);font-size:.94rem}.lead{font-size:1.08rem}
mark{background:var(--hl);color:inherit;padding:0 .15em;border-radius:3px}
:focus-visible{outline:3px solid var(--ai);outline-offset:2px}
#app{display:grid;grid-template-columns:214px minmax(0,1fr);min-height:100%}
.nav{position:sticky;top:0;align-self:start;height:100vh;padding:20px 12px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;background:var(--card)}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:600}
.nav a .zh{width:28px;height:28px;display:grid;place-items:center;border:1.5px solid var(--grid);border-radius:3px;font-size:1rem}
.nav a.on{background:var(--ai-soft);color:var(--ai)}.nav a.on .zh{border-color:var(--ai)}
.nav .brand{margin-bottom:14px;flex-direction:column;align-items:flex-start;gap:0;line-height:1.3;font-family:var(--hd)}
.nav .brand .zh{border:0;width:auto;height:auto;font-size:1.45rem;font-weight:700;color:var(--shu)}
main{padding:28px clamp(16px,4vw,48px) 96px;max-width:920px;width:100%}
.onb{max-width:480px;margin:0 auto;padding:7vh 20px;grid-column:1/-1}
.onb label,.form label{display:block;font-weight:600;margin:14px 0}
input:not([type=checkbox]),select,textarea{display:block;width:100%;margin-top:4px;padding:10px 12px;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:8px}
textarea{font-family:var(--zh);font-size:1.15rem;line-height:1.9;min-height:210px;resize:vertical}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0 16px}
.mz-row{display:flex;margin-bottom:18px}.mz-row span{width:66px;height:66px;display:grid;place-items:center;border:1.5px solid var(--grid);margin-right:-1.5px;font:700 2.2rem var(--zh);color:var(--shu);background:linear-gradient(var(--grid),var(--grid)) 50% 0/1px 100% no-repeat,linear-gradient(var(--grid),var(--grid)) 0 50%/100% 1px no-repeat,var(--card)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border:1.5px solid var(--ai);border-radius:8px;background:var(--ai);color:var(--card);font:600 1rem var(--ui);text-decoration:none;cursor:pointer}
.btn.line{background:transparent;color:var(--ai)}.btn.sm{padding:6px 12px;font-size:.9rem}.btn.wide{width:100%;margin-top:10px}
.btn.danger{background:transparent;border-color:var(--shu);color:var(--shu)}.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0}
.note{background:var(--shu-soft);border-left:4px solid var(--shu);padding:10px 14px;border-radius:0 8px 8px 0;max-width:none}
.tip{background:var(--hl);padding:8px 12px;border-radius:8px;font-size:.96rem;max-width:none}
.tip::before{content:"Watch out: ";font-weight:700}.tip.mem::before{content:"Memory hook: "}
.sec{margin:34px 0;padding-top:22px;border-top:1.5px solid var(--line)}
.crumb{font-size:.9rem;color:var(--mute);margin:0}
.hero{display:flex;gap:28px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.hero>div:last-child{flex:1;min-width:260px}.hero-k{display:flex}.hero-k .mz{width:clamp(84px,17vw,124px);margin-right:-1.5px;cursor:pointer;padding:0}
.mz{aspect-ratio:1;border:1.5px solid var(--grid);background:var(--card);position:relative;display:block}
.mz.txt{display:grid;place-items:center;font:700 clamp(3rem,10vw,4.4rem) var(--zh);color:var(--shu)}
.hsvg{display:block;width:100%;height:100%}
.hsvg path{fill:var(--ink)}.hsvg path.hgrid{fill:none;stroke:var(--grid);stroke-width:5;stroke-dasharray:22 20}
.hsvg path.hi{fill:var(--shu)}.hsvg path.ghost{fill:var(--line)}
.hsvg path.hm{fill:none;stroke:var(--ink);stroke-width:150;stroke-linecap:round;stroke-linejoin:round}
.hsvg text{font:700 58px var(--ui);fill:var(--shu)}
.hsvg.st .hgrid{display:none}
.seal{display:inline-grid;place-items:center;width:2em;height:2em;border:2px solid var(--shu);border-radius:5px;color:var(--shu);font:700 .95rem var(--zh);transform:rotate(-8deg);flex:none}
.seal.sm{font-size:.75rem}.seal.big{width:5.4rem;height:5.4rem;font-size:1.6rem;border-width:3px;margin:10px auto;border-radius:8px}
.seal.fail{border-color:var(--mute);color:var(--mute)}
.todo,.outl,.vlist,.gx,.kw{list-style:none;padding:0;margin:10px 0}
.todo li,.outl li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:9px 2px;border-bottom:1px dashed var(--line)}
.todo li.done a{color:var(--mute);text-decoration:line-through}.todo span{color:var(--mute);font-size:.92rem}
.outl li>span{flex:1;color:var(--mute)}.outl li>b{min-width:8em}.outl small{color:var(--shu)}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));flex:1}
.cell{aspect-ratio:1;border:1.5px solid var(--grid);margin:0 -1.5px -1.5px 0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:3px;text-decoration:none;color:var(--ink);background:var(--card);position:relative;min-width:0}
.cell small{font-size:.64rem;color:var(--mute);line-height:1.2}.cell b{font:500 clamp(1rem,3.4vw,1.55rem)/1 var(--zh);opacity:.88}
.cell.nl b{color:var(--ai)}
.cell.today{outline:3px solid var(--ai);outline-offset:-3px;z-index:1}
.cell .seal{position:absolute;inset:0;margin:auto;width:66%;height:66%;font-size:clamp(.8rem,2.6vw,1.2rem);background:color-mix(in srgb,var(--card) 72%,transparent)}
.wk{display:flex;align-items:center;gap:10px;margin-bottom:1.5px}.wkl{width:78px;flex:none;font-weight:600;font-size:.88rem}.wkl small{display:block;font-weight:400;color:var(--mute);font-size:.72rem}
.pbar{display:grid;grid-template-columns:74px 1fr 62px;gap:10px;align-items:center;margin:6px 0;font-size:.92rem}
.pbar div,.qbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.pbar i,.qbar i{display:block;height:100%;background:var(--ok)}
.gcard{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:16px 18px;margin:14px 0}
.gcard h3{font:700 1.3rem var(--zh);color:var(--ai)}.gm{font-weight:600;margin:0 0 8px}
.gs{background:var(--ai-soft);padding:8px 12px;border-radius:8px;max-width:none}
.gx li,.vlist li,.kw li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px dashed var(--line)}
.gx .zh,.pass{font-size:1.18rem;line-height:1.9}.gx .en{display:block;color:var(--mute);font-size:.95rem}
.say{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:transparent;color:var(--ai);display:grid;place-items:center;cursor:pointer;margin-top:3px}
.vlist li{cursor:pointer;align-items:baseline;flex-wrap:wrap;gap:4px 12px}.vlist .say{align-self:center;margin:0}
.vlist .zh{font-size:1.22rem;min-width:4.6em}.vlist .py{min-width:7em}.vlist .vm{flex:1 1 12em}
.vlist.hidden li:not(.show) .vm,.vlist.hidden li:not(.show) .py{filter:blur(6px)}
.vlist li.cut{border-top:2px solid var(--grid)}
.kw .zh{min-width:4.5em;font-size:1.12rem}
.chk{display:flex;gap:8px;align-items:center;margin:10px 0;font-size:.97rem}
.kcard{display:grid;grid-template-columns:200px minmax(0,1fr);gap:14px 22px;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:16px;margin:14px 0}
.kcard .hv{color:var(--shu);font-size:1.3rem;margin-right:.3em}
.steps{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px}.steps svg{width:52px;height:52px;border:1px solid var(--line);background:var(--card)}
.kgridv{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr))}
.kgridv button{aspect-ratio:1;border:1.5px solid var(--grid);margin:0 -1.5px -1.5px 0;background:var(--card);color:var(--ink);font:500 1.5rem var(--zh);cursor:pointer;padding:0}
.kgridv button.w{background:var(--shu-soft)}.kgridv button:hover{background:var(--ai-soft)}
.pn{display:flex;justify-content:space-between;margin-top:40px}
#modal,#quiz{position:fixed;inset:0;z-index:50;display:none;overflow:auto}
#modal.on{display:grid;place-items:center;background:rgba(10,18,28,.55);padding:16px}
.sheet{background:var(--paper);border-radius:12px;padding:22px;width:min(680px,100%);max-height:92vh;overflow:auto;position:relative}
.sheet .kcard{border:0;padding:0;background:transparent;margin:0}
.x{position:absolute;top:8px;right:10px;width:36px;height:36px;border:0;background:transparent;font-size:1.6rem;color:var(--mute);cursor:pointer;z-index:2}
.pad{position:relative;width:min(320px,80vw);margin:10px auto}.pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
#quiz.on{display:block;background:var(--paper)}
.qwrap{max-width:720px;margin:0 auto;padding:16px 18px 90px}
.qhead{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:6px 0 10px}.qhead .x{position:static}.qhead b{flex:1}
.qtag{display:inline-block;margin:18px 0 6px;font-size:.84rem;font-weight:600;color:var(--ai);background:var(--ai-soft);padding:2px 10px;border-radius:99px}
.qtext{font-size:1.05rem}.qs{font-size:1.4rem;line-height:1.9;margin:10px 0}.qs.huge,.qs .huge{font-size:4rem;line-height:1.3}
.pass{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:14px 16px;margin:10px 0 12px;white-space:pre-line}
.bl{display:inline-block;min-width:2.6em;border-bottom:2px solid var(--ink);text-align:center;color:var(--shu);margin:0 2px;font-family:var(--ui);font-weight:700}
.opts{display:grid;gap:10px;margin:12px 0 18px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:500 1.1rem/1.7 var(--zh);cursor:pointer}
.opt.lat{font:400 1.02rem/1.5 var(--ui)}
.opt .on{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:600 .8rem var(--ui);flex:none}
.opt:not(:disabled):hover{border-color:var(--ai)}
.opt.sel{border-color:var(--ai);background:var(--ai-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.no{border-color:var(--shu);background:var(--shu-soft)}
.subq{margin-top:16px;font-weight:600}
.fb{padding:12px 16px;border-radius:10px;margin:8px 0}.fb.good{background:var(--ok-soft)}.fb.bad{background:var(--shu-soft)}.fb p{margin:.3em 0;max-width:none}
.fb.good b{color:var(--ok)}.fb.bad b{color:var(--shu)}
.result{text-align:center;padding:10px 0 20px}.result p{margin-inline:auto}
.rev{border-top:1px dashed var(--line);padding:10px 0}.rev .qs{font-size:1.15rem}.rev .huge{font-size:2.2rem}.rev .pass{font-size:1rem}
span.ok{color:var(--ok)}span.no{color:var(--shu)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:99;font-size:.94rem;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
.guide{padding-left:1.3em;max-width:72ch}.guide li{margin:.45em 0}
.kwl .spk{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ai-soft);color:var(--ai);display:grid;place-items:center;font-size:.85rem;margin-top:5px}
.kwl.veil div{filter:blur(7px);user-select:none}
.gxl{font-size:1.3rem;line-height:1.9}
.chipsb{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chip{padding:5px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:500 1.1rem/1.8 var(--zh);cursor:pointer}
.chip:disabled{opacity:.35;cursor:default}.chip:not(:disabled):hover{border-color:var(--ai)}
.nw{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0}.nw span{font-size:.88rem;background:var(--ai-soft);border-radius:6px;padding:1px 8px}
#din{font:500 1.2rem var(--zh);padding:12px 14px;margin-top:12px}
.czb{font:inherit;background:var(--ai-soft);border:0;border-bottom:2px solid var(--ai);border-radius:4px 4px 0 0;color:var(--ai);cursor:pointer;padding:0 8px;min-width:3em}
.czb.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}.czb.no{background:var(--shu-soft);border-color:var(--shu);color:var(--shu)}
.bl.cur{background:var(--hl)}
.flash{background:var(--card);border:1.5px solid var(--grid);border-radius:10px;padding:24px 18px;text-align:center;margin:14px 0;min-height:170px}
.flash .huge{font-size:4.6rem;line-height:1.2}.flash p{margin-inline:auto}.flash .pass{text-align:left}
.fback{border-top:1px dashed var(--line);margin-top:16px;padding-top:14px}
.tb{width:100%;border-collapse:collapse;margin:14px 0;font-size:.95rem;text-align:left}
.tb th,.tb td{border:1px solid var(--line);padding:7px 10px;vertical-align:top}.tb th{background:var(--ai-soft)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin:18px 0}
.pcard{display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px 16px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;text-decoration:none;cursor:pointer}
.pcard:hover{border-color:var(--ai)}.pcard b{color:var(--ai)}.pcard span{color:var(--mute);font-size:.92rem}
.panels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.panels.p3{grid-template-columns:repeat(3,1fr)}
.panel{border:1.5px solid var(--line);border-radius:8px;background:var(--card);padding:8px 4px;text-align:center;position:relative}
.panel i{font-style:normal;font-size:clamp(1.5rem,5vw,2.3rem);line-height:1.5;display:block}
.panel small{display:block;color:var(--mute);font-size:.78rem;line-height:1.3;padding:0 4px}.panel b{position:absolute;top:2px;left:7px;font-size:.78rem;color:var(--shu)}
.panels.hide small{display:none}
.ord{display:grid;gap:8px;margin:12px 0}
.ordp{display:flex;gap:10px;text-align:left;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:500 1.05rem/1.8 var(--zh);cursor:pointer}
.ordp b{font:700 .95rem var(--ui);color:var(--ai);flex:none;width:1.4em}.ordp:disabled{opacity:.45}
.ordp.ok{border-color:var(--ok);background:var(--ok-soft);opacity:1}.ordp.no{border-color:var(--shu);background:var(--shu-soft);opacity:1}
.seq{font-weight:700;letter-spacing:.08em;color:var(--ai)}
.cnt{font-weight:700}.cnt.low{color:var(--shu)}
.ai{border:1.5px solid var(--ai);border-radius:10px;padding:12px 16px;margin:12px 0;background:var(--card);white-space:pre-wrap}
@media (max-width:820px){
 #app{display:block}
 .nav{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;justify-content:space-around;padding:6px 2px calc(6px + env(safe-area-inset-bottom,0px));border:0;border-top:1px solid var(--line);z-index:20}
 .nav .brand{display:none}.nav a{flex-direction:column;gap:2px;font-size:.66rem;padding:4px 2px}.nav a .zh{width:26px;height:26px}
 main{padding-top:18px}h1{font-size:1.5rem}
 .kcard{grid-template-columns:1fr}.kfig{max-width:220px}
 .wk{flex-direction:column;align-items:stretch;gap:2px;margin-bottom:10px}.wkl{width:auto}.wkl small{display:inline;margin-left:8px}
 .outl li{flex-wrap:wrap}.tb{font-size:.84rem}.panels{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
ruby{ruby-position:over}ruby{margin:0 .1em}rt{font:400 .58em/1.2 var(--ui);color:var(--mute);letter-spacing:0;user-select:none}
.rb{line-height:2.3}.opt .rb,.chip .rb,.czb .rb{line-height:2}
.opts.pics{grid-template-columns:repeat(3,1fr)}
.opt.pic{flex-direction:column;justify-content:center;font-size:2.6rem;line-height:1.3;padding:10px 4px;gap:4px}
.kgridv.big{grid-template-columns:repeat(auto-fill,minmax(76px,1fr));margin:12px 0}
.kgridv.big button{aspect-ratio:auto;padding:10px 0 6px;font-size:2rem;display:flex;flex-direction:column;align-items:center;gap:2px}
.kgridv.big small{font:400 .8rem var(--ui);color:var(--mute)}
.panels.p1{grid-template-columns:minmax(0,240px)}

#homebtn{position:fixed;top:env(safe-area-inset-top,10px);left:14px;z-index:999;background:var(--card);border:1px solid var(--line);color:var(--ink);font:600 13px/1 var(--ui);padding:9px 12px;border-radius:999px;text-decoration:none;box-shadow:0 2px 8px rgba(27,40,54,.12)}#homebtn:hover{opacity:.85}
.pset>label{display:block;font-weight:600;margin:14px 0}
.pset>label.chk{display:flex;font-weight:400}
.picks{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:-6px 0 14px}
.pick{display:inline-flex;align-items:center;gap:6px;margin:0;padding:3px 12px 3px 8px;border:1.5px solid var(--line);border-radius:99px;background:var(--card);font-size:.9rem;font-weight:500;cursor:pointer}
.pick:has(input:checked){border-color:var(--ai);background:var(--ai-soft);color:var(--ai)}
.pick input{margin:0}

</head>
<body>
<a href="../index.html" id="homebtn" aria-label="Về trang chủ">‹ Trang chủ</a>
<div id="app"></div>
<div id="modal"></div>
<div id="quiz" role="dialog" aria-label="Exercise"></div>

e section in 25 minutes"],"ws":["<p>Part 1 gives you a word and asks for one sentence. A safe recipe: decide who does what, add a time or a reason, and check that the word is used in its normal position.<\/p><p>Part 2 asks for at least 80 characters on a topic. Use three moves:<\/p><ol class=\"guide\"><li><b>Answer the topic<\/b> in your first sentence.<\/li><li><b>Two or three details<\/b>, joined with 首先、其次、另外 or 不仅……而且…….<\/li><li><b>A closing sentence<\/b> with your feeling or a wish.<\/li><\/ol>","<p>Many Part 2 topics ask for your opinion (谈谈你对……的看法). State your view, give one advantage and one drawback with 然而 or 尽管……但是……, then end with 因此 or 我认为……. Three sentence tasks first, then the essay.<\/p>","<p>Today, work against the clock: five sentences in about 10 minutes, then the essay in 15. Do not stop to polish; finish first, then reread for wrong characters.<\/p>"],"spk":"The Level 4 speaking test is taken separately from the written paper and lasts about 20 minutes including preparation. It has five tasks: two short recordings to retell (40 seconds each), one picture to talk about (2 minutes) and two questions to answer (2 minutes each). Record yourself on your phone, then compare with the text or the sample answer and mark yourself.","mock":"A full paper in the new format: 32 listening items in about 20 minutes, 32 reading items in 30 minutes, and five sentences plus one short essay in 25 minutes. Every item is new to you. Sit it in one go, somewhere quiet, with sound on.","onb":"A day-by-day plan for the new HSK 4 format: 70 items, including sentence writing and an essay of at least 80 characters, plus a separate speaking test. Eight weeks of lessons cover all 1,000 new Level 4 words and the main grammar; two weeks of mock exams and review follow.","phd":["48 lessons of about 90 minutes. Each has one grammar point, about 21 new words (theme words first, then general-purpose words), three handwriting characters with stroke order, and a dialogue for listening, dictation and role-play. The second and fifth lesson of each week add a reading task in the exam formats. Day 7 is a weekly test with two sentence tasks and a short essay.","Two full mock exams in the new 70-item format, writing workshops, speaking mocks, and review days built from your error notebook."],"examRows":"<tr><td>Listening<\/td><td>about 20 min<\/td><td>Part 1: 14 dialogues (seven of two lines, seven of four lines), one question each. Part 2: 18 questions on short talks, first one question per talk, then two or three.<\/td><td>32<\/td><\/tr><tr><td>Reading<\/td><td>30 min<\/td><td>Part 1: choose the word for a gap, in sentences and in dialogues (10). Part 2: short texts with one question, then longer ones with two or three (15). Part 3: put the missing clauses back into a passage (7).<\/td><td>32<\/td><\/tr><tr><td>Writing<\/td><td>25 min<\/td><td>Part 1: write a sentence with each of five given words. Part 2: a short essay of at least 80 characters.<\/td><td>6<\/td><\/tr><tr><td>Speaking (separate test)<\/td><td>about 20 min<\/td><td>Retell two recordings, talk about one picture, answer two questions.<\/td><td>5<\/td><\/tr>","examNote":"The number of items in each part follows the official structure and sample paper published for the new HSK 4; how the items are split inside a part (for example 8 + 7 in Reading Part 2) is my estimate. Listening uses your device's Chinese voice, played once; it is clearer and more even than the real recording. In Reading Part 1 the real paper gives one shared word bank for five gaps, while here each gap has its own four options. Writing is marked by you against the model answers, or by Claude if that is available. Scores are scaled to 300.","rdn":{"m":"a mixed set: one gap and two short texts","i":"a passage with missing clauses (Reading Part 3)","a":"a text with two questions (Reading Part 2)"},"prw":"Three sentence-writing tasks with model answers.","hw":true,"wkE":true,"spt":[40,120,120],"hwtxt":"The new HSK 4 adds ,["困","入","血"],["烦","举","况","麻"],["将","美"],["否","及","拉","态"],["俩","误","性"],["连","普","省"],["父","弄","庭"],["另","青"],["确","兄","约"],["科","取"],["基","扔"],["程","深","堂"],["断","例"],["论","熟","讨","研"],["利","顺","谈","专"],["厂","随","台","夜"],["反","划","停","验"],["任","推","温","象"],["虎","江","原"],["晨","土","无","永"],["技","术","之"],["克","压"],["际","济","由","止"],["民","社","许"],["队","式","增"],["观","京","篇","与"],["输","云","指","众"],["品","章","志","装"]],"g":"##1\n@不仅……而且/还…… · 不光|Not only… but also…|S + 不仅/不光 + A，而且/还/也 + B\n不仅 is the more formal twin of 不但; 不光 is spoken. The second clause adds something further with 而且, 还 or 也. With one subject, it stands before 不仅; with two subjects, each follows its own connective: 不仅他来了，而且他父母也来了.\n!The second clause must go further than the first; do not use it for two unrelated facts.\n>网上办理不仅方便，【而且|否则|然而|于是】不用排队。=Doing it online is not only convenient; you also don't have to queue.\n>这家银行不光可以存钱，【还|却|倒|并】可以办理签证费。=At this bank you can not only deposit money but also pay visa fees.\n~他【不仅|尽管|既然|即使】会说普通话，而且说得非常流利。=He not only speaks Mandarin, he speaks it very fluently.\n##2\n@既……又/也……|Both… and…|S + 既 + A + 又/也 + B\nTwo qualities or actions of the same kind that hold at once: 既安全又方便. It is a little more formal than 又…又…. The two parts should match in structure and length.\n!既然 (since) is a different word; see lesson 5.\n>用手机支付既安全【又|而|却|并且】方便。=Paying by phone is both safe and convenient.\n>他【既|即|尽|仅】是我的老师，也是我的朋友。=He is both my teacher and my friend.\n~这个小区既干净又【安静|安静的|很安静|安静了】，就是房租有点儿贵。=This estate is both clean and quiet; it's just that the rent is a bit high.\n##3\n@尽管……但是/仍然/还是……|Although… still…|尽管 + fact，(但是/可是) + S + 仍然/还是/却 + …\n尽管 concedes a real fact, like 虽然 but a little stronger. The main clause usually has 仍然, 还是 or 却.\n!尽管 is about facts. For an imagined case (\"even if\"), use 即使.\n>【尽管|即使|既然|要是】排了一个小时的队，他仍然没有办好证件。=Although he queued for an hour, he still didn't get his papers sorted.\n>尽管费用不低，报名的人【还是|于是|否则|因此】很多。=Although the fee isn't low, there are still many applicants.\n~尽管下着大雨，快递员【却|就|才|而且】准时把东西送到了。=Although it was pouring, the courier still delivered on time.\n##4\n@即使……也……|Even if…|即使 + supposed case，S + 也 + result\n即使 puts forward a case that is not (or not yet) true and says the result would be the same: 即使下雨，我也去.\n!尽管他很忙 = he is in fact busy; 即使他很忙 = even supposing he is busy.\n>【即使|尽管|由于|既然】明天不上班，我也得早起去使馆。=Even if I'm not working tomorrow, I still have to get up early to go to the embassy.\n>即使你不同意，我【也|就|却|才】要申请。=Even if you don't agree, I'm going to apply.\n~即使是免费的，我也不想【要|要了|要过|要着】。=Even if it were free, I wouldn't want it.\n##5\n@既然……就……|Since (it is the case that)…|既然 + accepted fact，(S) + 就/那么 + conclusion or suggestion\n既然 takes something both speakers already accept and draws a consequence from it: 既然来了，就多住几天吧.\n!因为 explains a cause to someone who may not know it; 既然 starts from what is already known.\n>【既然|即使|尽管|不管】你已经到了，就在门口等我一下吧。=Since you're already here, wait for me at the entrance for a moment.\n>既然线上可以办理，我们【就|却|而|仍】不用去现场了。=Since it can be done online, we needn't go there in person.\n~既然你没带现金，【那么|然而|否则|不过】就用手机支付吧。=Since you didn't bring cash, pay by phone then.\n##6\n@不管/无论……都/也……|No matter…|不管/无论 + question word or A 还是 B，S + 都/也 + …\nThe first clause must contain a choice: a question word (谁, 什么, 怎么, 多…) or an alternative (A 还是 B, verb 不 verb). The result is the same in every case. 无论 is more formal than 不管.\n!不管天气不好 ✗ (no choice). Say 不管天气好不好 or 不管天气怎么样.\n>【不管|尽管|既然|由于】你什么时候来，我都在家。=No matter when you come, I'll be at home.\n>无论多忙，他每天【都|却|就|才】给父母发一条信息。=However busy he is, he sends his parents a message every day.\n~不管坐地铁【还是|或者|而且|并且】坐公交车，都要先过安检。=Whether you take the metro or the bus, you have to go through security first.\n##7\n@要是……（的话），就…… · 否则|If; otherwise|要是 + condition (+ 的话)，S + 就 + result · …，否则 + bad result\n要是 is the everyday spoken \"if\". 否则 = \"otherwise, if not\": it opens the second clause and states what happens when the first is not fulfilled.\n!否则 already contains the negative condition: 快走吧，否则要迟到了.\n>【要是|尽管|不仅|无论】密码忘了的话，就只能重新申请了。=If you've forgotten the password, you can only apply again.\n>请带上身份证，【否则|于是|因此|并且】不能办理。=Please bring your ID card; otherwise it can't be processed.\n~要是你有时间，【就|却|仍|倒】帮我复印一下这份文件吧。=If you have time, photocopy this document for me.\n##8\n@由于……，因此/所以……|Owing to… therefore…|由于 + cause，(因此/所以) + result\n由于 is a more formal 因为 and always comes first; 因此 (\"for this reason\") sums up the result. 由于 can also take a noun: 由于天气的原因.\n!因为 can follow the result (…，因为…); 由于 normally cannot.\n>【由于|为了|按照|通过】网络信号不好，视频发送失败了。=Because the signal was poor, the video failed to send.\n>他平时很少运动，【因此|否则|然而|尽管】体检的结果不太好。=He rarely exercises, so his check-up results weren't very good.\n~由于报名的人太多，学校【决定|决定了着|在决定过|决定地】推迟考试。=Because so many people have signed up, the school has decided to postpone the exam.\n##9\n@于是 · 结果|And so; as a result|…，于是 + next action · …，结果 + (often unexpected) outcome\n于是 links an event to the action it naturally led to: 外面下雨了，于是我们没出去. 结果 introduces how things turned out, often not as hoped: 他没带伞，结果感冒了.\n!于是 narrates what someone did next; it does not state a logical reason the way 所以 does.\n>餐厅里人太多了，【于是|否则|尽管|即使】我们决定点外卖。=The restaurant was too crowded, so we decided to order a takeaway.\n>他吃了太多辣的东西，【结果|于是乎|否则|如果】肚子疼了一晚上。=He ate too much spicy food and ended up with a stomach-ache all night.\n~我们等了半个小时菜还没上，【于是|然而|既然|不管】就走了。=We waited half an hour and the food still hadn't come, so we left.\n##10\n@然而 · 却|However; yet|…，然而 + contrast · S + 却 + contrast\n然而 is a written \"however\" that opens the clause. 却 is an adverb and must come after the subject: 我很着急，他却一点儿也不急. The two often appear together.\n!却他不同意 ✗ → 他却不同意.\n>这道菜看起来很普通，味道【却|而且|于是|并且】非常好。=This dish looks ordinary, yet it tastes very good.\n>大家都以为他会拒绝，【然而|因此|否则|既然】他同意了。=Everyone thought he would refuse; however, he agreed.\n~葡萄酒很贵，他【却|也却|然而|可是却地】一下子买了三瓶。=The wine was expensive, yet he bought three bottles at once.\n##11\n@而|And; whereas|adjective + 而 + adjective · clause，而 + contrasting clause\n而 joins two adjectives that go together (简单而有效) or contrasts two parallel clauses (北方人爱吃面，而南方人爱吃米饭). It is typical of written style.\n!而 never joins nouns; use 和 or 与 for those.\n>南方菜比较甜，【而|和|与|并】北方菜比较咸。=Southern food is rather sweet, whereas northern food is rather salty.\n>这家小吃店的汤新鲜【而|与|跟|及】便宜。=This snack bar's soup is fresh and cheap.\n~哥哥喜欢喝白酒，【而|却地|和|于是】弟弟只喝果汁。=The older brother likes baijiu, whereas the younger one drinks only juice.\n##12\n@并且 · 此外 · 另外 · 再说|Adding a point|…，并且 + … · 此外/另外，… · …，再说 + further reason\n并且 = \"and, moreover\" between two verbs or clauses. 此外 (formal) and 另外 = \"in addition\". 再说 adds one more reason to an argument: 太晚了，再说外面还下着雨.\n!另外 can also be an adjective or adverb: 另外一个人, 另外买一个.\n>他会做中餐，【并且|否则|然而|尽管】做得非常好。=He can cook Chinese food, and he does it very well.\n>今天太累了，【再说|于是|因此|即使】餐厅也快关门了，我们明天再去吧。=I'm too tired today, and besides the restaurant is about to close; let's go tomorrow.\n~我们要买水果和饮料，【另外|否则|然而|既然】还需要一些零食。=We need to buy fruit and drinks; in addition, we need some snacks.\n##13\n@首先……，其次……，最后…… · 接着|Putting points in order|首先 + first point，其次 + second point，(最后 + last point) · …，接着 + next step\n首先…其次… orders arguments or reasons; 先…接着/然后… orders actions in time.\n!其次 means \"second in importance or order\", not \"next time\".\n>选旅馆，【首先|接着|于是|其次】要看安全，其次要看交通是否方便。=In choosing a hotel, first look at safety, and second at whether transport is convenient.\n>导游先介绍了景区的历史，【接着|首先|否则|其次】带我们参观了村子。=The guide first introduced the scenic area's history and then showed us round the village.\n~我想先去北部看风景，【接着|首先|却|其次地】再去南部的农村。=I want to see the scenery in the north first and then go on to the countryside in the south.\n##14\n@不是……而是…… · 不是……就是……|Not A but B; either A or B|不是 + A，而是 + B · 不是 + A，就是 + B\n不是…而是… corrects: A is wrong, B is right. 不是…就是… says it must be one of the two: 他周末不是加班，就是睡觉.\n!The two patterns look alike but mean opposite things about A.\n>我们不是坐高铁去，【而是|就是|还是|或是】开车去。=We're not going by high-speed train; we're driving.\n>这条公路上不是堵车，【就是|而是|还是|但是】修路。=On this road there's either a traffic jam or roadworks.\n~他不是不想去旅行，【而是|就是|于是|可是地】没有时间。=It's not that he doesn't want to travel; he just has no time.\n##15\n@连……都/也……|Even…|连 + extreme example + 都/也 + verb\n连 picks out an extreme case to show how far something goes: 连小孩子都知道 (even a child knows). The thing after 连 can be the subject, the object (moved in front of the verb) or a verb.\n!The object comes before the verb: 他连一口水也没喝.\n>这个景点太有名了，【连|把|被|对】外国游客都知道。=This sight is so famous that even foreign tourists know it.\n>他走得太急，连背包【也|就|才|却】忘了拿。=He left in such a hurry that he even forgot his backpack.\n~路上堵车堵得很厉害，我们连一公里【都没|没都|都不要|也别】走完。=The traffic was so bad that we didn't even cover one kilometre.\n##16\n@难道……吗？|Surely not…?|难道 + S + … + 吗？\nA rhetorical question expressing disbelief or reproach: 难道你不知道吗？ (don't tell me you didn't know!). The speaker believes the opposite of what the question literally asks.\n!难道 stands before or after the subject and needs 吗 (or 不成) at the end.\n>这么便宜的价钱，【难道|到底|究竟|也许】你还觉得贵吗？=At such a low price, do you really still think it's expensive?\n>难道你忘了今天是妈妈的生日【吗|呢|吧|啊呢】？=Have you really forgotten that today is Mum's birthday?\n~他已经解释了三遍，难道你还【不明白|明白|很明白|明白着】吗？=He has explained it three times already; can you really still not understand?\n##17\n@到底 · 究竟|\"…on earth?\"; in the end|S + 到底/究竟 + question · 到底 + verb (finally)\nIn a question with a question word or a choice, 到底 and 究竟 press for a definite answer: 你到底买不买？ 究竟 is more formal. 到底 can also mean \"in the end, after all\": 他到底还是来了.\n!They cannot be used in 吗 questions: 你到底去吗 ✗ → 你到底去不去？\n>这件毛衣你【到底|难道|也许|恐怕】买还是不买？=Are you buying this sweater or not?\n>这两个牌子的质量【究竟|竟然|毕竟|难道】有什么区别？=What exactly is the difference in quality between these two brands?\n~我找了半天，【到底|究竟地|难道|千万】还是没找到那把钥匙。=I searched for ages and in the end still couldn't find that key.\n##18\n@竟然 · 原来|To one's surprise; so that's it|S + 竟然 + unexpected fact · 原来 + discovered fact\n竟然 marks something the speaker did not expect: 他竟然不知道. 原来 at the start of a clause reveals the explanation one has just discovered: 原来是你！ It also means \"originally\": 我原来住在北京.\n!竟然 follows the subject; 原来 (discovery) usually comes before it.\n>这副眼镜这么贵，他【竟然|原来|到底|难道】一下子买了两副。=These glasses are so dear, yet he actually bought two pairs at once.\n>我以为外套丢了，【原来|竟然|究竟|否则】是忘在办公室了。=I thought I'd lost my jacket; it turns out I'd left it at the office.\n~打了三折以后，这双皮鞋【竟然|原来地|到底|千万】比袜子还便宜。=After a 70% discount these leather shoes were, amazingly, cheaper than socks.\n##19\n@并 + 不/没|\"Actually not\"|S + 并 + 不/没(有) + verb/adjective\n并 before a negative stresses that the facts differ from what someone thinks or expects: 这个药并不苦 (this medicine isn't bitter at all, whatever you imagine).\n!并 here is not \"and\"; it only strengthens 不 or 没.\n>打针【并|而|却地|也并地】不疼，你别害怕。=An injection doesn't actually hurt; don't be afraid.\n>大夫说我的胳膊并【没有|不有|别|非常】受伤，休息几天就好了。=The doctor said my arm isn't actually injured; a few days' rest and it will be fine.\n~健身并不【难|很难|难了|难过了】，难的是每天坚持。=Working out isn't hard in itself; what's hard is keeping it up every day.\n##20\n@千万 · 一定|Whatever you do; be sure to|千万 + 别/不要/要 + verb\n千万 strengthens a warning or a request: 千万别忘了 (whatever you do, don't forget). It is used only when urging someone, mostly in the negative.\n!For one's own determination use 一定: 我一定去, not 我千万去.\n>感冒发烧的时候，【千万|竟然|究竟|难道】别自己随便吃药。=When you have a cold and a fever, whatever you do, don't just take medicine on your own.\n>过马路的时候千万【要|别要|不|没】小心。=Be very careful when you cross the road.\n~手受伤了，【千万|原来|往往|到底】不要用它提重的东西。=Your hand is injured; on no account use it to carry heavy things.\n##21\n@恐怕 · 也许 · 大约|I'm afraid; perhaps; roughly|恐怕 + (unwelcome) guess · 也许 + guess · 大约 + number\n恐怕 gives a guess the speaker is not happy about: 恐怕来不及了. 也许 is a neutral \"perhaps\". 大约 estimates a quantity: 大约三十岁.\n!恐怕 is not the verb \"to be afraid of\"; that is 怕 or 害怕.\n>你的体温这么高，【恐怕|千万|竟然|难道】得去医院看看。=Your temperature is so high; I'm afraid you'll have to go to the hospital.\n>睡一觉，明天【也许|千万|难道|到底】就不头痛了。=Have a sleep; perhaps the headache will be gone tomorrow.\n~从这儿到医院【大约|恐怕地|难道|也许地】要走二十分钟。=It takes about twenty minutes to walk from here to the hospital.\n##22\n@往往 · 从来 + 不/没|Tends to; never|S + 往往 + regular result · S + 从来 + 不/没 + verb (+ 过)\n往往 states what usually happens under certain conditions, based on experience: 粗心的人往往容易出错. Unlike 常常, it cannot describe the future or a wish. 从来不 = never (as a habit); 从来没…过 = have never.\n!我以后往往来 ✗ → 我以后常常来.\n>脾气不好的人【往往|千万|难道|到底】朋友比较少。=People with a bad temper tend to have fewer friends.\n>他从来【不|没有过|别|非】跟别人生气，大家都很尊重他。=He never gets angry with anyone; everybody respects him.\n~我从来没见【过|了|着|的】这么有耐心的老师。=I have never seen such a patient teacher.\n##23\n@仍然 · 仍|Still (unchanged)|S + 仍然/仍 + verb/adjective\n仍然 says a situation continues unchanged in spite of something; it is more formal than 还是. 仍 is the short written form.\n!Often paired with 尽管 or 虽然 in the first clause.\n>虽然失败了很多次，他【仍然|竟然|忽然|既然】很有信心。=Although he has failed many times, he is still full of confidence.\n>事情过去很多年了，我【仍|曾|刚|已】记得他当时激动的样子。=Many years have passed, and I still remember how excited he was then.\n~道歉以后，她的心情仍然【不太好|不太好了着|好不太|太不好地】。=After the apology, her mood was still not great.\n##24\n@稍微|Slightly|稍微 + adjective/verb + 一点儿/一下/一些/一会儿\n稍微 softens a request or comparison and needs a small-quantity word after the verb or adjective: 稍微等一下, 稍微便宜一点儿.\n!稍微大 ✗ → 稍微大一点儿.\n>你说话的声音能不能【稍微|千万|竟然|往往】小一点儿？=Could you speak a little more quietly?\n>请您稍微等【一会儿|很久|时间|几次过】，经理马上就来。=Please wait a moment; the manager will be right here.\n~他最近压力很大，你对他【稍微|仍然|难道|究竟】耐心一些吧。=He has been under a lot of pressure lately; be a little more patient with him.\n##25\n@尤其 · 十分 · 更加|Especially; very; even more|…，尤其(是) + the outstanding case · 十分 + adjective · 更加 + adjective\n尤其 singles out one item from what was just said: 我喜欢水果，尤其是葡萄. 十分 is a written \"very\" and cannot follow 不 except in 不十分. 更加 is a two-syllable 更, used before two-syllable words.\n!尤其 comes in the second clause, after the general statement.\n>他对人很友好，【尤其|否则|更加|十分】是对老人和孩子。=He is friendly to everyone, especially to old people and children.\n>听到这个消息，大家都【十分|尤其|千万|稍微】激动。=Hearing the news, everyone was very excited.\n~原谅了他以后，我的心情【更加|尤其|十分地很|稍微】轻松了。=After forgiving him, I felt even more relaxed.\n##26\n@A 不如 B · 跟……相比|Not as good as; compared with|A + 不如 + B (+ adjective) · 跟/和 + B + 相比，A + …\nA 不如 B = A is not as good as B; an adjective can say in what way: 坐车不如走路快. 跟…相比 sets up a comparison before the statement.\n!不如 already means \"worse\", so the adjective after it is always the positive quality.\n>在这儿租房【不如|没比|不跟|比不】在郊区便宜。=Renting here is not as cheap as in the suburbs.\n>跟去年【相比|比较了|一样地|不如】，今年的房租高了不少。=Compared with last year, this year's rent is a good deal higher.\n~每天坐两个小时车太累了，【不如|不比|相比|没有】搬到公司附近住。=Two hours on the bus every day is too tiring; you'd do better to move near the office.\n##27\n@倍 · 百分之 · 左右|Multiples, percentages, estimates|number + 倍 · 百分之 + number · number + 左右 · 大约 + number\nA 是 B 的三倍 = A is three times B. 增加了一倍 = doubled. Percentages are read 百分之…: 百分之二十 (20%). 左右 after a number = \"about\": 三十岁左右.\n!增加了两倍 means it is now three times the original; 增加到两倍 means it is now twice.\n>这套房子的客厅是我家的两【倍|份|顿|趟】大。=The living room of this flat is twice the size of ours.\n>我们小区百分【之|的|在|于】八十的住户都是年轻人。=Eighty per cent of the residents on our estate are young people.\n~他父亲今年六十岁【左右|大约|之间|以内的】。=His father is about sixty this year.\n##28\n@Verb + 掉 / 光 / 满 / 着 / 住|More result complements|verb + 掉 (off, away) · verb + 光 (all gone) · verb + 满 (full) · verb + 着 zháo (achieved) · verb + 住 (fixed)\n扔掉、忘掉 (get rid of); 吃光、用光 (use up completely); 坐满、放满 (fill up); 睡着、找着 (succeed in sleeping, finding); 记住、停住 (hold fast).\n!着 here is read zháo, not zhe: 睡着了 = fell asleep.\n>孩子们把妈妈做的饺子都吃【光|满|住|着】了。=The children ate up all the dumplings Mum made.\n>客厅里坐【满|光|掉|住】了来聚会的亲戚。=The living room was full of relatives who had come to the gathering.\n~这些旧衣服没用了，扔【掉|满|着|住】吧。=These old clothes are no use any more; throw them away.\n##29\n@来得及 / 来不及 · 受不了 · verb + 不起|Fixed potential forms|来得及/来不及 + verb · 受得了/受不了 · verb + 得起/不起\n来得及 = there is still time to; 来不及 = it is too late to. 受不了 = cannot stand. Verb + 不起 = cannot afford (买不起、租不起) or does not deserve (对不起).\n!These have no plain form without 得/不.\n>别着急，现在出发还【来得及|来不及|受不了|买得起】。=Don't worry; if we leave now there's still time.\n>这个地方的房子太贵了，年轻人根本买【不起|不了解|不及|没起】。=Housing here is too expensive; young people simply can't afford to buy.\n~楼上每天晚上弹钢琴，我真【受不了|来不及|买不起|受得】了。=Someone upstairs plays the piano every night; I really can't stand it.\n##30\n@起来 · 下来 · 下去 · 出来 · 过来|Extended meanings of direction complements|verb + 起来 (begin; \"when it comes to…\") · adjective + 下来 (settle into) · verb + 下去 (go on) · verb + 出来 (work out) · verb + 过来 (come round)\n说起来容易，做起来难 (easy to say, hard to do). 安静下来 (quieten down). 说下去 (go on speaking). 想出来 (think up). 醒过来 (come to), 改过来 (put right).\n!起来 marks a beginning or an assessment; 下来 a move towards calm or rest.\n>这个字我以前学过，现在却想不【起来|出来|下来|下去】怎么写了。=I learned this character before, but now I can't recall how to write it.\n>老师一进教室，学生们马上安静【下来|起来|出来|过去】了。=As soon as the teacher came in, the students quietened down.\n~这篇文章看【起来|下来|出去|过来】不难，翻译起来却不容易。=This article doesn't look hard, but translating it isn't easy.\n##31\n@把 A 当作/叫作/分成 B · 将|Treating, naming, dividing|S + 把 + A + 当作/看作/叫作/分成/翻译成 + B · 将 = formal 把\nWith verbs of treating, naming or changing, 把 is required: 我把他当作朋友, 把学生分成三个小组, 把这句话翻译成中文. In written style 将 replaces 把.\n!The second noun (B) is the result and must follow the verb + 作/成.\n>大家都把这位教授【当作|分为了|叫|成】自己的朋友。=Everyone regards this professor as a friend.\n>老师把全班学生分【成|作为|当|叫】四个小组进行讨论。=The teacher divided the whole class into four groups for discussion.\n~请【将|被|由|对】这篇文章翻译成普通话。=Please translate this article into Mandarin.\n##32\n@被 / 叫 / 让 · 由|Passives; \"done by\"|receiver + 被/叫/让 + doer + verb + result · 由 + person + verb\nIn speech 叫 and 让 can replace 被, but then the doer must be named: 杯子让弟弟打破了. 由 introduces the person responsible, with no sense of suffering: 这件事由我负责.\n!被 can drop the doer (被拿走了); 叫 and 让 cannot.\n>我的作文【被|把|由|对】老师当作例子读给大家听了。=My essay was read out to everyone by the teacher as an example.\n>这次的期末考试【由|被|把|让】王教授负责。=Professor Wang is in charge of this end-of-term exam.\n~词典【让|由|把|将】同学借走了，我只好上网查。=My dictionary was borrowed by a classmate, so I had to look it up online.\n##33\n@对于 · 对|Regarding; towards|对于 + topic，… · S + 对 + person/thing + attitude or action\n对于 introduces the thing a comment is about and often opens the sentence: 对于这个问题，大家的看法不同. 对 can do the same and also marks the person an action is aimed at: 他对我笑了笑. Before a person as the target, only 对 is possible.\n!他对于我很好 ✗ → 他对我很好.\n>【对于|关心|按照|通过】学习语法，每个人的看法都不一样。=When it comes to learning grammar, everyone's view is different.\n>教授【对|对于|由|向着】学生的意见非常重视。=The professor takes students' opinions very seriously.\n~对于留学生【来说|说来了|而言的|看来了】，阅读比听力更容易。=For international students, reading is easier than listening.\n##34\n@随着|Along with; as|随着 + noun phrase of change，S + …\n随着 names a development that another change follows: 随着年龄的增长，他越来越像父亲. The phrase after 随着 is a noun phrase, typically \"X 的 + 提高/发展/增加/变化\".\n!Not a full sentence after 随着: 随着经济发展了 ✗ → 随着经济的发展.\n>【随着|按照|由于了|对于】科技的发展，人们的工作方式改变了很多。=With the development of technology, the way people work has changed a great deal.\n>随着收入的【增加|增加了|很增加|增加着】，他的压力也越来越大。=As his income has risen, so has the pressure on him.\n~随着经验的积累，她对这份工作越来越有【信心|信心了地|很信心|信心着】。=As she gains experience, she is more and more confident in this job.\n##35\n@按照 · 通过|According to; by means of|按照 + rule/plan/request，… · 通过 + means/person，…\n按照 says that something is done in line with a rule, a plan or a wish: 按照规定，这里不能停车. 通过 names the means or the intermediary: 通过朋友介绍，我找到了工作. 通过 is also a verb, \"to pass\": 通过考试.\n!根据 gives the basis for a judgment; 按照 gives the standard an action follows.\n>【按照|通过|随着|对于】公司的规定，加班应该有加班费。=According to company rules, overtime should be paid.\n>他是【通过|按照|由于|随着】网上招聘找到这份工作的。=He found this job through online recruitment.\n~请大家按照计划【完成|完成着|很完成|完成地】自己的任务。=Please complete your own tasks according to the plan.\n##36\n@作为 · 成为 · 当|As; to become; to work as|作为 + role，S + … · S + 成为 + noun · S + 当 + job\n作为 names the role from which something is said or done: 作为老师，我应该关心学生. 成为 = to become (a result): 他成为了一名律师. 当 = to serve as a job or role: 她想当记者.\n!作为 needs a noun right after it and usually opens the sentence.\n>【作为|成为|按照|通过】部门的负责人，他每天都很忙。=As head of the department, he is busy every day.\n>经过几年的努力，她终于【成为|作为|当作|变化】了一名优秀的律师。=After several years of hard work, she finally became an excellent lawyer.\n~小时候我想【当|作|成|变】一名警察。=When I was little I wanted to be a policeman.\n##37\n@之前 / 之后 / 之间 / 之中 · 以内|Before, after, between, among, within|time/event + 之前/之后 · A 和 B + 之间 · group + 之中 · number + 以内\n之 is the literary 的. These words are a little more formal than 以前/以后: 毕业之后, 两年之内. 之间 = between two points; 之中 = in the middle of, among. 以内 = within a limit: 三天以内.\n!之间 needs two ends (A 和 B 之间); 中间 can stand alone as a place word.\n>夏天和冬天【之间|之后|以内|之前】的气温差别很大。=The temperature difference between summer and winter is great.\n>请在三天【以内|之间|其中|之中的】完成这份调查。=Please complete this survey within three days.\n~下雨【之前|之间|以内|之中】，天空中的云越来越多。=Before the rain, there were more and more clouds in the sky.\n##38\n@各 · 所有 · 一切 · 任何|Each; all; everything; any|各 + (measure word) + noun · 所有(的) + noun + 都 · 一切 (+ noun) + 都 · 任何 + noun + 都/也\n各 stresses that the members differ: 各种植物, 各地的气候. 所有 = all of a countable set. 一切 = everything, as a whole, also used by itself. 任何 = any whatever, usually with 都 or 也.\n!任何 takes no measure word except 任何(一)个人.\n>这片森林里有【各|每个|所有地|任何的些】种各样的植物。=There are all kinds of plants in this forest.\n>保护环境是【所有|各种的|一切地|任何些】人的责任。=Protecting the environment is everyone's responsibility.\n~在这么低的温度下，【任何|各|所有个|一切个】植物都很难生长。=At such a low temperature, any plant would find it hard to grow.\n##39\n@其中 · 等|Among them; and so on|…，其中 + part · A、B、C + 等 (+ summary noun)\n其中 refers back to a group just mentioned: 我们班有二十个学生，其中八个是女生. 等 closes an incomplete list, often followed by a noun that sums it up: 北京、上海等大城市.\n!其中 cannot follow a noun directly: 学生其中 ✗ → 学生中 / 其中.\n>这个国家有五十多个民族，【其中|其他|另外的|之间】人数最多的是汉族。=This country has more than fifty ethnic groups; the largest of them is the Han.\n>社会、经济、法律【等|各|其中|之中】方面的问题，他都很感兴趣。=He is interested in social, economic, legal and other such questions.\n~全球有一百多个国家参加了这次活动，【其中|其次|此外的|之后】大部分来自亚洲。=More than a hundred countries took part in the event, most of them from Asia.\n##40\n@只好 · 不得不|Have no choice but to|S + 只好/不得不 + verb\nBoth say that circumstances leave only one course. 只好 is neutral and common in speech; 不得不 is stronger, \"be forced to\".\n!The reason usually comes first: 没有公交车了，我只好走回去.\n>最后一班车已经走了，我们【只好|难道|千万|往往】打车回去。=The last bus had already gone, so we had to take a taxi back.\n>因为下大雨，比赛【不得不|不只好|没得不|不能得】推迟到明天。=Because of heavy rain, the match had to be postponed until tomorrow.\n~票卖光了，他【只好|只要|只有地|只是的】在家看电视转播。=The tickets were sold out, so he had to watch the broadcast at home.\n##41\n@差点儿 · 几乎|Nearly|S + 差点儿 + (没) + verb · 几乎 + verb/全部\n差点儿 = something nearly happened. For unwanted events, 差点儿 and 差点儿没 mean the same (it did not happen): 差点儿(没)迟到. For wanted events, 差点儿 = just missed it; 差点儿没 = only just made it. 几乎 = almost: 几乎所有人.\n!我差点儿就赢了 = I nearly won (but did not).\n>路上堵车，我们【差点儿|几乎的|恐怕|往往】没赶上演出。=There was a traffic jam, and we only just made it to the show.\n>他跑得太快，【差点儿|千万|难道|仍然】摔倒。=He was running too fast and nearly fell over.\n~昨天的话剧太精彩了，【几乎|差点|恐怕地|难道】所有观众都站起来鼓掌。=Yesterday's play was so wonderful that almost the whole audience stood up to applaud.\n##42\n@本来 · 原来 · 其实|Originally; so it turns out; in fact|S + 本来 + original state (+ 后来/但是 …) · 原来 + discovery · 其实 + the truth\n本来 = how things were or should have been before a change: 我本来想去，后来没去. 原来 = formerly; or \"so that's how it is\". 其实 corrects an impression: 看起来很难，其实很简单.\n!本来就 + adjective = \"anyway, in the first place\": 他本来就不想去.\n>我【本来|其实地|原来地|究竟】打算周末去看演出，可是票卖完了。=I had planned to go to the show at the weekend, but the tickets sold out.\n>大家都以为他是演员，【其实|本来|竟然|难道】他是一名记者。=Everyone assumed he was an actor; in fact he's a journalist.\n~我说怎么这么热闹，【原来|本来地|其实地|到底】今天有球队来比赛。=I wondered why it was so lively; it turns out a team has come to play today.\n##43\n@顺便 · 故意 · 赶紧|In passing; on purpose; at once|S + 顺便/故意/赶紧 + verb\n顺便 = doing a second thing conveniently while doing the first. 故意 = deliberately. 赶紧 and 赶快 = losing no time.\n!These adverbs follow the subject and precede the verb.\n>你去超市的时候，【顺便|故意|竟然|仍然】帮我买一瓶酸奶吧。=When you go to the supermarket, pick up a yoghurt for me while you're there.\n>对不起，我不是【故意|顺便|赶紧|往往】打扰你的。=Sorry, I didn't mean to disturb you.\n~演出马上开始了，我们【赶紧|顺便|故意|仍然】进去吧。=The show is about to start; let's go in right away.\n##44\n@是否 · 能否|Whether|S + 是否/能否 + verb\n是否 = 是不是, 能否 = 能不能, used in written style and in reported questions: 请告诉我你是否参加. The sentence takes no 吗.\n!If the sentence starts with 能否…, the judgment that follows should cover both sides: 能否成功，取决于… .\n>我想知道这场演唱会【是否|难道|或者|而是】还有票。=I'd like to know whether there are still tickets for this concert.\n>你【能否|是否能不|难道|可否能】把这张图片转发给我？=Could you forward this picture to me?\n~请在周五以前告诉我们你是否【参加|参加吗|参加呢了|不参加吗】。=Please let us know by Friday whether you are taking part.\n##45\n@多么……啊！ · 可……了|Exclamations|多么 + adjective + 啊！ · 可 + adjective + 了\n多么…啊 = how…!, a little literary: 多么美丽的景色啊！ 可…了 is a lively spoken \"really…\": 这部电影可好看了.\n!可…了 already expresses high degree, so no 很 or 非常 is added.\n>你看，这幅画【多么|多少|怎么|什么】漂亮啊！=Look, how beautiful this painting is!\n>昨天的乒乓球比赛【可|多|真的很地|太多】精彩了！=Yesterday's table-tennis match was really exciting!\n~他弹钢琴弹得多么好【啊|吗|呢吗|的吧】！=How well he plays the piano!\n##46\n@当……的时候 · 等到……|When; by the time|当 + clause + 的时候/时，… · 等(到) + clause，…\n当…的时候 sets the time of the main event and is more formal than a bare …的时候. 等到 = \"by the time, when (finally)\": 等到我们到了，演出已经结束了.\n!当 needs 的时候 or 时 to close the clause.\n>【当|等|在于|对】演员走上台的时候，观众都安静了下来。=When the actor walked onto the stage, the audience fell silent.\n>【等到|当到|直到着|等于】球迷们到了，比赛已经开始了。=By the time the fans arrived, the match had already started.\n~当我听到自己获奖的消息【时|时候着|的时|之时候】，激动得说不出话来。=When I heard the news that I had won a prize, I was too excited to speak.\n##47\n@用来 · 用于 · 便于|Used for; to make it easy to|thing + (是) 用来 + verb + 的 · thing + 用于 + noun/verb · …，便于 + verb\n用来 says what something serves to do: 这个盒子是用来放眼镜的. 用于 is its written form. 便于 = \"so as to make it easy to\": 请写清楚地址，便于联系.\n!是…的 often frames 用来: 这是用来做什么的？\n>这个塑料桶是【用来|用于地|便于|为了的】装垃圾的。=This plastic bucket is for putting rubbish in.\n>请留下您的电话号码，【便于|用来|用于|于是】我们跟您联系。=Please leave your phone number so that we can contact you easily.\n~这笔奖金将【用于|用来着|便于|由于】帮助农村的孩子上学。=This prize money will be used to help children in the countryside go to school.\n##48\n@—者 · —性 · —感|Three productive suffixes|verb/adjective + 者 (person) · noun/adjective + 性 (quality) · noun/verb + 感 (feeling)\n者 makes a person: 读者 (reader), 作者 (author), 记者, 获奖者. 性 makes an abstract quality: 重要性, 可能性, 艺术性. 感 names a feeling or sense: 幽默感 (sense of humour), 安全感, 责任感.\n!These suffixes belong to written style and help you guess new words in reading texts.\n>这本小说的作【者|性|感|家员】是一位非常年轻的女作家。=The author of this novel is a very young woman writer.\n>他说话很有幽默【感|性|者|力量】，观众们都很喜欢他。=He has a great sense of humour, and audiences love him.\n~大家都明白这场演出的重要【性|感|者|度的】。=Everyone understands the importance of this performance.\n","kw":"##1 Signing up\nA:您好，我想报名参加下个月的汉语考试，请问怎么办理？=Hello, I'd like to sign up for next month's Chinese exam. How do I go about it?\nB:先填写这张表格，然后去那边交报名费。=First fill in this form, then go over there to pay the fee.\nA:网上不仅可以报名，而且不用排队，为什么大家还来这儿？=Online you can not only register but also skip the queue; why do people still come here?\nB:有的人不会在网上办事。对了，您带证件了吗？=Some people can't manage things online. By the way, have you brought your ID?\nA:带了。办完以后，我想顺便把钱存一下，附近有银行吗？=Yes. When this is done I'd like to deposit some money while I'm out; is there a bank nearby?\n?女的来做什么？|报名参加考试|去银行存钱|办理签证|参加面试\n##2 At the copy shop\nA:你好，我想复印这份文件，一共二十页。=Hello, I'd like to photocopy this document, twenty pages in all.\nB:好的。黑白的一页五毛，彩色的贵一些。=Certainly. Black and white is fifty cents a page; colour costs a bit more.\nA:黑白的就行。费用可以用手机支付吗？=Black and white is fine. Can I pay by phone?\nB:可以。我们这儿既能复印，又能上网发送文件。=Yes. Here you can both make copies and send documents online.\nA:太好了，我正好要把这份材料发送给学校，表格上还要填国籍和地址。=Great, I happen to need to send this material to my school, and the form asks for nationality and address too.\n?女的要复印多少页？|二十页|五页|十二页|两页\n##3 The parcel\nA:喂，你好，我是快递员。您有一个快递，现在在家吗？=Hello, I'm the courier. I have a parcel for you; are you at home now?\nB:不好意思，我正在理发，大约半个小时以后才能回去。=Sorry, I'm at the hairdresser's and won't be back for about half an hour.\nA:那我放在小区门口的快递柜里，一会儿把密码发给您。=Then I'll leave it in the parcel locker at the estate entrance and send you the code in a moment.\nB:好的。尽管有点儿麻烦，但是这样最安全。取快递是免费的吗？=OK. It's a bit of a bother, but that's the safest way. Is collection free?\nA:二十四小时以内免费。有问题您再跟我联系。=Free within twenty-four hours. If there's any problem, get in touch with me.\n?男的现在在做什么？|理发|排队取快递|上班|在家等快递\n##4 Applying for a visa\nA:您好，我想申请去中国的签证，需要准备什么？=Hello, I'd like to apply for a visa for China. What do I need to prepare?\nB:护照、身份证的复印件，还有一份旅行时间表。=Your passport, a copy of your ID card, and a travel itinerary.\nA:即使只去一个星期，也要准备这些吗？=Even if I'm only going for a week, do I still need all that?\nB:是的。您也可以看看使馆网站上的视频，里面介绍得很详细。=Yes. You can also watch the video on the embassy website; it explains everything in detail.\nA:好的。办好以后，可以上门送护照吗？=All right. When it's ready, can the passport be delivered to my door?\n?申请签证不需要什么？|银行卡|护照|身份证复印件|旅行时间表\n##5 Online friends\nA:你在跟谁聊天儿呢？笑得这么开心。=Who are you chatting with? You look so happy.\nB:一个网友。我们是在一个学汉语的网站上认识的。=An online friend. We met on a website for learning ally? I only put in one spoonful of salt.\nB:你用的是大勺吧？不过西红柿很鲜，午餐就吃这个吧。=You used the big spoon, didn't you? Still, the tomatoes are very fresh; let's have this for lunch.\nA:好，我再加点儿水。下次我少放点儿盐。=OK, I'll add some more water. Next time I'll use less salt.\n?男的觉得汤怎么样？|有点儿咸|不太香|不新鲜|太酸了\n##10 An early start\nA:快起床，我们七点要去参观博物馆。=Get up quickly; we're going to visit the museum at seven.\nB:这么早？我还没吃早餐呢。=So early? I haven't had breakfast yet.\nA:背包里有面包和牛奶，路上吃。然而你的相机我没找到。=There's bread and milk in the backpack; eat on the way. I couldn't find your camera, though.\nB:在桌子上。今天车速不能太快，北部山区的路不好走。=It's on the table. We mustn't drive too fast today; the roads in the northern mountains are bad.\nA:知道了。中午我们在那儿吃中餐，我已经订好了。=Got it. We'll have a Chinese lunch there; I've already booked.\n?他们几点出发？|七点|八点|中午|下午\n##11 The village tour\nA:导游，我们今天去哪儿？=Guide, where are we going today?\nB:坐大巴去一个有三百年历史的小村子，那儿的房子古老而漂亮。=We're taking a coach to a little village three hundred years old; the houses there are old and beautiful.\nA:出行的道路好走吗？我有点儿晕车。=Is the road there easy? I get a bit carsick.\nB:路不错，一个小时就到。村口就是景区的出口和入口。=The road is good; it takes just an hour. The village entrance serves as the way in and out of the scenic area.\nA:太好了。我想多拍一些照片。=Great. I want to take lots of photos.\n?他们怎么去那个村子？|坐大巴|坐高铁|骑自行车|走路\n##12 A delayed flight\nA:我们的航班又晚点了，度假的心情都没有了。=Our flight is delayed again; I've lost all my holiday mood.\nB:别着急。这儿的风景不错，并且机场里有免费的咖啡。=Don't fret. The view here is nice, and there's free coffee in the airport.\nA:早知道就开车走高速公路了，才三百公里。=If I'd known, we'd have driven on the motorway; it's only three hundred kilometres.\nB:开车太累。再说，高速上也常常堵车。=Driving is too tiring. Besides, there are often jams on the motorway too.\nA:你说得对。那我去买点儿吃的。=You're right. I'll go and get something to eat then.\n?他们现在在哪儿？|机场|高速公路上|公共汽车上|度假的酒店\n##13 Planning the route\nA:明天我们先去哪个景点？=Which sight shall we visit first tomorrow?\nB:首先去湖边看景色，其次去老街道，最后去山上的景区。=First the lakeside for the scenery, second the old streets, and finally the scenic a   else if(a==='ttstest')speak([{t:'你好，欢迎参加中文水平考试。',v:'f'},{t:'听力考试现在开始，请大家注意。',v:'m'}]);
  else if(a==='switch'){DB.cur=t.dataset.id;save();render();toast('Profile switched.')}
  else if(a==='addp'){DB.cur=null;render()}
  else if(a==='export'){const j=JSON.stringify(DB);if(DL)DL.save({filename:C.doc+'-backup.json',data:j}).then(()=>toast('Backup downloaded.')).catch(()=>toast('The backup was not saved.'));
    else{const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));l.download=C.doc+'-backup.json';l.click()}}
  else if(a==='reset'){if(confirm('Erase all progress and the error notebook for this profile?')){p.done={};p.wrong={};p.act={};p.exams={};save();render();toast('Progress erased.')}}
  else if(a==='delp'){if(confirm(`Delete the profile “${p.name}”?`)){delete DB.profiles[p.id];DB.cur=Object.keys(DB.profiles)[0];save();render()}}
});
document.addEventListener('change',e=>{
  const t=e.target,a=t.dataset.act;
  if(t.dataset.ps){setPS(t);return}
  if(a==='hide')t.closest('.sec').querySelector('.vlist').classList.toggle('hidden',t.checked);
  else if(a==='py'){P().py=t.checked;save();render(true)}
  else if(a==='theme'){P().theme=t.value;save();render(true)}
  else if(a==='rate'){P().rate=+t.value;save()}
  else if(a==='scope'){P().scope=t.value;save()}
  else if(a==='wscore'&&EXR){EXR.ws[+t.dataset.i]=+t.value;drawExamResult()}
  else if(t.id==='imp'&&t.files[0]){const f=new FileReader();f.onload=()=>{try{const d=JSON.parse(f.result);if(!d.profiles||!Object.keys(d.profiles).length)throw 0;DB=d;if(!P())DB.cur=Object.keys(DB.profiles)[0];save();render();toast('Progress restored.')}catch(x){toast('That file is not a backup from this plan.')}};f.readAsText(t.files[0])}
});
document.addEventListener('input',e=>{if(e.target.id==='wtx'){const c=$('#wcnt'),q=QZ.qs[QZ.i],n=zlen(e.target.value);c.textContent=n;c.classList.toggle('low',n<q.min)}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#modal').classList.contains('on')){stopAudio();closeModal()}return}
  const z=QZ;if(!z||z.fin||!z.qs)return;const q=z.qs[z.i],k=q.kind||'mc';
  if(k==='mc'&&q.subs.length===1&&/^[1-4]$/.test(e.key)&&!z.shown){z.ans[z.i]=[+e.key-1];grade()}
  else if(e.key==='Enter'&&e.target.id!=='wtx'){if(z.shown&&k!=='write'){e.preventDefault();nextQ()}else if(k==='dict'){e.preventDefault();const v=$('#din').value;answer(v,dictOk(q,v))}}
});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'){stopAudio();closeModal()}});
addEventListener('hashchange',()=>render());
if(!P()&&Object.keys(DB.profiles).length)DB.cur=Object.keys(DB.profiles)[0];
render();

</script>
</body>
</html>
