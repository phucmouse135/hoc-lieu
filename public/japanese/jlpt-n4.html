>えき へ 行(い)きたい んです が、どう 【行(い)ったら|行(い)くたら|行(い)けたら|行(い)って】 いいです か。=Tôi muốn ra ga, nên đi thế nào ạ?\n##2\n@Thể khả năng|có thể ~|Nhóm 1: hàng い → hàng え + ます (かきます → かけます) ・ Nhóm 2: bỏ ます + られます ・ します → できます, きます → こられます\nDiễn tả năng lực hoặc khả năng. Tân ngữ thường đổi を → が. Động từ khả năng chia như nhóm 2.\n!Nhóm 1 \"e hèm\": i → e. Nhóm 2 thêm られ.\n>わたし は かんじ が 300ぐらい 【読(よ)めます|読(よ)まれます|読(よ)みられます|読(よ)められます】。=Tôi đọc được khoảng 300 chữ Hán.\n>きのう は いそがしくて、ぜんぜん 【ねられませんでした|ねれられませんでした|ねえませんでした|ねらませんでした】。=Hôm qua bận quá nên tôi không ngủ được chút nào.\n@見えます・聞こえます|nhìn thấy / nghe thấy (tự nhiên)|N が 見えます / 聞こえます\nHình ảnh, âm thanh tự lọt vào mắt, tai, không do chủ ý. Khác 見られます / 聞けます (có điều kiện để xem, nghe).\n>へや の まど から 山(やま) 【が 見(み)えます|を 見(み)えます|が 見(み)ます|を 見(み)られます】。=Từ cửa sổ phòng nhìn thấy núi.\n>となり の へや から おんがく が 【聞(き)こえます|聞(き)けます|聞(き)きます|聞(き)かれます】。=Nghe thấy tiếng nhạc từ phòng bên.\n##3\n@〜し、〜し|vừa ~ vừa ~ (kể nhiều lý do, đặc điểm)|thể thông thường + し、thể thông thường + し、〜\nLiệt kê từ hai lý do hoặc đặc điểm trở lên, ngụ ý còn nữa. Thường đi với も.\n!し nối các \"điểm cộng\" (hoặc điểm trừ) cùng chiều.\n>この みせ は やすい 【し|て|と|や】、おいしい し、いつも 行(い)きます。=Quán này vừa rẻ vừa ngon nên tôi hay đến.\n>きょう は 雨(あめ) だ し、お金(かね) も 【ない し|ない て|なくて し|ありません と】、うち に います。=Hôm nay vừa mưa vừa không có tiền nên tôi ở nhà.\n##4\n@〜て しまいます|làm xong hẳn; lỡ ~ mất|V て しまいます / しまいました\n(1) Hoàn thành trọn vẹn. (2) Tiếc nuối vì việc lỡ xảy ra. Khi nói: 〜ちゃう / 〜じゃう.\n!しまう = \"xong mất rồi\": có thể là nhẹ nhõm, có thể là tiếc.\n>しゅくだい は もう ぜんぶ 【やって しまいました|やって ありました|やって おきます|やりて しまいました】。=Bài tập tôi đã làm xong hết rồi.\n>電車(でんしゃ) に かさ を 【わすれて しまいました|わすれて おきました|わすれて みました|わすれて ありました】。=Tôi lỡ để quên ô trên tàu mất rồi.\n##5\n@〜て あります|(đã được) ~ sẵn|N が + tha động từ て あります\nTrạng thái còn lại do ai đó cố ý làm. Khác 〜て います (tự động từ, chỉ tả trạng thái).\n!Có \"bàn tay con người\" phía sau thì dùng あります.\n>かべ に カレンダー が 【かけて あります|かけて います|かかって あります|かけて おきます】。=Trên tường có treo lịch.\n>テーブル の 上(うえ) に はな が 【かざって|かざり|かざった|かざる】 あります。=Trên bàn có bày hoa.\n@〜て おきます|làm sẵn; cứ để nguyên|V て おきます\n(1) Chuẩn bị trước cho mục đích nào đó. (2) Giữ nguyên trạng thái. Khi nói: 〜とく.\n>りょこう の まえに、ホテル を よやく 【して おきます|して あります|して しまいます|して います】。=Trước chuyến du lịch tôi đặt khách sạn sẵn.\n>あつい です から、まど を あけて 【おいて|あって|しまって|みて】 ください。=Trời nóng nên cứ để cửa sổ mở nhé.\n##6\n@Thể ý chí|~ thôi; hãy cùng ~|Nhóm 1: hàng い → hàng お + う (いきます → いこう) ・ Nhóm 2: bỏ ます + よう ・ しよう, こよう\nDạng thân mật của 〜ましょう. Dùng khi rủ rê bạn bè hoặc tự nhủ.\n>つかれた ね。ちょっと 【休(やす)もう|休(やす)みよう|休(やす)まう|休(やす)めよう】。=Mệt nhỉ. Nghỉ một chút thôi.\n>もう おそい から、そろそろ 【ねよう|ねろう|ねおう|ねりよう】。=Muộn rồi, đi ngủ thôi.\n@〜ようと 思って います|đang định ~|V-ý chí + と 思って います\nDự định đã nghĩ từ trước và vẫn đang giữ. 〜と 思います là vừa mới nghĩ ra.\n!Chắc chắn dần: 〜ようと 思う < 〜つもり < 〜予定.\n>来年(らいねん) 日本(にほん) へ りゅうがく 【しよう|する|しろう|して】 と 思(おも)って います。=Tôi đang định năm sau du học Nhật.\n>なつやすみ に くに へ 【かえろう と|かえよう と|かえる と|かえろう を】 思(おも)って います。=Tôi đang định nghỉ hè về nước.\n##7\n@〜ことに します|quyết định ~|V-từ điển / V ない + ことに します\nTự mình quyết định. Quyết định đã thành thói quen: 〜ことに して います. Lịch đã lên: 〜よていです.\n!に します là \"tôi chọn\"; đối lập với に なります là \"được quyết định\".\n>からだ に わるい から、たばこ を 【やめる こと|やめた こと|やめて こと|やめよう こと】 に しました。=Vì có hại cho sức khoẻ nên tôi quyết định bỏ thuốc.\n>あした から 毎日(まいにち) 30分(ぷん) あるく こと 【に|を|が|で】 します。=Từ mai tôi quyết định mỗi ngày đi bộ 30 phút.\n##8\n@〜かも しれません|có lẽ ~ (không chắc)|thể thông thường + かも しれません (N, A-な bỏ だ)\nKhả năng khoảng một nửa, thấp hơn でしょう.\n>ごご から 雨(あめ) が 【ふる|ふり|ふって|ふろう】 かも しれません。=Từ chiều có lẽ trời mưa.\n>あの 人(ひと) は 【びょうき|びょうきだ|びょうきな|びょうきの】 かも しれません。=Người kia có lẽ bị ốm.\n@〜はずです|chắc chắn là ~ (có căn cứ)|V-thường / A-い / A-な + な / N + の + はずです\nSuy đoán chắc chắn dựa trên căn cứ. Phủ định mạnh: 〜はずが ありません.\n!はず = \"theo lý thì phải thế\".\n>田中(たなか)さん は きのう 出(で)かけました から、うち に 【いない|いません|いなくて|いよう】 はず です。=Anh Tanaka hôm qua đi vắng rồi nên chắc chắn không có nhà.\n>かれ は 10年(ねん) 日本(にほん) に います から、日本語(にほんご) が 【じょうずな|じょうずだ|じょうずの|じょうず】 はず です。=Anh ấy ở Nhật 10 năm nên chắc chắn giỏi tiếng Nhật.\n##9\n@Thể mệnh lệnh và cấm đoán|hãy ~! / cấm ~!|Mệnh lệnh: nhóm 1 hàng い → hàng え (いけ), nhóm 2 + ろ (たべろ), しろ, こい ・ Cấm: V-từ điển + な ・ Nhẹ hơn: V (bỏ ます) + なさい\nDùng trong biển báo, khẩu hiệu, cổ vũ, hoặc người trên nói với người dưới. なさい là cha mẹ, thầy cô nhắc nhở.\n!な sau thể từ điển = cấm. Đừng nhầm với な của tính từ.\n>あぶない！ 【とまれ|とまる|とまろ|とまりろ】！=Nguy hiểm! Dừng lại!\n>ここ に ごみ を 【すてる な|すてろ な|すて な|すてない な】。=Cấm vứt rác ở đây.\n##10\n@〜とおりに|theo đúng như ~|V-từ điển / V た + とおりに ・ N の + とおりに\nLàm việc gì đúng theo điều đã thấy, đã nghe, đã học.\n>わたし が 【言(い)う|言(い)い|言(い)って|言(い)おう】 とおりに、書(か)いて ください。=Hãy viết đúng như tôi nói.\n>せつめいしょ 【の|に|を|が】 とおりに、くみたてました。=Tôi đã lắp theo đúng sách hướng dẫn.\n@〜ないで・〜ずに|mà không ~|V ないで、〜 ・ V ず に、〜 (しない → せずに)\nLàm việc sau trong trạng thái không làm việc trước. ずに là văn viết.\n!〜なくて là \"vì không\"; 〜ないで là \"mà không\".\n>けさ は あさごはん を 【食(た)べないで|食(た)べなくて|食(た)べないて|食(た)べずで】 かいしゃ へ 行(い)きました。=Sáng nay tôi đi làm mà không ăn sáng.\n>じしょ を 【つかわずに|つかわなく に|つかいずに|つかわない に】 読(よ)んで ください。=Hãy đọc mà không dùng từ điển.\n##11\n@〜ば|nếu ~|Động từ: hàng い → hàng え + ば (いけば) ・ A-い → ければ ・ ない → なければ\nĐiều kiện cần để vế sau thành hiện thực. Vế sau thường không phải việc đã xảy ra.\n!いい → よければ. Danh từ, tính từ な dùng なら.\n>この ボタン を 【おせば|おすば|おしば|おせれば】、ドア が あきます。=Nếu ấn nút này thì cửa mở.\n>【やすければ|やすいければ|やすくば|やすけば】、買(か)います。=Nếu rẻ thì tôi mua.\n@〜なら|nếu là ~ thì|N / thể thông thường + なら\nNhận lại chủ đề người kia vừa nói rồi đưa lời khuyên, ý kiến.\n>A「おんせん に 行(い)きたい んです が。」 B「おんせん 【なら|ば|たら|と】、はこね が いいです よ。」=A: Tôi muốn đi suối nước nóng. B: Nếu là suối nước nóng thì Hakone được đấy.\n>ひま 【なら|ければ|だら|と】、てつだって ください。=Nếu rảnh thì giúp tôi với.\n##12\n@〜ば 〜ほど|càng ~ càng ~|V ば + V-từ điển + ほど ・ A ければ + A い + ほど\nVế trước tăng thì vế sau tăng theo.\n>日本語(にほんご) は 【べんきょう すれば|べんきょう したら|べんきょう して|べんきょう すると】 する ほど、おもしろく なります。=Tiếng Nhật càng học càng thú vị.\n>へや は ひろければ 【ひろい ほど|ひろく ほど|ひろければ ほど|ひろい より】 いいです。=Phòng càng rộng càng tốt.\n@〜ように (mục đích)|để (có thể) ~|V-khả năng / V ない / tự động từ + ように、〜\nHướng tới một trạng thái không điều khiển trực tiếp được. Hành động chủ động thì dùng ために.\n!ように đi với \"được, hiểu, thấy, không\"; ために đi với động từ ý chí.\n>みんな に 聞(き)こえる 【ように|ために|のに|ほうが】、大(おお)きい こえ で 話(はな)します。=Tôi nói to để mọi người nghe thấy.\n>わすれない 【ように|ために|ような|ことに】、メモ して ください。=Hãy ghi chú lại để không quên.\n##13\n@〜ように なります|trở nên (làm được) ~|V-khả năng / V-từ điển + ように なります ・ V なく なります\nThay đổi về năng lực hay thói quen qua thời gian.\n>毎日(まいにち) れんしゅう して、やっと 【およげる|およぐ こと|およいで|およごう】 ように なりました。=Luyện mỗi ngày, cuối cùng tôi đã bơi được.\n>さいきん、あさ はやく 【おきる ように|おきる ことに|おきて ように|おきよう と】 なりました。=Dạo này tôi đã dậy sớm được.\n@〜ように します|cố gắng ~|V-từ điển / V ない + ように します\nCố gắng để việc gì thành thói quen. Nhờ người khác: 〜ように して ください.\n>からだ の ために、毎日(まいにち) やさい を 食(た)べる 【ように して|ように なって|ことに なって|ために して】 います。=Vì sức khoẻ, tôi đang cố gắng ăn rau mỗi ngày.\n>あした は ぜったいに 【おくれない|おくれなく|おくれず|おくれよう】 ように して ください。=Ngày mai nhất định cố gắng đừng đến muộn.\n##14\n@Thể bị động|bị ~; được ~|Nhóm 1: hàng い → hàng あ + れます (しかられます) ・ Nhóm 2: + られます ・ されます, こられます ・ người làm + に\n(1) Bị, được ai làm gì. (2) Bị làm phiền (あめ に ふられました). (3) Sự việc khách quan, không nêu người làm; tác giả dùng に よって.\n!Người gây ra hành động luôn đứng trước に.\n>わたし は 先生(せんせい) 【に|を|が|で】 ほめられました。=Tôi được thầy khen.\n>電車(でんしゃ) の 中(なか) で 足(あし) を 【ふまれました|ふみられました|ふませました|ふまられました】。=Trên tàu tôi bị giẫm vào chân.\n>この おてら は 500年(ねん) まえ に 【たてられました|たてさせました|たてました|たたれました】。=Ngôi chùa này được xây 500 năm trước.\n##15\n@〜のは・〜のが・〜のを|việc ~ (danh từ hoá)|V-thường + の + は / が / を\nの biến cả mệnh đề thành danh từ: việc ~ thì…, thích việc ~, quên việc ~. Sau の を hay gặp わすれました, しって います, 見ました.\n>ひとり で りょこう する 【の は|の を|こと に|の で】 たのしい です。=Việc đi du lịch một mình thì vui.\n>かぎ を かける 【の を|の は|の に|こと が】 わすれました。=Tôi đã quên khoá cửa.\n##16\n@〜て・〜くて・〜で (nguyên nhân)|vì ~ nên (cảm xúc, không thể)|V て / V なくて / A くて / A-な で + cảm xúc, trạng thái\nVế sau là cảm xúc hoặc việc ngoài ý muốn; không dùng với mệnh lệnh, rủ rê.\n>てがみ を 【もらって|もらう|もらったら|もらえば】、うれしかった です。=Nhận được thư, tôi rất vui.\n>かんじ が 【わからなくて|わからないで|わからずに|わかって】、こまりました。=Vì không hiểu chữ Hán nên tôi gặp khó.\n@〜のに|mặc dù ~ vậy mà|thể thông thường + のに (N, A-な + な + のに)\nKết quả trái với mong đợi, mang sắc thái bất mãn hoặc ngạc nhiên.\n!のに có mùi \"tiếc, bực\"; が và けど thì trung tính.\n>くすり を 【のんだ のに|のんだ ので|のんで から|のんだ ように】、ねつ が 下(さ)がりません。=Uống thuốc rồi mà vẫn không hạ sốt.\n>きょう は 日曜日(にちようび) 【な のに|だ のに|の のに|のに】、はたらかなければ なりません。=Hôm nay là Chủ nhật vậy mà vẫn phải làm việc.\n##17\n@〜か・〜か どうか|câu hỏi lồng trong câu|từ để hỏi + thể thông thường + か ・ thể thông thường + か どうか\nCó từ để hỏi thì dùng か; câu hỏi có/không thì dùng か どうか. Danh từ và tính từ な bỏ だ.\n>かいぎ が 何時(なんじ) に 【はじまる か|はじまる か どうか|はじまります か を|はじまる と】 しって います か。=Anh có biết cuộc họp bắt đầu lúc mấy giờ không?\n>その 話(はなし) が ほんとう 【か どうか|だ か どうか|か どう|どうか か】 わかりません。=Tôi không biết chuyện đó có thật hay không.\n@〜て みます|thử ~|V て みます\nLàm thử để biết kết quả.\n>この くつ を 【はいて みて|はいて おいて|はいて しまって|はいて あって】 も いいです か。=Tôi đi thử đôi giày này được không?\n>おいしい か どうか、ひとつ 食(た)べて 【みます|おきます|あります|います】。=Tôi sẽ ăn thử một cái xem có ngon không.\n##18\n@〜て あげます・〜て もらいます・〜て くれます|làm ~ cho / được ai làm ~ cho|A は B に V て あげます ・ B は A に V て もらいます ・ A は (わたし に) V て くれます\nCho và nhận một hành động tốt. Chủ ngữ của もらいます là người được lợi; của くれます là người giúp mình.\n!\"Nhờ ai làm\" → もらう. \"Ai đó tự làm cho mình\" → くれる.\n>わたし は 友(とも)だち に 日本語(にほんご) を 【おしえて もらいました|おしえて あげました|おしえて くれました|おしえられて もらいました】。=Tôi được bạn dạy tiếng Nhật.\n>雨(あめ) の 日(ひ)、山田(やまだ)さん が えき まで 車(くるま) で 【おくって くれました|おくって もらいました|おくって あげました|おくられました】。=Hôm trời mưa, anh Yamada đã chở tôi ra ga.\n##19\n@〜ために|để ~ (mục đích chủ động); vì ~|V-từ điển / N の + ために ・ nguyên nhân: V た / N の + ために\nMục đích do chính mình điều khiển được. Cũng nêu nguyên nhân khách quan (じこ の ために).\n!ために đi với động từ ý chí; trạng thái \"được, hiểu, không\" thì dùng ように.\n>いえ を 買(か)う 【ために|ように|のに|ことに】、お金(かね) を ためて います。=Tôi đang để dành tiền để mua nhà.\n>かぞく 【の ために|に ために|の ように|な ために】、毎日(まいにち) はたらいて います。=Tôi làm việc mỗi ngày vì gia đình.\n##20\n@〜そうです (trông có vẻ)|trông có vẻ ~; sắp ~|V (bỏ ます) / A-い (bỏ い) / A-な + そうです\nPhán đoán từ điều nhìn thấy. いい → よさそう, ない → なさそう. Với động từ: \"sắp ~\".\n!Có vẻ → bỏ đuôi rồi gắn そう. Nghe nói → để nguyên thể thông thường.\n>この ケーキ は 【おいしそう|おいしいそう|おいしくそう|おいしだそう】 です ね。=Cái bánh này trông ngon nhỉ.\n>そら が くらい です。雨(あめ) が 【ふりそう|ふるそう|ふってそう|ふろうそう】 です。=Trời tối quá. Sắp mưa rồi.\n@〜そうです (nghe nói)|nghe nói ~|thể thông thường + そうです ・ nguồn tin: 〜に よると\nTruyền đạt lại thông tin nghe, đọc được. Không chia quá khứ hay phủ định ở そうです.\n>てんきよほう に よると、あした は 【はれる|はれ|はれて|はれよう】 そう です。=Theo dự báo thời tiết, nghe nói mai trời nắng.\n>田中(たなか)さん は らいげつ 【けっこん する そう|けっこん しそう|けっこん して そう|けっこん しよう そう】 です。=Nghe nói anh Tanaka tháng sau kết hôn.\n##21\n@〜て きます・〜て いきます|~ rồi quay lại; ~ dần đến nay / ~ dần từ nay|V て きます ・ V て いきます\nてきます: đi làm gì rồi về, hoặc thay đổi kéo đến hiện tại. ていきます: thay đổi tiếp diễn về tương lai, hoặc làm rồi đi luôn.\n!くる kéo về phía mình (đến nay); いく đẩy ra xa (từ nay).\n>ちょっと のみもの を 【買(か)って きます|買(か)って いきます|買(か)い きます|買(か)って おきます】。ここ で まって いて ください。=Tôi đi mua đồ uống rồi quay lại. Anh chờ ở đây nhé.\n>これから も 日本語(にほんご) の べんきょう を つづけて 【いきます|きます|おきます|みます】。=Từ nay tôi sẽ tiếp tục học tiếng Nhật.\n##22\n@〜ようです・〜みたいです|hình như ~; giống như ~|thể thông thường + ようです (N の, A-な + な) ・ thể thông thường + みたいです (N, A-な bỏ だ)\nPhỏng đoán từ cảm nhận của chính mình, hoặc ví von. みたい dùng khi nói.\n>でんき が きえて います。だれ も 【いない よう|いなそう|いないの よう|いない そう】 です。=Đèn tắt rồi. Hình như không có ai.\n>あの 人(ひと) は 日本人(にほんじん) 【みたい|のみたい|なみたい|だみたい】 です ね。=Người kia hình như là người Nhật nhỉ.\n@〜らしいです|nghe đâu ~; ra dáng ~|thể thông thường + らしい (N, A-な bỏ だ) ・ N + らしい + N\nPhỏng đoán dựa trên tin nghe được. N らしい: đúng chất của N (はる らしい てんき).\n>うわさ に よると、あの みせ は らいげつ 【しまる らしい|しまり らしい|しまる みたいな|しまりそうな】 です。=Nghe đồn quán đó tháng sau đóng cửa.\n>きょう は 【はる らしい|はる の らしい|はる な らしい|はる そうな】 あたたかい 日(ひ) です。=Hôm nay là một ngày ấm áp đúng kiểu mùa xuân.\n##23\n@Thể sai khiến|bắt / cho (ai) làm ~|Nhóm 1: hàng い → hàng あ + せます (いかせます) ・ Nhóm 2: + させます ・ させます, こさせます\nBắt buộc hoặc cho phép. Tự động từ: người を; tha động từ: người に + vật を.\n!Một câu không có hai を: đã có tân ngữ を thì người bị sai dùng に.\n>母(はは) は こども 【に|を|が|で】 やさい を 食(た)べさせます。=Mẹ bắt con ăn rau.\n>先生(せんせい) は 学生(がくせい) を はやく 【かえらせました|かえられました|かえりさせました|かえさせられました】。=Thầy giáo đã cho học sinh về sớm.\n@〜させて いただけませんか|xin cho phép tôi ~|V-sai khiến て + いただけませんか\nXin phép rất lịch sự để chính mình làm gì.\n>あたま が いたい ので、きょう は はやく 【かえらせて|かえって|かえられて|かえりさせて】 いただけませんか。=Tôi đau đầu, hôm nay cho phép tôi về sớm được không ạ?\n>すみません、ここ で しゃしん を 【とらせて いただけませんか|とって いただきませんか|とられて いただけませんか|とらせて あげませんか】。=Xin lỗi, cho phép tôi chụp ảnh ở đây được không ạ?\n##24\n@Thể sai khiến bị động|bị bắt làm ~|Nhóm 1: 〜せられます / 〜されます (いかされます) ・ Nhóm 2: 〜させられます ・ người bắt + に\nLàm việc gì trái ý muốn vì bị người khác bắt.\n!Thấy させられ là hiểu ngay: \"khổ thân, bị ép\".\n>こども の とき、母(はは) に 毎日(まいにち) ピアノ を 【ならわせられました|ならわれました|ならわせました|ならいさせられました】。=Hồi nhỏ ngày nào tôi cũng bị mẹ bắt học piano.\n>きのう は ぶちょう に 2じかん も 【またされました|またれました|まちさせました|まつされました】。=Hôm qua tôi bị trưởng phòng bắt chờ tận 2 tiếng.\n##25\n@〜たら|nếu ~; sau khi ~|V た / A かった / N だった + ら\nĐiều kiện giả định, hoặc việc chắc chắn xảy ra rồi mới làm việc sau. Dùng được với mệnh lệnh, rủ rê.\n!たら là điều kiện \"dễ tính\" nhất: gần như câu nào cũng dùng được.\n>えき に 【ついたら|つけば|つくと|つくなら】、でんわ して ください。=Đến ga rồi thì gọi điện cho tôi nhé.\n>あした 雨(あめ) 【だったら|ければ|なら と|だら】、しあい は ありません。=Nếu mai mưa thì không có trận đấu.\n@〜ても|dù ~ cũng|V て / A くて / N で + も\nĐiều kiện ngược. Hay đi với いくら, どんなに.\n>いくら 【かんがえても|かんがえたら|かんがえれば|かんがえると】、わかりません。=Dù nghĩ bao nhiêu cũng không hiểu.\n>雨(あめ) 【でも|ても|だも|なら も】、しあい は あります。=Dù mưa trận đấu vẫn diễn ra.\n##26\n@〜と|hễ ~ thì (tất yếu)|V-từ điển / V ない + と、〜\nKết quả tự nhiên, hiển nhiên, chỉ đường, cách dùng máy. Vế sau không dùng ý chí, mệnh lệnh, rủ rê.\n!と = \"ấn nút là ra\": một nguyên nhân, luôn một kết quả.\n>この みち を まっすぐ 【行(い)く と|行(い)け と|行(い)った と|行(い)こう と】、右(みぎ) に ぎんこう が あります。=Đi thẳng đường này sẽ thấy ngân hàng bên phải.\n>はる に 【なる と|なったら と|なれ と|なろう と】、さくら が さきます。=Hễ sang xuân là hoa anh đào nở.\n##27\n@〜ところです|sắp / đang / vừa mới ~|V-từ điển + ところ (sắp) ・ V て いる + ところ (đang) ・ V た + ところ (vừa xong)\nChỉ rõ thời điểm của hành động so với lúc nói.\n>A「もう 食(た)べました か。」 B「いいえ、これから 【食(た)べる|食(た)べた|食(た)べて|食(た)べよう】 ところ です。」=A: Anh ăn chưa? B: Chưa, bây giờ tôi sắp ăn.\n>今(いま)、レポート を 【書(か)いて いる|書(か)く の|書(か)いた の|書(か)き】 ところ です。=Bây giờ tôi đang viết báo cáo.\n@〜た ばかりです|vừa mới ~ (theo cảm nhận)|V た + ばかりです\nNgười nói cảm thấy việc vừa mới xảy ra, dù thực tế có thể đã vài tháng.\n!たところ: vừa xong ngay lúc này. たばかり: \"mới đây thôi\" theo cảm giác.\n>先月(せんげつ) 日本(にほん) へ 【来(き)た ばかり|来(く)る ばかり|来(き)て ばかり|来(き)た ところ の】 です から、まだ 何(なに)も わかりません。=Tôi vừa mới đến Nhật tháng trước nên chưa biết gì cả.\n>この パソコン は きのう 買(か)った 【ばかり な のに|ばかり の ので|ところ のに|だけ な のに】、もう こわれました。=Cái máy tính này vừa mua hôm qua vậy mà đã hỏng.\n##28\n@〜まま|cứ để nguyên ~|V た / V ない / N の + まま\nGiữ nguyên một trạng thái trong khi làm việc khác, thường là điều đáng ra không nên.\n>でんき を 【つけた まま|つける まま|つけて まま|つけよう まま】 ねて しまいました。=Tôi lỡ ngủ quên trong khi đèn vẫn bật.\n>くつ を 【はいた まま|はいて まま|はく まま|はき まま】 へや に 入(はい)らないで ください。=Xin đừng đi nguyên giày vào phòng.\n@〜はじめます・〜おわります・〜つづけます|bắt đầu / xong / tiếp tục ~|V (bỏ ます) + はじめます / おわります / つづけます\nĐộng từ ghép chỉ giai đoạn của hành động. Bắt đầu đột ngột: 〜だします.\n>きょねん から ピアノ を 【ならいはじめました|ならうはじめました|ならってはじめました|ならいはじまりました】。=Tôi bắt đầu học piano từ năm ngoái.\n>この 本(ほん) は もう 【読(よ)みおわりました|読(よ)むおわりました|読(よ)んでおわりました|読(よ)みおえりました】。=Quyển sách này tôi đã đọc xong.\n##29\n@Tôn kính ngữ (尊敬語)|nói về hành động của người trên|お + V (bỏ ます) + に なります ・ V-(ら)れます ・ đặc biệt: いらっしゃいます, めしあがります, おっしゃいます, ごらんに なります, なさいます\nNâng hành động của người đối diện hoặc người trên. Không dùng cho hành động của mình.\n!\"Người ta\" làm → tôn kính. \"Tôi\" làm → khiêm nhường.\n>しゃちょう は もう 【おかえり に なりました|おかえり しました|かえって いただきました|おかえり いたしました】。=Giám đốc đã về rồi ạ.\n>先生(せんせい) は あした 何時(なんじ) に 【いらっしゃいます|まいります|うかがいます|おります】 か。=Thầy ngày mai mấy giờ đến ạ?\n##30\n@Khiêm nhường ngữ (謙譲語)|nói về hành động của mình|お + V (bỏ ます) + します ・ ご + N + します ・ đặc biệt: まいります, おります, いただきます, もうします, はいけん します, うかがいます\nHạ hành động của mình (hoặc người phía mình) để tôn trọng người nghe.\n>おにもつ を 【おもち します|おもち に なります|もたれます|おもち なさいます】。=Tôi xin xách hành lý giúp ạ.\n>はじめまして。リン と 【もうします|おっしゃいます|いらっしゃいます|なさいます】。=Rất vui được gặp. Tôi tên là Linh.\n@Lịch sự ngữ (丁寧語)|cách nói trang trọng|です → で ございます ・ あります → ございます ・ お / ご + danh từ\nDùng trong cửa hàng, thông báo, thư từ. Chỉ làm câu trang trọng hơn, không nâng hay hạ ai.\n>トイレ は 2かい に 【ございます|いらっしゃいます|まいります|おります と】。=Nhà vệ sinh ở tầng 2 ạ.\n>こちら は うけつけ 【で ございます|に ございます|で いらっしゃいます|を ございます】。=Đây là quầy lễ tân ạ.\n##31\n@〜あいだ・〜あいだに|trong suốt ~ / trong khoảng ~|V て いる / N の + あいだ(に)\nあいだ: hành động kéo dài suốt khoảng đó. あいだに: việc xảy ra một lần tại một điểm trong khoảng đó.\n!Có に = một điểm; không に = cả quãng.\n>こども が ねて いる 【あいだに|あいだ|まで|まえに】、かいもの に 行(い)って きます。=Trong lúc con ngủ, tôi đi mua đồ rồi về.\n>なつやすみ の 【あいだ|あいだに|までに|うち】、ずっと くに に いました。=Suốt kỳ nghỉ hè tôi ở trong nước.\n@〜までに|chậm nhất là trước ~|thời điểm + までに\nHạn chót của một hành động xảy ra một lần. まで là \"làm liên tục đến\".\n>レポート は 金曜日(きんようび) 【までに|まで|あいだ|までで】 出(だ)して ください。=Báo cáo hãy nộp trước thứ Sáu.\n>5時(じ) 【まで|までに|に まで|あいだに】 ここ で まって います。=Tôi sẽ chờ ở đây đến 5 giờ.\n##32\n@〜とか 〜とか|như là ~, ~|N / V-thường + とか、N / V-thường + とか\nNêu ví dụ khi nói chuyện, thân mật hơn や.\n>休(やす)み の 日(ひ) は そうじ 【とか|や か|など と|だけ】 せんたく とか を します。=Ngày nghỉ tôi làm những việc như dọn dẹp, giặt giũ.\n>つかれた とき は、おんがく を 聞(き)く とか、はやく 【ねる とか|ねて とか|ねたり とか|ねる や】 した ほうが いいです よ。=Khi mệt thì nên nghe nhạc hay ngủ sớm chẳng hạn.\n##33\n@〜が します|có (mùi, vị, tiếng, cảm giác) ~|N (におい, あじ, おと, こえ, かんじ) + が します\nCảm nhận bằng giác quan.\n>だいどころ から いい におい 【が します|を します|が あります|に なります】。=Từ bếp có mùi thơm.\n>となり の へや で 人(ひと) の こえ が 【します|なります|見(み)えます|あります】。=Phòng bên có tiếng người.\n@〜がります|(người khác) tỏ ra ~|A-い (bỏ い) / A-な / V たい (bỏ い) + がります\nCảm xúc, mong muốn của người thứ ba thể hiện ra ngoài. Hiện tại: 〜がって います.\n!ほしい, たい là của \"tôi\"; người khác thì thêm がる.\n>むすこ は あたらしい ゲーム を 【ほしがって|ほしくて|ほしがりて|ほしいがって】 います。=Con trai tôi đang muốn có trò chơi mới.\n>こども は はいしゃ に 行(い)く の を 【こわがります|こわいがります|こわくなります|こわがるです】。=Trẻ con sợ đi nha sĩ.\n##34\n@〜さ|độ ~ (danh từ hoá tính từ)|A-い (bỏ い) / A-な + さ\nBiến tính từ thành danh từ chỉ mức độ: たかさ, おもさ, べんりさ.\n>この はし の 【ながさ|ながいさ|ながくさ|ながみ】 は どのくらい です か。=Chiều dài cây cầu này là bao nhiêu?\n>にもつ の 【おもさ|おもいさ|おもく|おもいの】 を はかって ください。=Hãy cân trọng lượng hành lý.\n@〜ことが あります|cũng có khi ~|V-từ điển / V ない + ことが あります\nThỉnh thoảng xảy ra. Khác V た ことが あります (đã từng).\n!Trước こと là thể từ điển → \"có khi\"; là thể た → \"đã từng\".\n>いそがしい とき は、ひるごはん を 【食(た)べない|食(た)べなかった|食(た)べなくて|食(た)べず】 こと が あります。=Khi bận cũng có lúc tôi không ăn trưa.\n>ときどき バス が 【おくれる|おくれた|おくれて|おくれよう】 こと が あります。=Thỉnh thoảng xe buýt cũng đến muộn.\n##35\n@〜ことに なります|được quyết định là ~|V-từ điển / V ない + ことに なりました ・ quy định: 〜ことに なって います\nViệc do người khác, tổ chức hay hoàn cảnh quyết định. Cũng là cách nói khiêm tốn về quyết định của mình.\n>らいげつ から おおさか で 【はたらく ことに|はたらく ように|はたらいて ことに|はたらこう と】 なりました。=Từ tháng sau tôi được phân công làm việc ở Osaka.\n>この へや で は たばこ を すっては いけない こと に 【なって います|して います|なります か|あって います】。=Theo quy định, không được hút thuốc trong phòng này.\n@〜ことに して います|đặt lệ cho mình là ~|V-từ điển / V ない + ことに して います\nThói quen do mình tự quyết định và đang duy trì.\n>けんこう の ために、毎朝(まいあさ) 30分(ぷん) あるく こと に 【して います|なって います|します でした|あります】。=Vì sức khoẻ, tôi tự đặt lệ mỗi sáng đi bộ 30 phút.\n>よる 9時(じ) の あと は 何(なに)も 【食(た)べない ことに|食(た)べなくて ことに|食(た)べない ように なって|食(た)べず ことに】 して います。=Tôi đặt lệ sau 9 giờ tối không ăn gì nữa.\n##36\n@〜だけで なく、〜も|không chỉ ~ mà còn ~|N / thể thông thường + だけで なく、N + も\nThêm một điều nữa vào điều đã nêu.\n>かのじょ は えいご 【だけで なく|だけ なくて|しか なく|だけ でも】、ちゅうごくご も 話(はな)せます。=Cô ấy không chỉ nói được tiếng Anh mà cả tiếng Trung.\n>この みせ は やすい だけで なく、あじ 【も|は|が|を】 いいです。=Quán này không chỉ rẻ mà vị cũng ngon.\n@〜ほど 〜ない|không ~ bằng|A は B ほど + phủ định\nA không đạt đến mức của B.\n!ほど luôn kéo theo phủ định; より thì đi với khẳng định.\n>ことし の ふゆ は きょねん 【ほど|より|まで|だけ】 さむくない です。=Mùa đông năm nay không lạnh bằng năm ngoái.\n>わたし は あに ほど せ が 【たかくない|たかい|たかかった|たかくて】 です。=Tôi không cao bằng anh trai.\n##37\n@〜ような・〜ように (ví dụ, ví von)|như là ~; giống như ~|N の / V-thường + ような + N ・ 〜ように + V / A ・ giống hệt: N と おなじ\nNêu ví dụ tiêu biểu hoặc so sánh ví von. まるで 〜ようだ = cứ như là.\n>わたし は すし や てんぷら の 【ような|ように|ようで|そうな】 日本(にほん) りょうり が すき です。=Tôi thích các món Nhật như sushi, tempura.\n>かのじょ は 日本人(にほんじん) の 【ように|ような|ようだ|みたい】 日本語(にほんご) を 話(はな)します。=Cô ấy nói tiếng Nhật như người Nhật.\n##38\n@〜と つたえて いただけませんか|nhờ nhắn lại là ~|thể thông thường + と つたえて いただけませんか ・ 〜と 言って いました\nNhờ chuyển lời, hoặc thuật lại lời người thứ ba (言って いました).\n!Thuật lại lời người khác dùng 言って いました, không dùng 言いました.\n>田中(たなか)さん に、あした の かいぎ は 3時(じ) から だ 【と|を|に|が】 つたえて いただけませんか。=Anh nhắn giúp anh Tanaka là cuộc họp ngày mai từ 3 giờ được không?\n>山田(やまだ)さん は きょう は 来(こ)られない と 【言(い)って いました|言(い)います でした|言(い)われて います|言(い)って あります】。=Anh Yamada đã nói là hôm nay không đến được.\n##39\n@〜て ほしい|muốn (ai đó) làm ~|(người に) V て ほしい ・ V ないで ほしい\nMong người khác làm gì cho mình. Mình muốn làm thì dùng 〜たい.\n>こども に は もっと 本(ほん) を 【読(よ)んで ほしい|読(よ)みたい|読(よ)んで ほしがる|読(よ)ませて ほしく】 です。=Tôi muốn con đọc sách nhiều hơn.\n>ここ に ごみ を 【すてないで|すてなくて|すてずで|すてない】 ほしい です。=Tôi mong mọi người đừng vứt rác ở đây.\n@〜と いいです|mong là ~; giá mà ~|V-từ điển / V ない + と いいです(ね) ・ 〜たら いいです\nHy vọng điều gì xảy ra. Thêm ね khi chúc người khác.\n>あした、いい 天気(てんき) に 【なる と|なろう と|なって と|なった と】 いいです ね。=Mong là ngày mai trời đẹp nhỉ.\n>しけん に ごうかく 【できる と|できて と|できよう と|でき と】 いいです ね。=Mong là anh thi đỗ nhé.\n##40\n@〜だろう・〜だろうと 思います|có lẽ ~|thể thông thường + だろう (N, A-な bỏ だ)\nDạng thông thường của でしょう. Thêm と 思います để nêu phỏng đoán của mình một cách mềm mỏng.\n>あした は たぶん 雨(あめ) が 【ふる だろう|ふり だろう|ふって だろう|ふろう だろう】。=Ngày mai có lẽ trời mưa.\n>かれ は もう 来(こ)ない 【だろう と|だろう を|でしょう が|だ と】 思(おも)います。=Tôi nghĩ có lẽ anh ấy không đến nữa.\n##41\n@Dạng rút gọn khi nói|〜ちゃう・〜なきゃ・〜とく・〜って|〜て しまう → 〜ちゃう / 〜じゃう ・ 〜なければ → 〜なきゃ ・ 〜て おく → 〜とく ・ と / という → って\nHay gặp trong phần nghe. って còn dùng để nêu chủ đề hoặc truyền đạt lại (〜って 言ってた).\n!Nghe thấy ちゃ, じゃ, なきゃ, とく thì tự \"giải nén\" về dạng gốc.\n>あ、さいふ を 【わすれちゃった|わすれじゃった|わすれなきゃった|わすれとった】。=A, quên ví mất rồi.\n>もう 9時(じ) だ。はやく 【行(い)かなきゃ|行(い)っちゃ|行(い)っとく|行(い)かなく】。=9 giờ rồi. Phải đi nhanh thôi.\n##42\n@〜に ついて|về ~|N + に ついて\nChủ đề của việc nói, viết, tìm hiểu.\n>日本(にほん) の ぶんか 【に ついて|に よって|に とって|に たいして】 しらべて います。=Tôi đang tìm hiểu về văn hoá Nhật.\n>この もんだい に ついて、みなさん の いけん を 【聞(き)かせて ください|聞(き)こえて ください|聞(き)かれて ください|聞(き)いて あげます】。=Về vấn đề này, xin cho tôi nghe ý kiến của mọi người.\n@〜に よると|theo ~ (nguồn tin)|N + に よると、〜そうです / 〜らしいです\nNêu nguồn của thông tin truyền đạt.\n>ニュース 【に よると|に ついて|に よって|の ために】、あした ゆき が ふる そう です。=Theo tin tức, nghe nói mai tuyết rơi.\n>先生(せんせい) の 話(はなし) に よると、しけん は 【むずかしい らしい|むずかし そう|むずかしい よう に|むずかしく らしい】 です。=Theo lời thầy thì nghe đâu bài thi khó.\n##43\n@〜ても かまいません|~ cũng không sao|V て / A くて / N で + も かまいません ・ bắt buộc: 〜なくては いけません\nCho phép, lịch sự hơn 〜ても いいです. なくては いけません nghĩa như なければ なりません.\n>この へや は じゆう に 【つかっても|つかうて も|つかっては|つかえば】 かまいません。=Phòng này anh cứ dùng tự do cũng không sao.\n>あした まで に この しょるい を 【出(だ)さなくては|出(だ)さなくても|出(だ)さないで|出(だ)しては】 いけません。=Phải nộp giấy tờ này trước ngày mai.\n##44\n@〜ひつようが あります|cần phải ~|V-từ điển + ひつようが あります ・ không cần: 〜ひつようは ありません\nNêu sự cần thiết một cách khách quan.\n>ビザ を とる ために、たいしかん へ 【行(い)く ひつよう|行(い)って ひつよう|行(い)き ひつよう|行(い)こう ひつよう】 が あります。=Để lấy visa cần phải đến đại sứ quán.\n>じかん は たくさん あります から、いそぐ ひつよう 【は ありません|が います|に なりません|を しません】。=Còn nhiều thời gian nên không cần vội.\n@〜ば よかった|giá mà đã ~|V ば + よかった ・ V なければ + よかった\nHối tiếc về việc đã (không) làm.\n!ば よかった luôn nói về chuyện đã lỡ rồi.\n>テスト は むずかしかった。もっと 【べんきょう すれば|べんきょう したら が|べんきょう して|べんきょう する と】 よかった。=Bài kiểm tra khó quá. Giá mà đã học nhiều hơn.\n>おなか が いたい。あんなに 【食(た)べなければ|食(た)べれば|食(た)べないで|食(た)べなくて】 よかった。=Đau bụng quá. Giá mà đã không ăn nhiều như thế.\n##45\n@〜はずが ありません|không thể nào ~|thể thông thường + はずが ありません (N の, A-な + な)\nPhủ định mạnh dựa trên căn cứ.\n>あの まじめな 田中(たなか)さん が うそ を 【つく はず|つき はず|ついて はず|つこう はず】 が ありません。=Anh Tanaka nghiêm túc thế không thể nào nói dối.\n>こんな むずかしい もんだい、こども に 【わかる はず が ない|わかる はず だ|わからない はず が ない|わかった ばかり】。=Bài khó thế này, trẻ con không thể nào hiểu được.\n@何でも・いつでも・だれでも|cái gì cũng / lúc nào cũng / ai cũng|từ để hỏi + でも + khẳng định\n\"Bất cứ\". Từ để hỏi + も + phủ định thì là \"không… nào cả\".\n!でも đi với khẳng định, も đi với phủ định.\n>わたし は きらいな もの が ありません。【何(なん)でも|何(なに)も|何(なに)か|何(なん)で】 食(た)べます。=Tôi không ghét món nào. Cái gì cũng ăn.\n>わからない とき は、【いつでも|いつも は|いつか|いつまで】 しつもん して ください。=Khi không hiểu, lúc nào cũng cứ hỏi nhé.\n##46\n@〜ぐらい・〜ほど (mức độ)|đến mức ~|V-thường / N + ぐらい / ほど\nLấy ví dụ để tả mức độ. ほど trang trọng hơn.\n>きょう は あるけない 【ぐらい|ばかり|だけ|しか】 つかれました。=Hôm nay tôi mệt đến mức không đi nổi.\n>しぬ 【ほど|より|まで に|ばかり】 おなか が すきました。=Tôi đói muốn chết.\n@〜ばかり|toàn là ~; chỉ toàn ~|N + ばかり ・ V て + ばかり います\nNhiều quá mức, mang ý chê.\n!V た ばかり là \"vừa mới\"; V て ばかり là \"suốt ngày chỉ\".\n>おとうと は 毎日(まいにち) ゲーム を 【して ばかり|した ばかり|する ばかり に|して だけ】 います。=Em trai tôi ngày nào cũng chỉ toàn chơi game.\n>この へん は たかい みせ 【ばかり|しか|ほど|ぐらい】 です。=Quanh đây toàn quán đắt.\n##47\n@Tự động từ và tha động từ|tự xảy ra / ai đó làm|N が + tự động từ (あく, しまる, つく, きえる, こわれる) ・ N を + tha động từ (あける, しめる, つける, けす, こわす)\nTự động từ + て います tả trạng thái kết quả đang thấy: まど が あいて います. Tha động từ + て あります nhấn mạnh có người cố ý làm.\n!Thấy を thì chọn tha động từ; thấy が thì chọn tự động từ.\n>かぜ で ドア が 【しまりました|しめました|しまらせました|しめられて】。=Cửa đóng lại vì gió.\n>さむい です から、まど を 【しめて|しまって|しまりて|しめられて】 ください。=Lạnh quá, hãy đóng cửa sổ.\n>あ、でんき が 【ついて います|つけて います|ついて あります|つけて います か】 ね。だれ か いる よう です。=A, đèn đang bật kìa. Hình như có ai.\n##48\n@〜させて ください|xin cho tôi ~|V-sai khiến て + ください\nXin phép hoặc tình nguyện nhận việc. Lịch sự hơn: 〜させて いただけませんか.\n>その しごと は ぜひ わたし に 【やらせて|やられて|やって|やりさせて】 ください。=Việc đó nhất định xin để tôi làm.\n>すこし 【かんがえさせて|かんがえられて|かんがえて あげて|かんがえされて】 ください。=Xin cho tôi suy nghĩ một chút.\n@お〜ください|xin mời ~ (kính ngữ)|お + V (bỏ ます) + ください ・ ご + N + ください\nCách mời, yêu cầu lịch sự với khách.\n>こちら に お名前(なまえ) を 【お書(か)き ください|お書(か)いて ください|書(か)かれ ください|お書(か)き して ください】。=Xin mời quý khách viết tên vào đây.\n>しょうしょう 【おまち ください|おまって ください|またれ ください|おまち して ください】。=Xin quý khách chờ một chút.\n##49\n@Từ nối N4|それに・そのうえ・ところで・つまり・それで|それに / そのうえ: thêm nữa ・ それで: vì thế ・ ところで: nhân tiện (đổi đề tài) ・ つまり: tức là ・ ところが: thế nhưng\nPhần đọc hiểu hay hỏi chọn từ nối. Xác định quan hệ hai câu: thêm, nguyên nhân, trái ngược hay đổi đề tài.\n>この へや は ひろい です。【それに|ところが|つまり|それでも】、えき から も ちかい です。=Phòng này rộng. Hơn nữa lại gần ga.\n>きのう は ねつ が ありました。【それで|それに|ところで|つまり】、かいしゃ を 休(やす)みました。=Hôm qua tôi bị sốt. Vì thế tôi đã nghỉ làm.\n##50\n@〜おかげで・〜せいで|nhờ ~ / tại ~|thể thông thường / N の + おかげで (kết quả tốt) ・ + せいで (kết quả xấu)\nCùng nêu nguyên nhân nhưng おかげ là biết ơn, せい là trách móc.\n!おかげさまで = \"nhờ ơn\". せい = \"lỗi tại\".\n>先生(せんせい) の 【おかげで|せいで|ために は|とおりに】、しけん に ごうかく できました。=Nhờ thầy mà tôi đã thi đỗ.\n>雨(あめ) の 【せいで|おかげで|ように|ことで】、しあい が ちゅうし に なりました。=Tại mưa mà trận đấu bị huỷ.\n##51\n@So sánh と・ば・たら・なら|bốn kiểu \"nếu\"|と: tất yếu, vế sau không có ý chí ・ ば: điều kiện cần ・ たら: giả định, xong rồi thì (dùng rộng nhất) ・ なら: nếu là chuyện đó thì (lời khuyên)\nVế sau là mệnh lệnh, nhờ vả, rủ rê → dùng たら (hoặc なら). Chỉ đường, máy móc, quy luật → と.\n!Phân vân thì chọn たら; chỉ khi nhận lại chủ đề của người kia mới chọn なら.\n>うち に 【かえったら|かえると|かえれば|かえるなら】、すぐ でんわ して ください。=Về đến nhà thì gọi điện ngay nhé.\n>パソコン を 【買(か)う なら|買(か)うと|買(か)えば|買(か)ったら が】、あきはばら が やすい です よ。=Nếu định mua máy tính thì Akihabara rẻ đấy.\n##52\n@So sánh そう・よう・らしい|ba kiểu \"có vẻ, nghe nói\"|〜そう (bỏ đuôi): nhìn mà đoán ・ 〜そう (thể thường): nghe nói ・ 〜よう / みたい: cảm nhận của mình ・ 〜らしい: dựa vào tin nghe được\nXác định căn cứ: mắt thấy ngay trước mặt → そう; tổng hợp cảm nhận → よう; nghe người khác nói → らしい hoặc そうだ.\n>A「その かばん、【おもそう|おもいそう|おもいよう|おもいらしい】 です ね。もちましょう か。」=A: Cái cặp đó trông nặng nhỉ. Tôi xách giúp nhé?\n>かぜ を ひいた 【よう|そう に|らしく の|そうな】 です。あたま が いたい です。=Hình như tôi bị cảm. Đau đầu quá.\n##53\n@Kính ngữ thường gặp|bảng tra nhanh|いる → いらっしゃる / おる ・ 行く, 来る → いらっしゃる / まいる ・ 食べる → めしあがる / いただく ・ 言う → おっしゃる / もうす ・ 見る → ごらんに なる / はいけん する ・ する → なさる / いたす ・ 知って いる → ごぞんじだ / ぞんじて おる\nCặp trước dấu gạch là tôn kính (người khác làm), cặp sau là khiêm nhường (mình làm). Đề N4 hay hỏi chọn đúng cặp.\n>どうぞ、あたたかい うち に 【めしあがって|いただいて|まいって|はいけん して】 ください。=Xin mời dùng khi còn nóng ạ.\n>あした 3時(じ) に そちら へ 【うかがいます|いらっしゃいます|おいで に なります|おっしゃいます】。=3 giờ ngày mai tôi sẽ đến chỗ anh ạ.\n##54\n@Tổng hợp cho và nhận|あげる・もらう・くれる và dạng kính ngữ|あげる → さしあげる (cho người trên), やる (cho em, con vật, cây) ・ もらう → いただく ・ くれる → くださる ・ gắn sau V て để cho / nhận hành động\nXác định ai là người được lợi và người nói đứng về phía nào trước khi chọn.\n!Người trên cho mình: くださいました / いただきました. Mình cho người trên: さしあげました.\n>この じしょ は 先生(せんせい) が 【くださいました|さしあげました|いただきました|やりました】。=Quyển từ điển này là thầy cho tôi.\n>毎朝(まいあさ) はな に 水(みず) を 【やります|くれます|くださいます|いただきます】。=Mỗi sáng tôi tưới nước cho hoa.\n", "fx": "##1\nこの かんじ の 読(よ)みかた が わからない んです が、【おしえて いただけませんか|おしえて あげませんか|おしえて いただきます|おしえられませんか】。=Tôi không biết cách đọc chữ Hán này, anh chỉ giúp được không?\n##2\nこの プール で は 5時(じ) まで 【およげます|およがれます|およぎられます|およげられます】。=Ở bể bơi này có thể bơi đến 5 giờ.\nよる は しずか です から、とおく の 電車(でんしゃ) の おと が 【聞(き)こえます|聞(き)けます|聞(き)かせます|聞(き)きます】。=Ban đêm yên tĩnh nên nghe thấy tiếng tàu ở xa.\n##3\nこの アパート は えき から ちかい 【し|て|で|と】、やちん も やすい し、とても いいです。=Căn hộ này vừa gần ga, tiền nhà lại rẻ, rất tốt.\n##4\nケーキ は おとうと が ぜんぶ 【食(た)べて しまいました|食(た)べて ありました|食(た)べて おきました|食(た)べて みました】。=Bánh thì em trai tôi đã ăn hết mất rồi.\n##5\nこくばん に あした の よてい が 【書(か)いて あります|書(か)いて います|書(か)かれて あります|書(か)いて おきます】。=Trên bảng có viết lịch ngày mai.\nおきゃくさん が 来(く)る まえに、へや を そうじ 【して おきます|して あります|して しまいます|して みます】。=Trước khi khách đến tôi dọn phòng sẵn.\n##6\nじかん が ない から、タクシー で 【行(い)こう|行(い)きよう|行(い)けよう|行(い)くよう】。=Không có thời gian nên đi taxi thôi.\nしゅうまつ は うち で ゆっくり 【休(やす)もう|休(やす)む|休(やす)みよう|休(やす)んで】 と 思(おも)って います。=Cuối tuần tôi đang định nghỉ ngơi thong thả ở nhà.\n##7\nお金(かね) が ない ので、ことし は りょこう に 【行(い)かない こと|行(い)かなくて こと|行(い)かず こと|行(い)けない の】 に しました。=Vì không có tiền nên năm nay tôi quyết định không đi du lịch.\n##8\nみち が こんで います から、やくそく の じかん に 【おくれる かも しれません|おくれ かも しれません|おくれて はず です|おくれる こと です】。=Đường đang đông nên có lẽ tôi sẽ đến muộn giờ hẹn.\nにもつ は きのう おくりました から、あした 【つく|ついて|つこう|つき】 はず です。=Hành lý tôi gửi hôm qua nên chắc chắn mai sẽ đến.\n##9\nしけん の とき、となり の 人(ひと) の こたえ を 【見(み)る な|見(み)ろ な|見(み)ない な|見(み) な】。=Khi thi cấm nhìn bài người bên cạnh.\n##10\n先生(せんせい) が 【やった|やり|やって|やろう】 とおりに、やって みて ください。=Hãy thử làm đúng như thầy đã làm.\nきのう は つかれて いた ので、おふろ に 【入(はい)らないで|入(はい)らなくて|入(はい)らないて|入(はい)らず で】 ねました。=Hôm qua mệt nên tôi đi ngủ mà không tắm.\n##11\nこの くすり を 【のめば|のむば|のみば|のんだば】、すぐ よく なります。=Nếu uống thuốc này sẽ khỏi ngay.\nA「カメラ を 買(か)いたい んです が。」 B「カメラ 【なら|たら|ば|と】、えきまえ の みせ が やすい です よ。」=A: Tôi muốn mua máy ảnh. B: Nếu là máy ảnh thì cửa hàng trước ga rẻ đấy.\n##12\nこの 本(ほん) は 読(よ)めば 【読(よ)む ほど|読(よ)んで ほど|読(よ)めば ほど|読(よ)む より】 おもしろく なります。=Quyển sách này càng đọc càng hay.\nこども に も 読(よ)める 【ように|ために|ことに|ような】、ひらがな で 書(か)きました。=Tôi viết bằng hiragana để trẻ con cũng đọc được.\n##13\n日本(にほん) に 来(き)て から、さしみ が 【食(た)べられる ように|食(た)べる ことに|食(た)べられる ために|食(た)べて ように】 なりました。=Từ khi đến Nhật tôi đã ăn được sashimi.\nけんこう の ために、あまい もの を 食(た)べすぎない 【ように して|ことに なって|ように なって|ために して】 います。=Vì sức khoẻ tôi đang cố gắng không ăn quá nhiều đồ ngọt.\n##14\nきのう どろぼう に さいふ を 【とられました|とらせました|とりられました|とれました】。=Hôm qua tôi bị trộm lấy mất ví.\n##15\nあさ はやく おきる 【の は|の を|こと を|の に】 たいへん です。=Việc dậy sớm buổi sáng thì vất vả.\n##16\nその ニュース を 【聞(き)いて|聞(き)くと|聞(き)けば|聞(き)いたら が】、びっくり しました。=Nghe tin đó tôi đã rất ngạc nhiên.\n3じかん も 【まった のに|まった ので|まって から|まつ ように】、かれ は 来(き)ませんでした。=Chờ tận 3 tiếng vậy mà anh ấy không đến.\n##17\nあした 雨(あめ) が ふる 【か どうか|か を|の か に|と どうか】、ニュース で しらべます。=Tôi sẽ xem tin tức xem mai có mưa hay không.\nあたらしい レストラン へ 行(い)って 【みました|おきました|しまいました|ありました】 が、あまり おいしくなかった です。=Tôi đã thử đến nhà hàng mới nhưng không ngon lắm.\n##18\nにもつ が おもかった ので、おとうと に 【もって もらいました|もって あげました|もって くれました|もたれました】。=Vì hành lý nặng nên tôi nhờ em trai xách giúp.\n##19\n日本(にほん) の 大学(だいがく) に 入(はい)る 【ために|ように|ことに|のに は】、毎日(まいにち) べんきょう して います。=Tôi học mỗi ngày để vào đại học Nhật.\n##20\nあの 人(ひと) は いつも わらって いて、【たのしそう|たのしいそう|たのしくそう|たのしみそう】 です。=Người kia lúc nào cũng cười, trông có vẻ vui.\nしんぶん に よると、きのう おおさか で じしん が 【あった そう|ありそう|あって そう|ある そうな】 です。=Theo báo thì nghe nói hôm qua ở Osaka có động đất.\n##21\nさいきん、だんだん あたたかく なって 【きました|いきました|おきました|みました】。=Dạo này trời đã ấm dần lên.\n##22\nへや に かばん が ありません。田中(たなか)さん は もう 【かえった よう|かえりそう|かえった そうな|かえる らしく】 です。=Trong phòng không có cặp. Hình như anh Tanaka đã về rồi.\nともだち の 話(はなし) で は、あの えいが は とても 【おもしろい らしい|おもしろ らしい|おもしろそう らしい|おもしろい ような】 です。=Theo lời bạn tôi thì nghe đâu phim đó rất hay.\n##23\nぶちょう は 山田(やまだ)さん 【を|に が|で|へ】 おおさか へ しゅっちょう させました。=Trưởng phòng đã cử anh Yamada đi công tác Osaka.\nすみません、この でんわ を 【つかわせて|つかって|つかわれて|つかいさせて】 いただけませんか。=Xin lỗi, cho phép tôi dùng điện thoại này được không ạ?\n##24\nこども の とき、きらいな やさい を 母(はは) に 【食(た)べさせられました|食(た)べられました|食(た)べさせました|食(た)べさせて もらいました】。=Hồi nhỏ tôi bị mẹ bắt ăn loại rau mình ghét.\n##25\nしごと が 【おわったら|おわると|おわれば|おわるなら】、いっしょに しょくじ に 行(い)きませんか。=Xong việc thì cùng đi ăn không?\nいくら 【たかくても|たかかったら|たかければ|たかいと】、この カメラ が ほしい です。=Dù đắt bao nhiêu tôi cũng muốn cái máy ảnh này.\n##26\nこの ボタン を 【おす と|おせ と|おして と|おそう と】、おつり が 出(で)ます。=Ấn nút さ)】を 送(おく)りました。=Vào tháng 12, tôi đã gửi quà cuối năm cho trưởng phòng ở công ty.\n", "kp": "朝|𠦝(十+日+十)+月|Mặt trời mọc giữa đám cỏ (𠦝) khi vầng trăng (月) còn chưa lặn: buổi sáng (朝).\n昼|尺+旦(日+一)|Lấy thước (尺) đo bóng nắng từ lúc rạng sáng (旦), đến khi bóng ngắn nhất là đã buổi trưa (昼).\n夜|亠+亻+夕+丶|Dưới cái nắp (亠) mái nhà, người (亻) nằm ngủ khi chiều tối (夕) đã qua, chỉ còn một chấm (丶) sao le lói: ban đêm (夜).\n夕||Vầng trăng khuyết mới nhú, thiếu một nét so với chữ nguyệt: chiều tối (夕).\n週|周(冂+吉)+⻌|Đi (⻌) hết một vòng (周) bảy ngày là một tuần (週).\n曜|日+翟(羽+隹)|Mặt trời (日) như con chim trĩ (翟) bay qua bầu trời mỗi ngày: ngày trong tuần (曜).\n春|𡗗(三+人)+日|Ba (三) người (人) chắp tay (𡗗) đón ánh mặt trời (日) ấm áp: mùa xuân (春).\n夏|一+自+夂|Một (一) mình tự (自) lê bước chậm chạp (夂) dưới nắng, mồ hôi nhễ nhại: mùa hè (夏).\n秋|禾+火|Lúa (禾) chín vàng rực như lửa (火): mùa thu (秋).\n冬|夂+冫|Bước chân chậm chạp (夂) trên lớp băng (冫): mùa đông (冬).\n兄|口+儿|Cái miệng (口) to đặt trên đôi chân (儿): người anh suốt ngày sai bảo (兄).\n弟|丷+弓+丨+丿|Thằng em tóc chỏm hai sừng (丷) quấn dây cung (弓) quanh cây gậy (丨), vạt áo phẩy (丿) bay khi chạy theo anh: em trai (弟).\n姉|女+市(亠+巾)|Người phụ nữ (女) tháo vát đi chợ (市) lo việc nhà: chị gái (姉).\n妹|女+未(一+木)|Cô gái (女) chưa (未) lớn: em gái (妹).\n親|立+木+見(目+儿)|Đứng (立) trên cây (木) nhìn (見) ngóng con về: cha mẹ, người thân (親).\n族|方+𠂉+矢|Cả họ tụ về một phương (方) dưới nét phẩy ngang (𠂉) như lá cờ, ai cũng cầm mũi tên (矢): gia tộc (族).\n私|禾+厶|Bó lúa (禾) của riêng (厶) tôi: tôi, riêng tư (私).\n自||Hình cái mũi, người Nhật chỉ vào mũi khi nói về mình: tự mình (自).\n者|耂+日|Ông già (耂) ngồi phơi nắng (日) kể về những người (者) từng làm việc ấy.\n員|口+貝(目+八)|Có miệng (口) ăn, có tiền (貝) lương: nhân viên (員).\n主|丶+王|Đốm lửa (丶) cháy trên đầu vua (王): người làm chủ (主).\n体|亻+本(木+一)|Con người (亻) lấy cái gốc (本) là cơ thể (体).\n力||Bắp tay gồng lên như lưỡi cày cắm xuống đất: sức lực (力).\n心||Quả tim ở giữa với ba giọt máu bắn ra: tim, lòng (心).\n病|疒+丙(一+内)|Nằm trên giường bệnh (疒), lửa sốt can Bính (丙) nóng hầm hập: bị bệnh (病).\n院|⻖+完(宀+元)|Bên gò đất (⻖) có toà nhà đã hoàn thành (完): viện (院).\n医|匸+矢|Rút mũi tên (矢) ra, giấu (匸) đi rồi chữa vết thương: y học (医).\n死|歹(一+夕)+匕|Bộ xương tàn (歹) cạnh người ngã gục cong như cái thìa (匕): chết (死).\n勉|免+力|Muốn thoát khỏi (免) cái dốt thì phải dùng sức (力): cố gắng (勉).\n強|弓+厶+虫|Một mình (厶) con bọ (虫) cũng kéo được cây cung (弓) thì thật mạnh (強).\n習|羽+白|Chim non vỗ đôi cánh (羽) trắng (白) tập bay mỗi ngày: học, luyện (習).\n研|石+开(干+干)|Lấy đá (石) mài cho thật bằng phẳng (开): mài giũa, nghiên cứu (研).\n究|穴+九|Chui vào hang (穴) sâu chín (九) tầng để tìm tòi đến cùng (究).\n教|孝(耂+子)+攵|Cầm roi đánh nhẹ (攵) để dạy con hiếu thảo (孝): dạy (教).\n室|宀+至(一+厶+土)|Đi đến (至) dưới mái nhà (宀) là vào phòng (室).\n字|宀+子|Đứa trẻ (子) ngồi dưới mái nhà (宀) tập viết chữ (字).\n漢|氵+艹+口+夫|Bên bờ nước (氵) cỏ (艹) mọc, cái miệng (口) của anh chồng (夫) nói tiếng Hán (漢).\n文|亠+乂|Đội mũ (亠), ngồi vắt chéo chân (乂) mà làm văn (文).\n英|艹+央|Bông hoa nổi bật chính giữa (央) đám cỏ (艹): tài giỏi, anh tú (英).\n質|斤+斤+貝(目+八)|Đem cái rìu (斤) này với cái rìu (斤) kia đổi lấy sò (貝) thì phải xem kỹ chất lượng (質).\n問|門+口|Cái miệng (口) đứng giữa cổng (門) mà hỏi (問).\n題|是(日+疋)+頁|Viết điều đúng (是) lên đầu (頁) trang giấy: đề bài, chủ đề (題).\n答|竹+合(人+一+口)|Ghép các thẻ tre (竹) cho khớp (合) thành câu trả lời (答).\n試|言+式(弋+工)|Nói (言) theo đúng nghi thức (式) để thử tài: thử (試).\n験|馬+㑒|Dắt ngựa (馬) ra cho tất cả (㑒) mọi người cùng xem xét: kiểm nghiệm, thi (験).\n図|囗+⺍+乂|Trong khung (囗) vẽ mấy chấm (⺍) và dấu chéo (乂) đánh dấu: bản vẽ, sơ đồ (図).\n館|飠+官(宀+𠂤)|Nơi ăn (飠) ở của quan (官): toà nhà lớn (館).\n言|亠+二+口|Cái miệng (口) phát ra hai (二) tầng âm thanh bay lên tận nắp (亠): lời nói (言).\n思|田+心|Ruộng (田) nằm trên tim (心): lúc nào cũng nghĩ về mùa màng (思).\n考|耂+丂|Ông già (耂) thở hổn hển (丂) ngồi gãi đầu suy nghĩ (考).\n知|矢+口|Lời từ miệng (口) bay thẳng trúng đích như mũi tên (矢): người biết (知) rõ mới nói thế.\n作|亻+乍|Người (亻) chợt (乍) nảy ra ý tưởng là bắt tay ngay vào làm (作).\n使|亻+吏|Người (亻) sai viên quan lại (吏) đi làm việc: sai khiến, sử dụng (使).\n持|扌+寺(土+寸)|Bàn tay (扌) giữ chặt mâm lễ mang lên chùa (寺): cầm, giữ (持).\n待|彳+寺(土+寸)|Bước chân (彳) đi tới cổng chùa (寺) rồi đứng chờ (待) sư ra mở cửa.\n立||Hình người dang tay dang chân đứng thẳng trên mặt đất: đứng (立).\n走|土+龰|Trên mặt đất (土) đôi bàn chân (龰) cắm đầu mà chạy (走).\n歩|止+少|Dừng (止) lại một chút (少) rồi bước tiếp, cứ thế mà đi bộ (歩).\n起|走+己|Bản thân (己) bật dậy chạy (走) ngay: thức dậy, khởi đầu (起).\n着|羊+目|Con cừu (羊) vừa đến nơi đã giương mắt (目) ngắm bộ áo mới mặc trên người: mặc, đến nơi (着).\n住|亻+主(丶+王)|Người (亻) làm chủ (主) căn nhà thì sống ở (住) đó.\n帰|刂+帚(⺕+冖+巾)|Cầm dao (刂) và cái chổi (帚), cô dâu trở về (帰) nhà chồng lo dọn dẹp.\n送|关+⻌|Tiễn bạn đi trên đường (⻌) tới tận cửa ải (关): tiễn, gửi đi (送).\n借|亻+昔(龷+日)|Người (亻) cứ nhắc chuyện ngày xưa (昔) thân thiết là sắp hỏi mượn (借) tiền.\n貸|代+貝|Thay (代) mặt nhà băng đưa tiền sò (貝) cho người khác mượn: cho vay (貸).\n売|士+冖+儿|Kẻ sĩ (士) đội khăn (冖) đứng trên đôi chân (儿) ngoài chợ rao bán (売) hàng.\n開|門+开|Gỡ hai thanh then cài ngang (开) khỏi cánh cổng (門) để mở (開) cửa.\n始|女+台(厶+口)|Người phụ nữ (女) bước lên bục (台) bắt đầu (始) phát biểu.\n終|糸+冬(夂+冫)|Sợi chỉ (糸) dệt đến mùa đông (冬) là hết cuộn: kết thúc (終).\n止||Hình dấu bàn chân đứng yên một chỗ: dừng (止).\n切|七+刀|Lấy dao (刀) chém bảy (七) nhát: cắt (切).\n転|車+云(二+厶)|Bánh xe (車) lăn nhanh như mây (云) trôi: lăn, chuyển (転).\n運|軍(冖+車)+⻌|Đoàn xe quân đội (軍) chở hàng trên đường (⻌): vận chuyển (運).\n動|重+力|Dùng sức (力) đẩy vật nặng (重) cho nó chuyển động (動).\n集|隹+木|Đàn chim (隹) bay về đậu kín trên cây (木): tập hợp (集).\n計|言+十|Miệng nói (言) đếm từ một đến mười (十): đo đếm, tính kế (計).\n写|冖+与|Chui dưới tấm khăn trùm (冖) của máy ảnh xưa, nó cho (与) ra tấm hình: chép, chụp (写).\n映|日+央|Mặt trời (日) chiếu ánh sáng vào chính giữa (央) màn hình: chiếu (映).\n歌|哥(可+可)+欠|Ông anh (哥) há miệng (欠) ra hát vang bài ca (歌).\n仕|亻+士|Người (亻) theo hầu kẻ sĩ (士): phục vụ, làm việc (仕).\n事|一+口+⺕+亅|Một (一) cái miệng (口) kể chuyện, tay (⺕) cầm cái bút móc (亅) ghi lại sự việc (事).\n業|业+羊+木|Ngồi gốc cây (木) chăn cừu (羊) là nghề (业) nhà truyền đời: nghề nghiệp (業).\n工||Hình cây thước thợ có hai đầu ngang: người thợ, công việc (工).\n場|土+昜(日+一+勿)|Mảnh đất (土) có nắng lên (昜) chan hòa là nơi (場) mọi người tụ họp.\n世||Ba chữ mười nối liền nhau: ba mươi năm là một đời, một thế hệ (世).\n界|田+介|Ruộng (田) nhờ người môi giới (介) chia ranh giới (界).\n代|亻+弋|Người (亻) cầm cọc (弋) đứng gác thay (代) cho bạn.\n用||Hình cái thùng gỗ có đai ngang, đựng đồ để dùng (用).\n料|米+斗|Đong gạo (米) bằng cái đấu (斗) để tính phí nguyên liệu (料).\n理|王+里|Viên ngọc (王) mài theo đường vân như đường làng (里) mới đúng lý (理).\n品|口+口+口|Ba cái hộp (口) xếp chồng lên nhau: hàng hoá (品).\n物|牛+勿|Con bò (牛) là món đồ quý chớ (勿) để mất: đồ vật (物).\n発|癶+二+儿|Hai chân gạt ra (癶), hai (二) cẳng (儿) phóng đi: xuất phát (発).\n特|牛+寺(土+寸)|Con bò (牛) được nuôi trong chùa (寺) là con bò đặc biệt (特).\n別|口+勹+刂|Miệng (口) cãi nhau, gói (勹) đồ, cầm dao (刂) cắt đôi tài sản: chia tay, riêng biệt (別).\n不||Con chim vỗ cánh bay vút lên trời rồi không (不) trở lại.\n公|八+厶|Chia (八) cái riêng tư (厶) ra cho mọi người: của chung, công cộng (公).\n以|乚+丶+人|Người (人) lấy (以) lưỡi cày móc (乚) gieo hạt (丶) để làm mốc ranh ruộng.\n度|广(厂)+廿+又|Dưới mái nhà (广), bàn tay (又) đo đi đo lại hai mươi (廿) lần cho đúng mức độ (度).\n有|𠂇+月|Bàn tay (𠂇) cầm được miếng thịt (月) là đã có (有).\n正|一+止|Dừng (止) lại đúng ngay vạch kẻ (一) mới là đúng (正).\n真|十+具(目+一+八)|Mười (十) món dụng cụ (具) đều là đồ thật, hàng chân chính (真).\n意|音(立+日)+心|Âm thanh (音) phát ra từ trái tim (心) chính là ý nghĩ (意).\n味|口+未(木)|Miệng (口) nếm thử món chưa (未) biết để xem mùi vị (味).\n注|氵+主(丶+王)|Rót nước (氵) cho ông chủ (主) thì phải chú ý (注).\n京|亠+口+小|Mái đầu (亠), cổng lớn (口) dựng trên cột nhỏ (小): toà tháp giữa kinh đô (京).\n町|田+丁|Ruộng (田) bên con phố (丁) dần thành thị trấn (町).\n田||Thửa ruộng vuông có bờ chia thành bốn ô: ruộng (田).\n野|里+予|Ngoài làng (里) là chỗ dự định (予) khai hoang: cánh đồng hoang dã (野).\n地|土+也|Đất (土) mà con rắn (也) bò khắp nơi chính là mặt đất (地).\n方||Lá cờ có cán và đầu chóp chỉ về một phương hướng (方).\n海|氵+毎|Nước (氵) mỗi (毎) ngày dồn về một chỗ thành biển (海).\n洋|氵+羊|Nước (氵) gợn sóng như lưng đàn cừu (羊) ngoài đại dương (洋).\n屋|尸+至(厶+土)|Cái mái (尸) che chỗ ta đi đến (至) nghỉ chân: nhà, tiệm (屋).\n堂|尚(⺌+冂+口)+土|Toà nhà được coi trọng (尚) dựng trên nền đất (土) cao: hội trường (堂).\n台|厶+口|Riêng (厶) mình ta đứng lên bục cao, mở miệng (口) phát biểu: cái bệ, cái đài (台).\n建|聿+廴|Cầm bút (聿) vẽ xong thì dẫn (廴) thợ đến xây dựng (建).\n家|宀+豕|Dưới mái nhà (宀) có nuôi con lợn (豕) là một gia đình, ngôi nhà (家).\n風|几+丿+虫|Gió lùa vào khung (几), nét phẩy (丿) cuốn bay con sâu bọ (虫): gió (風).\n音|立+日|Đứng (立) chờ mặt trời (日) lên, nghe tiếng chim hót: âm thanh (音).\n色|𠂊+巴|Con dao (𠂊) khắc hoa văn xoáy (巴) rồi tô lên màu sắc (色).\n紙|糸+氏|Sợi tơ (糸) của họ (氏) nhà ông đồ ép mỏng thành giấy (紙).\n肉||Khối thịt có khung ngoài, bên trong là thớ thịt bắt chéo: thịt (肉).\n飯|飠+反(厂+又)|Đồ ăn (飠) phải đảo lật (反) cho chín mới là cơm (飯).\n茶|艹+人+木|Cỏ lá (艹) mà người (人) hái từ cây (木) về pha trà (茶).\n鳥|𩾏+灬|Con chim không chân (𩾏) mọc thêm bốn cái móng (灬) đậu trên cành: chim (鳥).\n牛||Đầu con bò nhìn thẳng có một bên sừng vểnh lên: con bò (牛).\n犬|大+丶|Người to (大) dắt theo một chấm nhỏ (丶) bên cạnh: con chó (犬).\n服|月+卩+又|Thân người (月) quỳ (卩) xuống, tay (又) mặc áo vào: quần áo (服).\n旅|方+𠂉+𧘇|Đi theo hướng (方) lá cờ (𠂉) phất, khoác vạt áo (𧘇) lên đường du lịch (旅).\n明|日+月|Mặt trời (日) và mặt trăng (月) cùng chiếu thì sáng (明).\n広|广+厶|Dưới mái (广) chỉ có riêng (厶) mình ta thì thấy thật rộng (広).\n近|斤+⻌|Vác cái rìu (斤) đi một quãng đường (⻌) ngắn là tới, rất gần (近).\n重|千+里|Nghìn (千) dặm (里) đường gánh hàng thì thấy nặng nề (重).\n早|日+十|Mặt trời (日) vừa nhô lên khỏi mười (十) ngọn cỏ là trời còn sớm (早).\n急|𠂊+⺕+心|Dao (𠂊) kề, tay (⺕) chụp, trái tim (心) đập gấp gáp (急).\n悪|亜+心|Trái tim (心) chỉ xếp thứ hai (亜), lòng dạ    nd:{u:'câu',ns:[5,10,15,20],d:10,src:1,wf:1,fb:1,ty:[['','Trộn hai dạng'],['sx','Nghe rồi sắp xếp các cụm'],['gl','Nghe rồi gõ lại cả câu']],desc:'Nghe câu ví dụ của từ, chỉnh được tốc độ từ 0.5x đến 2x, rồi sắp xếp lại các cụm hoặc gõ lại cả câu.'},

  const vf0=VARS.vf;VARS.vf=w=>vf0(w).map(x=>x&&x[0]==='a'?['a',()=>addEx(x[1](),w),1]:x&&x[0]==='l'?['l',()=>addEx(x[1](),w)]:x).concat(w.ex?[['e',()=>fWe(w)]]:[]);
  Object.assign(VARS,{
   nn:w=>[['r',()=>qType(w,'r'),1],['v',()=>qType(w,'v'),1],w.hv&&hasKj(w)&&['h',()=>qType(w,'h')]],
   dt:w=>[['',()=>qDT(w),1]],
   nd:w=>[['sx',()=>qOrd(w),1],['gl',()=>qGl(w)]],

  const mt0=modeTiers;
  modeTiers=function(m,ty,days,ord){
    if(!PX[m])return mt0(m,ty,days,ord);

/* Đấu trí: đếm ngược, bấm giờ, bảng thành tích riêng */
function duelRun(title,qs,o,c){
  const key=c.src==='weeks'?'w'+c.weeks.join(','):c.src,lab=c.src==='weeks'?'Tuần '+c.weeks.join(', '):c.src==='all'?'Toàn bộ khoá':'Các bài đã học';

    const t0=Date.now();
    startQuiz(title,qs,Object.assign({},o,{duel:t0,done:pct=>{
      const p=P(),z=QZ,ok=z.res.filter(x=>x===true).length,sec=Math.round((Date.now()-t0)/100)/10;
      p.duel=p.duel||{};const L=(p.duel[key]=p.duel[key]||[]);const me={ok,n:z.qs.length,sec,d:today()};L.push(me);
      L.sort((a,b)=>b.ok/b.n-a.ok/a.n||a.sec-b.sec);L.splice(10);save();const rk=L.indexOf(me);

        <p class="mute">Bảng thành tích của hồ sơ này, phạm vi: ${esc(lab)}.</p>`)},0)}}));
  };tick();
}

/* Phím tắt: Space lật thẻ hoặc sang câu tiếp, Z đã nhớ, X chưa nhớ, R nghe, 1–9 chọn cụm, Backspace xoá cụm */

  const z=QZ;if(!z||z.fin||!z.qs||e.ctrlKey||e.metaKey||e.altKey)return;const q=z.qs[z.i],k=q.kind||'mc',inInput=/INPUT|TEXTAREA/.test(document.activeElement&&document.activeElement.tagName);
  if(k==='type'&&e.key==='Enter'&&!z.shown){e.preventDefault();typeCheck();return}

  const key=e.key.toLowerCase();
  if(k==='flash'){
    if(key===' '){e.preventDefault();if(!z.flip){z.flip=true;drawQ();if(q.say)say(q.say)}else{z.res[z.i]=true;nextQ()}}
    else if(key==='z'){z.res[z.i]=true;nextQ()}else if(key==='x'){z.res[z.i]=false;nextQ()}

/* ----- Chiết tự: cấu tạo chữ từ các bộ, sơ đồ, gợi ý cách nhớ, chữ cùng bộ -----
   Bật khi file có RAW.kp (chữ|cấu tạo|gợi ý) và RAW.kc (bộ|TÊN|nghĩa|gốc). */
const KP={},KC={},KUSE={};
(RAW.kc||'').split('\n').forEach(ln=>{if(!ln)return;const [c,n,m,o]=ln.split('|');KC[c]={c,n,m,o:o||''}});
function kpParse(s){s=Array.from(s||'');let i=0;const rec=()=>{const out=[];while(i<s.length){const n={c:s[i++],sub:[]};if(s[i]==='('){i++;n.sub=rec();i++}out.push(n);if(s[i]==='+'){i++;continue}break}return out};return s.length?rec():[]}
(RAW.kp||'').split('\n').forEach(ln=>{if(!ln)return;const [c,t,h]=ln.split('|');KP[c]={tree:kpParse(t),hint:h||''};if(K[c]&&h)K[c].tip=h;
  const seen=new Set(),walk=xs=>xs.forEach(x=>{if(!seen.has(x.c)){seen.add(x.c);(KUSE[x.c]=KUSE[x.c]||[]).push(c)}walk(x.sub)});walk(KP[c].tree)});
const HASKP=Object.keys(KP).length>0;
const kcLab=c=>{const x=KC[c];return x?`${x.n} · ${x.m}`:K[c]?`${K[c].hv} · ${K[c].m}`:''};
const kpTop=c=>(KP[c]&&KP[c].tree||[]).map(x=>x.c);
function kpSvg(c){
  const t=KP[c]&&KP[c].tree;if(!t||!t.length)return '';
  const W=340,R=19,G=72,rows=t.some(x=>x.sub.length)?3:2,H=rows*G+4,nodes=[],edges=[];
  const root={c,x:W/2,y:H-28,lv:0};nodes.push(root);
  const l2=[];t.forEach((x,i)=>{const n={c:x.c,x:W*(i+1)/(t.length+1),y:H-28-G,lv:1};nodes.push(n);edges.push([n,root]);
    x.sub.forEach((y,j)=>{const m={c:y.c,x:n.x+52*(j-(x.sub.length-1)/2),y:n.y-G,lv:2,p:n};l2.push(m);nodes.push(m);edges.push([m,n])})});
  for(let k=0;k<6;k++)for(let i=1;i<l2.length;i++){const a=l2[i-1],b=l2[i];if(b.x-a.x<52){const d=(52-(b.x-a.x))/2;a.x-=d;b.x+=d}}
  l2.forEach(m=>{m.x=Math.max(18,Math.min(W-18,m.x))});
  const ar=([a,b])=>{const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),ux=dx/d,uy=dy/d,r1=a.lv===2?15:R,r2=b.lv===0?R+4:R;
    return `<line x1="${a.x+ux*r1}" y1="${a.y+uy*r1}" x2="${b.x-ux*(r2+2)}" y2="${b.y-uy*(r2+2)}" marker-end="url(#kpa)"/>`};
  return `<svg class="kpsvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Sơ đồ cấu tạo chữ ${c}"><defs><marker id="kpa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z"/></marker></defs>
    <g class="e">${edges.map(ar).join('')}</g>${nodes.map(n=>{const r=n.lv===0?R+4:n.lv===2?15:R;
    return `<g class="n l${n.lv}" ${n.lv?`data-act="kpart" data-c="${n.c}" tabindex="0" role="button" aria-label="${esc(n.c+' '+kcLab(n.c))}"`:''}><circle cx="${n.x}" cy="${n.y}" r="${r}"/><text x="${n.x}" y="${n.y}" dy=".36em" class="jp">${n.c}</text>${n.lv?`<text class="lb" x="${n.x}" y="${n.y+r+11}">${esc((KC[n.c]||{}).n||(K[n.c]||{}).hv||'')}</text>`:''}</g>`}).join('')}</svg>`;
}
const kpUse=(c,self)=>(KUSE[c]||[]).filter(x=>x!==self&&K[x]).slice(0,14);
function kpBlock(k){
  const p=KP[k.c];if(!p)return '';const top=kpTop(k.c);
  return `<section class="kparts"><h4>Cấu tạo</h4>${top.length?`<p class="kpchips">${top.map(c=>`<button class="kpc" data-act="kpart" data-c="${c}"><b class="jp">${c}</b><span>${esc(kcLab(c))}</span></button>`).join('<span class="plus">+</span>')}</p>${kpSvg(k.c)}`:'<p class="mute">Chữ tượng hình gốc, không tách thành bộ nhỏ hơn.</p>'}

/* Câu hỏi ghép bộ */
function qParts(k,rev){
  const top=kpTop(k.c);if(top.length<2)return null;const lab=c=>`${c} ${kcLab(c)}`;
  const pool=shuf(Object.keys(KP).filter(x=>x!==k.c&&K[x]&&kpTop(x).length>=2)),near=pool.filter(x=>kpTop(x).some(c=>top.includes(c))).concat(pool);
  const exp=`<b class="jp">${k.c}</b> ${k.hv}: ${esc(k.m)} = ${top.map(c=>`<span class="jp">${c}</span> (${esc(kcLab(c))})`).join(' + ')}${KP[k.c].hint?`<br>${esc(KP[k.c].hint)}`:''}`;

  <tr><td>Nghe hiểu</td><td>35 phút</td><td>Nghe nhiệm vụ 8 · Nghe điểm chính 7 · Chọn câu nói 5 · Đáp lời nhanh 8</td><td>28</td></tr></table>
  <p class="mute">Điểm quy đổi về thang 180 (đỗ từ 90, điểm liệt 38/120 và 19/60). Phần nghe phát ở tốc độ tự nhiên, mỗi câu chỉ nghe một lần và hội thoại có chi tiết gây nhiễu. Giọng đọc là giọng tổng hợp của trình duyệt nên đều và rõ hơn băng thật; hãy luyện thêm bằng đề mẫu chính thức của JLPT trước ngày thi.</p>
  <div class="cards">${[1,2].map(i=>`<button class="pcard" data-act="exam" data-no="${i}"><b>Đề số ${i}</b><span>${ex[i]?`${ex[i].tot}/180, ${ex[i].pass?'đạt':'chưa đạt'} (${fmtY(pd(ex[i].d))})`:'Chưa làm'}</span></button>`).join('')}
  <button class="pcard" data-act="exam" data-no="0"><b>Đề trộn lại</b><span>Trộn câu của cả hai đề. Chỉ nên làm sau khi xong hai đề trên.</span></button></div>`;
}
function kdict(lv){
  lv=+lv===5?5:4;
  return `<h1>Bảng kanji</h1><p class="lead">${ORD[4].length} chữ N4 của lộ trình này và ${ORD[5].length} chữ N5 để ôn lại. Bấm vào một chữ để xem thứ tự nét, âm đọc, mẹo nhớ và tập viết.</p>
  <div class="tabs">${[4,5].map(l=>`<a class="${l===lv?'on':''}" href="#/kanji/${l}">N${l} (${ORD[l].length})</a>`).join('')}</div>
  <div class="kgridv">${ORD[lv].map(c=>`<button class="jp${P().wrong['k:'+c]?' w':''}" data-act="kopen" data-k="${c}" title="${K[c].hv}: ${esc(K[c].m)}">${c}</button>`).join('')}</div>
  <div class="row"><button class="btn" data-act="prac" data-m="kf">Lật thẻ kanji N4</button><button class="btn line" data-act="prac" data-m="kq">Trắc nghiệm kanji N4</button></div>`;
}
function wrongV(){
  const ks=Object.keys(P().wrong);
  const row=k=>{if(k[0]==='k'){const x=K[k.slice(2)];return x&&`<b class="jp">${x.c}</b><span>${x.hv}: ${esc(x.m)}</span>`}
    if(k[0]==='w'){const x=W[k.slice(2)];return x&&`<b class="jp">${wordHtml(x)}</b><span>${esc(x.m)}</span>`}
    const e=GEX[k];return e&&`<b class="jp">${esc(e.g.t)}</b><span class="jp">${exFull(e,1)}</span>`};
  return `<h1>Sổ lỗi</h1><p class="lead">Kanji, từ vựng và mẫu ngữ pháp bạn trả lời sai được ghi lại ở đây. Trả lời đúng lại đủ số lần đã sai thì mục đó tự rời khỏi sổ.</p>
  ${ks.length?`<div class="row"><button class="btn" data-act="wquiz">Luyện lại ${Math.min(20,ks.length)} mục</button></div><ul class="outl">${ks.map(k=>{const r=row(k);return r?`<li>${r}<small>sai ${P().wrong[k]} lần</small></li>`:''}).join('')}</ul>`:'<p class="note">Sổ đang trống. Làm bài tập của một ngày bất kỳ, những câu sai sẽ xuất hiện ở đây.</p>'}`;
}
function setV(){
  const p=P();
  return `<h1>Cài đặt</h1>
  <section class="sec"><h2>Hồ sơ đang dùng</h2><div class="form"><label>Tên<input id="s-name" value="${esc(p.name)}"></label><label>Ngày bắt đầu<input id="s-start" type="date" value="${p.start}"></label></div>
  <div class="row"><button class="btn" data-act="saveset">Lưu thay đổi</button></div></section>
  <section class="sec"><h2>Hiển thị và giọng đọc</h2><label class="chk"><input type="checkbox" data-act="furi" ${p.furi!==false?'checked':''}> Hiện furigana trên kanji</label>
  <div class="form"><label>Giao diện <select data-act="theme"><option value="">Theo thiết bị</option><option value="light"${p.theme==='light'?' selected':''}>Sáng</option><option value="dark"${p.theme==='dark'?' selected':''}>Tối</option></select></label>
  <label>Tốc độ đọc <select data-act="rate">${[[.7,'Chậm'],[.9,'Vừa'],[1,'Tự nhiên'],[1.15,'Nhanh']].map(([v,t])=>`<option value="${v}"${(p.rate||.9)==v?' selected':''}>${t}</option>`).join('')}</select></label></div>
  <div class="row"><button class="btn line" data-act="ttstest">${SPK} Thử giọng đọc</button></div>
  <p class="mute">Phần nghe dùng giọng tiếng Nhật có sẵn của thiết bị. Nếu bấm thử mà không có tiếng hoặc nghe như đọc tiếng Anh, hãy cài thêm giọng tiếng Nhật trong phần cài đặt ngôn ngữ của máy, hoặc mở trang bằng Chrome, Edge hay Safari.</p></section>
  <section class="sec"><h2>Các hồ sơ trên máy này</h2><p class="mute">Mỗi hồ sơ có tiến độ và sổ lỗi riêng. Dữ liệu chỉ nằm trong trình duyệt này, không gửi đi đâu.</p>
  <ul class="outl">${Object.values(DB.profiles).map(q=>`<li><b>${esc(q.name)}</b><span>bắt đầu ${fmtY(pd(q.start))}</span>${q.id===p.id?'<small>đang dùng</small>':`<button class="btn sm line" data-act="switch" data-id="${q.id}">Chuyển sang</button>`}</li>`).join('')}</ul>
  <div class="row"><button class="btn line" data-act="addp">Thêm hồ sơ mới</button></div></section>
  <section class="sec"><h2>Sao lưu</h2><p class="mute">Xoá dữ liệu trình duyệt sẽ làm mất tiến độ. Hãy tải bản sao lưu định kỳ, hoặc dùng nó để chuyển sang máy khác.</p>
  <div class="row"><button class="btn line" data-act="export">Tải bản sao lưu</button><label class="btn line">Khôi phục từ tệp<input type="file" accept="application/json" id="imp" hidden></label></div>
  <div class="row"><button class="btn sm danger" data-act="reset">Xoá tiến độ của hồ sơ này</button>${Object.keys(DB.profiles).length>1?'<button class="btn sm danger" data-act="delp">Xoá hồ sơ này</button>':''}</div></section>
  <section class="sec"><h2>Nguồn dữ liệu</h2><p class="mute">Nét viết kanji: KanjiVG © Ulrich Apel, giấy phép CC BY-SA 3.0. Âm On, Kun và phân cấp JLPT: KANJIDIC2 © EDRDG, giấy phép CC BY-SA 4.0. JLPT không công bố danh sách chính thức, phân cấp chỉ mang tính tham khảo.</p></section>`;
}
let lastHash=null;
function render(keep){
  const app=$('#app');
  if(!P()){app.innerHTML=onboard();return}
  const p=P();if(p.theme)document.documentElement.dataset.theme=p.theme;else delete document.documentElement.dataset.theme;
  document.body.classList.toggle('nofuri',p.furi===false);
  const [r,a]=(location.hash.slice(2)||'').split('/'),y=scrollY;
  const v=r==='plan'?plan():r==='day'?day(+a||todayN()):r==='prac'?pracV():r==='exam'?examV():r==='kanji'?kdict(a):r==='wrong'?wrongV():r==='set'?setV():home();
  app.innerHTML=`<nav class="nav"><a class="brand" href="#/"><span class="jp">日本語</span>JLPT N4</a>${NAV.map(([h,t,g])=>`<a href="#/${h}" class="${(r||'')===h||(h==='plan'&&r==='day')||(h==='prac'&&r==='wrong')?'on':''}"><span class="jp">${g}</span>${t}</a>`).join('')}</nav>
  <main>${LS.ok?'':'<p class="note">Trình duyệt đang chặn lưu trữ ở chế độ xem này nên tiến độ sẽ mất khi đóng trang. Hãy mở tệp trực tiếp bằng trình duyệt hoặc đưa lên hosting để lưu được lâu dài.</p>'}${v}</main>`;
  scrollTo(0,keep&&lastHash===location.hash?y:0);lastHash=location.hash;
}

/* ================= Sự kiện ================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,p=P(),z=QZ,q=z&&z.qs&&z.qs[z.i];
  if(a==='create'){const s=$('#o-start').value;if(!s){toast('Hãy chọn ngày bắt đầu.');return}newProfile($('#o-name').value.trim()||'Bạn',s);location.hash='#/';render()}
  else if(a==='back'){DB.cur=Object.keys(DB.profiles)[0];render()}
  else if(a==='say'){e.stopPropagation();say(t.dataset.t)}
  else if(a==='anim') animate(t.closest('.kcard').querySelector('.genko svg'));
  else if(a==='kopen'){openModal(kCard(K[t.dataset.k]));animate($('#modal .genko svg'))}
  else if(a==='pad') openPad(t.dataset.k);
  else if(a==='padclr'){const c=$('#modal canvas');c.getContext('2d').clearRect(0,0,c.width,c.height)}
  else if(a==='close'){stopAudio();closeModal()}
  else if(a==='reveal') t.classList.toggle('show');
  else if(a==='kwall'){const k=KW[t.dataset.l];speak(k.lines.map(l=>({t:l.jp,v:VOI[l.s]})))}
  else if(a==='kwshow') t.closest('.sec').querySelector('.kwl').classList.toggle('veil');
  else if(a==='role'){RP={L:+t.dataset.l,r:t.dataset.r,i:0};roleStep()}
  else if(a==='rpshow'){$('#rpa').hidden=false;const ln=KW[RP.L].lines[RP.i];speak([{t:ln.jp,v:VOI[ln.s]}])}
  else if(a==='rpnext'){RP.i++;roleStep()}
  else if(a==='quiz'){const n=+t.dataset.n,s=t.dataset.sec,d=D(n);startQuiz(`Ngày ${n}: ${d.type==='lesson'?SECN[s]:dayLabel(d)}`,buildSec(n,s),{done:pct=>markDone(n,s,pct)})}
  else if(a==='exam'){const n=+t.dataset.n;startExam(+t.dataset.no,n?pct=>markDone(n,'q',pct):null)}
  else if(a==='exgo'){const ex=EXS,pt=ex.parts[ex.i];startQuiz(`${ex.no?'Đề '+ex.no:'Đề trộn lại'} · ${pt.title}`,pt.qs,{exam:true,limit:pt.min*60,chain:zz=>{ex.done.push(zz);QZ=null;if(++ex.i<3)examIntro();else examResult()}})}
  else if(a==='prac')openSetup(t.dataset.m);
  else if(a==='pgo')startPrac();
  else if(a==='wquiz') startQuiz('Luyện lại sổ lỗi',shuf(Object.keys(p.wrong)).slice(0,20).map(qFromKey));
  else if(a==='qplay') playQ();
  else if(a==='pick'){if(!z.shown)answer(+t.dataset.i,+t.dataset.i===q.a)}
  else if(a==='dchip'){const i=$('#din');i.value+=t.dataset.t}
  else if(a==='dclr') $('#din').value='';
  else if(a==='dcheck'){const v=$('#din').value;answer(v,dictOk(q,v))}
  else if(a==='czadd'){const st=z.ans[z.i],b=q.sol.findIndex((_,j)=>st.f[j]==null);if(b<0)return;const i=+t.dataset.i;st.f[b]=q.bank[i];st.u[b]=i;drawQ()}
  else if(a==='czrm'){const st=z.ans[z.i],b=+t.dataset.b;st.f[b]=null;st.u[b]=null;drawQ()}
  else if(a==='czcheck'){const st=z.ans[z.i];z.res[z.i]=q.sol.every((s,j)=>st.f[j]===s);if(z.opt.late)nextQ();else{z.shown=true;drawQ()}}
  else if(a==='flip'){z.flip=true;drawQ();if(q.say)say(q.say)}
  else if(a==='fyes'||a==='fno'){z.res[z.i]=a==='fyes';nextQ()}
  else if(a==='qnext') nextQ();
  else if(a==='qclose'){if((EXS||(z&&!z.fin&&z.res.length))&&!confirm('Thoát bài đang làm? Kết quả sẽ không được lưu.'))return;closeQuiz()}
  else if(a==='saveset'){const s=$('#s-start').value;if(!s){toast('Hãy chọn ngày bắt đầu.');return}p.name=$('#s-name').value.trim()||p.name;p.start=s;save();render();toast('Đã lưu thay đổi.')}
  else if(a==='ttstest') speak([{t:'こんにちは。わたし は リン です。',v:'f'},{t:'はじめまして。田中(たなか) です。よろしく おねがいします。',v:'m'}]);
  else if(a==='switch'){DB.cur=t.dataset.id;save();render();toast('Đã chuyển hồ sơ.')}
  else if(a==='addp'){DB.cur=null;render()}
  else if(a==='export'){const b=new Blob([JSON.stringify(DB)],{type:'application/json'}),l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='jlpt-n5-sao-luu.json';l.click();toast('Đã tải bản sao lưu.')}
  else if(a==='reset'){if(confirm('Xoá toàn bộ tiến độ và sổ lỗi của hồ sơ này?')){p.done={};p.wrong={};p.act={};p.exams={};save();render();toast('Đã xoá tiến độ.')}}
  else if(a==='delp'){if(confirm(`Xoá hồ sơ “${p.name}”?`)){delete DB.profiles[p.id];DB.cur=Object.keys(DB.profiles)[0];save();render()}}
});
document.addEventListener('change',e=>{
  const t=e.target,a=t.dataset.act;
  if(t.dataset.ps){setPS(t);return}
  if(a==='hide') t.closest('.sec').querySelector('.vlist').classList.toggle('hidden',t.checked);
  else if(a==='furi'){P().furi=t.checked;save();render(true)}
  else if(a==='theme'){P().theme=t.value;save();render(true)}
  else if(a==='rate'){P().rate=+t.value;save()}
  else if(a==='scope'){P().scope=t.value;save()}
  else if(t.id==='imp'&&t.files[0]){const f=new FileReader();f.onload=()=>{try{const d=JSON.parse(f.result);if(!d.profiles||!Object.keys(d.profiles).length)throw 0;DB=d;if(!P())DB.cur=Object.keys(DB.profiles)[0];save();render();toast('Đã khôi phục dữ liệu.')}catch(x){toast('Tệp không đúng định dạng sao lưu.')}};f.readAsText(t.files[0])}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#modal').classList.contains('on')){stopAudio();closeModal()}return}
  const z=QZ;if(!z||z.fin||!z.qs)return;const q=z.qs[z.i],k=q.kind||'mc';
  if(k==='mc'&&/^[1-4]$/.test(e.key)&&!z.shown&&+e.key<=q.opts.length) answer(+e.key-1,+e.key-1===q.a);
  else if(e.key==='Enter'){if(z.shown){e.preventDefault();nextQ()}else if(k==='dict'){e.preventDefault();const v=$('#din').value;answer(v,dictOk(q,v))}}
});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'){stopAudio();closeModal()}});
addEventListener('hashchange',()=>render());
if(!P()&&Object.keys(DB.profiles).length) DB.cur=Object.keys(DB.profiles)[0];
render();
</script>
