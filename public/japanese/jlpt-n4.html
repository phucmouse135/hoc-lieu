<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lộ trình JLPT N4 trong 10 tuần</title>
<meta name="description" content="Lộ trình 10 tuần ôn JLPT N4: ngữ pháp, từ vựng, kanji có thứ tự nét, kaiwa, nghe hiểu, đọc hiểu và đề thi thử.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%2326497F'/%3E%3Ctext x='50' y='72' font-size='64' text-anchor='middle' fill='white'%3E四%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F5F8F4;--card:#FFFFFF;--ink:#1B2836;--mute:#5C6B78;--line:#D3DED5;--grid:#8FBF9F;--ai:#26497F;--ai-soft:#E3ECF8;--shu:#D23F2A;--shu-soft:#FBE8E4;--hl:#FFF1A6;--ok:#1B7A57;--ok-soft:#E0F3EA;
 --jp:"Klee One","Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo","Noto Sans JP",sans-serif;--ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#111922;--card:#18222E;--ink:#E7EDF1;--mute:#98A6B2;--line:#2A3848;--grid:#3E6B55;--ai:#93B6EE;--ai-soft:#1D2C44;--shu:#F0705C;--shu-soft:#3A211D;--hl:#5A5015;--ok:#5CC79B;--ok-soft:#173529}}
:root[data-theme="dark"]{--paper:#111922;--card:#18222E;--ink:#E7EDF1;--mute:#98A6B2;--line:#2A3848;--grid:#3E6B55;--ai:#93B6EE;--ai-soft:#1D2C44;--shu:#F0705C;--shu-soft:#3A211D;--hl:#5A5015;--ok:#5CC79B;--ok-soft:#173529}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--ui);-webkit-text-size-adjust:100%}
.jp{font-family:var(--jp);font-weight:600}
rt{font-size:.55em;font-weight:400;color:var(--mute);user-select:none}
.nofuri rt{display:none}
a{color:var(--ai)}
h1{font-size:1.75rem;line-height:1.25;margin:.2em 0 .3em;letter-spacing:-.01em}
h2{font-size:1.2rem;margin:0 0 .6em;display:flex;align-items:center;gap:.5em;flex-wrap:wrap}
h3{font-size:1.1rem;margin:0 0 .2em}
p{margin:.4em 0 .8em;max-width:68ch}
.mute{color:var(--mute);font-size:.92rem}.lead{font-size:1.05rem}
mark{background:var(--hl);color:inherit;padding:0 .15em;border-radius:3px}
:focus-visible{outline:3px solid var(--ai);outline-offset:2px}
#app{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:100vh}
.nav{position:sticky;top:0;align-self:start;height:100vh;padding:20px 12px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;background:var(--card)}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500}
.nav a .jp{width:28px;height:28px;display:grid;place-items:center;border:1.5px solid var(--grid);border-radius:4px;font-size:1rem}
.nav a.on{background:var(--ai-soft);color:var(--ai)}.nav a.on .jp{border-color:var(--ai)}
.nav .brand{font-weight:700;margin-bottom:14px;flex-direction:column;align-items:flex-start;gap:0;line-height:1.3}
.nav .brand .jp{border:0;width:auto;height:auto;font-size:1.5rem;color:var(--shu)}
main{padding:28px clamp(16px,4vw,48px) 96px;max-width:900px;width:100%}
.onb{max-width:460px;margin:0 auto;padding:8vh 20px;grid-column:1/-1}
.onb label,.form label{display:block;font-weight:500;margin:14px 0}
input:not([type=checkbox]),select{display:block;width:100%;margin-top:4px;padding:10px 12px;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:8px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0 16px}
.genko-row{display:flex;margin-bottom:18px}.genko-row span{width:64px;height:64px;display:grid;place-items:center;border:1.5px solid var(--grid);margin-right:-1.5px;font:600 2.2rem var(--jp);color:var(--shu)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border:1.5px solid var(--ai);border-radius:8px;background:var(--ai);color:var(--card);font:600 1rem var(--ui);text-decoration:none;cursor:pointer}
.btn.line{background:transparent;color:var(--ai)}.btn.sm{padding:6px 12px;font-size:.88rem}.btn.wide{width:100%;margin-top:10px}
.btn.danger{background:transparent;border-color:var(--shu);color:var(--shu)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0}
.note{background:var(--shu-soft);border-left:4px solid var(--shu);padding:10px 14px;border-radius:0 8px 8px 0;max-width:none}
.tip{background:var(--hl);padding:8px 12px;border-radius:8px;font-size:.95rem}
.tip::before{content:"Mẹo nhớ: ";font-weight:700}
.sec{margin:34px 0;padding-top:22px;border-top:1.5px solid var(--line)}
.crumb{font-size:.88rem;color:var(--mute);margin:0}
.hero{display:flex;gap:28px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.hero-k{display:flex}.hero-k .genko{width:clamp(84px,17vw,128px);margin-right:-1.5px;cursor:pointer;padding:0;background:var(--card)}
.genko{aspect-ratio:1;border:1.5px solid var(--grid);background:var(--card);position:relative;display:block}
.genko.txt{display:grid;place-items:center;font-size:clamp(3rem,10vw,4.6rem);color:var(--shu)}
.ksvg{display:block;width:100%;height:100%}
.ksvg path{fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.ksvg path.kgrid{stroke:var(--grid);stroke-width:.6;stroke-dasharray:3 3;opacity:.8}
.ksvg path.hi{stroke:var(--shu)}.ksvg path.ghost{stroke:var(--line)}
.ksvg text{font:600 7px var(--ui);fill:var(--shu)}
.ksvg.st path{stroke-width:5}.ksvg.st .kgrid{display:none}
.stamp{display:inline-grid;place-items:center;width:2em;height:2em;border:2px solid var(--shu);border-radius:50%;color:var(--shu);font:600 .95rem var(--jp);transform:rotate(-10deg);flex:none}
.stamp.sm{font-size:.75rem}.stamp.big{width:5.2rem;height:5.2rem;font-size:1.7rem;border-width:3px;margin:10px auto}
.stamp.fail{border-color:var(--mute);color:var(--mute)}
.todo,.outl,.vlist,.gx,.kw{list-style:none;padding:0;margin:10px 0}
.todo li,.outl li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:9px 2px;border-bottom:1px dashed var(--line)}
.todo li.done a{color:var(--mute);text-decoration:line-through}.todo span{color:var(--mute);font-size:.9rem}
.outl li>span{flex:1;color:var(--mute)}.outl li>b{min-width:9em}.outl small{color:var(--shu)}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));flex:1}
.cell{aspect-ratio:1;border:1.5px solid var(--grid);margin:0 -1.5px -1.5px 0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:3px;text-decoration:none;color:var(--ink);background:var(--card);position:relative;min-width:0}
.cell small{font-size:.62rem;color:var(--mute);line-height:1.2}.cell b{font-size:clamp(1rem,3.4vw,1.6rem);line-height:1;opacity:.85}
.cell.review b,.cell.mock b,.cell.final b{color:var(--ai)}
.cell.today{outline:3px solid var(--ai);outline-offset:-3px;z-index:1}
.cell .stamp{position:absolute;inset:0;margin:auto;width:70%;height:70%;font-size:clamp(.8rem,2.6vw,1.2rem);background:color-mix(in srgb,var(--card) 70%,transparent)}
.wk{display:flex;align-items:center;gap:10px;margin-bottom:1.5px}.wkl{width:74px;flex:none;font-weight:600;font-size:.85rem}.wkl small{display:block;font-weight:400;color:var(--mute);font-size:.7rem}
.pbar{display:grid;grid-template-columns:70px 1fr 60px;gap:10px;align-items:center;margin:6px 0;font-size:.9rem}
.pbar div,.qbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.pbar i,.qbar i{display:block;height:100%;background:var(--ok)}
.gcard{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:16px 18px;margin:14px 0}
.gcard h3{font-size:1.35rem;color:var(--ai)}.gm{font-weight:600;margin:0 0 8px}
.gs{background:var(--ai-soft);padding:8px 12px;border-radius:8px;max-width:none}
.gx li,.vlist li,.kw li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px dashed var(--line)}
.gx .jp,.pass{font-size:1.15rem;line-height:2}.gx .vi{display:block;color:var(--mute);font-size:.93rem}
.say{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:transparent;color:var(--ai);display:grid;place-items:center;cursor:pointer;margin-top:4px}
.vlist li{cursor:pointer;align-items:center}.vlist .jp{font-size:1.2rem;min-width:9.5em;line-height:2}.kw .jp{min-width:7em;font-size:1.1rem;line-height:2}
.vlist.hidden li:not(.show) .vm{filter:blur(6px)}
.chk{display:flex;gap:8px;align-items:center;margin:10px 0;font-size:.95rem}
.kcard{display:grid;grid-template-columns:200px minmax(0,1fr);gap:14px 22px;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:16px;margin:14px 0}
.kcard .hv{color:var(--shu);font-size:1.3rem;margin-right:.3em}
.chips span{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:0 10px;font-size:.8rem;margin-right:6px;color:var(--mute)}
.yomi{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:8px 0}.yomi dt{color:var(--mute);font-size:.88rem}.yomi dd{margin:0}
.steps{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px}.steps svg{width:54px;height:54px;border:1px solid var(--line);background:var(--card)}
.tabs{display:flex;gap:8px;margin:14px 0}.tabs a{padding:6px 14px;border:1.5px solid var(--line);border-radius:99px;text-decoration:none;color:var(--ink)}.tabs a.on{background:var(--ai);border-color:var(--ai);color:var(--card)}
.kgridv{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr))}
.kgridv button{aspect-ratio:1;border:1.5px solid var(--grid);margin:0 -1.5px -1.5px 0;background:var(--card);color:var(--ink);font-size:1.5rem;cursor:pointer;padding:0}
.kgridv button.w{background:var(--shu-soft)}.kgridv button:hover{background:var(--ai-soft)}
.pn{display:flex;justify-content:space-between;margin-top:40px}
#modal,#quiz{position:fixed;inset:0;z-index:50;display:none;overflow:auto}
#modal.on{display:grid;place-items:center;background:rgba(10,18,28,.55);padding:16px}
.sheet{background:var(--paper);border-radius:12px;padding:22px;width:min(680px,100%);max-height:92vh;overflow:auto;position:relative}
.sheet .kcard{border:0;padding:0;background:transparent;margin:0}
.x{position:absolute;top:8px;right:10px;width:36px;height:36px;border:0;background:transparent;font-size:1.6rem;color:var(--mute);cursor:pointer;z-index:2}
.pad{position:relative;width:min(320px,80vw);margin:10px auto}.pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
#quiz.on{display:block;background:var(--paper)}
.qwrap{max-width:680px;margin:0 auto;padding:16px 18px 80px}
.qhead{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:6px 0 10px}.qhead .x{position:static}.qhead b{flex:1}
.qtag{display:inline-block;margin:18px 0 6px;font-size:.82rem;font-weight:600;color:var(--ai);background:var(--ai-soft);padding:2px 10px;border-radius:99px}
.qtext{font-size:1.05rem}.qs{font-size:1.45rem;line-height:2.1;margin:10px 0}.qs.huge,.qs .huge{font-size:4rem;line-height:1.3}
.qs u{text-decoration-thickness:2px;text-underline-offset:6px}
.pass{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.bl{display:inline-block;min-width:3em;border-bottom:2px solid var(--ink);text-align:center;color:var(--shu);margin:0 2px}
.opts{display:grid;gap:10px;margin:16px 0}
.opt{display:flex;gap:12px;align-items:center;text-align:left;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:1.12rem;cursor:pointer;line-height:1.8}
.opt .on{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:600 .8rem var(--ui);flex:none}
.opt:not(:disabled):hover{border-color:var(--ai)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.no{border-color:var(--shu);background:var(--shu-soft)}
.fb{padding:12px 16px;border-radius:10px;margin:8px 0}.fb.good{background:var(--ok-soft)}.fb.bad{background:var(--shu-soft)}.fb p{margin:.3em 0;max-width:none}
.fb.good b{color:var(--ok)}.fb.bad b{color:var(--shu)}
.result{text-align:center;padding:10px 0 20px}.result p{margin-inline:auto}
.rev{border-top:1px dashed var(--line);padding:10px 0}.rev .qs{font-size:1.2rem}.rev .huge{font-size:2.4rem}.rev .pass{display:none}
span.ok{color:var(--ok)}span.no{color:var(--shu)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:99;font-size:.92rem;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:820px){
 #app{display:block}
 .nav{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));border:0;border-top:1px solid var(--line);z-index:20}
 .nav .brand{display:none}.nav a{flex-direction:column;gap:2px;font-size:.68rem;padding:4px 6px}
 main{padding-top:18px}h1{font-size:1.45rem}
 .kcard{grid-template-columns:1fr}.kfig{max-width:220px}
 .wk{flex-direction:column;align-items:stretch;gap:2px;margin-bottom:10px}.wkl{width:auto}.wkl small{display:inline;margin-left:8px}
 .vlist .jp{min-width:7.5em}.outl li{flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.pass{white-space:pre-line}
.qs.sm{font-size:1.15rem}
.guide{padding-left:1.3em;max-width:70ch}.guide li{margin:.45em 0}
.kwl .spk{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ai-soft);color:var(--ai);display:grid;place-items:center;font-size:.85rem;margin-top:6px}
.kwl.veil div{filter:blur(7px);user-select:none}
.gxl{font-size:1.3rem;line-height:2.1}
.vlist li.cut{border-top:2px solid var(--grid)}
.chipsb{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chip{padding:6px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-size:1.1rem;line-height:1.9;cursor:pointer}
.chip:disabled{opacity:.35;cursor:default}.chip:not(:disabled):hover{border-color:var(--ai)}
#din{font-size:1.2rem;padding:12px 14px;margin-top:12px}
.czb{font:inherit;background:var(--ai-soft);border:0;border-bottom:2px solid var(--ai);border-radius:4px 4px 0 0;color:var(--ai);cursor:pointer;padding:0 8px;min-width:3.2em}
.czb.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}.czb.no{background:var(--shu-soft);border-color:var(--shu);color:var(--shu)}
.bl.cur{background:var(--hl);border-color:var(--shu)}
.flash{background:var(--card);border:1.5px solid var(--grid);border-radius:10px;padding:26px 18px;text-align:center;margin:14px 0;min-height:180px}
.flash .huge{font-size:5rem;line-height:1.2}.flash p{margin-inline:auto}
.fback{border-top:1px dashed var(--line);margin-top:16px;padding-top:14px}
.rev .huge{font-size:2.2rem}
.tb{width:100%;border-collapse:collapse;margin:14px 0;font-size:.93rem;text-align:left}
.tb th,.tb td{border:1px solid var(--line);padding:7px 10px;vertical-align:top}.tb th{background:var(--ai-soft)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin:18px 0}
.pcard{display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px 16px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;text-decoration:none;cursor:pointer}
.pcard:hover{border-color:var(--ai)}.pcard b{color:var(--ai)}.pcard span{color:var(--mute);font-size:.9rem}
@media (max-width:820px){.nav a{font-size:.62rem;padding:4px 2px}.nav a .jp{width:26px;height:26px}.tb{font-size:.82rem}}
.btn:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="quiz" role="dialog" aria-label="Bài tập"></div>

きます|nhận (khiêm nhường)\n差し上げます|さしあげます|biếu (khiêm nhường)\nお宅|おたく|nhà (của người khác)\nお名前|おなまえ|quý danh\n失礼します|しつれいします|tôi xin phép\n恐れ入ります|おそれいります|xin lỗi, cảm ơn (rất trang trọng)\n|かしこまりました|tôi hiểu rồi ạ\n#Ôn cho và nhận\nお祝い|おいわい|quà mừng, lời chúc\nお見舞い|おみまい|thăm người ốm\nお土産|おみやげ|quà lưu niệm\n贈り物|おくりもの|quà tặng\n包みます|つつみます|gói\n選びます|えらびます|chọn\n渡します|わたします|trao\n受け取ります|うけとります|nhận lấy\n植えます|うえます|trồng\n餌|えさ|thức ăn cho vật nuôi\n", "v5b": "", "g5": "##1\n@〜んですが、〜て いただけませんか|tôi ~, anh/chị có thể ~ giúp không|thể thông thường + んですが、V て いただけませんか\nNêu hoàn cảnh bằng んですが rồi nhờ vả thật lịch sự. Lịch sự hơn 〜て ください. Hỏi lời khuyên: 〜たら いいですか.\n!んですが là câu \"dạo đầu\": nói xong người nghe đã đoán được bạn sắp nhờ gì.\n>日本語(にほんご) で てがみ を 書(か)いた んです が、ちょっと 【見(み)て いただけませんか|見(み)て あげませんか|見(み)せて いただきます か|見(み)て くれました か】。=Tôi đã viết thư bằng tiếng Nhật, anh xem giúp một chút được không?\n>えき へ 行(い)きたい んです が、どう 【行(い)ったら|行(い)くたら|行(い)けたら|行(い)って】 いいです か。=Tôi muốn ra ga, nên đi thế nào ạ?\n##2\n@Thể khả năng|có thể ~|Nhóm 1: hàng い → hàng え + ます (かきます → かけます) ・ Nhóm 2: bỏ ます + られます ・ します → できます, きます → こられます\nDiễn tả năng lực hoặc khả năng. Tân ngữ thường đổi を → が. Động từ khả năng chia như nhóm 2.\n!Nhóm 1 \"e hèm\": i → e. Nhóm 2 thêm られ.\n>わたし は かんじ が 300ぐらい 【読(よ)めます|読(よ)まれます|読(よ)みられます|読(よ)められます】。=Tôi đọc được khoảng 300 chữ Hán.\n>きのう は いそがしくて、ぜんぜん 【ねられませんでした|ねれられませんでした|ねえませんでした|ねらませんでした】。=Hôm qua bận quá nên tôi không ngủ được chút nào.\n@見えます・聞こえます|nhìn thấy / nghe thấy (tự nhiên)|N が 見えます / 聞こえます\nHình ảnh, âm thanh tự lọt vào mắt, tai, không do chủ ý. Khác 見られます / 聞けます (có điều kiện để xem, nghe).\n>へや の まど から 山(やま) 【が 見(み)えます|を 見(み)えます|が 見(み)ます|を 見(み)られます】。=Từ cửa sổ phòng nhìn thấy núi.\n>となり の へや から おんがく が 【聞(き)こえます|聞(き)けます|聞(き)きます|聞(き)かれます】。=Nghe thấy tiếng nhạc từ phòng bên.\n##3\n@〜し、〜し|vừa ~ vừa ~ (kể nhiều lý do, đặc điểm)|thể thông thường + し、thể thông thường + し、〜\nLiệt kê từ hai lý do hoặc đặc điểm trở lên, ngụ ý còn nữa. Thường đi với も.\n!し nối các \"điểm cộng\" (hoặc điểm trừ) cùng chiều.\n>この みせ は やすい 【し|て|と|や】、おいしい し、いつも 行(い)きます。=Quán này vừa rẻ vừa ngon nên tôi hay đến.\n>きょう は 雨(あめ) だ し、お金(かね) も 【ない し|ない て|なくて し|ありません と】、うち に います。=Hôm nay vừa mưa vừa không có tiền nên tôi ở nhà.\n##4\n@〜て しまいます|làm xong hẳn; lỡ ~ mất|V て しまいます / しまいました\n(1) Hoàn thành trọn vẹn. (2) Tiếc nuối vì việc lỡ xảy ra. Khi nói: 〜ちゃう / 〜じゃう.\n!しまう = \"xong mất rồi\": có thể là nhẹ nhõm, có thể là tiếc.\n>しゅくだい は もう ぜんぶ 【やって しまいました|やって ありました|やって おきます|やりて しまいました】。=Bài tập tôi đã làm xong hết rồi.\n>電車(でんしゃ) に かさ を 【わすれて しまいました|わすれて おきました|わすれて みました|わすれて ありました】。=Tôi lỡ để quên ô trên tàu mất rồi.\n##5\n@〜て あります|(đã được) ~ sẵn|N が + tha động từ て あります\nTrạng thái còn lại do ai đó cố ý làm. Khác 〜て います (tự động từ, chỉ tả trạng thái).\n!Có \"bàn tay con người\" phía sau thì dùng あります.\n>かべ に カレンダー が 【かけて あります|かけて います|かかって あります|かけて おきます】。=Trên tường có treo lịch.\n>テーブル の 上(うえ) に はな が 【かざって|かざり|かざった|かざる】 あります。=Trên bàn có bày hoa.\n@〜て おきます|làm sẵn; cứ để nguyên|V て おきます\n(1) Chuẩn bị trước cho mục đích nào đó. (2) Giữ nguyên trạng thái. Khi nói: 〜とく.\n>りょこう の まえに、ホテル を よやく 【して おきます|して あります|して しまいます|して います】。=Trước chuyến du lịch tôi đặt khách sạn sẵn.\n>あつい です から、まど を あけて 【おいて|あって|しまって|みて】 ください。=Trời nóng nên cứ để cửa sổ mở nhé.\n##6\n@Thể ý chí|~ thôi; hãy cùng ~|Nhóm 1: hàng い → hàng お + う (いきます → いこう) ・ Nhóm 2: bỏ ます + よう ・ しよう, こよう\nDạng thân mật của 〜ましょう. Dùng khi rủ rê bạn bè hoặc tự nhủ.\n>つかれた ね。ちょっと 【休(やす)もう|休(やす)みよう|休(やす)まう|休(やす)めよう】。=Mệt nhỉ. Nghỉ một chút thôi.\n>もう おそい から、そろそろ 【ねよう|ねろう|ねおう|ねりよう】。=Muộn rồi, đi ngủ thôi.\n@〜ようと 思って います|đang định ~|V-ý chí + と 思って います\nDự định đã nghĩ từ trước và vẫn đang giữ. 〜と 思います là vừa mới nghĩ ra.\n!Chắc chắn dần: 〜ようと 思う < 〜つもり < 〜予定.\n>来年(らいねん) 日本(にほん) へ りゅうがく 【しよう|する|しろう|して】 と 思(おも)って います。=Tôi đang định năm sau du học Nhật.\n>なつやすみ に くに へ 【かえろう と|かえよう と|かえる と|かえろう を】 思(おも)って います。=Tôi đang định nghỉ hè về nước.\n##7\n@〜ことに します|quyết định ~|V-từ điển / V ない + ことに します\nTự mình quyết định. Quyết định đã thành thói quen: 〜ことに して います. Lịch đã lên: 〜よていです.\n!に します là \"tôi chọn\"; đối lập với に なります là \"được quyết định\".\n>からだ に わるい から、たばこ を 【やめる こと|やめた こと|やめて こと|やめよう こと】 に しました。=Vì có hại cho sức khoẻ nên tôi quyết định bỏ thuốc.\n>あした から 毎日(まいにち) 30分(ぷん) あるく こと 【に|を|が|で】 します。=Từ mai tôi quyết định mỗi ngày đi bộ 30 phút.\n##8\n@〜かも しれません|có lẽ ~ (không chắc)|thể thông thường + かも しれません (N, A-な bỏ だ)\nKhả năng khoảng một nửa, thấp hơn でしょう.\n>ごご から 雨(あめ) が 【ふる|ふり|ふって|ふろう】 かも しれません。=Từ chiều có lẽ trời mưa.\n>あの 人(ひと) は 【びょうき|びょうきだ|びょうきな|びょうきの】 かも しれません。=Người kia có lẽ bị ốm.\n@〜はずです|chắc chắn là ~ (có căn cứ)|V-thường / A-い / A-な + な / N + の + はずです\nSuy đoán chắc chắn dựa trên căn cứ. Phủ định mạnh: 〜はずが ありません.\n!はず = \"theo lý thì phải thế\".\n>田中(たなか)さん は きのう 出(で)かけました から、うち に 【いない|いません|いなくて|いよう】 はず です。=Anh Tanaka hôm qua đi vắng rồi nên chắc chắn không có nhà.\n>かれ は 10年(ねん) 日本(にほん) に います から、日本語(にほんご) が 【じょうずな|じょうずだ|じょうずの|じょうず】 はず です。=Anh ấy ở Nhật 10 năm nên chắc chắn giỏi tiếng Nhật.\n##9\n@Thể mệnh lệnh và cấm đoán|hãy ~! / cấm ~!|Mệnh lệnh: nhóm 1 hàng い → hàng え (いけ), nhóm 2 + ろ (たべろ), しろ, こい ・ Cấm: V-từ điển + な ・ Nhẹ hơn: V (bỏ ます) + なさい\nDùng trong biển báo, khẩu hiệu, cổ vũ, hoặc người trên nói với người dưới. なさい là cha mẹ, thầy cô nhắc nhở.\n!な sau thể từ điển = cấm. Đừng nhầm với な của tính từ.\n>あぶない！ 【とまれ|とまる|とまろ|とまりろ】！=Nguy hiểm! Dừng lại!\n>ここ に ごみ を 【すてる な|すてろ な|すて な|すてない な】。=Cấm vứt rác ở đây.\n##10\n@〜とおりに|theo đúng như ~|V-từ điển / V た + とおりに ・ N の + とおりに\nLàm việc gì đúng theo điều đã thấy, đã nghe, đã học.\n>わたし が 【言(い)う|言(い)い|言(い)って|言(い)おう】 とおりに、書(か)いて ください。=Hãy viết đúng như tôi nói.\n>せつめいしょ 【の|に|を|が】 とおりに、くみたてました。=Tôi đã lắp theo đúng sách hướng dẫn.\n@〜ないで・〜ずに|mà không ~|V ないで、〜 ・ V ず に、〜 (しない → せずに)\nLàm việc sau trong trạng thái không làm việc trước. ずに là văn viết.\n!〜なくて là \"vì không\"; 〜ないで là \"mà không\".\n>けさ は あさごはん を 【食(た)べないで|食(た)べなくて|食(た)べないて|食(た)べずで】 かいしゃ へ 行(い)きました。=Sáng nay tôi đi làm mà không ăn sáng.\n>じしょ を 【つかわずに|つかわなく に|つかいずに|つかわない に】 読(よ)んで ください。=Hãy đọc mà không dùng từ điển.\n##11\n@〜ば|nếu ~|Động từ: hàng い → hàng え + ば (いけば) ・ A-い → ければ ・ ない → なければ\nĐiều kiện cần để vế sau thành hiện thực. Vế sau thường không phải việc đã xảy ra.\n!いい → よければ. Danh từ, tính từ な dùng なら.\n>この ボタン を 【おせば|おすば|おしば|おせれば】、ドア が あきます。=Nếu ấn nút này thì cửa mở.\n>【やすければ|やすいければ|やすくば|やすけば】、買(か)います。=Nếu rẻ thì tôi mua.\n@〜なら|nếu là ~ thì|N / thể thông thường + なら\nNhận lại chủ đề người kia vừa nói rồi đưa lời khuyên, ý kiến.\n>A「おんせん に 行(い)きたい んです が。」 B「おんせん 【なら|ば|たら|と】、はこね が いいです よ。」=A: Tôi muốn đi suối nước nóng. B: Nếu là suối nước nóng thì Hakone được đấy.\n>ひま 【なら|ければ|だら|と】、てつだって ください。=Nếu rảnh thì giúp tôi với.\n##12\n@〜ば 〜ほど|càng ~ càng ~|V ば + V-từ điển + ほど ・ A ければ + A い + ほど\nVế trước tăng thì vế sau tăng theo.\n>日本語(にほんご) は 【べんきょう すれば|べんきょう したら|べんきょう して|べんきょう すると】 する ほど、おもしろく なります。=Tiếng Nhật càng học càng thú vị.\n>へや は ひろければ 【ひろい ほど|ひろく ほど|ひろければ ほど|ひろい より】 いいです。=Phòng càng rộng càng tốt.\n@〜ように (mục đích)|để (có thể) ~|V-khả năng / V ない / tự động từ + ように、〜\nHướng tới một trạng thái không điều khiển trực tiếp được. Hành động chủ động thì dùng ために.\n!ように đi với \"được, hiểu, thấy, không\"; ために đi với động từ ý chí.\n>みんな に 聞(き)こえる 【ように|ために|のに|ほうが】、大(おお)きい こえ で 話(はな)します。=Tôi nói to để mọi người nghe thấy.\n>わすれない 【ように|ために|ような|ことに】、メモ して ください。=Hãy ghi chú lại để không quên.\n##13\n@〜ように なります|trở nên (làm được) ~|V-khả năng / V-từ điển + ように なります ・ V なく なります\nThay đổi về năng lực hay thói quen qua thời gian.\n>毎日(まいにち) れんしゅう して、やっと 【およげる|およぐ こと|およいで|およごう】 ように なりました。=Luyện mỗi ngày, cuối cùng tôi đã bơi được.\n>さいきん、あさ はやく 【おきる ように|おきる ことに|おきて ように|おきよう と】 なりました。=Dạo này tôi đã dậy sớm được.\n@〜ように します|cố gắng ~|V-từ điển / V ない + ように します\nCố gắng để việc gì thành thói quen. Nhờ người khác: 〜ように して ください.\n>からだ の ために、毎日(まいにち) やさい を 食(た)べる 【ように して|ように なって|ことに なって|ために して】 います。=Vì sức khoẻ, tôi đang cố gắng ăn rau mỗi ngày.\n>あした は ぜったいに 【おくれない|おくれなく|おくれず|おくれよう】 ように して ください。=Ngày mai nhất định cố gắng đừng đến muộn.\n##14\n@Thể bị động|bị ~; được ~|Nhóm 1: hàng い → hàng あ + れます (しかられます) ・ Nhóm 2: + られます ・ されます, こられます ・ người làm + に\n(1) Bị, được ai làm gì. (2) Bị làm phiền (あめ に ふられました). (3) Sự việc khách quan, không nêu người làm; tác giả dùng に よって.\n!Người gây ra hành động luôn đứng trước に.\n>わたし は 先生(せんせい) 【に|を|が|で】 ほめられました。=Tôi được thầy khen.\n>電車(でんしゃ) の 中(なか) で 足(あし) を 【ふまれました|ふみられました|ふませました|ふまられました】。=Trên tàu tôi bị giẫm vào chân.\n>この おてら は 500年(ねん) まえ に 【たてられました|たてさせました|たてました|たたれました】。=Ngôi chùa này được xây 500 năm trước.\n##15\n@〜のは・〜のが・〜のを|việc ~ (danh từ hoá)|V-thường + の + は / が / を\nの biến cả mệnh đề thành danh từ: việc ~ thì…, thích việc ~, quên việc ~. Sau の を hay gặp わすれました, しって います, 見ました.\n>ひとり で りょこう する 【の は|の を|こと に|の で】 たのしい です。=Việc đi du lịch một mình thì vui.\n>かぎ を かける 【の を|の は|の に|こと が】 わすれました。=Tôi đã quên khoá cửa.\n##16\n@〜て・〜くて・〜で (nguyên nhân)|vì ~ nên (cảm xúc, không thể)|V て / V なくて / A くて / A-な で + cảm xúc, trạng thái\nVế sau là cảm xúc hoặc việc ngoài ý muốn; không dùng với mệnh lệnh, rủ rê.\n>てがみ を 【もらって|もらう|もらったら|もらえば】、うれしかった です。=Nhận được thư, tôi rất vui.\n>かんじ が 【わからなくて|わからないで|わからずに|わかって】、こまりました。=Vì không hiểu chữ Hán nên tôi gặp khó.\n@〜のに|mặc dù ~ vậy mà|thể thông thường + のに (N, A-な + な + のに)\nKết quả trái với mong đợi, mang sắc thái bất mãn hoặc ngạc nhiên.\n!のに có mùi \"tiếc, bực\"; が và けど thì trung tính.\n>くすり を 【のんだ のに|のんだ ので|のんで から|のんだ ように】、ねつ が 下(さ)がりません。=Uống thuốc rồi mà vẫn không hạ sốt.\n>きょう は 日曜日(にちようび) 【な のに|だ のに|の のに|のに】、はたらかなければ なりません。=Hôm nay là Chủ nhật vậy mà vẫn phải làm việc.\n##17\n@〜か・〜か どうか|câu hỏi lồng trong câu|từ để hỏi + thể thông thường + か ・ thể thông thường + か どうか\nCó từ để hỏi thì dùng か; câu hỏi có/không thì dùng か どうか. Danh từ và tính từ な bỏ だ.\n>かいぎ が 何時(なんじ) に 【はじまる か|はじまる か どうか|はじまります か を|はじまる と】 しって います か。=Anh có biết cuộc họp bắt đầu lúc mấy giờ không?\n>その 話(はなし) が ほんとう 【か どうか|だ か どうか|か どう|どうか か】 わかりません。=Tôi không biết chuyện đó có thật hay không.\n@〜て みます|thử ~|V て みます\nLàm thử để biết kết quả.\n>この くつ を 【はいて みて|はいて おいて|はいて しまって|はいて あって】 も いいです か。=Tôi đi thử đôi giày này được không?\n>おいしい か どうか、ひとつ 食(た)べて 【みます|おきます|あります|います】。=Tôi sẽ ăn thử một cái xem có ngon không.\n##18\n@〜て あげます・〜て もらいます・〜て くれます|làm ~ cho / được ai làm ~ cho|A は B に V て あげます ・ B は A に V て もらいます ・ A は (わたし に) V て くれます\nCho và nhận một hành động tốt. Chủ ngữ của もらいます là người được lợi; của くれます là người giúp mình.\n!\"Nhờ ai làm\" → もらう. \"Ai đó tự làm cho mình\" → くれる.\n>わたし は 友(とも)だち に 日本語(にほんご) を 【おしえて もらいました|おしえて あげました|おしえて くれました|おしえられて もらいました】。=Tôi được bạn dạy tiếng Nhật.\n>雨(あめ) の 日(ひ)、山田(やまだ)さん が えき まで 車(くるま) で 【おくって くれました|おくって もらいました|おくって あげました|おくられました】。=Hôm trời mưa, anh Yamada đã chở tôi ra ga.\n##19\n@〜ために|để ~ (mục đích chủ động); vì ~|V-từ điển / N の + ために ・ nguyên nhân: V た / N の + ために\nMục đích do chính mình điều khiển được. Cũng nêu nguyên nhân khách quan (じこ の ために).\n!ために đi với động từ ý chí; trạng thái \"được, hiểu, không\" thì dùng ように.\n>いえ を 買(か)う 【ために|ように|のに|ことに】、お金(かね) を ためて います。=Tôi đang để dành tiền để mua nhà.\n>かぞく 【の ために|に ために|の ように|な ために】、毎日(まいにち) はたらいて います。=Tôi làm việc mỗi ngày vì gia đình.\n##20\n@〜そうです (trông có vẻ)|trông có vẻ ~; sắp ~|V (bỏ ます) / A-い (bỏ い) / A-な + そうです\nPhán đoán từ điều nhìn thấy. いい → よさそう, ない → なさそう. Với động từ: \"sắp ~\".\n!Có vẻ → bỏ đuôi rồi gắn そう. Nghe nói → để nguyên thể thông thường.\n>この ケーキ は 【おいしそう|おいしいそう|おいしくそう|おいしだそう】 です ね。=Cái bánh này trông ngon nhỉ.\n>そら が くらい です。雨(あめ) が 【ふりそう|ふるそう|ふってそう|ふろうそう】 です。=Trời tối quá. Sắp mưa rồi.\n@〜そうです (nghe nói)|nghe nói ~|thể thông thường + そうです ・ nguồn tin: 〜に よると\nTruyền đạt lại thông tin nghe, đọc được. Không chia quá khứ hay phủ định ở そうです.\n>てんきよほう に よると、あした は 【はれる|はれ|はれて|はれよう】 そう です。=Theo dự báo thời tiết, nghe nói mai trời nắng.\n>田中(たなか)さん は らいげつ 【けっこん する そう|けっこん しそう|けっこん して そう|けっこん しよう そう】 です。=Nghe nói anh Tanaka tháng sau kết hôn.\n##21\n@〜て きます・〜て いきます|~ rồi quay lại; ~ dần đến nay / ~ dần từ nay|V て きます ・ V て いきます\nてきます: đi làm gì rồi về, hoặc thay đổi kéo đến hiện tại. ていきます: thay đổi tiếp diễn về tương lai, hoặc làm rồi đi luôn.\n!くる kéo về phía mình (đến nay); いく đẩy ra xa (từ nay).\n>ちょっと のみもの を 【買(か)って きます|買(か)って いきます|買(か)い きます|買(か)って おきます】。ここ で まって いて ください。=Tôi đi mua đồ uống rồi quay lại. Anh chờ ở đây nhé.\n>これから も 日本語(にほんご) の べんきょう を つづけて 【いきます|きます|おきます|みます】。=Từ nay tôi sẽ tiếp tục học tiếng Nhật.\n##22\n@〜ようです・〜みたいです|hình như ~; giống như ~|thể thông thường + ようです (N の, A-な + な) ・ thể thông thường + みたいです (N, A-な bỏ だ)\nPhỏng đoán từ cảm nhận của chính mình, hoặc ví von. みたい dùng khi nói.\n>でんき が きえて います。だれ も 【いない よう|いなそう|いないの よう|いない そう】 です。=Đèn tắt rồi. Hình như không có ai.\n>あの 人(ひと) は 日本人(にほんじん) 【みたい|のみたい|なみたい|だみたい】 です ね。=Người kia hình như là người Nhật nhỉ.\n@〜らしいです|nghe đâu ~; ra dáng ~|thể thông thường + らしい (N, A-な bỏ だ) ・ N + らしい + N\nPhỏng đoán dựa trên tin nghe được. N らしい: đúng chất của N (はる らしい てんき).\n>うわさ に よると、あの みせ は らいげつ 【しまる らしい|しまり らしい|しまる みたいな|しまりそうな】 です。=Nghe đồn quán đó tháng sau đóng cửa.\n>きょう は 【はる らしい|はる の らしい|はる な らしい|はる そうな】 あたたかい 日(ひ) です。=Hôm nay là một ngày ấm áp đúng kiểu mùa xuân.\n##23\n@Thể sai khiến|bắt / cho (ai) làm ~|Nhóm 1: hàng い → hàng あ + せます (いかせます) ・ Nhóm 2: + させます ・ させます, こさせます\nBắt buộc hoặc cho phép. Tự động từ: người を; tha động từ: người に + vật を.\n!Một câu không có hai を: đã có tân ngữ を thì người bị sai dùng に.\n>母(はは) は こども 【に|を|が|で】 やさい を 食(た)べさせます。=Mẹ bắt con ăn rau.\n>先生(せんせい) は 学生(がくせい) を はやく 【かえらせました|かえられました|かえりさせました|かえさせられました】。=Thầy giáo đã cho học sinh về sớm.\n@〜させて いただけませんか|xin cho phép tôi ~|V-sai khiến て + いただけませんか\nXin phép rất lịch sự để chính mình làm gì.\n>あたま が いたい ので、きょう は はやく 【かえらせて|かえって|かえられて|かえりさせて】 いただけませんか。=Tôi đau đầu, hôm nay cho phép tôi về sớm được không ạ?\n>すみません、ここ で しゃしん を 【とらせて いただけませんか|とって いただきませんか|とられて いただけませんか|とらせて あげませんか】。=Xin lỗi, cho phép tôi chụp ảnh ở đây được không ạ?\n##24\n@Thể sai khiến bị động|bị bắt làm ~|Nhóm 1: 〜せられます / 〜されます (いかされます) ・ Nhóm 2: 〜させられます ・ người bắt + に\nLàm việc gì trái ý muốn vì bị người khác bắt.\n!Thấy させられ là hiểu ngay: \"khổ thân, bị ép\".\n>こども の とき、母(はは) に 毎日(まいにち) ピアノ を 【ならわせられました|ならわれました|ならわせました|ならいさせられました】。=Hồi nhỏ ngày nào tôi cũng bị mẹ bắt học piano.\n>きのう は ぶちょう に 2じかん も 【またされました|またれました|まちさせました|まつされました】。=Hôm qua tôi bị trưởng phòng bắt chờ tận 2 tiếng.\n##25\n@〜たら|nếu ~; sau khi ~|V た / A かった / N だった + ら\nĐiều kiện giả định, hoặc việc chắc chắn xảy ra rồi mới làm việc sau. Dùng được với mệnh lệnh, rủ rê.\n!たら là điều kiện \"dễ tính\" nhất: gần như câu nào cũng dùng được.\n>えき に 【ついたら|つけば|つくと|つくなら】、でんわ して ください。=Đến ga rồi thì gọi điện cho tôi nhé.\n>あした 雨(あめ) 【だったら|ければ|なら と|だら】、しあい は ありません。=Nếu mai mưa thì không có trận đấu.\n@〜ても|dù ~ cũng|V て / A くて / N で + も\nĐiều kiện ngược. Hay đi với いくら, どんなに.\n>いくら 【かんがえても|かんがえたら|かんがえれば|かんがえると】、わかりません。=Dù nghĩ bao nhiêu cũng không hiểu.\n>雨(あめ) 【でも|ても|だも|なら も】、しあい は あります。=Dù mưa trận đấu vẫn diễn ra.\n##26\n@〜と|hễ ~ thì (tất yếu)|V-từ điển / V ない + と、〜\nKết quả tự nhiên, hiển nhiên, chỉ đường, cách dùng máy. Vế sau không dùng ý chí, mệnh lệnh, rủ rê.\n!と = \"ấn nút là ra\": một nguyên nhân, luôn một kết quả.\n>この みち を まっすぐ 【行(い)く と|行(い)け と|行(い)った と|行(い)こう と】、右(みぎ) に ぎんこう が あります。=Đi thẳng đường này sẽ thấy ngân hàng bên phải.\n>はる に 【なる と|なったら と|なれ と|なろう と】、さくら が さきます。=Hễ sang xuân là hoa anh đào nở.\n##27\n@〜ところです|sắp / đang / vừa mới ~|V-từ điển + ところ (sắp) ・ V て いる + ところ (đang) ・ V た + ところ (vừa xong)\nChỉ rõ thời điểm của hành động so với lúc nói.\n>A「もう 食(た)べました か。」 B「いいえ、これから 【食(た)べる|食(た)べた|食(た)べて|食(た)べよう】 ところ です。」=A: Anh ăn chưa? B: Chưa, bây giờ tôi sắp ăn.\n>今(いま)、レポート を 【書(か)いて いる|書(か)く の|書(か)いた の|書(か)き】 ところ です。=Bây giờ tôi đang viết báo cáo.\n@〜た ばかりです|vừa mới ~ (theo cảm nhận)|V た + ばかりです\nNgười nói cảm thấy việc vừa mới xảy ra, dù thực tế có thể đã vài tháng.\n!たところ: vừa xong ngay lúc này. たばかり: \"mới đây thôi\" theo cảm giác.\n>先月(せんげつ) 日本(にほん) へ 【来(き)た ばかり|来(く)る ばかり|来(き)て ばかり|来(き)た ところ の】 です から、まだ 何(なに)も わかりません。=Tôi vừa mới đến Nhật tháng trước nên chưa biết gì cả.\n>この パソコン は きのう 買(か)った 【ばかり な のに|ばかり の ので|ところ のに|だけ な のに】、もう こわれました。=Cái máy tính này vừa mua hôm qua vậy mà đã hỏng.\n##28\n@〜まま|cứ để nguyên ~|V た / V ない / N の + まま\nGiữ nguyên một trạng thái trong khi làm việc khác, thường là điều đáng ra không nên.\n>でんき を 【つけた まま|つける まま|つけて まま|つけよう まま】 ねて しまいました。=Tôi lỡ ngủ quên trong khi đèn vẫn bật.\n>くつ を 【はいた まま|はいて まま|はく まま|はき まま】 へや に 入(はい)らないで ください。=Xin đừng đi nguyên giày vào phòng.\n@〜はじめます・〜おわります・〜つづけます|bắt đầu / xong / tiếp tục ~|V (bỏ ます) + はじめます / おわります / つづけます\nĐộng từ ghép chỉ giai đoạn của hành động. Bắt đầu đột ngột: 〜だします.\n>きょねん から ピアノ を 【ならいはじめました|ならうはじめました|ならってはじめました|ならいはじまりました】。=Tôi bắt đầu học piano từ năm ngoái.\n>この 本(ほん) は もう 【読(よ)みおわりました|読(よ)むおわりました|読(よ)んでおわりました|読(よ)みおえりました】。=Quyển sách này tôi đã đọc xong.\n##29\n@Tôn kính ngữ (尊敬語)|nói về hành động của người trên|お + V (bỏ ます) + に なります ・ V-(ら)れます ・ đặc biệt: いらっしゃいます, めしあがります, おっしゃいます, ごらんに なります, なさいます\nNâng hành động của người đối diện hoặc người trên. Không dùng cho hành động của mình.\n!\"Người ta\" làm → tôn kính. \"Tôi\" làm → khiêm nhường.\n>しゃちょう は もう 【おかえり に なりました|おかえり しました|かえって いただきました|おかえり いたしました】。=Giám đốc đã về rồi ạ.\n>先生(せんせい) は あした 何時(なんじ) に 【いらっしゃいます|まいります|うかがいます|おります】 か。=Thầy ngày mai mấy giờ đến ạ?\n##30\n@Khiêm nhường ngữ (謙譲語)|nói về hành động của mình|お + V (bỏ ます) + します ・ ご + N + します ・ đặc biệt: まいります, おります, いただきます, もうします, はいけん します, うかがいます\nHạ hành động của mình (hoặc người phía mình) để tôn trọng người nghe.\n>おにもつ を 【おもち します|おもち に なります|もたれます|おもち なさいます】。=Tôi xin xách hành lý giúp ạ.\n>はじめまして。リン と 【もうします|おっしゃいます|いらっしゃいます|なさいます】。=Rất vui được gặp. Tôi tên là Linh.\n@Lịch sự ngữ (丁寧語)|cách nói trang trọng|です → で ございます ・ あります → ございます ・ お / ご + danh từ\nDùng trong cửa hàng, thông báo, thư từ. Chỉ làm câu trang trọng hơn, không nâng hay hạ ai.\n>トイレ は 2かい に 【ございます|いらっしゃいます|まいります|おります と】。=Nhà vệ sinh ở tầng 2 ạ.\n>こちら は うけつけ 【で ございます|に ございます|で いらっしゃいます|を ございます】。=Đây là quầy lễ tân ạ.\n##31\n@〜あいだ・〜あいだに|trong suốt ~ / trong khoảng ~|V て いる / N の + あいだ(に)\nあいだ: hành động kéo dài suốt khoảng đó. あいだに: việc xảy ra một lần tại một điểm trong khoảng đó.\n!Có に = một điểm; không に = cả quãng.\n>こども が ねて いる 【あいだに|あいだ|まで|まえに】、かいもの に 行(い)って きます。=Trong lúc con ngủ, tôi đi mua đồ rồi về.\n>なつやすみ の 【あいだ|あいだに|までに|うち】、ずっと くに に いました。=Suốt kỳ nghỉ hè tôi ở trong nước.\n@〜までに|chậm nhất là trước ~|thời điểm + までに\nHạn chót của một hành động xảy ra một lần. まで là \"làm liên tục đến\".\n>レポート は 金曜日(きんようび) 【までに|まで|あいだ|までで】 出(だ)して ください。=Báo cáo hãy nộp trước thứ Sáu.\n>5時(じ) 【まで|までに|に まで|あいだに】 ここ で まって います。=Tôi sẽ chờ ở đây đến 5 giờ.\n##32\n@〜とか 〜とか|như là ~, ~|N / V-thường + とか、N / V-thường + とか\nNêu ví dụ khi nói chuyện, thân mật hơn や.\n>休(やす)み の 日(ひ) は そうじ 【とか|や か|など と|だけ】 せんたく とか を します。=Ngày nghỉ tôi làm những việc như dọn dẹp, giặt giũ.\n>つかれた とき は、おんがく を 聞(き)く とか、はやく 【ねる とか|ねて とか|ねたり とか|ねる や】 した ほうが いいです よ。=Khi mệt thì nên nghe nhạc hay ngủ sớm chẳng hạn.\n##33\n@〜が します|có (mùi, vị, tiếng, cảm giác) ~|N (におい, あじ, おと, こえ, かんじ) + が します\nCảm nhận bằng giác quan.\n>だいどころ から いい におい 【が します|を します|が あります|に なります】。=Từ bếp có mùi thơm.\n>となり の へや で 人(ひと) の こえ が 【します|なります|見(み)えます|あります】。=Phòng bên có tiếng người.\n@〜がります|(người khác) tỏ ra ~|A-い (bỏ い) / A-な / V たい (bỏ い) + がります\nCảm xúc, mong muốn của người thứ ba thể hiện ra ngoài. Hiện tại: 〜がって います.\n!ほしい, たい là của \"tôi\"; người khác thì thêm がる.\n>むすこ は あたらしい ゲーム を 【ほしがって|ほしくて|ほしがりて|ほしいがって】 います。=Con trai tôi đang muốn có trò chơi mới.\n>こども は はいしゃ に 行(い)く の を 【こわがります|こわいがります|こわくなります|こわがるです】。=Trẻ con sợ đi nha sĩ.\n##34\n@〜さ|độ ~ (danh từ hoá tính từ)|A-い (bỏ い) / A-な + さ\nBiến tính từ thành danh từ chỉ mức độ: たかさ, おもさ, べんりさ.\n>この はし の 【ながさ|ながいさ|ながくさ|ながみ】 は どのくらい です か。=Chiều dài cây cầu này là bao nhiêu?\n>にもつ の 【おもさ|おもいさ|おもく|おもいの】 を はかって ください。=Hãy cân trọng lượng hành lý.\n@〜ことが あります|cũng có khi ~|V-từ điển / V ない + ことが あります\nThỉnh thoảng xảy ra. Khác V た ことが あります (đã từng).\n!Trước こと là thể từ điển → \"có khi\"; là thể た → \"đã từng\".\n>いそがしい とき は、ひるごはん を 【食(た)べない|食(た)べなかった|食(た)べなくて|食(た)べず】 こと が あります。=Khi bận cũng có lúc tôi không ăn trưa.\n>ときどき バス が 【おくれる|おくれた|おくれて|おくれよう】 こと が あります。=Thỉnh thoảng xe buýt cũng đến muộn.\n##35\n@〜ことに なります|được quyết định là ~|V-từ điển / V ない + ことに なりました ・ quy định: 〜ことに なって います\nViệc do người khác, tổ chức hay hoàn cảnh quyết định. Cũng là cách nói khiêm tốn về quyết định của mình.\n>らいげつ から おおさか で 【はたらく ことに|はたらく ように|はたらいて ことに|はたらこう と】 なりました。=Từ tháng sau tôi được phân công làm việc ở Osaka.\n>この へや で は たばこ を すっては いけない こと に 【なって います|して います|なります か|あって います】。=Theo quy định, không được hút thuốc trong phòng này.\n@〜ことに して います|đặt lệ cho mình là ~|V-từ điển / V ない + ことに して います\nThói quen do mình tự quyết định và đang duy trì.\n>けんこう の ために、毎朝(まいあさ) 30分(ぷん) あるく こと に 【して います|なって います|します でした|あります】。=Vì sức khoẻ, tôi tự đặt lệ mỗi sáng đi bộ 30 phút.\n>よる 9時(じ) の あと は 何(なに)も 【食(た)べない ことに|食(た)べなくて ことに|食(た)べない ように なって|食(た)べず ことに】 して います。=Tôi đặt lệ sau 9 giờ tối không ăn gì nữa.\n##36\n@〜だけで なく、〜も|không chỉ ~ mà còn ~|N / thể thông thường + だけで なく、N + も\nThêm một điều nữa vào điều đã nêu.\n>かのじょ は えいご 【だけで なく|だけ なくて|しか なく|だけ でも】、ちゅうごくご も 話(はな)せます。=Cô ấy không chỉ nói được tiếng Anh mà cả tiếng Trung.\n>この みせ は やすい だけで なく、あじ 【も|は|が|を】 いいです。=Quán này không chỉ rẻ mà vị cũng ngon.\n@〜ほど 〜ない|không ~ bằng|A は B ほど + phủ định\nA không đạt đến mức của B.\n!ほど luôn kéo theo phủ định; より thì đi với khẳng định.\n>ことし の ふゆ は きょねん 【ほど|より|まで|だけ】 さむくない です。=Mùa đông năm nay không lạnh bằng năm ngoái.\n>わたし は あに ほど せ が 【たかくない|たかい|たかかった|たかくて】 です。=Tôi không cao bằng anh trai.\n##37\n@〜ような・〜ように (ví dụ, ví von)|như là ~; giống như ~|N の / V-thường + ような + N ・ 〜ように + V / A ・ giống hệt: N と おなじ\nNêu ví dụ tiêu biểu hoặc so sánh ví von. まるで 〜ようだ = cứ như là.\n>わたし は すし や てんぷら の 【ような|ように|ようで|そうな】 日本(にほん) りょうり が すき です。=Tôi thích các món Nhật như sushi, tempura.\n>かのじょ は 日本人(にほんじん) の 【ように|ような|ようだ|みたい】 日本語(にほんご) を 話(はな)します。=Cô ấy nói tiếng Nhật như người Nhật.\n##38\n@〜と つたえて いただけませんか|nhờ nhắn lại là ~|thể thông thường + と つたえて いただけませんか ・ 〜と 言って いました\nNhờ chuyển lời, hoặc thuật lại lời người thứ ba (言って いました).\n!Thuật lại lời người khác dùng 言って いました, không dùng 言いました.\n>田中(たなか)さん に、あした の かいぎ は 3時(じ) から だ 【と|を|に|が】 つたえて いただけませんか。=Anh nhắn giúp anh Tanaka là cuộc họp ngày mai từ 3 giờ được không?\n>山田(やまだ)さん は きょう は 来(こ)られない と 【言(い)って いました|言(い)います でした|言(い)われて います|言(い)って あります】。=Anh Yamada đã nói là hôm nay không đến được.\n##39\n@〜て ほしい|muốn (ai đó) làm ~|(người に) V て ほしい ・ V ないで ほしい\nMong người khác làm gì cho mình. Mình muốn làm thì dùng 〜たい.\n>こども に は もっと 本(ほん) を 【読(よ)んで ほしい|読(よ)みたい|読(よ)んで ほしがる|読(よ)ませて ほしく】 です。=Tôi muốn con đọc sách nhiều hơn.\n>ここ に ごみ を 【すてないで|すてなくて|すてずで|すてない】 ほしい です。=Tôi mong mọi người đừng vứt rác ở đây.\n@〜と いいです|mong là ~; giá mà ~|V-từ điển / V ない + と いいです(ね) ・ 〜たら いいです\nHy vọng điều gì xảy ra. Thêm ね khi chúc người khác.\n>あした、いい 天気(てんき) に 【なる と|なろう と|なって と|なった と】 いいです ね。=Mong là ngày mai trời đẹp nhỉ.\n>しけん に ごうかく 【できる と|できて と|できよう と|でき と】 いいです ね。=Mong là anh thi đỗ nhé.\n##40\n@〜だろう・〜だろうと 思います|có lẽ ~|thể thông thường + だろう (N, A-な bỏ だ)\nDạng thông thường của でしょう. Thêm と 思います để nêu phỏng đoán của mình một cách mềm mỏng.\n>あした は たぶん 雨(あめ) が 【ふる だろう|ふり だろう|ふって だろう|ふろう だろう】。=Ngày mai có lẽ trời mưa.\n>かれ は もう 来(こ)ない 【だろう と|だろう を|でしょう が|だ と】 思(おも)います。=Tôi nghĩ có lẽ anh ấy không đến nữa.\n##41\n@Dạng rút gọn khi nói|〜ちゃう・〜なきゃ・〜とく・〜って|〜て しまう → 〜ちゃう / 〜じゃう ・ 〜なければ → 〜なきゃ ・ 〜て おく → 〜とく ・ と / という → って\nHay gặp trong phần nghe. って còn dùng để nêu chủ đề hoặc truyền đạt lại (〜って 言ってた).\n!Nghe thấy ちゃ, じゃ, なきゃ, とく thì tự \"giải nén\" về dạng gốc.\n>あ、さいふ を 【わすれちゃった|わすれじゃった|わすれなきゃった|わすれとった】。=A, quên ví mất rồi.\n>もう 9時(じ) だ。はやく 【行(い)かなきゃ|行(い)っちゃ|行(い)っとく|行(い)かなく】。=9 giờ rồi. Phải đi nhanh thôi.\n##42\n@〜に ついて|về ~|N + に ついて\nChủ đề của việc nói, viết, tìm hiểu.\n>日本(にほん) の ぶんか 【に ついて|に よって|に とって|に たいして】 しらべて います。=Tôi đang tìm hiểu về văn hoá Nhật.\n>この もんだい に ついて、みなさん の いけん を 【聞(き)かせて ください|聞(き)こえて ください|聞(き)かれて ください|聞(き)いて あげます】。=Về vấn đề này, xin cho tôi nghe ý kiến của mọi người.\n@〜に よると|theo ~ (nguồn tin)|N + に よると、〜そうです / 〜らしいです\nNêu nguồn của thông tin truyền đạt.\n>ニュース 【に よると|に ついて|に よって|の ために】、あした ゆき が ふる そう です。=Theo tin tức, nghe nói mai tuyết rơi.\n>先生(せんせい) の 話(はなし) に よると、しけん は 【むずかしい らしい|むずかし そう|むずかしい よう に|むずかしく らしい】 です。=Theo lời thầy thì nghe đâu bài thi khó.\n##43\n@〜ても かまいません|~ cũng không sao|V て / A くて / N で + も かまいません ・ bắt buộc: 〜なくては いけません\nCho phép, lịch sự hơn 〜ても いいです. なくては いけません nghĩa như なければ なりません.\n>この へや は じゆう に 【つかっても|つかうて も|つかっては|つかえば】 かまいません。=Phòng này anh cứ dùng tự do cũng không sao.\n>あした まで に この しょるい を 【出(だ)さなくては|出(だ)さなくても|出(だ)さないで|出(だ)しては】 いけません。=Phải nộp giấy tờ này trước ngày mai.\n##44\n@〜ひつようが あります|cần phải ~|V-từ điển + ひつようが あります ・ không cần: 〜ひつようは ありません\nNêu sự cần thiết một cách khách quan.\n>ビザ を とる ために、たいしかん へ 【行(い)く ひつよう|行(い)って ひつよう|行(い)き ひつよう|行(い)こう ひつよう】 が あります。=Để lấy visa cần phải đến đại sứ quán.\n>じかん は たくさん あります から、いそぐ ひつよう 【は ありません|が います|に なりません|を しません】。=Còn nhiều thời gian nên không cần vội.\n@〜ば よかった|giá mà đã ~|V ば + よかった ・ V なければ + よかった\nHối tiếc về việc đã (không) làm.\n!ば よかった luôn nói về chuyện đã lỡ rồi.\n>テスト は むずかしかった。もっと 【べんきょう すれば|べんきょう したら が|べんきょう して|べんきょう する と】 よかった。=Bài kiểm tra khó quá. Giá mà đã học nhiều hơn.\n>おなか が いたい。あんなに 【食(た)べなければ|食(た)べれば|食(た)べないで|食(た)べなくて】 よかった。=Đau bụng quá. Giá mà đã không ăn nhiều như thế.\n##45\n@〜はずが ありません|không thể nào ~|thể thông thường + はずが ありません (N の, A-な + な)\nPhủ định mạnh dựa trên căn cứ.\n>あの まじめな 田中(たなか)さん が うそ を 【つく はず|つき はず|ついて はず|つこう はず】 が ありません。=Anh Tanaka nghiêm túc thế không thể nào nói dối.\n>こんな むずかしい もんだい、こども に 【わかる はず が ない|わかる はず だ|わからない はず が ない|わかった ばかり】。=Bài khó thế này, trẻ con không thể nào hiểu được.\n@何でも・いつでも・だれでも|cái gì cũng / lúc nào cũng / ai cũng|từ để hỏi + でも + khẳng định\n\"Bất cứ\". Từ để hỏi + も + phủ định thì là \"không… nào cả\".\n!でも đi với khẳng định, も đi với phủ định.\n>わたし は きらいな もの が ありません。【何(なん)でも|何(なに)も|何(なに)か|何(なん)で】 食(た)べます。=Tôi không ghét món nào. Cái gì cũng ăn.\n>わからない とき は、【いつでも|いつも は|いつか|いつまで】 しつもん して ください。=Khi không hiểu, lúc nào cũng cứ hỏi nhé.\n##46\n@〜ぐらい・〜ほど (mức độ)|đến mức ~|V-thường / N + ぐらい / ほど\nLấy ví dụ để tả mức độ. ほど trang trọng hơn.\n>きょう は あるけない 【ぐらい|ばかり|だけ|しか】 つかれました。=Hôm nay tôi mệt đến mức không đi nổi.\n>しぬ 【ほど|より|まで に|ばかり】 おなか が すきました。=Tôi đói muốn chết.\n@〜ばかり|toàn là ~; chỉ toàn ~|N + ばかり ・ V て + ばかり います\nNhiều quá mức, mang ý chê.\n!V た ばかり là \"vừa mới\"; V て ばかり là \"suốt ngày chỉ\".\n>おとうと は 毎日(まいにち) ゲーム を 【して ばかり|した ばかり|する ばかり に|して だけ】 います。=Em trai tôi ngày nào cũng chỉ toàn chơi game.\n>この へん は たかい みせ 【ばかり|しか|ほど|ぐらい】 です。=Quanh đây toàn quán đắt.\n##47\n@Tự động từ và tha động từ|tự xảy ra / ai đó làm|N が + tự động từ (あく, しまる, つく, きえる, こわれる) ・ N を + tha động từ (あける, しめる, つける, けす, こわす)\nTự động từ + て います tả trạng thái kết quả đang thấy: まど が あいて います. Tha động từ + て あります nhấn mạnh có người cố ý làm.\n!Thấy を thì chọn tha động từ; thấy が thì chọn tự động từ.\n>かぜ で ドア が 【しまりました|しめました|しまらせました|しめられて】。=Cửa đóng lại vì gió.\n>さむい です から、まど を 【しめて|しまって|しまりて|しめられて】 ください。=Lạnh quá, hãy đóng cửa sổ.\n>あ、でんき が 【ついて います|つけて います|ついて あります|つけて います か】 ね。だれ か いる よう です。=A, đèn đang bật kìa. Hình như có ai.\n##48\n@〜させて ください|xin cho tôi ~|V-sai khiến て + ください\nXin phép hoặc tình nguyện nhận việc. Lịch sự hơn: 〜させて いただけませんか.\n>その しごと は ぜひ わたし に 【やらせて|やられて|やって|やりさせて】 ください。=Việc đó nhất định xin để tôi làm.\n>すこし 【かんがえさせて|かんがえられて|かんがえて あげて|かんがえされて】 ください。=Xin cho tôi suy nghĩ một chút.\n@お〜ください|xin mời ~ (kính ngữ)|お + V (bỏ ます) + ください ・ ご + N + ください\nCách mời, yêu cầu lịch sự với khách.\n>こちら に お名前(なまえ) を 【お書(か)き ください|お書(か)いて ください|書(か)かれ ください|お書(か)き して ください】。=Xin mời quý khách viết tên vào đây.\n>しょうしょう 【おまち ください|おまって ください|またれ ください|おまち して ください】。=Xin quý khách chờ một chút.\n##49\n@Từ nối N4|それに・そのうえ・ところで・つまり・それで|それに / そのうえ: thêm nữa ・ それで: vì thế ・ ところで: nhân tiện (đổi đề tài) ・ つまり: tức là ・ ところが: thế nhưng\nPhần đọc hiểu hay hỏi chọn từ nối. Xác định quan hệ hai câu: thêm, nguyên nhân, trái ngược hay đổi đề tài.\n>この へや は ひろい です。【それに|ところが|つまり|それでも】、えき から も ちかい です。=Phòng này rộng. Hơn nữa lại gần ga.\n>きのう は ねつ が ありました。【それで|それに|ところで|つまり】、かいしゃ を 休(やす)みました。=Hôm qua tôi bị sốt. Vì thế tôi đã nghỉ làm.\n##50\n@〜おかげで・〜せいで|nhờ ~ / tại ~|thể thông thường / N の + おかげで (kết quả tốt) ・ + せいで (kết quả xấu)\nCùng nêu nguyên nhân nhưng おかげ là biết ơn, せい là trách móc.\n!おかげさまで = \"nhờ ơn\". せい = \"lỗi tại\".\n>先生(せんせい) の 【おかげで|せいで|ために は|とおりに】、しけん に ごうかく できました。=Nhờ thầy mà tôi đã thi đỗ.\n>雨(あめ) の 【せいで|おかげで|ように|ことで】、しあい が ちゅうし に なりました。=Tại mưa mà trận đấu bị huỷ.\n##51\n@So sánh と・ば・たら・なら|bốn kiểu \"nếu\"|と: tất yếu, vế sau không có ý chí ・ ば: điều kiện cần ・ たら: giả định, xong rồi thì (dùng rộng nhất) ・ なら: nếu là chuyện đó thì (lời khuyên)\nVế sau là mệnh lệnh, nhờ vả, rủ rê → dùng たら (hoặc なら). Chỉ đường, máy móc, quy luật → と.\n!Phân vân thì chọn たら; chỉ khi nhận lại chủ đề của người kia mới chọn なら.\n>うち に 【かえったら|かえると|かえれば|かえるなら】、すぐ でんわ して ください。=Về đến nhà thì gọi điện ngay nhé.\n>パソコン を 【買(か)う なら|買(か)うと|買(か)えば|買(か)ったら が】、あきはばら が やすい です よ。=Nếu định mua máy tính thì Akihabara rẻ đấy.\n##52\n@So sánh そう・よう・らしい|ba kiểu \"có vẻ, nghe nói\"|〜そう (bỏ đuôi): nhìn mà đoán ・ 〜そう (thể thường): nghe nói ・ 〜よう / みたい: cảm nhận của mình ・ 〜らしい: dựa vào tin nghe được\nXác định căn cứ: mắt thấy ngay trước mặt → そう; tổng hợp cảm nhận → よう; nghe người khác nói → らしい hoặc そうだ.\n>A「その かばん、【おもそう|おもいそう|おもいよう|おもいらしい】 です ね。もちましょう か。」=A: Cái cặp đó trông nặng nhỉ. Tôi xách giúp nhé?\n>かぜ を ひいた 【よう|そう に|らしく の|そうな】 です。あたま が いたい です。=Hình như tôi bị cảm. Đau đầu quá.\n##53\n@Kính ngữ thường gặp|bảng tra nhanh|いる → いらっしゃる / おる ・ 行く, 来る → いらっしゃる / まいる ・ 食べる → めしあがる / いただく ・ 言う → おっしゃる / もうす ・ 見る → ごらんに なる / はいけん する ・ する → なさる / いたす ・ 知って いる → ごぞんじだ / ぞんじて おる\nCặp trước dấu gạch là tôn kính (người khác làm), cặp sau là khiêm nhường (mình làm). Đề N4 hay hỏi chọn đúng cặp.\n>どうぞ、あたたかい うち に 【めしあがって|いただいて|まいって|はいけん して】 ください。=Xin mời dùng khi còn nóng ạ.\n>あした 3時(じ) に そちら へ 【うかがいます|いらっしゃいます|おいで に なります|おっしゃいます】。=3 giờ ngày mai tôi sẽ đến chỗ anh ạ.\n##54\n@Tổng hợp cho và nhận|あげる・もらう・くれる và dạng kính ngữ|あげる → さしあげる (cho người trên), やる (cho em, con vật, cây) ・ もらう → いただく ・ くれる → くださる ・ gắn sau V て để cho / nhận hành động\nXác định ai là người được lợi và người nói đứng về phía nào trước khi chọn.\n!Người trên cho mình: くださいました / いただきました. Mình cho người trên: さしあげました.\n>この じしょ は 先生(せんせい) が 【くださいました|さしあげました|いただきました|やりました】。=Quyển từ điển này là thầy cho tôi.\n>毎朝(まいあさ) はな に 水(みず) を 【やります|くれます|くださいます|いただきます】。=Mỗi sáng tôi tưới nước cho hoa.\n", "fx": "##1\nこの かんじ の 読(よ)みかた が わからない んです が、【おしえて いただけませんか|おしえて あげませんか|おしえて いただきます|おしえられませんか】。=Tôi không biết cách đọc chữ Hán này, anh chỉ giúp được không?\n##2\nこの プール で は 5時(じ) まで 【およげます|およがれます|およぎられます|およげられます】。=Ở bể bơi này có thể bơi đến 5 giờ.\nよる は しずか です から、とおく の 電車(でんしゃ) の おと が 【聞(き)こえます|聞(き)けます|聞(き)かせます|聞(き)きます】。=Ban đêm yên tĩnh nên nghe thấy tiếng tàu ở xa.\n##3\nこの アパート は えき から ちかい 【し|て|で|と】、やちん も やすい し、とても いいです。=Căn hộ này vừa gần ga, tiền nhà lại rẻ, rất tốt.\n##4\nケーキ は おとうと が ぜんぶ 【食(た)べて しまいました|食(た)べて ありました|食(た)べて おきました|食(た)べて みました】。=Bánh thì em trai tôi đã ăn hết mất rồi.\n##5\nこくばん に あした の よてい が 【書(か)いて あります|書(か)いて います|書(か)かれて あります|書(か)いて おきます】。=Trên bảng có viết lịch ngày mai.\nおきゃくさん が 来(く)る まえに、へや を そうじ 【して おきます|して あります|して しまいます|して みます】。=Trước khi khách đến tôi dọn phòng sẵn.\n##6\nじかん が ない から、タクシー で 【行(い)こう|行(い)きよう|行(い)けよう|行(い)くよう】。=Không có thời gian nên đi taxi thôi.\nしゅうまつ は うち で ゆっくり 【休(やす)もう|休(やす)む|休(やす)みよう|休(やす)んで】 と 思(おも)って います。=Cuối tuần tôi đang định nghỉ ngơi thong thả ở nhà.\n##7\nお金(かね) が ない ので、ことし は りょこう に 【行(い)かない こと|行(い)かなくて こと|行(い)かず こと|行(い)けない の】 に しました。=Vì không có tiền nên năm nay tôi quyết định không đi du lịch.\n##8\nみち が こんで います から、やくそく の じかん に 【おくれる かも しれません|おくれ かも しれません|おくれて はず です|おくれる こと です】。=Đường đang đông nên có lẽ tôi sẽ đến muộn giờ hẹn.\nにもつ は きのう おくりました から、あした 【つく|ついて|つこう|つき】 はず です。=Hành lý tôi gửi hôm qua nên chắc chắn mai sẽ đến.\n##9\nしけん の とき、となり の 人(ひと) の こたえ を 【見(み)る な|見(み)ろ な|見(み)ない な|見(み) な】。=Khi thi cấm nhìn bài người bên cạnh.\n##10\n先生(せんせい) が 【やった|やり|やって|やろう】 とおりに、やって みて ください。=Hãy thử làm đúng như thầy đã làm.\nきのう は つかれて いた ので、おふろ に 【入(はい)らないで|入(はい)らなくて|入(はい)らないて|入(はい)らず で】 ねました。=Hôm qua mệt nên tôi đi ngủ mà không tắm.\n##11\nこの くすり を 【のめば|のむば|のみば|のんだば】、すぐ よく なります。=Nếu uống thuốc này sẽ khỏi ngay.\nA「カメラ を 買(か)いたい んです が。」 B「カメラ 【なら|たら|ば|と】、えきまえ の みせ が やすい です よ。」=A: Tôi muốn mua máy ảnh. B: Nếu là máy ảnh thì cửa hàng trước ga rẻ đấy.\n##12\nこの 本(ほん) は 読(よ)めば 【読(よ)む ほど|読(よ)んで ほど|読(よ)めば ほど|読(よ)む より】 おもしろく なります。=Quyển sách này càng đọc càng hay.\nこども に も 読(よ)める 【ように|ために|ことに|ような】、ひらがな で 書(か)きました。=Tôi viết bằng hiragana để trẻ con cũng đọc được.\n##13\n日本(にほん) に 来(き)て から、さしみ が 【食(た)べられる ように|食(た)べる ことに|食(た)べられる ために|食(た)べて ように】 なりました。=Từ khi đến Nhật tôi đã ăn được sashimi.\nけんこう の ために、あまい もの を 食(た)べすぎない 【ように して|ことに なって|ように なって|ために して】 います。=Vì sức khoẻ tôi đang cố gắng không ăn quá nhiều đồ ngọt.\n##14\nきのう どろぼう に さいふ を 【とられました|とらせました|とりられました|とれました】。=Hôm qua tôi bị trộm lấy mất ví.\n##15\nあさ はやく おきる 【の は|の を|こと を|の に】 たいへん です。=Việc dậy sớm buổi sáng thì vất vả.\n##16\nその ニュース を 【聞(き)いて|聞(き)くと|聞(き)けば|聞(き)いたら が】、びっくり しました。=Nghe tin đó tôi đã rất ngạc nhiên.\n3じかん も 【まった のに|まった ので|まって から|まつ ように】、かれ は 来(き)ませんでした。=Chờ tận 3 tiếng vậy mà anh ấy không đến.\n##17\nあした 雨(あめ) が ふる 【か どうか|か を|の か に|と どうか】、ニュース で しらべます。=Tôi sẽ xem tin tức xem mai có mưa hay không.\nあたらしい レストラン へ 行(い)って 【みました|おきました|しまいました|ありました】 が、あまり おいしくなかった です。=Tôi đã thử đến nhà hàng mới nhưng không ngon lắm.\n##18\nにもつ が おもかった ので、おとうと に 【もって もらいました|もって あげました|もって くれました|もたれました】。=Vì hành lý nặng nên tôi nhờ em trai xách giúp.\n##19\n日本(にほん) の 大学(だいがく) に 入(はい)る 【ために|ように|ことに|のに は】、毎日(まいにち) べんきょう して います。=Tôi học mỗi ngày để vào đại học Nhật.\n##20\nあの 人(ひと) は いつも わらって いて、【たのしそう|たのしいそう|たのしくそう|たのしみそう】 です。=Người kia lúc nào cũng cười, trông có vẻ vui.\nしんぶん に よると、きのう おおさか で じしん が 【あった そう|ありそう|あって そう|ある そうな】 です。=Theo báo thì nghe nói hôm qua ở Osaka có động đất.\n##21\nさいきん、だんだん あたたかく なって 【きました| const TOTAL=70,cache={};
function D(n){
  if(cache[n]) return cache[n];
  const w=Math.ceil(n/7),dow=(n-1)%7,ph=w<=9?PH[0]:PH[1],d={n,w,dow,ph,wi:w<=9?w-1:0,kanji:[],vocab:[],theme:'',gram:[],kw:null,read:null,fx:[]};
  if(ph.id==='fin'){if(dow===1||dow===4){d.type='mock';d.exam=dow===1?1:2}else d.type='final'}
  else if(dow===6) d.type='review';
  else{d.type='lesson';const L=d.L=d.wi*6+dow;d.kanji=ORD[4].filter((_,i)=>Math.floor(i*54/ORD[4].length)===L);d.gram=G5[L+1]||[];d.read=RD[L+1]||null;d.fx=FX[L+1]||[];
    const v=V5[L];if(v){d.vocab=v.items;d.theme=v.theme}d.kw=KW[L+1]||null}
  return cache[n]=d;
}
function items(n){
  const d=D(n),w=[...d.vocab],g=[];
  d.kanji.forEach(c=>K[c].words.forEach(x=>{if(!w.includes(x))w.push(x)}));
  d.gram.forEach(p=>g.push(...p.x));
  return {k:d.kanji.map(c=>K[c]),w,g};
}
function merge(days){const it={k:[],w:[],g:[]};days.forEach(n=>{const x=items(n);it.k.push(...x.k);it.w.push(...x.w);it.g.push(...x.g)});return it}
const SECN={r:'Ôn bài cũ',g:'Ngữ pháp',v:'Từ vựng',k:'Kanji',c:'Kaiwa và luyện nghe',d:'Đọc hiểu',q:'Bài tổng kết'};
function secs(d){
  if(d.type!=='lesson') return ['q'];
  const s=[]; if(d.n>1)s.push('r'); if(d.gram.length)s.push('g'); if(d.vocab.length)s.push('v'); if(d.kanji.length)s.push('k'); if(d.kw)s.push('c'); if(d.read)s.push('d'); s.push('q'); return s;
}

const DK='かがきぎくぐけげこごさざしじすずせぜそぞただちぢつづてでとどはばひびふぶへべほぼ';
function mutR(r){
  const o=new Set(),end=r.endsWith('ます')?r.length-2:r.length;
  for(let i=0;i<end;i++){const c=r[i],A=r.slice(0,i),B=r.slice(i+1);
    if(c==='う'&&i>0) o.add(A+B);
    if('おこそとのほもよろごぞどぼょゅくすつふゆるぐず'.includes(c)&&r[i+1]!=='う') o.add(A+c+'う'+B);
    if(c==='っ') o.add(A+B);
    if(i>0&&'かきくけこさしすせそたちつてとぱぴぷぺぽ'.includes(c)&&r[i-1]!=='っ'&&r[i-1]!=='ん') o.add(A+'っ'+c+B);
    const k=DK.indexOf(c); if(k>=0) o.add(A+DK[k^1]+B);
    if(c==='ょ') o.add(A+'ゅ'+B); if(c==='ゅ') o.add(A+'ょ'+B);
  }
  o.delete(r); return shuf([...o]);
}
function mutK(w,l){
  const ks=[...w].map((c,i)=>K[c]?i:-1).filter(i=>i>=0),pool=ORD[5].concat(l<5?ORD[4]:[],l<4?ORD[3]:[]),out=[];
  if(!ks.length) return out;
  for(let t=0;t<14;t++){const i=ks[rnd(ks.length)],c=pool[rnd(pool.length)];if(c!==w[i])out.push(w.slice(0,i)+c+w.slice(i+1))}
  return out;
}
function qWord(w,type){
  const pool=WL[w.l],hasK=/[一-龯]/.test(w.w)&&w.r;
  if(!type){const ts=['m','rm'];if(hasK)ts.push('r','r','o');type=ts[rnd(ts.length)]}
  const exp=`<b class="jp">${esc(w.w)}</b>${w.r?' ('+w.r+')':''}: ${esc(w.m)}`;
  let q=null;
  if(type==='r'&&hasK) q=Q('Cách đọc kanji',`Từ gạch chân đọc thế nào?<div class="qs jp"><u>${esc(w.w)}</u></div>`,w.r,mutR(w.r).concat(shuf(pool.filter(x=>x.r).map(x=>x.r))),exp,w.key);
  if(type==='o'&&hasK) q=Q('Chọn chữ kanji',`Từ <b class="jp">${w.r}</b> (${esc(w.m)}) viết bằng kanji thế nào?`,w.w,mutK(w.w,w.l),exp,w.key);
  if(type==='rm') q=Q('Từ vựng',`Từ nào có nghĩa là “${esc(w.m)}”?`,w.w,shuf(pool).filter(x=>x.m!==w.m).map(x=>x.w),exp,w.key);
  return q||Q('Từ vựng',`Từ này nghĩa là gì?<div class="qs jp">${wordHtml(w)}</div>`,w.m,shuf(pool).filter(x=>x.w!==w.w).map(x=>x.m),exp,w.key);
}
function qKanji(k,t){
  const pool=ORD[k.l].map(c=>K[c]),lab=x=>`${x.hv}: ${x.m}`,on=k.on.split('、');
  const exp=`<b class="jp">${k.c}</b> ${k.hv}: ${esc(k.m)}${k.on?' · On: '+k.on:''}${k.kun?' · Kun: '+k.kun:''}`;
  if(t==null) t=rnd(3);
  if(t===2&&k.words.length) return qWord(k.words[rnd(k.words.length)],'r');
  if(t===2&&on[0]){const q=Q('Âm On',`Âm On của chữ này?<div class="qs jp huge">${k.c}</div>`,on[0],shuf(pool).map(x=>x.on.split('、')[0]).filter(x=>!on.includes(x)),exp,k.key);if(q)return q}
  if(t===1) return Q('Kanji',`Chữ nào mang nghĩa “${esc(lab(k))}”?`,k.c,shuf(pool).filter(x=>x.hv!==k.hv).map(x=>x.c),exp,k.key);
  return Q('Kanji',`Âm Hán Việt và nghĩa của chữ này?<div class="qs jp huge">${k.c}</div>`,lab(k),shuf(pool).filter(x=>x!==k).map(lab),exp,k.key);
}
const exFull=(e,mark)=>ruby(e.raw).replace('\u0001',mark?`<mark>${ruby(e.opts[0])}</mark>`:ruby(e.opts[0]));
function qGram(e,type){
  const exp=`<span class="jp">${exFull(e,1)}</span><br>${esc(e.vi)}<br><small>${esc(e.g.t)}: ${esc(e.g.m)}</small>`;
  const ch=e.raw.replace('\u0001',e.opts[0]).split(' ').filter(Boolean);
  if((type==='s'||(!type&&rnd(3)===0))&&!e.raw.includes('「')&&ch.length>=5){
    const s=rnd(ch.length-4),four=ch.slice(s,s+4),star=1+rnd(2);
    if(new Set(four).size===4){
      const bl=[0,1,2,3].map(i=>`<span class="bl">${i===star?'★':''}</span>`).join(' ');
      const q=Q('Sắp xếp câu',`Xếp 4 cụm từ vào chỗ trống. Cụm nào nằm ở ô ★?<div class="qs jp">${ruby(ch.slice(0,s).join(' '))} ${bl} ${ruby(ch.slice(s+4).join(' '))}</div>`,four[star],four.filter((_,i)=>i!==star),exp,e.key);
      if(q){q.star=1;return q}
    }
  }
  return Q('Ngữ pháp',`Chọn đáp án đúng cho chỗ trống.<div class="qs jp">${ruby(e.raw).replace('\u0001','<span class="bl">　　</span>')}</div>`,e.opts[0],e.opts.slice(1),exp,e.key);
}
const qRead=rd=>rd.qs.map((x,i)=>Q('Đọc hiểu',`<div class="pass jp">${ruby(rd.text)}</div><div class="jp">${ruby(x.q)}</div>`,x.opts[0],x.opts.slice(1),'Đọc lại bài và tìm câu chứa thông tin được hỏi.',null));
function qFromKey(key){
  if(key[0]==='k') return K[key.slice(2)]&&qKanji(K[key.slice(2)]);
  if(key[0]==='w') return W[key.slice(2)]&&qWord(W[key.slice(2)]);
  return GEX[key]&&qGram(GEX[key]);
}
function balanced(it,n){
  const g=shuf(it.g).map(e=>qGram(e)),k=shuf(it.k).map(x=>qKanji(x)),w=shuf(it.w).map(x=>qWord(x));
  const ng=Math.ceil(n*.4),nk=Math.ceil(n*.25);
  const out=[...g.slice(0,ng),...k.slice(0,nk)];
  for(const q of [...w,...g.slice(ng),...k.slice(nk)]){if(out.length>=n)break;out.push(q)}
  return shuf(out.filter(Boolean));
}


function kSvg(c,o={}){
  const s=K[c].s,up=o.upto==null?s.length:o.upto;
  let h=`<svg viewBox="0 0 109 109" class="ksvg ${o.cls||''}" role="img" aria-label="${c}"><path class="kgrid" d="M54.5 2V107M2 54.5H107"/>`;
  s.forEach((d,i)=>{if(i<up)h+=`<path class="${o.hi&&i===up-1?'hi':''}${o.ghost?' ghost':''}" d="${d}"/>`});
  if(o.nums) s.forEach((d,i)=>{const m=d.match(/M\s*(-?[\d.]+)[,\s]\s*(-?[\d.]+)/);if(m)h+=`<text x="${Math.max(3,+m[1]-5)}" y="${Math.max(7,+m[2]-1)}">${i+1}</text>`});
  return h+'</svg>';
}
function animate(svg){
  const ps=[...svg.querySelectorAll('path:not(.kgrid)')];
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let t=0; ps.forEach(p=>{const L=p.getTotalLength(),dur=260+L*7;p.style.transition='none';p.style.strokeDasharray=L;p.style.strokeDashoffset=L;
    setTimeout(()=>{p.style.transition=`stroke-dashoffset ${dur}ms ease-in-out`;p.style.strokeDashoffset=0},t+=30);t+=dur+120});
}

  const x=cv.getContext('2d');x.scale(dpr,dpr);x.lineWidth=7;x.lineCap=x.lineJoin='round';x.strokeStyle=getComputedStyle(document.body).getPropertyValue('--ink');
  let on=false;const pt=e=>{const b=cv.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top]};
  cv.onpointerdown=e=>{on=true;cv.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...pt(e))};
  cv.onpointermove=e=>{if(on){x.lineTo(...pt(e));x.stroke()}};cv.onpointerup=cv.onpointercancel=()=>on=false;
}

let VO=[];

const clean=t=>t.replace(/\([ぁ-ゖ]+\)/g,'').replace(/[\s　（）★＊\u0001]/g,'');

  try{speechSynthesis.cancel();const rate=fix||(P()&&P().rate)||.9;
    segs.forEach(s=>{const u=new SpeechSynthesisUtterance(clean(s.t));u.lang='ja-JP';u.rate=rate;

function Q(tag,html,ok,ds,exp,key,n=3){
  ds=uniq(ds).filter(x=>x&&x!==ok).slice(0,n); if(ds.length<n) return null;
  const opts=shuf([ok,...ds]); return {tag,html,opts,a:opts.indexOf(ok),exp,key};
}
const strip=s=>s.replace(/\([ぁ-ゖ]+\)/g,'');
const chunks=s=>s.replace(/([。？！…、])(?=[^\s」。？！…、])/g,'$1 ').split(' ').filter(Boolean);

const BL='<span class="bl">　　</span>';
function qCtx(s,type){
  const ts=[];s.raw.replace(/([一-龯々]+)\(([ぁ-ゖ]+)\)/g,(m,k,r,i)=>{if(r.length>=2&&!/田中|山田/.test(k))ts.push({k,r,i,m})});
  if(!ts.length) return null;
  const t=ts[rnd(ts.length)],cut=x=>ruby(x.split(t.m).join(t.k)),a=cut(s.raw.slice(0,t.i)),b=cut(s.raw.slice(t.i+t.m.length));
  const exp=`<span class="jp">${ruby(s.raw)}</span><br>${esc(s.vi)}`;
  if(type==='r') return Q('Cách đọc kanji',`Phần gạch chân đọc thế nào?<div class="qs jp">${a}<u>${t.k}</u>${b}</div>`,t.r,mutR(t.r).concat(shuf(WL[4].filter(x=>x.r).map(x=>x.r)).sort((x,y)=>Math.abs(x.length-t.r.length)-Math.abs(y.length-t.r.length))),exp,null);
  return Q('Chọn chữ viết đúng',`Phần gạch chân viết bằng kanji thế nào?<div class="qs jp">${a}<u>${t.r}</u>${b}</div>`,t.k,mutK(t.k,4),exp,null);
}
function qX(x,type){
  const m=x.match(/＜([^|]+)\|([^＞]+)＞/),a=ruby(x.slice(0,m.index)),b=ruby(x.slice(m.index+m[0].length)),exp=`<span class="jp">${a}<ruby>${m[1]}<rt>${m[2]}</rt></ruby>${b}</span>`;
  if(type==='r') return Q('Cách đọc kanji',`Phần gạch chân đọc thế nào?<div class="qs jp">${a}<u>${m[1]}</u>${b}</div>`,m[2],mutR(m[2]).concat(shuf(WL[4].filter(w=>w.r).map(w=>w.r)).sort((p,q)=>Math.abs(p.length-m[2].length)-Math.abs(q.length-m[2].length))),exp,null);
  return Q('Chọn chữ viết đúng',`Phần gạch chân viết bằng kanji thế nào?<div class="qs jp">${a}<u>${m[2]}</u>${b}</div>`,m[1],mutK(m[1],4),exp,null);

function qG(x){
  let o;const raw=x.replace(/【([^】]+)】/,(_,t)=>{o=t.split('|');return '\u0001'});
  return Q('Ngữ pháp',`Chọn đáp án đúng cho chỗ trống.<div class="qs jp">${ruby(raw).replace('\u0001',BL)}</div>`,o[0],o.slice(1),`<span class="jp">${ruby(raw).replace('\u0001','<mark>'+ruby(o[0])+'</mark>')}</span>`,null);
}
function qStar(raw){
  const ch=raw.split(' ').filter(Boolean);
  for(let t=0;t<8;t++){const s=rnd(ch.length-4),four=ch.slice(s,s+4),star=1+rnd(2);if(new Set(four).size<4)continue;
    const bl=[0,1,2,3].map(i=>`<span class="bl">${i===star?'★':''}</span>`).join(' ');
    const q=Q('Sắp xếp câu',`Xếp 4 cụm từ vào chỗ trống. Cụm nào nằm ở ô ★?<div class="qs jp">${ruby(ch.slice(0,s).join(' '))} ${bl} ${ruby(ch.slice(s+4).join(' '))}</div>`,four[star],four.filter((_,i)=>i!==star),`<span class="jp">${ruby(raw)}</span>`,null);
    if(q){q.star=1;return q}}

function answer(val,ok){const z=QZ;z.ans[z.i]=val;z.res[z.i]=ok;stopAudio();if(z.opt.exam)nextQ();else{z.shown=true;drawQ()}}
function nextQ(){const z=QZ;z.shown=false;z.flip=false;stopAudio();if(++z.i>=z.qs.length)finishQuiz();else drawQ(true)}
function revItem(q,a){
  const k=q.kind||'mc',h=`<div class="rev"><p class="qtag">${q.tag}</p>`;
  if(k==='mc') return h+`<div class="qtext">${q.html}</div><p>Bạn chọn: <span class="jp no">${a==null?'(bỏ trống)':ruby(q.opts[a]).replace(/[＜＞]/g,'')}</span> · Đáp án: <span class="jp ok">${ruby(q.opts[q.a]).replace(/[＜＞]/g,'')}</span></p>${q.exp?`<p class="mute">${q.exp}</p>`:''}</div>`;
  if(k==='dict') return h+`<p>Bạn viết: <span class="jp no">${esc(a||'(bỏ trống)')}</span></p><p>Đáp án: <span class="jp ok">${ruby(q.raw)}</span><br><span class="mute">${esc(q.vi)}</span></p></div>`;
  if(k==='cloze') return h+`<p>Đáp án theo thứ tự ô: <span class="jp ok">${q.sol.map(ruby).join(' ／ ')}</span></p><p class="mute">${q.exp}</p></div>`;
  return h+q.front+q.back+'</div>';
}
function finishQuiz(){
  const z=QZ;clearInterval(z.timer);stopAudio();const p=P();let ok=0;
  z.qs.forEach((q,i)=>{const r=z.res[i]===true;if(r)ok++;
    if(q.key){if(r){if(p.wrong[q.key]&&--p.wrong[q.key]<=0)delete p.wrong[q.key]}else p.wrong[q.key]=(p.wrong[q.key]||0)+1}});
  p.act[today()]=1;save();
  if(z.opt.chain){z.opt.chain(z);return}
  const pct=Math.round(ok/z.qs.length*100);if(z.opt.done)z.opt.done(pct);
  const bad=z.qs.map((q,i)=>z.res[i]===true?'':revItem(q,z.ans[i])).join('');
  $('#quiz').innerHTML=`<div class="qwrap"><header class="qhead"><button class="x" data-act="qclose" aria-label="Đóng">×</button><b>${esc(z.title)}</b><span></span></header>
  <div class="result"><div class="stamp big ${pct>=60?'':'fail'}">${pct>=60?'合格':'再'}</div><h2>${ok}/${z.qs.length} câu đúng (${pct}%)</h2>
  <p>${pct>=80?'Rất tốt. Bạn đã nắm chắc phần này.':pct>=60?'Đạt. Xem lại các câu sai bên dưới trước khi học tiếp.':'Chưa đạt 60%. Đọc lại bài rồi làm lại nhé.'}</p></div>
  ${bad?'<h3>Câu cần xem lại</h3>'+bad:''}<div class="row"><button class="btn" data-act="qclose">Xong</button></div></div>`;
  $('#quiz').scrollTop=0;z.fin=true;
}
function closeQuiz(){if(QZ)clearInterval(QZ.timer);stopAudio();$('#quiz').classList.remove('on');$('#quiz').innerHTML='';QZ=null;EXS=null;render(true)}

function practice(m){
  const p=P(),days=lessonDays(p.scope==='all'?49:todayN()),Ls=days.map(n=>D(n).L+1),it=merge(days),S=(a,n)=>shuf(a).slice(0,n);

    m==='g'?S(it.g,10).map(e=>qGram(e)).concat(S(Ls.flatMap(x=>FX[x]||[]),5).map(fresh)):m==='bk'?S(EX.BP,10).map(qBank):m==='rd'?S(Ls.filter(x=>RD[x]),3).flatMap(x=>qRead(RD[x])):m==='cz'?S(Ls,5).map(qCloze):

  }else{
    const r=(P().exams||{})[d.exam];
    h+=`<section class="sec"><h2>Đề thi thử số ${d.exam}</h2><p>85 câu chia ba phần như đề thật, tổng 115 phút. Toàn bộ là câu bạn chưa gặp trong bài học, phần nghe chỉ được nghe một lần. Hãy làm một mạch ở nơi yên tĩnh, có loa hoặc tai nghe.</p>
    ${r?`<p class="mute">Lần gần nhất: ${r.tot}/180 điểm (${r.pass?'đạt':'chưa đạt'}), ngày ${fmtY(pd(r.d))}.</p>`:''}<div class="row"><button class="btn" data-act="exam" data-no="${d.exam}" data-n="${n}">Bắt đầu đề số ${d.exam}</button></div></section>`;
  }
  return h+`<nav class="pn">${n>1?`<a href="#/day/${n-1}">← Ngày ${n-1}</a>`:'<span></span>'}${n<TOTAL?`<a href="#/day/${n+1}">Ngày ${n+1} →</a>`:''}</nav>`;
}
function pracV(){
  const p=P(),nl=lessonDays(todayN()).length;
  return `<h1>Luyện tập theo kỹ năng</h1><p class="lead">Chọn một kỹ năng để luyện thêm ngoài bài hằng ngày. Mỗi lượt là một bộ câu mới.</p>
  <label>Phạm vi <select data-act="scope"><option value="learned">Các bài đã học đến hôm nay (${nl} bài)</option><option value="all"${p.scope==='all'?' selected':''}>Toàn bộ 54 bài N4</option></select></label>
  <div class="cards">${PR.map(([m,t,s])=>`<button class="pcard" data-act="prac" data-m="${m}"><b>${t}</b><span>${s}</span></button>`).join('')}
  <a class="pcard" href="#/wrong"><b>Sổ lỗi</b><span>${Object.keys(p.wrong).length} mục bạn từng làm sai, luyện đến khi hết.</span></a></div>`;
}
function examV(){
  const ex=P().exams||{};
  return `<h1>Đề thi thử N4</h1><p class="lead">Hai đề cố định dựng theo cấu trúc và thời lượng của đề N4 hiện hành. Câu hỏi trong đề không trùng với câu nào trong bài học, và hai đề không trùng nhau.</p>
  <table class="tb"><tr><th>Phần</th><th>Thời gian</th><th>Dạng câu</th><th>Số câu</th></tr>
  <tr><td>Chữ và từ vựng</td><td>25 phút</td><td>Cách đọc kanji 7 · Chọn chữ 5 · Điền từ theo ngữ cảnh 8 · Câu đồng nghĩa 4 · Cách dùng từ 4</td><td>28</td></tr>
  <tr><td>Ngữ pháp và đọc hiểu</td><td>55 phút</td><td>Ngữ pháp 13 · Sắp xếp câu 4 · Đoạn văn đục lỗ 4 · Đọc ngắn 3 · Đọc vừa 3 · Tìm thông tin 2</td><td>29</td></tr>
  <tr><td>Nghe hiểu</td><td>35 phút</td><td>Nghe nhiệm vụ 8 · Nghe điểm chính 7 · Chọn câu nói 5 · Đáp lời nhanh 8</td><td>28</td></tr></table>
  <p class="mute">Điểm quy đổi về thang 180 (đỗ từ 90, điểm liệt 38/120 và 19/60). Phần nghe phát ở tốc độ tự nhiên, mỗi câu chỉ nghe một lần và hội thoại có chi tiết gây nhiễu. Giọng đọc là giọng tổng hợp của trình duyệt nên đều và rõ hơn băng thật; hãy luyện thêm bằng đề mẫu chính thức của JLPT trước ngày thi.</p>
  <div class="cards">${[1,2].map(i=>`<button class="pcard" data-act="exam" data-no="${i}"><b>Đề số ${i}</b><span>${ex[i]?`${ex[i].tot}/180, ${ex[i].pass?'đạt':'chưa đạt'} (${fmtY(pd(ex[i].d))})`:'Chưa làm'}</span></button>`).join('')}
  <button class="pcard" data-act="exam" data-no="0"><b>Đề trộn lại</b><span>Trộn câu của cả hai đề. Chỉ nên làm sau khi xong hai đề trên.</span></button></div>`;
}
function kdict(lv){
  lv=+lv===5?5:4;
  return `<h1>Bảng kanji</h1><p class="lead">${ORD[4].length} chữ N4 của lộ trình này và ${ORD[5].length} chữ N5 để ôn lại. Bấm vào một chữ để xem thứ tự nét, âm đọc, mẹo nhớ và tập viết.</p>
  <div class="tabs">${[4,5].map(l=>`<a class="${l===lv?'on':''}" href="#/kanji/${l}">N${l} (${ORD[l].length})</a>`).join('')}</div>
  <div class="kgridv">${ORD[lv].map(c=>`<button class="jp${P().wrong['k:'+c]?' w':''}" data-act="kopen" data-k="${c}" title="${K[c].hv}: ${esc(K[c].m)}">${c}</button>`).join('')}</div>
  <div class="row"><button class="btn" data-act="prac" data-m="kf">Lật thẻ kanji N4</button><button class="btn line" data-act="prac" data-m="kq">Trắc nghiệm kanji N4</button></div>`;
}
function wrongV(){
  const ks=Object.keys(P().wrong);
  const row=k=>{if(k[0]==='k'){const x=K[k.slice(2)];return x&&`<b class="jp">${x.c}</b><span>${x.hv}: ${esc(x.m)}</span>`}
    if(k[0]==='w'){const x=W[k.slice(2)];return x&&`<b class="jp">${wordHtml(x)}</b><span>${esc(x.m)}</span>`}
    const e=GEX[k];return e&&`<b class="jp">${esc(e.g.t)}</b><span class="jp">${exFull(e,1)}</span>`};
  return `<h1>Sổ lỗi</h1><p class="lead">Kanji, từ vựng và mẫu ngữ pháp bạn trả lời sai được ghi lại ở đây. Trả lời đúng lại đủ số lần đã sai thì mục đó tự rời khỏi sổ.</p>
  ${ks.length?`<div class="row"><button class="btn" data-act="wquiz">Luyện lại ${Math.min(20,ks.length)} mục</button></div><ul class="outl">${ks.map(k=>{const r=row(k);return r?`<li>${r}<small>sai ${P().wrong[k]} lần</small></li>`:''}).join('')}</ul>`:'<p class="note">Sổ đang trống. Làm bài tập của một ngày bất kỳ, những câu sai sẽ xuất hiện ở đây.</p>'}`;
}
function setV(){
  const p=P();
  return `<h1>Cài đặt</h1>
  <section class="sec"><h2>Hồ sơ đang dùng</h2><div class="form"><label>Tên<input id="s-name" value="${esc(p.name)}"></label><label>Ngày bắt đầu<input id="s-start" type="date" value="${p.start}"></label></div>
  <div class="row"><button class="btn" data-act="saveset">Lưu thay đổi</button></div></section>
  <section class="sec"><h2>Hiển thị và giọng đọc</h2><label class="chk"><input type="checkbox" data-act="furi" ${p.furi!==false?'checked':''}> Hiện furigana trên kanji</label>
  <div class="form"><label>Giao diện <select data-act="theme"><option value="">Theo thiết bị</option><option value="light"${p.theme==='light'?' selected':''}>Sáng</option><option value="dark"${p.theme==='dark'?' selected':''}>Tối</option></select></label>
  <label>Tốc độ đọc <select data-act="rate">${[[.7,'Chậm'],[.9,'Vừa'],[1,'Tự nhiên'],[1.15,'Nhanh']].map(([v,t])=>`<option value="${v}"${(p.rate||.9)==v?' selected':''}>${t}</option>`).join('')}</select></label></div>
  <div class="row"><button class="btn line" data-act="ttstest">${SPK} Thử giọng đọc</button></div>
  <p class="mute">Phần nghe dùng giọng tiếng Nhật có sẵn của thiết bị. Nếu bấm thử mà không có tiếng hoặc nghe như đọc tiếng Anh, hãy cài thêm giọng tiếng Nhật trong phần cài đặt ngôn ngữ của máy, hoặc mở trang bằng Chrome, Edge hay Safari.</p></section>
  <section class="sec"><h2>Các hồ sơ trên máy này</h2><p class="mute">Mỗi hồ sơ có tiến độ và sổ lỗi riêng. Dữ liệu chỉ nằm trong trình duyệt này, không gửi đi đâu.</p>
  <ul class="outl">${Object.values(DB.profiles).map(q=>`<li><b>${esc(q.name)}</b><span>bắt đầu ${fmtY(pd(q.start))}</span>${q.id===p.id?'<small>đang dùng</small>':`<button class="btn sm line" data-act="switch" data-id="${q.id}">Chuyển sang</button>`}</li>`).join('')}</ul>
  <div class="row"><button class="btn line" data-act="addp">Thêm hồ sơ mới</button></div></section>
  <section class="sec"><h2>Sao lưu</h2><p class="mute">Xoá dữ liệu trình duyệt sẽ làm mất tiến độ. Hãy tải bản sao lưu định kỳ, hoặc dùng nó để chuyển sang máy khác.</p>
  <div class="row"><button class="btn line" data-act="export">Tải bản sao lưu</button><label class="btn line">Khôi phục từ tệp<input type="file" accept="application/json" id="imp" hidden></label></div>
  <div class="row"><button class="btn sm danger" data-act="reset">Xoá tiến độ của hồ sơ này</button>${Object.keys(DB.profiles).length>1?'<button class="btn sm danger" data-act="delp">Xoá hồ sơ này</button>':''}</div></section>
  <section class="sec"><h2>Nguồn dữ liệu</h2><p class="mute">Nét viết kanji: KanjiVG © Ulrich Apel, giấy phép CC BY-SA 3.0. Âm On, Kun và phân cấp JLPT: KANJIDIC2 © EDRDG, giấy phép CC BY-SA 4.0. JLPT không công bố danh sách chính thức, phân cấp chỉ mang tính tham khảo.</p></section>`;
}
let lastHash=null;
function render(keep){
  const app=$('#app');
  if(!P()){app.innerHTML=onboard();return}
  const p=P();if(p.theme)document.documentElement.dataset.theme=p.theme;else delete document.documentElement.dataset.theme;
  document.body.classList.toggle('nofuri',p.furi===false);
  const [r,a]=(location.hash.slice(2)||'').split('/'),y=scrollY;
  const v=r==='plan'?plan():r==='day'?day(+a||todayN()):r==='prac'?pracV():r==='exam'?examV():r==='kanji'?kdict(a):r==='wrong'?wrongV():r==='set'?setV():home();
  app.innerHTML=`<nav class="nav"><a class="brand" href="#/"><span class="jp">日本語</span>JLPT N4</a>${NAV.map(([h,t,g])=>`<a href="#/${h}" class="${(r||'')===h||(h==='plan'&&r==='day')||(h==='prac'&&r==='wrong')?'on':''}"><span class="jp">${g}</span>${t}</a>`).join('')}</nav>
  <main>${LS.ok?'':'<p class="note">Trình duyệt đang chặn lưu trữ ở chế độ xem này nên tiến độ sẽ mất khi đóng trang. Hãy mở tệp trực tiếp bằng trình duyệt hoặc đưa lên hosting để lưu được lâu dài.</p>'}${v}</main>`;
  scrollTo(0,keep&&lastHash===location.hash?y:0);lastHash=location.hash;
}

/* ================= Sự kiện ================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,p=P(),z=QZ,q=z&&z.qs&&z.qs[z.i];
  if(a==='create'){const s=$('#o-start').value;if(!s){toast('Hãy chọn ngày bắt đầu.');return}newProfile($('#o-name').value.trim()||'Bạn',s);location.hash='#/';render()}
  else if(a==='back'){DB.cur=Object.keys(DB.profiles)[0];render()}
  else if(a==='say'){e.stopPropagation();say(t.dataset.t)}
  else if(a==='anim') animate(t.closest('.kcard').querySelector('.genko svg'));
  else if(a==='kopen'){openModal(kCard(K[t.dataset.k]));animate($('#modal .genko svg'))}
  else if(a==='pad') openPad(t.dataset.k);
  else if(a==='padclr'){const c=$('#modal canvas');c.getContext('2d').clearRect(0,0,c.width,c.height)}
  else if(a==='close'){stopAudio();closeModal()}
  else if(a==='reveal') t.classList.toggle('show');
  else if(a==='kwall'){const k=KW[t.dataset.l];speak(k.lines.map(l=>({t:l.jp,v:VOI[l.s]})))}
  else if(a==='kwshow') t.closest('.sec').querySelector('.kwl').classList.toggle('veil');
  else if(a==='role'){RP={L:+t.dataset.l,r:t.dataset.r,i:0};roleStep()}
  else if(a==='rpshow'){$('#rpa').hidden=false;const ln=KW[RP.L].lines[RP.i];speak([{t:ln.jp,v:VOI[ln.s]}])}
  else if(a==='rpnext'){RP.i++;roleStep()}
  else if(a==='quiz'){const n=+t.dataset.n,s=t.dataset.sec,d=D(n);startQuiz(`Ngày ${n}: ${d.type==='lesson'?SECN[s]:dayLabel(d)}`,buildSec(n,s),{done:pct=>markDone(n,s,pct)})}
  else if(a==='exam'){const n=+t.dataset.n;startExam(+t.dataset.no,n?pct=>markDone(n,'q',pct):null)}
  else if(a==='exgo'){const ex=EXS,pt=ex.parts[ex.i];startQuiz(`${ex.no?'Đề '+ex.no:'Đề trộn lại'} · ${pt.title}`,pt.qs,{exam:true,limit:pt.min*60,chain:zz=>{ex.done.push(zz);QZ=null;if(++ex.i<3)examIntro();else examResult()}})}
  else if(a==='prac') practice(t.dataset.m);
  else if(a==='wquiz') startQuiz('Luyện lại sổ lỗi',shuf(Object.keys(p.wrong)).slice(0,20).map(qFromKey));
  else if(a==='qplay') playQ();
  else if(a==='pick'){if(!z.shown)answer(+t.dataset.i,+t.dataset.i===q.a)}
  else if(a==='dchip'){const i=$('#din');i.value+=t.dataset.t}
  else if(a==='dclr') $('#din').value='';
  else if(a==='dcheck'){const v=$('#din').value;answer(v,dictOk(q,v))}
  else if(a==='czadd'){const st=z.ans[z.i],b=q.sol.findIndex((_,j)=>st.f[j]==null);if(b<0)return;const i=+t.dataset.i;st.f[b]=q.bank[i];st.u[b]=i;drawQ()}
  else if(a==='czrm'){const st=z.ans[z.i],b=+t.dataset.b;st.f[b]=null;st.u[b]=null;drawQ()}
  else if(a==='czcheck'){const st=z.ans[z.i];z.res[z.i]=q.sol.every((s,j)=>st.f[j]===s);z.shown=true;drawQ()}
  else if(a==='flip'){z.flip=true;drawQ();if(q.say)say(q.say)}
  else if(a==='fyes'||a==='fno'){z.res[z.i]=a==='fyes';nextQ()}
  else if(a==='qnext') nextQ();
  else if(a==='qclose'){if((EXS||(z&&!z.fin&&z.res.length))&&!confirm('Thoát bài đang làm? Kết quả sẽ không được lưu.'))return;closeQuiz()}
  else if(a==='saveset'){const s=$('#s-start').value;if(!s){toast('Hãy chọn ngày bắt đầu.');return}p.name=$('#s-name').value.trim()||p.name;p.start=s;save();render();toast('Đã lưu thay đổi.')}
  else if(a==='ttstest') speak([{t:'こんにちは。わたし は リン です。',v:'f'},{t:'はじめまして。田中(たなか) です。よろしく おねがいします。',v:'m'}]);
  else if(a==='switch'){DB.cur=t.dataset.id;save();render();toast('Đã chuyển hồ sơ.')}
  else if(a==='addp'){DB.cur=null;render()}
  else if(a==='export'){const b=new Blob([JSON.stringify(DB)],{type:'application/json'}),l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='jlpt-n5-sao-luu.json';l.click();toast('Đã tải bản sao lưu.')}
  else if(a==='reset'){if(confirm('Xoá toàn bộ tiến độ và sổ lỗi của hồ sơ này?')){p.done={};p.wrong={};p.act={};p.exams={};save();render();toast('Đã xoá tiến độ.')}}
  else if(a==='delp'){if(confirm(`Xoá hồ sơ “${p.name}”?`)){delete DB.profiles[p.id];DB.cur=Object.keys(DB.profiles)[0];save();render()}}
});
document.addEventListener('change',e=>{
  const t=e.target,a=t.dataset.act;
  if(a==='hide') t.closest('.sec').querySelector('.vlist').classList.toggle('hidden',t.checked);
  else if(a==='furi'){P().furi=t.checked;save();render(true)}
  else if(a==='theme'){P().theme=t.value;save();render(true)}
  else if(a==='rate'){P().rate=+t.value;save()}
  else if(a==='scope'){P().scope=t.value;save()}
  else if(t.id==='imp'&&t.files[0]){const f=new FileReader();f.onload=()=>{try{const d=JSON.parse(f.result);if(!d.profiles||!Object.keys(d.profiles).length)throw 0;DB=d;if(!P())DB.cur=Object.keys(DB.profiles)[0];save();render();toast('Đã khôi phục dữ liệu.')}catch(x){toast('Tệp không đúng định dạng sao lưu.')}};f.readAsText(t.files[0])}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#modal').classList.contains('on')){stopAudio();closeModal()}return}
  const z=QZ;if(!z||z.fin||!z.qs)return;const q=z.qs[z.i],k=q.kind||'mc';
  if(k==='mc'&&/^[1-4]$/.test(e.key)&&!z.shown&&+e.key<=q.opts.length) answer(+e.key-1,+e.key-1===q.a);
  else if(e.key==='Enter'){if(z.shown){e.preventDefault();nextQ()}else if(k==='dict'){e.preventDefault();const v=$('#din').value;answer(v,dictOk(q,v))}}
});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'){stopAudio();closeModal()}});
addEventListener('hashchange',()=>render());
if(!P()&&Object.keys(DB.profiles).length) DB.cur=Object.keys(DB.profiles)[0];
render();
</script>
