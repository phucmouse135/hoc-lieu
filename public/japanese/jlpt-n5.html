<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lộ trình JLPT N5 trong 8 tuần</title>
<meta name="description" content="Lộ trình 8 tuần ôn JLPT N5: ngữ pháp, từ vựng, kanji có thứ tự nét, kaiwa, nghe hiểu, chép chính tả và đề thi thử.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23D23F2A'/%3E%3Ctext x='50' y='72' font-size='64' text-anchor='middle' fill='white'%3E五%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F5F8F4;--card:#FFFFFF;--ink:#1B2836;--mute:#5C6B78;--line:#D3DED5;--grid:#8FBF9F;--ai:#26497F;--ai-soft:#E3ECF8;--shu:#D23F2A;--shu-soft:#FBE8E4;--hl:#FFF1A6;--ok:#1B7A57;--ok-soft:#E0F3EA;
 --jp:"Klee One","Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo","Noto Sans JP",sans-serif;--ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#111922;--card:#18222E;--ink:#E7EDF1;--mute:#98A6B2;--line:#2A3848;--grid:#3E6B55;--ai:#93B6EE;--ai-soft:#1D2C44;--shu:#F0705C;--shu-soft:#3A211D;--hl:#5A5015;--ok:#5CC79B;--ok-soft:#173529}}
:root[data-theme="dark"]{--paper:#111922;--card:#18222E;--ink:#E7EDF1;--mute:#98A6B2;--line:#2A3848;--grid:#3E6B55;--ai:#93B6EE;--ai-soft:#1D2C44;--shu:#F0705C;--shu-soft:#3A211D;--hl:#5A5015;--ok:#5CC79B;--ok-soft:#173529}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--ui);-webkit-text-size-adjust:100%}
.jp{font-family:var(--jp);font-weight:600}
rt{font-size:.55em;font-weight:400;color:var(--mute);user-select:none}
.nofuri rt{display:none}
a{color:var(--ai)}
h1{font-size:1.75rem;line-height:1.25;margin:.2em 0 .3em;letter-spacing:-.01em}
h2{font-size:1.2rem;margin:0 0 .6em;display:flex;align-items:center;gap:.5em;flex-wrap:wrap}
h3{font-size:1.1rem;margin:0 0 .2em}
p{margin:.4em 0 .8em;max-width:68ch}
.mute{color:var(--mute);font-size:.92rem}.lead{font-size:1.05rem}
mark{background:var(--hl);color:inherit;padding:0 .15em;border-radius:3px}
:focus-visible{outline:3px solid var(--ai);outline-offset:2px}
#app{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:100vh}
.nav{position:sticky;top:0;align-self:start;height:100vh;padding:20px 12px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;background:var(--card)}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500}
.nav a .jp{width:28px;height:28px;display:grid;place-items:center;border:1.5px solid var(--grid);border-radius:4px;font-size:1rem}
.nav a.on{background:var(--ai-soft);color:var(--ai)}.nav a.on .jp{border-color:var(--ai)}
.nav .brand{font-weight:700;margin-bottom:14px;flex-direction:column;align-items:flex-start;gap:0;line-height:1.3}
.nav .brand .jp{border:0;width:auto;height:auto;font-size:1.5rem;color:var(--shu)}
main{padding:28px clamp(16px,4vw,48px) 96px;max-width:900px;width:100%}
.onb{max-width:460px;margin:0 auto;padding:8vh 20px;grid-column:1/-1}
.onb label,.form label{display:block;font-weight:500;margin:14px 0}
input:not([type=checkbox]),select{display:block;width:100%;margin-top:4px;padding:10px 12px;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:8px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0 16px}
.genko-row{display:flex;margin-bottom:18px}.genko-row span{width:64px;height:64px;display:grid;place-items:center;border:1.5px solid var(--grid);margin-right:-1.5px;font:600 2.2rem var(--jp);color:var(--shu)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border:1.5px solid var(--ai);border-radius:8px;background:var(--ai);color:var(--card);font:600 1rem var(--ui);text-decoration:none;cursor:pointer}
.btn.line{background:transparent;color:var(--ai)}.btn.sm{padding:6px 12px;font-size:.88rem}.btn.wide{width:100%;margin-top:10px}
.btn.danger{background:transparent;border-color:var(--shu);color:var(--shu)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0}
.note{background:var(--shu-soft);border-left:4px solid var(--shu);padding:10px 14px;border-radius:0 8px 8px 0;max-width:none}
.tip{background:var(--hl);padding:8px 12px;border-radius:8px;font-size:.95rem}
.tip::before{content:"Mẹo nhớ: ";font-weight:700}
.sec{margin:34px 0;padding-top:22px;border-top:1.5px solid var(--line)}
.crumb{font-size:.88rem;color:var(--mute);margin:0}
.hero{display:flex;gap:28px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.hero-k{display:flex}.hero-k .genko{width:clamp(84px,17vw,128px);margin-right:-1.5px;cursor:pointer;padding:0;background:var(--card)}
.genko{aspect-ratio:1;border:1.5px solid var(--grid);background:var(--card);position:relative;display:block}
.genko.txt{display:grid;place-items:center;font-size:clamp(3rem,10vw,4.6rem);color:var(--shu)}
.ksvg{display:block;width:100%;height:100%}
.ksvg path{fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.ksvg path.kgrid{stroke:var(--grid);stroke-width:.6;stroke-dasharray:3 3;opacity:.8}
.ksvg path.hi{stroke:var(--shu)}.ksvg path.ghost{stroke:var(--line)}
.ksvg text{font:600 7px var(--ui);fill:var(--shu)}
.ksvg.st path{stroke-width:5}.ksvg.st .kgrid{display:none}
.stamp{display:inline-grid;place-items:center;width:2em;height:2em;border:2px solid var(--shu);border-radius:50%;color:var(--shu);font:600 .95rem var(--jp);transform:rotate(-10deg);flex:none}
.stamp.sm{font-size:.75rem}.stamp.big{width:5.2rem;height:5.2rem;font-size:1.7rem;border-width:3px;margin:10px auto}
.stamp.fail{border-color:var(--mute);color:var(--mute)}
.todo,.outl,.vlist,.gx,.kw{list-style:none;padding:0;margin:10px 0}
.todo li,.outl li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:9px 2px;border-bottom:1px dashed var(--line)}
.todo li.done a{color:var(--mute);text-decoration:line-through}.todo span{color:var(--mute);font-size:.9rem}
.outl li>span{flex:1;color:var(--mute)}.outl li>b{min-width:9em}.outl small{color:var(--shu)}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));flex:1}
.cell{aspect-ratio:1;border:1.5px solid var(--grid);margin:0 -1.5px -1.5px 0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:3px;text-decoration:none;color:var(--ink);background:var(--card);position:relative;min-width:0}
.cell small{font-size:.62rem;color:var(--mute);line-height:1.2}.cell b{font-size:clamp(1rem,3.4vw,1.6rem);line-height:1;opacity:.85}
.cell.review b,.cell.mock b,.cell.final b{color:var(--ai)}
.cell.today{outline:3px solid var(--ai);outline-offset:-3px;z-index:1}
.cell .stamp{position:absolute;inset:0;margin:auto;width:70%;height:70%;font-size:clamp(.8rem,2.6vw,1.2rem);background:color-mix(in srgb,var(--card) 70%,transparent)}
.wk{display:flex;align-items:center;gap:10px;margin-bottom:1.5px}.wkl{width:74px;flex:none;font-weight:600;font-size:.85rem}.wkl small{display:block;font-weight:400;color:var(--mute);font-size:.7rem}
.pbar{display:grid;grid-template-columns:70px 1fr 60px;gap:10px;align-items:center;margin:6px 0;font-size:.9rem}
.pbar div,.qbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.pbar i,.qbar i{display:block;height:100%;background:var(--ok)}
.gcard{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:16px 18px;margin:14px 0}
.gcard h3{font-size:1.35rem;color:var(--ai)}.gm{font-weight:600;margin:0 0 8px}
.gs{background:var(--ai-soft);padding:8px 12px;border-radius:8px;max-width:none}
.gx li,.vlist li,.kw li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px dashed var(--line)}
.gx .jp,.pass{font-size:1.15rem;line-height:2}.gx .vi{display:block;color:var(--mute);font-size:.93rem}
.say{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:transparent;color:var(--ai);display:grid;place-items:center;cursor:pointer;margin-top:4px}
.vlist li{cursor:pointer;align-items:center}.vlist .jp{font-size:1.2rem;min-width:9.5em;line-height:2}.kw .jp{min-width:7em;font-size:1.1rem;line-height:2}
.vlist.hidden li:not(.show) .vm{filter:blur(6px)}
.chk{display:flex;gap:8px;align-items:center;margin:10px 0;font-size:.95rem}
.kcard{display:grid;grid-template-columns:200px minmax(0,1fr);gap:14px 22px;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:16px;margin:14px 0}
.kcard .hv{color:var(--shu);font-size:1.3rem;margin-right:.3em}
.chips span{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:0 10px;font-size:.8rem;margin-right:6px;color:var(--mute)}
.yomi{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:8px 0}.yomi dt{color:var(--mute);font-size:.88rem}.yomi dd{margin:0}
.steps{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px}.steps svg{width:54px;height:54px;border:1px solid var(--line);background:var(--card)}
.tabs{display:flex;gap:8px;margin:14px 0}.tabs a{padding:6px 14px;border:1.5px solid var(--line);border-radius:99px;text-decoration:none;color:var(--ink)}.tabs a.on{background:var(--ai);border-color:var(--ai);color:var(--card)}
.kgridv{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr))}
.kgridv button{aspect-ratio:1;border:1.5px solid var(--grid);margin:0 -1.5px -1.5px 0;background:var(--card);color:var(--ink);font-size:1.5rem;cursor:pointer;padding:0}
.kgridv button.w{background:var(--shu-soft)}.kgridv button:hover{background:var(--ai-soft)}
.pn{display:flex;justify-content:space-between;margin-top:40px}
#modal,#quiz{position:fixed;inset:0;z-index:50;display:none;overflow:auto}
#modal.on{display:grid;place-items:center;background:rgba(10,18,28,.55);padding:16px}
.sheet{background:var(--paper);border-radius:12px;padding:22px;width:min(680px,100%);max-height:92vh;overflow:auto;position:relative}
.sheet .kcard{border:0;padding:0;background:transparent;margin:0}
.x{position:absolute;top:8px;right:10px;width:36px;height:36px;border:0;background:transparent;font-size:1.6rem;color:var(--mute);cursor:pointer;z-index:2}
.pad{position:relative;width:min(320px,80vw);margin:10px auto}.pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
#quiz.on{display:block;background:var(--paper)}
.qwrap{max-width:680px;margin:0 auto;padding:16px 18px 80px}
.qhead{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:6px 0 10px}.qhead .x{position:static}.qhead b{flex:1}
.qtag{display:inline-block;margin:18px 0 6px;font-size:.82rem;font-weight:600;color:var(--ai);background:var(--ai-soft);padding:2px 10px;border-radius:99px}
.qtext{font-size:1.05rem}.qs{font-size:1.45rem;line-height:2.1;margin:10px 0}.qs.huge,.qs .huge{font-size:4rem;line-height:1.3}
.qs u{text-decoration-thickness:2px;text-underline-offset:6px}
.pass{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.bl{display:inline-block;min-width:3em;border-bottom:2px solid var(--ink);text-align:center;color:var(--shu);margin:0 2px}
.opts{display:grid;gap:10px;margin:16px 0}
.opt{display:flex;gap:12px;align-items:center;text-align:left;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:1.12rem;cursor:pointer;line-height:1.8}
.opt .on{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:600 .8rem var(--ui);flex:none}
.opt:not(:disabled):hover{border-color:var(--ai)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.no{border-color:var(--shu);background:var(--shu-soft)}
.fb{padding:12px 16px;border-radius:10px;margin:8px 0}.fb.good{background:var(--ok-soft)}.fb.bad{background:var(--shu-soft)}.fb p{margin:.3em 0;max-width:none}
.fb.good b{color:var(--ok)}.fb.bad b{color:var(--shu)}
.result{text-align:center;padding:10px 0 20px}.result p{margin-inline:auto}
.rev{border-top:1px dashed var(--line);padding:10px 0}.rev .qs{font-size:1.2rem}.rev .huge{font-size:2.4rem}.rev .pass{display:none}
span.ok{color:var(--ok)}span.no{color:var(--shu)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:99;font-size:.92rem;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:820px){
 #app{display:block}
 .nav{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));border:0;border-top:1px solid var(--line);z-index:20}
 .nav .brand{display:none}.nav a{flex-direction:column;gap:2px;font-size:.68rem;padding:4px 6px}
 main{padding-top:18px}h1{font-size:1.45rem}
 .kcard{grid-template-columns:1fr}.kfig{max-width:220px}
 .wk{flex-direction:column;align-items:stretch;gap:2px;margin-bottom:10px}.wkl{width:auto}.wkl small{display:inline;margin-left:8px}
 .vlist .jp{min-width:7.5em}.outl li{flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.pass{white-space:pre-line}
.qs.sm{font-size:1.15rem}
.guide{padding-left:1.3em;max-width:70ch}.guide li{margin:.45em 0}
.kwl .spk{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ai-soft);color:var(--ai);display:grid;place-items:center;font-size:.85rem;margin-top:6px}
.kwl.veil div{filter:blur(7px);user-select:none}
.gxl{font-size:1.3rem;line-height:2.1}
.vlist li.cut{border-top:2px solid var(--grid)}
.chipsb{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chip{padding:6px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-size:1.1rem;line-height:1.9;cursor:pointer}
.chip:disabled{opacity:.35;cursor:default}.chip:not(:disabled):hover{border-color:var(--ai)}
#din{font-size:1.2rem;padding:12px 14px;margin-top:12px}
.czb{font:inherit;background:var(--ai-soft);border:0;border-bottom:2px solid var(--ai);border-radius:4px 4px 0 0;color:var(--ai);cursor:pointer;padding:0 8px;min-width:3.2em}
.czb.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}.czb.no{background:var(--shu-soft);border-color:var(--shu);color:var(--shu)}
.bl.cur{background:var(--hl);border-color:var(--shu)}
.flash{background:var(--card);border:1.5px solid var(--grid);border-radius:10px;padding:26px 18px;text-align:center;margin:14px 0;min-height:180px}
.flash .huge{font-size:5rem;line-height:1.2}.flash p{margin-inline:auto}
.fback{border-top:1px dashed var(--line);margin-top:16px;padding-top:14px}
.rev .huge{font-size:2.2rem}
.tb{width:100%;border-collapse:collapse;margin:14px 0;font-size:.93rem;text-align:left}
.tb th,.tb td{border:1px solid var(--line);padding:7px 10px;vertical-align:top}.tb th{background:var(--ai-soft)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin:18px 0}
.pcard{display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px 16px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;text-decoration:none;cursor:pointer}
.pcard:hover{border-color:var(--ai)}.pcard b{color:var(--ai)}.pcard span{color:var(--mute);font-size:.9rem}
@media (max-width:820px){.nav a{font-size:.62rem;padding:4px 2px}.nav a .jp{width:26px;height:26px}.tb{font-size:.82rem}}
.btn:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="quiz" role="dialog" aria-label="Bài tập"></div>

ong vườn có con chó.\nかばん の 中(なか) 【に|で|を|へ】 さいふ が あります。=Trong cặp có cái ví.\n##10\nこの りょうり は あまり 【おいしく|おいしい|おいしいく|おいし】 ないです。=Món này không ngon lắm.\n田中(たなか)さん は 【ゆうめいな|ゆうめい|ゆうめいの|ゆうめいい】 いしゃ です。=Anh Tanaka là bác sĩ nổi tiếng.\n##11\nきのう は 【さむかったです|さむいでした|さむでした|さむくでした】。=Hôm qua trời lạnh.\nわたし は スポーツ 【が|を|に|で】 へた です。=Tôi chơi thể thao kém.\n##12\nあした いっしょに テニス を 【しませんか|しましたか|して いますか|しませんでしたか】。=Ngày mai cùng chơi tennis không?\nさむい です ね。まど を 【しめましょうか|しめましたか|しめて いますか|しめませんでしたか】。=Lạnh nhỉ. Tôi đóng cửa sổ nhé?\n##13\nちょっと 【まって|まちて|まんで|まいて】 ください。=Xin chờ một chút.\nもう すこし ゆっくり 【話(はな)して|話(はな)って|話(はな)いて|話(はな)んで】 ください。=Xin hãy nói chậm hơn một chút.\n##14\n山田(やまだ)さん は 今(いま) でんわ を 【かけて います|かけます|かけて あります|かけました】。=Anh Yamada bây giờ đang gọi điện.\nこの へや に 【入(はい)っても|入(はい)っては|入(はい)るも|入(はい)りても】 いいです か。=Tôi vào phòng này được không?\n##15\nここ で 【およいでは|およいでも|およぐては|およぎては】 いけません。=Không được bơi ở đây.\nは を みがいて 【から|まで|あと|まえ】、ねます。=Đánh răng xong tôi mới đi ngủ.\n##16\nきのう は えき へ 行(い)って、友(とも)だち に 【あって|あう|あった|あいて】、いっしょに かえりました。=Hôm qua tôi ra ga, gặp bạn rồi cùng về.\nコーヒー、もう いっぱい 【いかが|いくら|いくつ|どちら】 です か。=Anh dùng thêm một ly cà phê nữa nhé?\n##17\nあした は 学校(がっこう) へ 【行(い)かない|行(い)きない|行(い)くない|行(い)らない】。=Ngày mai tôi không đi học.\nあぶない です から、【さわらないで|さわらなくて|さわりないで|さわるないで】 ください。=Nguy hiểm nên xin đừng chạm vào.\n##18\n毎日(まいにち) かんじ を 【おぼえなければ|おぼえないければ|おぼえなくても|おぼえなけば】 なりません。=Mỗi ngày phải nhớ chữ Hán.\nきょう は お金(かね) を 【はらわなくても|はらいなくても|はらわないても|はらわなくでも】 いいです。=Hôm nay không cần trả tiền cũng được.\n##19\nあに は ギター を 【ひく こと|ひき こと|ひいて こと|ひきます こと】 が できます。=Anh tôi biết chơi ghi-ta.\n日本(にほん) へ 【来(く)る|来(き)た|来(き)て|来(き)ます】 まえに、日本語(にほんご) を べんきょう しました。=Trước khi đến Nhật tôi đã học tiếng Nhật.\n##20\nわたし は いちど も すもう を 【見(み)た|見(み)る|見(み)て|見(み)】 こと が ありません。=Tôi chưa xem sumo lần nào.\n日曜日(にちようび) は そうじ を したり、せんたく を 【したり|して|する|した】 します。=Chủ nhật tôi nào là dọn dẹp, nào là giặt giũ.\n##21\nしゅくだい を 【した|する|して|し】 あとで、ゲーム を します。=Làm bài tập xong tôi chơi game.\nきのう の テスト は 【むずかしかった|むずかしいだった|むずかしでした|むずかしくだった】。=Bài kiểm uật\n#40\n|レジ|quầy tính tiền\n|サイズ|cỡ\n店員|てんいん|nhân viên cửa hàng\nお客さん|おきゃくさん|khách hàng\n|セール|đợt giảm giá\n#41\n四角い|しかくい|vuông\n緑|みどり|màu xanh lá\n|ピンク|màu hồng\n大きさ|おおきさ|độ lớn\n|グレー|màu xám\n#42\n|それでは|vậy thì\n|ですから|vì vậy\n|たとえば|ví dụ\n|それに|hơn nữa\n|けれども|tuy nhiên\n", "g5": "##1\n@〜は 〜です|A là B|N1 は N2 です\nは (đọc là \"wa\") nêu chủ đề của câu; です đứng cuối câu để khẳng định một cách lịch sự.\n!Trợ từ は viết bằng chữ \"ha\" nhưng luôn đọc \"wa\". Đề thi hay cho わ để bẫy.\n>わたし 【は|わ|を|に】 学生(がくせい) です。=Tôi là học sinh.\n>マイさん は ベトナム人(じん) 【です|ます|います|あります】。=Mai là người Việt Nam.\n@〜じゃ ありません|không phải là|N1 は N2 じゃ(では) ありません\nDạng phủ định của です. では ありません trang trọng (văn viết), じゃ ありません dùng khi nói.\n>わたし は 先生(せんせい) 【じゃ ありません|じゃ ありです|く ありません|では います】。=Tôi không phải là giáo viên.\n>これ は わたし の かばん 【では|には|へは|とは】 ありません。=Đây không phải cặp của tôi.\n##2\n@〜か|câu hỏi|câu + か\nThêm か vào cuối câu để hỏi, không cần dấu \"?\". Trả lời: はい、そうです / いいえ、ちがいます.\n>あの 人(ひと) は 田中(たなか)さん です 【か|を|に|で】。=Người kia là anh Tanaka phải không?\n>A「学生(がくせい) です か。」 B「はい、【そう です|そう ます|はい です|そう あります】。」=A: Bạn là học sinh à? B: Vâng, đúng vậy.\n@〜も|cũng|N も\nも thay cho は / が / を khi muốn nói \"cũng\". Không nói はも.\n!も nghe như \"more\" → thêm nữa = cũng.\n>わたし は 学生(がくせい) です。リンさん 【も|は|の|か】 学生(がくせい) です。=Tôi là học sinh. Linh cũng là học sinh.\n>これ も それ 【も|は|が|を】 わたし の 本(ほん) です。=Cái này và cái đó đều là sách của tôi.\n##3\n@〜の 〜|của; nối hai danh từ|N1 の N2\nの nối hai danh từ, N1 bổ nghĩa cho N2 (sở hữu, thuộc về, loại gì). Thứ tự ngược với tiếng Việt.\n!Dịch từ sau ra trước: 日本語の本 → sách (của) tiếng Nhật.\n>これ は わたし 【の|は|も|を】 本(ほん) です。=Đây là sách của tôi.\n>田中(たなか)さん は 日本語(にほんご) 【の|が|に|で】 先生(せんせい) です。=Anh Tanaka là giáo viên tiếng Nhật.\n@これ・それ・あれ|cái này / cái đó / cái kia|これ / それ / あれ は N です\nこれ: gần người nói. それ: gần người nghe. あれ: xa cả hai. Để hỏi: どれ (cái nào).\n!Quy tắc こ-そ-あ-ど: こ gần tôi, そ gần bạn, あ xa cả hai, ど để hỏi.\n>A「それ は 何(なん) です か。」 B「【これ|それ|あれ|どれ】 は じしょ です。」=A: Cái đó là gì? B: Cái này là từ điển.\n>【あれ|あの|あそこ|あんな】 は 山田(やまだ)さん の 車(くるま) です。=Cái kia là xe của anh Yamada.\n##4\n@この・その・あの + N|N này / đó / kia|この / その / あの + N\nKhác これ / それ / あれ: この / その / あの bắt buộc có danh từ theo sau. Để hỏi: どの N.\n!これ đứng được một mình; この phải \"nắm tay\" một danh từ.\n>【この|これ|ここ|こう】 かさ は わたし の です。=Cái ô này là của tôi.\n>あの 人(ひと) は 【だれ|なに|どれ|どこ】 です か。=Người kia là ai?\n@ここ・そこ・あそこ|chỗ này / đó / kia|ここ / そこ / あそこ は nơi chốn です\nChỉ địa điểm. Để hỏi: どこ. Lịch sự hơn: こちら / そちら / あちら / どちら.\n>トイレ は 【どこ|どれ|だれ|なん】 です か。=Nhà vệ sinh ở đâu?\n>【ここ|これ|この|こう】 は きょうしつ です。=Chỗ này là phòng học.\n##5\n@〜ます・〜ません|động từ lịch sự: làm / không làm|V ます / V ません\nĐộng từ luôn đứng cuối câu. ます dùng cho thói quen, hiện tại hoặc tương lai; ません là phủ định.\n>わたし は 毎日(まいにち) べんきょう 【します|です|あります|いです】。=Tôi học mỗi ngày.\n>田中(たなか)さん は おさけ を 【のみません|のみじゃ ありません|のむません|のみないです】。=Anh Tanaka không uống rượu.\n@〜を|trợ từ tân ngữ|N を V\nを (đọc \"o\") đánh dấu thứ chịu tác động của động từ: ăn gì, uống gì, đọc gì.\n!Chữ を chỉ có một việc duy nhất: làm trợ từ tân ngữ.\n>あさ、パン 【を|に|が|へ】 食(た)べます。=Buổi sáng tôi ăn bánh mì.\n>何(なに) 【を|は|で|と】 のみます か。=Bạn uống gì?\n##6\n@〜に (thời gian)|vào lúc|thời điểm cụ thể + に\nDùng に với thời gian có con số hoặc tên thứ: 7時に, 3月に, 月曜日に. Không dùng với きょう, あした, 毎日, 来週…\n!Có con số thì có に; từ \"tương đối\" như hôm nay, tuần sau thì không.\n>毎朝(まいあさ) 6時(じ) 【に|で|を|へ】 おきます。=Mỗi sáng tôi dậy lúc 6 giờ.\n>日曜日(にちようび) 【に|を|と|が】 テニス を します。=Chủ nhật tôi chơi tennis.\n@〜へ 行きます|đi / đến / về (hướng)|nơi chốn + へ(に) + 行きます・来ます・帰ります\nへ (đọc \"e\") chỉ hướng di chuyển, có thể thay bằng に. どこへも 行きません = không đi đâu cả.\n>来週(らいしゅう) 日本(にほん) 【へ|を|で|が】 行(い)きます。=Tuần sau tôi đi Nhật.\n>きのう は どこ 【へも|へは|へか|をも】 行(い)きませんでした。=Hôm qua tôi không đi đâu cả.\n##7\n@〜で|ở (nơi hành động) / bằng (phương tiện)|nơi chốn・phương tiện + で + V\nで chỉ nơi hành động xảy ra, hoặc phương tiện, công cụ, ngôn ngữ dùng để làm việc đó.\n!で = nơi \"diễn ra hành động\"; に = nơi \"tồn tại\" hoặc \"điểm đến\".\n>としょかん 【で|に|へ|を】 本(ほん) を 読(よ)みます。=Tôi đọc sách ở thư viện.\n>電車(でんしゃ) 【で|に|を|と】 学校(がっこう) へ 行(い)きます。=Tôi đi học bằng tàu điện.\n@〜と|với (ai); và|N(người) と V ・ N1 と N2\nと: cùng làm với ai, hoặc liệt kê đầy đủ \"A và B\". Làm một mình: ひとりで (không dùng と).\n>友(とも)だち 【と|に|を|で】 えいが を 見(み)ます。=Tôi xem phim với bạn.\n>パン 【と|を|に|で】 たまご を 買(か)いました。=Tôi đã mua bánh mì và trứng.\n##8\n@〜ました・〜ませんでした|đã làm / đã không làm|V ました / V ませんでした\nQuá khứ của ます / ません. です → でした; じゃ ありません → じゃ ありませんでした.\n>きのう 10時(じ) に 【ねました|ねます|ねません|ねましょう】。=Hôm qua tôi ngủ lúc 10 giờ.\n>けさ は 何(なに)も 【食(た)べませんでした|食(た)べました|食(た)べます|食(た)べましょう】。=Sáng nay tôi đã không ăn gì cả.\n@〜から 〜まで|từ ~ đến ~|N1 から N2 まで\nDùng cho cả thời gian và nơi chốn. Có thể dùng riêng から hoặc まで.\n>ぎんこう は 9時(じ) 【から|まで|に|へ】 3時(じ) まで です。=Ngân hàng mở từ 9 giờ đến 3 giờ.\n>うち から えき 【まで|から|へも|では】 あるいて 10分(ぷん) です。=Từ nhà đến ga đi bộ mất 10 phút.\n##9\n@あります・います|có, ở (tồn tại)|N が あります (đồ vật, cây cối) ・ N が います (người, động vật)\nあります cho vật không tự chuyển động, います cho người và con vật. Cũng dùng với nghĩa \"có\" (sở hữu, sự kiện).\n!います có chữ い như \"inu\" (chó) → sinh vật sống.\n>へや に ねこ が 【います|あります|です|します】。=Trong phòng có con mèo.\n>あした テスト が 【あります|います|なります|です】。=Ngày mai có bài kiểm tra.\n@〜に 〜が あります|ở ~ có ~ / ~ thì ở ~|nơi に N が あります ・ N は nơi に あります\nに chỉ nơi tồn tại. Giới thiệu vật mới dùng が; nói về vật đã biết dùng は.\n>つくえ の 上(うえ) 【に|で|を|へ】 本(ほん) が あります。=Trên bàn có quyển sách.\n>田中(たなか)さん は 今(いま) どこ 【に|で|を|が】 います か。=Anh Tanaka bây giờ ở đâu?\n##10\n@Tính từ い|tính từ đuôi い|A-い です ・ A-く ないです ・ A-い + N\nPhủ định: bỏ い thêm く ないです (たかい → たかくないです). Ngoại lệ: いい → よくないです.\n!いい là kẻ nổi loạn: hễ biến đổi là quay về よ- (よくない, よかった).\n>この 本(ほん) は 【おもしろく|おもしろい|おもしろいじゃ|おもしろ】 ないです。=Quyển sách này không thú vị.\n>きょう は 天気(てんき) が 【よく|いく|いいく|よいく】 ないです。=Hôm nay thời tiết không đẹp.\n@Tính từ な|tính từ đuôi な|A-な です ・ A-な じゃ ありません ・ A-な + な + N\nChỉ thêm な khi đứng trước danh từ. Phủ định giống danh từ. Bẫy: きれい, ゆうめい, きらい tận cùng bằng い nhưng là tính từ な.\n>ここ は 【しずかな|しずかい|しずか|しずかの】 まち です。=Đây là một thị trấn yên tĩnh.\n>この へや は 【きれいじゃ|きれく|きれいく|きれいな】 ありません。=Căn phòng này không sạch.\n##11\n@Quá khứ của tính từ|đã (như thế nào)|A-い: 〜かったです / 〜くなかったです ・ A-な, N: でした / じゃ ありませんでした\nTính từ い tự chia quá khứ: bỏ い thêm かった. Không nói 「たかいでした」.\n!Lỗi kinh điển trong đề: おいしいでした ✗ → おいしかったです ✓.\n>きのう の パーティー は 【たのしかったです|たのしいでした|たのしでした|たのしくでした】。=Bữa tiệc hôm qua vui.\n>しけん は 【かんたんじゃ ありませんでした|かんたんくなかったです|かんたんじゃ なかったでした|かんたんく ありませんでした】。=Bài thi đã không dễ.\n@〜が すき・じょうず・わかります|thích / giỏi / hiểu ~|N が すき・きらい・じょうず・へた です ・ N が わかります\nĐối tượng của cảm xúc và năng lực dùng が, không dùng を.\n>わたし は 日本(にほん) の うた 【が|を|に|で】 すき です。=Tôi thích bài hát Nhật.\n>リンさん は かんじ が 【すこし わかります|すこし わかるです|あまり わかります|ぜんぜん わかります】。=Linh hiểu chữ Hán một chút.\n##12\n@〜ませんか・〜ましょう|rủ: ~ không? / cùng ~ nào|V ませんか ・ V ましょう\nませんか: mời lịch sự, tôn trọng ý người nghe. ましょう: hô hào cùng làm, hoặc đáp lại lời mời.\n>いっしょに ひるごはん を 【食(た)べませんか|食(た)べますか|食(た)べましたか|食(た)べませんでしたか】。=Cùng ăn trưa không?\n>A「えいが を 見(み)ませんか。」 B「いい です ね。【見(み)ましょう|見(み)ません|見(み)ました|見(み)て います】。」=A: Xem phim không? B: Hay đấy. Xem thôi.\n@〜ましょうか|để tôi ~ nhé?|V ましょうか\nĐề nghị làm giúp người khác. Đáp: ええ、おねがいします / いいえ、だいじょうぶです.\n>にもつ を 【もちましょうか|もちませんか|もちますか|もちましたか】。=Để tôi xách hành lý cho nhé?\n>A「まど を あけましょうか。」 B「ええ、【おねがいします|どういたしまして|しつれいします|いただきます】。」=A: Tôi mở cửa sổ nhé? B: Vâng, nhờ anh.\n##13\n@Thể て|cách chia thể て|Nhóm 1: い・ち・り → って; み・び・に → んで; き → いて; ぎ → いで; し → して ・ Nhóm 2: bỏ ます + て ・ Nhóm 3: して, きて\nThể て là nền của rất nhiều mẫu câu. Ngoại lệ duy nhất: 行きます → 行って.\n!Đọc theo nhịp: \"い ち り – って; み び に – んで; き – いて; ぎ – いで; し – して\".\n>「のみます」 の て形(けい) は 「【のんで|のみて|のって|のいで】」 です。=Thể て của のみます là のんで.\n>「行(い)きます」 の て形(けい) は 「【行(い)って|行(い)いて|行(い)きて|行(い)んで】」 です。=Thể て của 行きます là 行って.\n@〜て ください|hãy ~ (yêu cầu lịch sự)|V て ください\nNhờ vả, hướng dẫn hoặc mời ai làm gì.\n>すみません、もう いちど 【言(い)って|言(い)いて|言(い)て|言(い)んで】 ください。=Xin lỗi, hãy nói lại lần nữa.\n>ここ に 名前(なまえ) を 【書(か)いて|書(か)って|書(か)きて|書(か)んで】 ください。=Hãy viết tên vào đây.\n##14\n@〜て います|đang ~; trạng thái|V て います\n(1) Hành động đang diễn ra. (2) Trạng thái kéo dài: けっこんして います (đã kết hôn), すんで います (đang sống), しって います (biết).\n!Phủ định của しって います là しりません, không nói しって いません.\n>今(いま)、雨(あめ) が 【ふって います|ふります|ふって あります|ふりました】。=Bây giờ trời đang mưa.\n>あね は とうきょう に 【すんで います|すみます|すんで あります|すみて います】。=Chị tôi đang sống ở Tokyo.\n@〜ても いいです|được phép ~|V ても いいです(か)\nCho phép hoặc xin phép.\n>ここ で しゃしん を 【とっても|とっては|とるも|とりても】 いいです か。=Tôi chụp ảnh ở đây được không?\n>この ペン を 【つかっても|つかいても|つかうても|つかんでも】 いいです よ。=Bạn dùng cây bút này cũng được đấy.\n##15\n@〜ては いけません|không được ~ (cấm)|V ては いけません\nCấm đoán mạnh, hay dùng cho nội quy. Trả lời câu xin phép: いいえ、いけません.\n>ここ で たばこ を 【すっては|すっても|すうては|すいては】 いけません。=Không được hút thuốc ở đây.\n>としょかん で 大(おお)きい こえ で 【話(はな)しては|話(はな)しても|話(はな)すは|話(はな)しでは】 いけません。=Không được nói to trong thư viện.\n@〜てから|sau khi ~ rồi mới|V1 てから、V2\nNhấn mạnh thứ tự: xong V1 mới làm V2.\n>手(て) を 【あらってから|あらうから|あらったから|あらいてから】、ごはん を 食(た)べます。=Rửa tay xong rồi mới ăn cơm.\n>しゅくだい を して 【から|まで|ので|あと】 テレビ を 見(み)ます。=Làm bài tập xong tôi mới xem tivi.\n##16\n@〜て、〜|nối câu: rồi; và|V1 て、V2 ・ A-い → くて ・ A-な, N → で\nNối hành động theo thứ tự, hoặc nối các tính từ. Thì của cả câu do vế cuối quyết định. いい → よくて.\n!Tính từ い: bỏ い + くて. Tính từ な và danh từ: + で.\n>あさ おきて、かお を 【あらって|あらう|あらった|あらいて】、ごはん を 食(た)べました。=Sáng dậy, rửa mặt rồi ăn cơm.\n>この へや は 【ひろくて|ひろいで|ひろくで|ひろいて】 あかるい です。=Phòng này rộng và sáng.\n>田中(たなか)さん は 【しんせつで|しんせつくて|しんせつて|しんせつだて】、おもしろい 人(ひと) です。=Anh Tanaka tốt bụng và thú vị.\n##17\n@Thể ない|cách chia thể phủ định ngắn|Nhóm 1: hàng い → hàng あ + ない (かきます → かかない) ・ Nhóm 2: bỏ ます + ない ・ します → しない, きます → こない\nDạng phủ định thân mật. Đặc biệt: あります → ない.\n!Động từ tận cùng 〜います thành 〜わない, không phải 〜あない: かいます → かわない.\n>「かいます」 の ない形(けい) は 「【かわない|かあない|かいない|かない】」 です。=Thể ない của かいます là かわない.\n>「来(き)ます」 の ない形(けい) は 「【こない|きない|くない|こらない】」 です。=Thể ない của 来ます là こない.\n@〜ないで ください|xin đừng ~|V ないで ください\nYêu cầu người khác không làm gì.\n>ここ に 車(くるま) を 【とめないで|とめなくて|とめないて|とめないに】 ください。=Xin đừng đỗ xe ở đây.\n>しけん ですから、じしょ を 【見(み)ないで|見(み)なくて|見(み)らないで|見(み)ないに】 ください。=Vì là bài thi nên đừng xem từ điển.\n##18\n@〜なければ なりません|phải ~|V ない → V なければ なりません\nNghĩa vụ, bắt buộc. Khi nói thường rút gọn: 〜なきゃ / 〜ないと.\n!Hai lần phủ định thành khẳng định: \"nếu không làm thì không được\" → phải làm.\n>あした は 5時(じ) に 【おきなければ|おきないければ|おきなくても|おきなけば】 なりません。=Ngày mai tôi phải dậy lúc 5 giờ.\n>くすり を 【のまなければ|のみなければ|のまないければ|のむなければ】 なりません。=Phải uống thuốc.\n@〜なくても いいです|không cần ~ cũng được|V ない → V なくても いいです\nKhông bắt buộc phải làm.\n>あした は 休(やす)み ですから、はやく 【おきなくても|おきなければ|おきないでも|おきなくては】 いいです。=Mai là ngày nghỉ nên không cần dậy sớm.\n>くつ を 【ぬがなくても|ぬぎなくても|ぬがないても|ぬがなくでも】 いいです。=Không cần cởi giày cũng được.\n##19\n@〜ことが できます|có thể ~|V-từ điển + ことが できます ・ N が できます\nThể từ điển: nhóm 1 đổi hàng い → hàng う (かきます → かく); nhóm 2 bỏ ます + る; する, くる. Mẫu này nói về năng lực hoặc điều được phép.\n>わたし は かんじ を 【読(よ)む こと|読(よ)み こと|読(よ)んで こと|読(よ)むの こと】 が できます。=Tôi có thể đọc chữ Hán.\n>ここ で お金(かね) を かえる こと 【が|を|に|で】 できます か。=Ở đây có đổi tiền được không?\n@〜まえに|trước khi ~|V-từ điển + まえに ・ N の まえに ・ khoảng thời gian + まえに\nĐộng từ trước まえに luôn ở thể từ điển, dù cả câu là quá khứ.\n!Bẫy: ねた まえに ✗ → ねる まえに ✓.\n>【ねる|ねた|ねて|ねます】 まえに、は を みがきます。=Trước khi ngủ tôi đánh răng.\n>しょくじ 【の|に|で|を】 まえに、手(て) を あらいましょう。=Trước bữa ăn hãy rửa tay nào.\n##20\n@〜た ことが あります|đã từng ~|V た + ことが あります\nThể た chia giống hệt thể て (て → た, で → だ). Nói về kinh nghiệm, không dùng cho việc vừa mới xảy ra.\n>わたし は ふじさん に 【のぼった|のぼる|のぼって|のぼり】 こと が あります。=Tôi đã từng leo núi Phú Sĩ.\n>すし を 食(た)べた こと が 【ありません|いません|しません|なりません】。=Tôi chưa từng ăn sushi.\n@〜たり 〜たり します|lúc thì ~ lúc thì ~|V1 たり、V2 たり します\nLiệt kê vài hành động tiêu biểu, không theo thứ tự. Thì của câu chia ở します.\n>休(やす)み の 日(ひ) は 本(ほん) を 【読(よ)んだり|読(よ)んで|読(よ)むたり|読(よ)みたり】、えいが を 見(み)たり します。=Ngày nghỉ tôi lúc thì đọc sách, lúc thì xem phim.\n>きのう は かいもの を したり、りょうり を つくったり 【しました|します|でした|ありました】。=Hôm qua tôi nào là mua sắm, nào là nấu ăn.\n##21\n@〜た あとで|sau khi ~|V た + あとで ・ N の あとで\nNgược với まえに: động từ trước あとで luôn ở thể た.\n!まえに đi với thể từ điển, あとで đi với thể た. Học thành một cặp.\n>ごはん を 【食(た)べた|食(た)べる|食(た)べて|食(た)べ】 あとで、さんぽ します。=Sau khi ăn cơm tôi đi dạo.\n>しごと 【の|が|で|に】 あとで、のみ に 行(い)きませんか。=Sau giờ làm đi uống chút không?\n@Thể thông thường (普通形)|cách nói thân mật|です → だ ・ ます → thể từ điển ・ ません → ない ・ ました → た ・ ませんでした → なかった\nDùng với bạn bè, gia đình, và là \"nguyên liệu\" cho nhiều mẫu ngữ pháp (と おもいます, とき, んです…).\n>A「あした、ひま？」 B「うん、【ひまだよ|ひまいよ|ひまなよ|ひまくよ】。」=A: Mai rảnh không? B: Ừ, rảnh.\n>きのう は どこ へも 【行(い)かなかった|行(い)きなかった|行(い)かないだった|行(い)くなかった】。=Hôm qua tôi không đi đâu cả.\n##22\n@〜と おもいます|tôi nghĩ là ~|thể thông thường + と おもいます\nNêu ý kiến, phỏng đoán. Danh từ và tính từ な cần だ: しずかだ と おもいます.\n!Phủ định thường đặt ở vế trước: こない と おもいます (tôi nghĩ là không đến).\n>あした は 雨(あめ) が 【ふる|ふります|ふって|ふり】 と おもいます。=Tôi nghĩ ngày mai trời sẽ mưa.\n>あの 人(ひと) は 学生(がくせい) 【だ|な|の|で】 と おもいます。=Tôi nghĩ người kia là học sinh.\n@〜と いいました|(ai đó) đã nói là ~|「câu」 と いいました ・ thể thông thường + と いいました\nTrích lời trực tiếp (trong 「」) hoặc gián tiếp (thể thông thường).\n>先生(せんせい) は あした テスト が ある 【と|を|に|が】 言(い)いました。=Thầy giáo đã nói là mai có bài kiểm tra.\n>ねる まえに 「【おやすみなさい|おはよう ございます|いってきます|ただいま】」 と 言(い)います。=Trước khi ngủ nói \"Chúc ngủ ngon\".\n##23\n@〜でしょう|có lẽ ~; ~ đúng không?|thể thông thường + でしょう (N và A-な bỏ だ)\n(1) Phỏng đoán, hay gặp trong dự báo thời tiết. (2) Lên giọng cuối câu để xác nhận: \"đúng không?\".\n>あした は 【はれる|はれます|はれて|はれた】 でしょう。=Ngày mai có lẽ trời nắng.\n>この もんだい は 【かんたん|かんたんだ|かんたんな|かんたんの】 でしょう。=Câu hỏi này dễ mà, phải không?\n##24\n@〜たい です|muốn làm ~|V (bỏ ます) + たい です\nMong muốn của người nói, hoặc hỏi người nghe. たい chia như tính từ い: たくない, たかった.\n>わたし は 日本(にほん) で 【はたらきたい|はたらくたい|はたらいたい|はたらきてたい】 です。=Tôi muốn làm việc ở Nhật.\n>きょう は 何(なに)も 【食(た)べたく|食(た)べたい|食(た)べたいく|食(た)べたいじゃ】 ないです。=Hôm nay tôi không muốn ăn gì cả.\n@〜が ほしい です|muốn có ~|N が ほしい です\nMuốn có một vật. ほしい là tính từ い. Muốn làm việc gì thì dùng たい.\n!ほしい đi với danh từ, たい đi với động từ.\n>わたし は あたらしい パソコン 【が|を|に|で】 ほしい です。=Tôi muốn có máy tính mới.\n>たんじょうび に 何(なに) が 【ほしい|ほしな|ほしたい|ほしく】 です か。=Sinh nhật bạn muốn có gì?\n##25\n@〜に 行きます|đi để ~ (mục đích)|V (bỏ ます) / N + に + 行きます・来ます・帰ります\nNêu mục đích của việc di chuyển.\n>デパート へ くつ を 【買(か)い に|買(か)う に|買(か)って に|買(か)いて】 行(い)きます。=Tôi đi trung tâm thương mại để mua giày.\n>日本(にほん) へ 日本語(にほんご) の べんきょう 【に|を|で|へ】 来(き)ました。=Tôi đến Nhật để học tiếng Nhật.\n@〜より 〜の ほうが|so với ~ thì ~ hơn|A より B の ほうが + tính từ ・ A は B より + tính từ\nより = \"so với\". Hỏi: A と B と どちら が 〜ですか. Cả hai như nhau: どちらも.\n!より đứng sau \"kẻ thua cuộc\".\n>バス 【より|ほど|から|まで】 電車(でんしゃ) の ほうが はやい です。=Tàu điện nhanh hơn xe buýt.\n>コーヒー と こうちゃ と 【どちら|どれ|なに|どの】 が すき です か。=Cà phê và trà đen, bạn thích cái nào hơn?\n##26\n@〜で 〜が いちばん|trong ~ thì ~ nhất|N(phạm vi) で N が いちばん + tính từ\nSo sánh nhất. Hỏi trong từ ba thứ trở lên dùng なに / どれ / だれ / どこ / いつ, không dùng どちら.\n>一年(いちねん) 【で|に|を|と】 いつ が いちばん さむい です か。=Trong một năm khi nào lạnh nhất?\n>スポーツ で サッカー が 【いちばん|いちばんの|いちばんな|いちばんに】 すき です。=Trong các môn thể thao tôi thích bóng đá nhất.\n@〜く なります・〜に なります|trở nên ~|A-い → く なります ・ A-な, N + に なります\nDiễn tả sự thay đổi trạng thái.\n>だんだん 【さむく|さむい|さむいに|さむくに】 なりました。=Trời đã dần lạnh lên.\n>むすこ は 来月(らいげつ) 6さい 【に|く|で|を】 なります。=Con trai tôi tháng sau lên 6 tuổi.\n##27\n@〜から (lý do)|vì ~ nên|câu 1 + から、câu 2\nNêu lý do. から đứng SAU lý do, ngược với \"vì\" trong tiếng Việt. Hỏi: どうして.\n!から là cái đuôi của lý do. Đề thi hay đảo hai vế để bẫy.\n>じかん が ない 【から|まで|より|だけ】、タクシー で 行(い)きましょう。=Vì không có thời gian nên đi taxi thôi.\n>A「どうして きのう 休(やす)みました か。」 B「ねつ が あった 【から です|まで です|と です|より です】。」=A: Sao hôm qua bạn nghỉ? B: Vì tôi bị sốt.\n@〜が、〜|~ nhưng ~|câu 1 が、câu 2\nNối hai vế trái ngược. Thân mật hơn: けど. Cũng dùng để mở lời: すみませんが、…\n>この りょうり は おいしい です 【が|から|ので|と】、たかい です。=Món này ngon nhưng đắt.\n>すみません 【が|から|と|で】、えき は どこ です か。=Xin lỗi, nhà ga ở đâu ạ?\n##28\n@〜とき|khi ~|V-thường / A-い / A-な + な / N + の + とき\nとき là danh từ nên cách nối giống bổ nghĩa danh từ: ひまな とき, こどもの とき.\n>【ひまな|ひまの|ひまだ|ひまい】 とき、何(なに) を します か。=Khi rảnh bạn làm gì?\n>子(こ)ども 【の|な|だ|に】 とき、よく 川(かわ) で およぎました。=Hồi nhỏ tôi hay bơi ở sông.\n@〜ながら|vừa ~ vừa ~|V1 (bỏ ます) + ながら、V2\nHai hành động cùng lúc của cùng một người; V2 là hành động chính.\n>おんがく を 【聞(き)きながら|聞(き)くながら|聞(き)いてながら|聞(き)いたながら】 べんきょう します。=Tôi vừa nghe nhạc vừa học.\n>あるき 【ながら|とき|まえに|あとで】 スマホ を 見(み)ないで ください。=Đừng vừa đi vừa xem điện thoại.\n##29\n@あげます・もらいます|cho, tặng / nhận|A は B に N を あげます ・ B は A に(から) N を もらいます\nあげます: cho người khác. もらいます: nhận từ ai, người cho đi với に hoặc から.\n!Chủ ngữ của あげます là người cho; của もらいます là người nhận.\n>わたし は 母(はは) 【に|を|が|で】 花(はな) を あげました。=Tôi đã tặng hoa cho mẹ.\n>たんじょうび に 父(ちち) に とけい を 【もらいました|あげました|くれました|かしました】。=Sinh nhật tôi được bố tặng đồng hồ.\n@くれます|(ai đó) cho tôi|A は わたし に N を くれます\nNgười khác cho MÌNH (hoặc người nhà mình). Không dùng あげます khi người nhận là \"tôi\".\n>友(とも)だち が わたし に おみやげ を 【くれました|あげました|もらいました|かりました】。=Bạn đã cho tôi quà lưu niệm.\n>この じしょ は 先生(せんせい) 【が|に|を|へ】 くれました。=Quyển từ điển này là thầy cho tôi.\n##30\n@Mệnh đề bổ nghĩa danh từ|N mà ~|[câu ở thể thông thường] + N\nCả cụm đứng TRƯỚC danh từ, không cần từ nối. Chủ ngữ trong mệnh đề dùng が (hoặc の), không dùng は.\n!Tiếng Việt: \"quyển sách [tôi mua hôm qua]\". Tiếng Nhật: \"[hôm qua tôi mua] quyển sách\".\n>これ は きのう わたし 【が|は|を|に】 買(か)った 本(ほん) です。=Đây là quyển sách tôi mua hôm qua.\n>あそこ で 新聞(しんぶん) を 【読(よ)んで いる|読(よ)んで います|読(よ)みます|読(よ)んで いるの】 人(ひと) は 田中(たなか)さん です。=Người đang đọc báo ở kia là anh Tanaka.\n@〜のが すき・じょうず です|thích / giỏi việc ~|V-từ điển + の + が すき・じょうず・へた です\nの biến động từ thành danh từ (\"việc ~\").\n>わたし は りょうり を 【つくる の|つくり の|つくって の|つくります の】 が すき です。=Tôi thích nấu ăn.\n>あに は うた を うたう 【の が|の を|の に|の で】 じょうず です。=Anh trai tôi hát hay.\n##31\n@〜んです|giải thích; hỏi lý do|thể thông thường + んです (N và A-な + なんです)\nDùng khi giải thích hoàn cảnh, hoặc hỏi vì tò mò về điều mình thấy. Văn viết: のです.\n>A「どうした んです か。」 B「あたま が 【いたい|いたいな|いたいだ|いたく】 んです。」=A: Bạn sao thế? B: Tôi bị đau đầu.\n>あした は 【休(やす)みな|休(やす)みだ|休(やす)みの|休(やす)み】 んです。=(Là vì) ngày mai tôi nghỉ.\n@〜すぎます|quá ~|V (bỏ ます) / A-い (bỏ い) / A-な + すぎます\nVượt mức bình thường, thường mang nghĩa không tốt. いい → よすぎます.\n>きのう おさけ を 【のみすぎました|のむすぎました|のんですぎました|のみたすぎました】。=Hôm qua tôi đã uống quá nhiều rượu.\n>この くつ は 【大(おお)きすぎます|大(おお)きいすぎます|大(おお)きくすぎます|大(おお)きですぎます】。=Đôi giày này quá to.\n##32\n@〜やすい・〜にくい|dễ ~ / khó ~|V (bỏ ます) + やすい / にくい\nChia như tính từ い.\n>この ペン は とても 【書(か)きやすい|書(か)くやすい|書(か)いてやすい|書(か)きやさしい】 です。=Cây bút này rất dễ viết.\n>この くすり は にがくて 【のみにくい|のむにくい|のんでにくい|のみにくく】 です。=Thuốc này đắng nên khó uống.\n@〜かた|cách ~|V (bỏ ます) + かた\nBiến động từ thành danh từ chỉ cách làm. Tân ngữ đổi を → の: かんじ の 読みかた.\n>この かんじ の 【読(よ)みかた|読(よ)むかた|読(よ)んでかた|読(よ)みほう】 を おしえて ください。=Hãy chỉ tôi cách đọc chữ Hán này.\n>きっぷ 【の|を|が|に】 買(か)いかた が わかりません。=Tôi không biết cách mua vé.\n##33\n@〜つもり です|định ~|V-từ điển / V ない + つもり です\nDự định đã có từ trước.\n>来年(らいねん) 日本(にほん) へ 【行(い)く|行(い)き|行(い)って|行(い)こう】 つもり です。=Năm sau tôi định đi Nhật.\n>もう たばこ は 【すわない|すいません|すわなく|すうない】 つもり です。=Tôi định sẽ không hút thuốc nữa.\n@〜た ほうが いいです|nên ~ / không nên ~|V た + ほうが いいです ・ V ない + ほうが いいです\nLời khuyên. Khẳng định dùng thể た (dù không phải quá khứ); phủ định dùng thể ない.\n!Khuyên làm → た. Khuyên đừng → ない.\n>かぜ です か。はやく 【ねた|ねて|ねます|ねり】 ほうが いいです よ。=Bị cảm à? Nên ngủ sớm đi.\n>よる おそく 一人(ひとり) で 【あるかない|あるかなかった|あるきない|あるくない】 ほうが いいです。=Không nên đi bộ một mình vào đêm khuya.\n##34\n@もう・まだ|đã ~ rồi / vẫn chưa ~|もう V ました ・ まだ V て いません ・ まだ です\nHỏi \"đã… chưa?\": もう 〜ましたか. Trả lời chưa: いいえ、まだです / まだ 〜て いません.\n!\"Chưa ăn\" = まだ 食べて いません, không phải まだ 食べませんでした.\n>A「もう ひるごはん を 食(た)べました か。」 B「いいえ、【まだ です|もう です|まだ でした|もう ないです】。」=A: Bạn ăn trưa chưa? B: Chưa.\n>しゅくだい は まだ 【おわって いません|おわりませんでした|おわりました|おわって いました】。=Bài tập vẫn chưa xong.\n@〜だけ・〜しか 〜ない|chỉ ~|N だけ + khẳng định ・ N しか + phủ định\nCả hai đều là \"chỉ\", nhưng しか bắt buộc đi với phủ định và mang sắc thái \"ít quá\".\n!Thấy しか là tìm ngay ない / ません ở cuối câu.\n>さいふ に 100円(えん) 【しか|だけ|も|まで】 ありません。=Trong ví chỉ có 100 yên.\n>やすみ は 日曜日(にちようび) 【だけ|しか|ほど|より】 です。=Ngày nghỉ chỉ có Chủ nhật.\n##35\n@〜や 〜など|nào là ~, ~ vân vân|N1 や N2 (など)\nLiệt kê vài ví dụ tiêu biểu, ngụ ý còn nữa. Khác với と là liệt kê đầy đủ.\n>つくえ の 上(うえ) に 本(ほん) 【や|を|も|か】 ノート など が あります。=Trên bàn có sách, vở, vân vân.\n>スーパー で やさい や くだもの 【など|だけ|しか|ずつ】 を 買(か)いました。=Tôi đã mua rau, hoa quả… ở siêu thị.\n@Trợ từ đếm (助数詞)|đếm đồ vật, người|số + つ / 人(にん) / まい / 本(ほん) / さつ / 台(だい) / ひき / かい\nSố lượng đứng ngay trước động từ, không cần trợ từ: りんご を 3つ 買います. Vật mỏng: まい; vật dài: 本; sách: さつ; máy móc, xe: 台; con vật nhỏ: ひき.\n!本 biến âm: 1 いっぽん, 3 さんぼん, 6 ろっぽん, 8 はっぽん.\n>きって を 5 【まい|ほん|さつ|だい】 ください。=Cho tôi 5 con tem.\n>えんぴつ が 3 【ぼん|ほん|ぽん|まい】 あります。=Có 3 cây bút chì.\n##36\n@Từ để hỏi + か / も|~ đó (không xác định) / không ~ nào cả|なにか・だれか・どこか ・ なにも・だれも・どこへも + phủ định\nTừ hỏi + か: \"cái gì đó, ai đó\". Từ hỏi + も + phủ định: \"không gì cả, không ai cả\".\n>のど が かわきました。【何(なに)か|何(なに)も|何(なに)が|何(なに)で】 のみたい です。=Tôi khát. Muốn uống gì đó.\n>きょうしつ に だれ 【も|か|が|は】 いません。=Trong lớp không có ai cả.\n@〜ごろ・〜ぐらい|khoảng (thời điểm) / khoảng (lượng)|thời điểm + ごろ ・ số lượng + ぐらい(くらい)\nごろ cho mốc thời gian (khoảng 7 giờ). ぐらい cho độ dài, số lượng (khoảng 7 tiếng). Hỏi: どのくらい.\n!ごろ = \"vào khoảng lúc\"; ぐらい = \"khoảng chừng ấy\".\n>毎朝(まいあさ) 7時(じ) 【ごろ|ずつ|など|しか】 おきます。=Mỗi sáng tôi dậy khoảng 7 giờ.\n>うち から 学校(がっこう) まで 30分(ぷん) 【ぐらい|ごろ|まで|に】 かかります。=Từ nhà đến trường mất khoảng 30 phút.\n##37\n@あまり・ぜんぜん 〜ない|không ~ lắm / hoàn toàn không|あまり / ぜんぜん + phủ định\nThang mức độ: とても > すこし > あまり 〜ない > ぜんぜん 〜ない. よく và たくさん đi với khẳng định.\n>この えいが は あまり 【おもしろくないです|おもしろいです|おもしろかったです|おもしろいでした】。=Bộ phim này không hay lắm.\n>お金(かね) が 【ぜんぜん|とても|よく|たくさん】 ありません。=Tôi hoàn toàn không có tiền.\n@〜ね・〜よ|~ nhỉ / ~ đấy|câu + ね ・ câu + よ\nね: tìm sự đồng tình, xác nhận. よ: báo cho người nghe điều họ chưa biết.\n>A「きょう は あつい です ね。」 B「ええ、ほんとうに あつい です 【ね|か|の|と】。」=A: Hôm nay nóng nhỉ. B: Ừ, nóng thật nhỉ.\n>あ、あぶない です 【よ|か|と|も】。車(くるま) が 来(き)ます。=A, nguy hiểm đấy! Xe đang tới.\n##38\n@〜に します|chọn ~; quyết định ~|N に します\nDùng khi gọi món, chọn đồ, quyết định.\n>A「のみもの は 何(なに) に します か。」 B「わたし は コーヒー 【に|を|が|で】 します。」=A: Đồ uống bạn chọn gì? B: Tôi chọn cà phê.\n>プレゼント は この とけい に 【します|あります|います|きます】。=Quà thì tôi chọn cái đồng hồ này.\n@Tính từ → trạng từ|làm gì một cách ~|A-い → A-く + V ・ A-な → A-に + V\nはやい → はやく, きれい → きれいに, しずか → しずかに. いい → よく.\n>じ を もっと 【大(おお)きく|大(おお)きい|大(おお)きに|大(おお)きいに】 書(か)いて ください。=Hãy viết chữ to hơn nữa.\n>としょかん では 【しずかに|しずかく|しずかな|しずかだ】 して ください。=Trong thư viện hãy giữ yên lặng.\n##39\n@は và が|phân biệt は / が|は: chủ đề đã biết, so sánh ・ が: thông tin mới, từ để hỏi làm chủ ngữ, chủ ngữ trong mệnh đề phụ\nTừ hỏi làm chủ ngữ luôn dùng が (だれが, どれが) và câu trả lời cũng dùng が. Mẫu \"A は B が + tính từ\": ぞう は はな が ながい.\n!Thông tin quan trọng nằm SAU は và TRƯỚC が.\n>A「だれ 【が|は|を|に】 来(き)ました か。」 B「田中(たなか)さん が 来(き)ました。」=A: Ai đã đến? B: Anh Tanaka đã đến.\n>日本(にほん) は 山(やま) 【が|を|に|で】 多(おお)い です。=Nhật Bản có nhiều núi.\n@に và で (nơi chốn)|phân biệt に / で|に + います・あります・すみます・入ります・のります ・ で + hành động\nに: nơi tồn tại hoặc điểm đến. で: nơi diễn ra hoạt động. Sự kiện (パーティー, しけん) \"có\" ở đâu thì dùng で.\n!Đứng yên hoặc đi tới → に. Hoạt động → で.\n>わたし は ハノイ 【に|で|を|と】 すんで います。=Tôi đang sống ở Hà Nội.\n>えき で 電車(でんしゃ) 【に|を|で|へ】 のります。=Tôi lên tàu điện ở ga.\n##40\n@〜を ください|cho tôi ~|N を (số lượng) ください ・ N (を) おねがいします\nDùng khi mua hàng, gọi món. おねがいします lịch sự hơn.\n>すみません、この りんご を 【3つ|3まい|3ぼん|3だい】 ください。=Xin lỗi, cho tôi 3 quả táo này.\n>コーヒー を ふたつ 【おねがいします|いただきます|ごちそうさま|どういたしまして】。=Cho tôi hai cà phê.\n@どうして 〜か|tại sao ~|どうして / なぜ 〜か → 〜から です\nHỏi lý do. どうして phổ biến khi nói, なぜ trang trọng hơn. Trả lời bằng 〜からです.\n>【どうして|どうやって|どのくらい|どんな】 日本語(にほんご) を べんきょう して います か。=Tại sao bạn học tiếng Nhật?\n>A「どうして おくれました か。」 B「バス が 来(こ)なかった 【から です|こと です|まで です|とき です】。」=A: Sao bạn đến muộn? B: Vì xe buýt không đến.\n##16\n@〜は どうですか|~ thì thế nào? (hỏi ý kiến, mời)|N は どうですか ・ N は いかがですか\nHỏi cảm nhận về một việc, hoặc mời, gợi ý. いかがですか lịch sự hơn, hay dùng khi mời khách.\n>日本(にほん) の せいかつ は 【どう|なん|どれ|どこ】 です か。=Cuộc sống ở Nhật thế nào?\n>おちゃ は 【いかが|いくら|いくつ|どなた】 です か。=Anh dùng trà nhé?\n##23\n@A か B|A hoặc B|N1 か N2\nか đặt giữa hai danh từ nghĩa là \"hoặc\". Khác với か ở cuối câu (câu hỏi).\n>土曜日(どようび) 【か|は|を|へ】 日曜日(にちようび) に 行(い)きます。=Tôi sẽ đi vào thứ Bảy hoặc Chủ nhật.\n>バス 【か|が|を|へ】 電車(でんしゃ) で 行(い)きましょう。=Đi bằng xe buýt hoặc tàu điện nhé.\n##41\n@〜ので|vì ~ nên (khách quan, lịch sự)|thể thông thường + ので (N và A-な + な + ので)\nGiống から nhưng mềm và khách quan hơn, hợp khi xin phép, xin lỗi. Danh từ và tính từ な phải thêm な: びょうきな ので.\n!から thẳng thắn, ので nhẹ nhàng. Trước ので không dùng だ mà dùng な.\n>あたま が いたい 【ので|より|まで|だけ】、はやく かえります。=Vì đau đầu nên tôi về sớm.\n>きょう は 休(やす)み 【な ので|だ ので|の ので|ので】、うち に います。=Vì hôm nay là ngày nghỉ nên tôi ở nhà.\n@〜ずつ|mỗi ~; từng ~|số lượng + ずつ\nChia đều cho mỗi người hoặc mỗi lần, hoặc \"từng chút một\": すこしずつ.\n>この くすり は 毎日(まいにち) 2こ 【ずつ|ごろ|しか|など】 のんで ください。=Thuốc này mỗi ngày uống 2 viên.\n>日本語(にほんご) が すこし 【ずつ|ごろ|より|まで】 じょうず に なりました。=Tiếng Nhật của tôi giỏi lên từng chút một.\n@〜中 (ちゅう・じゅう)|đang ~; suốt ~, khắp ~|N + ちゅう (đang trong lúc) ・ N + じゅう (suốt, khắp)\nちゅう: đang làm gì (しごとちゅう, でんわちゅう). じゅう: toàn bộ khoảng thời gian hay nơi chốn (いちにちじゅう, せかいじゅう).\n!Mang nghĩa \"suốt cả, khắp cả\" thì đọc じゅう.\n>父(ちち) は 今(いま) しごと 【ちゅう|じゅう|なか|うち】 です。=Bố tôi đang làm việc.\n>きのう は 一日(いちにち) 【じゅう|ちゅう|ごろ|ずつ】 雨(あめ) でした。=Hôm qua mưa suốt cả ngày.\n##42\n@N でも|~ hay gì đó (gợi ý nhẹ)|N でも + lời mời, rủ\nĐưa ra một ví dụ khi mời, rủ, không bó buộc vào đúng thứ đó: おちゃ でも のみませんか.\n>つかれました ね。コーヒー 【でも|だけ|しか|まで】 のみませんか。=Mệt nhỉ. Uống cà phê hay gì đó không?\n>ひま です ね。えいが 【でも|より|ごろ|ずつ】 見(み) に 行(い)きましょう か。=Rảnh nhỉ. Đi xem phim hay gì đó nhé?\n@〜けど|~ nhưng (thân mật)|câu 1 + けど、câu 2\nNghĩa như が nhưng dùng khi nói chuyện thường ngày. Trang trọng hơn một chút: けれども.\n>この みせ は やすい 【けど|から|ので|より】、あまり おいしくない。=Quán này rẻ nhưng không ngon lắm.\n>行(い)きたい 【けど|ので|と|から】、じかん が ない。=Muốn đi nhưng không có thời gian.\n@〜と いう N|N tên là ~|tên gọi + と いう + N\nGiới thiệu tên của người, vật, nơi mà người nghe có thể chưa biết.\n>これ は 「さくら」 【と いう|を いう|に いう|が いう】 花(はな) です。=Đây là loài hoa tên là \"sakura\".\n>きのう 山田(やまだ)さん 【と いう|と いい|と いって|と いうの】 人(ひと) が 来(き)ました。=Hôm qua có một người tên là Yamada đến.\n", "r5": "##\nわたし は リン です。ベトナム人(じん) です。日本語(にほんご) 学校(がっこう) の 学生(がくせい) です。田中(たなか)さん は わたし の 先生(せんせい) です。田中(たなか)さん は 日本人(にほんじん) です。\n?リンさん は 何(なん) です か。|学生(がくせい)|先生(せんせい)|日本人(にほんじん)|かいしゃいん\n?田中(たなか)さん は だれ です か。|リンさん の 先生(せんせい)|リンさん の 学生(がくせい)|ベトナム人(じん) の 学生(がくせい)|リンさん の 友(とも)だち\n##\nわたし は 毎朝(まいあさ) 6時(じ) に おきます。7時(じ) に 電車(でんしゃ) で かいしゃ へ 行(い)きます。かいしゃ は 9時(じ) から 5時(じ) まで です。きのう は 日曜日(にちようび) でした。友(とも)だち と えいが を 見(み)ました。\n?この 人(ひと) は 何(なに) で かいしゃ へ 行(い)きます か。|電車(でんしゃ)|バス|車(くるま)|じてんしゃ\n?きのう 何(なに) を しました か。|えいが を 見(み)ました|かいしゃ へ 行(い)きました|6時(じ) に おきました|友(とも)だち の うち へ 行(い)きました\n##\n【としょかん の ルール】 本(ほん) は 2しゅうかん かりても いいです。としょかん の 中(なか) で 食(た)べては いけません。水(みず) は のんでも いいです。大(おお)きい こえ で 話(はな)さないで ください。\n?としょかん で しても いい こと は どれ です か。|水(みず) を のむ|パン を 食(た)べる|大(おお)きい こえ で 話(はな)す|本(ほん) を 3しゅうかん かりる\n?本(ほん) は どのくらい かりる こと が できます か。|2しゅうかん|2日(ふつか)|1しゅうかん|3しゅうかん\n##\nわたし の しゅみ は りょこう です。日本(にほん) で いろいろな ところ へ 行(い)った こと が あります。きょねん は きょうと へ 行(い)って、おてら を 見(み)たり、しゃしん を とったり しました。ほっかいどう へ は まだ 行(い)った こと が ありません から、来年(らいねん) 行(い)きたい です。\n?この 人(ひと) は 来年(らいねん) 何(なに) を したい です か。|ほっかいどう へ 行(い)く|きょうと へ 行(い)く|おてら を 見(み)る|しゃしん を ならう\n?きょねん、この 人(ひと) は 何(なに) を しました か。|きょうと で しゃしん を とりました|ほっかいどう へ 行(い)きました|おてら で はたらきました|どこ へも 行(い)きませんでした\n##\nわたし の へや は えき から ちかい です が、せまい です。友(とも)だち の へや は えき から とおい です が、ひろくて あかるい です。わたし は 友(とも)だち の へや の ほうが すき です。でも、あさ はやく おきたくない から、ひっこしません。\n?どうして ひっこしません か。|あさ はやく おきたくない から|今(いま) の へや が ひろい から|えき から とおい へや が すき だ から|友(とも)だち の へや が せまい から\n?友(とも)だち の へや は どんな へや です か。|えき から とおい が、ひろい へや|えき から ちかくて、ひろい へや|え const DK='かがきぎくぐけげこごさざしじすずせぜそぞただちぢつづてでとどはばひびふぶへべほぼ';

  const o=new Set(),end=r.endsWith('ます')?r.length-2:r.length;
  for(let i=0;i<end;i++){const c=r[i],A=r.slice(0,i),B=r.slice(i+1);
    if(c==='う'&&i>0) o.add(A+B);
    if('おこそとのほもよろごぞどぼょゅくすつふゆるぐず'.includes(c)&&r[i+1]!=='う') o.add(A+c+'う'+B);
    if(c==='っ') o.add(A+B);
    if(i>0&&'かきくけこさしすせそたちつてとぱぴぷぺぽ'.includes(c)&&r[i-1]!=='っ'&&r[i-1]!=='ん') o.add(A+'っ'+c+B);
    const k=DK.indexOf(c); if(k>=0) o.add(A+DK[k^1]+B);
    if(c==='ょ') o.add(A+'ゅ'+B); if(c==='ゅ') o.add(A+'ょ'+B);
  }
  o.delete(r); return shuf([...o]);
}

}
function qListen(L,exam){

  q.audio=[{t:k.q.q,v:'n'},...k.lines.map(l=>({t:l.jp,v:VOI[l.s]})),{t:k.q.q,v:'n'}];
  q.exp=`<span class="jp">${ruby(k.q.q)}</span><br>`+k.lines.map(l=>`${l.s}：<span class="jp">${ruby(l.jp)}</span><br><small>${esc(l.vi)}</small>`).join('<br>');
  return q;
}
function qSpoken(x,kind){

  q.hide=true;q.audio=[{t:x.q,v:'f'}];q.opts.forEach((o,i)=>q.audio.push({t:String(i+1),v:'n'},{t:o,v:'m'}));
  q.exp=`<span class="jp">${ruby(x.q)}</span><br>→ <span class="jp">${ruby(x.opts[0])}</span>`;

}
function qDict(s){
  return {kind:'dict',tag:'Nghe chép chính tả',html:'Nghe rồi chép lại cả câu. Gõ bằng bàn phím tiếng Nhật (kana hoặc kanji đều được), hoặc bấm các ô chữ theo đúng thứ tự.',
    audio:[{t:s.raw,v:'n'}],raw:s.raw,vi:s.vi,bank:shuf(chunks(s.raw).map(c=>c.replace(/[。、？！…「」]/g,'')).filter(Boolean)),key:null};
}
const norm=s=>s.replace(/[\s　。、．，,.!?！？「」…]/g,'').replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-96));
function lev(a,b){const d=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return d[b.length]}
const KMAP={};
SENT.forEach(s=>s.raw.replace(/([一-龯々]+)\(([ぁ-ゖ]+)\)/g,(m,k,r)=>{KMAP[k]=KMAP[k]||r}));
Object.values(W).forEach(w=>{if(!w.r||!/[一-龯]/.test(w.w))return;const v=w.w.endsWith('ます')&&w.r.endsWith('ます'),k=v?w.w.slice(0,-2):w.w;KMAP[k]=KMAP[k]||(v?w.r.slice(0,-2):w.r)});
const KKEYS=Object.keys(KMAP).sort((x,y)=>y.length-x.length);
const toKana=s=>{KKEYS.forEach(k=>{if(s.includes(k))s=s.split(k).join(KMAP[k])});return s};
function dictOk(q,v){
  if(!norm(v))return false;const sim=(x,t)=>{x=norm(x);t=norm(t);return 1-lev(x,t)/Math.max(x.length,t.length)};
  return Math.max(sim(v,strip(q.raw)),sim(v,kana(q.raw)),sim(toKana(v),kana(q.raw)))>=.88;
}
function qCloze(L){
  const k=KW[L]; if(!k) return null; const parts=[];
  k.lines.forEach((l,li)=>{parts.push((li?'\n':'')+l.s+'：');chunks(l.jp).forEach(c=>{const m=c.match(/^(「*)(.*?)([。、？！」…]*)$/);parts.push({pre:m[1],core:m[2],post:m[3]})})});
  const idx=shuf(parts.map((p,i)=>typeof p==='object'&&p.core?i:-1).filter(i=>i>=0)).slice(0,5),sol=[],out=[];
  parts.forEach((p,i)=>{if(typeof p==='string')out.push(p);else if(idx.includes(i)){out.push(p.pre,{b:sol.length},p.post);sol.push(p.core)}else out.push(p.pre+p.core+p.post)});
  const extra=shuf(Object.keys(KW).filter(x=>+x!==+L)).slice(0,3).map(x=>{const cs=chunks(KW[x].lines[1].jp);return cs[rnd(cs.length)].replace(/[「」。、？！…]/g,'')}).filter(c=>c&&!sol.includes(c)).slice(0,2);
  return {kind:'cloze',tag:'Đục lỗ hội thoại',html:'Bấm các ô chữ để điền lần lượt vào chỗ trống. Bấm vào ô đã điền để gỡ ra.',parts:out,sol,bank:shuf(sol.concat(extra)),
    exp:k.lines.map(l=>`${l.s}：<span class="jp">${ruby(l.jp)}</span>`).join('<br>'),key:null};
}
const fK=k=>({kind:'flash',tag:'Thẻ kanji',front:`<div class="jp huge">${k.c}</div>`,back:`<p><b class="hv">${k.hv}</b> ${esc(k.m)}</p><p class="jp">On: ${k.on||'—'} · Kun: ${k.kun.replace(/\./g,'·')||'—'}</p>${k.tip?`<p class="tip">${esc(k.tip)}</p>`:''}<p class="jp">${k.words.map(w=>`${wordHtml(w)} <small>${esc(w.m)}</small>`).join('　')}</p>`,key:k.key});
const fW=w=>({kind:'flash',tag:'Thẻ từ vựng',front:`<div class="jp qs">${esc(w.w)}</div>`,back:`<p class="jp qs">${w.r||w.w}</p><p>${esc(w.m)}</p>`,key:w.key,say:w.r||w.w});

function lessonBefore(n){while(n>=1&&D(n).type!=='lesson')n--;return n}
function reviewQs(n,cnt){
  const days=uniq([1,2,4,7,14,30].map(o=>lessonBefore(n-o)).filter(x=>x>=1));
  const wr=shuf(Object.keys(P().wrong)).slice(0,4).map(qFromKey).filter(Boolean);
  return wr.concat(balanced(merge(days),cnt-wr.length));
}
const spokenAll=()=>EX.HP.map(x=>qSpoken(x,'h')).concat(EX.OP.map(x=>qSpoken(x,'o')));
const fresh=e=>{const q=qGram(e,'c');if(q)q.tag='Ngữ pháp · câu mới';return q};
function extras(Ls,nd,nl,ns){
  return [...shuf(SENT.filter(s=>Ls.includes(s.L))).slice(0,nd).map(qDict),...shuf(Ls.filter(L=>KW[L])).slice(0,nl).map(L=>qListen(L)),...shuf(spokenAll()).slice(0,ns)];
}
function buildSec(n,sec){
  const d=D(n),it=items(n),L=d.L+1;let qs=[];
  if(sec==='k'){it.k.forEach(k=>{qs.push(qKanji(k,0),qKanji(k,1));k.words.forEach(w=>qs.push(qWord(w,'r')))});qs=shuf(qs)}
  else if(sec==='v') qs=shuf(d.vocab).map(w=>qWord(w));
  else if(sec==='g') it.g.forEach(e=>{qs.push(qGram(e,'c'));const s=qGram(e,'s');if(s&&s.star)qs.push(s)});
  else if(sec==='r') qs=reviewQs(n,10);
  else if(sec==='c') qs=[qListen(L),...shuf(SENT.filter(s=>s.L===L)).slice(0,3).map(qDict),qCloze(L)];
  else if(sec==='d') qs=qRead(d.read);
  else if(d.type==='lesson') qs=balanced(it,10).concat(d.fx.map(fresh),shuf(SENT.filter(s=>s.L===L)).slice(0,1).map(qDict));
  else if(d.type==='review'){
    const days=[];for(let i=n-6;i<n;i++)days.push(i);const Ls=days.map(x=>D(x).L+1),w=d.wi;
    qs=balanced(merge(days),16).concat(reviewQs(n-6,4),shuf(Ls.flatMap(x=>FX[x]||[])).slice(0,4).map(fresh),w>=3?shuf(EX.BP).slice(0,2).map(qBank):[],
      R5[w]?qRead(R5[w]):[],RW[w]?qRead(RW[w]):[],EX.WL.slice(w*2,w*2+2).map(qListenX),extras(Ls,2,0,w>=3?2:0));
  }
  else{const all=lessonDays(49),Ls=all.map(x=>D(x).L+1);
    qs=balanced(merge(shuf(all).slice(0,20)),16).concat(shuf(Ls.flatMap(x=>FX[x]||[])).slice(0,6).map(fresh),shuf(EX.BP).slice(0,4).map(qBank),
      shuf(Object.values(RD)).slice(0,1).flatMap(qRead),shuf(EX.WL).slice(0,2).map(qListenX),extras(Ls,2,2,3))}
  return qs.filter(Boolean);
}

function buildExam(no){
  let s=no>0?no*7919+13:Date.now()%1e6;const old=RNG;RNG=()=>(s=(s*1103515245+12345)&0x7fffffff)/0x7fffffff;
  const pt=(a,n)=>no>0?a.filter((_,i)=>i%3===no-1).concat(a.filter((_,i)=>i%3!==no-1)).slice(0,n):shuf(a).slice(0,n);
  const tg=(qs,t)=>qs.filter(Boolean).map(q=>(q.tag=t,q));
  const ix=no>0?no-1:rnd(3),X=EX.X,L=EX.L;
  const p1=[...tg(pt(X.slice(0,21),7).map(x=>qX(x,'r')),'もんだい1 · Cách đọc kanji'),...tg(pt(X.slice(21),5).map(x=>qX(x,'o')),'もんだい2 · Chọn chữ viết đúng'),
    ...tg(pt(EX.B,6).map(qBank),'もんだい3 · Điền từ theo ngữ cảnh'),...tg(pt(EX.P,3).map(qPara),'もんだい4 · Câu đồng nghĩa')];
  const p2=[...tg(pt(EX.G,9).map(qG),'もんだい1 · Ngữ pháp'),...tg(pt(EX.T,4).map(qStar),'もんだい2 · Sắp xếp câu'),
    ...tg(qPass(EX.C[ix]),'もんだい3 · Ngữ pháp trong đoạn văn'),...tg(pt(EX.S,2).flatMap(qRead),'もんだい4 · Đọc đoạn ngắn'),
    ...tg(qRead(EX.M[ix]),'もんだい5 · Đọc đoạn vừa'),...tg(qRead(EX.I[ix]),'もんだい6 · Tìm thông tin')];
  const p3=[...tg(pt(L.slice(0,21),7).map(qListenX),'もんだい1 · Nghe hiểu nhiệm vụ'),...tg(pt(L.slice(21),6).map(qListenX),'もんだい2 · Nghe hiểu điểm chính'),
    ...tg(pt(EX.H,5).map(x=>qSpoken(x,'h')),'もんだい3 · Chọn câu nói phù hợp'),...tg(pt(EX.O,6).map(x=>qSpoken(x,'o')),'もんだい4 · Đáp lời nhanh')];

/* ================= Làm bài ================= */
let QZ=null;
const clock=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
function stopAudio(){try{speechSynthesis.cancel()}catch(e){}}
function startQuiz(title,qs,opt={}){

const isOnce=(z,q)=>!!(z.opt.exam||q.once);
function playQ(){

  if(once&&z.plays[z.i]&&!z.shown){toast('Câu này chỉ được nghe một lần.');return}
  z.plays[z.i]=(z.plays[z.i]||0)+1;speak(q.audio,once?1:0);if(once&&!z.shown)drawQ();

function drawQ(auto){

    <div class="chipsb">${q.bank.map((c,i)=>`<button class="chip jp" data-act="czadd" data-i="${i}" ${show||st.u.includes(i)?'disabled':''}>${ruby(c)}</button>`).join('')}</div>
    ${show?'':'<div class="row"><button class="btn" data-act="czcheck">Kiểm tra</button></div>'}`}

  if(show){const ok=z.res[z.i];
    const more=k==='dict'?`<p>Đáp án: <span class="jp">${ruby(q.raw)}</span><br>${esc(q.vi)}</p>`:k==='cloze'?`<p>Đáp án: <span class="jp">${q.sol.map(ruby).join(' ／ ')}</span></p>`:q.exp?`<p>${q.exp}</p>`:'';
    fb=`<div class="fb ${ok?'good':'bad'}"><b>${ok?'◯ Đúng':'✕ Chưa đúng'}</b>${more}</div><button class="btn wide" data-act="qnext">${z.i+1<z.qs.length?'Câu tiếp theo':'Xem kết quả'}</button>`}
  $('#quiz').innerHTML=`<div class="qwrap"><header class="qhead"><button class="x" data-act="qclose" aria-label="Thoát">×</button><b>${esc(z.title)}</b><span>${z.opt.limit?`<span id="qtime">${clock(z.left)}</span> · `:''}${z.i+1}/${z.qs.length}</span></header>
  <div class="qbar"><i style="width:${z.i/z.qs.length*100}%"></i></div><p class="qtag">${q.tag}</p>${q.html?`<div class="qtext">${q.html}</div>`:''}

  if(auto){$('#quiz').scrollTop=0;if(q.audio&&!isOnce(z,q))playQ()}

function answer(val,ok){const z=QZ;z.ans[z.i]=val;z.res[z.i]=ok;stopAudio();if(z.opt.exam)nextQ();else{z.shown=true;drawQ()}}
function nextQ(){const z=QZ;z.shown=false;z.flip=false;stopAudio();if(++z.i>=z.qs.length)finishQuiz();else drawQ(true)}
function revItem(q,a){

  if(k==='dict') return h+`<p>Bạn viết: <span class="jp no">${esc(a||'(bỏ trống)')}</span></p><p>Đáp án: <span class="jp ok">${ruby(q.raw)}</span><br><span class="mute">${esc(q.vi)}</span></p></div>`;

function finishQuiz(){

  z.qs.forEach((q,i)=>{const r=z.res[i]===true;if(r)ok++;

  p.act[today()]=1;save();
  if(z.opt.chain){z.opt.chain(z);return}
  const pct=Math.round(ok/z.qs.length*100);if(z.opt.done)z.opt.done(pct);
  const bad=z.qs.map((q,i)=>z.res[i]===true?'':revItem(q,z.ans[i])).join('');
  $('#quiz').innerHTML=`<div class="qwrap"><header class="qhead"><button class="x" data-act="qclose" aria-label="Đóng">×</button><b>${esc(z.title)}</b><span></span></header>
  <div class="result"><div class="stamp big ${pct>=60?'':'fail'}">${pct>=60?'合格':'再'}</div><h2>${ok}/${z.qs.length} câu đúng (${pct}%)</h2>
  <p>${pct>=80?'Rất tốt. Bạn đã nắm chắc phần này.':pct>=60?'Đạt. Xem lại các câu sai bên dưới trước khi học tiếp.':'Chưa đạt 60%. Đọc lại bài rồi làm lại nhé.'}</p></div>
  ${bad?'<h3>Câu cần xem lại</h3>'+bad:''}<div class="row"><button class="btn" data-act="qclose">Xong</button></div></div>`;
  $('#quiz').scrollTop=0;z.fin=true;
}

function practice(m){

    m==='g'?S(it.g,10).map(e=>qGram(e)).concat(S(Ls.flatMap(x=>FX[x]||[]),5).map(fresh)):m==='bk'?S(EX.BP,10).map(qBank):m==='rd'?S(Ls.filter(x=>RD[x]),3).flatMap(x=>qRead(RD[x])):m==='cz'?S(Ls,5).map(qCloze):

  return `<h1>Đề thi thử N5</h1><p class="lead">Ba đề cố định dựng theo cấu trúc và thời lượng của đề N5 hiện hành. Câu hỏi trong đề không trùng với câu nào trong bài học, và ba đề không trùng nhau.</p>
  <table class="tb"><tr><th>Phần</th><th>Thời gian</th><th>Dạng câu</th><th>Số câu</th></tr>
  <tr><td>Chữ và từ vựng</td><td>20 phút</td><td>Cách đọc kanji 7 · Chọn chữ 5 · Điền từ theo ngữ cảnh 6 · Câu đồng nghĩa 3</td><td>21</td></tr>
  <tr><td>Ngữ pháp và đọc hiểu</td><td>40 phút</td><td>Ngữ pháp 9 · Sắp xếp câu 4 · Đoạn văn đục lỗ 4 · Đọc ngắn 2 · Đọc vừa 2 · Tìm thông tin 1</td><td>22</td></tr>
  <tr><td>Nghe hiểu</td><td>30 phút</td><td>Nghe nhiệm vụ 7 · Nghe điểm chính 6 · Chọn câu nói 5 · Đáp lời nhanh 6</td><td>24</td></tr></table>
  <p class="mute">Điểm quy đổi về thang 180 (đỗ từ 80, điểm liệt 38/120 và 19/60). Phần nghe phát ở tốc độ tự nhiên, mỗi câu chỉ nghe một lần và hội thoại có chi tiết gây nhiễu (đổi ý, nhiều con số). Giọng đọc vẫn là giọng tổng hợp của trình duyệt nên đều và rõ hơn băng thật; hãy luyện thêm bằng đề mẫu chính thức của JLPT trước ngày thi.</p>
  <div class="cards">${[1,2,3].map(i=>`<button class="pcard" data-act="exam" data-no="${i}"><b>Đề số ${i}</b><span>${ex[i]?`${ex[i].tot}/180, ${ex[i].pass?'đạt':'chưa đạt'} (${fmtY(pd(ex[i].d))})`:'Chưa làm'}</span></button>`).join('')}
  <button class="pcard" data-act="exam" data-no="0"><b>Đề trộn lại</b><span>Trộn câu của cả ba đề. Chỉ nên làm sau khi xong ba đề trên.</span></button></div>`;
}
function kdict(){
  return `<h1>Bảng kanji N5</h1><p class="lead">${ORD[5].length} chữ. Bấm vào một chữ để xem thứ tự nét, âm đọc, mẹo nhớ và tập viết. Ô tô màu là chữ đang nằm trong sổ lỗi.</p>
  <div class="kgridv">${ORD[5].map(c=>`<button class="jp${P().wrong['k:'+c]?' w':''}" data-act="kopen" data-k="${c}" title="${K[c].hv}: ${esc(K[c].m)}">${c}</button>`).join('')}</div>
  <div class="row"><button class="btn" data-act="prac" data-m="kf">Lật thẻ kanji</button><button class="btn line" data-act="prac" data-m="kq">Trắc nghiệm kanji</button></div>`;
}
function wrongV(){
  const ks=Object.keys(P().wrong);
  const row=k=>{if(k[0]==='k'){const x=K[k.slice(2)];return x&&`<b class="jp">${x.c}</b><span>${x.hv}: ${esc(x.m)}</span>`}
    if(k[0]==='w'){const x=W[k.slice(2)];return x&&`<b class="jp">${wordHtml(x)}</b><span>${esc(x.m)}</span>`}
    const e=GEX[k];return e&&`<b class="jp">${esc(e.g.t)}</b><span class="jp">${exFull(e,1)}</span>`};
  return `<h1>Sổ lỗi</h1><p class="lead">Kanji, từ vựng và mẫu ngữ pháp bạn trả lời sai được ghi lại ở đây. Trả lời đúng lại đủ số lần đã sai thì mục đó tự rời khỏi sổ.</p>
  ${ks.length?`<div class="row"><button class="btn" data-act="wquiz">Luyện lại ${Math.min(20,ks.length)} mục</button></div><ul class="outl">${ks.map(k=>{const r=row(k);return r?`<li>${r}<small>sai ${P().wrong[k]} lần</small></li>`:''}).join('')}</ul>`:'<p class="note">Sổ đang trống. Làm bài tập của một ngày bất kỳ, những câu sai sẽ xuất hiện ở đây.</p>'}`;
}
function setV(){
  const p=P();
  return `<h1>Cài đặt</h1>
  <section class="sec"><h2>Hồ sơ đang dùng</h2><div class="form"><label>Tên<input id="s-name" value="${esc(p.name)}"></label><label>Ngày bắt đầu<input id="s-start" type="date" value="${p.start}"></label></div>
  <div class="row"><button class="btn" data-act="saveset">Lưu thay đổi</button></div></section>
  <section class="sec"><h2>Hiển thị và giọng đọc</h2><label class="chk"><input type="checkbox" data-act="furi" ${p.furi!==false?'checked':''}> Hiện furigana trên kanji</label>
  <div class="form"><label>Giao diện <select data-act="theme"><option value="">Theo thiết bị</option><option value="light"${p.theme==='light'?' selected':''}>Sáng</option><option value="dark"${p.theme==='dark'?' selected':''}>Tối</option></select></label>
  <label>Tốc độ đọc <select data-act="rate">${[[.7,'Chậm'],[.9,'Vừa'],[1,'Tự nhiên'],[1.15,'Nhanh']].map(([v,t])=>`<option value="${v}"${(p.rate||.9)==v?' selected':''}>${t}</option>`).join('')}</select></label></div>
  <div class="row"><button class="btn line" data-act="ttstest">${SPK} Thử giọng đọc</button></div>
  <p class="mute">Phần nghe dùng giọng tiếng Nhật có sẵn của thiết bị. Nếu bấm thử mà không có tiếng hoặc nghe như đọc tiếng Anh, hãy cài thêm giọng tiếng Nhật trong phần cài đặt ngôn ngữ của máy, hoặc mở trang bằng Chrome, Edge hay Safari.</p></section>
  <section class="sec"><h2>Các hồ sơ trên máy này</h2><p class="mute">Mỗi hồ sơ có tiến độ và sổ lỗi riêng. Dữ liệu chỉ nằm trong trình duyệt này, không gửi đi đâu.</p>
  <ul class="outl">${Object.values(DB.profiles).map(q=>`<li><b>${esc(q.name)}</b><span>bắt đầu ${fmtY(pd(q.start))}</span>${q.id===p.id?'<small>đang dùng</small>':`<button class="btn sm line" data-act="switch" data-id="${q.id}">Chuyển sang</button>`}</li>`).join('')}</ul>
  <div class="row"><button class="btn line" data-act="addp">Thêm hồ sơ mới</button></div></section>
  <section class="sec"><h2>Sao lưu</h2><p class="mute">Xoá dữ liệu trình duyệt sẽ làm mất tiến độ. Hãy tải bản sao lưu định kỳ, hoặc dùng nó để chuyển sang máy khác.</p>
  <div class="row"><button class="btn line" data-act="export">Tải bản sao lưu</button><label class="btn line">Khôi phục từ tệp<input type="file" accept="application/json" id="imp" hidden></label></div>
  <div class="row"><button class="btn sm danger" data-act="reset">Xoá tiến độ của hồ sơ này</button>${Object.keys(DB.profiles).length>1?'<button class="btn sm danger" data-act="delp">Xoá hồ sơ này</button>':''}</div></section>
  <section class="sec"><h2>Nguồn dữ liệu</h2><p class="mute">Nét viết kanji: KanjiVG © Ulrich Apel, giấy phép CC BY-SA 3.0. Âm On, Kun và phân cấp JLPT: KANJIDIC2 © EDRDG, giấy phép CC BY-SA 4.0. JLPT không công bố danh sách chính thức, phân cấp chỉ mang tính tham khảo.</p></section>`;
}
let lastHash=null;
function render(keep){
  const app=$('#app');
  if(!P()){app.innerHTML=onboard();return}
  const p=P();if(p.theme)document.documentElement.dataset.theme=p.theme;else delete document.documentElement.dataset.theme;
  document.body.classList.toggle('nofuri',p.furi===false);
  const [r,a]=(location.hash.slice(2)||'').split('/'),y=scrollY;
  const v=r==='plan'?plan():r==='day'?day(+a||todayN()):r==='prac'?pracV():r==='exam'?examV():r==='kanji'?kdict():r==='wrong'?wrongV():r==='set'?setV():home();
  app.innerHTML=`<nav class="nav"><a class="brand" href="#/"><span class="jp">日本語</span>JLPT N5</a>${NAV.map(([h,t,g])=>`<a href="#/${h}" class="${(r||'')===h||(h==='plan'&&r==='day')||(h==='prac'&&r==='wrong')?'on':''}"><span class="jp">${g}</span>${t}</a>`).join('')}</nav>
  <main>${LS.ok?'':'<p class="note">Trình duyệt đang chặn lưu trữ ở chế độ xem này nên tiến độ sẽ mất khi đóng trang. Hãy mở tệp trực tiếp bằng trình duyệt hoặc đưa lên hosting để lưu được lâu dài.</p>'}${v}</main>`;
  scrollTo(0,keep&&lastHash===location.hash?y:0);lastHash=location.hash;
}

/* ================= Sự kiện ================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,p=P(),z=QZ,q=z&&z.qs&&z.qs[z.i];
  if(a==='create'){const s=$('#o-start').value;if(!s){toast('Hãy chọn ngày bắt đầu.');return}newProfile($('#o-name').value.trim()||'Bạn',s);location.hash='#/';render()}
  else if(a==='back'){DB.cur=Object.keys(DB.profiles)[0];render()}
  else if(a==='say'){e.stopPropagation();say(t.dataset.t)}
  else if(a==='anim') animate(t.closest('.kcard').querySelector('.genko svg'));
  else if(a==='kopen'){openModal(kCard(K[t.dataset.k]));animate($('#modal .genko svg'))}
  else if(a==='pad') openPad(t.dataset.k);
  else if(a==='padclr'){const c=$('#modal canvas');c.getContext('2d').clearRect(0,0,c.width,c.height)}
  else if(a==='close'){stopAudio();closeModal()}
  else if(a==='reveal') t.classList.toggle('show');
  else if(a==='kwall'){const k=KW[t.dataset.l];speak(k.lines.map(l=>({t:l.jp,v:VOI[l.s]})))}
  else if(a==='kwshow') t.closest('.sec').querySelector('.kwl').classList.toggle('veil');
  else if(a==='role'){RP={L:+t.dataset.l,r:t.dataset.r,i:0};roleStep()}
  else if(a==='rpshow'){$('#rpa').hidden=false;const ln=KW[RP.L].lines[RP.i];speak([{t:ln.jp,v:VOI[ln.s]}])}
  else if(a==='rpnext'){RP.i++;roleStep()}
  else if(a==='quiz'){const n=+t.dataset.n,s=t.dataset.sec,d=D(n);startQuiz(`Ngày ${n}: ${d.type==='lesson'?SECN[s]:dayLabel(d)}`,buildSec(n,s),{done:pct=>markDone(n,s,pct)})}
  else if(a==='exam'){const n=+t.dataset.n;startExam(+t.dataset.no,n?pct=>markDone(n,'q',pct):null)}
  else if(a==='exgo'){const ex=EXS,pt=ex.parts[ex.i];startQuiz(`${ex.no?'Đề '+ex.no:'Đề trộn lại'} · ${pt.title}`,pt.qs,{exam:true,limit:pt.min*60,chain:zz=>{ex.done.push(zz);QZ=null;if(++ex.i<3)examIntro();else examResult()}})}
  else if(a==='prac') practice(t.dataset.m);
  else if(a==='wquiz') startQuiz('Luyện lại sổ lỗi',shuf(Object.keys(p.wrong)).slice(0,20).map(qFromKey));
  else if(a==='qplay') playQ();
  else if(a==='pick'){if(!z.shown)answer(+t.dataset.i,+t.dataset.i===q.a)}
  else if(a==='dchip'){const i=$('#din');i.value+=t.dataset.t}
  else if(a==='dclr') $('#din').value='';
  else if(a==='dcheck'){const v=$('#din').value;answer(v,dictOk(q,v))}
  else if(a==='czadd'){const st=z.ans[z.i],b=q.sol.findIndex((_,j)=>st.f[j]==null);if(b<0)return;const i=+t.dataset.i;st.f[b]=q.bank[i];st.u[b]=i;drawQ()}
  else if(a==='czrm'){const st=z.ans[z.i],b=+t.dataset.b;st.f[b]=null;st.u[b]=null;drawQ()}
  else if(a==='czcheck'){const st=z.ans[z.i];z.res[z.i]=q.sol.every((s,j)=>st.f[j]===s);z.shown=true;drawQ()}
  else if(a==='flip'){z.flip=true;drawQ();if(q.say)say(q.say)}
  else if(a==='fyes'||a==='fno'){z.res[z.i]=a==='fyes';nextQ()}
  else if(a==='qnext') nextQ();
  else if(a==='qclose'){if((EXS||(z&&!z.fin&&z.res.length))&&!confirm('Thoát bài đang làm? Kết quả sẽ không được lưu.'))return;closeQuiz()}
  else if(a==='saveset'){const s=$('#s-start').value;if(!s){toast('Hãy chọn ngày bắt đầu.');return}p.name=$('#s-name').value.trim()||p.name;p.start=s;save();render();toast('Đã lưu thay đổi.')}
  else if(a==='ttstest') speak([{t:'こんにちは。わたし は リン です。',v:'f'},{t:'はじめまして。田中(たなか) です。よろしく おねがいします。',v:'m'}]);
  else if(a==='switch'){DB.cur=t.dataset.id;save();render();toast('Đã chuyển hồ sơ.')}
  else if(a==='addp'){DB.cur=null;render()}
  else if(a==='export'){const b=new Blob([JSON.stringify(DB)],{type:'application/json'}),l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='jlpt-n5-sao-luu.json';l.click();toast('Đã tải bản sao lưu.')}
  else if(a==='reset'){if(confirm('Xoá toàn bộ tiến độ và sổ lỗi của hồ sơ này?')){p.done={};p.wrong={};p.act={};p.exams={};save();render();toast('Đã xoá tiến độ.')}}
  else if(a==='delp'){if(confirm(`Xoá hồ sơ “${p.name}”?`)){delete DB.profiles[p.id];DB.cur=Object.keys(DB.profiles)[0];save();render()}}
});
document.addEventListener('change',e=>{
  const t=e.target,a=t.dataset.act;
  if(a==='hide') t.closest('.sec').querySelector('.vlist').classList.toggle('hidden',t.checked);
  else if(a==='furi'){P().furi=t.checked;save();render(true)}
  else if(a==='theme'){P().theme=t.value;save();render(true)}
  else if(a==='rate'){P().rate=+t.value;save()}
  else if(a==='scope'){P().scope=t.value;save()}
  else if(t.id==='imp'&&t.files[0]){const f=new FileReader();f.onload=()=>{try{const d=JSON.parse(f.result);if(!d.profiles||!Object.keys(d.profiles).length)throw 0;DB=d;if(!P())DB.cur=Object.keys(DB.profiles)[0];save();render();toast('Đã khôi phục dữ liệu.')}catch(x){toast('Tệp không đúng định dạng sao lưu.')}};f.readAsText(t.files[0])}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#modal').classList.contains('on')){stopAudio();closeModal()}return}
  const z=QZ;if(!z||z.fin||!z.qs)return;const q=z.qs[z.i],k=q.kind||'mc';
  if(k==='mc'&&/^[1-4]$/.test(e.key)&&!z.shown&&+e.key<=q.opts.length) answer(+e.key-1,+e.key-1===q.a);
  else if(e.key==='Enter'){if(z.shown){e.preventDefault();nextQ()}else if(k==='dict'){e.preventDefault();const v=$('#din').value;answer(v,dictOk(q,v))}}
});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'){stopAudio();closeModal()}});
addEventListener('hashchange',()=>render());
if(!P()&&Object.keys(DB.profiles).length) DB.cur=Object.keys(DB.profiles)[0];
render();
</script>
