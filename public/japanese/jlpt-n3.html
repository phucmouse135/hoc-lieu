g uống rượu à?\nB:飲(の)めない わけでは ないんですが、 明日(あした) 朝(あさ) 早(はや)いので。=Không hẳn là không uống được, nhưng mai tôi phải dậy sớm.\nA:じゃ、 ウーロン茶(ちゃ)に しますか。=Vậy anh dùng trà ô long nhé?\nB:ええ、 お願(ねが)いします。 次(つぎ)の 機会(きかい)には 飲(の)みますよ。=Vâng, cho tôi xin. Dịp tới tôi sẽ uống.\n?男(おとこ)の 人(ひと)は どう して お酒(さけ)を 飲(の)みませんか。|明日(あした)の 朝(あさ)が 早(はや)いから|お酒(さけ)が 飲(の)めないから|お酒(さけ)が 嫌(きら)いだから|車(くるま)で来(き)たから\n##30 Không thể nghỉ\nA:熱(ねつ)が あるじゃ ない。 今日(きょう)は 会社(かいしゃ)を 休(やす)んだら？=Sốt rồi kìa. Hôm nay nghỉ làm đi?\nB:今日(きょう)は 大事(だいじ)な 会議(かいぎ)が あるから、 休(やす)む わけには いかないんだ。=Hôm nay có cuộc họp quan trọng nên anh không thể nghỉ.\nA:じゃ、 会議(かいぎ)が 終(お)わったら、 すぐ 帰(かえ)ってきてね。=Vậy họp xong thì về ngay nhé.\nB:うん。 午前(ごぜん)中(ちゅう)で終(お)わるから、 昼(ひる)には 帰(かえ)るよ。=Ừ. Buổi sáng là xong nên trưa anh về.\n?男(おとこ)の 人(ひと)は 今日(きょう) どう しますか。|会議(かいぎ)に 出(で)て、 昼(ひる)に 帰(かえ)る|一日中(いちにちじゅう)会社(かいしゃ)で 働(はたら)く|会社(かいしゃ)を 休(やす)む|病院(びょういん)へ 行(い)く\n##31 Nên làm gì\nA:友達(ともだち)に 借(か)りた 本(ほん)を 汚(よご)しちゃったんだ。 どう しよう。=Tớ lỡ làm bẩn quyển sách mượn của bạn. Làm sao giờ.\nB:それは、 正直(しょうじき)に 言(い)って 謝(あやま)るべきだよ。=Chuyện đó thì phải nói thật và xin lỗi.\nA:でも、 怒(おこ)られるかも しれないし。=Nhưng có khi bị giận.\nB:黙(だま)っているべきじゃ ないよ。 新(あたら)しいのを 買(か)って 返(かえ)したら どう？=Không nên im lặng đâu. Mua quyển mới trả thì sao?\n?男(おとこ)の 人(ひと)の アドバイスは 何(なん)ですか。|謝(あやま)って、 新(あたら)しい 本(ほん)を 買(か)って 返(かえ)す|黙(だま)っている|本(ほん)を きれいに して 返(かえ)す|友達(ともだち)に 会(あ)わない\n##32 Lời khuyên học\nA:先生(せんせい)、 どう すれば 会話(かいわ)が 上手(じょうず)に なりますか。=Thưa thầy, làm thế nào để giỏi hội thoại ạ?\nB:間違(まちが)いを 怖(こわ)がらずに、 とにかく たくさん 話(はな)す ことですね。=Tốt nhất là đừng sợ sai, cứ nói thật nhiều.\nA:でも、 話(はな)す 相手(あいて)が いないんです。=Nhưng em không có người để nói cùng.\nB:それなら、 ドラマの せりふを まねして、 声(こえ)に 出(だ)して 言(い)ってみる ことです。=Vậy thì nên bắt chước lời thoại phim và thử nói thành tiếng.\n?先生(せんせい)は、 相手(あいて)が いない 人(ひと)に 何(なに)を する ように 言(い)いましたか。|ドラマの せりふを まねして 言(い)う|友達(ともだち)を 作(つく)る|文法(ぶんぽう)の 本(ほん)を 読(よ)む|間違(まちが)いを 直(なお)す\n##33 Đừng lo\nA:明日(あした)の 面接(めんせつ)、 心配(しんぱい)で 眠(ねむ)れ そうに ないよ。=Buổi phỏng vấn ngày mai, tớ lo quá chắc không ngủ được.\nB:そんなに 心配(しんぱい) する ことは ないよ。 いつも どおり 話(はな)せば 大丈夫(だいじょうぶ)。=Không cần lo thế đâu. Cứ nói như mọi khi là ổn.\nA:スーツを 新(あたら)しく 買(か)った ほうが いいかな。=Có nên mua bộ vest mới không nhỉ?\nB:わざわざ 買(か)う ことは ないよ。 今(いま)のを きれいに しておけば 十分(じゅうぶん)だよ。=Không cần cất công mua đâu. Giặt sạch bộ hiện có là đủ.\n?女(おんな)の 人(ひと)は スーツに ついて 何(なん)と 言(い)いましたか。|新(あたら)しく 買(か)わなくても いい|新(あたら)しいのを 買(か)った ほうが いい|スーツは 着(き)なくても いい|貸(か)してあげる\n##34 Tên gọi\nA:この 辺(へん)は、 どう して 「桜町(さくらまち)」と いうんですか。=Khu này sao lại gọi là \"Sakuramachi\" vậy?\nB:昔(むかし)、 川(かわ)の 両側(りょうがわ)に 桜(さくら)の 木(き)が たくさん あった ことから、 そう 呼(よ)ばれる ように なった そうです。=Nghe nói vì ngày xưa hai bên sông có nhiều cây anh đào nên được gọi như vậy.\nA:今(いま)は あまり 見(み)えませんね。=Giờ thì không thấy mấy nhỉ.\nB:ええ。 道路(どうろ)を 作(つく)る 時(とき)に、 ほとんど 切(き)ってしまったんです。=Vâng. Khi làm đường người ta đã chặt gần hết.\n?桜(さくら)の 木(き)は どう して 少(すく)なく なりましたか。|道路(どうろ)を 作(つく)る 時(とき)に 切(き)ったから|病気(びょうき)に なったから|川(かわ)が 大(おお)きく なったから|町(まち)の 名前(なまえ)が 変(か)わったから\n##35 Tin vui\nA:聞(き)いてください。 うれしい ことに、 第(だい)一(いち)希望(きぼう)の 会社(かいしゃ)に 受(う)かったんです。=Nghe này. Thật vui là tôi đã đỗ vào công ty nguyện vọng một.\nB:それは おめでとう ございます。=Chúc mừng anh.\nA:ただ、 残念(ざんねん)な ことに、 勤務(きんむ)地(ち)が 大阪(おおさか)なんです。=Chỉ có điều đáng tiếc là nơi làm việc ở Osaka.\nB:じゃ、 引(ひ)っ越(こ)さなければ なりませんね。=Vậy anh phải chuyển nhà rồi nhỉ.\n?男(おとこ)の 人(ひと)に とって 残念(ざんねん)な ことは 何(なん)ですか。|働(はたら)く 場所(ばしょ)が 大阪(おおさか)で ある こと|会社(かいしゃ)に 受(う)からなかった こと|引(ひ)っ越(こ)せない こと|第(だい)二(に)希望(きぼう)の 会社(かいしゃ)だった こと\n##36 Ngày xưa\nA:この 公園(こうえん)、 昔(むかし)と あまり 変(か)わっていませんね。=Công viên này không khác xưa mấy nhỉ.\nB:ええ。 子供(こども)の ころ、 毎日(まいにち) ここで 遊(あそ)んだ ものです。=Vâng. Hồi nhỏ ngày nào tôi cũng chơi ở đây.\nA:私(わたし)もです。 暗(くら)く なるまで 帰(かえ)らなくて、 よく 母(はは)に 怒(おこ)られた ものですよ。=Tôi cũng vậy. Chơi đến tối mới về nên hay bị mẹ mắng.\nB:今(いま)の 子供(こども)は、 外(そと)で 遊(あそ)ばなく なりましたね。=Trẻ con bây giờ không còn chơi ngoài trời nữa nhỉ.\n?女(おんな)の 人(ひと)は 子供(こども)の ころ、 どう して 母(はは)に 怒(おこ)られましたか。|暗(くら)く なるまで 帰(かえ)らなかったから|公園(こうえん)で 遊(あそ)ばなかったから|勉強(べんきょう)しなかったから|けんかを したから\n##37 Phân trần\nA:遅(おそ)かったね。 30分(ぷん)も 待(ま)ったよ。=Muộn thế. Tớ chờ tận 30 phút đấy.\nB:ごめん。 出(で)かけようと したら、 急(きゅう)に 客(きゃく)が 来(き)た ものだから。=Xin lỗi. Tại đúng lúc định đi thì đột nhiên có khách đến.\nA:電話(でんわ)してくれれば よかったのに。=Giá mà cậu gọi điện cho tớ.\nB:携帯(けいたい)を 家(いえ)に 忘(わす)れてきた もんだから、 連絡(れんらく) できなかったんだ。=Tại tớ để quên điện thoại ở nhà nên không liên lạc được.\n?男(おとこ)の 人(ひと)は どう して 連絡(れんらく)しませんでしたか。|携帯(けいたい)電話(でんわ)を 家(いえ)に 忘(わす)れたから|客(きゃく)と 話(はな)していたから|電話(でんわ)番号(ばんごう)を 知(し)らなかったから|電車(でんしゃ)に 乗(の)っていたから\n##38 Mua rồi mà\nA:先月(せんげつ) 買(か)った 自転(じてん)車(しゃ)、 乗(の)ってる？=Cái xe đạp mua tháng trước, cậu có đi không?\nB:買(か)った ものの、 忙(いそが)しくて まだ 2回(かい)しか 乗(の)ってないんだ。=Tuy mua rồi nhưng bận nên mới đi có 2 lần.\nA:もったい ない。 高(たか)かったんでしょう？=Phí thế. Đắt lắm mà?\nB:うん。 今週(こんしゅう)末(まつ)は 時間(じかん)が あるから、 海(うみ)まで 行(い)ってみる つもり。=Ừ. Cuối tuần này có thời gian nên tớ định đạp ra biển.\n?男(おとこ)の 人(ひと)は 今週(こんしゅう)末(まつ)、 何(なに)を しますか。|自転(じてん)車(しゃ)で 海(うみ)へ 行(い)く|自転(じてん)車(しゃ)を 売(う)る|新(あたら)しい 自転(じてん)車(しゃ)を 買(か)う|忙(いそが)しくて 何(なに)も しない\n##39 Nói nũng\nA:また 新(あたら)しい 靴(くつ) 買(か)ったの？ 先週(せんしゅう)も 買(か)ったじゃ ない。=Lại mua giày mới à? Tuần trước cũng mua rồi mà.\nB:だって、 半額(はんがく)だったんだもん。=Tại giảm nửa giá mà.\nA:でも、 はく機会(きかい)が ないでしょう。=Nhưng có dịp đi đâu.\nB:あるよ。 来月(らいげつ)、 友達(ともだち)の 結婚(けっこん)式(しき)が あるもん。=Có chứ. Tháng sau có đám cưới bạn mà.\n?女(おんな)の 人(ひと)は どう して 靴(くつ)を 買(か)いましたか。|半額(はんがく)だったから|はく 靴(くつ)が なかったから|友達(ともだち)に もらったから|先週(せんしゅう)の 靴(くつ)が 壊(こわ)れたから\n##40 Suýt lỡ tàu\nA:今朝(けさ)、 大変(たいへん)だったんだ。=Sáng nay gay go lắm.\nB:どう したの？=Sao thế?\nA:電車(でんしゃ)に 乗(の)ろうと したら、 目(め)の 前(まえ)で ドアが 閉(し)まっちゃって。=Tớ định lên tàu thì cửa đóng ngay trước mặt.\nB:それで 遅刻(ちこく)したんだ。 次(つぎ)からは、 もう 一(いち)本(ぽん) 早(はや)いのに 乗(の)ろうと した ほうが いいね。=Thế nên cậu đi muộn. Lần sau nên cố đi chuyến sớm hơn nhỉ.\n?男(おとこ)の 人(ひと)は 今朝(けさ) どう なりましたか。|電車(でんしゃ)に 乗(の)れなくて、 遅刻(ちこく)した|電車(でんしゃ)の 中(なか)で けがを した|早(はや)い 電車(でんしゃ)に 乗(の)った|ドアに かばんが はさまった\n##41 Không chịu nghe\nA:息子(むすこ)さん、 最近(さいきん) どうですか。=Con trai chị dạo này thế nào?\nB:それが、 ゲームばかり して、 全然(ぜんぜん) 勉強(べんきょう)しようと しないんです。=Chuyện là nó toàn chơi game, hoàn toàn không chịu học.\nA:うちの 娘(むすめ)もですよ。 野菜(やさい)を 食(た)べようと しないし。=Con gái tôi cũng vậy. Còn không chịu ăn rau.\nB:どう したら いいんでしょうね。=Làm sao bây giờ nhỉ.\n?男(おとこ)の 人(ひと)の 娘(むすめ)に ついて 正(ただ)しいのは どれですか。|野菜(やさい)を 食(た)べようと しない|ゲームばかり している|よく 勉強(べんきょう)する|何(なん)でも 食(た)べる\n##42 Lời nhắn\nA:山田(やまだ)さん、 部長(ぶちょう)が 呼(よ)んでいましたよ。=Anh Yamada, trưởng phòng gọi anh đấy.\nB:えっ、 何(なん)の 用(よう)でしょうか。=Hả, có việc gì nhỉ?\nA:明日(あした)の 会議(かいぎ)の 資料(しりょう)を、 今日中(きょうじゅう)に 出(だ)す ように 言(い)っていました。=Trưởng phòng bảo nộp tài liệu họp ngày mai trong hôm nay.\nB:わかりました。 あと、 課長(かちょう)にも 会議(かいぎ)に 出(で)る ように 伝(つた)えてもらえますか。=Tôi hiểu rồi. À, chị nhắn giúp trưởng nhóm cũng dự họp được không?\n?山田(やまだ)さんは 今日(きょう)、 何(なに)を しなければ なりませんか。|会議(かいぎ)の 資料(しりょう)を 出(だ)す|会議(かいぎ)に 出(で)る|課長(かちょう)に 電話(でんわ)する|部長(ぶちょう)の 部屋(へや)を 掃除(そうじ)する\n##43 Bó tay\nA:田中(たなか)さんに 連絡(れんらく)したいんですが、 電話(でんわ)に 出(で)ないんです。=Tôi muốn liên lạc với anh Tanaka mà anh ấy không nghe máy.\nB:メールは 送(おく)ってみましたか。=Chị thử gửi mail chưa?\nA:アドレスを 知(し)らないので、 送(おく)りようが ないんです。=Tôi không biết địa chỉ nên không có cách nào gửi.\nB:じゃ、 私(わたし)が 知(し)っているので、 代(か)わりに 送(おく)っておきますよ。=Vậy tôi biết, để tôi gửi thay cho.\n?だれが 田中(たなか)さんに メールを 送(おく)りますか。|男(おとこ)の 人(ひと)|女(おんな)の 人(ひと)|田中(たなか)さんの 家族(かぞく)|だれも 送(おく)らない\n##44 Cứ như\nA:わあ、 この 人形(にんぎょう)、 まるで 生(い)きている ようですね。=Ồ, con búp bê này cứ như đang sống nhỉ.\nB:祖母(そぼ)が 作(つく)ったんです。 一(ひと)つ 作(つく)るのに 1か月(げつ) かかる そうです。=Bà tôi làm đấy. Nghe nói làm một con mất 1 tháng.\nA:すごいですね。 まるで プロ みたいです。=Giỏi thật. Cứ như dân chuyên.\nB:若(わか)い ころ、 人形(にんぎょう)の 店(みせ)で 働(はたら)いていたんですよ。=Hồi trẻ bà làm ở tiệm búp bê mà.\n?人形(にんぎょう)は だれが 作(つく)りましたか。|女(おんな)の 人(ひと)の おばあさん|女(おんな)の 人(ひと)|人形(にんぎょう)の 店(みせ)の 人(ひと)|男(おとこ)の 人(ひと)\n##45 Truyền đạt\nA:さっき、 山田(やまだ)さんから 電話(でんわ)が ありましたよ。=Lúc nãy anh Yamada có gọi điện đấy.\nB:何(なに)か 言(い)っていましたか。=Anh ấy có nói gì không?\nA:電車(でんしゃ)が 止(と)まっていて、 30分(ぷん)ぐらい 遅(おく)れると いう ことです。=Anh ấy nói là tàu đang dừng nên sẽ muộn khoảng 30 phút.\nB:じゃ、 会議(かいぎ)は 予定(よてい)どおり 始(はじ)めて、 山田(やまだ)さんの 発表(はっぴょう)を 最後(さいご)に しましょう。=Vậy cứ bắt đầu họp như dự định, phần phát biểu của anh Yamada để cuối.\n?会議(かいぎ)は どう なりますか。|予定(よてい)どおり 始(はじ)めて、 山田(やまだ)さんは 最後(さいご)に 発表(はっぴょう)する|30分(ぷん) 遅(おく)れて 始(はじ)まる|中止(ちゅうし)に なる|山田(やまだ)さん なしで 全部(ぜんぶ) 終(お)わらせる\n##46 Nghĩa của từ\nA:すみません、 「食(た)べ 放題(ほうだい)」と いうのは、 どう いう 意味(いみ)ですか。=Xin lỗi, \"tabehōdai\" nghĩa là gì ạ?\nB:決(き)まった 料金(りょうきん)で、 好(す)きなだけ 食(た)べられると いう ことです。=Tức là với một mức giá cố định, được ăn bao nhiêu tuỳ thích.\nA:じゃ、 「飲(の)み 放題(ほうだい)」と いうのは、 好(す)きなだけ 飲(の)める ことですね。=Vậy \"nomihōdai\" là được uống bao nhiêu tuỳ thích nhỉ.\nB:その とおりです。 ただ、 時間(じかん)は 2時間(じかん)までですよ。=Đúng vậy. Có điều thời gian chỉ đến 2 tiếng thôi.\n?「食(た)べ 放題(ほうだい)」に ついて 正(ただ)しいのは どれですか。|同(おな)じ 料金(りょうきん)で たくさん 食(た)べられるが、 時間(じかん)が 決(き)まっている|いくら 食(た)べても 無料(むりょう)だ|時間(じかん)は 決(き)まっていない|飲(の)み物(もの)は 飲(の)めない\n##47 Đúng hơn là\nA:山田(やまだ)さんの 奥(おく)さん、 きれいな 方(ほう)ですね。=Vợ anh Yamada đẹp nhỉ.\nB:ええ。 きれいと いうより、 かわいい 感(かん)じですね。=Vâng. Đúng hơn là dễ thương chứ không hẳn là đẹp.\nA:お仕事(しごと)は 何(なに)を されているんですか。=Chị ấy làm nghề gì?\nB:絵(え)を 教(おし)えている そうです。 先生(せんせい)と いうより、 友達(ともだち)の ような 先生(せんせい)だと 聞(き)きました。=Nghe nói dạy vẽ. Tôi nghe bảo chị ấy giống bạn bè hơn là giáo viên.\n?山田(やまだ)さんの 奥(おく)さんは どんな 仕事(しごと)を していますか。|絵(え)を 教(おし)えている|絵(え)を 売(う)っている|学校(がっこう)の 事務(じむ)を している|仕事(しごと)は していない\n##48 Nói vậy thôi\nA:リーさん、 料理(りょうり)が 得意(とくい)だ そうですね。=Nghe nói anh Lee nấu ăn giỏi nhỉ.\nB:得意(とくい)と いっても、 国(くに)の 料理(りょうり)が 少(すこ)し 作(つく)れるだけですよ。=Nói là giỏi nhưng tôi chỉ nấu được chút món quê tôi thôi.\nA:今度(こんど)、 教(おし)えてください。=Lần tới dạy tôi với.\nB:いいですよ。 簡単(かんたん)な ものなら、 30分(ぷん)で 作(つく)れますから。=Được thôi. Món đơn giản thì 30 phút là nấu xong.\n?リーさんは 料理(りょうり)に ついて 何(なん)と 言(い)っていますか。|国(くに)の 料理(りょうり)が 少(すこ)し 作(つく)れるだけだ|どんな 料理(りょうり)でも 作(つく)れる|料理(りょうり)は 全然(ぜんぜん) できない|料理(りょうり)を 習(なら)っている\n##49 Chưa chắc\nA:この レストラン、 高(たか)いから、 きっと おいしいよね。=Nhà hàng này đắt nên chắc chắn ngon nhỉ.\nB:高(たか)いからと いって、 おいしいとは 限(かぎ)らないよ。=Đắt chưa chắc đã ngon đâu.\nA:じゃ、 どう やって 選(えら)ぶの？=Vậy chọn thế nào?\nB:インターネットで、 行(い)った 人(ひと)の 感想(かんそう)を 読(よ)んでから 決(き)める ことに してるんだ。=Tớ đặt lệ là đọc cảm nhận của người đã đi trên mạng rồi mới quyết.\n?男(おとこ)の 人(ひと)は どう やって 店(みせ)を 選(えら)びますか。|行(い)った 人(ひと)の 感想(かんそう)を 読(よ)んで 決(き)める|値段(ねだん)が 高(たか)い 店(みせ)を 選(えら)ぶ|友達(ともだち)に 聞(き)いて 決(き)める|近(ちか)い 店(みせ)を 選(えら)ぶ\n##50 Nhắc đến\nA:来月(らいげつ)、 京都(きょうと)へ 旅行(りょこう)に 行(い)くんです。=Tháng sau tôi đi du lịch Kyoto.\nB:京都(きょうと)と 言(い)えば、 お寺(てら)が 有名(ゆうめい)ですが、 食(た)べ物(もの)も おいしいですよ。=Nhắc đến Kyoto thì chùa nổi tiếng, nhưng đồ ăn cũng ngon lắm.\nA:おすすめは ありますか。=Anh có gợi ý gì không?\nB:豆腐(とうふ)料理(りょうり)ですね。 食(た)べ物(もの)と 言(い)えば、 お土産(みやげ)には お菓子(かし)が いいですよ。=Món đậu phụ. Nhắc đến đồ ăn thì quà lưu niệm nên mua bánh kẹo.\n?男(おとこ)の 人(ひと)が お土産(みやげ)に すすめた ものは 何(なん)ですか。|お菓子(かし)|豆腐(とうふ)|お茶(ちゃ)|お寺(てら)の お守(まも)り\n##51 Gợi ý\nA:日本(にほん)語(ご)の 新聞(しんぶん)が 読(よ)める ように なりたいんですが。=Tôi muốn đọc được báo tiếng Nhật.\nB:それなら、 子供(こども)用(よう)の 新聞(しんぶん)から 始(はじ)めたら いいですよ。=Vậy thì nên bắt đầu từ báo dành cho trẻ em.\nA:どこで 買(か)えば いいですか。=Mua ở đâu thì được ạ?\nB:図書(としょ)館(かん)で 読(よ)めば いいんです。 無料(むりょう)ですから。=Đọc ở thư viện là được. Vì miễn phí.\n?男(おとこ)の 人(ひと)は 何(なに)を すすめましたか。|図書(としょ)館(かん)で 子供(こども)用(よう)の 新聞(しんぶん)を 読(よ)む|毎日(まいにち) 新聞(しんぶん)を 買(か)う|インターネットで ニュースを 読(よ)む|新聞(しんぶん)の 読(よ)み方(かた)を 習(なら)う\n##52 Giá mà\nA:昨日(きのう)の コンサート、 すごく よかったよ。=Buổi hoà nhạc hôm qua hay lắm.\nB:いいなあ。 私(わたし)も 行(い)きたかったのに。=Thích thế. Tớ cũng muốn đi mà.\nA:チケットが 1枚(まい) 余(あま)っていたんだ。 言(い)ってくれれば、 あげたのに。=Còn thừa 1 vé đấy. Giá mà cậu nói thì tớ đã cho.\nB:えっ、 本当(ほんとう)？ もっと 早(はや)く 聞(き)けば よかった。=Hả, thật à? Giá mà tớ hỏi sớm hơn.\n?女(おんな)の 人(ひと)は どう して コンサートに 行(い)きませんでしたか。|チケットが 余(あま)っているのを 知(し)らなかったから|コンサートが 嫌(きら)いだから|お金(かね)が なかったから|時間(じかん)が なかったから\n##53 Chỉ cần\nA:海外(かいがい)旅行(りょこう)、 行(い)きたいけど、 言葉(ことば)が 心配(しんぱい)で。=Tớ muốn đi du lịch nước ngoài nhưng lo chuyện ngôn ngữ.\nB:スマホさえ あれば、 大丈夫(だいじょうぶ)だよ。 翻訳(ほんやく)アプリが あるから。=Chỉ cần có điện thoại là ổn. Có ứng dụng dịch mà.\nA:でも、 道(みち)に 迷(まよ)ったら？=Nhưng nếu lạc đường thì sao?\nB:地図(ちず)の アプリも あるよ。 充電(じゅうでん)さえ 忘(わす)れなければ、 問題(もんだい) ないよ。=Có cả ứng dụng bản đồ. Chỉ cần không quên sạc pin là không vấn đề gì.\n?男(おとこ)の 人(ひと)は、 何(なん)に 気(き)を つければ いいと 言(い)いましたか。|スマホの 充電(じゅうでん)を 忘(わす)れない こと|言葉(ことば)を 勉強(べんきょう)する こと|地図(ちず)を 買(か)う こと|一人(ひとり)で行(い)かない こと\n##54 Ngay cả\nA:新(あたら)しい 仕事(しごと)は どう？=Công việc mới thế nào?\nB:忙(いそが)しくて、 昼(ひる)ご飯(はん)を 食(た)べる 時間(じかん)さえ ないんだ。=Bận đến mức ngay cả thời gian ăn trưa cũng không có.\nA:それは 大変(たいへん)だね。 週末(しゅうまつ)は 休(やす)める？=Vất vả nhỉ. Cuối tuần có được nghỉ không?\nB:土曜日(どようび)さえ 出勤(しゅっきん)する ことが あるよ。でも、 日曜日(にちようび)は 必(かなら)ず 休(やす)む ように してる。=Có khi ngay cả thứ Bảy cũng phải đi làm. Nhưng Chủ nhật thì tớ cố nghỉ bằng được.\n?男(おとこ)の 人(ひと)が 必(かなら)ず 休(やす)む 日(ひ)は いつですか。|日曜日(にちようび)|土曜日(どようび)|土曜日(どようび)と 日曜日(にちようび)|休(やす)みは ない\n##55 Nhờ ơn cô\nA:リンさん、 日本(にほん)語(ご)の 試験(しけん)、 どうでしたか。=Linh ơi, kỳ thi tiếng Nhật thế nào rồi?\nB:おかげさまで、 受(う)かりました。 先生(せんせい)が 作文(さくぶん)を 何(なん)度(ど)も 直(なお)してくださった おかげです。=Nhờ ơn cô, em đỗ rồi ạ. Là nhờ cô đã sửa bài văn cho em bao nhiêu lần.\nA:いいえ、 リンさんが 毎日(まいにち) 頑張(がんば)ったからですよ。 本当(ほんとう)に おめでとう。=Không đâu, là vì Linh đã cố gắng mỗi ngày đấy. Thật sự chúc mừng em nhé.\nB:ありがとうございます。 今度(こんど)、 お礼(れい)に 国(くに)の お菓子(かし)を 持(も)ってきます。=Em cảm ơn cô. Lần tới em sẽ mang bánh kẹo của nước em đến để cảm ơn cô ạ.\n?リンさんは、 どう して 試験(しけん)に 受(う)かったと 言(い)っていますか。|先生(せんせい)が 作文(さくぶん)を 何(なん)度(ど)も 直(なお)してくれたから|自分(じぶん)が 毎日(まいにち) 頑張(がんば)ったから|友達(ともだち)が 応援(おうえん)してくれたから|試験(しけん)が 簡単(かんたん)だったから\n##56 Tại tuyết lớn\nA:遅(おそ)かったね。 どう したの？=Cậu đến muộn thế. Có chuyện gì vậy?\nB:ごめん。 大雪(おおゆき)の せいで、 電車(でんしゃ)が 30分(ぷん)も 止(と)まっていたんだ。=Xin lỗi nhé. Tại tuyết lớn mà tàu dừng những 30 phút.\nA:大変(たいへん)だったね。 あれ、 顔(かお)が 赤(あか)いよ。 熱(ねつ)が あるんじゃない？=Vất vả nhỉ. Ơ, mặt cậu đỏ kìa. Có khi bị sốt rồi đấy?\nB:寒(さむ)い ホームで ずっと 待(ま)っていた せいか、 なんとなく 体(からだ)が だるいんだ。 今日(きょう)は 早(はや)く 帰(かえ)るよ。=Có lẽ tại đứng chờ mãi ở sân ga lạnh nên người tớ cứ thấy uể oải thế nào ấy. Hôm nay tớ sẽ về sớm.\n?男(おとこ)の 人(ひと)は どう して 遅(おく)れましたか。|雪(ゆき)で 電車(でんしゃ)が 止(と)まっていたから|熱(ねつ)が あって 寝(ね)ていたから|ホームで 転(ころ)んだから|電車(でんしゃ)が 故障(こしょう)したから\n##57 Căng thẳng quá\nA:昨日(きのう)の 面接(めんせつ)、 どうだった？=Buổi phỏng vấn hôm qua thế nào?\nB:それが、 緊張(きんちょう)の あまり、 頭(あたま)の 中(なか)が 真(ま)っ白(しろ)に なって、 自分(じぶん)の 名前(なまえ)さえ うまく 言(い)えなかったんだ。=Chuyện là, vì quá căng thẳng nên đầu óc tớ trống rỗng, ngay cả tên mình cũng nói không trôi.\nA:そんなに？ でも、 質問(しつもん)には 答(こた)えられたんでしょう？=Đến mức đó cơ á? Nhưng cậu vẫn trả lời được các câu hỏi chứ?\nB:うん。 途中(とちゅう)からは 落(お)ち着(つ)いて 話(はな)せたよ。 でも、 結果(けっか)が 心配(しんぱい)で、 昨日(きのう)の 夜(よる)は 眠(ねむ)れなかった。=Ừ. Từ giữa chừng thì tớ bình tĩnh nói được. Nhưng lo kết quả quá nên tối qua không ngủ được.\n?男(おとこ)の 人(ひと)の 面接(めんせつ)は どうでしたか。|はじめは 緊張(きんちょう)したが、 途中(とちゅう)から 落(お)ち着(つ)いて 話(はな)せた|最後(さいご)まで 何(なに)も 話(はな)せなかった|緊張(きんちょう)しないで、 上手(じょうず)に 話(はな)せた|質問(しつもん)に 一(ひと)つも 答(こた)えられなかった\n##58 Chính vì là bạn thân\nA:田中(たなか)さんに 「発表(はっぴょう)の 準備(じゅんび)が 足(た)りない」と 言(い)われて、 ちょっと ショックだったよ。=Bị Tanaka nói là \"chuẩn bị cho bài thuyết trình chưa đủ\", tớ hơi sốc đấy.\nB:田中(たなか)さんは 親友(しんゆう)だからこそ、 言(い)いにくい ことも はっきり 言(い)ってくれるんだよ。=Chính vì là bạn thân nên Tanaka mới nói thẳng với cậu cả những điều khó nói đấy.\nA:そうか。 確(たし)かに、 ほかの 人(ひと)は 何(なに)も 言(い)ってくれなかった。=Ra vậy. Đúng là những người khác chẳng ai nói gì với tớ cả.\nB:でしょう？ 発表(はっぴょう)まで まだ 3日(みっか) あるから、 もう 一(いち)度(ど) 準備(じゅんび)を やり直(なお)したら どう？=Thấy chưa? Đến buổi thuyết trình vẫn còn 3 ngày, cậu thử chuẩn bị lại lần nữa xem sao?\n?女(おんな)の 人(ひと)は、 田中(たなか)さんが はっきり 言(い)ったのは どう してだと 思(おも)っていますか。|親友(しんゆう)だから|発表(はっぴょう)が 上手(じょうず)だから|準備(じゅんび)を 手伝(てつだ)いたくないから|ほかの 人(ひと)に 頼(たの)まれたから\n##59 Đã tham gia thì phải hết mình\nA:来月(らいげつ)の スピーチ大会(たいかい)に 出(で)る ことに したんだって？=Nghe nói cậu quyết định tham gia cuộc thi hùng biện tháng sau à?\nB:うん。 出(で)るからには、 優勝(ゆうしょう)を 目指(めざ)して 頑張(がんば)る つもりだよ。=Ừ. Một khi đã tham gia thì tớ định cố gắng nhắm tới chức vô địch.\nA:すごいね。 練習(れんしゅう)は もう 始(はじ)めたの？=Giỏi quá. Cậu bắt đầu luyện tập chưa?\nB:まだ 話(はな)す 内容(ないよう)を 考(かんが)えている 途中(とちゅう)なんだ。 今週(こんしゅう)中(ちゅう)に 内容(ないよう)を 決(き)めて、 来週(らいしゅう)から 毎日(まいにち) 声(こえ)に 出(だ)して 練習(れんしゅう)するよ。=Tớ vẫn đang nghĩ dở nội dung sẽ nói. Trong tuần này tớ sẽ chốt nội dung, rồi từ tuần sau ngày nào cũng đọc to để luyện.\n?男(おとこ)の 人(ひと)は 今週(こんしゅう) 何(なに)を しますか。|スピーチの 内容(ないよう)を 決(き)める|毎日(まいにち) 声(こえ)に 出(だ)して 練習(れんしゅう)する|スピーチ大会(たいかい)に 出(で)る|スピーチ大会(たいかい)に 申(もう)し込(こ)む\n##60 Quán mới trước ga\nA:駅前(えきまえ)に 新(あたら)しく できた レストラン、 もう 行(い)った？=Nhà hàng mới mở trước ga ấy, cậu đi chưa?\nB:うん、 先週(せんしゅう) 行(い)ったよ。 料理(りょうり)が おいしい うえに、 量(りょう)も 多(おお)くて、 すごく 気(き)に 入(い)った。 店(みせ)の 雰囲気(ふんいき)も おしゃれだったよ。=Rồi, tuần trước tớ đi rồi. Đồ ăn đã ngon, lượng lại nhiều, tớ rất ưng. Không khí trong quán cũng sang nữa.\nA:へえ。 値段(ねだん)は どう？ 高(たか)いんじゃない？=Ồ. Giá thì sao? Chắc đắt nhỉ?\nB:昼(ひる)は 1000円(えん)ぐらいで 食(た)べられるよ。 ただ、 夜(よる)は 高(たか)い うえに 予約(よやく)も 必要(ひつよう)だから、 行(い)くなら 昼(ひる)が いいと 思(おも)う。=Buổi trưa thì khoảng 1000 yên là ăn được. Có điều buổi tối đã đắt lại còn phải đặt trước, nên nếu đi thì tớ nghĩ nên đi buổi trưa.\n?男(おとこ)の 人(ひと)が 昼(ひる)に 行(い)く ことを すすめたのは どう してですか。|夜(よる)は 高(たか)くて、 予約(よやく)も 必要(ひつよう)だから|昼(ひる)の ほうが 量(りょう)が 多(おお)いから|夜(よる)は 料理(りょうり)が おいしくないから|昼(ひる)は 予約(よやく)すれば 安(やす)く なるから\n##61 Đau đến mức nào\nA:田中(たなか)さん、 歩(ある)き方(かた)が 変(へん)ですよ。 どう したんですか。=Anh Tanaka, dáng đi của anh lạ thế. Anh bị sao vậy?\nB:昨日(きのう)、 重(おも)い 荷物(にもつ)を 運(はこ)んだら、 腰(こし)が 痛(いた)く なって。 夜(よる)は、 叫(さけ)びたく なるほど 激(はげ)しい 痛(いた)みでした。=Hôm qua tôi bê đồ nặng rồi bị đau lưng. Đến đêm thì đau dữ dội đến mức muốn hét lên.\nA:それは 大変(たいへん)でしたね。 病院(びょういん)へは 行(い)きましたか。=Khổ thân anh quá. Anh đã đi bệnh viện chưa?\nB:ええ、 今朝(けさ)。 でも、 座(すわ)る 所(ところ)も ないくらい 混雑(こんざつ)していて、 2時間(じかん)も 待(ま)ちました。=Rồi, sáng nay. Nhưng bệnh viện đông đến mức không có cả chỗ ngồi, tôi phải đợi tận 2 tiếng.\n?田中(たなか)さんの 腰(こし)は どう して 痛(いた)く なりましたか。|重(おも)い 荷物(にもつ)を 運(はこ)んだから|病院(びょういん)で 2時間(じかん)も 立(た)っていたから|長(なが)い 時間(じかん) 座(すわ)っていたから|昨日(きのう) たくさん 歩(ある)いたから\n##62 Không gì bằng\nA:山田(やまだ)さんの 趣味(しゅみ)は 登山(とざん)だ そうですね。=Nghe nói sở thích của anh Yamada là leo núi nhỉ.\nB:ええ。 頂上(ちょうじょう)から 見(み)る 眺(なが)めほど 素晴(すば)らしい ものは ないと 思(おも)っています。=Vâng. Tôi nghĩ không gì tuyệt bằng quang cảnh nhìn từ đỉnh núi.\nA:でも、 登(のぼ)るのは 大変(たいへん)でしょう。 私(わたし)は、 家(いえ)で 本(ほん)を 読(よ)む ことほど 楽(たの)しい ことは ないんですが。=Nhưng leo núi thì vất vả lắm chứ. Với tôi thì không gì vui bằng ở nhà đọc sách.\nB:確(たし)かに 疲(つか)れますが、 頂上(ちょうじょう)で 飲(の)む コーヒーも おいしいですよ。 今度(こんど)、 一緒(いっしょ)に どうですか。=Đúng là mệt thật, nhưng cà phê uống trên đỉnh núi cũng ngon lắm đấy. Lần tới mình đi cùng nhé?\n?山田(やまだ)さんは、 何(なに)が いちばん 素晴(すば)らしいと 言(い)っていますか。|頂上(ちょうじょう)から 見(み)る 眺(なが)め|頂上(ちょうじょう)で 飲(の)む コーヒー|家(いえ)で 本(ほん)を 読(よ)む こと|友達(ともだち)と 山(やま)に 登(のぼ)る こと\n##63 Càng luyện càng giỏi\nA:キムさん、 日本(にほん)語(ご)の 発音(はつおん)が きれいに なりましたね。=Bạn Kim này, phát âm tiếng Nhật của bạn hay lên rồi đấy.\nB:ありがとうございます。 毎日(まいにち)、 ニュースを 聞(き)いて、 同(おな)じ 文(ぶん)を 繰(く)り返(かえ)して 言(い)う 練習(れんしゅう)を しているんです。=Em cảm ơn ạ. Ngày nào em cũng nghe tin tức rồi tập nói lặp đi lặp lại cùng một câu.\nA:いい 方法(ほうほう)ですね。 発音(はつおん)は、 声(こえ)に 出(だ)せば 出(だ)すほど よく なりますから。=Cách hay đấy. Phát âm thì càng nói thành tiếng càng tốt lên mà.\nB:はい。 でも、 漢字(かんじ)は 数(かず)が 増(ふ)えれば 増(ふ)えるほど 忘(わす)れやすく なるので、 毎晩(まいばん) 復習(ふくしゅう)する ことに しました。=Vâng. Nhưng chữ Hán thì số lượng càng tăng càng dễ quên, nên em quyết định tối nào cũng ôn lại.\n?キムさんは、 発音(はつおん)の ために どんな 練習(れんしゅう)を していますか。|ニュースを 聞(き)いて、 同(おな)じ 文(ぶん)を 繰(く)り返(かえ)して 言(い)う|毎晩(まいばん) 漢字(かんじ)を 復習(ふくしゅう)する|日本(にほん)人(じん)の 友達(ともだち)と 毎日(まいにち) 話(はな)す|ニュースを 見(み)て、 漢字(かんじ)を 書(か)く\n##64 So với giá tiền\nA:この 店(みせ)の ランチ、 500円(えん)なのに おいしいね。=Bữa trưa ở quán này có 500 yên mà ngon nhỉ.\nB:うん。 値段(ねだん)の わりに 量(りょう)も 多(おお)いし、 すごく お得(とく)だよね。=Ừ. So với giá thì lượng cũng nhiều, hời thật đấy.\nA:でも、 安(やす)くて おいしい わりには、 お客(きゃく)さんが 少(すく)ないね。 どう してかな。=Nhưng rẻ và ngon thế mà khách lại ít nhỉ. Sao vậy ta?\nB:駅(えき)から 遠(とお)いからじゃない？ もっと 近(ちか)ければ、 毎日(まいにち) 行列(ぎょうれつ)が できると 思(おも)うよ。=Chắc tại xa ga chứ gì? Nếu gần hơn thì tớ nghĩ ngày nào cũng có người xếp hàng đấy.\n?この 店(みせ)に 客(きゃく)が 少(すく)ないのは、 どう してだと 言(い)っていますか。|駅(えき)から 遠(とお)いから|値段(ねだん)が 高(たか)いから|量(りょう)が 少(すく)ないから|味(あじ)が よくないから\n##65 Người mới mà giỏi\nA:新人(しんじん)の 鈴木(すずき)さん、 入社(にゅうしゃ)して まだ 2か月(げつ)でしょう？=Cậu Suzuki, nhân viên mới ấy, vào công ty mới được 2 tháng thôi nhỉ?\nB:ええ。 2か月(げつ)に しては、 仕事(しごと)を よく 覚(おぼ)えていますね。=Vâng. Mới 2 tháng mà cậu ấy nắm việc tốt thật.\nA:電話(でんわ)の 話(はな)し方(かた)も、 新人(しんじん)に しては しっかり していますよ。=Cách nói chuyện điện thoại cũng vững vàng so với một người mới.\nB:学生(がくせい)の とき、 ホテルで 3年(ねん) アルバイトを していた そうです。 それで 慣(な)れているんですね。=Nghe nói hồi sinh viên cậu ấy làm thêm ở khách sạn 3 năm. Thế nên mới quen như vậy.\n?鈴木(すずき)さんの 電話(でんわ)の 話(はな)し方(かた)が しっかり しているのは、 どう してですか。|学生(がくせい)の とき、 ホテルで アルバイトを していたから|入社(にゅうしゃ)して 3年(ねん)に なるから|ベテランの 社員(しゃいん)に 習(なら)ったから|毎日(まいにち) 電話(でんわ)の 練習(れんしゅう)を しているから\n##66 Đã không làm mà còn chê\nA:ねえ、 聞(き)いてよ。 兄(あに)が また 私(わたし)の 料理(りょうり)に 文句(もんく)を 言(い)ったの。=Này, nghe tớ kể đi. Anh tớ lại chê món tớ nấu đấy.\nB:お兄(にい)さん、 自分(じぶん)では 作(つく)らない くせに、 文句(もんく)は 言(い)うんだね。=Anh cậu tự mình thì không nấu mà lại hay chê nhỉ.\nA:そう。 何(なに)も 手伝(てつだ)わない くせに、 味(あじ)が 薄(うす)いとか 偉(えら)そうに 言(い)うから、 腹(はら)が 立(た)って。=Đúng thế. Chẳng giúp gì mà còn lên giọng bảo nhạt này nọ, nên tớ tức lắm.\nB:じゃ、 今度(こんど)は お兄(にい)さんに 作(つく)ってもらったら？ きっと 黙(だま)ると 思(おも)うよ。=Thế lần tới bảo anh ấy nấu xem sao? Tớ nghĩ chắc chắn anh ấy sẽ im thôi.\n?女(おんな)の 人(ひと)は どう して 怒(おこ)っていますか。|料理(りょうり)を しない 兄(あに)が、 味(あじ)に 文句(もんく)を 言(い)うから|兄(あに)が 料理(りょうり)を 作(つく)ってくれないから|兄(あに)の 作(つく)った 料理(りょうり)が おいしくないから|兄(あに)が 黙(だま)って 何(なに)も 言(い)わないから\n##67 Đổi ca làm thêm\nA:来週(らいしゅう)の 土曜日(どようび)、 アルバイトを かわってくれない？ 急(きゅう)に 用事(ようじ)が できたんだ。=Thứ Bảy tuần sau cậu làm thay ca cho tớ được không? Tớ có việc đột xuất.\nB:いいよ。 その かわりに、 日曜日(にちようび)は 私(わたし)の かわりに 働(はたら)いてくれる？=Được thôi. Đổi lại, Chủ nhật cậu làm thay tớ nhé?\nA:日曜日(にちようび)は 試験(しけん)の 前(まえ)の 日(ひ)だから、 無理(むり)なんだ。 働(はたら)く かわりに、 今度(こんど) 昼(ひる)ご飯(はん)を ごちそうするよ。=Chủ nhật là ngày trước hôm thi nên tớ không làm được. Thay vì đi làm, hôm nào tớ mời cậu bữa trưa nhé.\nB:じゃあ、 それで いいよ。 お礼(れい)は 駅前(えきまえ)に できた 新(あたら)しい 店(みせ)が いいな。=Thế cũng được. Quà cảm ơn thì tớ thích quán mới mở trước ga.\n?男(おとこ)の 人(ひと)は、 かわってもらう お礼(れい)に 何(なに)を しますか。|昼(ひる)ご飯(はん)を ごちそうする|日曜日(にちようび)に かわりに 働(はたら)く|試験(しけん)の 勉強(べんきょう)を 手伝(てつだ)う|新(あたら)しい 店(みせ)で アルバイトを する\n##68 Đi đón khách thay đồng nghiệp\nA:部長(ぶちょう)、 明日(あした)の 空港(くうこう)への お迎(むか)えですが、 担当(たんとう)の 田中(たなか)さんが 熱(ねつ)を 出(だ)した そうです。=Thưa trưởng phòng, về việc ra sân bay đón khách ngày mai, nghe nói anh Tanaka phụ trách bị sốt rồi ạ.\nB:そうか。 じゃあ、 田中(たなか)さんに かわって、 君(きみ)が 行(い)ってくれないか。=Vậy à. Thế thì cô đi thay anh Tanaka được không?\nA:はい、 わかりました。 お客(きゃく)様(さま)は 何時(なんじ)に 着(つ)かれますか。=Vâng, tôi hiểu rồi ạ. Khách mấy giờ đến ạ?\nB:午後(ごご) 2時(じ)だ。 1時(じ)半(はん)には 空港(くうこう)に 着(つ)いていてほしいから、 12時(じ)に 会社(かいしゃ)を 出(で)てくれ。=2 giờ chiều. Tôi muốn cô có mặt ở sân bay muộn nhất là 1 rưỡi, nên hãy rời công ty lúc 12 giờ nhé.\n?女(おんな)の 人(ひと)は 明日(あした)、 何時(なんじ)に 会社(かいしゃ)を 出(で)ますか。|12時(じ)|1時(じ)半(はん)|2時(じ)|2時(じ)半(はん)\n##69 Thành thị và nông thôn\nA:私(わたし)の 故郷(こきょう)は 農村(のうそん)で、 若(わか)い 人(ひと)が どんどん 村(むら)を 離(はな)れているんです。=Quê tôi ở nông thôn, người trẻ đang ào ào rời làng.\nB:都市(とし)に 人(ひと)が 集中(しゅうちゅう)する 一方(いっぽう)で、 地方(ちほう)では 人口(じんこう)の 減少(げんしょう)が 問題(もんだい)に なっていますね。=Trong khi người dồn về đô thị thì ở địa phương, dân số giảm đang thành vấn đề nhỉ.\nA:ええ。 でも 最近(さいきん)は、 自然(しぜん)が 豊(ゆた)かな 所(ところ)で 農業(のうぎょう)を したいと いう 人(ひと)も、 少(すこ)しずつ 増(ふ)えている そうです。=Vâng. Nhưng nghe nói gần đây số người muốn làm nông ở nơi thiên nhiên phong phú cũng đang tăng dần.\nB:それは いいですね。 私(わたし)も 年(とし)を 取(と)ったら、 田舎(いなか)で 暮(く)らしてみたいです。=Thế thì hay quá. Tôi cũng muốn khi về già thử sống ở quê.\n?女(おんな)の 人(ひと)の 故郷(こきょう)では、 どんな ことが 起(お)きていますか。|若(わか)い 人(ひと)が 村(むら)を 出(で)ていく|お年寄(としよ)りが 減(へ)っている|人(ひと)が 集中(しゅうちゅう)している|農業(のうぎょう)を する 人(ひと)が いなく なった\n##70 Hai mặt của điện thoại\nA:最近(さいきん)、 息子(むすこ)が スマホの 画面(がめん)ばかり 見(み)ていて、 心配(しんぱい)なんです。=Dạo này con trai tôi cứ dán mắt vào màn hình điện thoại, tôi lo lắm.\nB:スマホは 便利(べんり)な 反面(はんめん)、 使(つか)いすぎると 目(め)にも 勉強(べんきょう)にも よく ないですからね。=Điện thoại thì tiện, nhưng mặt trái là dùng nhiều quá sẽ không tốt cho cả mắt lẫn việc học.\nA:でも、 無理(むり)に やめさせたら、 かえって 隠(かく)れて 使(つか)う ように なりそうで…。=Nhưng nếu ép nó bỏ thì e là nó lại lén dùng...\nB:うちでは、 夜(よる) 9時(じ)からは 使(つか)わないと いう ルールを 決(き)めています。 やめさせるより、 親子(おやこ)で 話(はな)し合(あ)って 決(き)めた ほうが いいですよ。=Nhà tôi thì đặt quy tắc là từ 9 giờ tối không dùng nữa. Bố mẹ và con cùng bàn bạc rồi quyết định thì tốt hơn là bắt nó bỏ.\n?男(おとこ)の 人(ひと)が すすめた ことは 何(なん)ですか。|親子(おやこ)で 話(はな)し合(あ)って ルールを 決(き)める こと|スマホを やめさせる こと|新(あたら)しい スマホを 買(か)う こと|夜(よる) 9時(じ)まで 勉強(べんきょう)させる こと\n##71 Trận chung kết bất ngờ\nA:昨日(きのう)の 決勝(けっしょう)、 見(み)た？ 予想(よそう)に 反(はん)して、 東(ひがし)高校(こうこう)が 勝(か)ったね。=Cậu xem trận chung kết hôm qua chưa? Trái với dự đoán, trường Higashi thắng nhỉ.\nB:うん、 意外(いがい)だった。 みんな 西(にし)高校(こうこう)が 優勝(ゆうしょう)すると 思(おも)っていたのに。=Ừ, bất ngờ thật. Ai cũng nghĩ trường Nishi sẽ vô địch cơ mà.\nA:西(にし)高校(こうこう)は 実力(じつりょく)は 上(うえ)だったけど、 緊張(きんちょう)して ミスが 多(おお)かったね。=Trường Nishi thực lực nhỉnh hơn, nhưng vì căng thẳng nên mắc nhiều lỗi.\nB:東(ひがし)高校(こうこう)は 最後(さいご)まで 冷静(れいせい)だった。 それが 勝(か)てた 理由(りゆう)だと 思(おも)うよ。=Trường Higashi thì bình tĩnh đến phút cuối. Tớ nghĩ đó là lý do họ thắng được.\n?女(おんな)の 人(ひと)は、 東(ひがし)高校(こうこう)が 勝(か)った 理由(りゆう)は 何(なん)だと 言(い)っていますか。|最後(さいご)まで 冷静(れいせい)だったから|実力(じつりょく)が 上(うえ)だったから|応援(おうえん)が 多(おお)かったから|相手(あいて)が 弱(よわ)かったから\n##72 Mỗi người một cách sống\nA:姉(あね)は 30歳(さい)に なっても 独身(どくしん)なので、 母(はは)が 心配(しんぱい)しているんです。=Chị tôi 30 tuổi rồi vẫn độc thân nên mẹ tôi lo lắm.\nB:結婚(けっこん)していないからと いって、 幸(しあわ)せでは ないとは 限(かぎ)りませんよ。=Không phải cứ chưa kết hôn là không hạnh phúc đâu.\nA:そうですね。 姉(あね)は 仕事(しごと)も 趣味(しゅみ)も 楽(たの)しんでいて、 毎日(まいにち) 忙(いそが)しそうです。=Đúng vậy. Chị tôi tận hưởng cả công việc lẫn sở thích, ngày nào trông cũng bận rộn.\nB:生(い)き方(かた)は 人(ひと) それぞれですから、 ほかの 人(ひと)と 比(くら)べなくても いいと 思(おも)います。=Mỗi người có một cách sống riêng, nên tôi nghĩ không cần so với người khác.\n?男(おとこ)の 人(ひと)の 考(かんが)えに 合(あ)う ものは どれですか。|生(い)き方(かた)は 人(ひと)に よって 違(ちが)って いい|30歳(さい)までに 結婚(けっこん)した ほうが いい|独身(どくしん)の 人(ひと)は 幸(しあわ)せでは ない|仕事(しごと)より 結婚(けっこん)の ほうが 大切(たいせつ)だ\n##73 Dự báo thời tiết\nA:明日(あした)の 運動(うんどう)会(かい)、 できるかな。=Hội thao ngày mai không biết có tổ chức được không nhỉ.\nB:今朝(けさ)の ニュースに よると、 午後(ごご)から 雨(あめ)で、 雷(かみなり)も 鳴(な)る そうだよ。=Theo bản tin sáng nay thì từ chiều trời mưa, nghe nói còn có sấm nữa.\nA:えっ、 困(こま)ったな。 じゃ、 中止(ちゅうし)に なるの？=Hả, gay nhỉ. Vậy là bị huỷ à?\nB:先生(せんせい)の 話(はなし)に よれば、 午前(ごぜん)中(ちゅう)だけ やって、 残(のこ)りは 来週(らいしゅう)に するらしいよ。=Theo lời thầy thì chỉ làm buổi sáng, phần còn lại để sang tuần sau.\n?明日(あした)の 運動(うんどう)会(かい)は どう なりますか。|午前(ごぜん)中(ちゅう)だけ 行(おこな)う|中止(ちゅうし)に なる|午後(ごご)から 始(はじ)める|全部(ぜんぶ) 来週(らいしゅう)に する\n##74 Tính lương làm thêm\nA:店長(てんちょう)、 アルバイトの 給料(きゅうりょう)は どう やって 決(き)まるんですか。=Quản lý ơi, lương làm thêm được tính thế nào ạ?\nB:働(はたら)いた 時間(じかん)の データに 基(もと)づいて 計算(けいさん)します。 1時間(じかん) 1100円(えん)ですよ。=Tính dựa trên dữ liệu số giờ đã làm. 1 tiếng 1100 yên.\nA:夜(よる) 遅(おそ)く 働(はたら)いた 場合(ばあい)も 同(おな)じですか。=Làm khuya thì cũng vậy ạ?\nB:いいえ。 法律(ほうりつ)に 基(もと)づいて、 夜(よる) 10時(じ)からは 25パーセント 多(おお)く 払(はら)います。=Không. Theo pháp luật, từ 10 giờ đêm chúng tôi trả thêm 25 phần trăm.\n?夜(よる) 10時(じ)からの 給料(きゅうりょう)は どう なりますか。|いつもより 25パーセント 多(おお)く なる|いつもと 同(おな)じ|いつもより 25パーセント 少(すく)なく なる|店長(てんちょう)が その 日(ひ)に 決(き)める\n##75 Phim dựa trên chuyện thật\nA:昨日(きのう) 見(み)た 映画(えいが)、 とても よかったよ。 主人公(しゅじんこう)は 小(ちい)さな 村(むら)の 医者(いしゃ)なんだ。=Bộ phim hôm qua tớ xem hay lắm. Nhân vật chính là bác sĩ ở một ngôi làng nhỏ.\nB:へえ。 それは 作(つく)り話(ばなし)？=Ồ. Đó là chuyện hư cấu à?\nA:ううん、 事実(じじつ)を もとに した 作品(さくひん)なんだ。 監督(かんとく)が その 医者(いしゃ)の 日記(にっき)を 読(よ)んで、 映画(えいが)に したんだって。=Không, là tác phẩm dựa trên sự thật. Nghe nói đạo diễn đọc nhật ký của vị bác sĩ đó rồi dựng thành phim.\nB:面白(おもしろ)そうだね。 今度(こんど)の 日曜日(にちようび)に 見(み)に 行(い)ってみるよ。=Nghe hay nhỉ. Chủ nhật này tớ sẽ đi xem thử.\n?この 映画(えいが)は 何(なに)を もとに して 作(つく)られましたか。|医者(いしゃ)が 書(か)いた 日記(にっき)|監督(かんとく)が 書(か)いた 小説(しょうせつ)|有名(ゆうめい)な 昔話(むかしばなし)|村(むら)の 人(ひと)たちの うわさ\n##76 Nhận xét bài nói\nA:先生(せんせい)、 私(わたし)の スピーチは どうでしたか。=Thưa cô, bài nói của em thế nào ạ?\nB:全体(ぜんたい)から 見(み)ると、 とても よかったですよ。 特(とく)に、 声(こえ)が 大(おお)きいのは 長所(ちょうしょ)ですね。=Nhìn tổng thể thì rất tốt. Đặc biệt giọng to là điểm mạnh của em.\nA:ありがとうございます。 短所(たんしょ)は 何(なん)でしょうか。=Em cảm ơn cô. Còn điểm yếu là gì ạ?\nB:聞(き)く 人(ひと)の 立場(たちば)から 言(い)うと、 話(はな)すのが 少(すこ)し 速(はや)かったですね。 もう 少(すこ)し ゆっくり 話(はな)してみてください。=Xét từ phía người nghe thì em nói hơi nhanh. Em thử nói chậm hơn một chút nhé.\n?先生(せんせい)は どんな アドバイスを しましたか。|もう 少(すこ)し ゆっくり 話(はな)す こと|もっと 大(おお)きい 声(こえ)で 話(はな)す こと|スピーチを もっと 短(みじか)く する こと|聞(き)く 人(ひと)の 顔(かお)を 見(み)る こと\n##77 Lắp kệ\nA:この 棚(たな)、 説明(せつめい)書(しょ)の とおりに 組(く)み立(た)てたのに、 引(ひ)き出(だ)しが うまく 入(はい)らないんだ。=Cái kệ này tớ lắp đúng theo sách hướng dẫn mà ngăn kéo không lắp vừa.\nB:見(み)せて。 あ、 部品(ぶひん)を つける 順番(じゅんばん)が 違(ちが)うよ。 3番(ばん)より 先(さき)に 4番(ばん)を つけてしまったでしょう。=Cho tớ xem nào. À, thứ tự gắn linh kiện sai rồi. Cậu gắn số 4 trước số 3 đúng không.\nA:本当(ほんとう)だ。 じゃ、 全部(ぜんぶ) やり直(なお)さないと いけない？=Đúng thật. Vậy phải làm lại hết à?\nB:ううん、 上(うえ)の 板(いた)だけ 外(はず)して、 番号(ばんごう)どおりに つければ 大丈夫(だいじょうぶ)だよ。=Không, chỉ cần tháo tấm ván trên ra rồi gắn theo đúng số là được.\n?引(ひ)き出(だ)しが 入(はい)らないのは どう してですか。|部品(ぶひん)を つける 順番(じゅんばん)を 間違(まちが)えたから|部品(ぶひん)が 足(た)りなかったから|説明(せつめい)書(しょ)を 読(よ)まなかったから|引(ひ)き出(だ)しが 壊(こわ)れていたから\n##78 Thói quen mới\nA:最近(さいきん)、 元気(げんき)そうですね。 何(なに)か 始(はじ)めたんですか。=Dạo này trông anh khoẻ nhỉ. Anh mới bắt đầu tập gì à?\nB:ええ。 去年(きょねん)の 入院(にゅういん)を きっかけに、 毎朝(まいあさ) ジョギングを する ように なったんです。=Vâng. Từ lần nhập viện năm ngoái, sáng nào tôi cũng chạy bộ.\nA:すごいですね。 私(わたし)も 何(なに)か 始(はじ)めたいんですが、 なかなか 続(つづ)かなくて。=Giỏi quá. Tôi cũng muốn bắt đầu việc gì đó nhưng mãi không duy trì được.\nB:小(ちい)さい 目標(もくひょう)を 決(き)めると いいですよ。 私(わたし)は 最初(さいしょ)、 1日(にち) 10分(ぷん)だけ 走(はし)る ことに していました。=Anh nên đặt mục tiêu nhỏ thôi. Lúc đầu, tôi tự đặt ra là mỗi ngày chỉ chạy 10 phút thôi.\n?ジョギングを 始(はじ)めた きっかけは 何(なん)ですか。|去年(きょねん) 入院(にゅういん)した こと|友達(ともだち)に 誘(さそ)われた こと|小(ちい)さい 目標(もくひょう)を 決(き)めた こと|体重(たいじゅう)が 増(ふ)えた こと\n##79 Từ khi chuyển công tác\nA:久(ひさ)しぶり。 会(あ)うのは、 長野(ながの)に 転勤(てんきん)して 以来(いらい)だね。 向(む)こうの 生活(せいかつ)は どう？=Lâu lắm mới gặp. Từ hồi cậu chuyển công tác đi Nagano đến giờ mới gặp lại nhỉ. Cuộc sống bên đó thế nào?\nB:静(しず)かで いい 所(ところ)だよ。 もう すっかり 慣(な)れた。 ただ、 実家(じっか)を 離(はな)れて 以来(いらい)、 母(はは)の 料理(りょうり)が 食(た)べられなくて さびしいんだ。=Chỗ đó yên tĩnh, dễ chịu lắm. Tớ quen hẳn rồi. Có điều từ khi rời nhà bố mẹ, không được ăn cơm mẹ nấu nên thấy buồn.\nA:じゃ、 自分(じぶん)で 作(つく)っているの？=Thế cậu tự nấu à?\nB:うん。 引(ひ)っ越(こ)して 以来(いらい)、 毎晩(まいばん) 作(つく)っているよ。 でも、 通勤(つうきん)に 1時間(じかん)半(はん)も かかるから、 朝(あさ)は パンだけなんだ。=Ừ. Từ khi chuyển nhà tối nào tớ cũng nấu. Nhưng đi làm mất tận 1 tiếng rưỡi nên buổi sáng chỉ ăn bánh mì thôi.\n?男(おとこ)の 人(ひと)は 転勤(てんきん)してから、 食事(しょくじ)を どう していますか。|夜(よる)は 毎日(まいにち) 自分(じぶん)で 作(つく)っている|朝(あさ)も 夜(よる)も 自分(じぶん)で 作(つく)っている|毎晩(まいばん) 外(そと)で 食(た)べている|母(はは)に 料理(りょうり)を 送(おく)ってもらっている\n##80 Ra ở riêng mới biết\nA:一人暮(ひとりぐ)らしを 始(はじ)めて、 もう 1か月(げつ)だね。 どう？=Cậu bắt đầu sống một mình được 1 tháng rồi nhỉ. Thế nào?\nB:掃除(そうじ)も 洗濯(せんたく)も 全部(ぜんぶ) 自分(じぶん)で やるから、 思(おも)ったより つらいよ。=Dọn dẹp, giặt giũ đều phải tự làm hết nên vất vả hơn tớ nghĩ.\nA:私(わたし)も そうだった。 家(いえ)を 出(で)て はじめて、 母(はは)が 毎日(まいにち) どんなに 大変(たいへん)だったか 気(き)づいたよ。=Tớ cũng thế. Ra khỏi nhà rồi tớ mới nhận ra ngày nào mẹ cũng vất vả đến thế nào.\nB:本当(ほんとう)だね。 今度(こんど) 実家(じっか)に 帰(かえ)ったら、 母(はは)に 改(あらた)めて 「ありがとう」と 言(い)う つもりだよ。=Đúng thật. Lần tới về nhà, tớ định sẽ nói với mẹ một lời cảm ơn cho đàng hoàng.\n?男(おとこ)の 人(ひと)は 今度(こんど) 実家(じっか)に 帰(かえ)ったら、 何(なに)を する つもりですか。|母(はは)に お礼(れい)を 言(い)う|母(はは)に 料理(りょうり)を 習(なら)う|掃除(そうじ)と 洗濯(せんたく)を 手伝(てつだ)う|一人暮(ひとりぐ)らしを やめる\n##81 Xin phép đi làm thêm\nA:先生(せんせい)、 来週(らいしゅう)から コンビニで アルバイトを 始(はじ)めたいんですが。=Thưa cô, em muốn bắt đầu làm thêm ở cửa hàng tiện lợi từ tuần sau ạ.\nB:留学(りゅうがく)生(せい)は、 許可(きょか)を もらってからで ないと、 働(はたら)けませんよ。 手続(てつづ)きは もう しましたか。=Du học sinh nếu chưa được cấp phép thì không được đi làm đâu. Em đã làm thủ tục chưa?\nA:いいえ、 まだです。 手続(てつづ)きは 複雑(ふくざつ)ですか。=Dạ chưa ạ. Thủ tục có phức tạp không ạ?\nB:いいえ、 簡単(かんたん)ですよ。 まず、 この 書類(しょるい)に 記入(きにゅう)して、 事務(じむ)室(しつ)の 窓口(まどぐち)に 提出(ていしゅつ)してください。 許可(きょか)が 出(で)るまで、 2週間(しゅうかん)ぐらい かかりますよ。=Không, đơn giản thôi. Trước hết em điền vào giấy này rồi nộp ở quầy của phòng hành chính. Mất khoảng 2 tuần mới có giấy phép đấy.\n?学生(がくせい)は これから まず 何(なに)を しますか。|書類(しょるい)に 記入(きにゅう)して 窓口(まどぐち)に 出(だ)す|コンビニで アルバイトを 始(はじ)める|2週間(しゅうかん) 待(ま)ってから 書類(しょるい)を もらう|コンビニの 店長(てんちょう)に 許可(きょか)を もらう\n##82 Ở quầy lễ tân khách sạn\nA:いらっしゃいませ。 ご宿泊(しゅくはく)の 山田(やまだ)様(さま)ですね。 お部屋(へや)は 5階(かい)で ございます。=Xin chào quý khách. Quý khách là ông Yamada nghỉ tại khách sạn đúng không ạ. Phòng của quý khách ở tầng 5.\nB:どうも。 あの、 これから 出(で)かけたいんですが、 かぎは どう すれば いいですか。=Cảm ơn. À, bây giờ tôi muốn ra ngoài, chìa khoá thì làm thế nào ạ?\nA:外出(がいしゅつ)の 際(さい)は、 フロントに お預(あず)けください。 貴重品(きちょうひん)も こちらで お預(あず)かり できます。=Khi ra ngoài, xin quý khách gửi ở quầy lễ tân. Đồ quý giá chúng tôi cũng có thể giữ giúp ạ.\nB:じゃ、 かぎだけ お願(ねが)いします。 貴重品(きちょうひん)は 自分(じぶん)で 持(も)っていきます。=Vậy cho tôi gửi chìa khoá thôi. Đồ quý giá tôi tự mang theo.\n?客(きゃく)は 出(で)かける とき、 どう しますか。|かぎだけ フロントに 預(あず)ける|かぎと 貴重品(きちょうひん)を フロントに 預(あず)ける|かぎも 貴重品(きちょうひん)も 持(も)って 出(で)かける|貴重品(きちょうひん)だけ フロントに 預(あず)ける\n##83 Hỏi thử thì hoá ra\nA:パソコンの 故障(こしょう)、 直(なお)りましたか。=Máy tính bị hỏng của anh sửa được chưa?\nB:ええ。 店(みせ)に 聞(き)いてみた ところ、 修理(しゅうり)に 3万(まん)円(えん)も かかると 言(い)われたんです。=Rồi ạ. Tôi hỏi thử cửa hàng thì họ bảo sửa mất tận 3 vạn yên.\nA:えっ、 高(たか)いですね。 それで、 払(はら)ったんですか。=Hả, đắt thế. Rồi anh trả à?\nB:いいえ。 試(ため)しに インターネットで 調(しら)べて、 自分(じぶん)で やってみた ところ、 意外(いがい)に 簡単(かんたん)に 直(なお)りました。 お金(かね)は 全然(ぜんぜん) かかりませんでした。=Không. Tôi thử tra trên mạng rồi tự làm thì sửa được dễ không ngờ. Chẳng tốn đồng nào cả.\n?パソコンは どう なりましたか。|男(おとこ)の 人(ひと)が 調(しら)べて 自分(じぶん)で 直(なお)した|店(みせ)に 3万(まん)円(えん) 払(はら)って 直(なお)してもらった|友達(ともだち)に 無料(むりょう)で 直(なお)してもらった|新(あたら)しい パソコンを 買(か)った\n##84 Suýt nữa thì gặp tai nạn\nA:どう したの？ 顔色(かおいろ)が 悪(わる)いよ。=Sao thế? Sắc mặt cậu kém quá.\nB:さっき、 駅前(えきまえ)の 交差(こうさ)点(てん)で、 もう 少(すこ)しで 車(くるま)に ぶつかる ところだったんだ。=Lúc nãy ở ngã tư trước ga, tớ suýt nữa thì va phải ô tô.\nA:えっ、 無事(ぶじ)で よかった。 信号(しんごう)は 青(あお)だったの？=Hả, may mà cậu không sao. Lúc đó đèn xanh à?\nB:ううん、 赤(あか)だった。 スマホを 見(み)ていて、 気(き)づかなかったんだ。 車(くるま)が 止(と)まってくれなかったら、 大(おお)けがを する ところだったよ。=Không, đèn đỏ. Tớ mải nhìn điện thoại nên không để ý. Nếu xe không dừng lại cho thì tớ đã suýt bị thương nặng rồi.\n?男(おとこ)の 人(ひと)は どう して 車(くるま)に ぶつかりそうに なりましたか。|スマホを 見(み)ていて、 赤(あか)信号(しんごう)に 気(き)づかなかったから|車(くるま)が 信号(しんごう)を 守(まも)らなかったから|急(いそ)いでいて、 走(はし)って 道(みち)を 渡(わた)ったから|車(くるま)が 急(きゅう)に 曲(ま)がってきたから\n##85 Ăn không hết\nA:この 店(みせ)の ラーメン、 量(りょう)が 多(おお)いね。 私(わたし)には 食(た)べきれないかも。=Mì ramen quán này nhiều thật. Chắc tớ ăn không hết mất.\nB:残(のこ)しても いいよ。 僕(ぼく)が 食(た)べるから。=Để thừa cũng được. Tớ ăn cho.\nA:本当(ほんとう)？ でも、 自分(じぶん)のも 大盛(おおも)りでしょう。=Thật á? Nhưng suất của cậu cũng là suất lớn mà.\nB:大丈夫(だいじょうぶ)。 今日(きょう)は 朝(あさ)から 何(なに)も 食(た)べていないから、 全部(ぜんぶ) 食(た)べきれるよ。=Không sao. Hôm nay từ sáng tớ chưa ăn gì nên ăn hết được tất.\n?男(おとこ)の 人(ひと)は どう して 全部(ぜんぶ) 食(た)べきれると 言(い)いましたか。|朝(あさ)から 何(なに)も 食(た)べていないから|ラーメンが 大好(だいす)きだから|ラーメンの 量(りょう)が 少(すく)ないから|女(おんな)の 人(ひと)が 少(すこ)ししか 残(のこ)さないから\n##86 Sách đọc dở\nA:あれ、 この 本(ほん)、 まだ 読(よ)みかけなの？ 先月(せんげつ) 貸(か)したのに。=Ơ, cuốn sách này cậu vẫn đang đọc dở à? Tớ cho mượn từ tháng trước rồi mà.\nB:ごめん。 途中(とちゅう)まで 読(よ)んだんだけど、 仕事(しごと)が 忙(いそが)しく なってしまって。=Xin lỗi. Tớ đọc được nửa chừng thì công việc lại bận lên.\nA:続(つづ)きが いちばん おもしろいのに。 いつ 読(よ)み終(お)わる？=Phần sau mới là hay nhất đấy. Bao giờ cậu đọc xong?\nB:今週(こんしゅう)の 土曜日(どようび)には 読(よ)み終(お)えて、 日曜日(にちようび)に 返(かえ)すよ。=Thứ Bảy tuần này tớ sẽ đọc xong, Chủ nhật tớ trả.\n?本(ほん)を 借(か)りた 人(ひと)は、 いつ 本(ほん)を 返(かえ)しますか。|日曜日(にちようび)|土曜日(どようび)|来月(らいげつ)|仕事(しごと)が 暇(ひま)に なった 日(ひ)\n##87 Mưa bất chợt\nA:わあ、 急(きゅう)に 降(ふ)り出(だ)したね。 さっきまで 晴(は)れていたのに。=Ôi, đột nhiên mưa rồi. Vừa nãy trời còn nắng mà.\nB:雷(かみなり)も 鳴(な)り出(だ)したよ。 傘(かさ)、 持(も)ってる？=Sấm cũng bắt đầu nổi rồi kìa. Cậu có mang ô không?\nA:ううん、 持(も)ってこなかった。 天気(てんき)予報(よほう)では 晴(は)れだったから。=Không, tớ không mang. Vì dự báo thời tiết bảo là nắng.\nB:にわか雨(あめ)だから、 すぐ 止(や)むと 思(おも)うよ。 あの 喫茶(きっさ)店(てん)で 待(ま)とうか。=Mưa rào thôi nên tớ nghĩ sẽ tạnh ngay. Mình vào quán cà phê kia đợi nhé?\n?傘(かさ)を 持(も)ってこなかったのは どう してですか。|天気(てんき)予報(よほう)では 晴(は)れだったから|すぐ 止(や)むと 思(おも)ったから|傘(かさ)を 喫茶(きっさ)店(てん)に 忘(わす)れたから|雷(かみなり)が 鳴(な)っていたから\n##88 Bật nguyên không tắt\nA:また エアコンを つけっぱなしで 出(で)かけたでしょう。=Anh lại để điều hoà bật nguyên rồi đi ra ngoài đúng không.\nB:ごめん。 急(いそ)いでいて、 消(け)すのを 忘(わす)れちゃった。=Xin lỗi em. Vội quá nên anh quên tắt mất.\nA:先月(せんげつ)は 電気(でんき)代(だい)が 1万(まん)円(えん)も かかったのよ。 無駄(むだ)でしょう。=Tháng trước tiền điện hết tận 1 vạn yên đấy. Lãng phí quá còn gì.\nB:わかった。 これからは 出(で)かける 前(まえ)に、 必(かなら)ず 確認(かくにん)する ように するよ。=Anh biết rồi. Từ giờ trước khi ra ngoài anh nhất định sẽ nhớ kiểm tra.\n?男(おとこ)の 人(ひと)は これから どう すると 言(い)いましたか。|出(で)かける 前(まえ)に エアコンを 確認(かくにん)する|エアコンを 使(つか)わない ように する|電気(でんき)代(だい)を 自分(じぶん)で 払(はら)う|急(いそ)いで 出(で)かけない ように する\n##89 Bánh mì mới ra lò\nA:いい 香(かお)りですね。 この パン、 焼(や)きたてですか。=Thơm quá. Bánh mì này vừa nướng xong ạ?\nB:はい、 5分(ふん) 前(まえ)に 焼(や)けたばかりです。 まだ 温(あたた)かいですよ。=Vâng, vừa ra lò cách đây 5 phút. Vẫn còn ấm đấy ạ.\nA:じゃ、 これを 3つ ください。 あ、 メロンパンは もう ないんですか。=Vậy cho tôi 3 cái này. À, bánh mì dưa lưới hết rồi ạ?\nB:すみません。 今(いま) 焼(や)いている ところですので、 10分(ぷん)ほど お待(ま)ち いただけますか。=Xin lỗi quý khách. Bánh đang nướng, quý khách vui lòng đợi khoảng 10 phút được không ạ?\n?メロンパンは 今(いま) どう なっていますか。|焼(や)いている ところだ|もう 売(う)り切(き)れて、 今日(きょう)は 買(か)えない|焼(や)きたてが 店(みせ)に 並(なら)んでいる|5分(ふん) 前(まえ)に 焼(や)けた\n##90 Ngày càng đắt đỏ\nA:山田(やまだ)さん、 最近(さいきん)、 何(なん)でも 高(たか)く なりましたね。 物価(ぶっか)は 上(あ)がる 一方(いっぽう)です。=Chị Yamada này, dạo này cái gì cũng đắt lên nhỉ. Vật giá ngày càng tăng.\nB:ええ。 給料(きゅうりょう)は 変(か)わらないのに、 生活(せいかつ)は 苦(くる)しく なる 一方(いっぽう)ですよ。=Vâng. Lương thì không đổi mà cuộc sống ngày càng chật vật.\nA:うちは 外食(がいしょく)を やめて、 毎日(まいにち) 弁当(べんとう)を 作(つく)る ことに しました。=Nhà tôi đã quyết định thôi ăn ngoài, ngày nào cũng tự làm cơm hộp.\nB:それは いいですね。 私(わたし)は まず、 タクシーに 乗(の)るのを やめようと 思(おも)います。=Hay đấy ạ. Còn tôi thì trước hết định thôi không đi taxi nữa.\n?山田(やまだ)さんは これから 何(なに)を しようと 思(おも)っていますか。|タクシーに 乗(の)るのを やめる|外食(がいしょく)を やめる|毎日(まいにち) 弁当(べんとう)を 作(つく)る|給料(きゅうりょう)の 高(たか)い 会社(かいしゃ)に 移(うつ)る\n##91 Nhớ không chịu được\nA:最近(さいきん)、 元気(げんき)が ないね。 どう したの？=Dạo này trông cậu không được vui. Có chuyện gì thế?\nB:国(くに)の 料理(りょうり)が 恋(こい)しくて たまらないんだ。 母(はは)の 作(つく)る スープが 飲(の)みたくて しょうが ないよ。=Tớ nhớ món ăn quê nhà không chịu được. Thèm bát canh mẹ nấu vô cùng.\nA:じゃ、 週末(しゅうまつ)、 駅前(えきまえ)に できた ベトナム料理(りょうり)の 店(みせ)に 行(い)ってみない？ いつも 列(れつ)が できているけど。=Vậy cuối tuần mình thử đến quán ăn Việt Nam mới mở trước ga không? Có điều lúc nào cũng có người xếp hàng.\nB:本当(ほんとう)？ 並(なら)んでも いいから、 ぜひ 行(い)きたい。=Thật à? Phải xếp hàng cũng được, tớ nhất định muốn đi.\n?男(おとこ)の 人(ひと)は どう して 元気(げんき)が ないのですか。|国(くに)の 料理(りょうり)が 食(た)べたくて たまらないから|仕事(しごと)が 忙(いそが)しくて 疲(つか)れているから|駅前(えきまえ)の 店(みせ)が いつも 込(こ)んでいるから|母(はは)が 病気(びょうき)に なったから\n##92 Chắc chắn là để quên\nA:あれ、 財布(さいふ)が ない。 どこかで 落(お)としたのかな。=Ơ, không thấy ví đâu. Hay là đánh rơi ở đâu rồi nhỉ.\nB:さっき コンビニで お金(かね)を 払(はら)った ときは、 あったよね。=Lúc nãy trả tiền ở cửa hàng tiện lợi thì vẫn còn mà nhỉ.\nA:うん。 その あと、 公園(こうえん)の ベンチで かばんを 開(あ)けたから、 そこに 置(お)いてきたに 違(ちが)い ない。=Ừ. Sau đó tớ mở cặp ở ghế đá công viên, chắc chắn là để quên ở đó rồi.\nB:じゃ、 すぐ 戻(もど)って 確(たし)かめよう。 なければ、 交番(こうばん)に 行(い)ってみよう。=Vậy quay lại xem ngay cho chắc đi. Nếu không có thì mình ra đồn cảnh sát hỏi thử.\n?二人(ふたり)は これから まず どこへ 行(い)きますか。|公園(こうえん)|コンビニ|交番(こうばん)|駅(えき)\n##93 E là tàu sẽ dừng\nA:課長(かちょう)、 明日(あした)の 大阪(おおさか)出張(しゅっちょう)ですが、 台風(たいふう)が 近(ちか)づいている そうです。=Thưa trưởng phòng, về chuyến công tác Osaka ngày mai, nghe nói bão đang đến gần ạ.\nB:そうか。 明日(あした)の 朝(あさ)は、 新幹線(しんかんせん)が 止(と)まる おそれが あるね。=Vậy à. Sáng mai e là tàu Shinkansen sẽ ngừng chạy nhỉ.\nA:はい。 念(ねん)の ため、 今日(きょう)の 夜(よる)の うちに 出発(しゅっぱつ)しても よろしいでしょうか。=Vâng. Để cho chắc, tôi xuất phát ngay trong tối nay có được không ạ?\nB:うん、 その ほうが 安全(あんぜん)だね。 ホテル代(だい)は 会社(かいしゃ)が 出(だ)すから、 予約(よやく)しておいて。=Ừ, thế thì an toàn hơn. Tiền khách sạn công ty sẽ trả, cô cứ đặt phòng trước đi.\n?女(おんな)の 人(ひと)は いつ 出発(しゅっぱつ)しますか。|今日(きょう)の 夜(よる)|明日(あした)の 朝(あさ)|明日(あした)の 夜(よる)|台風(たいふう)が 過(す)ぎてから\n##94 Hình như đã gặp ở đâu\nA:あの 人(ひと)、 どこかで 会(あ)った ことが ある ような 気(き)が するんだけど。=Người kia, tớ có cảm giác đã gặp ở đâu đó rồi thì phải.\nB:えっ、 だれ？ ああ、 あの 背(せ)の 高(たか)い 人(ひと)？=Hả, ai cơ? À, cái người cao cao kia á?\nA:うん。 顔(かお)に 見覚(みおぼ)えが あるんだ。 高校(こうこう)の 先輩(せんぱい)だったかな。=Ừ. Tớ thấy mặt quen lắm. Hay là đàn anh hồi cấp ba nhỉ.\nB:それは 気(き)の せいだよ。 あの 人(ひと)は、 先月(せんげつ) テレビの 料理(りょうり)番組(ばんぐみ)に 出(で)ていた 人(ひと)だから。=Cậu tưởng tượng thôi. Người đó là người xuất hiện trong chương trình nấu ăn trên tivi tháng trước mà.\n?あの 人(ひと)は どんな 人(ひと)ですか。|テレビの 料理(りょうり)番組(ばんぐみ)に 出(で)ていた 人(ひと)|男(おとこ)の 人(ひと)の 高校(こうこう)の 先輩(せんぱい)|女(おんな)の 人(ひと)の 知(し)り合(あ)い|料理(りょうり)教室(きょうしつ)の 先生(せんせい)\n##95 Giả vờ không thấy\nA:昨日(きのう)、 駅(えき)で 田中(たなか)さんを 見(み)かけたけど、 気(き)づかない ふりを しちゃった。=Hôm qua tớ thấy anh Tanaka ở ga nhưng lại lỡ giả vờ không nhận ra.\nB:えっ、 どう して？ けんかでも したの？=Hả, sao thế? Hai người cãi nhau à?\nA:ううん。 寝坊(ねぼう)して、 ひどい 顔(かお)だったから、 話(はな)しかけられたく なかったの。=Không. Tớ ngủ quên, mặt mũi tệ lắm nên không muốn bị bắt chuyện.\nB:なんだ。 でも、 田中(たなか)さんは 無視(むし)されたと 思(おも)って、 傷(きず)ついているかも しれないよ。=Tưởng gì. Nhưng biết đâu anh Tanaka lại nghĩ mình bị phớt lờ và đang buồn đấy.\n?女(おんな)の 人(ひと)は どう して 気(き)づかない ふりを しましたか。|ひどい 顔(かお)だったので、 話(はな)したく なかったから|田中(たなか)さんと けんかを していたから|田中(たなか)さんに 無視(むし)されたから|急(いそ)いでいて、 時間(じかん)が なかったから\n##96 Coi như đã mua\nA:今月(こんげつ)も お金(かね)が 全然(ぜんぜん) 残(のこ)らなかった。 節約(せつやく)している つもりなんだけど。=Tháng này cũng chẳng còn lại đồng nào. Tớ cứ tưởng mình đang tiết kiệm cơ đấy.\nB:毎朝(まいあさ) コーヒーを 買(か)っているでしょう。 あれが 無駄(むだ)なんじゃない？=Sáng nào cậu cũng mua cà phê còn gì. Cái đó chẳng phải là lãng phí sao?\nA:そうか。 じゃ、 これからは 買(か)った つもりで、 その お金(かね)を 貯金(ちょきん)箱(ばこ)に 入(い)れる ことに するよ。=Ra thế. Vậy từ giờ tớ sẽ coi như đã mua rồi và bỏ khoản tiền đó vào ống tiết kiệm.\nB:いいね。 1日(にち) 300円(えん)でも、 1年(ねん)で 10万(まん)円(えん) 以上(いじょう) 貯(た)まるよ。=Hay đấy. Mỗi ngày 300 yên thôi thì một năm cũng để dành được hơn 100 nghìn yên.\n?男(おとこ)の 人(ひと)は これから どう しますか。|コーヒーを 買(か)わないで、 その お金(かね)を ためる|毎朝(まいあさ) コーヒーを 2杯(はい) 買(か)う|コーヒーを 家(いえ)で 作(つく)って 持(も)っていく|残(のこ)った お金(かね)を 銀行(ぎんこう)に 入(い)れる\n##97 Nếu trúng xổ số\nA:もし 宝(たから)くじで 1億(おく)円(えん) 当(あ)たったと したら、 どう する？=Giả sử trúng xổ số 100 triệu yên thì cậu sẽ làm gì?\nB:僕(ぼく)は まず 会社(かいしゃ)を 辞(や)めて、 世界(せかい)中(じゅう)を 旅行(りょこう)するかな。=Tớ thì chắc trước tiên sẽ nghỉ việc rồi đi du lịch vòng quanh thế giới.\nA:私(わたし)は 仕事(しごと)は 続(つづ)けると 思(おも)う。 半分(はんぶん)は 貯金(ちょきん)して、 残(のこ)りで 両親(りょうしん)に 家(いえ)を 建(た)ててあげたいな。=Tớ nghĩ tớ vẫn đi làm. Một nửa thì gửi tiết kiệm, phần còn lại tớ muốn xây nhà cho bố mẹ.\nB:えらいなあ。 でも、 その 前(まえ)に まず 宝(たから)くじを 買(か)わないとね。=Giỏi ghê. Nhưng trước đó thì phải mua vé số đã nhỉ.\n?女(おんな)の 人(ひと)は、 宝(たから)くじが 当(あ)たったら どう すると 言(い)っていますか。|仕事(しごと)を 続(つづ)けて、 両親(りょうしん)に 家(いえ)を 建(た)てる|会社(かいしゃ)を 辞(や)めて、 世界(せかい)中(じゅう)を 旅行(りょこう)する|全部(ぜんぶ) 貯金(ちょきん)する|宝(たから)くじを もっと 買(か)う\n##98 Dù có thất bại\nA:僕(ぼく)、 来年(らいねん) 会社(かいしゃ)を 辞(や)めて、 自分(じぶん)の 店(みせ)を 開(ひら)く ことに したんだ。=Tớ đã quyết định sang năm sẽ nghỉ việc ở công ty để mở quán riêng.\nB:えっ、 本当(ほんとう)？ うまく いかない 可能性(かのうせい)も あるよ。=Hả, thật à? Cũng có khả năng không suôn sẻ đấy.\nA:わかってる。 でも、 たとえ 失敗(しっぱい)したと しても、 やらないで 後悔(こうかい)するより いいと 思(おも)うんだ。=Tớ biết. Nhưng cho dù có thất bại đi nữa, tớ nghĩ vẫn hơn là không làm rồi hối hận.\nB:そこまで 決心(けっしん)しているなら、 応援(おうえん)するよ。 最後(さいご)まで がんばってね。=Cậu đã quyết tâm đến thế thì tớ ủng hộ. Cố gắng đến cùng nhé.\n?男(おとこ)の 人(ひと)の 考(かんが)えは どれですか。|失敗(しっぱい)しても、 やらないで 後悔(こうかい)するより いい|自分(じぶん)の 店(みせ)は 絶対(ぜったい)に うまく いく|失敗(しっぱい)しそうなら、 会社(かいしゃ)を 辞(や)めない|もう 少(すこ)し 考(かんが)えてから 決(き)めたい\n##99 Lỡ chuyến tàu cuối\nA:大変(たいへん)！ 終電(しゅうでん)、 もう 出(で)ちゃったみたい。=Chết rồi! Hình như chuyến tàu cuối đi mất rồi.\nB:えっ、 どう しよう。 バスも もう ないよね。=Hả, làm sao bây giờ. Xe buýt cũng hết rồi nhỉ.\nA:タクシーで 帰(かえ)るしか ないね。 ここからだと 5000円(えん)ぐらい かかるけど。=Chỉ còn cách về bằng taxi thôi. Từ đây thì mất khoảng 5000 yên đấy.\nB:高(たか)いなあ。 でも、 歩(ある)いたら 2時間(じかん)は かかるし、 しかたが ないか。 二人(ふたり)で 半分(はんぶん)ずつ 払(はら)おう。=Đắt nhỉ. Nhưng đi bộ thì mất những 2 tiếng, đành vậy thôi. Hai đứa mình chia đôi tiền nhé.\n?二人(ふたり)は これから どう やって 帰(かえ)りますか。|タクシーに 乗(の)って 帰(かえ)る|2時間(じかん) 歩(ある)いて 帰(かえ)る|バスに 乗(の)って 帰(かえ)る|次(つぎ)の 電車(でんしゃ)を 待(ま)って 帰(かえ)る\n##100 Ăn cay được không\nA:田中(たなか)さんは、 辛(から)い 料理(りょうり)は 大丈夫(だいじょうぶ)ですか。 駅前(えきまえ)に おいしい タイ料理(りょうり)の 店(みせ)が できたんですが。=Anh Tanaka ăn được đồ cay không? Trước ga mới mở một quán Thái ngon lắm.\nB:食(た)べられない ことは ないんですが、 あまり 辛(から)いと おなかが 痛(いた)く なるんです。=Không phải là tôi không ăn được, nhưng cay quá thì tôi bị đau bụng.\nA:そうですか。 辛(から)さを 選(えら)べる 店(みせ)なので、 一番(いちばん) 辛(から)くないのに したら どうですか。=Vậy à. Quán đó chọn được độ cay nên anh chọn loại ít cay nhất thì sao?\nB:それなら 大丈夫(だいじょうぶ)そうですね。 ぜひ 行(い)きましょう。=Thế thì chắc là ổn. Nhất định đi nhé.\n?田中(たなか)さんは どう する ことに しましたか。|辛(から)くない ものを 選(えら)んで、 その 店(みせ)で 食(た)べる|辛(から)い 料理(りょうり)は 食(た)べられないので、 行(い)かない|辛(から)くない 料理(りょうり)の 店(みせ)を ほかに 探(さが)す|一番(いちばん) 辛(から)い 料理(りょうり)を 食(た)べてみる\n##101 Quy định xin nghỉ\nA:鈴木(すずき)さん、 この 会社(かいしゃ)では、 休(やす)みを 取(と)る ときは どう すれば いいですか。=Chị Suzuki ơi, ở công ty này khi muốn xin nghỉ thì phải làm thế nào ạ?\nB:1週間(しゅうかん) 前(まえ)までに、 課長(かちょう)に 書類(しょるい)を 提出(ていしゅつ)する ことに なっています。=Theo quy định thì phải nộp giấy tờ cho trưởng phòng trước đó 1 tuần.\nA:わかりました。 急(きゅう)に 病気(びょうき)に なった ときは、 どう するんですか。=Em hiểu rồi. Thế khi ốm đột xuất thì làm thế nào ạ?\nB:その 場合(ばあい)は、 朝(あさ) 9時(じ)までに 電話(でんわ)すれば いいですよ。 私(わたし)は メールも 送(おく)る ことに していますが。=Trường hợp đó thì gọi điện trước 9 giờ sáng là được. Riêng tôi thì có lệ là gửi cả email nữa.\n?急(きゅう)に 病気(びょうき)で 休(やす)む とき、 会社(かいしゃ)の 決(き)まりでは どう すれば いいですか。|朝(あさ) 9時(じ)までに 電話(でんわ)する|1週間(しゅうかん) 前(まえ)までに 書類(しょるい)を 出(だ)す|電話(でんわ)と メールの 両方(りょうほう)で 連絡(れんらく)する|課長(かちょう)に 直接(ちょくせつ) 会(あ)って 話(はな)す\n##102 Không ngủ, không ăn\nA:山田(やまだ)くん、 最近(さいきん) 顔色(かおいろ)が よくないね。 ちゃんと 寝(ね)てる？=Yamada này, dạo này sắc mặt cậu không tốt nhỉ. Có ngủ đàng hoàng không đấy?\nB:実(じつ)は、 仕事(しごと)が 忙(いそが)しくて、 昨日(きのう)も 寝(ね)ずに 資料(しりょう)を 作(つく)っていたんだ。=Thật ra công việc bận quá, hôm qua tớ cũng không ngủ mà ngồi làm tài liệu.\nA:それは 体(からだ)に 悪(わる)いよ。 朝(あさ)ご飯(はん)は 食(た)べた？=Thế thì hại sức khoẻ đấy. Cậu ăn sáng chưa?\nB:時間(じかん)が なくて、 何(なに)も 食(た)べずに 来(き)ちゃった。 今日(きょう)は 残業(ざんぎょう)せずに 帰(かえ)って、 早(はや)く 寝(ね)るよ。=Không có thời gian nên tớ chưa ăn gì đã đến. Hôm nay tớ sẽ không tăng ca mà về rồi ngủ sớm.\n?山田(やまだ)さんは 今日(きょう) どう すると 言(い)っていますか。|残業(ざんぎょう)を しないで 帰(かえ)って、 早(はや)く 寝(ね)る|寝(ね)ないで 資料(しりょう)を 作(つく)る|朝(あさ)ご飯(はん)を 食(た)べてから 仕事(しごと)を する|仕事(しごと)を 休(やす)んで 病院(びょういん)へ 行(い)く\n##103 Lời chào năm mới\nA:明(あ)けまして おめでとう ございます。 去年(きょねん)は いろいろ お世話(せわ)に なりました。=Chúc mừng năm mới. Năm ngoái tôi đã được anh giúp đỡ nhiều.\nB:こちらこそ、 お世話(せわ)に なりました。 今年(ことし)の 目標(もくひょう)は もう 決(き)めましたか。=Chính tôi mới được chị giúp đỡ nhiều. Chị đã đặt mục tiêu cho năm nay chưa?\nA:はい。 去年(きょねん)は 途中(とちゅう)で やめてしまったので、 今年(ことし)こそ 毎朝(まいあさ) 30分(ぷん) 走(はし)ろうと 決心(けっしん)しました。=Rồi ạ. Năm ngoái tôi bỏ giữa chừng nên chính năm nay tôi quyết tâm mỗi sáng chạy 30 phút.\nB:いいですね。 私(わたし)は 今年(ことし)こそ たばこを やめる つもりです。=Hay đấy. Còn tôi thì nhất định năm nay sẽ bỏ thuốc lá.\n?今年(ことし)こそ 毎朝(まいあさ) 走(はし)ろうと 決心(けっしん)したのは、 どう してですか。|去年(きょねん)は 途中(とちゅう)で やめてしまったから|医者(いしゃ)に 走(はし)る ように 言(い)われたから|たばこを やめたいから|友達(ともだち)に 誘(さそ)われたから\n##104 Khiêm tốn\nA:田中(たなか)さん、 スピーチ 大会(たいかい)で 優勝(ゆうしょう)した そうですね。 初(はじ)めて 出(で)たのに 1位(い)なんて、 すごいですね。=Chị Tanaka, nghe nói chị vô địch cuộc thi hùng biện. Lần đầu tham gia mà lại hạng 1 ư, giỏi thật đấy.\nB:とんでもないです。 私(わたし)なんか、 まだまだですよ。=Đâu có ạ. Cỡ như tôi thì vẫn còn kém lắm.\nA:大会(たいかい)では、 緊張(きんちょう)しませんでしたか。=Ở cuộc thi chị không hồi hộp à?\nB:しましたよ。 前(まえ)の 晩(ばん)は 怖(こわ)くて 全然(ぜんぜん) 眠(ねむ)れなくて、 当日(とうじつ)は 眠(ねむ)くて 大変(たいへん)でした。=Có chứ. Đêm hôm trước tôi sợ đến mức chẳng ngủ được chút nào, đến hôm thi thì buồn ngủ, khổ lắm.\n?田中(たなか)さんは、 スピーチ 大会(たいかい)の 前(まえ)の 晩(ばん) どうでしたか。|怖(こわ)くて 眠(ねむ)れなかった|よく 眠(ねむ)れた|遅(おそ)くまで 練習(れんしゅう)していた|眠(ねむ)くて 早(はや)く 寝(ね)た\n##105 Khách sạn nên ở\nA:夏休(なつやす)みに 北海道(ほっかいどう)へ 行(い)こうと 思(おも)っているんですが、 いい ホテルを 知(し)りませんか。=Kỳ nghỉ hè tôi định đi Hokkaido, anh có biết khách sạn nào tốt không?\nB:駅前(えきまえ)の みどり ホテルは どうですか。 部屋(へや)からの 眺(なが)めは もちろん、 朝食(ちょうしょく)も すばらしいですよ。=Khách sạn Midori trước ga thì sao? Quang cảnh nhìn từ phòng thì khỏi phải nói, cả bữa sáng cũng tuyệt vời.\nA:よさそうですね。 でも、 高(たか)いんじゃ ありませんか。=Nghe có vẻ được nhỉ. Nhưng chắc là đắt lắm phải không?\nB:2泊(はく)以上(いじょう) 泊(と)まれば、 割引(わりびき)が ありますよ。 それに、 お土産(みやげ)の お菓子(かし)も 1箱(はこ) もらえます。=Nếu ở từ 2 đêm trở lên thì được giảm giá đấy. Hơn nữa còn được tặng 1 hộp bánh kẹo làm quà.\n?みどり ホテルに 安(やす)く 泊(と)まるには、 どう すれば いいですか。|2泊(はく)以上(いじょう) 泊(と)まる|朝食(ちょうしょく)を 頼(たの)まない|お土産(みやげ)を 買(か)う|夏休(なつやす)みの 前(まえ)に 行(い)く\n##106 Trưởng phòng mới\nA:新(あたら)しい 課長(かちょう)は どんな 人(ひと)ですか。=Trưởng phòng mới là người thế nào?\nB:仕事(しごと)も できれば、 性格(せいかく)も 明(あか)るくて、 みんなに 好(す)かれていますよ。=Công việc cũng giỏi mà tính cách cũng vui vẻ, được mọi người quý lắm.\nA:へえ。 短所(たんしょ)は ないんですか。=Ồ. Thế không có điểm yếu nào sao?\nB:そうですね。 真面目(まじめ) すぎて、 忙(いそが)しい 時(とき)でも 何(なん)でも 一人(ひとり)で やろうと する ところでしょうか。=Ừm... Có lẽ là quá const TOTAL=147,cache={};
function D(n){
  if(cache[n]) return cache[n];
  const w=Math.ceil(n/7),dow=(n-1)%7,ph=w<=18?PH[0]:PH[1],d={n,w,dow,ph,wi:w<=18?w-1:0,kanji:[],vocab:[],theme:'',gram:[],kw:null,read:null,fx:[]};
  if(ph.id==='fin'){const mk=({19:{3:1},20:{3:2},21:{2:3}})[w]||{};if(EX.X&&mk[dow]){d.type='mock';d.exam=mk[dow]}else d.type='final'}
  else if(dow===6) d.type='review';
  else{d.type='lesson';const L=d.L=d.wi*6+dow;d.kanji=ORD[3].filter((_,i)=>Math.floor(i*108/ORD[3].length)===L);d.gram=G5[L+1]||[];d.read=RD[L+1]||null;d.fx=FX[L+1]||[];
    const v=V5[L];if(v){d.vocab=v.items;d.theme=v.theme}d.kw=KW[L+1]||null}
  return cache[n]=d;
}
function items(n){
  const d=D(n),w=[...d.vocab],g=[];
  d.kanji.forEach(c=>K[c].words.forEach(x=>{if(!w.includes(x))w.push(x)}));
  d.gram.forEach(p=>g.push(...p.x));
  return {k:d.kanji.map(c=>K[c]),w,g};
}
function merge(days){const it={k:[],w:[],g:[]};days.forEach(n=>{const x=items(n);it.k.push(...x.k);it.w.push(...x.w);it.g.push(...x.g)});return it}

const DK='かがきぎくぐけげこごさざしじすずせぜそぞただちぢつづてでとどはばひびふぶへべほぼ';
function mutR(r){
  const o=new Set(),end=r.endsWith('ます')?r.length-2:r.length;
  for(let i=0;i<end;i++){const c=r[i],A=r.slice(0,i),B=r.slice(i+1);
    if(c==='う'&&i>0) o.add(A+B);
    if('おこそとのほもよろごぞどぼょゅくすつふゆるぐず'.includes(c)&&r[i+1]!=='う') o.add(A+c+'う'+B);
    if(c==='っ') o.add(A+B);
    if(i>0&&'かきくけこさしすせそたちつてとぱぴぷぺぽ'.includes(c)&&r[i-1]!=='っ'&&r[i-1]!=='ん') o.add(A+'っ'+c+B);
    const k=DK.indexOf(c); if(k>=0) o.add(A+DK[k^1]+B);
    if(c==='ょ') o.add(A+'ゅ'+B); if(c==='ゅ') o.add(A+'ょ'+B);
  }
  o.delete(r); return shuf([...o]);
}
function mutK(w,l){
  const ks=[...w].map((c,i)=>K[c]?i:-1).filter(i=>i>=0),pool=ORD[5].concat(l<5?ORD[4]:[],l<4?ORD[3]:[]),out=[];
  if(!ks.length) return out;
  for(let t=0;t<14;t++){const i=ks[rnd(ks.length)],c=pool[rnd(pool.length)];if(c!==w[i])out.push(w.slice(0,i)+c+w.slice(i+1))}
  return out;
}
function qWord(w,type){
  const pool=WL[w.l],hasK=/[一-龯]/.test(w.w)&&w.r;
  if(!type){const ts=['m','rm'];if(hasK)ts.push('r','r','o');type=ts[rnd(ts.length)]}
  const exp=`<b class="jp">${esc(w.w)}</b>${w.r?' ('+w.r+')':''}: ${esc(w.m)}`;
  let q=null;
  if(type==='r'&&hasK) q=Q('Cách đọc kanji',`Từ gạch chân đọc thế nào?<div class="qs jp"><u>${esc(w.w)}</u></div>`,w.r,mutR(w.r).concat(shuf(pool.filter(x=>x.r).map(x=>x.r))),exp,w.key);
  if(type==='o'&&hasK) q=Q('Chọn chữ kanji',`Từ <b class="jp">${w.r}</b> (${esc(w.m)}) viết bằng kanji thế nào?`,w.w,mutK(w.w,w.l),exp,w.key);
  if(type==='rm') q=Q('Từ vựng',`Từ nào có nghĩa là “${esc(w.m)}”?`,w.w,shuf(pool).filter(x=>x.m!==w.m).map(x=>x.w),exp,w.key);
  return q||Q('Từ vựng',`Từ này nghĩa là gì?<div class="qs jp">${wordHtml(w)}</div>`,w.m,shuf(pool).filter(x=>x.w!==w.w).map(x=>x.m),exp,w.key);
}
function qKanji(k,t){
  const pool=ORD[k.l].map(c=>K[c]),lab=x=>`${x.hv}: ${x.m}`,on=k.on.split('、');
  const exp=`<b class="jp">${k.c}</b> ${k.hv}: ${esc(k.m)}${k.on?' · On: '+k.on:''}${k.kun?' · Kun: '+k.kun:''}`;
  if(t==null) t=rnd(3);
  if(t===2&&k.words.length) return qWord(k.words[rnd(k.words.length)],'r');
  if(t===2&&on[0]){const q=Q('Âm On',`Âm On của chữ này?<div class="qs jp huge">${k.c}</div>`,on[0],shuf(pool).map(x=>x.on.split('、')[0]).filter(x=>!on.includes(x)),exp,k.key);if(q)return q}
  if(t===1) return Q('Kanji',`Chữ nào mang nghĩa “${esc(lab(k))}”?`,k.c,shuf(pool).filter(x=>x.hv!==k.hv).map(x=>x.c),exp,k.key);
  return Q('Kanji',`Âm Hán Việt và nghĩa của chữ này?<div class="qs jp huge">${k.c}</div>`,lab(k),shuf(pool).filter(x=>x!==k).map(lab),exp,k.key);
}
const exFull=(e,mark)=>ruby(e.raw).replace('\u0001',mark?`<mark>${ruby(e.opts[0])}</mark>`:ruby(e.opts[0]));
function qGram(e,type){
  const exp=`<span class="jp">${exFull(e,1)}</span><br>${esc(e.vi)}<br><small>${esc(e.g.t)}: ${esc(e.g.m)}</small>`;
  const ch=e.raw.replace('\u0001',e.opts[0]).split(' ').filter(Boolean);
  if((type==='s'||(!type&&rnd(3)===0))&&!e.raw.includes('「')&&ch.length>=5){
    const s=rnd(ch.length-4),four=ch.slice(s,s+4),star=1+rnd(2);
    if(new Set(four).size===4){
      const bl=[0,1,2,3].map(i=>`<span class="bl">${i===star?'★':''}</span>`).join(' ');
      const q=Q('Sắp xếp câu',`Xếp 4 cụm từ vào chỗ trống. Cụm nào nằm ở ô ★?<div class="qs jp">${ruby(ch.slice(0,s).join(' '))} ${bl} ${ruby(ch.slice(s+4).join(' '))}</div>`,four[star],four.filter((_,i)=>i!==star),exp,e.key);
      if(q){q.star=1;return q}
    }
  }
  return Q('Ngữ pháp',`Chọn đáp án đúng cho chỗ trống.<div class="qs jp">${ruby(e.raw).replace('\u0001','<span class="bl">　　</span>')}</div>`,e.opts[0],e.opts.slice(1),exp,e.key);
}
const qRead=rd=>rd.qs.map((x,i)=>Q('Đọc hiểu',`<div class="pass jp">${ruby(rd.text)}</div><div class="jp">${ruby(x.q)}</div>`,x.opts[0],x.opts.slice(1),'Đọc lại bài và tìm câu chứa thông tin được hỏi.',null));
function qFromKey(key){
  if(key[0]==='k') return K[key.slice(2)]&&qKanji(K[key.slice(2)]);
  if(key[0]==='w') return W[key.slice(2)]&&qWord(W[key.slice(2)]);
  return GEX[key]&&qGram(GEX[key]);
}
function balanced(it,n){
  const g=shuf(it.g).map(e=>qGram(e)),k=shuf(it.k).map(x=>qKanji(x)),w=shuf(it.w).map(x=>qWord(x));
  const ng=Math.ceil(n*.4),nk=Math.ceil(n*.25);
  const out=[...g.slice(0,ng),...k.slice(0,nk)];
  for(const q of [...w,...g.slice(ng),...k.slice(nk)]){if(out.length>=n)break;out.push(q)}
  return shuf(out.filter(Boolean));
}


function kSvg(c,o={}){

  let h=`<svg viewBox="0 0 109 109" class="ksvg ${o.cls||''}" role="img" aria-label="${c}"><path class="kgrid" d="M54.5 2V107M2 54.5H107"/>`;
  s.forEach((d,i)=>{if(i<up)h+=`<path class="${o.hi&&i===up-1?'hi':''}${o.ghost?' ghost':''}" d="${d}"/>`});
  if(o.nums) s.forEach((d,i)=>{const m=d.match(/M\s*(-?[\d.]+)[,\s]\s*(-?[\d.]+)/);if(m)h+=`<text x="${Math.max(3,+m[1]-5)}" y="${Math.max(7,+m[2]-1)}">${i+1}</text>`});
  return h+'</svg>';
}
function animate(svg){

  let t=0; ps.forEach(p=>{const L=p.getTotalLength(),dur=260+L*7;p.style.transition='none';p.style.strokeDasharray=L;p.style.strokeDashoffset=L;
    setTimeout(()=>{p.style.transition=`stroke-dashoffset ${dur}ms ease-in-out`;p.style.strokeDashoffset=0},t+=30);t+=dur+120});
}

function qStar(raw){
  const ch=raw.split(' ').filter(Boolean);
  for(let t=0;t<8;t++){const s=rnd(ch.length-4),four=ch.slice(s,s+4),star=1+rnd(2);if(new Set(four).size<4)continue;
    const bl=[0,1,2,3].map(i=>`<span class="bl">${i===star?'★':''}</span>`).join(' ');

  return modeDays(m).filter(n=>!s.has(n)).map(n=>[n,Math.min(...days.map(x=>Math.abs(x-n)))]).sort((a,b)=>a[1]-b[1]||a[0]-b[0]).map(x=>x[0]);
}
/* Each item offers several forms. Pass p asks form p of every item, so a round only
   comes back to an item after every other item has had its turn. */
function passes(its,vars,ty,ord){
  const per=its.map(x=>{let v=vars(x).filter(Boolean);if(ty)v=v.filter(a=>a[0]===ty);return shuf(v.filter(a=>a[2])).concat(shuf(v.filter(a=>!a[2])))});
  const out=[],mx=Math.max(0,...per.map(v=>v.length));
  for(let p=0;p<mx;p++){const row=[];per.forEach((v,i)=>{if(v[p])row.push([its[i],v[p][1]])});out.push(ord(row))}
  return out;
}
function spreadOut(a){
  for(let i=1;i<a.length;i++){if(a[i].id!==a[i-1].id)continue;let j=-1;
    for(let k=i+1;k<a.length;k++)if(a[k].id!==a[i].id&&(k+1>=a.length||a[k+1].id!==a[i].id)){j=k;break}
    if(j<0)for(let k=0;k<i-1;k++)if(a[k].id!==a[i].id&&a[k+1].id!==a[i].id&&(!k||a[k-1].id!==a[i].id)){j=k;break}
    if(j>=0){const t=a[i];a[i]=a[j];a[j]=t}}
}
/* Builds one round. own = units made from the chosen range, bor = units taken from the
   nearest lessons outside it, again = units that ask an earlier item a second time. */
function buildPrac(c){
  const m=c.m,pm=PM[m],n=pracN(c),ty=c.ty[m]||'',p=P(),R={out:[],ok:[],own:0,bor:0,again:0};
  if(pm.fixed){const q=fixedPrac(m,ty).filter(Boolean);return {qs:q,units:q.length?1:0,own:1,bor:0,again:0}}
  const wf=c.wf&&pm.wf,byWrong=a=>wf?a.sort((x,y)=>(p.wrong[y[0]&&y[0].key]||0)-(p.wrong[x[0]&&x[0].key]||0)):a;
  const ord=row=>byWrong(shuf(row)).map(([x,f,id])=>({x,f,id:id===undefined?x:id}));
  const mk=t=>{let q=null;try{q=t.f()}catch(e){}if(Array.isArray(q)){q=q.filter(Boolean);if(!q.length)q=null}return q||null};
  const run=(th,own)=>{for(const t of th){if(R.out.length>=n)return;const q=mk(t);if(q){R.out.push({q,id:t.id});own?R.own++:R.bor++;R.ok.push(t)}}};
  const days=pracDays(c);
  modeTiers(m,ty,days,ord).forEach(th=>run(th,1));
  if(pm.bor&&days.length){const nd=nearDays(m,days);for(let i=0;i<nd.length&&R.out.length<n;i+=3)modeTiers(m,ty,nd.slice(i,i+3),ord).forEach(th=>run(th,0))}
  for(let g=0;R.out.length<n&&R.ok.length&&g<80;g++)
    for(const t of byWrong(shuf(R.ok.map(t=>[t.x,t]))).map(a=>a[1])){if(R.out.length>=n)break;const q=mk(t);if(q){R.out.push({q,id:t.id});R.again++}}
  spreadOut(R.out);
  return {qs:R.out.flatMap(x=>x.q),units:R.out.length,own:R.own,bor:R.bor,again:R.again};
}

function setPS(t){

  if(k==='weeks'){const w=+t.value,i=c.weeks.indexOf(w);if(t.checked&&i<0)c.weeks.push(w);else if(!t.checked&&i>=0)c.weeks.splice(i,1)}
  else if(k==='wf')c.wf=t.checked;
  else if(k==='n')c.n[c.m]=+t.value;
  else if(k==='ty')c.ty[c.m]=t.value;
  else if(k==='time')c.time=+t.value;
  else if(k==='src'){c.src=t.value;if(c.src==='weeks'&&!c.weeks.some(w=>lessonWeeks(c.m).includes(w))){const LW=lessonWeeks(c.m),cw=D(todayN()).w;c.weeks=[LW.includes(cw)?cw:LW.filter(w=>w<cw).pop()||LW[0]]}}

  const s2=$('#modal .sheet'),e=$(`#modal [data-ps="${k}"]`+(k==='weeks'?`[value="${t.value}"]`:''));
  if(s2)s2.scrollTop=y;if(e)e.focus({preventScroll:true});
}
function startPrac(){
  const c=PS,p=P();if(!c)return;const pm=PM[c.m],o={};
  p.pr={src:c.src,weeks:c.weeks.slice().sort((a,b)=>a-b),wf:c.wf,fb:c.fb,time:c.time,n:c.n,ty:c.ty};save();
  const qs=buildPrac(c).qs;
  if(pm.fb&&c.fb==='end')o.late=true;
  if(pm.tm&&c.time)o.limit=qs.length*c.time;
  closeModal();PS=null;startQuiz(PR.find(x=>x[0]===c.m)[1],qs,o);
}

    if(d.kw) h+=kaiwa(d,n,x,qb);
    if(d.read) h+=`<section class="sec"><h2>Đọc hiểu ${stamp(x.d!=null,'sm')}</h2><p>Một bài đọc ngắn với 2 câu hỏi, chỉ dùng ngữ pháp đã học đến hôm nay. Đọc câu hỏi trước, rồi tìm thông tin trong bài; cố gắng xong trong 4 phút và không tra từ.</p>${qb('d','Làm bài đọc')}</section>`;
    h+=`<section class="sec"><h2>Bài tổng kết ngày ${stamp(x.q!=null,'sm')}</h2><p>Trộn các dạng câu của đề JLPT: cách đọc kanji, chọn chữ, nghĩa của từ, điền ngữ pháp, sắp xếp câu ★, một câu chép chính tả và ${d.fx.length} câu ngữ pháp hoàn toàn mới (không lấy từ ví dụ trong bài) để kiểm tra bạn hiểu mẫu chứ không chỉ nhớ câu.</p>${qb('q','Làm bài tổng kết')}</section>`;
  }else if(d.type==='review'){
    h+=`<section class="sec"><h2>Bài kiểm tra tuần ${d.w}</h2><p>Khoảng 35 câu từ sáu bài của tuần: từ vựng, kanji, ngữ pháp (có câu mới), hai bài đọc, hai câu nghe kiểu đề thi (nghe một lần, có chi tiết gây nhiễu) và chép chính tả${d.wi>=3?', thêm điền từ theo ngữ cảnh và phản xạ hội thoại':''}. Đạt từ 60% trở lên là qua.</p>
    <ul class="outl">${[6,5,4,3,2,1].map(i=>{const e=D(n-i);return `<li><a href="#/day/${n-i}">Ngày ${n-i}</a><span>${esc(dayLabel(e))} <span class="jp">${e.kanji.join(' ')}</span></span></li>`}).join('')}</ul>${qb('q','Làm bài kiểm tra tuần')}</section>`;
  }else if(d.type==='final'){
    h+=`<section class="sec"><h2>Tổng ôn</h2><p>Khoảng 38 câu rút ngẫu nhiên từ tất cả các bài đã soạn, đủ các kỹ năng. Trước khi làm, hãy luyện lại Sổ lỗi.${n===TOTAL?' Hôm nay là ngày thi: chỉ nên xem lại nhẹ nhàng, ngủ đủ và đến điểm thi sớm.':''}</p>${qb('q','Làm bài tổng ôn')}
    <div class="row"><a class="btn line" href="#/wrong">Mở Sổ lỗi</a><a class="btn line" href="#/prac">Luyện theo kỹ năng</a></div></section>`;
  }else{
    const r=(P().exams||{})[d.exam];
    h+=`<section class="sec"><h2>Đề thi thử số ${d.exam}</h2><p>85 câu chia ba phần như đề thật, tổng 115 phút. Toàn bộ là câu bạn chưa gặp trong bài học, phần nghe chỉ được nghe một lần. Hãy làm một mạch ở nơi yên tĩnh, có loa hoặc tai nghe.</p>
    ${r?`<p class="mute">Lần gần nhất: ${r.tot}/180 điểm (${r.pass?'đạt':'chưa đạt'}), ngày ${fmtY(pd(r.d))}.</p>`:''}<div class="row"><button class="btn" data-act="exam" data-no="${d.exam}" data-n="${n}">Bắt đầu đề số ${d.exam}</button></div></section>`;
  }
  return h+`<nav class="pn">${n>1?`<a href="#/day/${n-1}">← Ngày ${n-1}</a>`:'<span></span>'}${n<TOTAL?`<a href="#/day/${n+1}">Ngày ${n+1} →</a>`:''}</nav>`;
}
function pracV(){
  const p=P();
  return `<h1>Luyện tập theo kỹ năng</h1><p class="lead">Chọn một kỹ năng, rồi chọn phạm vi, dạng câu hỏi, số lượng và cách chấm trước khi bắt đầu. Lượt nào cũng đủ số lượng đã chọn. Lựa chọn gần nhất được nhớ cho lần sau.</p>
  <div class="cards">${PR.map(([m,t,s])=>`<button class="pcard" data-act="prac" data-m="${m}"><b>${t}</b><span>${(PM[m]&&PM[m].desc)||s}</span></button>`).join('')}
  <a class="pcard" href="#/wrong"><b>Sổ lỗi</b><span>${Object.keys(p.wrong).length} mục bạn từng làm sai, luyện đến khi hết.</span></a></div>`;
}
function examV(){
  return `<h1>Đề thi thử N3</h1><p class="lead">Đề thi thử N3 chưa có trong bản này.</p>
  <p>Bản hiện tại gồm đầy đủ 54 bài đầu (9 tuần) và 9 bài kiểm tra tuần. Đề thi thử theo cấu trúc N3 thật (chữ và từ vựng 30 phút, ngữ pháp và đọc hiểu 70 phút, nghe hiểu 40 phút) sẽ được thêm cùng với 54 bài còn lại. Trong lúc đó, bạn có thể dùng mục Luyện tập và các bài kiểm tra tuần.</p>
  <div class="row"><a class="btn" href="#/prac">Mở mục Luyện tập</a></div>`;
}
function kdict(lv){
  lv=[3,4,5].includes(+lv)?+lv:3;
  return `<h1>Bảng kanji</h1><p class="lead">${ORD[3].length} chữ N3 của lộ trình này, cùng ${ORD[4].length} chữ N4 và ${ORD[5].length} chữ N5 để ôn lại. Bấm vào một chữ để xem thứ tự nét, âm đọc, mẹo nhớ và tập viết.</p>
  <div class="tabs">${[3,4,5].map(l=>`<a class="${l===lv?'on':''}" href="#/kanji/${l}">N${l} (${ORD[l].length})</a>`).join('')}</div>
  <div class="kgridv">${ORD[lv].map(c=>`<button class="jp${P().wrong['k:'+c]?' w':''}" data-act="kopen" data-k="${c}" title="${K[c].hv}: ${esc(K[c].m)}">${c}</button>`).join('')}</div>
  <div class="row"><button class="btn" data-act="prac" data-m="kf">Lật thẻ kanji N3</button><button class="btn line" data-act="prac" data-m="kq">Trắc nghiệm kanji N3</button></div>`;
}
function wrongV(){
  const ks=Object.keys(P().wrong);
  const row=k=>{if(k[0]==='k'){const x=K[k.slice(2)];return x&&`<b class="jp">${x.c}</b><span>${x.hv}: ${esc(x.m)}</span>`}
    if(k[0]==='w'){const x=W[k.slice(2)];return x&&`<b class="jp">${wordHtml(x)}</b><span>${esc(x.m)}</span>`}
    const e=GEX[k];return e&&`<b class="jp">${esc(e.g.t)}</b><span class="jp">${exFull(e,1)}</span>`};
  return `<h1>Sổ lỗi</h1><p class="lead">Kanji, từ vựng và mẫu ngữ pháp bạn trả lời sai được ghi lại ở đây. Trả lời đúng lại đủ số lần đã sai thì mục đó tự rời khỏi sổ.</p>
  ${ks.length?`<div class="row"><button class="btn" data-act="wquiz">Luyện lại ${Math.min(20,ks.length)} mục</button></div><ul class="outl">${ks.map(k=>{const r=row(k);return r?`<li>${r}<small>sai ${P().wrong[k]} lần</small></li>`:''}).join('')}</ul>`:'<p class="note">Sổ đang trống. Làm bài tập của một ngày bất kỳ, những câu sai sẽ xuất hiện ở đây.</p>'}`;
}
function setV(){
  const p=P();
  return `<h1>Cài đặt</h1>
  <section class="sec"><h2>Hồ sơ đang dùng</h2><div class="form"><label>Tên<input id="s-name" value="${esc(p.name)}"></label><label>Ngày bắt đầu<input id="s-start" type="date" value="${p.start}"></label></div>
  <div class="row"><button class="btn" data-act="saveset">Lưu thay đổi</button></div></section>
  <section class="sec"><h2>Hiển thị và giọng đọc</h2><label class="chk"><input type="checkbox" data-act="furi" ${p.furi!==false?'checked':''}> Hiện furigana trên kanji</label>
  <div class="form"><label>Giao diện <select data-act="theme"><option value="">Theo thiết bị</option><option value="light"${p.theme==='light'?' selected':''}>Sáng</option><option value="dark"${p.theme==='dark'?' selected':''}>Tối</option></select></label>
  <label>Tốc độ đọc <select data-act="rate">${[[.7,'Chậm'],[.9,'Vừa'],[1,'Tự nhiên'],[1.15,'Nhanh']].map(([v,t])=>`<option value="${v}"${(p.rate||.9)==v?' selected':''}>${t}</option>`).join('')}</select></label></div>
  <div class="row"><button class="btn line" data-act="ttstest">${SPK} Thử giọng đọc</button></div>
  <p class="mute">Phần nghe dùng giọng tiếng Nhật có sẵn của thiết bị. Nếu bấm thử mà không có tiếng hoặc nghe như đọc tiếng Anh, hãy cài thêm giọng tiếng Nhật trong phần cài đặt ngôn ngữ của máy, hoặc mở trang bằng Chrome, Edge hay Safari.</p></section>
  <section class="sec"><h2>Các hồ sơ trên máy này</h2><p class="mute">Mỗi hồ sơ có tiến độ và sổ lỗi riêng. Dữ liệu chỉ nằm trong trình duyệt này, không gửi đi đâu.</p>
  <ul class="outl">${Object.values(DB.profiles).map(q=>`<li><b>${esc(q.name)}</b><span>bắt đầu ${fmtY(pd(q.start))}</span>${q.id===p.id?'<small>đang dùng</small>':`<button class="btn sm line" data-act="switch" data-id="${q.id}">Chuyển sang</button>`}</li>`).join('')}</ul>
  <div class="row"><button class="btn line" data-act="addp">Thêm hồ sơ mới</button></div></section>
  <section class="sec"><h2>Sao lưu</h2><p class="mute">Xoá dữ liệu trình duyệt sẽ làm mất tiến độ. Hãy tải bản sao lưu định kỳ, hoặc dùng nó để chuyển sang máy khác.</p>
  <div class="row"><button class="btn line" data-act="export">Tải bản sao lưu</button><label class="btn line">Khôi phục từ tệp<input type="file" accept="application/json" id="imp" hidden></label></div>
  <div class="row"><button class="btn sm danger" data-act="reset">Xoá tiến độ của hồ sơ này</button>${Object.keys(DB.profiles).length>1?'<button class="btn sm danger" data-act="delp">Xoá hồ sơ này</button>':''}</div></section>
  <section class="sec"><h2>Nguồn dữ liệu</h2><p class="mute">Nét viết kanji: KanjiVG © Ulrich Apel, giấy phép CC BY-SA 3.0. Âm On, Kun và phân cấp JLPT: KANJIDIC2 © EDRDG, giấy phép CC BY-SA 4.0. JLPT không công bố danh sách chính thức, phân cấp chỉ mang tính tham khảo.</p></section>`;
}
let lastHash=null;
function render(keep){
  const app=$('#app');
  if(!P()){app.innerHTML=onboard();return}
  const p=P();if(p.theme)document.documentElement.dataset.theme=p.theme;else delete document.documentElement.dataset.theme;
  document.body.classList.toggle('nofuri',p.furi===false);
  const [r,a]=(location.hash.slice(2)||'').split('/'),y=scrollY;
  const v=r==='plan'?plan():r==='day'?day(+a||todayN()):r==='prac'?pracV():r==='exam'?examV():r==='kanji'?kdict(a):r==='wrong'?wrongV():r==='set'?setV():home();
  app.innerHTML=`<nav class="nav"><a class="brand" href="#/"><span class="jp">日本語</span>JLPT N3</a>${NAV.map(([h,t,g])=>`<a href="#/${h}" class="${(r||'')===h||(h==='plan'&&r==='day')||(h==='prac'&&r==='wrong')?'on':''}"><span class="jp">${g}</span>${t}</a>`).join('')}</nav>
  <main>${LS.ok?'':'<p class="note">Trình duyệt đang chặn lưu trữ ở chế độ xem này nên tiến độ sẽ mất khi đóng trang. Hãy mở tệp trực tiếp bằng trình duyệt hoặc đưa lên hosting để lưu được lâu dài.</p>'}${v}</main>`;
  scrollTo(0,keep&&lastHash===location.hash?y:0);lastHash=location.hash;
}

/* ================= Sự kiện ================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,p=P(),z=QZ,q=z&&z.qs&&z.qs[z.i];
  if(a==='create'){const s=$('#o-start').value;if(!s){toast('Hãy chọn ngày bắt đầu.');return}newProfile($('#o-name').value.trim()||'Bạn',s);location.hash='#/';render()}
  else if(a==='back'){DB.cur=Object.keys(DB.profiles)[0];render()}
  else if(a==='say'){e.stopPropagation();say(t.dataset.t)}
  else if(a==='anim') animate(t.closest('.kcard').querySelector('.genko svg'));
  else if(a==='kopen'){openModal(kCard(K[t.dataset.k]));animate($('#modal .genko svg'))}
  else if(a==='pad') openPad(t.dataset.k);
  else if(a==='padclr'){const c=$('#modal canvas');c.getContext('2d').clearRect(0,0,c.width,c.height)}
  else if(a==='close'){stopAudio();closeModal()}
  else if(a==='reveal') t.classList.toggle('show');
  else if(a==='kwall'){const k=KW[t.dataset.l];speak(k.lines.map(l=>({t:l.jp,v:VOI[l.s]})))}
  else if(a==='kwshow') t.closest('.sec').querySelector('.kwl').classList.toggle('veil');
  else if(a==='role'){RP={L:+t.dataset.l,r:t.dataset.r,i:0};roleStep()}
  else if(a==='rpshow'){$('#rpa').hidden=false;const ln=KW[RP.L].lines[RP.i];speak([{t:ln.jp,v:VOI[ln.s]}])}
  else if(a==='rpnext'){RP.i++;roleStep()}
  else if(a==='quiz'){const n=+t.dataset.n,s=t.dataset.sec,d=D(n);startQuiz(`Ngày ${n}: ${d.type==='lesson'?SECN[s]:dayLabel(d)}`,buildSec(n,s),{done:pct=>markDone(n,s,pct)})}
  else if(a==='exam'){const n=+t.dataset.n;startExam(+t.dataset.no,n?pct=>markDone(n,'q',pct):null)}
  else if(a==='exgo'){const ex=EXS,pt=ex.parts[ex.i];startQuiz(`${ex.no?'Đề '+ex.no:'Đề trộn lại'} · ${pt.title}`,pt.qs,{exam:true,limit:pt.min*60,chain:zz=>{ex.done.push(zz);QZ=null;if(++ex.i<3)examIntro();else examResult()}})}
  else if(a==='prac')openSetup(t.dataset.m);
  else if(a==='pgo')startPrac();
  else if(a==='wquiz') startQuiz('Luyện lại sổ lỗi',shuf(Object.keys(p.wrong)).slice(0,20).map(qFromKey));
  else if(a==='qplay') playQ();
  else if(a==='pick'){if(!z.shown)answer(+t.dataset.i,+t.dataset.i===q.a)}
  else if(a==='dchip'){const i=$('#din');i.value+=t.dataset.t}
  else if(a==='dclr') $('#din').value='';
  else if(a==='dcheck'){const v=$('#din').value;answer(v,dictOk(q,v))}
  else if(a==='czadd'){const st=z.ans[z.i],b=q.sol.findIndex((_,j)=>st.f[j]==null);if(b<0)return;const i=+t.dataset.i;st.f[b]=q.bank[i];st.u[b]=i;drawQ()}
  else if(a==='czrm'){const st=z.ans[z.i],b=+t.dataset.b;st.f[b]=null;st.u[b]=null;drawQ()}
  else if(a==='czcheck'){const st=z.ans[z.i];z.res[z.i]=q.sol.every((s,j)=>st.f[j]===s);if(z.opt.late)nextQ();else{z.shown=true;drawQ()}}
  else if(a==='flip'){z.flip=true;drawQ();if(q.say)say(q.say)}
  else if(a==='fyes'||a==='fno'){z.res[z.i]=a==='fyes';nextQ()}
  else if(a==='qnext') nextQ();
  else if(a==='qclose'){if((EXS||(z&&!z.fin&&z.res.length))&&!confirm('Thoát bài đang làm? Kết quả sẽ không được lưu.'))return;closeQuiz()}
  else if(a==='saveset'){const s=$('#s-start').value;if(!s){toast('Hãy chọn ngày bắt đầu.');return}p.name=$('#s-name').value.trim()||p.name;p.start=s;save();render();toast('Đã lưu thay đổi.')}
  else if(a==='ttstest') speak([{t:'こんにちは。わたし は リン です。',v:'f'},{t:'はじめまして。田中(たなか) です。よろしく おねがいします。',v:'m'}]);
  else if(a==='switch'){DB.cur=t.dataset.id;save();render();toast('Đã chuyển hồ sơ.')}
  else if(a==='addp'){DB.cur=null;render()}
  else if(a==='export'){const b=new Blob([JSON.stringify(DB)],{type:'application/json'}),l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='jlpt-n5-sao-luu.json';l.click();toast('Đã tải bản sao lưu.')}
  else if(a==='reset'){if(confirm('Xoá toàn bộ tiến độ và sổ lỗi của hồ sơ này?')){p.done={};p.wrong={};p.act={};p.exams={};save();render();toast('Đã xoá tiến độ.')}}
  else if(a==='delp'){if(confirm(`Xoá hồ sơ “${p.name}”?`)){delete DB.profiles[p.id];DB.cur=Object.keys(DB.profiles)[0];save();render()}}
});
document.addEventListener('change',e=>{
  const t=e.target,a=t.dataset.act;
  if(t.dataset.ps){setPS(t);return}
  if(a==='hide') t.closest('.sec').querySelector('.vlist').classList.toggle('hidden',t.checked);
  else if(a==='furi'){P().furi=t.checked;save();render(true)}
  else if(a==='theme'){P().theme=t.value;save();render(true)}
  else if(a==='rate'){P().rate=+t.value;save()}
  else if(a==='scope'){P().scope=t.value;save()}
  else if(t.id==='imp'&&t.files[0]){const f=new FileReader();f.onload=()=>{try{const d=JSON.parse(f.result);if(!d.profiles||!Object.keys(d.profiles).length)throw 0;DB=d;if(!P())DB.cur=Object.keys(DB.profiles)[0];save();render();toast('Đã khôi phục dữ liệu.')}catch(x){toast('Tệp không đúng định dạng sao lưu.')}};f.readAsText(t.files[0])}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#modal').classList.contains('on')){stopAudio();closeModal()}return}
  const z=QZ;if(!z||z.fin||!z.qs)return;const q=z.qs[z.i],k=q.kind||'mc';
  if(k==='mc'&&/^[1-4]$/.test(e.key)&&!z.shown&&+e.key<=q.opts.length) answer(+e.key-1,+e.key-1===q.a);
  else if(e.key==='Enter'){if(z.shown){e.preventDefault();nextQ()}else if(k==='dict'){e.preventDefault();const v=$('#din').value;answer(v,dictOk(q,v))}}
});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'){stopAudio();closeModal()}});
addEventListener('hashchange',()=>render());
if(!P()&&Object.keys(DB.profiles).length) DB.cur=Object.keys(DB.profiles)[0];
render();
</script>
