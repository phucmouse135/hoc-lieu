hông thích, không chịu\n無理やり|むりやり|ép buộc, cưỡng ép\n塾|じゅく|lớp học thêm\n飲み会|のみかい|buổi nhậu\n強制|きょうせい|ép buộc, cưỡng chế\n怒鳴る|どなる|quát, la mắng\n", "v5b": "", "g5": "##1\n@〜たびに|mỗi lần ~ (là lại)|V-từ điển / N の + たびに\nCứ mỗi lần việc trước xảy ra thì việc sau lại xảy ra. Không dùng cho thói quen thường ngày hiển nhiên.\n!たび = \"chuyến, lần\": mỗi \"lần\" là một lần lặp lại.\n>この 写真(しゃしん)を 【見(み)る たびに|見(み)た たびに|見(み)て たびに|見(み)る たびで】、 学生(がくせい)時代(じだい)を 思(おも)い出(だ)します。=Mỗi lần xem tấm ảnh này tôi lại nhớ thời sinh viên.\n>父(ちち)は 【出張(しゅっちょう)の たびに|出張(しゅっちょう)たびに|出張(しゅっちょう)するの たびに|出張(しゅっちょう)な たびに】、 お土産(みやげ)を 買(か)ってきてくれる。=Mỗi lần đi công tác bố lại mua quà về cho tôi.\n>彼女(かのじょ)は 会(あ)う たび 【に|で|を|と】 きれいに なっている。=Mỗi lần gặp cô ấy lại đẹp hơn.\n##2\n@〜ついでに|nhân tiện ~|V-từ điển / V た / N の + ついでに\nNhân dịp làm việc chính thì làm thêm việc phụ.\n!Việc đứng trước ついでに mới là việc chính.\n>買(か)い物(もの)に 行(い)く 【ついでに|たびに|うちに|とおりに】、 この 手紙(てがみ)を 出(だ)してきてくれない？=Nhân tiện đi mua đồ, gửi giúp lá thư này được không?\n>【散歩(さんぽ)の ついでに|散歩(さんぽ)ついでに|散歩(さんぽ)するの ついでに|散歩(さんぽ)に ついでに】、 図書(としょ)館(かん)に 寄(よ)って 本(ほん)を 返(かえ)した。=Nhân tiện đi dạo, tôi ghé thư viện trả sách.\n>大阪(おおさか)へ 出張(しゅっちょう)した 【ついでに|ついでで|ついでを|つもりに】、 友人(ゆうじん)の 家(いえ)を 訪(たず)ねた。=Nhân chuyến công tác Osaka, tôi đã ghé thăm nhà bạn.\n##3\n@〜たとたん(に)|vừa mới ~ thì|V た + とたん(に)\nNgay sau việc trước, một việc bất ngờ xảy ra. Vế sau không dùng ý chí của người nói.\n!とたん = \"đúng tích tắc đó\". Vế sau luôn là điều bất ngờ.\n>家(いえ)を 【出(で)た とたん|出(で)る とたん|出(で)て とたん|出(で)た とおり】、 雨(あめ)が 降(ふ)り出(だ)した。=Vừa ra khỏi nhà thì trời đổ mưa.\n>立(た)ち上(あ)がった とたん 【に|で|と|が】、 目(め)の 前(まえ)が 暗(くら)く なった。=Vừa đứng dậy thì mắt tối sầm lại.\n>お酒(さけ)を 飲(の)んだ とたん、 顔(かお)が 【赤(あか)く なった|赤(あか)く しよう|赤(あか)く してください|赤(あか)く する つもりだ】。=Vừa uống rượu là mặt đỏ lên.\n##4\n@〜最中に|đang giữa lúc ~ (さいちゅうに)|V ている / N の + 最中に\nĐúng lúc đang làm dở việc gì thì có việc chen vào.\n>会議(かいぎ)の 【最中(さいちゅう)に|ついでに|たびに|うちで】、 携帯(けいたい)電話(でんわ)が 鳴(な)ってしまった。=Đang giữa cuộc họp thì điện thoại reo mất.\n>今(いま)、 料理(りょうり)を 【している 最中(さいちゅう)|する 最中(さいちゅう)|した 最中(さいちゅう)|して 最中(さいちゅう)】 だから、 あとで 電話(でんわ)するね。=Giờ tớ đang nấu ăn dở nên lát gọi lại nhé.\n>試験(しけん)の 最中(さいちゅう) 【に|を|と|へ】、 おなかが 痛(いた)く なった。=Đang giữa giờ thi thì tôi bị đau bụng.\n##5\n@〜うちに|trong lúc còn ~; trong khi ~ thì dần|V-từ điển / V ている / V ない / A-い / A-な + な / N の + うちに\n(1) Làm việc gì trước khi trạng thái thay đổi. (2) Trong khi làm việc này thì thay đổi tự nhiên xảy ra.\n!\"Tranh thủ kẻo muộn\": 熱いうちに, 若いうちに, 忘れないうちに.\n>【冷(さ)めない うちに|冷(さ)める うちに|冷(さ)めた うちに|冷(さ)めなく うちに】、 どうぞ 召(め)し上(あ)がってください。=Xin mời dùng khi còn chưa nguội.\n>【若(わか)い うちに|若(わか)いの うちに|若(わか)く うちに|若(わか)かった うちに】、 いろいろな 国(くに)へ 行(い)ってみたい。=Tôi muốn đi nhiều nước khi còn trẻ.\n>本(ほん)を 読(よ)んでいる 【うちに|たびに|ついでに|とたんに】、 眠(ねむ)く なってきた。=Trong khi đọc sách tôi dần buồn ngủ.\n##6\n@〜ところに・〜ところへ・〜ところを|đúng lúc ~|V-từ điển / V ている / V た + ところに / ところへ / ところを\nĐúng vào thời điểm đó thì có việc xảy ra. ところを thường đi với 見られる, 助けられる.\n>出(で)かけようと した 【ところに|ところで|ところは|ところと】、 友達(ともだち)が 訪(たず)ねてきた。=Đúng lúc tôi định ra ngoài thì bạn đến chơi.\n>授業(じゅぎょう)中(ちゅう)に 寝(ね)ている 【ところを|ところに|ところへ|ところが】 先生(せんせい)に 見(み)られてしまった。=Tôi bị thầy bắt gặp đúng lúc đang ngủ trong giờ.\n>ちょうど いい 【ところへ|ところを|ところで|ところも】 来(き)ましたね。 今(いま)、 お茶(ちゃ)を 入(い)れた ところです。=Anh đến đúng lúc quá. Tôi vừa pha trà xong.\n##7\n@〜ばかりでなく|không chỉ ~ mà còn|N / thể thông thường + ばかりでなく、〜も\nGiống だけでなく nhưng trang trọng hơn, hay gặp trong văn viết.\n>彼(かれ)は 英語(えいご) 【ばかりで なく|ばかりで|だけしか|ばかりなのに】、 中国(ちゅうごく)語(ご)も 話(はな)せる。=Anh ấy không chỉ nói được tiếng Anh mà cả tiếng Trung.\n>この 店(みせ)は 安(やす)いばかりで なく、 味(あじ) 【も|は|が|で】 いい。=Quán này không chỉ rẻ mà vị cũng ngon.\n>子供(こども) 【ばかりで なく|ばかり なく|ばかりでは ない|ばかりだけ】、 大人(おとな)も この ゲームに 夢中(むちゅう)に なっている。=Không chỉ trẻ con mà người lớn cũng mê trò chơi này.\n##8\n@〜だらけ|đầy ~, toàn ~ (điều không hay)|N + だらけ\nDính đầy, có quá nhiều một thứ không mong muốn: 間違いだらけ, 泥だらけ, ごみだらけ.\n!だらけ luôn mang nghĩa xấu, nhìn thấy \"bẩn mắt\".\n>子供(こども)たちは 泥(どろ) 【だらけ|ばかり|っぽい|がち】 に なって 遊(あそ)んでいる。=Bọn trẻ chơi đến mức lấm đầy bùn.\n>この 作文(さくぶん)は 間違(まちが)い 【だらけ|気味(ぎみ)|ぐらい|ほど】 で、 読(よ)みにくい。=Bài văn này đầy lỗi sai nên khó đọc.\n>部屋(へや)の 中(なか)は ごみ 【だらけだった|だらけした|だらけく なった|だらけが あった】。=Trong phòng đầy rác.\n##9\n@〜っぽい|có vẻ ~; hay ~|N / A-い (bỏ い) / V (bỏ ます) + っぽい\n(1) Mang nhiều tính chất của N: 子供っぽい, 水っぽい. (2) Dễ, hay làm gì: 忘れっぽい, 怒りっぽい.\n>彼(かれ)は もう 30歳(さい)なのに、 【子供(こども)っぽい|子供(こども)らしい|子供(こども)がち|子供(こども)だらけ】 ところが ある。=Anh ấy đã 30 tuổi mà vẫn có nét trẻ con.\n>年(とし)を 取(と)ると、 【忘(わす)れっぽく|忘(わす)れるっぽく|忘(わす)れてっぽく|忘(わす)れがちく】 なる。=Có tuổi thì trở nên hay quên.\n>この スープは 【水(みず)っぽくて|水(みず)らしくて|水(みず)だらけで|水気(みずけ)味(あじ)で】、 おいしく ない。=Món súp này loãng như nước nên không ngon.\n##10\n@〜がち|thường hay ~ (xu hướng xấu)|V (bỏ ます) / N + がち\nDễ rơi vào trạng thái không tốt: 忘れがち, 遅れがち, 病気がち.\n!がち nói về tần suất; 気味 nói về mức độ nhẹ đang cảm thấy.\n>冬(ふゆ)は 運動(うんどう)不足(ふそく)に 【なりがち|なるがち|なって がち|なった がち】 だ。=Mùa đông thường hay thiếu vận động.\n>最近(さいきん)、 バスが 【遅(おく)れがち|遅(おく)れっぽい|遅(おく)れだらけ|遅(おく)れるがち】 で 困(こま)っている。=Dạo này xe buýt hay trễ nên tôi khổ sở.\n>彼(かれ)は 子供(こども)の ころ、 【病気(びょうき)がち|病気(びょうき)っぽ|病気(びょうき)気味(ぎみ)く|病気(びょうき)だらけ】 だった そうだ。=Nghe nói hồi nhỏ anh ấy hay ốm.\n##11\n@〜気味|hơi có vẻ ~ (ぎみ)|V (bỏ ます) / N + 気味\nCảm thấy hơi có xu hướng đó, thường là trạng thái cơ thể, tinh thần: 風邪気味, 疲れ気味, 太り気味.\n>今日(きょう)は 風邪(かぜ) 【気味(ぎみ)|がち|だらけ|っぽく】 なので、 早(はや)く 帰(かえ)らせていただきます。=Hôm nay tôi hơi bị cảm nên xin phép về sớm.\n>最近(さいきん)、 仕事(しごと)が 忙(いそが)しくて 【疲(つか)れ気味(ぎみ)|疲(つか)れる 気味(ぎみ)|疲(つか)れて 気味(ぎみ)|疲(つか)れた 気味(ぎみ)】 だ。=Dạo này công việc bận nên tôi hơi mệt.\n>ちょっと 太(ふと)り 【気味(ぎみ)だから|気味(ぎみ)なから|気味(ぎみ)の から|気味(ぎみ) くて】、 甘(あま)い 物(もの)を やめている。=Vì hơi béo lên nên tôi đang bỏ đồ ngọt.\n##12\n@〜によって・〜による|do; bằng; tuỳ theo|N + によって / により ・ N + による + N\n(1) Nguyên nhân: 台風によって. (2) Phương tiện: 話し合いによって. (3) Tuỳ theo: 人によって違う. (4) Tác giả trong câu bị động.\n!Thấy 違う / いろいろ ở vế sau thì là \"tuỳ theo\".\n>習慣(しゅうかん)は 国(くに) 【に よって|に ついて|に とって|に 対(たい)して】 違(ちが)います。=Tập quán khác nhau tuỳ theo từng nước.\n>地震(じしん) 【に よる|に よって|に よると|に より】 被害(ひがい)は 大(おお)きかった。=Thiệt hại do động đất gây ra rất lớn.\n>この 問題(もんだい)は 話(はな)し合(あ)い 【に よって|に 比(くら)べて|に とって|と して】 解決(かいけつ)した。=Vấn đề này đã được giải quyết bằng đối thoại.\n##13\n@〜に対して|đối với ~; trái với ~|N + に対して / に対する + N\n(1) Hướng hành động, thái độ tới đối tượng. (2) So sánh đối lập hai bên.\n>お客(きゃく)様(さま) 【に 対(たい)して|に とって|に ついて|に よって】、 失礼(しつれい)な ことを 言(い)っては いけない。=Không được nói điều thất lễ với khách hàng.\n>兄(あに)が 静(しず)かなの 【に 対(たい)して|に ついて|と して|に 加(くわ)えて】、 弟(おとうと)は とても にぎやかだ。=Trái với người anh trầm lặng, người em rất sôi nổi.\n>この 質問(しつもん) 【に 対(たい)する|に 対(たい)して|に とって|に ついて】 答(こた)えは 一(ひと)つでは ない。=Câu trả lời cho câu hỏi này không chỉ có một.\n##14\n@〜に関して|liên quan đến ~, về ~|N + に関して / に関する + N\nGiống について nhưng trang trọng hơn, dùng trong thông báo, báo cáo.\n>この 事件(じけん) 【に 関(かん)して|に 対(たい)して|に とって|に 比(くら)べて】、 新(あたら)しい 情報(じょうほう)が 入(はい)りました。=Liên quan đến vụ việc này, đã có thông tin mới.\n>環境(かんきょう)問題(もんだい) 【に 関(かん)する|に 関(かん)して|に とって|に よって】 本(ほん)を 探(さが)しています。=Tôi đang tìm sách về vấn đề môi trường.\n>料金(りょうきん)に 関(かん)して 【は|を|と|へ】、 受付(うけつけ)で お尋(たず)ねください。=Về chi phí, xin hãy hỏi tại quầy lễ tân.\n##15\n@〜にとって|đối với ~ (đứng từ lập trường của)|N (người, tổ chức) + にとって\nNêu đánh giá từ góc nhìn của ai. Vế sau là tính từ đánh giá: 大切だ, 難しい, 必要だ.\n!にとって + đánh giá; に対して + hành động, thái độ.\n>私(わたし) 【に とって|に 対(たい)して|に ついて|に よって】、 家族(かぞく)は 何(なん)より 大切(たいせつ)だ。=Đối với tôi, gia đình quan trọng hơn tất cả.\n>外国(がいこく)人(じん) 【に とって|と して|に 関(かん)して|に 比(くら)べて】、 漢字(かんじ)を 覚(おぼ)えるのは 大変(たいへん)だ。=Đối với người nước ngoài, nhớ chữ Hán rất vất vả.\n>これは 子供(こども)に とって 【難(むずか)し すぎる|反対(はんたい) した|質問(しつもん)する|親切(しんせつ)に する】 問題(もんだい)だ。=Đây là bài quá khó đối với trẻ con.\n##16\n@〜として|với tư cách ~; như là ~|N + として\nNêu tư cách, vai trò, danh nghĩa.\n>彼(かれ)は 留学(りゅうがく)生(せい) 【と して|に とって|に 対(たい)して|に よって】 日本(にほん)に 来(き)た。=Anh ấy đến Nhật với tư cách du học sinh.\n>京都(きょうと)は 古(ふる)い 町(まち) 【と して|に ついて|に 関(かん)して|に 比(くら)べて】 世界(せかい)に 知(し)られている。=Kyoto được thế giới biết đến như một thành phố cổ.\n>彼(かれ)は 医者(いしゃ) 【と して|に ついて|に よって|に 比(くら)べて】、 この 病院(びょういん)で 働(はたら)いている。=Anh ấy làm việc ở bệnh viện này với tư cách bác sĩ.\n##17\n@〜に比べて|so với ~ (にくらべて)|N + に比べて / に比べると\nSo sánh mức độ giữa hai đối tượng.\n>去年(きょねん) 【に 比(くら)べて|に 対(たい)して|に ついて|に とって】、 今年(ことし)は 雨(あめ)が 多(おお)い。=So với năm ngoái, năm nay mưa nhiều.\n>東京(とうきょう)に 比(くら)べる 【と|ば|なら|たら】、 この 町(まち)は 物価(ぶっか)が 安(やす)い。=So với Tokyo thì thị trấn này vật giá rẻ.\n>兄(あに) 【に 比(くら)べて|に 加(くわ)えて|と して|に よって】、 私(わたし)は 背(せ)が 低(ひく)い。=So với anh trai, tôi thấp hơn.\n##18\n@〜に加えて|thêm vào ~, không chỉ ~ (にくわえて)|N + に加えて\nThêm một yếu tố nữa vào điều đã có.\n>大雨(おおあめ) 【に 加(くわ)えて|に 比(くら)べて|に 対(たい)して|に とって】、 風(かぜ)も 強(つよ)く なってきた。=Thêm vào mưa to, gió cũng mạnh lên.\n>彼(かれ)は 英語(えいご) 【に 加(くわ)えて|に ついて|と して|に よって】、 フランス語(ご)も 勉強(べんきょう)している。=Ngoài tiếng Anh, anh ấy còn học tiếng Pháp.\n>家賃(やちん)に 加(くわ)えて、 電気(でんき)代(だい) 【も|は|が|で】 払(はら)わなければ ならない。=Ngoài tiền nhà còn phải trả cả tiền điện.\n##19\n@〜において|tại, trong ~ (trang trọng)|N + において / における + N\nNơi chốn, lĩnh vực, thời điểm trong văn viết, thông báo; tương đương で.\n>卒業(そつぎょう)式(しき)は 体育(たいいく)館(かん) 【に おいて|に とって|に 対(たい)して|に ついて】 行(おこな)われます。=Lễ tốt nghiệp được tổ chức tại nhà thi đấu.\n>現代(げんだい) 社会(しゃかい) 【に おける|に おいて|に とって|に 比(くら)べる】 問題(もんだい)に ついて 話(はな)し合(あ)った。=Chúng tôi đã thảo luận về các vấn đề trong xã hội hiện đại.\n>その 時代(じだい) 【に おいて|と して|に 比(くら)べ|に 加(くわ)え】、 女性(じょせい)が 働(はたら)くのは 珍(めずら)しかった。=Vào thời đó, phụ nữ đi làm là chuyện hiếm.\n##20\n@〜に従って・〜につれて|càng ~ càng; theo ~ (にしたがって)|V-từ điển / N + に従って ・ につれて\nVế trước thay đổi thì vế sau thay đổi theo. に従って còn nghĩa \"tuân theo\" (chỉ thị, quy tắc).\n>年(とし)を 取(と)る 【に つれて|に ついて|に とって|に 対(たい)して】、 体力(たいりょく)が なくなってきた。=Càng có tuổi thể lực càng giảm.\n>町(まち)の 発展(はってん) 【に 従(したが)って|に 比(くら)べて|と して|に 関(かん)して】、 人口(じんこう)も 増(ふ)えてきた。=Theo sự phát triển của thị trấn, dân số cũng tăng lên.\n>係員(かかりいん)の 指示(しじ)に 【従(したが)って|つれて|とって|加(くわ)えて】、 順番(じゅんばん)に お入(はい)りください。=Xin hãy vào lần lượt theo chỉ dẫn của nhân viên.\n##21\n@〜とともに|cùng với ~; đồng thời với|N / V-từ điển + とともに\n(1) Cùng với ai. (2) Hai việc xảy ra đồng thời hoặc thay đổi song song.\n>家族(かぞく) 【と ともに|に ついて|に 対(たい)して|と して】 日本(にほん)で 暮(く)らしています。=Tôi đang sống ở Nhật cùng gia đình.\n>年(とし)を 取(と)る 【と ともに|ついでに|たびに|とたんに】、 考(かんが)え方(かた)も 変(か)わってきた。=Cùng với tuổi tác, cách nghĩ cũng thay đổi.\n>春(はる)の 訪(おとず)れ 【と ともに|とおりに|に 比(くら)べて|の 最中(さいちゅう)に】、 桜(さくら)が 咲(さ)き始(はじ)めた。=Cùng với mùa xuân về, hoa anh đào bắt đầu nở.\n##22\n@〜を通じて・〜を通して|thông qua ~; suốt ~ (をつうじて・をとおして)|N + を通じて / を通して\n(1) Qua trung gian, phương tiện. (2) Suốt cả khoảng thời gian.\n>インターネット 【を 通(つう)じて|に とって|に 対(たい)して|と して】、 世界(せかい)中(じゅう)の 人(ひと)と 友達(ともだち)に なれる。=Thông qua Internet có thể kết bạn với người khắp thế giới.\n>この 国(くに)は 一(いち)年(ねん) 【を 通(とお)して|に 加(くわ)えて|に ついて|に 比(くら)べて】 暖(あたた)かい。=Đất nước này ấm áp suốt cả năm.\n>友人(ゆうじん)を 【通(つう)じて|加(くわ)えて|比(くら)べて|対(たい)して】、 彼(かれ)と 知(し)り合(あ)った。=Tôi quen anh ấy qua một người bạn.\n##23\n@〜をはじめ|tiêu biểu là ~, trước hết là|N + をはじめ(として)\nNêu ví dụ tiêu biểu nhất rồi mở rộng ra cả nhóm.\n>この 町(まち)には、 美術(びじゅつ)館(かん) 【を はじめ|を 通(つう)じて|に 対(たい)して|と して】、 いろいろな 文化(ぶんか)施設(しせつ)が ある。=Thị trấn này có nhiều cơ sở văn hoá, tiêu biểu là bảo tàng mỹ thuật.\n>社長(しゃちょう)を はじめ、 社員(しゃいん)全員(ぜんいん) 【が|を|に|で】 出席(しゅっせき)した。=Từ giám đốc trở xuống, toàn bộ nhân viên đều có mặt.\n>日本(にほん)には、 京都(きょうと) 【を はじめと して|を はじめに して|の はじめと して|が はじめと して】、 古(ふる)い 町(まち)が たくさん ある。=Nhật Bản có nhiều thành phố cổ, tiêu biểu là Kyoto.\n##24\n@〜を中心に|lấy ~ làm trung tâm (をちゅうしんに)|N + を中心に(して) / を中心とした + N\nNêu phần chính, trọng tâm của hoạt động hay phạm vi.\n>この 店(みせ)は 若(わか)い 女性(じょせい) 【を 中心(ちゅうしん)に|を はじめ|を 通(つう)じて|に 対(たい)して】 人気(にんき)が ある。=Cửa hàng này được ưa chuộng, chủ yếu là phụ nữ trẻ.\n>駅(えき) 【を 中心(ちゅうしん)と して|に 中心(ちゅうしん)と して|が 中心(ちゅうしん)に して|の 中心(ちゅうしん)と して】、 町(まち)が 広(ひろ)がっている。=Thị trấn trải rộng với nhà ga là trung tâm.\n>今日(きょう)の 授業(じゅぎょう)は 文法(ぶんぽう) 【を 中心(ちゅうしん)に|に ついて 中心(ちゅうしん)|に 関(かん)して 中心(ちゅうしん)|と して 中心(ちゅうしん)】 勉強(べんきょう)します。=Giờ học hôm nay chủ yếu học ngữ pháp.\n##25\n@〜から〜にかけて|từ ~ cho đến ~ (khoảng chừng)|N1 から N2 にかけて\nPhạm vi thời gian hoặc không gian không rạch ròi như から〜まで.\n>昨夜(さくや)から 今朝(けさ) 【に かけて|に わたって|を 通(つう)じて|に おいて】、 大雨(おおあめ)が 降(ふ)った。=Từ tối qua đến sáng nay trời mưa to.\n>この 花(はな)は 6月(がつ)から 7月(がつ)に 【かけて|ついて|とって|対(たい)して】 咲(さ)きます。=Loài hoa này nở từ tháng 6 đến tháng 7.\n>関東(かんとう)から 東北(とうほく)に かけて、 強(つよ)い 地震(じしん)が 【ありました|ある つもりです|あってください|あろう】。=Đã có động đất mạnh từ vùng Kanto đến Tohoku.\n##26\n@〜にわたって|trải suốt, trên khắp ~|N (thời gian, phạm vi lớn) + にわたって / にわたる + N\nNhấn mạnh quy mô lớn của thời gian, phạm vi.\n!にわたって đi với con số \"to\": 10年, 全国, 3日間.\n>会議(かいぎ)は 5時間(じかん) 【に わたって|に かけて|に ついて|に 対(たい)して】 続(つづ)いた。=Cuộc họp kéo dài suốt 5 tiếng.\n>10年(ねん) 【に わたる|に わたって|に かけて|に ついて】 研究(けんきゅう)が やっと 終(お)わった。=Công trình nghiên cứu trải suốt 10 năm cuối cùng đã xong.\n>この 道路(どうろ)は 全国(ぜんこく) 【に わたって|に おいて|に 比(くら)べて|と して】 工事(こうじ)が 行(おこな)われている。=Con đường này đang được thi công trên khắp cả nước.\n##27\n@〜わけだ|thảo nào ~; tức là ~|thể thông thường + わけだ (N の / な, A-な + な)\n(1) Hiểu ra lý do nên thấy kết quả là đương nhiên. (2) Diễn đạt lại bằng cách khác.\n!わけ = \"lý lẽ\". わけだ = \"à, ra thế nên mới…\".\n>10年(ねん)も 日本(にほん)に 住(す)んでいたのか。 日本(にほん)語(ご)が 上手(じょうず)な 【わけだ|はずが ない|ことだ|ものだ】。=Sống ở Nhật tận 10 năm à. Thảo nào giỏi tiếng Nhật.\n>暖房(だんぼう)が ついていない。 寒(さむ)い 【わけだ|わけが ない|わけでは ない|わけには いかない】。=Máy sưởi không bật. Thảo nào lạnh.\n>一(いち)日(にち)8時間(じかん)、 週(しゅう)に 5日(いつか) 働(はたら)く。 つまり、 週(しゅう)に 40時間(じかん) 働(はたら)く 【わけだ|ことだ|ものだ|べきだ】。=Mỗi ngày làm 8 tiếng, tuần 5 ngày. Tức là tuần làm 40 tiếng.\n##28\n@〜わけがない|không lý nào ~|thể thông thường + わけがない (N の / な, A-な + な)\nPhủ định mạnh theo suy luận của người nói, gần với はずがない.\n>こんなに 難(むずか)しい 問題(もんだい)が、 子供(こども)に 【わかる わけが ない|わかる わけだ|わかる わけでは ない|わかる わけには いかない】。=Bài khó thế này trẻ con không lý nào hiểu được.\n>あんなに 練習(れんしゅう)したんだから、 負(ま)ける 【わけが ない|ことは ない|べきでは ない|ものでは ない】。=Luyện tập đến thế rồi thì không lý nào thua.\n>彼(かれ)は 今(いま)、 海外(かいがい)に いるのだから、 ここに 来(こ)られる 【わけが ない|わけだ|わけに なる|はずだ】。=Anh ấy đang ở nước ngoài nên không lý nào đến đây được.\n##29\n@〜わけではない|không hẳn là ~, không có nghĩa là|thể thông thường + わけではない\nPhủ định một phần điều người ta dễ suy ra.\n!\"Không phải cứ… là…\". Hay đi với 全部, いつも, 必ずしも.\n>料理(りょうり)が できない 【わけでは ない|わけが ない|わけには いかない|はずが ない】 が、 忙(いそが)しくて あまり 作(つく)らない。=Không hẳn là tôi không biết nấu ăn, nhưng bận nên ít nấu.\n>高(たか)い ものが いつも いい 【わけでは ない|わけだ|ものだ|べきだ】。=Không phải đồ đắt lúc nào cũng tốt.\n>嫌(きら)いな 【わけでは ありません|わけが ありません|わけには いきません|ことは ありません】 が、 今日(きょう)は 食(た)べたく ないんです。=Không hẳn là tôi ghét, nhưng hôm nay tôi không muốn ăn.\n##30\n@〜わけにはいかない|không thể ~ (vì lẽ phải, hoàn cảnh)|V-từ điển + わけにはいかない ・ V ない + わけにはいかない (buộc phải)\nMuốn nhưng về mặt đạo lý, trách nhiệm thì không thể. Không dùng cho \"không có khả năng\".\n>明日(あした)は 大事(だいじ)な 試験(しけん)が あるので、 休(やす)む 【わけには いかない|わけでは ない|わけが ない|ことは ない】。=Mai có kỳ thi quan trọng nên tôi không thể nghỉ.\n>約束(やくそく)したのだから、 行(い)かない 【わけには いかない|わけだ|はずが ない|べきだ】。=Đã hứa rồi nên không thể không đi.\n>車(くるま)で来(き)たので、 お酒(さけ)を 飲(の)む 【わけには いきません|ことが できませんか|はずが ありません|わけでは ありません】。=Tôi đi ô tô đến nên không thể uống rượu.\n##31\n@〜べきだ|nên ~, phải ~ (lẽ phải)|V-từ điển + べきだ (する → すべきだ / するべきだ) ・ phủ định: べきではない\nNêu điều mà theo lẽ thường, đạo lý là đúng.\n!Phủ định là べきではない, không nói ないべきだ.\n>約束(やくそく)は 守(まも)る 【べきだ|ことだ|ものだ|わけだ】。=Lời hứa thì phải giữ.\n>人(ひと)の 悪口(わるぐち)を 言(い)う 【べきでは ない|ないべきだ|べきが ない|べきに ない】。=Không nên nói xấu người khác.\n>学生(がくせい)は もっと 本(ほん)を 【読(よ)むべきだ|読(よ)みべきだ|読(よ)んでべきだ|読(よ)んだべきだ】 と 思(おも)う。=Tôi nghĩ sinh viên nên đọc sách nhiều hơn.\n##32\n@〜ことだ|nên ~ (lời khuyên)|V-từ điển / V ない + ことだ\nLời khuyên của người trên hoặc người có kinh nghiệm: \"tốt nhất là\".\n>日本(にほん)語(ご)が 上手(じょうず)に なりたいなら、 毎日(まいにち) 話(はな)す 【ことだ|わけだ|ものか|ことか】。=Nếu muốn giỏi tiếng Nhật thì nên nói mỗi ngày.\n>風邪(かぜ)を 早(はや)く 治(なお)したいなら、 よく 寝(ね)る 【ことです|ものですか|わけです|はずです】。=Nếu muốn mau khỏi cảm thì nên ngủ đủ.\n>健康(けんこう)の ためには、 無理(むり)を 【しない ことだ|しなく ことだ|せず ことだ|しない わけだ】。=Vì sức khoẻ, tốt nhất đừng làm quá sức.\n##33\n@〜ことはない|không cần phải ~|V-từ điển + ことはない\nKhuyên rằng không cần thiết, đừng lo.\n>時間(じかん)は 十分(じゅうぶん) あるから、 急(いそ)ぐ 【ことは ない|わけが ない|べきだ|ことだ】。=Còn đủ thời gian nên không cần vội.\n>君(きみ)が 悪(わる)いんじゃ ないんだから、 謝(あやま)る 【ことは ない|ものでは ないか|わけだ|はずだ】 よ。=Không phải lỗi của cậu nên không cần xin lỗi đâu.\n>電話(でんわ)で 済(す)むのだから、 わざわざ 【行(い)く ことは ない|行(い)った ことは ない|行(い)って ことは ない|行(い)く ことが ある】。=Gọi điện là xong nên không cần cất công đi.\n##34\n@〜ことから|từ việc ~ mà (căn cứ, nguồn gốc)|thể thông thường + ことから (N である, A-な + な)\nNêu lý do đặt tên, căn cứ để phán đoán.\n>富士(ふじ)山(やま)が 見(み)える 【ことから|ことに|ことでは|ことだ】、 この 町(まち)は 富士見町(ふじみちょう)と 呼(よ)ばれている。=Vì nhìn thấy núi Phú Sĩ nên thị trấn này được gọi là Fujimi.\n>道(みち)が ぬれている 【ことから|ことは なく|ことなら|ことに して】、 雨(あめ)が 降(ふ)った ことが わかる。=Từ việc đường ướt, biết là trời đã mưa.\n>彼(かれ)は 何(なん)でも 知(し)っている 【ことから|ことによりは|ものから|わけから】、 「先生(せんせい)」と 呼(よ)ばれている。=Vì cái gì cũng biết nên anh ấy được gọi là \"thầy\".\n##35\n@〜ことに|thật là ~ (nêu cảm xúc trước)|V た / A-い / A-な + な + ことに\nĐưa cảm xúc của người nói lên đầu câu: 驚いたことに, 残念なことに, うれしいことに.\n>【驚(おどろ)いた ことに|驚(おどろ)く ことで|驚(おどろ)いた ことから|驚(おどろ)いた ことは】、 彼(かれ)は 一人(ひとり)で その 仕事(しごと)を 終(お)わらせた。=Thật đáng ngạc nhiên, anh ấy đã một mình làm xong việc đó.\n>【残念(ざんねん)な ことに|残念(ざんねん) ことに|残念(ざんねん)の ことに|残念(ざんねん)だ ことに】、 明日(あした)の 試合(しあい)は 中止(ちゅうし)に なった。=Thật đáng tiếc, trận đấu ngày mai bị huỷ.\n>うれしい 【ことに|ことから|ものに|わけに】、 試験(しけん)に 合格(ごうかく)した。=Thật vui là tôi đã thi đỗ.\n##36\n@〜ものだ|vốn dĩ ~; hồi đó thường ~; thật là ~|V-từ điển / A + ものだ (lẽ thường) ・ V た + ものだ (hồi tưởng) ・ cảm thán\n(1) Lẽ tự nhiên, bản chất. (2) Nhớ lại thói quen xưa. (3) Cảm thán sâu sắc.\n!Có よく + V た ものだ là đang \"nhớ ngày xưa\".\n>子供(こども)の ころ、 よく この 川(かわ)で 【泳(およ)いだ ものだ|泳(およ)ぐ ことだ|泳(およ)いだ わけだ|泳(およ)ぐべきだ】。=Hồi nhỏ tôi hay bơi ở con sông này.\n>人(ひと)の 気持(きも)ちは 変(か)わる 【ものだ|ことだ|べきだ|わけには いかない】。=Lòng người vốn dĩ thay đổi.\n>時間(じかん)が たつのは 早(はや)い 【ものです|ことですか|はずです|わけには いきません】 ね。=Thời gian trôi nhanh thật đấy nhỉ.\n##37\n@〜ものだから|tại vì ~ (phân trần)|thể thông thường + ものだから (N, A-な + な)\nGiải thích lý do mang tính bào chữa. Khi nói: もんだから.\n>目覚(めざ)まし時計(とけい)が 鳴(な)らなかった 【ものだから|ものの|ものなら|ものでも】、 遅刻(ちこく)してしまいました。=Tại đồng hồ báo thức không kêu nên tôi đã đi muộn.\n>あまり 安(やす)かった 【ものだから|ことだからは|わけだから|べきだから】、 つい 買(か)ってしまった。=Tại rẻ quá nên tôi lỡ mua mất.\n>急(いそ)いでいた 【ものですから|ものですので|ものですのに|ものですけど】、 あいさつも しないで 失礼(しつれい) しました。=Tại tôi đang vội nên đã thất lễ không chào hỏi.\n##38\n@〜ものの|tuy ~ nhưng|thể thông thường + ものの (N である, A-な + な)\nCông nhận vế trước nhưng thực tế vế sau không được như mong đợi. Văn viết.\n>新(あたら)しい パソコンを 買(か)った 【ものの|ものだから|ものなら|もので】、 使(つか)い方(かた)が よく わからない。=Tuy đã mua máy tính mới nhưng tôi không rõ cách dùng.\n>大学(だいがく)は 卒業(そつぎょう)した 【ものの|ものを|ことの|わけの】、 まだ 仕事(しごと)が 見(み)つからない。=Tuy đã tốt nghiệp đại học nhưng vẫn chưa tìm được việc.\n>行(い)くと 言(い)った 【ものの|ものだから|ので|ために】、 本当(ほんとう)は 行(い)きたく ない。=Tuy đã nói là đi nhưng thật ra tôi không muốn đi.\n##39\n@〜もの・〜もん|vì ~ mà (thân mật, phân bua)|thể thông thường + もの / もん (thường có だって ở đầu)\nNêu lý do kiểu nũng nịu, bào chữa trong hội thoại thân mật.\n>A 「どう して 食(た)べないの？」 B 「だって、 【嫌(きら)いなんだもん|嫌(きら)いなんだ もので|嫌(きら)いな ものだ|嫌(きら)いだ もんで】。」=A: Sao không ăn? B: Tại vì ghét mà.\n>一人(ひとり)で行(い)けるよ。 もう 子供(こども)じゃ ない 【もの|ものの|ものだか|ことだ】。=Tớ đi một mình được. Có phải trẻ con nữa đâu.\n>遅(おく)れて ごめん。だって、 電車(でんしゃ)が 【止(と)まっちゃったんだもん|止(と)まっちゃう ものの|止(と)まるべきだもん|止(と)まった ことだもん】。=Xin lỗi đến muộn. Tại tàu dừng mất mà.\n##40\n@〜ようとする|định ~; sắp ~|V-ý chí + とする\n(1) Cố gắng, toan làm. (2) Ngay trước khi việc xảy ra.\n>電車(でんしゃ)に 【乗(の)ろうと した|乗(の)ると した|乗(の)ってと した|乗(の)りようと した】 とき、 ドアが 閉(し)まってしまった。=Lúc tôi định lên tàu thì cửa đóng mất.\n>お風呂(ふろ)に 入(はい)ろう 【と した|に した|を した|が した】 ところに、 電話(でんわ)が かかってきた。=Đúng lúc định vào tắm thì điện thoại gọi đến.\n>彼(かれ)は 何(なに)か 【言(い)おうと して|言(い)うと して|言(い)ったと して|言(い)おうに して】、 やめた。=Anh ấy định nói gì đó rồi lại thôi.\n##41\n@〜ようとしない|không chịu ~|V-ý chí + としない\nNgười khác không có ý định làm việc đáng ra nên làm.\n!Chủ ngữ là người khác, không dùng cho \"tôi\".\n>息子(むすこ)は いくら 言(い)っても、 勉強(べんきょう) 【しようと しない|しようと する|すると しない|したがらなく する】。=Con trai tôi nói bao nhiêu cũng không chịu học.\n>彼(かれ)は 自分(じぶん)の 間違(まちが)いを 【認(みと)めようと しない|認(みと)めると しない|認(みと)め ように しない|認(みと)めたと しない】。=Anh ấy không chịu nhận lỗi sai của mình.\n>子供(こども)が 薬(くすり)を 【飲(の)もうと しなくて|飲(の)むと しなくて|飲(の)もうに しなくて|飲(の)んでと しなくて】、 困(こま)っている。=Con không chịu uống thuốc nên tôi khổ sở.\n##42\n@〜ように言う・頼む・注意する|bảo / nhờ / nhắc (ai) ~|V-từ điển / V ない + ように + 言う・頼む・注意する・伝える\nTruyền đạt gián tiếp mệnh lệnh, yêu cầu.\n>先生(せんせい)は 学生(がくせい)に、 宿題(しゅくだい)を 忘(わす)れない 【ように|ために|ことに|ような】 言(い)いました。=Thầy đã bảo học sinh đừng quên bài tập.\n>母(はは)に、 帰(かえ)りに 牛乳(ぎゅうにゅう)を 買(か)ってくる 【ように 頼(たの)まれた|ために 頼(たの)まれた|ように 頼(たの)ませた|ことを 頼(たの)んだ】。=Tôi được mẹ nhờ mua sữa trên đường về.\n>医者(いしゃ)に、 お酒(さけ)を 【飲(の)まない ように|飲(の)まなく ように|飲(の)まず ように|飲(の)まない ことに】 注意(ちゅうい)された。=Tôi bị bác sĩ nhắc là đừng uống rượu.\n##43\n@〜ようがない|không có cách nào ~|V (bỏ ます) + ようがない\nMuốn làm nhưng không có phương tiện, cách thức.\n>電話(でんわ)番号(ばんごう)が わからないので、 連絡(れんらく)の 【しようが ない|する ようが ない|して ようが ない|しようも ある】。=Không biết số điện thoại nên không có cách nào liên lạc.\n>こんなに 壊(こわ)れていては、 【直(なお)しようが ない|直(なお)す ようが ない|直(なお)して ようが ない|直(なお)り ように ない】。=Hỏng đến thế này thì không có cách nào sửa.\n>名前(なまえ)も 住所(じゅうしょ)も わからないのでは、 【探(さが)しようが ありません|探(さが)す ようが ありません|探(さが)し ように ありません|探(さが)し そうが ありません】。=Tên và địa chỉ đều không biết thì không có cách nào tìm.\n##44\n@まるで〜ようだ|cứ như là ~|まるで + N の / V-thường + ようだ・みたいだ\nSo sánh ví von với điều không có thật.\n>彼女(かのじょ)の 日本(にほん)語(ご)は 上手(じょうず)で、 【まるで|たとえ|もし|どんなに】 日本(にほん)人(じん)の ようだ。=Tiếng Nhật của cô ấy giỏi, cứ như người Nhật.\n>今日(きょう)は 暖(あたた)かくて、 まるで 春(はる)が 【来(き)た ようだ|来(く)る そうだ|来(き)たらしいの|来(く)る はずだ】。=Hôm nay ấm, cứ như mùa xuân đã đến.\n>合格(ごうかく)したなんて、 まるで 夢(ゆめ) 【の ようだ|な ようだ|だ ようだ|ようだ】。=Thi đỗ rồi ư, cứ như là mơ.\n##45\n@〜ということだ|nghe nói ~; tức là ~|thể thông thường + ということだ / とのことだ\n(1) Truyền đạt lại nguyên văn thông tin. (2) Rút ra kết luận, diễn giải.\n>天気(てんき)予報(よほう)に よると、 明日(あした)は 雪(ゆき)が 降(ふ)る 【と いう ことだ|と いう ものだ|と いう ことか|と いう わけが ない】。=Theo dự báo thời tiết, nghe nói mai có tuyết.\n>田中(たなか)さんから 電話(でんわ)が あって、 少(すこ)し 遅(おく)れる 【との ことです|ものです|べきです|わけには いきません】。=Anh Tanaka gọi điện, nói là sẽ đến muộn một chút.\n>返事(へんじ)が ないのは、 行(い)きたく ない 【と いう ことだ|と いう ものの|と いう ことに|と いうのは】 ろう。=Không trả lời tức là không muốn đi đấy.\n##46\n@〜というのは|~ nghĩa là, ~ tức là|N + というのは + định nghĩa + (という)ことだ / 意味だ\nGiải thích nghĩa của từ, hoặc nêu chủ đề để nói rõ. Khi nói: って.\n>「禁煙(きんえん)」 【と いうのは|と いうより|と いっても|と いう ことで】、 たばこを 吸(す)っては いけないと いう 意味(いみ)だ。=\"Cấm hút thuốc\" nghĩa là không được hút thuốc.\n>「駅弁(えきべん)」と いうのは、 駅(えき)で 売(う)っている 弁当(べんとう)の 【ことだ|ものだ|わけだ|はずだ】。=\"Ekiben\" tức là cơm hộp bán ở nhà ga.\n>パソコン 【と いうのは|と して|に ついて|に 対(たい)して】、 パーソナルコンピューターの ことです。=\"Pasokon\" tức là máy tính cá nhân.\n##47\n@〜というより|đúng hơn là ~|A というより (むしろ) B\nSo với cách nói A thì B chính xác hơn.\n>彼(かれ)は 歌手(かしゅ) 【と いうより|と いっても|と いうのは|と いう こと】、 俳優(はいゆう)だ。=Anh ấy là diễn viên thì đúng hơn là ca sĩ.\n>今日(きょう)は 涼(すず)しい 【と いうより|と いう ことで|と いうなら|と いえば】、 寒(さむ)いくらいだ。=Hôm nay đúng hơn là lạnh chứ không phải mát.\n>この 絵(え)は 絵(え)と いうより、 【むしろ|まるで|たとえ|どうも】 写真(しゃしん)の ようだ。=Bức tranh này giống ảnh chụp thì đúng hơn là tranh.\n##48\n@〜といっても|nói là ~ nhưng (thực tế không đến mức)|thể thông thường / N + といっても\nĐính chính rằng thực tế khác với hình dung từ lời vừa nói.\n>料理(りょうり)が できる 【と いっても|と いうより|と いうのは|と いえば】、 卵焼(たまごや)きぐらいしか 作(つく)れない。=Nói là biết nấu ăn nhưng tôi chỉ làm được trứng rán thôi.\n>日本(にほん)語(ご)が 話(はな)せると いっても、 簡単(かんたん)な あいさつ 【だけだ|ばかりで なく|ほどだ|べきだ】。=Nói là nói được tiếng Nhật nhưng chỉ là chào hỏi đơn giản.\n>社長(しゃちょう) 【と いっても|と して|に とって|に ついて】、 社員(しゃいん)は 3人(にん)しか いない 小(ちい)さい 会社(かいしゃ)だ。=Nói là giám đốc nhưng công ty nhỏ chỉ có 3 nhân viên.\n##49\n@〜とは限らない|chưa chắc ~, không hẳn ~ (とはかぎらない)|thể thông thường + とは限らない\nĐiều thường được cho là đúng nhưng vẫn có ngoại lệ. Hay đi với 必ずしも, いつも.\n>高(たか)い 店(みせ)が おいしい 【とは 限(かぎ)らない|わけには いかない|ことは ない|べきでは ない】。=Quán đắt chưa chắc đã ngon.\n>日本(にほん)人(じん)が みんな 漢字(かんじ)に 詳(くわ)しい 【とは 限(かぎ)りません|と いう ことです|ものです|はずです】。=Không hẳn người Nhật nào cũng rành chữ Hán.\n>お金(かね)が あれば、 【必(かなら)ずしも|まるで|たとえ|せっかく】 幸(しあわ)せに なれるとは 限(かぎ)らない。=Có tiền chưa chắc đã nhất định hạnh phúc.\n##50\n@〜と言えば|nhắc đến ~ thì (といえば)|N + と言えば / というと / といったら\nLấy từ vừa xuất hiện làm chủ đề, hoặc nêu điều tiêu biểu nghĩ đến ngay.\n>日本(にほん)の 花(はな) 【と 言(い)えば|と 言(い)っても|と いうより|と いうのは】、 やはり 桜(さくら)でしょう。=Nhắc đến hoa của Nhật thì đúng là anh đào.\n>A 「来週(らいしゅう)、 北海道(ほっかいどう)へ 行(い)くんです。」 B 「北海道(ほっかいどう) 【と 言(い)えば|と して|に とって|に 比(くら)べて】、 ラーメンが おいしいですよね。」=A: Tuần sau tôi đi Hokkaido. B: Nhắc đến Hokkaido thì mì ramen ngon nhỉ.\n>夏(なつ)と いうと、 海(うみ)を 【思(おも)い出(だ)す|思(おも)い出(だ)せ|思(おも)い出(だ)そう|思(おも)い出(だ)して】 人(ひと)が 多(おお)い。=Nhắc đến mùa hè, nhiều người nghĩ đến biển.\n##51\n@〜たらいい・〜ばいい・〜といい|nên ~ thì hơn; giá mà ~|V たら / V ば / V-từ điển と + いい\n(1) Lời khuyên, gợi ý. (2) Mong ước (+ のに, なあ).\n>道(みち)が わからなかったら、 交番(こうばん)で 【聞(き)けば いい|聞(き)くば いい|聞(き)いたば いい|聞(き)けと いい】 ですよ。=Nếu không biết đường thì nên hỏi ở đồn cảnh sát.\n>明日(あした)、 晴(は)れる 【と いい|たら いい|ば いい|なら いい】 なあ。=Giá mà ngày mai trời nắng.\n>疲(つか)れたら、 少(すこ)し 【休(やす)んだら いい|休(やす)むたら いい|休(やす)んでば いい|休(やす)めたらと いい】 よ。=Mệt thì nghỉ một chút đi.\n##52\n@〜ば〜のに・〜たら〜のに|giá mà ~ thì đã ~ (tiếc nuối)|V ば / V たら + 〜のに\nTiếc về điều trái với thực tế.\n>もっと 早(はや)く 【起(お)きれば|起(お)きると|起(お)きるなら|起(お)きて】、 間(ま)に合(あ)ったのに。=Giá mà dậy sớm hơn thì đã kịp.\n>お金(かね)が あったら、 あの 車(くるま)が 買(か)える 【のに|ので|から|ために】。=Giá mà có tiền thì đã mua được cái xe đó.\n>一言(ひとこと) 言(い)ってくれれば、 手伝(てつだ)って 【あげたのに|あげるので|あげたから|あげようのに】。=Giá mà cậu nói một tiếng thì tớ đã giúp.\n##53\n@〜さえ〜ば|chỉ cần ~ là|N さえ + V ば ・ V (bỏ ます) さえ すれば ・ V て さえ いれば\nĐiều kiện duy nhất cần có; còn lại không quan trọng.\n!さえ〜ば = \"miễn là có… thì xong\".\n>お金(かね) 【さえ あれば|しか あれば|だけ あると|さえ あって】、 何(なん)でも 買(か)えると 思(おも)っている 人(ひと)が いる。=Có người nghĩ chỉ cần có tiền là mua được mọi thứ.\n>この 薬(くすり)を 【飲(の)みさえ すれば|飲(の)むさえ すれば|飲(の)んでさえ あれば|飲(の)みさえ あれば】、 すぐ 治(なお)ります。=Chỉ cần uống thuốc này là khỏi ngay.\n>あなたさえ 【よければ|いいば|よくて|いいならば】、 私(わたし)は かまいません。=Chỉ cần anh thấy được thì tôi không sao.\n##54\n@〜さえ|ngay cả ~ (cũng)|N (+ trợ từ) + さえ / でさえ\nNêu ví dụ cực đoan để ngầm hiểu những thứ khác là đương nhiên.\n>忙(いそが)しくて、 食事(しょくじ)を する 時間(じかん) 【さえ|だけ|しか|ほど】 ない。=Bận đến mức ngay cả thời gian ăn cũng không có.\n>こんな 簡単(かんたん)な 漢字(かんじ)は、 子供(こども) 【でさえ|にさえで|さえで|までで】 読(よ)める。=Chữ Hán đơn giản thế này ngay cả trẻ con cũng đọc được.\n>彼(かれ)は 自分(じぶん)の 名前(なまえ)さえ 【書(か)けない|書(か)ける|書(か)こう|書(か)きなさい】。=Anh ấy ngay cả tên mình cũng không viết được.\n##55\n@〜おかげで|nhờ ~ (kết quả tốt)|thể thông thường / N の / A-な + な + おかげで\nNêu nguyên nhân đem lại kết quả tốt, kèm ý biết ơn. Kết quả xấu thì dùng せいで. Cuối câu nói 〜おかげだ; vế sau không dùng mệnh lệnh hay ý chí.\n!おかげさまで = \"nhờ ơn anh chị\": おかげ đi với điều đáng mừng.\n>皆(みな)さんの 【応援(おうえん)の|応援(おうえん)な|応援(おうえん)だ|応援(おうえん)に】 おかげで、 試合(しあい)に 勝(か)つ ことが できました。=Nhờ sự cổ vũ của mọi người, tôi đã thắng được trận đấu.\n>先生(せんせい)が 丁寧(ていねい)に 教(おし)えてくださった 【おかげで|せいで|ついでに|ものの】、 試験(しけん)に 受(う)かりました。=Nhờ thầy dạy tận tình, tôi đã đỗ kỳ thi.\n>手術(しゅじゅつ)を 受(う)けた おかげで、 父(ちち)は すっかり 【元気(げんき)に なった|元気(げんき)に なろう|元気(げんき)に なりたい|元気(げんき)に なれ】。=Nhờ phẫu thuật, bố tôi đã khoẻ hẳn.\n##56\n@〜せいで・〜せいか|tại ~; có lẽ tại ~ (kết quả xấu)|thể thông thường / N の / A-な + な + せいで・せいか\nせいで nêu nguyên nhân gây ra kết quả xấu, có ý trách móc; trái nghĩa với おかげで. せいか dùng khi không chắc: \"không rõ nhưng có lẽ tại ~\". Cuối câu nói 〜せいだ.\n!人のせいにする = \"đổ lỗi cho người khác\": せい là \"lỗi tại\".\n>電車(でんしゃ)が 【遅(おく)れた|遅(おく)れて|遅(おく)れ|遅(おく)れよう】 せいで、 大事(だいじ)な 会議(かいぎ)に 間(ま)に合(あ)わなかった。=Tại tàu trễ mà tôi không kịp cuộc họp quan trọng.\n>大雪(おおゆき)の 【せいで|おかげで|ついでに|あまり】、 試合(しあい)が 延期(えんき)に なってしまった。=Tại tuyết lớn mà trận đấu bị hoãn mất rồi.\n>最近(さいきん) 暑(あつ)い 日(ひ)が 続(つづ)いている せいか、 あまり 【食欲(しょくよく)が ない|食欲(しょくよく)が ある|食(た)べましょう|食(た)べなさい】。=Có lẽ tại dạo này nắng nóng kéo dài nên tôi không muốn ăn lắm.\n##57\n@〜あまり|vì quá ~ nên|N の / V-từ điển / V た / A-な + な + あまり\nMức độ (thường là cảm xúc) quá mạnh nên dẫn đến kết quả khác thường, đa số là không hay. Tính từ い thường đổi thành danh từ rồi thêm の: うれしさのあまり, 悲しみのあまり. Vế sau không dùng ý chí, mệnh lệnh.\n!あまり = 余り \"phần dư\": cảm xúc nhiều đến mức tràn ra ngoài.\n>スピーチの 時(とき)、 【緊張(きんちょう)の|緊張(きんちょう)な|緊張(きんちょう)だ|緊張(きんちょう)に】 あまり、 覚(おぼ)えた ことを 全部(ぜんぶ) 忘(わす)れてしまった。=Lúc phát biểu, vì quá căng thẳng nên tôi quên sạch những gì đã thuộc.\n>弟(おとうと)の ことを 心配(しんぱい)する 【あまり|おかげで|ついでに|からには】、 母(はは)は 一晩中(ひとばんじゅう) 眠(ねむ)れなかった。=Vì quá lo cho em trai tôi, mẹ cả đêm không ngủ được.\n>悲(かな)しみの あまり、 彼女(かのじょ)は 何(なに)も 【食(た)べられなく なった|食(た)べましょう|食(た)べてください|食(た)べる つもりだ】。=Vì quá đau buồn, cô ấy không ăn nổi thứ gì.\n##58\n@〜からこそ|chính vì ~|thể thông thường + からこそ (N だ / A-な だ + からこそ)\nNhấn mạnh rằng đây chính là lý do, không phải lý do nào khác; thường là lý do người nghe không ngờ tới. Cuối câu hay có 〜のだ / 〜んです. Hầu như không dùng cho kết quả xấu.\n!から (vì) + こそ (chính là) = \"chính vì\".\n>あなたを 【信頼(しんらい)している|信頼(しんらい)していて|信頼(しんらい)してい|信頼(しんらい)しよう】 からこそ、 この 仕事(しごと)を 任(まか)せるのです。=Chính vì tin tưởng anh nên tôi mới giao việc này.\n>毎日(まいにち) 練習(れんしゅう)を 続(つづ)けた 【からこそ|からには|ものの|ついでに】、 ここまで 上達(じょうたつ)したのだと 思(おも)う。=Tôi nghĩ chính vì luyện tập mỗi ngày nên mới tiến bộ được đến mức này.\n>苦(くる)しい 経験(けいけん)を 乗(の)り越(こ)えたからこそ、 今(いま)の 自分(じぶん)が 【あるのだ|ある つもりだ|ある ところだ|あるな】。=Chính vì đã vượt qua những trải nghiệm khổ sở nên mới có tôi của hôm nay.\n##59\n@〜からには|một khi đã ~ thì|thể thông thường + からには (N である / A-な である + からには)\nĐã ở vào hoàn cảnh đó thì đương nhiên phải làm cho đến nơi đến chốn. Vế sau là quyết tâm, nghĩa vụ, mong muốn, lời khuyên: 〜つもりだ, 〜たい, 〜なければならない, 〜べきだ. Không dùng để kể nguyên nhân của một việc đã xảy ra.\n!Thấy からには thì vế sau là \"phải, sẽ, muốn\": đã nói là làm.\n>試合(しあい)に 【出(で)る|出(で)|出(で)て|出(で)よう】 からには、 全力(ぜんりょく)で 戦(たたか)いたい。=Một khi đã ra thi đấu thì tôi muốn chiến đấu hết sức.\n>約束(やくそく)した 【からには|せいか|とたんに|ついでに】、 最後(さいご)まで 守(まも)らなければ ならない。=Một khi đã hứa thì phải giữ lời đến cùng.\n>日本(にほん)に 留学(りゅうがく)するからには、 一生(いっしょう)懸命(けんめい) 勉強(べんきょう)する 【つもりだ|ところだった|ことが ある|せいだ】。=Một khi đã du học Nhật thì tôi định sẽ học hết mình.\n##60\n@〜うえ(に)|đã ~ lại còn ~|thể thông thường / N の / A-な + な + うえ(に)\nThêm một điều cùng chiều (cùng tốt hoặc cùng xấu) vào điều vừa nêu. Vế sau hay có も; không dùng mệnh lệnh, rủ rê. Gần nghĩa với 〜ばかりでなく.\n!上 = \"bên trên\": chồng thêm một điều lên trên điều đã có.\n>この 店(みせ)は 魚(さかな)が 【新鮮(しんせん)な|新鮮(しんせん)の|新鮮(しんせん)だ|新鮮(しんせん)に】 うえに、 値段(ねだん)も 安(やす)い。=Quán này cá đã tươi, giá lại còn rẻ.\n>この かばんは 軽(かる)い 【うえに|せいで|ものの|あまり】、 デザインも いいので、 気(き)に 入(い)っている。=Cái cặp này đã nhẹ, kiểu dáng lại đẹp nên tôi rất ưng.\n>彼(かれ)は まじめな うえに、 【仕事(しごと)も 速(はや)くて|仕事(しごと)が 遅(おそ)くて|よく 遅刻(ちこく)して|約束(やくそく)を 守(まも)らなくて】、 みんなに 信頼(しんらい)されている。=Anh ấy đã chăm chỉ, làm việc lại nhanh nên được mọi người tin cậy.\n##61\n@〜ほど・〜くらい|đến mức ~|V-từ điển / V ない / A-い / A-な + な / N + ほど・くらい(ぐらい)\nNêu một hình ảnh cụ thể, thường hơi cường điệu, để cho thấy trạng thái ở mức cao đến đâu. ほど hơi trang trọng; くらい(ぐらい) thân mật hơn và còn dùng cho mức độ nhẹ, không đáng kể (それくらい). Trước ほど / くらい luôn là thể thông thường, không dùng thể ます.\n!Vế trước ほど / くらい chỉ là hình ảnh minh hoạ, vế sau mới là điều muốn nói: 死ぬほど 疲れた = mệt \"muốn chết\".\n>歯(は)が 痛(いた)くて、 夜(よる)も 【眠(ねむ)れない|眠(ねむ)れなくて|眠(ねむ)れなく|眠(ねむ)れません】 ほどだった。=Răng đau đến mức đêm cũng không ngủ được.\n>朝(あさ)の 電車(でんしゃ)は、 動(うご)けない 【くらい|さえ|しか|だらけ】 混雑(こんざつ)していた。=Tàu điện buổi sáng đông đến mức không cựa quậy nổi.\n>今週(こんしゅう)は 残業(ざんぎょう)が 多(おお)くて、 家族(かぞく)と 話(はな)す 時間(じかん)も ないほど 【忙(いそが)しかった|暇(ひま)だった|楽(らく)だった|退屈(たいくつ)だった】。=Tuần này tăng ca nhiều, bận đến mức không có cả thời gian nói chuyện với gia đình.\n##62\n@〜ほど〜はない|không gì ~ bằng|N + ほど(くらい) + … N は ない / いない\nNgười nói khẳng định theo cảm nhận của mình rằng N là nhất: \"không có gì / không ai … bằng N\". Nói về người thì kết thúc bằng 人は いない. Có thể thay ほど bằng くらい; trước ほど là danh từ (hoặc V + こと), không thêm の hay な.\n!Cuối câu là ない nhưng ý lại là \"số một\": N ほど 〜 ものは ない = N là nhất.\n>私(わたし)に とって、 家族(かぞく) 【ほど|のほど|なほど|でほど】 大切(たいせつ)な ものは ない。=Đối với tôi, không gì quan trọng bằng gia đình.\n>疲(つか)れて 帰(かえ)った とき、 子供(こども)の 笑顔(えがお)ほど うれしい ものは 【ない|ある|いない|ならない】。=Khi mệt mỏi về đến nhà, không gì vui bằng nụ cười của con.\n>登山(とざん)の あとで 飲(の)む 水(みず) 【ほど|さえ|まで|ばかり】 おいしい ものは ない。=Không gì ngon bằng ngụm nước uống sau khi leo núi.\n##63\n@〜ば〜ほど|càng ~ càng ~|V ば + V-từ điển + ほど ・ A-い (bỏ い) ければ + A-い + ほど ・ A-な なら + A-な + な + ほど\nMột việc tăng lên thì việc khác cũng thay đổi theo. Cùng một từ được nhắc lại hai lần; vế sau thường là sự thay đổi (〜く なる, 上達する) hoặc đánh giá (いい). Với động từ する thì chỉ lặp する: 練習すれば するほど. Không thay ほど bằng くらい được.\n!Một từ nói hai lần: lần đầu thể ば, lần sau thể từ điển + ほど. Tính từ な: 簡単なら 簡単なほど.\n>外国(がいこく)語(ご)は、 【使(つか)えば|使(つか)うば|使(つか)ったば|使(つか)えれば】 使(つか)うほど 上手(じょうず)に なる。=Ngoại ngữ thì càng dùng càng giỏi.\n>ピアノは、 練習(れんしゅう)すれば する 【ほど|くらい|たびに|さえ】 上達(じょうたつ)する。=Piano thì càng luyện càng tiến bộ.\n>機械(きかい)の 使(つか)い方(かた)は、 簡単(かんたん)なら 【簡単(かんたん)な|簡単(かんたん)だ|簡単(かんたん)に|簡単(かんたん)で】 ほど いい。=Cách dùng máy móc thì càng đơn giản càng tốt.\n##64\n@〜わりに(は)|so với ~ thì (khác dự đoán)|thể thông thường / N の / A-な + な + わりに(は)\nKết quả không tương xứng với mức mà người ta thường suy ra từ vế trước: tốt hơn hoặc kém hơn dự đoán, khen chê đều dùng được. Hay đi với từ chỉ mức độ như 値段, 年, 量, 高い, 安い, よく 食べる.\n!わり là 割合 (tỉ lệ): \"không cân xứng với…\". 値段の わりに = so với giá tiền thì…\n>この ホテルは、 値段(ねだん) 【の わりに|な わりに|だ わりに|を わりに】 部屋(へや)が 広(ひろ)い。=Khách sạn này so với giá tiền thì phòng rộng.\n>この かばんは、 荷物(にもつ)が たくさん 入(はい)る 【わりに|たびに|ものだから|ついでに】、 とても 軽(かる)い。=Cái túi này đựng được nhiều đồ thế mà lại rất nhẹ.\n>兄(あに)は よく 食(た)べる わりに、 全然(ぜんぜん) 【太(ふと)らない|太(ふと)る|太(ふと)った|太(ふと)りやすい】。=Anh tôi ăn nhiều thế mà chẳng béo chút nào.\n##65\n@〜にしては|xét theo ~ thì (khác mức thông thường)|N / thể thông thường (N, A-な không thêm だ) + にしては\nLấy một sự thật cụ thể (tuổi, nghề, số năm, việc đã làm) làm chuẩn rồi nêu điều khác với mức người ta thường nghĩ. Khác わりに: にしては đi sau danh từ, con số, sự việc cụ thể, không đi ngay sau tính từ chỉ mức độ (✗ 安いに しては → ○ 安い わりに).\n!Trước に しては là \"thân phận\" hoặc con số cụ thể: 子供に しては, 初めてに しては, 1年に しては.\n>この ケーキは、 初(はじ)めて 【作(つく)った|作(つく)って|作(つく)り|作(つく)ろう】 に しては、 よく できている。=Cái bánh này, xét là lần đầu làm thì trông khá ổn.\n>山田(やまだ)さんは、 新人(しんじん) 【に しては|に つれて|に よって|に 関(かん)して】 仕事(しごと)が 速(はや)い。=Anh Yamada tuy là người mới mà làm việc nhanh.\n>彼女(かのじょ)は、 日本(にほん)に 10年(ねん) 住(す)んでいたに しては、 日本(にほん)語(ご)が 【下手(へた)だ|上手(じょうず)だ|ぺらぺらだ|よく わかる】。=Cô ấy đã sống ở Nhật 10 năm, vậy mà tiếng Nhật lại kém.\n##66\n@〜くせに|đã ~ mà còn (trách móc)|thể thông thường / N の / A-な + な + くせに\nNghĩa gần のに nhưng mang ý trách móc, bực bội hoặc coi thường người được nói đến. Hai vế phải cùng một chủ ngữ; vế sau không là lời nhờ vả, rủ rê. Là cách nói thân mật, không dùng với người trên.\n!くせ là 癖 (thói, tật): nói くせに là đang bực \"cái thói ấy\". Muốn lịch sự thì đổi thành のに.\n>弟(おとうと)は、 まだ 子供(こども) 【の くせに|な くせに|だ くせに|に くせに】、 偉(えら)そうな ことを 言(い)う。=Em trai tôi vẫn còn là trẻ con mà nói năng ra vẻ ta đây.\n>彼(かれ)は、 自分(じぶん)では 何(なに)も しない 【くせに|たびに|ついでに|とたんに】、 文句(もんく)ばかり 言(い)う。=Anh ta tự mình chẳng làm gì mà chỉ toàn phàn nàn.\n>田中(たなか)さんは、 本当(ほんとう)は 知(し)っている くせに、 【教(おし)えてくれない|教(おし)えてくれる|教(おし)えてください|教(おし)えましょう】。=Anh Tanaka thật ra biết mà lại không chịu chỉ cho tôi.\n##67\n@〜かわりに|thay vì ~; đổi lại ~|V-từ điển / V た / A-い / A-な + な / N の + かわりに\n(1) Không làm việc A mà làm việc B thay vào đó (N の かわりに = thay cho N). (2) Đổi lại, bù lại: nhận được điều này thì làm lại điều kia, hoặc một việc có mặt được bù cho mặt mất.\n!かわりに gốc là 代わる (thay, đổi): cái này thế chỗ hoặc đổi lấy cái kia.\n>昼(ひる)ご飯(はん)は、 外食(がいしょく)を 【する|しよう|すれば|したり】 かわりに、 弁当(べんとう)を 持(も)っていく ことに した。=Bữa trưa, thay vì ăn ngoài, tôi quyết định mang cơm hộp đi.\n>この 仕事(しごと)は 給料(きゅうりょう)が 高(たか)い 【かわりに|たびに|ついでに|とおりに】、 残業(ざんぎょう)が 多(おお)くて 危険(きけん)な ことも ある。=Công việc này lương cao nhưng bù lại phải làm thêm nhiều và có lúc nguy hiểm.\n>日曜日(にちようび)に 働(はたら)いた かわりに、 月曜日(げつようび)は 【休(やす)ませてもらった|働(はたら)かせてもらった|休(やす)めなかった|残業(ざんぎょう)させられた】。=Vì đã đi làm Chủ nhật nên bù lại, thứ Hai tôi được cho nghỉ.\n##68\n@〜にかわって|thay cho ~, thay mặt ~|N + にかわって / にかわり\nNgười hoặc vật khác đảm nhận việc vốn do N làm: thay mặt ai đó, hoặc cái mới thế chỗ cái cũ. Chỉ đi với danh từ, trang trọng hơn N の かわりに; にかわり dùng trong văn viết và lời phát biểu.\n!N にかわって: N lùi ra, người khác (máy khác) bước vào làm thay.\n>出張(しゅっちょう)中(ちゅう)の 部長(ぶちょう) 【に|を|で|の】 かわって、 私(わたし)が 会議(かいぎ)に 出席(しゅっせき)します。=Tôi sẽ dự họp thay cho trưởng phòng đang đi công tác.\n>今(いま)では、 人間(にんげん) 【に かわって|に 反(はん)して|に つれて|に ついて】 ロボットが 危険(きけん)な 作業(さぎょう)を する ように なった。=Ngày nay, rô-bốt đã làm những công việc nguy hiểm thay cho con người.\n>病気(びょうき)の 母(はは)に かわって、 今日(きょう)は 父(ちち)が 【夕飯(ゆうはん)を 作(つく)った|夕飯(ゆうはん)を 食(た)べた|早(はや)く 寝(ね)た|風邪(かぜ)を 引(ひ)いた】。=Hôm nay bố nấu bữa tối thay cho mẹ đang ốm.\n##69\n@〜一方(で)|mặt khác ~; trong khi ~|thể thông thường + 一方(で) (A-な + な / である, N + である)\nĐặt hai sự việc cạnh nhau: hai mặt song song của một người, một việc, hoặc hai đối tượng có tình hình trái ngược nhau. Đầu câu dùng その一方で. Khác với V-từ điển + 一方だ (ngày càng ~).\n!一方 là \"một phía\": phía này thế này, còn phía kia thế kia.\n>彼女(かのじょ)は 会社(かいしゃ)で 【働(はたら)く|働(はたら)こう|働(はたら)けば|働(はたら)いたり】 一方(いっぽう)で、 夜(よる)は 大学(だいがく)院(いん)に 通(かよ)っている。=Cô ấy vừa đi làm ở công ty, mặt khác buổi tối còn theo học cao học.\n>都市(とし)に 人(ひと)が 集中(しゅうちゅう)する 【一方(いっぽう)で|に 反(はん)して|に かわって|からと いって】、 農村(のうそん)では 人口(じんこう)が 減少(げんしょう)している。=Trong khi người dồn về đô thị thì ở nông thôn dân số đang giảm.\n>日本(にほん)では 子供(こども)の 数(かず)が 減(へ)る 一方(いっぽう)で、 お年寄(としよ)りの 数(かず)は 【増(ふ)えている|減(へ)っている|少(すく)なく なった|半分(はんぶん)に なった】。=Ở Nhật, trong khi số trẻ em giảm thì số người già lại đang tăng.\n##70\n@〜反面|trái lại, mặt khác ~ (hai mặt của một việc)|thể thông thường + 反面 (A-な + な / である, N + である)\nCùng một sự vật, sự việc có hai mặt trái ngược nhau, thường là mặt tốt và mặt xấu. Khác 一方で ở chỗ hai vế phải nói về cùng một đối tượng. Đầu câu dùng その反面.\n!反面 là \"mặt trái\": lật đồng xu lên là thấy mặt ngược lại.\n>オンラインの 授業(じゅぎょう)は 家(いえ)で 受(う)けられて 【便利(べんり)な|便利(べんり)の|便利(べんり)に|便利(べんり)さ】 反面(はんめん)、 友達(ともだち)が 作(つく)りにくい。=Lớp học trực tuyến học được ở nhà nên tiện, nhưng mặt trái là khó kết bạn.\n>一人(ひとり)暮(ぐ)らしは 自由(じゆう)な 【反面(はんめん)|に 反(はん)して|に かわって|からと いって】、 寂(さび)しいと 感(かん)じる ことも ある。=Sống một mình thì tự do, nhưng mặt khác cũng có lúc thấy cô đơn.\n>インターネットは 気軽(きがる)に 情報(じょうほう)が 得(え)られる 反面(はんめん)、 【うその 情報(じょうほう)も 多(おお)い|とても 役(やく)に 立(た)つ|だれでも 使(つか)える|調(しら)べるのが 速(はや)い】。=Internet giúp lấy thông tin dễ dàng, nhưng mặt trái là thông tin sai cũng nhiều.\n##71\n@〜に反して|trái với ~|N + に反して / に反し ・ N に反する + N\nKết quả hay thực tế đi ngược lại dự đoán, kỳ vọng, mong muốn, ý định; cũng dùng cho việc làm trái quy định. Hay đi với 予想, 期待, 予報, 希望, 規則.\n!反 là \"phản\": đi ngược lại điều đã nghĩ, đã mong.\n>みんなの 【予想(よそう)に|予想(よそう)を|予想(よそう)で|予想(よそう)の】 反(はん)して、 弱(よわ)いと 言(い)われていた チームが 優勝(ゆうしょう)した。=Trái với dự đoán của mọi người, đội bị cho là yếu đã vô địch.\n>親(おや)の 期待(きたい) 【に 反(はん)して|に かわって|に とって|に ついて】、 彼(かれ)は 大学(だいがく)に 行(い)かないで 働(はたら)き始(はじ)めた。=Trái với kỳ vọng của bố mẹ, anh ấy không học đại học mà bắt đầu đi làm.\n>今年(ことし)の 夏(なつ)は 暑(あつ)く なると いう 予報(よほう)に 反(はん)して、 【涼(すず)しい 日(ひ)が 続(つづ)いた|とても 暑(あつ)かった|気温(きおん)が 上(あ)がった|暑(あつ)い 日(ひ)が 多(おお)かった】。=Trái với dự báo rằng mùa hè năm nay sẽ nóng, những ngày mát mẻ cứ kéo dài.\n##72\n@〜からといって|không phải cứ ~ là|thể thông thường + からといって (N だ / A-な だ) + 〜とは限らない / 〜わけではない / 〜てはいけない\nChỉ với lý do đó thì chưa đủ để kết luận hay hành động như vế sau. Vế sau luôn mang ý phủ định hoặc ngăn cản. Trong văn nói thân mật thành からって.\n!\"Dù nói là vì ~ đi nữa\" thì vế sau vẫn là \"chưa chắc\", \"không hẳn\", \"không được\".\n>【主婦(しゅふ)だ|主婦(しゅふ)|主婦(しゅふ)な|主婦(しゅふ)の】 からと いって、 料理(りょうり)が 上手(じょうず)だとは 限(かぎ)らない。=Không phải cứ là người nội trợ thì nấu ăn giỏi.\n>年上(としうえ)だ 【からと いって|おかげで|かわりに|とおりに】、 いつも 正(ただ)しい ことを 言(い)う わけでは ない。=Không phải cứ lớn tuổi hơn là lúc nào cũng nói đúng.\n>見(み)た目(め)が 怖(こわ)いからと いって、 性格(せいかく)まで 【怖(こわ)いとは 限(かぎ)らない|怖(こわ)いに 違(ちが)い ない|怖(こわ)いはずだ|怖(こわ)いに 決(き)まっている】。=Không phải cứ vẻ ngoài đáng sợ thì tính cách cũng đáng sợ.\n##73\n@〜によると・〜によれば|theo ~ (nguồn tin)|N + によると / によれば、 〜そうだ / らしい / ということだ\nNêu nguồn của thông tin mình nghe hoặc đọc được: dự báo, báo chí, lời của ai đó. Cuối câu thường là そうだ, らしい, ということだ. Đừng nhầm với によって (nguyên nhân, phương tiện, tuỳ theo).\n!Đầu câu có によると thì cuối câu tìm そうだ / らしい / ということだ.\n>天気(てんき)予報(よほう) 【に よると|に よって|に とって|に 対(たい)して】、 明日(あした)は 午後(ごご)から 雪(ゆき)が 降(ふ)る そうだ。=Theo dự báo thời tiết, ngày mai từ chiều sẽ có tuyết rơi.\n>医者(いしゃ)の 【話(はなし)に|話(はなし)を|話(はなし)が|話(はなし)で】 よると、 父(ちち)は 来週(らいしゅう) 退院(たいいん) できるらしい。=Theo lời bác sĩ, tuần sau bố tôi có thể ra viện.\n>今朝(けさ)の 新聞(しんぶん)に よれば、 来月(らいげつ)から バスの 料金(りょうきん)が 【上(あ)がると いう ことだ|上(あ)がる ことに する|上(あ)がる つもりだ|上(あ)がってほしい】。=Theo báo sáng nay, từ tháng sau giá vé xe buýt sẽ tăng.\n##74\n@〜に基づいて|dựa trên ~ (にもとづいて)|N + に基づいて / に基づき ・ N + に基づく / に基づいた + N\nLấy N làm căn cứ, chuẩn mực rồi làm đúng theo đó. Hay đi với 調査, データ, 法律, 規則, 事実; dùng nhiều trong văn viết, thông báo. Khác をもとに (bài 75): をもとに chỉ lấy N làm chất liệu để tạo ra cái mới.\n!基 là \"nền móng\": đứng yên trên nền đó mà làm, không tự ý thêm bớt.\n>アンケートの 結果(けっか) 【に 基(もと)づいて|に 比(くら)べて|に わたって|に とって】、 来年(らいねん)の 計画(けいかく)を 立(た)てます。=Chúng tôi lập kế hoạch năm sau dựa trên kết quả khảo sát.\n>これは、 去年(きょねん)の 調査(ちょうさ) 【に 基(もと)づいた|に 基(もと)づいて|に 基(もと)づき|に 基(もと)づくの】 数字(すうじ)です。=Đây là con số dựa trên cuộc điều tra năm ngoái.\n>税金(ぜいきん)は、 【法律(ほうりつ)に|法律(ほうりつ)を|法律(ほうりつ)が|法律(ほうりつ)と】 基(もと)づいて 集(あつ)められています。=Thuế được thu dựa trên pháp luật.\n##75\n@〜をもとに(して)|lấy ~ làm cơ sở, dựa theo ~|N + をもとに(して) ・ N + をもとにした + N\nLấy N làm chất liệu, điểm xuất phát để tạo ra một thứ mới: phim, tiểu thuyết, sản phẩm, kế hoạch. Người làm có thể thêm bớt, sáng tạo; còn に基づいて (bài 74) thì phải theo sát căn cứ.\n!もと là \"gốc\": từ cái gốc ấy làm ra một thứ mới như phim, truyện, bài hát.\n>この 映画(えいが)は、 本当(ほんとう)に あった 話(はなし) 【を もとに|を はじめ|に 対(たい)して|に わたって】 作(つく)られた。=Bộ phim này được làm dựa theo một câu chuyện có thật.\n>彼(かれ)は 子供(こども)の ころの 【体験(たいけん)を|体験(たいけん)に|体験(たいけん)が|体験(たいけん)で】 もとに して、 小説(しょうせつ)を 書(か)いた。=Anh ấy viết tiểu thuyết dựa theo trải nghiệm thời thơ ấu.\n>これは、 日本(にほん)の 昔話(むかしばなし)を 【もとに した|もとに して|もとに|もとで】 アニメです。=Đây là phim hoạt hình dựa theo truyện cổ tích Nhật Bản.\n##76\n@〜から見ると・〜から言うと|nhìn từ ~, xét từ ~|N + から見ると / から見れば / から見て ・ N + から言うと / から言えば / から言って\nNêu góc nhìn, lập trường rồi đưa ra nhận xét, đánh giá từ góc đó. から見ると đi được ngay sau danh từ chỉ người (親から見ると); から言うと thì không, phải nói 〜の立場から言うと, 経験から言うと.\n!Người + から見ると thì được; người + から言うと thì không, phải thêm 立場 hoặc 経験.\n>親(おや) 【から 見(み)ると|に 対(たい)して|に 基(もと)づいて|を もとに】、 子供(こども)は いくつに なっても 心配(しんぱい)な ものだ。=Nhìn từ phía cha mẹ thì con cái bao nhiêu tuổi cũng vẫn đáng lo.\n>客(きゃく)の 【立場(たちば)から|立場(たちば)に|立場(たちば)へ|立場(たちば)まで】 言(い)うと、 この 店(みせ)は 値段(ねだん)が 少(すこ)し 高(たか)すぎる。=Xét từ lập trường khách hàng thì quán này giá hơi quá cao.\n>日本(にほん)人(じん)には 普通(ふつう)の ことでも、 外国(がいこく)人(じん)から 見(み)ると、 【不思議(ふしぎ)に 見(み)える|不思議(ふしぎ)に 見(み)よう|不思議(ふしぎ)に 見(み)なさい|不思議(ふしぎ)を 見(み)える】 ことが ある。=Có những điều bình thường với người Nhật nhưng nhìn từ phía người nước ngoài lại thấy kỳ lạ.\n##77\n@〜とおり(に)・〜どおり|theo đúng như ~|V-từ điển / V た / N の + とおり(に) ・ N + どおり(に)\nLàm y như điều đã nghe, đã thấy, đã được chỉ dẫn; hoặc sự việc diễn ra đúng như đã nghĩ, đã định. Sau danh từ có hai cách nói: N の とおり hoặc N どおり (予定どおり, 時間どおり).\n!Có の thì とおり, không có の thì どおり: 説明のとおり và 説明どおり.\n>先生(せんせい)が 【言(い)った|言(い)って|言(い)い|言(い)えば】 とおりに 練習(れんしゅう)したら、 泳(およ)げる ように なった。=Luyện tập đúng như thầy nói thì tôi đã bơi được.\n>レシピに 書(か)いてある 【とおりに|ついでに|最中(さいちゅう)に|たびに】 作(つく)ったのに、 おいしく できなかった。=Tôi làm đúng như công thức ghi mà vẫn không ngon.\n>旅行(りょこう)は 【計画(けいかく)どおりに|計画(けいかく)とおりに|計画(けいかく)の どおりに|計画(けいかく)に とおりに】 進(すす)んで、 とても 楽(たの)しかった。=Chuyến du lịch diễn ra đúng như kế hoạch, rất vui.\n##78\n@〜をきっかけに|nhân dịp ~, từ khi ~|N + をきっかけに(して) / をきっかけとして ・ V た + の / こと + をきっかけに(して)\nMột sự việc cụ thể trở thành cú hích để bắt đầu việc mới hoặc để thay đổi. Vế sau thường là 始める, 〜ようになる, 〜ことにした.\n!きっかけ là \"cú hích\": sau nó luôn là một sự bắt đầu hoặc một thay đổi.\n>日本(にほん)の アニメを 見(み)た こと 【を きっかけに|を もとに|に 基(もと)づいて|に よると】、 日本(にほん)語(ご)の 勉強(べんきょう)を 始(はじ)めた。=Từ khi xem phim hoạt hình Nhật, tôi bắt đầu học tiếng Nhật.\n>父(ちち)は 病気(びょうき)に 【なったのを|なったを|なるを|なってを】 きっかけに、 たばこを やめた。=Từ khi bị bệnh, bố tôi đã bỏ thuốc lá.\n>引(ひ)っ越(こ)しを きっかけに、 自転(じてん)車(しゃ)で 会社(かいしゃ)に 【通(かよ)う ように なった|通(かよ)った ことが ある|通(かよ)っている 最中(さいちゅう)だ|通(かよ)う わけが ない】。=Nhân dịp chuyển nhà, tôi bắt đầu đi làm bằng xe đạp.\n##79\n@〜て以来|kể từ khi ~ (suốt đến nay) (ていらい)|V て + 以来 ・ N + 以来\nSau một sự việc trong quá khứ, một trạng thái kéo dài liên tục cho đến bây giờ. Vế sau là việc vẫn tiếp diễn (ずっと〜ている, 一度も〜ない); không dùng cho việc chỉ xảy ra một lần, việc tương lai hay mốc thời gian quá gần như hôm qua, lúc nãy.\n!以来 là \"dĩ lai\", từ đó đến nay: vế sau luôn là chuyện vẫn đang kéo dài.\n>東京(とうきょう)に 【転勤(てんきん)して|転勤(てんきん)する|転勤(てんきん)した|転勤(てんきん)しよう】 以来(いらい)、 一(いち)度(ど)も 実家(じっか)に 帰(かえ)っていない。=Kể từ khi chuyển công tác lên Tokyo, tôi chưa về nhà bố mẹ lần nào.\n>大学(だいがく)を 【卒業(そつぎょう)して 以来(いらい)|卒業(そつぎょう)した ところ|卒業(そつぎょう)する 際(さい)に|卒業(そつぎょう)した とたん】、 彼(かれ)とは ずっと 会(あ)っていない。=Kể từ khi tốt nghiệp đại học, tôi chưa gặp lại anh ấy lần nào.\n>父(ちち)は 会社(かいしゃ)を 退職(たいしょく)して 以来(いらい)、 毎朝(まいあさ) 公園(こうえん)を 【散歩(さんぽ)している|散歩(さんぽ)しましょう|散歩(さんぽ)する つもりだ|散歩(さんぽ)してください】。=Kể từ khi nghỉ việc ở công ty, sáng nào bố tôi cũng đi dạo công viên.\n##80\n@〜てはじめて|chỉ khi ~ mới (lần đầu nhận ra)|V て + はじめて\nTrước đó chưa biết, chưa làm được; phải trải qua việc A rồi mới lần đầu hiểu ra, nhận ra B. Vế sau thường là わかる, 気づく, 知る, 〜ようになる; không dùng lời rủ, mệnh lệnh hay ý định.\n!Làm A rồi mới \"lần đầu\" (はじめて) hiểu ra B: chưa A thì chưa biết B.\n>病気(びょうき)に 【なって|なる|なった|なろう】 はじめて、 健康(けんこう)の 大切(たいせつ)さに 気(き)づいた。=Chỉ khi bị bệnh tôi mới nhận ra sức khoẻ quan trọng thế nào.\n>自分(じぶん)が 親(おや)に 【なって はじめて|なってからで なければ|なる 最中(さいちゅう)に|なる 代(か)わりに】、 子育(こそだ)ての 大変(たいへん)さが わかった。=Chỉ khi chính mình làm cha mẹ tôi mới hiểu nuôi con vất vả thế nào.\n>結婚(けっこん)して はじめて、 自分(じぶん)で 料理(りょうり)を 【する ように なった|する つもりだ|してください|しましょう】。=Chỉ sau khi kết hôn tôi mới bắt đầu tự nấu ăn.\n##81\n@〜てからでないと・〜てからでなければ|nếu chưa ~ thì không thể ~|V て + からでないと / からでなければ + câu phủ định, không thể\nPhải làm xong A trước; chừng nào chưa A thì B chưa thực hiện được hoặc sẽ gặp rắc rối. Vế sau luôn mang nghĩa phủ định, khó khăn (〜ない, できない, 無理だ, 困る). Hay gặp trong quy định, thủ tục, chuyện xin phép.\n!Chưa A thì chưa B: sau でないと luôn là \"không được, không thể\".\n>この ボタンを 【押(お)して|押(お)す|押(お)した|押(お)さない】 からで ないと、 ドアは 開(あ)きません。=Nếu chưa ấn nút này thì cửa không mở.\n>親(おや)の 許可(きょか)を 【もらってからで なければ|もらって はじめて|もらって 以来(いらい)|もらった ところ】、 この アルバイトは できない。=Nếu chưa được bố mẹ cho phép thì không thể làm công việc làm thêm này.\n>実際(じっさい)に 部屋(へや)を 見(み)てからで ないと、 借(か)りるか どうか 【決(き)められない|決(き)められる|決(き)めましょう|決(き)めた】。=Nếu chưa xem phòng tận mắt thì không thể quyết định có thuê hay không.\n##82\n@〜際(に)|khi ~, lúc ~ (trang trọng) (さい)|V-từ điển / V た / N の + 際(に) ・ 際は\nNghĩa giống とき nhưng trang trọng, dùng trong thông báo, bảng hướng dẫn, lời nhân viên nói với khách; hiếm khi dùng cho chuyện thường ngày của bản thân. 際は nhấn mạnh \"trong trường hợp ~ thì\".\n!際 là とき \"mặc vest\": cứ thấy thông báo, hướng dẫn, lời nhân viên là nghĩ đến 際.\n>【お帰(かえ)りの|お帰(かえ)りな|お帰(かえ)りに|お帰(かえ)る】 際(さい)は、 お忘(わす)れ物(もの)の ない ように ご注意(ちゅうい)ください。=Khi ra về, xin quý khách lưu ý đừng để quên đồ.\n>割引(わりびき)を 【利用(りよう)する 際(さい)は|利用(りよう)して 以来(いらい)|利用(りよう)した とたんに|利用(りよう)して はじめて】、 窓口(まどぐち)で 学生(がくせい)証(しょう)を 見(み)せてください。=Khi dùng ưu đãi giảm giá, xin hãy xuất trình thẻ sinh viên ở quầy.\n>落(お)とし物(もの)を 見(み)つけた 際(さい)は、 近(ちか)くの 係員(かかりいん)に 【届(とど)けてください|届(とど)けた ところです|届(とど)ける ところでした|届(とど)けて 以来(いらい)です】。=Khi nhặt được đồ đánh rơi, xin hãy đưa cho nhân viên ở gần đó.\n##83\n@〜たところ|sau khi (thử) ~ thì (thấy kết quả)|V た + ところ\nLàm A xong thì biết được hoặc xảy ra kết quả B, thường là điều mới phát hiện, hơi bất ngờ. Vế sau là việc đã xảy ra thật, không phải ý định hay lời nhờ của người nói. Hay đi với 聞く, 調べる, 〜てみる; trang trọng hơn 〜たら.\n!\"Thử A thì hoá ra B\": sau たところ là kết quả vừa phát hiện được.\n>店(みせ)に 電話(でんわ)で 【聞(き)いた|聞(き)く|聞(き)いて|聞(き)こう】 ところ、 その 商品(しょうひん)は もう 売(う)り切(き)れだった。=Gọi điện hỏi cửa hàng thì món hàng đó đã bán hết rồi.\n>部屋(へや)の 広(ひろ)さを 【測(はか)ってみた ところ|測(はか)ってみて 以来(いらい)|測(はか)ってからで ないと|測(はか)ってみる 最中(さいちゅう)に】、 思(おも)ったより 狭(せま)かった。=Đo thử diện tích căn phòng thì thấy hẹp hơn tôi nghĩ.\n>先生(せんせい)に 相談(そうだん)した ところ、 いい 本(ほん)を 【紹介(しょうかい)してくださった|紹介(しょうかい)してください|紹介(しょうかい)しましょう|紹介(しょうかい)する つもりだ】。=Tôi hỏi ý kiến thầy thì thầy đã giới thiệu cho một cuốn sách hay.\n##84\n@〜ところだった|suýt nữa thì ~|V-từ điển + ところだった\nMột việc (thường là việc xấu) chỉ chút nữa là xảy ra, nhưng thực tế đã không xảy ra. Hay đi với もう少しで, 危うく và vế trước dạng 〜たら, 〜なければ. Đừng nhầm với V た + ところだ (vừa mới làm xong).\n!もう少しで + V-từ điển + ところだった = \"tí nữa thì…\", may mà chưa.\n>階段(かいだん)で 足(あし)が すべって、 もう 少(すこ)しで 【転(ころ)ぶ|転(ころ)んだ|転(ころ)んで|転(ころ)ばない】 ところだった。=Tôi trượt chân ở cầu thang, suýt nữa thì ngã.\n>運転(うんてん)中(ちゅう)に 居眠(いねむ)りを して、 危(あや)うく 事故(じこ)を 【起(お)こす ところだった|起(お)こした ばかりだ|起(お)こす ことに した|起(お)こす ように している】。=Tôi ngủ gật trong lúc lái xe, suýt nữa thì gây tai nạn.\n>友達(ともだち)が 【教(おし)えてくれなかったら|教(おし)えてくれたら|教(おし)えてくれるなら|教(おし)えてくれても】、 違(ちが)う 電車(でんしゃ)に 乗(の)る ところだった。=Nếu bạn không nói cho thì tôi đã suýt lên nhầm tàu.\n##85\n@〜きる・〜きれない|làm ~ hết, trọn vẹn; không thể ~ hết|V (bỏ ます) + きる / きれる / きれない\n(1) Làm một việc đến cùng, hết sạch không còn sót: 食べきる, 使いきる, 読みきる. (2) Trạng thái lên đến mức tột độ: 疲れきる, 困りきる. Dạng 〜きれない nghĩa là nhiều quá, không thể làm hết được: 数えきれない, 食べきれない.\n!きる vốn là 切る (cắt đứt): làm cho đứt điểm, không để lại chút nào.\n>この 小説(しょうせつ)は 長(なが)かったが、 おもしろくて 3日(みっか)で 【読(よ)みきった|読(よ)むきった|読(よ)んできった|読(よ)んだきった】。=Cuốn tiểu thuyết này dài nhưng hay nên tôi đã đọc hết trong 3 ngày.\n>料理(りょうり)を 頼(たの)みすぎて、 二人(ふたり)では とても 【食(た)べきれなかった|食(た)べかけなかった|食(た)べ出(だ)さなかった|食(た)べたてだった】。=Gọi nhiều món quá nên hai người không tài nào ăn hết được.\n>給料(きゅうりょう)を 全部(ぜんぶ) 使(つか)いきってしまって、 財布(さいふ)の 中(なか)には 1円(えん)も 【残(のこ)っていない|残(のこ)っている|残(のこ)そう|残(のこ)りなさい】。=Tiêu hết sạch tiền lương rồi nên trong ví không còn lấy 1 yên.\n##86\n@〜かける・〜かけの|đang ~ dở, chưa xong|V (bỏ ます) + かける / かけの N / かけだ\nViệc đã bắt đầu nhưng còn dang dở, chưa làm xong: 読みかけの本 (sách đang đọc dở), 食べかけのパン (bánh ăn dở). Với 言う, 死ぬ… còn có nghĩa \"toan ~, suýt ~\": 言いかける (định nói rồi lại thôi). Khác 〜ている ở chỗ nhấn mạnh việc đang bị bỏ dở giữa chừng.\n!かけ = mới \"bắt tay\" làm được nửa chừng thì dừng: còn dở.\n>テーブルの 上(うえ)に、 だれかの 【飲(の)みかけ|飲(の)むかけ|飲(の)んでかけ|飲(の)んだかけ】の コーヒーが 置(お)いてある。=Trên bàn có cốc cà phê ai đó đang uống dở.\n>この 本(ほん)は まだ 【読(よ)みかけ|読(よ)みたて|読(よ)みきり|読(よ)み出(だ)し】なので、 読(よ)み終(お)わったら 貸(か)します。=Cuốn sách này tôi vẫn đang đọc dở, đọc xong tôi sẽ cho mượn.\n>彼(かれ)は 何(なに)か 言(い)いかけたが、 結局(けっきょく) 何(なに)も 【言(い)わなかった|言(い)った|言(い)おう|言(い)いなさい】。=Anh ấy toan nói gì đó nhưng rốt cuộc lại không nói gì.\n##87\n@〜出す|đột nhiên bắt đầu ~|V (bỏ ます) + 出(だ)す\nHành động hay hiện tượng bắt đầu một cách đột ngột, không ngờ tới: 降り出す, 泣き出す, 笑い出す, 走り出す. Hay đi với 急に, 突然. Khác 〜始める: 〜出す không dùng cho việc mình chủ động bắt đầu, nên không nói 〜出しましょう, 〜出してください.\n!出す = \"bật ra\": chuyện bật ra bất ngờ, không báo trước.\n>空(そら)が 暗(くら)く なったと 思(おも)ったら、 急(きゅう)に 雨(あめ)が 【降(ふ)り出(だ)した|降(ふ)る出(だ)した|降(ふ)って出(だ)した|降(ふ)った出(だ)した】。=Vừa thấy trời tối sầm lại thì mưa đột ngột đổ xuống.\n>赤(あか)ちゃんは 母親(ははおや)の 顔(かお)が 見(み)えなく なると、 大声(おおごえ)で 【泣(な)き出(だ)した|泣(な)きたてだ|泣(な)ききれない|泣(な)きかけの】。=Vừa không thấy mặt mẹ nữa là em bé bật khóc ầm lên.\n>電車(でんしゃ)の 中(なか)で、 隣(となり)の 人(ひと)が 【突然(とつぜん)|決(けっ)して|めったに|ずっと】 歌(うた)い出(だ)したので、 驚(おどろ)いた。=Trên tàu, người ngồi cạnh đột nhiên cất tiếng hát làm tôi giật mình.\n##88\n@〜っぱなし|cứ để nguyên ~ (không làm việc cần làm)|V (bỏ ます) + っぱなし (だ / で / に する / の N)\nLàm một việc xong rồi cứ để nguyên như thế, không làm việc lẽ ra phải làm tiếp (tắt, đóng, dọn…), nên thường mang ý chê trách: 電気をつけっぱなし, 窓を開けっぱなし. Cũng dùng khi một trạng thái kéo dài suốt: 立ちっぱなし (đứng suốt). Khác 〜たまま là cách nói trung tính, không hàm ý chê.\n!っぱなし ← 放す (buông): làm xong rồi \"buông đó\", không lo phần sau.\n>弟(おとうと)は いつも 部屋(へや)の 電気(でんき)を 【つけっぱなし|つけるっぱなし|つけてっぱなし|つけたっぱなし】で 出(で)かける。=Em trai tôi lúc nào cũng để đèn phòng bật nguyên rồi đi ra ngoài.\n>窓(まど)を 【開(あ)けっぱなし|開(あ)けたて|開(あ)けかけ|開(あ)け出(だ)し】に して 寝(ね)たら、 風邪(かぜ)を 引(ひ)いてしまった。=Để cửa sổ mở toang rồi đi ngủ nên tôi bị cảm mất rồi.\n>水(みず)を 出(だ)しっぱなしに しないで、 使(つか)わない ときは ちゃんと 【止(と)めなさい|出(だ)しなさい|流(なが)しなさい|開(あ)けなさい】。=Đừng để nước chảy suốt như thế, lúc không dùng thì khoá lại cho đàng hoàng.\n##89\n@〜たて|vừa mới ~ xong (còn mới, còn nóng)|V (bỏ ます) + たて (の N / だ)\nVừa mới làm xong nên còn mới, còn nóng, còn tươi: 焼きたてのパン, 炊きたてのご飯, できたて, 入社したて. Chỉ đi với một số động từ nhất định, không nói 食べたて, 読みたて; còn 〜たばかり thì dùng được với mọi động từ.\n!たて ← 立て: vừa \"dựng\" xong, còn nóng hổi, mới tinh.\n>この パン屋(や)では、 毎朝(まいあさ) 【焼(や)きたて|焼(や)くたて|焼(や)いたたて|焼(や)いてたて】の パンが 買(か)える。=Ở tiệm bánh này, sáng nào cũng mua được bánh mì vừa ra lò.\n>弟(おとうと)は 会社(かいしゃ)に 【入(はい)りたて|入(はい)りかけ|入(はい)りっぱなし|入(はい)りきり】で、 まだ 仕事(しごと)に 慣(な)れていない。=Em trai tôi vừa mới vào công ty nên vẫn chưa quen việc.\n>この ベンチは ペンキが 塗(ぬ)りたてですから、 【座(すわ)らないでください|座(すわ)ってください|座(すわ)りましょう|座(すわ)っても いいです】。=Ghế băng này vừa mới sơn xong nên xin đừng ngồi.\n##90\n@〜一方だ|ngày càng ~ (chỉ theo một chiều)|V-từ điển + 一方(いっぽう)だ\nSự thay đổi cứ tiếp diễn theo một hướng, không dừng lại; phần lớn là hướng xấu. Chỉ đi với động từ chỉ sự biến đổi: 増える, 減る, 上がる, 悪くなる. Đừng nhầm với 〜一方で (mặt khác thì ~).\n!一方 = \"một phía\": chỉ đi một chiều, không quay đầu lại.\n>日本(にほん)では、 子供(こども)の 数(かず)が 【減(へ)る|減(へ)り|減(へ)って|減(へ)った】 一方(いっぽう)だ。=Ở Nhật, số trẻ em ngày càng giảm.\n>雨(あめ)が 降(ふ)らない 日(ひ)が 続(つづ)いて、 野菜(やさい)の 値段(ねだん)は 上(あ)がる 【一方(いっぽう)だ|っぱなしだ|たてだ|わけには いかない】。=Những ngày không mưa kéo dài nên giá rau ngày càng tăng.\n>薬(くすり)を 飲(の)んでいるのに、 父(ちち)の 病気(びょうき)は 【悪(わる)く なる|よく なる|治(なお)る|元気(げんき)に なる】 一方(いっぽう)だ。=Dù vẫn uống thuốc mà bệnh của bố tôi ngày càng nặng thêm.\n##91\n@〜てしょうがない・〜てたまらない|~ không chịu được, ~ vô cùng|V て / A-い (bỏ い) + くて / A-な + で + しょうがない ・ たまらない\nCảm xúc, cảm giác cơ thể hay mong muốn của chính người nói mạnh đến mức không kìm được. たまらない hay đi với cảm giác, mong muốn (眠い, 痛い, 〜たい); しょうがない (= しかたがない) còn dùng cả với việc tự nhiên xảy ra như 気になる, 腹が立つ. Nói về người khác thì thêm らしい, ようだ.\n!Chỉ đi với từ chỉ cảm xúc, cảm giác: 眠くて, 会いたくて, 心配で, 気になって.\n>昨日(きのう)の 夜(よる) あまり 寝(ね)られなかったので、 今日(きょう)は 朝(あさ)から 【眠(ねむ)くて|眠(ねむ)いで|眠(ねむ)くで|眠(ねむ)いて】 しょうが ない。=Tối qua không ngủ được mấy nên hôm nay từ sáng tôi buồn ngủ không chịu được.\n>一人(ひとり)で 日本(にほん)に 来(き)て 半年(はんとし)、 国(くに)の 家族(かぞく)に 会(あ)いたくて 【たまらない|わけが ない|ことは ない|おそれが ある】。=Một mình sang Nhật đã nửa năm, tôi muốn gặp gia đình ở quê không chịu nổi.\n>毎晩(まいばん) となりの 部屋(へや)が うるさくて、 【腹(はら)が 立(た)って|腹(はら)が 立(た)つ|腹(はら)が 立(た)った|腹(はら)が 立(た)ち】 しょうが ない。=Tối nào phòng bên cạnh cũng ồn ào, tôi tức không chịu được.\n##92\n@〜に違いない|chắc chắn là ~ (にちがいない)|thể thông thường + に違いない (N, A-な: nối thẳng, không có だ)\nNgười nói tin chắc vào suy đoán của mình vì có căn cứ nào đó. Mức chắc chắn cao hơn だろう, かもしれない. Hơi cứng, thiên về văn viết; trong hội thoại thường nói きっと〜と思う.\n!N và A-な nối thẳng: 犯人に違いない, 便利に違いない. Không thêm だ, の, な.\n>店(みせ)の カメラに 映(うつ)っていた あの 怪(あや)しい 男(おとこ)が、 【犯人(はんにん)に|犯人(はんにん)だに|犯人(はんにん)のに|犯人(はんにん)なに】 違(ちが)い ない。=Gã đàn ông đáng ngờ bị camera của cửa hàng ghi lại kia chắc chắn là thủ phạm.\n>かばんの 中(なか)に 財布(さいふ)が ない。 さっきの 店(みせ)に 忘(わす)れてきた 【に 違(ちが)い ない|わけには いかない|べきでは ない|ようが ない】。=Trong cặp không có ví. Chắc chắn là tôi đã để quên ở cửa hàng lúc nãy.\n>あんなに 毎日(まいにち) 練習(れんしゅう)していたのだから、 彼(かれ)は 【きっと|まるで|たとえ|決(けっ)して】 試合(しあい)に 勝(か)つに 違(ちが)い ない。=Ngày nào cũng luyện tập đến thế cơ mà, nhất định anh ấy sẽ thắng trận.\n##93\n@〜おそれがある|e là ~, có nguy cơ ~|V-từ điển / V ない / N の + おそれがある\nNêu khả năng xảy ra điều xấu. Văn phong trang trọng, hay gặp trong tin tức, dự báo thời tiết, thông báo, hướng dẫn sử dụng. Không dùng cho điều tốt; chuyện riêng thường ngày thì nói かもしれない.\n!おそれ = \"nỗi lo sợ\": chỉ đi với chuyện xấu như 大雨, 事故, 遅れる, 倒れる.\n>今夜(こんや)から 明日(あした)の 朝(あさ)に かけて、 【大雨(おおあめ)の|大雨(おおあめ)な|大雨(おおあめ)だ|大雨(おおあめ)に】 おそれが あります。=Từ đêm nay đến sáng mai có nguy cơ mưa lớn.\n>この 薬(くすり)は、 飲(の)みすぎると 体(からだ)に 悪(わる)い 影響(えいきょう)が 出(で)る 【おそれが ある|わけには いかない|つもりだ|ふりを する】。=Thuốc này nếu uống quá nhiều thì có nguy cơ gây ảnh hưởng xấu đến cơ thể.\n>強(つよ)い 風(かぜ)で 木(き)が 折(お)れる おそれが あるので、 公園(こうえん)の 木(き)には 【近(ちか)づかないでください|近(ちか)づいてください|近(ちか)づきましょう|近(ちか)づきたいです】。=Gió mạnh có nguy cơ làm gãy cây nên xin đừng đến gần cây trong công viên.\n##94\n@〜(ような)気がする|có cảm giác là ~|thể thông thường + (ような) 気がする (A-な + な, N + の ような)\nNói cảm nhận, linh cảm chủ quan, không có căn cứ rõ ràng; mơ hồ và nhẹ hơn と思う. Hay đi với なんとなく, どこかで.\n!気 = \"cảm giác\": \"hình như… thì phải\", mới chỉ là cảm giác của mình, chưa chắc đúng.\n>あの 人(ひと)には、 前(まえ)に どこかで 【会(あ)った ような|会(あ)った ように|会(あ)ったの ような|会(あ)って ような】 気(き)が する。=Tôi có cảm giác trước đây đã gặp người kia ở đâu đó rồi.\n>今日(きょう)は 朝(あさ)から なんとなく、 何(なに)か いい ことが ありそうな 【気(き)が する|気(き)に する|気(き)を つける|気(き)が つく】。=Hôm nay từ sáng không hiểu sao tôi cứ có cảm giác sắp có chuyện gì vui.\n>家(いえ)を 出(で)る とき、 かぎを かけた ような 気(き)が するが、 【はっきり 覚(おぼ)えていない|はっきり 覚(おぼ)えている|かけた ことが ない|かける つもりは ない】。=Tôi có cảm giác lúc ra khỏi nhà đã khoá cửa rồi, nhưng không nhớ rõ.\n##95\n@〜ふりをする|giả vờ ~|thể thông thường + ふりをする (A-な + な, N + の)\nThực tế không phải vậy nhưng cố ý tỏ ra như vậy bằng thái độ, hành động. Hay gặp: 知らないふり, 寝たふり, 聞こえないふり, わかったふり.\n!ふり = \"dáng vẻ\" bên ngoài: cái đang diễn khác với sự thật bên trong.\n>彼女(かのじょ)は 本当(ほんとう)は つらいのに、 みんなの 前(まえ)では 【元気(げんき)な|元気(げんき)だ|元気(げんき)に|元気(げんき)で】 ふりを している。=Cô ấy thật ra đang khổ tâm nhưng trước mặt mọi người vẫn giả vờ khoẻ khoắn vui vẻ.\n>弟(おとうと)は 母(はは)に 呼(よ)ばれても、 聞(き)こえない 【ふりを して|おそれが あって|つもりを して|に 違(ちが)い なくて】 ゲームを 続(つづ)けている。=Em trai tôi dù bị mẹ gọi vẫn giả vờ không nghe thấy và tiếp tục chơi game.\n>彼(かれ)は その 話(はなし)を よく 【知(し)らない くせに|知(し)っている おかげで|知(し)っているからこそ|知(し)っている とおりに】、 何(なん)でも 知(し)っている ふりを する。=Anh ta không biết rõ chuyện đó mà lại giả vờ cái gì cũng biết.\n##96\n@〜つもりだ・〜たつもり|cứ tưởng là ~; coi như đã ~|V た / V ている / A-い / A-な + な / N の + つもりだ ・ V た + つもりで\n(1) Bản thân tin là như vậy nhưng thực tế, hoặc người khác thấy, không phải thế: 〜つもりだったが, 〜つもりなのに. (2) V た + つもりで: chưa làm thật nhưng coi như đã làm rồi để hành động. Khác với V-từ điển + つもりだ (dự định) đã học.\n!V た + つもり = \"tưởng là đã / coi như đã\"; V-từ điển + つもり = \"định sẽ\".\n>自分(じぶん)では まだ 【若(わか)い|若(わか)くて|若(わか)いの|若(わか)いな】 つもりだが、 少(すこ)し 走(はし)っただけで すぐ 疲(つか)れる。=Tôi cứ tưởng mình vẫn còn trẻ, vậy mà mới chạy một chút đã mệt ngay.\n>海外(かいがい)旅行(りょこう)に 行(い)った 【つもりで|おそれで|とたんで|べきで】、 その お金(かね)を 貯金(ちょきん)する ことに した。=Tôi coi như mình đã đi du lịch nước ngoài rồi và quyết định để dành khoản tiền đó.\n>昨日(きのう) 課長(かちょう)に メールを 送(おく)った つもりだったが、 実(じつ)は 【送(おく)っていなかった|ちゃんと 送(おく)ってあった|すぐ 届(とど)いていた|もう 返事(へんじ)が 来(き)ていた】。=Tôi cứ tưởng hôm qua đã gửi mail cho trưởng phòng rồi, nhưng thật ra chưa gửi.\n##97\n@〜としたら・〜とすれば|giả sử ~ thì|thể thông thường + としたら / とすれば (N ・ A-な + だ)\nĐặt ra một giả định chưa xảy ra hoặc chưa chắc có thật, rồi nêu phán đoán, ý định hay câu hỏi ở vế sau. Hay đi với もし, 仮に. So với たら thông thường, mẫu này nhấn mạnh ý cứ coi như chuyện đó là thật. とすれば thiên về suy luận nên vế sau thường là phán đoán; としたら dùng rộng hơn, cả khi hỏi ý muốn.\n!とする là coi như là; としたら là nếu cứ coi như thế thì sao.\n>その 話(はなし)が 【本当(ほんとう)だ|本当(ほんとう)な|本当(ほんとう)の|本当(ほんとう)に】 と すれば、 計画(けいかく)を 変(か)えなければ ならない。=Giả sử chuyện đó là thật thì phải thay đổi kế hoạch.\n>もし 生(う)まれ変(か)われる 【と したら|ばかりで なく|と いうより|に つれて】、 男(おとこ)と 女(おんな)の どちらに なりたいですか。=Giả sử được sinh ra lần nữa thì bạn muốn làm nam hay nữ?\n>もし 明日(あした)、 宝(たから)くじで 1億(おく)円(えん) 当(あ)たったと したら、 まず 何(なに)を 【買(か)いますか|買(か)いましたか|買(か)っていましたか|買(か)った ことが ありますか】。=Giả sử ngày mai trúng xổ số 100 triệu yên thì trước tiên bạn sẽ mua gì?\n##98\n@〜としても|cho dù ~ đi nữa|thể thông thường + としても (N ・ A-な + だ)\nNêu một giả định rồi khẳng định rằng kết quả ở vế sau vẫn không thay đổi, không bị giả định đó ảnh hưởng. Hay đi với たとえ, 仮に, どんなに. Ngược hướng với としたら: としたら là nếu thế thì ~, còn としても là dù thế thì vẫn ~.\n!たとえ mở đầu thì としても kết thúc: cứ cho là thế đi, kết luận vẫn vậy.\n>たとえ 【失敗(しっぱい)した|失敗(しっぱい)して|失敗(しっぱい)し|失敗(しっぱい)すれば】 と しても、 後悔(こうかい)は しない つもりだ。=Cho dù có thất bại đi nữa, tôi cũng sẽ không hối hận.\n>今(いま)から タクシーで 行(い)った 【と しても|とたんに|ついでに|たびに】、 会議(かいぎ)には 間(ま)に合(あ)わないだろう。=Cho dù bây giờ có đi taxi thì chắc cũng không kịp cuộc họp.\n>たとえ 両親(りょうしん)に 反対(はんたい)されたと しても、 私(わたし)は 留学(りゅうがく)を 【あきらめない|あきらめる|あきらめた|あきらめたい】。=Cho dù bị bố mẹ phản đối đi nữa, tôi cũng không từ bỏ việc du học.\n##99\n@〜しかない|chỉ còn cách ~|V-từ điển + しかない\nNgoài việc đó ra không còn lựa chọn nào khác nên đành phải làm. Có thể mang sắc thái bất đắc dĩ, cũng có thể là quyết tâm. Đừng nhầm với N しか 〜ない (chỉ có ~): ở mẫu này しかない đứng ngay sau động từ thể từ điển.\n!しか là ngoài ~ ra, ない là không có: ngoài cách này ra thì không còn cách nào.\n>終電(しゅうでん)が 出(で)てしまったから、 歩(ある)いて 【帰(かえ)る|帰(かえ)り|帰(かえ)って|帰(かえ)った】 しか ない。=Chuyến tàu cuối đi mất rồi nên chỉ còn cách đi bộ về.\n>洗濯機(せんたくき)が 故障(こしょう)したので、 今日(きょう)は 手(て)で 洗(あら)う 【しか ない|わけが ない|ことは ない|とは 限(かぎ)らない】。=Máy giặt hỏng rồi nên hôm nay chỉ còn cách giặt tay.\n>だれも 手伝(てつだ)ってくれない 【のだから|のに|ように|までに】、 自分(じぶん) 一人(ひとり)で やるしか ない。=Vì chẳng ai giúp nên chỉ còn cách tự mình làm.\n##100\n@〜ないことはない|không phải là không ~|V ない / A-い (bỏ い) + くない / A-な ・ N + では (じゃ) ない + ことはない\nPhủ định hai lần: không phủ nhận hẳn nhưng cũng không khẳng định mạnh. Dùng khi trả lời dè dặt, thường theo sau là が, けど kèm điều kiện hoặc lý do còn ngần ngại. 〜ないこともない có nghĩa gần như vậy.\n!Hai lần không thành một lần có, nhưng là có một cách miễn cưỡng: 食べないことはない là ăn thì cũng ăn được.\n>納豆(なっとう)は 【食(た)べられない|食(た)べられなく|食(た)べられず|食(た)べられなくて】 ことは ないが、 あまり 好(す)きでは ない。=Natto thì không phải là tôi không ăn được, nhưng không thích lắm.\n>車(くるま)の 運転(うんてん)は 【できない ことは ない|できる わけが ない|できない しか ない|できない ように する】 が、 5年(ねん)も していないので 自信(じしん)が ない。=Lái xe thì không phải là tôi không lái được, nhưng 5 năm rồi không lái nên không tự tin.\n>駅(えき)まで 歩(ある)いて 行(い)けない ことは ないが、 30分(ぷん) 【以上(いじょう) かかる|しか かからない|で 着(つ)ける|も かからない】。=Không phải là không đi bộ ra ga được, nhưng mất hơn 30 phút.\n##101\n@〜ことになっている・〜ことにしている|theo quy định là ~; tự đặt lệ là ~|V-từ điển / V ない + ことに なっている ・ ことに している\nことになっている: quy định, nội quy, lịch đã định do tập thể hoặc người khác quyết, không phải ý riêng của mình. ことにしている: thói quen, nguyên tắc do chính mình tự đặt ra và vẫn đang giữ. Việc không làm thì dùng V ない + ことに.\n!なる là tự thành ra như thế (người khác quyết) nên là quy định; する là mình làm (tự quyết) nên là lệ riêng.\n>太(ふと)らない ように、 夜(よる) 9時(じ)を 過(す)ぎたら 何(なに)も 【食(た)べない|食(た)べなく|食(た)べなくて|食(た)べず】 ことに している。=Để không bị béo, tôi đặt lệ là sau 9 giờ tối thì không ăn gì nữa.\n>日本(にほん)では、 車(くるま)は 道(みち)の 左側(ひだりがわ)を 走(はし)る 【ことに なっている|ことに している|つもりだ|ところだ】。=Ở Nhật, quy định là xe ô tô chạy bên trái đường.\n>うちでは、 食事(しょくじ)中(ちゅう)は テレビを 見(み)ない ことに なっているので、 食(た)べる 前(まえ)に 必(かなら)ず 【消(け)す|つける|開(あ)ける|直(なお)す】。=Nhà tôi có quy định là trong bữa ăn không xem tivi, nên trước khi ăn nhất định phải tắt.\n##102\n@〜ずに|không ~ mà|V ない (bỏ ない) + ずに ; する → せずに\nCách nói thiên về văn viết của 〜ないで: làm việc sau trong tình trạng không làm việc trước, hoặc không làm A mà làm B thay vào. Riêng する đổi thành せずに, không phải しずに. Không dùng cho lời nhờ đừng làm (〜ないでください).\n!ずに bằng ないで; nhớ riêng một ngoại lệ: する thành せずに.\n>弟(おとうと)は 全然(ぜんぜん) 【勉強(べんきょう)せずに|勉強(べんきょう)しずに|勉強(べんきょう)さずに|勉強(べんきょう)しないずに】 試験(しけん)を 受(う)けて、 やはり 落(お)ちてしまった。=Em trai tôi chẳng học gì mà cứ đi thi, quả nhiên là trượt.\n>節約(せつやく)の ために、 外食(がいしょく)を 【せずに|しながら|した ついでに|する たびに】 毎日(まいにち) 弁当(べんとう)を 作(つく)っている。=Để tiết kiệm, tôi không ăn ngoài mà ngày nào cũng tự làm cơm hộp.\n>昨日(きのう)は とても 疲(つか)れていたので、 歯(は)も みがかずに 【寝(ね)てしまった|起(お)きてしまった|みがいてしまった|運動(うんどう)を 始(はじ)めた】。=Hôm qua mệt quá nên tôi chưa đánh răng đã ngủ mất.\n##103\n@〜こそ|chính ~ (nhấn mạnh)|N (+ trợ từ) + こそ ・ thể thông thường + からこそ\nNhấn mạnh từ đứng ngay trước: chính cái này chứ không phải cái khác. こそ thay cho は, が, を (今年こそ, これこそ). 〜からこそ nghĩa là chính vì ~ nên mới ~. こちらこそ là lời đáp lễ: chính tôi mới phải cảm ơn, xin lỗi.\n!こそ giống như gạch chân từ đứng trước: \"chính nó đấy!\".\n>皆(みな)さんの 応援(おうえん)が あった 【からこそ|のでこそ|のにこそ|こそから】、 優勝(ゆうしょう) できたのです。=Chính vì có sự cổ vũ của mọi người nên chúng tôi mới vô địch được.\n>今年(ことし) 【こそ|しか|ほど|さえ】 たばこを やめようと 決心(けっしん)しました。=Chính năm nay tôi đã quyết tâm bỏ thuốc lá.\n>体(からだ)が 健康(けんこう)だからこそ、 毎日(まいにち) 楽(たの)しく 【働(はたら)けるのだ|働(はたら)けないのだ|働(はたら)ける はずが ない|働(はたら)けよう】。=Chính vì cơ thể khoẻ mạnh nên ngày nào cũng làm việc vui vẻ được.\n##104\n@〜なんか・〜なんて|cỡ như ~; cái thứ ~ (coi nhẹ, ngạc nhiên)|N + なんか / なんて ・ thể thông thường + なんて\n(1) N + なんか / なんて: coi nhẹ, chê bai, hoặc khiêm tốn khi nói về mình (私なんか). (2) Câu ở thể thông thường + なんて: ngạc nhiên, không ngờ tới. Đây là văn nói; sau động từ, tính từ chỉ dùng なんて, không dùng なんか.\n!なんか là など nói kiểu thân mật; cả câu + なんて = \"mà lại ~ ư, không tin nổi\".\n>あんなに 勉強(べんきょう)していた 彼(かれ)が 試験(しけん)に 【落(お)ちるなんて|落(お)ちるなんか|落(お)ちなんて|落(お)ちてなんか】、 信(しん)じられない。=Anh ấy học nhiều như thế mà lại trượt kỳ thi ư, thật không thể tin được.\n>雷(かみなり) 【なんか|に とって|と して|に よって】 ちっとも 怖(こわ)くないと、 弟(おとうと)は 言(い)っている。=Em trai tôi nói là cái thứ sấm sét thì chẳng sợ chút nào.\n>こんな 所(ところ)で 先生(せんせい)に 会(あ)うなんて、 【思(おも)わなかった|思(おも)った とおりだ|思(おも)う つもりだ|思(おも)いなさい】。=Tôi không ngờ lại gặp thầy ở một nơi như thế này.\n##105\n@〜はもちろん|~ thì khỏi phải nói, cả ~ cũng|N + はもちろん、 N も / まで / でも\nNêu A là điều đương nhiên, rồi thêm B cũng như vậy; vế sau thường có も, まで, さえ. Gần nghĩa 〜ばかりでなく nhưng nhấn rằng A thì khỏi cần bàn.\n!もちろん = \"tất nhiên\": A は もちろん → \"A thì tất nhiên rồi\", còn B も nữa.\n>この 温泉(おんせん)は、 日本(にほん)人(じん) 【は もちろん|に とって|と して|に つれて】、 外国(がいこく)人(じん)の 観光(かんこう)客(きゃく)にも 人気(にんき)が ある。=Suối nước nóng này người Nhật thì khỏi phải nói, cả khách du lịch nước ngoài cũng ưa thích.\n>この ホテルは、 【部屋(へや)は もちろん|部屋(へや)が もちろん|部屋(へや)の もちろん|部屋(へや)で もちろん】、 朝食(ちょうしょく)も すばらしい。=Khách sạn này phòng thì khỏi phải nói, cả bữa sáng cũng tuyệt vời.\n>この 店(みせ)の 店員(てんいん)は、 英語(えいご)は もちろん、 中国(ちゅうごく)語(ご) 【も 話(はな)せる|は 話(はな)せない|しか 話(はな)せる|だけ 話(はな)そう】。=Nhân viên của cửa hàng này tiếng Anh thì khỏi phải nói, cả tiếng Trung cũng nói được.\n##106\n@〜も〜ば〜も|cũng ~ mà cũng ~|N も + V ば / A-い (bỏ い) ければ / A-な なら / N なら + N も\nLiệt kê hai điều cùng hướng (cùng tốt hoặc cùng xấu), hoặc nói rằng có cả hai mặt: có lúc thế này, cũng có lúc thế kia. ば ở đây không mang nghĩa \"nếu\". A-な và N dùng なら: 歌も上手なら、ダンスも上手だ.\n!ば ở đây = \"và\": A も あれば B も ある = có A mà cũng có B.\n>今年(ことし)の 冬(ふゆ)は、 気温(きおん)も 【低(ひく)ければ|低(ひく)いば|低(ひく)くば|低(ひく)けば】、 風(かぜ)も 強(つよ)くて、 とても 寒(さむ)い。=Mùa đông năm nay nhiệt độ cũng thấp mà gió cũng mạnh, rất lạnh.\n>人生(じんせい)には、 楽(たの)しい こと 【も あれば|さえ あれば|と 言(い)えば|に 比(くら)べて】、 苦(くる)しい ことも ある。=Trong cuộc đời có chuyện vui mà cũng có chuyện khổ.\n>あの レストランは、 値段(ねだん)も 安(やす)ければ、 味(あじ) 【も いい|は 悪(わる)い|しか いい|だけ よければ】。=Nhà hàng đó giá cũng rẻ mà vị cũng ngon.\n##107\n@〜向け・〜向き|dành cho ~; hợp với ~|N + 向け (に V / の N / だ) ・ N + 向き (に / の N / だ)\n向け: được làm ra có chủ đích nhắm tới đối tượng đó (子供向けの番組 = chương trình làm cho trẻ em). 向き: tự nó vừa hợp với đối tượng đó (初心者向きの山 = ngọn núi hợp với người mới), hoặc chỉ hướng (南向きの部屋 = phòng hướng nam).\n!向け = \"nhắm tới\" (có chủ ý làm riêng); 向き = \"hợp với\" hoặc \"quay về hướng\".\n>この 雑誌(ざっし)は 若(わか)い 【女性(じょせい)向(む)けに|女性(じょせい)気味(ぎみ)に|女性(じょせい)だらけに|女性(じょせい)がちに】 作(つく)られている。=Tạp chí này được làm dành cho phụ nữ trẻ.\n>この 山(やま)は 【初心者(しょしんしゃ)向(む)き|初心者(しょしんしゃ)の 向(む)き|初心者(しょしんしゃ)に 向(む)き|初心者(しょしんしゃ)な 向(む)き】 だから、 子供(こども)でも 登(のぼ)れる。=Ngọn núi này hợp với người mới nên trẻ con cũng leo được.\n>この マンションの 【南(みなみ)向(む)きの|南(みなみ)向(む)けの|南(みなみ)向(む)くの|南(みなみ)向(む)こうの】 部屋(へや)は、 明(あか)るくて 暖(あたた)かい。=Căn phòng hướng nam của chung cư này sáng và ấm.\n##108\n@〜させられる (sai khiến bị động)|bị bắt phải ~|Nhóm 1: V ない (bỏ ない) + される / せられる ・ Nhóm 2: V (bỏ る) + させられる ・ する → させられる ・ 来る → 来させられる\nBị người khác (đi với に) bắt làm điều mình không muốn. Động từ nhóm 1 thường rút gọn: 行かせられる → 行かされる, 待たせられる → 待たされる; riêng động từ đuôi す thì không rút gọn: 話させられる. Còn dùng khi một việc khiến mình tự nhiên phải nghĩ, phải cảm: 考えさせられる.\n!させる (bắt làm) + られる (bị) = \"bị bắt làm\"; người bắt mình đi với に.\n>子供(こども)の ころ、 母(はは)に 嫌(きら)いな 野菜(やさい)を 【食(た)べさせられた|食(た)べされた|食(た)べらせた|食(た)べさせれた】。=Hồi nhỏ tôi bị mẹ bắt ăn loại rau mình ghét.\n>歌(うた)いたくなかったのに、 飲(の)み会(かい)で 先輩(せんぱい)に 歌(うた)を 【歌(うた)わされた|歌(うた)わせた|歌(うた)われた|歌(うた)わせてくれた】。=Tôi không muốn hát vậy mà ở buổi nhậu vẫn bị đàn anh bắt hát.\n>子供(こども)の ころ、 私(わたし)は 毎朝(まいあさ) 父(ちち) 【に|を|が|で】 犬(いぬ)の 散歩(さんぽ)に 行(い)かされた。=Hồi nhỏ, sáng nào tôi cũng bị bố bắt dắt chó đi dạo.\n", "fx": "##1\nこの 歌(うた)を 聞(き)く 【たびに|ついでに|とたんに|うちに】、 国(くに)の 家族(かぞく)を 思(おも)い出(だ)す。=Mỗi lần nghe bài hát này tôi lại nhớ gia đình ở quê.\n##2\n郵便(ゆうびん)局(きょく)へ 行(い)った 【ついでに|たびに|最中(さいちゅう)に|とたん】、 銀行(ぎんこう)で お金(かね)を 下(お)ろしてきた。=Nhân tiện ra bưu điện, tôi đã ghé ngân hàng rút tiền.\n##3\n窓(まど)を 【開(あ)けた とたん|開(あ)ける とたん|開(あ)けた ついで|開(あ)ける たび】、 冷(つめ)たい 風(かぜ)が 入(はい)ってきた。=Vừa mở cửa sổ thì gió lạnh ùa vào.\n##4\n食事(しょくじ)の 【最中(さいちゅう)に|うちに|たびで|ついでを】 席(せき)を 立(た)つのは 失礼(しつれい)だ。=Đang giữa bữa ăn mà rời chỗ là thất lễ.\n##5\n雨(あめ)が 【降(ふ)らない うちに|降(ふ)る うちに|降(ふ)った うちに|降(ふ)らなく うちに】、 帰(かえ)りましょう。=Mình về trước khi trời mưa đi.\n##6\n私(わたし)が 困(こま)っている 【ところに|ところをで|ところは|ところから】、 ちょうど 友達(ともだち)が 来(き)てくれた。=Đúng lúc tôi đang gặp khó thì bạn tôi đến.\n##7\n彼女(かのじょ)は 歌(うた) 【ばかりで なく|ばかりだから|だらけで|ばかりのに】、 ダンスも 上手(じょうず)だ。=Cô ấy không chỉ hát mà nhảy cũng giỏi.\n##8\n弟(おとうと)の 部屋(へや)は 本(ほん) 【だらけ|気味(ぎみ)|がち|っぽい】 で、 足(あし)の 踏(ふ)み場(ば)も ない。=Phòng em trai tôi đầy sách, không có chỗ đặt chân.\n##9\nこの 服(ふく)は 色(いろ)が 【安(やす)っぽくて|安(やす)いっぽくて|安(やす)がちで|安気(あんき) 味(あじ)で】、 あまり 好(す)きじゃ ない。=Bộ quần áo này màu trông rẻ tiền nên tôi không thích lắm.\n##10\n一人暮(ひとりぐ)らしだと、 野菜(やさい)が 不足(ふそく) 【しがち|するがち|しっぽい|だらけ】 に なる。=Sống một mình thì thường hay thiếu rau.\n##11\n最近(さいきん) ちょっと 【寝(ね)不足(ふそく)気味(ぎみ)|寝(ね)不足(ふそく)がちく|寝(ね)不足(ふそく)だらけ|寝(ね)不足(ふそく)っぽ】 で、 頭(あたま)が 痛(いた)い。=Dạo này tôi hơi thiếu ngủ nên đau đầu.\n##12\n人(ひと) 【に よって|に とって|に 対(たい)して|に ついて】 考(かんが)え方(かた)が 違(ちが)うのは 当然(とうぜん)だ。=Mỗi người có cách nghĩ khác nhau là đương nhiên.\n##13\n目上(めうえ)の 人(ひと) 【に 対(たい)して|に とって|に 比(くら)べて|に よって】 は、 敬語(けいご)を 使(つか)った ほうが いい。=Với người trên thì nên dùng kính ngữ.\n##14\nこの 件(けん) 【に 関(かん)して|に 対(たい)して|に とって|に 加(くわ)えて】、 何(なに)か ご質問(しつもん)は ありますか。=Về việc này, quý vị có câu hỏi gì không?\n##15\n学生(がくせい) 【に とって|に 対(たい)して|に ついて|と して】、 夏休(なつやす)みは 一(いち)年(ねん)で いちばん 楽(たの)しい 時期(じき)だ。=Đối với sinh viên, nghỉ hè là thời gian vui nhất trong năm.\n##16\nこの 部屋(へや)は 倉庫(そうこ) 【と して|に とって|に 対(たい)して|に ついて】 使(つか)われている。=Căn phòng này được dùng làm nhà kho.\n##17\n以前(いぜん) 【に 比(くら)べて|に 加(くわ)えて|に 対(たい)して|に 関(かん)して】、 日本(にほん)語(ご)が 上手(じょうず)に なりましたね。=So với trước, tiếng Nhật của anh đã giỏi lên nhỉ.\n##18\nこの 仕事(しごと)は、 専門(せんもん)の 知識(ちしき) 【に 加(くわ)えて|に 比(くら)べて|に 対(たい)して|に とって】、 経験(けいけん)も 必要(ひつよう)だ。=Công việc này ngoài kiến thức chuyên môn còn cần cả kinh nghiệm.\n##19\n入学(にゅうがく)式(しき)は 大(だい)ホール 【に おいて|に ついて|に とって|に 対(たい)して】 行(おこな)われる 予定(よてい)です。=Lễ nhập học dự định tổ chức tại hội trường lớn.\n##20\n日本(にほん)での 生活(せいかつ)に 慣(な)れる 【に つれて|に ついて|に とって|に 関(かん)して】、 友達(ともだち)も 増(ふ)えてきた。=Càng quen với cuộc sống ở Nhật, bạn bè cũng nhiều lên.\n##21\n時代(じだい)の 変化(へんか) 【と ともに|に ついて|に 対(たい)して|と して】、 人々(ひとびと)の 生活(せいかつ)も 変(か)わる。=Cùng với sự thay đổi của thời đại, đời sống con người cũng thay đổi.\n##22\nテレビの ニュース 【を 通(つう)じて|に とって|に 加(くわ)えて|と して】、 その 事故(じこ)の ことを 知(し)った。=Tôi biết về vụ tai nạn đó qua tin tức trên tivi.\n##23\nご両親(りょうしん) 【を はじめ|を 通(つう)じて|に 対(たい)して|に ついて】、 ご家族(かぞく)の 皆(みな)様(さま)に よろしく お伝(つた)えください。=Xin cho tôi gửi lời hỏi thăm bố mẹ và cả gia đình anh.\n##24\nこの クラスは 会話(かいわ) 【を 中心(ちゅうしん)に|を はじめ|に 対(たい)して|に とって】 授業(じゅぎょう)を 進(すす)めています。=Lớp này tiến hành giờ học chủ yếu là hội thoại.\n##25\n今夜(こんや)から 明日(あした)の 朝(あさ) 【に かけて|に わたって|に おいて|に とって】、 強(つよ)い 風(かぜ)が 吹(ふ)くでしょう。=Từ tối nay đến sáng mai có lẽ gió sẽ thổi mạnh.\n##26\n彼(かれ)は 30年(ねん) 【に わたって|に かけて|に ついて|に 対(たい)して】、 この 学校(がっこう)で 教(おし)えてきた。=Ông ấy đã dạy ở trường này suốt 30 năm.\n##27\n彼(かれ)は 毎日(まいにち) 5時間(じかん)も 練習(れんしゅう)している そうだ。 上手(じょうず)な 【わけだ|わけが ない|わけでは ない|ことは ない】。=Nghe nói anh ấy luyện tập tận 5 tiếng mỗi ngày. Thảo nào giỏi.\n##28\nまじめな 彼(かれ)が うそを つく 【わけが ない|わけだ|ことだ|べきだ】。=Người nghiêm túc như anh ấy không lý nào nói dối.\n##29\n毎日(まいにち) 忙(いそが)しいが、 休(やす)みが 全然(ぜんぜん) ない 【わけでは ない|わけが ない|わけには いかない|べきでは ない】。=Ngày nào cũng bận nhưng không hẳn là hoàn toàn không có ngày nghỉ.\n##30\nみんなが 待(ま)っているから、 私(わたし)だけ 先(さき)に 帰(かえ)る 【わけには いか hôm qua tàu điện đã dừng tới 3 tiếng vì sấm sét.\n##74\nこの 学校(がっこう)では、 テストの 結果(けっか) 【に 基(もと)づいて|に 加(くわ)えて|を きっかけに|から 見(み)ると】 クラスを 分(わ)けています。=Ở trường này, người ta chia lớp dựa trên kết quả bài kiểm tra.\n##75\nこの 歌(うた)は、 祖母(そぼ)から 聞(き)いた 話(はなし) 【を もとに|に よると|から 見(み)ると|に 対(たい)して】 作(つく)った ものです。=Bài hát này tôi sáng tác dựa theo câu chuyện nghe từ bà.\n##76\n留学(りゅうがく)生(せい)の 私(わたし) 【から 見(み)ると|を もとに|に 基(もと)づいて|を きっかけに】、 日本(にほん)の 電車(でんしゃ)は 驚(おどろ)く ほど 時間(じかん)に 正確(せいかく)だ。=Nhìn từ góc độ một du học sinh như tôi, tàu điện Nhật đúng giờ đến mức đáng kinh ngạc.\n##77\n道(みち)が わからなかったが、 駅員(えきいん)に 教(おし)えてもらった 【とおりに|ついでに|たびに|うちに】 歩(ある)いたら、 すぐ 着(つ)いた。=Tôi không biết đường, nhưng đi đúng như nhân viên nhà ga chỉ thì đến ngay.\n##78\n大学(だいがく)に 入(はい)ったの 【を きっかけに|を もとに|に よれば|に 基(もと)づいて】、 東京(とうきょう)で 一人(ひとり)暮(ぐ)らしを 始(はじ)めた。=Nhân dịp vào đại học, tôi bắt đầu sống một mình ở Tokyo.\n##79\n兄(あに)は 今(いま)の 会社(かいしゃ)に 【入社(にゅうしゃ)して 以来(いらい)|入社(にゅうしゃ)した ところ|入社(にゅうしゃ)する 際(さい)に|入社(にゅうしゃ)してからで ないと】、 一(いち)度(ど)も 遅刻(ちこく)した ことが ない。=Kể từ khi vào công ty hiện nay, anh tôi chưa đi muộn lần nào.\n##80\n外国(がいこく)に 【住(す)んで はじめて|住(す)んでからで ないと|住(す)む ついでに|住(す)んだ ものの】、 自分(じぶん)の 国(くに)の よさが わかった。=Chỉ khi sống ở nước ngoài tôi mới hiểu cái hay của đất nước mình.\n##81\n手続(てつづ)きが 【済(す)んでからで ないと|済(す)んで はじめて|済(す)んだ とたん|済(す)んで 以来(いらい)】、 寮(りょう)に 入(はい)る ことは できません。=Nếu thủ tục chưa xong thì không thể vào ký túc xá.\n##82\n部屋(へや)を 【出(で)る 際(さい)は|出(で)て 以来(いらい)|出(で)て はじめて|出(で)た ところ】、 かぎを フロントに お預(あず)けください。=Khi ra khỏi phòng, xin quý khách gửi chìa khoá ở quầy lễ tân.\n##83\n試(ため)しに 自分(じぶん)で 【直(なお)してみた ところ|直(なお)してみて 以来(いらい)|直(なお)してからで ないと|直(なお)してみる たびに】、 意外(いがい)に 簡単(かんたん)に 直(なお)った。=Thử tự sửa thì hoá ra sửa được dễ không ngờ.\n##84\n急(きゅう)に 子供(こども)が 道(みち)に 飛(と)び出(だ)してきて、 もう 少(すこ)しで 【ぶつかる ところだった|ぶつかる べきだった|ぶつかった ばかりだった|ぶつかる ことに した】。=Một đứa trẻ đột ngột lao ra đường, suýt nữa thì tôi đâm phải.\n##85\n荷物(にもつ)が 多(おお)すぎて、 1回(かい)では 【運(はこ)びきれない|運(はこ)びかけだ|運(はこ)びたてだ|運(はこ)びっぱなしだ】。=Hành lý nhiều quá, một lần không chuyển hết được.\n##86\n冷蔵庫 った こと|子供(こども)が 大(おお)きく ならない こと|子供(こども)が 高校(こうこう)へ 行(い)かない こと|子供(こども)が 家(いえ)を 出(で)た こと\n##21 Cuộc sống mới\nA:結婚(けっこん)して、 生活(せいかつ)は 変(か)わりましたか。=Kết hôn xong cuộc sống có thay đổi không?\nB:ええ。 妻(つま)と ともに、 毎朝(まいあさ) 散歩(さんぽ)する ように なりました。=Có. Tôi đã bắt đầu đi dạo mỗi sáng cùng vợ.\nA:いいですね。 健康(けんこう)的(てき)で。=Hay nhỉ. Lành mạnh.\nB:年(とし)を 取(と)ると ともに、 健康(けんこう)の 大切(たいせつ)さが わかってきたんです。=Cùng với tuổi tác tôi dần hiểu sức khoẻ quan trọng thế nào.\n?男(おとこ)の 人(ひと)は 結婚(けっこん)してから 何(なに)を 始(はじ)めましたか。|妻(つま)と 朝(あさ)の 散歩(さんぽ)|一人(ひとり)で ジョギング|妻(つま)と 料理(りょうり)|健康(けんこう)の 勉強(べんきょう)\n##22 Quen nhau\nA:お二人(ふたり)は、 どう やって 知(し)り合(あ)ったんですか。=Hai người quen nhau thế nào?\nB:友人(ゆうじん)を 通(つう)じて 知(し)り合(あ)いました。=Chúng tôi quen qua một người bạn.\nA:そうなんですか。 私(わたし)は、 インターネットを 通(とお)して 今(いま)の 夫(おっと)と 出会(であ)ったんです。=Vậy à. Tôi thì gặp chồng hiện tại qua Internet.\nB:へえ。 今(いま)は そう いう 人(ひと)が 増(ふ)えている そうですね。=Ồ. Nghe nói giờ những người như vậy đang tăng lên.\n?女(おんな)の 人(ひと)は どう やって 夫(おっと)と 出会(であ)いましたか。|インターネットを 通(とお)して|友人(ゆうじん)の 紹介(しょうかい)で|会社(かいしゃ)で|学校(がっこう)で\n##23 Giới thiệu thành phố\nA:この 町(まち)には、 どんな 観光(かんこう)地(ち)が ありますか。=Thành phố này có những điểm du lịch nào?\nB:お城(しろ)を はじめ、 古(ふる)い お寺(てら)や 神社(じんじゃ)が たくさん ありますよ。=Tiêu biểu là toà thành, còn có nhiều chùa và đền cổ.\nA:食(た)べ物(もの)は どうですか。=Đồ ăn thì sao?\nB:魚(さかな)料理(りょうり)が 有名(ゆうめい)です。 駅前(えきまえ)の 店(みせ)は、 観光(かんこう)客(きゃく)を はじめ、 地元(じもと)の 人(ひと)にも 人気(にんき)が あります。=Món cá nổi tiếng. Quán trước ga được ưa chuộng, từ khách du lịch đến người địa phương.\n?この 町(まち)で 有名(ゆうめい)な 食(た)べ物(もの)は 何(なん)ですか。|魚(さかな)料理(りょうり)|肉(にく)料理(りょうり)|お菓子(かし)|そば\n##24 Kế hoạch học\nA:来月(らいげつ)の 試験(しけん)、 どう やって 勉強(べんきょう)する つもり？=Kỳ thi tháng sau cậu định học thế nào?\nB:苦手(にがて)な 聴解(ちょうかい)を 中心(ちゅうしん)に、 毎日(まいにち) 1時間(じかん) やろうと 思(おも)ってる。=Tớ định mỗi ngày học 1 tiếng, chủ yếu là phần nghe mà tớ kém.\nA:文法(ぶんぽう)は？=Ngữ pháp thì sao?\nB:文法(ぶんぽう)は 週末(しゅうまつ)に まとめてやるよ。 平日(へいじつ)は 時間(じかん)が ないから。=Ngữ pháp thì cuối tuần học dồn. Ngày thường không có thời gian.\n?男(おとこ)の 人(ひと)は 平日(へいじつ)、 何(なに)を 中心(ちゅうしん)に 勉強(べんきょう)しますか。|聴解(ち
