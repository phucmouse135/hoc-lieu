<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lộ trình JLPT N2 trong 52 tuần</title>
<meta name="description" content="Lộ trình một năm ôn JLPT N2: ngữ pháp, từ vựng, kanji có thứ tự nét, kaiwa, nghe hiểu, đọc hiểu.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%231B2836'/%3E%3Ctext x='50' y='72' font-size='64' text-anchor='middle' fill='white'%3E二%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F5F8F4;--card:#FFFFFF;--ink:#1B2836;--mute:#5C6B78;--line:#D3DED5;--grid:#8FBF9F;--ai:#26497F;--ai-soft:#E3ECF8;--shu:#D23F2A;--shu-soft:#FBE8E4;--hl:#FFF1A6;--ok:#1B7A57;--ok-soft:#E0F3EA;
 --jp:"Klee One","Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo","Noto Sans JP",sans-serif;--ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#111922;--card:#18222E;--ink:#E7EDF1;--mute:#98A6B2;--line:#2A3848;--grid:#3E6B55;--ai:#93B6EE;--ai-soft:#1D2C44;--shu:#F0705C;--shu-soft:#3A211D;--hl:#5A5015;--ok:#5CC79B;--ok-soft:#173529}}
:root[data-theme="dark"]{--paper:#111922;--card:#18222E;--ink:#E7EDF1;--mute:#98A6B2;--line:#2A3848;--grid:#3E6B55;--ai:#93B6EE;--ai-soft:#1D2C44;--shu:#F0705C;--shu-soft:#3A211D;--hl:#5A5015;--ok:#5CC79B;--ok-soft:#173529}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--ui);-webkit-text-size-adjust:100%}
.jp{font-family:var(--jp);font-weight:600}
rt{font-size:.55em;font-weight:400;color:var(--mute);user-select:none}
.nofuri rt{display:none}
a{color:var(--ai)}
h1{font-size:1.75rem;line-height:1.25;margin:.2em 0 .3em;letter-spacing:-.01em}
h2{font-size:1.2rem;margin:0 0 .6em;display:flex;align-items:center;gap:.5em;flex-wrap:wrap}
h3{font-size:1.1rem;margin:0 0 .2em}
p{margin:.4em 0 .8em;max-width:68ch}
.mute{color:var(--mute);font-size:.92rem}.lead{font-size:1.05rem}
mark{background:var(--hl);color:inherit;padding:0 .15em;border-radius:3px}
:focus-visible{outline:3px solid var(--ai);outline-offset:2px}
#app{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:100vh}
.nav{position:sticky;top:0;align-self:start;height:100vh;padding:20px 12px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;background:var(--card)}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500}
.nav a .jp{width:28px;height:28px;display:grid;place-items:center;border:1.5px solid var(--grid);border-radius:4px;font-size:1rem}
.nav a.on{background:var(--ai-soft);color:var(--ai)}.nav a.on .jp{border-color:var(--ai)}
.nav .brand{font-weight:700;margin-bottom:14px;flex-direction:column;align-items:flex-start;gap:0;line-height:1.3}
.nav .brand .jp{border:0;width:auto;height:auto;font-size:1.5rem;color:var(--shu)}
main{padding:28px clamp(16px,4vw,48px) 96px;max-width:900px;width:100%}
.onb{max-width:460px;margin:0 auto;padding:8vh 20px;grid-column:1/-1}
.onb label,.form label{display:block;font-weight:500;margin:14px 0}
input:not([type=checkbox]),select{display:block;width:100%;margin-top:4px;padding:10px 12px;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:8px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0 16px}
.genko-row{display:flex;margin-bottom:18px}.genko-row span{width:64px;height:64px;display:grid;place-items:center;border:1.5px solid var(--grid);margin-right:-1.5px;font:600 2.2rem var(--jp);color:var(--shu)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border:1.5px solid var(--ai);border-radius:8px;background:var(--ai);color:var(--card);font:600 1rem var(--ui);text-decoration:none;cursor:pointer}
.btn.line{background:transparent;color:var(--ai)}.btn.sm{padding:6px 12px;font-size:.88rem}.btn.wide{width:100%;margin-top:10px}
.btn.danger{background:transparent;border-color:var(--shu);color:var(--shu)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0}
.note{background:var(--shu-soft);border-left:4px solid var(--shu);padding:10px 14px;border-radius:0 8px 8px 0;max-width:none}
.tip{background:var(--hl);padding:8px 12px;border-radius:8px;font-size:.95rem}
.tip::before{content:"Mẹo nhớ: ";font-weight:700}
.sec{margin:34px 0;padding-top:22px;border-top:1.5px solid var(--line)}
.crumb{font-size:.88rem;color:var(--mute);margin:0}
.hero{display:flex;gap:28px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.hero-k{display:flex}.hero-k .genko{width:clamp(84px,17vw,128px);margin-right:-1.5px;cursor:pointer;padding:0;background:var(--card)}
.genko{aspect-ratio:1;border:1.5px solid var(--grid);background:var(--card);position:relative;display:block}
.genko.txt{display:grid;place-items:center;font-size:clamp(3rem,10vw,4.6rem);color:var(--shu)}
.ksvg{display:block;width:100%;height:100%}
.ksvg path{fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.ksvg path.kgrid{stroke:var(--grid);stroke-width:.6;stroke-dasharray:3 3;opacity:.8}
.ksvg path.hi{stroke:var(--shu)}.ksvg path.ghost{stroke:var(--line)}
.ksvg text{font:600 7px var(--ui);fill:var(--shu)}
.ksvg.st path{stroke-width:5}.ksvg.st .kgrid{display:none}
.stamp{display:inline-grid;place-items:center;width:2em;height:2em;border:2px solid var(--shu);border-radius:50%;color:var(--shu);font:600 .95rem var(--jp);transform:rotate(-10deg);flex:none}
.stamp.sm{font-size:.75rem}.stamp.big{width:5.2rem;height:5.2rem;font-size:1.7rem;border-width:3px;margin:10px auto}
.stamp.fail{border-color:var(--mute);color:var(--mute)}
.todo,.outl,.vlist,.gx,.kw{list-style:none;padding:0;margin:10px 0}
.todo li,.outl li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:9px 2px;border-bottom:1px dashed var(--line)}
.todo li.done a{color:var(--mute);text-decoration:line-through}.todo span{color:var(--mute);font-size:.9rem}
.outl li>span{flex:1;color:var(--mute)}.outl li>b{min-width:9em}.outl small{color:var(--shu)}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));flex:1}
.cell{aspect-ratio:1;border:1.5px solid var(--grid);margin:0 -1.5px -1.5px 0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:3px;text-decoration:none;color:var(--ink);background:var(--card);position:relative;min-width:0}
.cell small{font-size:.62rem;color:var(--mute);line-height:1.2}.cell b{font-size:clamp(1rem,3.4vw,1.6rem);line-height:1;opacity:.85}
.cell.review b,.cell.mock b,.cell.final b{color:var(--ai)}
.cell.today{outline:3px solid var(--ai);outline-offset:-3px;z-index:1}
.cell .stamp{position:absolute;inset:0;margin:auto;width:70%;height:70%;font-size:clamp(.8rem,2.6vw,1.2rem);background:color-mix(in srgb,var(--card) 70%,transparent)}
.wk{display:flex;align-items:center;gap:10px;margin-bottom:1.5px}.wkl{width:74px;flex:none;font-weight:600;font-size:.85rem}.wkl small{display:block;font-weight:400;color:var(--mute);font-size:.7rem}
.pbar{display:grid;grid-template-columns:70px 1fr 60px;gap:10px;align-items:center;margin:6px 0;font-size:.9rem}
.pbar div,.qbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.pbar i,.qbar i{display:block;height:100%;background:var(--ok)}
.gcard{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:16px 18px;margin:14px 0}
.gcard h3{font-size:1.35rem;color:var(--ai)}.gm{font-weight:600;margin:0 0 8px}
.gs{background:var(--ai-soft);padding:8px 12px;border-radius:8px;max-width:none}
.gx li,.vlist li,.kw li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px dashed var(--line)}
.gx .jp,.pass{font-size:1.15rem;line-height:2}.gx .vi{display:block;color:var(--mute);font-size:.93rem}
.say{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:transparent;color:var(--ai);display:grid;place-items:center;cursor:pointer;margin-top:4px}
.vlist li{cursor:pointer;align-items:center}.vlist .jp{font-size:1.2rem;min-width:9.5em;line-height:2}.kw .jp{min-width:7em;font-size:1.1rem;line-height:2}
.vlist.hidden li:not(.show) .vm{filter:blur(6px)}
.chk{display:flex;gap:8px;align-items:center;margin:10px 0;font-size:.95rem}
.kcard{display:grid;grid-template-columns:200px minmax(0,1fr);gap:14px 22px;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:16px;margin:14px 0}
.kcard .hv{color:var(--shu);font-size:1.3rem;margin-right:.3em}
.chips span{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:0 10px;font-size:.8rem;margin-right:6px;color:var(--mute)}
.yomi{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:8px 0}.yomi dt{color:var(--mute);font-size:.88rem}.yomi dd{margin:0}
.steps{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px}.steps svg{width:54px;height:54px;border:1px solid var(--line);background:var(--card)}
.tabs{display:flex;gap:8px;margin:14px 0}.tabs a{padding:6px 14px;border:1.5px solid var(--line);border-radius:99px;text-decoration:none;color:var(--ink)}.tabs a.on{background:var(--ai);border-color:var(--ai);color:var(--card)}
.kgridv{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr))}
.kgridv button{aspect-ratio:1;border:1.5px solid var(--grid);margin:0 -1.5px -1.5px 0;background:var(--card);color:var(--ink);font-size:1.5rem;cursor:pointer;padding:0}
.kgridv button.w{background:var(--shu-soft)}.kgridv button:hover{background:var(--ai-soft)}
.pn{display:flex;justify-content:space-between;margin-top:40px}
#modal,#quiz{position:fixed;inset:0;z-index:50;display:none;overflow:auto}
#modal.on{display:grid;place-items:center;background:rgba(10,18,28,.55);padding:16px}
.sheet{background:var(--paper);border-radius:12px;padding:22px;width:min(680px,100%);max-height:92vh;overflow:auto;position:relative}
.sheet .kcard{border:0;padding:0;background:transparent;margin:0}
.x{position:absolute;top:8px;right:10px;width:36px;height:36px;border:0;background:transparent;font-size:1.6rem;color:var(--mute);cursor:pointer;z-index:2}
.pad{position:relative;width:min(320px,80vw);margin:10px auto}.pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
#quiz.on{display:block;background:var(--paper)}
.qwrap{max-width:680px;margin:0 auto;padding:16px 18px 80px}
.qhead{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:6px 0 10px}.qhead .x{position:static}.qhead b{flex:1}
.qtag{display:inline-block;margin:18px 0 6px;font-size:.82rem;font-weight:600;color:var(--ai);background:var(--ai-soft);padding:2px 10px;border-radius:99px}
.qtext{font-size:1.05rem}.qs{font-size:1.45rem;line-height:2.1;margin:10px 0}.qs.huge,.qs .huge{font-size:4rem;line-height:1.3}
.qs u{text-decoration-thickness:2px;text-underline-offset:6px}
.pass{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.bl{display:inline-block;min-width:3em;border-bottom:2px solid var(--ink);text-align:center;color:var(--shu);margin:0 2px}
.opts{display:grid;gap:10px;margin:16px 0}
.opt{display:flex;gap:12px;align-items:center;text-align:left;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:1.12rem;cursor:pointer;line-height:1.8}
.opt .on{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:600 .8rem var(--ui);flex:none}
.opt:not(:disabled):hover{border-color:var(--ai)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.no{border-color:var(--shu);background:var(--shu-soft)}
.fb{padding:12px 16px;border-radius:10px;margin:8px 0}.fb.good{background:var(--ok-soft)}.fb.bad{background:var(--shu-soft)}.fb p{margin:.3em 0;max-width:none}
.fb.good b{color:var(--ok)}.fb.bad b{color:var(--shu)}
.result{text-align:center;padding:10px 0 20px}.result p{margin-inline:auto}
.rev{border-top:1px dashed var(--line);padding:10px 0}.rev .qs{font-size:1.2rem}.rev .huge{font-size:2.4rem}.rev .pass{display:none}
span.ok{color:var(--ok)}span.no{color:var(--shu)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:99;font-size:.92rem;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:820px){
 #app{display:block}
 .nav{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));border:0;border-top:1px solid var(--line);z-index:20}
 .nav .brand{display:none}.nav a{flex-direction:column;gap:2px;font-size:.68rem;padding:4px 6px}
 main{padding-top:18px}h1{font-size:1.45rem}
 .kcard{grid-template-columns:1fr}.kfig{max-width:220px}
 .wk{flex-direction:column;align-items:stretch;gap:2px;margin-bottom:10px}.wkl{width:auto}.wkl small{display:inline;margin-left:8px}
 .vlist .jp{min-width:7.5em}.outl li{flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.pass{white-space:pre-line}
.qs.sm{font-size:1.15rem}
.guide{padding-left:1.3em;max-width:70ch}.guide li{margin:.45em 0}
.kwl .spk{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ai-soft);color:var(--ai);display:grid;place-items:center;font-size:.85rem;margin-top:6px}
.kwl.veil div{filter:blur(7px);user-select:none}
.gxl{font-size:1.3rem;line-height:2.1}
.vlist li.cut{border-top:2px solid var(--grid)}
.chipsb{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chip{padding:6px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-size:1.1rem;line-height:1.9;cursor:pointer}
.chip:disabled{opacity:.35;cursor:default}.chip:not(:disabled):hover{border-color:var(--ai)}
#din{font-size:1.2rem;padding:12px 14px;margin-top:12px}
.czb{font:inherit;background:var(--ai-soft);border:0;border-bottom:2px solid var(--ai);border-radius:4px 4px 0 0;color:var(--ai);cursor:pointer;padding:0 8px;min-width:3.2em}
.czb.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}.czb.no{background:var(--shu-soft);border-color:var(--shu);color:var(--shu)}
.bl.cur{background:var(--hl);border-color:var(--shu)}
.flash{background:var(--card);border:1.5px solid var(--grid);border-radius:10px;padding:26px 18px;text-align:center;margin:14px 0;min-height:180px}
.flash .huge{font-size:5rem;line-height:1.2}.flash p{margin-inline:auto}
.fback{border-top:1px dashed var(--line);margin-top:16px;padding-top:14px}
.rev .huge{font-size:2.2rem}
.tb{width:100%;border-collapse:collapse;margin:14px 0;font-size:.93rem;text-align:left}
.tb th,.tb td{border:1px solid var(--line);padding:7px 10px;vertical-align:top}.tb th{background:var(--ai-soft)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin:18px 0}
.pcard{display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px 16px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;text-decoration:none;cursor:pointer}
.pcard:hover{border-color:var(--ai)}.pcard b{color:var(--ai)}.pcard span{color:var(--mute);font-size:.9rem}
@media (max-width:820px){.nav a{font-size:.62rem;padding:4px 2px}.nav a .jp{width:26px;height:26px}.tb{font-size:.82rem}}
.btn:disabled{opacity:.5;cursor:default}
.cell.free b{color:var(--ok)}</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="quiz" role="dialog" aria-label="Bài tập"></div>

たって|khi, vào dịp (bắt tay vào việc lớn)|V-từ điển / N + にあたって / にあたり\nGần với に際して, nhấn mạnh thái độ chuẩn bị, tích cực trước việc quan trọng.\n>新(あたら)しい 事業(じぎょう)を 始(はじ)める 【に あたって|に ついて|に わたって|に こたえて】、 十分(じゅうぶん)な 調査(ちょうさ)を 行(い)った。=Khi bắt đầu dự án kinh doanh mới, chúng tôi đã điều tra kỹ lưỡng.\n>卒業(そつぎょう) 【に あたり|に つきは|に 沿(そ)い|に かけ】、 お世話(せわ)に なった 先生(せんせい)方(かた)に お礼(れい)を 申(もう)し上(あ)げます。=Nhân dịp tốt nghiệp, em xin cảm ơn các thầy cô đã giúp đỡ.\n>試験(しけん)を 受(う)けるに あたって、 次(つぎ)の 【点(てん)に 注意(ちゅうい)してください|点(てん)に 注意(ちゅうい)しましたか|点(てん)が 注意(ちゅうい)された|点(てん)を 注意(ちゅうい)しよう】。=Khi dự thi, hãy chú ý các điểm sau.\n##4\n@〜に先立って|trước khi ~ (làm trước để chuẩn bị) (にさきだって)|V-từ điển / N + に先立って / に先立ち\nTrước một sự kiện chính thức, làm việc gì như bước chuẩn bị.\n>会議(かいぎ) 【に 先立(さきだ)って|に 際(さい)した|に あたる|以来(いらい)】、 資料(しりょう)が 配(くば)られた。=Trước cuộc họp, tài liệu đã được phát.\n>試合(しあい)に 先立(さきだ)ち、 選手(せんしゅ)の 【紹介(しょうかい)が 行(おこな)われた|紹介(しょうかい)を 行(おこな)おう|紹介(しょうかい)に 行(い)った|紹介(しょうかい)が 行(おこな)う】。=Trước trận đấu đã có phần giới thiệu cầu thủ.\n>工事(こうじ)を 始(はじ)める 【に 先立(さきだ)って|次第(しだい)|上(うえ)に|とたんに】、 近所(きんじょ)の 人(ひと)に 説明(せつめい)会(かい)を 開(ひら)いた。=Trước khi bắt đầu thi công, họ đã mở buổi giải thích cho hàng xóm.\n##5\n@〜て以来|kể từ khi ~ (suốt đến nay) (ていらい)|V て + 以来 ・ N + 以来\nMột trạng thái kéo dài liên tục từ thời điểm đó đến bây giờ. Không dùng cho việc gần đây hay việc xảy ra một lần.\n>日本(にほん)に 【来(き)て 以来(いらい)|来(く)る 以来(いらい)|来(き)た 以来(いらい)|来(き)て 次第(しだい)】、 一(いち)度(ど)も 国(くに)へ 帰(かえ)っていない。=Từ khi đến Nhật, tôi chưa về nước lần nào.\n>卒業(そつぎょう) 【以来(いらい)|次第(しだい)|際(さい)|上(うえ)】、 彼(かれ)とは 会(あ)っていない。=Từ khi tốt nghiệp tôi không gặp anh ấy.\n>この 町(まち)に 引(ひ)っ越(こ)して 以来(いらい)、 ずっと 同(おな)じ 店(みせ)で 【買(か)い物(もの)を している|買(か)い物(もの)を した|買(か)い物(もの)を しよう|買(か)い物(もの)を する つもりだ】。=Từ khi chuyển đến thị trấn này, tôi vẫn mua sắm ở cùng một cửa hàng.\n##6\n@〜次第|ngay sau khi ~ (しだい)|V (bỏ ます) / N + 次第\nViệc trước xong là lập tức làm việc sau. Vế sau là ý chí, yêu cầu; không dùng quá khứ.\n!Dạng ます bỏ ます: 決まり次第, 届き次第.\n>詳(くわ)しい ことが 【わかり 次第(しだい)|わかる 次第(しだい)|わかって 次第(しだい)|わかった 次第(しだい)】、 ご連絡(れんらく)します。=Ngay khi biết chi tiết, tôi sẽ liên lạc.\n>準備(じゅんび)が 【でき 次第(しだい)|できる 以来(いらい)|できて 次第(しだい)|できた 際(さい)】、 出発(しゅっぱつ)しましょう。=Chuẩn bị xong là xuất phát ngay nhé.\n>品物(しなもの)が 届(とど)き 次第(しだい)、 【お支払(しはら)いください|お支払(しはら)いしました|支払(しはら)った そうです|支払(しはら)ってしまった】。=Ngay khi hàng đến, xin hãy thanh toán.\n##7\n@〜か〜ないかのうちに|vừa mới ~ (chưa dứt) thì đã|V-từ điển / V た + か + V ない + かのうちに\nViệc sau xảy ra gần như đồng thời với việc trước.\n>ベルが 【鳴(な)るか 鳴(な)らないかの うちに|鳴(な)るか 鳴(な)ったかの うちに|鳴(な)って 鳴(な)らない うちに|鳴(な)るか 鳴(な)らない うちで】、 学生(がくせい)たちは 教室(きょうしつ)を 出(で)ていった。=Chuông vừa reo chưa dứt thì học sinh đã ra khỏi lớp.\n>彼(かれ)は 食事(しょくじ)が 終(お)わったか 終(お)わらないかの うちに、 【席(せき)を 立(た)った|席(せき)を 立(た)とう|席(せき)を 立(た)ってください|席(せき)を 立(た)つ つもりだ】。=Anh ấy vừa ăn xong đã rời chỗ ngay.\n>ドアが 開(あ)くか 開(あ)か ないか 【の うちに|の 際(さい)に|の 次第(しだい)に|の 以来(いらい)】、 客(きゃく)が 入(はい)ってきた。=Cửa vừa mở thì khách đã vào.\n##8\n@〜かと思うと・〜かと思ったら|vừa thấy ~ thì đã (bất ngờ)|V た + かと思うと / かと思ったら\nHai việc trái ngược xảy ra liên tiếp khiến người nói ngạc nhiên. Không dùng cho hành động của mình.\n>空(そら)が 暗(くら)く なった 【かと 思(おも)うと|かと 思(おも)って|と 思(おも)うか|かと 思(おも)えばは】、 急(きゅう)に 大雨(おおあめ)が 降(ふ)り出(だ)した。=Trời vừa tối lại thì bỗng đổ mưa to.\n>弟(おとうと)は 帰(かえ)ってきた 【かと 思(おも)ったら|次第(しだい)|以来(いらい)|に 際(さい)して】、 もう 遊(あそ)びに 出(で)かけた。=Em trai tôi vừa về đã lại đi chơi.\n>赤(あか)ちゃんは 泣(な)いたかと 思(おも)うと、 すぐ 【笑(わら)い出(だ)した|笑(わら)い 出(で) そう|笑(わら)い出(だ)しなさい|笑(わら)い出(だ)す つもりだ】。=Em bé vừa khóc đã cười ngay.\n##9\n@〜上で|sau khi ~ rồi mới (うえで)|V た / N の + 上で\nLàm việc trước như một bước cần thiết rồi mới làm việc sau.\n!た上で = \"sau khi đã\"; る上で = \"trong việc\" (mục đích).\n>よく 【考(かんが)えた 上(うえ)で|考(かんが)える 次第(しだい)|考(かんが)えて 以来(いらい)|考(かんが)えた 際(さい)】、 お返事(へんじ)します。=Sau khi nghĩ kỹ tôi sẽ trả lời.\n>両親(りょうしん)と 相談(そうだん) 【の 上(うえ)で|の 次第(しだい)|の 以来(いらい)|の 際(さい)】、 進学(しんがく)先(さき)を 決(き)めたい。=Tôi muốn bàn với bố mẹ rồi mới quyết định trường học lên.\n>内容(ないよう)を ご確認(かくにん)の 上(うえ)、 こちらに 【サインを お願(ねが)いします|サインを しました|サインを した そうです|サインを した ものだ】。=Sau khi kiểm tra nội dung, xin quý vị ký vào đây.\n##10\n@〜てはじめて|chỉ sau khi ~ mới|V て + はじめて\nNhờ trải qua việc trước mới nhận ra, hiểu được điều sau.\n>病気(びょうき)に 【なって はじめて|なる 以来(いらい)|なり 次第(しだい)|なった 上(うえ)で】、 健康(けんこう)の 大切(たいせつ)さが わかった。=Chỉ khi bị bệnh tôi mới hiểu sức khoẻ quan trọng thế nào.\n>一人暮(ひとりぐ)らしを して はじめて、 親(おや)の 【ありがたさを 知(し)った|ありがたさを 知(し)ろう|ありがたさを 知(し)りなさい|ありがたさを 知(し)る つもりだ】。=Sống một mình rồi tôi mới biết ơn cha mẹ.\n>実際(じっさい)に やってみて 【はじめて|以来(いらい)|次第(しだい)|からで ないと】、 その 難(むずか)しさに 気(き)づいた。=Thực sự làm thử rồi tôi mới nhận ra nó khó.\n##11\n@〜をめぐって|xoay quanh ~ (tranh luận, đối lập)|N + をめぐって / をめぐる + N\nNhiều người tranh luận, đối lập quanh một vấn đề.\n>新(あたら)しい 空港(くうこう)の 建設(けんせつ) 【を めぐって|に 沿(そ)って|に 応(おう)じて|を もとに】、 住民(じゅうみん)の 意見(いけん)が 分(わ)かれている。=Xoay quanh việc xây sân bay mới, ý kiến người dân chia rẽ.\n>遺産(いさん) 【を めぐる|を めぐって|を めぐり|を めぐったの】 争(あらそ)いが 続(つづ)いている。=Cuộc tranh chấp xoay quanh tài sản thừa kế vẫn tiếp diễn.\n>この 問題(もんだい)を めぐって、 何(なん)時間(じかん)も 【議論(ぎろん)が 行(おこな)われた|議論(ぎろん)を 行(おこな)おう|議論(ぎろん)してください|議論(ぎろん)する つもりだ】。=Xoay quanh vấn đề này người ta đã tranh luận nhiều giờ.\n##12\n@〜に応じて|ứng với, tuỳ theo ~ (におうじて)|N + に応じて / に応じた + N\nThay đổi cho phù hợp với mức độ, yêu cầu, hoàn cảnh.\n>収入(しゅうにゅう) 【に 応(おう)じて|を めぐって|に 先立(さきだ)って|に 際(さい)して】、 税金(ぜいきん)の 額(がく)が 決(き)まる。=Số tiền thuế được quyết định tuỳ theo thu nhập.\n>お客(きゃく)様(さま)の 希望(きぼう) 【に 応(おう)じた|に 応(おう)じて|に 応(おう)じるの|に 応(おう)じ】 プランを ご用意(ようい)します。=Chúng tôi chuẩn bị gói dịch vụ phù hợp với nguyện vọng của quý khách.\n>季節(きせつ)に 応(おう)じて、 メニューを 【変(か)えている|変(か)えた ことが あるか|変(か)えなさいと|変(か)えただろうに】。=Chúng tôi thay đổi thực đơn tuỳ theo mùa.\n##13\n@〜に沿って|dọc theo ~; theo đúng ~ (にそって)|N + に沿って / に沿った + N\n(1) Dọc theo đường, sông. (2) Theo đúng phương châm, kế hoạch, mong muốn.\n>川(かわ) 【に 沿(そ)って|に 応(おう)じて|を めぐって|に あたって】、 桜(さくら)の 木(き)が 植(う)えられている。=Dọc theo con sông có trồng cây anh đào.\n>会社(かいしゃ)の 方針(ほうしん) 【に 沿(そ)って|に 先立(さきだ)って|以来(いらい)|次第(しだい)】、 計画(けいかく)を 進(すす)める。=Tiến hành kế hoạch theo đúng phương châm của công ty.\n>お客(きゃく)様(さま)の ご希望(きぼう)に 【沿(そ)った|めぐった|際(さい)した|先立(さきだ)った】 商品(しょうひん)を 作(つく)りたい。=Chúng tôi muốn làm ra sản phẩm đúng với mong muốn của khách.\n##14\n@〜に基づいて|dựa trên ~ (にもとづいて)|N + に基づいて / に基づく + N / に基づいた + N\nLấy làm căn cứ, cơ sở: データ, 事実, 法律, 経験.\n>この 映画(えいが)は 事実(じじつ) 【に 基(もと)づいて|に 沿(そ)っては|を めぐって|に 応(おう)じて】 作(つく)られた。=Bộ phim này được làm dựa trên sự thật.\n>調査(ちょうさ)の 結果(けっか) 【に 基(もと)づき|を めぐり|に 先立(さきだ)ち|に あたり】、 新(あたら)しい 計画(けいかく)が 立(た)てられた。=Dựa trên kết quả điều tra, kế hoạch mới đã được lập.\n>法律(ほうりつ) 【に 基(もと)づく|に 基(もと)づいて|に 基(もと)づき|に 基(もと)づける】 判断(はんだん)が 必要(ひつよう)だ。=Cần có phán đoán dựa trên pháp luật.\n##15\n@〜をもとに|dựa trên ~ (làm chất liệu)|N + をもとに(して)\nLấy làm nguyên liệu, nguồn để tạo ra thứ mới. に基づいて thiên về \"tuân theo căn cứ\".\n>この ドラマは、 実際(じっさい)に あった 事件(じけん) 【を もとに|を めぐって|に 沿(そ)って|に 応(おう)じて】 作(つく)られている。=Bộ phim này được làm từ một vụ việc có thật.\n>アンケートの 結果(けっか)を もとに して、 新(あたら)しい 【商品(しょうひん)を 開発(かいはつ)した|商品(しょうひん)を 開発(かいはつ)しようか|商品(しょうひん)が 開発(かいはつ)する|商品(しょうひん)に 開発(かいはつ)した】。=Dựa trên kết quả khảo sát, họ đã phát triển sản phẩm mới.\n>先生(せんせい)の アドバイス 【を もとに|に 先立(さきだ)って|に 際(さい)して|次第(しだい)で】、 レポートを 書(か)き直(なお)した。=Dựa trên lời khuyên của thầy, tôi đã viết lại báo cáo.\n##16\n@〜あまり|vì quá ~ nên|V-từ điển / V た / A-な + な / N の + あまり\nMức độ cảm xúc, trạng thái quá cao dẫn đến kết quả không bình thường.\n>緊張(きんちょう)の 【あまり|だけに|ばかりに|からこそ】、 何(なに)も 話(はな)せなく なってしまった。=Vì quá căng thẳng nên tôi không nói được gì.\n>子供(こども)の 将来(しょうらい)を 【心配(しんぱい) する あまり|心配(しんぱい)の あまりには|心配(しんぱい) したばかり|心配(しんぱい)だけ あって】、 口(くち)を 出(だ)しすぎてしまう。=Vì quá lo cho tương lai của con nên can thiệp quá nhiều.\n>うれしさの あまり、 【泣(な)き出(だ)してしまった|泣(な)き 出(で) そう|泣(な)き出(だ)しなさい|泣(な)き出(だ)す ことに する】。=Vì quá vui nên tôi bật khóc.\n##17\n@〜だけに|chính vì ~ nên (càng)|thể thông thường + だけに (N, A-な + な / である)\nVì có lý do đó nên kết quả tương xứng là đương nhiên, hoặc cảm xúc càng mạnh hơn.\n>彼(かれ)は 10年(ねん)も 日本(にほん)に 住(す)んでいた 【だけに|あまり|ばかりに|からにはを】、 日本(にほん)語(ご)が 上手(じょうず)だ。=Chính vì sống ở Nhật 10 năm nên anh ấy giỏi tiếng Nhật.\n>期待(きたい)が 大(おお)きかった 【だけに|ものの|にも かかわらず|どころか】、 負(ま)けた ときの ショックも 大(おお)きかった。=Chính vì kỳ vọng lớn nên khi thua cú sốc cũng lớn.\n>この 店(みせ)は 有名(ゆうめい)なだけに、 いつも 【客(きゃく)で いっぱいだ|客(きゃく)が いない|客(きゃく)が 来(こ)ない はずだ|客(きゃく)を 断(ことわ)っている】。=Chính vì nổi tiếng nên quán này lúc nào cũng đông khách.\n##18\n@〜だけあって|quả đúng là ~ có khác|thể thông thường + だけあって (N, A-な + な)\nKhen ngợi: kết quả tốt xứng với nỗ lực, địa vị, danh tiếng.\n!だけあって chỉ dùng để khen; だけに dùng cho cả tốt lẫn xấu.\n>さすが プロ 【だけ あって|ばかりに|あまり|どころか】、 歌(うた)が うまい。=Quả đúng là dân chuyên, hát hay thật.\n>高(たか)い 【だけ あって|ばかりに|からこそは|にも かかわらず】、 この ホテルは サービスが いい。=Đắt có khác, khách sạn này dịch vụ tốt.\n>毎日(まいにち) 練習(れんしゅう)しているだけ あって、 ずいぶん 【上手(じょうず)に なった|下手(へた)に なった|上手(じょうず)に ならない|下手(へた)だろう】。=Quả đúng là ngày nào cũng luyện, giỏi lên nhiều rồi.\n##19\n@〜ばかりに|chỉ tại ~ mà (kết quả xấu)|thể thông thường + ばかりに (N である, A-な + な)\nChỉ vì một nguyên nhân mà gặp kết quả xấu ngoài mong muốn; mang ý hối tiếc.\n>うそを 【ついたばかりに|ついただけ あって|つく あまりに|ついたからこそ】、 友達(ともだち)を 失(うしな)ってしまった。=Chỉ tại nói dối mà tôi mất bạn.\n>お金(かね)が ない 【ばかりに|だけ あって|からこそ|あまりを】、 進学(しんがく)を あきらめた。=Chỉ tại không có tiền mà tôi đã từ bỏ việc học lên.\n>彼(かれ)の 言葉(ことば)を 信(しん)じたばかりに、 【ひどい 目(め)に あった|いい ことが あった|助(たす)けてもらった|得(とく)を した】。=Chỉ tại tin lời anh ta mà tôi gặp chuyện tồi tệ.\n##20\n@〜からこそ|chính vì ~|thể thông thường + からこそ\nNhấn mạnh đây mới chính là lý do, thường trái với suy nghĩ thông thường.\n>あなたの ことを 思(おも)っている 【からこそ|ばかりに|あまり|だけ あって】、 厳(きび)しく 言(い)うのです。=Chính vì nghĩ cho em nên tôi mới nói nghiêm khắc.\n>苦(くる)しい 【からこそ|ばかりには|どころか|にも かかわらず】、 笑顔(えがお)を 忘(わす)れない ように している。=Chính vì khổ nên tôi cố gắng không quên nụ cười.\n>努力(どりょく)したからこそ、 【合格(ごうかく) できたのだ|合格(ごうかく) できなかった|不(ふ)合格(ごうかく)に なった|失敗(しっぱい)したのだ】。=Chính vì đã nỗ lực nên mới đỗ được.\n##21\n@〜にもかかわらず|mặc dù ~, bất chấp|thể thông thường / N + にもかかわらず (N, A-な + である)\nKết quả trái với điều dự đoán từ vế trước. Văn viết, trang trọng.\n>雨(あめ) 【にも かかわらず|だけに|ばかりに|からこそ】、 大勢(おおぜい)の 人(ひと)が 集(あつ)まった。=Mặc dù trời mưa, rất đông người đã tụ tập.\n>何(なん)度(ど)も 注意(ちゅうい)した 【にも かかわらず|からと いって|あまり|だけ あって】、 彼(かれ)は また 同(おな)じ 間違(まちが)いを した。=Mặc dù đã nhắc nhiều lần, anh ấy lại mắc cùng lỗi đó.\n>忙(いそが)しいにも かかわらず、 【手伝(てつだ)ってくれた|手伝(てつだ)ってくれなかった|手伝(てつだ)わないだろう|手伝(てつだ)う はずが ない】。=Mặc dù bận, anh ấy vẫn giúp tôi.\n##22\n@〜ながら(も)|tuy ~ nhưng|V (bỏ ます) / A-い / A-な / N + ながら(も)\nThừa nhận vế trước nhưng thực tế lại khác. Hay gặp: 残念ながら, 狭いながら, 知っていながら.\n>残念(ざんねん) 【ながら|つつ|だけに|あまり】、 今回(こんかい)は 参加(さんか) できません。=Thật tiếc là lần này tôi không tham gia được.\n>体(からだ)に 悪(わる)いと 【知(し)りながら|知(し)るながら|知(し)ってながら|知(し)ったながら】、 たばこを やめられない。=Tuy biết là hại sức khoẻ nhưng tôi không bỏ thuốc được.\n>狭(せま)いながらも、 楽(たの)しい 【わが家(や)だ|わが家(や)では ない|わが家(や)に 行(い)こう|わが家(や)を やめた】。=Tuy chật nhưng là mái nhà vui vẻ của tôi.\n##23\n@〜つつ(も)|tuy ~ nhưng; vừa ~ vừa|V (bỏ ます) + つつ(も)\n(1) Nghịch tiếp, thường với 思う, 知る, 言う. (2) Hai việc đồng thời (văn viết của ながら).\n>悪(わる)いと 【思(おも)いつつ|思(おも)うつつ|思(おも)ってつつ|思(おも)ったつつ】、 つい 約束(やくそく)を 破(やぶ)ってしまった。=Tuy nghĩ là không tốt nhưng tôi lỡ thất hứa.\n>早(はや)く 返事(へんじ)を 書(か)かなければと 思(おも)いつつも、 【まだ 書(か)いていない|もう 書(か)いた|すぐ 書(か)いた|書(か)き終(お)わった】。=Tuy nghĩ phải viết trả lời sớm nhưng tôi vẫn chưa viết.\n>景色(けしき)を 【楽(たの)しみつつ|楽(たの)しむつつ|楽(たの)しんでつつ|楽(たの)しみながらつつ】、 山道(やまみち)を 歩(ある)いた。=Tôi vừa ngắm cảnh vừa đi bộ trên đường núi.\n##24\n@〜からといって|chỉ vì ~ mà (thì không hẳn)|thể thông thường + からといって + 〜とは限らない / わけではない\nLý do đó chưa đủ để dẫn đến kết luận.\n>日本(にほん)人(にん)だ 【からと いって|からこそ|ばかりに|だけ あって】、 だれでも 敬語(けいご)が 正(ただ)しく 使(つか)える わけでは ない。=Không phải cứ là người Nhật thì ai cũng dùng đúng kính ngữ.\n>安(やす)いからと いって、 たくさん 【買(か)う 必要(ひつよう)は ない|買(か)うに 決(き)まっている|買(か)うべきだ|買(か)ってしまおう】。=Không phải cứ rẻ là cần mua nhiều.\n>疲(つか)れた 【からと いって|にも かかわらず|ながらも|あまり】、 仕事(しごと)を 休(やす)む わけには いかない。=Không thể chỉ vì mệt mà nghỉ việc.\n##25\n@〜わりに(は)|so với ~ thì (khác mong đợi)|thể thông thường + わりに(は) (N の, A-な + な)\nKết quả không tương xứng với mức thường nghĩ đến.\n>この 店(みせ)は 値段(ねだん)の 【わりに|だけに|あまり|ばかりに】、 量(りょう)が 多(おお)い。=Quán này so với giá thì khẩu phần nhiều.\n>彼(かれ)は 年(ねん)の 【わりには|だけ あっては|からこそ|にも かかわらずは】 若(わか)く 見(み)える。=So với tuổi thì ông ấy trông trẻ.\n>勉強(べんきょう)しなかった わりに、 試験(しけん)の 点(てん)は 【よかった|悪(わる)かった はずだ|低(ひく)いに 決(き)まっている|ひどかった】。=Không học mấy mà điểm thi lại tốt.\n##26\n@〜としたら・〜とすれば|giả sử ~ thì|thể thông thường + としたら / とすれば / とすると\nĐặt một giả định rồi nêu phán đoán, câu hỏi.\n>もし 宝(たから)くじが 当(あ)たった 【と したら|からと いって|にも かかわらず|だけに】、 何(なん)に 使(つか)いますか。=Giả sử trúng xổ số thì bạn dùng vào việc gì?\n>行(い)く 【と すれば|次第(しだい)|以来(いらい)|上(うえ)で】、 来週(らいしゅう)の 土曜(どよう) 日(ひ)しか ない。=Nếu đi thì chỉ còn thứ Bảy tuần sau.\n>彼(かれ)の 話(はなし)が 本当(ほんとう)だと すると、 【大変(たいへん)な ことに なる|何(なに)も 起(お)こらなかった|もう 終(お)わった|大丈夫(だいじょうぶ)だった】。=Giả sử chuyện anh ấy nói là thật thì sẽ thành chuyện lớn.\n##27\n@〜ないことには|nếu không ~ thì (không thể)|V ない + ことには + phủ định\nViệc trước là điều kiện bắt buộc; không có thì việc sau không thành.\n>実際(じっさい)に 【会(あ)ってみない ことには|会(あ)ってみるからには|会(あ)ってみたばかりに|会(あ)ってみたと したら】、 どんな 人(ひと)か わからない。=Nếu không gặp thử thì không biết là người thế nào.\n>お金(かね)が ない ことには、 何(なに)も 【始(はじ)められない|始(はじ)められる|始(はじ)めよう|始(はじ)めてください】。=Không có tiền thì không bắt đầu được gì.\n>部長(ぶちょう)が 【来(こ)ない ことには|来(く)る ことには|来(き)た ことには|来(こ)ず ことには】、 会議(かいぎ)が 始(はじ)まらない。=Trưởng phòng không đến thì cuộc họp không bắt đầu được.\n##28\n@〜を抜きにして|bỏ qua ~, không có ~ (をぬきにして)|N + を抜きにして / は抜きにして / 抜きで\nKhông tính đến, gạt sang một bên.\n>冗談(じょうだん)は 【抜(ぬ)きに して|もとに して|めぐって|沿(そ)って】、 まじめに 話(はな)しましょう。=Gạt chuyện đùa sang một bên, nói nghiêm túc đi.\n>彼(かれ)の 協力(きょうりょく) 【を 抜(ぬ)きに しては|を もとに しては|に 応(おう)じては|に 基(もと)づいては】、 この 計画(けいかく)は 成功(せいこう)しなかっただろう。=Không có sự hợp tác của anh ấy thì kế hoạch này chắc đã không thành.\n>今日(きょう)は 仕事(しごと)の 話(はなし) 【抜(ぬ)きで|次第(しだい)で|以来(いらい)で|際(さい)で】、 楽(たの)しく 飲(の)みましょう。=Hôm nay không bàn chuyện công việc, uống vui thôi.\n##29\n@〜かぎり|chừng nào còn ~; trong phạm vi ~|V-thường / A / N である + かぎり ・ V る / V た + かぎり(では)\n(1) Trong khi điều kiện còn tiếp diễn. (2) Trong phạm vi tôi biết, nhìn thấy: 知っているかぎり.\n>体(からだ)が 丈夫(じょうぶ)な 【かぎり|ばかりに|あまり|だけ あって】、 働(はたら)き続(つづ)けたい。=Chừng nào cơ thể còn khoẻ, tôi muốn tiếp tục làm việc.\n>私(わたし)が 知(し)っている 【かぎりでは|ことには|からと いって|にも かかわらず】、 彼(かれ)は まだ 独身(どくしん)だ。=Theo như tôi biết thì anh ấy vẫn độc thân.\n>学生(がくせい)で ある かぎり、 【勉強(べんきょう)するのは 当然(とうぜん)だ|勉強(べんきょう)しなくても いい|勉強(べんきょう)は できない|勉強(べんきょう)を やめるべきだ】。=Chừng nào còn là sinh viên thì học là đương nhiên.\n##30\n@〜ないかぎり|chừng nào chưa ~ thì (không)|V ない + かぎり\nNếu điều kiện đó không xảy ra thì kết quả không đổi.\n>雨(あめ)が 【やまない かぎり|やむ かぎり|やんだ かぎり|やま なく かぎり】、 試合(しあい)は 始(はじ)められない。=Chừng nào mưa chưa tạnh thì không bắt đầu trận đấu được.\n>あなたが 謝(あやま)らない かぎり、 彼(かれ)は 【許(ゆる)してくれないだろう|許(ゆる)してくれるだろう|許(ゆる)してくれた|すぐ 許(ゆる)す】。=Chừng nào bạn chưa xin lỗi thì anh ấy sẽ không tha thứ.\n>特別(とくべつ)な 理由(りゆう)が 【ない かぎり|ある かぎり|ない ことに|ある あまり】、 欠席(けっせき)は 認(みと)められません。=Trừ khi có lý do đặc biệt, không được phép vắng mặt.\n##31\n@〜かねる|khó mà ~, không thể ~ (lịch sự)|V (bỏ ます) + かねる\nTừ chối, nói không thể một cách lịch sự trong công việc, dịch vụ. Hình thức khẳng định nhưng nghĩa phủ định.\n!かねる = \"không thể\"; かねない = \"có thể (xấu)\". Ngược với hình thức.\n>申(もう)し訳(わけ) ございませんが、 その 質問(しつもん)には 【お答(こた)えしかねます|お答(こた)えしかねません|お答(こた)えできかねません|お答(こた)えするかねます】。=Xin lỗi quý khách, câu hỏi đó chúng tôi khó trả lời.\n>彼(かれ)の 意見(いけん)には 賛成(さんせい) 【しかねる|するかねる|してかねる|したかねる】。=Tôi khó mà tán thành ý kiến của anh ấy.\n>私(わたし) 一人(ひとり)では 【決(き)めかねます|決(き)めるかねます|決(き)めかねませんか|決(き)めたかねます】 ので、 上司(じょうし)に 相談(そうだん)します。=Một mình tôi khó quyết định nên tôi sẽ bàn với cấp trên.\n##32\n@〜かねない|có thể sẽ ~ (điều xấu)|V (bỏ ます) + かねない\nCó khả năng dẫn đến kết quả xấu.\n>そんなに スピードを 出(だ)したら、 事故(じこ)を 【起(お)こしかねない|起(お)こしかねる|起(お)こすかねない|起(お)こしがたい】。=Chạy nhanh như thế có thể gây tai nạn.\n>無理(むり)を すると、 病気(びょうき)に 【なりかねない|なりかねる|なるかねない|なりっこ ない】。=Làm quá sức có thể sinh bệnh.\n>あの 人(ひと)なら、 そんな ことを 【言(い)いかねない|言(い)いがたい|言(い)いっこ ない|言(い)い得(え)ない】。=Người đó thì có thể nói ra chuyện như vậy.\n##33\n@〜がたい|khó mà ~ (về tâm lý)|V (bỏ ます) + がたい\nKhó thực hiện về mặt cảm xúc, nhận thức: 信じがたい, 理解しがたい, 忘れがたい, 許しがたい.\n>彼(かれ)が そんな ことを したとは、 【信(しん)じがたい|信(しん)じかねない|信(しん)じっこ ない|信(しん)じにくく ない】。=Thật khó tin là anh ấy đã làm chuyện đó.\n>留学(りゅうがく)中(ちゅう)の 経験(けいけん)は、 私(わたし)に とって 【忘(わす)れがたい|忘(わす)れかねない|忘(わす)れるがたい|忘(わす)れてがたい】 思(おも)い出(で)だ。=Trải nghiệm thời du học là kỷ niệm khó quên với tôi.\n>弱(よわ)い 者(もの)を いじめるのは、 【許(ゆる)しがたい|許(ゆる)しかねない|許(ゆる)し得(う)る|許(ゆる)すがたい】 行為(こうい)だ。=Bắt nạt kẻ yếu là hành vi khó tha thứ.\n##34\n@〜っこない|tuyệt đối không thể ~ (thân mật)|V (bỏ ます) + っこない\nPhủ định mạnh trong hội thoại, tương đương はずがない.\n>こんなに たくさんの 宿題(しゅくだい)、 一(いち)日(にち)で 【できっこ ない|できかねない|できがたい|できるっこ ない】 よ。=Nhiều bài tập thế này, một ngày không thể nào làm xong.\n>いくら 説明(せつめい)しても、 彼(かれ)には 【わかりっこ ない|わかりかねるか|わかりがたく|わかるっこ ない】。=Giải thích bao nhiêu anh ta cũng không thể hiểu.\n>宝(たから)くじなんて、 【当(あ)たりっこ ない|当(あ)たりかねない|当(あ)たり得(う)る|当(あ)たるっこ ない】 と 思(おも)う。=Tôi nghĩ xổ số thì không thể nào trúng.\n##35\n@〜得る・〜得ない|có thể ~ / không thể ~ (うる・えない)|V (bỏ ます) + 得る (うる / える) / 得ない (えない)\nCó khả năng xảy ra hay không; văn viết. あり得ない = không thể có.\n>事故(じこ)は だれにでも 【起(お)こり得(う)る|起(お)こりかねる|起(お)こりがたい|起(お)こるっこ ない】。=Tai nạn có thể xảy ra với bất kỳ ai.\n>彼(かれ)が 試験(しけん)に 落(お)ちるなんて、 【あり得(え)ない|ありかねない|あり得(う)る|ありがたい】。=Chuyện anh ấy thi trượt là không thể có.\n>考(かんが)え 【得(う)る|かねる|がたい|っ こない】 方法(ほうほう)は 全部(ぜんぶ) 試(ため)してみた。=Tôi đã thử mọi cách có thể nghĩ ra.\n##36\n@〜ざるを得ない|đành phải ~, buộc phải (ざるをえない)|V ない (bỏ ない) + ざるを得ない (する → せざるを得ない)\nKhông muốn nhưng hoàn cảnh buộc phải làm.\n>台風(たいふう)が 近(ちか)づいているので、 旅行(りょこう)は 中止(ちゅうし) 【せざるを 得(え)ない|しざるを 得(え)ない|するざるを 得(え)ない|さざるを 得(え)ない】。=Bão đang đến gần nên đành phải huỷ chuyến du lịch.\n>社長(しゃちょう)の 命令(めいれい)だから、 【従(したが)わざるを 得(え)ない|従(したが)う ざるを 得(え)ない|従(したが)いざるを 得(え)ない|従(したが)わずを 得(え)ない】。=Vì là lệnh của giám đốc nên buộc phải tuân theo.\n>これだけ 証拠(しょうこ)が あれば、 彼(かれ)の 話(はなし)を 【信(しん)じざるを 得(え)ない|信(しん)じかねない|信(しん)じっこ ない|信(しん)じがたい】。=Có chừng này chứng cứ thì đành phải tin lời anh ấy.\n##37\n@〜ないわけにはいかない|không thể không ~|V ない + わけにはいかない\nVì nghĩa vụ, lẽ thường, quan hệ nên phải làm.\n>お世話(せわ)に なった 先生(せんせい)の 頼(たの)みだから、 【引(ひ)き受(う)けない わけには いかない|引(ひ)き受(う)ける わけが ない|引(ひ)き受(う)けっこ ない|引(ひ)き受(う)けかねない】。=Vì là lời nhờ của người thầy đã giúp đỡ mình nên không thể không nhận.\n>明日(あした)は 試験(しけん)だから、 今夜(こんや)は 勉強(べんきょう) 【しない わけには いかない|する わけには いかない|しない わけだ|する わけでは ない】。=Mai thi nên tối nay không thể không học.\n>みんなが 行(い)くのに、 私(わたし)だけ 【行(い)かない わけには いかない|行(い)く わけには いかない|行(い)かない わけが ない|行(い)く わけが ない】。=Mọi người đều đi, mình tôi không thể không đi.\n##38\n@〜ずにはいられない|không thể không ~ (tự nhiên muốn)|V ない (bỏ ない) + ずにはいられない (する → せずにはいられない)\nKhông kìm được, tự nhiên làm vì cảm xúc. Khi nói: 〜ないではいられない.\n>あの 映画(えいが)を 見(み)ると、 【泣(な)かずには いられない|泣(な)くずには いられない|泣(な)かざるを 得(う)る|泣(な)きかねる】。=Xem bộ phim đó là không thể không khóc.\n>彼(かれ)の 話(はなし)が おかしくて、 【笑(わら)わずには いられなかった|笑(わら)う わけには いかなかった|笑(わら)いかねた|笑(わら)いがたかった】。=Chuyện anh ấy kể buồn cười quá, tôi không nhịn được cười.\n>困(こま)っている 人(ひと)を 見(み)ると、 【助(たす)けずには いられない|助(たす)けかねない|助(たす)けっこ ない|助(たす)けがたい】。=Thấy người gặp khó là tôi không thể không giúp.\n##39\n@〜に相違ない|chắc chắn là ~ (văn viết) (にそういない)|thể thông thường / N + に相違ない\nKhẳng định chắc chắn dựa trên suy luận; trang trọng hơn に違いない.\n>これは 彼(かれ)が 書(か)いた もの 【に 相違(そうい) ない|に すぎない|どころでは ない|に 限(かぎ)らない】。=Đây chắc chắn là thứ anh ấy viết.\n>あの 様子(ようす)では、 何(なに)か 隠(かく)している 【に 相違(そうい) ない|わけが ない|っ こない|かねる】。=Nhìn dáng vẻ đó thì chắc chắn đang giấu điều gì.\n>犯人(はんにん)は この 窓(まど)から 入(はい)った 【に 相違(そうい) ない|に すぎなかった|どころか|ばかりに】 と 警察(けいさつ)は 考(かんが)えている。=Cảnh sát cho rằng thủ phạm chắc chắn đã vào từ cửa sổ này.\n##40\n@〜にすぎない|chẳng qua chỉ là ~|thể thông thường / N + にすぎない\nKhông hơn mức đó; đánh giá là ít, không quan trọng.\n>それは 単(たん)なる うわさ 【に すぎない|に 相違(そうい) ない|どころでは ない|ざるを 得(え)ない】。=Đó chẳng qua chỉ là tin đồn.\n>私(わたし)は 一人(ひとり)の 社員(しゃいん) 【に すぎません|に 相違(そうい) ありません|かねません|がたいです】 から、 決(き)める 権利(けんり)は ありません。=Tôi chẳng qua chỉ là một nhân viên nên không có quyền quyết định.\n>正(ただ)しく 答(こた)えられた 人(ひと)は、 全体(ぜんたい)の 5% 【に すぎなかった|に 相違(そうい) なかった|どころでは なかった|っこ なかった】。=Người trả lời đúng chỉ vỏn vẹn 5% tổng số.\n##41\n@〜からすると・〜からすれば|xét từ ~ thì; đứng từ phía ~|N + からすると / からすれば / からして\n(1) Căn cứ để phán đoán. (2) Từ lập trường của ai.\n>あの 話(はな)し方(かた) 【から すると|に したら|どころか|を めぐって】、 彼(かれ)は 東京(とうきょう)の 人(ひと)では ない ようだ。=Xét từ cách nói thì anh ấy hình như không phải người Tokyo.\n>親(おや) 【から すれば|からこそ|ばかりに|だけ あって】、 子供(こども)は いくつに なっても 子供(こども)だ。=Đứng từ phía cha mẹ thì con bao nhiêu tuổi vẫn là con.\n>この 成績(せいせき)から すると、 合格(ごうかく)は 【難(むずか)しいかも しれない|もう 決(き)まった|終(お)わった|難(むずか)しく なかった】。=Xét từ thành tích này thì có lẽ khó đỗ.\n##42\n@〜から見ると・〜から見れば|nhìn từ ~ thì|N + から見ると / から見れば / から見て\nĐánh giá từ một góc nhìn, lập trường.\n>外国(がいこく)人(にん) 【から 見(み)ると|に 応(おう)じて|に 沿(そ)って|を もとに】、 日本(にほん)人(にん)の 働(はたら)き方(かた)は 不思議(ふしぎ)に 見(み)えるらしい。=Nhìn từ phía người nước ngoài, cách làm việc của người Nhật có vẻ lạ.\n>子供(こども)の 目(め) 【から 見(み)れば|からこそ|だけに|あまり】、 大人(おとな)の 世界(せかい)は 理解(りかい)しにくい。=Nhìn từ con mắt trẻ thơ, thế giới người lớn khó hiểu.\n>専門(せんもん)家(か)から 見(み)て、 この 計画(けいかく)は 【問題(もんだい)が 多(おお)い そうだ|問題(もんだい)を 見(み)た|問題(もんだい)に 見(み)せた|問題(もんだい)が 見(み)える 人(ひと)だ】。=Nhìn từ phía chuyên gia, nghe nói kế hoạch này nhiều vấn đề.\n##43\n@〜にしたら・〜にすれば|đứng ở vị trí của ~ thì|N (người) + にしたら / にすれば / にしてみれば\nSuy đoán cảm nghĩ của người khác khi đặt mình vào vị trí họ.\n>親(おや) 【に したら|からして|を めぐって|に 沿(そ)って】、 子供(こども)が 遠(とお)くへ 行(い)ってしまうのは 寂(さび)しいだろう。=Đứng ở vị trí cha mẹ thì con đi xa chắc buồn lắm.\n>学生(がくせい) 【に すれば|に 応(おう)じれば|に 基(もと)づけば|を もとに すれば】、 休(やす)みは 長(なが)い ほうが いいに 決(き)まっている。=Với học sinh thì kỳ nghỉ dài hơn đương nhiên là tốt.\n>彼(かれ)に してみれば、 ただの 冗談(じょうだん)の 【つもりだったのだろう|つもりに なろう|つもりに しなさい|つもりが ある】。=Với anh ấy thì chắc đó chỉ định là câu đùa.\n##44\n@〜どころか|đâu chỉ ~ mà còn; không những không ~ mà trái lại|thể thông thường / N + どころか\nPhủ định mạnh điều vừa nêu, đưa ra thực tế vượt xa hoặc trái ngược hẳn.\n>彼(かれ)は 漢字(かんじ) 【どころか|ばかりかで|だけに|からこそ】、 ひらがなも 書(か)けない。=Anh ấy đừng nói chữ Hán, hiragana cũng không viết được.\n>薬(くすり)を 飲(の)んだのに、 よく なる 【どころか|ばかりに|だけ あって|あまり】、 ますます 悪(わる)く なった。=Uống thuốc rồi mà không những không khỏi, còn nặng hơn.\n>忙(いそが)しくて、 旅行(りょこう)どころか、 【散歩(さんぽ)にも 行(い)けない|毎週(まいしゅう) 旅行(りょこう)している|旅行(りょこう)ばかり している|よく 出(で)かける】。=Bận đến mức đừng nói du lịch, đi dạo cũng không được.\n##45\n@〜どころではない|không phải lúc để ~|V-từ điển / N + どころではない\nHoàn cảnh không cho phép làm việc đó.\n>仕事(しごと)が 忙(いそが)しくて、 旅行(りょこう) 【どころでは ない|に すぎない|に 相違(そうい) ない|かねない】。=Công việc bận, không phải lúc đi du lịch.\n>試験(しけん)の 前(まえ)で、 遊(あそ)んでいる 【どころじゃ ない|どころか|ばかりだ|に すぎない】 よ。=Trước kỳ thi rồi, không phải lúc chơi đâu.\n>地震(じしん)で 家(いえ)が 壊(こわ)れ、 仕事(しごと) 【どころでは なかった|どころかだった|に すぎなかった|っこ なかった】。=Nhà sập vì động đất, không còn tâm trí đâu mà làm việc.\n", "fx": "##1\nご利用(りよう)の 【際(さい)は|以来(いらい)は|次第(しだい)は|あまりは】、 必(かなら)ず 会員(かいいん)証(しょう)を お持(も)ちください。=Khi sử dụng, xin nhất định mang theo thẻ hội viên.\n##2\n出発(しゅっぱつ) 【に 際(さい)して|に 沿(そ)って|に 応(おう)じて|を めぐって】、 もう 一(いち)度(ど)持(も)ち物(もの)を 確認(かくにん)してください。=Trước khi xuất phát, hãy kiểm tra đồ mang theo lần nữa.\n##3\n新年(しんねん)を 迎(むか)える 【に あたって|に ついて|に かけて|に 比(くら)べて】、 今年(ことし)の 目標(もくひょう)を 立(た)てた。=Nhân dịp đón năm mới, tôi đã đặt mục tiêu cho năm nay.\n##4\n映画(えいが)の 公開(こうかい) 【に 先立(さきだ)って|以来(いらい)|次第(しだい)|の 上(うえ)で】、 記者(きしゃ)会見(かいけん)が 行(おこな)われた。=Trước khi công chiếu phim, buổi họp báo đã được tổ chức.\n##5\n結婚(けっこん)して 【以来(いらい)|次第(しだい)|際(さい)|あまり】、 一(いち)度(ど)も 一人(ひとり)で 旅行(りょこう)した ことが ない。=Từ khi kết hôn, tôi chưa một lần đi du lịch một mình.\n##6\n会議(かいぎ)が 【終(お)わり次第(しだい)|終(お)わる 次第(しだい)|終(お)わって 次第(しだい)|終(お)わった 以来(いらい)】、 こちらから お電話(でんわ) いたします。=Ngay khi họp xong, tôi sẽ gọi điện cho anh.\n##7\n先生(せんせい)が 話(はな)し終(お)わるか 終(お)わらないか 【の うちに|の 上(うえ)で|の 際(さい)に|の あまり】、 彼(かれ)は 質問(しつもん)を 始(はじ)めた。=Thầy vừa nói chưa dứt thì anh ấy đã bắt đầu hỏi.\n##8\nさっきまで 晴(は)れていた 【かと 思(おも)うと|次第(しだい)|以来(いらい)|に 際(さい)して】、 急(きゅう)に 雪(ゆき)が 降(ふ)ってきた。=Vừa nãy còn nắng mà bỗng tuyết rơi.\n##9\n書類(しょるい)を よく 【読(よ)んだ 上(うえ)で|読(よ)む 次第(しだい)|読(よ)んで 以来(いらい)|読(よ)む あまり】、 サインしてください。=Sau khi đọc kỹ giấy tờ, hãy ký tên.\n##10\n自分(じぶん)で 働(はたら)いて 【はじめて|以来(いらい)|次第(しだい)|からこそ】、 お金(かね)の 大切(たいせつ)さが わかる。=Chỉ khi tự mình đi làm mới hiểu tiền quan trọng thế nào.\n##11\nその 土地(とち)の 利用(りよう) 【を めぐって|に 沿(そ)って|に 応(おう)じて|を もとに】、 二(ふた)つの 会社(かいしゃ)が 争(あらそ)っている。=Hai công ty đang tranh  すぐ 雨(あめ)が 降(ふ)ってくるし。=Thật. Vừa nắng xong đã mưa ngay.\nA:洗濯物(せんたくもの)、 外(そと)に 干(ほ)してきちゃった。=Tớ lỡ phơi đồ giặt ngoài trời rồi.\nB:じゃ、 昼休(ひるやす)みに 一(いち)度(ど) 帰(かえ)った ほうが いいよ。 午後(ごご)は もっと 降(ふ)るらしいから。=Vậy nghỉ trưa nên về một lần. Nghe nói chiều còn mưa nhiều hơn.\n?男(おとこ)の 人(ひと)は 女(おんな)の 人(ひと)に 何(なに)を すすめましたか。|昼休(ひるやす)みに 家(いえ)に 帰(かえ)る|傘(かさ)を 買(か)う|洗濯(せんたく)を やめる|午後(ごご)に 帰(かえ)る\n##9 Cân nhắc\nA:この プラン、 いかがでしょうか。=Gói này quý khách thấy thế nào ạ?\nB:いいと 思(おも)いますが、 家族(かぞく)と 相談(そうだん)した 上(うえ)で、 決(き)めたいんです。=Tôi nghĩ là được, nhưng tôi muốn bàn với gia đình rồi mới quyết.\nA:かしこまりました。 お申(もう)し込(こ)みは 今週(こんしゅう)中(ちゅう)でしたら、 割引(わりびき)に なります。=Vâng ạ. Nếu đăng ký trong tuần này thì được giảm giá.\nB:じゃ、 あさってまでに 返事(へんじ)を します。=Vậy tôi sẽ trả lời trước ngày kia.\n?男(おとこ)の 人(ひと)は どう して すぐに 決(き)めませんか。|家族(かぞく)と 相談(そうだん)したいから|値段(ねだん)が 高(たか)いから|プランが 気(き)に 入(はい)らないから|割引(わりびき)が ないから\n##10 Giờ mới hiểu\nA:一人暮(ひとりぐ)らし、 もう 慣(な)れた？=Sống một mình quen chưa?\nB:うん。でも、 自分(じぶん)で 料理(りょうり)を して はじめて、 母(はは)の 大変(たいへん)さが わかったよ。=Rồi. Nhưng tự nấu ăn rồi mới hiểu mẹ vất vả thế nào.\nA:お母(はは)さんに 伝(つた)えた？=Cậu nói với mẹ chưa?\nB:まだなんだ。 今度(こんど) 帰(かえ)ったら、 何(なに)か 作(つく)ってあげようと 思(おも)ってる。=Chưa. Lần tới về tớ định nấu gì đó cho mẹ.\n?男(おとこ)の 人(ひと)は 今度(こんど) 帰(かえ)ったら 何(なに)を する つもりですか。|母(はは)に 料理(りょうり)を 作(つく)る|母(はは)に 料理(りょうり)を 習(なら)う|一人暮(ひとりぐ)らしを やめる|母(はは)に 手紙(てがみ)を 書(か)く\n##11 Tranh cãi trong khu phố\nA:駅前(えきまえ)の 公園(こうえん)を なくす 計画(けいかく)を めぐって、 町(まち)で 議論(ぎろん)に なっている そうですね。=Nghe nói trong khu phố đang tranh luận quanh kế hoạch bỏ công viên trước ga.\nB:ええ。 駐車(ちゅうしゃ)場(じょう)を 作(つく)りたい 店(みせ)の 人(ひと)と、 反対(はんたい) する 住民(じゅうみん)で 意見(いけん)が 分(わ)かれていて。=Vâng. Ý kiến chia rẽ giữa chủ cửa hàng muốn làm bãi đỗ xe và người dân phản đối.\nA:山田(やまだ)さんは どちらですか。=Anh Yamada thì theo bên nào?\nB:子供(こども)の 遊(あそ)び場(ば)が なくなるので、 私(わたし)は 反対(はんたい)です。=Vì mất chỗ chơi của trẻ con nên tôi phản đối.\n?男(おとこ)の 人(ひと)は どう して 計画(けいかく)に 反対(はんたい) していますか。|子供(こども)が 遊(あそ)ぶ 場所(ばしょ)が なくなるから|駐車(ちゅうしゃ)場(じょう)が 高(たか)いから|店(みせ)が 増(ふ)えるから|駅(えき)が 遠(とお)く なるから\n##12 Tính lương\nA:この は 限(かぎ)りませんよ。=Đắt chưa chắc đã công hiệu đâu.\nA:じゃ、 どれを 選(えら)べば いいんですか。=Vậy nên chọn loại nào?\nB:症状(しょうじょう)に よって 違(ちが)いますから、 薬剤(やくざい)師(し)に 相談(そうだん)してください。=Tuỳ triệu chứng nên hãy hỏi dược sĩ.\n?男(おとこ)の 人(ひと)は 何(なに)を する ように 言(い)いましたか。|薬剤(やくざい)師(し)に 相談(そうだん)する|いちばん 高(たか)い 薬(くすり)を 買(か)う|いちばん 安(やす)い 薬(くすり)を 買(か)う|薬(くすり)を 飲(の)まない\n##25 So với tuổi\nA:山田(やまだ)さんの お父(ちち)さん、 おいくつですか。=Bố anh Yamada bao nhiêu tuổi?\nB:今年(ことし) 75です。=Năm nay 75.\nA:えっ、 年(ねん)の わりに 若(わか)く 見(み)えますね。=Hả, so với tuổi thì trông trẻ nhỉ.\nB:毎朝(まいあさ) 1時間(じかん) 歩(ある)いていますから。 食(た)べる 量(りょう)の わりに、 太(ふと)らないんですよ。=Vì sáng nào bố tôi cũng đi bộ 1 tiếng. Ăn nhiều mà không béo.\n?山田(やまだ)さんの お父(ちち)さんが 若(わか)く 見(み)えるのは どう してですか。|毎朝(まいあさ) 歩(ある)いているから|あまり 食(た)べないから|まだ 若(わか)いから|よく 寝(ね)ているから\n##26 Giả sử\nA:もし 1か月(げつ)休(やす)みが 取(と)れると したら、 何(なに)を したいですか。=Giả sử được nghỉ 1 tháng, anh muốn làm gì?\nB:自転(じてん)車(しゃ)で 日本(にほん)を 一(いち)周(しゅう) したいですね。=Tôi muốn đạp xe một vòng nước Nhật.\nA:お金(かね)は どのぐらい かかるんでしょう。=Tốn khoảng bao nhiêu tiền nhỉ?\nB:テントで 寝(ね)ると すれば、 20万(まん)円(えん)ぐらいで行(い)けると 思(おも)います。=Nếu ngủ lều thì tôi nghĩ khoảng 200 nghìn yên là đi được.\n?男(おとこ)の 人(ひと)は 旅行(りょこう)の とき、 どこで 寝(ね)る つもりですか。|テント|ホテル|友達(ともだち)の 家(いえ)|電車(でんしゃ)の 中(なか)\n##27 Phải thử mới biết\nA:この くつ、 インターネットで 買(か)おうかな。=Đôi giày này mua trên mạng nhỉ.\nB:はいてみない ことには、 サイズが 合(あ)うか どうか わからないよ。=Không đi thử thì không biết cỡ có vừa không.\nA:でも、 店(みせ)に 行(い)く 時間(じかん)が ないんだ。=Nhưng tớ không có thời gian ra cửa hàng.\nB:じゃ、 無料(むりょう)で 返品(へんぴん) できる 店(みせ)を 選(えら)んだら？=Vậy chọn cửa hàng cho trả hàng miễn phí xem?\n?女(おんな)の 人(ひと)は 何(なに)を すすめましたか。|返品(へんぴん)が 無料(むりょう)の 店(みせ)で 買(か)う|店(みせ)へ 行(い)っては いてみる|くつを 買(か)わない|大(おお)きい サイズを 買(か)う\n##28 Nói thẳng\nA:今日(きょう)は 仕事(しごと)の 話(はなし)は 抜(ぬ)きに して、 ゆっくり 飲(の)みましょう。=Hôm nay gạt chuyện công việc, uống thong thả đi.\nB:いいですね。でも、 一(ひと)つだけ 報告(ほうこく)が あるんです。=Hay đấy. Nhưng tôi có một việc cần báo.\nA:何(なん)ですか。=Việc gì thế?\nB:来月(らいげつ)、 結婚(けっこん)する ことに なりました。 冗談(じょうだん)抜(ぬ)きで、 本当(ほんとう)ですよ。=Tháng sau tôi kết hôn. Không đùa đâu, thật đấy.\n?女(おんな)の 人(ひと)は 何(なに)を 報告(ほうこく)しましたか。|来月(らいげつ) 結婚(けっこん)する こと|仕事(しごと)を やめる こと|引(ひ)っ越(こ)す こと|お酒(さけ)を やめる こと\n##29 Chừng nào còn\nA:おじいさん、 まだ 畑(はたけ)の 仕事(しごと)を しているんですか。=Ông vẫn còn làm ruộng ạ?\nB:ええ。 体(からだ)が 動(うご)く かぎり、 続(つづ)けたいと 言(い)っています。=Vâng. Ông nói chừng nào cơ thể còn cử động được thì muốn tiếp tục.\nA:お元気(げんき)ですね。=Ông khoẻ nhỉ.\nB:私(わたし)が 知(し)っている かぎり、 一(いち)度(ど)も 病気(びょうき)で 休(やす)んだ ことが ないんです。=Theo như tôi biết, ông chưa lần nào nghỉ vì ốm.\n?おじいさんに ついて 正(ただ)しいのは どれですか。|元気(げんき)で、 畑(はたけ)の 仕事(しごと)を 続(つづ)けている|病気(びょうき)で 休(やす)んでいる|畑(はたけ)の 仕事(しごと)を やめた|体(からだ)が 動(うご)かなく なった\n##30 Trừ khi\nA:この アパート、 ペットは 飼(か)えますか。=Căn hộ này có nuôi thú cưng được không?\nB:大家(おおや)さんの 許可(きょか)が ない かぎり、 だめなんです。=Trừ khi có sự cho phép của chủ nhà, không thì không được.\nA:小(ちい)さい 鳥(とり)でもですか。=Chim nhỏ cũng vậy à?\nB:ええ。 ただ、 魚(さかな)は 例外(れいがい)で、 許可(きょか)が なくても 飼(か)えます。=Vâng. Chỉ có cá là ngoại lệ, không cần cho phép cũng nuôi được.\n?許可(きょか)が なくても 飼(か)えるのは 何(なん)ですか。|魚(さかな)|小(ちい)さい 鳥(とり)|犬(いぬ)|何(なに)も 飼(か)えない\n##31 Từ chối khéo\nA:この 商品(しょうひん)、 もう 少(すこ)し 安(やす)く なりませんか。=Sản phẩm này có thể rẻ hơn chút không?\nB:申(もう)し訳(わけ) ございません。 これ 以上(いじょう)の お値引(ねび)きは いたしかねます。=Xin lỗi quý khách. Chúng tôi khó giảm giá thêm.\nA:じゃ、 配達(はいたつ)は 無料(むりょう)に してもらえますか。=Vậy miễn phí giao hàng được không?\nB:それでしたら、 できます。 明日(あした)の 午前(ごぜん)中(ちゅう)に お届(とど)けします。=Nếu vậy thì được ạ. Sáng mai chúng tôi giao.\n?店(みせ)の 人(ひと)が できると 言(い)った ことは 何(なん)ですか。|配達(はいたつ)を 無料(むりょう)に する こと|値段(ねだん)を 安(やす)く する こと|今日(きょう) 届(とど)ける こと|商品(しょうひん)を 変(か)える こと\n##32 Nguy cơ\nA:この 書類(しょるい)、 名前(なまえ)が 間違(まちが)っていますよ。=Giấy tờ này sai tên đấy.\nB:あ、 本当(ほんとう)だ。 この まま 出(だ)したら、 大(おお)きな 問題(もんだい)に なりかねませんね。=A, đúng thật. Cứ thế nộp thì có thể thành vấn đề lớn.\nA:ほかの ページも 確認(かくにん)した ほうが いいですよ。=Nên kiểm tra cả các trang khác.\nB:はい。 全部(ぜんぶ) 見直(みなお)してから、 午後(ごご)に 出(だ)します。=Vâng. Tôi xem lại hết rồi chiều nộp.\n?男(おとこ)の 人(ひと)は これから どう しますか。|全部(ぜんぶ) 見直(みなお)して、 午後(ごご)に 出(だ)す|すぐに 書類(しょるい)を 出(だ)す|書類(しょるい)を 作(つく)るのを やめる|名前(なまえ)だけ 直(なお)して出(だ)す\n##33 Khó tin\nA:田中(たなか)さんが 会社(かいしゃ)を やめるって、 聞(き)いた？=Cậu nghe chuyện anh Tanaka nghỉ việc chưa?\nB:えっ、 あんなに 仕事(しごと)が 好(す)きな 人(ひと)が？ 信(しん)じがたいな。=Hả, người thích công việc đến thế? Khó tin quá.\nA:家(いえ)の 店(みせ)を 継(つ)ぐ ことに したんだって。=Nghe nói anh ấy quyết định nối nghiệp cửa hàng nhà.\nB:そうか。 それなら、 理解(りかい) できるよ。=Thế à. Nếu vậy thì hiểu được.\n?田中(たなか)さんは どう して 会社(かいしゃ)を やめますか。|家(いえ)の 店(みせ)を 継(つ)ぐから|仕事(しごと)が 嫌(きら)いに なったから|病気(びょうき)に なったから|別(べつ)の 会社(かいしゃ)に 入(はい)るから\n##34 Không đời nào\nA:明日(あした)までに この 本(ほん)を 全部(ぜんぶ) 読(よ)むの？=Cậu đọc hết quyển này trước ngày mai à?\nB:300ページも あるんだよ。 一(いち)晩(ばん)で 読(よ)めっこ ないよ。=Tới 300 trang đấy. Một đêm không thể nào đọc hết.\nA:じゃ、 どう するの？=Vậy làm sao?\nB:大事(だいじ)な ところだけ 読(よ)んで、 あとは 友達(ともだち)に 聞(き)く ことに する。=Tớ đọc chỗ quan trọng thôi, còn lại hỏi bạn.\n?男(おとこ)の 人(ひと)は どう しますか。|大事(だいじ)な 部分(ぶぶん)だけ 読(よ)む|全部(ぜんぶ) 読(よ)む|読(よ)むのを やめる|友達(ともだち)に 全部(ぜんぶ) 読(よ)んでもらう\n##35 Có thể xảy ra\nA:大(おお)きい 地震(じしん)は、 いつ 起(お)こるか わかりませんね。=Động đất lớn không biết khi nào xảy ra nhỉ.\nB:ええ。 明日(あした) 起(お)こる ことも あり得(え)ますから、 準備(じゅんび)が 必要(ひつよう)です。=Vâng. Ngày mai cũng có thể xảy ra nên cần chuẩn bị.\nA:うちは 水(みず)しか 用意(ようい)していないんです。=Nhà tôi mới chuẩn bị mỗi nước.\nB:食(た)べ物(もの)と 薬(くすり)も 3日(みっか) 分(ぶん)は 置(お)いておいた ほうが いいですよ。=Đồ ăn và thuốc cũng nên để sẵn phần 3 ngày.\n?女(おんな)の 人(ひと)の 家(いえ)に まだ ない ものは 何(なん)ですか。|食(た)べ物(もの)と 薬(くすり)|水(みず)|水(みず)と 食(た)べ物(もの)|何(なに)も ない\n##36 Đành phải\nA:来週(らいしゅう)の 旅行(りょこう)、 どう する？ 台風(たいふう)が 来(く)るらしいよ。=Chuyến du lịch tuần sau tính sao? Nghe nói bão đến đấy.\nB:残念(ざんねん)だけど、 中止(ちゅうし)せざるを 得(え)ないね。=Tiếc nhưng đành phải huỷ thôi.\nA:ホテルの キャンセル料(りょう)は かかる？=Có mất phí huỷ khách sạn không?\nB:3日(みっか) 前(まえ)までなら 無料(むりょう)だから、 今日(きょう)中(ちゅう)に 電話(でんわ)するよ。=Trước 3 ngày thì miễn phí nên hôm nay tớ gọi luôn.\n?男(おとこ)の 人(ひと)は 今日(きょう)、 何(なに)を しますか。|ホテルに キャンセルの 電話(でんわ)を する|旅行(りょこう)に 出発(しゅっぱつ)する|キャンセル料(りょう)を 払(はら)う|台風(たいふう)の 情報(じょうほう)を 調(しら)べる\n##37 Không thể không\nA:今晩(こんばん)、 部長(ぶちょう)の 送別(そうべつ)会(かい)に 行(い)く？=Tối nay cậu đi tiệc chia tay trưởng phòng không?\nB:疲(つか)れているけど、 お世話(せわ)に なったから、 行(い)かない わけには いかないよ。=Mệt nhưng đư const addW=(w,r,m,l)=>W[w]||(W[w]={w,r,m,l,key:'w:'+w});
function parseRead(ls){const out=[];let rd;for(const ln of ls){
  if(ln==='##'){rd={text:'',qs:[]};out.push(rd);continue}
  if(ln[0]==='?'){const p=ln.slice(1).split('|');rd.qs.push({q:p[0],opts:p.slice(1)})}else rd.text+=(rd.text?'\n':'')+ln}
  return out}
(function load(){
  for(const [raw,lv] of [[RAW.k5,5],[RAW.k4,4],[RAW.k3,3],[RAW.k2,2]]) for(const ln of lines(raw)){

    K[c]={c,l:lv,hv,m,tip:tip||'',on:b.on,kun:b.kun,s:b.s,key:'k:'+c,
      words:(ws||'').split(';').filter(Boolean).map(x=>{const [w,r,mm]=x.split('=');return addW(w,r,mm,lv)})};
    ORD[lv].push(c);
  }
  let cur,day,pt,i=-1,sec;

  for(const ln of lines(RAW.v5)){if(ln[0]==='#'){cur={theme:ln.slice(1),items:[]};V5.push(cur);continue}cur.items.push(vw(ln))}
  for(const ln of lines(RAW.v5b)){if(ln[0]==='#'){i++;continue}const w=vw(ln);if(!V5[i].items.includes(w))V5[i].items.push(w)}
  for(const ln of lines(RAW.g5)){
    if(ln.startsWith('##')){day=+ln.slice(2);G5[day]=G5[day]||[];continue}
    if(ln[0]==='@'){const [t,m,s]=ln.slice(1).split('|');pt={t,m,s,ex:'',tip:'',x:[]};G5[day].push(pt);continue}
    if(ln[0]==='!'){pt.tip=ln.slice(1);continue}

      const raw=ln.slice(1,j).replace(/【([^】]+)】/,(_,s)=>{opts=s.split('|');return '\u0001'});
      const e={raw,opts,vi:ln.slice(j+1),g:pt,L:day,key:`g:${day}:${G5[day].length-1}:${pt.x.length}`};pt.x.push(e);GEX[e.key]=e;continue}
    pt.ex+=(pt.ex?' ':'')+ln;
  }

    const raw=ln.slice(0,j).replace(/【([^】]+)】/,(_,x)=>{opts=x.split('|');return '\u0001'});

  }

   for(const k in b){const r=parseRead(b[k])[0];if(k[0]==='L')RD[+k.slice(1)]=r;else RW[+k.slice(1)-1]=r}}

  }

}

const DK='かがきぎくぐけげこごさざしじすずせぜそぞただちぢつづてでとどはばひびふぶへべほぼ';
function mutR(r){
  const o=new Set(),end=r.endsWith('ます')?r.length-2:r.length;
  for(let i=0;i<end;i++){const c=r[i],A=r.slice(0,i),B=r.slice(i+1);
    if(c==='う'&&i>0) o.add(A+B);
    if('おこそとのほもよろごぞどぼょゅくすつふゆるぐず'.includes(c)&&r[i+1]!=='う') o.add(A+c+'う'+B);
    if(c==='っ') o.add(A+B);
    if(i>0&&'かきくけこさしすせそたちつてとぱぴぷぺぽ'.includes(c)&&r[i-1]!=='っ'&&r[i-1]!=='ん') o.add(A+'っ'+c+B);
    const k=DK.indexOf(c); if(k>=0) o.add(A+DK[k^1]+B);
    if(c==='ょ') o.add(A+'ゅ'+B); if(c==='ゅ') o.add(A+'ょ'+B);
  }
  o.delete(r); return shuf([...o]);
}
function mutK(w,l){
  const ks=[...w].map((c,i)=>K[c]?i:-1).filter(i=>i>=0),pool=ORD[5].concat(l<5?ORD[4]:[],l<4?ORD[3]:[],l<3?ORD[2]:[]),out=[];
  if(!ks.length) return out;
  for(let t=0;t<14;t++){const i=ks[rnd(ks.length)],c=pool[rnd(pool.length)];if(c!==w[i])out.push(w.slice(0,i)+c+w.slice(i+1))}
  return out;
}
function qWord(w,type){
  const pool=WL[w.l],hasK=/[一-龯]/.test(w.w)&&w.r;
  if(!type){const ts=['m','rm'];if(hasK)ts.push('r','r','o');type=ts[rnd(ts.length)]}
  const exp=`<b class="jp">${esc(w.w)}</b>${w.r?' ('+w.r+')':''}: ${esc(w.m)}`;
  let q=null;
  if(type==='r'&&hasK) q=Q('Cách đọc kanji',`Từ gạch chân đọc thế nào?<div class="qs jp"><u>${esc(w.w)}</u></div>`,w.r,mutR(w.r).concat(shuf(pool.filter(x=>x.r).map(x=>x.r))),exp,w.key);
  if(type==='o'&&hasK) q=Q('Chọn chữ kanji',`Từ <b class="jp">${w.r}</b> (${esc(w.m)}) viết bằng kanji thế nào?`,w.w,mutK(w.w,w.l),exp,w.key);
  if(type==='rm') q=Q('Từ vựng',`Từ nào có nghĩa là “${esc(w.m)}”?`,w.w,shuf(pool).filter(x=>x.m!==w.m).map(x=>x.w),exp,w.key);
  return q||Q('Từ vựng',`Từ này nghĩa là gì?<div class="qs jp">${wordHtml(w)}</div>`,w.m,shuf(pool).filter(x=>x.w!==w.w).map(x=>x.m),exp,w.key);
}
function qKanji(k,t){
  const pool=ORD[k.l].map(c=>K[c]),lab=x=>`${x.hv}: ${x.m}`,on=k.on.split('、');
  const exp=`<b class="jp">${k.c}</b> ${k.hv}: ${esc(k.m)}${k.on?' · On: '+k.on:''}${k.kun?' · Kun: '+k.kun:''}`;
  if(t==null) t=rnd(3);
  if(t===2&&k.words.length) return qWord(k.words[rnd(k.words.length)],'r');
  if(t===2&&on[0]){const q=Q('Âm On',`Âm On của chữ này?<div class="qs jp huge">${k.c}</div>`,on[0],shuf(pool).map(x=>x.on.split('、')[0]).filter(x=>!on.includes(x)),exp,k.key);if(q)return q}
  if(t===1) return Q('Kanji',`Chữ nào mang nghĩa “${esc(lab(k))}”?`,k.c,shuf(pool).filter(x=>x.hv!==k.hv).map(x=>x.c),exp,k.key);
  return Q('Kanji',`Âm Hán Việt và nghĩa của chữ này?<div class="qs jp huge">${k.c}</div>`,lab(k),shuf(pool).filter(x=>x!==k).map(lab),exp,k.key);
}
const exFull=(e,mark)=>ruby(e.raw).replace('\u0001',mark?`<mark>${ruby(e.opts[0])}</mark>`:ruby(e.opts[0]));
function qGram(e,type){
  const exp=`<span class="jp">${exFull(e,1)}</span><br>${esc(e.vi)}<br><small>${esc(e.g.t)}: ${esc(e.g.m)}</small>`;
  const ch=e.raw.replace('\u0001',e.opts[0]).split(' ').filter(Boolean);
  if((type==='s'||(!type&&rnd(3)===0))&&!e.raw.includes('「')&&ch.length>=5){
    const s=rnd(ch.length-4),four=ch.slice(s,s+4),star=1+rnd(2);
    if(new Set(four).size===4){
      const bl=[0,1,2,3].map(i=>`<span class="bl">${i===star?'★':''}</span>`).join(' ');
      const q=Q('Sắp xếp câu',`Xếp 4 cụm từ vào chỗ trống. Cụm nào nằm ở ô ★?<div class="qs jp">${ruby(ch.slice(0,s).join(' '))} ${bl} ${ruby(ch.slice(s+4).join(' '))}</div>`,four[star],four.filter((_,i)=>i!==star),exp,e.key);
      if(q){q.star=1;return q}
    }
  }
  return Q('Ngữ pháp',`Chọn đáp án đúng cho chỗ trống.<div class="qs jp">${ruby(e.raw).replace('\u0001','<span class="bl">　　</span>')}</div>`,e.opts[0],e.opts.slice(1),exp,e.key);
}
const qRead=rd=>rd.qs.map((x,i)=>Q('Đọc hiểu',`<div class="pass jp">${ruby(rd.text)}</div><div class="jp">${ruby(x.q)}</div>`,x.opts[0],x.opts.slice(1),'Đọc lại bài và tìm câu chứa thông tin được hỏi.',null));
function qFromKey(key){
  if(key[0]==='k') return K[key.slice(2)]&&qKanji(K[key.slice(2)]);
  if(key[0]==='w') return W[key.slice(2)]&&qWord(W[key.slice(2)]);
  return GEX[key]&&qGram(GEX[key]);
}
function balanced(it,n){
  const g=shuf(it.g).map(e=>qGram(e)),k=shuf(it.k).map(x=>qKanji(x)),w=shuf(it.w).map(x=>qWord(x));
  const ng=Math.ceil(n*.4),nk=Math.ceil(n*.25);
  const out=[...g.slice(0,ng),...k.slice(0,nk)];
  for(const q of [...w,...g.slice(ng),...k.slice(nk)]){if(out.length>=n)break;out.push(q)}
  return shuf(out.filter(Boolean));
}


function kSvg(c,o={}){
  const s=K[c].s,up=o.upto==null?s.length:o.upto;
  let h=`<svg viewBox="0 0 109 109" class="ksvg ${o.cls||''}" role="img" aria-label="${c}"><path class="kgrid" d="M54.5 2V107M2 54.5H107"/>`;
  s.forEach((d,i)=>{if(i<up)h+=`<path class="${o.hi&&i===up-1?'hi':''}${o.ghost?' ghost':''}" d="${d}"/>`});
  if(o.nums) s.forEach((d,i)=>{const m=d.match(/M\s*(-?[\d.]+)[,\s]\s*(-?[\d.]+)/);if(m)h+=`<text x="${Math.max(3,+m[1]-5)}" y="${Math.max(7,+m[2]-1)}">${i+1}</text>`});
  return h+'</svg>';
}
function animate(svg){
  const ps=[...svg.querySelectorAll('path:not(.kgrid)')];
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let t=0; ps.forEach(p=>{const L=p.getTotalLength(),dur=260+L*7;p.style.transition='none';p.style.strokeDasharray=L;p.style.strokeDashoffset=L;
    setTimeout(()=>{p.style.transition=`stroke-dashoffset ${dur}ms ease-in-out`;p.style.strokeDashoffset=0},t+=30);t+=dur+120});
}

    audio:[{t:s.raw,v:'n'}],raw:s.raw,vi:s.vi,bank:shuf(chunks(s.raw).map(c=>c.replace(/[。、？！…「」]/g,'')).filter(Boolean)),key:null};
}
const norm=s=>s.replace(/[\s　。、．，,.!?！？「」…]/g,'').replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-96));
function lev(a,b){const d=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return d[b.length]}
const KMAP={};
SENT.forEach(s=>s.raw.replace(/([一-龯々]+)\(([ぁ-ゖ]+)\)/g,(m,k,r)=>{KMAP[k]=KMAP[k]||r}));
Object.values(W).forEach(w=>{if(!w.r||!/[一-龯]/.test(w.w))return;const v=w.w.endsWith('ます')&&w.r.endsWith('ます'),k=v?w.w.slice(0,-2):w.w;KMAP[k]=KMAP[k]||(v?w.r.slice(0,-2):w.r)});
const KKEYS=Object.keys(KMAP).sort((x,y)=>y.length-x.length);
for(let i=SENT.length-1;i>=0;i--)if(strip(SENT[i].raw).replace(/ /g,'').length>42)SENT.splice(i,1);
const toKana=s=>{KKEYS.forEach(k=>{if(s.includes(k))s=s.split(k).join(KMAP[k])});return s};
function dictOk(q,v){
  if(!norm(v))return false;const sim=(x,t)=>{x=norm(x);t=norm(t);return 1-lev(x,t)/Math.max(x.length,t.length)};
  return Math.max(sim(v,strip(q.raw)),sim(v,kana(q.raw)),sim(toKana(v),kana(q.raw)))>=.88;
}
function qCloze(L){
  const k=KW[L]; if(!k) return null; const parts=[];
  k.lines.forEach((l,li)=>{parts.push((li?'\n':'')+l.s+'：');chunks(l.jp).forEach(c=>{const m=c.match(/^(「*)(.*?)([。、？！」…]*)$/);parts.push({pre:m[1],core:m[2],post:m[3]})})});
  const idx=shuf(parts.map((p,i)=>typeof p==='object'&&p.core?i:-1).filter(i=>i>=0)).slice(0,5),sol=[],out=[];
  parts.forEach((p,i)=>{if(typeof p==='string')out.push(p);else if(idx.includes(i)){out.push(p.pre,{b:sol.length},p.post);sol.push(p.core)}else out.push(p.pre+p.core+p.post)});
  const extra=shuf(Object.keys(KW).filter(x=>+x!==+L)).slice(0,3).map(x=>{const cs=chunks(KW[x].lines[1].jp);return cs[rnd(cs.length)].replace(/[「」。、？！…]/g,'')}).filter(c=>c&&!sol.includes(c)).slice(0,2);
  return {kind:'cloze',tag:'Đục lỗ hội thoại',html:'Bấm các ô chữ để điền lần lượt vào chỗ trống. Bấm vào ô đã điền để gỡ ra.',parts:out,sol,bank:shuf(sol.concat(extra)),
    exp:k.lines.map(l=>`${l.s}：<span class="jp">${ruby(l.jp)}</span>`).join('<br>'),key:null};
}
const fK=k=>({kind:'flash',tag:'Thẻ kanji',front:`<div class="jp huge">${k.c}</div>`,back:`<p><b class="hv">${k.hv}</b> ${esc(k.m)}</p><p class="jp">On: ${k.on||'—'} · Kun: ${k.kun.replace(/\./g,'·')||'—'}</p>${k.tip?`<p class="tip">${esc(k.tip)}</p>`:''}<p class="jp">${k.words.map(w=>`${wordHtml(w)} <small>${esc(w.m)}</small>`).join('　')}</p>`,key:k.key});
const fW=w=>({kind:'flash',tag:'Thẻ từ vựng',front:`<div class="jp qs">${esc(w.w)}</div>`,back:`<p class="jp qs">${w.r||w.w}</p><p>${esc(w.m)}</p>`,key:w.key,say:w.r||w.w});

function lessonBefore(n){while(n>=1&&D(n).type!=='lesson')n--;return n}
function reviewQs(n,cnt){
  const days=uniq([1,2,4,7,14,30].map(o=>lessonBefore(n-o)).filter(x=>x>=1));
  const wr=shuf(Object.keys(P().wrong)).slice(0,4).map(qFromKey).filter(Boolean);
  return wr.concat(balanced(merge(days),cnt-wr.length));
}
const spokenAll=()=>EX.HP.map(x=>qSpoken(x,'h')).concat(EX.OP.map(x=>qSpoken(x,'o')));
const fresh=e=>{const q=qGram(e,'c');if(q)q.tag='Ngữ pháp · câu mới';return q};
function extras(Ls,nd,nl,ns){
  return [...shuf(SENT.filter(s=>Ls.includes(s.L))).slice(0,nd).map(qDict),...shuf(Ls.filter(L=>KW[L])).slice(0,nl).map(L=>qListen(L)),...shuf(spokenAll()).slice(0,ns)];
}
function buildSec(n,sec){
  const d=D(n),it=items(n),L=d.L+1;let qs=[];
  if(sec==='k'){it.k.forEach(k=>{qs.push(qKanji(k,0),qKanji(k,1));k.words.forEach(w=>qs.push(qWord(w,'r')));if(!k.words.length)qs.push(qKanji(k,2))});qs=shuf(qs)}
  else if(sec==='v') qs=shuf(d.vocab).map(w=>qWord(w));
  else if(sec==='g') it.g.forEach(e=>{qs.push(qGram(e,'c'));const s=qGram(e,'s');if(s&&s.star)qs.push(s)});
  else if(sec==='r') qs=reviewQs(n,10);
  else if(sec==='c') qs=[qListen(L),...shuf(SENT.filter(s=>s.L===L)).slice(0,3).map(qDict),qCloze(L)];
  else if(sec==='d') qs=qRead(d.read);
  else if(d.type==='lesson'&&!it.g.length&&!d.vocab.length){it.k.forEach(k=>{qs.push(qKanji(k,0),qKanji(k,1),qKanji(k,2))});qs=shuf(qs)}
  else if(d.type==='lesson') qs=balanced(it,10).concat(d.fx.map(fresh),shuf(SENT.filter(s=>s.L===L)).slice(0,1).map(qDict));
  else if(d.type==='free') qs=reviewQs(n,15);
  else if(d.type==='review'){
    const days=[];for(let i=n-5;i<n;i++)days.push(i);const Ls=days.map(x=>D(x).L+1),w=d.wi;
    qs=balanced(merge(days),16).concat(reviewQs(n-5,4),shuf(Ls.flatMap(x=>FX[x]||[])).slice(0,4).map(fresh),w>=0?shuf(EX.BP).slice(0,2).map(qBank):[],
      R5[w]?qRead(R5[w]):[],RW[w]?qRead(RW[w]):[],EX.WL.slice(w*2,w*2+2).map(qListenX),extras(Ls,2,0,w>=0?2:0));
  }
  else{const all=lessonDays(308),Ls=all.map(x=>D(x).L+1);
    qs=balanced(merge(shuf(all).slice(0,20)),16).concat(shuf(Ls.flatMap(x=>FX[x]||[])).slice(0,6).map(fresh),shuf(EX.BP).slice(0,4).map(qBank),
      shuf(Object.values(RD)).slice(0,1).flatMap(qRead),shuf(EX.WL).slice(0,2).map(qListenX),extras(Ls,2,2,3))}
  return qs.filter(Boolean);
}

function buildExam(no){
  let s=no>0?no*7919+13:Date.now()%1e6;const old=RNG;RNG=()=>(s=(s*1103515245+12345)&0x7fffffff)/0x7fffffff;
  const pt=(a,n)=>no>0?a.filter((_,i)=>i%2===no-1).concat(a.filter((_,i)=>i%2!==no-1)).slice(0,n):shuf(a).slice(0,n);
  const tg=(qs,t)=>qs.filter(Boolean).map(q=>(q.tag=t,q));
  const ix=no>0?no-1:rnd(2),X=EX.X,L=EX.L;
  const p1=[...tg(pt(X.slice(0,14),7).map(x=>qX(x,'r')),'もんだい1 · Cách đọc kanji'),...tg(pt(X.slice(14),5).map(x=>qX(x,'o')),'もんだい2 · Chọn chữ viết đúng'),
    ...tg(pt(EX.B,8).map(qBank),'もんだい3 · Điền từ theo ngữ cảnh'),...tg(pt(EX.P,4).map(qPara),'もんだい4 · Câu đồng nghĩa'),...tg(pt(EX.U,4).map(qU),'もんだい5 · Cách dùng từ')];
  const p2=[...tg(pt(EX.G,13).map(qG),'もんだい1 · Ngữ pháp'),...tg(pt(EX.T,4).map(qStar),'もんだい2 · Sắp xếp câu'),
    ...tg(qPass(EX.C[ix]),'もんだい3 · Ngữ pháp trong đoạn văn'),...tg(pt(EX.S,3).flatMap(qRead),'もんだい4 · Đọc đoạn ngắn'),
    ...tg(qRead(EX.M[ix]),'もんだい5 · Đọc đoạn vừa'),...tg(qRead(EX.I[ix]),'もんだい6 · Tìm thông tin')];
  const p3=[...tg(pt(L.slice(0,16),8).map(qListenX),'もんだい1 · Nghe hiểu nhiệm vụ'),...tg(pt(L.slice(16),7).map(qListenX),'もんだい2 · Nghe hiểu điểm chính'),
    ...tg(pt(EX.H,5).map(x=>qSpoken(x,'h')),'もんだい3 · Chọn câu nói phù hợp'),...tg(pt(EX.O,8).map(x=>qSpoken(x,'o')),'もんだい4 · Đáp lời nhanh')];
  RNG=old;
  return [{title:'Phần 1: Chữ và từ vựng',min:25,qs:p1},{title:'Phần 2: Ngữ pháp và đọc hiểu',min:55,qs:p2},{title:'Phần 3: Nghe hiểu',min:35,qs:p3}];
}
let EXS=null;
function startExam(no,cb){EXS={no,parts:buildExam(no),i:0,done:[],cb};examIntro()}

function examResult(){

  const lang=Math.round((c[0]+c[1])/(n[0]+n[1])*120),lis=Math.round(c[2]/n[2]*60),tot=lang+lis,pass=tot>=90&&lang>=38&&lis>=19,p=P();
  if(e.no)(p.exams=p.exams||{})[e.no]={d:today(),tot,lang,lis,pass};p.act[today()]=1;save();if(e.cb)e.cb(Math.round(tot/180*100));

  <div class="row"><button class="btn" data-act="qclose">Xong</button></div></div>`;
  $('#quiz').scrollTop=0;QZ={fin:true};EXS=null;
}

let QZ=null;
const clock=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
function stopAudio(){try{speechSynthesis.cancel()}catch(e){}}
function startQuiz(title,qs,opt={}){
  qs=qs.filter(Boolean);if(!qs.length){toast('Chưa có câu hỏi trong phạm vi đang chọn. Hãy thử đổi phạm vi sang toàn bộ N2.');return}
  if(QZ)clearInterval(QZ.timer);QZ={title,qs,i:0,ans:[],res:[],plays:{},opt,left:opt.limit||0,shown:false,flip:false};
  if(opt.limit) QZ.timer=setInterval(()=>{QZ.left--;const e=$('#qtime');if(e)e.textContent=clock(QZ.left);if(QZ.left<=0)finishQuiz()},1000);
  $('#quiz').classList.add('on');drawQ(true);
}
const isOnce=(z,q)=>!!(z.opt.exam||q.once);
function playQ(){
  const z=QZ,q=z.qs[z.i];if(!q.audio)return;const once=isOnce(z,q);
  if(once&&z.plays[z.i]&&!z.shown){toast('Câu này chỉ được nghe một lần.');return}
  z.plays[z.i]=(z.plays[z.i]||0)+1;speak(q.audio,once?1:0);if(once&&!z.shown)drawQ();
}
function drawQ(auto){
  const z=QZ,q=z.qs[z.i],show=z.shown,k=q.kind||'mc',a=z.ans[z.i];let body='',fb='';
  if(k==='mc') body=`<div class="opts">${q.opts.map((o,i)=>`<button class="opt jp${show&&i===q.a?' ok':''}${show&&i===a&&i!==q.a?' no':''}" data-act="pick" data-i="${i}" ${show?'disabled':''}><span class="on">${i+1}</span>${q.hide&&!show?'':ruby(o).replace('＜','<u>').replace('＞','</u>')}</button>`).join('')}</div>`;
  else if(k==='dict') body=`<input id="din" class="jp" value="${esc(a||'')}" placeholder="Câu bạn nghe được" autocomplete="off" autocapitalize="off" ${show?'disabled':''}>
    <div class="chipsb">${q.bank.map(c=>`<button class="chip jp" data-act="dchip" data-t="${esc(strip(c))}" ${show?'disabled':''}>${ruby(c)}</button>`).join('')}</div>
    ${show?'':'<div class="row"><button class="btn line sm" data-act="dclr">Xoá hết</button><button class="btn" data-act="dcheck">Kiểm tra</button></div>'}`;
  else if(k==='cloze'){const st=a||(z.ans[z.i]={f:[],u:[]});
    body=`<div class="pass jp">${q.parts.map(p=>typeof p==='string'?ruby(p):`<button class="bl czb${show?(st.f[p.b]===q.sol[p.b]?' ok':' no'):''}" data-act="czrm" data-b="${p.b}" ${show?'disabled':''}>${st.f[p.b]!=null?ruby(st.f[p.b]):p.b+1}</button>`).join(' ')}</div>
    <div class="chipsb">${q.bank.map((c,i)=>`<button class="chip jp" data-act="czadd" data-i="${i}" ${show||st.u.includes(i)?'disabled':''}>${ruby(c)}</button>`).join('')}</div>
    ${show?'':'<div class="row"><button class="btn" data-act="czcheck">Kiểm tra</button></div>'}`}
  else body=`<div class="flash">${q.front}${z.flip?`<div class="fback">${q.back}</div>`:''}</div>`+(z.flip?'<div class="row"><button class="btn line" data-act="fno">Chưa nhớ</button><button class="btn" data-act="fyes">Đã nhớ</button></div>':'<button class="btn wide" data-act="flip">Lật thẻ</button>');
  if(show){const ok=z.res[z.i];
    const more=k==='dict'?`<p>Đáp án: <span class="jp">${ruby(q.raw)}</span><br>${esc(q.vi)}</p>`:k==='cloze'?`<p>Đáp án: <span class="jp">${q.sol.map(ruby).join(' ／ ')}</span></p>`:q.exp?`<p>${q.exp}</p>`:'';
    fb=`<div class="fb ${ok?'good':'bad'}"><b>${ok?'◯ Đúng':'✕ Chưa đúng'}</b>${more}</div><button class="btn wide" data-act="qnext">${z.i+1<z.qs.length?'Câu tiếp theo':'Xem kết quả'}</button>`}
  $('#quiz').innerHTML=`<div class="qwrap"><header class="qhead"><button class="x" data-act="qclose" aria-label="Thoát">×</button><b>${esc(z.title)}</b><span>${z.opt.limit?`<span id="qtime">${clock(z.left)}</span> · `:''}${z.i+1}/${z.qs.length}</span></header>
  <div class="qbar"><i style="width:${z.i/z.qs.length*100}%"></i></div><p class="qtag">${q.tag}</p>${q.html?`<div class="qtext">${q.html}</div>`:''}
  ${q.audio?`<div class="row"><button class="btn line" data-act="qplay" ${isOnce(z,q)&&z.plays[z.i]&&!show?'disabled':''}>${SPK} ${isOnce(z,q)&&!show?(z.plays[z.i]?'Đã phát, không nghe lại được':'Bấm để nghe (chỉ một lần)'):'Nghe lại'}</button></div>`:''}${body}${fb}</div>`;
  if(auto){$('#quiz').scrollTop=0;if(q.audio&&!isOnce(z,q))playQ()}
}
function answer(val,ok){const z=QZ;z.ans[z.i]=val;z.res[z.i]=ok;stopAudio();if(z.opt.exam)nextQ();else{z.shown=true;drawQ()}}
function nextQ(){const z=QZ;z.shown=false;z.flip=false;stopAudio();if(++z.i>=z.qs.length)finishQuiz();else drawQ(true)}
function revItem(q,a){
  const k=q.kind||'mc',h=`<div class="rev"><p class="qtag">${q.tag}</p>`;
  if(k==='mc') return h+`<div class="qtext">${q.html}</div><p>Bạn chọn: <span class="jp no">${a==null?'(bỏ trống)':ruby(q.opts[a]).replace(/[＜＞]/g,'')}</span> · Đáp án: <span class="jp ok">${ruby(q.opts[q.a]).replace(/[＜＞]/g,'')}</span></p>${q.exp?`<p class="mute">${q.exp}</p>`:''}</div>`;
  if(k==='dict') return h+`<p>Bạn viết: <span class="jp no">${esc(a||'(bỏ trống)')}</span></p><p>Đáp án: <span class="jp ok">${ruby(q.raw)}</span><br><span class="mute">${esc(q.vi)}</span></p></div>`;
  if(k==='cloze') return h+`<p>Đáp án theo thứ tự ô: <span class="jp ok">${q.sol.map(ruby).join(' ／ ')}</span></p><p class="mute">${q.exp}</p></div>`;
  return h+q.front+q.back+'</div>';
}
function finishQuiz(){
  const z=QZ;clearInterval(z.timer);stopAudio();const p=P();let ok=0;
  z.qs.forEach((q,i)=>{const r=z.res[i]===true;if(r)ok++;
    if(q.key){if(r){if(p.wrong[q.key]&&--p.wrong[q.key]<=0)delete p.wrong[q.key]}else p.wrong[q.key]=(p.wrong[q.key]||0)+1}});
  p.act[today()]=1;save();
  if(z.opt.chain){z.opt.chain(z);return}
  const pct=Math.round(ok/z.qs.length*100);if(z.opt.done)z.opt.done(pct);
  const bad=z.qs.map((q,i)=>z.res[i]===true?'':revItem(q,z.ans[i])).join('');
  $('#quiz').innerHTML=`<div class="qwrap"><header class="qhead"><button class="x" data-act="qclose" aria-label="Đóng">×</button><b>${esc(z.title)}</b><span></span></header>
  <div class="result"><div class="stamp big ${pct>=60?'':'fail'}">${pct>=60?'合格':'再'}</div><h2>${ok}/${z.qs.length} câu đúng (${pct}%)</h2>
  <p>${pct>=80?'Rất tốt. Bạn đã nắm chắc phần này.':pct>=60?'Đạt. Xem lại các câu sai bên dưới trước khi học tiếp.':'Chưa đạt 60%. Đọc lại bài rồi làm lại nhé.'}</p></div>
  ${bad?'<h3>Câu cần xem lại</h3>'+bad:''}<div class="row"><button class="btn" data-act="qclose">Xong</button></div></div>`;
  $('#quiz').scrollTop=0;z.fin=true;
}
function closeQuiz(){if(QZ)clearInterval(QZ.timer);stopAudio();$('#quiz').classList.remove('on');$('#quiz').innerHTML='';QZ=null;EXS=null;render(true)}

const PR=[['kf','Thẻ kanji','Lật thẻ, tự chấm đã nhớ hay chưa. 20 thẻ mỗi lượt.'],['kq','Trắc nghiệm kanji','Âm Hán Việt, nghĩa, cách đọc. 15 câu.'],
 ['vf','Thẻ từ vựng','Nhìn từ, nhớ cách đọc và nghĩa. 20 thẻ mỗi lượt.'],['vq','Trắc nghiệm từ vựng','Nghĩa, cách đọc, chọn chữ kanji. 15 câu.'],
 ['g','Ngữ pháp','Điền chỗ trống và sắp xếp câu ★, có cả câu mới. 15 câu.'],['bk','Điền từ theo ngữ cảnh','Dạng もんだい3 của đề thật. 10 câu.'],
 ['rd','Đọc hiểu','Ba bài đọc trong các bài đã học.'],
 ['cz','Đục lỗ hội thoại','Điền các cụm bị che trong 5 đoạn hội thoại.'],['ls','Nghe hiểu hội thoại','Nghe 6 đoạn hội thoại của bài và trả lời.'],
 ['dc','Nghe chép chính tả','Nghe và chép lại 8 câu.'],['rp','Phản xạ hội thoại','Chọn câu nói và câu đáp phù hợp. 10 câu chỉ nghe.']];
function practice(m){
  const p=P(),days=lessonDays(p.scope==='all'?49:todayN()),Ls=days.map(n=>D(n).L+1),it=merge(days),S=(a,n)=>shuf(a).slice(0,n);
  const qs=m==='kf'?S(it.k,20).map(fK):m==='kq'?S(it.k,15).map(k=>qKanji(k)):m==='vf'?S(it.w,20).map(fW):m==='vq'?S(it.w,15).map(w=>qWord(w)):
    m==='g'?S(it.g,10).map(e=>qGram(e)).concat(S(Ls.flatMap(x=>FX[x]||[]),5).map(fresh)):m==='bk'?S(EX.BP,10).map(qBank):m==='rd'?S(Ls.filter(x=>RD[x]),3).flatMap(x=>qRead(RD[x])):m==='cz'?S(Ls,5).map(qCloze):
    m==='ls'?S(Ls,6).map(L=>qListen(L)):m==='dc'?S(SENT.filter(s=>Ls.includes(s.L)),8).map(qDict):S(spokenAll(),10);
  startQuiz(PR.find(x=>x[0]===m)[1],qs);
}

}

const sayBtn=t=>`<button class="say" data-act="say" data-t="${esc(t)}" aria-label="Nghe">${SPK}</button>`;
function kaiwa(d,n,x,qb){
  const k=d.kw,L=d.L+1;

  <ol class="guide"><li><b>Nghe trước, chưa nhìn chữ.</b> Bấm “Nghe cả đoạn” hai lần rồi làm bài luyện nghe bên dưới. Giọng nữ là A, giọng trầm là B.</li>
  <li><b>Đọc đuổi (shadowing).</b> Hiện lời thoại, bấm loa từng câu và nói theo ngay sau giọng đọc, bắt chước cả nhịp và ngữ điệu. Lặp lại 3 lần mỗi câu.</li>
  <li><b>Đóng vai.</b> Chọn vai A hoặc B. Máy đọc vai còn lại, đến lượt mình bạn chỉ thấy nghĩa tiếng Việt và phải tự nói bằng tiếng Nhật.</li>
  <li><b>Thay từ.</b> Giữ nguyên mẫu câu hôm nay${d.gram.length?` (<span class="jp">${d.gram.map(g=>esc(g.t)).join('、')}</span>)`:''}, thay bằng từ vựng của bài để nói về chính bạn. Đặt ít nhất 3 câu.</li>
  <li><b>Tự nói lại.</b> Che lời thoại, nói lại cả đoạn và ghi âm bằng điện thoại để nghe xem còn vấp ở đâu.</li></ol>
  <div class="row"><button class="btn line" data-act="kwall" data-l="${L}">${SPK} Nghe cả đoạn</button><button class="btn line" data-act="kwshow">Hiện / che lời thoại</button><button class="btn line" data-act="role" data-l="${L}" data-r="A">Đóng vai A</button><button class="btn line" data-act="role" data-l="${L}" data-r="B">Đóng vai B</button></div>

let RP=null;
function roleStep(){
  const k=KW[RP.L],ln=k.lines[RP.i],other=RP.r==='A'?'B':'A';
  if(!ln){openModal(`<h3>Hết đoạn hội thoại</h3><p>Thử đổi vai, rồi che lời thoại và tự nói lại cả đoạn.</p><div class="row"><button class="btn" data-act="role" data-l="${RP.L}" data-r="${other}">Đổi sang vai ${other}</button></div>`);return}
  const mine=ln.s===RP.r,head=`<h3>Đóng vai ${RP.r}</h3><p class="mute">Câu ${RP.i+1}/${k.lines.length}</p>`;
  openModal(head+(mine?`<p><b>Đến lượt bạn.</b> Nói câu này bằng tiếng Nhật:</p><p class="lead">${esc(ln.vi)}</p><p class="jp gxl" id="rpa" hidden>${ruby(ln.jp)}</p>
    <div class="row"><button class="btn line" data-act="rpshow">Hiện câu mẫu và nghe</button><button class="btn" data-act="rpnext">Câu tiếp</button></div>`
   :`<p>Vai ${ln.s} nói:</p><p class="jp gxl">${ruby(ln.jp)}</p><p class="mute">${esc(ln.vi)}</p><div class="row">${sayBtn(ln.jp)}<button class="btn" data-act="rpnext">Câu tiếp</button></div>`));
