y should be possible.\n?What has the client requested?|An earlier deadline|A lower price|A different designer|More photos\n?What does the man mean when he says, \"I still have to finish the drawings for the Hill Street project\"?|He may not have enough time.|He prefers the other project.|He has completed his work.|He needs a new computer.\n?What does the woman say she will do by noon?|Provide some photos|Call the client|Visit a site|Finish some drawings\n--\n@table|Training rooms on Tuesday|Room,Time,Seats|Room 1,9:00–11:00,12|Room 2,9:00–12:00,20|Room 3,1:00–3:00,20|Room 4,1:00–4:00,35\nA:I need to book a room for the customer service training on Tuesday. Eighteen people have signed up.\nB:Morning or afternoon?\nA:It has to be the afternoon. The trainer's flight doesn't land until eleven.\nB:OK. And how long is the session?\nA:Two hours. We don't need the largest room. Just one that fits everyone.\nB:Then this one is right. I'll reserve it and email the participants.\n?What kind of event is being planned?|A training session|A sales meeting|A job fair|A retirement party\n?Why must the event be held in the afternoon?|The trainer arrives late in the morning.|The rooms are busy in the morning.|The participants work in the morning.|Lunch will be served first.\n?Look at the graphic. Which room will the man reserve?|Room 3|Room 1|Room 2|Room 4 >> Buổi chiều, đủ chỗ cho 18 người, không phải phòng lớn nhất: Room 3.\n--\n@table|Mobile plans|Plan,Data,Monthly price|Basic,2 GB,15 dollars|Standard,10 GB,25 dollars|Plus,30 GB,35 dollars|Max,Unlimited,50 dollars\nA:Hi, I'd like to change my phone plan. I keep running out of data before the end of the month.\nB:Which plan are you on now?\nA:The one with ten gigabytes. I usually need about twice that much.\nB:Then I'd recommend the next one up. It gives you plenty of room. The unlimited plan would be more than you need.\nA:I agree. Can the change start today?\nB:Yes. I just need to see a photo ID.\n?Why does the woman want to change her plan?|She uses more data than her plan allows.|Her plan is too expensive.|She bought a new phone.|She is moving abroad.\n?Look at the graphic. How much will the woman pay each month?|35 dollars|15 dollars|25 dollars|50 dollars >> Cô đang dùng gói 10 GB và chuyển lên gói ngay trên: Plus, 35 đô la.\n?What does the man ask to see?|A photo ID|A recent bill|Her phone|A credit card\n[P4]\nN:Hello, this is a message for Ms. Angela Ross. This is Victor from Home Comfort Furniture. Your new sofa is ready for delivery. Our truck will be in your area on Wednesday between one and five P.M. Someone needs to be at home to sign for it. If Wednesday is not convenient, please call us at 555-0148 before six today, and we will arrange another day. Thank you.\n?Why is the speaker calling?|To arrange a delivery|To advertise a sale|To confirm a payment|To apologize for a mistake\n?What is required on the day of delivery?|Someone must be at home.|Payment must be made in cash.|The old sofa must be removed.|An ID must be shown.\n?What should the listener do if the day is not suitable?|Call back by six today|Visit the store|Send an email|Wait until Thursday\n--\nN:Good afternoon, shoppers, and welcome to Green Valley Market. Today we are celebrating our tenth anniversary. To thank you for your support, everything in our bakery section is half price until closing time. You can also enter our prize drawing for a chance to win a year of free groceries. Just fill out a card at the customer service desk near the main entrance. The winner will be announced on Saturday.\n?What is the store celebrating?|An anniversary|A new branch|A national holiday|The manager's birthday\n?What is discounted today?|Bakery items|Fresh fruit|Meat and fish|Everything in the store\n?How can listeners enter the drawing?|By completing a card|By spending fifty dollars|By visiting a website|By showing a receipt\n--\nN:This is the five o'clock traffic report. Drivers heading downtown should expect long delays on Highway 9, where an accident is blocking two lanes near the Park Street exit. Police say the road should be clear in about an hour. In the meantime, we suggest taking River Road instead. Also, remember that the Central Bridge will be closed this weekend for repairs. Stay tuned for the weather forecast, coming up after the break.\n?What is causing delays on Highway 9?|An accident|Road repairs|Bad weather|A parade\n?What does the speaker recommend?|Using a different road|Leaving later|Taking the train|Driving slowly\n?What will happen this weekend?|A bridge will be closed.|Highway 9 will be repaired.|A festival will be held.|River Road will be closed.\n--\nN:Before we finish, I want to talk about the customer survey. We sent it to two thousand customers last month, and so far only ninety have replied. Ninety. We can't make decisions based on that. So here's my plan. Starting Monday, every customer who completes the survey will receive a ten percent discount on their next order. I'd like the marketing team to prepare the email by Friday. And please keep it short. Nobody reads long emails.\n?What is the speaker mainly discussing?|A customer survey|A price increase|A new product|A staff schedule\n?What does the speaker imply when she says, \"Ninety\"?|The number of replies is too low.|The survey was a success.|The discount is too large.|The team is too small.\n?What will customers who complete the survey receive?|A discount|A free gift|A phone call|A longer survey\n--\nN:Welcome to the Sweet Valley Chocolate Factory. My name is Dana, and I'll be your guide. Our tour takes about forty minutes. First, we'll watch a short video about how chocolate is made. Then we'll walk through the production area. For safety reasons, you'll need to wear the hats and coats that I'm handing out now. Photography is not permitted inside. At the end of the tour, everyone will receive a free sample in our gift shop.\n?Where is the tour taking place?|At a factory|At a museum|At a farm|At a cooking school\n?According to the speaker, what will the group do first on the tour?|Watch a video|Visit the gift shop|Walk through the production area|Taste some chocolate\n?What will listeners receive at the end of the tour?|A free sample|A hat|A photograph|A discount coupon\n--\nN:Are you ready for a new career? Lakeside Business College offers evening and weekend courses in accounting, marketing, and computer programming. Our classes are small, our teachers are experienced professionals, and ninety percent of our graduates find a job within six months. Registration for the spring term ends on January twentieth. Visit our open house this Saturday from ten to two, meet our teachers, and get a free career consultation.\n?What is being advertised?|A college|A job agency|A software company|A bookstore\n?What does the speaker say about graduates?|Most of them find work quickly.|Many of them become teachers.|They pay no fees.|They study abroad.\n?What can listeners get at the open house?|A career consultation|A free course|A textbook|A job offer\n--\nN:Good evening, everyone. Tonight we honor our Employee of the Year. This person joined us eight years ago as a part-time driver and now manages our entire delivery network. Last year, she redesigned our routes, which cut fuel costs by twenty percent and reduced late deliveries by half. She also volunteers every month to train new drivers. Please join me in congratulating Ms. Fatima Noor. Fatima, come up and say a few words.\n?What is the purpose of the talk?|To present an award|To announce a retirement|To introduce a new employee|To report on fuel prices\n?What did Ms. Noor do last year?|She redesigned delivery routes.|She hired new drivers.|She bought new trucks.|She moved to a new office.\n?What will most likely happen next?|Ms. Noor will give a short speech.|Dinner will be served.|A video will be shown.|New drivers will be trained.\n--\nN:Thank you for calling City Water Services. Due to repair work on the main pipe, water service in the Riverside area will be interrupted tomorrow from nine A.M. until about three P.M. We recommend that residents fill some containers with water tonight. If you are calling to report a leak, press one. For questions about your bill, press two. To speak with a representative, please stay on the line. Calls are answered in the order received.\n?Why will the water be turned off?|A pipe is being repaired.|Some bills have not been paid.|A storm is expected.|A new system is being tested.\n?What are residents advised to do?|Store some water in advance|Call a plumber|Leave their homes|Boil their water\n?Why would a caller press two?|To ask about a bill|To report a leak|To speak to a representative|To hear the message again\n--\n@table|Science Museum: Today's shows|Show,Time,Place|Ocean life,10:30,Theater A|Journey to Mars,12:00,Theater B|The human body,1:30,Theater A|Robots at work,3:00,Theater B\nN:Welcome to the Science Museum. Here is some information about today's shows. Because of a technical problem in Theater B, the noon show has been canceled. We apologize to visitors who were hoping to see it. The afternoon show in that theater will go ahead as planned. Tickets for all shows are free, but seats are limited, so please pick up your ticket at the information desk at least fifteen minutes before the show.\n?Why has a show been canceled?|There is a technical problem.|The presenter is ill.|Too few visitors came.|It is a public holiday.\n?Look at the graphic. Which show has been canceled?|Journey to Mars|Ocean life|The human body|Robots at work >> Buổi chiếu lúc 12 giờ ở Theater B là Journey to Mars.\n?What are visitors asked to do?|Collect their tickets in advance|Pay at the door|Reserve seats online|Arrive an hour early\n--\n@table|Units sold by product|Product,March,April|Desk lamps,400,420|Office chairs,250,380|Bookshelves,300,290|Filing cabinets,150,155\nN:Let's look at April's sales. As you can see, most products stayed about the same as in March. One product, however, grew by more than fifty percent, and I think we all know why: the online advertisement we started on April first. I'd like to try the same kind of advertisement for the product whose sales fell slightly. Kevin, could you prepare a proposal and a budget by next Wednesday?\n?According to the speaker, what caused one product's sales to grow?|An online advertisement|A lower price|A new store|A holiday\n?Look at the graphic. Which product does the speaker want to advertise next?|Bookshelves|Desk lamps|Office chairs|Filing cabinets >> Sản phẩm duy nhất giảm nhẹ là Bookshelves (300 xuống 290).\n?What is Kevin asked to do?|Prepare a proposal|Contact some customers|Order more products|Design a website\n[P5]\nThe marketing team will present its 【proposal|propose|proposed|proposing】 to the board on Thursday. >> Sau \"its\" cần danh từ.\nMs. Alvarez has worked 【closely|close|closer|closeness】 with the design department on this project. >> Bổ nghĩa cho \"has worked\": trạng từ; \"work closely with\".\nAll employees are required to 【attend|attendance|attending|attended】 the safety training next week. >> \"Be required to\" + động từ nguyên mẫu.\nThe new software is 【compatible|comparable|compact|competitive】 with most operating systems. >> \"Compatible with\": tương thích với.\nOrders placed before noon are usually 【shipped|ship|shipping|ships】 on the same day. >> Bị động: are + V3.\nMr. Tanaka asked that the report 【be completed|is completed|completes|was completing】 by Friday. >> Sau \"asked that\" dùng nguyên mẫu; bị động là be + V3.\n【Although|Despite|However|Because of】 sales increased, profits remained flat. >> Sau chỗ trống là mệnh đề, hai vế ngược chiều: Although.\nThe conference has been postponed 【until|by|since|during】 further notice. >> Cụm cố định: until further notice.\nPlease submit your expense report 【by|until|among|at】 the end of the month. >> Hạn chót cho một việc làm một lần: by.\nCustomers who are not 【satisfied|satisfying|satisfaction|satisfy】 with their purchase may return it within thirty days. >> Người cảm thấy hài lòng: satisfied with.\nThe manager reminded the staff 【to lock|locking|lock|locked】 the doors before leaving. >> \"Remind + người + to V\".\nThe company is looking for a 【reliable|rely|reliably|reliability】 supplier of packaging materials. >> Trước danh từ \"supplier\" cần tính từ.\nMs. Kim prepared the entire presentation by 【herself|her|hers|she】. >> \"By + phản thân\": tự mình.\nNeither the manager 【nor|or|and|but】 her assistant was available to answer the call. >> Cặp \"neither … nor\".\nThe number of visitors to the museum 【has increased|have increased|increasing|were increased】 steadily this year. >> \"The number of…\" đi với động từ số ít.\n【Had|If|Should|Were】 we known about the delay, we would have chosen a different carrier. >> Đảo của điều kiện loại 3: Had + chủ ngữ + V3.\nThe hotel offers a wide 【range|rank|rate|role】 of services for business travelers. >> Cụm cố định: a wide range of.\nThe instructions were so 【confusing|confused|confuse|confusion】 that several customers called for help. >> Vật gây bối rối: V-ing.\nTickets can be purchased online or 【at|in|by|on】 the door on the day of the event. >> Cụm cố định: at the door.\nThe factory will be closed for one week 【due to|because|since|as】 scheduled maintenance. >> Sau chỗ trống là cụm danh từ: due to.\nEmployees 【who|which|whose|whom】 wish to work from home must first obtain approval. >> Người + động từ \"wish\": who.\nThe new policy will take 【effect|affect|effective|effectively】 on the first of July. >> Cụm cố định: take effect.\nPlease make sure the documents are 【thoroughly|thorough|thoroughness|more thorough】 reviewed before they are sent. >> Giữa \"are\" và V3: trạng từ.\nBy the time the director arrives, the team 【will have finished|finished|has finished|had finished】 setting up the room. >> \"By the time\" + hiện tại: will have + V3.\nThe store 【extended|expanded|exceeded|expected】 its opening hours during the holiday season. >> \"Extend hours\": kéo dài giờ mở cửa.\nMs. Reyes is 【highly|high|height|higher】 regarded by her colleagues. >> \"Highly regarded\": được đánh giá cao.\nApplicants must have at least three years of 【relevant|relevance|relevantly|relevancy】 experience. >> Trước danh từ \"experience\" cần tính từ.\nThe price includes delivery 【as well as|in addition|also|besides of】 installation. >> \"As well as\" + danh từ: cũng như.\nThe contract will be renewed 【unless|despite|whereas|during】 either side gives written notice. >> \"Trừ khi\" + mệnh đề.\nA 【substantial|subsequent|subjective|substitute】 discount is available for orders of more than one hundred units. >> \"A substantial discount\": mức giảm giá lớn.\n[P6]\nT:To: Mr. Alan Brooks. From: Business Today Magazine. Subject: Your subscription\nDear Mr. Brooks, your subscription to Business Today will __(1)__ on September 30. To continue receiving the magazine without interruption, please renew before that date. __(2)__ As a loyal reader, you are eligible for a special rate of 48 dollars for twelve issues, which is twenty percent __(3)__ than the regular price. To renew, simply visit our website or call our customer service team. We __(4)__ your continued support.\n?(1)|expire|expires|expired|expiring >> Sau \"will\" là động từ nguyên mẫu.\n?(2)|Renewing takes only a few minutes.|The magazine was founded in 1985.|Our office is closed on weekends.|Your payment was not received.\n?(3)|lower|low|lowest|lowly >> Có \"than\": so sánh hơn.\n?(4)|appreciate|appreciation|appreciative|appreciating >> Câu cần động từ chính ở hiện tại.\n--\nT:Notice to all tenants of Parkview Tower\nThe east elevator will be out of service on Tuesday, March 4, from 8 A.M. to 2 P.M. while technicians carry out its yearly inspection. __(1)__ this time, please use the west elevator or the stairs. __(2)__ Tenants who are expecting large deliveries on that day should arrange for them to arrive after 2 P.M. We apologize for any __(3)__ and thank you for your __(4)__.\n?(1)|During|While|Since|Until >> Trước cụm danh từ \"this time\": giới từ During.\n?(2)|We expect the west elevator to be busier than usual.|The building has twelve floors.|The inspection was completed last year.|Deliveries are never accepted.\n?(3)|inconvenience|inconvenient|inconveniently|inconvenienced >> Sau \"any\" cần danh từ.\n?(4)|patience|patient|patiently|patients >> Sau \"your\" cần danh từ: sự kiên nhẫn.\n--\nT:To: Sales department. From: Rita Gomez. Subject: New team member\nI am pleased to announce that Mr. Omar Farid will join our team on Monday as a senior sales representative. Mr. Farid __(1)__ in the electronics industry for more than twelve years, most recently at Nova Systems. He will be responsible __(2)__ our accounts in the southern region. __(3)__ Please stop by and introduce __(4)__ when you have a moment.\n?(1)|has worked|works|will work|is working >> \"For more than twelve years\" tính đến nay: hiện tại hoàn thành.\n?(2)|for|to|of|with >> Cụm cố định: responsible for.\n?(3)|His desk will be next to the meeting room on the second floor.|The southern region was closed last year.|Nova Systems makes furniture.|He will retire next month.\n?(4)|yourselves|you|your|yours >> Mọi người tự giới thiệu mình: phản thân.\n--\nT:Greenfield Public Library to reopen\nAfter six months of renovation, the Greenfield Public Library will reopen on Saturday, June 14. The building now has a larger children's section, forty new computers and a café. __(1)__ The reopening will be __(2)__ with a day of free events, including music, story reading and a tour of the new building. The mayor is expected __(3)__ a short speech at 10 A.M. Library hours will remain the same __(4)__ before: 9 A.M. to 8 P.M., Monday to Saturday.\n?(1)|It is also fully accessible to visitors in wheelchairs.|The library closed its café last year.|Books can no longer be borrowed.|Renovation will begin in June.\n?(2)|celebrated|celebrating|celebrate|celebration >> Bị động: will be + V3.\n?(3)|to give|giving|give|gave >> \"Be expected to V\".\n?(4)|as|than|like|so >> Cụm cố định: the same as.\n[P7]\nT:For rent: Office space downtown\nBright, furnished office on the sixth floor of the Carlton Building, 85 square meters. Suitable for a team of up to ten. Rent of 1,400 dollars per month includes electricity, internet and cleaning. Parking is available for an additional fee. Available from August 1. To arrange a visit, call Sandra Wells at 555-0176 between 9 A.M. and 5 P.M.\n?What is NOT included in the rent?|Parking|Internet|Electricity|Cleaning\n?How can people see the office?|By phoning Ms. Wells|By going to the sixth floor at any time|By sending an email|By attending an open house\n--\nT:Text message chain\nMaya Singh (8:41 A.M.): Hi, Leo. The projector in Room 3 isn't working, and my presentation starts at nine.\nLeo Braun (8:43 A.M.): Did you try the cable on the left side?\nMaya Singh (8:44 A.M.): Yes. Still nothing.\nLeo Braun (8:45 A.M.): Room 5 is free until ten. Its projector was checked yesterday.\nMaya Singh (8:46 A.M.): That works. I'll put a note on the door for the attendees.\n?What problem does Ms. Singh have?|Some equipment is not working.|She is late for a presentation.|A room is locked.|She has lost her notes.\n?At 8:46 A.M., what does Ms. Singh mean when she writes, \"That works\"?|She will use Room 5.|The projector has been fixed.|She will cancel the presentation.|The cable is working.\n--\nT:Annual company picnic\nAll employees and their families are invited to this year's company picnic on Saturday, July 19, at Lakeside Park, from 11 A.M. to 4 P.M. Lunch and drinks will be provided, and there will be games for children. A free bus will leave from the main office at 10:15 A.M. and return at 4:30 P.M. If you plan to attend, please tell Jenny in the personnel office how many people you will bring by July 10. In case of rain, the picnic will be held the following Saturday.\n?Who is invited to the picnic?|Employees and their families|Customers of the company|Managers only|Residents of Lakeside\n?What should employees do by July 10?|Inform the personnel office|Pay for their lunch|Reserve a bus seat online|Bring some games\n?What will happen if it rains?|The event will be held a week later.|The event will move indoors.|The event will be canceled.|The event will start later.\n--\nT:From: Hana Mori, Pacific Paper Supply. To: All customers. Subject: Price changes\nDear customers, because of rising transportation costs, we will increase the prices of our copy paper and envelopes by four percent on October 1. Prices of all other products will remain unchanged. Orders received before October 1 will be charged at the current prices, even if they are delivered later. We value your business and have attached our new price list. If you have any questions, please contact your sales representative.\n?Why are prices increasing?|Transportation costs have gone up.|Paper has become hard to find.|A new tax was introduced.|Wages have risen.\n?What is indicated about orders placed in September?|They will be charged the old prices.|They will be delivered free of charge.|They must be paid in cash.|They will be delayed.\n?What was sent with the email?|A price list|An invoice|A catalog|A contract\n--\nT:Swift Bikes: Rental information\nSwift Bikes has twelve stations around the city center. To rent a bicycle, download our app and scan the code on the bike. The first thirty minutes cost one dollar, and each additional thirty minutes costs two dollars. A day pass for unlimited rides of up to one hour each is available for eight dollars. Bicycles can be returned to any station. Helmets are not provided, so we recommend that you bring your own. Riders must be at least sixteen years old.\n?How do customers start a rental?|By using an app|By paying at a counter|By calling a station|By showing an ID card\n?How much does a one-hour ride cost without a day pass?|Three dollars|One dollar|Two dollars|Eight dollars >> 30 phút đầu 1 đô la, 30 phút tiếp theo 2 đô la.\n?What is suggested about helmets?|Riders should bring their own.|They are provided free.|They are sold at every station.|They are not needed.\n--\nT:Baxter Tools opens training center\nSpringfield. Baxter Tools, one of the region's largest employers, opened a new training center on Monday next to its main factory on Mill Road. The center, which cost three million dollars, has four classrooms and a workshop with the latest equipment.\nThe company plans to train two hundred new workers there each year. \"It has become difficult to find people with the skills we need,\" said the factory manager, Ms. Ellen Voss. \"So we decided to teach those skills ourselves.\" Trainees will be paid during the six-month program and will be offered a job if they complete it successfully.\nThe center will also offer evening classes to the public, starting in September.\n?What is the article mainly about?|A new training facility|The closing of a factory|A reduction in jobs|A new line of tools\n?Why did the company build the center?|Skilled workers are hard to find.|The old center was too small.|The government required it.|It wanted to sell equipment.\n?What is indicated about trainees?|They receive pay while they learn.|They must pay a fee.|They train for one year.|They work only in the evening.\n?What will happen in September?|Classes for the public will begin.|The factory will expand.|Ms. Voss will retire.|The first trainees will finish.\n--\nT:Letter from Crestview Bank\nDear Mr. Petrov, thank you for applying for a Crestview Bank business credit card. [1] I am pleased to inform you that your application has been approved, with a credit limit of 15,000 dollars.\nYour card will be mailed to your office address within seven business days. [2] For security reasons, the card must be activated before it can be used. You can do this by calling the number on the sticker on the front of the card. [3]\nYour first statement will be issued on the fifth of next month. There is no annual fee for the first year. [4] If you have any questions, please call our business service line at 555-0102.\nSincerely, Grace Lin, Business Accounts\n?What is the purpose of the letter?|To approve an application|To request some documents|To advertise a loan|To report a lost card\n?Where will the card be sent?|To Mr. Petrov's workplace|To Mr. Petrov's home|To a bank branch|To a post office box\n?What is indicated about the annual fee?|It is not charged in the first year.|It is 15,000 dollars.|It is paid every month.|It is never charged.\n?In which of the positions marked [1], [2], [3], and [4] does the following sentence best belong? \"After that, a fee of 45 dollars will apply.\"|[4]|[1]|[2]|[3] >> \"After that\" chỉ về \"the first year\" ở câu ngay trước vị trí [4].\n--\nT:MEMO. To: All department heads. From: Facilities office. Subject: Fire safety training\n|Department|Date|Time|Room\n|Sales and marketing|Monday, May 12|9:00–10:00 A.M.|Room 201\n|Accounting|Monday, May 12|2:00–3:00 P.M.|Room 201\n|Customer service|Tuesday, May 13|9:00–10:00 A.M.|Room 105\n|Warehouse|Tuesday, May 13|2:00–3:30 P.M.|Warehouse floor\nFire safety training is mandatory for all staff. Employees who cannot attend with their own department may join another department's session, but must inform the facilities office at least one day in advance. The warehouse session is longer because it includes practice with fire extinguishers. Attendance will be recorded.\n?What is the memo about?|Required safety training|A fire in the warehouse|New office equipment|A change of offices\n?When will the accounting staff be trained?|On Monday afternoon|On Monday morning|On Tuesday morning|On Tuesday afternoon\n?Why is one session longer than the others?|It includes hands-on practice.|It has more participants.|It starts later.|It includes a building tour.\n?What must employees do if they want to attend a different session?|Notify the facilities office beforehand|Ask their manager to switch|Sign up online|Pay a fee\n--\nT:Review: The Corner Table\nThe Corner Table opened on Bridge Street three months ago, and it is already hard to get a reservation. I went on a Tuesday evening and still waited twenty minutes for a table.\nThe wait was worth it. The menu is short, only six main dishes, but each one is prepared with care. My grilled fish was fresh and perfectly cooked, and the vegetable soup was the best I have had in years. Prices are reasonable: a main dish costs between twelve and eighteen dollars.\nThe service, however, was uneven. Our waiter was friendly but forgot our drinks twice. The owner, who was greeting guests at the door, told me that she is hiring more staff this month. If the service improves, The Corner Table could become the best restaurant in the neighborhood.\n?What is suggested about The Corner Table?|It is very popular.|It is expensive.|It has been open for years.|It is closed on Tuesdays.\n?What does the reviewer say about the menu?|It has few choices.|It changes every day.|It is mostly fish.|It is too long.\n?The word \"uneven\" in paragraph 3, line 1, is closest in meaning to|inconsistent|unfair|rough|slow >> Dịch vụ lúc tốt lúc không: không đồng đều.\n?What does the owner plan to do?|Employ additional workers|Open a second restaurant|Raise prices|Change the menu\n--\nT:Job opening: Front desk supervisor, Harbor Grand Hotel\nThe Harbor Grand Hotel is looking for a front desk supervisor to lead a team of eight. The successful candidate will have at least three years of hotel experience and excellent English. Knowledge of a second foreign language is preferred. The position requires working two weekends per month. We offer a competitive salary, free meals during shifts and a discount at all hotels in our group. Send your resume to Ms. Irene Costa, Personnel Manager, by April 30. Interviews will be held during the week of May 12.\nT:From: Lucas Meyer. To: Irene Costa. Subject: Front desk supervisor position\nDear Ms. Costa, I am writing to apply for the position of front desk supervisor. I have worked at the front desk of the Bayview Hotel for five years, the last two as assistant supervisor. In addition to English, I speak German and Japanese. I have attached my resume and a letter of recommendation from my current manager.\nI should mention that I will be attending a training course abroad from May 10 to May 16. Would it be possible to arrange an interview by video call that week, or in person the following week? Thank you for your consideration. Sincerely, Lucas Meyer\n?What is a requirement of the job?|Working on some weekends|Speaking three languages|Managing eight hotels|Living at the hotel\n?What benefit is mentioned in the advertisement?|Reduced prices at certain hotels|Free accommodation|A company car|Extra vacation days\n?What is suggested about Mr. Meyer?|He has more experience than the minimum required.|He has never supervised anyone.|He lives abroad.|He works at the Harbor Grand Hotel. >> Câu liên kết: quảng cáo yêu cầu ít nhất ba năm; ông đã làm năm năm.\n?What did Mr. Meyer send with his email?|A reference letter|A photograph|A language certificate|A training schedule\n?Why does Mr. Meyer ask about the interview arrangements?|He will be away during the planned interview week.|He works every weekend.|He has been ill.|He does not have a resume. >> Câu liên kết: phỏng vấn trong tuần 12 tháng 5; ông ở nước ngoài từ 10 đến 16 tháng 5.\n--\nT:Tech Forward Conference: Shuttle bus schedule from the Convention Center\n|Departs Convention Center|Plaza Hotel|Riverside Inn|Airport Hotel\n|5:30 P.M.|5:45|5:55|6:20\n|6:30 P.M.|6:45|6:55|7:20\n|8:00 P.M.|8:15|8:25|8:50\n|10:00 P.M.|10:15|10:25|no service\nThe shuttle is free for conference attendees wearing a badge. The 10:00 P.M. bus does not go to the Airport Hotel. Attendees staying there may take a taxi; the conference will reimburse fares of up to 25 dollars with a receipt.\nT:From: Priya Shah. To: Conference help desk. Subject: Shuttle after the closing dinner\nHello, I am staying at the Airport Hotel. I see that the closing dinner on Friday ends at 9:30 P.M., so I will miss the 8:00 bus. Is there any other way for me to get back to my hotel? Also, I lost my badge this afternoon. Can I get a replacement before tomorrow morning's first session? Thank you, Priya Shah\n?What is indicated about the shuttle?|Riders must wear a conference badge.|It costs 25 dollars.|It runs every hour.|It runs all night.\n?How long does the trip from the Convention Center to the Riverside Inn take?|Twenty-five minutes|Fifteen minutes|Fifty minutes|Forty-five minutes\n?How will Ms. Shah most likely return to her hotel after the closing dinner?|By taxi|On the 10:00 P.M. bus|On foot|On the 8:00 P.M. bus >> Câu liên kết: bữa tối kết thúc lúc 9:30; chuyến 10:00 không đến Airport Hotel, nên khách ở đó đi taxi.\n?What should Ms. Shah keep in order to get her money back?|A receipt|Her badge|A bus ticket|The schedule >> Câu liên kết: hội nghị hoàn tiền taxi khi có hoá đơn.\n?What does Ms. Shah ask for?|A new badge|A different hotel|A dinner ticket|A refund\n--\nT:The Garden Room at Maple Hall: Rental packages\n|Package|Guests|Price|Includes\n|Silver|Up to 40|600 dollars|Room for four hours, tables and chairs\n|Gold|Up to 80|1,000 dollars|Room for five hours, tables and chairs, sound system\n|Platinum|Up to 120|1,500 dollars|Room for six hours, tables and chairs, sound system, decorations\nCatering is not included but can be arranged through our partner, Fresh Table. A deposit of 20 percent is required to confirm a booking. Bookings on weekdays receive a 10 percent discount.\nT:From: Carla Ruiz. To: Maple Hall. Subject: Booking inquiry\nHello, I am organizing a retirement party for a colleague on Thursday, June 5, for about seventy guests. We will need a microphone and speakers for a few short speeches, but we will bring our own decorations. Could you tell me whether the room is available that evening and how much the deposit would be? Also, do you allow outside catering? My sister owns a restaurant. Thank you, Carla Ruiz\nT:From: Ben Ortiz, Maple Hall. To: Carla Ruiz. Subject: Re: Booking inquiry\nDear Ms. Ruiz, the Garden Room is available on June 5 from 5 P.M. Based on your needs, I recommend the package that includes the sound system but not the decorations. Because your event is on a weekday, the discount will apply.\nRegarding catering, outside caterers are welcome as long as they provide a copy of their food safety certificate at least one week before the event. To confirm your booking, please pay the deposit by May 15. Best regards, Ben Ortiz\n?What is NOT included in any of the packages?|Food|Tables|A sound system|Decorations\n?Which package does Mr. Ortiz recommend?|Gold|Silver|Platinum|None of them >> Câu liên kết: gói có hệ thống âm thanh nhưng không có trang trí, đủ cho 70 khách, là Gold.\n?How much will Ms. Ruiz most likely pay in total for the room?|900 dollars|1,000 dollars|600 dollars|1,350 dollars >> Câu liên kết: gói Gold 1.000 đô la, trừ 10% vì tổ chức vào ngày thường.\n?What must an outside caterer provide?|A safety certificate|A deposit|A sample menu|A list of staff\n?What should Ms. Ruiz do by May 15?|Pay a deposit|Send a guest list|Choose the decorations|Visit the hall\n--\nT:Product recall: Brightway electric kettle, model K20\nBrightway has found a fault in the power switch of K20 kettles sold between January and March of this year. In rare cases, the kettle may not switch off automatically. Customers should stop using the kettle immediately. Models K10 and K30 are not affected.\nCustomers may choose a full refund or a free replacement with the new K25 model. To make a claim, send us the serial number from the bottom of the kettle and a copy of your receipt. If you no longer have the receipt, a photo of the kettle is acceptable.\nT:From: Tomas Berg. To: Brightway Customer Care. Subject: Recall of kettle\nHello, I bought a Brightway kettle in February as a gift for my mother. I have just read your recall notice. The label on the bottom says K20, serial number 4471-B. Unfortunately, I threw the receipt away. My mother would rather have a new kettle than her money back. Please let me know what I should do next. She lives in another city, so the kettle should be sent to her address. Regards, Tomas Berg\nT:From: Nora Hill, Brightway Customer Care. To: Tomas Berg. Subject: Re: Recall of kettle\nDear Mr. Berg, thank you for contacting us, and we apologize for the inconvenience. I have checked the serial number, and your kettle is included in the recall. Since you do not have the proof of purchase that we normally ask for, please reply with the alternative described in our notice. As soon as we receive it, we will ship the replacement. Delivery usually takes five business days.\nPlease also send us the address where it should be delivered. You do not need to return the old kettle; please take it to a recycling center. Sincerely, Nora Hill\n?What is the problem with the K20 kettle?|It may fail to turn off.|It may leak water.|Its handle may break.|It is too noisy.\n?What is suggested about Mr. Berg's kettle?|It was sold during the affected period.|It is a K30 model.|It was bought last year.|It was a gift from his mother. >> Câu liên kết: ông mua tháng Hai; đợt thu hồi áp dụng cho K20 bán từ tháng Một đến tháng Ba.\n?What will Mr. Berg's mother most likely receive?|A K25 kettle|A refund|A repaired K20 kettle|A K10 kettle >> Câu liên kết: bà muốn đổi máy mới; thông báo ghi máy thay thế là mẫu K25.\n?What does Ms. Hill ask Mr. Berg to send?|A photo of the kettle|The old kettle|A copy of the receipt|The serial number >> Câu liên kết: \"phương án thay thế\" cho hoá đơn nêu trong thông báo là một bức ảnh của ấm.\n?What should be done with the old kettle?|It should be recycled.|It should be mailed back.|It should be kept.|It should be repaired.\n--\nT:City Life Magazine: Advertising rates\n|Size|One issue|Three issues (price per issue)|Six issues (price per issue)\n|Quarter page|300 dollars|270 dollars|240 dollars\n|Half page|500 dollars|450 dollars|400 dollars\n|Full page|900 dollars|810 dollars|720 dollars\nDeadline: Advertisements must be received by the tenth of the month before publication. Design service: Our designers can create your advertisement for a one-time fee of 80 dollars. First-time advertisers receive a free listing on our website for one month.\nT:From: Dan Howell, Howell's Bakery. To: Advertising department. Subject: Advertisement\nHello, I own a bakery that will open a second shop in May. I have never advertised with you before. I would like a half-page advertisement in the May, June and July issues. I do not have a design, so I would like to use your design service. Please send me an invoice and tell me when you need the text and photos. Thank you, Dan Howell\nT:From: Amy Lau, City Life Magazine. To: Dan Howell. Subject: Re: Advertisement\nDear Mr. Howell, thank you for choosing City Life. I have reserved a half page for you in the three issues you requested. For the May issue, we need your text and photos by the deadline shown on our rate sheet; our designer will then send you a draft within three days.\nI have attached an invoice. It includes the design fee, which is charged only once. As this is your first time with us, your bakery will also appear on our website throughout May at no charge. Best regards, Amy Lau\n?What is indicated about the design service?|Its fee is paid only once.|It is free for all advertisers.|It costs 80 dollars per issue.|It is not available for half-page advertisements.\n?How much will Mr. Howell pay for each advertisement, not including the design fee?|450 dollars|500 dollars|400 dollars|270 dollars >> Câu liên kết: nửa trang, đăng ba số: 450 đô la mỗi số.\n?By what date must Mr. Howell send his materials for the May issue?|April 10|May 10|April 30|May 1 >> Câu liên kết: hạn là ngày 10 của tháng trước tháng phát hành.\n?What will Mr. Howell receive at no cost?|A listing on a website|A full-page advertisement|Some photographs|An extra issue\n?What did Ms. Lau send with her email?|An invoice|A draft design|A rate sheet|A contract\n\n##F2|Đề thi thử số 2|200 câu, nội dung mới hoàn toàn\n>Đề đủ 200 câu theo đúng cấu trúc bài thi: 100 câu nghe trong 45 phút và 100 câu đọc trong 75 phút.\n[P1]\n🧑‍🍳🍞🔥|Một thợ làm bánh đang lấy khay bánh mì ra khỏi lò.|A baker is removing bread from an oven.|A baker is slicing a loaf of bread.|A customer is buying some bread.|Bread is being wrapped in paper.\n🚤🚤🏞️|Hai chiếc thuyền nhỏ buộc ở bờ hồ, không có người.|Some boats are tied up at the shore.|People are rowing a boat.|A boat is being repaired.|Passengers are boarding a ferry.\n👩‍🔬🧪🥼|Một phụ nữ mặc áo khoác trắng đang rót chất lỏng vào một cái bình thuỷ tinh.|A woman is pouring liquid into a container.|A woman is washing her hands.|A woman is typing on a keyboard.|A woman is putting on a lab coat.\n🧑‍🎨🖌️🧱|Một người đàn ông đang dùng con lăn sơn một bức tường.|A man is painting a wall.|A man is hanging a picture.|A man is carrying a ladder.|A wall is being torn down.\n🧳🧳🛎️🚪|Mấy chiếc va li đặt cạnh quầy lễ tân khách sạn, không có ai.|Some luggage has been left near a desk.|A guest is checking in.|A porter is carrying suitcases.|Luggage is being loaded into a car.\n👨‍👩‍👧🗺️📍|Ba du khách đứng xem một tấm bản đồ lớn ở quảng trường.|Some people are looking at a map.|Some people are taking photographs.|A guide is speaking to a group.|A map is being folded.\n[P2]\nWho's going to pick up the clients from the airport?|Mr. Daniels offered to do it.|At four thirty.|Terminal two.\nWhere did you put the invoice from Atlas Supply?|It's in the blue folder on your desk.|About three hundred dollars.|By the end of the month.\nWhen does the warranty on this laptop expire?|At the end of next year.|It's still working.|From the electronics store.\nHow do I reset my password?|Click the link on the login page.|It was reset.|Eight characters.\nWould you rather meet on Tuesday or Wednesday?|Either day is fine with me.|Yes, I'd like to.|In the meeting room.\nWhy is the cafeteria closed today?|They're installing new equipment.|Until tomorrow.|On the first floor.\nHas the director signed the contract yet?|She's reviewing it now.|In her office.|It's a three-year contract.\nCan you recommend a good hotel near the convention center?|The Plaza is only a short walk away.|For three nights.|I recommended him.\nThis printer is making a strange noise.|Maybe it needs a new cartridge.|It prints in color.|Turn the volume up.\nWhat time does the last train leave?|I think it's eleven forty.|From platform two.|It leaves from here.\nYou've met our new accountant, haven't you?|Yes, we were introduced this morning.|I'll count them again.|In the accounting office.\nHow many people have signed up for the workshop?|More than we expected.|In Room 12.|Sign here, please.\nShould I order more paper for the copier?|We still have three boxes.|Double-sided, please.|On the order form.\nWhose turn is it to lock up tonight?|I believe it's mine.|At six o'clock.|The key is in the drawer.\nWhy don't you take the afternoon off?|I have too much to finish.|It was turned off.|In the afternoon.\nIs the presentation ready, or do you need more time?|Just another half hour.|It was very interesting.|At the front of the room.\nWhere should we take the visitors for lunch?|How about the seafood place by the river?|Around twelve thirty.|They enjoyed it.\nDid you hear that Ms. Ortiz is being transferred to Madrid?|Really? When is she leaving?|By bank transfer.|I heard it clearly.\nHow long has this position been open?|Since the beginning of March.|It's a full-time position.|About ten meters.\nCould I borrow your charger for a few minutes?|Sure, it's in my bag.|It's fully charged.|For a few days.\nWhat's the best way to get to the head office?|The subway is the fastest.|On the tenth floor.|It's the best office.\nAren't these the chairs we ordered?|No, ours were gray.|In order of size.|Have a seat.\nWho do you think will win the contract?|It's hard to say at this point.|He signed it last week.|In the conference room.\nWhen can I expect to receive the samples?|They were shipped this morning.|From the factory.|Yes, I expect so.\nDo you mind if I open the door?|Go ahead. It's warm in here.|It's the second door.|Yes, I opened it.\n[P3]\nA:Hello, I'd like to buy two tickets for the modern art exhibition.\nB:Certainly. That's eighteen dollars each. Are you a member of the museum?\nA:No, but I visit quite often. Is membership worth it?\nB:It's sixty dollars a year, and members get free entry to all exhibitions and ten percent off in the shop.\nA:That's a good deal. I'll sign up today, then.\nB:Great. Please fill out this form, and I'll print your card.\n?What does the woman want to do?|See an exhibition|Buy a painting|Join a guided tour|Return a ticket\n?What benefit of membership does the man mention?|A discount in the shop|Free parking|Guest passes|A monthly magazine\n?What does the man ask the woman to do?|Complete a form|Show her ID|Pay in cash|Come back tomorrow\n--\nA:Tony, we're almost out of toner for the third-floor printers.\nB:Already? I ordered ten cartridges just last month.\nA:The sales team has been printing brochures for the trade fair.\nB:I see. I'll place another order, but delivery takes four days.\nA:The trade fair is on Friday. Could we get some from the store downtown in the meantime?\nB:Good thinking. I'll go there at lunchtime and buy two.\n?What is the problem?|A supply is running low.|A printer is broken.|An order was lost.|The trade fair was canceled.\n?According to the woman, why did the problem happen?|The sales team printed a lot.|The wrong item was ordered.|The supplier was late.|A cartridge leaked.\n?What will the man do at lunchtime?|Go to a store|Call the supplier|Attend the trade fair|Repair a printer\n--\nA:Hi, I saw your advertisement for a free one-week trial. Is that still available?\nB:Yes, it is. The trial includes the gym and the pool, but not the group classes.\nA:That's fine. I mainly want to swim. What are your opening hours?\nB:We open at six in the morning and close at ten at night, except Sundays, when we close at six.\nA:Perfect. Can I start tomorrow?\nB:Of course. Just bring a photo ID, and we'll take your picture for the pass.\n?What is the woman interested in?|A trial membership|A job at the gym|Swimming lessons|A group class\n?What does the man say is excluded from the trial?|Group classes|The swimming pool|The gym|Sunday visits\n?What should the woman bring tomorrow?|A photo ID|A towel|A payment|A printed photograph\n--\nA:Victor, Jo, thanks for joining me. The client rejected our packaging design.\nB:What didn't they like, Helen?\nA:They said the box looks too plain. They want brighter colors.\nC:We could bring back the orange version we made in March.\nB:That's a good idea, Jo. They liked that one at the time, but it cost more to print.\nA:Cost is less of a problem now. Jo, could you send me that file today? I'll show it to the client tomorrow.\n?What are the speakers discussing?|A design that was turned down|A late delivery|A new client|A printing error\n?What does Jo suggest?|Using an earlier design|Lowering the price|Hiring a designer|Changing the printer\n?What will Helen do tomorrow?|Show a design to the client|Print some boxes|Send a file to Jo|Visit a factory\n--\nA:Hi, I'm calling about the author event on Saturday. Do I need a ticket?\nB:The event is free, but seats are limited, so we recommend reserving one.\nA:Then I'd like to reserve two seats, please. My name is Grace Wu.\nB:Done. The talk starts at three, and the author will sign books afterward.\nA:Wonderful. Can I bring my own copy, or do I have to buy one there?\nB:You're welcome to bring your own.\n?What is the woman calling about?|An event at a store|A book she ordered|A job opening|A late delivery\n?What does the man recommend?|Reserving a seat|Arriving at noon|Buying a ticket online|Reading the book first\n?What does the woman ask about?|Whether she may bring her own book|How much the book costs|Where she can park|Who the author is\n--\nA:Did you see the email about the training budget?\nB:I did. It's been cut by half. I was planning to send four people to the leadership course.\nA:The course is offered online as well, isn't it?\nB:Oh, you're right. And the online version is a third of the price.\nA:Then all four could still take part.\nB:I'll check the dates and talk to the team this afternoon.\n?What problem are the speakers discussing?|A reduced budget|A canceled course|A staff shortage|A late email\n?Why does the woman say, \"The course is offered online as well, isn't it\"?|To suggest a cheaper option|To complain about the course|To ask for a link|To refuse a request\n?What will the man do this afternoon?|Speak with his team|Cancel the course|Write to the director|Take the course himself\n--\nA:City Cabs, how can I help you?\nB:Hello, I think I left my umbrella in one of your taxis this morning. It's dark green with a wooden handle.\nA:Do you remember what time you took the taxi, and where you got out?\nB:Around eight fifteen, and I got out at the Carlton Building.\nA:Let me check with our drivers. Yes, one of them handed in an umbrella like that. You can collect it from our office until seven tonight.\nB:Great. I'll come by after work.\n?Why is the man calling?|He lost something.|He wants to book a taxi.|He wants to complain about a driver.|He wants to ask about fares.\n?What information does the woman ask for?|The time and place of his ride|His name and address|The number of the taxi|The price he paid\n?What will the man do after work?|Go to an office|Call a driver|Take a taxi home|Buy a new umbrella\n--\nA:Mr. Novak, everything is ready for your seminar tomorrow. The room is set up for fifty people.\nB:Thank you. Actually, sixty-five have now confirmed. Is that a problem?\nA:The room can hold up to eighty, so we'll just add more chairs. What about coffee breaks?\nB:One in the morning and one in the afternoon, please.\nA:Certainly. And would you like a microphone?\nB:Yes, a wireless one if possible. I like to walk around when I speak.\n?What are the speakers preparing for?|A seminar|A wedding|A hotel inspection|A job interview\n?What has changed?|The number of participants|The date of the event|The location of the room|The name of the speaker\n?What does the man request?|A wireless microphone|A larger room|A lunch buffet|A second projector\n--\nA:Bad news. Marco just called. The delivery van has broken down on the highway.\nB:Oh no. How many orders are on it, Sofia?\nA:Twelve, and four of them were promised by noon.\nC:I can take my own car and collect the urgent ones.\nB:Thanks, Li. That would save us. I'll phone the other customers and explain the delay.\nA:And I'll call the repair service right away.\n?What problem is being discussed?|A vehicle has broken down.|Some orders were lost.|A driver is sick.|A highway is closed.\n?What does Li offer to do?|Pick up some orders|Repair the van|Call the customers|Rent a truck\n?What will the man do?|Contact some customers|Drive to the highway|Call a repair service|Cancel the orders\n--\nA:Hello, this is Emma Clark in apartment 9B. The heating in my living room isn't working.\nB:I'm sorry to hear that. When did it stop?\nA:Last night. It's quite cold in here now.\nB:I can send a technician tomorrow morning between nine and eleven. Will someone be home?\nA:I'll be at work, but I can leave my key with the neighbor in 9A.\nB:That's fine. I'll let the technician know.\n?What is the woman's problem?|Her heating is not working.|She has lost her key.|Her neighbor is noisy.|There is a water leak.\n?When will a technician come?|Tomorrow morning|Tonight|Tomorrow afternoon|Next week\n?What will the woman do?|Leave a key with a neighbor|Stay at home|Call the technician herself|Move to another apartment\n--\nA:Rachel, a few of us are going to try the new Thai restaurant at noon. Want to come?\nB:I'd love to, but my report is due at two.\nA:That's a pity. Should we bring something back for you?\nB:Would you? Anything with chicken would be great. Here, let me give you some money.\nA:Don't worry about it. You can pay next time.\n?What does the man invite the woman to do?|Have lunch|Attend a meeting|Review a report|Take a trip\n?What does the woman mean when she says, \"my report is due at two\"?|She cannot join them.|She needs help with the report.|Her report is finished.|She will arrive late.\n?What does the man offer to do?|Bring her some food|Finish her report|Lend her some money|Change the time\n--\n@table|City Garage parking rates|Time,Price|Up to 1 hour,3 dollars|1 to 3 hours,7 dollars|3 to 6 hours,12 dollars|All day,18 dollars\nA:Excuse me, I'm attending a seminar across the street. How much is parking here?\nB:It depends on how long you stay. Here are our rates.\nA:The seminar runs from nine to one, and I'll probably stay for lunch afterward, so about five hours in total.\nB:Then you'll pay this amount. You can pay by card at the machine when you leave.\nA:Thanks. Is the garage open late?\nB:Until midnight.\n?Why is the man in the area?|To attend a seminar|To go shopping|To see a doctor|To have a job interview\n?Look at the graphic. How much will the man most likely pay?|12 dollars|3 dollars|7 dollars|18 dollars >> Khoảng năm tiếng thuộc mức \"3 to 6 hours\": 12 đô la.\n?What does the woman say about payment?|It is made at a machine.|It must be in cash.|It is made in advance.|It is free for seminar guests.\n--\n@table|Office chairs|Model,Color,Price|Aria,Black,120 dollars|Bento,Gray,150 dollars|Corso,Black,190 dollars|Delta,Blue,210 dollars\nA:We need to order chairs for the new meeting room. Here's the catalog page.\nB:The director wants them all in black, to match the table.\nA:That leaves two models. What's our budget?\nB:A hundred and fifty dollars per chair at the most.\nA:Then it has to be this one. I'll order eight.\nB:Ask if they can deliver before the twentieth. The room opens that week.\n?What are the speakers ordering?|Chairs|Tables|Catalogs|Carpets\n?Look at the graphic. Which model will the speakers order?|Aria|Bento|Corso|Delta >> Màu đen và giá không quá 150 đô la: chỉ có Aria.\n?What does the man want to find out?|Whether delivery can be made by a certain date|Whether there is a discount|Whether other colors are available|Whether there is a warranty\n[P4]\nN:Hello, Ms. Bennett. This is Carl Jensen from Harper Consulting. Thank you for coming in for an interview last week. We were very impressed, and we would like to offer you the position of project coordinator. I'm emailing you the details of the offer today, including the salary and the starting date. Please read them and call me back by Friday to let us know your decision. My direct number is 555-0167.\n?Why is the speaker calling?|To offer a job|To schedule an interview|To ask for a reference|To decline an application\n?What will the speaker send today?|Details of an offer|A contract to sign|Some interview questions|Directions to the office\n?What is the listener asked to do by Friday?|Give her answer|Start work|Send her resume|Visit the office\n--\nN:Attention, passengers on Coastal Air flight 518 to Vancouver. Boarding will begin in ten minutes at gate 22. We will board passengers with small children first, followed by rows twenty to thirty-five. Because this flight is full, we are asking passengers with large carry-on bags to check them at the gate free of charge. Please have your boarding pass and passport ready.\n?What will happen in ten minutes?|Boarding will start.|The flight will depart.|The gate will change.|The plane will land.\n?Who will board first?|Passengers with small children|Business class passengers|Passengers in rows twenty to thirty-five|Passengers with large bags\n?Why are some passengers asked to check their bags?|The flight is full.|The bags are too heavy.|A fee must be paid.|Security rules have changed.\n--\nN:Do you want to learn a new language but can't find the time? Try LinguaGo, the app that fits into your day. Our lessons take only ten minutes, and you can practice speaking with real teachers by video. More than two million people have already joined. Download LinguaGo this month and get your first thirty days free. Search for LinguaGo in your app store today.\n?What is being advertised?|A language-learning app|A translation service|A language school|A travel agency\n?What feature does the speaker mention?|Speaking practice with teachers|Printed textbooks|Group classes in a classroom|Lessons without internet\n?What is offered this month?|A free trial period|A discount for groups|A free phone|A certificate\n--\nN:One more thing before we go. As you know, the parking lot behind the building will be closed for three weeks while it's repaved. The company has rented spaces in the City Garage on Elm Street, but there are only forty of them. We have ninety employees who drive. So I'd encourage you to share rides or take the bus during this period. Bus passes for those three weeks will be paid for by the company. Just see Monica in the personnel office.\n?What will happen to the parking lot?|It will be closed for repaving.|It will be sold.|It will be made larger.|It will become free.\n?What does the speaker imply when he says, \"We have ninety employees who drive\"?|There will not be enough parking spaces.|The company is very large.|Many employees arrive late.|The buses will be crowded.\n?What will the company pay for?|Bus passes|Taxi fares|Garage fees for everyone|Fuel\n--\nN:Good afternoon, and welcome to the Old Town walking tour. I'm Luis. Over the next ninety minutes, we'll visit the cathedral, the old market, and the city walls. The streets are made of stone and can be slippery, so please watch your step. We'll stop for fifteen minutes at the market, where you can buy drinks or souvenirs. If you get separated from the group, come back to this fountain, and I'll find you here at the end.\n?How long is the tour?|Ninety minutes|Fifteen minutes|Two hours|Sixty minutes\n?What does the speaker warn listeners about?|Slippery streets|Large crowds|Bad weather|High prices\n?What should listeners do if they get separated from the group?|Return to the fountain|Call the guide|Wait at the market|Go to the cathedral\n--\nN:In local news, the city's new Green Line subway opened to the public this morning, six months ahead of schedule. The line connects the airport with the central business district in just twenty minutes. To celebrate, rides on the Green Line are free until Sunday. City officials expect the line to carry eighty thousand passengers a day and to reduce traffic on the airport highway. Now, here's Jim with sports.\n?What is the news report about?|A new subway line|An airport expansion|Highway repairs|A new bus service\n?What is mentioned about the project?|It was finished early.|It went over budget.|It was delayed.|It was opposed by residents.\n?What will listeners hear next?|A sports report|A weather forecast|A traffic update|An advertisement\n--\nN:Thank you all for coming to this month's small business workshop. Our guest today is Ms. Dana Whitfield, who owns three successful flower shops. Ten years ago, she was selling flowers from a small table at the Saturday market. Today she'll explain how she used social media to grow her business without spending much money. After her talk, she'll answer your questions, so please write them on the cards on your tables. Ms. Whitfield, welcome.\n?Who is Ms. Whitfield?|A business owner|A customer of a flower shop|A marketing professor|The organizer of the workshop\n?What will Ms. Whitfield talk about?|Using social media to grow a business|Arranging flowers|Borrowing money from a bank|Opening a market\n?What are listeners asked to do?|Write down their questions|Turn off their phones|Fill out a survey|Buy some flowers\n--\nN:Thank you for calling Parker's Hardware. Please note that our store will have special hours next week because of the national holiday. We will be closed on Monday and will reopen on Tuesday at ten A.M., two hours later than usual. Our online store is open as always, and orders placed during the holiday will be shipped on Tuesday. For questions about an existing order, press three. Otherwise, please call back during business hours.\n?Why will the store's hours be different next week?|Because of a holiday|Because of renovations|Because of staff training|Because of bad weather\n?When will the store reopen?|On Tuesday at ten A.M.|On Monday at eight A.M.|On Tuesday at eight A.M.|On Wednesday at ten A.M.\n?Why would a caller press three?|To ask about an order|To speak to a manager|To hear the opening hours|To place a new order\n--\n@table|Saturday seminars|Time,Topic,Room|9:00,Reading financial reports,Room 1|10:30,Hiring your first employee,Room 2|1:00,Selling online,Room 1|2:30,Understanding taxes,Room 3\nN:Welcome to Small Business Day. Before the first seminar begins, I have one change to announce. The speaker for the seminar on taxes has asked to present earlier, so that seminar will switch places with the one on hiring. The rooms will also switch. Lunch will be served at noon in the main hall, and your name badge is your lunch ticket, so please keep it on.\n?What is the purpose of the announcement?|To explain a schedule change|To welcome a speaker|To describe the lunch menu|To cancel a seminar\n?Look at the graphic. In which room will the seminar on taxes now be held?|Room 2|Room 1|Room 3|The main hall >> Buổi về thuế đổi chỗ với buổi về tuyển dụng, kể cả phòng: Room 2.\n?What do listeners need in order to get lunch?|Their name badge|A paper ticket|Some cash|A coupon\n--\n@table|Harbor Cruises: Daily tours|Tour,Departure,Length,Price|Morning harbor tour,9:00,1 hour,15 dollars|Island visit,11:00,3 hours,40 dollars|Sunset cruise,6:00,2 hours,30 dollars|Night lights tour,8:30,1 hour,20 dollars\nN:Thank you for calling Harbor Cruises. All of our tours leave from Pier 4. Please note that because of strong winds, today's longest tour has been canceled. Customers who booked it may join any other tour today at no extra charge or receive a full refund. Tickets for our evening tours often sell out, so we recommend booking online. To speak to our staff, press one.\n?Why has a tour been canceled?|Because of strong winds|Because of boat repairs|Because of too few customers|Because of a holiday\n?Look at the graphic. Which tour has been canceled today?|Island visit|Morning harbor tour|Sunset cruise|Night lights tour >> Tour dài nhất là Island visit, 3 tiếng.\n?What does the speaker recommend?|Booking tickets online|Arriving early|Bringing a jacket|Calling back later\n[P5]\nThe 【renovation|renovate|renovated|renovating】 of the lobby will be completed by the end of June. >> Sau \"The\" và trước \"of\": danh từ.\nMs. Park is responsible for 【training|train|trained|trains】 all new customer service staff. >> Sau giới từ \"for\" là V-ing.\nThe seminar was 【extremely|extreme|extremity|extremes】 useful for new managers. >> Trước tính từ \"useful\": trạng từ.\nPlease keep your receipt 【in case|unless|so that|even】 you need to exchange the item. >> \"Phòng khi\" + mệnh đề: in case.\nThe company's profits rose 【significantly|significant|significance|signify】 in the last quarter. >> Bổ nghĩa cho \"rose\": trạng từ.\nEach of the participants 【was given|were given|giving|have given】 a certificate at the end of the course. >> \"Each of…\" đi với động từ số ít; bị động.\nThe manager, 【whose|who|which|that】 office is on the fifth floor, will meet you at noon. >> Sau chỗ trống là danh từ \"office\" thuộc về manager: whose.\nWe apologize 【for|to|about|with】 the delay in processing your order. >> \"Apologize for + việc gì\".\nThe new assistant is very 【capable|capably|capability|capacity】 and learns quickly. >> Sau \"is very\" cần tính từ.\nAll visitors must sign in 【upon|among|between|along】 arrival at the front desk. >> Cụm cố định: upon arrival.\nThe store will remain open 【throughout|across|among|beside】 the holiday period. >> \"Throughout + giai đoạn\": suốt.\nMr. Diaz 【has been working|is working|works|worked】 on the report since early this morning. >> \"Since…\" đến hiện tại: hiện tại hoàn thành (tiếp diễn).\nCustomers are advised 【to arrive|arriving|arrive|arrived】 at least thirty minutes before departure. >> \"Be advised to V\".\nThe survey results were more 【encouraging|encouraged|encourage|encouragement】 than the team had expected. >> Kết quả gây cảm giác khích lệ: V-ing.\nIf you 【had told|told|tell|have told】 me earlier, I would have reserved a larger room. >> Vế chính \"would have reserved\": vế if dùng had + V3.\nThe supplier agreed to lower the price 【provided that|even though|in spite of|as well as】 we order at least 500 units. >> Điều kiện \"miễn là\" + mệnh đề.\nThe marketing department is looking for someone with strong 【communication|communicate|communicative|communicated】 skills. >> Danh từ ghép: communication skills.\nPlease 【refrain|prevent|avoid|stop】 from using mobile phones during the performance. >> \"Refrain from + V-ing\". Avoid và stop không đi với \"from\" theo cách này.\nThe new system will 【enable|capable|possible|ability】 staff to share files more easily. >> Sau \"will\" cần động từ: enable + người + to V.\nSales of the new model have 【exceeded|excelled|expired|excluded】 our expectations. >> \"Exceed expectations\": vượt kỳ vọng.\nThe meeting has been moved to Thursday 【so that|because of|in order|despite】 everyone can attend. >> Mục đích + mệnh đề: so that.\nMs. Ito is one of the most 【experienced|experience|experiencing|experiences】 engineers in the company. >> Tính từ cố định: experienced.\nThe report must be submitted 【no later than|not late|no latest|not later】 5 P.M. on Friday. >> Cụm cố định: no later than.\n【Both|Neither|Either|Each】 of the proposals were approved by the committee. >> Động từ số nhiều \"were\": Both.\nThe technician explained the procedure 【clearly|clear|clarity|clearer】 to the new employees. >> Bổ nghĩa cho \"explained\": trạng từ.\nThe hotel is 【conveniently|convenient|convenience|conveniences】 located near the train station. >> Giữa \"is\" và V3 \"located\": trạng từ.\nMr. Lee will be out of the office 【until|by|within|since】 next Wednesday. >> Trạng thái kéo dài đến một mốc: until.\nThe price of raw materials has risen; 【consequently|otherwise|nevertheless|meanwhile】, we must increase our prices. >> Vế sau là hệ quả: consequently.\nAll staff are expected to 【comply|complete|compete|compose】 with the new safety rules. >> \"Comply with\": tuân thủ.\nThe contract may be canceled by 【either|both|few|several】 party with thirty days' notice. >> \"Either party\": một trong hai bên. Ba từ còn lại cần danh từ số nhiều.\n[P6]\nT:To: Ms. Laura Chen. From: Summit Dental Care. Subject: Your appointment\nDear Ms. Chen, this is to confirm your appointment with Dr. Patel on Thursday, April 17, at 3:30 P.M. Please arrive ten minutes early __(1)__ you can complete a short health form. __(2)__ If you need to cancel or reschedule, we ask that you __(3)__ us at least 24 hours in advance. Otherwise, a cancellation fee may be charged. We look forward to __(4)__ you.\n?(1)|so that|because of|in order|due to >> Mục đích + mệnh đề: so that.\n?(2)|Remember to bring your insurance card with you.|Dr. Patel studied in London.|The clinic was painted last month.|Your payment is overdue.\n?(3)|notify|notifies|notified|notifying >> Sau \"ask that + chủ ngữ\" là động từ nguyên mẫu.\n?(4)|seeing|see|saw|seen >> \"Look forward to\" + V-ing.\n--\nT:Notice to residents of Elm Street\nOn Sunday, May 4, Elm Street will be closed to traffic from 6 A.M. to 1 P.M. because of the city marathon. Cars parked on the street __(1)__ by 5 A.M.; otherwise, they will be towed at the owner's expense. __(2)__ Residents who need to drive that morning are advised to park on Oak Avenue the night before. We thank you for your __(3)__ and hope that you will come out to __(4)__ the runners.\n?(1)|must be moved|must move|must moving|have moved >> Xe phải được dời đi: bị động sau must.\n?(2)|Buses on route 14 will also follow a different route that day.|The marathon was first held in 1990.|Oak Avenue is being repaired.|Runners must wear numbers.\n?(3)|cooperation|cooperate|cooperative|cooperatively >> Sau \"your\" cần danh từ.\n?(4)|support|supports|supporting|supported >> Sau \"to\" là động từ nguyên mẫu.\n--\nT:Dear Mr. Okafor,\nCongratulations! Your name was selected from more than 3,000 customers who completed our annual survey. You have won a gift card __(1)__ 200 dollars, which can be used at any Greenway store. __(2)__ To receive your prize, simply bring this letter and a photo ID to the customer service desk of your nearest store __(3)__ June 30. We would like to thank you for taking the time to share your opinions. Your feedback helps us __(4)__ our service.\nSincerely, Paula Reyes, Greenway Stores\n?(1)|worth|cost|price|value >> \"A gift card worth 200 dollars\": trị giá.\n?(2)|It is valid for one year from the date of this letter.|The survey had ten questions.|Greenway sells garden tools.|Your order has been shipped.\n?(3)|by|until|during|since >> Hạn chót cho một việc làm một lần: by.\n?(4)|improve|improvement|improved|improving >> \"Help + người + động từ nguyên mẫu\".\n--\nT:Nova Home introduces the QuietClean 5\nNova Home announced today that its newest vacuum cleaner, the QuietClean 5, will go on sale on October 1. __(1)__ to the company, the new model is forty percent quieter than its previous one and uses a third less electricity. __(2)__ The QuietClean 5 will be __(3)__ in three colors and will cost 249 dollars. Customers who order before the launch date will receive a set of extra filters at no __(4)__ cost.\n?(1)|According|Accordingly|Accordance|Accorded >> \"According to\": theo.\n?(2)|It also has a battery that lasts ninety minutes.|The company was founded in Ohio.|Electricity prices have risen.|The old model was red.\n?(3)|available|availability|avail|availably >> Sau \"will be\" cần tính từ.\n?(4)|additional|addition|additionally|adding >> Trước danh từ \"cost\": tính từ; \"at no additional cost\".\n[P7]\nT:Fresh Brew Café: Coupon\nBuy any large coffee and get a pastry of your choice for half price. Valid Monday to Friday before 11 A.M. at our Main Street location only. One coupon per customer per visit. Cannot be combined with other offers. Expires March 31.\n?What does the coupon offer?|A reduced price on a pastry|A free large coffee|Half price on all coffee|A free pastry with any drink\n?What is true about the coupon?|It can be used at only one location.|It is valid on weekends.|It has no expiration date.|It can be used with other offers.\n--\nT:Text message chain\nOmar Haddad (2:05 P.M.): Lena, are you still at the print shop?\nLena Fischer (2:06 P.M.): Yes, just paying now. Why?\nOmar Haddad (2:07 P.M.): The client added two people to tomorrow's meeting. Can you get two more copies of the report?\nLena Fischer (2:08 P.M.): No problem. That makes twelve in total.\nOmar Haddad (2:09 P.M.): You're a lifesaver. See you back at the office.\n?Why did Mr. Haddad contact Ms. Fischer?|To ask for additional copies|To cancel a meeting|To ask about a payment|To invite her to a meeting\n?At 2:09 P.M., what does Mr. Haddad most likely mean when he writes, \"You're a lifesaver\"?|He is grateful for her help.|She works at a hospital.|He is in danger.|She saved the company money.\n--\nT:Notice: New recycling program\nStarting Monday, June 2, our office will take part in the city's recycling program. Blue bins for paper and green bins for plastic bottles and cans will be placed next to the printers on each floor. Food waste should continue to go in the kitchen bins. Please do not put coffee cups in the blue bins, as they cannot be recycled with paper. Our goal is to reduce the office's waste by thirty percent by the end of the year. Questions can be sent to Mark Dunn in the facilities office.\n?What is the purpose of the notice?|To introduce a recycling program|To announce new printers|To report that the kitchen is closing|To complain about waste\n?Where will the new bins be located?|Near the printers|In the kitchen|In the lobby|By the elevators\n?What are employees asked NOT to do?|Put coffee cups in the paper bins|Use the kitchen bins|Recycle cans|Contact Mr. Dunn\n--\nT:From: Julia Braga. To: Kenji Sato. Subject: Your visit on the 14th\nDear Mr. Sato, we are looking forward to your visit to our Lisbon office on the 14th. I have reserved a room for you at the Hotel Aurora, which is a five-minute walk from our building. A driver will meet you at the airport when your flight arrives at 4:40 P.M.; he will be holding a sign with your name.\nOn the 15th, we will begin with a tour of the factory at 9 A.M., followed by lunch with our director. The afternoon is free for our discussions about next year's contract. Please let me know if you have any dietary requirements. Best regards, Julia Braga\n?Why did Ms. Braga write the email?|To give details of a visit|To cancel a meeting|To request a contract|To book a flight\n?How will Mr. Sato get from the airport?|A driver will pick him up.|He will walk.|He will take a taxi.|Ms. Braga will drive him.\n?What does Ms. Braga ask Mr. Sato to tell her?|Whether he has special food needs|His flight number|His hotel preference|The price of the contract\n--\nT:Urban Outfit: Returns and exchanges\nItems bought in our stores or online may be returned within 30 days of purchase. To receive a refund, items must be unworn and have their original labels attached. Refunds are made to the original method of payment within five business days. Sale items can be exchanged for another size but cannot be refunded. Online purchases can be returned by mail or at any of our stores. If you return an item by mail, please note that the cost of postage is not refunded.\n?What is required for a refund?|The item must still have its labels.|The item must be returned by mail.|The item must have been bought online.|The item must be a sale item.\n?What is indicated about sale items?|They can only be exchanged.|They cannot be returned at all.|They are refunded within five days.|They are sold only online.\n?What is true about returns by mail?|The customer pays the postage.|They are not allowed.|They are refunded immediately.|They require a visit to a store.\n--\nT:Shared office space opens in old factory\nRiverton. A former shoe factory on Canal Street has been turned into the city's largest shared office space. The Workshop, which opened last week, offers 200 desks, twelve meeting rooms and a rooftop café to freelancers and small companies.\nMembers can rent a desk by the day, the week or the month. A monthly membership costs 180 dollars and includes internet, printing and free coffee. \"Many people are tired of working alone at home,\" said the founder, Mr. Anton Reyes. \"Here they can meet others and share ideas.\"\nMore than half of the desks have already been rented. Mr. Reyes plans to open a second location near the university next year.\n?What is the article about?|A new shared workspace|The closing of a factory|A new café|A university building\n?What is included in the monthly membership?|Printing|Parking|Lunch|A private office\n?According to Mr. Reyes, why do people join?|They do not want to work alone.|It is cheaper than working at home.|It is closer to their homes.|They need a place to meet clients.\n?What is suggested about The Workshop?|It has been popular since it opened.|It is losing money.|It is only for students.|It will close next year.\n--\nT:Letter from Hillside Property Management\nDear Ms. Tanaka, your lease for apartment 4C will end on August 31. [1] We would be pleased to have you stay with us for another year.\nIf you choose to renew, your monthly rent will increase from 950 to 980 dollars, beginning on September 1. [2] This is the first increase in three years and reflects higher maintenance costs.\nTo renew, please sign the enclosed form and return it to our office by July 15. [3] If we do not hear from you by that date, we will assume that you plan to move out and will begin showing the apartment to new tenants. [4] Please call our office at 555-0181 if you have any questions.\nSincerely, David Roth\n?Why did Mr. Roth write to Ms. Tanaka?|To offer a lease renewal|To report a repair|To ask her to move out|To request a late payment\n?How much more will Ms. Tanaka pay each month if she renews?|30 dollars|950 dollars|980 dollars|15 dollars\n?What was sent with the letter?|A form|A new key|A bill|A map\n?In which of the positions marked [1], [2], [3], and [4] does the following sentence best belong? \"You may also complete it on our website.\"|[3]|[1]|[2]|[4] >> \"It\" chỉ về \"the enclosed form\" ở câu ngay trước vị trí [3].\n--\nT:Delmar Engineering: Summer internship program\n|Step|Date|Details\n|Applications open|February 1|Apply through the company website\n|Application deadline|March 15|Late applications are not accepted\n|Interviews|April 7–11|Held by video call\n|Offers sent|April 25|By email\n|Program begins|June 16|Ten weeks, at the Denver office\nThe program is open to university students in their third or fourth year of an engineering degree. Interns receive a monthly payment and free housing near the office. At the end of the program, the best interns may be offered a full-time position after graduation.\n?How should students apply?|Online|By mail|In person|By phone\n?When will applicants find out whether they were chosen?|On April 25|On March 15|On April 7|On June 16\n?What is indicated about the interviews?|They are not held in person.|They take place in Denver.|They last one week each.|They are optional.\n?What do interns receive?|A place to live|A company car|University credit|A laptop\n--\nT:Five-minute tips: Better meetings\nMost employees say that they spend too much time in meetings. A few simple rules can help. First, send an agenda at least one day in advance, so that people can prepare. A meeting without an agenda often wanders from topic to topic.\nSecond, invite only the people who are needed. Research shows that meetings with more than eight participants rarely reach decisions. Third, start and finish on time, even if someone is late. Finally, end every meeting by stating who will do what, and by when. Send these action points to all participants on the same day.\nManagers who follow these rules report that their meetings are about a third shorter, and that more work gets done afterward.\n?What is the purpose of the article?|To give advice on holding meetings|To criticize managers|To announce a meeting|To sell a software product\n?The word \"wanders\" in paragraph 1, line 4, is closest in meaning to|drifts|walks|hurries|ends >> Cuộc họp \"trôi\" từ chủ đề này sang chủ đề khác.\n?What does the article say about large meetings?|They seldom produce decisions.|They finish early.|They are preferred by managers.|They need two agendas.\n?According to the article, what should happen at the end of a meeting?|Tasks should be assigned.|A vote should be taken.|The agenda should be written.|The next meeting should be scheduled.\n--\nT:Swift Movers: We carry the weight\n|Service|Price\n|Small move (studio or one-bedroom apartment)|300 dollars\n|Medium move (two- or three-bedroom home)|550 dollars\n|Large move (four bedrooms or more)|800 dollars\n|Packing service|150 dollars extra\nPrices include a truck, two movers and travel within the city. Moves outside the city cost an additional two dollars per kilometer. Book at least two weeks in advance and receive ten percent off. All moves are insured up to 5,000 dollars.\nT:From: Rita Vaughn. To: Swift Movers. Subject: Moving on June 28\nHello, I would like to book your service for Saturday, June 28. I am moving from a two-bedroom apartment on Park Lane to a house on Birch Road; both
