ì của câu hỏi: \"When did…?\" cần thời gian quá khứ, \"When will…?\" cần thời gian tương lai.\n[P1]\n👩‍🏫📊👥|Một phụ nữ đứng thuyết trình cạnh màn chiếu, vài người ngồi nghe.|A woman is giving a presentation.|A woman is handing out papers.|People are leaving the room.|A screen is being installed.\n👥🪑🗣️📝|Mấy người ngồi quanh bàn họp, một người đang ghi chép.|Some people are having a meeting.|Some people are eating lunch.|A man is cleaning the table.|The meeting room is empty.\n🎤👨‍💼|Một người đàn ông đứng trên bục nói vào micro.|A man is speaking into a microphone.|A man is adjusting a chair.|A man is sitting in the audience.|A man is carrying a speaker.\n[P2]\nWhen does the conference begin?|Next Thursday morning.|At the Grand Hotel.|About two hundred people.\nWhen will the agenda be ready?|By the end of the day.|On my desk.|It's very long.\nWhen did the meeting finish?|About ten minutes ago.|In the main office.|For two hours.\nWhen can we discuss the budget?|How about after lunch?|In the budget report.|Yes, we can.\nWhen is Mr. Vega's presentation?|It's been postponed until Friday.|About the new product.|In room 12.\nWhen are the participants arriving?|Not until tomorrow evening.|From the airport.|There are thirty of them.\n[P4]\nN:Good morning, everyone. Before we start, I have a short announcement. Today's sales meeting has been moved from room 4 to the conference room on the fifth floor, because room 4 is being painted. The meeting will still begin at ten o'clock. Please bring a copy of the agenda, which I emailed to you yesterday. After the meeting, lunch will be served in the cafeteria. Thank you.\n?What is the announcement mainly about?|A change of meeting room|A new sales manager|A canceled lunch|A painting class\n?Why was the room changed?|The room is being painted.|The room is too small.|The fifth floor is closed.|The meeting was canceled.\n?What are listeners asked to bring?|A copy of the agenda|Their lunch|A laptop|A sales report\n[P5]\nThe meeting was 【finally|final|finalize|finality】 held on Friday afternoon. >> Giữa \"was\" và động từ \"held\": trạng từ.\nPlease respond to this email 【promptly|prompt|promptness|prompted】. >> Bổ nghĩa cho động từ \"respond\", đứng cuối câu: trạng từ.\nMr. Kato 【regularly|regular|regularity|regulate】 travels to Osaka for conferences. >> Trước động từ thường, giữa chủ ngữ và động từ: trạng từ.\nThe new software is 【extremely|extreme|extremes|extremity】 easy to use. >> Trước tính từ \"easy\": trạng từ chỉ mức độ.\nAll participants arrived 【on time|at time|in the time|by time】 for the presentation. >> Cụm cố định: on time (đúng giờ).\nThe agenda has been 【slightly|slight|slighter|slightness】 changed. >> Giữa \"has been\" và V3: trạng từ.\nMs. Lin spoke 【clearly|clear|clarity|clearness】 during her presentation. >> Bổ nghĩa cho động từ \"spoke\": trạng từ.\nThe company has 【recently|recent|more recent|recency】 moved to a larger office. >> Giữa \"has\" và V3: trạng từ.\nSales rose 【sharply|sharp|sharpen|sharpness】 in the third quarter. >> Bổ nghĩa cho động từ \"rose\": trạng từ.\nThe conference room is 【fully|full|fullness|fill】 booked until Thursday. >> Trước tính từ dạng V-ed \"booked\": trạng từ.\n##B4|Sản phẩm và quảng cáo|Từ loại 4: động từ và cách chọn từ loại\n>Bài tổng hợp về từ loại: nhìn vào chỗ trống và quyết định trong năm giây nó cần danh từ, động từ, tính từ hay trạng từ.\n[V]Sản phẩm và tiếp thị\nproduct|sản phẩm|Our newest ＊ is a phone that folds in half.\nadvertise|quảng cáo (động từ)|We ＊ our shoes on television and online.\nadvertisement|mẩu quảng cáo|I saw an ＊ for the job in the newspaper.\nmarket|thị trường|There is a large ＊ for cheap phones in Asia.\nbrand|thương hiệu, nhãn hiệu|Which ＊ of coffee do you usually buy?\ncompete|cạnh tranh|Small shops cannot ＊ with large supermarkets on price.\ncompetition|sự cạnh tranh|There is strong ＊ between the two airlines.\nincrease|tăng|We want to ＊ sales by ten percent this year.\ndecrease|giảm|Prices usually ＊ after the holidays, so things get cheaper.\nsales|doanh số, việc bán hàng|＊ of ice cream are highest in summer.\nsurvey|cuộc khảo sát|In a ＊ of 500 customers, most said they liked the new design.\npromote|quảng bá; thăng chức|The singer is on TV to ＊ her new album.\n[G]\n@Động từ: chỗ trống cần động từ khi nào|Vị trí của động từ|Mỗi câu cần đúng một động từ chính đã chia · Sau chủ ngữ: The company sells… · Sau will, can, should, must, to: động từ nguyên mẫu · Sau be: V-ing (chủ động) hoặc V3 (bị động)\nNếu trong câu chưa có động từ nào được chia, chỗ trống chính là động từ. Sau đó mới xét thì và số ít, số nhiều.\n!Đuôi thường gặp của động từ: -ize, -ify, -ate, -en (organize, simplify, create, widen).\n>The company 【advertises|advertisement|advertising of|advertiser】 its products online.=Công ty quảng cáo sản phẩm trên mạng.\n>We will 【compete|competition|competitive|competitively】 with larger brands.=Chúng tôi sẽ cạnh tranh với các thương hiệu lớn hơn.\n>They plan to 【increase|increasing|increasingly|increased】 prices next month.=Họ dự định tăng giá vào tháng tới.\n@Bốn bước chọn từ loại|Quy trình cho câu hỏi từ loại|Trước danh từ: tính từ · Sau a / the / tính từ / giới từ: danh từ · Chưa có động từ chính: động từ · Câu đã đủ thành phần: trạng từ\nÁp dụng theo đúng thứ tự này cho mọi câu Part 5 có bốn lựa chọn cùng gốc từ. Bạn không cần hiểu hết nghĩa của câu.\n>The 【competition|compete|competitive|competitively】 in this market is strong.=Sự cạnh tranh ở thị trường này rất mạnh.\n>Our prices are very 【competitive|compete|competition|competitively】.=Giá của chúng tôi rất cạnh tranh.\n+The new advertisement was very 【effective|effect|effectively|effectiveness】.=Mẩu quảng cáo mới rất hiệu quả.\n+The survey results 【clearly|clear|clarity|clearness】 show that customers like the brand.=Kết quả khảo sát cho thấy rõ là khách hàng thích thương hiệu này.\n[N]\nPart 2, câu hỏi What và Which: phải nghe thêm danh từ đi ngay sau từ hỏi. \"What time\" hỏi giờ, \"What kind of\" hỏi loại, \"Which floor\" hỏi tầng. Với Which, câu trả lời đúng rất hay có \"the one\": \"The one on the left\".\n[P1]\n📺🛋️|Một chiếc ti vi đang bật đặt đối diện một cái ghế sofa trống.|A television is turned on.|A man is watching television.|A sofa is being delivered.|A television is on the floor.\n🛍️🏬🚶‍♀️|Một phụ nữ xách túi mua sắm đi ngang qua một cửa hàng có biển quảng cáo.|A woman is carrying shopping bags.|A woman is hanging a sign.|A woman is trying on shoes.|A woman is paying a cashier.\n📦🏷️|Những chiếc hộp sản phẩm có dán nhãn giá xếp trên kệ.|Some boxes are displayed on shelves.|A clerk is putting labels on boxes.|Some shelves are being built.|Customers are opening boxes.\n[P2]\nWhat kind of products does your company sell?|Mainly kitchen equipment.|In more than ten countries.|Yes, they sell well.\nWhich advertisement do you prefer?|The one with the blue background.|In the newspaper.|It was very expensive.\nWhat did the survey show?|Customers want lower prices.|About 500 people.|Last month.\nWhat's the price of this model?|It's on sale for ninety dollars.|It's the newest one.|At the store downtown.\nWhich brand sells the most?|I think it's Star Coffee.|In the supermarket.|Yes, it's very popular.\nWhat time does the sale start?|As soon as the store opens.|Twenty percent off.|On the second floor.\n[P5]\nThe company plans to 【advertise|advertisement|advertiser|advertising of】 the new product on television. >> Sau \"plans to\" cần động từ nguyên mẫu.\nOur 【competitors|compete|competitive|competitively】 have lowered their prices. >> Sau \"Our\" và làm chủ ngữ: danh từ chỉ người, số nhiều.\nThe marketing team 【conducted|conduct of|conducting|conductor】 a survey last month. >> Câu chưa có động từ chính; \"last month\" nên chia quá khứ.\nThis brand is very 【popular|popularity|popularly|popularize】 with young customers. >> Sau \"is very\" cần tính từ.\nSales have increased 【significantly|significant|significance|signify】 since January. >> Câu đã đủ thành phần, bổ nghĩa cho \"increased\": trạng từ.\nThe 【promotion|promote|promotional|promoted】 of the new model begins next week. >> Sau \"The\" và trước \"of\": danh từ.\nWe need a more 【creative|create|creation|creatively】 advertisement. >> Trước danh từ \"advertisement\": tính từ.\nThe new product will 【attract|attraction|attractive|attractively】 many customers. >> Sau \"will\" cần động từ nguyên mẫu.\nCustomer 【satisfaction|satisfy|satisfied|satisfactory】 is our first goal. >> Danh từ ghép làm chủ ngữ: customer satisfaction.\nThe price was 【unexpectedly|unexpected|expect|expectation】 low. >> Trước tính từ \"low\": trạng từ.\n[P7]\nT:Bright Home: Summer Sale\nFrom July 1 to July 15, all kitchen products at Bright Home are 25 percent off. Our most popular brand, Cookwell, is 40 percent off for the first three days only. Customers who spend more than 100 dollars will receive a free set of glasses. The sale is available in our stores, not online. Our store on King Street is open every day from 9 A.M. to 9 P.M.\n?What is being advertised?|A sale on kitchen products|A new restaurant|A cooking class|A furniture store opening\n?How long is the Cookwell discount available?|Three days|Fifteen days|One day|One month\n?What will customers get if they spend more than 100 dollars?|A set of glasses|A 40 percent discount|Free delivery|A Cookwell product\n?What is indicated about the sale?|It is not available online.|It ends on July 3.|It is only for new customers.|It includes furniture.\n##B5|Đồng nghiệp và nhân sự|Đại từ\n>Đại từ là dạng câu Part 5 dễ lấy điểm nhất nếu bạn thuộc một bảng năm cột. Bài này cũng luyện câu hỏi How.\n[V]Nhân sự\ncolleague|đồng nghiệp|A ＊ from my office helped me finish the report.\nsupervisor|người giám sát, cấp trên trực tiếp|If you have a problem, speak to your ＊ first.\nstaff|nhân viên (nói chung)|The hotel has a ＊ of fifty people.\nassistant|trợ lý|My ＊ answers the phone and arranges my meetings.\nteam|nhóm, đội|Our ＊ has six members, and we work on the same project.\ntrain|đào tạo|We ＊ all new employees for two weeks.\ntraining|khoá đào tạo|New staff receive ＊ in customer service.\nintroduce|giới thiệu|Let me ＊ you to our new manager, Ms. Diaz.\nin charge of|phụ trách|Mr. Lee is ＊ the sales department.\npromotion|sự thăng chức|After three years, she got a ＊ to senior manager.\nretire|nghỉ hưu|Most people ＊ at the age of sixty.\nbenefit|phúc lợi, quyền lợi|Free health insurance is a ＊ of working here.\n[G]\n@Bảng đại từ|Đại từ nhân xưng, sở hữu và phản thân|Chủ ngữ: I, you, he, she, it, we, they · Tân ngữ: me, you, him, her, it, us, them · Tính từ sở hữu (+ danh từ): my, your, his, her, its, our, their · Đại từ sở hữu (đứng một mình): mine, yours, his, hers, ours, theirs · Phản thân: myself, yourself, himself, herself, itself, ourselves, themselves\nCách chọn: trước động từ là chủ ngữ (he); sau động từ hoặc giới từ là tân ngữ (him); trước danh từ là tính từ sở hữu (his report); không có danh từ theo sau là đại từ sở hữu (The report is his); chủ ngữ và tân ngữ là cùng một người thì dùng phản thân (He introduced himself).\n!\"By + phản thân\" nghĩa là tự mình, một mình: She finished the report by herself. Đây là câu hỏi rất hay ra.\n>Please send 【me|I|my|mine】 the report.=Vui lòng gửi cho tôi bản báo cáo.\n>Ms. Diaz introduced 【her|she|hers|herself】 assistant to the team.=Cô Diaz giới thiệu trợ lý của mình với cả nhóm.\n>This desk is 【mine|my|me|I】.=Cái bàn này là của tôi.\n>He fixed the printer by 【himself|him|his|he】.=Anh ấy tự sửa máy in.\n>【They|Them|Their|Theirs】 work in the same department.=Họ làm cùng một phòng.\n+The supervisor asked 【us|we|our|ours】 to stay late.=Người giám sát yêu cầu chúng tôi ở lại muộn.\n+The staff finished the project by 【themselves|them|their|they】.=Các nhân viên tự mình hoàn thành dự án.\n[N]\nPart 2, câu hỏi How: nghe từ đi ngay sau How. \"How long\" hỏi khoảng thời gian (for two weeks), \"How often\" hỏi tần suất (twice a month), \"How many / How much\" hỏi số lượng hoặc giá, \"How far\" hỏi khoảng cách, còn \"How\" đứng một mình hỏi cách thức (by bus, by email) hoặc cảm nhận (It went well).\n[P1]\n👩‍💻👨‍💻|Hai đồng nghiệp ngồi cạnh nhau, cùng nhìn vào một màn hình máy tính.|They're looking at a monitor.|They're shaking hands.|They're moving a desk.|They're standing by a window.\n👨‍🏫👥📋|Một người đàn ông đứng hướng dẫn một nhóm nhân viên mới.|A man is speaking to a group.|A man is handing out uniforms.|A group is leaving a building.|A man is sitting alone at a desk.\n☕👩‍💼👨‍💼|Hai đồng nghiệp đứng uống cà phê trong phòng nghỉ.|They're holding cups.|They're washing some dishes.|They're making a presentation.|They're entering an elevator.\n[P2]\nHow long have you worked here?|For almost six years.|In the sales department.|By subway.\nHow often does the team meet?|Once a week, on Mondays.|In the conference room.|For about an hour.\nHow many people are on your staff?|There are twelve of us.|They're very helpful.|On the fourth floor.\nHow did the training go?|It was very useful.|For two weeks.|By my supervisor.\nHow do I contact the personnel office?|You can email them.|On the second floor.|Every morning.\nHow soon can you start?|I'm available from next Monday.|It was very soon.|At the main office.\n[P5]\nMr. Tan asked 【his|he|him|himself】 assistant to make the copies. >> Trước danh từ \"assistant\" cần tính từ sở hữu.\nThe supervisor gave 【them|they|their|theirs】 the new schedule. >> Sau động từ \"gave\" cần đại từ tân ngữ.\nMs. Ruiz prepared the whole presentation by 【herself|her|hers|she】. >> \"By + phản thân\": tự mình.\n【We|Us|Our|Ours】 are pleased to welcome you to the team. >> Trước động từ \"are\" cần đại từ chủ ngữ.\nThe company is proud of 【its|it|it's|itself】 employees. >> Trước danh từ \"employees\": tính từ sở hữu của \"the company\" là its.\nMy office is on the second floor, and 【hers|her|she|herself】 is on the third. >> Không có danh từ theo sau: đại từ sở hữu hers (= her office).\nPlease contact 【me|I|my|myself】 if you have any questions. >> Sau động từ \"contact\": tân ngữ.\nThe new employees introduced 【themselves|them|their|they】 at the meeting. >> Chủ ngữ và tân ngữ là cùng một nhóm người: phản thân.\nAll staff must bring 【their|they|them|theirs】 ID cards to work. >> Trước danh từ \"ID cards\": tính từ sở hữu.\nMs. Cho and 【I|me|my|mine】 will attend the training next week. >> Làm chủ ngữ cùng với \"Ms. Cho\": I.\n[P6]\nT:To: All staff. From: Personnel office. Subject: New team member\nI am pleased to announce that Ms. Hana Sato will join __(1)__ marketing team on Monday. Ms. Sato has ten years of experience in advertising, and she was recently in charge of a large project in Tokyo. __(2)__ She will work on the fifth floor, next to Mr. Reed. Please take a moment to introduce __(3)__ to her. A short welcome lunch will be held in the cafeteria at noon, and all staff are welcome to __(4)__.\n?(1)|our|we|us|ours >> Trước danh từ \"marketing team\" cần tính từ sở hữu.\n?(2)|We are very happy to have her with us.|The cafeteria is closed on Mondays.|Please send your resume by Friday.|The project was canceled last year.\n?(3)|yourselves|you|your|yours >> Mọi người tự giới thiệu mình: phản thân số nhiều.\n?(4)|attend|attends|attending|attended >> Sau \"are welcome to\" là động từ nguyên mẫu.\n\n##B6|Dự án và tiến độ|Thì hiện tại hoàn thành\n>Bạn dùng được have / has + V3 với since, for, already, yet, và hiểu vì sao \"last year\" không bao giờ đi với thì này. Phần nghe luyện câu hỏi Why.\n[V]Dự án\nproject|dự án|The team is working on a new ＊ for a customer in Japan.\ndeadline|hạn chót|The ＊ for the report is Friday at five o'clock.\ncomplete|hoàn thành|We must ＊ the work before the end of the month.\nprogress|tiến độ, tiến triển|We are making good ＊; half of the work is done.\nbudget|ngân sách|We have a small ＊ of only 5,000 dollars for the event.\napprove|phê duyệt|The director must ＊ the plan before we can start.\nreview|xem xét lại, rà soát|Please ＊ the contract carefully before you sign it.\nupdate|cập nhật|Please ＊ the customer list with the new phone numbers.\ndelay|sự chậm trễ|Bad weather caused a ＊ of two hours.\non schedule|đúng tiến độ|The building work is ＊ and will finish in May as planned.\nalready|đã … rồi|I have ＊ sent the email, so you do not need to send it again.\nyet|chưa (dùng trong câu phủ định, câu hỏi)|Has the manager signed the contract ＊?\n[G]\n@Present perfect|Thì hiện tại hoàn thành|have / has + V3 (động từ cột ba) · for + khoảng thời gian: for three years · since + mốc thời gian: since 2020, since Monday · already, just: đã, vừa mới · yet: chưa (cuối câu phủ định và câu hỏi) · ever, never: đã từng, chưa từng\nDùng cho việc bắt đầu trong quá khứ và còn liên quan đến hiện tại: kéo dài đến nay (since, for), vừa xong (just, already), hoặc chưa xong (yet).\n!Có thời điểm quá khứ cụ thể (yesterday, last year, in 2019, two days ago) thì phải dùng quá khứ đơn. \"We have finished the project last week\" là sai. Thấy since hoặc for + khoảng thời gian trong câu Part 5, hãy tìm have / has + V3.\n>We 【have worked|worked|work|are working】 on this project since January.=Chúng tôi làm dự án này từ tháng Một.\n>She 【has already sent|already sent has|have already sent|already sends】 the report.=Cô ấy đã gửi báo cáo rồi.\n>The director 【has not approved|did not approved|has not approve|have not approved】 the budget yet.=Giám đốc chưa duyệt ngân sách.\n>【Have you finished|Did you finished|Have you finish|Has you finished】 the update?=Bạn đã cập nhật xong chưa?\n>Mr. Lee has been with the company 【for|since|during|from】 ten years.=Ông Lee đã ở công ty mười năm.\n+Sales 【have increased|has increased|increased have|have increase】 since last spring.=Doanh số đã tăng từ mùa xuân năm ngoái.\n+The team 【completed|has completed|have completed|completes】 the project two weeks ago.=Nhóm đã hoàn thành dự án cách đây hai tuần.\n[N]\nPart 2, câu hỏi Why: đáp án đúng nêu lý do, có thể mở bằng Because, nhưng rất hay bỏ luôn Because (\"The printer is broken\") hoặc dùng \"To + động từ\" để nêu mục đích (\"To save money\").\nChú ý: \"Why don't we…?\" và \"Why don't you…?\" không hỏi lý do mà là lời đề nghị. Câu đáp đúng là đồng ý hoặc từ chối: \"Good idea\", \"Sure, let's do that\".\n[P1]\n📊👨‍💼📈|Một người đàn ông đứng nhìn biểu đồ treo trên tường.|A man is looking at a chart.|A man is drawing on a whiteboard.|A man is taking down a poster.|A chart is lying on a table.\n🗓️📌|Một tờ lịch được ghim trên bảng thông báo.|A calendar is posted on a board.|A woman is writing on a calendar.|A board is being cleaned.|Some notices are on the floor.\n🏗️👷👷|Hai công nhân đội mũ bảo hộ đang làm việc ở công trường.|Some workers are wearing helmets.|Some workers are having lunch.|A building is being painted.|The workers are leaving the site.\n[P2]\nWhy is the project behind schedule?|Two team members have been sick.|By the end of June.|In the project file.\nWhy did you change the deadline?|The customer asked for more time.|To next Friday.|Yes, I changed it.\nWhy hasn't the budget been approved?|The director is still reviewing it.|About ten thousand dollars.|I approved it yesterday.\nWhy don't we ask Ms. Park for help?|Good idea. She knows the system well.|Because she's busy.|She helped last year.\nWhy are you working so late?|I need to finish this update.|Until nine o'clock.|At my desk.\nWhy was the meeting postponed?|Because the manager is away.|Until next Tuesday.|In the conference room.\n[P3]\nA:Hi, David. Have you finished the sales report yet?\nB:Not yet. I've completed the first two parts, but I'm still waiting for the numbers from the Busan office.\nA:The deadline is tomorrow at noon. Should I call them for you?\nB:That would be great. If I get the numbers today, I can finish everything tonight.\nA:All right. I'll call them right now and email you the file.\n?What are the speakers discussing?|A sales report|A job interview|A business trip|A new product\n?Why has the man not finished?|He is waiting for some numbers.|He has been on vacation.|His computer is broken.|He forgot the deadline.\n?What will the woman do next?|Call another office|Write the report herself|Change the deadline|Visit Busan\n[P5]\nMs. Jung 【has worked|worked|works|is working】 at this company since 2015. >> \"Since 2015\" đi với hiện tại hoàn thành.\nThe team has 【already|yet|ever|still not】 completed the first part of the project. >> Câu khẳng định, giữa has và V3: already.\nWe have not received the updated schedule 【yet|already|ever|since】. >> Cuối câu phủ định: yet.\nThe director 【approved|has approved|approves|have approved】 the budget last Monday. >> \"Last Monday\" là thời điểm quá khứ cụ thể: quá khứ đơn.\nMr. Ali has been in charge of the project 【for|since|ago|during】 six months. >> Trước một khoảng thời gian (six months): for.\n【Have|Has|Did|Are】 the engineers reviewed the plans yet? >> Chủ ngữ số nhiều và có V3 \"reviewed\": Have.\nThe company has 【grown|grew|grow|growing】 quickly over the past three years. >> Sau \"has\" cần V3: grow, grew, grown.\nThere have been several delays 【since|for|ago|while】 the project began. >> Trước một mốc (mệnh đề \"the project began\"): since.\nMs. Vu has 【just|yet|ago|last】 sent the report to the customer. >> \"Vừa mới\": just, đứng giữa has và V3.\nWe 【have never|never have|did never|are never】 missed a deadline. >> Trật tự đúng: have + never + V3.\n##B7|Đi công tác|Chọn thì theo dấu hiệu thời gian\n>Mỗi đề có vài câu Part 5 chỉ khác nhau ở thì của động từ. Bài này cho bạn bảng dấu hiệu để chọn thì trong vài giây, và luyện câu hỏi Yes / No.\n[V]Chuyến bay và chỗ ở\nflight|chuyến bay|My ＊ to Tokyo leaves at seven in the morning.\ndepart|khởi hành|The train will ＊ from platform two in five minutes.\ndeparture|sự khởi hành|Please arrive at the airport two hours before ＊.\nluggage|hành lý|You can take one piece of ＊ on the plane.\nboarding pass|thẻ lên máy bay|Show your passport and ＊ at the gate.\nreserve|đặt trước|I would like to ＊ a room for three nights.\naccommodation|chỗ ở|The price of the tour includes flights and ＊ in a hotel.\nitinerary|lịch trình chuyến đi|According to the ＊, we visit the factory on the second day.\ndestination|điểm đến|We reached our ＊ after ten hours of travel.\nabroad|ở nước ngoài|She often travels ＊ for work, mostly to Japan and Korea.\nairline|hãng hàng không|Which ＊ are you flying with?\non board|trên máy bay, trên tàu|There were 200 passengers ＊ the plane.\n[G]\n@Dấu hiệu thời gian và thì tương ứng|Chọn thì của động từ|Hiện tại đơn: every day, usually, often, always · Hiện tại tiếp diễn: now, right now, at the moment, currently · Quá khứ đơn: yesterday, last…, …ago, in 2019 · Hiện tại hoàn thành: since, for, already, yet, recently, so far, over the past… · Tương lai: tomorrow, next…, soon, in two days\nKhi bốn lựa chọn là bốn thì của cùng một động từ, hãy tìm trạng ngữ thời gian trong câu trước tiên.\n!Sau when, before, after, as soon as, if nói về tương lai, động từ dùng hiện tại đơn, không dùng will: \"I will call you when I arrive\".\n>The flight 【departs|departed|is departing|has departed】 at 6 A.M. every day.=Chuyến bay khởi hành lúc 6 giờ sáng mỗi ngày.\n>Mr. Ito 【is traveling|travels|traveled|has traveled】 abroad at the moment.=Ông Ito hiện đang đi công tác nước ngoài.\n>We 【reserved|reserve|have reserved|will reserve】 the rooms two weeks ago.=Chúng tôi đã đặt phòng cách đây hai tuần.\n>The airline 【will announce|announced|announces|has announced】 the new route next month.=Hãng sẽ công bố đường bay mới vào tháng tới.\n>I will email you as soon as I 【arrive|will arrive|arrived|am arriving】.=Tôi sẽ gửi email cho bạn ngay khi tôi đến nơi.\n+Ms. Ng 【has visited|visits|visited|is visiting】 Singapore three times so far.=Đến nay cô Ng đã đến Singapore ba lần.\n+Please wait here until the manager 【returns|will return|returned|is returned】.=Vui lòng chờ ở đây cho đến khi quản lý quay lại.\n[N]\nPart 2, câu hỏi Yes / No (mở bằng Do, Did, Is, Are, Have, Will, Can): đáp án đúng nhiều khi không có chữ Yes hay No. \"Did you book the flight?\" có thể được đáp \"I'll do it this afternoon\" hoặc \"Ms. Lee already did\".\nBẫy thường gặp: câu đáp lặp lại một từ trong câu hỏi (book, flight) nhưng nói chuyện khác. Hãy nghe ý, không nghe từ.\n[P1]\n🛫🧳🧍‍♂️|Một hành khách đứng ở quầy làm thủ tục sân bay, va li đặt cạnh chân.|A traveler is standing at a counter.|A traveler is boarding a plane.|A man is packing a suitcase.|A man is sitting in a waiting area.\n🚕🏨|Một chiếc taxi đỗ trước cửa khách sạn.|A taxi is parked in front of a hotel.|A taxi is driving on a highway.|Passengers are getting into a bus.|A car is being washed.\n🛄🧑‍🤝‍🧑|Vài hành khách đứng chờ lấy hành lý ở băng chuyền.|Some people are waiting for their luggage.|Some people are checking in.|A man is lifting a bag into a car.|The baggage area is closed.\n[P2]\nDid you reserve the hotel rooms?|Yes, three rooms for two nights.|It's a nice hotel.|At the front desk.\nIs your flight on time?|No, it's been delayed an hour.|At gate twelve.|I flew last week.\nHave you received the itinerary?|Not yet. Could you send it again?|To Hong Kong.|It was a long trip.\nWill you be traveling abroad next month?|Yes, to Germany for a conference.|Last month.|By airline.\nDo you have any luggage to check?|Just this one suitcase.|At the airport.|Yes, I checked the time.\nAre you going to the airport by taxi?|No, a colleague is driving me.|It takes forty minutes.|The flight is full.\n[P4]\nN:Attention, passengers on Sky Air flight 302 to Singapore. We are sorry to announce that the departure of this flight has been delayed because of bad weather. The new departure time is 4:45 P.M. Passengers are asked to stay near gate 15. You can use your boarding pass to get a free drink at any café in the terminal. We will make another announcement in thirty minutes. Thank you for your patience.\n?Where is this announcement being made?|At an airport|On a train|In a hotel|At a bus station\n?Why is the flight delayed?|Because of bad weather|Because of a late crew|Because of a mechanical problem|Because of a security check\n?What can passengers get with their boarding pass?|A free drink|A free meal|A hotel room|A new ticket\n[P5]\nThe plane 【departed|departs|will depart|has departed】 two hours ago. >> \"Ago\" là dấu hiệu quá khứ đơn.\nMs. Hall 【is currently attending|currently attended|has currently attend|currently attend】 a conference in Berlin. >> \"Currently\" đi với hiện tại tiếp diễn.\nOur company 【has used|uses|used|is using】 the same airline for over ten years. >> \"For over ten years\" tính đến nay: hiện tại hoàn thành.\nThe new terminal 【will open|opened|opens|has opened】 next spring. >> \"Next spring\" chỉ tương lai.\nMr. Brown usually 【flies|flew|is flying|has flown】 to Tokyo on Mondays. >> \"Usually\" và \"on Mondays\": thói quen, hiện tại đơn.\nI will send you the itinerary when it 【is|will be|was|has】 ready. >> Sau \"when\" nói về tương lai dùng hiện tại đơn.\nThe airline 【canceled|cancels|will cancel|is canceling】 three flights last night because of the storm. >> \"Last night\": quá khứ đơn.\nPassengers 【are boarding|board|boarded|have boarded】 the plane right now. >> \"Right now\": hiện tại tiếp diễn.\nWe 【have not received|did not receive|do not receive|are not receiving】 the tickets yet. >> \"Yet\" đi với hiện tại hoàn thành.\nAs soon as the luggage 【arrives|will arrive|arrived|is arriving】, we will call you. >> Sau \"as soon as\" nói về tương lai dùng hiện tại đơn.\n[P7]\nT:To: Laura Kim. From: Asia Travel Service. Subject: Your trip to Osaka\nDear Ms. Kim, thank you for booking with us. Here is your itinerary. You will depart from Seoul on Monday, June 3, at 9:20 A.M. on Blue Air flight 71 and arrive in Osaka at 11:05 A.M. A driver will meet you at the airport and take you to the Sakura Hotel, where we have reserved a room for three nights. Breakfast is included. Your return flight leaves Osaka on Thursday, June 6, at 6:40 P.M.\nPlease note that the airline allows only one piece of luggage. If you need to change your flight, call us at least 48 hours before departure.\n?What is the purpose of the email?|To give details of a trip|To cancel a reservation|To advertise a hotel|To ask for a payment\n?How will Ms. Kim get to the hotel?|A driver will take her.|She will take a train.|She will rent a car.|She will take a hotel bus.\n?How many nights will Ms. Kim stay in Osaka?|Three|Two|Four|Six\n?What should Ms. Kim do if she wants to change her flight?|Call at least two days before|Send an email to the airline|Visit the hotel front desk|Pay for extra luggage\n##B8|Sản xuất và giao hàng|Câu bị động\n>Bị động xuất hiện ở khắp đề thi: câu Part 1 tả đồ vật, câu Part 5 hỏi \"chủ động hay bị động\", thông báo ở Part 4 và Part 7.\n[V]Nhà máy và giao hàng\nfactory|nhà máy|The ＊ makes 500 cars a day.\nproduce|sản xuất ra|These machines ＊ 1,000 bottles an hour.\nmanufacture|chế tạo (bằng máy móc, số lượng lớn)|They ＊ phones in a large factory near Hai Phong.\ndeliver|giao hàng|We ＊ orders to your home within two days.\ndelivery|việc giao hàng|＊ is free for orders over fifty dollars.\nship|gửi hàng đi|We ＊ our products to customers in thirty countries.\nshipment|lô hàng|A ＊ of 200 chairs arrived at the store this morning.\nwarehouse|nhà kho|The boxes are kept in a ＊ near the port.\npackage|gói hàng, bưu kiện|A ＊ arrived for you this morning; it is on your desk.\nload|chất hàng lên|Two workers ＊ the boxes onto the truck every morning.\ninspect|kiểm tra|Engineers ＊ every machine once a month.\nquality|chất lượng|We check the ＊ of every product before we sell it.\n[G]\n@Passive voice|Câu bị động|Hiện tại: am / is / are + V3 · Quá khứ: was / were + V3 · Hoàn thành: has / have been + V3 · Tương lai và sau modal: will be / can be / must be + V3 · Đang diễn ra: is / are being + V3\nDùng bị động khi chủ ngữ là thứ chịu tác động. Câu hỏi quyết định ở Part 5: chủ ngữ tự làm hành động (chủ động) hay được làm cho (bị động)? \"The manager sent the package\" nhưng \"The package was sent\".\n!Mẹo nhanh: sau chỗ trống không có tân ngữ, mà có \"by…\" hoặc một trạng ngữ, thì gần như chắc chắn là bị động. Trong Part 1, \"is being + V3\" nghĩa là có người đang làm việc đó trong ảnh; \"has been + V3\" hoặc \"is + V3\" chỉ tả trạng thái, không cần có người.\n>The products 【are made|make|are making|made】 in Vietnam.=Các sản phẩm được sản xuất tại Việt Nam.\n>The package 【was delivered|delivered|was delivering|delivers】 yesterday.=Gói hàng đã được giao hôm qua.\n>Your order 【will be shipped|will ship|will be shipping|ships】 tomorrow.=Đơn hàng của bạn sẽ được gửi đi vào ngày mai.\n>Every machine must 【be inspected|inspect|be inspecting|inspected】 once a month.=Mỗi máy phải được kiểm tra mỗi tháng một lần.\n>The boxes 【are being loaded|are loading|being loaded|loaded】 onto a truck.=Những chiếc hộp đang được chất lên xe tải.\n+The warehouse 【was built|built|was building|builds】 in 2010.=Nhà kho được xây năm 2010.\n+The shipment 【has been delayed|has delayed|has been delaying|delayed has】 by bad weather.=Lô hàng đã bị chậm vì thời tiết xấu.\n[N]\nPart 2, câu hỏi phủ định và câu hỏi đuôi (\"Didn't you order the parts?\", \"The shipment arrived, didn't it?\"): hãy bỏ qua chữ not và phần đuôi, coi như một câu hỏi Yes / No bình thường. Việc đã xảy ra thì đáp Yes, chưa xảy ra thì đáp No.\nPart 1 từ mức này bắt đầu có câu bị động tả đồ vật: \"Boxes are stacked\", \"A truck is being loaded\". Hãy tự hỏi: trong ảnh có người đang làm việc đó không?\n[P1]\n📦📦📦🏭|Nhiều thùng hàng xếp chồng lên nhau trong nhà kho, không có người.|Boxes are stacked in a warehouse.|Boxes are being loaded onto a truck.|A worker is opening a box.|The warehouse is being cleaned.\n🚚👷📦|Một công nhân đang chất thùng hàng lên xe tải.|A truck is being loaded.|A truck is parked in a garage.|A worker is driving a truck.|Some boxes have been left on the road.\n🏭⚙️👩‍🔧|Một nữ công nhân đang kiểm tra một cỗ máy trong nhà máy.|A machine is being inspected.|A machine is being moved.|A worker is turning off the lights.|Some tools are hanging on a wall.\n[P2]\nWasn't the shipment delivered this morning?|No, it's coming this afternoon.|To the warehouse.|By truck.\nThe factory is closed on Sundays, isn't it?|Yes, it opens again on Monday.|It makes car parts.|Near the port.\nDidn't you order more packages?|Yes, I ordered fifty yesterday.|In the storage room.|They're very strong.\nThe products are made in Vietnam, aren't they?|That's right, in Hai Phong.|They're on sale.|Yes, I made it.\nHasn't the truck been loaded yet?|They're doing it right now.|In the parking lot.|It's a large truck.\nYou inspected the machines last week, didn't you?|No, that was Mr. Dang.|Every month.|They're in the factory.\n[P5]\nAll orders 【are shipped|ship|are shipping|shipped】 within 24 hours. >> Đơn hàng được gửi đi (không tự gửi): bị động hiện tại.\nThe new factory 【was opened|opened by|was opening|opens】 by the president last month. >> Có \"by the president\" và \"last month\": bị động quá khứ.\nThe packages must 【be delivered|deliver|be delivering|delivered】 before noon. >> Sau \"must\" và mang nghĩa bị động: be + V3.\nOur products 【are manufactured|manufacture|are manufacturing|manufactured by】 in three countries. >> Sản phẩm được sản xuất: are + V3.\nThe shipment 【has been delayed|has delayed|is delaying|delays】 because of the storm. >> Lô hàng bị chậm: has been + V3.\nThe company 【produces|is produced|produced by|was produced】 over one million bottles a year. >> Sau chỗ trống có tân ngữ (bottles): câu chủ động.\nThe quality of each item 【is checked|checks|is checking|checked by】 before delivery. >> Chất lượng được kiểm tra: bị động.\nThe warehouse 【is being repaired|is repairing|repairs|being repaired】 this week. >> Việc đang được tiến hành: is being + V3.\nThe invoice will 【be sent|send|be sending|sent】 to you by email. >> Sau \"will\" với nghĩa bị động: be + V3.\nMr. Dang 【inspected|was inspected|is inspected|inspecting】 the machines yesterday. >> Mr. Dang là người làm hành động và có tân ngữ: chủ động, quá khứ.\n[P7]\nT:Notice of delivery: Order number 48213\nDear Mr. Harris, your order of two office chairs was shipped from our warehouse on Tuesday, March 4. It will be delivered to your office on Thursday, March 6, between 9 A.M. and noon. Someone must be there to sign for the package.\nIf nobody is available, the package will be returned to our warehouse, and a second delivery will cost ten dollars. To change the delivery date, please visit our website before Wednesday at 5 P.M. Thank you for shopping at Office Plus.\n?What did Mr. Harris order?|Office chairs|A desk|Printer paper|A computer\n?When will the order arrive?|On Thursday morning|On Tuesday afternoon|On Wednesday at 5 P.M.|On March 4\n?What is required at the time of delivery?|A signature|A payment|An ID card|A phone call\n?What will happen if nobody receives the package?|It will go back to the warehouse.|It will be left at the door.|It will be delivered the next day for free.|The order will be canceled.\n##B9|Đi lại và lịch trình|Giới từ nâng cao: by, until, during, for, within\n>Những giới từ nhỏ này quyết định nghĩa của cả câu: \"by Friday\" và \"until Friday\" khác hẳn nhau. Phần nghe luyện câu hỏi lựa chọn \"A or B\".\n[V]Giao thông\ntraffic|giao thông, xe cộ|There is a lot of ＊ on this road in the morning.\ncommute|đi lại hằng ngày để đi làm|I ＊ to work by train; it takes forty minutes.\npublic transportation|giao thông công cộng|Using ＊ is cheaper than driving your own car.\nplatform|sân ga|The train to Busan leaves from ＊ six.\nfare|giá vé xe, tàu|The bus ＊ is two dollars for adults.\nroute|tuyến đường|Bus ＊ 32 goes past the university.\npassenger|hành khách|Each ＊ may bring two bags.\ndirection|hướng|We were driving in the wrong ＊, away from the airport.\ndue|đến hạn; dự kiến đến|The report is ＊ on Friday, so I must finish it this week.\nuntil|cho đến khi|The store is open ＊ nine o'clock tonight.\nduring|trong suốt (một sự kiện, một giai đoạn)|Please turn off your phone ＊ the meeting.\nwithin|trong vòng|We will reply to your email ＊ 24 hours.\n[G]\n@by và until|Hai giới từ chỉ hạn|by + mốc thời gian: trước hoặc muộn nhất là lúc đó (hạn chót cho một việc xảy ra một lần) · until + mốc thời gian: kéo dài liên tục cho đến lúc đó\n\"Please send the report by Friday\": gửi một lần, hạn chót thứ Sáu. \"The office is open until six\": việc mở cửa kéo dài đến sáu giờ. Động từ đi với by thường là submit, send, finish, arrive, return; động từ đi với until thường là stay, wait, continue, be open, last.\n>Please return the form 【by|until|during|within of】 Friday.=Vui lòng gửi lại mẫu đơn trước thứ Sáu.\n>The store stays open 【until|by|during|at】 10 P.M.=Cửa hàng mở cửa đến 10 giờ tối.\n@during, for, within, since|Giới từ chỉ khoảng thời gian|during + danh từ chỉ sự kiện: during the meeting, during the summer · for + độ dài: for two hours · within + độ dài: trong vòng, không quá · since + mốc: từ lúc đó đến nay\nDuring trả lời câu hỏi \"khi nào\" bằng tên một sự kiện; for trả lời \"bao lâu\" bằng một con số. Within nhấn mạnh giới hạn không được vượt quá, hay gặp trong cam kết giao hàng và trả lời thư.\n!\"During two hours\" là sai: sau during là tên một sự kiện hoặc giai đoạn, sau for là một con số chỉ độ dài.\n>No phones are allowed 【during|for|while|within】 the presentation.=Không được dùng điện thoại trong lúc thuyết trình.\n>We waited 【for|during|since|until】 thirty minutes.=Chúng tôi đã chờ ba mươi phút.\n>Your order will arrive 【within|during|until|since】 three days.=Đơn hàng của bạn sẽ đến trong vòng ba ngày.\n+The road will be closed 【until|by|within|for the】 the end of the month.=Con đường sẽ đóng đến hết tháng.\n+All passengers must board 【by|until|during|since】 8:15.=Tất cả hành khách phải lên tàu trước 8 giờ 15.\n[N]\nPart 2, câu hỏi lựa chọn (A or B): không bao giờ đáp Yes hoặc No. Đáp án đúng thường là một trong năm kiểu: chọn A, chọn B, cả hai (\"Both are fine\"), không cái nào (\"Neither\"), hoặc tuỳ (\"Either is fine\", \"It doesn't matter\").\n[P1]\n🚇🧍🧍🧍|Nhiều người đứng chờ trên sân ga tàu điện ngầm.|People are waiting on a platform.|People are getting off a bus.|A train is being repaired.|Passengers are buying tickets at a machine.\n🚲🅿️🚲🚲|Mấy chiếc xe đạp dựng thành hàng ở bãi để xe.|Bicycles are parked in a row.|A man is riding a bicycle.|Bicycles are being sold in a shop.|A bicycle has fallen over.\n🚦🚗🚙🚕|Xe ô tô dừng thành hàng trước đèn giao thông.|Cars are stopped at a traffic light.|Cars are parked in a garage.|A car is being towed.|The road is closed to traffic.\n[P2]\nDo you commute by bus or by subway?|By subway. It's faster.|Yes, every day.|About thirty minutes.\nShould we leave now or after lunch?|Let's go now, before the traffic gets bad.|Yes, we should.|At the restaurant.\nWould you like a window seat or an aisle seat?|Either is fine.|No, thank you.|It's seat 14A.\nIs the meeting on Tuesday or Wednesday?|Neither. It's been moved to Friday.|Yes, it is.|In room three.\nDo you want to take the express train or the local one?|The express, if there are seats.|At platform two.|It takes an hour.\nWill you pay by cash or by card?|By card, please.|Twenty dollars.|Yes, I'll pay.\n[P3]\nA:Excuse me, does this bus go to the convention center?\nB:No, this is route 12. You need route 30. It stops across the street.\nA:Oh, I see. How often does it come?\nB:Every fifteen minutes during the day. The next one is due at 2:40.\nA:Great. And how much is the fare?\nB:Two dollars, but you have to pay in cash on the bus.\n?Where does the woman want to go?|To the convention center|To the airport|To a hotel|To the train station\n?How often does the route 30 bus come?|Every fifteen minutes|Every thirty minutes|Every hour|Every twelve minutes\n?What does the man say about the fare?|It must be paid in cash.|It is free during the day.|It can be paid by card.|It costs twelve dollars.\n[P5]\nPlease submit your travel request 【by|until|during|for】 the end of the week. >> Hạn chót cho việc nộp một lần: by.\nThe ticket office is open 【until|by|within|since】 8 P.M. every day. >> Trạng thái mở cửa kéo dài đến 8 giờ: until.\nPassengers must not use their phones 【during|for|while|until】 takeoff. >> Sau chỗ trống là danh từ chỉ sự kiện (takeoff): during.\nThe train was delayed 【for|during|at|since】 two hours. >> Trước một độ dài thời gian: for.\nWe will send your new card 【within|until|since|during】 five business days. >> \"Trong vòng\" năm ngày: within.\nBus fares have not changed 【since|for|during|by】 last year. >> Trước một mốc (last year) với hiện tại hoàn thành: since.\nMost employees commute 【by|on|with|in】 public transportation. >> Phương tiện đi lại: by + phương tiện.\nThe road will remain closed 【until|by|within|on】 further notice. >> Cụm cố định: until further notice (cho đến khi có thông báo mới).\nMr. Soto arrived 【at|in|on|to】 the station ten minutes early. >> Đến một địa điểm cụ thể, nhỏ: arrive at.\nThe report is due 【on|in|at|to】 Monday morning. >> Trước thứ trong tuần (kể cả Monday morning): on.\n##B10|Ngân hàng và thanh toán|Liên từ\n>Liên từ nối hai mệnh đề và quyết định quan hệ giữa chúng: thêm ý, đối lập, lý do, điều kiện. Phần nghe luyện lời nhờ vả và lời đề nghị.\n[V]Tiền bạc\naccount|tài khoản|I would like to open a bank ＊.\ndeposit|gửi tiền vào; tiền đặt cọc|I want to ＊ 500 dollars into my account.\nwithdraw|rút tiền|You can ＊ cash from the machine outside the bank.\nloan|khoản vay|She took out a bank ＊ to buy a car.\ninterest|lãi suất, tiền lãi|The bank pays three percent ＊ on savings.\ninvoice|hoá đơn yêu cầu thanh toán|We sent the customer an ＊ for 2,000 dollars.\npayment|khoản thanh toán|The first ＊ is due on the first of May.\nrefund|khoản hoàn tiền|The shoes were broken, so I asked for a ＊.\ncost|chi phí|The ＊ of the repair was higher than we expected.\nprofit|lợi nhuận|The shop made a ＊ of 3,000 dollars last month.\nexpense|khoản chi tiêu|Rent is our biggest monthly ＊.\ntax|thuế|The price includes a ten percent sales ＊.\n[G]\n@Liên từ nối hai mệnh đề|Conjunctions|Thêm ý: and · Đối lập: but, although, even though, while · Lựa chọn: or · Kết quả: so · Lý do: because, since, as · Điều kiện: if, unless · Thời gian: when, while, before, after, until, as soon as, once\nLiên từ đứng trước một mệnh đề có đủ chủ ngữ và động từ. Để chọn đúng, hãy xét quan hệ nghĩa giữa hai vế: cùng chiều (and, so, because) hay ngược chiều (but, although).\n!Phân biệt liên từ với giới từ: because + mệnh đề, nhưng because of + danh từ; although + mệnh đề, nhưng despite + danh từ. Sau chỗ trống có chủ ngữ và động từ thì chọn liên từ.\n>I went to the bank, 【but|so|because|or】 it was closed.=Tôi đã đến ngân hàng nhưng nó đóng cửa.\n>We cannot give a refund 【because|although|so|but】 you do not have a receipt.=Chúng tôi không thể hoàn tiền vì bạn không có hoá đơn.\n>【Although|Because|So|If】 the price was high, we bought the machine.=Mặc dù giá cao, chúng tôi vẫn mua cái máy.\n>You will pay interest 【if|although|but|so】 the payment is late.=Bạn sẽ phải trả lãi nếu thanh toán muộn.\n>Please sign the form 【before|although|because|so】 you leave.=Vui lòng ký mẫu đơn trước khi bạn về.\n+The loan was approved, 【so|but|or|although】 we can start the project.=Khoản vay đã được duyệt nên chúng ta có thể bắt đầu dự án.\n+【When|Although|But|So】 the invoice arrives, please send it to accounting.=Khi hoá đơn đến, vui lòng chuyển cho phòng kế toán.\n[N]\nPart 2, lời nhờ vả và lời đề nghị: \"Could you…?\", \"Would you mind…?\", \"Can I…?\", \"Shall I…?\", \"Let's…\". Đáp án đúng là đồng ý (\"Sure\", \"Of course\", \"No problem\", \"That would be great\") hoặc từ chối lịch sự (\"Sorry, I'm busy right now\").\nRiêng \"Would you mind…?\" có nghĩa \"Bạn có phiền không…?\", nên đồng ý giúp lại là \"Not at all\" hoặc \"No, of course not\".\n[P1]\n🏧🧍‍♀️💳|Một phụ nữ đang dùng máy rút tiền tự động.|A woman is using a cash machine.|A woman is counting some coins.|A woman is opening a wallet.|A woman is waiting in line at a counter.\n🏦🪟👨‍💼👩|Một nhân viên ngân hàng nói chuyện với khách qua quầy giao dịch.|A bank clerk is helping a customer.|A customer is leaving a bank.|A clerk is locking a door.|Some customers are filling out forms.\n🧾🖩✍️|Một người đang dùng máy tính cầm tay cạnh một xấp hoá đơn.|Someone is using a calculator.|Someone is tearing up a receipt.|Someone is typing on a laptop.|Someone is paying at a register.\n[P2]\nCould you send me the invoice by email?|Sure, I'll send it right away.|It was sent yesterday.|Two hundred dollars.\nWould you mind checking these numbers?|Not at all. Give me a minute.|Yes, I checked my mind.|In the bank account.\nCan I pay the bill next week?|I'm sorry, payment is due today.|Yes, it's a large bill.|By credit card.\nShall I call the bank for you?|That would be very helpful, thanks.|The bank is on Main Street.|Yes, I called.\nLet's review the expenses after lunch.|OK, I'll bring the report.|It was very expensive.|We had lunch already.\nWould you like me to open an account for you?|Yes, please. A savings account.|It's open until four.|My account number.\n[P5]\nThe payment was late 【because|although|but|unless】 the invoice had the wrong address. >> Vế sau là lý do của vế trước: because.\n【Although|Because|So|Unless】 the bank was busy, the clerk helped us quickly. >> Hai vế ngược chiều (đông khách nhưng vẫn nhanh): although.\nYou can pay by cash 【or|but|so|because】 by credit card. >> Hai lựa chọn: or.\nWe will send a refund 【as soon as|although|so|but】 we receive the item. >> Quan hệ thời gian \"ngay khi\": as soon as.\nThe loan cannot be approved 【unless|so|and|although】 you provide proof of income. >> \"Trừ khi, nếu không\": unless.\nCosts increased last year, 【so|because|or|if】 profits were lower. >> Vế sau là kết quả: so.\nPlease keep your receipt 【in case|although|so that not|but】 you need a refund. >> \"Phòng khi\": in case + mệnh đề.\nThe store was closed 【because of|because|although|so】 the holiday. >> Sau chỗ trống là danh từ (the holiday), không phải mệnh đề: because of.\n【If|Although|But|So】 you deposit more than 1,000 dollars, you will receive higher interest. >> Điều kiện: if.\nMs. Chen checked the invoice 【and|but|or|so】 approved the payment. >> Hai hành động nối tiếp cùng chủ ngữ: and.\n[P6]\nT:Notice to customers of First City Bank\nThank you for banking with us. From Monday, May 5, our branch on Lake Street will be open __(1)__ 6 P.M. on weekdays, one hour later than before. We have made this change __(2)__ many customers asked for more time after work. __(3)__ Customers who need a loan or want to open a new account should still make an appointment. If you have any questions, please call us or __(4)__ our website.\n?(1)|until|by|during|since >> Trạng thái mở cửa kéo dài đến 6 giờ: until.\n?(2)|because|although|so|unless >> Vế sau nêu lý do của sự thay đổi: because.\n?(3)|Our cash machines are available 24 hours a day.|The bank was built in 1985.|Please return the form by Friday.|Thank you for your payment.\n?(4)|visit|visits|visiting|visited >> Song song với \"call\" sau \"please\": động từ nguyên mẫu.\n\n##B11|Chăm sóc khách hàng|Hoà hợp chủ ngữ và động từ\n>Bạn tìm đúng chủ ngữ thật của câu dù nó bị một cụm giới từ dài che mất, rồi chia động từ số ít hay số nhiều cho đúng. Phần nghe luyện cách đáp lại một câu trần thuật.\n[V]Khiếu nại và bảo hành\ncomplaint|lời phàn nàn, khiếu nại|We received a ＊ from a customer about the slow service.\napologize|xin lỗi|We ＊ for the delay; your order will arrive tomorrow.\nreplace|thay thế, đổi cái mới|The store will ＊ the broken phone with a new one.\nexchange|đổi (hàng)|Can I ＊ this shirt for a larger size?\nwarranty|bảo hành|The laptop has a two-year ＊, so repairs are free.\nsatisfied|hài lòng|Most customers are ＊ with our service.\nrequest|yêu cầu, đề nghị|We received your ＊ for a refund yesterday.\nrespond|phản hồi, trả lời|We try to ＊ to every email within one day.\nsolve|giải quyết|The technician was able to ＊ the problem in ten minutes.\ndamaged|bị hư hỏng|The box arrived ＊, and the glass inside was broken.\ndefective|bị lỗi (do sản xuất)|If the product is ＊, we will give you your money back.\nrepresentative|người đại diện, nhân viên phụ trách|A customer service ＊ will call you back soon.\n[G]\n@Hoà hợp chủ ngữ và động từ|Subject-verb agreement|Chủ ngữ số ít + is / was / has / V-s · Chủ ngữ số nhiều + are / were / have / V · Cụm giới từ sau chủ ngữ không ảnh hưởng: The list of customers is… · each / every / everyone + động từ số ít · the number of + N số nhiều + động từ số ít · a number of + N số nhiều + động từ số nhiều\nĐề thi cố tình đặt một danh từ số nhiều ngay trước chỗ trống để đánh lừa. Hãy gạch bỏ cụm giới từ (of…, in…, with…, for…) rồi tìm danh từ đứng trước nó: đó mới là chủ ngữ thật.\n!Danh từ không đếm được (information, equipment, furniture, advice, luggage) luôn đi với động từ số ít. \"People\", \"staff\", \"police\" dùng như số nhiều.\n>The list of complaints 【is|are|were|have been】 on your desk.=Danh sách khiếu nại đang ở trên bàn bạn.\n>Each of the customers 【has|have|are having|were having】 a different request.=Mỗi khách hàng có một yêu cầu khác nhau.\n>The number of complaints 【has|have|are|were】 decreased this year.=Số lượng khiếu nại đã giảm trong năm nay.\n>A number of products 【were|was|is|has been】 damaged during delivery.=Một số sản phẩm đã bị hỏng khi giao hàng.\n>The equipment in these rooms 【needs|need|are needing|have needed】 to be replaced.=Thiết bị trong các phòng này cần được thay.\n+Every employee in the stores 【wears|wear|are wearing|have worn】 a uniform.=Mọi nhân viên trong các cửa hàng đều mặc đồng phục.\n+The representatives who answer the phones 【are|is|was|has been】 very helpful.=Các nhân viên trả lời điện thoại rất nhiệt tình.\n[N]\nPart 2, câu trần thuật (không phải câu hỏi): người thứ nhất nêu một sự việc hoặc một vấn đề, ví dụ \"The printer is out of paper\". Câu đáp đúng thường là một trong ba kiểu: đề nghị giúp (\"I'll get some\"), hỏi thêm (\"Which one?\"), hoặc bày tỏ đồng tình, thông cảm (\"That's too bad\").\nVì không có từ để hỏi làm mốc, bạn phải hiểu tình huống. Hãy loại câu nào chỉ lặp lại một từ trong câu đầu mà không liên quan về nghĩa.\n[P1]\n🧑‍💼📦😟|Một khách hàng cầm một cái hộp bị móp đứng ở quầy dịch vụ.|A customer is holding a box at a counter.|A customer is opening a package at home.|A clerk is stacking boxes on a shelf.|A man is leaving a store.\n🎧👩‍💻|Một nữ nhân viên đeo tai nghe đang nói chuyện trước máy tính.|A woman is wearing a headset.|A woman is hanging up a phone.|A woman is fixing a computer.|A woman is putting on a jacket.\n🧾👩‍💼↔️🧑|Một nhân viên đưa hoá đơn cho khách qua quầy.|A clerk is handing a receipt to a customer.|A clerk is counting money in a drawer.|A customer is trying on a coat.|A customer is filling out a form.\n[P2]\nMy order hasn't arrived yet.|Let me check the delivery status for you.|It was ordered last week.|In the warehouse.\nThis printer isn't working properly.|I'll call a technician right away.|It prints in color.|Yes, it works at a bank.\nI'd like to return this jacket.|Do you have the receipt?|It's a nice color.|Turn left at the corner.\nThe customer on line two wants to speak to a manager.|I'll take the call in my office.|There are two lines.|She managed it well.\nWe've received a lot of complaints this week.|Really? What are they about?|Thanks, I received it.|Every week.\nYour warranty expired last month.|Oh, I didn't realize that.|It's a two-year plan.|Next month is fine.\n[P3]\nA:Good afternoon, Bright Electronics customer service. How can I help you?\nB:Hi, I bought a coffee maker from your store last week, but it stopped working yesterday.\nA:I'm sorry to hear that. Do you still have your receipt?\nB:Yes, I do. Can I get my money back?\nA:Since it's within thirty days, you can choose a refund or a replacement. Just bring the item and the receipt to any of our stores.\n?Why is the man calling?|A product is not working.|He wants to order a product.|He lost his receipt.|He was charged twice.\n?What does the woman ask about?|A receipt|A credit card|A serial number|A delivery address\n?What should the man do?|Bring the item to a store|Send the item by mail|Wait for a technician|Call back in thirty days\n[P5]\nThe list of defective products 【is|are|were|have】 updated every Monday. >> Chủ ngữ thật là \"The list\" (số ít), không phải \"products\".\nEach customer 【receives|receive|are receiving|have received】 a reply within 24 hours. >> \"Each\" + danh từ số ít đi với động từ số ít.\nThe representatives in the call center 【speak|speaks|is speaking|has spoken】 three languages. >> Chủ ngữ thật là \"The representatives\" (số nhiều).\nThe number of customer complaints 【has|have|are|were】 fallen since March. >> \"The number of…\" đi với động từ số ít.\nA number of customers 【have|has|is|was】 requested a refund. >> \"A number of…\" (một số) đi với động từ số nhiều.\nAll of the information on the warranty card 【is|are|were|have been】 correct. >> \"Information\" không đếm được: động từ số ít.\nThe manager, along with two assistants, 【is|are|were|have been】 reviewing the complaints. >> Chủ ngữ là \"The manager\"; cụm \"along with…\" không tính.\nEveryone in the sales and service departments 【was|were|are|have】 invited to the training. >> \"Everyone\" luôn đi với động từ số ít.\nThe boxes that arrived this morning 【were|was|is|has been】 badly damaged. >> Chủ ngữ là \"The boxes\" (số nhiều); \"that arrived this morning\" chỉ bổ nghĩa.\nThere 【are|is|was|has been】 several ways to contact our customer service team. >> Sau \"There\" động từ chia theo danh từ phía sau (several ways, số nhiều).\n##B12|Tổ chức sự kiện|To V và V-ing\n>Sau một số động từ là to V, sau một số khác là V-ing: thuộc hai danh sách ngắn là lấy được điểm. Phần nghe luyện những câu đáp gián tiếp kiểu \"Tôi chưa rõ\".\n[V]Sự kiện\nvenue|địa điểm tổ chức|The hotel is a perfect ＊ for the conference; it has a hall for 500 people.\norganize|tổ chức, sắp xếp|Ms. Lim will ＊ the company party this year.\nregister|đăng ký|You can ＊ for the workshop on our website.\nregistration|việc đăng ký|＊ for the conference closes on May 1.\ncelebrate|ăn mừng, kỷ niệm|We will ＊ the company's tenth birthday with a big dinner.\ncatering|dịch vụ cung cấp đồ ăn cho sự kiện|We hired a ＊ company to provide lunch for 200 guests.\nbanquet|bữa tiệc lớn, trang trọng|The awards ＊ will be held in the hotel's main hall.\ninvitation|lời mời, thiệp mời|Did you receive an ＊ to the opening ceremony?\nspeaker|diễn giả|The main ＊ at the conference is a famous scientist.\ndecorate|trang trí|We will ＊ the hall with flowers and lights.\nannual|hằng năm|The ＊ sales meeting takes place every January.\nceremony|buổi lễ|The opening ＊ starts at nine with a short speech.\n[G]\n@Động từ + to V|Động từ theo sau là to V|want, would like, plan, decide, hope, expect, need, agree, offer, promise, refuse, manage, fail, afford + to V · Động từ + người + to V: ask, tell, invite, allow, remind, encourage, require + someone + to V\nNhóm này thường nói về việc hướng tới tương lai: dự định, mong muốn, đồng ý làm.\n>We plan 【to hold|holding|hold|held】 the banquet at the Grand Hotel.=Chúng tôi dự định tổ chức tiệc ở khách sạn Grand.\n>The manager asked me 【to organize|organizing|organize|organized】 the event.=Quản lý yêu cầu tôi tổ chức sự kiện.\n>They decided 【to postpone|postponing|postpone|postponed】 the ceremony.=Họ quyết định hoãn buổi lễ.\n@Động từ + V-ing|Động từ theo sau là V-ing|enjoy, finish, avoid, consider, suggest, recommend, mind, keep, postpone, delay, include + V-ing · Sau giới từ luôn là V-ing: before leaving, by registering, interested in attending, look forward to seeing\nNhóm này thường nói về việc đang hoặc đã diễn ra: thích, tránh, hoàn thành, trì hoãn. Ngoài ra, sau bất kỳ giới từ nào (in, on, by, for, before, after, without) động từ cũng ở dạng V-ing.\n!\"Look forward to\" và \"be used to\" có to là giới từ, nên theo sau là V-ing: \"We look forward to seeing you\". Đây là bẫy kinh điển.\n>We finished 【decorating|to decorate|decorate|decorated】 the hall at noon.=Chúng tôi trang trí xong hội trường lúc trưa.\n>Thank you for 【inviting|to invite|invite|invited】 us.=Cảm ơn vì đã mời chúng tôi.\n>She suggested 【hiring|to hire|hire|hired】 a catering company.=Cô ấy đề nghị thuê một công ty cung cấp đồ ăn.\n+We look forward to 【meeting|meet|met|be met】 you at the conference.=Chúng tôi mong được gặp bạn tại hội nghị.\n+You can save money by 【registering|register|to register|registered】 early.=Bạn có thể tiết kiệm bằng cách đăng ký sớm.\n[N]\nPart 2, câu đáp gián tiếp: trong đề thật, khoảng một phần tư số câu Part 2 có đáp án đúng không trả lời thẳng. Các kiểu thường gặp: chưa biết (\"I'm not sure\", \"It hasn't been decided yet\"), chỉ sang người khác (\"Ask Ms. Lim\", \"Check with the organizer\"), hoặc hỏi ngược lại (\"Which event do you mean?\").\nKhi cả ba lựa chọn đều không trả lời thẳng câu hỏi, hãy chọn câu duy nhất còn liên quan về tình huống.\n[P1]\n🎈🎉🪑🪑|Một hội trường được trang trí bóng bay, bàn ghế đã xếp sẵn nhưng chưa có khách.|A room has been decorated for a party.|Guests are dancing at a party.|A man is blowing up balloons.|Chairs are being removed from a room.\n🍽️👨‍🍳🥗|Nhân viên phục vụ đang bày đồ ăn lên một bàn tiệc dài.|Food is being arranged on a table.|Guests are helping themselves to food.|A table is being folded.|The dishes are being washed.\n📝🧑‍🤝‍🧑🪪|Mấy người xếp hàng ở bàn đăng ký để nhận thẻ tên.|People are lined up at a registration desk.|People are sitting in a lecture hall.|A woman is giving a speech.|Name tags are scattered on the floor.\n[P2]\nWhere will the annual banquet be held?|It hasn't been decided yet.|Every December.|About two hundred guests.\nWho's organizing the opening ceremony?|You should ask Ms. Lim.|At nine o'clock.|In the main hall.\nHow many people have registered so far?|Let me check the list.|On the website.|Yes, they have.\nWhen does registration close?|I'm not sure. It's on the invitation.|At the front desk.|It's free.\nIs the catering company bringing desserts?|I think so, but I'll confirm.|It was delicious.|At the venue.\nWhich speaker is going first?|The schedule isn't final yet.|He spoke very well.|The first floor.\n[P4]\nN:Hello, this is a message for Mr. Daniel Ross. This is Karen from Green Garden Catering. I'm calling about the banquet you are organizing on Saturday. You asked us to prepare dinner for eighty guests, but your email this morning says one hundred. Could you call me back to confirm the number? We need to know by Thursday so that we can order enough food. My number is 555-0182. Thank you.\n?Who is the speaker?|An employee of a catering company|A hotel manager|A guest at a banquet|A conference speaker\n?What does the speaker want to confirm?|The number of guests|The date of the event|The location of the venue|The price of the dinner\n?By when does the speaker need an answer?|Thursday|Saturday|This morning|Friday\n[P5]\nThe committee decided 【to hold|holding|hold|held】 the annual meeting in Busan. >> Sau \"decide\" là to V.\nWe look forward to 【seeing|see|saw|be seen】 you at the ceremony. >> \"Look forward to\" + V-ing (to là giới từ).\nMs. Lim suggested 【changing|to change|change|changed】 the venue. >> Sau \"suggest\" là V-ing.\nParticipants are required 【to register|registering|register|registered】 before May 1. >> \"Be required\" + to V.\nPlease avoid 【parking|to park|park|parked】 in front of the main entrance. >> Sau \"avoid\" là V-ing.\nThe organizers expect 【to receive|receiving|receive|received】 more than 300 registrations. >> Sau \"expect\" là to V.\nAfter 【finishing|finish|to finish|finished】 the speech, the speaker answered questions. >> Sau giới từ \"After\" là V-ing.\nThe hotel agreed 【to provide|providing|provide|provided】 free parking for all guests. >> Sau \"agree\" là to V.\nWould you mind 【sending|to send|send|sent】 the invitations today? >> Sau \"mind\" là V-ing.\nThe manager reminded everyone 【to bring|bringing|bring|brought】 their name tags. >> \"Remind + người + to V\".\n##B13|An toàn và quy định|Động từ khuyết thiếu\n>Biển báo, nội quy và thông báo trong đề thi dùng must, may, should liên tục. Phần nghe luyện câu hỏi lồng kiểu \"Do you know where…?\".\n[V]Quy định nơi làm việc\nsafety|sự an toàn|For your ＊, please wear a helmet in the factory.\nrequire|yêu cầu, bắt buộc|The rules ＊ all visitors to sign in at the front desk.\nallow|cho phép|We do not ＊ smoking inside the building.\npermit|giấy phép|You need a parking ＊ to leave your car here.\nprohibit|cấm|The rules ＊ the use of phones in the laboratory.\nuniform|đồng phục|All staff must wear a ＊ during working hours.\nemergency|trường hợp khẩn cấp|In an ＊, leave the building by the nearest exit.\nprotect|bảo vệ|These gloves ＊ your hands from heat.\ninstruction|chỉ dẫn, hướng dẫn|Please read each ＊ carefully before you use the machine.\nprocedure|quy trình|There is a new ＊ for ordering supplies: you must fill out a form first.\npolicy|chính sách, quy định|Our return ＊ lets customers bring items back within thirty days.\nmandatory|bắt buộc|Safety training is ＊ for all new workers; nobody can skip it.\n[G]\n@Modal verbs|Động từ khuyết thiếu|must / have to: bắt buộc · must not: cấm · don't have to: không cần · should: nên · may / might / could: có thể (chưa chắc) · can / be able to: có khả năng; được phép · would: lời đề nghị lịch sự, giả định\nSau mọi động từ khuyết thiếu là động từ nguyên mẫu. Dạng bị động: modal + be + V3 (must be worn, can be found).\n!Hai cặp dễ nhầm: \"must not\" là cấm, còn \"don't have to\" là không bắt buộc. Và sau suggest, recommend, request, require + that + chủ ngữ, động từ ở nguyên mẫu: \"The manager requested that he attend the training\".\n>Visitors 【must|must to|are must|musts】 sign in at the front desk.=Khách phải đăng ký ở quầy lễ tân.\n>Helmets must 【be worn|wear|be wearing|worn】 at all times.=Phải đội mũ bảo hộ mọi lúc.\n>You 【don't have to|must not|shouldn't to|haven't to】 wear a uniform on Fridays.=Bạn không cần mặc đồng phục vào thứ Sáu.\n>The meeting 【may|may to|is may|mays】 be postponed.=Cuộc họp có thể bị hoãn.\n>Employees 【should|should to|are should|ought】 read the safety instructions.=Nhân viên nên đọc hướng dẫn an toàn.\n+The form can 【be found|find|be finding|found】 on the company website.=Có thể tìm thấy mẫu đơn trên trang web công ty.\n+New staff will 【be able to|can|able to|be able】 use the system after the training.=Nhân viên mới sẽ dùng được hệ thống sau khoá đào tạo.\n[N]\nPart 2, câu hỏi lồng: \"Do you know where the safety manual is?\", \"Can you tell me when the training starts?\". Dù mở bằng Do you know hay Can you tell me, điều thật sự được hỏi là từ để hỏi ở giữa câu (where, when, who). Đáp án đúng trả lời từ đó, thường không có Yes hay No.\n[P1]\n⛑️👷‍♂️🦺|Một công nhân đội mũ bảo hộ và mặc áo phản quang đứng ở công trường.|A worker is wearing safety gear.|A worker is taking off a helmet.|A worker is climbing a ladder.|Some helmets are hanging on a wall.\n🚫🚬🪧|Một tấm biển cấm hút thuốc gắn trên tường.|A sign is posted on a wall.|A man is putting up a sign.|A sign has fallen on the ground.|People are reading a notice.\n🧯🚪|Một bình chữa cháy đặt cạnh cửa thoát hiểm.|A fire extinguisher is next to a door.|A man is using a fire extinguisher.|A door is being painted.|The exit is blocked by boxes.\n[P2]\nDo you know where the safety manual is?|It's on the shelf by the door.|Yes, it's very safe.|At two o'clock.\nCan you tell me when the training starts?|At nine tomorrow morning.|In the training room.|Yes, I can tell.\nDo you know who is in charge of the parking permits?|Mr. Ortiz in the main office.|In the parking lot.|For one year.\nCould you tell me how to turn off this machine?|Press the red button on the side.|Yes, it's off.|It's a new machine.\nDo you know if visitors are allowed in the factory?|Only with a guide.|It's a large factory.|They visited yesterday.\nCan you show me where the emergency exit is?|Sure, follow me.|In an emergency.|Yes, it exists.\n[P7]\nT:Laboratory safety rules\nAll staff and visitors must follow these rules. Safety glasses and gloves must be worn at all times in the laboratory. Food and drinks are not allowed. Visitors may enter only with a staff member and must sign the visitor book at the front desk.\nIn an emergency, leave by the nearest exit and do not use the elevator. Any accident, even a small one, should be reported to the laboratory manager immediately. New employees are required to complete a two-hour safety training course before they begin work.\n?Who are the rules for?|Everyone who enters the laboratory|Only new employees|Only visitors|The laboratory manager\n?What is NOT allowed in the laboratory?|Eating and drinking|Wearing gloves|Signing a book|Using the stairs\n?What should people do if there is an accident?|Tell the laboratory manager|Call the front desk|Take the elevator|Complete a training course\n?What must new employees do before starting work?|Take a safety course|Buy safety glasses|Work for two hours with a guide|Sign the visitor book\n[P5]\nAll visitors 【must|must to|have|are having to】 wear an ID badge in the building. >> \"Must\" + động từ nguyên mẫu, không có to.\nSafety glasses should 【be worn|wear|be wearing|wore】 in the laboratory. >> Kính được đeo: modal + be + V3.\nEmployees 【are not allowed|do not allow|not allowed|are not allowing】 to park in the visitor area. >> \"Be allowed to\": được phép; chủ ngữ là người bị cấm nên dùng bị động.\nThe new policy 【may|mays|is may|may to】 change the way we order supplies. >> \"May\" + động từ nguyên mẫu.\nYou 【do not have to|must not|should not to|have not】 work on the holiday, but you can if you want. >> \"Không bắt buộc\": do not have to.\nThe manager recommended that every worker 【attend|attends|attended|attending】 the safety training. >> Sau \"recommend that + chủ ngữ\" là động từ nguyên mẫu.\nSmoking 【is prohibited|prohibits|is prohibiting|prohibited by】 in all areas of the factory. >> Việc hút thuốc bị cấm: bị động.\nWith this permit, you 【can|can to|are can|could to】 park in any company lot. >> \"Can\" + động từ nguyên mẫu.\nThe instructions must 【be read|read by|be reading|reads】 before using the equipment. >> Hướng dẫn được đọc: must + be + V3.\nAfter the course, staff will 【be able to|can|be able|able to】 handle emergencies. >> Sau \"will\" không dùng \"can\"; dùng \"be able to\".\n##B14|Thuê nhà và văn phòng|Mệnh đề quan hệ\n>Bạn chọn đúng who, which, that, whose, where chỉ bằng cách nhìn từ đứng trước và sau chỗ trống. Phần nghe luyện bẫy từ đồng âm.\n[V]Bất động sản\nrent|tiền thuê; thuê|The ＊ for this apartment is 800 dollars a month.\nlease|hợp đồng thuê|We signed a two-year ＊ for the office.\nlandlord|chủ nhà cho thuê|The ＊ comes to collect the rent every month.\ntenant|người thuê nhà|The previous ＊ moved out last week, so the apartment is empty.\nproperty|bất động sản, tài sản|This ＊ includes a house and a large garden.\nlocation|vị trí, địa điểm|The shop is in a great ＊, right next to the station.\nfurnished|có sẵn đồ đạc|The apartment is fully ＊, with a bed, a sofa and a table.\nrenovate|cải tạo, sửa sang|They plan to ＊ the old kitchen and put in new cabinets.\nutilities|điện, nước, ga (các dịch vụ thiết yếu)|The rent does not include ＊ such as water and electricity.\nneighborhood|khu phố|It is a quiet ＊ with many parks and schools.\nspacious|rộng rãi|The living room is ＊; there is room for two sofas.\nconvenient|tiện lợi|The apartment is very ＊ for commuters because the subway is a minute away.\n[G]\n@Relative clauses|Mệnh đề quan hệ|Người + who + động từ · Vật + which / that + động từ · Người hoặc vật + whose + danh từ (chỉ sở hữu) · Nơi chốn + where + chủ ngữ + động từ · Người + whom + chủ ngữ + động từ (trang trọng)\nCách chọn trong năm giây: nhìn từ đứng trước chỗ trống (người hay vật), rồi nhìn từ đứng sau. Sau chỗ trống là động từ thì chọn who hoặc which / that; là một danh từ thuộc về từ đứng trước thì chọn whose; là một mệnh đề đủ chủ ngữ và động từ, và từ đứng trước là nơi chốn, thì chọn where.\n!\"What\" không đứng sau danh từ. \"The office what we rented\" là sai.\n>The tenant 【who|which|whose|where】 lives upstairs is very quiet.=Người thuê nhà sống ở tầng trên rất yên lặng.\n>This is the apartment 【which|who|whose|where】 was renovated last year.=Đây là căn hộ đã được sửa sang năm ngoái.\n>The landlord 【whose|who|which|that】 property we rent lives abroad.=Người chủ có căn nhà chúng tôi thuê đang sống ở nước ngoài.\n>This is the building 【where|which|who|whose】 our company has its office.=Đây là toà nhà nơi công ty chúng tôi đặt văn phòng.\n>The lease 【that|who|whose|where】 we signed is for two years.=Hợp đồng thuê chúng tôi ký có thời hạn hai năm.\n+We need an office 【that|who|whose|what】 is close to the station.=Chúng tôi cần một văn phòng gần ga.\n+Tenants 【who|which|whose|where】 pay late must pay an extra fee.=Người thuê trả tiền muộn phải nộp thêm phí.\n[N]\nPart 2, bẫy từ nghe giống nhau: đáp án sai rất hay chứa một từ phát âm gần giống từ trong câu hỏi, ví dụ rent và lent, lease và least, copy và coffee, walk và work, fare và fair. Nghe thấy một từ \"quen quen\" lặp lại thì càng phải cảnh giác: câu đó thường sai.\n[P1]\n🏠🪧|Một tấm biển \"cho thuê\" cắm trước một ngôi nhà.|A sign is standing in front of a house.|A man is painting a house.|A sign is being taken down.|A house is being built.\n🛋️🪟🪴|Một phòng khách rộng có ghế sofa, cửa sổ lớn và chậu cây, không có người.|A sofa is placed near a window.|Someone is sitting on a sofa.|The curtains are being closed.|Furniture is being carried out.\n🔑🤝🏢|Một người đàn ông trao chìa khoá cho một phụ nữ trước cửa toà nhà.|A man is handing over some keys.|A man is locking a door.|A woman is looking for her keys.|They are entering an elevator.\n[P2]\nHow much is the rent for this office?|Fifteen hundred dollars a month.|I lent it to a friend.|It's on the second floor.\nIs the apartment furnished?|Yes, everything is included.|It's the furthest one.|He's a furniture maker.\nWhen does your lease end?|At the end of December.|At least two years.|It's a new lease.\nWho is the landlord of this building?|A company called City Homes.|He landed yesterday.|On the top floor.\nWhy are you moving to a new neighborhood?|It's more convenient for my commute.|My neighbor is moving.|Next weekend.\nDoes the rent include utilities?|Only water. Electricity is extra.|It's very useful.|Yes, I rented it.\n[P3]\nA:Thank you for showing me the apartment, Mr. Grant. It's very spacious, and the location is convenient.\nB:I'm glad you like it. The previous tenant stayed here for five years.\nA:The rent is nine hundred dollars a month, right? Does that include utilities?\nB:It includes water, but not electricity. And I ask for a one-month deposit.\nA:That sounds fine. Could I move in at the beginning of next month?\nB:Of course. I'll prepare the lease, and you can sign it on Friday.\n?Who most likely is the man?|A landlord|A moving company worker|A bank clerk|A previous tenant\n?What is included in the rent?|Water|Electricity|Furniture|Parking\n?What will the woman do on Friday?|Sign a lease|Move into the apartment|Pay the first month's rent|Visit another apartment\n[P5]\nThe tenant 【who|which|whose|where】 rented the office last year has renewed the lease. >> Trước là người (tenant), sau là động từ: who.\nWe visited a property 【that|who|whose|what】 has three bedrooms and a garden. >> Trước là vật (property), sau là động từ: that.\nMs. Cruz is the landlord 【whose|who|which|whom】 building was renovated last month. >> Sau chỗ trống là danh từ \"building\" thuộc về landlord: whose.\nThis is the neighborhood 【where|which|who|whose】 I grew up. >> Trước là nơi chốn, sau là mệnh đề đủ chủ ngữ và động từ: where.\nThe apartment 【which|who|whose|where】 is on the top floor has the best view. >> Vật + động từ \"is\": which.\nCustomers 【who|which|whose|where】 sign a two-year lease receive a discount. >> Người + động từ: who.\nThe office 【that|who|where|whose】 we looked at yesterday is too small. >> Vật làm tân ngữ của \"looked at\": that (hoặc which).\nThe company 【whose|who|which|that】 offices are on this floor is moving out. >> Sau chỗ trống là danh từ \"offices\" thuộc về company: whose.\nThe real estate agent 【who|whose|which|where】 showed us the house was very helpful. >> Người + động từ \"showed\": who.\nThe hotel 【where|which|that|whose】 the conference was held is being renovated. >> Nơi chốn + mệnh đề đủ thành phần: where.\n##B15|Hợp đồng và đàm phán|Câu điều kiện\n>Câu có if xuất hiện trong hợp đồng, email và thông báo của đề thi. Bạn chỉ cần thuộc hai khuôn chính để chọn đúng dạng động từ.\n[V]Hợp đồng\ncontract|hợp đồng|Both companies signed the ＊ on Monday.\nagreement|thoả thuận|After two days of talks, the two sides reached an ＊.\nnegotiate|đàm phán|We need to ＊ a lower price with the supplier.\nsign|ký|Please ＊ your name at the bottom of the page.\nterms|điều khoản|Read the ＊ of the contract carefully before you agree.\ncondition|điều kiện|One ＊ of the loan is that you must repay it in two years.\npartner|đối tác|Our business ＊ in Japan sells our products there.\nsupplier|nhà cung cấp|We buy all our paper from one ＊.\ndeal|thoả thuận làm ăn|The two companies made a ＊ worth five million dollars.\noffer|lời đề nghị; đưa ra đề nghị|They made us an ＊ of 10,000 dollars for the old machines.\naccept|chấp nhận|We decided to ＊ their offer because the price was fair.\nreject|từ chối, bác bỏ|The manager may ＊ the plan if it costs too much.\n[G]\n@First conditional|Câu điều kiện loại 1: có thể xảy ra|If + hiện tại đơn, will / can / may + động từ nguyên mẫu · unless = if … not · as long as, provided that: miễn là · in case: phòng khi\nDùng cho điều kiện có thật ở hiện tại hoặc tương lai. Mệnh đề if không bao giờ có will.\n!\"If you will sign today\" là sai. Đúng: \"If you sign today, we will give you a discount\".\n>If you 【sign|will sign|signed|signing】 the contract today, we will give you a discount.=Nếu bạn ký hợp đồng hôm nay, chúng tôi sẽ giảm giá cho bạn.\n>We 【will cancel|cancel|canceled|would cancel】 the order unless the supplier lowers the price.=Chúng tôi sẽ huỷ đơn hàng trừ khi nhà cung cấp giảm giá.\n>You can use the room 【as long as|unless|although|in case of】 you book it in advance.=Bạn có thể dùng phòng miễn là đặt trước.\n@Second conditional|Câu điều kiện loại 2: giả định, không có thật|If + quá khứ đơn, would / could + động từ nguyên mẫu · Với be, dùng were cho mọi ngôi\nDùng khi nói về điều trái với thực tế hiện tại. Trong thư từ lịch sự: \"We would appreciate it if you could reply by Friday\".\n>If we 【had|have|will have|would have】 a bigger budget, we would hire more staff.=Nếu chúng tôi có ngân sách lớn hơn, chúng tôi sẽ tuyển thêm người.\n>If I 【were|am|will be|would be】 you, I would accept the offer.=Nếu tôi là bạn, tôi sẽ nhận lời đề nghị đó.\n+If the terms 【are|will be|were being|would be】 acceptable, our partner will sign next week.=Nếu các điều khoản chấp nhận được, đối tác của chúng tôi sẽ ký vào tuần tới.\n+We 【would accept|will accept|accept|accepted】 the deal if the price were lower.=Chúng tôi sẽ chấp nhận thoả thuận nếu giá thấp hơn.\n[N]\nPart 2, hỏi ý kiến và đưa ra đề xuất: \"What do you think of the new contract?\", \"How about meeting on Friday?\", \"Why don't we call the supplier?\". Câu đáp đúng nêu nhận xét (\"It looks fair to me\") hoặc đồng ý, từ chối đề xuất (\"That works for me\", \"I'd rather wait\").\n[P1]\n✍️📃🤝|Hai người ngồi đối diện nhau, một người đang ký vào tờ giấy.|A man is signing a document.|A man is tearing up some papers.|Two people are shaking hands outside.|A document is being printed.\n💼👥🏢|Một nhóm người mặc vest đang đi vào một toà nhà.|Some people are entering a building.|Some people are seated at a table.|A man is holding a door closed.|A group is getting on a bus.\n📑🖥️👩‍💼|Một phụ nữ so sánh tài liệu giấy với nội dung trên màn hình.|A woman is comparing a document with a screen.|A woman is turning off a computer.|A woman is filing some folders.|A woman is making a phone call.\n[P2]\nWhat do you think of the supplier's offer?|It seems reasonable to me.|I offered him a seat.|Last Tuesday.\nHow about meeting the partners on Friday?|Friday works for me.|They met at a party.|About two hours.\nWhy don't we negotiate a lower price?|That's worth a try.|Because it's too low.|The price is on the tag.\nShould we accept the deal or wait?|I'd rather wait for a better offer.|Yes, we should.|It's a great deal of work.\nWhat did you think of the terms?|They need a few changes.|For three terms.|I think so too.\nHow do you feel about signing a longer contract?|I'm not comfortable with that yet.|It feels very soft.|I signed up yesterday.\n[P6]\nT:Dear Mr. Novak,\nThank you for meeting with us last week. We have reviewed your offer, and we are happy to __(1)__ most of the terms. However, we would like to discuss the delivery schedule. If you __(2)__ deliver the first shipment by June 1, we will be able to sign the contract this month. __(3)__ We would appreciate it if you __(4)__ reply by Friday.\nSincerely, Mina Seo, Purchasing Manager\n?(1)|accept|except|reject|expect >> Hợp nghĩa: vui lòng chấp nhận phần lớn điều khoản. \"Except\" là giới từ, không phải động từ.\n?(2)|can|could have|will|would be >> Mệnh đề if của điều kiện loại 1 dùng hiện tại: can.\n?(3)|Otherwise, we may need to look for another supplier.|The shipment arrived last Monday.|Thank you for your payment.|Our office will be closed in June.\n?(4)|could|can to|will be|are >> Lời đề nghị lịch sự: would appreciate it if you could…\n[P5]\nIf you 【order|will order|ordered|would order】 before Friday, delivery will be free. >> Mệnh đề if loại 1 dùng hiện tại đơn.\nThe contract will be canceled 【unless|if|as long as|because】 both partners sign it by June 30. >> \"Trừ khi cả hai ký\": unless.\nIf the supplier 【had|has|will have|would have】 more staff, it could deliver faster. >> Mệnh đề chính có \"could\" (giả định): mệnh đề if dùng quá khứ đơn.\nWe will accept the offer 【as long as|unless|even|in spite of】 the terms do not change. >> \"Miễn là\": as long as.\nIf I 【were|am|was being|will be】 in your position, I would negotiate the price. >> Giả định với be: were cho mọi ngôi.\nPlease call me if you 【have|will have|had|would have】 any questions about the agreement. >> Mệnh đề if loại 1: hiện tại đơn.\nIf the deal 【is|will be|were|would be】 approved, we will hire twenty new employees. >> Mệnh đề chính có \"will\": if + hiện tại đơn.\nWe 【would sign|will sign|sign|signed】 the lease today if the rent were lower. >> Mệnh đề if dùng \"were\" (giả định): mệnh đề chính dùng would + V.\nKeep a copy of the contract 【in case|unless|so|even】 you need it later. >> \"Phòng khi\": in case.\nWe would appreciate it if you 【could|can|will|are able】 send the signed agreement by Monday. >> Cấu trúc lịch sự: would appreciate it if you could…\n\n##B16|Hàng hoá và kho|Lượng từ\n>Many hay much, few hay little, each hay all, another hay other: những từ nhỏ này chiếm vài câu trong mỗi đề và có quy tắc rất rõ.\n[V]Cửa hàng và hàng tồn\nstock|hàng trong kho|We have plenty of paper in ＊, so you do not need to order more.\ninventory|hàng tồn kho; việc kiểm kê|The store checks its ＊ at the end of every month.\nitem|món hàng, mục|Each ＊ on the list has a price next to it.\npurchase|mua; món hàng đã mua|You can return your ＊ within thirty days if you keep the receipt.\nretail|bán lẻ|The ＊ price is 50 dollars, but stores buy it for 30.\nin stock|còn hàng|Good news: the blue jacket is ＊ in your size.\nout of stock|hết hàng|Sorry, that model is ＊; we will have more next week.\ncatalog|danh mục sản phẩm|You can see all our products in the new ＊.\nsample|hàng mẫu|We sent the customer a free ＊ of the new shampoo.\nquantity|số lượng|We offer a discount if you buy a large ＊.\nclerk|nhân viên bán hàng|The ＊ at the counter helped me find the right size.\naisle|lối đi giữa các kệ hàng|You will find rice in ＊ five, next to the pasta.\n[G]\n@Lượng từ với danh từ đếm được và không đếm được|Quantifiers|Với N đếm được số nhiều: many, a few, few, several, a
