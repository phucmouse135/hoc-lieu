round|ở phía sau, hậu cảnh|＊, I can see some tall buildings and a few trees.\non the left side|ở bên trái|＊ of the picture, two men are shaking hands.\non the right side|ở bên phải|＊ of the picture, there is a large window.\nin the middle|ở giữa|＊ of the picture, there is a long table with six chairs.\nthis is a picture of|đây là bức ảnh về|＊ a busy street market.\nit looks like|trông có vẻ như|＊ they are having a business meeting.\nseem to be|có vẻ đang|The two women ＊ discussing a document.\nis wearing|đang mặc|The man ＊ a dark suit and a blue tie.\nis holding|đang cầm|The woman ＊ a cup of coffee in her right hand.\nprobably|có lẽ|They are ＊ colleagues, because they are in an office.\noverall|nhìn chung|＊, it looks like a calm and friendly place.\n[N]\nKhung bốn bước, mỗi bước một đến hai câu. Một, khung cảnh: \"This is a picture of…\" hoặc \"This picture was taken in…\". Hai, người chính và hành động, dùng hiện tại tiếp diễn: \"In the foreground, a woman is…\". Ba, chi tiết xung quanh: đồ vật, người phía sau, quần áo, dùng \"There is / There are\" và các cụm chỉ vị trí. Bốn, nhận xét chung: \"It looks like…\", \"Overall, …\".\nTrong 45 giây chuẩn bị, hãy nhẩm sẵn bốn danh từ và bốn động từ bạn sẽ dùng. Không biết tên một vật thì tả nó: \"a machine for making copies\" thay cho \"photocopier\".\nNói đều cho đến khi hết 30 giây. Nếu hết ý, thêm suy đoán: thời tiết, thời điểm trong ngày, cảm xúc của người trong ảnh (\"They seem to be enjoying…\"). Im lặng mười giây cuối là mất điểm.\nTrong trang này, ảnh được thay bằng hình minh hoạ và một dòng tả cảnh tiếng Việt. Hãy tưởng tượng bức ảnh từ dòng đó và tả lại bằng tiếng Anh.\n[S3]\n👩‍💼💻☕🪟|Một phụ nữ mặc đồ công sở ngồi ở bàn cạnh cửa sổ, đang gõ máy tính xách tay; trên bàn có một tách cà phê và vài tập hồ sơ; ngoài cửa sổ là các toà nhà cao tầng.|This is a picture of an office. In the foreground, a woman is sitting at a desk and typing on a laptop. She is wearing a dark jacket, and she seems to be concentrating on her work. On the desk, there is a cup of coffee and some files. In the background, I can see tall buildings through a large window, so the office is probably in the city center. Overall, it looks like a quiet and comfortable place to work.\n🧑‍🍳🍅🥬👩‍🦰🛒|Ở một khu chợ ngoài trời, một người bán hàng đứng sau quầy rau củ đang đưa túi cho một phụ nữ; phía sau có vài người đi lại và những quầy hàng khác.|This picture was taken at an outdoor market. In the middle of the picture, a man is standing behind a stall of fresh vegetables. He is handing a bag to a woman, so she is probably buying some tomatoes. The woman is holding a shopping basket in her other hand. In the background, there are other stalls and several people walking around. It looks like a sunny morning, and the market seems to be quite busy.\n👨‍👩‍👧‍👦🌳🧺🏞️|Một gia đình bốn người ngồi trên tấm thảm ở công viên, bên cạnh có giỏ đồ ăn; phía xa có hồ nước và vài người đi xe đạp.|This is a picture of a family having a picnic in a park. In the foreground, four people are sitting on a blanket on the grass. The parents are talking, and the two children are eating sandwiches. Next to them, there is a basket with some food and drinks. In the background, I can see a lake and a few people riding bicycles. The weather looks warm and sunny. Overall, they seem to be enjoying a relaxing day together.\n🚉🧳🧍‍♂️🧍‍♀️🕐|Trên sân ga, vài hành khách đứng chờ với va li; một người đàn ông đang nhìn đồng hồ; một đoàn tàu đang tiến vào ga.|This picture shows a train station. On the left side, a train is arriving at the platform. In the middle, several passengers are waiting with their luggage. One man in a gray coat is looking at his watch, so he is probably worried about the time. Next to him, a woman is holding a large suitcase. In the background, there is a clock and some signs. It looks like a busy time of day, maybe the morning rush hour.\n##E3|Speaking câu 5–7: trả lời câu hỏi|15 giây, 15 giây và 30 giây\n>Ba câu hỏi về một chủ đề quen thuộc, như thể bạn đang trả lời một cuộc khảo sát qua điện thoại. Chỉ có 3 giây chuẩn bị, nên bạn cần sẵn một khuôn trả lời.\n[N]\nPhần này mở bằng một tình huống: \"Imagine that a marketing firm is doing research in your country. You have agreed to answer some questions about…\". Sau đó là ba câu hỏi, vừa hiện trên màn hình vừa được đọc. Câu 5 và 6 trả lời trong 15 giây, câu 7 trong 30 giây.\nKhuôn cho câu 15 giây: trả lời thẳng bằng một câu đầy đủ, rồi thêm một chi tiết (khi nào, ở đâu, với ai, bao lâu một lần). Ví dụ: \"I usually go to a café about twice a week. I often go on Saturday mornings with my friends.\"\nKhuôn cho câu 30 giây: nêu lựa chọn hoặc ý kiến, đưa hai lý do, mỗi lý do một câu, rồi một câu kết. \"I think the most important thing is… First, … Also, … So that's why…\"\nMẹo cho 3 giây chuẩn bị: lấy lại chính các từ trong câu hỏi để mở đầu câu trả lời. Hỏi \"How often do you use public transportation?\" thì mở bằng \"I use public transportation…\". Cách này cho bạn thêm một giây để nghĩ phần còn lại và bảo đảm câu đúng ngữ pháp.\nKhông cần nói thật. Nếu bạn không bao giờ đi cà phê, cứ bịa một câu trả lời đơn giản. Bài thi chấm tiếng Anh, không chấm sự thật.\n[S5]\n>Imagine that a marketing firm is doing research in your country. You have agreed to participate in a telephone interview about cafés.\nHow often do you go to a café, and who do you usually go with?|I go to a café about twice a week. I usually go with my friends from work, especially on Friday afternoons.\nWhat do you usually order when you go to a café?|I usually order an iced coffee with milk. Sometimes I also order a piece of cake if I am hungry.\nWhat is the most important thing for you when you choose a café? Why?|For me, the most important thing is a quiet atmosphere. First, I often go to cafés to read or to study, so I need a place without loud music. Also, when I meet my friends, we want to talk comfortably. Good coffee is important too, but I would not go back to a noisy café. So that's why I always choose a quiet one.\n--\n>Imagine that a transportation company is doing research in your city. You have agreed to answer some questions about public transportation.\nHow do you usually travel to work or school?|I usually travel to work by motorbike. It takes me about twenty-five minutes from my house.\nWhen was the last time you used a bus, and where did you go?|The last time I used a bus was last month. I took it to the airport because I didn't want to leave my motorbike there.\nWhat would make you use public transportation more often? Why?|I would use public transportation more often if the buses came more frequently. Right now, I sometimes have to wait twenty minutes, which is too long in the morning. Also, I would like the buses to be cleaner and less crowded. If the service were faster and more comfortable, I would definitely leave my motorbike at home and take the bus to work every day.\n##E4|Speaking câu 8–10: trả lời theo thông tin cho sẵn|Đọc lịch và trả lời như một nhân viên\n>Màn hình hiện một lịch trình hoặc một bảng thông tin. Bạn đóng vai nhân viên trả lời ba câu hỏi của người gọi điện. Câu hỏi chỉ được đọc, không hiện chữ.\n[V]Cụm từ khi đọc lịch\nwill be held|sẽ được tổ chức|The conference ＊ on Friday, May 10, at the Grand Hotel.\nstarts at|bắt đầu lúc|The first session ＊ nine A.M. and ends at ten thirty.\nis scheduled for|được xếp lịch vào|The lunch break ＊ noon in the main dining room.\nwill be led by|sẽ do … phụ trách|The workshop on marketing ＊ Ms. Anna Lee.\naccording to the schedule|theo lịch|＊, there are two sessions in the afternoon.\nI'm afraid|tôi e rằng (báo tin không như mong đợi)|＊ that information is not correct. The meeting is on Tuesday, not Monday.\nactually|thực ra|＊, the fee is fifty dollars, not forty.\nlet me check|để tôi xem|＊ the schedule for you. Yes, the talk begins at two.\nfollowed by|tiếp theo là|There is a short break at three, ＊ a question and answer session.\naltogether|tổng cộng|＊, there are three workshops on the first day.\nthe first one|cái thứ nhất|There are two sessions about sales. ＊ is at ten, and the second is at two.\ntakes place|diễn ra|The closing dinner ＊ in the hotel restaurant at seven.\n[N]\nBạn có 45 giây đọc thông tin trước khi nghe câu hỏi. Hãy đọc theo thứ tự: tiêu đề (sự kiện gì, ngày nào, ở đâu), các cột của bảng, rồi những dòng \"lạ\": mục bị huỷ, phí, ghi chú, hai mục cùng một chủ đề hoặc cùng một người phụ trách.\nBa câu hỏi gần như luôn theo một khuôn. Câu 8 hỏi thông tin cơ bản: ngày, giờ, địa điểm, phí. Câu 9 thường nêu một điều sai để bạn đính chính (\"I heard the lunch is at one. Is that right?\"); hãy mở bằng \"I'm afraid that's not correct. Actually, …\". Câu 10 yêu cầu liệt kê mọi mục thuộc một nhóm (\"Could you tell me about all the sessions on marketing?\") và được đọc hai lần; bạn có 30 giây.\nKhi trả lời, hãy đọc thông tin trong bảng thành câu đầy đủ, có giới từ: \"at nine A.M.\", \"on Friday\", \"in Room B\", \"by Ms. Lee\". Lỗi hay gặp là chỉ đọc cụt lủn \"Nine. Room B.\"\nVới câu 10, dùng từ nối để liệt kê: \"There are two sessions. The first one is… It starts at… The second one is…\".\n[S8]\n@table|Riverside Business Conference, Friday May 10, Grand Hotel|Time,Session,Speaker,Room|9:00–10:00,Opening speech,David Park,Main hall|10:15–11:30,Marketing on social media,Anna Lee,Room A|11:30–12:30,Lunch,,Dining room|1:00–2:15,Managing a small team,Tom Baker,Room B|2:30–3:45,Marketing with video,Anna Lee,Room A|4:00–4:30,Closing remarks,David Park,Main hall\nHello, I'm interested in the conference. What date is it, and where will it be held?|The conference will be held on Friday, May 10, at the Grand Hotel. It starts at nine A.M. with an opening speech in the main hall.\nI heard that lunch is from one to two o'clock. Is that right?|I'm afraid that's not correct. Actually, lunch is scheduled for eleven thirty to twelve thirty, and it takes place in the dining room.\nI'm especially interested in marketing. Could you tell me about all the sessions on that topic?|Sure. According to the schedule, there are two sessions on marketing, and both will be led by Ms. Anna Lee in Room A. The first one is \"Marketing on social media\", which starts at ten fifteen and ends at eleven thirty. The second one is \"Marketing with video\", and it takes place in the afternoon, from two thirty to three forty-five.\n--\n@table|Greenway Community Center: Weekend classes in June|Class,Day,Time,Fee,Teacher|Yoga for beginners,Saturday,9:00–10:00,10 dollars,Mia Park|Cooking: Italian food,Saturday,11:00–1:00,25 dollars,Carlo Rossi|Painting,Sunday,10:00–12:00,15 dollars,Sara Kim|Cooking: Healthy lunches,Sunday,2:00–4:00,25 dollars,Carlo Rossi\nHi, I'd like to take the yoga class. What day and time is it, and how much does it cost?|The yoga class for beginners is on Saturday from nine to ten A.M. The fee is ten dollars, and the teacher is Mia Park.\nI'd also like to try painting. That's on Saturday afternoon, isn't it?|I'm afraid not. Actually, the painting class is on Sunday morning, from ten A.M. to noon. It costs fifteen dollars.\nMy husband loves cooking. Could you give me the details of all the cooking classes?|Of course. In total, there are two cooking classes, and both are taught by Carlo Rossi. The first one is about Italian food. It is on Saturday from eleven A.M. to one P.M. The second one is about healthy lunches, and it takes place on Sunday from two to four P.M. Each class costs twenty-five dollars.\n##E5|Speaking câu 11: nêu ý kiến|Một phút nói có mở, thân, kết\n>Câu cuối và nặng điểm nhất: 45 giây chuẩn bị, 60 giây trình bày ý kiến về một vấn đề quen thuộc của đời sống hoặc công việc.\n[V]Cụm từ để nêu và bảo vệ ý kiến\nin my opinion|theo ý kiến của tôi|＊, working from home is better than working in an office.\nI strongly believe|tôi tin chắc rằng|＊ that every child should learn a foreign language.\nthere are two reasons|có hai lý do|I prefer small companies, and ＊ for this.\nfirst of all|trước hết|＊, a small company gives you more responsibility.\nfor instance|chẳng hạn|Some jobs are stressful. ＊, doctors often work at night.\nwhat is more|hơn nữa|The bus is cheap. ＊, it is better for the environment.\non the other hand|mặt khác|A big city has many jobs. ＊, life there is expensive.\nfrom my experience|theo kinh nghiệm của tôi|＊, people work harder when they like their team.\nit depends on|điều đó tuỳ thuộc vào|I think ＊ the kind of job you have.\nfor these reasons|vì những lý do này|＊, I think online classes are a good idea.\nto sum up|tóm lại|＊, I prefer to travel alone because it gives me more freedom.\nI would rather|tôi thích … hơn|＊ have an interesting job than a high salary.\n[N]\nĐề có ba kiểu: đồng ý hay không (\"Do you agree or disagree with the following statement?\"), chọn một trong hai hoặc ba (\"Which is more important…?\"), và nêu lợi hại (\"What are the advantages of…?\"). Kiểu nào cũng dùng chung một khung.\nKhung 60 giây: mở bài một câu nêu thẳng ý kiến (khoảng 8 giây); lý do một kèm giải thích hoặc ví dụ (khoảng 20 giây); lý do hai kèm ví dụ (khoảng 20 giây); kết một câu nhắc lại ý kiến (khoảng 8 giây).\nTrong 45 giây chuẩn bị: chọn phía ngay trong 5 giây đầu, chọn phía nào bạn dễ nghĩ ra ví dụ hơn, không cần là ý kiến thật. Rồi ghi nhẩm hai từ khoá cho hai lý do và một ví dụ cụ thể từ đời bạn.\nVí dụ cá nhân là cách dễ nhất để nói đủ dài: \"For instance, when I worked at…\", \"From my experience, …\". Giám khảo chấm độ mạch lạc, ngữ pháp, từ vựng và phát âm; ý tưởng chỉ cần hợp lý.\n[S11]\nDo you agree or disagree with the following statement? Employees should be allowed to work from home. Give reasons or examples to support your opinion.|I agree that employees should be allowed to work from home, and there are two reasons for this. First of all, it saves a lot of time. For instance, I spend almost two hours a day traveling to and from my office. If I worked from home, I could use that time to finish my tasks or to rest. What is more, many people can concentrate better at home, because the office is often noisy. From my experience, I write reports much faster when nobody interrupts me. For these reasons, I strongly believe that companies should let their staff work from home, at least a few days a week.\nSome people prefer a job with a high salary. Others prefer a job they enjoy. Which do you think is more important, and why?|In my opinion, a job that you enjoy is more important than a high salary. First of all, we spend about eight hours a day at work, so if we hate our job, we will be unhappy most of the time. For instance, my cousin earned a lot of money at a bank, but he was always tired and stressed, and in the end he quit. On the other hand, people who like their work usually do it well, so they often get promoted and earn more later. To sum up, I would rather have an interesting job, because happiness at work leads to success.\nWhat are the advantages of learning a foreign language online instead of in a classroom? Give reasons or examples to support your opinion.|I think there are two main advantages of learning a language online. First of all, it is flexible. You can study at any time and in any place, which is very useful for people who work full-time. For instance, I study English for thirty minutes every night after dinner, and I could not do that with a classroom course. What is more, online courses are usually cheaper, and many good lessons are even free. Of course, it depends on the student, because you need discipline to study alone. But to sum up, for busy adults, I strongly believe that online learning is the better choice.\n##E6|Writing câu 1–5: viết câu theo ảnh|Một câu đúng, dùng đủ hai từ\n>Năm câu, tổng cộng 8 phút. Mỗi câu cho một ảnh và hai từ; bạn viết đúng một câu tả ảnh, có cả hai từ đó. Mỗi câu chấm từ 0 đến 3 điểm.\n[N]\nĐể được 3 điểm, câu phải thoả ba điều: dùng cả hai từ cho sẵn, đúng ngữ pháp, và nói về điều thấy trong ảnh. Câu không cần dài hay hay. \"The woman is carrying a box\" được trọn điểm như một câu phức tạp.\nBạn được đổi dạng của từ (chia thì, thêm s) và dùng hai từ theo thứ tự nào cũng được, nhưng không được đổi từ loại quá xa và không được bỏ từ nào.\nBa khuôn câu an toàn. Một, hiện tại tiếp diễn cho người: \"A man is + V-ing + …\". Hai, there is / there are cho đồ vật: \"There are some books on the table\". Ba, khi một trong hai từ là liên từ (because, so, while, and) hoặc giới từ (next to, in front of): viết hai mệnh đề ngắn nối bằng liên từ đó, hoặc một câu có cụm giới từ: \"The man is waiting because the bus is late.\"\nCặp từ khó thường có một liên từ phụ thuộc: \"because\", \"while\", \"so that\", \"although\", \"if\". Hãy nhớ mỗi vế đều cần chủ ngữ và động từ.\nChia thời gian: khoảng một phút rưỡi mỗi câu, để lại nửa phút cuối soát chữ hoa đầu câu, dấu chấm, chữ s của động từ và danh từ số nhiều.\n[W1]\n👩📦🚪|Một phụ nữ đang bê một cái hộp lớn đi qua cửa.|woman / carry|A woman is carrying a large box through the door.\n👨‍🍳🍲🥄|Một đầu bếp đang khuấy nồi súp trong bếp.|chef / soup|The chef is stirring a pot of soup in the kitchen.\n📚🪑🪑|Mấy quyển sách đặt trên bàn, cạnh hai cái ghế trống.|books / table|There are some books on the table next to two empty chairs.\n🚌🧍🧍☔|Hai người che ô đứng chờ ở trạm xe buýt trong mưa.|wait / because|Two people are waiting under umbrellas because it is raining.\n👩‍💼📞💻|Một nữ nhân viên vừa nghe điện thoại vừa nhìn màn hình máy tính.|talk / while|The woman is talking on the phone while she looks at her computer.\n🧑‍🔧🚗🔧|Một thợ máy đang sửa một chiếc ô tô trong xưởng.|repair / car|A mechanic is repairing a car in the garage.\n👨‍👧🚲🌳|Một người bố đang dạy con gái đi xe đạp trong công viên.|man / so that|The man is holding the bicycle so that his daughter does not fall.\n🛒👵🍎|Một bà cụ đang chọn táo ở quầy trái cây trong siêu thị.|choose / fruit|An elderly woman is choosing some fruit at the supermarket.\n##E7|Writing câu 6–7: trả lời email|Làm đủ yêu cầu trong 10 phút\n>Hai câu, mỗi câu 10 phút. Bạn đọc một email ngắn và viết thư trả lời theo đúng yêu cầu của đề, ví dụ \"give ONE piece of information and ask TWO questions\". Mỗi câu chấm từ 0 đến 4 điểm.\n[V]Khung câu cho thư trả lời\nthank you for your email|cảm ơn email của bạn|Dear Ms. Lee, ＊ about the new office.\nI am writing to|tôi viết thư để|＊ ask about your delivery service.\nI would like to|tôi muốn|＊ suggest a different date for the meeting.\ncould you please|bạn vui lòng … được không|＊ tell me how much the tickets cost?\nI was wondering if|tôi muốn hỏi liệu|＊ you offer a discount for students.\nplease let me know|vui lòng cho tôi biết|＊ if you need any more information.\nI look forward to hearing from you|tôi mong nhận được hồi âm của bạn|＊ soon. Best regards, Minh.\nI suggest that|tôi đề xuất rằng|＊ we hold the party at a restaurant near the office.\none idea is to|một ý là|＊ send customers a short survey by email.\nanother option would be to|một phương án khác là|＊ meet on Friday morning instead.\nas you requested|như bạn đã yêu cầu|＊, I am sending you the price list.\nbest regards|trân trọng|I will call you tomorrow. ＊, Anna Tran.\n[N]\nDòng yêu cầu ở cuối đề là thứ quyết định điểm: \"In your email, give TWO pieces of information and ask ONE question\", hoặc \"make TWO suggestions\", \"describe ONE problem and make TWO requests\". Thiếu một yêu cầu là tối đa chỉ còn 2 trên 4 điểm, dù viết hay đến đâu.\nKhung thư năm phần, đủ cho mọi đề. Một, lời chào: \"Dear Mr. Kim,\". Hai, câu mở: cảm ơn hoặc nêu lý do viết. Ba, thân thư: mỗi yêu cầu của đề một hoặc hai câu, nên tách thành từng ý rõ ràng. Bốn, câu kết: \"Please let me know if…\", \"I look forward to hearing from you\". Năm, lời chào cuối và tên.\nThông tin và câu hỏi bạn đưa ra hoàn toàn do bạn bịa, miễn là hợp với tình huống trong email gốc. Hãy bịa những thứ dễ viết: ngày giờ, giá tiền, số lượng người, địa điểm.\nMười phút: 1 phút đọc đề và gạch dưới các yêu cầu, 7 phút viết, 2 phút soát. Khi soát, đếm lại: mình đã đưa đủ số thông tin, đủ số câu hỏi chưa? Độ dài hợp lý là 60 đến 100 từ.\n[W6]\nT:From: Sarah Kim, City Sports Center. To: New members. Subject: Welcome to City Sports Center\nThank you for joining City Sports Center. We would like to know more about our new members so that we can serve you better. Could you tell us what kinds of exercise you enjoy and when you usually plan to visit the center? If you have any questions about our classes or facilities, we will be happy to answer them.\n!Respond to the email as a new member of the sports center. In your email, give TWO pieces of information and ask ONE question.\n$Dear Ms. Kim,\n$Thank you for your email. I am happy to be a new member of City Sports Center.\n$As you requested, here is some information about me. First, I enjoy swimming and yoga. Second, I usually plan to visit the center on weekday evenings after work, around seven o'clock.\n$I also have one question. Could you please tell me whether the swimming pool is open on Sundays?\n$I look forward to hearing from you.\n$Best regards, Tran Minh\n--\nT:From: David Lopez, Office Manager. To: All staff. Subject: End-of-year party\nWe are planning the end-of-year party for our team of thirty people, and I would like to hear your ideas. Last year's party at the office was not very popular, so we want to try something different this time. Please send me your suggestions by Friday.\n!Respond to the email as a member of the staff. In your email, make TWO suggestions and ask ONE question.\n$Dear Mr. Lopez,\n$Thank you for asking for our ideas about the end-of-year party.\n$I would like to make two suggestions. First, I suggest that we hold the party at a restaurant near the office, because nobody would have to cook or clean. Another option would be to organize a one-day trip to the beach, where we could play games and have a barbecue together.\n$I also have a question. Could you please tell me how much the company plans to spend per person?\n$Please let me know if I can help with the planning.\n$Best regards, Le Hoa\n--\nT:From: Customer Service, Green Home Furniture. To: Mr. Nguyen. Subject: Your recent order\nThank you for shopping with Green Home Furniture. Our records show that your new desk was delivered last week. We hope you are satisfied with it. If you have experienced any problems with the product or the delivery, please let us know, and we will do our best to help.\n!Respond to the email as the customer. In your email, describe ONE problem and make TWO requests.\n$Dear Customer Service,\n$Thank you for your email about my recent order.\n$Unfortunately, there is a problem with the desk. One of the drawers does not close properly, and there is a long scratch on the top.\n$I would like to make two requests. First, could you please send someone to replace the damaged drawer this week? Second, I was wondering if you could give me a discount because of the scratch.\n$I look forward to hearing from you soon.\n$Best regards, Nguyen Van An\n##E8|Writing câu 8: bài luận nêu ý kiến|300 từ trong 30 phút\n>Câu cuối chiếm phần điểm lớn nhất của bài Writing, chấm từ 0 đến 5. Bạn nêu ý kiến về một vấn đề và bảo vệ nó bằng lý do và ví dụ.\n[V]Cụm từ dựng khung bài luận\nto begin with|trước tiên|＊, working in a team helps people learn from each other.\nfurthermore|hơn thế nữa|The plan is cheap. ＊, it can be finished in one month.\nin contrast|ngược lại|City life is fast. ＊, life in a village is slow and quiet.\nin particular|đặc biệt là|Young people, ＊ students, spend many hours online.\nas a consequence|hệ quả là|He never exercised. ＊, he often felt tired.\nin conclusion|kết luận lại|＊, I believe that the advantages are greater than the disadvantages.\nit is true that|đúng là|＊ experience matters, but training matters too.\none reason is that|một lý do là|I prefer to shop online. ＊ it saves time.\nanother reason is that|một lý do nữa là|＊ online stores offer lower prices.\nthis means that|điều này có nghĩa là|Rents are rising. ＊ young people cannot afford to live downtown.\nfor this reason|vì lý do này|Good managers listen. ＊, their teams trust them.\nin short|nói ngắn gọn|＊, a good leader must be honest and fair.\n[N]\nBố cục bốn hoặc năm đoạn. Mở bài hai đến ba câu: nhắc lại vấn đề bằng lời của mình và nêu rõ ý kiến. Hai hoặc ba đoạn thân bài: mỗi đoạn một lý do, mở bằng câu chủ đề, rồi giải thích và đưa một ví dụ cụ thể. Kết bài hai câu: nhắc lại ý kiến và tóm hai lý do.\nChia 30 phút: 4 phút lập dàn ý (ý kiến, hai hoặc ba lý do, mỗi lý do một ví dụ), 22 phút viết, 4 phút soát lỗi. Đừng viết ngay khi chưa có dàn ý: bài lạc đề hoặc thiếu ví dụ sẽ không qua được mức 3.\nBài cần khoảng 300 từ. Ngắn hơn nhiều thì khó phát triển ý đủ để đạt 4 hay 5 điểm. Với mục tiêu 150 điểm Writing, bạn cần bài luận ở mức 3 đến 4: ý rõ, có ví dụ, lỗi ngữ pháp không cản trở việc hiểu.\nCách có ví dụ nhanh: dùng chính công việc, trường học, gia đình của bạn, hoặc bịa một người quen (\"My former manager, for example, …\"). Ví dụ cụ thể với tên, nơi chốn, kết quả luôn thuyết phục hơn câu chung chung.\nKhi soát, kiểm tra theo từng loại lỗi: chủ ngữ số ít thì động từ có s chưa, thì của động từ có nhất quán không, danh từ đếm được số ít có mạo từ chưa.\n[W8]\nQ:Do you agree or disagree with the following statement? \"It is better to work for a large company than for a small company.\" Give specific reasons and examples to support your opinion.\n$Some people think that a large company is always the best place to work. However, I disagree with this statement. In my opinion, working for a small company is better, especially for people at the beginning of their careers. There are three reasons for this.\n$To begin with, employees in a small company have more responsibility. In a large company, each person usually does one narrow task. In contrast, in a small company, the same person may talk to customers, prepare reports and help with marketing. My first job, for example, was at a travel agency with only eight employees. Within six months, I had learned how to sell tours, manage a budget and solve customer complaints. As a consequence, I gained skills that would have taken years to learn in a big firm.\n$Another reason is that it is easier to be noticed. In a small company, the owner knows every employee by name and can see who works hard. This means that good work is rewarded quickly. A friend of mine was promoted to manager after only two years at a small design company, because the director saw her results every day.\n$Furthermore, the atmosphere in a small company is usually friendlier. People eat lunch together and help each other, so the team feels like a family. It is true that large companies often pay higher salaries and offer better benefits. However, I believe that a friendly workplace is more important for long-term happiness.\n$In conclusion, I believe that a small company is a better choice than a large one. It gives employees more responsibility, faster recognition and a warmer working environment. For these reasons, I would recommend that young people start their careers in a small company.\n--\nQ:Some people prefer to spend their free time alone. Others prefer to spend it with friends or family. Which do you prefer? Give specific reasons and examples to support your opinion.\n$People relax in different ways. Some enjoy being alone, while others feel happiest when they are surrounded by friends or family. Personally, I prefer to spend most of my free time with other people. I have two main reasons for this preference.\n$One reason is that spending time with friends and family makes our relationships stronger. During the week, everyone is busy with work or school, so we hardly have time to talk. Free time is the only chance to really listen to each other. In my family, for instance, we have dinner together every Sunday. We talk about our week, laugh at old stories and plan our holidays. Because of this habit, I feel very close to my parents and my sister, and I know that I can ask them for help at any time.\n$Another reason is that activities are more enjoyable when they are shared. Watching a football match alone is boring, but watching it with friends is exciting. The same is true for traveling. Last summer, I went to Da Lat with three friends. We got lost, the weather was terrible, and our hotel was far from the center. If I had been alone, I would have been upset. With my friends, however, every problem became a funny memory that we still talk about today.\n$It is true that being alone is sometimes necessary. Everyone needs quiet time to rest, to read or to think about the future. In particular, after a stressful week, an evening alone can be very relaxing. However, too much time alone can make a person feel lonely.\n$In short, although I value some quiet time, I prefer to spend my free time with friends and family. It strengthens relationships and makes every activity more fun. For this reason, I always try to keep my weekends free for the people I care about.\n\n##E9|Speaking câu 1–4: luyện thêm|Bốn đoạn đọc to và bốn ảnh\n>Thêm tám đề cho hai dạng đầu của bài Speaking, khó hơn bài E1 và E2 một bậc: đoạn đọc có số, tên riêng và từ dài; ảnh có nhiều người và nhiều lớp chi tiết.\n[N]\nVới đoạn đọc có con số và tên riêng, hãy dùng thời gian chuẩn bị để đọc thầm riêng những chỗ đó hai lần: \"forty percent\", \"the ninth of May\", \"extension two one four\". Sai một con số không mất nhiều điểm, nhưng ngập ngừng trước nó làm hỏng nhịp cả câu.\nTừ nhiều âm tiết cần nhấn đúng trọng âm: FURniture, deLIVery, avAILable, LIGHThouse, umBRELla, asSIStant. Nếu không chắc, hãy bấm nghe giọng mẫu sau khi tự đọc và so sánh.\nVới ảnh đông người, đừng cố tả hết. Chọn một nhóm chính ở giữa hoặc phía trước, tả hành động và trang phục của họ, rồi dành một câu cho những người còn lại (\"In the background, several other people are…\") và một câu cho khung cảnh.\nSau mỗi câu, hãy nghe lại bản ghi âm của mình và tự hỏi: mình có nói đủ 30 giây không, có câu nào thiếu động từ \"is / are\" không?\n[S1]\nGood morning, and welcome aboard the City Bay Cruise. During our ninety-minute trip, we will pass the old harbor, the fish market, and the famous Lighthouse Bridge. Coffee, tea, and light snacks are available on the lower deck. Please stay seated while the boat is leaving the pier.\nDo you need new furniture for your home or office? Visit Parker's Furniture this weekend and save up to forty percent on sofas, desks, and dining tables. We offer free delivery within the city, and our friendly staff will help you choose the perfect style. Parker's Furniture, on the corner of Fifth and Main.\nAnd now for the weather. Tomorrow will be cloudy in the morning, with a high of twenty-two degrees. Rain is expected in the afternoon, so don't forget your umbrella, your raincoat, and your boots. The weekend, however, will be warm, dry, and sunny.\nYou have reached the office of Doctor Susan Park. I am away from my desk until Thursday, the ninth of May. If your call is urgent, please contact my assistant, Mr. James Lee, at extension two one four. Otherwise, leave your name, number, and a short message after the tone.\n[S3]\n👥🪑📊👩‍🏫🖥️|Trong phòng họp, một phụ nữ đứng cạnh màn hình chiếu biểu đồ và đang thuyết trình; năm người ngồi quanh bàn nghe, vài người ghi chép; trên bàn có máy tính xách tay và cốc nước.|This is a picture of a business meeting. On the left side, a woman is standing next to a screen and giving a presentation. She is pointing at a chart, so she is probably explaining some sales figures. In the middle of the picture, five people are sitting around a long table. Some of them are taking notes, and others are looking at the screen. On the table, there are several laptops and glasses of water. Everyone is wearing formal clothes. Overall, they seem to be listening carefully.\n🍽️👨‍🍳🧑‍🤝‍🧑🍷🕯️|Trong một nhà hàng, người phục vụ đang rót nước cho một cặp đôi ngồi ở bàn cạnh cửa sổ; trên bàn có nến và đĩa thức ăn; phía sau là các bàn khác có khách.|This picture was taken in a restaurant. In the foreground, a waiter is pouring water for a man and a woman who are sitting at a table near the window. There are some plates of food and a candle on the table, so I think they are having dinner. The couple are smiling, and they seem to be enjoying the evening. In the background, I can see other tables with more customers. The restaurant looks quite busy but comfortable. It is probably a popular place.\n🏗️👷‍♂️👷‍♀️📐🦺|Ở một công trường, hai kỹ sư đội mũ bảo hộ đang xem bản vẽ; phía sau là một toà nhà đang xây và một chiếc cần cẩu.|This is a picture of a construction site. In the foreground, a man and a woman are standing together and looking at a large plan. They are both wearing helmets and safety jackets, so they are probably engineers. The woman is pointing at something on the paper, and the man is listening to her. In the background, there is a building under construction and a tall crane. The sky is clear, so it looks like a good day for working outside. Overall, they seem to be discussing the next step of the project.\n🛫🧳🧍‍♀️🧍‍♂️🧒📱|Tại sảnh sân bay, một gia đình ba người đứng xếp hàng với va li; người mẹ cầm hộ chiếu, đứa trẻ nhìn điện thoại; phía sau là bảng thông tin chuyến bay.|This picture shows an airport. In the middle, a family of three is waiting in line with their luggage. The mother is holding some passports, and the father is pulling two large suitcases. Their child is looking at a phone and does not seem interested in the line. In the background, there is a large board with flight information, and many other travelers are walking around. The family is wearing light clothes, so they are probably going on a summer vacation. It looks like a busy day at the airport.\n##E10|Speaking câu 5–7: luyện thêm|Ba chủ đề, chín câu hỏi\n>Thêm ba bộ câu hỏi khảo sát. Mục tiêu của bài: không câu nào bắt đầu chậm quá hai giây sau tiếng bíp, và câu 30 giây nào cũng có đủ hai lý do.\n[N]\nCác chủ đề của câu 5–7 xoay quanh đời sống: mua sắm, ăn uống, đi lại, giải trí, công nghệ, sức khoẻ, nơi ở, bạn bè. Hãy chuẩn bị sẵn cho mỗi chủ đề hai, ba \"sự thật\" về bản thân (thật hoặc bịa) để dùng đi dùng lại: bạn hay mua gì, ở đâu, bao lâu một lần, với ai.\nCâu hỏi 15 giây thường là câu hỏi kép (\"How often… and where…?\"). Phải trả lời cả hai vế. Nếu chỉ trả lời một vế, bạn mất điểm nội dung dù nói rất trôi chảy.\nCâu hỏi 30 giây thường có dạng \"Which… and why?\", \"What are the advantages of…?\", \"Would you prefer… or…? Why?\", \"Describe…\". Khuôn vẫn như cũ: ý kiến, lý do một, lý do hai, câu chốt. Dùng \"First\", \"Also\" và \"So\" để người nghe theo được.\nKhi luyện, hãy che câu trả lời mẫu, trả lời xong mới xem. Mẫu chỉ là một cách; điều cần học ở mẫu là độ dài và cách nối ý.\n[S5]\n>Imagine that a marketing firm is doing research in your country. You have agreed to participate in a telephone interview about online shopping.\nHow often do you shop online, and what do you usually buy?|I shop online about two or three times a month. I usually buy clothes and books, and sometimes small things for my kitchen.\nWhen you buy something online, how do you usually pay for it?|I usually pay by bank transfer, because it is fast. For expensive items, though, I prefer to pay in cash when the package arrives.\nWhat are the advantages of shopping online compared with shopping in a store? Why?|I think online shopping has two main advantages. First, it saves a lot of time. I can order something in five minutes during my lunch break, and I don't have to drive to a store. Also, it is easy to compare prices. I can check three or four websites and choose the cheapest one. So, for busy people like me, shopping online is much more convenient than going to a store.\n--\n>Imagine that a sports magazine is preparing an article about exercise habits. You have agreed to answer some questions about exercise.\nWhat kind of exercise do you do, and how often do you do it?|I go jogging in a park near my house. I do it three times a week, usually early in the morning before work.\nDo you prefer to exercise alone or with other people?|I prefer to exercise with other people. I usually jog with my neighbor, because it is easier to get up early when someone is waiting for me.\nDo you think companies should give employees time to exercise during the workday? Why or why not?|Yes, I think companies should give employees time to exercise. First, exercise reduces stress, so employees can concentrate better in the afternoon. Also, healthy workers take fewer sick days, which saves the company money. For example, my friend's company has a short yoga class at lunchtime, and she says everyone feels more energetic afterward. So I believe it is good for both the staff and the company.\n--\n>Imagine that a local newspaper is doing a survey about your neighborhood. You have agreed to answer some questions about the area where you live.\nHow long have you lived in your neighborhood, and what kind of housing do you live in?|I have lived in my neighborhood for about six years. I live in a small apartment on the fourth floor of a ten-story building.\nWhere do people in your neighborhood usually go to buy food?|Most people go to the traditional market in the morning because the vegetables are fresh and cheap. There is also a small supermarket that stays open until ten at night.\nIf you could change one thing about your neighborhood, what would it be? Why?|If I could change one thing, I would add a park. Right now, there are many buildings but almost no green space. First, children have nowhere to play, so they play in the street, which is dangerous. Also, older people need a quiet place to walk and exercise in the morning. A small park with trees and benches would make the neighborhood healthier and much more pleasant for everyone.\n##E11|Speaking câu 8–10: luyện thêm|Ba bảng thông tin\n>Thêm ba bảng ở ba kiểu khác nhau: lịch phỏng vấn, lịch trình chuyến đi và chương trình sự kiện của một cửa hàng. Ở cả ba, câu 9 đều chứa một thông tin sai cần đính chính.\n[N]\nBa kiểu bảng hay gặp. Lịch hội nghị hoặc lớp học: chú ý người phụ trách xuất hiện hai lần và giờ nghỉ trưa. Lịch phỏng vấn hoặc lý lịch ứng viên: chú ý vị trí ứng tuyển, kinh nghiệm, người phỏng vấn. Lịch trình chuyến đi: chú ý giờ bay, tên khách sạn, các cuộc hẹn từng ngày.\nCâu 9 có ba cách gài thông tin sai: sai giờ hoặc ngày, sai địa điểm, hoặc hỏi về một mục đã bị huỷ (\"canceled\") hay đã chuyển (\"moved to\"). Hãy tìm những chữ đó trong bảng ngay ở 45 giây đọc đầu tiên.\nKhi đính chính, đừng chỉ nói \"No\". Mẫu đầy đủ: \"I'm afraid that's not correct. Actually, [thông tin đúng].\" Rồi thêm một chi tiết nữa nếu còn thời gian.\nCâu 10 dài 30 giây: hãy đọc trọn từng mục thành câu, có giờ, địa điểm và người phụ trách. Nếu còn thừa thời gian, thêm một câu như \"So you have two options\".\n[S8]\n@table|Brightway Company: Interview schedule, Monday June 3, Room 204|Time,Candidate,Position,Interviewer|9:00,Kevin Brooks,Sales assistant,Ms. Park|10:00,Laura Chen,Accountant,Mr. Ortiz|11:00,Daniel Cruz,Sales assistant,Ms. Park|1:30,Sara Novak,Marketing manager,Mr. Ortiz|2:30,Canceled,,\nHello, this is Ms. Park. I've lost my copy of the schedule. What time is my first interview, and who is it with?|Good morning, Ms. Park. Your first interview is at nine A.M. with Mr. Kevin Brooks, and it will be held in Room 204.\nI believe the last interview of the day is at two thirty. Is that right?|I'm afraid that's not correct. Actually, the two thirty interview has been canceled. The last interview is at one thirty, and it is with Mr. Ortiz, not with you.\nCould you give me the details of all the candidates for the sales assistant position?|Certainly. There are two candidates for the sales assistant position, and you will interview both of them. The first one is Mr. Kevin Brooks, and his interview is scheduled for nine A.M. The second one is Mr. Daniel Cruz. His interview starts at eleven A.M. Both interviews take place in Room 204.\n--\n@table|Itinerary for Mr. Alan Reed: Business trip to Singapore|Day,Time,Activity,Place|Mon May 6,8:15 A.M.,Flight SQ 185 departs,Ho Chi Minh City|Mon May 6,2:00 P.M.,Meeting with Lion Trading,Lion Tower|Tue May 7,9:30 A.M.,Factory tour,Jurong|Tue May 7,7:00 P.M.,Dinner with clients,Marina Hotel|Wed May 8,10:40 A.M.,Flight SQ 186 returns,Singapore\nHi, this is Alan Reed. What time does my flight leave on Monday, and what is the flight number?|Hello, Mr. Reed. Your flight leaves at eight fifteen A.M. on Monday, May 6, and the flight number is SQ 185.\nI'm having dinner with the clients on Monday evening, right?|I'm afraid not. Actually, the dinner with clients is scheduled for Tuesday, May 7, at seven P.M. It will be held at the Marina Hotel.\nCould you tell me everything I have planned for Tuesday?|Of course. You have two activities on Tuesday, May 7. The first one is a factory tour in Jurong, which starts at nine thirty in the morning. After that, you are free in the afternoon. Then, at seven P.M., you have dinner with clients at the Marina Hotel. Your return flight is the next morning.\n--\n@table|Garden World: Free events in April|Date,Event,Time,Place|Sat April 6,Growing vegetables at home,10:00–11:30,Greenhouse|Sat April 13,Flower arranging for beginners,2:00–3:30,Main store|Sat April 20,Growing herbs in small spaces,10:00–11:00,Greenhouse|Sat April 27,Children's planting day,9:00–12:00,Garden area\nHi, I saw your advertisement. How much do the events cost, and when is the first one?|All of the events in April are free. The first one is on Saturday, April 6. It is about growing vegetables at home, and it starts at ten A.M.\nI'd like to bring my kids to the children's planting day. That's on April 20, isn't it?|I'm afraid that's not right. Actually, the children's planting day is on Saturday, April 27, from nine A.M. to noon. It takes place in the garden area.\nI want to learn how to grow food at home. Which events would be useful for me?|There are two events that would be useful for you, and both are held in the greenhouse. The first one is \"Growing vegetables at home\" on April 6, from ten to eleven thirty A.M. The second one is \"Growing herbs in small spaces\" on April 20. It starts at ten A.M. and lasts one hour.\n##E12|Speaking câu 11: luyện thêm|Bốn đề ý kiến\n>Bốn đề thuộc ba kiểu hỏi, mỗi đề có một câu trả lời mẫu dài khoảng 60 giây. Hãy tự nói trước, ghi âm, rồi mới so với mẫu.\n[N]\nKiểu một, đồng ý hay không: chọn một phía và giữ nguyên đến hết. Đừng nói \"both are good\"; bạn sẽ không đủ thời gian phát triển cả hai phía.\nKiểu hai, chọn một trong ba: \"Which of the following is the most important quality for a manager: honesty, experience, or communication skills?\". Chọn một cái, đưa hai lý do, và có thể dùng một câu để nói vì sao hai cái kia kém quan trọng hơn.\nKiểu ba, lợi và hại: \"What are the advantages and disadvantages of…?\". Nói một hoặc hai lợi ích, một bất lợi, rồi kết bằng nhận định của bạn.\nTự kiểm tra bản ghi âm theo bốn câu hỏi: trong mười giây đầu mình đã nêu ý kiến chưa? Có đủ hai lý do không? Mỗi lý do có ví dụ hoặc giải thích không? Mình có câu kết trước khi hết giờ không? Nếu bị ngắt giữa câu khi hết 60 giây, lần sau hãy rút ngắn ví dụ.\n[S11]\nDo you agree or disagree with the following statement? Companies should hire young people rather than older, more experienced workers. Give reasons or examples to support your opinion.|I disagree with this statement. In my opinion, companies should not choose young people only because of their age, and there are two reasons for this. First of all, experienced workers make fewer mistakes. For instance, in my office, the oldest accountant always notices errors that the rest of us miss, and this saves the company a lot of money. What is more, older workers can train young employees. Without them, new staff would learn much more slowly. Of course, young people have energy and new ideas, so the best team has both. To sum up, I believe companies should hire the best person for the job, whatever their age.\nWhich of the following is the most important quality for a good manager: honesty, experience, or communication skills? Choose one and explain why.|I think the most important quality for a good manager is communication skills. First of all, a manager has to explain goals clearly. If the team does not understand what to do, even hard-working people will waste time. For instance, my former manager always wrote a short list of tasks every Monday, so everyone knew exactly what was expected. What is more, a manager with good communication skills listens to the staff. When employees feel that someone listens to their problems, they are happier and work better. Honesty and experience are important too, but without good communication, a manager cannot use them well. For these reasons, I would choose communication skills.\nWhat are the advantages and disadvantages of living in a big city? Give reasons or examples to support your opinion.|Living in a big city has both advantages and disadvantages. The biggest advantage is opportunity. There are more jobs, better schools, and larger hospitals in a city. For instance, most international companies in my country have their offices in Hanoi or Ho Chi Minh City, so young people move there to find good jobs. Another advantage is convenience, because shops and restaurants are open late. On the other hand, the main disadvantage is the cost of living. Rent is very high, and traffic and air pollution are serious problems. To sum up, I think a big city is a good place for young people who want to build a career, but it is not ideal for everyone.\nSome companies allow employees to wear casual clothes to work. Do you think this is a good idea? Why or why not?|Yes, I think allowing casual clothes at work is a good idea, and there are two reasons for this. First of all, people work better when they feel comfortable. For instance, in the summer in my country, wearing a suit and tie is really hot, and it is hard to concentrate. What is more, casual clothes save money, because employees don't need to buy expensive formal clothes. From my experience, my team became more relaxed and friendly after our company changed its dress code. Of course, staff who meet customers should still dress neatly. But for these reasons, I strongly believe that a casual dress code is good for most offices.\n\n##E13|Writing câu 1–7: luyện thêm|Mười câu theo ảnh và ba email\n>Thêm đề cho hai dạng đầu của bài Writing. Các cặp từ ở đây khó hơn bài E6: nhiều cặp có liên từ hoặc giới từ, buộc bạn viết câu có hai vế.\n[N]\nCặp từ có liên từ phụ thuộc (because, although, until, after, so that, while) cần câu hai mệnh đề: \"The man is still working although it is very late.\" Mỗi mệnh đề phải có chủ ngữ và động từ riêng. Riêng \"after\" và \"before\" có thể đi với V-ing: \"after eating a cookie\".\nCặp từ có giới từ (in front of, next to, between, on) chỉ cần một câu đơn có cụm chỉ vị trí: \"Two tourists are taking a photo in front of the museum.\"\nKhi cả hai từ là danh từ, hãy tìm một động từ nối chúng: \"boxes / truck\" thành \"A worker is loading boxes onto a truck.\" Khi một từ là động từ, hãy chia nó ở hiện tại tiếp diễn.\nVới email, hãy tập thói quen đánh số các yêu cầu trong đầu trước khi viết: \"TWO suggestions, ONE piece of information\" là ba việc. Viết xong, đếm lại đủ ba chưa. Đề \"ask THREE questions\" là dạng dễ nhất nếu bạn thuộc các khung \"Could you tell me…?\", \"I was wondering if…\", \"Do I need to…?\".\n[W1]\n👨‍💼📄🖨️|Một người đàn ông đang lấy giấy ra khỏi máy in.|man / printer|A man is taking some paper out of the printer.\n👩‍🏫👧👦📖|Cô giáo đang đọc sách cho hai đứa trẻ nghe.|read / children|The teacher is reading a book to two children.\n🚗🚗🚦|Mấy chiếc ô tô dừng lại chờ đèn đỏ.|cars / until|The cars are waiting until the light turns green.\n👨‍🍳🍕🔥|Một đầu bếp đang đưa bánh pizza vào lò.|put / oven|The chef is putting a pizza into the oven.\n👩‍💼☂️🌧️|Một phụ nữ mở ô vì trời bắt đầu mưa.|umbrella / because|The woman is opening her umbrella because it has started to rain.\n🧑‍🤝‍🧑📸🏛️|Hai du khách đang chụp ảnh trước một bảo tàng.|tourists / in front of|Two tourists are taking a photo in front of the museum.\n🧑‍💻☕🌙|Một người đàn ông vẫn ngồi làm việc dù trời đã khuya.|work / although|The man is still working although it is very late.\n📦🚚👷|Một công nhân đang chất các thùng hàng lên xe tải.|boxes / truck|A worker is loading boxes onto a truck.\n👩‍⚕️👴💊|Một nữ bác sĩ đang giải thích cho một cụ ông cách uống thuốc.|doctor / explain|The doctor is explaining how to take the medicine.\n🧒🥛🍪|Một cậu bé uống sữa sau khi ăn bánh quy.|drink / after|The boy is drinking some milk after eating a cookie.\n[W6]\nT:From: Helen Ford, Personnel Office. To: All staff. Subject: Staff training day\nWe are planning a training day for all staff next month. To make the day as useful as possible, we would like to know which topics you are interested in. Please also let us know if there is any day of the week when you cannot attend.\n!Respond to the email as a member of the staff. In your email, make TWO suggestions and give ONE piece of information.\n$Dear Ms. Ford,\n$Thank you for your email about the staff training day.\n$I would like to suggest two topics. First, I suggest that we have a session on how to give presentations, because many of us have to speak in front of customers. Another idea is to offer a short course on the new accounting software, which some staff still find difficult.\n$As for my schedule, I cannot attend on Wednesdays because I visit customers outside the office on that day.\n$Please let me know if you need any more information.\n$Best regards, Pham Thu\n--\nT:From: Reservations, Ocean View Hotel. To: Mr. Tran. Subject: Your reservation\nThank you for choosing the Ocean View Hotel. We are pleased to confirm your reservation for a double room from August 12 to August 15. If you have any questions about the hotel or any special requests for your stay, please let us know before you arrive.\n!Respond to the email as the guest. In your email, ask TWO questions and make ONE request.\n$Dear Reservations Team,\n$Thank you for confirming my reservation.\n$I have two questions about the hotel. First, could you please tell me whether breakfast is included in the room price? Second, I was wondering if the hotel has a shuttle bus from the airport.\n$I would also like to make a request. If possible, I would like a quiet room on a high floor with a view of the sea.\n$I look forward to hearing from you.\n$Best regards, Tran Quoc Bao\n--\nT:From: Mark Evans. To: Sales team. Subject: My leave next week\nAs you know, I will be on leave all next week. Lisa has kindly agreed to take over the Northfield project while I am away. Lisa, please tell me what information you need from me before Friday so that everything goes smoothly.\n!Respond to the email as Lisa. In your email, ask THREE questions.\n$Dear Mark,\n$Thank you for your email. I am happy to take over the Northfield project next week.\n$To prepare, I have three questions. First, could you tell me who my main contact at Northfield is and how I can reach that person? Second, are there any deadlines next week that I should know about? Third, where can I find the latest version of the contract?\n$I hope you have a relaxing week.\n$Best regards, Lisa\n##E14|Writing câu 8: luyện thêm|Lập dàn ý trong bốn phút và hai bài mẫu\n>Bài luận quyết định bạn đạt 130 hay 160 điểm Writing. Bài này tập trung vào bước nhiều người bỏ qua nhất: dàn ý.\n[N]\nDàn ý bốn phút cho mọi đề, viết ra giấy nháp bằng từ khoá, không viết câu. Dòng một: ý kiến của bạn, một cụm. Dòng hai và ba: hai lý do, mỗi lý do kèm một ví dụ cụ thể (ai, ở đâu, kết quả gì). Dòng bốn: một ý nhượng bộ (\"It is true that…\") để cho thấy bạn nhìn cả hai mặt. Dòng năm: ý kết.\nTừ dàn ý đó, mỗi dòng thành một đoạn. Đoạn thân bài viết theo trật tự: câu chủ đề, giải thích, ví dụ, hệ quả. Bốn câu như vậy đã được khoảng 70 từ; hai đoạn thân bài cộng đoạn nhượng bộ, mở và kết là đủ 300 từ.\nBa kiểu đề: đồng ý hay không; chọn một trong hai lối sống hoặc cách làm; nêu lợi và hại. Với đề lợi và hại, vẫn nên chốt ở kết bài rằng theo bạn bên nào nặng hơn.\nNhững thứ kéo điểm xuống mức 2: lạc đề, không có ví dụ, cả bài là một đoạn, hoặc lỗi ngữ pháp dày đến mức khó hiểu. Những thứ đưa điểm lên mức 4: bố cục rõ, lý do có ví dụ, từ nối đa dạng, và phần lớn câu không sai.\n[W8]\nQ:What are the advantages and disadvantages of having a part-time job while studying at university? Give specific reasons and examples to support your opinion.\n$Many university students have a part-time job while they study. Some people think this is a good way to prepare for the future, while others worry that it harms students' education. In my opinion, a part-time job has more advantages than disadvantages, as long as students do not work too many hours.\n$To begin with, a part-time job teaches skills that are not taught in the classroom. Students learn how to arrive on time, how to work in a team and how to talk to customers. When I was a student, for example, I worked in a bookstore every weekend. At first I was too shy to speak to customers, but after a few months I could answer their questions with confidence. This experience helped me a great deal when I had my first job interview.\n$Another advantage is financial. University is expensive, and many families cannot easily pay for tuition, books and housing. A student who earns even a small salary can pay for some of these costs and feel more independent. My roommate, for instance, paid for all her textbooks with the money she earned at a café. Furthermore, students who earn their own money usually spend it more carefully.\n$It is true that there are disadvantages. The most serious one is a lack of time. A student who works twenty hours a week has less time to study and to sleep. As a consequence, he or she may be too tired to concentrate in class, and grades may fall. In particular, working late at night before an exam is a bad idea. For this reason, I believe students should work no more than ten or twelve hours a week.\n$In conclusion, working part-time gives students useful experience and some financial independence. Although it can take time away from studying, this problem can be controlled by limiting working hours. For these reasons, I think a part-time job is a valuable part of university life.\n--\nQ:Do you agree or disagree with the following statement? \"Technology has made people's lives more stressful.\" Give specific reasons and examples to support your opinion.\n$Smartphones, email and social media were invented to make our lives easier. However, many people now feel busier and more tired than ever. I agree with the statement that technology has made people's lives more stressful, for two main reasons.\n$One reason is that technology has removed the line between work and rest. In the past, when employees left the office, their working day was finished. Today, they receive emails and messages in the evening, at weekends and even on holiday. My sister, for example, works for an international company. Her manager often sends her messages at eleven o'clock at night, and she feels that she must reply immediately. As a consequence, she can never completely relax.\n$Another reason is that we receive too much information. Every day, we see hundreds of news stories, advertisements and posts from friends. It is difficult to decide what is important, and many people feel that they are always behind. In particular, social media makes people compare their lives with the perfect photos of others. A friend of mine checks her phone more than a hundred times a day and says she cannot stop. This means that even free time can become a source of worry instead of rest.\n$It is true that technology also reduces some kinds of stress. We can pay bills in one minute, find directions easily and talk to relatives in other countries for free. I use these services every day, and I would not want to lose them. In contrast to these small conveniences, however, the pressure of being available all the time is much greater.\n$In short, I believe that technology has made life more stressful because it follows us everywhere and gives us more information than we can handle. To solve this problem, we should set clear rules for ourselves, such as turning off our phones during meals and after nine o'clock at night.\n##E15|Thi thử Speaking và Writing số 1|Đủ 11 câu nói và 8 câu viết\n>Bài thi thử trọn vẹn đầu tiên. Phần nói mất khoảng 20 phút, phần viết khoảng 60 phút. Hãy làm mỗi phần một mạch, không dừng giữa chừng, rồi mới xem bài mẫu.\n[N]\nPhần nói gồm đủ 11 câu theo đúng thứ tự và thời gian của bài thi: hai đoạn đọc to, hai ảnh, ba câu hỏi khảo sát, một bảng thông tin với ba câu hỏi, và một câu nêu ý kiến. Hãy ghi âm cả buổi bằng điện thoại. Đừng bấm xem câu trả lời mẫu giữa chừng.\nPhần viết gồm năm câu theo ảnh (8 phút), hai email (mỗi email 10 phút) và một bài luận (30 phút), tổng cộng 58 phút trên một đồng hồ chung. Trong bài thi thật, mỗi phần có đồng hồ riêng và bạn không quay lại phần trước được; ở đây hãy tự giữ đúng giới hạn đó.\nCách tự ước lượng. Speaking: nếu bạn nói đủ thời gian ở hầu hết các câu, trả lời đúng trọng tâm, và người nghe hiểu được dù còn lỗi, bạn đang ở khoảng 130 đến 160. Writing: năm câu ảnh hầu hết đúng, hai email đủ yêu cầu, bài luận có bố cục và ví dụ, tương ứng khoảng 140 đến 170. Đây chỉ là ước lượng thô; điểm thật do giám khảo chấm.\nSau khi làm xong, hãy ghi lại ba lỗi lặp lại nhiều nhất của mình và quay về bài E1 đến E8 tương ứng trước khi làm bài thi thử số 2.\n[S1]\nAttention, passengers. The seven fifteen express train to Central Station will depart from platform three, not platform five. We apologize for this change. Please have your tickets, passes, or mobile passes ready for inspection. Thank you for traveling with City Rail.\nIs your computer slow, noisy, or out of date? Bring it to Tech Care, where our experienced technicians repair laptops, tablets, and phones while you wait. This month only, every repair comes with a free cleaning and a six-month guarantee. Tech Care: fast, friendly, and reliable.\n[S3]\n📚👩‍🎓👨‍🎓💻🪟|Trong thư viện, hai sinh viên ngồi cạnh nhau ở bàn dài; cô gái đang gõ máy tính xách tay, chàng trai đọc sách và ghi chép; phía sau là các giá sách cao.|This is a picture of a library. In the foreground, two students are sitting next to each other at a long table. The woman is typing on a laptop, and the man is reading a book and taking notes. They both seem to be concentrating, so they are probably preparing for an exam. On the table, there are some books and a bottle of water. In the background, I can see tall shelves full of books. The library looks quiet and bright. Overall, it seems to be a good place to study.\n🚲🧑‍🤝‍🧑🌉🌇|Hai người đạp xe dọc bờ sông lúc chiều muộn; phía xa có một cây cầu và các toà nhà của thành phố.|This picture was taken next to a river. In the middle of the picture, two people are riding bicycles along a path. They are wearing helmets and sports clothes, so they are probably exercising after work. On the right side, I can see the river, and in the background there is a long bridge and some tall buildings. The sky is orange, so it looks like early evening. There are not many other people on the path. Overall, they seem to be enjoying a relaxing ride.\n[S5]\n>Imagine that a media company is doing research in your country. You have agreed to participate in a telephone interview about watching movies.\nHow often do you watch movies, and where do you usually watch them?|I watch movies about once a week. I usually watch them at home on my laptop, but sometimes I go to the cinema with my friends.\nWhat kind of movies do you like best?|I like comedies best, because they help me relax after a long week. I also enjoy action movies with a good story.\nDo you prefer watching a movie at home or at a cinema? Why?|I prefer watching movies at home. First, it is much cheaper, because a cinema ticket and snacks cost a lot. Also, at home I can stop the movie whenever I want and sit comfortably on my sofa. Of course, the screen and the sound are better at a cinema, so I go there for big action movies. But most of the time, I think home is more convenient.\n[S8]\n@table|Lakeview Language School: Summer courses, July 1–26|Course,Days,Time,Teacher,Fee|Business English,Mon and Wed,6:00–8:00 P.M.,David Hall,180 dollars|Conversation for beginners,Tue and Thu,6:00–7:30 P.M.,Emma Stone,120 dollars|Exam preparation,Saturday,9:00–12:00,David Hall,150 dollars|Pronunciation workshop,Friday,6:00–7:00 P.M.,Emma Stone,60 dollars\nHello, I'd like some information about the summer courses. When do they start and finish?|The summer courses start on July 1 and finish on July 26, so they run for four weeks.\nI heard that the exam preparation course is on Sunday mornings. Is that correct?|I'm afraid that's not correct. Actually, the exam preparation course is on Saturday, from nine A.M. to noon. The fee is one hundred fifty dollars.\nI'd like to study with Ms. Stone. Could you tell me about the courses she teaches?|Sure. Ms. Emma Stone teaches two courses this summer. The first one is \"Conversation for beginners\". It is on Tuesdays and Thursdays from six to seven thirty P.M., and it costs one hundred twenty dollars. The second one is the pronunciation workshop, which takes place on Fridays from six to seven P.M. The fee for that one is sixty dollars.\n[S11]\nDo you agree or disagree with the following statement? It is better to save money for the future than to spend it on travel. Give reasons or examples to support your opinion.|I disagree with this statement. In my opinion, spending some money on travel is just as important as saving, and there are two reasons for this. First of all, travel teaches us things we cannot learn at home. For instance, when I visited Japan two years ago, I learned a lot about how people there work and respect each other, and it changed the way I do my job. What is more, we should travel while we are young and healthy. If we wait until we retire, we may not have the energy. Of course, saving is necessary, so I put a part of my salary in the bank every month. But to sum up, I believe a balance is best.\n[W1]\n🧑‍🍳🥗🥄|Một đầu bếp đang trộn món rau trong một cái bát lớn.|mix / bowl|The chef is mixing a salad in a large bowl.\n👩‍💼👨‍💼🤝🏢|Hai doanh nhân bắt tay nhau trước một toà nhà văn phòng.|shake / building|Two businesspeople are shaking hands in front of an office building.\n🚶‍♀️🐕🌳|Một phụ nữ dắt chó đi dạo trong công viên.|woman / walk|A woman is walking her dog in the park.\n👨‍🔧💡🪜|Một người thợ đứng trên thang để thay bóng đèn.|ladder / so that|The man is standing on a ladder so that he can change the light.\n🧑‍🎓📱🚌|Một sinh viên xem điện thoại trong khi chờ xe buýt.|phone / while|The student is looking at his phone while he waits for the bus.\n[W6]\nT:From: Julia Stone, City Bookstore. To: Book club members. Subject: Next month's meeting\nDear members, we are preparing for next month's book club meeting, and we would like your help. We have not yet chosen the book or the date. Please tell us which book you would like to discuss and when you are free.\n!Respond to the email as a member of the book club. In your email, make ONE suggestion and give TWO pieces of information.\n$Dear Ms. Stone,\n$Thank you for your email about next month's meeting.\n$I would like to suggest that we read a travel book, because many members said that they enjoy stories about other countries.\n$As for my schedule, I am free on Saturday afternoons and on Thursday evenings after seven o'clock. I should also tell you that I will be away from the fifteenth to the twentieth, so I cannot attend during that week.\n$I look forward to hearing which book you choose.\n$Best regards, Ngo Lan\n--\nT:From: Peter Chan, Bright Office Supplies. To: Ms. Vo. Subject: Your inquiry\nDear Ms. Vo, thank you for your interest in our products. We sell a wide range of office furniture and equipment, and we deliver to all parts of the city. Please let us know what your office needs, and we will be happy to send you a price list.\n!Respond to the email as Ms. Vo. In your email, give ONE piece of information and ask TWO questions.\n$Dear Mr. Chan,\n$Thank you for your reply.\n$Our company is moving to a new office next month, and we need twenty desks and twenty office chairs for our staff.\n$I have two questions. First, could you please tell me whether you offer a discount for large orders? Second, I was wondering how long delivery usually takes after an order is placed.\n$I look forward to receiving your price list.\n$Best regards, Vo Thi Mai\n[W8]\nQ:Do you agree or disagree with the following statement? \"Managers should be close friends with the employees they supervise.\" Give specific reasons and examples to support your opinion.\n$Some managers try to become close friends with the people they supervise. They believe that friendship creates a happy team. However, I disagree with the statement. In my opinion, a manager should be friendly and respectful, but should not be a close friend of his or her employees.\n$To begin with, a manager must sometimes make difficult decisions. He or she has to evaluate performance, refuse requests and occasionally tell someone that their work is not good enough. If that person is a close friend, these conversations become very hard. My former manager, for example, was best friends with one member of our team. When this employee started arriving late every day, the manager said nothing, because he did not want to damage the friendship. As a consequence, the rest of us had to do extra work.\n$Another reason is fairness. When a manager spends weekends with one or two employees, the others may feel that those people receive special treatment. Even if the manager is completely fair, it is difficult to convince the team. In my experience, nothing destroys a team faster than the feeling that the boss has favorites. This means that trust inside the group becomes weaker, and people stop sharing their ideas openly.\n$It is true that a cold and distant manager is not good either. Employees work harder for a leader who knows their names, listens to their problems and celebrates their success. For this reason, I think managers should be warm and approachable. They can have lunch with the team and ask about their families. However, there is a clear difference between being kind and being a close friend.\n$In conclusion, I believe that managers should keep a professional distance from the employees they supervise. Close friendship makes honest feedback difficult and can seem unfair to others. A manager who is friendly but professional will earn more respect in the long run.\n##E16|Thi thử Speaking và Writing số 2|Kiểm tra lại sau khi sửa lỗi\n>Bài thi thử thứ hai, cùng cấu trúc với bài số 1 nhưng toàn đề mới. Hãy làm sau khi đã ôn lại những lỗi bạn ghi được ở bài E15.\n[N]\nTrước khi bắt đầu, hãy xem lại ba lỗi bạn ghi ở bài thi thử số 1. Mục tiêu của lần này không phải là hoàn hảo, mà là không lặp lại ba lỗi đó.\nNhắc lại những điều quyết định điểm. Đọc to: âm cuối và ngữ điệu ở chuỗi liệt kê. Tả ảnh: nói đủ 30 giây theo khung bốn bước. Câu 5–7: trả lời cả hai vế của câu hỏi kép. Câu 8–10: đính chính lịch sự, đọc bảng thành câu đầy đủ. Câu 11: ý kiến ngay câu đầu, hai lý do, một câu kết.\nViết: câu theo ảnh dùng đủ hai từ; email làm đủ số yêu cầu; bài luận có dàn ý trước khi viết và có ví dụ cụ thể.\nKhi mở trang trong Claude, bạn có thể nhờ Claude nhận xét phần viết sau khi nộp. Với phần nói, cách tốt nhất vẫn là nghe lại bản ghi âm của mình và so với câu trả lời mẫu, hoặc nhờ một người biết tiếng Anh nghe giúp.\n[S1]\nWelcome to the National Art Gallery audio guide. In this room, you will see paintings, sculptures, and photographs from the nineteenth century. To hear about a work of art, enter its number and press the green button. Please do not touch the art, and remember to keep your voice low.\nThank you for calling the Star Cinema information line. Today's movies begin at one, four, and seven thirty P.M. Tickets cost eight dollars for adults, six dollars for students, and five dollars for children under twelve. To reserve seats, press one, or visit our website at any time.\n[S3]\n☕👩‍🦱👨‍🦰🍰💬|Trong một quán cà phê, hai người bạn ngồi đối diện nhau trò chuyện vui vẻ; trên bàn có hai tách cà phê và một đĩa bánh; phía sau là quầy pha chế và một nhân viên.|This is a picture of a café. In the foreground, a man and a woman are sitting across from each other at a small table. They are talking and smiling, so they are probably good friends. On the table, there are two cups of coffee and a piece of cake. The woman is holding her cup with both hands. In the background, I can see the counter, where a member of staff is making drinks. The café looks warm and comfortable. Overall, they seem to be having a pleasant conversation.\n🛍️🏬👩‍👧🧥|Trong một cửa hàng quần áo, một người mẹ giơ chiếc áo khoác lên cho con gái xem; xung quanh là các giá treo quần áo và một tấm gương lớn.|This picture was taken in a clothing store. In the middle of the picture, a woman is holding up a jacket and showing it to a young girl, who is probably her daughter. The girl is looking at the jacket carefully, and she seems to like it. Around them, there are many clothes hanging on racks. On the right side, there is a large mirror. In the background, I can see another customer near the entrance. It looks like they are shopping for winter clothes.\n[S5]\n>Imagine that a travel magazine is preparing an article about weekend activities. You have agreed to answer some questions about how you spend your weekends.\nWhat do you usually do on weekends, and who do you spend them with?|On weekends, I usually clean my apartment in the morning and go out in the afternoon. I spend most of my weekends with my family or with two close friends.\nWhen was the last time you took a weekend trip, and where did you go?|The last time I took a weekend trip was about two months ago. I went to Vung Tau with my friends, and we stayed there for one night.\nWould you rather spend a weekend in the city or in the countryside? Why?|I would rather spend a weekend in the countryside. First, it is much quieter there, so I can really rest after a noisy week in the city. Also, the air is fresh, and I enjoy walking and cycling outdoors. For example, when I visit my grandparents' village, I always sleep very well. The city has more restaurants and shops, but I can enjoy those on weekdays. So for a weekend, I prefer the countryside.\n[S8]\n@table|City Library: Events in March|Date,Event,Time,Room,Notes|March 5,Story time for children,10:00–11:00 A.M.,Children's room,Ages 4 to 8|March 12,Talk: Local history,6:30–8:00 P.M.,Main hall,Speaker: Dr. Alan Wood|March 19,Computer class for seniors,2:00–4:00 P.M.,Room 3,Registration required|March 26,Talk: Healthy cooking,6:30–8:00 P.M.,Main hall,Speaker: Chef Maria Diaz\nHi, I'm calling about the story time for children. What date is it, and what ages is it for?|The story time for children is on March 5, from ten to eleven A.M. It is for children from four to eight years old, and it takes place in the children's room.\nMy father wants to join the computer class. He can just come on the day, can't he?|I'm afraid not. Actually, registration is required for the computer class for seniors. The class is on March 19, from two to four P.M. in Room 3, so he should sign up in advance.\nI enjoy listening to talks. Could you tell me about the talks you have in March?|Of course. There are two talks in March, and both will be held in the main hall from six thirty to eight P.M. The first one is about local history, on March 12, and the speaker is Dr. Alan Wood. The second one is about healthy cooking. It takes place on March 26 and will be given by Chef Maria Diaz.\n[S11]\nSome people prefer to study alone. Others prefer to study in a group. Which way of studying do you think is more effective, and why?|In my opinion, studying alone is more effective than studying in a group, and there are two reasons for this. First of all, when I study alone, I can concentrate much better. In a group, people often start talking about other things, and a lot of time is wasted. For instance, last year my classmates and I tried to prepare for an exam together, but we spent most of the evening chatting. What is more, everyone learns at a different speed. Alone, I can spend more time on the parts I find difficult. Of course, a group is useful for practicing speaking. But for these reasons, I strongly believe that studying alone gives better results.\n[W1]\n👨‍🌾🌱💧|Một người nông dân đang tưới những cây non trong vườn.|water / plants|The farmer is watering some young plants in the garden.\n👩‍💻📊🖥️|Một phụ nữ đang xem biểu đồ trên màn hình máy tính.|chart / screen|The woman is looking at a chart on her computer screen.\n🧑‍🤝‍🧑🍽️🎂|Mấy người bạn ngồi quanh bàn, trên bàn có một chiếc bánh sinh nhật.|friends / celebrate|Some friends are celebrating a birthday at a restaurant.\n🚕🧳🏨|Một chiếc taxi dừng trước khách sạn để khách xuống xe.|taxi / in front of|A taxi has stopped in front of the hotel.\n👨‍💼🏃‍♂️🚆|Một người đàn ông chạy vội vì tàu sắp rời ga.|run / because|The man is running because his train is about to leave.\n[W6]\nT:From: Daniel Wright, Wright Travel Agency. To: Ms. Huynh. Subject: Your trip to Thailand\nDear Ms. Huynh, thank you for contacting Wright Travel Agency about a trip to Thailand. We can arrange flights, hotels and tours. To prepare a plan and a price for you, we need some more details about your trip.\n!Respond to the email as Ms. Huynh. In your email, give TWO pieces of information and ask ONE question.\n$Dear Mr. Wright,\n$Thank you for your email.\n$Here are some details about my trip. First, I would like to travel from December 20 to December 27 with my husband and our two children. Second, we would like to stay in a hotel near the beach, and our budget is about three thousand dollars for everything.\n$I also have a question. Could you please tell me whether your tours include a guide who speaks Vietnamese?\n$I look forward to receiving your plan.\n$Best regards, Huynh Ngoc Anh\n--\nT:From: Building Management. To: All tenants. Subject: Improving our building\nDear tenants, we would like to make our apartment building a better place to live. Next month we will have a small budget for improvements, and we want to hear from you. Please tell us about any problems you have noticed and how you think the money should be spent.\n!Respond to the email as a tenant. In your email, describe ONE problem and make TWO suggestions.\n$Dear Building Management,\n$Thank you for asking for our opinions.\n$I would like to describe one problem. The lights in the parking area on the ground floor are very weak, and two of them have not worked for several weeks. It is difficult to see at night, and I think it is not safe.\n$I also have two suggestions. First, I suggest that you replace all the lights in the parking area with brighter ones. Another idea is to put a few benches and plants near the entrance, so that older tenants have a place to sit.\n$Thank you for your attention.\n$Best regards, Do Minh Khoa, Apartment 804\n[W8]\nQ:Some people prefer to live in the same town all their lives. Others prefer to move to different places. Which do you prefer? Give specific reasons and examples to support your opinion.\n$Some people are happy to spend their whole lives in the town where they were born. Others move every few years to a new city or even a new country. Personally, I prefer to live in different places, at least while I am young. I have three reasons for this preference.\n$To begin with, moving to a new place teaches independence. When you live far from your family, you have to solve problems by yourself, from finding an apartment to cooking your own meals. I moved from my small hometown to Ho Chi Minh City when I was eighteen. The first months were difficult, but I quickly learned how to manage my money and my time. I do not think I would have learned these lessons if I had stayed at home.\n$Another reason is that different places offer different opportunities. My hometown has only a few small companies, so most young people there work in shops or on farms. In contrast, a big city has universities, international firms and many kinds of jobs. By moving, I was able to study marketing and to find work in that field.\n$Furthermore, living in new places makes people more open-minded. You meet neighbors and colleagues with different habits, food and opinions. As a consequence, you learn that there is more than one good way to live. This skill is very useful in today's workplaces, where teams often include people from many backgrounds.\n$It is true that staying in one town has advantages. People who never move keep strong relationships with their family and childhood friends, and they feel that they belong. I miss that feeling sometimes, and I visit my parents as often as I can.\n$In short, although a hometown offers comfort, I prefer to live in different places because it makes me more independent, gives me better opportunities and opens my mind. Perhaps I will return to my hometown one day, but only after I have seen more of the world.\n\n##F1|Đề thi thử số 1|200 câu, nội dung mới hoàn toàn\n>Đề đủ 200 câu theo đúng cấu trúc bài thi: 100 câu nghe trong 45 phút và 100 câu đọc trong 75 phút.\n[P1]\n👩‍💼🖨️📄|Một phụ nữ đang đặt giấy vào khay của máy photocopy.|A woman is loading paper into a machine.|A woman is reading a document.|A woman is unplugging a printer.|A woman is carrying a box of paper.\n🪑🪑☂️🏖️|Hai chiếc ghế nằm đặt dưới một cái ô trên bãi biển vắng người.|Some chairs have been set up under an umbrella.|People are swimming i
