<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TOEIC bốn kỹ năng: từ con số không đến 800+</title>
<meta name="description" content="Lộ trình TOEIC bốn kỹ năng theo từng chặng, từ mất gốc đến 800+ Listening và Reading, 300+ Speaking và Writing: từ vựng, ngữ pháp và câu luyện theo đúng bảy phần của đề thi.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F2F4F8;--card:#FFFFFF;--ink:#15202F;--mute:#566375;--line:#D3DAE5;--pri:#1D3A6B;--pri-soft:#E4EBF7;--hl:#FFE873;--bad:#BF3327;--bad-soft:#FBE7E4;--ok:#17734F;--ok-soft:#DFF2E9;
 --cL:#2460B9;--cR:#19805A;--cW:#A8560C;--cS:#8B3D9E;--s1:#1D3A6B;--s2:#D98A1F;--s3:#19805A;--s4:#8B3D9E;--s5:#8A96A8;
 --ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--en:"Source Serif 4",Georgia,"Times New Roman",serif;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#10161F;--card:#18212D;--ink:#E6ECF2;--mute:#9AA7B6;--line:#2B3848;--pri:#9DBBF0;--pri-soft:#1C2B45;--hl:#6B5A12;--bad:#F0786A;--bad-soft:#3A201D;--ok:#5CC79B;--ok-soft:#173529;--cL:#7FB0F5;--cR:#5CC79B;--cW:#E5A25A;--cS:#CE8FE0;--s1:#9DBBF0;--s2:#E5A25A;--s3:#5CC79B;--s4:#CE8FE0;--s5:#7C8898}}
:root[data-theme="dark"]{--paper:#10161F;--card:#18212D;--ink:#E6ECF2;--mute:#9AA7B6;--line:#2B3848;--pri:#9DBBF0;--pri-soft:#1C2B45;--hl:#6B5A12;--bad:#F0786A;--bad-soft:#3A201D;--ok:#5CC79B;--ok-soft:#173529;--cL:#7FB0F5;--cR:#5CC79B;--cW:#E5A25A;--cS:#CE8FE0;--s1:#9DBBF0;--s2:#E5A25A;--s3:#5CC79B;--s4:#CE8FE0;--s5:#7C8898}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--ui);-webkit-text-size-adjust:100%}
.en{font-family:var(--en);font-size:1.07em;line-height:1.65}
a{color:var(--pri)}
h1{font-size:1.7rem;line-height:1.25;margin:.2em 0 .4em;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:1.2rem;margin:0 0 .6em;display:flex;align-items:center;gap:.5em;flex-wrap:wrap}
h3{font-size:1.08rem;margin:0 0 .3em}
p{margin:.4em 0 .8em;max-width:70ch}
ul,ol{max-width:70ch}
.mute{color:var(--mute);font-size:.92rem}.lead{font-size:1.05rem}
mark{background:var(--hl);color:inherit;padding:0 .15em;border-radius:3px}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
[hidden]{display:none!important}
#app{display:grid;grid-template-columns:212px minmax(0,1fr);min-height:100vh}
.nav{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));padding:20px 12px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;background:var(--card)}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500}
.nav svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav a.on{background:var(--pri-soft);color:var(--pri)}
.nav .brand{font-weight:700;margin-bottom:14px;display:block;line-height:1.25}
.nav .brand b{display:block;font:600 1.5rem var(--en);letter-spacing:.01em}
.nav .brand span{font-size:.82rem;font-weight:500;color:var(--mute)}
main{padding:28px clamp(16px,4vw,48px) 96px;max-width:920px;width:100%}
.onb{max-width:520px;margin:0 auto;padding:7vh 20px;grid-column:1/-1}
.onb label,.form label{display:block;font-weight:500;margin:14px 0}
input:not([type=checkbox]),select,textarea{display:block;width:100%;margin-top:4px;padding:10px 12px;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:8px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border:1.5px solid var(--pri);border-radius:8px;background:var(--pri);color:var(--card);font:600 1rem var(--ui);text-decoration:none;cursor:pointer}
.btn.line{background:transparent;color:var(--pri)}.btn.sm{padding:6px 12px;font-size:.88rem}.btn.wide{width:100%;margin-top:10px}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0}
.note{background:var(--bad-soft);border-left:4px solid var(--bad);padding:10px 14px;border-radius:0 8px 8px 0;max-width:none}
.info{background:var(--pri-soft);padding:10px 14px;border-radius:8px;max-width:none}
.tip{background:var(--hl);padding:8px 12px;border-radius:8px;font-size:.95rem;max-width:none}
.sec{margin:32px 0;padding-top:22px;border-top:1.5px solid var(--line)}
.crumb{font-size:.88rem;color:var(--mute);margin:0}
/* Thang band */
.ladder{margin:34px 0 20px;position:relative;max-width:640px}
.ltrack{height:14px;border-radius:7px;background:var(--line);position:relative;overflow:visible}
.ltrack i{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:var(--pri)}
.ltrack u{position:absolute;top:-5px;width:4px;height:24px;margin-left:-2px;background:var(--cW);border-radius:2px}
.lmk{position:absolute;top:-30px;white-space:nowrap;font-size:.8rem;color:var(--mute);line-height:1.2}
.lmk b{font:600 1.15rem var(--en);color:var(--ink);background:var(--hl);padding:0 6px;border-radius:4px;margin-right:6px}
.lticks{display:flex;justify-content:space-between;margin-top:6px;font:600 .95rem var(--en)}
.lticks span{width:0;display:flex;justify-content:center;position:relative}
.lticks span::before{content:"";position:absolute;top:-10px;width:1.5px;height:6px;background:var(--mute)}
.lph{display:flex;margin-top:4px;font-size:.78rem;color:var(--mute)}.lph span{flex:1;text-align:center;border-top:1px dashed var(--line);padding-top:4px;margin:0 3px}
/* Ô lịch kiểu phiếu trả lời */
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));flex:1}
.cell{aspect-ratio:1;border:1.5px solid var(--line);margin:0 -1.5px -1.5px 0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:3px;text-decoration:none;color:var(--ink);background:var(--card);position:relative;min-width:0}
.cell small{font-size:.62rem;color:var(--mute);line-height:1.2}.cell b{font:600 clamp(1rem,3.2vw,1.5rem)/1 var(--en)}
.cell.tL b{color:var(--cL)}.cell.tR b{color:var(--cR)}.cell.tW b{color:var(--cW)}.cell.tS b{color:var(--cS)}.cell.tT b,.cell.tD b,.cell.tM b{color:var(--bad)}.cell.tN b{color:var(--line)}
.cell.today{outline:3px solid var(--pri);outline-offset:-3px;z-index:1}
.cell.done{background:var(--ok-soft)}
.cell .tick{position:absolute;right:3px;top:1px;color:var(--ok);font-weight:700;font-size:.8rem}
.wk{display:flex;align-items:center;gap:10px;margin-bottom:1.5px}.wkl{width:150px;flex:none;font-weight:600;font-size:.84rem;line-height:1.3}.wkl small{display:block;font-weight:400;color:var(--mute);font-size:.72rem}
.keyl{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.84rem;color:var(--mute);margin:10px 0}.keyl b{font:600 1rem var(--en);margin-right:4px}
.done-mark{display:inline-grid;place-items:center;width:1.5em;height:1.5em;border-radius:50%;background:var(--ok);color:var(--card);font-size:.8rem;font-weight:700;flex:none}
.todo,.outl,.vlist,.gx{list-style:none;padding:0;margin:10px 0;max-width:none}
.todo li,.outl li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:9px 2px;border-bottom:1px dashed var(--line)}
.todo li.done a{color:var(--mute);text-decoration:line-through}.todo span{color:var(--mute);font-size:.9rem}
.outl li>span{flex:1;color:var(--mute)}.outl li>b{min-width:8em}.outl small{color:var(--bad)}
.pbar{display:grid;grid-template-columns:90px 1fr 70px;gap:10px;align-items:center;margin:6px 0;font-size:.9rem}
.pbar div,.qbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.pbar i,.qbar i{display:block;height:100%;background:var(--ok)}
.gcard{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:16px 18px;margin:14px 0}
.gcard h3{font:600 1.3rem var(--en);color:var(--pri)}.gm{font-weight:600;margin:0 0 8px}
.gs{background:var(--pri-soft);padding:8px 12px;border-radius:8px;max-width:none}
.gx li,.vlist li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px dashed var(--line)}
.gx .vi{display:block;color:var(--mute);font-size:.93rem;font-family:var(--ui)}
.say{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:transparent;color:var(--pri);display:grid;place-items:center;cursor:pointer;margin-top:2px}
.vlist li{cursor:pointer;display:grid;grid-template-columns:30px minmax(8em,13em) 1fr;align-items:start}
.vlist .vx{grid-column:2/-1;color:var(--mute);font-size:.98rem}
.vlist.hidden li:not(.show) .vm{filter:blur(6px)}
.chk{display:flex;gap:8px;align-items:flex-start;margin:10px 0;font-size:.95rem}.chk input{margin-top:.35em}
.kwl .spk{flex:none;min-width:26px;height:26px;border-radius:13px;padding:0 6px;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center;font-size:.8rem;margin-top:4px}
.kwl.veil div{filter:blur(7px);user-select:none}
.guide{padding-left:1.3em}.guide li{margin:.45em 0}
.cue{background:var(--card);border:1.5px solid var(--ink);border-radius:6px;padding:14px 18px;margin:12px 0;max-width:520px}
.cue ul{margin:.3em 0;padding-left:1.2em}.cue p{margin:.2em 0}
.pn{display:flex;justify-content:space-between;margin-top:40px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin:18px 0}
.pcard{display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px 16px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;text-decoration:none;cursor:pointer}
.pcard:hover{border-color:var(--pri)}.pcard b{color:var(--pri)}.pcard span{color:var(--mute);font-size:.9rem}
.tb{width:100%;border-collapse:collapse;margin:14px 0;font-size:.93rem;text-align:left}
.tb th,.tb td{border:1px solid var(--line);padding:7px 10px;vertical-align:top}.tb th{background:var(--pri-soft)}
.scroll{overflow-x:auto}
/* Biểu đồ */
.fig{margin:14px 0;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;max-width:620px}
.fig figcaption{font:600 1rem var(--en);margin-bottom:6px}
.ch{display:block;width:100%;min-width:300px;height:auto}
.ch text{font:11px var(--ui);fill:var(--mute)}.ch .vl{fill:var(--ink);font-weight:600}
.ch .gl{stroke:var(--line);stroke-width:1}
.ch .ln{fill:none;stroke-width:2.5}.ch .l1{stroke-dasharray:8 4}.ch .l2{stroke-dasharray:2 4}
.map .mb{fill:var(--pri-soft);stroke:var(--pri);stroke-width:1.5}.map .ml{fill:var(--card);stroke:var(--ink);stroke-width:1.5;stroke-dasharray:5 4}
.map text{font:600 13px var(--ui);fill:var(--ink)}.map .mlt{font:600 20px var(--en)}
.map .cmp path{fill:none;stroke:var(--mute);stroke-width:2}
.leg{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.85rem;margin:6px 0 0}.leg i{display:inline-block;width:14px;height:10px;margin-right:6px;border-radius:2px}
.dat{font-size:.88rem;margin-top:6px}.dat summary{cursor:pointer;color:var(--pri)}
.flow{list-style:none;counter-reset:f;display:flex;flex-wrap:wrap;gap:8px 26px;padding:0;margin:6px 0}
.flow li{counter-increment:f;position:relative;border:1.5px solid var(--pri);border-radius:8px;padding:8px 12px;font:1rem var(--en);background:var(--pri-soft)}
.flow li::before{content:counter(f) ". ";font-weight:600}
.flow li:not(:last-child)::after{content:"";position:absolute;right:-20px;top:50%;width:12px;height:2px;background:var(--pri)}
.pies{display:flex;flex-wrap:wrap;gap:14px}.pies .fig{flex:1 1 240px}
.pie{width:150px;height:150px;display:block;margin:4px auto}
/* Làm bài */
#modal,#quiz{position:fixed;inset:0;z-index:50;display:none;overflow:auto}
#modal.on{display:grid;place-items:center;background:rgba(10,18,28,.55);padding:16px}
.sheet{background:var(--paper);border-radius:12px;padding:22px;width:min(680px,100%);max-height:92vh;overflow:auto;position:relative}
.x{width:36px;height:36px;border:0;background:transparent;font-size:1.6rem;color:var(--mute);cursor:pointer}
.sheet .x{position:absolute;top:8px;right:10px}
#quiz.on{display:block;background:var(--paper);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.qwrap{max-width:720px;margin:0 auto;padding:12px 18px 80px}
.qhead{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:6px 0 10px;position:sticky;top:0;background:var(--paper);z-index:2}.qhead b{flex:1}
#qtime,#wtime{font:600 1.05rem var(--en);background:var(--ink);color:var(--paper);padding:1px 8px;border-radius:4px}
.qtag{display:inline-block;margin:16px 0 6px;font-size:.82rem;font-weight:600;color:var(--pri);background:var(--pri-soft);padding:2px 10px;border-radius:99px}
.qtag.L{color:var(--cL)}.qtag.R{color:var(--cR)}.qtag.W{color:var(--cW)}.qtag.S{color:var(--cS)}
.qtext{font-size:1.02rem}.qs{font-size:1.3rem;line-height:1.7;margin:10px 0}
.instr{font-weight:600;margin:.4em 0}
.bl{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--ink);margin:0 3px}
.opts{display:grid;gap:10px;margin:16px 0}
.opt{display:flex;gap:12px;align-items:center;text-align:left;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:1.02rem/1.5 var(--ui);cursor:pointer}
.opt.en{font:1.12rem/1.5 var(--en)}
.opt .on{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:600 .8rem var(--ui);flex:none}
.opt:not(:disabled):hover{border-color:var(--pri)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.fb{padding:12px 16px;border-radius:10px;margin:10px 0}.fb.good{background:var(--ok-soft)}.fb.bad{background:var(--bad-soft)}.fb p{margin:.3em 0;max-width:none}
.fb.good>b{color:var(--ok)}.fb.bad>b{color:var(--bad)}
.result{text-align:center;padding:10px 0 20px}.result p{margin-inline:auto}.result h2{justify-content:center}
.bandbig{display:inline-grid;place-items:center;min-width:5.2rem;height:5.2rem;padding:0 12px;border:3px solid var(--ink);border-radius:8px;font:600 2.2rem var(--en);margin:10px auto;background:var(--card)}
.bandbig.fail{border-color:var(--mute);color:var(--mute)}
.rev{border-top:1px dashed var(--line);padding:10px 0}.rev .qs{font-size:1.1rem}
span.ok{color:var(--ok)}span.no{color:var(--bad)}
.pass{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:14px 18px;margin-bottom:12px}
.pass h3{font:600 1.25rem var(--en)}.pass p{max-width:none}.pk{display:inline-block;background:var(--ink);color:var(--card);padding:0 7px;border-radius:3px;font-family:var(--ui);font-size:.85em}
.it{padding:10px 0 6px;border-top:1px dashed var(--line)}
.iq{margin:.2em 0 .5em;max-width:none}.num{display:inline-grid;place-items:center;min-width:1.7em;height:1.7em;border:1.5px solid var(--ink);border-radius:4px;margin-right:8px;font:600 .82rem var(--ui)}
.it.ok .num{background:var(--ok);border-color:var(--ok);color:var(--card)}.it.no .num{background:var(--bad);border-color:var(--bad);color:var(--card)}
.iopts{display:grid;gap:6px;margin:0 0 6px}.iopts.tf{grid-template-columns:repeat(3,auto);justify-content:start}
.io{text-align:left;padding:7px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer}
.iopts.tf .io{font:600 .88rem var(--ui)}
.io.sel{border-color:var(--pri);background:var(--pri-soft)}.io.ok{border-color:var(--ok);background:var(--ok-soft)}.io.no{border-color:var(--bad);background:var(--bad-soft)}
.gin{display:inline-block!important;width:11em!important;max-width:60vw;margin:0 4px!important;padding:4px 8px!important}
.gsel{display:inline-block!important;width:auto!important;margin:0 4px!important;padding:4px 8px!important}
.ia{font-size:.92rem;color:var(--mute);margin:.2em 0 .4em;max-width:none}.it.no .ia b{color:var(--ok)}
.olist{list-style:none;padding:10px 14px;margin:10px 0;border:1.5px solid var(--line);border-radius:8px;background:var(--card);max-width:none}.olist b{font-family:var(--ui);margin-right:6px}
#din{font-size:1.15rem;padding:12px 14px;margin-top:12px}
.flash{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:26px 18px;text-align:center;margin:14px 0;min-height:170px}
.flash .qs{font-size:1.9rem}.flash p{margin-inline:auto}.fback{border-top:1px dashed var(--line);margin-top:16px;padding-top:14px}
.clockbig{font:600 3rem var(--en);text-align:center;margin:14px 0}
.wbox{margin:18px 0;padding-top:14px;border-top:1.5px solid var(--line)}
.wbox textarea{min-height:240px;font:1.08rem/1.7 var(--en);resize:vertical}
.wc{font-size:.9rem;color:var(--mute)}.wc.low{color:var(--bad)}.wc.good{color:var(--ok)}
.model{background:var(--card);border-left:4px solid var(--ok);padding:10px 16px;border-radius:0 8px 8px 0;margin:12px 0}.model p{max-width:none}
.yours{background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:10px 16px;white-space:pre-wrap}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:99;font-size:.92rem;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (min-width:1000px){
 .qwrap.split{max-width:1240px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 28px;align-items:start}
 .qwrap.split>.qhead,.qwrap.split>.qbar{grid-column:1/-1}
 .qwrap.split>.pcol{position:sticky;top:60px;max-height:calc(100vh - 80px);overflow:auto}
}
@media (max-width:820px){
 #app{display:block}
 .nav{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));border:0;border-top:1px solid var(--line);z-index:20}
 .nav .brand{display:none}.nav a{flex-direction:column;gap:2px;font-size:.64rem;padding:4px 3px}
 main{padding-top:18px}h1{font-size:1.4rem}
 .wk{flex-direction:column;align-items:stretch;gap:2px;margin-bottom:12px}.wkl{width:auto}.wkl small{display:inline;margin-left:8px}
 .vlist li{grid-template-columns:30px 1fr}.vlist .vm,.vlist .vx{grid-column:2}
 .outl li{flex-wrap:wrap}.tb{font-size:.84rem}.iopts.tf{grid-template-columns:1fr 1fr 1fr}
 .lmk small{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.chipsb,.ordout{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}

<script>
const RAW={"les": "##A1|Chào hỏi và giới thiệu|Động từ be: am, is, are\n>Sau bài này bạn tự giới thiệu được tên, nghề, quê quán và nghe hiểu những câu hỏi làm quen đơn giản.\n[V]Chào hỏi và nghề nghiệp\nname|tên|My ＊ is Lan.\ncompany|công ty|I work for a small ＊ in Hanoi.\noffice|văn phòng|Our ＊ is on the third floor.\njob|công việc|She has a new ＊ at a bank.\nteacher|giáo viên|My mother is an English ＊.\nstudent|sinh viên, học sinh|He is a ＊ at Hanoi University.\nengineer|kỹ sư|My father is an ＊ and builds bridges.\nmanager|người quản lý|The ＊ is in a meeting now.\ncountry|đất nước|Vietnam is a beautiful ＊.\ncity|thành phố|Da Nang is a ＊ by the sea.\nfriend|bạn|This is my ＊ Minh from school.\nmeet|gặp|Nice to ＊ you.\n[G]\n@be: am, is, are|Động từ \"be\": là, thì, ở|I am · He / She / It is · You / We / They are · Phủ định: am not, is not (isn't), are not (aren't) · Câu hỏi: Is he…? Are you…?\nCâu tiếng Anh luôn cần một động từ. Khi nói ai là gì, thế nào, ở đâu, ta dùng be. Tiếng Việt nói \"Tôi mệt\", tiếng Anh phải nói \"I am tired\".\n!Lỗi hay gặp nhất của người mới học là bỏ mất be: \"She teacher\", \"They in the office\".\n>I 【am|is|are|be】 a student.=Tôi là sinh viên.\n>She 【is|am|are|be】 from Vietnam.=Cô ấy đến từ Việt Nam.\n>We 【are|is|am|be】 in the office.=Chúng tôi đang ở văn phòng.\n>【Are|Is|Am|Be】 you the manager?=Bạn có phải là quản lý không?\n+Mr. Kim 【is not|are not|am not|not is】 at his desk.=Ông Kim không ở bàn làm việc.\n+My friends 【are|is|am|be】 engineers.=Các bạn tôi là kỹ sư.\n[P1]\n🤝|Hai người đang bắt tay nhau.|They're shaking hands.|They're eating lunch.|They're opening a door.|They're reading a book.\n👩‍🏫|Một phụ nữ đứng trước bảng trong lớp học.|A woman is standing in a classroom.|A woman is driving a car.|A woman is sitting on a bench.|A woman is washing dishes.\n🧑‍💼🏢|Một người đàn ông mặc vest đứng trước một toà nhà văn phòng.|A man is standing outside a building.|A man is swimming in a pool.|A man is cooking a meal.|A man is lying on a bed.\n[P2]\nWhat's your name?|I'm Minh.|I'm fine, thanks.|In Hanoi.\nWhere are you from?|I'm from Vietnam.|I'm a teacher.|Yes, I am.\nAre you a student?|No, I'm an engineer.|At the office.|It's nine o'clock.\nWho is the manager?|Ms. Park is.|In the meeting room.|Yes, she is.\nHow are you today?|I'm very well, thank you.|I'm from Korea.|I'm thirty years old.\n[P5]\nMs. Tran 【is|are|am|be】 the new manager of our office. >> Chủ ngữ số ít (Ms. Tran) đi với \"is\".\nThe engineers 【are|is|am|being】 in the meeting room. >> Chủ ngữ số nhiều (engineers) đi với \"are\".\nI 【am|is|are|be】 happy to meet you. >> \"I\" luôn đi với \"am\".\nOur company 【is not|are not|am not|not is】 in the city center. >> \"Company\" là số ít nên dùng \"is not\".\n【Is|Are|Am|Be】 Mr. Lee your teacher? >> Câu hỏi với chủ ngữ số ít: Is + chủ ngữ.\nMy friend and I 【are|is|am|be】 students at the same school. >> \"My friend and I\" là hai người, dùng \"are\".\n[N]\nMẹo cho Part 2 ngay từ bài đầu: từ đầu tiên của câu hỏi quyết định câu trả lời. Where cần một nơi chốn, When cần thời gian, Who cần tên người. Câu hỏi mở bằng Wh- không bao giờ được trả lời bằng Yes hoặc No.\nTrong các bài nghe ở trang này, lựa chọn chỉ hiện chữ cái A, B, C giống đề thật. Hãy nghe hết cả ba câu rồi mới chọn.\n##A2|Gia đình và đồ vật quanh ta|a, an, số nhiều, this và that\n>Bạn gọi tên được đồ vật thường gặp, dùng đúng a/an và dạng số nhiều, hai thứ xuất hiện trong mọi câu của đề thi.\n[V]Đồ vật và gia đình\ndesk|bàn làm việc|There is a computer on my ＊.\nchair|ghế|Please sit on this ＊.\nphone|điện thoại|My ＊ is ringing.\ncomputer|máy tính|I write emails on my ＊.\nbag|túi, cặp|She carries her books in a ＊.\nkey|chìa khoá|I cannot open the door without my ＊.\nbook|quyển sách|I am reading a ＊ about history.\npicture|bức tranh, ảnh|There is a ＊ of my family on the wall.\nparents|bố mẹ|My ＊ live in the countryside.\nhusband|chồng|Her ＊ works at a hospital.\nwife|vợ|His ＊ is a doctor.\nchildren|con cái, trẻ em|They have two ＊, a boy and a girl.\n[G]\n@a / an và số nhiều|Mạo từ a, an và danh từ số nhiều|a + phụ âm: a desk · an + nguyên âm (a, e, i, o, u): an office · Số nhiều: thêm s hoặc es: two desks, three boxes · Bất quy tắc: man → men, child → children, person → people\nDanh từ đếm được số ít không đứng một mình: phải có a, an, the, my… Khi có từ hai trở lên, danh từ thêm s.\n!Tiếng Việt nói \"hai cái bàn\", danh từ không đổi. Tiếng Anh bắt buộc \"two desks\". Quên s là lỗi Part 5 rất thường gặp.\n>She is 【an|a|two|some】 engineer.=Cô ấy là kỹ sư.\n>There are three 【chairs|chair|a chair|chaires】 in the room.=Trong phòng có ba cái ghế.\n>He has two 【children|child|childs|childrens】.=Anh ấy có hai con.\n@this, that, these, those|Từ chỉ định|this + số ít (gần) · that + số ít (xa) · these + số nhiều (gần) · those + số nhiều (xa)\nDùng để chỉ vào người hoặc vật. Part 2 rất hay hỏi \"Is this your…?\", \"Whose bag is that?\".\n>【These|This|That|It】 are my keys.=Đây là chìa khoá của tôi.\n>Is 【that|those|these|they】 your bag over there?=Kia có phải túi của bạn không?\n+I need 【a|an|two|these】 new phone.=Tôi cần một chiếc điện thoại mới.\n+【Those|That|This|It】 books on the shelf are very old.=Những quyển sách trên giá kia rất cũ.\n[P1]\n💻🪑|Một chiếc máy tính xách tay đặt trên bàn, cạnh đó là một cái ghế trống.|A laptop is on the desk.|A man is using a computer.|The chairs are stacked in a corner.|Some books are on the floor.\n📚|Nhiều quyển sách xếp thành chồng trên bàn.|Some books are piled on a table.|A woman is reading a book.|The shelves are empty.|A book is lying on the floor.\n🔑🚪|Một chùm chìa khoá đang cắm ở ổ khoá cửa.|Some keys are in the door.|A door is being painted.|A man is knocking on the door.|The keys are on a desk.\n[P2]\nIs this your bag?|Yes, it's mine.|It's on the desk.|No, I'm not.\nWhose phone is that?|It's Mr. Tan's.|It's a new phone.|Yes, it is.\nHow many chairs are there?|There are six.|They're in the office.|It's a chair.\nWhat's that on your desk?|It's a picture of my children.|Yes, it's a desk.|On the second floor.\nDo you have a computer at home?|Yes, I have a laptop.|It's at the office.|No, it isn't mine.\n[P5]\nMr. Park is 【an|a|two|those】 engineer at a large company. >> \"Engineer\" bắt đầu bằng nguyên âm e nên dùng \"an\".\nThere are four 【desks|desk|a desk|deskes】 in the new office. >> Sau \"four\" danh từ phải ở số nhiều.\n【These|This|That|It】 keys are for the meeting room. >> \"Keys\" là số nhiều nên dùng \"These\".\nMy manager has three 【children|child|childs|a child】. >> Số nhiều bất quy tắc của child là children.\nPlease put 【that|those|these|them】 box on the table. >> \"Box\" là số ít nên dùng \"that\".\nMs. Lee needs 【a|an|some|these】 chair for her office. >> \"Chair\" bắt đầu bằng phụ âm, số ít, dùng \"a\".\n##A3|Số, giờ và ngày tháng|Giới từ chỉ thời gian: in, on, at\n>Số, giờ và ngày là thứ bị hỏi nhiều nhất trong phần nghe. Bài này giúp bạn nghe và nói đúng giờ, thứ, tháng.\n[V]Thời gian\ntoday|hôm nay|＊ is Monday, the first day of the week.\ntomorrow|ngày mai|The meeting is ＊, not today.\nweek|tuần|There are seven days in a ＊.\nmonth|tháng|January is the first ＊ of the year.\nyear|năm|There are twelve months in a ＊.\nmorning|buổi sáng|I drink coffee every ＊ before work.\nafternoon|buổi chiều|The meeting starts at two in the ＊.\nevening|buổi tối|I watch TV in the ＊ after dinner.\nweekend|cuối tuần|We do not work at the ＊.\nearly|sớm|I get up ＊, at five o'clock.\nlate|muộn|The bus is ＊ again; it should be here by now.\nopen|mở cửa|The bank is ＊ from nine to five.\n[G]\n@in, on, at|Giới từ chỉ thời gian|at + giờ: at 9 o'clock, at noon · on + thứ, ngày: on Monday, on May 5th · in + tháng, năm, buổi: in June, in 2025, in the morning · Ngoại lệ: at night, at the weekend\nBa giới từ này xuất hiện trong gần như mọi đề Part 5 và trong mọi câu trả lời cho câu hỏi \"When…?\" ở Part 2.\n!Mẹo nhớ: at cho một điểm (giờ), on cho một ngày, in cho khoảng dài hơn một ngày.\n>The meeting starts 【at|in|on|to】 ten o'clock.=Cuộc họp bắt đầu lúc mười giờ.\n>The office is closed 【on|in|at|by】 Sunday.=Văn phòng đóng cửa vào Chủ nhật.\n>She started her job 【in|on|at|to】 March.=Cô ấy bắt đầu công việc vào tháng Ba.\n>I usually study 【in|on|at|for】 the evening.=Tôi thường học vào buổi tối.\n+The store opens 【at|in|on|of】 8:30 every day.=Cửa hàng mở cửa lúc 8 giờ 30 mỗi ngày.\n+Our company was started 【in|on|at|by】 2010.=Công ty chúng tôi thành lập năm 2010.\n[P1]\n🕘🏦|Một chiếc đồng hồ treo trên tường phía trên cửa ngân hàng, chỉ chín giờ.|A clock is hanging on the wall.|A man is fixing a clock.|The bank is full of people.|A woman is looking at her watch.\n📅✍️|Một người đang viết lên tờ lịch treo tường.|Someone is writing on a calendar.|Someone is reading a newspaper.|Someone is closing a window.|A calendar is lying on the floor.\n🚌🚏|Một chiếc xe buýt đang dừng ở trạm.|A bus is stopped at a bus stop.|People are getting off a train.|A bus is being washed.|The street is empty.\n[P2]\nWhat time does the meeting start?|At ten o'clock.|In the meeting room.|Yes, it does.\nWhen is your day off?|On Friday.|At the office.|For two days.\nWhat day is it today?|It's Tuesday.|It's two o'clock.|It's in May.\nWhen does the store open?|At nine in the morning.|On Main Street.|Yes, it's open.\nIs the bank open on Saturday?|Only in the morning.|It's next to the post office.|At the bank.\n[P5]\nThe office opens 【at|in|on|for】 8 A.M. every weekday. >> Trước giờ cụ thể dùng \"at\".\nThe new manager will start 【on|in|at|from】 Monday. >> Trước thứ trong tuần dùng \"on\".\nSales are usually high 【in|on|at|to】 December. >> Trước tháng dùng \"in\".\nMr. Cho has a meeting 【in|on|at|by】 the afternoon. >> Buổi trong ngày: in the morning, in the afternoon.\nThe company was founded 【in|on|at|since】 1998. >> Trước năm dùng \"in\".\nThe store is closed 【on|in|at|of】 public holidays. >> Trước ngày (kể cả ngày lễ) dùng \"on\".\n##A4|Một ngày của tôi|Hiện tại đơn: câu khẳng định\n>Bạn kể được thói quen hằng ngày và nắm quy tắc thêm s/es, quy tắc bị kiểm tra nhiều nhất ở Part 5 mức cơ bản.\n[V]Hoạt động hằng ngày\nwork|làm việc|I ＊ from Monday to Friday.\nstart|bắt đầu|I ＊ work at eight o'clock.\nfinish|kết thúc|We ＊ work at five and go home.\ngo|đi|I ＊ to the office by bus.\nhave|có; ăn (bữa)|I ＊ lunch at noon with my friends.\nlive|sống|They ＊ in a small house near the river.\nstudy|học|I ＊ English for one hour every day.\ndrive|lái xe|He does not walk; he likes to ＊ to work.\ntake|đi (xe); lấy|I ＊ the bus to school every morning.\ncall|gọi điện|Please ＊ me after the meeting.\nevery day|mỗi ngày|I check my email ＊.\nusually|thường thường|She ＊ arrives at eight, but today she is late.\n[G]\n@Present simple|Thì hiện tại đơn (câu khẳng định)|I / You / We / They + động từ nguyên mẫu · He / She / It + động từ thêm s hoặc es · have → has, go → goes, study → studies\nDùng cho thói quen, lịch làm việc, sự thật. Dấu hiệu nhận biết: every day, usually, always, often, sometimes.\n!Chủ ngữ là một người, một vật, một công ty (he, she, it, Mr. Kim, the store) thì động từ phải có s. Part 5 kiểm tra điều này liên tục.\n>She 【works|work|working|is work】 at a bank.=Cô ấy làm việc ở ngân hàng.\n>They 【start|starts|starting|are start】 work at nine.=Họ bắt đầu làm việc lúc chín giờ.\n>My manager 【has|have|having|haves】 a meeting every Monday.=Quản lý của tôi họp mỗi thứ Hai.\n>He 【goes|go|going|gos】 to work by car.=Anh ấy đi làm bằng ô tô.\n+The store 【opens|open|opening|is open】 at nine every day.=Cửa hàng mở cửa lúc chín giờ mỗi ngày.\n+We usually 【finish|finishes|finishing|are finish】 at five.=Chúng tôi thường xong việc lúc năm giờ.\n[P1]\n🚶‍♂️💼|Một người đàn ông xách cặp đang đi bộ trên vỉa hè.|A man is walking with a briefcase.|A man is riding a bicycle.|A man is waiting for a bus.|A man is opening a briefcase.\n☕👩|Một phụ nữ đang cầm tách cà phê ngồi cạnh cửa sổ.|A woman is holding a cup.|A woman is pouring some water.|A woman is cleaning a window.|A woman is buying coffee.\n🚗🚗🚗|Nhiều ô tô đỗ thành hàng trong bãi xe.|Some cars are parked in a row.|A car is being repaired.|People are getting into a car.|The parking area is empty.\n[P2]\nWhere do you work?|At a bank downtown.|From nine to five.|Yes, I work hard.\nWhat time do you start work?|At eight thirty.|By bus.|In an office.\nHow do you go to work?|I take the bus.|At seven o'clock.|About five days.\nWhere does Ms. Lee live?|Near the station.|She's a teacher.|Every morning.\nWhat do you usually have for lunch?|A sandwich and some coffee.|At noon.|In the cafeteria.\n[P5]\nMr. Tanaka 【works|work|working|to work】 in the sales department. >> Chủ ngữ số ít ngôi thứ ba nên động từ thêm s.\nThe buses 【leave|leaves|leaving|is leave】 every ten minutes. >> Chủ ngữ số nhiều (buses), động từ không thêm s.\nOur manager usually 【arrives|arrive|arriving|are arrive】 before eight. >> \"Our manager\" là số ít, động từ thêm s.\nThe company 【has|have|having|are having】 offices in three cities. >> \"The company\" là số ít, have đổi thành has.\nMs. Diaz and Mr. Cho 【take|takes|taking|is take】 the same train every morning. >> Hai người là số nhiều, động từ nguyên mẫu.\nThe store 【closes|close|closing|are close】 at 9 P.M. on weekdays. >> \"The store\" là số ít, động từ thêm s.\n##A5|Hỏi về công việc|Hiện tại đơn: phủ định và câu hỏi với do, does\n>Part 2 toàn là câu hỏi. Bài này dạy cách đặt và hiểu câu hỏi với do, does và các từ hỏi What, Where, When, Who, How.\n[V]Công việc\ndepartment|phòng ban|She works in the sales ＊.\ncustomer|khách hàng|The ＊ wants to buy two tickets.\nemail|thư điện tử|Please send me an ＊ with the details.\nreport|bản báo cáo|I must finish this ＊ by Friday.\nmeeting|cuộc họp|We have a ＊ with the manager at ten.\nschedule|lịch làm việc|My ＊ is full this week, so I have no free time.\nlunch break|giờ nghỉ trưa|Our ＊ is from twelve to one.\nhelp|giúp đỡ|Can you ＊ me with this box?\nneed|cần|I ＊ a pen to sign this form.\nknow|biết|Do you ＊ where the station is?\nanswer|trả lời|Please ＊ the phone; I am busy.\nsend|gửi|I will ＊ the report by email today.\n[G]\n@do / does trong câu phủ định và câu hỏi|Phủ định và nghi vấn của hiện tại đơn|Phủ định: I / you / we / they + do not (don't) + V · he / she / it + does not (doesn't) + V · Câu hỏi: Do you + V? · Does she + V? · Từ hỏi + do / does + chủ ngữ + V?\nKhi đã có does hoặc doesn't thì động từ chính trở về nguyên mẫu, không còn s.\n!\"She doesn't works\" và \"Does he works?\" đều sai. Chữ s đã chuyển sang does rồi.\n>I 【don't|doesn't|am not|not】 work on Sunday.=Tôi không làm việc vào Chủ nhật.\n>She 【doesn't|don't|isn't|not】 know the answer.=Cô ấy không biết câu trả lời.\n>【Does|Do|Is|Are】 he work in this department?=Anh ấy có làm ở phòng này không?\n>Where 【do|does|are|is】 you have lunch?=Bạn ăn trưa ở đâu?\n+What time 【does|do|is|are】 the meeting start?=Cuộc họp bắt đầu lúc mấy giờ?\n+They 【don't|doesn't|aren't|isn't】 need a new computer.=Họ không cần máy tính mới.\n[P1]\n📧👨‍💻|Một người đàn ông ngồi ở bàn, đang nhìn vào màn hình máy tính.|A man is looking at a computer screen.|A man is talking on the phone.|A man is leaving the office.|A man is carrying a box.\n👥🗣️|Mấy người ngồi quanh một cái bàn, đang nói chuyện.|Some people are sitting around a table.|Some people are standing in line.|Some people are walking outside.|A table is being moved.\n📞👩‍💼|Một nữ nhân viên văn phòng đang nói chuyện điện thoại.|A woman is talking on the phone.|A woman is typing a letter.|A woman is hanging up a coat.|A woman is reading a report.\n[P2]\nDo you work in the sales department?|No, I'm in marketing.|At nine o'clock.|It's on the desk.\nDoes the manager know about the meeting?|Yes, I told her this morning.|In room 5.|He's a manager.\nWho do I send the report to?|To Mr. Jones, please.|By email.|Tomorrow morning.\nWhen do you have your lunch break?|From twelve to one.|In the cafeteria.|A sandwich.\nWhy do you need a new computer?|Because mine is very slow.|Yes, I need it.|On my desk.\n[P5]\nMr. Ito 【does not|do not|is not|not】 work on Saturdays. >> Chủ ngữ số ít, phủ định dùng \"does not\".\n【Does|Do|Is|Are】 the store open on Sundays? >> Câu hỏi với chủ ngữ số ít (the store) và động từ thường: Does.\nThe managers 【do not|does not|are not|is not】 need the report today. >> Chủ ngữ số nhiều dùng \"do not\".\nMs. Kang doesn't 【know|knows|knowing|to know】 the customer's name. >> Sau doesn't là động từ nguyên mẫu.\nWhat time 【does|do|is|are】 the lunch break start? >> \"The lunch break\" là số ít, dùng does.\nWhere do the customers 【wait|waits|waiting|waited】 for their orders? >> Sau do + chủ ngữ là động từ nguyên mẫu.\n##A6|Trong văn phòng có gì|There is, there are và giới từ chỉ nơi chốn\n>Part 1 mô tả đồ vật ở đâu trong ảnh. Bài này cho bạn bộ từ chỉ vị trí và cấu trúc There is, There are.\n[V]Đồ vật và vị trí trong văn phòng\nprinter|máy in|The ＊ has no paper, so I cannot print the report.\nshelf|giá, kệ|The books are on the top ＊.\ndrawer|ngăn kéo|The pens are in the top ＊ of my desk.\nwindow|cửa sổ|Please open the ＊; it is hot in here.\nfloor|sàn nhà; tầng|Our office is on the fifth ＊ of the building.\nwall|bức tường|There is a clock on the ＊.\nbox|cái hộp|Put the old files in this ＊.\nplant|cây cảnh|There is a green ＊ in the corner of the room.\nlamp|đèn bàn|Turn on the ＊; it is too dark to read.\nunder|ở dưới|The cat is sleeping ＊ the table.\nnext to|bên cạnh|The printer is ＊ the door.\nin front of|ở phía trước|A taxi is waiting ＊ the hotel.\n[G]\n@There is / There are|Có … (ở đâu đó)|There is + danh từ số ít · There are + danh từ số nhiều · Câu hỏi: Is there…? Are there…?\nDùng để nói ở một nơi có cái gì. Động từ chia theo danh từ đứng sau.\n>There 【is|are|have|has】 a printer next to the door.=Có một máy in cạnh cửa.\n>There 【are|is|have|be】 two windows in the room.=Trong phòng có hai cửa sổ.\n>【Is there|Are there|There is|Has there】 a lamp on your desk?=Trên bàn bạn có đèn không?\n@in, on, under, next to, in front of, behind|Giới từ chỉ nơi chốn|in: ở trong · on: ở trên (chạm bề mặt) · under: ở dưới · next to: bên cạnh · in front of: phía trước · behind: phía sau · between: ở giữa\nTrong Part 1, đáp án sai thường chỉ sai đúng giới từ: ảnh là \"on the desk\" nhưng câu nói \"under the desk\".\n>The files are 【in|on|at|to】 the drawer.=Hồ sơ ở trong ngăn kéo.\n>The picture is 【on|in|under|at】 the wall.=Bức tranh ở trên tường.\n+There 【are|is|has|have】 some boxes under the desk.=Có vài cái hộp dưới bàn.\n+The plant is 【next to|next|between|in front】 the window.=Cái cây ở cạnh cửa sổ.\n[P1]\n🪴🪟|Một chậu cây đặt trên bậu cửa sổ.|A plant is next to the window.|A woman is watering a plant.|The window is broken.|A plant is on the floor.\n📦📦🪑|Mấy cái hộp xếp chồng dưới gầm bàn, cạnh một cái ghế.|Some boxes are under the desk.|Some boxes are on the shelf.|A man is opening a box.|The chair is on the desk.\n🖨️🚪|Một chiếc máy in đặt ngay cạnh cửa ra vào.|A printer is next to the door.|A man is using a printer.|The door is being closed.|A printer is in the drawer.\n[P2]\nWhere is the printer?|It's next to the door.|It's a new one.|Yes, there is.\nIs there a meeting room on this floor?|Yes, at the end of the hall.|At three o'clock.|No, it's a desk.\nWhere are the files?|In the top drawer.|They're blue.|On Monday.\nAre there any chairs in the room?|Yes, there are four.|It's under the table.|No, it isn't.\nWhat's in that box?|Some old reports.|It's on the shelf.|Yes, it is.\n[P5]\nThere 【are|is|has|be】 three printers on the second floor. >> Danh từ số nhiều (printers) đi với \"There are\".\nThe meeting room is 【next to|next|near to of|beside of】 the manager's office. >> Cụm đúng là \"next to\".\nThere 【is|are|have|were being】 a new lamp on Ms. Wu's desk. >> Danh từ số ít (a lamp) đi với \"There is\".\nPlease put the boxes 【under|at|to|of】 the table. >> Vị trí bên dưới: under.\nThe customer is waiting 【in front of|in front|front of|at front】 the building. >> Cụm đầy đủ là \"in front of\".\nThe reports are 【on|at|to|by】 the shelf behind you. >> Vật nằm trên bề mặt kệ: on the shelf.\n##A7|Họ đang làm gì|Hiện tại tiếp diễn\n>Đây là thì của Part 1: gần như mọi câu mô tả ảnh đều có dạng \"is / are + V-ing\". Học xong bài này, Part 1 sẽ dễ hơn hẳn.\n[V]Hành động thường gặp trong ảnh\nhold|cầm, nắm|Please ＊ this bag for me.\ncarry|mang, vác|These boxes are heavy; I cannot ＊ them.\nlook at|nhìn vào|Please ＊ the screen.\nwear|mặc, đeo|We ＊ a uniform at work.\nsit|ngồi|Please ＊ down and wait here.\nstand|đứng|There are no chairs, so we have to ＊.\nwrite|viết|Please ＊ your name on this form.\nread|đọc|I ＊ the newspaper every morning.\ntalk|nói chuyện|Can we ＊ about the schedule now?\nwait|chờ|Please ＊ here; the doctor will see you soon.\nclean|lau dọn|They ＊ the office every evening.\npoint|chỉ tay|Do not ＊ at people; it is not polite.\n[G]\n@Present continuous|Thì hiện tại tiếp diễn|am / is / are + V-ing · Phủ định: isn't / aren't + V-ing · Câu hỏi: Is he + V-ing? · Quy tắc thêm ing: write → writing, sit → sitting\nDùng cho việc đang diễn ra ngay lúc nói, hoặc việc ta nhìn thấy trong một bức ảnh. So sánh: \"She works at a bank\" (công việc của cô ấy) và \"She is working now\" (ngay lúc này).\n!Thiếu be là sai: \"He reading a book\" phải là \"He is reading a book\". Trong Part 1, hãy nghe thật kỹ động từ sau is/are: đó là nơi đáp án đúng khác đáp án sai.\n>He 【is reading|reads|reading|is read】 a report now.=Anh ấy đang đọc báo cáo.\n>They 【are waiting|is waiting|waiting|waits】 for the bus.=Họ đang chờ xe buýt.\n>The woman 【is wearing|wears|wearing|are wearing】 a blue jacket.=Người phụ nữ đang mặc áo khoác xanh.\n>What 【are you doing|you are doing|do you doing|are you do】?=Bạn đang làm gì vậy?\n+Look! The man 【is carrying|carries|carrying|carry】 two boxes.=Nhìn kìa! Người đàn ông đang bê hai cái hộp.\n+I 【am not working|don't working|not working|am not work】 today.=Hôm nay tôi không làm việc.\n[P1]\n👨‍🍳🍳|Một đầu bếp đang nấu ăn trong bếp.|A man is cooking in a kitchen.|A man is eating at a table.|A man is washing his hands.|A man is serving customers.\n🧹👩|Một phụ nữ đang quét sàn nhà.|A woman is sweeping the floor.|A woman is painting a wall.|A woman is carrying a chair.|A woman is opening a window.\n📖🧑🪑|Một người đang ngồi trên ghế đọc sách.|Someone is reading a book.|Someone is writing a letter.|Someone is standing at a counter.|Someone is buying a book.\n👩‍💼👉📊|Một phụ nữ đứng chỉ tay vào biểu đồ trên bảng.|A woman is pointing at a chart.|A woman is drawing a picture.|A woman is sitting at a desk.|A woman is erasing the board.\n[P2]\nWhat are you doing?|I'm writing a report.|I'm a manager.|At my desk.\nIs Mr. Kim working today?|No, he's on vacation.|He works at a bank.|Yes, he was.\nWho are you waiting for?|For my manager.|For ten minutes.|At the front door.\nWhy is she standing outside?|She's waiting for a taxi.|Yes, she is.|In front of the hotel.\nAre they having a meeting now?|Yes, in room 3.|They had lunch.|At ten tomorrow.\n[P5]\nThe manager 【is talking|talks|talking|talk】 to a customer right now. >> \"Right now\" cho biết việc đang diễn ra: is + V-ing.\nThe engineers 【are working|is working|working|works】 on the second floor at the moment. >> Chủ ngữ số nhiều: are + V-ing.\nMs. Sato is 【writing|write|writes|wrote】 an email to the customer. >> Sau \"is\" cần V-ing.\nPlease be quiet. The students 【are taking|takes|is taking|take】 a test. >> Việc đang diễn ra, chủ ngữ số nhiều.\nMr. Lopez 【is not using|not using|does not using|is not use】 his computer now. >> Phủ định: is not + V-ing.\nLook, the customers 【are waiting|waits|is waiting|waiting】 in front of the store. >> \"Look\" báo hiệu hiện tại tiếp diễn; chủ ngữ số nhiều.\n[N]\nCách làm Part 1: trước khi băng chạy, nhìn ảnh và tự trả lời ba câu: ai, đang làm gì, ở đâu. Khi nghe, loại ngay câu nào có động từ hoặc đồ vật không có trong ảnh.\nẢnh trong trang này là hình minh hoạ đơn giản kèm một dòng tả cảnh bằng tiếng Việt, thay cho ảnh chụp của đề thật. Bốn câu mô tả vẫn chỉ được nghe, không hiện chữ.\n##A8|Mua sắm và giá cả|can, could và cách hỏi số lượng\n>Bạn hỏi giá, hỏi số lượng và nói lời đề nghị lịch sự: ba loại câu rất hay gặp ở Part 2 và Part 3.\n[V]Mua sắm\nprice|giá|The ＊ of this shirt is twenty dollars.\nbuy|mua|I want to ＊ a new phone.\nsell|bán|They ＊ fresh bread at that shop.\npay|trả tiền|Can I ＊ by card?\ncheap|rẻ|This bag is ＊; it is only five dollars.\nexpensive|đắt|That watch is too ＊ for me.\nsize|cỡ|Do you have this shirt in a larger ＊?\norder|đặt hàng|I would like to ＊ two coffees, please.\nstore|cửa hàng|The ＊ on Main Street sells shoes.\ncash|tiền mặt|I have no ＊, only a credit card.\nreceipt|hoá đơn, biên lai|Keep your ＊ if you want to return the shirt.\ndiscount|giảm giá|Students get a ten percent ＊.\n[G]\n@can / could|Khả năng và lời đề nghị|can + động từ nguyên mẫu: có thể · cannot (can't): không thể · Can you…? / Could you…?: nhờ ai làm gì (could lịch sự hơn) · Can I…? / Could I…?: xin phép\nSau can và could luôn là động từ nguyên mẫu, không thêm s, không có to.\n!\"She can speaks\" và \"I can to pay\" đều sai.\n>I 【can pay|can to pay|can paying|can pays】 by card.=Tôi có thể trả bằng thẻ.\n>【Could you|Could you to|Do you could|Are you can】 help me, please?=Bạn có thể giúp tôi được không?\n>She 【can't find|can't finds|doesn't can find|can't to find】 her receipt.=Cô ấy không tìm thấy hoá đơn.\n@How much / How many|Hỏi giá và số lượng|How much is / are…?: hỏi giá · How much + danh từ không đếm được (money, time, water) · How many + danh từ số nhiều (boxes, people)\nHow much dùng cho giá tiền và cho danh từ không đếm được; How many dùng cho danh từ đếm được số nhiều. Ở Part 2, câu trả lời cho hai câu hỏi này luôn chứa một con số hoặc một lượng.\n>How 【much|many|long|often】 is this bag?=Cái túi này giá bao nhiêu?\n>How 【many|much|long|far】 shirts do you want?=Bạn muốn mấy cái áo?\n+【Can I|Can I to|Do I can|I can】 have the receipt, please?=Cho tôi xin hoá đơn được không?\n+How 【much|many|few|old】 time do we have?=Chúng ta có bao nhiêu thời gian?\n[P1]\n🛒👩|Một phụ nữ đang đẩy xe hàng trong siêu thị.|A woman is pushing a shopping cart.|A woman is paying at a counter.|A woman is carrying a basket.|A woman is leaving a store.\n💳🧑‍💼|Một người đàn ông đang đưa thẻ cho nhân viên thu ngân.|A man is handing a card to a cashier.|A man is counting some money.|A man is trying on a jacket.|A man is opening a cash register.\n👕👚👗|Quần áo treo thành hàng trên giá trong cửa hàng.|Some clothes are hanging on a rack.|Some clothes are folded in a box.|A customer is trying on a shirt.|The store is closed.\n[P2]\nHow much is this jacket?|It's forty dollars.|It's a large size.|Yes, it is.\nCan I pay by credit card?|Sorry, cash only.|It's too expensive.|Twenty dollars.\nCould you help me find a larger size?|Sure, just a moment.|It's on sale.|No, I'm not.\nHow many boxes do you need?|Three, please.|They're in the store.|It's ten dollars.\nDo you have this in blue?|Let me check for you.|Yes, it's cheap.|At the store.\n[P5]\nCustomers can 【pay|pays|paying|to pay】 by cash or credit card. >> Sau \"can\" là động từ nguyên mẫu.\nHow 【many|much|long|far】 copies of the report do you need? >> \"Copies\" là danh từ đếm được số nhiều: How many.\nCould you 【send|sends|sending|to send】 me the receipt by email? >> Sau \"could you\" là động từ nguyên mẫu.\nHow 【much|many|more|often】 does the delivery cost? >> Hỏi giá tiền dùng How much.\nThe store 【cannot|not can|does not can|is not can】 accept returns without a receipt. >> Phủ định của can là cannot.\nThis printer is too 【expensive|expense|expensively|expenses】 for our small office. >> Sau \"too\" cần một tính từ.\n##A9|Chuyện hôm qua|Quá khứ đơn\n>Bạn kể được việc đã xảy ra và nhận ra các dấu hiệu quá khứ (yesterday, last week, ago), chìa khoá của nhiều câu Part 5.\n[V]Việc đã qua\nyesterday|hôm qua|I was sick ＊, but I feel better today.\nlast week|tuần trước|We had three meetings ＊.\nago|cách đây|I started this job two years ＊.\narrive|đến nơi|The train will ＊ at six o'clock.\nleave|rời đi|I ＊ home at seven every morning.\nvisit|đến thăm|I ＊ my grandparents every summer.\ntravel|đi lại, du lịch|I ＊ to work by train.\nstay|ở lại|We always ＊ at the same hotel.\nforget|quên|Do not ＊ your umbrella; it is raining.\nfind|tìm thấy|I cannot ＊ my keys anywhere.\nbusy|bận|I am very ＊ today; I have five meetings.\ntrip|chuyến đi|He is on a business ＊ to Singapore.\n[G]\n@Past simple|Thì quá khứ đơn|be: was (I, he, she, it) / were (you, we, they) · Động từ có quy tắc: thêm ed (worked, arrived) · Bất quy tắc: go → went, have → had, buy → bought, send → sent, leave → left · Phủ định: did not (didn't) + V · Câu hỏi: Did you + V?\nDùng cho việc đã kết thúc ở một thời điểm trong quá khứ: yesterday, last week, two days ago, in 2020.\n!Sau did và didn't, động từ về nguyên mẫu: \"I didn't went\" là sai. Thấy yesterday, last, ago trong câu Part 5 thì chọn ngay dạng quá khứ.\n>We 【visited|visit|visiting|visits】 the factory last week.=Tuần trước chúng tôi đã đến thăm nhà máy.\n>She 【was|were|is|did】 busy yesterday.=Hôm qua cô ấy bận.\n>I 【sent|send|sended|sending】 the email two hours ago.=Tôi đã gửi email cách đây hai tiếng.\n>They 【didn't arrive|didn't arrived|weren't arrive|not arrived】 on time.=Họ đã không đến đúng giờ.\n+【Did you find|Did you found|Were you find|Do you found】 your keys?=Bạn đã tìm thấy chìa khoá chưa?\n+Mr. Brown 【left|leaves|leave|leaving】 the office at six yesterday.=Hôm qua ông Brown rời văn phòng lúc sáu giờ.\n[P1]\n🧳🚶‍♀️🏨|Một phụ nữ kéo va li đi vào khách sạn.|A woman is pulling a suitcase.|A woman is packing a bag.|A woman is sitting in a lobby.|A woman is getting out of a taxi.\n✈️🛫|Một chiếc máy bay đang cất cánh khỏi đường băng.|An airplane is taking off.|Passengers are boarding a plane.|An airplane is being cleaned.|A plane is parked at a gate.\n🚆🧍🧍|Mấy người đứng trên sân ga chờ tàu.|Some people are waiting on a platform.|Some people are getting off a bus.|A train is leaving the station.|Some people are buying tickets.\n[P2]\nWhen did you arrive?|About an hour ago.|By taxi.|At the hotel.\nDid you send the report yesterday?|Yes, in the afternoon.|To Mr. Park.|I'll send it tomorrow.\nWhere did you stay in Singapore?|At a hotel near the airport.|For three days.|Last week.\nHow was your business trip?|It went very well, thanks.|By plane.|I'm going next week.\nWhy were you late this morning?|I missed the bus.|At nine thirty.|Yes, I was.\n[P5]\nMs. Chen 【visited|visits|visit|visiting】 the Tokyo office last month. >> \"Last month\" là dấu hiệu quá khứ đơn.\nThe manager 【was|were|is|been】 in a meeting all day yesterday. >> Quá khứ của be với chủ ngữ số ít: was.\nWe 【did not receive|did not received|not received|do not received】 your email yesterday. >> Phủ định quá khứ: did not + động từ nguyên mẫu.\nMr. Ahmed 【left|leaves|leaving|leave】 the company three years ago. >> \"Ago\" đi với quá khứ đơn; leave → left.\n【Did|Do|Was|Does】 the customers arrive on time yesterday? >> Câu hỏi quá khứ với động từ thường dùng Did.\nThe engineers 【were|was|are|did】 very busy last week. >> Chủ ngữ số nhiều, quá khứ của be là were.\n[P7]\nT:Notice to all staff\nThe office will be closed on Friday, May 10, because workers are painting the walls. Please take your laptop home on Thursday. The office opens again on Monday at 8:00 A.M. If you have questions, call Ms. Rosa Kim in the main office at extension 204.\n?Why will the office be closed?|It is being painted.|It is a public holiday.|The staff are on a trip.|New desks are arriving.\n?What should staff do on Thursday?|Take their laptops home|Call Ms. Kim|Paint their desks|Come to work early\n?When does the office open again?|On Monday|On Thursday|On Friday|On Saturday\n##A10|Kế hoạch và lịch hẹn|will và be going to\n>Bạn nói được việc sắp làm, hẹn giờ, và nghe hiểu đoạn hội thoại ngắn đầu tiên theo kiểu Part 3.\n[V]Lịch hẹn\nappointment|cuộc hẹn|I have a doctor's ＊ at three o'clock.\nplan|kế hoạch|What is your ＊ for the weekend?\nnext week|tuần tới|I am on holiday now, but I will be back ＊.\nsoon|sớm, chẳng bao lâu nữa|The bus will arrive ＊; just wait two minutes.\nlater|lát nữa, sau đó|I am busy now. Can I call you ＊?\nfree|rảnh|Are you ＊ on Friday evening?\njoin|tham gia|Would you like to ＊ us for lunch?\ncancel|huỷ|We must ＊ the meeting because the manager is sick.\nchange|thay đổi|Can we ＊ the time from two to three?\nready|sẵn sàng|The report is ＊; you can read it now.\nreturn|quay lại; trả lại|He will ＊ from his trip on Monday.\ninvite|mời|We want to ＊ all the customers to the party.\n[G]\n@will và be going to|Hai cách nói về tương lai|will + động từ nguyên mẫu: quyết định ngay lúc nói, lời hứa, dự đoán · am / is / are going to + V: kế hoạch đã có sẵn · Phủ định: will not (won't) · Câu hỏi: Will you…? Are you going to…?\nDấu hiệu: tomorrow, next week, soon, later, in two days.\n!Sau will là động từ nguyên mẫu: \"will to call\" và \"will calls\" đều sai. Thấy tomorrow hoặc next trong câu Part 5, hãy tìm will hoặc be going to.\n>I 【will call|will to call|will calling|calls】 you later.=Lát nữa tôi sẽ gọi cho bạn.\n>She 【is going to visit|going to visit|is going visit|will going to visit】 the factory next week.=Tuần tới cô ấy sẽ đến thăm nhà máy.\n>They 【won't be|won't to be|don't will be|won't are】 ready by Friday.=Họ sẽ không kịp xong trước thứ Sáu.\n>【Will you join|Will you to join|Do you will join|Will you joining】 us for lunch?=Bạn sẽ ăn trưa cùng chúng tôi chứ?\n+The meeting 【will start|will starts|will starting|is start】 at ten tomorrow.=Cuộc họp sẽ bắt đầu lúc mười giờ ngày mai.\n+We 【are going to change|going to change|are going change|will going change】 the schedule.=Chúng tôi sẽ thay đổi lịch.\n[P1]\n📅👩‍💼📱|Một phụ nữ vừa nhìn điện thoại vừa xem lịch để bàn.|A woman is checking her phone.|A woman is writing on a board.|A woman is closing a door.|A woman is carrying a calendar.\n🤝🏢🚪|Hai người chào nhau ở cửa một văn phòng.|Two people are greeting each other.|Two people are eating together.|A man is locking a door.|Two people are sitting on a sofa.\n[P2]\nWhen will the report be ready?|By Friday afternoon.|In the top drawer.|Yes, it's ready.\nAre you going to join the meeting?|Yes, I'll be there at ten.|In room 2.|It was very long.\nWill you be free tomorrow morning?|Sorry, I have an appointment.|Yes, it's free.|At the office.\nWho's going to call the customer?|I'll do it right now.|By phone.|Next week.\nCan we change the meeting to Thursday?|Sure, what time?|It's on Tuesday.|I changed my phone.\n[P3]\nA:Hello, this is Anna from Star Dental Clinic. I'm calling about your appointment tomorrow at two.\nB:Oh, yes. Is there a problem?\nA:I'm sorry, but the doctor will be away tomorrow. Can you come on Thursday at ten instead?\nB:Thursday morning is fine. Should I bring anything?\nA:Just your insurance card, please.\n?Why is the woman calling?|To change an appointment|To sell a product|To ask for directions|To offer a job\n?When will the man visit the clinic?|On Thursday morning|Tomorrow at two|On Thursday afternoon|Next week\n?What should the man bring?|His insurance card|Some money|A photo|His phone\n[P5]\nThe new store 【will open|will opens|opens will|will opening】 next month. >> \"Next month\" chỉ tương lai: will + động từ nguyên mẫu.\nMs. Park 【is going to visit|going to visit|is going visit|goes to visiting】 the Busan office tomorrow. >> Kế hoạch đã định: am / is / are going to + động từ.\nWe 【will not|not will|do not will|are not will】 change the schedule this week. >> Phủ định của will là will not.\nThe manager will 【return|returns|returning|returned】 from his trip on Monday. >> Sau will là động từ nguyên mẫu.\n【Will|Do|Is|Did】 the customers arrive tomorrow morning? >> \"Tomorrow\" chỉ tương lai nên câu hỏi mở bằng Will.\nI am going to 【cancel|cancels|cancelling|cancelled】 my appointment. >> Sau be going to là động từ nguyên mẫu.\n##A11|Mô tả và so sánh|Tính từ, trạng từ và so sánh\n>Bạn phân biệt được tính từ với trạng từ, dạng bài \"chọn từ loại\" chiếm nhiều câu nhất ở Part 5, và biết so sánh hai thứ.\n[V]Từ để mô tả\nlarge|lớn, rộng|We need a ＊ room for fifty people.\nheavy|nặng|This box is too ＊ to carry.\nquiet|yên tĩnh|The library is very ＊; nobody talks.\nfast|nhanh|The new train is very ＊; it takes only one hour.\nslow|chậm|My old computer is very ＊; it takes five minutes to start.\neasy|dễ|The test was ＊; everyone passed.\ndifficult|khó|This question is ＊; I do not know the answer.\npopular|được ưa chuộng|This restaurant is ＊; it is always full.\ncomfortable|thoải mái|This chair is very ＊; I can sit here all day.\ncareful|cẩn thận|Be ＊ when you carry the glasses.\nmodern|hiện đại|The new airport is very ＊, with glass walls.\nquickly|một cách nhanh chóng|Please answer ＊; we have only one minute.\n[G]\n@Tính từ và trạng từ|Adjective và adverb|Tính từ đứng trước danh từ (a careful driver) hoặc sau be (He is careful) · Trạng từ, thường là tính từ + ly, bổ nghĩa cho động từ (He drives carefully) · Bất quy tắc: good → well, fast → fast, hard → hard\nTrong Part 5, bốn lựa chọn thường là bốn dạng của cùng một từ (care, careful, carefully, carefulness). Bạn chỉ cần nhìn vị trí chỗ trống: trước danh từ thì chọn tính từ, bổ nghĩa cho động từ thì chọn trạng từ.\n!Sau be là tính từ, không phải trạng từ: \"The room is quietly\" là sai.\n>She is a 【careful|carefully|care|cares】 driver.=Cô ấy là người lái xe cẩn thận.\n>He speaks English 【well|good|goodly|best of】.=Anh ấy nói tiếng Anh tốt.\n>Please read the form 【carefully|careful|care|cared】.=Hãy đọc kỹ mẫu đơn.\n@So sánh hơn và so sánh nhất|Comparative và superlative|Tính từ ngắn: + er than (faster than), the + est (the fastest) · Tính từ dài: more … than (more expensive than), the most … (the most expensive) · Bất quy tắc: good → better → the best; bad → worse → the worst\nDùng so sánh hơn khi có hai đối tượng, thường đi với than. Dùng so sánh nhất khi có từ ba đối tượng trở lên, thường đi với the và in hoặc of.\n>This printer is 【faster than|more fast than|fast than|the fastest than】 the old one.=Máy in này nhanh hơn cái cũ.\n>It is 【the most popular|the more popular|most popular than|the popularest】 restaurant in town.=Đó là nhà hàng được ưa chuộng nhất thị trấn.\n+The new chairs are 【more comfortable|comfortabler|most comfortable|more comfortably】 than the old ones.=Ghế mới thoải mái hơn ghế cũ.\n+Ms. Vo finished the report 【quickly|quick|quicker than|quickness】.=Cô Võ hoàn thành báo cáo một cách nhanh chóng.\n[P1]\n🏢🏬|Một toà nhà cao tầng hiện đại đứng cạnh một toà nhà thấp.|A tall building is next to a smaller one.|Some workers are building a house.|People are entering a building.|The buildings are the same height.\n🛋️🖼️|Một chiếc ghế sofa đặt dưới một bức tranh trong phòng khách.|A sofa is under a picture.|A man is sitting on a sofa.|A picture is on the floor.|Someone is moving a sofa.\n📦🏋️‍♂️|Một người đàn ông đang nâng một cái hộp lớn.|A man is lifting a large box.|A man is opening a small box.|A man is sitting on a box.|Some boxes are in a truck.\n[P2]\nWhich printer is faster?|The new one, I think.|It's on the second floor.|Yes, it prints well.\nIs the new office larger than the old one?|Yes, much larger.|It's on Main Street.|We moved last week.\nHow was the test?|It was easier than I expected.|At nine o'clock.|In room 4.\nWho is the best driver in your family?|My sister, for sure.|By car.|It's a good car.\nWhy do you like this café?|It's quiet and comfortable.|I'd like a coffee.|Every morning.\n[P4]\nN:Attention, shoppers. Welcome to Green Mart. This week only, all office chairs are twenty percent off. Our new Comfort Plus chair is lighter and more comfortable than last year's model, and it is our most popular product. You can find the chairs on the second floor, next to the lamps. The sale ends on Sunday, so please hurry.\n?What is on sale this week?|Office chairs|Desk lamps|Computers|Sofas\n?What does the speaker say about the Comfort Plus chair?|It is the most popular product.|It is heavier than the old model.|It is the cheapest chair.|It is sold only online.\n?Where can shoppers find the chairs?|On the second floor|Near the front door|Next to the cash registers|On the first floor\n[P5]\nMr. Diaz is a very 【careful|carefully|care|caring for】 engineer. >> Trước danh từ (engineer) cần tính từ.\nPlease drive 【slowly|slow|slowness|slower than】 near the school. >> Bổ nghĩa cho động từ \"drive\" cần trạng từ.\nThe new model is 【more expensive|expensiver|most expensive|more expensively】 than the old one. >> Tính từ dài, có \"than\": more + tính từ.\nThis is the 【largest|larger|more large|large】 meeting room in the building. >> Có \"the\" và \"in the building\": so sánh nhất.\nMs. Ono speaks Japanese and English very 【well|good|better than|goodness】. >> Trạng từ của good là well.\nThe second test was 【easier|more easy|easiest|easily】 than the first one. >> easy → easier (đổi y thành i rồi thêm er).\n##A12|Lời đề nghị và yêu cầu|would like, should, have to\n>Bài cuối của chặng: bạn gọi món, đặt chỗ, nói điều nên và phải làm, rồi làm thử đủ các dạng bài của đề thi ở mức dễ nhất.\n[V]Nhà hàng và khách sạn\nmenu|thực đơn|Can I see the ＊, please? I want to order.\ntable|bàn (ăn)|We would like a ＊ for four people.\nreservation|sự đặt chỗ trước|I have a ＊ for two nights under the name Lee.\nticket|vé|How much is a ＊ to Da Nang?\nseat|chỗ ngồi|Is this ＊ free, or is someone sitting here?\ncheck in|làm thủ tục nhận phòng|You can ＊ at the hotel after two o'clock.\nbill|hoá đơn thanh toán|Could we have the ＊, please? We are ready to pay.\ndrink|đồ uống|Would you like a ＊? We have tea, coffee and juice.\nmeal|bữa ăn|Breakfast is the first ＊ of the day.\nguest|khách (khách sạn, khách mời)|Each hotel ＊ gets a free breakfast.\npassport|hộ chiếu|You must show your ＊ at the airport.\nrecommend|giới thiệu, gợi ý|Can you ＊ a good restaurant near here?\n[G]\n@would like|Muốn (cách nói lịch sự)|I would like (I'd like) + danh từ · I would like to + động từ · Would you like…?: lời mời\n\"I'd like a coffee\" lịch sự hơn \"I want a coffee\". Trong Part 2, câu trả lời cho \"Would you like…?\" thường là \"Yes, please\" hoặc \"No, thank you\".\n>I 【would like|would like to|like would|am like】 a table for two.=Tôi muốn một bàn cho hai người.\n>【Would you like|Do you would like|Would you to like|Are you like】 some coffee?=Bạn dùng chút cà phê nhé?\n>She would like 【to check in|check in|checking in|checks in】 now.=Cô ấy muốn làm thủ tục nhận phòng bây giờ.\n@should và have to|Nên và phải|should + động từ nguyên mẫu: lời khuyên · have to / has to + động từ nguyên mẫu: bắt buộc · don't have to: không cần phải\nShould là lời khuyên, làm hay không tuỳ người nghe. Have to là bắt buộc do quy định hoặc hoàn cảnh. Chủ ngữ he, she, it dùng has to.\n>You 【should make|should to make|should making|should makes】 a reservation.=Bạn nên đặt chỗ trước.\n>Guests 【have to|has to|having to|have】 show their passports.=Khách phải xuất trình hộ chiếu.\n+I'd like 【to order|order|ordering|ordered】 the fish, please.=Tôi muốn gọi món cá.\n+He 【has to|have to|should to|is have to】 leave before six.=Anh ấy phải đi trước sáu giờ.\n[N]\nBạn vừa đi hết Chặng 1. Từ chặng sau, mỗi bài sẽ đi sâu vào một dạng câu hỏi của đề thi. Trước khi sang chặng mới, hãy vào mục Luyện tập và làm lại Part 1, Part 2 và Part 5 ở chế độ trộn mọi bài cho đến khi đạt trên 80%.\nMẹo chung cho người mới: ở phần nghe, đừng dịch từng từ sang tiếng Việt. Hãy bắt từ để hỏi ở đầu câu (Who, Where, When) và động từ chính, thế là đủ để loại hai đáp án sai.\n[P1]\n🍽️👨‍🍳🧑‍🤝‍🧑|Một người phục vụ đang mang đồ ăn ra cho hai vị khách ngồi ở bàn.|A waiter is serving some food.|A waiter is cleaning a table.|The customers are paying the bill.|The restaurant is empty.\n🛎️🧳👩‍💼|Một vị khách đứng ở quầy lễ tân khách sạn, va li đặt bên cạnh.|A guest is standing at the front desk.|A guest is sleeping in a room.|A woman is carrying a suitcase upstairs.|A guest is reading a menu.\n🎫🧍🧍🧍|Nhiều người xếp hàng trước quầy bán vé.|People are standing in line.|People are sitting in their seats.|A man is tearing a ticket.|The ticket office is closed.\n[P2]\nWould you like something to drink?|Just water, please.|Yes, I like it.|At the restaurant.\nDo I have to make a reservation?|Yes, it's very busy on weekends.|A table for two.|At seven o'clock.\nWhat would you like to order?|I'll have the chicken, please.|It was delicious.|The menu is here.\nShould we take a taxi to the airport?|Yes, it's faster than the bus.|At gate 5.|My passport is in my bag.\nCan you recommend a good hotel?|Try the Park Hotel near the station.|For two nights.|Yes, I checked in.\n[P3]\nA:Good evening. Do you have a reservation?\nB:Yes, a table for two under the name Tran, at seven o'clock.\nA:Thank you, Mr. Tran. Your table is by the window. Would you like to see the menu now?\nB:Yes, please. And could we have some water first?\nA:Of course. I'll bring it right away. Tonight I recommend the fish. It's very fresh.\n?Where are the speakers?|At a restaurant|At a hotel front desk|At an airport|At a supermarket\n?What does the man ask for first?|Some water|The bill|A different table|The fish\n?What does the woman recommend?|The fish|The chicken|The soup|The dessert\n[P5]\nI would like 【to book|book|booking|booked】 a room for two nights. >> would like + to + động từ.\nGuests 【have to|has to|having to|should to】 check in before 10 P.M. >> Chủ ngữ số nhiều dùng have to.\nYou should 【bring|brings|bringing|to bring】 your passport to the airport. >> Sau should là động từ nguyên mẫu.\n【Would|Do|Are|Did】 you like a seat by the window? >> Lời mời: Would you like…?\nMs. Han 【has to|have to|should to|is having】 finish the report by Friday. >> Chủ ngữ số ít dùng has to.\nWe would like 【a table|to table|tables to|table】 for six people, please. >> would like + danh từ (a table).\n[P6]\nT:To all hotel guests\nWelcome to the Sunrise Hotel. Breakfast is served every morning __(1)__ 6:30 to 10:00 in the restaurant on the first floor. If you would like breakfast in your room, please __(2)__ the front desk before 9:00 P.M. the night before. __(3)__ Guests have to leave their rooms by noon on the day of check-out. We hope you enjoy your stay.\n?(1)|from|in|on|by >> Cặp \"from … to …\" chỉ khoảng thời gian.\n?(2)|call|calls|calling|called >> Sau \"please\" là động từ nguyên mẫu.\n?(3)|The swimming pool is open from 7:00 A.M. to 9:00 P.M.|Thank you for your payment.|The restaurant was closed last year.|Please send us your report.\n[P7]\nT:Lucky Café: Now open on Hill Street\nCome and try the best coffee in town. We are open every day from 7:00 A.M. to 8:00 P.M. This week only, buy one coffee and get a second one free. We also have fresh sandwiches and cakes. Students get a ten percent discount with a student card. For large orders, please call us one day early at 555-0147.\n?What is being advertised?|A new café|A supermarket|A cooking class|A hotel\n?What is offered this week only?|A free second coffee|A free sandwich|A discount for all customers|Free delivery\n?Who can get a discount?|Students|Hotel guests|Office workers|Children\n?How can customers make a large order?|By calling a day before|By sending an email|By visiting the website|By coming at 7:00 A.M.\n\n##B1|Giấy tờ văn phòng|Từ loại 1: danh từ\n>Khoảng một phần ba số câu Part 5 hỏi về từ loại. Bài này dạy bạn nhận ra chỗ trống cần danh từ và nhận mặt danh từ qua đuôi của nó.\n[V]Giấy tờ và đồ dùng văn phòng\ndocument|tài liệu, văn bản|Please sign the ＊ on the last page.\ncopy|bản sao|I need one more ＊ of this report for the manager.\nfile|tập hồ sơ|The customer's ＊ is in the top drawer.\nform|mẫu đơn|Please fill out this ＊ with your name and address.\nsignature|chữ ký|We need your ＊ at the bottom of the contract.\nenvelope|phong bì|Put the letter in an ＊ and write the address on it.\nsupplies|đồ dùng, văn phòng phẩm|We order office ＊ such as paper and pens every month.\nequipment|thiết bị|The gym has new ＊, including ten running machines.\ninformation|thông tin|For more ＊, please visit our website.\napplication|đơn xin, hồ sơ ứng tuyển|Her job ＊ arrived by email this morning.\ndecision|quyết định|The manager will make a ＊ about the budget tomorrow.\nemployee|nhân viên|Every ＊ gets twenty days of holiday a year.\n[G]\n@Danh từ: đứng ở đâu trong câu|Vị trí của danh từ|Sau a, an, the, this, my, your, our · Sau tính từ: an important decision · Làm chủ ngữ hoặc tân ngữ của động từ · Sau giới từ: for your information\nKhi bốn lựa chọn là bốn dạng của cùng một gốc từ, đừng dịch cả câu. Chỉ cần nhìn từ đứng ngay trước và ngay sau chỗ trống để biết cần từ loại gì.\n!Đuôi thường gặp của danh từ: -tion, -sion, -ment, -ness, -ity, -ance, -ence. Chỉ người: -er, -or, -ee, -ist, -ant.\n>Please read the 【information|inform|informative|informed】 carefully.=Vui lòng đọc kỹ thông tin.\n>The manager made an important 【decision|decide|decisive|decided】.=Quản lý đã đưa ra một quyết định quan trọng.\n>We need new office 【equipment|equip|equipped|equipping】.=Chúng tôi cần thiết bị văn phòng mới.\n>Thank you for your 【application|apply|applied|applying】.=Cảm ơn bạn đã gửi hồ sơ ứng tuyển.\n+All 【employees|employ|employed|employing】 must sign the form.=Tất cả nhân viên phải ký vào mẫu đơn.\n+The 【payment|pay|paid|payable】 is due on Friday.=Khoản thanh toán đến hạn vào thứ Sáu.\n[N]\nPart 2, câu hỏi Who: câu trả lời đúng thường là tên người, chức danh (the manager, my assistant) hoặc một phòng ban (the sales department). Đáp án sai hay trả lời về nơi chốn hoặc thời gian.\nCũng có khi người đáp không biết: \"I'm not sure\" hoặc \"Ask Ms. Lee\" vẫn là câu trả lời đúng cho mọi loại câu hỏi.\n[P1]\n📄🖊️|Một cây bút đặt trên một tờ giấy ở mặt bàn.|A pen is lying on a document.|A man is signing a form.|Some papers are in a drawer.|A pen is in a pocket.\n🗄️📁📁|Mấy tập hồ sơ xếp trong một ngăn tủ đang mở.|Some files are in an open drawer.|A woman is closing a cabinet.|Files are scattered on the floor.|The cabinet is empty.\n🖨️👩‍💼📑|Một phụ nữ đứng cạnh máy photocopy, tay cầm một xấp giấy.|A woman is holding some papers.|A woman is repairing a machine.|A woman is typing on a keyboard.|A woman is leaving the room.\n[P2]\nWho signed this document?|The department manager did.|On the last page.|Yesterday afternoon.\nWho is in charge of ordering supplies?|Ms. Alvarez, I think.|From the store downtown.|Twice a month.\nWho should I give this form to?|Leave it at the front desk.|It's two pages long.|Before five o'clock.\nWho's the new employee?|That's Mr. Chen from accounting.|Yes, he's new.|In the lobby.\nWho made the copies for the meeting?|My assistant made them.|Twenty copies, please.|In the copy room.\nWho can I ask for more information?|I'm not sure. Try the front desk.|It's on the website.|Yes, you can.\n[P5]\nPlease send your 【application|apply|applied|applicable】 to the personnel office by Friday. >> Sau \"your\" cần danh từ: application.\nThe 【decision|decide|decisive|decidedly】 to close the store was made last week. >> Sau \"The\" và làm chủ ngữ: danh từ decision.\nAll new 【employees|employ|employment|employing】 must attend the training session. >> Sau \"new\" cần danh từ chỉ người, số nhiều vì có \"All\".\nWe are waiting for the 【delivery|deliver|delivered|deliverable】 of the new printers. >> Sau \"the\" và trước \"of\": danh từ delivery.\nThe store offers a wide 【selection|select|selective|selected】 of office supplies. >> Sau tính từ \"wide\" cần danh từ.\nMs. Park is the 【manager|manage|managing|managed】 of the sales department. >> Sau \"the\" cần danh từ chỉ người: manager.\nThank you for your quick 【response|respond|responsive|responded】 to our email. >> Sau tính từ \"quick\" cần danh từ.\nThe 【equipment|equip|equipped|equipping】 in the new office is very modern. >> Chủ ngữ của \"is\" phải là danh từ.\nCustomers can find product 【information|inform|informed|informative】 on our website. >> Danh từ ghép: product information.\nThe company announced the 【appointment|appoint|appointed|appointing】 of a new director. >> Sau \"the\" và trước \"of\": danh từ.\n##B2|Tuyển dụng|Từ loại 2: tính từ\n>Bạn nhận ra chỗ trống cần tính từ (trước danh từ, sau be) và nghe hiểu câu hỏi Where, loại câu hỏi dễ ăn điểm nhất ở Part 2.\n[V]Tuyển dụng\nhire|tuyển, thuê người|The company plans to ＊ ten new engineers this year.\ninterview|buổi phỏng vấn|I have a job ＊ at the bank on Monday morning.\ncandidate|ứng viên|We will speak to each ＊ for thirty minutes.\nposition|vị trí công việc|She applied for the ＊ of sales manager.\nexperience|kinh nghiệm|You need two years of ＊ for this job.\nqualified|đủ trình độ, đủ điều kiện|He is well ＊ for the job; he has a degree and five years of experience.\nresume|sơ yếu lý lịch|Please send your ＊ and a cover letter by email.\nsalary|lương|The job offers a good monthly ＊ and free lunch.\nfull-time|toàn thời gian|This is a ＊ job, forty hours a week.\navailable|có sẵn, rảnh, còn trống|The manager is not ＊ now; she is in a meeting.\nsuccessful|thành công|The ＊ candidate will start work in May.\nresponsible|chịu trách nhiệm|Ms. Tan is ＊ for hiring new staff.\n[G]\n@Tính từ: đứng ở đâu trong câu|Vị trí của tính từ|Trước danh từ: a successful candidate · Sau be, become, seem, look: The position is available · Sau trạng từ chỉ mức độ: very, quite, highly, well + tính từ\nTính từ trả lời câu hỏi \"như thế nào\" cho danh từ. Nếu sau chỗ trống là một danh từ, và trước đó là a, an, the, rất có thể chỗ trống cần tính từ.\n!Đuôi thường gặp của tính từ: -ful, -able, -ible, -ive, -al, -ous, -ic, -ent, -ant. Cẩn thận: V-ing và V-ed cũng có thể làm tính từ (an interesting job, a qualified candidate).\n>She is a very 【successful|success|succeed|successfully】 manager.=Cô ấy là một người quản lý rất thành công.\n>Is the meeting room 【available|availability|avail|availably】 at three?=Phòng họp có trống lúc ba giờ không?\n>We need a 【responsible|responsibility|responsibly|respond】 person for this job.=Chúng tôi cần một người có trách nhiệm cho công việc này.\n>The new employee is highly 【qualified|qualify|qualification|qualifies】.=Nhân viên mới có trình độ cao.\n+The interview was very 【helpful|help|helpfully|helps】.=Buổi phỏng vấn rất hữu ích.\n+They offer a 【competitive|compete|competition|competitively】 salary.=Họ đưa ra mức lương cạnh tranh.\n[N]\nPart 2, câu hỏi Where: câu trả lời đúng chứa một nơi chốn, thường mở bằng giới từ (in, on, at, next to, across from). Bẫy quen thuộc là một câu trả lời về thời gian, vì Where và When nghe khá giống nhau khi nói nhanh.\nCâu trả lời đúng cũng có thể không nêu nơi chốn trực tiếp: \"Where's the report?\" có thể được đáp \"Mr. Kim has it\".\n[P1]\n🤝👔👩‍💼|Hai người mặc đồ công sở bắt tay nhau qua một cái bàn.|They're shaking hands across a table.|They're signing a contract.|They're entering an office.|They're looking at a screen.\n📋👨‍💼|Một người đàn ông đang xem một bản lý lịch cầm trên tay.|A man is reading a document.|A man is writing on a board.|A man is filing some papers.|A man is talking on the phone.\n🪑🪑🪑🚪|Ba cái ghế trống đặt thành hàng cạnh một cánh cửa.|Some chairs are lined up near a door.|People are waiting in a hallway.|A door is being opened.|The chairs are stacked on a table.\n[P2]\nWhere will the interview be held?|In meeting room B.|At ten thirty.|With Ms. Garcia.\nWhere should I send my resume?|To the personnel department.|By Friday.|Two pages.\nWhere's the personnel office?|On the third floor, next to the elevator.|It opens at nine.|Yes, it is.\nWhere did you work before?|At a bank in Seoul.|For five years.|As an accountant.\nWhere can I park my car?|There's a lot behind the building.|It's a small car.|For two hours.\nWhere are the application forms?|Ms. Wong has them.|Fill it out in pen.|Yes, I applied.\n[P3]\nA:Hello, Mr. Baker. This is Susan Cho from Harbor Trading. We received your resume, and we'd like to invite you for an interview.\nB:That's great news. When would you like me to come?\nA:Are you available on Wednesday at two?\nB:I'm sorry, I have another appointment then. Could we make it Thursday morning?\nA:Thursday at ten is fine. Please bring a copy of your certificates.\n?Why is the woman calling?|To arrange an interview|To offer a discount|To cancel an order|To ask for a payment\n?Why can't the man come on Wednesday?|He has another appointment.|He will be out of town.|He is not interested.|He works on Wednesdays.\n?What should the man bring?|Copies of his certificates|A photo|His laptop|A letter from his manager\n[P5]\nThe company is looking for a 【reliable|rely|reliably|reliability】 assistant. >> Giữa \"a\" và danh từ \"assistant\" cần tính từ.\nMs. Ono is 【responsible|responsibility|responsibly|responds】 for training new staff. >> Sau \"is\" và trước \"for\": tính từ responsible.\nOnly 【qualified|qualify|qualification|qualifying for】 candidates will be invited to an interview. >> Trước danh từ \"candidates\" cần tính từ.\nThe position is still 【available|availability|avail|availably】. >> Sau \"is still\" cần tính từ.\nWe offer a very 【attractive|attract|attraction|attractively】 salary and benefits. >> Sau \"very\" và trước danh từ: tính từ.\nMr. Reed was 【successful|success|successfully|succeed】 in his job interview. >> Sau \"was\" cần tính từ.\nThe interview questions were quite 【difficult|difficulty|difficulties|difficultly】. >> Sau \"were quite\" cần tính từ.\nApplicants must have 【previous|previously|preview|previousness】 experience in sales. >> Trước danh từ \"experience\" cần tính từ.\nThe new manager seems very 【confident|confidence|confidently|confide】. >> Sau \"seems very\" cần tính từ.\nPlease complete the 【attached|attach|attachment|attaching to】 form and return it to us. >> Tính từ dạng V-ed đứng trước danh từ: the attached form (mẫu đính kèm).\n##B3|Họp hành|Từ loại 3: trạng từ\n>Bạn biết ba vị trí của trạng từ, dạng câu \"chọn từ có đuôi -ly\" gần như đề nào cũng có, và nghe hiểu câu hỏi When.\n[V]Cuộc họp\nagenda|chương trình cuộc họp|The first item on the ＊ is the new budget.\nattend|tham dự|All managers must ＊ the meeting on Friday.\npresentation|bài thuyết trình|She gave a ten-minute ＊ about the new product.\ndiscuss|thảo luận|We need to ＊ the problem before we decide.\nconference|hội nghị|More than 500 people came to the sales ＊ in Bangkok.\npostpone|hoãn lại|We had to ＊ the meeting until next week because the manager was sick.\nparticipant|người tham gia|Each ＊ in the workshop received a certificate.\non time|đúng giờ|The train left ＊, at exactly nine o'clock.\nrecently|gần đây|The company ＊ opened a new office in Da Nang.\nimmediately|ngay lập tức|Please call me ＊; it is very urgent.\nfinally|cuối cùng|After three hours, the meeting ＊ ended.\nregularly|đều đặn, thường xuyên|The team meets ＊, every Monday morning.\n[G]\n@Trạng từ: ba vị trí hay gặp|Vị trí của trạng từ|Giữa trợ động từ và động từ chính: has recently opened, will be carefully checked · Sau động từ hoặc cuối câu: She speaks clearly · Trước tính từ hoặc trạng từ khác: highly qualified, very quickly\nTrạng từ bổ nghĩa cho động từ, tính từ hoặc cả câu. Nếu câu đã đủ chủ ngữ, động từ, tân ngữ mà vẫn còn chỗ trống, chỗ đó gần như chắc chắn là trạng từ.\n!Mẹo nhanh: chỗ trống nằm giữa \"has / have / is / are / will\" và một động từ thì chọn từ có đuôi -ly. Một số trạng từ không có -ly: well, fast, hard, late, soon.\n>The company has 【recently|recent|recency|more recent】 hired fifty people.=Công ty gần đây đã tuyển năm mươi người.\n>Please read the agenda 【carefully|careful|care|cared】.=Vui lòng đọc kỹ chương trình họp.\n>The room is 【completely|complete|completion|completed】 full.=Căn phòng kín chỗ hoàn toàn.\n>Sales increased 【quickly|quick|quicken|quickness】 last year.=Doanh số tăng nhanh vào năm ngoái.\n+The report will be 【carefully|careful|care|caring】 checked.=Bản báo cáo sẽ được kiểm tra cẩn thận.\n+She 【regularly|regular|regularity|regulate】 attends conferences.=Cô ấy thường xuyên dự hội nghị.\n[N]\nPart 2, câu hỏi When: đáp án đúng nêu thời gian (at three, on Monday, next week, in an hour, as soon as possible, not until Friday). Bẫy thường gặp là nơi chốn, hoặc một khoảng thời gian trả lời cho How long (\"for two hours\").\nChú ý th
