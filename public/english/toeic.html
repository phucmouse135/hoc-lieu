g the personnel office\n?What is NOT required of applicants?|Experience with garden equipment|A university degree|Five years in sales|Good English\n?What is indicated about the bonus?|It depends on performance.|It is paid every month.|It is the same for all staff.|It replaces the salary.\n?What will happen to applicants who are not selected?|They will not be contacted.|They will receive a letter.|Their resumes will be returned.|They will be interviewed by phone.\n##D10|Part 6 ở mức khó|Thông báo thay đổi lớn của công ty\n>Bốn đoạn Part 6 mức khó thường là thông cáo về sáp nhập, chuyển trụ sở, bổ nhiệm. Từ vựng trang trọng, câu dài, và câu chèn đòi hỏi hiểu mạch lập luận.\n[V]Thay đổi trong công ty\nrelocate|chuyển địa điểm|The company will ＊ its headquarters from Hanoi to Da Nang.\nrelocation|việc chuyển địa điểm|The company paid for my ＊ when I moved to the new office.\nrestructure|tái cơ cấu|The new director plans to ＊ the sales department into three smaller teams.\nmerger|vụ sáp nhập|After the ＊, the two banks became one company with a new name.\nacquisition|vụ mua lại|The ＊ of the smaller company cost fifty million dollars.\ntransition|sự chuyển tiếp|The ＊ to the new computer system took three months.\nstreamline|tinh gọn (quy trình)|We need to ＊ the ordering process so that it takes fewer steps.\nconsolidate|hợp nhất, gộp lại|The company will ＊ its three warehouses into one large building.\noversee|giám sát, phụ trách|Ms. Lim will ＊ the project from start to finish.\nappoint|bổ nhiệm|The board will ＊ a new director next week.\nsuccessor|người kế nhiệm|Mr. Kim will retire in June, and his ＊ has not been chosen yet.\ninterim|tạm quyền, lâm thời|Ms. Cho will be the ＊ manager until a permanent one is hired.\n[N]\nThông cáo công ty có khung quen thuộc: tin chính ở câu đầu, lý do, tác động đến nhân viên hoặc khách hàng, mốc thời gian, lời trấn an và cách liên hệ. Câu chèn thường là câu lý do hoặc câu trấn an, nằm ngay sau tin chính hoặc ngay trước cách liên hệ.\nỞ mức khó, câu chèn có hai đáp án \"nghe đều hợp chủ đề\". Hãy kiểm tra mạch thời gian và mạch logic: câu chèn nói về tương lai có đứng giữa hai câu về quá khứ không? Nó có mâu thuẫn với câu sau không?\nChỗ trống từ vựng ở Part 6 mức khó thường là động từ trang trọng (oversee, appoint, streamline) hoặc từ nối ít gặp (Accordingly, Nevertheless, In the meantime, To that end). Nevertheless tương đương However; Accordingly tương đương Therefore; In the meantime tương đương Meanwhile.\n[P6]\nT:To: All employees. From: Office of the President. Subject: Relocation of headquarters\nI am writing to announce that our headquarters will __(1)__ to the new Harbor Tower building on September 1. The decision was made because our current office can no longer accommodate our growing staff. __(2)__ The move will take place over one weekend so that work is not interrupted. Each department will receive a detailed schedule next week. In the __(3)__, please begin sorting your files and removing any documents that are no longer needed. Ms. Elena Park has been __(4)__ to oversee the move and will answer any questions.\n?(1)|relocate|restructure|consolidate|appoint >> Trụ sở chuyển đến toà nhà mới: relocate to.\n?(2)|The new building offers twice as much space and is closer to the train station.|Harbor Tower was sold last year.|Our staff has decreased since January.|The president will retire in September.\n?(3)|meantime|transition|interim of|schedule >> Cụm cố định: In the meantime (trong lúc chờ).\n?(4)|appointed|appointing|appoint|appointment >> Bị động: has been + V3.\n--\nT:Press release: Baker Foods and Sunny Farms\nBaker Foods announced today that it has completed its __(1)__ of Sunny Farms, a producer of fruit juice. Sunny Farms will keep its name and its factory, and no jobs will be lost. __(2)__ Mr. Carlos Ruiz, who founded Sunny Farms twenty years ago, will remain as director during a six-month __(3)__ period. After that, a successor will be chosen. \"We want to grow the business, not change it,\" said the president of Baker Foods. __(4)__, the company plans to hire fifty new workers next year.\n?(1)|acquisition|relocation|transition|successor >> Baker Foods mua lại Sunny Farms: acquisition of.\n?(2)|In fact, the two companies will continue to operate separately.|Sunny Farms closed in March.|Fruit prices fell last year.|Mr. Ruiz left the company in 2010.\n?(3)|transition|merger|interim of|consecutive >> \"Transition period\": giai đoạn chuyển tiếp.\n?(4)|Accordingly|Nevertheless|Otherwise|Instead >> Câu sau là hệ quả phù hợp với ý \"muốn phát triển\": Accordingly (theo đó).\n--\nT:Memo: Changes in the customer service department\nTo streamline our work, we will consolidate the phone and email support teams into a single team beginning October 1. At present, customers who call and then send an email often have to explain their problem twice. __(1)__ Under the new system, every customer will be __(2)__ one staff member who handles both calls and emails. Training will be provided during September. Ms. Dana Cho will serve as __(3)__ team leader until a permanent leader is appointed. We recognize that change can be difficult. __(4)__, we are confident that the new structure will benefit both customers and staff.\n?(1)|This wastes time and causes frustration.|Emails are answered within one day.|The phone system is new.|Customers prefer to visit our office.\n?(2)|assigned|assigning|assign|assignment >> Bị động: will be + V3; mỗi khách được phân cho một nhân viên.\n?(3)|interim|successor|prior|initial >> \"Interim team leader\": trưởng nhóm tạm quyền.\n?(4)|Nevertheless|Accordingly|For example|In the meantime >> Hai ý ngược chiều (thay đổi khó, nhưng chúng tôi tin tưởng): Nevertheless.\n[P7]\nT:From: Helen Ward, President. To: All staff. Subject: Leadership change\nDear colleagues, after twenty-two years with the company, Mr. George Tan has informed the board that he will retire as Director of Operations on March 31. Under his leadership, we consolidated our four factories into two and streamlined our delivery system, which reduced costs by a substantial amount.\nThe board has appointed Ms. Priya Nair as his successor. Ms. Nair joined us six years ago and currently oversees the Singapore office. She will work alongside Mr. Tan throughout March to ensure a smooth transition. A dinner in Mr. Tan's honor will be held on March 28; details will follow.\nT:From: Priya Nair. To: Helen Ward. Subject: Re: Leadership change\nDear Helen, thank you for your kind words and for the board's trust. I am looking forward to the new role. I have one concern about the schedule: I am supposed to lead the trade fair in Jakarta from March 10 to March 14, which was arranged last year. Unless you would prefer that someone else go, I plan to attend as arranged and work with George during the remaining weeks of the month. I will, of course, be at the dinner. Best regards, Priya\n?What is the purpose of the first email?|To announce a retirement and a replacement|To report on factory costs|To invite staff to a trade fair|To introduce a new office\n?What is indicated about Mr. Tan?|He helped lower the company's costs.|He joined the company six years ago.|He will move to Singapore.|He was appointed by Ms. Nair.\n?What is Ms. Nair's current position?|Head of the Singapore office|Director of Operations|President|Trade fair manager\n?When will Ms. Nair NOT be able to work alongside Mr. Tan?|From March 10 to March 14|On March 28|On March 31|Throughout March >> Câu liên kết: thư một nói bà sẽ làm cùng ông Tan suốt tháng Ba; thư hai cho biết bà đi Jakarta từ 10 đến 14 tháng Ba.\n?What does Ms. Nair say about the dinner?|She will attend it.|She will organize it.|She cannot come.|She wants to change the date.\n[P3]\nA:Have you heard? The board has appointed an interim director for the marketing department.\nB:Really? I thought they were going to promote Mr. Lewis.\nA:He turned it down. He's relocating to the Sydney office in June.\nB:I see. So who's the interim director?\nA:Ms. Grant, from finance. She'll oversee both departments during the transition, until a successor is found.\nB:That's a lot of work for one person. I hope they find someone soon.\n?What are the speakers discussing?|A temporary appointment|A merger|A new office in Sydney|A budget cut\n?Why did Mr. Lewis not take the position?|He is moving to another office.|He is retiring.|He was not offered it.|He prefers finance.\n?What does the man imply about Ms. Grant?|She will be very busy.|She is not competent.|She will move to Sydney.|She wants to leave the company.\n[P2]\nWho's going to oversee the relocation?|Ms. Park has been appointed.|To Harbor Tower.|It's overseas.\nWhen will Mr. Tan's successor start?|At the beginning of April.|He was successful.|In operations.\nWhy are the two teams being consolidated?|To streamline customer service.|In October.|They're very solid.\nHas the merger been completed?|Not yet. It's still pending approval.|It emerged yesterday.|With Sunny Farms.\n[P5]\nThe board will 【appoint|appointment|appointed|appointing】 a new director by the end of the month. >> Sau \"will\" cần động từ nguyên mẫu.\nMr. Tan's 【successor|success|successive|successful】 will take over in April. >> Sau sở hữu cách cần danh từ chỉ người kế nhiệm.\nThe company plans to 【streamline|streamlined|stream|streaming of】 its hiring process. >> Sau \"plans to\" cần động từ nguyên mẫu.\nMs. Cho will serve as 【interim|internal of|interior|interval】 manager until a permanent one is hired. >> \"Interim manager\": quản lý tạm quyền.\nThe 【relocation|relocate|relocated|relocating to】 of the factory will take three months. >> Sau \"The\" và trước \"of\": danh từ.\nA project manager was hired to 【oversee|overlook|overtake|overcome】 the construction. >> \"Oversee\": giám sát. \"Overlook\" là bỏ sót.\n\n##D11|Part 7: bài báo kèm thư|Đoạn kép loại ba và câu suy luận liên kết\n>Cặp \"bài báo và thư phản hồi\" khó hơn vì từ vựng kinh doanh và vì câu liên kết đòi hỏi suy luận, không chỉ dò số liệu.\n[V]Tin kinh doanh nâng cao\nquarterly|hằng quý|The company publishes a ＊ report every three months.\nfiscal|thuộc tài chính, tài khoá|The ＊ year of our company ends on March 31.\nshareholder|cổ đông|Each ＊ received a letter about the yearly meeting.\ndividend|cổ tức|The company paid a ＊ of two dollars per share.\nstake|cổ phần|The investor bought a 20 percent ＊ in the airline.\nsubsidiary|công ty con|The bank owns a ＊ in Singapore that sells insurance.\nventure|dự án kinh doanh (có rủi ro)|The two companies started a joint ＊ to build electric cars.\ninitiative|sáng kiến, chương trình hành động|The city's new ＊ aims to plant 10,000 trees.\nsustainable|bền vững|We need ＊ farming that does not damage the soil.\noutlook|triển vọng|The economic ＊ for next year is positive.\nsurge|sự tăng vọt|There was a ＊ in online sales during the holidays.\ndecline|sự sụt giảm|The company reported a ＊ in profits for the second year.\n[N]\nTrong cặp bài báo và thư, văn bản thứ hai thường do một người có liên quan viết: độc giả góp ý, người được nhắc tên đính chính, hoặc lãnh đạo công ty gửi nhân viên sau khi bài báo đăng. Hãy tìm xem người viết thư đồng tình, bổ sung hay sửa lại điều gì của bài báo.\nCâu liên kết ở mức này thường là câu suy luận: \"What is suggested about Mr. Park?\" mà đáp án cần một chi tiết về ông ở bài báo và một chi tiết ở thư. Ví dụ, bài báo viết \"the store will open first in Da Nang\", thư viết \"I will manage the first store\", suy ra ông sẽ làm việc ở Đà Nẵng.\nSố liệu kinh doanh: chú ý hướng thay đổi (rose, surged, declined, remained flat), mốc so sánh (compared with last year, from the previous quarter) và đơn vị (percent, million). Đáp án sai thường đúng con số nhưng sai hướng hoặc sai mốc.\n[P7]\nT:Harbor Coffee plans major expansion\nHai Phong. Harbor Coffee, the popular local coffee chain, announced on Monday that it will open twenty new stores over the next two years. The first will open in Da Nang in May, followed by stores in Hue and Nha Trang later in the year. The company currently operates thirty-five stores, all in the north of the country.\n\"This is the most ambitious venture in our history,\" said the company's president, Ms. Tran Lan. She explained that a surge in demand from tourists had convinced the company to move into central Vietnam. Harbor Coffee also announced a sustainable packaging initiative: by next year, all of its cups will be made from recycled paper.\nT:From: Tran Lan. To: All store managers. Subject: Our expansion\nDear managers, by now you have probably read about our plans in the newspaper. I would like to add a few details that the article did not mention. First, we will be promoting from within the company. The manager of each new store will be chosen from our current staff, and relocation costs will be paid in full. Second, Mr. Pham Duc of our Hanoi branch has already agreed to manage the store that opens first. If you are interested in one of the other positions, please contact the personnel office by the end of this month. Best regards, Tran Lan\n?What is the article mainly about?|A company's plan to grow|A decline in tourism|A new kind of coffee|The closing of some stores\n?What is indicated about Harbor Coffee's current stores?|They are all located in the north.|There are twenty of them.|They use recycled cups.|They are managed by tourists.\n?According to Ms. Tran, why is the company expanding?|Demand from tourists has increased sharply.|Rents are lower in central Vietnam.|Competitors have closed.|Shareholders requested it.\n?What is suggested about Mr. Pham?|He will move to Da Nang.|He wrote the newspaper article.|He works in the personnel office.|He will manage the Hue store. >> Câu liên kết: thư viết ông sẽ quản lý cửa hàng mở đầu tiên; bài báo cho biết cửa hàng đầu tiên mở ở Đà Nẵng.\n?What does the email say about the new managers?|They will come from inside the company.|They will be hired in central Vietnam.|They must pay their own moving costs.|They have all been chosen.\n--\nT:Pacific Home Group: Quarterly results\nPacific Home Group today reported its results for the second quarter of the fiscal year. Total revenue was 48 million dollars, a rise of six percent compared with the same quarter last year.\nThe furniture division saw a surge in sales of fifteen percent, helped by the opening of two new stores. Sales in the kitchen division remained flat. The garden division reported a decline of eight percent, which the company blamed on unusually wet weather.\nThe outlook for the rest of the year is positive. The company expects to pay shareholders a dividend of 40 cents per share in December.\nT:From: Robert Hale. To: Investor Relations, Pacific Home Group. Subject: Question from a shareholder\nDear Sir or Madam, I have been a shareholder for eight years, and I was pleased to read the latest quarterly results, especially the performance of the division that opened new stores. However, I am concerned about the only division whose sales fell. Has the company considered selling indoor plants and other products that do not depend on the weather? I would also like to know whether the December dividend will be paid by bank transfer, as it was last year. Sincerely, Robert Hale\n?What do the results show about total revenue?|It was higher than a year earlier.|It fell by six percent.|It was 15 million dollars.|It remained flat.\n?Which division is Mr. Hale especially pleased with?|The furniture division|The kitchen division|The garden division|The investor relations division >> Câu liên kết: ông khen bộ phận đã mở cửa hàng mới; bản kết quả cho biết đó là bộ phận nội thất.\n?Which division is Mr. Hale concerned about?|The garden division|The furniture division|The kitchen division|All three divisions >> Câu liên kết: bộ phận duy nhất có doanh số giảm là garden division.\n?What does Mr. Hale suggest?|Selling products that are not affected by weather|Closing a division|Opening more furniture stores|Raising the dividend\n?What does Mr. Hale ask about the dividend?|How it will be paid|How much it will be|Why it was reduced|When it was announced\n[P4]\nN:And now the business news. Shares in Nova Airlines rose sharply this morning after the company announced that it will buy a forty percent stake in its smaller rival, Blue Wing. The two airlines plan to start a joint venture offering low-cost flights to twelve cities in Southeast Asia. A spokesperson said the outlook for air travel in the region is very strong, with passenger numbers expected to double within five years. Shareholders will vote on the plan at a meeting next month.\n?What did Nova Airlines announce?|It will buy part of another airline.|It will close twelve routes.|Its profits have declined.|It has a new spokesperson.\n?What does the spokesperson say about air travel in the region?|It is expected to grow strongly.|It is too expensive.|It has declined for five years.|It depends on tourism from Europe.\n?What will happen next month?|Shareholders will vote.|The first flights will begin.|The stake will be sold.|A new airline will be named.\n[P2]\nHow were the quarterly results?|Better than we expected.|Every three months.|In the report.\nWhy did the share price surge?|The company announced a new venture.|It's a fair price.|Yesterday morning.\nWhat's the outlook for next year?|Analysts are quite positive.|Look out of the window.|Last year was good.\nWill shareholders receive a dividend this year?|Yes, in December.|They share an office.|It was divided.\n[P5]\nThe company's 【quarterly|quarter of|quarters|quartered】 report will be published on Friday. >> Trước danh từ \"report\": tính từ quarterly.\nThere has been a 【decline|declined|declining of|declines】 in demand for printed newspapers. >> Sau \"a\" và trước \"in\": danh từ.\nThe firm owns a 【subsidiary|subsidy|substitute|subscriber】 in Thailand that makes car parts. >> \"Subsidiary\": công ty con. \"Subsidy\" là khoản trợ cấp.\nThe new 【initiative|initial|initiate|initially】 aims to reduce waste by half. >> Sau \"new\", làm chủ ngữ: danh từ initiative.\nInvestors are waiting to hear the company's 【outlook|outlet|outline|outcome of】 for the coming year. >> \"Outlook for\": triển vọng cho.\nThe company is committed to 【sustainable|sustain|sustainably|sustaining of】 growth. >> Trước danh từ \"growth\": tính từ.\n##D12|Part 5: liên từ và giới từ nâng cao|whereas, provided that, in the event of, notwithstanding\n>Chặng 2 đã dạy liên từ cơ bản. Ở mức 800, đề dùng những từ nối trang trọng của hợp đồng và thông báo, và kiểm tra bạn có phân biệt được liên từ với giới từ hay không.\n[V]Ngôn ngữ hợp đồng\nclause|điều khoản (một mục trong hợp đồng)|There is a ＊ in the contract about late delivery.\nprovision|quy định, điều khoản|The lease includes a ＊ that allows the tenant to leave after one year.\nliability|trách nhiệm pháp lý|The company accepts no ＊ for items left in the parking lot.\nbreach|sự vi phạm (hợp đồng)|Selling the product to another company would be a ＊ of our agreement.\nobligation|nghĩa vụ|The tenant has an ＊ to pay the rent on the first day of each month.\nbinding|có tính ràng buộc pháp lý|Once both sides sign, the agreement is legally ＊.\ndispute|tranh chấp|The two companies settled their ＊ over the price without going to court.\npenalty|khoản phạt|There is a ＊ of 50 dollars for returning the car late.\nrenewal|sự gia hạn|The ＊ of your membership costs 40 dollars a year.\nexpiration|sự hết hạn|Please check the ＊ date on the milk before you drink it.\namendment|bản sửa đổi, bổ sung|Both sides signed an ＊ that changed the delivery date.\nconfidentiality|tính bảo mật|All staff must sign a ＊ agreement before seeing customer files.\n[G]\n@Liên từ trang trọng (+ mệnh đề)|Theo sau là chủ ngữ và động từ|whereas, while: trong khi (đối lập) · provided that, as long as, on condition that: miễn là · in case, in the event that: phòng khi, trong trường hợp · so that: để mà · now that: vì giờ đây · given that: xét rằng · once: một khi · whether … or not: dù … hay không · unless: trừ khi\nCác từ này đứng trước một mệnh đề đủ chủ ngữ và động từ. Chọn theo quan hệ nghĩa: điều kiện, mục đích, đối lập hay lý do.\n>The fee will be refunded 【provided that|whereas|so that|despite】 you cancel at least a week in advance.=Phí sẽ được hoàn lại miễn là bạn huỷ trước ít nhất một tuần.\n>Sales rose in Asia, 【whereas|provided that|so that|unless】 they fell in Europe.=Doanh số tăng ở châu Á, trong khi giảm ở châu Âu.\n>Please sign both copies 【so that|whereas|given that|unless】 each side can keep one.=Vui lòng ký cả hai bản để mỗi bên giữ một bản.\n>【Once|Whereas|So that|Despite】 the contract is signed, it becomes binding.=Một khi hợp đồng được ký, nó có hiệu lực ràng buộc.\n@Giới từ trang trọng (+ danh từ / V-ing)|Theo sau là danh từ, không phải mệnh đề|in the event of: trong trường hợp · notwithstanding, despite, in spite of: bất chấp · owing to, due to, on account of: do · as of: kể từ · pending: trong khi chờ · in accordance with: theo đúng · with regard to, concerning: về · in lieu of: thay cho · subject to: tuỳ thuộc vào, phải chịu\nNhóm này mang cùng các nghĩa với nhóm liên từ ở trên (điều kiện, nhượng bộ, nguyên nhân, thời điểm) nhưng theo sau chỉ là một danh từ hoặc V-ing. Chúng xuất hiện dày đặc trong hợp đồng, nội quy và thông báo chính thức.\n!Cặp phải phân biệt: because (+ mệnh đề) và because of (+ danh từ); although và despite; in case và in case of; in the event that và in the event of; while và during.\n>【In the event of|In the event that|Provided that|Whereas】 a dispute, both sides agree to meet within ten days.=Trong trường hợp có tranh chấp, hai bên đồng ý gặp nhau trong vòng mười ngày.\n>The new rates will apply 【as of|once|whereas|so that】 January 1.=Mức phí mới áp dụng kể từ ngày 1 tháng Một.\n>【Notwithstanding|Although|Whereas|Even though】 the delay, the project finished within budget.=Bất chấp sự chậm trễ, dự án hoàn thành trong ngân sách.\n+All work must be done 【in accordance with|according|provided that|so that】 the safety regulations.=Mọi công việc phải được thực hiện theo đúng quy định an toàn.\n+The contract will be renewed automatically 【unless|despite|owing to|as of】 either side gives notice.=Hợp đồng sẽ tự động gia hạn trừ khi một bên thông báo.\n[N]\nQuy trình hai bước cho nhóm câu này. Bước một: nhìn sau chỗ trống. Nếu là chủ ngữ và động từ thì loại hết giới từ (despite, due to, in the event of, notwithstanding). Nếu là danh từ hoặc V-ing thì loại hết liên từ (although, because, provided that, whereas). Bước hai: trong số còn lại, chọn theo nghĩa.\nVài cụm xuất hiện gần như nguyên dạng trong đề: \"unless otherwise stated\" (trừ khi có ghi khác), \"subject to change without notice\" (có thể thay đổi không báo trước), \"pending approval\" (trong khi chờ phê duyệt), \"in the event of rain\" (trong trường hợp trời mưa).\n[P5]\nThe deposit will be returned 【provided that|notwithstanding|owing to|as of】 the apartment is left in good condition. >> Sau là mệnh đề, nghĩa điều kiện: provided that.\n【Notwithstanding|Although|Whereas|Even if】 the clause on penalties, the supplier was not charged for the delay. >> Sau là cụm danh từ: cần giới từ \"bất chấp\".\n【In the event of|In the event that|In case|Provided】 a power failure, emergency lights will turn on automatically. >> Sau là danh từ (a power failure): in the event of.\nThe agreement will remain in effect 【unless|despite|during|owing to】 it is terminated in writing. >> Sau là mệnh đề, nghĩa \"trừ khi\".\n【As of|Once|While|So that】 next Monday, all visitors must sign a confidentiality agreement. >> \"Kể từ\" + mốc thời gian: As of.\nCosts fell in the first half of the year, 【whereas|despite|owing to|in spite of】 they rose in the second half. >> Hai mệnh đề đối lập: whereas.\nThe meeting was postponed 【owing to|because|since that|given that】 the absence of two directors. >> Sau là cụm danh từ, nghĩa nguyên nhân: owing to.\nPlease keep a copy of the lease 【in case|in case of|despite|whereas】 a dispute arises. >> Sau là mệnh đề (a dispute arises): in case.\nThe schedule is 【subject to|according to|owing to|as of】 change without notice. >> Cụm cố định: subject to change.\n【Now that|Whereas|So that|In spite of】 the amendment has been signed, work can begin. >> Lý do \"vì giờ đây\": Now that + mệnh đề.\nAll payments must be made 【in accordance with|in accordance|according|accordingly】 the terms of the contract. >> Cụm đầy đủ: in accordance with.\nThe renewal fee is the same 【whether|unless|whereas|despite】 you pay online or in person. >> \"Whether … or …\": dù … hay ….\n[P6]\nT:Lease agreement: Summary of main provisions\nThis lease is for a period of two years, beginning on March 1. The monthly rent is 1,200 dollars and is due on the first day of each month. __(1)__ payment is more than five days late, a penalty of 50 dollars will apply. The tenant may renew the lease for one additional year, __(2)__ written notice is given at least sixty days before the expiration date. __(3)__ In the event of a dispute, both sides agree to try to resolve it through discussion before taking legal action. Any __(4)__ to this agreement must be made in writing and signed by both sides.\n?(1)|If|Despite|Owing to|So that >> Điều kiện + mệnh đề: If.\n?(2)|provided that|in spite of|whereas|as of >> \"Miễn là\" có thông báo bằng văn bản.\n?(3)|The landlord is responsible for major repairs, whereas the tenant must pay for utilities.|The building was painted last year.|The tenant's name is not known.|Rent may be paid in any country.\n?(4)|amendment|amend|amended|amending >> Sau \"Any\" cần danh từ.\n[P7]\nT:Notice of membership renewal: City Fitness Club\nDear Mr. Grant, your membership will reach its expiration date on June 30. To continue using the club, please renew by that date. In accordance with our policy, memberships that are not renewed within thirty days of expiration are canceled, and a new joining fee of 60 dollars will apply.\nAs of July 1, the yearly fee will rise from 480 to 520 dollars. However, members who renew before June 15 may pay the current rate. Renewal can be made online, by phone or at the front desk. Fees are not refundable unless the member moves more than fifty kilometers from the club.\n?What is the purpose of the notice?|To remind a member to renew|To announce new opening hours|To cancel a membership|To advertise a new club\n?What will happen if Mr. Grant renews on August 15?|He will have to pay a joining fee.|He will pay the old rate.|He will receive a refund.|He will get a discount. >> Ngày 15 tháng 8 là hơn ba mươi ngày sau khi hết hạn (30 tháng 6), nên tư cách hội viên đã bị huỷ.\n?How much will Mr. Grant pay if he renews on June 10?|480 dollars|520 dollars|60 dollars|540 dollars\n?In what situation can a fee be refunded?|When a member moves far away|When a member is ill|When the club is closed|When a member renews late\n[P3]\nA:Hi, Laura. Have you read the amendment to the supplier contract?\nB:I have. Most of it is fine, but I'm worried about the new penalty clause. It says we pay five hundred dollars a day if we cancel an order on short notice.\nA:That does seem high. Could we ask them to lower it?\nB:We could try. I'd also like the confidentiality provision to cover our price list.\nA:Good point. I'll set up a call with their lawyer for Thursday, provided that you're available.\nB:Thursday afternoon works for me.\n?What are the speakers discussing?|Changes to a contract|A late payment|A new supplier|A price increase\n?What is the woman concerned about?|A penalty she thinks is too high|A missing signature|The expiration date|The lawyer's fee\n?What does the man say he will do?|Arrange a call|Sign the amendment|Cancel an order|Send a price list\n##D13|Part 3 và Part 4: bảng biểu kết hợp ý người nói|Hai dạng khó trong cùng một bài\n>Ở cuối Part 3 và Part 4 của đề thật, một bài có thể vừa có bảng vừa có câu hỏi ngụ ý. Bài này luyện đúng tổ hợp đó.\n[V]Cụm nói về thời hạn và tiến độ\nbottom line|điều cốt lõi; lợi nhuận cuối cùng|The ＊ is that we cannot afford a new office this year.\non short notice|gấp, báo trước rất ngắn|Thank you for coming ＊; I only called you this morning.\nup to date|cập nhật, mới nhất|Please keep the customer list ＊ by adding new phone numbers.\nbehind schedule|chậm tiến độ|The building work is two weeks ＊ because of the rain.\nahead of schedule|vượt tiến độ|We finished the project a month ＊, in May instead of June.\nin the long run|về lâu dài|A good printer costs more now but saves money ＊.\nout of town|đi vắng khỏi thành phố|Mr. Lee is ＊ until Friday; he is visiting a customer in Hue.\nat the latest|muộn nhất là|Please reply by Friday ＊.\nby any chance|tình cờ, liệu có … không|Do you have a pen, ＊? I forgot mine.\nfor the time being|tạm thời, trong lúc này|You can use my desk ＊, until yours arrives.\non second thought|nghĩ lại thì|I will have coffee. ＊, I will have tea instead.\nas far as I know|theo tôi được biết|＊, the meeting is still at three o'clock.\n[N]\nKhi một bài vừa có bảng vừa có câu hỏi ngụ ý, hãy phân vai trước khi nghe: câu nào cần nhìn bảng (có \"Look at the graphic\"), câu nào trích một câu nói. Hai câu này không bao giờ trùng một chỗ trong băng.\nCụm \"on second thought\", \"actually\", \"come to think of it\" báo hiệu người nói đổi ý: thông tin sau đó mới dùng để dò bảng. Cụm \"as far as I know\", \"I'm not sure, but\" báo hiệu thông tin chưa chắc chắn, hay được hỏi dưới dạng \"What does the man imply?\".\nVới bảng có ba, bốn hàng, người nói thường loại dần: \"Monday is out\", \"the first two are too expensive\". Hãy gạch nhẩm từng hàng bị loại.\n[P3]\n@table|Meeting rooms|Room,Seats,Equipment|Maple,6,Screen|Oak,10,Screen and phone|Pine,16,Screen|Cedar,30,Screen and microphones\nA:Tom, we need a room for the client meeting on Thursday. There will be nine of us.\nB:The Maple room is free all day.\nA:Maple won't work. We need to call the Tokyo office during the meeting, so we need a phone. And nine people won't fit.\nB:Right. What about the largest room, then?\nA:On second thought, that's too big for nine people. Just book the one that has what we need.\nB:OK. By the way, the client asked on short notice whether lunch could be included.\nA:We only found out this morning. I'll call the cafeteria and see what they can do.\n?What do the speakers need the room for?|A meeting with a client|A training session|A job interview|A staff party\n?Look at the graphic. Which room will the man most likely book?|Oak|Maple|Pine|Cedar >> Cần đủ chỗ cho chín người và có điện thoại: chỉ phòng Oak (10 chỗ, có phone) đáp ứng.\n?What does the woman imply when she says, \"We only found out this morning\"?|Arranging lunch may be difficult.|The meeting has been canceled.|She forgot to tell the man.|The client is already here.\n--\n@table|Printer models|Model,Price,Pages per minute|P100,150 dollars,20|P200,220 dollars,30|P300,300 dollars,45|P400,420 dollars,60\nA:We need to replace the office printer. I've got a list of four models here.\nB:What's our budget?\nA:The director said three hundred dollars at the most. But I'd rather not buy the cheapest one. Twenty pages a minute is too slow for us.\nB:So that leaves two. The more expensive one is faster, and in the long run we'd save time.\nA:True, but it uses special ink that costs twice as much.\nB:Oh. Then let's go with the other one.\n?What are the speakers planning to do?|Buy a new printer|Repair a printer|Order some ink|Hire an assistant\n?Look at the graphic. Which model will the speakers most likely choose?|P200|P100|P300|P400 >> Ngân sách tối đa 300 đô la loại P400; P100 quá chậm; P300 bị loại vì mực đắt. Còn P200.\n?Why does the man change his mind?|The ink for one model is expensive.|The director refused.|One model is too slow.|One model is sold out.\n[P4]\n@table|Project timeline|Stage,Planned finish,Status|Design,March 1,Finished|Building,May 15,In progress|Testing,June 10,Not started|Launch,July 1,Not started\nN:Good morning, team. Here's an update on the timeline. The good news is that the design stage was finished two weeks ahead of schedule. The bad news is that the stage that's now in progress is running about ten days behind, because some parts arrived late. I know everyone wants to keep the July launch date. Well, testing normally takes three weeks, and we can't skip it. So for the time being, please plan your vacations for August, not July. I'll send an up-to-date timeline by Friday at the latest.\n?What does the speaker say about the design stage?|It was completed early.|It is behind schedule.|It was canceled.|It will begin in March.\n?Look at the graphic. Which stage is currently delayed?|Building|Design|Testing|Launch >> Người nói bảo giai đoạn \"now in progress\" đang chậm; bảng cho biết đó là Building.\n?What does the speaker imply when he says, \"testing normally takes three weeks, and we can't skip it\"?|The launch will probably be later than July 1.|Testing has already started.|The team should work on weekends.|The parts will arrive soon.\n--\n@table|Today's flights to Seoul|Flight,Departure,Gate|KS 101,9:00,4|KS 205,11:30,7|KS 310,2:15,2|KS 422,5:40,9\nN:Attention, passengers traveling to Seoul. Because of fog this morning, the nine o'clock flight has been canceled. Passengers from that flight have been moved to the next available flight to Seoul, which has plenty of seats. Please go to the gate for that flight; you do not need a new boarding pass. If, by any chance, you would rather travel this evening, please speak to our staff at the service desk. We apologize for the inconvenience.\n?Why was a flight canceled?|Because of the weather|Because of a mechanical problem|Because too few seats were sold|Because the crew was late\n?Look at the graphic. Which gate should passengers from the canceled flight go to?|Gate 7|Gate 4|Gate 2|Gate 9 >> Chuyến kế tiếp sau chuyến 9:00 là KS 205 lúc 11:30, cửa số 7.\n?What should passengers do if they prefer an evening flight?|Talk to staff at the service desk|Get a new boarding pass at the gate|Call the airline|Wait at gate 9\n[P2]\nIs the project still on schedule?|We're about a week behind.|It's a big project.|On the schedule.\nDo you have a spare charger, by any chance?|Sorry, I left mine at home.|It was a small chance.|Yes, I charged it.\nCan you come in on Saturday? I know it's short notice.|I'll have to check with my family.|I noticed it too.|It's too short.\nIs Ms. Vega in the office today?|As far as I know, she's out of town.|It's a nice office.|Far from here.\n[P5]\nThe report must be submitted by Friday 【at the latest|at latest|in the latest|by the last】. >> Cụm cố định: at the latest.\nConstruction of the bridge is three months 【behind|after|late|beyond of】 schedule. >> \"Behind schedule\": chậm tiến độ.\nPlease make sure that all customer records are 【up to date|up to day|until date|out to date】. >> Cụm cố định: up to date.\nBuying quality equipment saves money 【in the long run|at the long run|for long run|on the long】. >> Cụm cố định: in the long run.\nThank you for meeting with us 【on|in|at|by】 such short notice. >> Cụm cố định: on short notice.\nThe elevator is out of order, so please use the stairs 【for the time being|for a time being|in the time being|at the time been】. >> Cụm cố định: for the time being.\n##D14|Part 7: đoạn ba với trang web|Trang web, đánh giá và email\n>Bộ ba hiện đại nhất của đề: một trang web giới thiệu dịch vụ, một bài đánh giá của khách và một email của công ty. Câu liên kết ghép lời khách với điều kiện ghi trên trang web.\n[V]Mua sắm và dịch vụ trực tuyến\nbrowse|xem lướt, duyệt|You can ＊ our products on the website before you visit the store.\ncheckout|bước thanh toán|Enter your address at the ＊ before you pay.\nlog in|đăng nhập|Please ＊ with your email address and password.\nsign up|đăng ký (dịch vụ)|You can ＊ for the free trial on our website.\nusername|tên đăng nhập|Choose a ＊ that is easy to remember.\nnewsletter|bản tin|Our monthly ＊ tells customers about new products.\nunsubscribe|huỷ đăng ký nhận tin|If you do not want our emails, click here to ＊.\nnotification|thông báo (trên thiết bị)|You will get a ＊ on your phone when your order is ready.\ndownload|tải xuống|You can ＊ the form from our website and print it.\nattach|đính kèm|Please ＊ your resume to the email before you send it.\nlink|đường liên kết|Click on the ＊ in the email to confirm your address.\nclick|bấm, nhấp chuột|＊ on the green button to start.\n[N]\nTrang web trong đề thường có các mục: giới thiệu dịch vụ, các gói và giá, cách đăng ký, và điều khoản in nhỏ (\"Free cancellation within 14 days\", \"Reviews are posted only by verified customers\").\nBài đánh giá cho biết khách dùng gói nào, trong bao lâu, hài lòng và không hài lòng điều gì. Email của công ty thường phản hồi bài đánh giá: xin lỗi, giải thích, đưa ưu đãi.\nHai câu liên kết điển hình. Một: \"Which plan did Ms. Lee most likely choose?\" ghép một chi tiết trong bài đánh giá (số người dùng, tính năng cô nhắc tới) với bảng gói dịch vụ. Hai: \"What will Ms. Lee receive?\" ghép lời hứa trong email với điều kiện trên trang web.\n[P7]\nT:FreshBox: Healthy meals delivered to your door\n|Plan|Meals per week|Price per week\n|Starter|3 meals for 2 people|45 dollars\n|Family|4 meals for 4 people|95 dollars\n|Premium|6 meals for 4 people|130 dollars\nHow it works: Sign up on our website, browse the weekly menu and choose your meals by Thursday. Your box arrives on Monday. You can skip a week or cancel at any time by logging in to your account. New customers get 50 percent off their first box. Sign up for our newsletter to receive a new recipe every week.\nT:Customer review by Daniel Ortiz\nI signed up for FreshBox two months ago. My wife and I both work late, and we have two children, so cooking was always a problem. Now we get four meals a week, and the recipes are easy to follow. The ingredients are fresh, and even the children enjoy helping.\nThere was one problem. Last week the box arrived a day late, and the fish had to be thrown away. I uploaded a photo to the website but did not receive a reply for five days. The food is great, but the customer service needs to improve.\nT:From: FreshBox Customer Care. To: Daniel Ortiz. Subject: Your recent delivery\nDear Mr. Ortiz, thank you for your review, and please accept our apologies for the late delivery and for our slow response. Our carrier had a problem with one of its trucks that day. We have refunded the full price of last week's box to your account. In addition, your next box will be free of charge. We have also added a notification service: from now on, you will receive a message on your phone if a delivery is delayed. Sincerely, Amy Chen\n?According to the web page, by what day must customers choose their meals?|Thursday|Monday|Friday|Sunday\n?Which plan does Mr. Ortiz most likely have?|Family|Starter|Premium|A free trial >> Câu liên kết: ông viết gia đình có bốn người và nhận bốn bữa mỗi tuần; trang web cho biết đó là gói Family.\n?What problem did Mr. Ortiz have?|A delivery came late.|A recipe was too difficult.|He was charged twice.|He could not log in.\n?How much money was returned to Mr. Ortiz?|95 dollars|45 dollars|130 dollars|47.50 dollars >> Câu liên kết: công ty hoàn toàn bộ giá hộp tuần trước; gói Family giá 95 đô la mỗi tuần.\n?What new service does the email mention?|Messages about late deliveries|A weekly recipe|A discount for new customers|A new carrier\n--\nT:QuickPrint Online: Business cards, flyers and posters\nUpload your design or choose from more than 500 templates. Standard delivery takes five business days and is free on orders over 40 dollars. Express delivery takes two business days and costs 12 dollars.\nOur promise: If you are not satisfied with the print quality, we will reprint your order free of charge. To request a reprint, log in to your account within fourteen days of delivery and upload a photo of the problem.\nT:Customer review by Sofia Marino\nI ordered 500 flyers for my bakery's opening day. The website was easy to use, and I paid extra to get them quickly. They arrived on time. Unfortunately, the red in my logo looked almost orange. I only noticed when I compared the flyers with my shop sign three weeks later. When I tried to request a reprint, the website said it was too late. I think two weeks is too short.\nT:From: QuickPrint Customer Service. To: Sofia Marino. Subject: Your flyers\nDear Ms. Marino, thank you for your feedback. We are sorry that the colors were not what you expected. Although the usual period for reprint requests had passed, we would like to make an exception in your case. We will reprint your 500 flyers at no cost and send them by express delivery, also at no charge. To make sure the color is right this time, please reply with the exact color code of your logo. Kind regards, Ben Novak\n?What is indicated about standard delivery?|It is free for larger orders.|It takes two days.|It costs 12 dollars.|It is not available for flyers.\n?How long did Ms. Marino's order most likely take to arrive?|Two business days|Five business days|Fourteen days|Three weeks >> Câu liên kết: cô viết đã trả thêm để nhận nhanh; trang web cho biết giao nhanh mất hai ngày làm việc.\n?Why was Ms. Marino unable to request a reprint on the website?|More than fourteen days had passed.|She had lost her password.|Her order was too small.|She did not upload a photo. >> Câu liên kết: cô phát hiện lỗi sau ba tuần; trang web chỉ cho yêu cầu in lại trong mười bốn ngày.\n?What does QuickPrint offer Ms. Marino?|A free reprint with free express delivery|A full refund|A discount on her next order|A new logo design\n?What is Ms. Marino asked to send?|A color code|A photo of the flyers|Her order number|A new design\n[P6]\nT:Welcome to StyleHub\nThank you for creating an account with StyleHub. You can now browse more than 10,000 products and save your favorites to a wish list. To place your first order, simply add items to your basket and __(1)__ to the checkout. __(2)__ If you sign up for our newsletter, you will receive ten percent off your next purchase. You can __(3)__ at any time by clicking the link at the bottom of each email. For help with your order, log in and click \"My account\". We will send you a __(4)__ as soon as your order has been dispatched.\n?(1)|proceed|precede|process|provide >> \"Proceed to the checkout\": chuyển sang bước thanh toán.\n?(2)|Delivery is free on orders over 50 dollars.|Our office was painted last month.|Your password has expired.|The newsletter is written in French.\n?(3)|unsubscribe|upload|download|browse >> Huỷ nhận bản tin bất cứ lúc nào: unsubscribe.\n?(4)|notification|notify|notified|notifying >> Sau \"a\" cần danh từ.\n[P2]\nHow do I sign up for the newsletter?|Just enter your email address on the home page.|It's a new letter.|I signed it yesterday.\nI can't log in to my account.|Have you tried resetting your password?|It's a savings account.|Log it in the book.\nWhere can I download the form?|There's a link at the bottom of the page.|It's loading.|On the form.\nDid you get a notification about the delivery?|Yes, it's arriving this afternoon.|I noticed the sign.|It was delivered.\n[P5]\nCustomers can 【browse|brow|browsed|browser】 the catalog online before ordering. >> Sau \"can\" cần động từ nguyên mẫu.\nTo change your address, 【log in|log on in|logging|login to】 to your account and click \"Settings\". >> Động từ \"log in\" (hai từ); \"login\" viết liền là danh từ.\nPlease 【upload|uphold|upgrade|update of】 a copy of your receipt with the form. >> \"Upload\": tải tệp lên.\nYou will receive a 【notification|notice of|notify|notifying】 when your order ships. >> Sau \"a\" cần danh từ đếm được.\nTo stop receiving these emails, click the 【link|line|list|lift】 below. >> Hợp nghĩa: đường liên kết.\nMore than 2,000 people have 【signed up|signed off|signed out of|signed in for】 for the online course. >> \"Sign up for\": đăng ký.\n##D15|Part 5: trạng từ dễ nhầm và danh từ ghép|hard và hardly, late và lately, near và nearly\n>Hai nhóm câu từ loại khó nhất: cặp trạng từ cùng gốc nhưng khác hẳn nghĩa, và danh từ ghép, nơi chỗ trống đứng trước một danh từ nhưng đáp án lại là danh từ chứ không phải tính từ.\n[V]Trạng từ chỉ mức độ\nhardly|hầu như không|I was so tired that I could ＊ keep my eyes open.\nlately|gần đây|Have you seen any good films ＊?\nnearly|gần như, suýt|It is ＊ six o'clock; we should leave soon.\nhighly|rất, ở mức cao|She is a ＊ skilled engineer with twenty years of experience.\nclosely|kỹ lưỡng, sát sao|Please read the contract ＊ before you sign it.\nshortly|chẳng bao lâu nữa|The train will arrive ＊; please wait on the platform.\nmostly|chủ yếu, phần lớn|Our customers are ＊ young people between 18 and 25.\nlargely|phần lớn là do|The success of the project was ＊ due to her hard work.\nwidely|rộng rãi|English is ＊ spoken in business around the world.\nfairly|khá, tương đối|The test was ＊ easy; most students passed.\nbarely|vừa đủ, hầu như không|We ＊ caught the train; the doors closed right behind us.\nroughly|khoảng chừng|The trip takes ＊ two hours, depending on traffic.\n[G]\n@Cặp trạng từ cùng gốc, khác nghĩa|Chọn theo nghĩa, không theo đuôi -ly|hard (chăm chỉ, mạnh) / hardly (hầu như không) · late (muộn) / lately (gần đây) · near (gần) / nearly (gần như) · high (cao) / highly (rất) · close (gần) / closely (kỹ lưỡng) · short (ngắn) / shortly (sắp, chẳng bao lâu) · most (nhất) / mostly (chủ yếu)\nCác từ không có -ly ở đây vẫn dùng được làm trạng từ: work hard, arrive late, stay close. Dạng có -ly mang nghĩa khác hẳn.\n!\"Hardly\", \"barely\", \"rarely\", \"seldom\" đã mang nghĩa phủ định, nên không đi với \"not\". Và \"highly\" đi với tính từ hoặc V3 (highly recommended, highly qualified), còn \"high\" tả vị trí hoặc mức (prices are high).\n>The team worked 【hard|hardly|hardness|harden】 to meet the deadline.=Nhóm đã làm việc chăm chỉ để kịp hạn.\n>We have 【hardly|hard|harder|hardness】 any paper left.=Chúng tôi hầu như không còn giấy.\n>Sales have improved 【lately|late|later|latest】.=Doanh số gần đây đã cải thiện.\n>The restaurant is 【highly|high|height|higher】 recommended by local guides.=Nhà hàng được các hướng dẫn viên địa phương đánh giá rất cao.\n>The manager will be with you 【shortly|short|shorten|shortage】.=Quản lý sẽ gặp bạn ngay thôi.\n@Danh từ ghép|Danh từ + danh từ|customer satisfaction · sales department · safety regulations · job description · application form · delivery date · expiration date · office supplies · customer service representative · employee performance · product information · travel expenses · work experience\nTrong danh từ ghép, danh từ thứ nhất đóng vai trò bổ nghĩa và thường ở số ít (trừ sales, customs, savings). Nếu thay bằng tính từ thì nghĩa đổi hoặc vô nghĩa: \"safe regulations\" là quy định an toàn theo nghĩa \"không nguy hiểm\", còn \"safety regulations\" mới là quy định về an toàn.\n>All visitors must follow the 【safety|safe|safely|safes】 regulations.=Mọi khách phải tuân theo quy định an toàn.\n>Please fill out the 【application|apply|applied|applicable】 form.=Vui lòng điền đơn đăng ký.\n+The 【delivery|deliver|delivered|delivering of】 date has been changed to May 5.=Ngày giao hàng đã đổi sang 5 tháng Năm.\n+The project is 【nearly|near|nearer|nearby】 finished.=Dự án gần như đã xong.\n[N]\nCách nhận ra danh từ ghép trong đề: chỗ trống đứng trước một danh từ, và trong bốn lựa chọn có cả danh từ lẫn tính từ cùng gốc. Hãy thử nghĩa: cụm đó là \"loại gì\" của danh từ sau (application form là một loại form, travel expenses là một loại expenses) thì chọn danh từ.\nVới trạng từ chỉ mức độ, hãy thuộc cặp đi liền: highly qualified, highly recommended, closely related, widely used, fully booked, heavily discounted, strictly prohibited, readily available.\n[P5]\nThe new manager is 【highly|high|height|highness】 respected by the staff. >> \"Highly respected\": rất được kính trọng.\nThere was 【hardly|hard|harder|hardship】 any traffic on the road this morning. >> \"Hardly any\": hầu như không có.\nThe shipment will arrive 【shortly|short|shortness|shorten】 after noon. >> \"Shortly after\": ngay sau.\nPlease read the 【job|working|worked|jobless】 description before you apply. >> Danh từ ghép: job description.\nMs. Ito has been very busy 【lately|late|latest|later than】. >> \"Lately\" (gần đây) đi với hiện tại hoàn thành.\nThe two reports are 【closely|close|closest|closeness】 related. >> \"Closely related\": liên quan chặt chẽ.\n【Nearly|Near|Nearby|Nearer】 all of the employees attended the meeting. >> \"Nearly all\": gần như tất cả.\nCustomer 【satisfaction|satisfied|satisfy|satisfactory】 is the company's top priority. >> Danh từ ghép: customer satisfaction.\nThis software is 【widely|wide|width|widen】 used in the banking industry. >> \"Widely used\": được dùng rộng rãi.\nEmployees must submit their travel 【expenses|expensive|expensively|expend】 by the fifth of each month. >> Danh từ ghép: travel expenses.\nThe price is 【roughly|rough|roughness|rougher】 the same as last year. >> Bổ nghĩa cho \"the same\": trạng từ roughly (khoảng chừng).\nWe 【barely|bare|barest|bareness】 had enough chairs for all the guests. >> \"Barely\": vừa đủ, suýt thiếu.\n[P6]\nT:To: All staff. Subject: Customer satisfaction survey\nThe results of this year's customer __(1)__ survey are now available. Overall, the results are __(2)__ positive: nearly ninety percent of customers said they would recommend us to a friend. __(3)__ Several customers said they could hardly find the information they needed on our website. We will be working __(4)__ with the design team over the next month to solve this problem.\n?(1)|satisfaction|satisfied|satisfy|satisfactory >> Danh từ ghép: customer satisfaction survey.\n?(2)|highly|high|height|higher >> Bổ nghĩa cho tính từ \"positive\": highly.\n?(3)|However, there is one area that needs improvement.|The survey was printed in color.|Our website was launched in 2015.|Thank you for your payment.\n?(4)|closely|close|closed|closure >> \"Work closely with\": làm việc chặt chẽ với.\n[P7]\nT:Sales department: Monthly notes\nSales in April were roughly the same as in March. The southern region did fairly well, largely because of two new customers in Can Tho. The northern region, however, barely reached its target.\nWe have received hardly any orders for the new garden tools, although they are widely advertised. The marketing team will look closely at the reasons and report shortly. On a positive note, our delivery times have improved lately: nearly all orders now arrive within three days.\n?How did April sales compare with March?|They were about the same.|They were much higher.|They fell sharply.|They doubled.\n?Why did the southern region do well?|It gained new customers.|It lowered prices.|It advertised widely.|It hired more staff.\n?What is indicated about the new garden tools?|Very few have been ordered.|They are not advertised.|They sold out.|They are delivered late.\n?The word \"shortly\" in paragraph 2, line 2, is closest in meaning to|soon|briefly|rudely|slightly\n[P4]\nN:Hello, this is Karen from Dr. Lee's office with a message for Mr. Adams. I'm calling because Dr. Lee is running fairly late today. An emergency patient came in this morning, and we're nearly an hour behind schedule. Your appointment was for three o'clock, but the doctor will hardly be able to see you before four. If that's too late for you, we have an opening tomorrow at nine. Please call us back shortly to let us know which you prefer.\n?Why is the speaker calling?|A doctor is behind schedule.|An appointment was canceled.|A test result is ready.|A bill has not been paid.\n?What caused the delay?|An emergency patient|A late train|A broken machine|A staff meeting\n?What does the speaker offer?|An appointment the next morning|A visit at three o'clock|A different doctor|A phone consultation\n\n##D16|Part 1 và Part 2 ở mức 800|Từ khái quát và câu đáp không ngờ tới\n>Bài luyện dày nhất của hai phần nghe đầu: sáu ảnh với từ vựng ít gặp và mười sáu câu Part 2 mà đáp án đúng đều là câu đáp vòng.\n[V]Danh từ khái quát và vật thể trong ảnh\nvehicle|phương tiện, xe cộ|No ＊ may park in front of the hospital entrance.\nmerchandise|hàng hoá (bày bán)|The store's ＊ is arranged by color.\nappliance|thiết bị gia dụng|A refrigerator is the most expensive ＊ in most kitchens.\ncontainer|thùng chứa, hộp đựng|Keep the rice in a closed ＊ so that it stays dry.\npodium|bục phát biểu|The speaker stood at the ＊ and began her talk.\ncounter|quầy|Please pay at the ＊ near the door.\nmicroscope|kính hiển vi|The scientist looked at the cells through a ＊.\nstool|ghế đẩu|He sat on a ＊ at the bar and ordered a coffee.\nawning|mái hiên che|We stood under the shop's ＊ to stay out of the rain.\npier|cầu tàu|The fishing boats are tied up at the ＊.\ncurb|lề đường, mép vỉa hè|The taxi stopped at the ＊ to let the passengers out.\nlawn|bãi cỏ|He cuts the ＊ in front of his house every Saturday.\n[N]\nTừ khái quát của Part 1: vehicle (ô tô, xe tải, xe buýt), merchandise hoặc goods (mọi thứ bày bán), appliance (lò vi sóng, tủ lạnh), equipment (máy móc), instrument (nhạc cụ, dụng cụ đo), container (hộp, thùng, lọ), structure (toà nhà, cây cầu), beverage (đồ uống), produce (rau quả). Thấy ảnh một chiếc xe tải, hãy sẵn sàng nghe \"A vehicle is…\".\nCác động từ chỉ trạng thái của đồ vật: be lined up (xếp hàng), be propped against (dựng tựa vào), be stacked, be piled, be scattered (vương vãi), be suspended (treo lơ lửng), overlook (nhìn xuống), be docked (đậu ở bến), cast a shadow (đổ bóng).\nPart 2 mức 800: hãy coi mọi câu đáp \"khớp từ\" là đáng ngờ. Đáp án đúng thường là một trong các kiểu: hỏi ngược lại, nêu một trở ngại, chỉ sang người khác, hoặc trả lời một điều ngụ ý. \"When's the report due?\" có thể được đáp \"Didn't you get the email?\".\n[P1]\n🚐🚗🅿️|Mấy chiếc xe đỗ dọc theo lề đường.|Vehicles are parked along a curb.|A car is being towed away.|Some drivers are getting out of their cars.|A road is being repaired.\n👔👗🏬|Quần áo được bày trong tủ kính của một cửa hàng, không có người.|Merchandise is on display in a window.|A clerk is arranging some clothes.|Shoppers are looking at a display.|A window is being cleaned.\n🎤🧑‍💼🪑🪑|Một người đàn ông đứng ở bục phát biểu trước những hàng ghế trống.|A man is standing at a podium.|An audience is listening to a speech.|A man is setting up some chairs.|A microphone is being repaired.\n⛵⛵🌊|Mấy chiếc thuyền neo cạnh một cầu tàu.|Some boats are docked at a pier.|People are boarding a boat.|A boat is sailing out to sea.|Some fishermen are repairing nets.\n🔬👩‍🔬|Một nữ nhà khoa học đang nhìn vào kính hiển vi.|A woman is looking through a microscope.|A woman is cleaning some equipment.|A woman is writing a report.|Some containers are being filled.\n☂️🏪🪑|Mấy cái ghế đẩu đặt dưới mái hiên của một quán cà phê.|Stools have been placed under an awning.|Customers are sitting outside a café.|An awning is being installed.|A waiter is wiping a counter.\n[P2]\nWhen's the sales report due?|Didn't you get the email?|In the sales department.|It's about sales.\nWhere did you put the new merchandise?|It hasn't been unloaded yet.|It's very new.|For the store.\nWho's going to speak at the podium first?|That's still being decided.|On the stage.|He spoke well.\nWhy isn't the microwave working?|Someone unplugged it.|It's an appliance.|In the kitchen.\nHow many containers do we need to ship?|That depends on the size of the order.|By ship.|They contain rice.\nCould you move your vehicle?|Is it blocking the entrance?|It's a fast car.|I moved last year.\nDo you want to sit at the counter or at a table?|Wherever there's space.|Yes, I do.|I'll count them.\nHas the lawn been cut this week?|The gardener comes on Fridays.|It's very green.|With a machine.\nIsn't the store supposed to open at nine?|The manager has the only key.|It's an open space.|At nine in the evening.\nWould you mind helping me carry these boxes?|Which floor are they going to?|I mind my business.|They're cardboard.\nThe copier on this floor is out of order.|There's another one downstairs.|In order of size.|I made ten copies.\nShould we order more stools for the café?|Let's see how busy we are this weekend.|They're very comfortable.|The order arrived.\nWhat did the customer say about the delay?|She was more understanding than I expected.|About two days.|He'll say it tomorrow.\nCan I leave my bags at the front desk?|We don't have a storage room, I'm afraid.|They're very heavy.|At the front.\nWho do I talk to about renting this space?|The number is on the sign.|It's very spacious.|For two years.\nYou're coming to the farewell party, aren't you?|I wouldn't miss it.|He's leaving on Friday.|It was a great party.\n[P3]\nA:Excuse me, I bought this coffee maker here last week, but it leaks water onto the counter.\nB:I'm sorry about that. Do you have the receipt and the original container it came in?\nA:I have the receipt, but I threw the box away.\nB:That's all right for a defective appliance. Would you like a refund or a replacement?\nA:A replacement, please. But could you check that the new one works before I take it home?\nB:Certainly. I'll plug it in at the service counter right now.\n?What is wrong with the coffee maker?|It leaks.|It does not turn on.|It is the wrong color.|It is too small.\n?What does the woman no longer have?|The box|The receipt|The coffee maker|Her credit card\n?What will the man do next?|Test a new coffee maker|Give a refund|Call the manager|Order a part\n[P4]\nN:Attention, all drivers. This is a message from the harbor office. Because of the boat festival, the road along the pier will be closed to all vehicles from eight A.M. to six P.M. on Saturday. Cars parked along the curb in that area after seven A.M. will be removed. Free parking is available on the lawn behind the harbor office, and a shuttle bus will run to the pier every fifteen minutes. Merchandise for the festival stalls must be unloaded before seven thirty.\n?Why will the road be closed?|A festival is being held.|The pier is being repaired.|There was và nối với \"Not everyone supports the plan\".\n--\nT:To: All employees. From: Green Office Team. Subject: Results of our first year\nOne year ago, we launched the Green Office initiative with three goals: to reduce paper consumption, to conserve electricity and to recycle more. Here are the results.\nPaper: By printing on both sides and sending documents by email, we cut our paper use by 35 percent. Electricity: New lights and a rule that computers must be shut down at night lowered our consumption by 18 percent. Recycling: We now recycle nearly all of our paper and plastic waste, compared with roughly half a year ago.\nThese changes have saved the company about 12,000 dollars. The director has agreed that half of this amount will be spent on improving the staff lounge. Please send your suggestions to the team by the end of the month. Next year we will focus on reducing emissions from business travel.\n?What is the purpose of the email?|To report the results of a program|To announce a new director|To request donations|To complain about waste\n?How did the company reduce its use of paper?|By printing on both sides and using email|By buying cheaper paper|By closing the print room|By recycling old documents\n?What is suggested about recycling a year ago?|About half of the waste was recycled.|Nothing was recycled.|Nearly everything was recycled.|Only plastic was recycled.\n?How much money will be spent on the staff lounge?|About 6,000 dollars|About 12,000 dollars|About 18,000 dollars|About 3,500 dollars >> Một nửa của khoảng 12.000 đô la tiết kiệm được.\n?What will the team focus on next year?|Emissions from travel|Water consumption|Solar panels|Paper recycling\n[P2]\nHow can we reduce our electricity bill?|Switching to solar would help.|It's a large bill.|By the end of the month.\nDoes the office recycle paper?|Yes, the bins are by the copier.|It's on paper.|I ride a bicycle.\nWhat impact will the new rule have?|Probably less than people fear.|It's a strict rule.|Next ＊.\nat present|hiện tại|＊, we have no rooms available, but one may open next week.\nonce|một khi|＊ you have signed the form, please return it to me.\n[G]\n@Tương lai hoàn thành và quá khứ hoàn thành|will have + V3 và had + V3|By + mốc tương lai / By the time + hiện tại đơn: will have + V3 (đến lúc đó sẽ đã xong) · By the time + quá khứ đơn / Before + quá khứ: had + V3 (việc xảy ra trước một việc khác trong quá khứ) · so far, in recent years, over the past…: have / has + V3\nHai thì này hầu như chỉ xuất hiện cùng \"by\", \"by the time\" hoặc \"before\". Nhìn thấy các từ đó là kiểm tra ngay thì của vế còn lại.\n!Sau \"by the time\", \"once\", \"as soon as\", \"when\" nói về tương lai, động từ ở hiện tại đơn, và vế chính mới dùng will hoặc will have + V3.\n>By next March, Mr. Kim 【will have worked|will work|has worked|worked】 here for twenty years.=Đến tháng Ba tới, ông Kim sẽ đã làm ở đây được hai mươi năm.\n>By the time the manager arrived, the meeting 【had already started|already started|has already started|will have started】.=Khi quản lý đến thì cuộc họp đã bắt đầu rồi.\n>The company 【has opened|had opened|will have opened|opens】 five stores so far this year.=Từ đầu năm đến nay công ty đã mở năm cửa hàng.\n>By the time you 【receive|will receive|received|have been receiving】 this letter, I will have left the company.=Khi bạn nhận được thư này, tôi đã rời công ty rồi.\n+By the end of the year, we 【will have completed|completed|have completed|had completed】 the new factory.=Đến cuối năm, chúng tôi sẽ đã hoàn thành nhà máy mới.\n+Before she joined us, Ms. Park 【had managed|has managed|manages|will have managed】 a hotel for ten years.=Trước khi về với chúng tôi, cô Park đã quản lý một khách sạn mười năm.\n[N]\nNhịp làm bài cần đạt: Part 5 trung bình 20 giây mỗi câu, trong đó câu từ loại và câu đại từ chỉ 5–10 giây, để dành 30 giây cho câu từ vựng. Part 6 khoảng 2 phút mỗi đoạn; làm ba chỗ trống ngữ pháp và từ vựng trước, chỗ chèn câu sau cùng.\nCách luyện với bài này: bấm đồng hồ 5 phút cho 16 câu Part 5 bên dưới, rồi 6 phút cho ba đoạn Part 6. Làm xong mới xem giải thích. Câu nào tốn quá 40 giây, ghi lại loại câu đó: đấy là chỗ cần ôn.\nNguyên tắc không đổi: không bỏ trống. Hết giờ mà còn câu chưa làm, chọn cùng một chữ cái cho tất cả các câu còn lại.\n[P5]\nBy the time the guests arrive, we 【will have finished|finished|have finished|had finished】 setting up the room. >> \"By the time\" + hiện tại (arrive): vế chính dùng will have + V3.\nAll applications must be received 【no later than|no later|not late than|no latest than】 March 15. >> Cụm cố định: no later than.\nThe elevator will be out of service 【until|by|since|during】 further notice. >> Cụm cố định: until further notice.\nThe company 【has expanded|had expanded|will have expanded|expands】 rapidly in recent years. >> \"In recent years\": hiện tại hoàn thành.\nSafety glasses must be worn 【at|in|on|by】 all times in the laboratory. >> Cụm cố định: at all times.\n【Once|Unless|Whereas|Despite】 the payment has been received, your order will be shipped. >> \"Một khi\": Once + mệnh đề.\nBy the time Mr. Ito retired, he 【had worked|has worked|works|will have worked】 for the company for thirty years. >> \"By the time\" + quá khứ (retired): vế chính had + V3.\nEffective 【immediately|immediate|immediacy|more immediate】, all visitors must sign in at the front desk. >> Cụm cố định: effective immediately.\nThe machines are inspected on a regular 【basis|base|basic|basics】. >> Cụm cố định: on a regular basis.\nSo far, we 【have received|received|had received|will receive】 more than two hundred orders. >> \"So far\": hiện tại hoàn thành.\nFrom now 【on|in|at|by】, please send all invoices directly to the accounting office. >> Cụm cố định: from now on.\nThe new store 【attracted|has attracted|attracts|will have attracted】 over a thousand customers on its opening day last month. >> \"Last month\": quá khứ đơn.\nAt 【present|presence|presently of|presenting】, the factory employs about three hundred workers. >> Cụm cố định: at present.\nBy the end of next quarter, sales 【will have doubled|doubled|have doubled|had doubled】. >> \"By the end of next quarter\": tương lai hoàn thành.\nThis year, for the first 【time|times|timing|timely】, the company made a profit in every month. >> Cụm cố định: for the first time.\nBefore the new system was installed, employees 【had recorded|have recorded|record|will have recorded】 their hours on paper. >> Việc xảy ra trước một mốc quá khứ: had + V3.\n[P6]\nT:Notice: Parking garage closure\nEffective immediately, level 2 of the parking garage is closed __(1)__ further notice. During a routine inspection yesterday, engineers __(2)__ damage to the ceiling. __(3)__ Drivers who normally park on level 2 should use levels 3 and 4 for the time being. We expect that repairs __(4)__ by the end of next month.\n?(1)|until|by|since|within >> Cụm cố định: until further notice.\n?(2)|discovered|have discovered|will discover|discover >> \"Yesterday\": quá khứ đơn.\n?(3)|Although there is no immediate danger, the area must be repaired before it can be used.|The garage has four hundred spaces.|Parking fees were raised last year.|Level 2 is the most popular level.\n?(4)|will have been completed|had been completed|have completed|completed >> \"By the end of next month\": tương lai hoàn thành, bị động.\n--\nT:Dear Mr. Santos,\nThank you for your interest in our accounting position. We have received more than 150 applications so far, and by the time the deadline passes, we expect that number __(1)__. For this reason, we will not be able to interview every candidate. __(2)__ If you are selected, you will be contacted no later than April 30. At present, we cannot give further information about the schedule. __(3)__ you have not heard from us by that date, please assume that we have chosen another candidate. We wish you success in __(4)__ job search.\nSincerely, Nora Kim, Personnel Office\n?(1)|to have doubled|doubling of|has doubled|doubles >> \"Expect + tân |12,000 dollars|22,000 dollars >> Câu liên kết: lò nướng giá 12.000 đô la; khoản tài trợ tối đa là 10.000 đô la.\n?What does Ms. Park ask about the financial statements?|Whether an audit is needed|When they are due|How long they should be|Who will read them\n--\nT:Riverside Bank: Understanding your home loan statement\nYour monthly mortgage statement shows four amounts. The first is the payment due, which stays the same every month. The second is interest, the amount the bank charges for lending you the money. The third is the part of your payment that reduces the loan itself. The fourth is the balance, the amount you still owe.\nIn the early years of a mortgage, most of each payment goes to interest. Over time, a larger part reduces the balance. If you can afford to pay extra in any month, the whole extra amount reduces the balance, which lowers the total interest you pay. There is no penalty for extra payments.\n?What is the purpose of the text?|To explain a bank document|To advertise a new loan|To announce a rate increase|To request a late payment\n?What is true about the monthly payment due?|It does not change.|It increases every year.|It depends on the balance.|It is mostly a penalty.\n?What happens in the early years of a mortgage?|Most of the payment covers interest.|The balance falls quickly.|No interest is charged.|Extra payments are not allowed.\n?What is indicated about extra payments?|They reduce the amount owed without a fee.|They must be approved by the bank.|They are charged a penalty.|They are used to pay interest first.\n[P5]\nThe annual 【audit|audition|audio|auditorium】 of the company's accounts begins next week. >> \"Audit\": kiểm toán.\nThe city ended the fiscal year with a budget 【surplus|surface|surcharge|surround】 of one million dollars. >> \"Budget surplus\": thặng dư ngân sách.\nThe festival is 【sponsored|sponsoring|sponsor|sponsorship】 by several local companies. >> Bị động: is + V3 + by.\nTotal 【expenditure|expend|expensive|expendable】 on equipment fell by ten percent. >> Sau tính từ \"Total\", làm chủ ngữ: danh từ.\nSales in the second 【quarter|quarterly|quart|quarters of】 were higher than expected. >> \"The second quarter\": quý hai.\nThe museum relies on 【donations|donors of|donating|donated】 from the public. >> Sau \"relies on\" cần danh từ: donations (các khoản quyên góp).\nThe building is the company's most valuable 【asset|assess|assist|assign】. >> \"Asset\": tài sản.\nThe school received a government 【grant|grand|grain|grasp】 to build a new library. >> \"Grant\": khoản tài trợ.\n##D20|Tổng ôn Chặng 4|Sẵn sàng cho đề thi thử\n>Bài cuối của bốn chặng nghe đọc: mười hai từ mô tả xu hướng số liệu, rồi một lượt đủ mọi phần ở mức 800.\n[V]Mô tả xu hướng và số liệu\nsteadily|đều đặn|Prices have risen ＊ over the past five years, by about two percent a year.\nsharply|mạnh, đột ngột|Sales fell ＊ in July, from 900 to 400 units.\nslightly|nhẹ, một chút|The price went up ＊, from 20 dollars to 21.\ngradually|dần dần|The weather will ＊ get warmer over the next few weeks.\ndramatically|đáng kể, rất mạnh|The number of users has grown ＊, from one thousand to one million.\nsignificantly|đáng kể|The new road has ＊ reduced travel time.\napproximately|xấp xỉ|The flight takes ＊ two hours.\nrespectively|lần lượt theo thứ tự|Tom and Anna are 25 and 30 years old, ＊.\nremain|vẫn giữ nguyên, duy trì|Prices are expected to ＊ stable next year.\nfluctuate|dao động|Fruit prices ＊ during the year, depending on the season.\npeak|đạt đỉnh; đỉnh điểm|Hotel prices ＊ in August, when most people take their holidays.\ndouble|tăng gấp đôi|The company hopes to ＊ its sales in three years.\n[N]\nBạn đã đi hết bốn chặng Listening và Reading. Trước khi sang phần tiếp theo, hãy làm bài kiểm tra cuối Chặng 4 ở trang Lộ trình và ghi lại tỉ lệ đúng của từng phần.\nViệc nên làm từ đây: mỗi ngày một lượt Part 5 (20 câu, bấm giờ 7 phút) và hai bộ Part 7 trong mục Luyện tập; mỗi tuần luyện lại sổ lỗi cho đến khi trống. Phần nào đạt dưới 75%, hãy quay lại bài chiến thuật của phần đó ở Chặng 3 hoặc Chặng 4.\nChặng 5 dạy Speaking và Writing. Chặng 6 là các đề thi thử có tính giờ và quy đổi điểm, nơi bạn kiểm chứng mục tiêu 800 của mình.\n[P1]\n📈🖥️👨‍💼|Một người đàn ông chỉ tay vào biểu đồ đi lên trên màn hình lớn.|A man is pointing at a screen.|A man is turning off a monitor.|A chart is being printed.|A man is drawing on a whiteboard.\n🏗️🏢🚧|Một toà nhà đang xây, có giàn giáo bao quanh, không thấy công nhân.|A building is under construction.|Workers are climbing some stairs.|A building is being torn down.|Some windows are being washed.\n🧑‍💼🧑‍💼🧑‍💼🪟|Ba người ngồi họp cạnh một cửa sổ lớn nhìn ra thành phố.|A meeting is taking place near a window.|Some people are looking out of a window.|A window is being opened.|The room is empty.\n[P2]\nHow did sales do last quarter?|They rose slightly, by about two percent.|In the last row.|He sells cars.\nWill prices remain the same next year?|They may go up a little.|It's the same price.|Next to the store.\nWhen does demand usually peak?|Around the end of the year.|At the top of the hill.|It's very demanding.\nDid the number of visitors really double?|Yes, from five thousand to ten thousand.|It's a double room.|They visited twice.\nWhy do fuel prices fluctuate so much?|It depends on the global market.|At the gas station.|They flew yesterday.\nApproximately how long will the repairs take?|About three weeks.|It's very long.|By the repair team.\n[P3]\n@table|Monthly sales (units)|Month,North,South|January,400,300|February,420,310|March,650,305|April,430,320\nA:Look at these sales figures, David. The south has remained almost flat all year.\nB:Yes, it's growing steadily but slowly. The north is more interesting. Look at the month when sales rose sharply.\nA:Do we know why?\nB:That's when we ran the television advertisement. The effect didn't last, though. Sales fell again the next month.\nA:Still, it shows that advertising works there. I'd like to propose doing it again, but for three months instead of one.\nB:Put together a budget, and I'll show it to the director.\n?What does the woman say about sales in the south?|They have hardly changed.|They have fallen sharply.|They doubled in March.|They fluctuated a lot.\n?Look at the graphic. In which month was the television advertisement shown?|March|January|February|April >> Tháng doanh số miền bắc tăng vọt là tháng Ba (650).\n?What does the woman want to do?|Advertise for a longer period|Stop advertising in the north|Lower prices in the south|Hire a new director\n[P4]\nN:Good morning. Here is the monthly business update. Tourism to our city grew dramatically last year: the number of visitors reached two million for the first time, approximately double the figure of five years ago. Hotel prices peaked in August and have fallen slightly since then. Experts expect visitor numbers to remain high this year, although growth will probably be slower. Restaurants and shops in the old town have benefited the most, with sales up by thirty percent.\n?What is the report mainly about?|Growth in tourism|A new hotel|A decline in restaurant sales|Transportation problems\n?What does the speaker say about hotel prices?|They were highest in August.|They doubled last year.|They have risen sharply since August.|They remain unchanged.\n?Which businesses gained the most?|Restaurants and shops in the old town|Hotels near the airport|Travel agencies|Taxi companies\n[P6]\nT:Quarterly sales summary\nSales in the third quarter rose __(1)__ compared with the second quarter, from 4.1 million to 4.2 million dollars. The northern and southern regions reported growth of four and two percent, __(2)__. __(3)__ We expect this trend to continue until the new models arrive in December. Costs __(4)__ stable throughout the period.\n?(1)|slightly|dramatically|sharply|respectively >> Từ 4,1 lên 4,2 triệu là mức tăng nhẹ.\n?(2)|respectively|approximately|steadily|gradually >> Liệt kê hai con số theo đúng thứ tự hai vùng: respectively.\n?( at 7 A.M. in front of City Hall. Runners must collect their race numbers at the Sports Center on October 17 or 18, between 10 A.M. and 6 P.M. Numbers will not be given out on the day of the race.\n|Race|Distance|Entry fee\n|Full marathon|42 km|50 dollars\n|Half marathon|21 km|35 dollars\n|Fun run|5 km|15 dollars\nT:From: Race Office. To: All registered runners. Subject: Important changes\nDear runners, because of road construction on Main Street, the route of the full marathon and the half marathon has been changed. Both races will now start at Lakeside Park instead of City Hall. The fun run is not affected. The starting time remains the same. A map of the new route is attached. Because many runners have told us they work on Friday, the Sports Center will stay open until 9 P.M. on October 17.\nT:From: Sam Reyes. To: Race Office. Subject: Race number\nHello, I registered for the 21-kilometer race in August. I will be out of town on business until late on Saturday night, so I cannot come to the Sports Center on either day. Could my sister collect my number for me if she brings a copy of my ID? If that is not possible, I would like to know whether my entry fee can be refunded. Thank you, Sam Reyes\n?What is stated about race numbers in the first text?|They cannot be collected on race day.|They are sent by mail.|They cost 15 dollars.|They are given out at City Hall.\n?Where will Mr. Reyes's race begin?|At Lakeside Park|At City Hall|At the Sports Center|On Main Street >> Câu liên kết: ông chạy 21 km (half marathon); email thứ hai cho biết half marathon đổi điểm xuất phát sang Lakeside Park.\n?Why did the Sports Center extend its hours on October 17?|Many runners work that day.|The race starts later.|The route was changed.|The center was closed on October 18.\n?How much did Mr. Reyes pay to enter?|35 dollars|50 dollars|15 dollars|21 dollars >> Câu liên kết: cự ly 21 km là half marathon, phí 35 đô la.\n?What does Mr. Reyes ask?|Whether someone else can pick up his number|Whether the race can be moved|Whether he can change to the fun run|Whether the route is flat\n[P5]\nThe number of online orders has increased 【dramatically|dramatic|drama|dramatize】 since last year. >> Bổ nghĩa cho \"has increased\": trạng từ.\nThe meeting will last 【approximately|approximate|approximation|approximates】 two hours. >> Trước con số: trạng từ approximately.\nInterest rates are expected to 【remain|remainder|remaining|remains】 low throughout the year. >> Sau \"to\" cần động từ nguyên mẫu.\nThe cost of raw materials tends to 【fluctuate|flatter|flourish|flow】 with the seasons. >> \"Fluctuate\": dao động.\nThe first and second prizes went to Ms. Lee and Mr. Park, 【respectively|respectfully|respectably|respective】. >> \"Respectively\": lần lượt theo thứ tự. \"Respectfully\" là một cách kính trọng.\nProfits rose 【sharply|sharp|sharpen|sharpness】 after the new product was launched. >> Bổ nghĩa cho \"rose\": trạng từ.\nDemand for air conditioners usually 【peaks|peeks|picks|packs】 in July. >> \"Peak\": đạt đỉnh.\nThe company plans to 【double|doubly|doubling|doubled】 its workforce within five years. >> Sau \"plans to\" cần động từ nguyên mẫu.\nTemperatures will rise 【gradually|gradual|grade|graduate】 over the coming week. >> Bổ nghĩa cho \"will rise\": trạng từ.\nThe new system has 【significantly|significant|significance|signify】 improved our response time. >> Giữa \"has\" và V3: trạng từ.\n\n##E1|Speaking câu 1–2: đọc to một đoạn văn|Phát âm, trọng âm và ngữ điệu\n>Hai câu đầu của bài Speaking chấm đúng hai thứ: phát âm, và ngữ điệu cùng trọng âm. Bạn có 45 giây chuẩn bị và 45 giây đọc cho mỗi đoạn.\n[N]\nĐoạn văn dài khoảng 40 đến 60 từ, thường là thông báo, quảng cáo, lời hướng dẫn viên hoặc lời thoại tổng đài. 45 giây là dư để đọc với tốc độ vừa phải, nên đừng vội. Đọc nhanh mà nuốt âm sẽ mất điểm hơn đọc chậm mà rõ.\nDùng 45 giây chuẩn bị để đọc thầm thành tiếng một lượt và đánh dấu ba thứ. Một: chỗ ngắt, ở mỗi dấu phẩy và dấu chấm. Hai: các chuỗi liệt kê ba mục (\"fruit, vegetables, and bread\"): lên giọng ở hai mục đầu, xuống giọng ở mục cuối. Ba: từ khó phát âm, tên riêng, con số.\nTrọng âm câu: nhấn vào từ mang nghĩa (danh từ, động từ chính, tính từ, số), đọc lướt các từ chức năng (the, of, to, and). Câu hỏi Yes / No lên giọng ở cuối; câu trần thuật và câu hỏi Wh- xuống giọng.\nLỗi mất điểm nhiều nhất của người Việt: bỏ âm cuối (s, t, d, k), đặc biệt là đuôi số nhiều và đuôi -ed. Nếu đọc sai một từ, đừng quay lại từ đầu câu: sửa ngay từ đó rồi đọc tiếp.\n[S1]\nAttention, shoppers. Fresh Mart will be closing in fifteen minutes. Please bring your items to the checkout counters at the front of the store. Remember that our weekend sale on fruit, vegetables, and bread begins tomorrow morning. Thank you for shopping with us, and have a pleasant evening.\nAre you looking for a comfortable, quiet, and affordable place to stay? The Lakeside Hotel offers large rooms, free breakfast, and a beautiful view of the water. Book online today, and you will receive twenty percent off your first night. The Lakeside Hotel: your home away from home.\nWelcome to the City History Museum. Our tour will begin on the second floor, continue through the photograph gallery, and end in the garden. Please remember that food, drinks, and flash photography are not allowed inside. If you have any questions, feel free to ask me at any time.\nThank you for calling Green Valley Dental Clinic. Our office is open Monday through Friday, from nine A.M. to six P.M. To make, change, or cancel an appointment, please press one. For directions to our office, press two. To speak with a member of our staff, please stay on the line.\n##E2|Speaking câu 3–4: tả một bức ảnh|Khung bốn bước cho 30 giây\n>Bạn có 45 giây chuẩn bị và 30 giây nói cho mỗi ảnh. Điểm đến từ việc tả được nhiều chi tiết liên quan bằng câu đúng ngữ pháp, không phải từ vựng cao siêu.\n[V]Cụm từ để tả ảnh\nin the foreground|ở phía trước ảnh, tiền cảnh|＊, a woman is typing on a laptop.\nin the backg
