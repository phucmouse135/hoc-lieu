will be out of service all day.|They must not be used this week.|They will run faster.\n?What should tenants do if the alarm rings at 3 P.M. on Thursday?|Leave the building|Ignore it|Call the management office|Use the elevator\n--\nT:Meeting rooms: How to book\nMeeting rooms on the fourth floor can be booked through the company calendar up to two weeks in advance. Rooms A and B hold six people each; Room C holds sixteen and has video-conference equipment. A booking may not be longer than three hours. If you no longer need a room, please cancel your booking so that others can use it. Rooms that remain empty fifteen minutes after the start time will be released automatically. Food is allowed only in Room C.\n?How far ahead can a room be booked?|Two weeks|Three hours|Fifteen minutes|One month\n?Which room should be used for a video call with a client?|Room C|Room A|Room B|Any room\n?What happens if nobody arrives within fifteen minutes of the start time?|The booking is canceled.|A fee is charged.|The room is locked.|A manager is informed.\n--\nT:Software firm to move headquarters to Riverton\nRiverton. Brightpath Software announced on Wednesday that it will move its headquarters from the capital to Riverton next spring. The company has bought the former Atlas Bank building on Station Road and will spend eight million dollars renovating it.\nAbout 250 employees will be asked to relocate, and the company expects to hire another 100 people locally within two years. \"Office space in the capital has become too expensive,\" said the chief executive, Mr. Paul Henning. \"Riverton offers lower costs and a good university.\"\nThe mayor of Riverton welcomed the news and said the city would improve bus services to Station Road before the office opens.\n?What is the article mainly about?|A company's plan to relocate|The closing of a bank|The expansion of a university|A change in bus fares\n?What will happen to the former bank building?|It will be renovated.|It will be demolished.|It will be sold.|It will become a school.\n?According to Mr. Henning, why is the company moving?|Costs are too high in the capital.|There are too few workers in the capital.|The mayor asked the company to move.|A bank offered it a building.\n?What has the city promised to do?|Improve public transportation|Lower taxes|Build a parking garage|Hire a hundred people\n--\nT:Letter from the Green Living Expo\nDear Ms. Okoye, thank you for registering as an exhibitor at this year's Green Living Expo, which will take place from April 10 to 12 at the City Exhibition Center. [1] Your booth number is B-27, in the main hall near the east entrance.\nExhibitors may set up their booths on April 9 between noon and 8 P.M. [2] Each booth includes one table, two chairs and an electrical outlet. Additional furniture can be rented from the organizers. [3]\nPlease note that all materials must be removed by 9 P.M. on April 12. [4] Exhibitor badges for you and up to three staff members will be mailed next week.\nSincerely, Jonas Weber, Exhibitor Services\n?What is the purpose of the letter?|To give information to an exhibitor|To invite a speaker|To sell tickets|To cancel an event\n?What is provided with each booth?|A table|A computer|A sign|A carpet\n?By when must exhibitors clear their booths?|9 P.M. on April 12|Noon on April 9|8 P.M. on April 9|The morning of April 10\n?In which of the positions marked [1], [2], [3], and [4] does the following sentence best belong? \"A price list is enclosed with this letter.\"|[3]|[1]|[2]|[4] >> Bảng giá liên quan đến câu ngay trước vị trí [3]: có thể thuê thêm đồ đạc.\n--\nT:Employee discount program: Participating businesses\n|Business|Discount|How to use\n|City Gym|20 percent off monthly membership|Show employee ID\n|Luna Café|10 percent off all drinks|Show employee ID\n|Star Cinema|2 dollars off each ticket|Enter code STAFF online\n|Wheel Works (bicycle shop)|15 percent off repairs|Show employee ID\nDiscounts are for employees only and cannot be shared with family members, except at Star Cinema, where up to four tickets may be bought per visit. The program runs until December 31. To suggest a new business for the program, contact Lena in the personnel office.\n?How can employees get a discount at Luna Café?|By showing an ID card|By entering a code|By using a coupon|By paying in cash\n?Which business offers a discount that is used online?|Star Cinema|City Gym|Luna Café|Wheel Works\n?What is indicated about family members?|They can benefit only at the cinema.|They can use all the discounts.|They cannot benefit at all.|They can use the gym discount.\n?Why would an employee contact Lena?|To propose another business|To get an ID card|To make a complaint|To buy cinema tickets\n--\nT:Travel smart: Packing for a short business trip\nExperienced travelers agree on one rule: never check a bag for a trip of three days or less. A carry-on bag saves time at the airport and cannot be lost by the airline.\nStart with your shoes, since they take up the most room. One pair for work and one for walking is enough. Choose clothes in two or three colors that go together, so that every shirt can be worn with every pair of trousers. Roll your clothes instead of folding them; they will take less space and have fewer lines.\nFinally, keep a small bag of toiletries and chargers packed at all times. This way, you will not forget anything when you must leave on short notice.\n?What is the main advice of the article?|Travel with only a carry-on bag|Buy new shoes for each trip|Check your bags early|Travel less often\n?Why should travelers start with their shoes?|They need the most space.|They are the heaviest items.|They get dirty easily.|They are expensive.\n?The phrase \"go together\" in paragraph 2, line 2, is closest in meaning to|match|travel|leave|fold >> Màu sắc \"go together\": hợp với nhau.\n?What does the writer suggest keeping ready at all times?|A bag of small personal items|A second suitcase|A spare pair of shoes|Printed tickets\n--\nT:Green Table Catering: Lunch menus for offices\n|Menu|Price per person|Includes\n|Light|9 dollars|Soup, bread and fruit\n|Classic|12 dollars|Sandwich, salad and dessert\n|Hot|15 dollars|Hot main dish, rice, salad and dessert\n|Premium|20 dollars|Hot main dish, two side dishes, dessert and drinks\nMinimum order: 10 people. Orders must be placed by 3 P.M. the day before. Delivery is free for orders of 150 dollars or more; otherwise, the delivery fee is 15 dollars. Vegetarian versions of all menus are available on request.\nT:From: Tessa Morgan. To: Green Table Catering. Subject: Lunch order for Thursday\nHello, I would like to order lunch for a training session this Thursday for twelve people. We would like a hot main dish, but we already have drinks in the office, so we do not need them. Two of the participants are vegetarian. Please deliver to Ridge Consulting, 14 Oak Street, fifth floor, at 12:15. Could you confirm the total cost, including delivery? Thank you, Tessa Morgan\n?What is the minimum number of people for an order?|Ten|Twelve|Fifteen|Twenty\n?What is indicated about vegetarian meals?|They must be requested.|They cost extra.|They are offered only with the Light menu.|They are not available.\n?Which menu will Ms. Morgan most likely order?|Hot|Light|Classic|Premium >> Câu liên kết: cô muốn món chính nóng nhưng không cần đồ uống; thực đơn Hot có món nóng và không kèm đồ uống.\n?How much will Ms. Morgan most likely pay in total?|180 dollars|195 dollars|144 dollars|240 dollars >> Câu liên kết: 12 người × 15 đô la = 180; từ 150 đô la trở lên được miễn phí giao.\n?By when must Ms. Morgan place her order?|Wednesday at 3 P.M.|Thursday at 12:15|Tuesday at 3 P.M.|Thursday at 3 P.M. >> Câu liên kết: phải đặt trước 3 giờ chiều của ngày trước đó; bữa trưa vào thứ Năm.\n--\nT:From: Sandra Whitfield. To: Marketing team. Subject: Team day on May 23\nHi everyone, our team day this year will be on Friday, May 23. We will take a bus from the office at 8:30 A.M. to Pine Lake, about an hour away. In the morning, there will be a choice of two activities: a guided walk around the lake or a cooking class at the Lakeside Lodge. Lunch at the lodge is at 12:30, and in the afternoon we will hold a short planning meeting before returning at 4 P.M. Please tell me by May 16 which activity you prefer and whether you have any food allergies. The company will cover all costs.\nT:From: Tom Reilly. To: Sandra Whitfield. Subject: Re: Team day on May 23\nHi Sandra, thanks for organizing this. I would like to do the activity at the lodge, as my knee is still not good enough for a long walk. I have no allergies. One problem: I have a dentist appointment at 8 A.M. that day and will not be finished in time for the bus. I will drive to the lake myself and should arrive around 10. Could you ask the instructor whether I can join late? Tom\n?What is the purpose of the first email?|To give details of a team event|To cancel an event|To request a budget|To introduce a new team member\n?What are team members asked to tell Ms. Whitfield?|Their choice of activity|Their bus seat number|Their preferred lunch time|The cost of their travel\n?Which activity does Mr. Reilly choose?|The cooking class|The guided walk|The planning meeting|Neither activity >> Câu liên kết: anh chọn \"the activity at the lodge\"; thư đầu cho biết lớp nấu ăn diễn ra ở Lakeside Lodge.\n?Why will Mr. Reilly not take the bus?|He has an appointment that morning.|His knee hurts.|He prefers to drive.|He lives near the lake.\n?About what time is the bus expected to reach Pine Lake?|9:30 A.M.|8:30 A.M.|10:00 A.M.|12:30 P.M.\n--\nT:BeanWorks: Coffee machine rental for offices\n|Plan|Monthly fee|Machine|Coffee included\n|Small office|60 dollars|Model S (up to 15 people)|2 kilograms\n|Medium office|110 dollars|Model M (up to 40 people)|5 kilograms\n|Large office|190 dollars|Model L (up to 100 people)|10 kilograms\nAll plans include free installation, monthly cleaning and repairs. Extra coffee costs 18 dollars per kilogram. Contracts are for a minimum of twelve months. New customers may try any machine free for two weeks.\nT:From: Elliot Park, Summit Legal. To: BeanWorks. Subject: Rental inquiry\nHello, our office has thirty-two employees, and we are interested in renting a coffee machine. We currently use about seven kilograms of coffee a month. Could you tell me which plan would suit us and what the monthly cost would be with the extra coffee? We would also like to try the machine before signing a contract. Is that possible? Regards, Elliot Park\nT:From: Dina Marsh, BeanWorks. To: Elliot Park. Subject: Re: Rental inquiry\nDear Mr. Park, thank you for your inquiry. For an office of your size, I recommend the Medium office plan. Based on the amount of coffee you mentioned, you would need two kilograms more than the plan includes each month.\nYou are welcome to use our free trial. I can have a technician install the machine next Tuesday. If you decide not to continue after the trial period, we will collect the machine at no charge. Best regards, Dina Marsh\n?What is included in all plans?|Repairs|Extra coffee|Cups|A full-time technician\n?Which machine will Summit Legal most likely receive?|Model M|Model S|Model L|None of them >> Câu liên kết: gói Medium office đi kèm máy Model M.\n?How much would Summit Legal most likely pay each month?|146 dollars|110 dollars|128 dollars|190 dollars >> Câu liên kết: 110 đô la cộng 2 kg cà phê thêm × 18 đô la.\n?How long can Summit Legal use the machine before deciding?|Two weeks|Twelve months|One month|Until next Tuesday >> Câu liên kết: thời gian dùng thử miễn phí cho khách mới là hai tuần.\n?What will happen if Mr. Park decides not to continue?|The machine will be taken away for free.|He will pay 60 dollars.|He will keep the machine.|He will pay a cancellation fee.\n--\nT:Hillview Rentals: Apartments available in March\n|Address|Bedrooms|Monthly rent|Notes\n|12 Elm Street|1|700 dollars|Third floor, no elevator\n|48 Lake Road|2|950 dollars|Ground floor, small garden\n|5 Park Avenue|2|1,100 dollars|Tenth floor, parking included\n|77 King Street|3|1,300 dollars|Near Central Station\nAll apartments require a deposit equal to one month's rent. Pets are allowed only in ground-floor apartments. Viewings are held on Saturdays between 10 A.M. and 2 P.M.\nT:From: Carmen Ortega. To: Hillview Rentals. Subject: Apartment search\nHello, my husband and I are moving to the city for work in March. We need two bedrooms, as I work from home, and we have a small dog. Our budget is up to 1,000 dollars a month. Do you have anything suitable? We will be in the city on the weekend of February 22 and 23 and would like to see it then. Thank you, Carmen Ortega\nT:From: Neil Foster, Hillview Rentals. To: Carmen Ortega. Subject: Re: Apartment search\nDear Ms. Ortega, thank you for your message. One of our March apartments matches all of your requirements, and I would be happy to show it to you during our regular viewing hours on the 22nd. Shall we say 11 A.M.?\nIf you decide to take it, we will need the deposit and a copy of your employment contract within five days of the viewing. Kind regards, Neil Foster\n?What is indicated about the apartments?|A deposit is required for each of them.|They all include parking.|They all allow pets.|They can be viewed on Sundays.\n?Which apartment will Mr. Foster most likely show Ms. Ortega?|48 Lake Road|12 Elm Street|5 Park Avenue|77 King Street >> Câu liên kết: hai phòng ngủ, không quá 1.000 đô la, và ở tầng trệt vì có nuôi chó.\n?How much deposit would Ms. Ortega pay for that apartment?|950 dollars|700 dollars|1,000 dollars|1,900 dollars >> Câu liên kết: tiền cọc bằng một tháng tiền thuê.\n?On what day of the week will the viewing take place?|Saturday|Sunday|Friday|Monday >> Câu liên kết: xem nhà trong giờ xem thông thường, tức thứ Bảy.\n?What must Ms. Ortega provide if she takes the apartment?|A copy of her employment contract|A letter from her landlord|A bank statement|A photo of her dog\n--\nT:Staff Awards: Nominations now open\nEach year, the company recognizes outstanding employees in four categories.\n|Award|For|Prize\n|Rising Star|An employee with less than two years at the company|500 dollars\n|Customer Hero|Excellent service to customers|500 dollars\n|Team Player|Helping colleagues succeed|500 dollars\n|Innovator|A new idea that saved time or money|1,000 dollars\nAny employee may nominate a colleague by sending an email to the awards committee by November 20. Please explain your reasons in no more than 200 words. Winners will be announced at the year-end party on December 12.\nT:From: Laura Kim. To: Awards committee. Subject: Nomination\nI would like to nominate Samir Patel of the warehouse team. In March, Samir suggested a new way of arranging the shelves so that the most popular products are closest to the packing area. He built a model in his own time and tested it for two weeks. Since his system was adopted, packing an order takes about a third less time, and we no longer need temporary staff during busy periods. Samir joined us five years ago and has never stopped looking for better ways to work. Laura Kim, Warehouse Manager\nT:From: Awards committee. To: All staff. Subject: This year's winners\nThank you to everyone who sent a nomination; we received forty-three this year. The winners are: Rising Star, Mei Tanaka (Finance); Customer Hero, Jorge Ruiz (Support); Team Player, Anna Novak (Sales); Innovator, Samir Patel (Warehouse). Congratulations to all four. Prizes will be presented by the chief executive at the party. Because the hotel ballroom is being renovated, the party will be held in our own cafeteria; the date and time are unchanged.\n?How can employees nominate a colleague?|By sending an email|By filling out a paper form|By speaking to the chief executive|By voting at the party\n?What did Mr. Patel do?|He improved the layout of a warehouse.|He hired temporary staff.|He sold more products.|He trained new employees.\n?Why was Mr. Patel NOT eligible for the Rising Star award?|He has worked at the company for more than two years.|He works in the warehouse.|He is a manager.|He was nominated too late. >> Câu liên kết: giải Rising Star dành cho người làm dưới hai năm; anh đã làm năm năm.\n?How much prize money will Mr. Patel receive?|1,000 dollars|500 dollars|200 dollars|2,000 dollars >> Câu liên kết: anh đoạt giải Innovator, trị giá 1.000 đô la.\n?Where will the awards be presented?|In the company cafeteria|In a hotel ballroom|In the warehouse|Online\n\n##S3|Thi thử Speaking và Writing số 3|Đủ 11 câu nói và 8 câu viết\n>Bài thi thử trọn vẹn với đề mới. Phần nói khoảng 20 phút, phần viết 58 phút.\n[S1]\nWelcome aboard Sunline Airways flight two seventeen to Singapore. Our flight time today will be three hours and forty minutes. Please make sure that your seat belt is fastened, your seat is upright, and your bags are under the seat in front of you. We will be serving lunch shortly after takeoff.\nLooking for the perfect gift? Visit the Riverside Craft Market this Saturday and Sunday. More than eighty local artists will be selling jewelry, paintings, and handmade toys. Admission is free, and there will be live music from noon until four. The Riverside Craft Market: something special for everyone.\n[S3]\n🏪🧑‍🍳🍜👥|Tại một quầy đồ ăn đường phố, người bán đang nấu mì trong một cái nồi lớn; hai khách đứng chờ; phía sau có vài bàn nhựa và mấy người đang ngồi ăn.|This is a picture of a street food stall. In the middle of the picture, a man is cooking noodles in a large pot. He is wearing an apron, and he seems to be very busy. In front of the stall, two customers are standing and waiting for their food. One of them is looking at her phone. In the background, I can see some plastic tables, where a few people are sitting and eating. It looks like lunchtime. Overall, the stall seems to be a popular place.\n🏢👩‍💼👨‍💼🛗|Trong sảnh một toà văn phòng, hai người mặc đồ công sở đứng chờ thang máy; người phụ nữ xem điện thoại, người đàn ông cầm cốc cà phê; phía sau là quầy lễ tân.|This picture was taken in the lobby of an office building. In the foreground, a man and a woman are standing in front of an elevator. They are both wearing business clothes, so they are probably on their way to work. The woman is looking at her phone, and the man is holding a cup of coffee. In the background, there is a front desk with a receptionist. The lobby looks clean and modern. It is probably early in the morning.\n[S5]\n>Imagine that a technology magazine is doing research in your country. You have agreed to participate in a telephone interview about smartphones.\nHow many hours a day do you use your smartphone, and what do you use it for most?|I use my smartphone for about four hours a day. I mostly use it for sending messages and reading the news.\nWhen did you buy your current phone, and where did you buy it?|I bought my current phone about two years ago. I bought it at an electronics store near my office because it was on sale.\nWhat is the most important feature for you when you choose a new phone? Why?|For me, the most important feature is battery life. First, I am out of the house from early morning until evening, so I cannot charge my phone during the day. Also, I use my phone for maps and for work emails, and it would be a real problem if it turned off. A good camera is nice, but a phone with a weak battery is useless to me.\n[S8]\n@table|Free Computer Skills Day, Saturday September 14, Riverside Library|Time,Workshop,Level,Room|9:30–10:30,Email basics,Beginner,Room 1|10:45–12:00,Spreadsheets for work,Intermediate,Room 2|1:00–2:00,Online safety,Beginner,Room 1|2:15–3:30,Building a simple website,Intermediate,Room 2\nHello, I heard about the Computer Skills Day. Where is it, and how much does it cost?|The Computer Skills Day will be held at the Riverside Library on Saturday, September 14. All of the workshops are free.\nI'd like to attend the workshop on spreadsheets. That's in the afternoon, right?|I'm afraid that's not correct. Actually, the spreadsheet workshop is in the morning, from ten forty-five to noon, in Room 2.\nI'm a complete beginner. Could you tell me which workshops would be suitable for me?|Of course. There are two workshops for beginners, and both take place in Room 1. The first one is \"Email basics\", from nine thirty to ten thirty in the morning. The second one is \"Online safety\", which starts at one P.M. and ends at two. The other two workshops are for the intermediate level.\n[S11]\nDo you agree or disagree with the following statement? Children should learn to use computers from an early age. Give reasons or examples to support your opinion.|I agree that children should learn to use computers from an early age, and there are two reasons for this. First of all, computers are part of almost every job today. If children start early, using a computer becomes as natural as reading and writing. For instance, my niece learned to type when she was seven, and now she finishes her homework much faster than her classmates. What is more, computers make learning more interesting, because children can watch videos and play educational games. Of course, parents should limit the time children spend in front of a screen. But for these reasons, I strongly believe that starting early is a good idea.\n[W1]\n👨‍🍳🧅🔪|Một đầu bếp đang thái hành trên thớt.|cut / onion|The chef is cutting an onion on a wooden board.\n👩‍🎓📚🏫|Một nữ sinh viên ôm chồng sách đi vào thư viện.|carry / library|The student is carrying some books into the library.\n🚌🧒🧒👩‍🏫|Mấy đứa trẻ đang lên xe buýt của trường, cô giáo đứng bên cạnh.|children / bus|The children are getting on the school bus.\n🧑‍💼🕘🏃|Một người đàn ông chạy vào văn phòng vì đã muộn giờ.|late / so|The man is late, so he is running to the office.\n👵📮✉️|Một bà cụ đang bỏ thư vào hòm thư.|woman / mailbox|An elderly woman is putting a letter into the mailbox.\n[W6]\nT:From: Luis Ortega, Communications team. To: All staff. Subject: Ideas for the company newsletter\nDear colleagues, we are planning to start a monthly company newsletter in January. We want it to be interesting and useful for everyone, so we would like to hear your ideas. What kinds of articles or sections would you like to read? Please reply by the end of next week.\n!Respond to the email as a member of the staff. In your email, make TWO suggestions and ask ONE question.\n$Dear Mr. Ortega,\n$Thank you for your email about the new company newsletter. I think it is a great idea.\n$I would like to make two suggestions. First, I suggest that each issue include a short interview with an employee from a different department, so that we can get to know our colleagues. Another idea is to have a section with useful tips, for example on using our software or managing time.\n$I also have a question. Could you please tell me whether employees can send in their own articles or photos?\n$I look forward to reading the first issue.\n$Best regards, Dang Thu Ha\n--\nT:From: Anna Bell. To: Lakeside Bike Shop. Subject: Bicycle rental for a group\nHello, I am organizing a day out for eight colleagues next Saturday, and we would like to rent bicycles from your shop. Could you tell me about your prices and your opening hours? We do not know the area well, so any advice would be welcome.\n!Respond to the email as an employee of the bike shop. In your email, give TWO pieces of information and make ONE suggestion.\n$Dear Ms. Bell,\n$Thank you for your interest in Lakeside Bike Shop. We would be happy to help with your day out.\n$Here is the information you asked for. First, the rental price is 15 dollars per bicycle for a full day, and helmets are included. Second, on Saturdays we are open from 8 A.M. to 7 P.M., so you can start early.\n$Since you do not know the area, I suggest that you take the path around the lake. It is flat, about twenty kilometers long, and there are several cafés along the way.\n$Please let me know if you would like to reserve the eight bicycles.\n$Best regards, Tran Nam\n[W8]\nQ:Do you agree or disagree with the following statement? \"The best way to learn a job is from experienced coworkers rather than from formal training courses.\" Give specific reasons and examples to support your opinion.\n$When people start a new job, they usually learn in two ways: through formal training courses and by watching experienced coworkers. Both are useful, but I agree that learning from colleagues is the better way to really master a job. I have three reasons for this opinion.\n$To begin with, coworkers teach what is actually needed. A training course is designed for many people, so much of the content is general. In contrast, a colleague shows you exactly how things are done in your own office. When I started working at a hotel, for example, I attended a two-day course on customer service. It was interesting, but I learned far more in my first week at the front desk, standing next to a receptionist who had worked there for ten years.\n$Another reason is that you can ask questions at the right moment. In a classroom, problems are imaginary. At work, they are real, and an experienced coworker can explain the solution immediately. My colleague once showed me in two minutes how to solve a booking problem that the course had never mentioned. This means that the lesson is connected to a real situation, so it is much easier to remember.\n$Furthermore, learning from colleagues builds relationships. When a senior employee helps a newcomer, they get to know each other, and the new person feels welcome. As a consequence, he or she is more likely to stay with the company. A course with strangers cannot create this feeling.\n$It is true that formal training has advantages. Some subjects, such as safety rules or new software, are best taught by experts in an organized way. For this reason, companies should not cancel their courses completely.\n$In conclusion, although formal training is useful for certain topics, I believe that experienced coworkers are the best teachers. They provide practical knowledge, immediate answers and personal support. The ideal company uses both methods but gives every new employee a mentor.\n##S4|Thi thử Speaking và Writing số 4|Đủ 11 câu nói và 8 câu viết\n>Bài thi thử trọn vẹn với đề mới. Phần nói khoảng 20 phút, phần viết 58 phút.\n[S1]\nThank you for visiting the Greenwood Botanical Garden. The garden is open daily from nine A.M. to six P.M. During your visit, please stay on the paths, keep your voices low, and do not pick the flowers. The gift shop and the tea house are located next to the main gate.\nThis is a message for all Westside Bank customers. Our online banking service will be unavailable this Sunday from midnight until six A.M. while we improve our security system. During this time, you can still use your cards in shops, restaurants, and cash machines. We apologize for any inconvenience.\n[S3]\n🧑‍🏫👦👧🖥️|Trong một phòng máy tính, một giáo viên cúi xuống hướng dẫn một học sinh; mấy học sinh khác ngồi làm việc trước màn hình; trên tường có một tấm bảng trắng.|This is a picture of a computer classroom. In the foreground, a teacher is leaning over and helping a student with something on the screen. The student is listening carefully. Next to them, several other students are sitting at their desks and working on computers. They all seem to be concentrating. In the background, there is a whiteboard on the wall with some writing on it. The room looks bright and well organized. Overall, it seems to be a typical lesson.\n🏖️⛱️👨‍👩‍👧🌊|Trên bãi biển, một gia đình ngồi dưới ô; đứa trẻ đang xây lâu đài cát; phía xa có vài người đang bơi và một chiếc thuyền.|This picture was taken at a beach. In the middle of the picture, a family is sitting under a large umbrella. The parents are relaxing on chairs, and their child is building a sandcastle next to them. On the left side, there is a bag and some towels on the sand. In the background, I can see a few people swimming in the sea and a small boat. The sky is clear, so the weather is probably hot. They seem to be enjoying their vacation.\n[S5]\n>Imagine that a media company is doing research in your country. You have agreed to participate in a telephone interview about how people get the news.\nHow often do you read or watch the news, and when do you usually do it?|I read the news every day. I usually do it in the morning while I am having breakfast, and sometimes again before I go to bed.\nWhere do you usually get your news: from television, newspapers or the internet?|I usually get my news from the internet, mainly from news websites on my phone. I almost never buy a printed newspaper.\nDo you think people today are better informed than people in the past? Why or why not?|Yes, I think people today are better informed in some ways. First, news travels much faster now. We can learn about an event in another country within a few minutes. Also, we can compare many different sources instead of reading only one newspaper. However, there is also a lot of false information online, so people need to check carefully. Overall, I think we know more, but we must be more careful.\n[S8]\n@table|Harbor City one-day tour, Sunday June 8, price 45 dollars per person|Time,Activity,Notes|8:30,Bus leaves from Central Station,Arrive 15 minutes early|9:30,Visit to the Maritime Museum,Entrance fee included|12:00,Lunch at Pier 7 Restaurant,Not included in the price|2:00,Boat trip around the harbor,One hour|4:30,Return to Central Station,\nHi, I'm interested in the tour. What time does it start, and where do we meet?|The tour starts at eight thirty in the morning. The bus leaves from Central Station, and you should arrive fifteen minutes early.\nAnd lunch is included in the forty-five dollars, isn't it?|I'm afraid not. Actually, the entrance fee for the Maritime Museum is included, but lunch at Pier 7 Restaurant is not included in the price.\nCould you tell me what we will do after lunch?|Certainly. After lunch, there are two more items on the schedule. At two o'clock, there is a boat trip around the harbor, which takes one hour. After that, you will have some free time, and then the bus returns to Central Station. You will arrive there at four thirty.\n[S11]\nSome people prefer a job that requires a lot of travel. Others prefer a job where they stay in one office. Which would you prefer, and why?|I would prefer a job where I stay in one office, and there are two reasons for this. First of all, I value a regular routine. When I work in one place, I can go to the gym after work and have dinner with my family every evening. For instance, my brother travels for his job three weeks a month, and he often misses his children's birthdays. What is more, traveling is tiring. Airports, hotels, and different time zones make it hard to sleep well. Of course, seeing new places is exciting, so I enjoy a business trip once or twice a year. But to sum up, I would rather have a stable life.\n[W1]\n🧑‍🔧🚪🔨|Một người thợ đang sửa cánh cửa bằng búa.|fix / door|The man is fixing the door with a hammer.\n👩‍💼🧑‍💼☕🗣️|Hai đồng nghiệp trò chuyện trong lúc uống cà phê.|talk / while|Two colleagues are talking while they drink coffee.\n🧒🪁🌳|Một cậu bé đang thả diều trong công viên.|boy / park|A boy is flying a kite in the park.\n👨‍🍳🍰🎂|Một thợ làm bánh đang trang trí chiếc bánh kem.|decorate / cake|The baker is decorating a cake with fruit.\n🚗⛽🧍‍♂️|Một người đàn ông đang đổ xăng cho xe ở trạm xăng.|car / because|The man is filling his car with gas because the tank is almost empty.\n[W6]\nT:From: IT department. To: All staff. Subject: New laptops\nDear colleagues, next month we will replace all office laptops that are more than four years old. To choose the right models, we need to know how you use your computer. Please tell us about your needs and let us know if you have any special requests.\n!Respond to the email as a member of the staff. In your email, give ONE piece of information and make TWO requests.\n$Dear IT team,\n$Thank you for your email about the new laptops.\n$Let me tell you how I use my computer. I work in the design department, so I use large graphics programs every day, and my current laptop is often very slow.\n$I would like to make two requests. First, could you please give me a laptop with a larger screen and more memory? Second, I would like to keep my old laptop for one extra week so that I can copy all of my files.\n$Please let me know if you need any more details.\n$Best regards, Bui Quang Huy\n--\nT:From: Daniel Cho, Training team. To: Ms. Pham. Subject: Talk for new staff\nDear Ms. Pham, we are organizing a welcome day for twenty new employees next month, and we would like someone from each department to give a short talk. Would you be willing to speak for thirty minutes about the work of the customer service department?\n!Respond to the email as Ms. Pham. In your email, give ONE piece of information and ask TWO questions.\n$Dear Mr. Cho,\n$Thank you for inviting me to speak at the welcome day. I would be happy to do it.\n$I should tell you that I will be away on a business trip from the tenth to the fourteenth of next month, so I am not available on those days.\n$I also have two questions. First, could you tell me the exact date and time of the event? Second, I was wondering if there will be a projector in the room, as I would like to show some slides.\n$I look forward to hearing from you.\n$Best regards, Pham Thi Lan\n[W8]\nQ:Some people think companies should allow employees to choose their own working hours. Others think fixed working hours are better. Which view do you agree with? Give specific reasons and examples to support your opinion.\n$Traditionally, most employees have worked fixed hours, for example from nine to five. Today, however, many companies let their staff decide when to start and finish. In my opinion, allowing employees to choose their own working hours is the better approach, as long as the work gets done.\n$One reason is that people are productive at different times. Some are full of energy early in the morning, while others think more clearly in the evening. If everyone must work the same hours, many employees spend part of the day feeling tired. A friend of mine, for instance, is a programmer who does his best work after lunch. Since his company introduced flexible hours, he starts at eleven and finishes at seven, and he says he completes his tasks much faster.\n$Another reason is that flexible hours make it easier to balance work and family life. Parents can take their children to school, and employees can visit a doctor or a bank without taking a day off. My sister, who has two young children, says she could not keep her job without this freedom. As a consequence, such employees feel less stress and are more loyal to their employer. In particular, flexible hours help people avoid rush-hour traffic, which saves time and energy every day.\n$It is true that fixed hours have some advantages. It is easier to organize meetings when everyone is in the office at the same time, and customers know exactly when they can call. However, this problem can be solved. Many companies ask all staff to be present during a few core hours, such as ten to three, and let them choose the rest.\n$In short, I believe that employees should be free to choose their working hours. This freedom allows them to work when they are most productive and to manage their personal lives. With a few simple rules about core hours, both the company and its employees benefit.\n\n##X1|Văn phòng và hành chính|\n[V]Văn phòng và hành chính\nstationery|văn phòng phẩm|We order ＊ such as pens and envelopes once a month.\nphotocopier|máy photocopy|The ＊ is out of paper again.\nstapler|cái dập ghim|Can I borrow your ＊ to fasten these pages together?\nfiling cabinet|tủ hồ sơ|Old contracts are kept in the ＊ next to the window.\nbulletin board|bảng thông báo|The holiday schedule is po const PAL=['var(--s1)','var(--s2)','var(--s3)','var(--s4)','var(--s5)'];
function tableV(title,rows){

function chartV(kind,title,unit,cats,ser){
  const Wd=560,H=300,l=46,r=14,t=18,b=34,max=Math.max(...ser.flatMap(s=>s.v)),raw=max/5,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p,step=(f<=1?1:f<=2?2:f<=5?5:10)*p,top=Math.ceil(max/step-1e-9)*step;

function pieV(title,parts){

function vItems(items,text){
  const out=[];
  (Array.isArray(items)?items:[]).forEach(it=>{
    if(!it||typeof it.q!=='string'||!it.q.trim())return;const exp=typeof it.exp==='string'?it.exp:'';
    if(it.t==='mc'&&Array.isArray(it.opts)){const o=uniq(it.opts.map(x=>String(x).trim()).filter(Boolean)).slice(0,4);if(o.length>=3)out.push({t:'mc',q:it.q,opts:o,exp})}
    else if(it.t==='tf'&&['T','F','N'].includes(it.ans))out.push({t:'tf',q:it.q,ans:it.ans,yn:false,exp});
    else if(it.t==='gap'&&/_{2,}/.test(it.q)){const ans=(Array.isArray(it.ans)?it.ans:[it.ans]).map(x=>String(x==null?'':x).trim()).filter(Boolean);
      if(ans.length&&(!text||ans.some(a=>text.toLowerCase().includes(a.toLowerCase()))))out.push({t:'gap',q:it.q.replace(/_{2,}/,'＊').replace(/_{2,}/g,''),ans,exp})}
  });

}

const bkHas=()=>!!ST.name&&(Object.keys(ST.done).length>0||Object.keys(ST.act).length>0||Object.keys(ST.wrong).length>0);
function bkNorm(d){
  const O=x=>x&&typeof x==='object'&&!Array.isArray(x)?x:{},A=x=>Array.isArray(x)?x:[],N=x=>isFinite(+x)&&+x>0?+x:0;
  return Object.assign(blank(),{name:typeof d.name==='string'?d.name.slice(0,60):'',theme:d.theme==='light'||d.theme==='dark'?d.theme:'',rate:[.75,.9,1].includes(+d.rate)?+d.rate:.9,scope:d.scope==='all'?'all':'learned',
    done:O(d.done),wrong:O(d.wrong),act:O(d.act),exams:O(d.exams),drafts:O(d.drafts),best:O(d.best),gen:A(d.gen).filter(g=>g&&g.id&&g.k&&g.d).slice(0,16),myw:A(d.myw).filter(Boolean),exlog:A(d.exlog).filter(x=>x&&x.d).slice(0,20),mins:N(d.mins),xh:N(d.xh)});
}
function bkMerge(cur,b){
  const r=bkNorm(cur);r.name=cur.name||b.name;
  for(const id in b.done){const x=r.done[id]=Object.assign({},r.done[id]),y=b.done[id]||{};for(const s in y){const v=+y[s]||0;x[s]=x[s]==null?v:Math.max(x[s],v)}}
  for(const k in b.wrong)r.wrong[k]=Math.max(r.wrong[k]||0,+b.wrong[k]||0);
  Object.assign(r.act,b.act);
  for(const k in b.best)r.best[k]=Math.max(r.best[k]||0,+b.best[k]||0);
  for(const k in b.exams){const x=b.exams[k],y=r.exams[k];if(x&&(!y||String(x.d||'')>String(y.d||'')))r.exams[k]=x}
  for(const k in b.drafts)if(!r.drafts[k]||!String(r.drafts[k]).replace(/[,\s]/g,''))r.drafts[k]=b.drafts[k];
  const gs=new Set(r.gen.map(g=>g.id));r.gen=[...r.gen,...b.gen.filter(g=>!gs.has(g.id))].slice(0,16);
  const wk=x=>typeof x==='string'?x:x.w,ws=new Set(r.myw.map(wk));r.myw=[...r.myw,...b.myw.filter(x=>!ws.has(wk(x)))];
  const lk=x=>[x.d,x.id,x.sl,x.sr].join('|'),ls=new Set(r.exlog.map(lk));r.exlog=[...r.exlog,...b.exlog.filter(x=>!ls.has(lk(x)))].sort((p,q)=>String(q.d).localeCompare(String(p.d))).slice(0,20);
  r.mins=Math.max(r.mins,b.mins);r.xh=Math.max(r.xh,b.xh);return r;
}

  if(t.id==='bk-file'){const f=t.files&&t.files[0];t.value='';if(!f)return;if(f.size>8e6){toast('Tệp này quá lớn, không phải bản sao lưu của trang.');return}const r=new FileReader();r.onload=()=>bkOffer(String(r.result||''));r.onerror=()=>toast('Không đọc được tệp. Hãy thử lại hoặc dùng cách dán mã.');r.readAsText(f);return}
  if(a==='hide')t.closest('.sec').querySelector('.vlist').classList.toggle('hidden',t.checked);
  else if(a==='theme'){ST.theme=t.value;save();render(true)}
  else if(a==='rate'){ST.rate=+t.value;save()}
  else if(a==='scope'){ST.scope=t.value;save();render(true)}
});
document.addEventListener('keydown',e=>{
  const z=QZ;if(!z||z.fin||!z.qs)return;const q=z.qs[z.i],k=q.kind,tg=e.target.tagName;
  if(k==='mc'&&/^[1-4]$/.test(e.key)&&!z.shown&&+e.key<=q.opts.length)answer(+e.key-1,+e.key-1===q.a);
  else if(k==='mc'&&/^[a-d]$/i.test(e.key)&&q.abc&&!z.shown&&tg!=='INPUT'){const i='abcd'.indexOf(e.key.toLowerCase());if(i<q.opts.length)answer(i,i===q.a)}
  else if(e.key==='Enter'&&tg!=='BUTTON'&&tg!=='TEXTAREA'&&tg!=='SELECT'){
    if(z.shown){e.preventDefault();nextQ()}
    else if(k==='dict'){e.preventDefault();const v=$('#din').value;answer(v,dictOk(q,v))}
    else if(k==='dgap'){e.preventDefault();dgCheck()}
    else if(k==='set'&&q.items.length===1&&q.items[0].t==='gap'){e.preventDefault();checkSet()}
  }
});
let wT=null;
document.addEventListener('input',e=>{
  const t=e.target;if(!OV||OV.k!=='w'||t.tagName!=='TEXTAREA')return;
  const i=+t.dataset.i;OV.texts[i]=t.value;wcShow(i);clearTimeout(wT);wT=setTimeout(()=>{if(OV&&OV.k==='w')wSave()},2500);
});
addEventListener('hashchange',()=>{if(!QZ&&!OV)render()});
render();initCloud();
