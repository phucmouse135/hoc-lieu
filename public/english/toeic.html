ercent off.|It can be used twice.|It is for members only.\n?What will the man do next?|Look for a size|Call the manager|Print a new coupon|Open the cash register\n[P2]\nIs delivery included in the price?|Yes, it's free of charge.|By truck.|It's very affordable.\nWhen does this coupon expire?|At the end of the month.|Ten percent off.|At the supermarket.\nWould you like to subscribe for one year or two?|One year is enough for now.|Yes, I would.|It's a monthly magazine.\nIs this laptop a good bargain?|Definitely. It's half the usual price.|It's on the desk.|I bought it online.\n[P5]\nThe store offers 【affordable|afford|affordably|affording】 prices on all kitchen products. >> Trước danh từ \"prices\" cần tính từ.\nYour subscription will 【expire|inspire|explore|expand】 on March 31. >> Hợp nghĩa: gói đăng ký sẽ hết hạn.\nSeats for the workshop are 【limited|limit|limitation|limitless】 to thirty people. >> \"Be limited to\": giới hạn ở.\nWe 【guarantee|guard|guide|gather】 delivery within two days. >> Hợp nghĩa: bảo đảm giao trong hai ngày.\nThe new model has several useful 【features|futures|factors|figures】, such as a larger screen. >> Hợp nghĩa: tính năng.\nParking is free of 【charge|change|chance|chase】 for customers. >> Cụm cố định: free of charge.\n##C9|Part 4: quảng cáo, bản tin và lời giới thiệu|Ba khung bài nói còn lại\n>Ngoài tin nhắn và thông báo, Part 4 còn có quảng cáo trên radio, bản tin ngắn và lời giới thiệu diễn giả hoặc chuyến tham quan. Mỗi loại có trật tự thông tin riêng.\n[V]Tin tức kinh doanh\nannounce|công bố, thông báo|The company will ＊ its new product next week.\nmerge|sáp nhập|The two banks plan to ＊ and become one company.\nacquire|mua lại, thâu tóm|The airline wants to ＊ a smaller company to get more routes.\nexpand|mở rộng|We plan to ＊ into Europe and open ten stores there.\nlaunch|ra mắt, tung ra|They will ＊ the new phone in September.\nrevenue|doanh thu|The company's ＊ rose to ten million dollars last year.\nforecast|dự báo|The weather ＊ says it will rain all weekend.\neconomy|nền kinh tế|Tourism is very important for the island's ＊.\nindustry|ngành (công nghiệp, kinh doanh)|She has worked in the hotel ＊ for twenty years.\ngrowth|sự tăng trưởng|The city has seen rapid ＊; its population has doubled.\ninvest|đầu tư|They plan to ＊ two million dollars in new machines.\ninvestor|nhà đầu tư|An ＊ from Singapore bought twenty percent of the company.\n[N]\nQuảng cáo trên radio: mở bằng một câu hỏi hoặc một vấn đề (\"Tired of slow internet?\"), giới thiệu sản phẩm, nêu điểm mạnh, đưa ưu đãi có thời hạn, rồi cách liên hệ. Câu hỏi: quảng cáo gì, điểm đặc biệt là gì, người nghe nên làm gì để nhận ưu đãi.\nBản tin: mở bằng tên chương trình hoặc \"In local news…\", nêu sự kiện chính, chi tiết (ai, khi nào, con số), rồi thường kết bằng việc sắp xảy ra hoặc mục tiếp theo (\"Stay tuned for the weather\"). Câu hỏi cuối hay hỏi \"What will listeners hear next?\".\nLời giới thiệu: người nói giới thiệu một diễn giả (tên, công việc, thành tích, chủ đề bài nói) hoặc mở đầu một chuyến tham quan (sẽ xem gì, kéo dài bao lâu, quy định). Câu hỏi: người được giới thiệu là ai, sẽ nói về gì, người nghe được yêu cầu làm gì.\n[P4]\nN:Is your internet too slow for video calls? Then it's time to switch to SkyNet. We offer the fastest home internet in the city at an affordable price, starting at just twenty-nine dollars a month. Installation is free of charge, and our technicians can come to your home within two days. Sign up before the end of this month and get your first month free. Visit our website or call 555-0110 today.\n?What is being advertised?|An internet service|A video camera|A computer store|A phone repair shop\n?What does the speaker say about installation?|It costs nothing.|It takes two weeks.|Customers do it themselves.|It costs twenty-nine dollars.\n?How can listeners get a free month?|By signing up this month|By calling after five|By visiting a store|By recommending a friend\n--\nN:This is the six o'clock business news. Local company Baker Foods announced today that it will acquire Sunny Farms, a producer of fruit juice, for forty million dollars. The president of Baker Foods said the deal will help the company expand into the beverage industry. Baker Foods also plans to invest in a new factory, which is expected to create about two hundred jobs next year. Coming up next, the weather forecast for the weekend.\n?What did Baker Foods announce?|It will buy another company.|It will close a factory.|It has a new president.|It will lower its prices.\n?According to the speaker, what will the new factory do?|Create jobs|Produce bread|Replace an old factory|Open this month\n?What will listeners hear next?|A weather report|A sports report|An interview|An advertisement\n--\nN:Good evening, and welcome to the annual meeting of the Small Business Association. It's my pleasure to introduce tonight's speaker, Ms. Rachel Kim. Ms. Kim launched her first café fifteen years ago with a small loan, and today her company has more than sixty branches across the country. Tonight she will talk about how to find investors when you are just starting out. After her talk, there will be time for questions. Please join me in welcoming Ms. Kim.\n?What is the purpose of the talk?|To introduce a speaker|To announce an award|To advertise a café|To ask for a loan\n?What is mentioned about Ms. Kim's company?|It has over sixty branches.|It was started sixty years ago.|It sells business books.|It operates in fifteen countries.\n?What will Ms. Kim talk about?|Finding investors|Opening a café abroad|Hiring staff|Paying back loans\n[P7]\nT:Local News: Riverside Mall to expand\nThe owners of Riverside Mall announced on Tuesday that they will invest 25 million dollars to expand the shopping center. The project will add forty new stores, a cinema and a parking garage with 600 spaces. Building work will begin in March and is expected to take eighteen months.\nThe mall will stay open during the work, although the north entrance will be closed. A spokesperson said the growth of the city's population made the project necessary: the number of visitors has risen by thirty percent in five years. Some local shop owners, however, are concerned that the larger mall will take customers away from small businesses downtown.\n?What is the article mainly about?|Plans to make a mall bigger|The opening of a new cinema|A decrease in visitors|A new downtown shop\n?How long will the building work take?|A year and a half|Five years|Forty weeks|Until March\n?What is indicated about the mall during the work?|One entrance will not be available.|It will be closed completely.|Parking will be free.|The cinema will open first.\n?Why are some shop owners worried?|They may lose customers.|Their rent will go up.|The work will be noisy.|Parking will be limited.\n[P2]\nDid you hear that the two companies are going to merge?|Yes, it was on the news this morning.|It's a large company.|At the main office.\nWhen will the new product be launched?|Sometime in the spring.|In all our stores.|It's a new phone.\nHow was last year's revenue?|About ten percent higher than the year before.|Next year.|In the annual report.\nAre you planning to invest in the project?|I'm still thinking about it.|It's a good plan.|The investor called.\n[P5]\nThe company plans to 【expand|expend|expect|expire】 its business into Southeast Asia. >> Hợp nghĩa: mở rộng kinh doanh.\nThe new smartphone will be 【launched|lunched|lasted|landed】 at an event in Seoul. >> Hợp nghĩa: được ra mắt.\nSales 【growth|grow|grown|growing up】 was slower than expected this year. >> Danh từ ghép làm chủ ngữ: sales growth.\nSeveral foreign 【investors|invests|investing|investments in】 have shown interest in the project. >> Sau tính từ \"foreign\", làm chủ ngữ của \"have shown\": danh từ chỉ người, số nhiều.\nThe director will 【announce|announcement|announcing|announced】 the decision tomorrow. >> Sau \"will\" cần động từ nguyên mẫu.\nAccording to the 【forecast|forehead|foreign|forest】, sales will rise by five percent. >> Hợp nghĩa: theo dự báo.\n##C10|Part 7: tin nhắn và trò chuyện trực tuyến|Câu hỏi \"What does she mean when she writes…?\"\n>Chuỗi tin nhắn và đoạn chat là loại văn bản mới nhất của Part 7. Câu văn ngắn, nhiều cụm nói thường ngày, và luôn có một câu hỏi về ý của người viết.\n[V]Cụm từ khi nhắn tin\non my way|đang trên đường tới|I just left the office; I am ＊ to the restaurant now.\nrunning late|đang bị trễ|I am ＊ because of the traffic; please start without me.\nstuck|bị kẹt|We were ＊ in traffic for an hour.\nlet me know|báo cho tôi biết|Please ＊ if you need any help.\nheads-up|lời báo trước|Thanks for the ＊ about the meeting; I did not know the time had changed.\nget back to|trả lời lại (ai) sau|I do not know the answer now, but I will ＊ you this afternoon.\nfigure out|tìm ra, hiểu ra|I cannot ＊ how to turn on this machine.\ngo ahead|cứ làm đi, cứ tiếp tục|If you are ready, ＊ and start the presentation.\nhang on|chờ một chút|＊ a minute; I need to find my keys.\nno problem|không sao, được thôi|\"Can you send me the file?\" \"＊. I will do it now.\"\nsounds good|nghe được đấy, đồng ý|\"Shall we meet at seven?\" \"＊. See you then.\"\nby the way|nhân tiện|I will see you at the meeting. ＊, did you get my email?\n[N]\nChuỗi tin nhắn có tên người gửi và giờ gửi ở mỗi dòng. Đọc lướt một lượt để nắm: họ là ai với nhau (đồng nghiệp, khách và nhân viên), đang có việc gì, và kết thúc ra sao.\nCâu hỏi ý người viết: \"At 10:42, what does Ms. Park most likely mean when she writes, 'Sounds good'?\". Một câu ngắn như \"Sounds good\", \"Got it\", \"I'm on it\", \"Not really\" chỉ có nghĩa khi gắn với tin nhắn ngay trước nó. Hãy tìm xem câu đó đang trả lời đề nghị, câu hỏi hay thông tin nào, rồi chọn đáp án diễn đạt lại cả ý đó.\nCác câu hỏi còn lại là câu chi tiết bình thường và câu \"What will Mr. Lee probably do next?\", đáp án nằm ở vài tin nhắn cuối.\n[P7]\nT:Text message chain\nLisa Park (9:02 A.M.): Hi, James. Are you at the office yet? The customers from Osaka arrive at ten.\nJames Cole (9:04 A.M.): Not yet. I'm stuck in traffic on the bridge. There was an accident.\nLisa Park (9:05 A.M.): Oh, no. Will you be here in time?\nJames Cole (9:07 A.M.): I doubt it. Could you start the meeting without me? The slides are on my desk.\nLisa Park (9:08 A.M.): No problem. I'll set up the projector now.\nJames Cole (9:09 A.M.): Thanks. By the way, they prefer tea, not coffee.\nLisa Park (9:10 A.M.): Thanks for the heads-up. I'll let the front desk know.\n?Why is Mr. Cole late?|There was an accident on his route.|He missed his train.|He forgot about the meeting.|His car broke down.\n?What does Mr. Cole ask Ms. Park to do?|Begin a meeting|Pick up some customers|Call the front desk|Bring his slides to him\n?At 9:08 A.M., what does Ms. Park mean when she writes, \"No problem\"?|She agrees to start the meeting.|She thinks the traffic is not bad.|She has already finished the slides.|She does not need the projector.\n?What will Ms. Park probably tell the front desk?|To prepare tea|To call a taxi|To cancel the meeting|To order lunch\n--\nT:Online chat: Customer support, HomeStyle Furniture\nAgent Maria (2:15 P.M.): Thank you for contacting HomeStyle. How can I help you?\nDavid Chen (2:16 P.M.): Hi. My sofa was supposed to be delivered this morning, but nobody came.\nAgent Maria (2:17 P.M.): I'm sorry about that. Hang on while I check your order. May I have your order number?\nDavid Chen (2:17 P.M.): It's 55821.\nAgent Maria (2:20 P.M.): Thank you. I see the problem. The truck broke down, so all of today's deliveries were moved to tomorrow morning.\nDavid Chen (2:21 P.M.): I work tomorrow morning. Is the afternoon possible?\nAgent Maria (2:23 P.M.): Let me ask the driver and get back to you within an hour.\nDavid Chen (2:23 P.M.): Sounds good. Please send me a text message.\n?Why did Mr. Chen contact the company?|A delivery did not arrive.|He wants to return a sofa.|He was charged too much.|He received the wrong item.\n?What caused the problem?|A truck stopped working.|The address was wrong.|The sofa was out of stock.|The driver was sick.\n?At 2:23 P.M., what does Mr. Chen mean when he writes, \"Sounds good\"?|He is willing to wait for an answer.|He likes the sofa.|He agrees to a morning delivery.|He wants to cancel the order.\n?How does Mr. Chen want to be contacted?|By text message|By email|By phone call|Through the website\n[P3]\nA:Hi, Sara. It's Ben. I'm running late for the team lunch. Have you all ordered yet?\nB:Not yet. We're still looking at the menu. How far away are you?\nA:I'm on my way, but I need about fifteen more minutes. Go ahead and order without me.\nB:Are you sure? We can wait.\nA:No, please start. Could you order the chicken sandwich for me?\nB:Sounds good. I'll let the waiter know you're coming.\n?Why is the man calling?|To say he will be late|To cancel a lunch|To ask for directions|To book a table\n?What does the man ask the woman to do?|Order food for him|Wait for him|Save him a seat outside|Pay the bill\n?What does the woman say she will do?|Tell the waiter|Call the man back|Change the reservation|Order dessert\n[P6]\nT:Hi Tom,\nJust a quick note about tomorrow. I have a dentist appointment at eight, so I will be about an hour late. Could you open the store for me? The keys are in the top drawer of my desk. __(1)__ The delivery from Green Farms usually arrives around nine, so please __(2)__ the boxes and put the milk in the refrigerator. If you cannot figure out the new cash register, the instructions are next to it. __(3)__ you have any problems, send me a text message. I will get back to you as soon as I can. Thanks for your __(4)__.\nAnna\n?(1)|Please remember to turn off the alarm when you go in.|The dentist's office is on Hill Street.|The store was painted last year.|I will be on vacation next month.\n?(2)|check|checks|checking|checked >> Sau \"please\" là động từ nguyên mẫu.\n?(3)|If|Although|Unless|Because >> Điều kiện: nếu có vấn đề gì.\n?(4)|help|helpful|helped|helpfully >> Sau \"your\" cần danh từ: help.\n[P2]\nAre you on your way to the office?|Yes, I'll be there in ten minutes.|It's on the way.|By the office.\nCan you get back to me by this afternoon?|Sure, I'll call you around three.|My back hurts.|I got it yesterday.\nI can't figure out how to use this printer.|Hang on. I'll show you.|It's a nice figure.|Yes, you can print.\nShall I go ahead and book the tickets?|Yes, please do.|They went ahead.|It's a good book.\n[P5]\nPlease let me 【know|known|knowing|to know】 if you need more time. >> \"Let + người + động từ nguyên mẫu\".\nI'm sorry, but I'm 【running|walking|going on|driving in】 late this morning. >> Cụm cố định: be running late.\nWe were 【stuck|stick|sticking|sticky】 in traffic for almost an hour. >> \"Be stuck in traffic\": bị kẹt xe.\nI will 【get back to|get back|return to back|answer to】 you as soon as I have the information. >> \"Get back to + người\": trả lời lại sau.\nThe technician could not 【figure out|figure|find out of|think out】 why the machine had stopped. >> \"Figure out\": tìm ra nguyên nhân.\nThanks for the 【heads-up|head-on|headline|heading up】 about the schedule change. >> \"A heads-up\": lời báo trước.\n\n##C11|Part 3 và Part 4 có bảng biểu|Câu hỏi \"Look at the graphic\"\n>Mỗi đề có năm câu hỏi kèm một bảng, lịch, sơ đồ hoặc phiếu. Đáp án không bao giờ được nói thẳng: bạn phải ghép một chi tiết nghe được với thông tin in trong bảng.\n[V]Bảng và biểu đồ\nchart|biểu đồ|The ＊ on page three shows our sales for each month.\ngraph|đồ thị|The line on the ＊ goes up sharply after June.\ndirectory|bảng chỉ dẫn, danh bạ|Check the building ＊ in the lobby to find the right office.\nfloor plan|sơ đồ mặt bằng|The ＊ shows where each desk and meeting room is.\nrow|hàng (ngang)|Our seats are in the third ＊ from the front.\ncolumn|cột (dọc)|Write your name in the first ＊ of the table and your phone number in the second.\ntotal|tổng cộng|The ＊ at the bottom of the bill is 85 dollars.\npercentage|tỉ lệ d like to order some flyers for our store's opening event.\nB:Sure. How many do you need?\nA:I was thinking of two hundred and fifty, but my manager says that's not enough. Let's double that.\nB:No problem. They'll be ready on Thursday. Would you like us to deliver them?\nA:No, thanks. I'll pick them up myself. Our store is just around the corner.\n?Why does the woman need flyers?|For a store opening|For a holiday sale|For a concert|For a job fair\n?Look at the graphic. How much will the woman pay?|70 dollars|40 dollars|20 dollars|120 dollars >> Cô ấy gấp đôi 250 thành 500 bản, giá 70 đô la.\n?How will the woman get the flyers?|She will pick them up.|They will be delivered.|They will be mailed.|Her manager will collect them.\n[P4]\n@table|Afternoon schedule|Time,Session,Room|1:00,Online marketing,A|2:00,Customer service,B|3:00,Team leadership,C|4:00,Closing speech,Main hall\nN:Welcome back, everyone. I hope you enjoyed lunch. I have one change to announce for this afternoon. The speaker for the two o'clock session has been delayed at the airport, so her session will switch times with the three o'clock session. The rooms will stay the same as printed. Also, please remember to return your name tags to the front desk after the closing speech.\n?What is the reason for the change?|A speaker has been delayed.|A room is not available.|Lunch finished late.|A session was canceled.\n?Look at the graphic. Which session will begin at 2:00?|Team leadership|Customer service|Online marketing|Closing speech >> Buổi 2 giờ đổi chỗ với buổi 3 giờ, nên lúc 2 giờ là Team leadership.\n?What are listeners asked to do at the end of the day?|Return their name tags|Fill out a survey|Collect a certificate|Meet the speaker\n--\n@table|Store directory|Floor,Department|1,Food and flowers|2,Clothing|3,Electronics|4,Furniture\nN:Attention, shoppers. Thank you for visiting Hanson's Department Store. Today only, all televisions and laptops are fifteen percent off. Just take the elevator next to the main entrance. And don't miss our free coffee tasting, which is taking place right now near the flower counter. The store will close at nine tonight.\n?What is on sale today?|Televisions and laptops|Clothing|Furniture|Coffee\n?Look at the graphic. Which floor should shoppers visit for the sale?|The third floor|The first floor|The second floor|The fourth floor >> Ti vi và máy tính xách tay thuộc gian Electronics ở tầng 3.\n?What time will the store close?|At nine|At eight|At ten|At seven\n[P2]\nAccording to the chart, which month had the highest sales?|It looks like December.|On page five.|Yes, it's very high.\nWhere can I find Dr. Kim's office?|Check the directory in the lobby.|She's a doctor.|At two o'clock.\nWhat's the total for these items?|Forty-two dollars and fifty cents.|There are five items.|In the first column.\nCould you explain this figure to me?|Sure. It's the cost per person.|It figures.|On the label.\n[P5]\n【According to|According|Accordingly|Accordance with】 the floor plan, the meeting room is next to the kitchen. >> \"According to + danh từ\": theo.\nThe 【total|totally|totaled of|totaling to】 cost of the trip was lower than expected. >> Trước danh từ \"cost\" cần tính từ: total.\nPlease 【refer|defer|prefer|infer】 to the attached chart for details. >> \"Refer to\": xem, tham khảo.\nA high 【percentage|percent of|percentile|percents】 of customers pay by card. >> \"A high percentage of\": tỉ lệ cao.\nThe sales 【figures|figured|figuring|figurative】 for last quarter will be announced tomorrow. >> Danh từ ghép: sales figures (số liệu doanh số).\nEach box has a 【label|level|labor|ladle】 showing the date it was packed. >> Hợp nghĩa: nhãn ghi ngày đóng gói.\n##C12|Part 3: hội thoại ba người|Phân biệt người nói và câu hỏi \"the men\", \"the women\"\n>Hai hoặc ba đoạn Part 3 trong mỗi đề có ba người nói. Câu hỏi sẽ ghi \"the men\" hoặc \"the women\", và nhịp đối đáp nhanh hơn. Bài này tập cho tai bạn quen với điều đó.\n[V]Làm việc nhóm\nbrainstorm|cùng nhau nghĩ ý tưởng|Let's meet tomorrow to ＊ ideas for the new advertisement.\nfeedback|ý kiến nhận xét|The teacher gave me useful ＊ on my essay.\nproposal|bản đề xuất|We sent the customer a ＊ with our prices and schedule.\ndraft|bản nháp|This is only the first ＊ of the report; I will improve it later.\nfinalize|chốt, hoàn tất|We need to ＊ the guest list by Friday.\ninput|ý kiến đóng góp|I would like your ＊ before I make a decision.\nvolunteer|tình nguyện, xung phong|Would anyone like to ＊ to take notes during the meeting?\ntake over|tiếp quản, làm thay|Ms. Han will ＊ the project when Mr. Lee retires.\nfill in for|làm thay (ai đó tạm vắng)|Can you ＊ me on Friday? I have a doctor's appointment.\nrun out of|hết, cạn|We have ＊ paper, so I cannot print the report.\ncome up with|nghĩ ra|We need to ＊ a better name for the product.\nlook into|tìm hiểu, xem xét|I will ＊ the problem and call you back.\n[N]\nTrước mỗi đoạn, băng sẽ nói \"Questions 41 through 43 refer to the following conversation with three speakers\". Nghe thấy cụm \"three speakers\" là biết ngay.\nTrong hội thoại ba người thường có hai người cùng giới. Câu hỏi sẽ viết \"What do the men agree to do?\" hoặc \"What does the woman ask the men?\". Những người cùng giới thường gọi tên nhau, nên hãy nghe tên để biết ai đang nói với ai.\nNội dung không khó hơn hội thoại hai người, nhưng mỗi lượt lời ngắn hơn và đổi người nhanh hơn. Vẫn giữ nguyên tắc cũ: câu 1 ở đầu đoạn, câu 2 ở giữa, câu 3 ở cuối. Trong trang này, giọng thứ ba là giọng trung tính của máy; trong đề thật đó là một người thật.\n[P3]\nA:Thanks for coming, both of you. We need to finalize the plan for the product launch. Tom, how is the draft of the brochure?\nB:It's almost done. I'm just waiting for feedback from the design team.\nC:I saw the draft yesterday, Tom. It looks great, but the price on page two is wrong.\nB:Really? Thanks, Dan. I'll correct it today.\nA:Good. Dan, could you look into the venue? We still haven't heard from the hotel.\nC:Sure. I'll call them right after this meeting.\n?What are the speakers preparing for?|A product launch|A staff party|A job fair|A training course\n?What problem does Dan mention?|A price is incorrect.|A page is missing.|The design is late.|The hotel is full.\n?What will Dan do after the meeting?|Call a hotel|Correct a brochure|Email the design team|Visit a venue\n--\nA:Hi, Karen. Hi, Lucy. Do either of you have a minute? I need someone to fill in for me at the front desk tomorrow morning.\nB:What time, Mike? I have a meeting with a customer at ten.\nA:Just from eight to nine thirty. I have to take my car to the repair shop.\nC:I can do it, Mike. I'm free until eleven.\nA:Thank you, Lucy. I'll leave the visitor list on the desk for you.\nB:And I can take over at nine thirty if you're running late.\n?What does the man ask the women to do?|Work at the front desk for him|Repair his car|Attend a meeting|Prepare a visitor list\n?Why is the man unavailable tomorrow morning?|He has to take his car for repairs.|He has a customer meeting.|He has a doctor's appointment.|He is on vacation.\n?What does Karen offer to do?|Take over later if needed|Drive the man to work|Cancel her meeting|Call the visitors\n--\nA:We've run out of ideas for the summer advertisement. Has anyone come up with something new?\nB:What about using photos from our customers? People trust real pictures more than models.\nC:I like that, Jane. We could ask customers to send in their photos and give a prize for the best one.\nA:That could work. But who would choose the winner?\nB:We could let people vote on our website.\nA:Good. Jane, can you write a short proposal? I'll show it to the director on Monday.\n?What are the speakers discussing?|An idea for an advertisement|A problem with a website|The winner of a prize|A customer complaint\n?What does Jane suggest?|Using customers' photos|Hiring models|Lowering prices|Printing a catalog\n?What does the man ask Jane to do?|Write a proposal|Talk to the director|Choose a winner|Take some photos\n[P7]\nT:From: Olivia Grant. To: Marketing team. Subject: Thursday's brainstorming session\nHi everyone, thank you for your input at Thursday's session. We came up with more than twenty ideas for the autumn campaign, and I have attached a list of the five that received the most votes.\nBefore we finalize our plan, I would like your feedback on these five. Please reply to this email by Tuesday with your first and second choices. Ben has volunteered to prepare a draft budget for the two most popular ideas, and Sara will look into possible venues for a launch event. We will meet again next Friday at 2 P.M. in room 6 to make a final decision.\nOlivia\n?What did the team do on Thursday?|They thought of ideas for a campaign.|They held a launch event.|They voted on a budget.|They visited some venues.\n?What are the team members asked to do by Tuesday?|Choose their two favorite ideas|Prepare a budget|Find a venue|Attend a meeting\n?Who will work on a budget?|Ben|Sara|Olivia|The whole team\n?What will happen next Friday?|A final decision will be made.|The campaign will begin.|The list will be sent out.|A new session will be held to find more ideas.\n[P2]\nCan anyone fill in for Maria tomorrow?|I can, if it's only the morning.|She filled it in.|Yes, it's full.\nWho's going to take over the project?|Mr. Ahn, starting next month.|It took a long time.|Over there.\nWe've run out of printer ink.|I'll order some right now.|He ran quickly.|It's out of the office.\nHave you had a chance to look into the problem?|Yes, it was a software error.|I looked at the picture.|In the office.\n[P5]\nThe team met to 【brainstorm|brainwash|braid|brand】 ideas for the new campaign. >> Hợp nghĩa: cùng nghĩ ý tưởng.\nWe would appreciate your 【feedback|feed|feeding|fed back】 on the first draft. >> Sau \"your\" cần danh từ: feedback.\nMr. Sato will 【take over|take off|take in|take up to】 the Tokyo office in April. >> \"Take over\": tiếp quản.\nWe need to 【come up with|come up|come with|come across to】 a solution by Friday. >> \"Come up with\": nghĩ ra.\nThe office has 【run out of|run out|run off|run over to】 envelopes. >> \"Run out of + danh từ\": hết.\nThe contract will be 【finalized|finally|finality|finals】 at tomorrow's meeting. >> Sau \"will be\" với nghĩa bị động cần V3.\n##C13|Part 7: bài báo|Câu hỏi suy luận\n>Bài báo dài hơn và ít từ quen hơn email. Bài này dạy cách đọc bài báo theo đoạn, và cách trả lời câu hỏi chứa \"suggested\", \"implied\", \"most likely\".\n[V]Tin địa phương\narticle|bài báo|I read an interesting ＊ about electric cars in today's newspaper.\nresident|cư dân|Every ＊ of the building received a letter about the repairs.\nlocal|thuộc địa phương|We buy our vegetables from ＊ farmers.\nmayor|thị trưởng|The ＊ of the city opened the new bridge yesterday.\ncouncil|hội đồng (thành phố)|The city ＊ voted to build a new library.\nconstruction|việc xây dựng|＊ of the new hospital will take three years.\ncommunity|cộng đồng|The whole ＊ helped to clean the park.\nspokesperson|người phát ngôn|A ＊ for the airline said the flights would start again tomorrow.\nupcoming|sắp tới|Tickets for the ＊ concert go on sale tomorrow.\nexpected|được dự kiến|The ＊ cost of the project is two million dollars.\npublic|công cộng, công chúng|The gardens are open to the ＊ every weekend.\nattract|thu hút|The new museum will ＊ thousands of tourists.\n[N]\nBài báo ở Part 7 có cấu trúc cố định. Đoạn một tóm tắt toàn bộ sự việc: ai, làm gì, ở đâu, khi nào. Các đoạn sau thêm chi tiết, số liệu, lời trích của một người trong cuộc. Đoạn cuối thường nói về tương lai hoặc một ý kiến trái chiều. Vì thế câu hỏi ý chính trả lời bằng đoạn một, còn câu hỏi cuối thường nằm ở đoạn cuối.\nCâu hỏi suy luận: \"What is suggested about the bridge?\", \"What is implied about Mr. Park?\", \"Who most likely is Ms. Lee?\". Đáp án không có nguyên văn trong bài, nhưng phải suy ra được từ đúng một hoặc hai câu trong bài. Ví dụ, bài viết \"the store will open its second location\" thì suy ra được là hiện đã có một cửa hàng.\nĐừng chọn điều \"có vẻ hợp lý ngoài đời\". Nếu không chỉ ra được câu nào trong bài chứng minh, lựa chọn đó sai.\n[P7]\nT:New bridge to open in June\nRiverton. The city council announced on Monday that the new Mill Street Bridge will open to the public on June 15, two months later than first planned. Construction was delayed by heavy rain in the spring.\nThe bridge, which cost 18 million dollars, has four lanes for cars and separate paths for bicycles and pedestrians. Mayor Susan Clark said the bridge would cut travel time between the east side and downtown by about fifteen minutes. \"For twenty years, residents of the east side have asked for this,\" she said.\nThe old bridge, built in 1952, will be closed to cars but will remain open to people on foot. A ceremony will be held at 10 A.M. on opening day, and local residents are invited to attend.\n?What is the article mainly about?|The opening of a new bridge|The closing of a road|A plan to build a bridge|Damage caused by rain\n?What is suggested about the bridge?|It was supposed to open in April.|It cost more than expected.|It is only for cars.|It replaces a bridge built twenty years ago.\n?What does Mayor Clark say about the bridge?|It will make trips downtown shorter.|It will attract tourists.|It will be free to use.|It was her idea.\n?What will happen to the old bridge?|People will still be able to walk across it.|It will be removed.|It will be used by buses only.|It will be repaired in June.\n--\nT:Local bakery wins national award\nGreenfield. Rose's Bakery on Park Avenue has been named one of the ten best small bakeries in the country by Food Life magazine. The owner, Rosa Martinez, opened the shop twelve years ago after working as a hotel chef.\n\"I never expected this,\" said Ms. Martinez. \"We are just a small family business.\" The bakery is known for its cinnamon bread, which often sells out before nine in the morning. Since the article was published last week, the number of customers has doubled, and Ms. Martinez has hired two more workers.\nShe says she has no plans to open a second shop. \"I want to stay small and keep the quality high,\" she explained. However, she will begin selling her bread online next month so that people outside Greenfield can try it.\n?What is the article about?|A bakery that received an award|A new magazine|A hotel restaurant|A cooking competition\n?What did Ms. Martinez do before opening the bakery?|She cooked at a hotel.|She wrote for a magazine.|She worked at another bakery.|She sold bread online.\n?What is implied about the cinnamon bread?|It is very popular.|It is the cheapest item.|It is only sold online.|It is a new product.\n?What will Ms. Martinez do next month?|Start selling online|Open a second shop|Hire two workers|Move to a bigger building\n--\nT:City library to extend opening hours\nLakeview. Starting September 1, the Lakeview Public Library will stay open until 9 P.M. on weekdays, three hours later than at present. The change follows a survey of 1,200 residents, in which more than seventy percent said they could not visit the library during working hours.\nA spokesperson for the library said the longer hours were made possible by a gift of 200,000 dollars from a local business owner, who asked not to be named. The money will also be used to buy fifty new computers.\nThe library expects the change to attract more young people. It will also begin offering free evening classes in computer skills and English. Residents can sign up for the upcoming classes at the front desk or on the library's website.\n?What change will the library make?|It will close later on weekdays.|It will open on Sundays.|It will move to a new building.|It will charge a fee.\n?Why is the library making the change?|Many residents cannot come during the day.|It received too many visitors.|The city council ordered it.|A new manager was hired.\n?What is suggested about the person who gave the money?|The person does not want to be known.|The person works at the library.|The person is the mayor.|The person took part in the survey.\n?What will the library offer in the evenings?|Free classes|Free computers to take home|A café|Movie nights\n[P6]\nT:Notice to residents of Maple Street\nThe city will begin construction work on Maple Street on Monday, May 12. The work is __(1)__ to take about three weeks. During this period, the street will be closed to cars between 8 A.M. and 5 P.M. __(2)__ Residents can park on Oak Street, where parking will be free until the work is finished. We apologize for the inconvenience and thank the __(3)__ for its patience. __(4)__ you have any questions, please call the city office.\n?(1)|expected|expecting|expect|expectation >> \"Be expected to\": được dự kiến sẽ.\n?(2)|Buses will follow a different route during these hours.|The mayor was elected last year.|The library closes at six.|Tickets are sold at the door.\n?(3)|community|construction|council|spokesperson >> Cảm ơn \"cộng đồng\" (cư dân) vì đã kiên nhẫn.\n?(4)|If|Although|Unless|Because >> Điều kiện: nếu có câu hỏi.\n[P2]\nDid you read the article about the new hospital?|Yes, it's going to be huge.|In the newspaper.|I'm reading a book.\nWhen will the construction be finished?|It's expected to take a year.|Next to the park.|By a local company.\nWho's speaking at the upcoming council meeting?|The mayor, I believe.|At the city hall.|It's coming up.\nIs the pool open to the public?|Yes, every day except Monday.|It's very large.|In the community center.\n[P5]\nThe new shopping center is 【expected|expecting|expectation|expects】 to open next spring. >> \"Be expected to\": được dự kiến.\nThe festival 【attracts|attractive|attraction|attractively】 thousands of visitors every year. >> Câu cần động từ chính, chủ ngữ số ít.\nAll 【residents|resides|residential|residing in】 are invited to the community meeting. >> Sau \"All\" cần danh từ chỉ người, số nhiều.\nThe museum is open to the 【public|publicity|publicly|publish】 from Tuesday to Sunday. >> Cụm cố định: open to the public.\nTickets for the 【upcoming|oncoming|outgoing|incoming】 concert are almost sold out. >> \"Upcoming event\": sự kiện sắp tới.\nA 【spokesperson|spoken|speaking|spokes】 for the company refused to comment. >> Sau \"A\", làm chủ ngữ: danh từ chỉ người.\n##C14|Part 7: thư tín|Câu hỏi chèn câu vào vị trí [1], [2], [3], [4]\n>Mỗi đề có hai câu hỏi yêu cầu đặt một câu cho sẵn vào đúng chỗ trong bài. Bạn sẽ học cách dùng đại từ và từ nối trong câu đó làm manh mối.\n[V]Ngôn ngữ thư trang trọng\non behalf of|thay mặt cho|＊ the whole team, I would like to thank you for your help.\ndelighted|rất vui mừng|We are ＊ to tell you that you have won first prize.\nregret|lấy làm tiếc|We ＊ to tell you that the flight has been canceled.\ninform|thông báo cho|We will ＊ you by email when your order is ready.\nlook forward to|mong chờ|I ＊ meeting you next week.\nfurther|thêm, hơn nữa|If you need ＊ information, please call our office.\nassist|hỗ trợ, giúp đỡ|Our staff will ＊ you with your bags.\nassistance|sự hỗ trợ|If you need ＊, please press the red button.\nkindly|vui lòng (trang trọng)|＊ fill out the form and return it to us by Friday.\ngrateful|biết ơn|I am very ＊ for all your help.\ncordially|trân trọng (dùng khi mời)|You are ＊ invited to our opening ceremony on May 5.\nin response to|để đáp lại, để trả lời|I am writing ＊ your letter of June 2.\n[N]\nCâu hỏi chèn câu có dạng: \"In which of the positions marked [1], [2], [3], and [4] does the following sentence best belong?\" kèm một câu trong ngoặc kép. Trong bài có bốn vị trí được đánh dấu.\nCách làm: đọc kỹ câu cần chèn và tìm từ móc nối. Đại từ (it, they, this, these, such) phải chỉ về một danh từ ở câu ngay trước vị trí chèn. Từ nối (However, Therefore, In addition, For example) cho biết câu trước nói gì: trước \"However\" phải là một ý ngược lại, trước \"For example\" phải là một ý khái quát. Từ chỉ thứ tự (also, then, finally) cho biết câu đứng sau một ý cùng loại.\nSau khi chọn, hãy đọc lại câu trước, câu chèn và câu sau liền một mạch. Nếu câu sau cũng dùng đại từ chỉ về câu chèn thì bạn đã chọn đúng.\n[P7]\nT:Letter from Northern Airlines\nDear Mr. Evans, I am writing in response to your letter of March 3 regarding your lost suitcase. [1] On behalf of Northern Airlines, I would like to apologize for the trouble this has caused you.\nI am delighted to inform you that your suitcase was found yesterday at the airport in Madrid. [2] It will be delivered to your home address within three days, free of charge. [3]\nIn addition, we would like to offer you a voucher for 100 dollars, which you can use on any Northern Airlines flight in the next twelve months. [4] If you need further assistance, please do not hesitate to contact me directly.\nSincerely, Maria Lopez, Customer Relations\n?Why did Ms. Lopez write the letter?|To reply to a complaint|To advertise a flight|To ask for a payment|To confirm a booking\n?What is indicated about the suitcase?|It was located in Madrid.|It was damaged.|It is still missing.|It was sent to the wrong home.\n?What does the airline offer Mr. Evans?|A voucher for future travel|A free flight to Madrid|A new suitcase|A full refund of his ticket\n?In which of the positions marked [1], [2], [3], and [4] does the following sentence best belong? \"A driver will call you before he arrives.\"|[3]|[1]|[2]|[4] >> Câu này nói về việc giao hàng, nên đứng ngay sau câu \"It will be delivered to your home address\".\n--\nT:Invitation from the Riverside Business Association\nDear Ms. Tanaka, You are cordially invited to the annual dinner of the Riverside Business Association, which will be held on Saturday, November 8, at the Grand Park Hotel. [1]\nThis year we are delighted to welcome Mr. David Chen, the founder of Chen Electronics, as our guest speaker. [2] He will talk about how small companies can sell their products abroad. After the dinner, awards will be presented to three local businesses. [3]\nThe cost is 60 dollars per person, which includes dinner and drinks. [4] Kindly reply by October 25 so that we can inform the hotel of the number of guests. We look forward to seeing you there.\nSincerely, Paul Rivera, Chairperson\n?What is the purpose of the letter?|To invite someone to an event|To thank a speaker|To announce an award winner|To ask for a donation\n?Who is Mr. Chen?|The person who started a company|The manager of the hotel|The chairperson of the association|An award winner\n?What is included in the price?|Dinner and drinks|A hotel room|Parking|A gift\n?In which of the positions marked [1], [2], [3], and [4] does the following sentence best belong? \"The evening will begin at 7 P.M. with drinks in the lobby.\"|[1]|[2]|[3]|[4] >> Câu nêu giờ bắt đầu, nên đi ngay sau câu giới thiệu ngày và địa điểm của bữa tiệc.\n--\nT:Letter to a job applicant\nDear Mr. Novak, Thank you for your interest in the position of accountant at Harper and Lee. [1] We received more than eighty applications, and the quality of the candidates was very high.\nWe regret to inform you that we have decided to offer the position to another candidate. [2] However, we were impressed by your experience and would like to keep your resume in our files. [3] We expect to open a similar position in our Boston office early next year.\nIf you would be interested, kindly let us know, and we will contact you when it becomes available. [4] We are grateful for the time you spent on your application and wish you success in your career.\nSincerely, Janet Moore, Personnel Manager\n?What is the main purpose of the letter?|To tell an applicant he was not chosen|To offer a job|To request an interview|To ask for a resume\n?What is suggested about the position?|Many people applied for it.|It is in the Boston office.|It was canceled.|It requires no experience.\n?What does Ms. Moore offer to do?|Contact Mr. Novak about a future opening|Arrange a second interview|Send his resume to other companies|Return his application\n?In which of the positions marked [1], [2], [3], and [4] does the following sentence best belong? \"This was a very difficult decision for us.\"|[2]|[1]|[3]|[4] >> \"This\" chỉ về quyết định trao vị trí cho ứng viên khác ở câu ngay trước.\n[P6]\nT:Dear Ms. Park,\nOn behalf of everyone at Sunrise Travel, I would like to thank you for speaking at our staff training day last week. Your talk on customer service was both useful and entertaining. __(1)__ Several employees have already told me that they are using your ideas with their customers. We would be __(2)__ if you could visit us again next year. I have enclosed a small gift to show our thanks. If I can ever be of __(3)__ to you, please do not hesitate to ask. I look forward to __(4)__ from you.\nSincerely, Daniel Kim\n?(1)|We received very positive feedback from our staff.|The training room is on the second floor.|Our office is closed on Sundays.|The gift shop sells postcards.\n?(2)|delighted|delight|delighting|delightfully >> Sau \"would be\" cần tính từ chỉ cảm xúc của người: delighted.\n?(3)|assistance|assist|assisted|assistant to >> \"Be of assistance\": giúp ích (cụm cố định với danh từ).\n?(4)|hearing|hear|heard|be heard >> \"Look forward to\" + V-ing.\n[P2]\nDid you inform the customers about the delay?|Yes, I emailed them this morning.|It was delayed.|In the form.\nDo you need any further assistance?|No, thank you. That's everything.|It's much further.|My assistant did.\nAre you looking forward to the conference?|Very much. The speakers are excellent.|I looked for it.|It's forward.\nWho's writing the letter on behalf of the company?|The director's assistant.|By next week.|It's half finished.\n[P5]\nWe 【regret|regretful|regrettable|regretting】 to inform you that the event has been canceled. >> Câu cần động từ chính: We regret to inform you…\nI am writing 【on behalf of|in behalf|on behalf|behalf of】 our president, who is abroad this week. >> Cụm đầy đủ: on behalf of.\nWe would be 【grateful|gratitude|gratefully|grate】 if you could reply by Friday. >> Sau \"would be\" cần tính từ: grateful.\nPlease contact us if you need 【further|farther than|furthest of|far】 information. >> \"Further information\": thông tin thêm.\nOur staff will be happy to 【assist|assistance|assistant|assisting】 you during your stay. >> Sau \"to\" cần động từ nguyên mẫu.\nI look forward to 【meeting|meet|met|have met】 you at the conference. >> \"Look forward to\" + V-ing.\n##C15|Part 4: chỉ dẫn, tham quan và ý người nói|Câu hỏi \"Why does the speaker say…?\"\n>Bài này luyện ba loại bài nói còn lại: lời hướng dẫn viên, trích đoạn cuộc họp và bản tin thời tiết kèm bảng, cùng câu hỏi về ngụ ý của người nói ở Part 4.\n[V]Trong toà nhà và khi tham quan\ntour|chuyến tham quan|The factory ＊ takes about forty minutes.\nguide|hướng dẫn viên|Our ＊ told us the history of the castle.\nexhibit|khu trưng bày, hiện vật trưng bày|The dinosaur ＊ is the most popular part of the museum.\nsouvenir|quà lưu niệm|I bought a small ＊ for my mother at the airport.\nentrance|lối vào|Meet me at the main ＊ of the building at nine.\nexit|lối ra|In case of fire, use the nearest ＊.\nstairs|cầu thang|The elevator is broken, so we have to take the ＊.\nlobby|sảnh|Please wait for me in the hotel ＊ near the front desk.\ncafeteria|nhà ăn|Most employees have lunch in the company ＊.\nrestroom|nhà vệ sinh|The ＊ is at the end of the hall, on the left.\ngift shop|cửa hàng quà tặng|You can buy postcards in the museum ＊.\nstraight ahead|thẳng phía trước|Go ＊ for two blocks, and you will see the bank.\n[N]\nLời hướng dẫn viên mở đầu một chuyến tham quan thường theo thứ tự: chào và tự giới thiệu, thời lượng, lộ trình (xem gì trước, gì sau), quy định (chụp ảnh, ăn uống, đi theo đoàn), và việc sau khi kết thúc. Ba câu hỏi bám đúng ba trong số các mục đó.\nTrích đoạn cuộc họp là loại bài nói dễ có câu hỏi ngụ ý nhất: \"What does the speaker imply when he says, '…'?\". Giống như ở Part 3, hãy nghe câu ngay trước và ngay sau câu được trích. Người nói thường nêu một sự thật để ngầm đề nghị hoặc giải thích: \"The opening is at nine on Saturday\" có thể ngụ ý \"chúng ta phải xong trước lúc đó\".\nBản tin thời tiết và giao thông hay đi kèm bảng. Người nói sẽ không đọc tên ngày mà mô tả nó: \"the rainy day\", \"the first day\", \"the warmest day\".\n[P4]\nN:Good morning, and welcome to the Harbor Museum. My name is Elena, and I'll be your guide today. Our tour will last about one hour. We'll begin on the second floor with the ship models, and then come back down to see the new exhibit on ocean animals. Photography is allowed, but please do not use a flash. At the end of the tour, you'll have time to visit the gift shop, which is next to the main entrance. Now, please follow me to the stairs.\n?Who most likely is the speaker?|A tour guide|A ship captain|A shop clerk|A photographer\n?What does the speaker say about photography?|A flash should not be used.|It is not allowed.|It is allowed only in the gift shop.|It costs extra.\n?Where will the group go first?|To the second floor|To the gift shop|To the ocean exhibit|To the cafeteria\n--\nN:Thanks for coming, everyone. I'll keep this short. As you know, our new store opens on Saturday, and we still have a lot to do. The shelves arrived this morning, but the signs won't be delivered until Thursday. That only gives us one day to put them up. I know many of you had planned to leave early on Friday. Well, the opening is at nine A.M. on Saturday. So I'm asking for volunteers to stay late on Friday evening. Dinner will be provided, and you'll receive overtime pay.\n?What will happen on Saturday?|A store will open.|Some signs will be delivered.|A training session will be held.|A sale will end.\n?What does the speaker imply when he says, \"the opening is at nine A.M. on Saturday\"?|The work must be finished on Friday.|Staff may arrive late on Saturday.|The opening has been postponed.|He dislikes the opening time.\n?What will volunteers receive?|Dinner and extra pay|A day off|A gift card|Free signs\n--\n@table|Weekend weather|Day,Weather,High|Friday,Sunny,24|Saturday,Rain,18|Sunday,Cloudy,20|Monday,Sunny,25\nN:And now for the weekend weather. If you're planning to go to the City Food Festival, I have some advice for you. The festival runs from Friday to Sunday in Central Park, and there's no roof over most of the tables. You'll want to avoid the rainy day. The best choice is the first day, when it will be warm and sunny. Next up, the traffic report.\n?What event does the speaker mention?|A food festival|A concert|A sports game|A parade\n?Look at the graphic. Which day does the speaker recommend for the event?|Friday|Saturday|Sunday|Monday >> Người nói khuyên chọn ngày đầu tiên của lễ hội, trời ấm và nắng: thứ Sáu.\n?What will listeners hear next?|A traffic report|The news|Some music|An interview\n[P3]\nA:Excuse me, I'm here for a meeting with Mr. Baker in the marketing department.\nB:Welcome. Marketing is on the fourth floor. Take the elevator at the end of the lobby, and when you get out, go straight ahead. His office is the second door on the right.\nA:Thank you. Is there a restroom on that floor?\nB:Yes, next to the stairs. Oh, and you'll need a visitor badge. Could you sign in here, please?\nA:Of course.\n?Why is the woman visiting the building?|To attend a meeting|To have a job interview|To deliver a package|To repair an elevator\n?Where is Mr. Baker's office?|On the fourth floor|In the lobby|Next to the stairs|On the second floor\n?What does the man ask the woman to do?|Sign in|Wait in the lobby|Take the stairs|Show her passport\n[P2]\nWhere's the nearest restroom?|Straight ahead, next to the stairs.|Take a rest.|It's the nearest one.\nHow long does the tour last?|About ninety minutes.|At the main entrance.|With a guide.\nIs the cafeteria open to visitors?|Yes, until two o'clock.|I had coffee.|On the tour.\nWhich exit should I use for the parking lot?|The one behind the gift shop.|It exists.|I parked there.\n[P5]\nThe museum's newest 【exhibit|exhibited|exhibiting|exhibitor of】 opens to the public on Friday. >> Sau tính từ \"newest\", làm chủ ngữ: danh từ exhibit.\nVisitors must use the main 【entrance|enter|entering|entered】 on King Street. >> Sau tính từ \"main\" cần danh từ.\nGo 【straight|straightly|straighten|straightness】 ahead until you reach the lobby. >> \"Go straight ahead\": đi thẳng. \"Straight\" vừa là tính từ vừa là trạng từ.\nThe 【guided|guide|guiding to|guidance】 tour of the factory begins at ten. >> Cụm cố định: a guided tour (chuyến tham quan có hướng dẫn).\nPostcards and other 【souvenirs|souvenir|a souvenir|souvenired】 are sold in the gift shop. >> Sau \"other\" cần danh từ số nhiều.\nThe cafeteria is located 【next to|next|near to of|beside of】 the main lobby. >> Cụm đúng: next to.\n\n##C16|Part 6 nâng cao|Chọn thì theo ngữ cảnh và đại từ chỉ ngược\n>Hai dạng dễ sai nhất ở Part 6 đều đòi hỏi đọc quá phạm vi một câu: thì của động từ phụ thuộc vào cả bức thư, còn đại từ phải khớp với danh từ ở câu trước.\n[V]Đánh giá và khen thưởng\nproductivity|năng suất|The new machines increased the factory's ＊ by twenty percent.\nevaluate|đánh giá|Managers ＊ each employee's work once a year.\nevaluation|sự đánh giá, bản đánh giá|My yearly ＊ was very positive, so I received a raise.\nraise|khoản tăng lương|After two years at the company, she asked for a ＊.\nbonus|tiền thưởng|Every worker received a ＊ of 500 dollars at the end of the year.\nrecognize|ghi nhận, công nhận|The company wants to ＊ staff who have worked here for twenty years.\naward|giải thưởng|She won an ＊ for the best sales results of the year.\noutstanding|xuất sắc|He received a prize for his ＊ work on the project.\ndedicated|tận tâm|She is a ＊ teacher who often stays late to help her students.\ncontribution|sự đóng góp|Thank you for your ＊ to the success of the event.\nachievement|thành tựu|Finishing the bridge in one year was a great ＊.\nnominate|đề cử|You can ＊ a colleague for the Employee of the Year prize.\n[N]\nChọn thì ở Part 6: trong câu chứa chỗ trống thường không có dấu hiệu thời gian. Hãy nhìn ngày ghi ở đầu thư, và các câu xung quanh. Thư thông báo một sự kiện sắp diễn ra thì dùng tương lai (will be held). Thư cảm ơn sau một sự kiện thì dùng quá khứ. Thư tổng kết thành tích \"over the past year\" thì dùng hiện tại hoàn thành.\nĐại từ và từ chỉ định: he, she, it, they, this, these, his, their phải khớp về số ít, số nhiều và về người, vật với danh từ ở câu trước. Khi chỗ trống là đại từ, hãy tìm xem nó thay cho danh từ nào.\nVới câu chèn, đại từ còn là manh mối theo chiều ngược lại: nếu câu sau chỗ trống mở bằng \"He also…\" hoặc \"It should…\" thì câu chèn phải nhắc đến người hoặc vật đó.\n[P6]\nT:To: All staff. Subject: Employee of the Year\nI am pleased to announce that this year's Employee of the Year award goes to Mr. Kevin Brooks of the delivery department. Over the past twelve months, Kevin __(1)__ more than 4,000 packages without a single complaint. __(2)__ He also trained three new drivers in his free time. Kevin will receive __(3)__ award at the annual dinner on December 12, together with a bonus of 1,000 dollars. Please join me in thanking him for his outstanding __(4)__.\n?(1)|has delivered|delivers|will deliver|was delivered >> \"Over the past twelve months\" tính đến nay: hiện tại hoàn thành, chủ động.\n?(2)|This is the best record in the history of our company.|The annual dinner was held last week.|Packages must be signed for.|Our delivery trucks are blue.\n?(3)|his|him|he|himself >> Trước danh từ \"award\" cần tính từ sở hữu.\n?(4)|contribution|contribute|contributed|contributing >> Sau tính từ \"outstanding\" cần danh từ.\n--\nT:To: All employees. Subject: Annual performance evaluations\nAnnual evaluations will take place from March 3 to March 14. Each employee __(1)__ with his or her manager for about thirty minutes. Before the meeting, please complete the self-evaluation form, __(2)__ is available on the company website. __(3)__ Managers will use the results to decide on raises and promotions for the coming year. If you are not able to attend at the scheduled time, please inform your manager at least two days __(4)__.\n?(1)|will meet|met|has met|meeting >> Cả thư nói về việc sắp diễn ra trong tháng Ba: tương lai.\n?(2)|which|who|whose|where >> Thay cho \"the form\" (vật) và làm chủ ngữ của \"is\": which.\n?(3)|It should be submitted to your manager one day before your meeting.|They were hired last spring.|She is the manager of the sales team.|The website was closed for repairs.\n?(4)|in advance|ahead of|before of|advanced >> Cụm cố định đứng cuối câu: in advance.\n--\nT:Dear Ms. Alvarez,\nCongratulations! You have been nominated for the Outstanding Service Award by three of your customers. In their letters, __(1)__ described how you stayed after closing time to help them. __(2)__ The winner will be announced at a ceremony on June 20. All nominated employees, including you, __(3)__ invited to attend with one guest. Whether or not you win, we want you to know that your dedication is __(4)__ appreciated.\nSincerely, Mark Hanson, Regional Manager\n?(1)|they|them|their|theirs >> Chủ ngữ của \"described\", thay cho \"three of your customers\".\n?(2)|We are proud to have employees like you.|The store closes at nine o'clock.|Customers must show a receipt.|The award was canceled last year.\n?(3)|are|is|was|be >> Chủ ngữ thật là \"All nominated employees\" (số nhiều); cụm \"including you\" không tính.\n?(4)|greatly|great|greater|greatness >> Giữa \"is\" và V3 \"appreciated\": trạng từ.\n[P7]\nT:MEMO. To: All employees. From: Personnel office. Subject: Productivity bonus program\nBeginning in January, the company will introduce a new bonus program. Each team's productivity will be evaluated every three months. Teams that reach their goals will receive a bonus equal to five percent of their salary for that period. The goals for each team will be set by department managers and announced on December 15.\nThe program replaces the old system, under which only individual employees with outstanding results received a bonus. We believe the new program will recognize the contribution of every team member. Details will be explained at a meeting on December 10 at 3 P.M. in the cafeteria. Attendance is mandatory.\n?What is being announced?|A new way of giving bonuses|A change in salaries|A new department manager|A training program\n?How often will teams be evaluated?|Every three months|Every month|Once a year|Every five weeks\n?What is indicated about the old system?|It rewarded only individuals.|It gave everyone five percent.|It began last January.|It was popular with teams.\n?What are employees required to do?|Attend a meeting on December 10|Set goals for their team|Submit a form by December 15|Nominate a colleague\n[P2]\nWho won the Employee of the Year award?|Kevin from the delivery department.|At the annual dinner.|It was a great year.\nWhen will we get our performance evaluations?|Sometime in March.|From my manager.|It performed well.\nDid you get the raise you asked for?|Yes, it starts next month.|It rose quickly.|I asked yesterday.\nHow can we improve productivity?|Better equipment would help.|It's a good product.|About ten percent.\n[P5]\nMs. Chen received an award for her 【outstanding|outstand|outstandingly|outstood】 sales results. >> Trước cụm danh từ \"sales results\" cần tính từ.\nEmployees are 【evaluated|evaluation|evaluate|evaluating】 by their managers once a year. >> Bị động: are + V3.\nThe director thanked the team for its 【contribution|contribute|contributor to|contributing】 to the project. >> Sau \"its\" cần danh từ; \"contribution to\".\nMr. Ali was 【nominated|dominated|eliminated|terminated】 for the Best Manager award. >> \"Be nominated for\": được đề cử cho.\nThe new software has greatly improved 【productivity|productive|productively|produce】. >> Tân ngữ của \"improved\" cần danh từ.\nThe company wants to 【recognize|recognition|recognizable|recognizing】 employees who work hard. >> Sau \"wants to\" cần động từ nguyên mẫu.\n##C17|Part 7: câu hỏi từ đồng nghĩa|Một từ, nhiều nghĩa\n>Mỗi đề có một đến ba câu hỏi dạng \"The word 'cover' in paragraph 1, line 3, is closest in meaning to\". Từ được hỏi luôn là từ nhiều nghĩa, và đáp án đúng là nghĩa trong ngữ cảnh đó.\n[V]Động từ nhiều nghĩa trong văn bản công việc\noperate|vận hành, hoạt động|The company will ＊ three new stores next year.\ncover|bao gồm; chi trả|The price does not ＊ breakfast; that costs ten dollars more.\naddress|giải quyết, đề cập đến|The manager promised to ＊ the problem at the next meeting.\nissue|vấn đề|There is an ＊ with the printer; it keeps stopping.\nsecure|giành được, có được|The team worked hard to ＊ the contract with the hospital.\nconduct|tiến hành|We will ＊ a survey of 500 customers next month.\nextend|kéo dài, gia hạn|The store will ＊ its opening hours until ten in December.\nresolve|giải quyết dứt điểm|The technician was able to ＊ the error in a few minutes.\nobtain|lấy được, xin được|You must ＊ a visa before you travel.\nmaintain|duy trì|It is hard to ＊ low prices when costs are rising.\nensure|bảo đảm|Please check the address to ＊ that the package arrives.\nindicate|cho thấy, chỉ ra|The results ＊ that customers like the new design.\n[N]\nCâu hỏi từ đồng nghĩa không hỏi nghĩa phổ biến nhất của từ. \"Cover\" có thể là che phủ, bao gồm, chi trả, đưa tin; \"address\" có thể là địa chỉ, giải quyết, phát biểu với; \"run\" có thể là chạy, điều hành, kéo dài. Bốn lựa chọn thường đều là nghĩa có thật của từ đó, chỉ một cái hợp với câu trong bài.\nCách làm: quay lại đúng dòng được nêu, thay lần lượt từng lựa chọn vào câu và đọc lại. Lựa chọn nào giữ nguyên được nghĩa của câu là đáp án.\nCùng lúc, hãy luyện thói quen diễn đạt lại: đáp án của mọi câu hỏi Part 7 đều là cách nói khác của một câu trong bài. \"At no cost\" thành \"free\", \"obtain\" thành \"get\", \"prior to\" thành \"before\".\n[P7]\nT:Notice to tenants of Garden Court\nThe building's owners will conduct a safety inspection of all apartments on May 6 and 7. The inspection will cover smoke alarms, windows and heating equipment, and should take about fifteen minutes per apartment.\nTo ensure that the inspectors can enter, please be at home or leave a key at the front desk. A schedule showing the time for each floor has been posted in the lobby. Any issues that are found will be resolved within two weeks at no cost to tenants. Thank you for your cooperation.\n?What is the purpose of the notice?|To announce an inspection|To announce a rent increase|To introduce new owners|To report a fire\n?The word \"cover\" in paragraph 1, line 2, is closest in meaning to|include|hide|pay for|protect >> Ở đây \"cover\" nghĩa là bao gồm các hạng mục kiểm tra.\n?What are tenants asked to do?|Stay home or leave a key|Buy a smoke alarm|Clean their windows|Sign a schedule\n?What is indicated about repairs?|Tenants will not pay for them.|They will take two days.|They must be requested in writing.|They were finished in May.\n--\nT:From: Julia Reed, Bright Electronics. To: Amit Shah. Subject: Your recent order\nDear Mr. Shah, thank you for your email. I would like to address the two points you raised. First, I apologize for the late delivery of your television. The delay was caused by an issue with our supplier, which has now been resolved.\nSecond, you asked about the warranty. To thank you for your patience, we will extend your warranty from one year to eighteen months at no charge. To obtain the extension, simply reply to this email with your order number, and we will send you a new warranty card within a week.\nSincerely, Julia Reed\n?Why did Ms. Reed write the email?|To respond to a customer's concerns|To advertise a television|To request a payment|To confirm an address\n?The word \"address\" in paragraph 1, line 1, is closest in meaning to|deal with|mail to|speak to|live at >> \"Address the points\": giải quyết, trả lời các điểm được nêu.\n?What caused the delay?|A problem with a supplier|Bad weather|A wrong address|A broken truck\n?What must Mr. Shah do to get a longer warranty?|Send his order number|Pay a small fee|Visit a store|Return the old card\n--\nT:Sunrise Airlines secures new route\nSunrise Airlines announced on Tuesday that it has secured permission to operate daily flights between Hanoi and Osaka, starting in October. The airline currently flies to eight cities in Asia.\nA spokesperson said the company would maintain its low fares on the new route, with one-way tickets starting at 120 dollars. Early figures indicate strong interest: more than 5,000 people signed up for information on the airline's website within two days of the announcement. Tickets will go on sale on July 1.\n?What is the article mainly about?|A new flight route|A change in ticket prices|A new airport|A problem with a website\n?The word \"secured\" in paragraph 1, line 1, is closest in meaning to|obtained|locked|protected|closed >> \"Secure permission\": giành được, xin được giấy phép.\n?What is suggested about Sunrise Airlines?|It already flies to several Asian cities.|It is a new company.|It will raise its fares.|It is based in Osaka.\n?What can customers do from July 1?|Buy tickets|Sign up for information|Fly to Osaka|Get a refund\n[P3]\nA:Hi, Daniel. I'm calling about the customer survey. Have you been able to conduct all the interviews?\nB:Not yet. We've done about sixty percent. There was an issue with the phone system last week.\nA:I see. The deadline is this Friday. Do you think you can finish in time?\nB:To be honest, no. Could you extend it until next Wednesday?\nA:I'll need to check with the director, but I'm sure it will be fine. Meanwhile, please send me the results you already have.\n?What are the speakers discussing?|A customer survey|A new phone system|A job interview|A sales contract\n?Why is the work behind schedule?|There was a problem with the phones.|The staff were on vacation.|The customers refused to answer.|The director changed the plan.\n?What does the woman ask the man to do?|Send the results collected so far|Call the director|Finish by Friday|Repair the phone system\n[P2]\nHas the issue with the invoice been resolved?|Yes, accounting fixed it yesterday.|It was issued in May.|By email.\nCan we extend the deadline by a few days?|I'll ask the customer.|It's a long time.|The line is dead.\nHow do I obtain a parking permit?|Fill out a form at the front desk.|In the garage.|It's permitted.\nWho's going to conduct the training?|An instructor from headquarters.|On the train.|For two days.\n[P5]\nThe company will 【conduct|conductor|conducting|conduction】 a survey of its customers next month. >> Sau \"will\" cần động từ nguyên mẫu.\nPlease double-check the address to 【ensure|assure of|insure for|sure】 that the package is delivered on time. >> \"Ensure that + mệnh đề\": bảo đảm rằng.\nThe store has decided to 【extend|extent|extensive|extension】 its opening hours during the holidays. >> Sau \"decided to\" cần động từ: extend.\nYou can 【obtain|contain|retain|maintain】 a visitor badge at the front desk. >> Hợp nghĩa: lấy, xin thẻ khách.\nEarly results 【indicate|indication|indicative|indicator】 that the new product is selling well. >> Câu cần động từ chính trước \"that\".\nThe technician quickly 【resolved|revolved|reserved|resigned】 the issue with the network. >> Hợp nghĩa: giải quyết dứt điểm sự cố.\n##C18|Part 3: dịch vụ và giá cả|Con số, phí và điều kiện trong hội thoại\n>Rất nhiều hội thoại Part 3 xoay quanh giá, phí phụ thu và điều kiện dịch vụ. Bài này luyện nghe con số trong ngữ cảnh và các câu hỏi về lời đề nghị.\n[V]Giá và phí\nquote|bảng báo giá|The painter gave us a ＊ of 900 dollars for the whole house.\nfee|lệ phí|There is a small ＊ of five dollars for late payment.\ncharge|tính tiền; khoản phí|The hotel does not ＊ for parking; it is free for guests.\nadditional|thêm, bổ sung|There is an ＊ cost of ten dollars for delivery.\nin total|tổng cộng|We spent 300 dollars ＊, including the flights.\nper|mỗi, cho mỗi|The room costs 80 dollars ＊ night.\ninclude|bao gồm|Does the price ＊ breakfast, or do we pay extra?\nexclude|không bao gồm, loại trừ|The prices on the menu ＊ tax, which is added to the bill.\nrate|mức giá, mức phí|The hotel offers a special ＊ for guests who stay a week.\ntip|tiền boa|We left the waiter a ＊ of five dollars.\nsplit|chia|Let's ＊ the bill; you pay half and I pay half.\nreasonable|hợp lý, phải chăng|Forty dollars for a hotel room is a very ＊ price.\n[N]\nKhi hội thoại có nhiều con số, câu hỏi hiếm khi hỏi con số đầu tiên. Thường có một mức giá gốc, rồi một thay đổi: giảm giá, phụ phí, hoặc khách đổi số lượng. Hãy ghi nhớ con số cuối cùng mà cả hai thống nhất.\nTừ khoá về giá: \"that comes to…\" (tổng là), \"an additional fee\" (phí thêm), \"at no extra charge\" (không tính thêm), \"per person\", \"it's included\". Câu hỏi có thể hỏi cái gì được bao gồm hoặc không được bao gồm.\nCâu hỏi về lời đề nghị của nhân viên: \"What does the man offer to do?\" thường có đáp án là giảm giá, giao miễn phí, giữ hàng, hoặc gửi báo giá. Nghe các cụm \"I can…\", \"We could…\", \"How about if I…\".\n[P3]\nA:Hello, I'd like a quote for cleaning the carpets in our office. We have six rooms.\nB:Our regular rate is forty dollars per room, so that would be two hundred and forty dollars in total.\nA:Does that include moving the furniture?\nB:No, there's an additional fee of thirty dollars for that. But if you book this week, we'll move the furniture at no extra charge.\nA:That sounds reasonable. Could you come on Saturday morning?\nB:Yes, we have an opening at nine.\n?What service is the woman asking about?|Carpet cleaning|Furniture delivery|Office painting|Window repair\n?How much will the woman pay if she books this week?|240 dollars|270 dollars|40 dollars|210 dollars\n?When will the work be done?|On Saturday morning|This afternoon|On Sunday|Next week\n--\nA:Welcome to City Car Rental. How can I help you?\nB:I'd like to rent a small car for three days, starting tomorrow.\nA:Our small cars are fifty dollars per day. That price includes insurance but excludes fuel.\nB:I see. Is there a charge if I return the car at the airport instead of here?\nA:Normally there's a twenty-dollar fee, but since you're a member, we won't charge you.\nB:Great. Here's my driver's license and membership card.\n?What does the man want to do?|Rent a car|Buy a car|Repair a car|Return a car\n?What is NOT included in the daily price?|Fuel|Insurance|Tax|The car\n?Why will the man not pay the airport fee?|He is a member.|He is renting for three days.|He paid in advance.|The airport is nearby.\n--\nA:That was a wonderful dinner. Shall we ask for the bill?\nB:I already did. Here it is. It comes to ninety dollars.\nA:Does that include the tip?\nB:No, service isn't included. Let's add ten dollars, so one hundred in total.\nA:Fine. Shall we split it?\nB:Actually, let me pay tonight. You paid for lunch last week.\nA:Are you sure? Then I'll get the coffee next time.\n?Where are the speakers?|At a restaurant|At a hotel|At a coffee shop|At a supermarket\n?How much will be paid in total?|100 dollars|90 dollars|80 dollars|50 dollars\n?What does the man offer to do?|Pay the whole bill|Split the bill|Buy coffee now|Leave a bigger tip\n[P4]\nN:Thank you for calling Blue Lake Hotel. For the month of November, we are offering a special weekend rate of ninety dollars per night for a double room. This rate includes breakfast for two and free use of our swimming pool. Please note that the rate excludes Saturday, November 15, when the hotel is fully booked for a conference. To make a reservation, press one. A deposit of thirty dollars is required and will be returned if you cancel at least two days in advance.\n?What is the speaker describing?|A special hotel rate|A conference schedule|A swimming class|A change of address\n?What is included in the rate?|Breakfast|Dinner|Parking|A conference ticket\n?What is said about the deposit?|It can be refunded if guests cancel early.|It is ninety dollars.|It is not required in November.|It must be paid in cash.\n[P2]\nDoes the price include delivery?|No, there's an additional charge.|It's a nice price.|By tomorrow.\nHow much is the registration fee?|Fifty dollars per person.|At the front desk.|It's free to register.\nShall we split the bill?|Sure, that's fair.|It's split in two.|The bill is here.\nCan you send me a quote by tomorrow?|I'll email it this afternoon.|He quoted a book.|Yes, I sent you.\n[P5]\nThe price of the tour 【includes|including|inclusion|inclusive of】 lunch and all tickets. >> Câu cần động từ chính, chủ ngữ số ít.\nThere is no 【additional|addition|additionally|add】 charge for delivery. >> Trước danh từ \"charge\" cần tính từ.\nTickets cost fifteen dollars 【per|for the|by|at】 person. >> \"Per person\": mỗi người.\nThe repair shop gave us a very 【reasonable|reason|reasonably|reasoning】 quote. >> Trước danh từ \"quote\" cần tính từ.\nMembers can use the pool free of 【charge|fee|rate|tip】. >> Cụm cố định: free of charge.\nThe special 【rate|rating|rated|rates of】 is available only on weekdays. >> Sau tính từ \"special\", chủ ngữ số ít của \"is\": rate.\n##C19|Part 7: lịch, biểu mẫu và trang web|Đọc bảng và ghi chú\n>Bạn luyện đọc văn bản có bảng: lịch khoá học, phiếu đăng ký, bảng giá. Câu hỏi khó nhất luôn nằm ở chỗ ghép thông tin trong bảng với dòng ghi chú bên dưới.\n[V]Khoá học và hội thảo\nworkshop|buổi hội thảo thực hành|I attended a one-day ＊ on public speaking.\nsession|buổi, phiên|The morning ＊ starts at nine and ends at noon.\nattendee|người tham dự|Each ＊ at the conference received a name tag.\nhandout|tài liệu phát tay|The speaker gave everyone a ＊ with the main points of her talk.\nrefreshments|đồ ăn nhẹ và đồ uống|Coffee and other ＊ will be served during the break.\nlecture|bài giảng|Professor Kim gave a ＊ on Asian history.\ncertificate|giấy chứng nhận|You will receive a ＊ when you complete the course.\nenroll|ghi danh, đăng ký học|I want to ＊ in the evening Spanish class.\ninstructor|giảng viên, người hướng dẫn|Our yoga ＊ has been teaching for ten years.\nbeginner|người mới bắt đầu|This class is for a ＊ who has never studied French.\nadvanced|nâng cao, trình độ cao|The ＊ course is only for students who already speak well.\ntuition|học phí|＊ for the course is 300 dollars, and books are extra.\n[N]\nVới văn bản có bảng, hãy đọc theo thứ tự: tiêu đề (đây là bảng gì), tên các cột, rồi phần ghi chú dưới bảng. Chưa cần đọc từng ô. Khi làm câu hỏi mới dò đến đúng hàng.\nPhần ghi chú là nơi chứa điều kiện và ngoại lệ: \"Fees do not include materials\", \"Classes with fewer than five students will be canceled\", \"Members receive ten percent off\". Câu hỏi \"What is indicated about…?\" và câu hỏi cần tính toán gần như luôn dùng đến ghi chú.\nCâu hỏi tính toán: ví dụ \"How much will a member pay for the advanced class?\". Bạn lấy giá trong bảng rồi áp dụng điều kiện trong ghi chú. Phép tính luôn rất đơn giản; cái khó là tìm đủ hai mẩu thông tin.\n[P7]\nT:Greenway Community Center: Evening classes, spring term\n|Class|Day|Time|Instructor|Tuition\n|Beginner Spanish|Monday|6:00–7:30 P.M.|Ana Ruiz|120 dollars\n|Advanced Spanish|Wednesday|6:00–7:30 P.M.|Ana Ruiz|140 dollars\n|Computer skills|Tuesday|7:00–8:30 P.M.|Ken Ito|100 dollars\n|Yoga|Thursday|6:30–7:30 P.M.|Mia Park|80 dollars\nAll classes run for ten weeks, beginning the week of March 3. Tuition does not include books. Residents of Greenway receive a discount of ten dollars on each class. To enroll, visit the front desk or our website by February 24. Classes with fewer than six students will be canceled, and tuition will be refunded.\n?Who teaches two of the classes?|Ana Ruiz|Ken Ito|Mia Park|No instructor\n?Which class meets on Tuesdays?|Computer skills|Yoga|Beginner Spanish|Advanced Spanish\n?How much will a Greenway resident pay for the yoga class?|70 dollars|80 dollars|90 dollars|10 dollars >> Học phí 80 đô la trừ 10 đô la giảm cho cư dân Greenway.\n?What will happen if only four people enroll in a class?|The class will not be held.|The tuition will increase.|The class will be shorter.|It will move to another day.\n--\nT:Annual Sales Conference: Registration form\nName: Peter Lang. Company: Atlas Tools. Email: plang@atlastools.example\n|Item|Price|Selected\n|Full conference (two days)|200 dollars|Yes\n|One day only|120 dollars|No\n|Workshop: Selling online|40 dollars|Yes\n|Workshop: Customer care|40 dollars|No\n|Friday evening banquet|50 dollars|Yes\nTotal: 290 dollars. Payment method: Credit card.\nNote: Registration fees include lunch, refreshments and handouts for all sessions. Workshops have a limit of twenty attendees each. Cancellations made after May 1 will not be refunded.\n?What kind of form is this?|A registration form for an event|An order form for tools|A hotel booking form|A job application\n?What did Mr. Lang NOT choose?|The customer care workshop|The banquet|The full conference|The online selling workshop\n?What is included in the registration fee?|Lunch|The banquet|A hotel room|Workshops\n?What is indicated about the workshops?|The number of people is limited.|They are free for attendees.|They are held in the evening.|They can be canceled at any time for a refund.\n--\nT:Bayside Language School: Frequently asked questions\nHow do I choose the right level? New students take a free test on our website. It takes twenty minutes, and you will receive your result by email the same day.\nHow large are the classes? Classes have a maximum of eight students, so every student has time to speak.\nDo I get a certificate? Yes. Students who attend at least eighty percent of the lessons receive a certificate at the end of the course.\nCan I change my class? You may change to another class at the same level once per term, free of charge. A second change costs fifteen dollars.\nWhat if I miss a lesson? Handouts and a short video of each lesson are available on the student page of our website for two weeks.\n?How do new students find out their level?|By taking an online test|By meeting an instructor|By attending a trial lesson|By sending an email\n?What is suggested about the school's classes?|They are small.|They are only for beginners.|They are held online.|They last eight weeks.\n?What must students do to receive a certificate?|Attend most of the lessons|Pass a final exam|Pay fifteen dollars|Complete all handouts\n?What is true about changing classes?|The first change is free.|It is not allowed.|It always costs fifteen dollars.|It must be done in the first week.\n[P4]\nN:Good morning, and welcome to today's workshop on time management. My name is Grace Liu, and I'll be your instructor. Before we start, a few notes. The morning session runs until noon, and refreshments are available at the back of the room. Lunch is not provided, but there is a cafeteria on the first floor. Please take a handout from the table by the door. At the end of the day, I'll ask you to fill out a short evaluation form, and then you'll receive your certificates.\n?Who is the speaker?|A workshop instructor|A cafeteria manager|A conference attendee|A hotel clerk\n?What does the speaker say about lunch?|Attendees must get it themselves.|It will be served at noon in the room.|It is included in the fee.|It is canceled.\n?What will attendees do before receiving their certificates?|Complete an evaluation form|Take a test|Pay the tuition|Clean the room\n[P2]\nHave you enrolled in the computer class yet?|Not yet. The deadline is Friday.|It's a new computer.|Yes, in a roll.\nWho's the instructor for the afternoon session?|I think it's Ms. Liu.|In room 204.|It lasts two hours.\nWill refreshments be served at the workshop?|Yes, coffee and sandwiches.|It was refreshing.|At the shop.\nIs this class suitable for beginners?|Yes, no experience is needed.|It begins at six.|It's an advanced degree.\n[P5]\nStudents who complete the course will receive a 【certificate|certify|certified|certification of】. >> Sau \"a\" cần danh từ đếm được: certificate.\nAll 【attendees|attends|attendance|attending】 must sign in at the front desk. >> Sau \"All\", chủ ngữ số nhiều chỉ người: attendees.\nYou can 【enroll|roll|unroll|enrolled】 in the class online or by phone. >> Sau \"can\" cần động từ nguyên mẫu; \"enroll in\".\nThe 【advanced|advance|advancing|advancement】 course is designed for experienced users. >> Trước danh từ \"course\" cần tính từ: advanced.\nLight 【refreshments|refreshes|refreshing|refreshed】 will be provided after the lecture. >> Sau tính từ \"Light\", chủ ngữ của \"will be provided\": danh từ.\nThe 【tuition|intuition|tutor|tutoring of】 for the ten-week course is 150 dollars. >> Hợp nghĩa: học phí.\n##C20|Tổng ôn Chặng 3|Chia thời gian cho phần đọc\n>Bài cuối chặng: cách chia 75 phút cho 100 câu đọc, rồi làm một lượt đủ Part 3, 4, 6 và 7 ở mức của chặng này.\n[V]Sức khoẻ và y tế\nprescription|đơn thuốc|You cannot buy this medicine without a doctor's ＊.\npharmacy|hiệu thuốc|I need to stop at the ＊ to buy some aspirin.\nsymptom|triệu chứng|A high temperature is a common ＊ of the flu.\npatient|bệnh nhân|The doctor sees about thirty ＊s a day.\nclinic|phòng khám|I went to the ＊ near my office for a blood test.\ninsurance|bảo hiểm|My health ＊ pays for most of my hospital bills.\ncheckup|buổi khám sức khoẻ tổng quát|I go to the doctor for a ＊ once a year.\nmedicine|thuốc|Take this ＊ twice a day after meals.\ntreatment|sự điều trị|The new ＊ helped her walk again after the accident.\nrecover|hồi phục|It took him two weeks to ＊ from the operation.\ndentist|nha sĩ|I have a toothache, so I am going to the ＊.\nsurgery|ca phẫu thuật|He needs ＊ on his knee after the football accident.\n[N]\nPhần đọc có 100 câu trong 75 phút, và hầu hết thí sinh không kịp làm hết. Cách chia nên theo: Part 5 trong 10 phút (30 câu, 20 giây mỗi câu), Part 6 trong 8 phút (4 đoạn, 2 phút mỗi đoạn), còn lại khoảng 55 phút cho 54 câu Part 7, tức khoảng một phút mỗi câu.\nTrong Part 7, làm đoạn đơn trước, đoạn kép và đoạn ba sau. Với mỗi bài, làm câu chi tiết trước, rồi mới đến câu NOT, câu suy luận và câu chèn câu. Câu nào quá một phút rưỡi chưa ra thì chọn tạm một đáp án và đi tiếp.\nPhần nghe không cho bạn quản lý thời gian, nhưng có một kỹ thuật quan trọng: dùng thời gian băng đọc hướng dẫn và thời gian giữa các bài để đọc trước ba câu hỏi của bài kế tiếp. Đừng dùng lúc đó để xem lại câu vừa làm.\nSang Chặng 4, bạn sẽ gặp đoạn kép, đoạn ba, câu hỏi liên kết nhiều văn bản và vốn từ khó hơn. Hãy làm bài kiểm tra cuối Chặng 3 trước khi đi tiếp.\n[P3]\nA:Good morning, Riverside Clinic.\nB:Hi, I'd like to make an appointment for a checkup. I'm a new patient.\nA:Certainly. Dr. Wong has an opening on Thursday at ten, or Friday at three.\nB:Thursday at ten, please. Do I need to bring anything?\nA:Please bring your insurance card and a list of any medicine you take. And come fifteen minutes early to fill out some forms.\nB:All right. So I should arrive at nine forty-five.\n?Why is the man calling?|To make an appointment|To get test results|To cancel a checkup|To ask about a bill\n?What should the man bring?|His insurance card|His old prescription|A photo|His test results\n?What time should the man arrive?|At 9:45|At 10:00|At 10:15|At 3:00\n[P4]\nN:Attention, customers. The pharmacy counter at the back of the store will be closed today from one to two P.M. for staff training. If you need to pick up a prescription, please do so before one o'clock or after two. Our regular checkout counters will stay open as usual. Also, free flu shots are available this week without an appointment. Just ask at the pharmacy counter and show your insurance card. Thank you for shopping with us.\n?What is the announcement mainly about?|A temporary closing of a counter|A new pharmacy|A sale on medicine|A change in store hours\n?Why will the counter be closed?|For staff training|For cleaning|For a lunch break|For repairs\n?What do customers need to show to get a flu shot?|An insurance card|A prescription|An appointment card|A receipt\n[P6]\nT:Dear Ms. Carter,\nThis is a reminder th
