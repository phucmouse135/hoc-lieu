 number of · Với N không đếm được: much, a little, little, a great deal of · Với cả hai: some, any, a lot of, most, all, plenty of · Với N số ít: each, every, another · Hai đối tượng: both (cả hai), either (một trong hai), neither (không cái nào)\n\"A few\" và \"a little\" mang nghĩa tích cực (có một ít), còn \"few\" và \"little\" mang nghĩa tiêu cực (hầu như không có).\n!Ba từ dễ nhầm: another + danh từ số ít (another item); other + danh từ số nhiều (other items); the other + cái còn lại. Và \"most of the items\" cần \"of the\", còn \"most items\" thì không.\n>We have only 【a few|a little|much|few of】 samples left.=Chúng tôi chỉ còn vài mẫu hàng.\n>There is not 【much|many|several|a few】 space in the warehouse.=Trong kho không còn nhiều chỗ.\n>【Each|All|Many|Both】 item has a price tag.=Mỗi món hàng đều có nhãn giá.\n>Would you like to see 【another|other|others|the others】 model?=Bạn có muốn xem một mẫu khác không?\n>【Most of|Most|Almost|Much of】 the items are in stock.=Phần lớn các mặt hàng còn trong kho.\n+The store has two entrances, and 【both|either|each|neither】 are open today.=Cửa hàng có hai lối vào và cả hai đều mở hôm nay.\n+We received 【several|much|a little|every】 orders from new customers this week.=Tuần này chúng tôi nhận được vài đơn hàng từ khách mới.\n[N]\nPart 2, câu hỏi về số lượng và giá: \"How many\" cần một con số; \"How much\" cần giá tiền hoặc một lượng; \"How long\" cần độ dài thời gian; \"How often\" cần tần suất. Bẫy quen thuộc là trả lời đúng một con số nhưng cho sai câu hỏi, ví dụ hỏi How many mà đáp \"Twenty dollars\".\n[P1]\n🛒🥫🥫🥫|Những hộp thực phẩm xếp ngay ngắn trên kệ siêu thị.|Some cans are arranged on shelves.|A clerk is stocking the shelves.|A customer is reaching for a can.|The shelves are being repaired.\n📋👨‍🔧📦|Một nhân viên cầm bảng kê đang đếm thùng hàng trong kho.|A man is checking some boxes.|A man is sealing a box with tape.|A man is driving a forklift.|Boxes are being thrown away.\n🏬🧍‍♀️👗|Một khách hàng đang xem quần áo treo trên giá.|A woman is looking at some clothes.|A woman is folding a sweater.|A woman is paying for a dress.|Some clothes are lying on the floor.\n[P2]\nHow many items are on the order?|Twenty-five in total.|About twenty dollars.|On the second shelf.\nHow much stock do we have left?|Enough for about two weeks.|Three times a month.|It's in the back.\nHow long will it take to restock?|Three or four days.|Since last Monday.|Forty boxes.\nHow often do you check the inventory?|At the end of each month.|For about an hour.|Two hundred items.\nHow much does the catalog cost?|It's free of charge.|There are ninety pages.|Once a year.\nHow many samples would you like?|Just a few, thanks.|They cost a little.|Yes, I'd like that.\n[P7]\nT:Order confirmation: Hillside Office Supply\nDear Ms. Bell, thank you for your purchase. We have received your order for 20 boxes of printer paper, 5 desk lamps and 2 office chairs. The paper and the lamps are in stock and will be shipped tomorrow. Unfortunately, the chairs are currently out of stock. We expect a new shipment on April 12 and will send them as soon as they arrive.\nYou will not be charged for delivery of the second shipment. If you prefer, you may choose another model from our catalog or cancel that part of the order. Please let us know by April 5.\n?What is the main purpose of the message?|To give information about an order|To advertise a sale|To request a payment|To apologize for a damaged item\n?Which items are not available now?|The office chairs|The desk lamps|The printer paper|The catalogs\n?What is indicated about the second shipment?|Its delivery will be free.|It will arrive tomorrow.|It has been canceled.|It will include the lamps.\n?What should Ms. Bell do by April 5?|Tell the company what she prefers|Pay for the order|Return the chairs|Visit the store\n[P5]\nThere are only 【a few|a little|much|little】 boxes left in the storage room. >> \"Boxes\" đếm được số nhiều: a few.\nWe do not have 【much|many|few|several】 information about the new supplier. >> \"Information\" không đếm được: much.\n【Each|All|Most|Several】 clerk must wear a name tag. >> Sau chỗ trống là danh từ số ít (clerk): Each.\nThis model is out of stock. Would you like to see 【another|other|others|each other】 one? >> \"Một cái khác\" + danh từ số ít (one): another.\n【Most|Most of|Almost|The most】 customers prefer to shop online. >> Trước danh từ không có \"the\": Most.\nThe store sells sportswear and many 【other|another|others|the other】 products. >> Trước danh từ số nhiều: other.\n【Both|Either|Each|Every】 warehouses are located near the port. >> Hai nhà kho, động từ số nhiều \"are\": Both.\nWe spent a great 【deal|number|many|few】 of time checking the inventory. >> Cụm cố định với danh từ không đếm được: a great deal of.\n【All|Every|Each|Much】 items in the catalog are on sale this week. >> Trước danh từ số nhiều (items): All.\nYou can pay by cash or card; 【either|both|neither|each of】 is fine. >> Một trong hai đều được, động từ số ít \"is\": either.\n##B17|Máy tính và hệ thống|Cụm giới từ cố định\n>Một nhóm câu Part 5 chỉ hỏi giới từ đi với một tính từ, động từ hay danh từ cụ thể. Không có quy tắc: phải thuộc theo cụm.\n[V]Công nghệ nơi làm việc\nsoftware|phần mềm|We use special ＊ to manage our accounts.\ninstall|cài đặt, lắp đặt|A technician will ＊ the new program on your computer.\npassword|mật khẩu|Do not tell anyone your ＊.\nnetwork|mạng (máy tính)|The office ＊ is down, so nobody can send email.\ndevice|thiết bị|You can use the app on any ＊, including your phone.\naccess|quyền truy cập, truy cập|Only managers have ＊ to the customer files.\nerror|lỗi|There is an ＊ in the report: the total is wrong.\ntechnician|kỹ thuật viên|The ＊ repaired the printer in ten minutes.\nupgrade|nâng cấp|We plan to ＊ all the computers next year.\nonline|trực tuyến|You can pay your bill ＊ or at the bank.\nattachment|tệp đính kèm|Please open the ＊ in my email to see the schedule.\nshut down|tắt máy, ngừng hoạt động|Please ＊ your computer before you go home.\n[G]\n@Tính từ và động từ + giới từ|Cụm cần thuộc|interested in · responsible for · familiar with · satisfied with · aware of · capable of · similar to · different from · eligible for · depend on · apply for · comply with · participate in · result in · consist of · refer to · specialize in · succeed in\nĐây là câu hỏi lấy điểm nhanh nhất nếu bạn đã thuộc cụm, và mất điểm chắc chắn nếu chưa. Hãy học cả cụm như một từ.\n>Ms. Tan is responsible 【for|of|to|with】 the company network.=Cô Tan chịu trách nhiệm về mạng của công ty.\n>Are you familiar 【with|to|of|in】 this software?=Bạn có quen với phần mềm này không?\n>All staff must comply 【with|to|for|on】 the security policy.=Mọi nhân viên phải tuân thủ chính sách bảo mật.\n@Giới từ kép và cụm giới từ|Hay gặp trong email và thông báo|according to: theo · due to, because of: do · instead of: thay vì · in addition to: ngoài … ra · prior to: trước · in case of: trong trường hợp · on behalf of: thay mặt · in spite of, despite: bất chấp · regardless of: bất kể · as a result of: do kết quả của\nCác cụm này mở đầu hoặc nối câu trong thông báo và email. Hãy nhận ra chúng như một khối và nhớ nghĩa của cả khối, đừng tách từng từ.\n!Sau các cụm này là danh từ hoặc V-ing, không phải mệnh đề: \"due to the error\", \"prior to installing\".\n>The system was down 【due to|because|although|instead】 a network error.=Hệ thống ngừng hoạt động do lỗi mạng.\n>【According to|According|Accordingly|In accordance】 the technician, the upgrade will take two hours.=Theo kỹ thuật viên, việc nâng cấp sẽ mất hai giờ.\n+Please save your files 【prior to|prior|before of|ahead】 shutting down.=Vui lòng lưu tệp trước khi tắt máy.\n+Staff can work from home 【instead of|instead|rather|in place】 coming to the office.=Nhân viên có thể làm ở nhà thay vì đến văn phòng.\n[N]\nPart 2, trộn nhanh ba loại Who, When, Where: ở tốc độ thật, ba từ này rất dễ lẫn. Luyện phản xạ: Who thì chờ tên người hoặc chức danh, When thì chờ thời gian, Where thì chờ nơi chốn. Bài luyện dưới đây cố ý cho ba câu đáp thuộc đúng ba loại đó.\n[P1]\n💻🔧👨‍🔧|Một kỹ thuật viên đang mở thùng máy tính để sửa.|A technician is repairing a computer.|A technician is carrying a monitor.|A computer is being packed in a box.|A man is typing an email.\n🖥️🖥️🖥️🪑|Một dãy màn hình máy tính trên bàn dài, các ghế đều trống.|Some monitors are lined up on a desk.|Some employees are working at computers.|A monitor is being unplugged.|The chairs are stacked in a corner.\n📱👩‍💼🔌|Một phụ nữ đang cắm sạc điện thoại ở bàn làm việc.|A woman is plugging in a device.|A woman is talking on a phone.|A woman is putting a phone in her bag.|A woman is wiping a screen.\n[P2]\nWho installed the new software?|A technician from the IT department.|Yesterday afternoon.|On every computer.\nWhen will the network be working again?|In about an hour.|The IT manager.|In the server room.\nWhere can I get a new password?|At the help desk on the second floor.|Ms. Rao can.|After lunch.\nWho has access to these files?|Only the department managers.|In the main system.|Since last year.\nWhen was this error reported?|First thing this morning.|By Mr. Chu.|On the login page.\nWhere should I send the attachment?|To the address on the form.|Before noon.|The technician did.\n[P3]\nA:IT help desk, this is Maria.\nB:Hi, Maria. This is Tom in accounting. I can't open the attachment that the bank sent me. I keep getting an error message.\nA:Is your software up to date? We upgraded everyone's computers last night.\nB:I was out of the office yesterday, so I'm not sure.\nA:That's probably the reason. Please shut down your computer and start it again. The upgrade will install automatically. If it still doesn't work, call me back.\n?What problem does the man have?|He cannot open a file.|He forgot his password.|His computer will not turn on.|He lost an email.\n?Why might the man's software be out of date?|He was away yesterday.|He refused the upgrade.|His computer is too old.|The network was down.\n?What does the woman tell the man to do?|Restart his computer|Call the bank|Bring his computer to her|Buy new software\n[P5]\nMr. Chu is responsible 【for|of|to|about】 installing the new software. >> Cụm cố định: responsible for.\nThe office will be closed tomorrow 【due to|because|since that|although】 a network upgrade. >> Sau chỗ trống là danh từ: due to.\n【According to|Regarding to|Depending|As for of】 the email, all passwords must be changed by Friday. >> \"Theo…\": according to.\nNew employees should become familiar 【with|to|for|at】 the security system. >> Cụm cố định: familiar with.\nPlease back up your files 【prior to|prior|ago|before of】 the upgrade. >> \"Trước\" + danh từ: prior to.\nOnly managers are eligible 【for|to|in|with】 remote access. >> Cụm cố định: eligible for.\n【In addition to|In addition|Additionally|Add to】 a new laptop, each employee will receive a headset. >> Trước danh từ: in addition to.\nThe success of the project depends 【on|of|in|for】 the new software. >> Cụm cố định: depend on.\n【Despite|Although|Even|However】 the error, the report was sent on time. >> Trước danh từ (the error): despite.\nAll devices must comply 【with|to|by|on】 the company's security policy. >> Cụm cố định: comply with.\n##B18|Nhà hàng và ẩm thực|So sánh nâng cao, so, such, too, enough\n>Bạn mở rộng phần so sánh đã học ở Chặng 1 và thêm bốn cấu trúc chỉ mức độ rất hay bị hỏi lẫn nhau.\n[V]Ẩm thực\nchef|bếp trưởng, đầu bếp|The ＊ at this hotel trained in France.\ndish|món ăn|The most popular ＊ on the menu is grilled fish.\ningredient|nguyên liệu|Fresh tomato is the main ＊ in this soup.\nserve|phục vụ|The restaurant does not ＊ breakfast; it opens at noon.\ntaste|vị; nếm|I love the ＊ of fresh bread.\ndelicious|ngon|The cake was ＊; everyone asked for a second piece.\ncuisine|ẩm thực (của một vùng, một nước)|This restaurant specializes in Italian ＊, especially pasta.\ndessert|món tráng miệng|For ＊, we had ice cream and fruit.\nbeverage|đồ uống|The price of the lunch includes one ＊, such as tea or juice.\nvegetarian|người ăn chay; (món) chay|She is a ＊, so she does not eat meat or fish.\ntakeout|đồ ăn mua mang về|We were too tired to cook, so we ordered ＊.\nwaiter|người phục vụ bàn|The ＊ brought our food ten minutes after we ordered.\n[G]\n@So sánh nâng cao|Các cấu trúc so sánh hay gặp|as + tính từ / trạng từ + as: bằng · not as … as: không bằng · twice / three times as … as: gấp hai, gấp ba · much / far / even + so sánh hơn: hơn nhiều · the + so sánh hơn, the + so sánh hơn: càng … càng · one of the + so sánh nhất + danh từ số nhiều\nThấy \"than\" thì chọn dạng so sánh hơn; thấy \"the … in / of\" thì chọn so sánh nhất; thấy \"as … as\" thì chọn dạng nguyên của tính từ hoặc trạng từ.\n!Không dùng \"very\" trước so sánh hơn: \"very cheaper\" là sai, phải là \"much cheaper\".\n>This restaurant is as 【popular|more popular|most popular|popularly】 as the one downtown.=Nhà hàng này đông khách ngang với nhà hàng ở trung tâm.\n>The new menu is 【much|very|more|most】 cheaper than the old one.=Thực đơn mới rẻ hơn nhiều so với thực đơn cũ.\n>It is one of the 【best|better|good|well】 restaurants in the city.=Đó là một trong những nhà hàng ngon nhất thành phố.\n@so, such, too, enough|Bốn cấu trúc chỉ mức độ|so + tính từ / trạng từ + that · such + (a / an) + tính từ + danh từ + that · too + tính từ + to V: quá … nên không thể · tính từ + enough + to V: đủ … để · enough + danh từ\nSo đi với tính từ hoặc trạng từ; such đi với một cụm có danh từ. Too mang nghĩa tiêu cực (quá mức nên không làm được), còn enough nghĩa là vừa đủ.\n>The soup was 【so|such|too|very much】 hot that I could not eat it.=Món súp nóng đến mức tôi không ăn được.\n>It was 【such|so|too|enough】 a delicious meal that we came back the next day.=Đó là một bữa ăn ngon đến mức hôm sau chúng tôi quay lại.\n>The table is not big 【enough|too|so|such】 for eight people.=Cái bàn không đủ lớn cho tám người.\n+The restaurant was 【too|so|such|enough】 crowded to find a seat.=Nhà hàng quá đông nên không tìm được chỗ ngồi.\n+Prices here are twice as 【high|higher|highest|highly】 as in my hometown.=Giá ở đây cao gấp đôi ở quê tôi.\n[N]\nPart 2, mời và hỏi sở thích: \"Would you like…?\", \"Would you prefer… or…?\", \"Do you want me to…?\". Đáp án đúng nhận lời (\"Yes, please\", \"That sounds great\"), từ chối lịch sự (\"No, thanks. I'm full\"), hoặc nêu lựa chọn (\"I'd prefer tea\").\n[P1]\n👨‍🍳🔪🥕|Một đầu bếp đang thái rau củ trên thớt.|A chef is cutting some vegetables.|A chef is serving a customer.|A chef is washing a pan.|Some vegetables are growing in a garden.\n🍽️🕯️🪑|Một bàn ăn đã bày sẵn đĩa, dao dĩa và ly, chưa có khách.|A table has been set for a meal.|Diners are enjoying their meal.|A waiter is clearing a table.|Dishes are piled in a sink.\n🧑‍🍳🍰🧁|Bánh ngọt được bày trong tủ kính của một tiệm bánh.|Some desserts are displayed in a case.|A baker is putting bread in an oven.|A customer is eating a cake.|The display case is empty.\n[P2]\nWould you like to see the dessert menu?|No, thank you. Just the bill, please.|Yes, I saw it.|It's a sweet dish.\nWould you prefer a table inside or outside?|Outside, if it's not too cold.|Yes, I would.|For four people.\nDo you want me to order takeout for the meeting?|That would be great, thanks.|It took thirty minutes.|In the meeting room.\nWould you like something to drink while you wait?|Just some water, please.|About ten minutes.|Yes, I waited.\nShall we try the new Italian restaurant?|Sure, I've heard the chef is excellent.|It's Italian cuisine.|We tried yesterday.\nWould you care for more coffee?|I'm fine, thanks.|I care about it.|It's a coffee shop.\n[P4]\nN:Are you looking for a place to have lunch near the station? Come to Olive Tree, the newest restaurant on Bridge Street. Our chef uses only fresh, local ingredients, and our lunch set is much cheaper than you might expect: just nine dollars for a main dish, a salad and a beverage. We also have a full vegetarian menu. This week, every customer gets a free dessert. Olive Tree is open from eleven A.M. to ten P.M., seven days a week.\n?What is being advertised?|A restaurant|A cooking school|A supermarket|A hotel\n?What is included in the lunch set?|A main dish, a salad and a beverage|A main dish and a dessert|Soup, a salad and coffee|Two dishes and a beverage\n?What can customers get this week?|A free dessert|A discount on dinner|A free beverage|A cooking lesson\n[P5]\nThe new chef's dishes are 【much|very|so|too】 better than the old ones. >> Trước so sánh hơn dùng \"much\", không dùng \"very\".\nThe restaurant was 【so|such|too|enough】 busy that we waited for an hour. >> so + tính từ + that.\nIt was 【such|so|too|very】 a long line that we decided to go somewhere else. >> such + a + tính từ + danh từ + that.\nThe kitchen is not large 【enough|too|so|such】 to serve two hundred guests. >> tính từ + enough + to V.\nThis is one of the 【most popular|more popular|popular|popularly】 dishes on our menu. >> \"one of the\" + so sánh nhất + danh từ số nhiều.\nThe soup was 【too|so|such|enough】 salty to eat. >> too + tính từ + to V.\nDinner here costs twice as 【much|more|most|many】 as lunch. >> \"Twice as … as\" với giá tiền (không đếm được): much.\nThe service at the new branch is as 【good|better|best|well】 as at the main restaurant. >> as + tính từ dạng nguyên + as.\nThe earlier you reserve, the 【better|good|best|well】 your table will be. >> \"The + so sánh hơn, the + so sánh hơn\".\nWe do not have 【enough|too|so|such】 chairs for all the guests. >> enough + danh từ.\n##B19|Giải trí và văn hoá|Từ dễ nhầm và cụm từ cố định\n>Nửa số câu Part 5 hỏi từ vựng, không hỏi ngữ pháp. Bài này gom những cặp từ dễ nhầm nhất và những cụm động từ + danh từ phải thuộc.\n[V]Sự kiện văn hoá\nexhibition|cuộc triển lãm|The museum has an ＊ of old photographs this month.\nmuseum|bảo tàng|We spent the afternoon at the history ＊.\nperformance|buổi biểu diễn|The evening ＊ of the play starts at eight.\naudience|khán giả|The ＊ clapped for five minutes at the end of the show.\nconcert|buổi hoà nhạc|We bought tickets for a rock ＊ on Saturday night.\ntheater|nhà hát, rạp|The new play is on at the ＊ on King Street.\nadmission|vé vào cửa, sự cho vào|＊ to the museum is free on Sundays.\nentertainment|sự giải trí|The hotel offers live ＊, such as music and dancing, every night.\ngallery|phòng trưng bày tranh|The ＊ sells paintings by local artists.\nsold out|đã bán hết vé|The concert is ＊; there are no tickets left.\nfestival|lễ hội|The film ＊ lasts ten days and shows eighty movies.\nmembership|tư cách hội viên|A museum ＊ costs 40 dollars a year and gives you free entry.\n[G]\n@Cặp động từ dễ nhầm|Chọn đúng từ theo cách dùng|say + điều được nói / tell + người nghe · rise (tự tăng, không có tân ngữ) / raise + tân ngữ · borrow (mượn vào) / lend (cho mượn) · remember (tự nhớ) / remind + người (nhắc ai) · attend + sự kiện / participate in + sự kiện · affect (động từ) / effect (danh từ)\nCác lựa chọn có nghĩa gần giống nhau, nên phải nhìn cấu trúc quanh chỗ trống: có tân ngữ không, có giới từ không, tân ngữ là người hay vật.\n>The guide 【told|said|spoke|talked】 us that the museum closes at five.=Hướng dẫn viên bảo chúng tôi rằng bảo tàng đóng cửa lúc năm giờ.\n>Ticket prices have 【risen|raised|rose up|raising】 by ten percent.=Giá vé đã tăng mười phần trăm.\n>Please 【remind|remember|recall|memorize】 me to buy the tickets.=Hãy nhắc tôi mua vé nhé.\n@Cụm động từ + danh từ cố định|Collocations|make a decision / a reservation / a payment / an appointment / a mistake · do business / research · take place / notes / a break / part in · give a presentation / a speech · place an order · meet a deadline · reach an agreement · hold a meeting / an event\nTiếng Anh ghép sẵn một số động từ với một số danh từ. Dịch từng chữ từ tiếng Việt thường chọn sai động từ, nên hãy học cả cụm.\n!Sự kiện \"take place\" (diễn ra), không dùng \"happen\" trong văn bản trang trọng và không dùng bị động: \"The festival will take place in May\".\n>The concert will 【take|make|do|have】 place in the city park.=Buổi hoà nhạc sẽ diễn ra ở công viên thành phố.\n>I would like to 【make|do|take|give】 a reservation for two.=Tôi muốn đặt chỗ cho hai người.\n+The director will 【give|make|do|take】 a short speech before the performance.=Giám đốc sẽ phát biểu ngắn trước buổi diễn.\n+The museum plans to 【raise|rise|arise|grow up】 its admission fee next year.=Bảo tàng dự định tăng phí vào cửa vào năm tới.\n[N]\nPart 2, bẫy lặp từ: câu đáp sai nhắc lại đúng một từ của câu hỏi hoặc một từ cùng gốc (ticket và tickets, perform và performance) để nghe có vẻ liên quan. Đáp án đúng thường dùng từ khác hẳn: hỏi \"Are there any tickets left?\" thì đáp đúng có thể là \"It's sold out\".\n[P1]\n🖼️🧍‍♂️🧍‍♀️|Hai người đứng xem một bức tranh treo trên tường phòng trưng bày.|Some people are looking at a painting.|Some people are hanging a picture.|A painter is working on a canvas.|The gallery is closed to visitors.\n🎻🎹👥|Một dàn nhạc đang biểu diễn trên sân khấu trước khán giả.|Musicians are performing on a stage.|Musicians are packing their instruments.|The audience is leaving the hall.|A stage is being built.\n🎟️🧍🧍🏛️|Mọi người xếp hàng trước quầy bán vé của một nhà hát.|People are waiting in line at a ticket window.|People are taking their seats.|A woman is tearing tickets at a door.|The theater is being cleaned.\n[P2]\nAre there any tickets left for tonight's performance?|I'm afraid it's sold out.|He performed very well.|I left my ticket at home.\nWhat time does the exhibition open?|At ten, I believe.|It's an art exhibition.|In the open air.\nDid you enjoy the concert last night?|Yes, the music was wonderful.|It's at the concert hall.|Tomorrow night.\nHow much is admission to the museum?|It's free for members.|I admitted it.|It's a history museum.\nWho's performing at the festival this year?|A few local bands.|In the main park.|Last year's festival.\nWhere can I buy a membership?|At the front desk or online.|For one year.|I'm a member of the audience.\n[P7]\nT:City Museum of Art: Events in May\nSpecial exhibition: \"Colors of the Sea\", paintings by local artists. May 3 to May 31, Gallery 2. Admission is 8 dollars; free for members.\nEvening concert: The Riverside Quartet will give a performance in the main hall on Friday, May 16, at 7 P.M. Tickets are 15 dollars and must be purchased in advance. Last year's concert sold out in two days.\nFamily day: On Sunday, May 25, children under 12 can take part in a free painting class from 10 A.M. to noon. Places are limited, so please make a reservation at the front desk.\n?How much do members pay for the special exhibition?|Nothing|8 dollars|15 dollars|12 dollars\n?What is suggested about the concert?|Tickets may sell quickly.|It will be held outdoors.|It is free for children.|It takes place every Friday.\n?What should people do to join the painting class?|Reserve a place|Buy a ticket online|Become a member|Arrive before 10 A.M.\n?Where will the concert take place?|In the main hall|In Gallery 2|At the front desk|In the city park\n[P5]\nThe annual film festival will 【take|make|hold|do】 place from June 1 to June 10. >> Cụm cố định: take place (diễn ra).\nThe guide 【told|said|spoke|explained】 the visitors to stay with the group. >> Sau chỗ trống là người nghe (the visitors) + to V: tell.\nAdmission prices have 【risen|raised|risen up|been rising up】 twice this year. >> Giá tự tăng, không có tân ngữ: rise, rose, risen.\nPlease 【remind|remember|memorize|recall】 the audience to turn off their phones. >> \"Nhắc ai làm gì\": remind + người + to V.\nWe need to 【make|do|take|give】 a decision about the venue by Friday. >> Cụm cố định: make a decision.\nThe new exhibition had a positive 【effect|affect|effective|effectively】 on ticket sales. >> Sau \"a positive\" cần danh từ: effect.\nMore than 500 people 【attended|participated|arrived|took part】 the opening ceremony. >> \"Attend\" đi thẳng với tân ngữ, không cần giới từ.\nCould you 【lend|borrow|rent out of|owe】 me your membership card for a minute? >> \"Cho tôi mượn\": lend + người + vật.\nThe theater will 【hold|take|do|make up】 a special event for members next month. >> Cụm cố định: hold an event.\nCustomers can 【place|put on|do|take up】 an order for tickets by phone. >> Cụm cố định: place an order.\n##B20|Bảo trì toà nhà|Tổng ôn Chặng 2 và cách làm Part 5\n>Bài cuối chặng: quy trình ba bước cho mọi câu Part 5, rồi làm thử đủ các phần của đề ở mức nền tảng.\n[V]Sửa chữa và bảo trì\nrepair|sửa chữa|It will cost 200 dollars to ＊ the broken window.\nmaintenance|việc bảo trì|The elevator is closed for ＊ until noon.\nelevator|thang máy|Take the ＊ to the tenth floor.\nelectricity|điện|The storm cut off the ＊, so the whole building was dark.\nfacility|cơ sở, khu nhà (phục vụ một mục đích)|The company opened a new training ＊ outside the city.\nout of order|bị hỏng, không hoạt động|The copy machine is ＊; please use the one upstairs.\nfix|sửa|The technician will ＊ the printer this afternoon.\ntool|dụng cụ|A hammer is a useful ＊ to keep at home.\nleak|chỗ rò rỉ; rò rỉ|There is a water ＊ in the bathroom ceiling.\nheating|hệ thống sưởi|The ＊ is not working, so the office is very cold.\nair conditioner|máy điều hoà|It is hot in here; please turn on the ＊.\nnotice|thông báo|There is a ＊ on the door saying the shop is closed today.\n[G]\n@Ba loại câu hỏi Part 5 và cách xử lý|Nhìn đáp án trước, đọc câu sau|Loại 1, từ loại: bốn lựa chọn cùng gốc từ, chỉ nhìn vị trí chỗ trống · Loại 2, ngữ pháp: thì, bị động, đại từ, giới từ, liên từ, tìm dấu hiệu trong câu · Loại 3, từ vựng: bốn từ khác nhau cùng từ loại, phải hiểu nghĩa và cụm từ đi kèm\nLuôn liếc bốn lựa chọn trước để biết câu thuộc loại nào. Loại 1 và loại 2 nên xong trong 10–15 giây; dồn thời gian cho loại 3 và cho Part 7. Mục tiêu là làm xong 30 câu Part 5 trong 10 phút.\n!Không biết thì vẫn phải chọn. TOEIC không trừ điểm câu sai, nên đừng bao giờ bỏ trống.\n>The elevator is 【currently|current|currency|more current】 out of order.=Thang máy hiện đang hỏng.\n>The heating system 【was repaired|repaired|was repairing|repairs】 yesterday.=Hệ thống sưởi đã được sửa hôm qua.\n>Please report any leaks to the maintenance 【department|depart|departed|departing】.=Vui lòng báo mọi chỗ rò rỉ cho phòng bảo trì.\n>The air conditioner will be fixed 【by|until|during|since】 Friday.=Máy điều hoà sẽ được sửa xong trước thứ Sáu.\n>The technician has not arrived 【yet|already|still|ever】.=Kỹ thuật viên vẫn chưa đến.\n+The notice 【that|who|whose|where】 was posted this morning explains the new procedure.=Thông báo dán sáng nay giải thích quy trình mới.\n+【Although|Despite|Because of|However】 the facility is old, it is well maintained.=Mặc dù cơ sở đã cũ, nó được bảo trì tốt.\n[N]\nBạn đã học hết Chặng 2. Trước khi sang Chặng 3, hãy làm bài kiểm tra cuối chặng ở trang Lộ trình. Nếu Part 5 đạt dưới 70%, hãy vào Luyện tập, chọn Ngữ pháp và làm lại những điểm còn yếu ở cả bốn kiểu bài.\nTừ Chặng 3, trọng tâm chuyển sang Part 3, Part 4, Part 6 và Part 7, là những phần chiếm nhiều câu nhất của đề.\n[P1]\n🛗🚧🪧|Một tấm biển \"đang sửa chữa\" đặt trước cửa thang máy.|A sign has been placed in front of an elevator.|A man is waiting for an elevator.|An elevator door is being painted.|People are getting out of an elevator.\n🔧👨‍🔧🚰|Một thợ sửa ống nước đang sửa đường ống dưới bồn rửa.|A man is fixing a pipe.|A man is washing his hands.|A man is installing a light.|A sink is being delivered.\n🪜💡👷|Một công nhân đứng trên thang để thay bóng đèn trần.|A worker is standing on a ladder.|A worker is carrying a ladder.|A light is being turned off.|A ladder is leaning against a truck.\n[P2]\nWho should I call about the broken heating?|The maintenance department.|It's very cold.|Since this morning.\nWhen will the elevator be repaired?|By tomorrow afternoon, I hope.|On the third floor.|A technician will.\nWhy is the air conditioner off?|It's being fixed.|Turn it on, please.|In the conference room.\nThe copy machine is out of order again.|I'll put in a repair request.|Fifty copies, please.|It's in order.\nCould you post this notice on the door?|Sure, I'll do it now.|I noticed it yesterday.|By the front door.\nShould we fix the old printer or buy a new one?|A new one would be cheaper in the long run.|Yes, we should.|It prints well.\nIs there a leak in the ceiling?|Yes, I've already reported it.|It's a high ceiling.|On the roof.\nHow long will the maintenance work take?|About two hours.|Every six months.|By a technician.\n[P3]\nA:Hi, this is Jenna Park in room 512. The air conditioner in our office stopped working this morning.\nB:I'm sorry about that. Is it making any noise, or is it completely off?\nA:It's completely off. We have a meeting with customers at two, and the room is getting hot.\nB:I see. I'll send a technician right away. If he can't fix it by one o'clock, you can use the conference room on the fourth floor instead.\nA:Thank you. That would be a big help.\n?What is the woman's problem?|An air conditioner is not working.|A meeting was canceled.|An elevator is out of order.|A room is too noisy.\n?What will take place at two o'clock?|A meeting with customers|A repair|A training session|A lunch\n?What does the man suggest if the repair takes too long?|Using a different room|Postponing the meeting|Opening the windows|Calling another technician\n[P4]\nN:Good morning. This is a message from the building management office. Tomorrow, from eight A.M. to noon, the electricity in the east side of the building will be turned off for maintenance work. During this time, the elevators and the heating on that side will not operate. Please use the stairs or the west elevators. We also recommend that you save your files and shut down your computers before you leave tonight. We apologize for the inconvenience.\n?What is the purpose of the message?|To announce maintenance work|To introduce a new manager|To report a fire|To advertise a service\n?What will NOT operate tomorrow morning in the east side?|The elevators|The stairs|The west entrance|The cafeteria\n?What are listeners advised to do tonight?|Shut down their computers|Leave early|Take the stairs|Call the management office\n[P6]\nT:Notice to all tenants\nThe parking garage will be closed for repairs from Monday, March 10, __(1)__ Wednesday, March 12. During this period, tenants may park in the lot behind the building. __(2)__ The work is necessary because of a water leak that __(3)__ last week. We apologize for any inconvenience and thank you for your __(4)__.\n?(1)|until|by|since|within >> \"From … until …\": kéo dài đến thứ Tư.\n?(2)|Please display your parking permit as usual.|The garage was built in 2001.|Rents will increase next year.|The elevator is now working.\n?(3)|was discovered|discovered|is discovering|has discovering >> Chỗ rò rỉ được phát hiện (bị động), \"last week\" nên dùng quá khứ.\n?(4)|patience|patient|patiently|patients >> Sau \"your\" cần danh từ: patience (sự kiên nhẫn).\n[P7]\nT:To: All staff. From: Facilities office. Subject: New repair request procedure\nStarting next Monday, all requests for repairs must be made through the online form on the company website instead of by phone. The form asks for your name, your room number and a short description of the problem. You will receive an email within one hour to confirm that we have received your request.\nMost repairs will be completed within two business days. For emergencies, such as a water leak or a loss of electricity, please continue to call the facilities office directly at extension 300. Thank you for your cooperation.\n?What is the purpose of the memo?|To explain a new procedure|To announce a building repair|To introduce a new employee|To report an emergency\n?How should staff request most repairs from next Monday?|By filling out an online form|By calling the office|By sending a letter|By visiting the office\n?When will staff receive a confirmation?|Within one hour|Within two business days|The next Monday|Immediately by phone\n?What should staff do about a water leak?|Call extension 300|Fill out the online form|Send an email|Wait two business days\n[P5]\nThe elevator in the east wing is 【temporarily|temporary|temporariness|more temporary】 out of order. >> Loại 1: bổ nghĩa cho cụm \"out of order\", cần trạng từ.\nAll repair requests 【must be submitted|must submit|must be submitting|must submitted】 online. >> Loại 2: yêu cầu được nộp (bị động) sau must.\nThe maintenance team 【has replaced|have replaced|replacing|was replaced】 all the old lights. >> Loại 2: \"team\" số ít, có tân ngữ nên chủ động.\nPlease contact the facilities office 【if|although|so|despite】 the heating stops working. >> Loại 2: điều kiện, sau là mệnh đề: if.\nThe technician will arrive 【within|during|since|until】 thirty minutes. >> Loại 2: \"trong vòng\" + độ dài thời gian.\nA 【notice|notify|noticeable|noticing】 about the water leak was sent to all tenants. >> Loại 1: sau \"A\", làm chủ ngữ: danh từ.\nThe repairs were completed more 【quickly|quick|quicker|quickness】 than expected. >> Loại 1: bổ nghĩa cho \"were completed\": trạng từ, \"more quickly than\".\nTenants are asked to 【report|inform|tell|say】 any problems to the management office. >> Loại 3: \"report + sự việc + to + người\". Inform và tell cần người làm tân ngữ.\nThe new facility is 【equipped|equipment|equip|equipping】 with modern heating. >> Loại 1 kết hợp cụm cố định: be equipped with.\nThe air conditioners are inspected 【regularly|regular|regulation|regulate】 by a technician. >> Loại 1: câu đã đủ thành phần, cần trạng từ.\n\n##C1|Part 3: họ là ai, ở đâu, nói về gì|Câu hỏi ý chính của hội thoại\n>Câu đầu tiên của mỗi bộ ba câu hỏi Part 3 thường hỏi ý chính: chủ đề, nơi chốn, nghề nghiệp. Bài này dạy bạn bắt đáp án ngay trong hai lượt lời đầu.\n[V]Công việc hằng ngày\nassign|giao (việc)|The manager will ＊ a new project to each team.\nhandle|xử lý, giải quyết|Ms. Kim will ＊ all customer complaints this week.\nurgent|khẩn cấp|This order is ＊; the customer needs it today.\nreminder|lời nhắc|I sent everyone a ＊ about tomorrow's meeting.\nmemo|thông báo nội bộ|The director sent a ＊ to all staff about the new parking rules.\nheadquarters|trụ sở chính|The company's ＊ is in Singapore, but it has offices in ten countries.\nbranch|chi nhánh|The bank opened a new ＊ near the university.\nshift|ca làm việc|I work the night ＊, from ten P.M. to six A.M.\novertime|giờ làm thêm|We worked two hours of ＊ to finish the order.\nworkload|khối lượng công việc|My ＊ is very heavy this month; I have three reports to write.\ncooperate|hợp tác|The two departments must ＊ to finish the project on time.\npaperwork|giấy tờ, thủ tục giấy tờ|There is a lot of ＊ to complete before you can open an account.\n[N]\nPart 3 có 13 đoạn hội thoại, mỗi đoạn ba câu hỏi in sẵn trong đề. Ba câu hỏi luôn đi theo thứ tự của đoạn hội thoại: câu 1 có đáp án ở phần đầu, câu 2 ở giữa, câu 3 ở cuối.\nCâu hỏi ý chính có ba dạng: \"What are the speakers discussing?\", \"Where does the conversation take place?\" và \"Who most likely is the man?\". Đáp án hiếm khi được nói thẳng. Bạn phải suy ra từ các từ khoá: nghe thấy \"menu\", \"table for two\", \"order\" thì đó là nhà hàng; nghe thấy \"prescription\", \"pharmacist\" thì đó là hiệu thuốc.\nViệc quan trọng nhất: đọc trước ba câu hỏi trong lúc băng đang đọc phần hướng dẫn. Biết trước mình cần nghe gì thì mới nghe ra.\n[P3]\nA:Hi, Mark. Do you have a minute? I need to talk about next week's shifts.\nB:Sure. Is there a problem with the schedule?\nA:Two people from the evening shift asked for the same day off, so we don't have enough staff for Friday.\nB:I see. I could work overtime on Friday if that helps.\nA:That would be great. I'll update the schedule and send everyone a reminder.\n?What are the speakers mainly discussing?|A work schedule|A customer complaint|A new product|A job interview\n?What problem does the woman mention?|There are not enough staff on Friday.|The schedule was lost.|A shift was canceled.|Two workers were late.\n?What does the man offer to do?|Work extra hours|Call the other staff|Change the day off|Write a memo\n--\nA:Good morning. I'd like to send this package to our branch office in Osaka.\nB:Certainly. Would you like regular or express delivery?\nA:It's urgent, so express, please. How long will it take?\nB:Express takes two business days. Please fill out this form with the address, and I'll weigh the package.\nA:All right. Can I pay by company credit card?\nB:Of course.\n?Where most likely are the speakers?|At a post office|At a bank|At an airport|At a hotel\n?Why does the woman choose express delivery?|The package is urgent.|It is cheaper.|The regular service is closed.|Her manager told her to.\n?What does the man ask the woman to do?|Complete a form|Show her ID|Come back later|Pay in cash\n--\nA:Thanks for coming in, Mr. Diaz. Please have a seat. I've looked at your X-rays.\nB:Is everything all right? The pain started about a week ago.\nA:It's nothing serious. One tooth needs a small filling. We can do it today if you have thirty minutes.\nB:I have a meeting at eleven. Could I come back this afternoon?\nA:Yes. Please ask the receptionist to book a time after two.\n?Who most likely is the woman?|A dentist|A receptionist|A pharmacist|A teacher\n?When did the man's problem begin?|About a week ago|This morning|Two days ago|Last month\n?What will the man probably do next?|Speak to the receptionist|Go to a pharmacy|Cancel his meeting|Pay for the X-rays\n[P7]\nT:MEMO. To: All branch managers. From: Helen Cho, Headquarters. Subject: Monthly reports\nThis is a reminder that monthly sales reports are due on the fifth day of each month. Last month, only six of our fourteen branches sent their reports on time. Late reports create extra paperwork for the accounting team and delay our planning.\nStarting in April, reports must be submitted through the new online system instead of by email. A short training video is available on the company website. If your workload makes it difficult to meet the deadline, please contact me at least three days in advance so that we can find a solution.\n?What is the purpose of the memo?|To remind managers about a deadline|To announce a new branch|To report last month's sales|To introduce a new manager\n?How many branches sent their reports late last month?|Eight|Six|Fourteen|Five\n?What will change in April?|The way reports are submitted|The date reports are due|The person who receives reports|The number of branches\n?What should managers do if they cannot meet the deadline?|Contact Ms. Cho early|Watch a training video|Send the report by email|Ask the accounting team\n[P2]\nWho assigned you this project?|The branch manager did.|It's due on Friday.|In the main office.\nHave you finished the paperwork?|Almost. I need ten more minutes.|It's on paper.|Yes, he works here.\nWhy are you working overtime tonight?|We have an urgent order to finish.|Until about nine.|Time is over.\nWhere is the company's headquarters?|In downtown Seoul.|Since 1995.|Mr. Han is the head.\n[P5]\nMs. Ito was 【assigned|designed|resigned|signed】 to the Tokyo branch last month. >> \"Be assigned to\": được phân công đến.\nPlease treat this request as 【urgent|urgency|urgently|urge】. >> Sau \"as\" ở đây cần tính từ mô tả \"request\".\nThe two teams will 【cooperate|operate|compete|separate】 closely on the new project. >> Hợp nghĩa: hai nhóm hợp tác chặt chẽ.\nMr. Reyes knows how to 【handle|hand|handful|handling】 difficult customers. >> Sau \"how to\" cần động từ nguyên mẫu: handle.\nEmployees who work the night 【shift|shape|sheet|share】 receive extra pay. >> Cụm cố định: night shift (ca đêm).\nA 【reminder|remainder|remind|remembering】 about the deadline was sent to all staff. >> Danh từ \"lời nhắc\" là reminder; remainder nghĩa là phần còn lại.\n##C2|Part 7: email|Câu hỏi mục đích và câu hỏi chi tiết\n>Email là loại văn bản xuất hiện nhiều nhất ở Part 7. Bạn học cách đọc phần đầu thư, tìm mục đích trong hai câu đầu, và định vị chi tiết bằng từ khoá.\n[V]Thư từ công việc\nregarding|về việc, liên quan đến|I am writing ＊ your order of May 3.\ninquire|hỏi, tìm hiểu thông tin|I am writing to ＊ about the price of your products.\ninquiry|câu hỏi, yêu cầu thông tin|Thank you for your ＊ about our language courses.\nenclose|gửi kèm (trong phong bì)|I ＊ a copy of my resume with this letter.\nconfirm|xác nhận|Please ＊ your reservation by Friday.\nconfirmation|sự xác nhận|You will receive a ＊ email after you pay.\nreply|trả lời; thư trả lời|I sent the email on Monday but have not received a ＊.\nforward|chuyển tiếp|Please ＊ this email to everyone in your team.\nrecipient|người nhận|The ＊ of the package must sign for it.\nappreciate|cảm kích, biết ơn|We ＊ your help with the project.\nnotify|thông báo cho|Please ＊ us if your address changes.\nas soon as possible|càng sớm càng tốt|Please call me back ＊; it is urgent.\n[N]\nĐọc email theo ba bước. Bước một: nhìn phần đầu thư (From, To, Subject, Date) để biết ai viết cho ai và về việc gì. Bước hai: đọc hai câu đầu của thân thư; mục đích gần như luôn nằm ở đó, sau các cụm \"I am writing to…\", \"This is to inform you that…\", \"Thank you for…\". Bước ba: đọc câu hỏi rồi mới quay lại tìm chi tiết.\nCâu hỏi mục đích: \"What is the purpose of the email?\", \"Why did Mr. Lee write the email?\". Câu hỏi chi tiết: chứa một từ khoá cụ thể (tên, ngày, con số) để bạn dò lại trong bài. Đáp án đúng luôn là cách nói khác của câu trong bài: bài viết \"call our office\", đáp án ghi \"contact the company by phone\".\nPhần cuối thư thường chứa yêu cầu hành động (\"Please reply by Friday\"), và đó là chỗ của câu hỏi cuối.\n[P7]\nT:From: Daniel Moore. To: Grand Park Hotel. Subject: Reservation inquiry\nDear Sir or Madam, I am writing to inquire about rooms at your hotel for a company event. We need twelve single rooms for the nights of October 8 and 9. We would also like to use a meeting room for about thirty people on October 9, from 9 A.M. to 4 P.M.\nCould you please send me your prices for the rooms and the meeting room? I would also like to know whether breakfast is included and whether you offer a discount for groups. I would appreciate a reply as soon as possible, as I must confirm the plans with my manager by Friday.\nSincerely, Daniel Moore, Westfield Insurance\n?Why did Mr. Moore write the email?|To ask for information|To cancel a reservation|To complain about a room|To confirm a payment\n?How many nights does the group plan to stay?|Two|Nine|Twelve|Thirty\n?What does Mr. Moore NOT ask about?|Parking|Breakfast|A group discount|Prices\n?Why does Mr. Moore want a quick reply?|He must confirm plans by Friday.|The event is this weekend.|His manager is away.|The hotel is almost full.\n--\nT:From: Customer Service, Nova Electronics. To: Susan Park. Subject: Your order 77120\nDear Ms. Park, thank you for your recent order. We regret to inform you that the Nova X5 tablet you ordered is temporarily out of stock. We expect a new shipment on March 20 and will send your tablet on that day.\nWe apologize for the delay. As a small thank-you for your patience, we have added a free tablet case to your order. If you would prefer not to wait, you can cancel your order and receive a full refund by replying to this email. Otherwise, you do not need to do anything.\nBest regards, Tom Baker, Customer Service\n?What is the main purpose of the email?|To explain a delay|To advertise a new tablet|To request a payment|To confirm a delivery address\n?What will Ms. Park receive for free?|A tablet case|A second tablet|Faster delivery|A discount coupon\n?How can Ms. Park get a refund?|By replying to the email|By calling the store|By returning the tablet|By visiting the website\n?What should Ms. Park do if she is willing to wait?|Nothing|Send a confirmation|Pay an extra fee|Choose another model\n[P3]\nA:Hi, Robert. Did you get my email regarding the conference in Hanoi?\nB:Yes, I did. I'm sorry I haven't replied yet. I was waiting for confirmation from the hotel.\nA:No problem. Have they confirmed the rooms?\nB:They just did. I'll forward their message to you right now. They need a list of guests by Wednesday.\nA:Great. I'll prepare the list this afternoon.\n?What are the speakers discussing?|Plans for a conference|A late payment|A new employee|A customer complaint\n?Why did the man not reply earlier?|He was waiting for a hotel's confirmation.|He was on vacation.|He did not receive the email.|He lost the guest list.\n?What will the woman do this afternoon?|Prepare a list|Call the hotel|Book the flights|Forward an email\n[P2]\nDid you receive my email about the meeting?|Yes, I'll reply this afternoon.|In the meeting room.|It's a long email.\nCould you forward that message to me?|Sure, what's your address?|It moved forward.|Yes, I got the message.\nWhen should I confirm the reservation?|As soon as possible.|At the hotel.|For three nights.\nWho is the recipient of this package?|It's for Ms. Sato in accounting.|By express mail.|I received it.\n[P5]\nI am writing 【regarding|regard|regarded|regards to】 your inquiry of June 2. >> \"Regarding\" là giới từ: về việc.\nPlease 【notify|notice|note|notion】 us of any change in your address. >> \"Notify + người + of\": thông báo cho ai về việc gì.\nWe would 【appreciate|appreciative|appreciation|appreciated】 your reply by Friday. >> Sau \"would\" cần động từ nguyên mẫu.\nA 【confirmation|confirm|confirmed|confirming】 email will be sent to you within an hour. >> Danh từ ghép: confirmation email.\nThank you for your 【inquiry|inquire|inquired|inquiring】 about our services. >> Sau \"your\" cần danh từ.\nPlease find the price list 【enclosed|enclose|enclosing|encloses】 with this letter. >> Cụm cố định trong thư: Please find … enclosed (xin xem … gửi kèm).\n[P6]\nT:From: Mia Torres. To: All sales staff. Subject: Customer survey results\nHello everyone, I have attached the results of last month's customer survey. Overall, customers are very satisfied with our products. __(1)__, several people said that our replies to email inquiries are too slow. From next week, we will try to __(2)__ to every customer email within one business day. __(3)__ Please read the attached report before Thursday's meeting and let me know if you have any questions. I __(4)__ your hard work.\nMia\n?(1)|However|Therefore|For example|In addition >> Câu sau là một điểm chưa tốt, ngược với ý hài lòng ở câu trước.\n?(2)|reply|inquire|forward|notify >> \"Reply to an email\": trả lời thư. Ba từ còn lại không đi với \"to every customer email\" theo nghĩa này.\n?(3)|We will discuss how to do this at our next meeting.|The survey was printed on blue paper.|Our store opens at nine every day.|Thank you for your order.\n?(4)|appreciate|appreciation|appreciative|appreciating >> Câu cần động từ chính ở hiện tại.\n##C3|Part 3: chi tiết và việc sắp làm|Câu hỏi thứ hai và thứ ba của mỗi đoạn\n>Sau câu ý chính là hai câu về chi tiết: lý do, vấn đề, lời đề nghị, và \"What will the man do next?\". Bài này dạy bạn nghe đúng chỗ.\n[V]Sắp xếp công việc\narrange|sắp xếp|I will ＊ a meeting with the supplier for next week.\nreschedule|dời lịch|The dentist had to ＊ my appointment from Monday to Thursday.\nin advance|trước, từ trước|Please book your tickets two weeks ＊.\nset up|lắp đặt, chuẩn bị, thiết lập|We need to ＊ the chairs and the screen before the guests arrive.\nestimate|bản ước tính; ước tính|The repair shop gave me an ＊ of 300 dollars.\noption|lựa chọn|There are two ＊s: pay now or pay monthly.\nprefer|thích hơn|I ＊ tea to coffee in the morning.\nsuggest|đề nghị, gợi ý|I ＊ that we take a taxi; it is faster.\nsuitable|phù hợp|This room is not ＊ for a large meeting; it is too small.\ndouble-check|kiểm tra lại cho chắc|Please ＊ the address before you send the package.\ndrop off|mang đến để lại, thả xuống|I will ＊ the documents at your office on my way home.\npick up|đến lấy, đón|You can ＊ your order at the store after three o'clock.\n[N]\nCâu hỏi chi tiết thường nêu rõ người nào: \"What does the woman ask about?\", \"Why is the man concerned?\". Hãy chú ý lời của đúng người đó. Từ báo hiệu vấn đề: but, unfortunately, I'm afraid, the problem is. Từ báo hiệu đề nghị: Why don't you, How about, You could, I suggest, Let me.\nCâu hỏi cuối rất hay là \"What will the man do next?\" hoặc \"What does the woman say she will do?\". Đáp án nằm ở lượt lời cuối cùng, thường mở bằng \"I'll…\" hoặc \"Let me…\". Đừng mất tập trung ở mười giây cuối.\nĐáp án luôn được diễn đạt lại. Băng nói \"I'll email you the estimate\", đáp án ghi \"Send a document\".\n[P3]\nA:Hello, I'd like to pick up the jacket I dropped off for cleaning on Monday. Here's my ticket.\nB:Let me check. I'm sorry, it isn't ready yet. Our machine was out of order yesterday.\nA:Oh, no. I need it for a wedding on Saturday.\nB:Don't worry. It will be ready tomorrow afternoon. I can deliver it to your home for free, since it's our mistake.\nA:That would be great. Let me write down my address for you.\n?Why is the jacket not ready?|A machine was not working.|The shop lost the ticket.|The woman came too early.|The jacket was damaged.\n?Why does the woman need the jacket?|For a wedding|For a job interview|For a business trip|For a party at work\n?What does the man offer to do?|Deliver the jacket for free|Give a full refund|Clean it again|Lend her another jacket\n--\nA:Hi, Kevin. I'm setting up the room for tomorrow's training session, but the projector isn't working.\nB:Did you double-check the cable? It sometimes comes loose.\nA:I did, and I tried turning it off and on. Nothing happens.\nB:Then there may be a problem with the lamp. There's another projector in the storage room on the third floor.\nA:Good idea. I'll go and get it now, before the room is locked.\n?What is the woman preparing for?|A training session|A sales meeting|A job interview|A party\n?What problem does the woman have?|A projector does not work.|A room is locked.|A cable is missing.|The training was canceled.\n?What will the woman probably do next?|Go to the storage room|Call a technician|Buy a new lamp|Reschedule the session\n--\nA:Northside Auto Repair. How can I help you?\nB:Hi, my car is making a strange noise when I brake. Could I bring it in today?\nA:We're fully booked today, I'm afraid. I have an opening tomorrow at eight A.M.\nB:Tomorrow morning is fine. How long will it take? I need the car for work.\nA:I'll give you an estimate after we look at it. If it takes more than a day, we can lend you a car.\n?What is the man's problem?|His car is making a noise.|His car will not start.|He had an accident.|He lost his car key.\n?When will the man bring his car in?|Tomorrow morning|This afternoon|Today at eight|Next week\n?What does the woman say she can do if the repair is long?|Lend him a car|Give him a discount|Drive him to work|Repair it at his home\n[P4]\nN:Hello, this is a message for Ms. Emily Tran. This is Jason from Bright Smile Dental. You have an appointment with us this Thursday at three, but Dr. Lee has to attend a conference on that day. I'm calling to reschedule. We have openings on Friday at ten A.M. or next Monday at four P.M. Please call us back at 555-0126 to let us know which option you prefer. We apologize for the inconvenience.\n?Why is the speaker calling?|To change an appointment|To confirm a payment|To offer a new service|To ask for directions\n?Why is Dr. Lee unavailable on Thursday?|He will be at a conference.|He is on vacation.|He is sick.|The office is closed.\n?What is the listener asked to do?|Call back with her choice|Come in on Thursday|Send an email|Pay a fee\n[P2]\nCan we reschedule our meeting for Thursday?|Sure, morning or afternoon?|It's on the schedule.|We met last week.\nWould you prefer to pick up your order or have it delivered?|I'll pick it up after work.|Yes, I'd prefer that.|It was delivered.\nHow much will the repair cost?|I'll send you an estimate today.|About two hours.|It's in the garage.\nShould I book the room in advance?|Yes, it fills up quickly.|It's a large room.|I read the book.\n[P5]\nPlease book the conference room at least two days in 【advance|advanced|advancing|advancement】. >> Cụm cố định: in advance (trước).\nCould you 【pick up|pick out of|drop|take on】 the documents from the print shop on your way back? >> \"Pick up\": đến lấy.\nThe meeting has been 【rescheduled|scheduling|schedule|reschedules】 for Friday at ten. >> Sau \"has been\" cần V3 (bị động).\nThis software is not 【suitable|suitably|suit|suiting】 for small companies. >> Sau \"is not\" cần tính từ; \"suitable for\".\nThe technician gave us an 【estimate|esteem|estate|establish】 of the repair costs. >> Hợp nghĩa: bản ước tính chi phí.\nMost customers 【prefer|preferring|preference|preferable】 to pay by card. >> Câu cần động từ chính: prefer + to V.\n##C4|Part 6: hoàn thành đoạn văn|Từ nối và câu chèn\n>Part 6 có 16 câu: giống Part 5 nhưng phải đọc cả đoạn. Bài này tập trung vào hai dạng khó nhất là chọn từ nối và chọn cả một câu để chèn.\n[V]Từ nối trong văn bản\nhowever|tuy nhiên|The hotel is expensive. ＊, it is very close to the airport.\ntherefore|vì vậy|The road is closed. ＊, we must take a different route.\nin addition|ngoài ra, thêm vào đó|The job offers a good salary. ＊, staff get free lunch every day.\nin other words|nói cách khác|The shop is closed on Sundays; ＊, you cannot buy anything there that day.\notherwise|nếu không thì|Please pay by Friday; ＊, we will have to cancel your order.\nin that case|trong trường hợp đó|Is the nine o'clock train full? ＊, I will take the one at ten.\nfor example|ví dụ|We sell many drinks, ＊, tea, coffee and juice.\ninstead|thay vào đó|The printer is broken, so use the one upstairs ＊.\nmeanwhile|trong khi đó, trong lúc chờ|Your room will be ready at three. ＊, you can leave your bags here.\nin fact|thực ra, trên thực tế|The test was not hard. ＊, it was the easiest one this year.\nunfortunately|đáng tiếc là|＊, the concert is sold out, so we cannot get tickets.\nabove all|trên hết, quan trọng nhất là|The hotel is clean, cheap and, ＊, very safe.\n[N]\nMỗi đoạn Part 6 có bốn chỗ trống: thường là hai chỗ ngữ pháp hoặc từ loại (làm như Part 5), một chỗ từ vựng hoặc từ nối phải dựa vào câu trước và câu sau, và một chỗ điền cả câu.\nVới từ nối, hãy xét quan hệ giữa câu trước và câu sau chỗ trống. Ngược chiều: However, Unfortunately. Cùng chiều, thêm ý: In addition, Moreover, Furthermore. Nguyên nhân dẫn đến kết quả: Therefore, As a result. Điều kiện ngược: Otherwise. Ví dụ: For example.\nVới câu chèn, hãy đọc câu ngay trước và ngay sau chỗ trống. Câu đúng phải nối được với cả hai. Chú ý các từ chỉ ngược về trước như this, these, it, they, such: chúng phải có thứ để chỉ tới ở câu trước. Loại ngay những câu nói về một chủ đề không có trong đoạn.\nThì của động từ ở Part 6 phụ thuộc vào cả đoạn: nếu thư nói về một sự kiện sắp diễn ra, động từ phải ở tương lai dù trong câu đó không có dấu hiệu thời gian.\n[P6]\nT:To: All employees. Subject: Office closing early on Friday\nPlease note that the office will close at 3 P.M. this Friday so that new carpets can be installed. __(1)__, all meetings scheduled for Friday afternoon must be moved to another day. The work will continue over the weekend and __(2)__ by Sunday evening. __(3)__ If you have any items on the floor near your desk, please place them on your desk or in a drawer before you leave. We __(4)__ your cooperation.\n?(1)|Therefore|However|For example|Otherwise >> Câu trước là nguyên nhân (đóng cửa sớm), câu sau là kết quả.\n?(2)|will be completed|was completed|completes|has completed >> Việc sẽ được hoàn thành (bị động, tương lai) vì thư nói về thứ Sáu tới.\n?(3)|The office will open as usual on Monday morning.|The carpets were chosen by the director.|Our sales increased last month.|Meetings are held every Friday.\n?(4)|appreciate|appreciation|appreciative|appreciating >> Câu cần động từ chính ở hiện tại.\n--\nT:Dear Mr. Cole,\nThank you for applying for the position of sales assistant at Maple Home Store. We received a large number of applications this year. __(1)__, we are not able to interview every candidate. However, we were impressed by your experience, and we would like to __(2)__ you to an interview on Tuesday, June 10, at 2 P.M. __(3)__ Please bring a photo ID and two copies of your resume. If this time is not __(4)__, please call our office to arrange another day.\nSincerely, Paula Reed, Store Manager\n?(1)|Unfortunately|Therefore|Moreover|For example >> Câu sau là tin không vui (không thể phỏng vấn hết).\n?(2)|invite|invitation|inviting|invited >> Sau \"would like to\" là động từ nguyên mẫu.\n?(3)|The interview will last about thirty minutes.|The store was opened in 2005.|Thank you for your payment.|We have already hired a sales assistant.\n?(4)|convenient|convenience|conveniently|conveniences >> Sau \"is not\" cần tính từ.\n--\nT:Notice to members of Lakeside Fitness Center\nWe are pleased to announce that our swimming pool will reopen on May 1 after two months of repairs. The pool now has a new heating system. __(1)__, the changing rooms have been completely renovated. To celebrate, all members can bring one guest free of charge __(2)__ the first week of May. __(3)__ Please remember that swimming caps must be worn at all times; __(4)__, you will not be allowed to enter the pool.\n?(1)|In addition|However|Otherwise|As a result >> Thêm một cải tiến nữa: quan hệ cùng chiều, thêm ý.\n?(2)|during|while|until|by >> Trước danh từ chỉ một giai đoạn: during.\n?(3)|Guests must sign in at the front desk.|The pool was closed in March.|Membership fees are due in January.|Our yoga classes are full.\n?(4)|otherwise|therefore|moreover|for example >> \"Nếu không thì\" sẽ không được vào hồ.\n[P7]\nT:Sunrise Bakery: A note to our customers\nFor ten years, Sunrise Bakery has served fresh bread to this neighborhood. Unfortunately, the cost of flour and butter has risen sharply this year. As a result, we must raise our prices by about five percent from August 1.\nHowever, we want to thank our regular customers. Therefore, anyone with a Sunrise member card will continue to pay the old prices until the end of the year. In addition, members will receive a free coffee with every purchase in August. If you do not have a card yet, you can get one at the counter. It is free and takes only a minute.\n?What is the main purpose of the notice?|To announce a price increase|To advertise a new product|To announce a store closing|To introduce a new owner\n?Why are prices going up?|Ingredients cost more.|The rent has increased.|The bakery is moving.|New staff were hired.\n?What is indicated about members?|They can pay the old prices this year.|They must pay a fee for the card.|They get free bread in August.|They receive a five percent discount forever.\n?How can customers get a member card?|By asking at the counter|By applying online|By buying ten items|By calling the bakery\n[P2]\nThe printer is broken again.|Use the one in room 5 instead.|It prints quickly.|Yes, I printed it.\nIs the hotel far from the airport?|No. In fact, you can walk there.|It's a nice hotel.|By plane.\nShould we order more paper?|Yes; otherwise, we'll run out by Friday.|It's on the paper.|We ordered pizza.\nWhy was the meeting canceled?|Unfortunately, the manager is sick.|In the meeting room.|It's been canceled.\n[P5]\nThe restaurant was fully booked. 【Therefore|However|Otherwise|For example】, we had dinner at the hotel. >> Kết quả của việc nhà hàng hết chỗ.\nThe new model is lighter. 【In addition|Otherwise|Instead of|Although】, it has a longer battery life. >> Thêm một ưu điểm nữa.\nPlease arrive by 8:45; 【otherwise|moreover|therefore|for example】, you may miss the opening speech. >> \"Nếu không thì\".\nThe office is closed today. 【However|Therefore|Moreover|As a result】, you can still reach us by email. >> Hai ý ngược chiều.\nWe did not receive enough applications. 【As a result|Otherwise|In fact of|Instead of】, the deadline was extended. >> Kết quả của việc thiếu hồ sơ.\nThe elevator is being repaired. 【Meanwhile|Otherwise|Therefore not|For example】, please use the stairs. >> \"Trong lúc đó\".\n##C5|Part 4: thông báo và tin nhắn thoại|Bắt ý chính của một bài nói\n>Part 4 có 10 bài nói của một người. Hai loại dễ gặp nhất là tin nhắn thoại và thông báo nơi công cộng. Mỗi loại có một khung cố định; biết khung là đoán trước được câu hỏi.\n[V]Điện thoại và thông báo\nmessage|tin nhắn, lời nhắn|Ms. Lee is not here. Would you like to leave a ＊?\nextension|số máy lẻ|You can reach me at ＊ 204.\non hold|đang chờ máy|I was ＊ for ten minutes before someone answered.\nleave a message|để lại lời nhắn|Nobody answered, so I decided to ＊ after the beep.\ncall back|gọi lại|I am busy now. Can I ＊ in ten minutes?\nreach|liên lạc được với|You can ＊ me on my cell phone after six.\noperator|tổng đài viên|Press zero to speak to an ＊.\nannouncement|thông báo (nói trước đám đông)|There was an ＊ that the train would be late.\nattention|sự chú ý|May I have your ＊, please? The store will close in ten minutes.\npress|bấm, nhấn|To hear this message again, ＊ one.\ndial|quay số, bấm số|In an emergency, ＊ 115 for an ambulance.\ntransfer|chuyển (cuộc gọi, tiền)|Please hold while I ＊ your call to the sales department.\n[N]\nKhung của một tin nhắn thoại: người gọi xưng tên và nơi làm việc, nêu lý do gọi (\"I'm calling about…\", \"I'm calling to let you know…\"), đưa chi tiết, rồi yêu cầu người nghe làm gì (\"Please call me back at…\"). Ba câu hỏi thường là: ai gọi hoặc gọi từ đâu, mục đích hoặc vấn đề, người nghe được yêu cầu làm gì.\nKhung của một thông báo nơi công cộng: lời gọi chú ý (\"Attention, shoppers\", \"Attention, passengers\") cho biết bạn đang ở đâu, tiếp theo là nội dung thay đổi, lý do, rồi lời khuyên hoặc yêu cầu.\nLoại thứ ba là lời thoại tự động của tổng đài: \"Thank you for calling… For store hours, press one…\". Câu hỏi thường hỏi loại hình doanh nghiệp, giờ mở cửa, và phải bấm phím nào để làm gì.\n[P4]\nN:Hello, Mr. Grant. This is Linda Perez from City Bank. I'm calling about the new credit card you requested last week. Your card is ready, but we need to confirm your home address before we can mail it. Please call me back at 555-0171, extension 12, any time before five today. If I'm not at my desk, press zero and the operator will take a message. Thank you.\n?Where does the speaker work?|At a bank|At a post office|At a credit card factory|At a hotel\n?Why is the speaker calling?|To confirm an address|To cancel a card|To offer a loan|To report a late payment\n?What should the listener do if the speaker is not available?|Press zero|Call the next day|Visit the bank|Send an email\n--\nN:Attention, shoppers. The time is now eight forty-five, and Fresh Mart will be closing in fifteen minutes. Please bring your items to the checkout counters at the front of the store. Our customer service desk has already closed, so if you need to return an item, please come back tomorrow after nine A.M. Don't forget that our weekend sale on fruit and vegetables starts tomorrow. Thank you for shopping at Fresh Mart.\n?Where is the announcement being made?|In a supermarket|In a train station|In a library|In a restaurant\n?When will the store close?|At nine o'clock|At eight forty-five|In an hour|At eight fifteen\n?What does the speaker say will begin tomorrow?|A sale|New opening hours|A cooking class|Repairs to the store\n--\nN:Thank you for calling Evergreen Medical Clinic. Our office is currently closed. Our hours are Monday through Friday, eight A.M. to six P.M., and Saturday from nine to noon. To make or change an appointment, press one and leave a message with your name and phone number, and we will call you back on the next business day. To hear our address and directions, press two. If this is an emergency, please hang up and dial 115.\n?What kind of business is the message for?|A medical clinic|A pharmacy|An insurance company|A dental school\n?When is the office open on Saturdays?|From nine to noon|From eight to six|From nine to six|It is closed.\n?Why would a caller press two?|To hear directions|To leave a message|To speak to a doctor|To change an appointment\n[P3]\nA:Good afternoon, Apex Software. How may I direct your call?\nB:Hello, I'd like to speak to someone in technical support, please. I've been having trouble installing your program.\nA:I'm sorry, all of our technicians are helping other customers right now. Would you like to wait on hold or leave a message?\nB:How long is the wait?\nA:About fifteen minutes. If you leave your number, someone will call you back within an hour.\nB:Then I'll leave my number. It's 555-0139.\n?Why is the man calling?|He has a problem with some software.|He wants to buy a program.|He is returning a call.|He wants to apply for a job.\n?Why can't the man speak to a technician now?|They are all busy.|The office is closed.|They are at lunch.|He called the wrong number.\n?What does the man decide to do?|Leave his phone number|Wait on hold|Call back tomorrow|Send an email\n[P2]\nMay I speak to Mr. Alvarez, please?|He's on another line. Can you hold?|He spoke very well.|Yes, you may leave.\nWould you like to leave a message?|No, thanks. I'll call back later.|I left it at home.|It's a long message.\nHow can I reach the sales department?|Dial extension 300.|They sell computers.|It's within reach.\nCould you transfer me to customer service?|One moment, please.|By bank transfer.|Yes, the service is good.\n[P5]\nPlease hold while I 【transfer|translate|transport|transform】 your call to the manager. >> \"Transfer a call\": chuyển cuộc gọi.\nMr. Lim is not available. Would you like to 【leave|let|live|lend】 a message? >> Cụm cố định: leave a message.\nYou can 【reach|arrive|get|touch】 me at this number until six o'clock. >> \"Reach + người\": liên lạc được với ai (không có giới từ).\nMay I have your 【attention|attend|attentive|attentively】, please? >> Sau \"your\" cần danh từ.\nTo speak to an operator, 【press|pressure|pressing|pressed】 zero. >> Câu mệnh lệnh mở bằng động từ nguyên mẫu.\nI'll call you 【back|again to|return|behind】 as soon as the meeting ends. >> Cụm động từ: call back (gọi lại).\n\n##C6|Part 7: thông báo và nội quy|Câu hỏi NOT và câu hỏi \"điều gì đúng\"\n>Thông báo, memo và nội quy là nhóm văn bản lớn thứ hai ở Part 7. Bài này luyện hai dạng câu hỏi tốn thời gian nhất: \"What is NOT mentioned?\" và \"What is indicated about…?\".\n[V]Chính sách công ty\neffective|có hiệu lực|The new prices are ＊ from the first of May.\nregulation|quy định|A new safety ＊ says that all workers must wear helmets.\nrevise|sửa đổi, chỉnh lại|We need to ＊ the schedule because two speakers canceled.\nhandbook|sổ tay|Every new worker receives an employee ＊ with all the company rules.\nreimburse|hoàn trả (chi phí đã ứng trước)|The company will ＊ you for the cost of your train ticket.\nreimbursement|khoản hoàn trả chi phí|To receive ＊ for travel costs, you must show your receipts.\napproval|sự chấp thuận|You need your manager's ＊ before you take a day off.\nsubmit|nộp|Please ＊ your report by five o'clock on Friday.\nguideline|hướng dẫn, nguyên tắc chỉ đạo|Please follow each ＊ in this list when you write to customers.\neligible|đủ điều kiện|Staff who have worked here for one year are ＊ for extra holidays.\nattendance|sự có mặt, việc tham dự|＊ at the Monday meeting is required for all managers.\ndress code|quy định về trang phục|The office ＊ says that men must wear a tie.\n[N]\nCâu hỏi NOT: \"What is NOT mentioned as a requirement?\", \"What is NOT included in the price?\". Ba lựa chọn có trong bài, một lựa chọn không có. Cách làm: lấy từng lựa chọn dò ngược vào bài và đánh dấu; cái nào không tìm thấy là đáp án. Dạng này tốn thời gian, nên trong đề thật hãy làm sau các câu chi tiết.\nCâu hỏi \"điều gì đúng\": \"What is indicated about the policy?\", \"What is stated about Mr. Lee?\", \"What is true about the event?\". Câu hỏi không cho bạn từ khoá để dò, nên từ khoá nằm trong bốn lựa chọn. Đáp án đúng là một câu diễn đạt lại một chi tiết trong bài; đáp án sai thường đổi một con số, một ngày hoặc một đối tượng.\nVới thông báo và nội quy, hãy chú ý ba thứ: ngày có hiệu lực, ai bị ảnh hưởng, và ngoại lệ (except, unless, only, however).\n[P7]\nT:Notice: Revised travel policy\nEffective July 1, the company's travel policy will change as follows. Employees must receive approval from their department manager at least five business days before any business trip. Flights must be booked through the company's travel office, not by employees themselves.\nThe company will reimburse the cost of flights, hotels and meals up to 60 dollars a day. Taxi fares will be reimbursed only when public transportation is not available. To receive reimbursement, submit your receipts within ten days of your return. Receipts submitted after that date will not be accepted. The full policy can be found in the employee handbook.\n?When does the new policy begin?|On July 1|In five business days|In ten days|Immediately\n?What is NOT mentioned as a cost the company will pay for?|Entertainment|Hotels|Meals|Flights\n?What is indicated about taxi fares?|They are paid back only in some cases.|They are never reimbursed.|They must be approved by the travel office.|They are limited to 60 dollars a day.\n?What must employees do to be reimbursed?|Hand in receipts within ten days|Ask the travel office for a form|Book their own flights|Sign the employee handbook\n--\nT:Oakwood Public Library: Rules for the study rooms\nThe library has four study rooms on the second floor. They are free of charge and may be used by anyone with a library card. Rooms can be reserved online or at the front desk up to one week in advance. Each reservation is for a maximum of two hours.\nGroups must have at least two people; the rooms are not for individual use. Drinks in closed bottles are allowed, but food is not. Please be quiet when you enter and leave, as the rooms are next to the reading area. If you are more than fifteen minutes late, your reservation will be canceled and the room may be given to another group.\n?Who may use the study rooms?|People who have a library card|Only university students|Anyone who pays a fee|Only library staff\n?What is true about reservations?|They can last no more than two hours.|They must be made by phone.|They cost two dollars.|They must be made a week before.\n?What is NOT allowed in the study rooms?|Eating|Drinking water from a bottle|Talking|Working in a group\n?What happens if a group arrives twenty minutes late?|It loses its reservation.|It must pay a fine.|It gets a shorter time.|It must move to the reading area.\n[P6]\nT:To: All staff. From: Personnel office. Subject: Summer dress code\nFrom June 1 to August 31, the office dress code will be more relaxed. During this period, staff __(1)__ wear short-sleeved shirts without a tie. __(2)__, shorts and sandals are still not allowed. Employees who meet customers should continue to dress formally on the days of their meetings. __(3)__ If you are not sure whether an item of clothing is acceptable, please ask your manager for __(4)__.\n?(1)|may|must not|were|have >> Được phép mặc: may + động từ nguyên mẫu.\n?(2)|However|Therefore|In addition|For example >> Ý ngược lại: vẫn không cho phép quần soóc và dép.\n?(3)|The regular dress code will return on September 1.|The office will be closed in August.|Customers must wear a tie.|The air conditioner was repaired last year.\n?(4)|advice|advise|advised|advisable >> Sau giới từ \"for\" cần danh từ: advice.\n[P4]\nN:Good morning, everyone. Before we begin today's meeting, I want to remind you about the new attendance system. Starting next Monday, all employees must use their ID cards to sign in at the front door when they arrive and when they leave. The old paper sheets will no longer be used. If you have lost your ID card, please visit the personnel office this week to get a new one. It takes about ten minutes, and the first replacement is free of charge.\n?What is the speaker mainly talking about?|A new way of recording attendance|A change in working hours|A new front door|A lost ID card\n?What will no longer be used?|Paper sheets|ID cards|The front door|The personnel office\n?What should employees without an ID card do?|Go to the personnel office this week|Sign in on paper|Pay ten dollars|Wait until next Monday\n[P2]\nWhen does the new regulation take effect?|On the first of next month.|In the handbook.|It's very effective.\nDo I need approval for this purchase?|Yes, from your department manager.|It's a good price.|I approve of it.\nWho's eligible for reimbursement?|Anyone who traveled for work.|Within ten days.|At the accounting office.\nHave you submitted your expense report?|I'll do it right after lunch.|It was expensive.|To the manager.\n[P5]\nThe new policy will be 【effective|effect|effectively|effectiveness】 from next Monday. >> Sau \"will be\" cần tính từ: có hiệu lực.\nAll travel expenses must be 【submitted|subscribed|substituted|subtracted】 with receipts. >> Hợp nghĩa: chi phí phải được nộp kèm hoá đơn.\nEmployees are 【eligible|eligibility|eligibly|illegible】 for a bonus after one year. >> \"Be eligible for\": đủ điều kiện nhận.\nThe company will 【reimburse|reimbursement|reimbursing|reimbursed】 you for the cost of the course. >> Sau \"will\" cần động từ nguyên mẫu.\nThe handbook was 【revised|reversed|reviewed by|relieved】 last year to include the new rules. >> Hợp nghĩa: sổ tay được sửa đổi để thêm quy định mới.\nYou must get your manager's 【approval|approve|approved|approving】 before ordering equipment. >> Sau sở hữu cách \"manager's\" cần danh từ.\n##C7|Part 3: ý của người nói|Câu hỏi \"What does she mean when she says…?\"\n>Mỗi đề có vài câu hỏi trích nguyên một câu nói và hỏi người nói ngụ ý gì. Bài này cũng luyện câu hỏi về lời đề nghị và lời yêu cầu.\n[V]Ý kiến và cảm xúc\nagree|đồng ý|I ＊ with you; the plan is too expensive.\ndisagree|không đồng ý|Some managers ＊ with the decision and want to change it.\nconcern|mối lo ngại|My main ＊ is the cost; can we really pay for this?\ndoubt|nghi ngờ|I ＊ that we can finish by Friday; there is too much work.\nconvince|thuyết phục|It was hard to ＊ the director to change his mind.\nopinion|ý kiến|In my ＊, the blue design is better than the red one.\nimpressed|ấn tượng (tốt)|The customers were ＊ by the quality of our work.\ndisappointed|thất vọng|We were ＊ with the hotel; the room was small and dirty.\nhesitate|ngần ngại, do dự|If you have any questions, do not ＊ to call me.\nsuggestion|đề xuất, gợi ý|Thank you for your ＊; we will try the new method.\nworried|lo lắng|I am ＊ about the presentation; I have not practiced enough.\ndefinitely|chắc chắn|I will ＊ be there at nine; you can count on me.\n[N]\nCâu hỏi ý người nói có dạng: \"What does the woman mean when she says, 'I'm not sure that's possible'?\" hoặc \"Why does the man say, 'The deadline is tomorrow'?\". Câu được trích thường có nghĩa đen rất đơn giản; cái được hỏi là mục đích của nó trong tình huống: từ chối, đồng ý, tỏ ra lo ngại, giục ai đó, hay đề nghị giúp.\nCách làm: đọc trước câu trích để biết lúc nào nó xuất hiện, rồi nghe thật kỹ câu ngay trước nó. Cùng một câu \"I have a meeting at three\" có thể là lời từ chối (nếu trước đó có lời mời) hoặc lời giải thích vì sao phải vội.\nCâu hỏi về đề nghị và yêu cầu: \"What does the man suggest?\", \"What does the woman ask the man to do?\". Nghe các cụm Why don't you, How about, You should, Could you, Would you mind.\n[P3]\nA:Paul, have you seen the new design for the company website?\nB:I have. The colors look great, but I'm worried that the text is too small.\nA:I agree. I had to move closer to my screen to read it. Should we tell the design team?\nB:Well, they've been working on it for two months.\nA:I know, but customers need to read it easily. Why don't we send them our suggestions by email?\nB:All right. I'll write a short message this afternoon.\n?What is the man concerned about?|The size of the text|The colors of the design|The cost of the website|The deadline\n?What does the man imply when he says, \"they've been working on it for two months\"?|He hesitates to criticize the team.|He thinks the team is too slow.|He wants to join the team.|He thinks the design is finished.\n?What will the man do this afternoon?|Write an email|Meet the design team|Change the colors|Call a customer\n--\nA:Excuse me, I bought this blender here yesterday, but it's the wrong color. Can I exchange it for a white one?\nB:Let me check. I'm sorry, the white ones are sold out. We'll get more next Tuesday.\nA:Next Tuesday? I'm leaving on a trip on Monday.\nB:I see. In that case, I could give you a refund now, or I could send the white one to your home address next week.\nA:Sending it would be perfect. Here's my address.\n?What does the woman want to do?|Exchange a product|Buy a second blender|Complain about the price|Return a broken item\n?What does the woman mean when she says, \"I'm leaving on a trip on Monday\"?|She cannot come back to the store on Tuesday.|She wants a discount.|She needs the blender for the trip.|She wants to cancel her trip.\n?What does the man offer to do?|Deliver the item to her home|Give her a different color for free|Call another store|Hold the item until Monday\n--\nA:Thanks for presenting your plan, Ms. Novak. I was impressed by the marketing ideas.\nB:Thank you. Do you think the director will approve the budget?\nA:To be honest, I doubt it. It's twice as much as last year's.\nB:But the results would be much better. Could you help me convince him?\nA:I can't promise anything, but I'd suggest adding a page that shows the expected profit. Numbers always help.\nB:That's a good idea. I'll add it before Friday's meeting.\n?What did the man like about the plan?|The marketing ideas|The low cost|The short schedule|The design\n?Why does the man say, \"It's twice as much as last year's\"?|To explain why the budget may be rejected|To praise the plan|To suggest spending more|To correct a mistake\n?What does the man suggest?|Adding information about profit|Asking for less money|Postponing the meeting|Talking to another director\n[P7]\nT:Customer review: Harbor View Restaurant\nI visited Harbor View last Saturday with my family. We had heard good things about it, so we were excited. The location is wonderful, and our table had a view of the boats. The seafood soup was delicious, and the staff were friendly.\nHowever, I was disappointed with the service. We waited forty minutes for our main dishes, and two of them were cold when they arrived. When I told the waiter, he apologized and brought new dishes quickly, and the manager took the desserts off our bill. I appreciated that. I would definitely go back for the food and the view, but I would not go on a busy Saturday night again.\n?What did the writer like about the restaurant?|The food and the view|The fast service|The low prices|The large tables\n?What problem did the writer have?|The main dishes came late and cold.|The soup was too salty.|The table was not ready.|The bill was wrong.\n?What did the manager do?|Removed the desserts from the bill|Offered a free meal next time|Moved the family to a better table|Gave them a discount card\n?What does the writer suggest about going back?|She would choose a quieter time.|She will never return.|She will only order soup.|She will go every Saturday.\n[P2]\nWhat's your opinion of the new logo?|I think it looks very modern.|It's in the design folder.|Yes, it's mine.\nI doubt we can finish this by five.|Don't worry. I'll stay and help.|It's five dollars.|No doubt about it.\nWere the customers satisfied with the presentation?|They seemed very impressed.|In the conference room.|It was presented yesterday.\nWhy don't we ask Ms. Chen for a suggestion?|Good thinking. She has a lot of experience.|Because she suggested it.|She asked me yesterday.\n[P5]\nIf you have any concerns, please do not 【hesitate|hesitation|hesitant|hesitated】 to contact us. >> Sau \"do not\" cần động từ nguyên mẫu; cụm quen thuộc: do not hesitate to.\nThe director was 【impressed|impressive|impression|impressing】 by the team's results. >> Người cảm thấy ấn tượng: tính t
