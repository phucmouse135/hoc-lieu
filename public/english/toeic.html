 what time is the shop open tonight?|Six o'clock|Eight o'clock|Five o'clock|Seven o'clock\n--\nN:Good morning, passengers. This is the seven forty express to Northfield. Because of signal repairs, this train will make an additional stop at Ashby today, and we expect to arrive in Northfield about ten minutes late. The café car is located in the middle of the train and is now open for hot drinks and breakfast. Passengers changing at Northfield for the airport line should use platform five. Thank you for your understanding.\n?Why will the train be late?|Because of signal repairs|Because of bad weather|Because of an accident|Because of crowded platforms\n?What does the speaker say about the café car?|It is serving breakfast.|It is closed today.|It is at the front of the train.|It accepts only cash.\n?Which passengers should use platform five?|Those going to the airport|Those getting off at Ashby|Those in first class|Those leaving the station\n--\nN:Planning a trip this summer? Rent your car from DriveAway. We have more than fifty locations, including every major airport in the country. All of our cars are less than two years old, and every rental includes unlimited mileage and free roadside assistance. Book before June first and receive a free upgrade to a larger car. Visit our website or call us today.\n?What kind of business is being advertised?|A car rental company|An airline|A travel agency|A repair shop\n?What is included in every rental?|Unlimited mileage|Free fuel|A driver|A child seat\n?How can customers get a free upgrade?|By booking before June first|By renting at an airport|By renting for a week|By joining a club\n--\nN:Thanks for staying a few extra minutes. I want to share some numbers from last month. Our average delivery time was four days. Our website promises two. I don't need to tell you what customers think about that. So, beginning next week, the warehouse will add a second shift, from two P.M. to ten P.M. We're hiring six people for it. If you know anyone who's looking for work, please ask them to contact the personnel office.\n?What problem does the speaker describe?|Deliveries are taking too long.|The website is not working.|Several employees have quit.|Costs have increased.\n?What does the speaker imply when she says, \"Our website promises two\"?|The company is not meeting its own standard.|The website contains an error.|Customers prefer two-day delivery.|Two employees are responsible.\n?What will happen next week?|A second shift will begin.|A new website will be launched.|A sale will start.|The warehouse will close.\n--\nN:Good morning, and welcome to your first day at Halden Insurance. I'm Priya from the personnel office. This morning, you'll complete some forms and receive your ID cards. At eleven, I'll take you on a tour of the building. After lunch in the cafeteria, which is free today, you'll meet your team leaders. One reminder: your ID card opens the main doors, so please keep it with you at all times.\n?Who are the listeners?|New employees|Customers|Visitors on a tour|Team leaders\n?What will happen at eleven?|A tour of the building|Lunch in the cafeteria|A meeting with team leaders|The completion of forms\n?What does the speaker remind listeners to do?|Carry their ID cards|Pay for lunch|Sign in every day|Wear a uniform\n--\nN:And finally, the annual Riverside Food Festival returns this weekend. More than sixty local restaurants will offer small dishes for three dollars each. This year, for the first time, the festival will stay open until eleven P.M. on Saturday, with live music from seven. Organizers recommend using public transportation, since parking near the river is very limited. A free shuttle bus will run from Central Station every fifteen minutes.\n?What is the report about?|A food festival|A restaurant opening|A concert tour|A traffic problem\n?What is new this year?|Longer hours on Saturday|Lower prices|A new location|Free food\n?What do organizers recommend?|Taking public transportation|Arriving early|Bringing cash|Booking a table\n--\nN:Could I have everyone's attention? As you know, today is Martin's last day with us after twenty-six years in the accounting department. Martin trained half the people in this room, including me. We've prepared a small gift, a set of golf clubs, because he tells us he finally plans to learn. There's cake in the break room, so please join us there at three. Martin, thank you for everything.\n?What is the occasion?|A colleague's retirement|A birthday|A promotion|The arrival of a new employee\n?What gift has been prepared?|Golf clubs|A watch|A cake|A trip\n?What are listeners invited to do at three?|Go to the break room|Attend a training session|Sign a card|Play golf\n--\nN:Thank you for calling Brightline Internet support. We are aware of a service interruption in the downtown area and expect it to be fixed by four P.M. today. If you are calling about this problem, you do not need to stay on the line. Customers who are affected will automatically receive a credit on their next bill. For all other questions, please press one, and a representative will be with you shortly.\n?What is the message mainly about?|A service interruption|A new internet plan|A price increase|An office move\n?When is the problem expected to be solved?|By four P.M. today|Tomorrow morning|Within an hour|Next week\n?What will affected customers receive?|A credit on their bill|A new modem|A phone call|A gift card\n--\n@table|Today's agenda|Time,Item,Presenter|2:00,Sales update,Carlos|2:20,New product demo,Mei|2:50,Customer survey results,Anita|3:10,Budget for next quarter,Carlos\nN:Good afternoon, everyone. Let's get started. A quick change to the agenda: Mei's flight was delayed, and she won't arrive until about three, so we'll move her item to the end. Everything else will simply start earlier. Also, the director would like a copy of the survey results, so Anita, please email your slides to her after the meeting.\n?Why is the agenda being changed?|A presenter will arrive late.|The director is absent.|The room is not available.|A computer is broken.\n?Look at the graphic. Which item will be presented last?|New product demo|Sales update|Customer survey results|Budget for next quarter >> Phần của Mei được chuyển xuống cuối: New product demo.\n?What is Anita asked to do?|Send her slides to the director|Present first|Pick Mei up at the airport|Print the agenda\n--\n@table|Weekend sale at Home and Garden|Department,Discount|Garden tools,10 percent|Outdoor furniture,20 percent|Lighting,30 percent|Paint,40 percent\nN:Attention, shoppers. Our weekend sale ends today at six P.M. If you're planning to redecorate, don't miss the department with the biggest discount, on the second floor. Members of our rewards program get an additional five percent off everything. Not a member? You can sign up for free at any register. And remember, we offer free delivery on purchases over one hundred dollars.\n?When does the sale end?|Today at six P.M.|On Sunday evening|Tomorrow at noon|Next weekend\n?Look at the graphic. Which department is on the second floor?|Paint|Garden tools|Outdoor furniture|Lighting >> Gian có mức giảm lớn nhất, 40%, là Paint.\n?How can shoppers get an additional discount?|By joining a rewards program|By spending one hundred dollars|By using a coupon|By paying in cash\n[P5]\nThe 【majority|major|majoring|majorly】 of our customers prefer to shop online. >> \"The majority of\": phần lớn.\nMr. Evans will 【briefly|brief|briefing|briefed】 explain the new procedure at the start of the meeting. >> Giữa \"will\" và động từ: trạng từ.\nThe package was sent to the wrong address 【because of|because|although|so that】 a clerical error. >> Sau chỗ trống là cụm danh từ: because of.\nStaff members are encouraged to share 【their|they|them|theirs】 ideas with management. >> Trước danh từ \"ideas\": tính từ sở hữu.\nThe new office is 【twice|double|two|second】 as large as the old one. >> \"Twice as … as\": gấp đôi.\nWe are pleased to 【announce|announcement|announcing|announced】 the opening of our tenth store. >> Sau \"pleased to\" là động từ nguyên mẫu.\nThe safety inspection will be 【conducted|conductor|conducting|conduct】 by an independent company. >> Bị động: will be + V3 + by.\nThe restaurant is popular 【among|between|during|toward】 local office workers. >> \"Popular among\": được ưa chuộng trong nhóm người.\nApplications 【received|receiving|receive|receives】 after the deadline will not be considered. >> Mệnh đề rút gọn bị động: hồ sơ được nhận.\nMs. Wong is the most 【qualified|qualify|qualification|qualifying】 candidate for the position. >> Tính từ cố định: qualified.\nThe company has grown 【rapidly|rapid|rapidity|more rapid】 since it was founded in 2015. >> Bổ nghĩa cho \"has grown\": trạng từ.\nPlease contact our office 【if|whether|that|despite】 you have not received your order within ten days. >> Điều kiện: if.\nThe director insisted that every department 【reduce|reduces|reduced|reducing】 its spending. >> Sau \"insisted that\" là động từ nguyên mẫu.\nThe printer on the second floor is 【temporarily|temporary|temporariness|temporaries】 out of service. >> Bổ nghĩa cho cụm \"out of service\": trạng từ.\nMr. Cho was offered the job 【despite|although|even|however】 his lack of experience. >> Sau chỗ trống là cụm danh từ: despite.\nThe agreement was signed 【by|from|with|of】 representatives of both companies. >> Bị động + by + người thực hiện.\nIt is 【essential|essence|essentially|essentials】 that all forms be signed before submission. >> Sau \"It is\" cần tính từ.\nThe museum's new wing, 【which|who|where|whose】 opened last month, has attracted many visitors. >> Vật + động từ \"opened\": which.\nPrices are 【subject|subjected|subjective|subjecting】 to change without notice. >> Cụm cố định: be subject to change.\nThe manager was satisfied 【with|at|for|on】 the team's performance this quarter. >> \"Satisfied with\".\nNot only 【did the company|the company did|the company|did company】 lower its prices, but it also improved its service. >> \"Not only\" đầu câu: đảo trợ động từ lên trước chủ ngữ.\nMs. Rivera, 【along with|as well|in addition|besides of】 two colleagues, will represent the company at the fair. >> \"Along with + danh từ\": cùng với.\nThe workshop is designed to help managers communicate more 【effectively|effective|effect|effectiveness】. >> Bổ nghĩa cho \"communicate\": trạng từ.\nPlease return the signed contract at your earliest 【convenience|convenient|conveniently|conveniences】. >> Cụm cố định: at your earliest convenience.\nThe bridge will remain closed 【while|during|by|for】 repairs are being carried out. >> Sau chỗ trống là mệnh đề: while.\nThe firm is seeking an assistant who is 【proficient|profitable|prominent|protective】 in both English and Chinese. >> \"Proficient in\": thành thạo.\nTicket sales for the concert were 【lower|low|lowest|lowly】 than the organizers had hoped. >> Có \"than\": so sánh hơn.\nAll expenses must be approved 【in advance|advancing|ahead|in front】 by a manager. >> Cụm cố định: in advance.\nThe hotel 【accommodates|accompanies|accomplishes|accumulates】 up to three hundred guests. >> \"Accommodate\": chứa được.\n【Once|Whereas|Despite|Unless】 the new system is installed, orders will be processed twice as fast. >> \"Một khi\" + mệnh đề: Once.\n[P6]\nT:To: Mr. Henry Wallace. From: Trailhead Outdoor Store. Subject: Good news about your order\nDear Mr. Wallace, we are happy to tell you that the hiking boots you ordered are back in stock. Your order was __(1)__ this morning and should arrive within three business days. __(2)__ We are sorry that you had to wait longer than expected. To thank you for your __(3)__, we have included a pair of hiking socks in your package at no charge. If the boots do not fit, you may return them __(4)__ thirty days for a full refund.\n?(1)|dispatched|dispatch|dispatching|dispatches >> Bị động: was + V3; đơn hàng đã được gửi đi.\n?(2)|You can follow its progress with the tracking number below.|The store opened in 1998.|Boots are sold in pairs.|Your payment could not be processed.\n?(3)|patience|patient|patiently|patients >> Sau \"your\" cần danh từ.\n?(4)|within|until|by|since >> \"Trong vòng\" ba mươi ngày: within.\n--\nT:To: All employees. From: Facilities office. Subject: Parking permits\nAll current parking permits will expire on December 31. Employees who wish to continue parking in the company garage next year must apply for a new permit __(1)__ December 15. __(2)__ The fee will remain the same as this year: 20 dollars per month, which is taken __(3)__ from your salary. Because the number of spaces is limited, permits will be issued in the order in which applications __(4)__.\n?(1)|by|until|during|within >> Hạn chót cho việc nộp đơn: by.\n?(2)|The application form is available on the company website.|The garage was built ten years ago.|Salaries are paid monthly.|Visitors may park anywhere.\n?(3)|directly|direct|direction|directed >> Bổ nghĩa cho \"is taken\": trạng từ.\n?(4)|are received|receive|are receiving|have received >> Hồ sơ được nhận: bị động.\n--\nT:Dear Dr. Marsh,\nThank you for agreeing to speak at the Regional Health Conference on May 9. Your talk, \"Healthy Habits at Work\", __(1)__ for 10:30 A.M. in the main hall. Each speaker has forty minutes, including time for questions. __(2)__ A projector and a microphone will be provided. If you need any __(3)__ equipment, please let me know by April 25. We will, of course, cover your travel costs; simply send your receipts to me __(4)__ the conference.\nSincerely, Ellen Fox, Conference Coordinator\n?(1)|is scheduled|schedules|is scheduling|has scheduled >> Bài nói được xếp lịch: bị động.\n?(2)|We expect an audience of about two hundred people.|The conference was canceled last year.|Health is important to everyone.|The main hall is closed in May.\n?(3)|other|another|others|each other >> Trước danh từ không đếm được \"equipment\": other.\n?(4)|after|since|until|while >> Gửi hoá đơn sau hội nghị: after + danh từ.\n--\nT:City Transit: Changes to Route 22\nBeginning Monday, March 3, buses on Route 22 will no longer stop at Market Square. The change is necessary __(1)__ construction of the new pedestrian area. __(2)__ Passengers who usually board at Market Square should use the stop on Bell Street, which is about two hundred meters away. The timetable will not change. City Transit __(3)__ for the inconvenience and will announce __(4)__ the stop can be used again.\n?(1)|because of|because|so that|even though >> Sau chỗ trống là cụm danh từ: because of.\n?(2)|The work is expected to last four months.|Route 22 began in 1975.|Buses are painted green.|Tickets cost more on Sundays.\n?(3)|apologizes|apology|apologizing|apologetic >> Câu cần động từ chính, chủ ngữ số ít.\n?(4)|when|what|which|who >> \"Thông báo khi nào\" trạm dùng lại được: when.\n[P7]\nT:Notice: Swimming pool closed\nThe swimming pool will be closed from Monday, April 7, to Friday, April 11, for annual cleaning and repairs. The gym and sauna will remain open as usual. Members who have paid for swimming lessons that week will receive a credit for one extra lesson. We apologize for the inconvenience.\n?Why will the pool be closed?|For maintenance|For a public holiday|For a competition|For staff training\n?What will some members receive?|Credit for a lesson|A cash refund|Free use of the sauna|An extra week of membership\n--\nT:Text message chain\nDana Kovac (11:20 A.M.): Hi, Paul. I'm at the supplier's warehouse. They only have 40 of the blue folders, not 60.\nPaul Reiner (11:22 A.M.): Can they get the rest by Friday?\nDana Kovac (11:23 A.M.): Not until next week. But they have plenty in green.\nPaul Reiner (11:25 A.M.): The color doesn't matter. Take 20 green ones.\nDana Kovac (11:26 A.M.): Will do.\n?What problem does Ms. Kovac report?|Not enough of an item is available.|The warehouse is closed.|The price has gone up.|The address was wrong.\n?At 11:25 A.M., what does Mr. Reiner mean when he writes, \"The color doesn't matter\"?|He will accept green folders.|He dislikes blue folders.|He wants to cancel the order.|He will wait until next week.\n--\nT:Parkside Apartments: Now renting\nModern one- and two-bedroom apartments, five minutes on foot from Central Station. Every apartment has a balcony, air conditioning and a fully equipped kitchen. Residents enjoy a gym on the ground floor and a garden on the roof. One-bedroom apartments start at 850 dollars per month; two-bedroom apartments start at 1,150 dollars. Pets are welcome for an additional 30 dollars per month. Visit our rental office any day between 10 A.M. and 6 P.M., or call 555-0119 to arrange a tour.\n?What is indicated about Parkside Apartments?|They are close to a train station.|They are fully furnished.|They are for sale.|They are outside the city.\n?What is NOT mentioned as a feature?|A swimming pool|A balcony|A gym|A roof garden\n?What is true about pets?|They are allowed for an extra fee.|They are not allowed.|They may stay free of charge.|Only small ones are accepted.\n--\nT:From: IT department. To: All staff. Subject: Email system maintenance\nThe company email system will be unavailable this Saturday from 10 P.M. until about 4 A.M. on Sunday while we move to a new server. During this time, you will not be able to send or receive messages. Emails sent to you during the maintenance will not be lost; they will be delivered when the system is back.\nAfter the change, mailboxes will have twice as much storage space. You will need to log in again on your phone and laptop, using the same password as before. If you have problems on Monday morning, please call the help desk at extension 400.\n?Why will the email system be unavailable?|It is being moved to a new server.|It has a virus.|There will be a power cut.|The phones are being upgraded.\n?What will happen to emails sent during the maintenance?|They will arrive later.|They will be lost.|They will be returned to the sender.|They will be saved on a phone.\n?What will staff have to do after the change?|Sign in again|Choose a new password|Call the help desk|Delete old emails\n--\nT:Coastal Air: New baggage rules from June 1\nFrom June 1, each passenger in economy class may check one bag of up to 23 kilograms free of charge. A second bag will cost 40 dollars if paid online and 55 dollars if paid at the airport. Carry-on bags must weigh no more than 8 kilograms. Members of our Gold Club may continue to check two bags at no cost. Sports equipment, such as skis and golf clubs, counts as one checked bag. Please arrive at the airport at least two hours before departure.\n?How much does a second bag cost if it is paid for at the airport?|55 dollars|40 dollars|23 dollars|Nothing\n?Who can check two bags free of charge?|Gold Club members|All economy passengers|Passengers with sports equipment|Passengers who pay online\n?What is indicated about golf clubs?|They are treated as a checked bag.|They are not allowed.|They always travel free.|They must be carried on board.\n--\nT:Local firm tries a four-day week\nMilton. Since January, the sixty employees of Carver Design have been working four days a week instead of five, with no reduction in pay. The office is now closed on Fridays.\n\"We were worried at first,\" said the company's director, Ms. Joan Carver. \"But our projects are being finished just as quickly as before.\" According to a staff survey, employees feel less tired, and the number of sick days has fallen by a third. To make the change work, the company shortened its meetings and asked clients to send requests by Thursday noon.\nNot every client was pleased, Ms. Carver admitted, and two asked for a contact person on Fridays. The company will review the trial in June before deciding whether to make it permanent.\n?What is the article mainly about?|A company's new work schedule|A design award|A hiring plan|An office move\n?What has happened since the change?|Employees have taken fewer sick days.|Projects have been finished late.|Pay has been reduced.|Several employees have left.\n?What did the company do to make the change work?|It made meetings shorter.|It hired more staff.|It opened on Saturdays.|It raised its prices.\n?What will happen in June?|The company will evaluate the trial.|The office will reopen on Fridays.|Ms. Carver will retire.|A staff survey will be carried out.\n--\nT:Letter from Northern Power\nDear Mr. Aldana, as part of our program to modernize the electricity network, we will be replacing the meter at your home with a new digital model. [1] The new meter sends readings to us automatically, so our staff will no longer need to visit your home each month.\nA technician will come to your address on Tuesday, September 9, between 8 A.M. and noon. [2] The work takes about thirty minutes, and your electricity will be turned off during that time. [3] An adult must be at home to give the technician access to the meter.\nThere is no charge for the new meter or its installation. [4] If the date is not convenient, please call us at 555-0155 at least two days in advance to choose another one.\nSincerely, Karin Holt, Customer Service\n?What is the purpose of the letter?|To announce the replacement of some equipment|To request a payment|To report a power failure|To advertise a product\n?What is an advantage of the new meter?|Monthly visits will no longer be needed.|It uses less electricity.|It lowers the monthly bill.|It is smaller.\n?What is required on September 9?|An adult must be present.|A payment must be made.|The customer must read the meter.|The customer must call the company.\n?In which of the positions marked [1], [2], [3], and [4] does the following sentence best belong? \"We therefore recommend that you turn off computers and other sensitive devices beforehand.\"|[3]|[1]|[2]|[4] >> \"Therefore\" nối với câu ngay trước vị trí [3]: điện sẽ bị ngắt trong lúc làm.\n--\nT:FreshCart: Delivery areas and times\n|Area|Delivery days|Order by|Delivery fee\n|City center|Every day|10 A.M. for same-day delivery|3 dollars\n|North and East|Monday to Saturday|8 P.M. the day before|5 dollars\n|South|Tuesday, Thursday, Saturday|8 P.M. the day before|5 dollars\n|Lake District|Saturday only|Thursday at noon|8 dollars\nDelivery is free on orders over 60 dollars in all areas except the Lake District. Customers choose a two-hour delivery window when ordering. If nobody is home, the driver will leave the order with a neighbor unless you tell us not to.\n?In which area can customers receive an order on the day they place it?|The city center|North and East|South|The Lake District\n?By when must Lake District customers place their orders?|Thursday at noon|Friday at 8 P.M.|Saturday at 10 A.M.|Any time on Saturday\n?What is indicated about delivery fees?|They are not charged on large orders in most areas.|They are the same everywhere.|They are never waived.|They must be paid in cash.\n?What normally happens if a customer is not at home?|The order is left with a neighbor.|The order is returned to the store.|The order is left at the door.|A second fee is charged.\n--\nT:Book review: \"The Quiet Manager\" by Elena Ruiz\nMost books about leadership tell managers to speak up, take charge and inspire their teams with big speeches. Elena Ruiz's new book takes a different view. After interviewing more than a hundred successful managers, she found that many of the best ones are quiet people who listen far more than they talk.\nThe book is short, and each chapter ends with a practical exercise. The chapter on running meetings is especially useful. Ruiz argues that a manager should speak last, so that others are not afraid to disagree.\nMy only criticism is that most of her examples come from large technology firms. Readers who run a small shop or restaurant may find some of the advice hard to apply. Still, I would recommend it to anyone who has just been promoted.\n?What is the main idea of the book?|Good managers are often good listeners.|Managers should give more speeches.|Technology firms have the best managers.|Meetings are a waste of time.\n?What does the reviewer like about the book?|Its practical exercises|Its many examples from small shops|Its humor|Its low price\n?The word \"apply\" in paragraph 3, line 2, is closest in meaning to|use|request|cover|attach >> \"Apply the advice\": áp dụng, dùng lời khuyên.\n?Who does the reviewer think would benefit most from the book?|New managers|Restaurant owners|Job seekers|Interviewers\n--\nT:Grand opening: Riverbend Community Center, Saturday, May 17\n|Time|Activity|Place\n|10:00 A.M.|Opening speech by Mayor Linda Shaw|Main hall\n|10:30 A.M.|Guided tours of the building (every 30 minutes)|Meet at the front desk\n|12:00 noon|Free lunch for the first 200 visitors|Garden\n|1:30 P.M.|Children's art workshop (ages 5 to 10)|Room 3\n|3:00 P.M.|Concert by the Riverbend Youth Orchestra|Main hall\nAll activities are free. Children must be accompanied by an adult. To reserve a place in the art workshop, email Tara Ng by May 14; places are limited to 20.\nT:From: Felix Braun. To: Tara Ng. Subject: Saturday's workshop\nDear Ms. Ng, I would like to reserve two places in the workshop for my daughters, who are six and eight. We also hope to stay for the event in the main hall afterward, since my older daughter has just started learning the violin. Could you tell me whether there is parking at the center? If not, we will take the bus. Thank you, Felix Braun\n?Who will speak at 10:00 A.M.?|The mayor|Tara Ng|The leader of the orchestra|Felix Braun\n?What is indicated about the lunch?|It is available to a limited number of people.|It costs a small fee.|It is served in the main hall.|It is for children only.\n?What is true about Mr. Braun's daughters?|They are the right age for the workshop.|They are too young for the workshop.|They play in the orchestra.|They will attend without an adult. >> Câu liên kết: hai bé 6 và 8 tuổi; lớp dành cho trẻ từ 5 đến 10 tuổi.\n?Which event does Mr. Braun plan to attend after the workshop?|The concert|The opening speech|A guided tour|The lunch >> Câu liên kết: sự kiện ở main hall sau lớp học 1:30 là buổi hoà nhạc lúc 3:00.\n?What does Mr. Braun ask about?|Parking|The cost|Art materials|Bus times\n--\nT:From: Marta Lindgren, Nordic Print. To: Oscar Reyes. Subject: Quote for annual report\nDear Mr. Reyes, thank you for your inquiry. Below is our quote for printing your company's annual report (48 pages, full color).\n|Copies|Price per copy|Total\n|500|4.00 dollars|2,000 dollars\n|1,000|3.20 dollars|3,200 dollars\n|2,000|2.60 dollars|5,200 dollars\nDelivery to one address is included. Printing takes six working days from the day we receive your final file. For an additional 15 percent, we can complete the job in three working days. This quote is valid for 30 days.\nT:From: Oscar Reyes. To: Marta Lindgren. Subject: Re: Quote for annual report\nDear Ms. Lindgren, thank you for the quote. We would like to order 1,000 copies. Our designer will send you the final file on Monday, June 9. The reports are needed for our shareholders' meeting on Friday, June 13, so we will need your faster service. Please deliver everything to our head office. Could you also tell me whether it is possible to see one printed sample before the whole order is produced? Regards, Oscar Reyes\n?What is indicated about the quote?|It is good for one month.|It includes design work.|It is for black-and-white printing.|It covers delivery to two addresses.\n?How long does printing normally take?|Six working days|Three working days|Thirty days|Ten working days\n?How much will Mr. Reyes most likely pay?|3,680 dollars|3,200 dollars|5,200 dollars|2,300 dollars >> Câu liên kết: 1.000 bản giá 3.200 đô la, cộng 15% cho dịch vụ nhanh (480 đô la).\n?Why does Mr. Reyes need the faster service?|The reports are needed fewer than six working days after the file is sent.|His designer is late.|He wants a discount.|He needs a printed sample. >> Câu liên kết: gửi tệp ngày 9 tháng 6, cần cho ngày 13 tháng 6; in thường mất sáu ngày làm việc.\n?What does Mr. Reyes ask about?|Seeing a sample first|Changing the paper|Paying later|Delivery to two offices\n--\nT:Alpine Rail: Travel passes\n|Pass|Valid for|Price (adult)|Price (under 26)\n|3-day pass|Any 3 days within one month|180 dollars|140 dollars\n|5-day pass|Any 5 days within one month|260 dollars|200 dollars\n|8-day pass|Any 8 days within one month|350 dollars|270 dollars\nPasses are valid on all regular trains. Seat reservations on high-speed trains cost 10 dollars per journey and are required. Passes cannot be refunded after the first day of use. Children under 6 travel free with an adult.\nT:From: Ines Carvalho. To: Alpine Rail customer service. Subject: Which pass?\nHello, my husband and I will travel around the country with our 19-year-old son from July 3 to July 20. We plan to take trains on five different days. On two of those days, we would like to use the high-speed train between the capital and the coast. Could you tell me the total cost for the three of us, and whether we can buy the passes at the station when we arrive? Thank you, Ines Carvalho\nT:From: Tomas Weber, Alpine Rail customer service. To: Ines Carvalho. Subject: Re: Which pass?\nDear Ms. Carvalho, thank you for your message. Based on your plans, the 5-day pass is the right choice for each of you. Your son qualifies for the reduced price; he should carry his passport as proof of age. For the two high-speed journeys, each traveler will need a seat reservation for each journey, in addition to the pass.\nYou can buy passes at any main station, but in July the ticket offices are very busy. We recommend buying them on our website, where you can also reserve seats. Kind regards, Tomas Weber\n?What is indicated about the passes?|The travel days do not have to be in a row.|They are valid for one year.|They include seats on high-speed trains.|They can be refunded at any time.\n?How much will the three passes cost in total?|720 dollars|780 dollars|600 dollars|540 dollars >> Câu liên kết: hai vé người lớn 260 đô la và một vé dưới 26 tuổi 200 đô la.\n?How much will the family pay for seat reservations?|60 dollars|20 dollars|30 dollars|10 dollars >> Câu liên kết: ba người, mỗi người hai chuyến, mỗi chuyến 10 đô la.\n?What should Ms. Carvalho's son bring?|His passport|A student card|A photograph|A receipt\n?What does Mr. Weber recommend?|Buying the passes online|Buying the passes at a station|Choosing the 8-day pass|Traveling in August\n--\nT:The Kitchen Studio: Evening classes in November\n|Date|Class|Chef|Price\n|Nov. 4|Fresh pasta|Marco Bellini|65 dollars\n|Nov. 11|Thai street food|Suda Wong|70 dollars\n|Nov. 18|French desserts|Claire Dubois|75 dollars\n|Nov. 25|Fresh pasta|Marco Bellini|65 dollars\nClasses run from 6:30 to 9:00 P.M. and are limited to twelve people. The price includes all ingredients and a recipe booklet. Cancellations made less than three days before a class cannot be refunded, but you may send a friend in your place.\nT:From: Gwen Harper. To: The Kitchen Studio. Subject: Booking\nHello, I would like to book two places in the class taught by Ms. Wong, for myself and a colleague. My colleague is allergic to peanuts. Will that be a problem? Also, I received a 20-dollar gift voucher from your studio for my birthday. Can I use it for this booking? Thank you, Gwen Harper\nT:From: Nina Petrova, The Kitchen Studio. To: Gwen Harper. Subject: Re: Booking\nDear Ms. Harper, thank you for your booking. I have reserved two places for you. Chef Wong will prepare a peanut-free version of each dish for your colleague, so there is nothing to worry about. Your voucher has been applied, and the remaining amount can be paid by card on the evening of the class.\nOne more thing: because of a private event in our main kitchen, your class will be held in our second kitchen, on the first floor of the same building. Please arrive ten minutes early. Best regards, Nina Petrova\n?What is included in the price of a class?|Ingredients|A meal voucher|An apron|Parking\n?Which class did Ms. Harper book?|Thai street food|Fresh pasta|French desserts|None of them >> Câu liên kết: lớp do cô Wong dạy là \"Thai street food\".\n?How much does Ms. Harper still have to pay?|120 dollars|140 dollars|70 dollars|50 dollars >> Câu liên kết: hai chỗ × 70 đô la = 140, trừ phiếu quà 20 đô la.\n?What does Ms. Petrova say about the allergy?|Special dishes will be prepared.|The colleague cannot attend.|The colleague should bring food.|Peanuts are not used in any class.\n?What has changed about the class?|Its location|Its date|Its chef|Its price\n--\nT:Internal job posting: Team leader, Customer Support (Evening shift)\nDepartment: Customer Support. Hours: Monday to Friday, 2 P.M. to 10 P.M. Reports to: Maria Santos, Support Manager.\nRequirements: at least two years in our Customer Support department; experience training new staff; good knowledge of the Helpline 4 software. Applicants should send a short letter explaining their interest to Ms. Santos by October 10. Interviews will be held on October 16 and 17. The new team leader will start on November 3 and will receive a salary increase of 12 percent.\nT:From: Devon Clarke. To: Maria Santos. Subject: Team leader position\nDear Ms. Santos, I would like to apply for the team leader position. I joined the Customer Support department three and a half years ago, and for the past year I have trained all the new staff on the morning shift. I helped test Helpline 4 before it was introduced, so I know it well. I should mention that I take an evening class on Thursdays until December, so I could not work the full evening shift on that day before then. I hope this will not be a problem. Sincerely, Devon Clarke\nT:From: Maria Santos. To: Devon Clarke. Subject: Re: Team leader position\nDear Devon, thank you for your application. I would like to invite you to an interview on the first of the two interview days, at 11 A.M. in Room 210. Please bring a list of ideas for improving the training of new staff.\nRegarding Thursdays, I have spoken with the personnel office. If you are selected, Ben Ortiz has agreed to cover your Thursday shifts until your class ends. See you next week. Maria\n?What is a requirement for the position?|Experience with training|A university degree|Five years in the department|Working on weekends\n?What is suggested about Mr. Clarke?|He has been in the department longer than the minimum required.|He already works the evening shift.|He is new to the company.|He designed the Helpline 4 software. >> Câu liên kết: yêu cầu ít nhất hai năm; anh đã làm ba năm rưỡi.\n?On what date will Mr. Clarke be interviewed?|October 16|October 10|October 17|November 3 >> Câu liên kết: phỏng vấn vào ngày đầu trong hai ngày 16 và 17 tháng 10.\n?What is Mr. Clarke asked to bring?|A list of ideas|A resume|A certificate|A letter of recommendation\n?If Mr. Clarke gets the job, who will work on Thursday evenings until December?|Ben Ortiz|Maria Santos|A new employee|Mr. Clarke himself\n\n##F4|Đề thi thử số 4|200 câu, nội dung mới hoàn toàn\n>Đề đủ 200 câu theo đúng cấu trúc bài thi: 100 câu nghe trong 45 phút và 100 câu đọc trong 75 phút.\n[P1]\n👩‍💼🧾🖊️|Một phụ nữ đang ký giấy tờ ở một quầy giao dịch.|A woman is signing a document at a counter.|A woman is handing over a credit card.|A woman is typing on a keyboard.|A woman is waiting in a long line.\n🪑🪑🪑🎤|Các hàng ghế trống xếp ngay ngắn trước một sân khấu có micro.|Chairs have been arranged in rows.|An audience is watching a show.|A man is adjusting a microphone.|Chairs are being stacked.\n🧑‍🌾🚜🌾|Một người đang lái máy kéo trên cánh đồng.|A man is driving a tractor.|A man is feeding some animals.|A tractor is parked in a garage.|A field is being watered.\n📦🛒👩|Một phụ nữ đang đặt các món hàng lên quầy thu ngân.|A woman is placing items on a counter.|A woman is pushing a cart outside.|A cashier is counting money.|Some shelves are being filled.\n🚢⚓🏙️|Một con tàu lớn đậu ở cảng, phía sau là các toà nhà.|A ship is docked in a harbor.|Passengers are getting off a ship.|A boat is sailing under a bridge.|Some workers are painting a ship.\n👨‍💻👩‍💻🖥️|Hai người ngồi đối diện nhau ở bàn, mỗi người dùng một máy tính xách tay.|They are working on laptops.|They are shaking hands.|They are sharing a document.|They are leaving the office.\n[P2]\nWho's replacing Ms. Garcia while she's on leave?|Someone from the Boston office.|For three months.|In her office.\nWhere's the nearest post office?|Two blocks down, on the left.|It opens at nine.|I posted it yesterday.\nWhen are the new price lists going out?|As soon as they're printed.|To all our customers.|Ten percent higher.\nHow much is the registration fee?|It's free for members.|At the front desk.|By Friday.\nWhy hasn't the shipment left the warehouse?|We're waiting for the customs papers.|In the warehouse.|By truck.\nWould you prefer the morning or the afternoon session?|The morning one, please.|It lasts two hours.|Yes, I would.\nCan you show me how to use the new scanner?|Sure, it only takes a minute.|It's brand-new.|I scanned it.\nIs Mr. Ahmed in today?|He's working from home.|He's very tall.|Since nine o'clock.\nThe projector isn't turning on.|Have you checked the power cable?|It's a great project.|Turn it down, please.\nHow was your vacation in Thailand?|Wonderful, but too short.|For two weeks.|By plane.\nWhich floor is the accounting department on?|The sixth, I believe.|It's very accurate.|About ten people.\nDo we have enough chairs for the seminar?|I'll bring some from next door.|It's a comfortable chair.|At two o'clock.\nWho left this umbrella in the meeting room?|It might be Sandra's.|It's raining.|Under the table.\nDidn't you get my message this morning?|No, my phone was off.|It was a long message.|This morning.\nWhat time does the pharmacy close?|At eight on weekdays.|On Hill Street.|For my headache.\nShouldn't we wait for Mr. Lopez?|He said to start without him.|In the waiting room.|It's too heavy.\nHow do you like your new office?|It's much brighter than the old one.|On the third floor.|Yes, I'd like one.\nWhy don't I email you the directions?|That would be helpful.|Go straight ahead.|Because I'm late.\nWhen was the last time the elevator was inspected?|About six months ago.|To the top floor.|By the stairs.\nCould you turn the heating up a little?|Of course. Is it too cold?|It's turning left.|A little more, please.\nWhose signature do we need on this form?|The department manager's.|In blue ink.|At the bottom.\nAre you taking the train or driving to the conference?|I haven't decided yet.|It starts at nine.|Yes, I am.\nWhat's the dress code for the dinner?|Formal, I think.|At seven thirty.|The chicken, please.\nWe're running low on envelopes.|I'll add them to the order.|It runs slowly.|In the top drawer.\nHas anyone seen the key to the storage room?|It's hanging by the door.|It's very large.|Yes, I stored it.\n[P3]\nA:Good evening. I'm checking out early tomorrow. Could you arrange a taxi to the airport for five thirty?\nB:Certainly. Actually, our free shuttle leaves at five forty-five. Would that work for you?\nA:My flight is at eight, so yes, that should be fine.\nB:I'll add your name to the list. The shuttle leaves from the main entrance.\nA:Thank you. Could I also get a wake-up call at four forty-five?\nB:Of course. I'll set that up now.\n?What does the woman first ask for?|A taxi|A late checkout|A different room|A map\n?What does the man suggest?|Taking the hotel shuttle|Booking an earlier flight|Walking to the airport|Renting a car\n?What else does the woman request?|A wake-up call|Breakfast in her room|A receipt|An extra key\n--\nA:Ken, the lease on our copy machines ends next month. Should we renew it?\nB:I'm not sure. Those machines jam at least once a week.\nA:The same company has a newer model. It costs twenty dollars more per month, but it's faster and includes free repairs.\nB:Free repairs would save us money. Can we see one before we decide?\nA:They have a showroom downtown. I'll call and ask for a demonstration on Friday.\n?What are the speakers discussing?|A lease on some equipment|A printing order|A repair bill|An office move\n?What problem does the man mention?|The machines often jam.|The machines are too expensive.|The machines are too large.|The company has closed.\n?What will the woman do?|Arrange a demonstration|Sign the lease|Call a repair service|Cancel the contract\n--\nA:Hi, I ordered these boots from your website, but they're too small. Can I exchange them here?\nB:Yes, online orders can be exchanged in any store. Do you have the order confirmation?\nA:It's on my phone. Here.\nB:Thank you. Unfortunately, we don't have the next size in brown. We have it in black, or I can order the brown pair for you.\nA:How long would that take?\nB:About five days, and we'd send them to your home for free.\nA:Then I'll wait for the brown ones.\n?What does the woman want to do?|Exchange an item|Get a refund|Buy a second pair|Complain about a delivery\n?What does the man ask to see?|An order confirmation|A paper receipt|A credit card|A photo ID\n?What does the woman decide to do?|Wait for a delivery|Take the black pair|Cancel her order|Try another store\n--\nA:Eric, Tao, are you both still joining the company team for the charity run?\nB:Definitely, Nora. I've been training every morning.\nC:I'd like to, but I hurt my ankle last week. I don't think I can run ten kilometers.\nA:That's a shame, Tao. We also need people to hand out water at the finish line.\nC:I can do that. What time should I be there?\nA:Eight o'clock. Eric, could you pick up the team T-shirts from the printer on Friday?\nB:No problem.\n?What event are the speakers discussing?|A charity run|A company picnic|A training course|A sales contest\n?Why can't Tao take part as planned?|He has an injury.|He is too busy.|He will be out of town.|He dislikes running.\n?What will Eric do on Friday?|Collect some T-shirts|Hand out water|Register the team|Visit a doctor\n--\nA:Hello, this is Paula Ortiz from Sunrise Café. Our milk delivery hasn't arrived, and it's already ten o'clock.\nB:I'm sorry, Ms. Ortiz. Let me check. It seems the driver's truck had a flat tire this morning.\nA:I see. We'll run out of milk by noon.\nB:A second truck is on its way and should reach you within forty minutes. And we won't charge you for today's delivery.\nA:Thank you. I appreciate that.\n?Why is the woman calling?|A delivery is late.|The wrong item was delivered.|A bill is incorrect.|She wants to place a new order.\n?What caused the problem?|A flat tire|A traffic jam|A sick driver|A lost order form\n?What does the man offer?|A delivery at no charge|A discount next month|Extra milk|A refund for last week\n--\nA:Martin, I'd like to take the first week of August off.\nB:Let me look at the calendar. Hmm. Daniel and Yuki are both away that week.\nA:Oh. I didn't know that.\nB:Someone has to be here to answer customer calls. What about the second week?\nA:I'd have to check with my family. Can I tell you tomorrow?\nB:Sure. But don't wait too long. Others may ask for the same dates.\n?What does the woman want to do?|Take time off|Change her shift|Cancel a trip|Hire an assistant\n?What does the man imply when he says, \"Daniel and Yuki are both away that week\"?|The woman's request is difficult to approve.|The office will be closed.|He will also be away.|The woman should travel with them.\n?What does the man advise the woman to do?|Decide quickly|Call some customers|Ask Daniel for help|Work on the weekend\n--\nA:Hi, the screen on my phone is cracked. Can you fix it?\nB:Yes, we can replace the screen. It's ninety dollars and takes about two hours.\nA:Two hours? I have a meeting at three.\nB:It's one o'clock now, so it would be ready just in time. Or you can leave it and pick it up tomorrow.\nA:I need my phone tonight. I'll wait in the café next door.\nB:Fine. I'll come and find you when it's done.\n?What is wrong with the woman's phone?|The screen is damaged.|The battery is dead.|It will not turn on.|It has been lost.\n?How long will the repair take?|About two hours|About ninety minutes|Until tomorrow|About one hour\n?Where will the woman wait?|In a café|In the shop|At her office|At home\n--\nA:Good afternoon. I'm returning this car. Here are the keys.\nB:Thank you, Ms. Bell. Did you fill the tank?\nA:I'm afraid I didn't have time. I was late coming from a meeting.\nB:That's all right, but there will be a fuel charge of forty-five dollars.\nA:I understand. Could you email me the final receipt? I need it for my expense report.\nB:Certainly. It will be sent to the address on your booking.\n?What is the woman doing?|Returning a rental car|Buying a car|Paying for parking|Reporting an accident\n?Why will the woman pay an extra charge?|She did not refill the fuel.|She returned the car late.|She damaged the car.|She kept the car an extra day.\n?What does the woman ask for?|A receipt by email|A discount|A different car|A ride to the airport\n--\nA:The photographer can come on Tuesday or Thursday to take pictures for the catalog. Which is better?\nB:Tuesday, Amy. The new samples arrive on Monday, so everything will be here.\nC:Tuesday works for me too, but the meeting room is booked all day for interviews.\nA:Good point, Raj. Could we use the lobby instead? The light is better there anyway.\nB:I'll ask the building manager for permission.\nA:Thanks, Leo. Let me know by tomorrow, and I'll confirm with the photographer.\n?What are the speakers planning?|A photo session|Some job interviews|A catalog mailing|A staff meeting\n?What problem does Raj mention?|A room is not available.|The samples are late.|The photographer is busy.|The light is poor.\n?What will Leo do?|Ask for permission|Book the meeting room|Call the photographer|Unpack the samples\n--\nA:Hello, I booked the Saturday city tour for two people, but my friend can't come. Can I get a refund for one ticket?\nB:Tickets can't be refunded within three days of the tour, I
