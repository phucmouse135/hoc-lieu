at you have an appointment with Dr. Evans for your yearly checkup on Tuesday, April 8, at 2:30 P.M. Please arrive ten minutes early. __(1)__ you are taking any medicine, bring a list of the names with you. __(2)__ If you cannot come, please call us at least 24 hours in advance; __(3)__, a fee of 25 dollars will be charged. We look forward to __(4)__ you.\nLakeside Dental Clinic\n?(1)|If|Although|Unless|So >> Điều kiện: nếu đang dùng thuốc.\n?(2)|This will help the dentist choose the right treatment.|The clinic was opened in 2010.|Our parking lot is being painted.|Dr. Evans studied in London.\n?(3)|otherwise|therefore|in addition|for example >> \"Nếu không thì\" sẽ bị tính phí.\n?(4)|seeing|see|saw|be seen >> \"Look forward to\" + V-ing.\n[P7]\nT:City Health Center: Free health checks in May\nThe City Health Center will offer free health checks for adults over forty every Saturday in May, from 9 A.M. to 1 P.M. Each check takes about twenty minutes and includes a blood pressure test and a short talk with a nurse. No appointment is needed, but please bring an ID card.\nIf the nurse finds a problem, you will be given a letter to take to your own doctor. Please note that the center cannot give prescriptions or treatment during these sessions. Parking is available behind the building.\n?Who can get a free health check?|Adults over forty|All city residents|Children under twelve|Patients of the center only\n?What should people bring?|An ID card|An appointment letter|An insurance form|A prescription\n?What is NOT offered during the sessions?|Medicine|A blood pressure test|A talk with a nurse|A letter for a doctor\n?What is indicated about the health checks?|They are held only on Saturdays in May.|They take one hour.|They require an appointment.|They cost twenty dollars.\n--\nT:From: Brian Cole. To: Sales team. Subject: Out of the office next week\nHello everyone, I am writing to let you know that I will be out of the office from Monday to Thursday next week. I am having a small surgery on my knee, and the doctor has told me I need a few days to recover.\nWhile I am away, Susan Park will take over my customer calls. I have given her the files for all current orders. For anything urgent, you can still reach me by email; I will check my messages once a day. I expect to be back on Friday, but I will confirm this with you on Thursday. Thank you for your understanding.\nBrian\n?Why will Mr. Cole be away?|He is having an operation.|He is going on vacation.|He is attending a conference.|He is visiting customers.\n?Who will handle his customer calls?|Susan Park|His doctor|The whole team|Nobody\n?How can the team contact Mr. Cole in an emergency?|By email|By phone|Through Ms. Park|By visiting him\n?What is suggested about Mr. Cole's return?|It is not completely certain yet.|It will be on Thursday.|It will be the following month.|He will work from home on Friday.\n[P2]\nWhere can I get this prescription filled?|There's a pharmacy across the street.|It's full.|From the doctor.\nHow are you feeling after your surgery?|Much better, thanks. I'm recovering quickly.|In the hospital.|It was last week.\nDoes your insurance cover dental treatment?|Only checkups, unfortunately.|The dentist is nice.|I covered it up.\nWhen was your last checkup?|About a year ago.|At the clinic.|With Dr. Wong.\nWhat are your symptoms?|A headache and a sore throat.|Twice a day.|It's very simple.\nShould I take this medicine before or after meals?|After meals, with water.|Yes, you should.|At the pharmacy.\n[P5]\nPatients should arrive fifteen minutes 【early|earlier than|earliest|earliness】 for their first visit. >> Sau \"fifteen minutes\" dùng trạng từ dạng nguyên: early.\nThis medicine is available only with a doctor's 【prescription|prescribe|prescribed|prescribing】. >> Sau sở hữu cách cần danh từ.\nIt took Mr. Cole a week to 【recover|discover|uncover|cover】 from his surgery. >> \"Recover from\": hồi phục sau.\nThe clinic 【is located|locates|located in|is locating】 on the second floor of the Parker Building. >> \"Be located\": nằm ở.\nThe new treatment is 【more effective|effectiver|most effectively|more effect】 than the old one. >> Tính từ dài, có \"than\": more effective.\nPlease bring your insurance card 【when|during|while of|despite】 you come to the clinic. >> Trước một mệnh đề chỉ thời gian: when.\nDr. Wong sees patients 【by|with|on the|at an】 appointment only. >> Cụm cố định: by appointment only (chỉ khám theo hẹn).\nAll 【patients|patience|patiently|patient】 must fill out a form before seeing the doctor. >> Sau \"All\", chủ ngữ số nhiều: patients.\n\n##D1|Part 7: đoạn kép|Câu hỏi liên kết hai văn bản\n>Mười câu Part 7 thuộc hai bộ đoạn kép. Mỗi bộ có ít nhất một câu mà bạn phải ghép thông tin từ cả hai văn bản mới trả lời được. Đây là dạng phân loại thí sinh 600 với thí sinh 800.\n[V]Khiếu nại và hoá đơn\ninconvenience|sự bất tiện|We apologize for any ＊ caused by the delay.\ncompensate|bồi thường, đền bù|The airline will ＊ passengers for their lost luggage.\ncompensation|khoản bồi thường|He received 500 dollars in ＊ for the damaged furniture.\novercharge|tính tiền quá mức|The taxi driver tried to ＊ us by ten dollars.\nbilling|việc lập hoá đơn, tính cước|There was a ＊ error, so we were charged twice.\nstatement|bản sao kê|Check your bank ＊ every month for mistakes.\ndiscrepancy|sự chênh lệch, không khớp|There is a ＊ between the order form and the invoice: one says ten, the other twelve.\nverify|xác minh|Please ＊ your address before we send the package.\nacknowledge|xác nhận đã nhận; thừa nhận|We ＊ receipt of your letter dated May 3.\npromptly|nhanh chóng, ngay|Thank you for replying so ＊; I did not expect an answer the same day.\nvalid|còn hiệu lực|Your passport must be ＊ for six more months.\ncourtesy|sự lịch sự; (đồ) miễn phí do ưu ái|As a ＊ to our guests, we offer a free ride to the airport.\n[N]\nĐoạn kép gồm hai văn bản có liên quan: thư và thư trả lời, quảng cáo và đơn đặt hàng, thông báo và email phản hồi. Có năm câu hỏi. Thường hai câu hỏi về văn bản thứ nhất, hai câu về văn bản thứ hai, và một hoặc hai câu liên kết.\nDấu hiệu của câu hỏi liên kết: bạn tìm được một nửa câu trả lời ở văn bản này (ví dụ một cái tên, một mã số, một điều kiện) nhưng nửa còn lại (giá, ngày, địa điểm ứng với nó) nằm ở văn bản kia. Nếu bạn dò mãi trong một văn bản mà không ra đáp án, đó chính là câu liên kết.\nCách đọc: đọc lướt cả hai văn bản trong khoảng một phút để nắm quan hệ giữa chúng (ai viết cho ai, văn bản hai phản hồi điều gì ở văn bản một), rồi mới làm câu hỏi. Hãy để ý những chi tiết \"thừa\" như bảng giá, danh sách ngày, điều kiện ưu đãi: chúng thường là nguyên liệu cho câu liên kết.\n[P7]\nT:From: Karen Hall. To: Customer service, Office Depot Plus. Subject: Error on invoice 3391\nDear Sir or Madam, on April 2 I ordered ten Comfort desk chairs at 45 dollars each for our office. The chairs arrived promptly, and we are satisfied with them. However, when I checked the invoice against our order form, I found a discrepancy. We ordered and received ten chairs, but we were charged for twelve. Could you please verify this and correct the billing error?\nKaren Hall, Office Manager, Hall and Reed Accounting\nT:From: Daniel Ito, Office Depot Plus. To: Karen Hall. Subject: Re: Error on invoice 3391\nDear Ms. Hall, thank you for bringing this matter to our attention. I have checked our records and can confirm that you were overcharged. We will refund the cost of the two extra chairs to your credit card within five business days.\nWe apologize for the inconvenience. As a courtesy, I have attached a coupon for ten percent off your next order. Please note that it is valid for three months from today.\nSincerely, Daniel Ito\n?Why did Ms. Hall write to the company?|To report a mistake on a bill|To order more chairs|To complain about late delivery|To return some damaged chairs\n?What does Ms. Hall say about the chairs?|She is happy with them.|Two of them were damaged.|They arrived late.|They were the wrong model.\n?How much money will be returned to Ms. Hall?|90 dollars|45 dollars|450 dollars|540 dollars >> Câu liên kết: thư thứ nhất cho giá 45 đô la mỗi ghế; thư thứ hai nói hoàn tiền hai ghế thừa. 2 × 45 = 90.\n?What did Mr. Ito send with his email?|A discount coupon|A new invoice|A catalog|A refund form\n?What is indicated about the coupon?|It cannot be used after three months.|It is worth 45 dollars.|It is valid only for chairs.|It must be used within five business days.\n--\nT:Riverside Business Center: June workshops\n|Workshop|Date|Instructor|Room\n|Writing better emails|June 4|Paula Diaz|201\n|Managing your time|June 11|Mark Chen|105\n|Speaking with confidence|June 18|Paula Diaz|201\n|Basic accounting|June 25|Helen Park|303\nAll workshops run from 9 A.M. to noon. The fee is 60 dollars per workshop. Participants who register for two or more workshops pay 50 dollars for each one. To change or cancel a registration, email the office at least three days before the workshop.\nT:From: Tom Baker. To: Riverside Business Center. Subject: Change of workshop\nHello, I am registered for \"Managing your time\" next week, but I have just learned that I must travel for work on that day. Would it be possible to switch to the workshop on June 18 instead? I have heard very good things about the instructor. I have already paid the fee for one workshop. If there is any additional charge, please let me know. Thank you, Tom Baker\n?What is indicated about the workshops?|They are all held in the morning.|They are free for members.|They last a full day.|They are held in the same room.\n?How much does each workshop cost for someone who takes three?|50 dollars|60 dollars|150 dollars|180 dollars\n?Why does Mr. Baker want to make a change?|He has a business trip.|He is not interested in the topic.|The workshop was canceled.|The fee is too high.\n?Who will teach the workshop Mr. Baker wants to attend?|Paula Diaz|Mark Chen|Helen Park|Tom Baker >> Câu liên kết: email nêu ngày 18 tháng 6; bảng cho biết buổi đó do Paula Diaz dạy.\n?What does Mr. Baker ask the center to tell him?|Whether he must pay more|Where the room is|Who the instructor is|When the office opens\n[P7]\nT:Notice to customers of Lakeview Water Company\nWe recently discovered a billing error that affected about 2,000 customers in the Lakeview area. Statements for March showed an amount that was too high. If you were overcharged, the difference will appear as a credit on your April statement. You do not need to contact us.\nWe acknowledge that this error may have caused inconvenience, and we apologize. To verify the amount of your credit, visit our website and enter your customer number.\n?What is the purpose of the notice?|To explain a mistake and how it will be fixed|To announce a price increase|To request a late payment|To introduce a new website\n?What should affected customers do?|Nothing|Call the company|Pay the March bill again|Fill out a form\n?How can customers check the amount of their credit?|By using the website|By visiting the office|By waiting for a letter|By calling their bank\n[P3]\nA:Hello, I'm calling about my phone bill for May. I think I've been overcharged.\nB:I'm sorry to hear that. Could you give me your account number so I can verify the charges?\nA:It's 40-7715. My plan is thirty dollars a month, but the statement says fifty-five.\nB:I see what happened. You were charged for international calls, but your plan includes those. I'll correct it right away.\nA:Thank you. Will I get a new statement?\nB:Yes, by email within an hour. And as compensation, I'll take five dollars off next month's bill.\n?Why is the man calling?|His bill is higher than expected.|His phone is not working.|He wants to change his plan.|He lost his statement.\n?What caused the problem?|He was charged for calls that are included.|He made too many calls.|He changed his plan in May.|His payment was late.\n?What does the woman offer?|A reduction on the next bill|A free phone|A new account number|A longer contract\n[P2]\nHave you verified the customer's address?|Yes, it matches our records.|It's very far.|At the address.\nIs this coupon still valid?|No, it expired last week.|It's ten percent.|In the store.\nWho should I contact about a billing error?|The accounting department.|It was an error.|By the end of the month.\nDid they compensate you for the delay?|Yes, with a voucher.|It was delayed.|Very late.\n[P5]\nWe apologize for any 【inconvenience|inconvenient|inconveniently|inconvenienced by】 this may have caused. >> Sau \"any\" cần danh từ.\nPlease 【verify|verification|verified|verifiable】 your account number before making a payment. >> Câu mệnh lệnh sau \"Please\": động từ nguyên mẫu.\nThe coupon is 【valid|validity|validly|validate】 until the end of the year. >> Sau \"is\" cần tính từ.\nCustomers who were overcharged will receive 【compensation|compensate|compensated|compensating】 within ten days. >> Tân ngữ của \"receive\": danh từ.\nThank you for responding so 【promptly|prompt|promptness|prompted】 to our request. >> Bổ nghĩa cho \"responding\": trạng từ.\nThere was a 【discrepancy|discretion|discount|discovery】 between the two reports. >> Hợp nghĩa: sự không khớp giữa hai bản báo cáo.\n##D2|Part 5: phân từ|V-ing và V-ed làm tính từ, mệnh đề rút gọn\n>Dạng câu phân loại rõ nhất ở mức 700 trở lên: \"interesting hay interested\", \"the document attached hay attaching\". Bài này cho bạn hai quy tắc đủ dùng cho mọi trường hợp.\n[V]Mô tả sản phẩm và dịch vụ\ndurable|bền|These boots are very ＊; I have worn them for ten years.\nreliable|đáng tin cậy|The old printer was not ＊; it broke down every week.\ninnovative|có tính đổi mới, sáng tạo|The company is known for its ＊ designs that nobody else has tried.\nefficient|hiệu quả, tiết kiệm|The new engine is more ＊ and uses less fuel.\nuser-friendly|dễ sử dụng|The app is so ＊ that even my grandmother can use it.\nstate-of-the-art|hiện đại nhất, tối tân|The hospital has ＊ equipment that was installed this year.\ncomprehensive|toàn diện, đầy đủ|The guide is ＊; it covers every part of the city.\ncustomized|được làm theo yêu cầu riêng|We offer ＊ training designed for each company's needs.\nexceptional|đặc biệt xuất sắc|The hotel is famous for its ＊ service.\nextensive|rộng, nhiều|She has ＊ experience in marketing, more than twenty years.\nsophisticated|tinh vi, phức tạp|The factory uses ＊ robots that can see and learn.\nversatile|đa năng|This ＊ tool can cut, drill and polish.\n[G]\n@Phân từ làm tính từ|V-ing hay V-ed|V-ing: gây ra cảm xúc, mang nghĩa chủ động: an interesting job, a growing company, the remaining seats · V-ed: cảm thấy, mang nghĩa bị động hoặc đã hoàn thành: interested customers, the attached file, a damaged box, qualified staff\nVới cảm xúc: vật hoặc sự việc thì \"-ing\" (The news was surprising), người thì \"-ed\" (We were surprised). Với các động từ khác, hãy hỏi: danh từ đó tự làm hành động (V-ing) hay bị tác động (V-ed)?\n!Một số phân từ đã thành tính từ cố định trong văn bản công việc: the attached document, the enclosed form, limited time, detailed information, an experienced manager, the existing system, a leading company, rising costs, a challenging task, a rewarding career.\n>Please complete the 【attached|attaching|attach|attachment】 form.=Vui lòng điền mẫu đính kèm.\n>The results were very 【disappointing|disappointed|disappoint|disappointment】.=Kết quả rất đáng thất vọng.\n>We are looking for an 【experienced|experiencing|experience|experiences】 engineer.=Chúng tôi đang tìm một kỹ sư có kinh nghiệm.\n>【Rising|Risen|Rose|Rise】 costs have forced us to raise prices.=Chi phí tăng buộc chúng tôi phải tăng giá.\n@Mệnh đề quan hệ rút gọn|Phân từ đứng sau danh từ|Chủ động: N + V-ing (= who / which + V): employees working overtime · Bị động: N + V-ed (= who / which + be + V3): the products shipped yesterday\nKhi sau danh từ là một chỗ trống rồi đến phần bổ nghĩa, và câu đã có động từ chính, chỗ trống là phân từ chứ không phải động từ chia thì.\n>Employees 【working|worked|work|works】 the night shift receive extra pay.=Nhân viên làm ca đêm được trả thêm.\n>The items 【ordered|ordering|order|orders】 last week have arrived.=Những món hàng đặt tuần trước đã về.\n+Anyone 【wishing|wished|wishes|wish】 to attend should register by Friday.=Ai muốn tham dự cần đăng ký trước thứ Sáu.\n+The report 【submitted|submitting|submit|submits】 by Ms. Lee contains several errors.=Bản báo cáo do cô Lee nộp có vài lỗi.\n[N]\nMẹo cho câu rút gọn: sau chỗ trống có tân ngữ thì chọn V-ing (employees handling complaints); sau chỗ trống là \"by…\" hoặc trạng ngữ thì chọn V-ed (complaints handled by the manager).\nCấu trúc mở đầu câu bằng phân từ cũng theo quy tắc đó: \"Located in the city center, the hotel…\" (khách sạn được đặt ở), \"Having finished the report, she…\" (sau khi làm xong).\n[P5]\nThe 【remaining|remained|remain|remains】 tickets will be sold at the door. >> \"Số vé còn lại\": tính từ cố định remaining.\nCustomers 【interested|interesting|interest|interests】 in the offer should call before Friday. >> Người cảm thấy quan tâm: interested (rút gọn của \"who are interested\").\nThe software 【installed|installing|installs|install】 last month has reduced errors. >> Phần mềm được cài (bị động); câu đã có động từ chính \"has reduced\".\nThe presentation was so 【boring|bored|bore|boredom】 that several people left early. >> Sự việc gây cảm giác chán: boring.\nAll staff 【attending|attended|attend|attends】 the conference must register online. >> Nhân viên tự tham dự (chủ động), sau có tân ngữ \"the conference\".\nWe offer 【detailed|detailing|detail|details】 instructions for every product. >> Tính từ cố định: detailed instructions.\n【Located|Locating|Locate|Location】 near the station, the hotel is popular with business travelers. >> Khách sạn được đặt ở (bị động): Located.\nThe company is one of the 【leading|led|lead|leads】 producers of solar panels. >> Tính từ cố định: leading (hàng đầu).\nEmployees were 【pleased|pleasing|please|pleasure】 to hear about the bonus. >> Người cảm thấy hài lòng: pleased.\nThe documents 【requested|requesting|request|requests】 by the bank were sent yesterday. >> Tài liệu được yêu cầu, sau có \"by\": V-ed.\nBecause of 【increasing|increased by|increase|increases】 demand, the factory hired fifty workers. >> \"Nhu cầu đang tăng\": increasing demand.\nThe manager gave a very 【convincing|convinced|convince|convinces】 presentation. >> Bài thuyết trình gây thuyết phục: convincing.\n[P6]\nT:Introducing the Nova S3 laptop\nThe Nova S3 is our most __(1)__ laptop yet. Weighing only one kilogram, it is light enough to carry all day, and its battery lasts fifteen hours. The laptop comes with user-friendly software __(2)__ for small businesses. __(3)__ Customers __(4)__ in a customized model can choose the color, memory and screen size on our website.\n?(1)|versatile|versatility|versatilely|more versatile >> Sau \"most\" cần tính từ dạng nguyên.\n?(2)|designed|designing|design|designs >> Phần mềm được thiết kế (bị động), rút gọn của \"which is designed\".\n?(3)|It also has a durable metal case that protects it from damage.|Our store is closed on public holidays.|The battery was invented in 1990.|Please return the form by Friday.\n?(4)|interested|interesting|interest|interests >> Khách hàng cảm thấy quan tâm: interested in.\n[P7]\nT:Product review: The CleanPro 500 vacuum cleaner\nI have used the CleanPro 500 for three months, and I am impressed. It is the most efficient vacuum I have ever owned: it cleans my whole apartment in twenty minutes. It is also surprisingly quiet. The attached tools are versatile and work well on carpets, wooden floors and even car seats.\nMy only complaint is the price. At 350 dollars, it costs twice as much as my old vacuum. However, it comes with a five-year warranty, and it feels very durable. For anyone looking for a reliable machine, I would recommend it.\n?What does the reviewer like most about the product?|It works quickly.|It is cheap.|It is small.|It is colorful.\n?What is mentioned as a disadvantage?|Its cost|Its noise|Its weight|Its tools\n?What is suggested about the reviewer's old vacuum?|It cost about 175 dollars.|It had a five-year warranty.|It was very quiet.|It was a CleanPro model.\n?The word \"reliable\" in paragraph 2, line 3, is closest in meaning to|dependable|expensive|modern|powerful\n[P3]\nA:Have you tried the new accounting software yet, Mike?\nB:Yes, I started using it on Monday. I was a little worried at first, but it's very user-friendly.\nA:That's good to hear. The old system was so confusing that I made mistakes every week.\nB:I know. And this one creates detailed reports automatically. It saved me two hours yesterday.\nA:Really? I'm interested in learning how to do that.\nB:There's a training video on the company website. It only takes fifteen minutes.\n?What are the speakers discussing?|New software|A training course|A sales report|A website design\n?What does the woman say about the old system?|It was confusing.|It was fast.|It was expensive.|It was user-friendly.\n?What does the man recommend?|Watching a video|Calling a technician|Reading a manual|Attending a class\n##D3|Part 7: quảng cáo kèm thư hoặc đánh giá|Đoạn kép loại hai\n>Cặp văn bản hay gặp nhất sau \"thư và thư trả lời\" là \"quảng cáo và phản hồi của khách\". Câu liên kết thường hỏi khách được hưởng ưu đãi nào hoặc trả bao nhiêu.\n[V]Khách sạn và dịch vụ cao cấp\ntestimonial|lời chứng thực của khách hàng|The website shows a ＊ from a customer who used the service for five years.\nrating|điểm đánh giá, xếp hạng|The hotel has a ＊ of four stars out of five.\ncomplimentary|miễn phí (được tặng kèm)|All guests receive a ＊ breakfast.\namenities|tiện nghi|The hotel's ＊ include a pool, a gym and free internet.\npremium|cao cấp|＊ members pay more but get faster delivery.\nexclusive|dành riêng, độc quyền|This offer is ＊ to members; other customers cannot use it.\nredeem|đổi (phiếu, điểm) lấy hàng hoặc ưu đãi|You can ＊ this voucher at any of our stores.\nloyalty|sự trung thành (của khách hàng)|Our ＊ program gives you one point for every dollar you spend.\npatron|khách quen|The café gave a free coffee to every ＊ on its tenth birthday.\nrenowned|nổi tiếng, lừng danh|The restaurant is ＊ for its seafood; people come from other cities to eat there.\nscenic|có cảnh đẹp|We took the ＊ road along the coast instead of the highway.\nhospitality|lòng hiếu khách; ngành nhà hàng khách sạn|She has worked in the ＊ industry for ten years, mostly in hotels.\n[N]\nKhi văn bản thứ nhất là quảng cáo, hãy chú ý bảng giá, các gói dịch vụ và điều kiện ưu đãi (\"book by May 1\", \"stay three nights or more\", \"members only\"). Văn bản thứ hai (thư đặt chỗ, bài đánh giá, email của khách) sẽ cho biết khách đã chọn gì, đặt khi nào, là ai. Câu liên kết ghép hai thứ đó: \"What discount did Ms. Lee most likely receive?\", \"How much did Mr. Park pay per night?\".\nMột kiểu liên kết khác: bài đánh giá nhắc đến một điều \"không như quảng cáo\". Câu hỏi sẽ là \"What feature mentioned in the advertisement was NOT available to Mr. Cole?\".\nCâu hỏi về bản thân bài đánh giá thường hỏi thái độ: khách hài lòng về gì, phàn nàn gì, có giới thiệu cho người khác không.\n[P7]\nT:Seaside Inn: Spring special\nEnjoy a relaxing stay at the Seaside Inn, renowned for its scenic ocean views. All rooms include complimentary breakfast and free use of our bicycles.\nStandard room: 90 dollars per night. Ocean-view room: 130 dollars per night.\nSpring special: Guests who stay three nights or more receive twenty percent off the room rate. Members of our loyalty program also receive a complimentary dinner for two. Offer valid from March 1 to May 31. Reservations must be made by phone.\nT:Online review by Marta Silva, posted April 20\nMy husband and I stayed at the Seaside Inn for four nights last week in an ocean-view room. The view was as beautiful as the advertisement promised, and the staff showed real hospitality. The breakfast was excellent.\nI have two small complaints. First, three of the six bicycles were out of order, so we could not ride together. Second, we are not members of the loyalty program, and I felt the dinner prices were too high for non-members. Still, I would give the inn a rating of four stars and would stay there again.\n?What is included for all guests?|Breakfast|Dinner|A bicycle tour|Airport transfer\n?How must reservations be made?|By telephone|Online|By email|In person\n?What discount did Ms. Silva most likely receive?|Twenty percent off the room rate|A free dinner|Ten percent off|No discount >> Câu liên kết: quảng cáo giảm 20% cho khách ở từ ba đêm; bài đánh giá cho biết bà ở bốn đêm trong tháng Tư.\n?What problem does Ms. Silva mention?|Some bicycles could not be used.|The room was noisy.|The breakfast was cold.|The view was disappointing.\n?What is suggested about Ms. Silva?|She did not get a free dinner.|She stayed in a standard room.|She will not return.|She is a member of the loyalty program. >> Câu liên kết: bữa tối miễn phí chỉ dành cho hội viên; bà viết mình không phải hội viên.\n--\nT:Brightway Cleaning Services: Let us do the work\nBrightway offers reliable home and office cleaning at affordable prices.\n|Plan|Visits|Price per month\n|Basic|One visit per week|160 dollars\n|Plus|Two visits per week|300 dollars\n|Premium|Three visits per week|420 dollars\nNew customers receive their first visit free of charge. Premium customers also receive complimentary window cleaning once a month. Call 555-0193 to arrange a visit.\nT:From: George Lin. To: Brightway Cleaning Services. Subject: Changing my plan\nHello, I have been a customer on your Plus plan since January, and I am very satisfied with the work of your team. Our office is moving to a larger space next month, so two visits a week will no longer be enough. I would like to move to the plan with three visits. Could you confirm the new price and let me know whether the change can start on June 1? Also, please note our new address: 88 Harbor Road, fifth floor. Thank you, George Lin\n?What is offered to new customers?|A free first visit|A discount on the Premium plan|Free window cleaning|A free month\n?Why is Mr. Lin changing his plan?|His office will be bigger.|The price is too high.|He is unhappy with the service.|He is closing his office.\n?How much will Mr. Lin pay per month after the change?|420 dollars|300 dollars|160 dollars|460 dollars >> Câu liên kết: ông muốn gói ba lần mỗi tuần; bảng cho biết đó là gói Premium, 420 đô la.\n?What additional service will Mr. Lin receive after the change?|Window cleaning|Carpet cleaning|A free visit|Furniture moving >> Câu liên kết: quảng cáo ghi khách Premium được lau cửa sổ miễn phí mỗi tháng.\n?What information does Mr. Lin provide?|A new address|A new phone number|A credit card number|A complaint\n[P6]\nT:Join the Blue Star loyalty program today\nThank you for flying with Blue Star Airlines. As a member of our loyalty program, you will earn one point for every mile you fly. Points can be __(1)__ for free flights, hotel stays and gifts. __(2)__ Members also enjoy exclusive benefits, such as early boarding and complimentary drinks. Joining is free and takes only a few minutes. __(3)__ complete the form on our website, and your membership card __(4)__ to you within two weeks.\n?(1)|redeemed|redeeming|redeem|redeems >> Điểm được đổi (bị động): can be + V3.\n?(2)|The more you fly, the faster your points grow.|Our planes are painted blue.|Flights may be delayed by weather.|Please fasten your seat belt.\n?(3)|Simply|Simple|Simplify|Simplicity >> Bổ nghĩa cho động từ \"complete\" ở câu mệnh lệnh: trạng từ.\n?(4)|will be mailed|mailed|is mailing|has mailed >> Thẻ sẽ được gửi (bị động, tương lai).\n[P4]\nN:Welcome to the Grand Harbor Hotel. This is a message for all guests. Our rooftop restaurant, renowned for its scenic view of the bay, is open for dinner from six to ten P.M. Tonight only, all guests will receive a complimentary dessert with any main dish. Simply show your room key to your waiter. Please note that the swimming pool will be closed tomorrow morning for cleaning and will reopen at noon. We wish you a pleasant stay.\n?Where is the announcement being made?|At a hotel|At an airport|In a restaurant kitchen|On a cruise ship\n?How can guests get a free dessert?|By showing their room key|By booking a table before six|By ordering two main dishes|By joining a program\n?What will happen tomorrow morning?|The pool will be closed.|The restaurant will be cleaned.|Breakfast will be free.|The rooftop will open early.\n[P2]\nIs breakfast included in the room rate?|Yes, it's complimentary for all guests.|It's a good rate.|In the dining room.\nHow do I redeem these points?|You can do it on our website.|I have a thousand points.|That's a good point.\nWhat amenities does the hotel offer?|A pool, a gym and free parking.|It's very friendly.|For three nights.\nWould you recommend this restaurant?|Definitely. It's renowned for its steak.|I'd like a table.|It was recommended.\n[P5]\nAll guests are invited to a 【complimentary|complementary to|compliment|complimented】 breakfast in the lobby. >> \"Complimentary\": miễn phí, được tặng. Đừng nhầm với \"complementary\" (bổ sung cho nhau).\nThis offer is 【exclusive|exclusively|exclude|exclusion】 to members of our loyalty program. >> Sau \"is\" cần tính từ; \"exclusive to\".\nThe voucher can be 【redeemed|reduced|released|reminded】 at any of our hotels. >> Hợp nghĩa: phiếu được đổi lấy dịch vụ.\nThe hotel is 【renowned|renewed|removed|remained】 for its excellent service. >> \"Be renowned for\": nổi tiếng về.\nThe resort offers a wide range of 【amenities|amends|amounts|ambitions】, including a spa and a golf course. >> Hợp nghĩa: tiện nghi.\nWe thank our 【patrons|patterns|patents|patrols】 for their continued support. >> Hợp nghĩa: khách quen.\n##D4|Part 1 và Part 2 ở mức khó|Động từ ít gặp, câu bị động tả vật, câu đáp vòng\n>Sáu câu Part 1 và hai mươi lăm câu Part 2 là nơi thí sinh mục tiêu 800 không được phép mất quá ba, bốn câu. Bài này luyện những câu khó nhất của hai phần.\n[V]Động từ và đồ vật trong ảnh\nlean|tựa, nghiêng|Do not ＊ against the wall; the paint is still wet.\nstack|xếp chồng|Please ＊ the chairs in the corner after the meeting.\npile|đống, chồng|There is a ＊ of old newspapers on the floor.\npolish|đánh bóng|He will ＊ his shoes before the interview.\ndisplay|trưng bày|The shop will ＊ the new shoes in the front window.\npour|rót|Could you ＊ me a glass of water, please?\nwipe|lau|Please ＊ the table with a cloth before you set it.\nsweep|quét|I ＊ the kitchen floor every evening.\nrailing|lan can|Hold on to the ＊ when you go down the stairs.\nladder|cái thang|He climbed the ＊ to change the light on the ceiling.\ncart|xe đẩy|She pushed a ＊ full of boxes through the warehouse.\ncrate|thùng gỗ, sọt|The oranges are shipped in a wooden ＊.\n[N]\nPart 1 mức khó có ba đặc điểm. Một: tả đồ vật bằng bị động và hoàn thành: \"Chairs have been stacked\", \"A ladder is leaning against the wall\", \"Merchandise is being displayed\". Hai: dùng từ khái quát thay cho từ cụ thể: không nói \"apples\" mà nói \"produce\" hoặc \"merchandise\"; không nói \"truck\" mà nói \"vehicle\". Ba: đáp án đúng có thể tả một chi tiết phụ ở hậu cảnh chứ không tả người đứng giữa ảnh.\nBẫy lớn nhất: \"is being + V3\" cần có người đang làm việc đó. Ảnh một dãy bàn đã dọn sẵn mà không có ai thì \"Tables are being set\" là sai, \"Tables have been set\" mới đúng.\nPart 2 mức khó: câu đáp đúng thường là câu đáp vòng. Hỏi \"Where's the new copier?\" có thể được đáp \"It hasn't been delivered yet\". Hỏi \"Can you finish by five?\" có thể được đáp \"I have another deadline at four\". Nếu một câu đáp nghe quá \"khớp từ\" với câu hỏi, hãy nghi ngờ nó.\n[P1]\n🪜🧱|Một cái thang dựng tựa vào bức tường gạch, không có người.|A ladder is leaning against a wall.|A man is climbing a ladder.|A ladder is being carried.|A wall is being painted.\n📦📦📦🛒|Mấy cái thùng đã được xếp chồng trên một xe đẩy, không có người.|Boxes have been stacked on a cart.|A cart is being pushed down a hallway.|A worker is loading boxes.|Boxes are being opened.\n🧽🪟👨|Một người đàn ông đang lau cửa kính bằng khăn.|A man is wiping a window.|A man is opening a window.|A window is being replaced.|A man is looking out of a window.\n🫖☕👩|Một phụ nữ đang rót trà vào tách.|A woman is pouring a drink.|A woman is washing some cups.|A woman is ordering a drink.|Cups have been stacked on a shelf.\n🍎🍊🍋🏪|Trái cây được bày trong các sọt trước một cửa hàng.|Produce is displayed outside a store.|A clerk is weighing some fruit.|Crates are being unloaded from a truck.|A customer is paying for some fruit.\n🧹🍂🚶‍♂️|Một người đàn ông đang quét lá trên lối đi.|A man is sweeping a walkway.|A man is planting a tree.|Leaves are being put into bags.|A man is leaning on a railing.\n[P2]\nWhere should I put these crates?|The warehouse manager will show you.|Yes, they're great.|About twenty.\nHas the new display been set up yet?|They're working on it now.|I played yesterday.|It's on display.\nCould you help me arrange the chairs?|How many do you need?|It's been arranged.|No, they're chairs.\nWhy is there a pile of boxes in the hallway?|The delivery just arrived.|In the hallway.|Yes, it's piled up.\nWho's going to sweep the floor?|I thought you did it already.|It's on the second floor.|Sweet of you.\nCan you finish the window display by five?|I have another deadline at four.|It's a nice window.|Five of them.\nWhen will the ladder be returned?|I didn't know anyone had borrowed it.|Later is better.|Against the wall.\nDon't you need a cart for all those boxes?|No, they're empty.|Yes, I'm in the car.|It's a box.\nShould I wipe the tables or stack the chairs first?|Whichever you prefer.|Yes, please.|On the table.\nThe railing on the stairs is loose.|I'll report it to maintenance.|I lost it yesterday.|Take the stairs.\n[P3]\nA:Excuse me, I'm looking for the garden tools. The sign says aisle seven, but I only see paint there.\nB:Sorry about that. We rearranged the store last week, and the signs haven't been changed yet. Garden tools are now displayed near the back entrance.\nA:I see. I need a ladder as well. Are those in the same area?\nB:No, ladders are stacked outside, next to the carts. I can have someone bring one to the register for you.\nA:That would be helpful. The two-meter one, please.\n?Why is the woman confused?|A sign is out of date.|An item is sold out.|The store is closed.|A price is wrong.\n?Where are the garden tools now?|Near the back entrance|In aisle seven|Next to the paint|Outside the store\n?What does the man offer to do?|Have a ladder brought to the register|Change the sign|Give a discount|Carry the tools to her car\n[P4]\nN:Good morning, team. Before the store opens, here are today's tasks. The new summer clothes arrived last night in twelve crates. They need to be unpacked and displayed near the front entrance by ten o'clock. The winter coats that are there now should be stacked on carts and moved to the storage room. Also, a customer reported that the railing near the escalator is loose, so please keep people away from it until maintenance arrives.\n?What should be displayed near the front entrance?|Summer clothes|Winter coats|Carts|Crates\n?What should be done with the winter coats?|They should be moved to storage.|They should be sold at a discount.|They should be returned.|They should be hung outside.\n?What problem does the speaker mention?|A loose railing|A broken escalator|A late delivery|A missing crate\n[P7]\nT:Notice: Warehouse safety reminder\nFollowing two minor accidents last month, all warehouse staff are reminded of the following rules. Crates must not be stacked more than four high. Carts must be pushed, not pulled, and must never be left in the aisles. Ladders must be checked before each use and returned to the tool room afterward; they should never be left leaning against shelves.\nSpills must be wiped up immediately. If you see a pile of loose material on the floor, sweep it up or report it to your supervisor. A safety inspection will be held on Friday morning.\n?Why was the notice written?|There were some accidents.|New staff were hired.|The warehouse is moving.|New equipment arrived.\n?What is stated about crates?|They may be stacked up to four high.|They must be kept in the tool room.|They must be pushed on carts.|They should be checked before use.\n?What should staff do with ladders after using them?|Take them back to the tool room|Lean them against the shelves|Leave them in the aisle|Report them to a supervisor\n?What will happen on Friday?|An inspection|A training video|A delivery|A staff meeting\n[P5]\nBoxes should not be 【stacked|stuck|stocked up to|staked】 higher than two meters. >> \"Stack\": xếp chồng.\nThe new products are 【displayed|displaced|disposed|dismissed】 near the front entrance. >> \"Display\": trưng bày.\nPlease 【wipe|wide|wire|wise】 the counter after each customer. >> \"Wipe\": lau.\nA ladder was left 【leaning|leaned on|lean|to leaning】 against the shelves. >> \"Be left + V-ing\": bị để trong trạng thái đang tựa vào.\nHold the 【railing|raising|rating|rafting】 when using the stairs. >> Hợp nghĩa: lan can.\nThe fruit is shipped in wooden 【crates|creates|crafts|cranes】. >> Hợp nghĩa: thùng gỗ, sọt.\n##D5|Part 7: đoạn ba|Ba văn bản, năm câu hỏi\n>Mười lăm câu cuối của đề là ba bộ đoạn ba. Văn bản không dài hơn, nhưng thông tin bị chia nhỏ. Bài này dạy cách lập \"bản đồ\" ba văn bản trong một phút.\n[V]Sắp xếp và thay đổi kế hoạch\ntentative|tạm thời, chưa chốt|This is a ＊ schedule; the times may change.\naccommodate|đáp ứng; chứa được|The hall can ＊ up to 300 guests.\narrangement|sự sắp xếp|We have made an ＊ with the hotel to pick you up at the airport.\noutline|dàn ý, đề cương|Please send me an ＊ of your talk before the conference.\ncorrespondence|thư từ trao đổi|Please keep all ＊ with the customer in one folder.\nprior|trước đó|No ＊ experience is needed for this job; we will train you.\nsubsequent|tiếp sau, xảy ra sau|The first meeting was in May, and ＊ meetings were held every month.\nrespective|tương ứng, riêng của mỗi người|After lunch, the managers returned to their ＊ offices.\ninitial|ban đầu|The ＊ plan was to open in May, but we changed it to July.\nalternate|thay thế, khác|The road is closed, so we must take an ＊ route.\npending|đang chờ giải quyết|Your application is still ＊; we will decide next week.\nproceed|tiếp tục, tiến hành|After the break, we will ＊ with the second part of the meeting.\n[N]\nĐoạn ba gồm ba văn bản ngắn về cùng một việc, ví dụ: thông báo sự kiện, email đăng ký, và lịch đã sửa. Năm câu hỏi, trong đó thường có hai câu liên kết, mỗi câu ghép hai trong ba văn bản.\nMột phút đầu, đừng đọc chi tiết. Hãy xác định cho mỗi văn bản: loại gì, ai gửi ai, và nó nối với văn bản khác ở đâu (cùng một tên người, một mã đơn, một ngày). Đó là \"bản đồ\" để bạn biết câu hỏi nào tìm ở đâu.\nThứ tự làm bài: câu hỏi nêu rõ tên văn bản (\"According to the notice…\", \"In the email…\") thì làm trước vì chỉ cần một văn bản. Câu không nêu, hoặc hỏi \"most likely\", thường là câu liên kết: làm sau.\nBẫy điển hình: văn bản thứ ba sửa lại một thông tin của văn bản thứ nhất (đổi ngày, đổi phòng, đổi giá). Câu hỏi sẽ hỏi thông tin sau khi sửa.\n[P7]\nT:Notice: Greenfield Book Fair\nThe annual Greenfield Book Fair will be held on Saturday, October 12, in the main hall of the Greenfield Community Center, from 10 A.M. to 5 P.M. Local bookstores and authors are invited to reserve a table. Small tables cost 30 dollars, and large tables cost 50 dollars. Tables must be reserved by October 1. To reserve, email Linda Moss at the community center with your name and the size of table you need.\nT:From: Peter Hall. To: Linda Moss. Subject: Table at the book fair\nDear Ms. Moss, I am the owner of Hall's Used Books on Bridge Street, and I would like to reserve a large table for the book fair. Would it be possible to have a table near the entrance? I will be bringing about 400 books, so I would also like to know whether I can unload my van at the back door before the fair opens. Thank you, Peter Hall\nT:From: Linda Moss. To: Peter Hall. Subject: Re: Table at the book fair\nDear Mr. Hall, thank you for your reservation. I am happy to accommodate your request for a table near the entrance. You may unload at the back door between 8 and 9:30 A.M. Please note one change: because the main hall is being painted, the fair has been moved to the gymnasium in the same building. The date and times remain the same. Payment can be made in cash on the day of the fair. Sincerely, Linda Moss\n?What is the purpose of the notice?|To invite sellers to take part in an event|To advertise a bookstore|To announce the closing of a hall|To sell tickets to visitors\n?How much will Mr. Hall pay for his table?|50 dollars|30 dollars|80 dollars|400 dollars >> Câu liên kết: ông đặt bàn lớn (email 1); thông báo ghi bàn lớn giá 50 đô la.\n?What does Mr. Hall ask about?|Unloading his books|The price of a table|Parking for customers|The number of visitors\n?Where will the book fair take place?|In the gymnasium|In the main hall|On Bridge Street|At Hall's Used Books >> Câu liên kết: thông báo ghi main hall, nhưng email thứ ba cho biết đã chuyển sang gymnasium.\n?What is indicated about payment?|It can be made on October 12.|It must be made by October 1.|It must be made by credit card.|It has already been made. >> Câu liên kết: email ghi trả tiền mặt trong ngày hội chợ; thông báo cho biết ngày đó là 12 tháng 10.\n--\nT:Skyline Tours: Day trips from the city\n|Tour|Day|Price|Includes\n|Mountain village|Tuesday|60 dollars|Lunch and guide\n|Old harbor boat trip|Thursday|45 dollars|Guide only\n|Tea farm and waterfall|Saturday|70 dollars|Lunch and guide\n|City night tour|Daily|25 dollars|Guide only\nGroups of six or more receive ten percent off. All tours depart from the Central Bus Station. A tour may be canceled if fewer than eight people sign up; in that case, customers may choose an alternate tour or a full refund.\nT:From: Emma Clark. To: Skyline Tours. Subject: Booking for June 14\nHello, I would like to book the tea farm and waterfall tour for a group of six on Saturday, June 14. Two of us are vegetarian. Can the lunch accommodate that? We are staying at the Park Hotel. Could you tell me how far that is from the departure point? Thank you, Emma Clark\nT:From: Skyline Tours. To: Emma Clark. Subject: Re: Booking for June 14\nDear Ms. Clark, thank you for your booking. I am sorry to inform you that the tour you requested will not run on June 14 because not enough people signed up. As an alternate, we can offer you places on the mountain village tour on Tuesday, June 17, which also has a vegetarian lunch option. Your group discount would still apply. The departure point is a five-minute walk from your hotel. Please let us know by Thursday how you would like to proceed. Best regards, Jun Sato\n?Which tour does NOT include lunch?|The old harbor boat trip|The mountain village tour|The tea farm and waterfall tour|None of them\n?Why was Ms. Clark's tour canceled?|Fewer than eight people signed up.|The weather was bad.|The guide was sick.|The bus broke down. >> Câu liên kết: email ghi \"not enough people signed up\"; bảng quy định tour bị huỷ nếu dưới tám người.\n?What does Ms. Clark ask about the lunch?|Whether it suits vegetarians|How much it costs|Where it is served|What time it is\n?How much would each person in Ms. Clark's group pay for the alternate tour?|54 dollars|60 dollars|63 dollars|70 dollars >> Câu liên kết: tour thay thế là Mountain village, 60 đô la; nhóm sáu người được giảm 10%, còn 54 đô la.\n?What is Ms. Clark asked to do by Thursday?|Tell the company her decision|Pay the full amount|Come to the bus station|Send a list of names\n[P3]\nA:Hi, Ken. I'm looking at the tentative schedule for the Singapore conference. Are the arrangements final?\nB:Not yet. The hotel is confirmed, but the flight times are still pending.\nA:I see. My initial plan was to arrive on Sunday evening. Is that still possible?\nB:It should be. But if the Sunday flight is full, the alternate is Monday at six A.M.\nA:That's early, but I can accommodate that. Just let me know by Wednesday.\nB:Will do. I'll email everyone as soon as the airline confirms.\n?What are the speakers discussing?|Travel arrangements for a conference|A hotel complaint|A delayed flight|A job in Singapore\n?What has NOT been confirmed yet?|The flights|The hotel|The conference date|The schedule\n?What will the man do when he hears from the airline?|Send an email|Call the hotel|Cancel the trip|Book a taxi\n[P2]\nIs this the final schedule?|No, it's only tentative.|It's on schedule.|Finally.\nCan the room accommodate fifty people?|It will be a little tight.|It's a nice room.|Fifty dollars.\nIs my application still pending?|Yes, you'll hear from us next week.|I applied online.|It depends.\nShould we proceed with the original plan?|Let's wait for the director's approval.|It's very original.|We planned it.\n[P5]\nThe dates are still 【tentative|tentatively|tentativeness|tent】 and may change. >> Sau \"are still\" cần tính từ.\nNo 【prior|priority|prioritize|prior to】 experience is required for this position. >> Trước danh từ \"experience\": tính từ prior.\nThe hotel can 【accommodate|accommodation|accommodating|accommodated】 groups of up to forty people. >> Sau \"can\" cần động từ nguyên mẫu.\nThe managers returned to their 【respective|respectful|respectable|respecting】 departments after the meeting. >> \"Respective\": tương ứng của từng người. Đừng nhầm với respectful (kính trọng), respectable (đáng kính).\nIf the road is closed, drivers should use an 【alternate|alternative to|alter|alternately】 route. >> Trước danh từ \"route\" cần tính từ.\nOnce the payment is received, we will 【proceed|precede|process of|proceeds】 with your order. >> \"Proceed with\": tiến hành. Đừng nhầm với \"precede\" (đi trước).\n\n##D6|Part 5: ngữ pháp mức 800|Điều kiện loại 3, đảo ngữ, giả định\n>Mỗi đề có hai, ba câu ngữ pháp mà chỉ thí sinh điểm cao làm được. Chúng xoay quanh đúng ba chủ điểm của bài này.\n[V]Động từ trang trọng trong văn bản quy định\nimplement|triển khai, thực hiện|The company will ＊ the new safety rules next month.\nundergo|trải qua (kiểm tra, đào tạo, sửa chữa)|All new pilots must ＊ six months of training.\nanticipate|dự đoán trước, lường trước|We ＊ a large crowd, so we have ordered extra chairs.\nallocate|phân bổ|The city will ＊ two million dollars to road repairs.\nauthorize|cho phép, uỷ quyền|Only the director can ＊ payments over 5,000 dollars.\nenforce|thực thi, buộc tuân thủ|The police ＊ the speed limit with cameras.\nfulfill|hoàn thành, đáp ứng (nghĩa vụ, yêu cầu)|The supplier failed to ＊ the order on time.\nincur|phải chịu (chi phí, khoản phạt)|If you pay late, you will ＊ a fee of twenty dollars.\nexceed|vượt quá|Your luggage must not ＊ 20 kilograms.\nwaive|miễn (phí, quyền)|The bank agreed to ＊ the fee because it was our first late payment.\nterminate|chấm dứt|Either side can ＊ the contract with thirty days' notice.\nadhere|tuân theo, bám sát|All staff must ＊ to the dress code.\n[G]\n@Câu điều kiện loại 3 và dạng đảo|Giả định về quá khứ|If + had + V3, would / could / might + have + V3 · Dạng đảo trang trọng: Had + chủ ngữ + V3, … (= If … had) · Should + chủ ngữ + V, … (= If … should, dùng cho tương lai) · Were + chủ ngữ + to V, … (= If … were to)\nDùng khi nói về điều đã không xảy ra trong quá khứ. Trong thư từ công việc, dạng đảo với Should rất phổ biến: \"Should you have any questions, please contact us\".\n!Thấy \"would have + V3\" ở một vế thì vế kia cần \"had + V3\". Nếu câu mở đầu bằng chỗ trống rồi đến chủ ngữ và V3, đáp án là \"Had\". Nếu sau chủ ngữ là động từ nguyên mẫu, đáp án là \"Should\".\n>If we 【had ordered|ordered|have ordered|would order】 earlier, the parts would have arrived on time.=Nếu chúng tôi đặt sớm hơn thì linh kiện đã về kịp.\n>【Had|If|Should|Were】 the manager known about the error, she would have corrected it.=Nếu quản lý biết về lỗi đó, cô ấy đã sửa rồi.\n>【Should|Had|If|Were】 you need further assistance, please call our office.=Nếu bạn cần hỗ trợ thêm, vui lòng gọi văn phòng chúng tôi.\n>The project 【would have failed|would fail|will fail|had failed】 if the budget had not been increased.=Dự án hẳn đã thất bại nếu ngân sách không được tăng.\n@Đảo ngữ và thức giả định|Hai cấu trúc trang trọng|Đảo ngữ sau từ phủ định đứng đầu câu: Never / Rarely / Seldom / Not only / Only after / Not until + trợ động từ + chủ ngữ + động từ · Giả định: It is essential / important / necessary / mandatory that + chủ ngữ + động từ nguyên mẫu · request / require / recommend / suggest / insist that + chủ ngữ + động từ nguyên mẫu\nSau các cụm chỉ sự cần thiết và yêu cầu, động từ trong mệnh đề that luôn ở nguyên mẫu, kể cả với he, she, it và kể cả ở quá khứ. Dạng bị động là \"be + V3\".\n>Not only 【did the team finish|the team finished|the team did finish|finished the team】 early, but it also saved money.=Nhóm không chỉ xong sớm mà còn tiết kiệm được tiền.\n>It is essential that every employee 【adhere|adheres|adhered|is adhering】 to the policy.=Điều thiết yếu là mọi nhân viên phải tuân theo chính sách.\n>The director requested that the report 【be submitted|is submitted|was submitted|submits】 by Friday.=Giám đốc yêu cầu báo cáo phải được nộp trước thứ Sáu.\n+Rarely 【does the company waive|the company waives|waives the company|the company does waive】 this fee.=Hiếm khi công ty miễn khoản phí này.\n+【Had|Should|If|Were】 we anticipated the demand, we would have produced more.=Nếu lường trước được nhu cầu, chúng tôi đã sản xuất nhiều hơn.\n[N]\nQuy trình năm giây cho nhóm câu này. Một: câu có \"would have + V3\" thì tìm \"had + V3\" hoặc \"Had\". Hai: câu mở đầu bằng Never, Rarely, Seldom, Not only, Only, Hardly thì theo sau là trợ động từ rồi mới đến chủ ngữ. Ba: câu có \"that\" đứng sau essential, important, necessary, recommend, request, require, suggest, insist thì chọn động từ nguyên mẫu, hoặc \"be + V3\".\n[P5]\nIf the shipment 【had arrived|arrived|has arrived|would arrive】 on Monday, we could have met the deadline. >> Vế chính \"could have met\": vế if cần had + V3.\n【Should|Had|Were|If】 you wish to terminate the contract, please notify us in writing. >> Sau chủ ngữ là động từ nguyên mẫu \"wish\": Should.\nIt is mandatory that all visitors 【wear|wears|wore|are wearing】 a badge. >> Sau \"It is mandatory that\": động từ nguyên mẫu.\n【Had|Should|If|Were】 the company implemented the plan earlier, it would have saved millions. >> Sau chủ ngữ là V3 \"implemented\" và vế sau có \"would have\": Had.\nNot until the audit was completed 【did the manager realize|the manager realized|the manager did realize|realized the manager】 the extent of the problem. >> \"Not until…\" đứng đầu câu: đảo trợ động từ \"did\" lên trước chủ ngữ.\nThe board recommended that the budget 【be allocated|is allocated|was allocated|allocates】 to research. >> Sau \"recommended that\": nguyên mẫu, bị động là be + V3.\nWe would not 【have incurred|incur|incurred|be incurring】 the late fee if the invoice had been paid on time. >> Vế if \"had been paid\": vế chính would (not) have + V3.\nNever before 【has the company exceeded|the company has exceeded|the company exceeded|exceeded the company】 its sales target by so much. >> \"Never before\" đứng đầu câu: đảo \"has\" lên trước chủ ngữ.\nThe contract requires that each supplier 【fulfill|fulfills|fulfilled|fulfilling】 its orders within ten days. >> Sau \"requires that\": động từ nguyên mẫu.\nOnly after the director 【authorized|had been authorized|authorizing|to authorize】 the payment could the work begin. >> Mệnh đề sau \"Only after\" chia bình thường (chủ động, quá khứ); phần đảo nằm ở vế chính \"could the work begin\".\nIf the fee 【had been waived|was waiving|has waived|would be waived】, more people would have registered. >> Bị động của điều kiện loại 3: had been + V3.\nThe manager insisted that the policy 【be enforced|is enforced|enforced|was enforcing】 without exception. >> Sau \"insisted that\": be + V3.\n[P6]\nT:To: All department heads. Subject: New expense policy\nBeginning July 1, the company will __(1)__ a new policy on travel expenses. Under the new rules, any trip that is expected to exceed 1,000 dollars must be approved by the finance director in advance. __(2)__ It is essential that every employee __(3)__ receipts for all costs. Expenses without receipts will not be reimbursed. __(4)__ you have any questions about the policy, please contact the finance office.\n?(1)|implement|undergo|incur|waive >> \"Implement a policy\": triển khai một chính sách.\n?(2)|This step is intended to help us control costs.|The finance director joined us last year.|Travel is not allowed in July.|Receipts are printed on white paper.\n?(3)|keep|keeps|kept|is keeping >> Sau \"It is essential that\": động từ nguyên mẫu.\n?(4)|Should|Had|Were|Unless >> Đảo của \"If you should have\": Should you have…\n[P7]\nT:From: Nina Costa, Atlas Equipment Rental. To: Mark Liu. Subject: Late return of equipment\nDear Mr. Liu, our records show that the floor-cleaning machine you rented on May 2 was returned on May 9, two days after the date stated in your rental agreement. According to the agreement, customers incur a late fee of 40 dollars per day.\nHowever, I understand from our staff that you called on May 7 to say you could not return the machine because of the storm. Had we been open on May 8, you would have been able to bring it back then, but our store was closed that day. For this reason, we have decided to waive half of the late fee. The remaining amount will be charged to your credit card this week.\nT:From: Mark Liu. To: Nina Costa. Subject: Re: Late return of equipment\nDear Ms. Costa, thank you for your email and for reducing the fee. I am glad that your staff noted my call. I have rented from Atlas four times this year and have always been pleased with your service. I do have one request: could the charge be made after May 20? My company's new credit card will arrive then, and the old one is about to be terminated. Regards, Mark Liu\n?Why did Ms. Costa write to Mr. Liu?|To explain a charge|To advertise a machine|To cancel an agreement|To request a call\n?When was the machine supposed to be returned?|On May 7|On May 2|On May 8|On May 9\n?How much will Mr. Liu be charged?|40 dollars|20 dollars|80 dollars|160 dollars >> Câu liên kết trong cùng một thư: trễ hai ngày × 40 đô la = 80 đô la; công ty miễn một nửa, còn 40 đô la.\n?What is suggested about Mr. Liu?|He is a regular customer.|He has never rented before.|He was unhappy with the staff.|He returned the machine during the storm.\n?What does Mr. Liu ask Ms. Costa to do?|Delay the charge|Waive the whole fee|Send a new agreement|Call him back\n[P4]\nN:Good afternoon. This is an important notice for all employees. Starting next Monday, the company will strictly enforce its policy on building security. All staff must show their ID cards when entering, and visitors must be authorized by a manager in advance. Should you lose your card, report it to the security office immediately so that it can be terminated and replaced. The first replacement is free, but you will incur a ten-dollar fee for any subsequent card. Thank you for your cooperation.\n?What is the announcement about?|A security policy|A new building|A visitor's complaint|A change in working hours\n?What must visitors have?|A manager's permission|An ID card from the company|An appointment at the security office|A ten-dollar pass\n?What does the speaker say about replacement cards?|Only the first one is free.|They take a week to make.|They cost twenty dollars.|They are not available.\n[P2]\nHas the new policy been implemented yet?|It takes effect next week.|It's very polite.|In the handbook.\nWho can authorize this payment?|Only the finance director.|By bank transfer.|It was paid.\nDid we exceed the budget?|Yes, by about five percent.|It's a tight budget.|Next year.\nCould the late fee be waived this time?|I'll ask my supervisor.|Wave goodbye.|It's too late.\n##D7|Part 3 và Part 4 ở tốc độ đề thật|Diễn đạt lại và suy luận\n>Ở mức 800, bạn hầu như không còn nghe được nguyên văn đáp án trong băng. Bài này luyện tai với cụm động từ, cách nói vòng, và câu hỏi suy luận.\n[V]Cụm động từ hay gặp trong hội thoại công việc\nwrap up|kết thúc, hoàn tất|Let's ＊ the meeting; it is almost six o'clock.\ncatch up|bắt kịp; cập nhật tình hình|I was away for a week, so I need to ＊ on my email.\ngo over|xem lại, rà lại|Let's ＊ the contract once more before we sign it.\nturn down|từ chối|She had to ＊ the job offer because the salary was too low.\nput off|hoãn lại|We cannot ＊ the decision any longer; we must choose today.\ncall off|huỷ bỏ|They had to ＊ the outdoor concert because of the storm.\nhand in|nộp|Please ＊ your report before you leave today.\nhand out|phát (cho nhiều người)|The teacher will ＊ the test papers at nine o'clock.\ndrop by|ghé qua|Feel free to ＊ my office any time after lunch.\nsort out|giải quyết, sắp xếp cho ổn|It took two days to ＊ the problem with the bank.\nlook over|xem qua|Could you ＊ my presentation and tell me what you think?\nbe supposed to|lẽ ra phải, theo dự định thì|The package was ＊ arrive yesterday, but it is still not here.\n[N]\nBăng nói bằng cụm động từ, đáp án viết bằng một động từ trang trọng. Hãy thuộc các cặp: put off thành postpone, call off thành cancel, turn down thành reject hoặc decline, hand in thành submit, hand out thành distribute, go over thành review, drop by thành visit, sort out thành resolve, wrap up thành finish.\nCâu hỏi suy luận trong phần nghe: \"What does the man imply about the report?\", \"What can be inferred about the woman?\". Người nói không nêu thẳng mà để lộ qua một chi tiết: \"I was supposed to finish it yesterday\" ngụ ý việc đó đang trễ; \"I'll have to turn it down\" ngụ ý không tham gia.\nỞ tốc độ thật, bạn không kịp vừa nghe vừa đọc hết bốn lựa chọn. Hãy đọc trước câu hỏi và chỉ gạch từ khoá của từng lựa chọn (một danh từ hoặc một động từ), rồi dồn sự chú ý vào băng.\n[P3]\nA:Hi, Sam. Do you have a few minutes to go over the budget report with me?\nB:I'd love to, but I'm supposed to hand in my own report by three, and I'm only halfway through.\nA:I understand. What about tomorrow morning?\nB:Tomorrow's fine. Actually, could you drop by my office at nine? I'll have the latest sales figures by then, and you'll need them anyway.\nA:Perfect. I'll put off sending the report to the director until we've talked.\n?What does the woman want to do?|Review a report with the man|Borrow some sales figures|Meet the director|Extend a deadline\n?What does the man imply?|He is too busy right now.|He has already finished his report.|He does not want to help.|He will be away tomorrow.\n?What will the woman postpone?|Sending a report|A meeting with the man|A sales presentation|A business trip\n--\nA:Did you hear that the company picnic has been called off?\nB:No! I thought everything was sorted out. The park was booked weeks ago.\nA:It was, but the forecast says there will be storms all day Saturday. The organizers didn't want to take the risk.\nB:That's a shame. Will they hold it on another day?\nA:They're looking into the following Saturday, but nothing is confirmed. They'll hand out a new schedule at Monday's meeting.\n?What are the speakers talking about?|A canceled company event|A problem with a park|A weather report for Monday|A late delivery\n?Why was the decision made?|Bad weather is expected.|The park was not available.|Too few people signed up.|The organizers were ill.\n?What will happen on Monday?|New information will be distributed.|The picnic will be held.|A new organizer will be chosen.|The park will be booked.\n--\nA:Mr. Evans, thank you for the job offer. I've looked over the contract carefully.\nB:I'm glad to hear it. Are you ready to sign?\nA:Well, the position is exactly what I was hoping for. But the offer from Harper Industries includes five more vacation days.\nB:I see. I can't change the vacation policy, but I could allow you to work from home on Fridays.\nA:That would make a big difference. Could I have until tomorrow to think it over?\nB:Of course. Just let me know before noon.\n?What are the speakers discussing?|An employment contract|A vacation schedule|A sales agreement|A work-from-home policy for all staff\n?What does the woman imply when she mentions Harper Industries?|She has another offer to consider.|She used to work there.|She dislikes that company.|She wants to recommend a friend.\n?What does the man offer?|A day of working from home each week|Five more vacation days|A higher salary|A later starting date\n[P4]\nN:OK, everyone, let's wrap up. I know it's been a long meeting. Before you go, I'm handing out the revised project schedule. As you'll see, the testing stage was supposed to start today, but the software still has errors, so we've put it off until the fifteenth. That means the launch will also move by about two weeks. I'd like each team leader to look over the new dates tonight and tell me tomorrow if you see any problems. And thanks to Maria's team for staying late all week to catch up.\n?What is the speaker distributing?|An updated schedule|A list of errors|A test report|A sales contract\n?What does the speaker imply about the launch?|It will be later than planned.|It has been canceled.|It will happen today.|It depends on Maria's team.\n?What are team leaders asked to do?|Check the new dates and report problems|Stay late all week|Start the testing today|Fix the software errors\n--\nN:Hi, Dana. It's Kevin from the print shop. I'm calling about the two thousand brochures you ordered. We were supposed to deliver them on Thursday, but one of our machines broke down this morning. The technician can't drop by until tomorrow afternoon, so we won't be able to finish before Friday evening. I know your event is on Saturday morning. If you'd like, I can bring them to the event venue myself first thing on Saturday instead of sending them to your office. Please call me back and let me know.\n?Why is the speaker calling?|To report a delay|To confirm an order|To request a payment|To cancel a delivery\n?What caused the problem?|A machine stopped working.|The order was lost.|The technician made a mistake.|The paper ran out.\n?What does the speaker offer to do?|Deliver the order to the venue|Give a discount|Print the brochures elsewhere|Deliver half the order on Thursday\n[P2]\nShould we put off the meeting until next week?|Yes, half the team is away.|Put it on the desk.|It was last week.\nDid Mr. Park turn down the offer?|He's still thinking about it.|Turn it down, please.|It's on the left.\nCould you look over this contract for me?|Sure, leave it on my desk.|I looked for it everywhere.|It's over there.\nWhen are we supposed to hand in the report?|By the end of the day.|To the director.|In my hand.\n[P5]\nThe outdoor event was 【called off|called on|called up|called in for】 because of heavy rain. >> \"Call off\": huỷ bỏ.\nPlease 【hand in|hand out of|hand over to|hand on】 your time sheets by Friday. >> \"Hand in\": nộp.\nMs. Diaz had to 【turn down|turn up|turn on|turn over to】 the invitation because of a schedule conflict. >> \"Turn down\": từ chối.\nLet's 【go over|go on|go off|go by】 the main points once more before the presentation. >> \"Go over\": xem lại.\nThe shipment was 【supposed|suppose|supposing|supposedly】 to arrive on Monday. >> \"Be supposed to\": lẽ ra phải.\nIt took the technician an hour to 【sort out|sort of|sort in|sort up】 the problem. >> \"Sort out\": giải quyết.\n##D8|Part 7: đoạn ba có bảng|Đơn hàng, hoá đơn và thư từ\n>Bộ ba hay gặp nhất: một bảng (đơn hàng, bảng giá, lịch), một email của khách và một email trả lời. Hai câu liên kết thường đi qua bảng.\n[V]Đơn hàng và vận chuyển\nbackorder|đơn hàng đang chờ vì hết hàng|The printer is on ＊; we expect it in two weeks.\nexpedite|đẩy nhanh|We can ＊ your order for an extra ten dollars, and it will arrive tomorrow.\ntracking number|mã theo dõi đơn hàng|Use the ＊ in your email to see where your package is.\ndispatch|gửi đi, điều đi|We will ＊ your order from our warehouse within 24 hours.\nbulk|số lượng lớn|Restaurants buy rice in ＊ because it is cheaper.\nsurcharge|phụ phí|There is a ＊ of five dollars for delivery to the islands.\nhandling|việc xử lý, bốc xếp|The price includes shipping and ＊.\nfragile|dễ vỡ|Be careful with that box; the glasses inside are ＊.\nitemized|được liệt kê từng khoản|Please send me an ＊ bill that shows the price of each product.\nbalance|số dư, số tiền còn lại|You paid 200 dollars, so the remaining ＊ is 50 dollars.\ncarrier|hãng vận chuyển|The ＊ lost the package somewhere between Hanoi and Da Nang.\nin transit|đang trên đường vận chuyển|Your order is ＊ and should arrive on Thursday.\n[N]\nKhi một trong ba văn bản là bảng, nó gần như chắc chắn được dùng cho câu liên kết. Trước khi đọc câu hỏi, hãy ghi nhớ bảng có những cột nào (mã hàng, số lượng, đơn giá, ngày giao, ghi chú).\nKiểu liên kết một: email nhắc một mã hàng hoặc tên sản phẩm, câu hỏi hỏi giá hoặc ngày giao của nó, bạn dò trong bảng. Kiểu liên kết hai: email trả lời nêu một ngoại lệ (\"the item marked with a star will be shipped separately\"), bạn phải tìm trong bảng món nào có dấu sao. Kiểu liên kết ba: cộng trừ đơn giản từ bảng theo một thay đổi nêu trong email (bỏ một món, thêm phụ phí).\nTừ viết tắt hay gặp trong bảng: Qty là quantity (số lượng), No. là number, Est. là estimated (ước tính), N/A là không áp dụng.\n[P7]\nT:Order confirmation: Kitchen World. Order number 60418. Customer: Rosa Mendez, Café Luna\n|Item|Qty|Unit price|Status\n|Coffee cups (box of 12)|4|30 dollars|In stock\n|Glass water jugs|6|15 dollars|In stock\n|Espresso machine X2|1|450 dollars|Backorder\n|Dessert plates (box of 12)|3|25 dollars|In stock\nShipping and handling: 20 dollars. Items in stock will be dispatched within two business days. Backordered items are shipped separately at no additional charge.\nT:From: Rosa Mendez. To: Kitchen World. Subject: Order 60418\nHello, I have just received my order confirmation. I am opening a second café on June 1, and I need everything by May 28 at the latest. Can you tell me when the item on backorder will arrive? If it cannot be delivered in time, I would like to cancel that item only. Also, the last time I ordered glass items from you, two were broken on arrival, so please make sure the jugs are packed carefully. Thank you, Rosa Mendez\nT:From: Kitchen World Customer Service. To: Rosa Mendez. Subject: Re: Order 60418\nDear Ms. Mendez, thank you for your message. The in-stock items were dispatched this morning; your tracking number is KW-88213. The fragile items have been packed in a separate box with extra protection.\nWe expect the backordered item on June 5, which is later than you need. We can cancel it as you requested, or we can offer the Espresso machine X3, which is in stock, for the same price. The X3 could be expedited to arrive by May 26. Please let us know which you prefer. Sincerely, Tony Park\n?What is indicated about the order?|One item is not currently available.|All items were shipped together.|Shipping is free.|The customer ordered twelve cups.\n?Which item is Ms. Mendez worried may arrive too late?|The espresso machine|The coffee cups|The water jugs|The dessert plates >> Câu liên kết: email nói về món đang backorder; bảng cho biết đó là Espresso machine X2.\n?Why does Ms. Mendez need the order by May 28?|She is opening a new café.|She is going on vacation.|Her old machine is broken.|She has a party.\n?Which items were packed with extra protection?|The glass water jugs|The coffee cups|The dessert plates|The espresso machine >> Câu liên kết: thư trả lời nói \"fragile items\"; email của khách cho biết đó là đồ thuỷ tinh, tức các bình nước.\n?What does Mr. Park offer?|A different model at the same price|A refund for the whole order|Free shipping|A discount on the X2\n--\nT:Greenline Office Supply: Bulk price list\n|Product|1–9 boxes|10–49 boxes|50 or more boxes\n|Copy paper|25 dollars|22 dollars|20 dollars\n|Envelopes|12 dollars|10 dollars|9 dollars\n|Printer ink|40 dollars|36 dollars|33 dollars\nPrices are per box. Orders of 50 boxes or more of any one product are delivered free. For all other orders, a delivery surcharge of 15 dollars applies.\nT:From: Alan Wright, Wright and Sons. To: Greenline Office Supply. Subject: Order\nHello, I would like to order 20 boxes of copy paper and 5 boxes of printer ink. Please send an itemized invoice to this email address. We would like to pay half now and the balance after delivery, as we did last time. Could you confirm that this arrangement is still acceptable? Regards, Alan Wright\nT:INVOICE. Greenline Office Supply. Customer: Wright and Sons\n|Item|Qty|Unit price|Amount\n|Copy paper|20|22 dollars|440 dollars\n|Printer ink|5|40 dollars|200 dollars\n|Delivery surcharge|1|15 dollars|15 dollars\nTotal: 655 dollars. Paid: 327.50 dollars. Balance due on delivery: 327.50 dollars. Carrier: Swift Delivery. Status: In transit. Estimated arrival: March 9.\n?According to the price list, when is delivery free?|When 50 or more boxes of one product are ordered|When the order is over 500 dollars|When the customer pays in advance|When the order is picked up\n?Why was Mr. Wright charged 22 dollars per box of paper?|He ordered between 10 and 49 boxes.|He is a new customer.|He paid in advance.|He ordered ink as well. >> Câu liên kết: email ghi 20 hộp giấy; bảng giá cho mức 10–49 hộp là 22 đô la.\n?What did Mr. Wright ask about?|A payment arrangement|A discount on ink|A faster delivery|A change of address\n?What is suggested about Mr. Wright's request?|It was accepted.|It was refused.|It was ignored.|It was changed to full payment. >> Câu liên kết: ông xin trả một nửa trước; hoá đơn ghi đã trả 327,50 và còn lại 327,50.\n?What is indicated about the order on the invoice?|It has not arrived yet.|It was delivered on March 9.|It was canceled.|It is on backorder.\n[P6]\nT:Dear Ms. Grant,\nThank you for your order of twenty glass vases. Unfortunately, the vases are currently on __(1)__, and we do not expect new stock until August 15. We apologize for the delay. __(2)__ If you prefer not to wait, we can offer a similar vase in blue glass, which is available now. Because these items are fragile, they are sent by a special carrier, and a small __(3)__ of eight dollars applies. Please reply by Friday; otherwise, we will keep your original order and __(4)__ it as soon as the stock arrives.\nSincerely, Leo Kim, Home Style\n?(1)|backorder|bulk|balance|transit >> \"On backorder\": đang chờ hàng về.\n?(2)|We understand that this may be inconvenient for you.|The vases are made of plastic.|Our store opens at nine.|Your payment has been refunded.\n?(3)|surcharge|discount|refund|deposit >> Khoản thu thêm cho hãng vận chuyển đặc biệt: surcharge.\n?(4)|dispatch|dispatches|dispatching|dispatched >> Song song với \"keep\" sau \"will\": động từ nguyên mẫu.\n[P2]\nWhere's my order now?|It's in transit and should arrive tomorrow.|It's in order.|From the warehouse.\nCan you expedite the delivery?|Yes, for an additional ten dollars.|It was delivered.|By truck.\nDo you offer a discount for bulk orders?|Yes, for fifty boxes or more.|It's very large.|In the catalog.\nCould I have an itemized invoice?|I'll email one to you right away.|It's the first item.|The voice is clear.\n[P5]\nOrders are usually 【dispatched|disputed|displaced|disposed】 within one business day. >> \"Dispatch\": gửi hàng đi.\nPlease handle this package with care, as the contents are 【fragile|fragment|fraction|frequent】. >> \"Fragile\": dễ vỡ.\nThe remaining 【balance|ballot|balcony|bargain】 must be paid within thirty days. >> \"Balance\": số tiền còn lại phải trả.\nWe offer lower prices to customers who buy in 【bulk|bulb|bull|bundle of】. >> \"In bulk\": với số lượng lớn.\nFor an extra fee, we can 【expedite|expend|expire|explore】 your shipment. >> \"Expedite\": đẩy nhanh.\nA fuel 【surcharge|surface|surplus|survey】 has been added to all deliveries. >> \"Surcharge\": phụ phí.\n##D9|Part 5 và Part 6: từ vựng nâng cao|Tính từ khó và cách chọn giữa các từ gần nghĩa\n>Ở mức 800, câu hỏi từ vựng dùng những tính từ ít gặp trong hợp đồng, báo cáo, tin tuyển dụng. Bài này dạy mười hai từ như vậy và cách loại đáp án bằng từ đi kèm.\n[V]Tính từ của văn bản kinh doanh\nsubstantial|đáng kể, lớn|The company made a ＊ profit of ten million dollars.\npreliminary|sơ bộ, bước đầu|These are only ＊ results; the final report will come next month.\nprospective|tiềm năng, tương lai (chưa chính thức)|We met with three ＊ buyers who may want the building.\nconsecutive|liên tiếp|Sales have risen for five ＊ months, from January to May.\ncompetent|có năng lực|She is a ＊ manager who always finishes projects on time.\nconfidential|bảo mật, kín|This report is ＊; do not show it to anyone outside the company.\ncompatible|tương thích|This printer is not ＊ with my old computer.\nliable|chịu trách nhiệm pháp lý|The company is ＊ for any damage caused by its drivers.\nobsolete|lỗi thời, không còn dùng|Fax machines are almost ＊; few offices still use them.\nfeasible|khả thi|The plan is not ＊; we do not have enough money or time.\nstringent|nghiêm ngặt|The factory must follow ＊ safety rules, with inspections every week.\nlucrative|sinh lợi nhiều|Selling coffee turned out to be a very ＊ business.\n[G]\n@Chọn từ theo từ đi kèm|Mỗi tính từ có \"bạn đồng hành\" riêng|substantial + increase / amount / discount · preliminary + results / talks / estimate · prospective + customer / employee / buyer · consecutive + days / years / quarters · confidential + information / documents · stringent + rules / standards / requirements · lucrative + contract / market / deal · be compatible with · be liable for · be eligible for · be subject to\nKhi bốn lựa chọn đều là tính từ và nghĩa gần nhau, hãy nhìn danh từ đứng sau hoặc giới từ đứng sau. Tiếng Anh ghép sẵn từng cặp, và đề thi kiểm tra đúng những cặp đó.\n!Cặp dễ nhầm theo hình thức: considerable (đáng kể) và considerate (chu đáo); confident (tự tin) và confidential (bảo mật); economic (thuộc kinh tế) và economical (tiết kiệm); successful (thành công) và successive (liên tiếp).\n>The company reported a 【substantial|consecutive|compatible|confidential】 increase in profits.=Công ty báo cáo mức tăng lợi nhuận đáng kể.\n>All 【prospective|preliminary|obsolete|liable】 employees must pass a medical check.=Mọi ứng viên sắp được tuyển phải qua kiểm tra sức khoẻ.\n>The team has won the award for three 【consecutive|substantial|stringent|feasible】 years.=Nhóm đã giành giải ba năm liên tiếp.\n>This software is 【compatible|competent|confidential|lucrative】 with all operating systems.=Phần mềm này tương thích với mọi hệ điều hành.\n>Please keep this information strictly 【confidential|confident|considerate|consecutive】.=Vui lòng giữ kín tuyệt đối thông tin này.\n+The airline must meet 【stringent|lucrative|prospective|obsolete】 safety standards.=Hãng hàng không phải đáp ứng các tiêu chuẩn an toàn nghiêm ngặt.\n+The tenant is 【liable|feasible|compatible|eligible】 for any damage to the apartment.=Người thuê chịu trách nhiệm về mọi hư hại của căn hộ.\n[N]\nKhi không biết nghĩa cả bốn từ, vẫn có ba cách loại. Một: giới từ sau chỗ trống (with thì nghĩ đến compatible, familiar, satisfied; for thì nghĩ đến liable, eligible, responsible; to thì nghĩ đến subject, similar, equal). Hai: sắc thái tích cực hay tiêu cực của câu. Ba: từ đó tả người hay tả vật (competent tả người; feasible tả kế hoạch).\n[P5]\nThe new tax will have a 【substantial|consecutive|competent|prospective】 effect on small businesses. >> \"A substantial effect\": tác động đáng kể.\nAccording to the 【preliminary|obsolete|liable|lucrative】 report, sales fell by two percent. >> \"Preliminary report\": báo cáo sơ bộ.\nThe landlord is not 【liable|feasible|compatible|stringent】 for items stolen from the parking lot. >> \"Be liable for\": chịu trách nhiệm pháp lý về.\nIt rained for six 【consecutive|substantial|confidential|competent】 days last week. >> \"Consecutive days\": những ngày liên tiếp.\nThe engineers decided that building a tunnel was not 【feasible|liable|prospective|consecutive】. >> \"Feasible\": khả thi, dùng cho kế hoạch.\nOld machines become 【obsolete|lucrative|stringent|preliminary】 when better technology appears. >> \"Become obsolete\": trở nên lỗi thời.\nThe company signed a 【lucrative|competent|compatible|consecutive】 contract with the government. >> \"A lucrative contract\": hợp đồng béo bở.\nEmployee salaries are 【confidential|confident|considerate|considerable】 and should not be discussed. >> \"Confidential\": bảo mật. \"Confident\" là tự tin.\nWe are looking for a 【competent|compatible|consecutive|preliminary】 accountant with five years of experience. >> \"Competent\" tả người có năng lực.\nMake sure the new parts are 【compatible|competent|liable|eligible】 with the existing equipment. >> \"Be compatible with\": tương thích với.\nThe bank has 【stringent|substantial of|prospective|obsolete】 requirements for business loans. >> \"Stringent requirements\": yêu cầu nghiêm ngặt.\nThe sales team met with several 【prospective|preliminary|consecutive|feasible】 clients at the trade fair. >> \"Prospective clients\": khách hàng tiềm năng.\n[P6]\nT:To: All sales staff. Subject: Confidential pricing\nAs you know, we are in talks with Northfield Stores about a three-year supply contract. If we are successful, it will be the most __(1)__ deal in our company's history. The prices we have offered are strictly __(2)__. Please do not discuss them with anyone outside the sales team, including other customers. __(3)__ We expect a decision within two weeks. Until then, all questions from Northfield should be __(4)__ to me.\n?(1)|lucrative|obsolete|liable|consecutive >> Hợp đồng sinh lợi nhất: lucrative deal.\n?(2)|confidential|confident|compatible|competent >> Giá chào là thông tin bảo mật.\n?(3)|A competitor could use this information to make a lower offer.|Northfield has fifty stores.|Our office will close early on Friday.|The contract was signed last year.\n?(4)|forwarded|forward|forwarding|forwards >> Bị động sau \"should be\": V3.\n--\nT:Notice to users of the Atlas 200 printer\nAfter ten years, we will stop producing ink for the Atlas 200 on December 31, as this model is now __(1)__. We understand that many customers still use it. __(2)__ To thank you for your loyalty, we are offering a __(3)__ discount of forty percent on the new Atlas 500. The Atlas 500 is fully __(4)__ with all current computers and phones. This offer is valid until January 31.\n?(1)|obsolete|feasible|lucrative|stringent >> Mẫu máy đã lỗi thời.\n?(2)|However, the parts needed to make the ink are no longer available.|The printer was first sold in blue.|Our office moved last year.|Please send us your old receipts.\n?(3)|substantial|preliminary|prospective|confidential >> \"A substantial discount\": mức giảm giá lớn.\n?(4)|compatible|competent|liable|consecutive >> \"Compatible with\": tương thích với.\n[P7]\nT:Job announcement: Regional Sales Manager, Pacific Tools\nPacific Tools, a leading maker of garden equipment, is looking for a competent and experienced Regional Sales Manager for its Da Nang office. The successful candidate will oversee a team of twelve and will be responsible for finding prospective customers in central Vietnam.\nRequirements: at least five consecutive years of experience in sales, a university degree, and good English. Experience in the garden equipment market is preferred but not mandatory.\nWe offer a competitive salary, a substantial yearly bonus based on results, and health insurance. All applications are treated as confidential. Please send your resume to the personnel office by March 15. Only candidates selected for a preliminary interview will be contacted.\n?What is the main duty of the position?|Managing a sales team and finding customers|Designing garden equipment|Hiring new staff|Runnin
