w them as a problem. Phones rang during lessons, and students sent messages instead of listening. As a result, many schools simply banned them.\n[B] Today, some teachers take a different view. A phone is a small computer, and students can use it to check facts, record experiments or practise a language. In schools that cannot afford a computer room, phones may be the only way to get online.\n[C] Research results are mixed. One study of schools in four English cities found that test scores rose after phones were banned, especially for weaker students. Other researchers argue that the results depend on how the phones are used, not on whether they are allowed.\n[D] Perhaps the best answer lies between the two positions. A growing number of schools let students use phones for certain tasks but ask them to keep the devices in a box for the rest of the lesson. In this way, students learn when technology helps and when it distracts.\n^Choose the correct heading for each paragraph from the list, then answer the question.\n&i What studies have shown|ii A middle way|iii The price of new technology|iv Early reactions to phones|v Phones as learning tools|vi Why parents disagree\n:Paragraph A|iv\n:Paragraph B|v\n:Paragraph C|i\n:Paragraph D|ii\n?According to paragraph C, which students improved most after a ban?|weaker students|older students|students in small schools|students with their own computers\n##8|Summary completion|Điền tóm tắt bằng từ trong bài\n!Tóm tắt là bản viết lại một phần bài bằng từ khác. Xác định phần bài tương ứng trước, rồi mới tìm từng từ.\n!Đoán từ loại của ô trống. Sau \"sorted by\" phải là một danh từ.\n!\"ONE WORD ONLY from the passage\": chỉ một từ, có trong bài, đúng chính tả.\nT:Recycling glass\nGlass is one of the few materials that can be recycled again and again without losing quality. The process begins when used bottles and jars are collected from homes and taken to a recycling plant. There, they are sorted by colour, because clear, green and brown glass must be melted separately.\nNext, the glass is washed to remove paper labels and food, and then crushed into small pieces called cullet. The cullet is mixed with sand and heated in a furnace at about 1,500 degrees Celsius until it becomes liquid. Finally, the liquid glass is poured into moulds to make new bottles.\nUsing cullet saves energy, because it melts at a lower temperature than raw materials. For every tonne of glass that is recycled, more than a tonne of sand and other natural resources is saved.\n^Complete the summary. Choose ONE WORD ONLY from the passage for each answer.\n_At the plant, used glass is first sorted by ＊|colour\n_Washing removes food and paper ＊|labels\n_The glass is crushed into pieces known as ＊|cullet\n_These pieces are mixed with ＊ and heated in a furnace|sand\n_The liquid glass is poured into ＊ to make bottles|moulds\n_Recycling saves ＊ because cullet melts at a lower temperature|energy\n##9|Multiple choice|Trắc nghiệm bốn lựa chọn\n!Câu hỏi đi theo thứ tự bài. Đọc phần thân câu hỏi, tìm đoạn tương ứng, đọc kỹ rồi mới xem các lựa chọn.\n!Lựa chọn sai thường chứa từ có trong bài nhưng sai quan hệ: ngược nghĩa, sai đối tượng, hoặc bài không nói.\n!Câu \"Why does the writer mention…?\" hỏi mục đích của chi tiết, không hỏi bản thân chi tiết.\nT:Walking: the forgotten exercise\nFor many people, exercise means joining a gym or running long distances. Yet scientists say that one of the best forms of exercise is also the simplest: walking. A brisk thirty-minute walk each day can lower the risk of heart disease and help to control weight. Unlike running, walking puts little pressure on the knees, so injuries are rare.\nWalking is good for the mind as well as the body. In one experiment, office workers who walked at lunchtime reported less stress in the afternoon and found it easier to concentrate. Some companies now hold \"walking meetings\", in which staff discuss ideas outside instead of sitting around a table.\nThe main reason people give for not walking is lack of time. However, experts point out that the average adult spends more than three hours a day looking at a phone. They suggest small changes, such as getting off the bus one stop early or using the stairs. The aim is not to become an athlete but simply to sit less.\n^Choose the correct answer.\n?What does the writer say about walking compared with running?|It is less likely to cause injuries.|It burns more energy.|It takes more time.|It is more popular with scientists.\n?In the experiment, workers who walked at lunchtime|felt less stressed later in the day.|worked longer hours.|had more meetings.|ate a healthier lunch.\n?What is a \"walking meeting\"?|a discussion held while walking outdoors|a meeting about the health of staff|a short meeting without chairs|a walk organised after work\n?Why do experts mention phone use?|to show that people do have time to walk|to explain why people feel stressed|to suggest a way of counting steps|to warn of a danger when walking\n?What is the main aim of the experts' advice?|to reduce the time people spend sitting|to turn people into athletes|to make people give up their phones|to encourage people to join a gym\n##10|Yes / No / Not Given|Quan điểm của tác giả\n#yn\n!YES / NO / NOT GIVEN hỏi quan điểm của tác giả chứ không hỏi sự thật. Tìm từ thể hiện thái độ: I believe, sensible, weak, unfair.\n!Tác giả hay nhắc ý kiến người khác (\"Critics say…\") rồi bác bỏ. Đáp án theo tác giả, không theo \"critics\".\n!NO là tác giả nói ngược lại. NOT GIVEN là tác giả không bày tỏ gì về điều đó.\nT:Should cities close their centres to cars?\nEvery few months another city announces that it will close its centre to cars. I believe this is one of the most sensible decisions a local government can make. Streets that were built for people and horses are not suitable for thousands of vehicles, and the result is noise, dirty air and danger for pedestrians.\nShop owners usually protest, fearing that customers will stay away. In practice, the opposite tends to happen. When people walk, they stop more often and spend more. Nevertheless, a ban is not enough on its own. Unless a city provides cheap and frequent public transport, the traffic simply moves to the surrounding neighbourhoods, which is unfair to the residents there.\nCritics also say that car-free zones only benefit the rich who live in the centre. This argument is weak. It is poorer families, who are less likely to own a car, that gain most from safer streets and better buses.\n^Do the following statements agree with the views of the writer? Choose YES, NO or NOT GIVEN.\n=Y|Closing city centres to cars is a wise policy. >> \"one of the most sensible decisions\".\n=N|Shops lose customers when streets are closed to traffic. >> Tác giả viết điều ngược lại thường xảy ra: người đi bộ dừng lại và mua nhiều hơn.\n=Y|A car ban should be combined with good public transport. >> \"a ban is not enough on its own. Unless a city provides…\".\n=G|Electric cars should be allowed into car-free zones. >> Tác giả không hề nhắc đến xe điện.\n=N|Car-free zones are mainly good for wealthy people. >> Đó là ý của \"critics\"; tác giả gọi lập luận này là \"weak\".\n=G|Most European cities will be car-free within ten years. >> Bài không đưa ra dự đoán nào như vậy.\n##11|Matching features|Nối ý kiến với từng nhà nghiên cứu\n!Khoanh tên các nhà nghiên cứu trong bài trước, rồi đọc ý kiến nằm quanh mỗi tên.\n!Một người có thể được chọn nhiều lần.\n!Câu hỏi không theo thứ tự bài và luôn được diễn đạt lại: \"know far more words\" thành \"increases vocabulary\".\nT:How should children learn to read?\nTeachers have argued for decades about the best way to teach reading. Dr Elena Marsh, who has studied primary schools for twenty years, believes that children must first learn the sounds of letters. In her view, a child who can sound out a word can read anything, even words never seen before.\nProfessor David Okoye disagrees. He argues that drilling sounds is boring and that children learn best when adults read exciting stories to them every day. According to his research, children who are read to at home begin school knowing far more words.\nA third researcher, Dr Lin Wei, has compared both methods in thirty schools. She found that pupils taught with sounds read more accurately at age seven, but that the difference had disappeared by age eleven. What mattered more in the long term, she concluded, was the number of books a child had in the home.\n^Match each statement with the correct researcher, A, B or C. You may use any letter more than once.\n&A Dr Marsh|B Professor Okoye|C Dr Lin\n:Listening to stories increases a child's vocabulary.|B\n:The advantage of one method does not last.|C\n:Knowing letter sounds allows children to read unfamiliar words.|A\n:Repeating sounds is not interesting for children.|B\n:Having books at home is the most important factor over time.|C\n##12|Flow-chart completion|Điền sơ đồ quy trình\n!Sơ đồ tóm tắt một quy trình trong bài. Các từ First, then, Finally giúp bạn dò đúng chỗ.\n!Khác với matching, đáp án trong sơ đồ thường theo đúng thứ tự bài.\n!Số liệu trong bài (5,000; 300; 100) là mốc định vị tốt dù không phải đáp án.\nT:Applying for a job at Norland Bank\nNorland Bank receives more than 5,000 job applications a year, and every one goes through the same five stages. First, candidates complete an online form and upload their CV. A computer program checks each form for basic requirements, such as a university degree, and about half of the applicants are rejected at this point.\nThose who remain are invited to take a 40-minute online test of maths and problem solving. The best 300 candidates then move to the third stage, a video interview with a member of the human resources team.\nIn the fourth stage, around 100 people spend a full day at the head office, where they work in groups on a business task while managers observe them. Finally, successful candidates receive a job offer by phone within a week, followed by a written contract. New employees start with a three-month training period.\n^Complete the flow-chart. Write NO MORE THAN TWO WORDS from the passage for each answer.\n_Stage 1: complete an online form and upload a ＊|CV\n_A ＊ checks each form for basic requirements|computer program/program\n_Stage 2: an online test of ＊ and problem solving|maths\n_Stage 3: a video ＊ with human resources|interview\n_Stage 4: a day at head office, working in ＊ on a business task|groups\n_Stage 5: a job offer by ＊, then a written contract|phone\n##13|Mixed|Bài trộn dạng, làm trong 8 phút\n!Bài này trộn dạng như Passage 1 của đề thật. Đặt đồng hồ 8 phút cho 6 câu.\n!Thứ tự hợp lý: skim bài trong 1 phút, làm nhóm T/F/NG và điền từ trước vì chúng theo thứ tự bài, cuối cùng mới làm trắc nghiệm.\n!Hết giờ mà chưa xong thì đoán. IELTS không trừ điểm câu sai, đừng bao giờ bỏ trống.\nT:The power of the jingle\nA jingle is a short song used in an advertisement. Jingles first became popular on American radio in the 1920s, when companies discovered that listeners remembered a tune more easily than a spoken message. By the 1950s, almost every large brand had its own song.\nWhy do jingles work? Psychologists explain that music is stored in a different part of the memory from ordinary speech. A simple tune that repeats itself can stay in the mind for hours, whether we like it or not. This effect is sometimes called an \"earworm\".\nIn recent years, however, the traditional jingle has become less common. Many advertisers now prefer to pay for a well-known pop song, which makes a product seem fashionable. Others use only a few notes, known as a sound logo, at the end of an advert. These last just two or three seconds, but research suggests that people recognise them as quickly as a picture.\n^Questions 1–3: choose TRUE, FALSE or NOT GIVEN. Questions 4–5: write ONE WORD ONLY from the passage. Question 6: choose the correct answer.\n=T|Jingles became popular because tunes were easier to remember than speech.\n=N|The first jingle was written for a food company. >> Bài không nói jingle đầu tiên dành cho công ty nào.\n=F|Psychologists say music and speech are stored in the same part of the memory. >> \"a different part of the memory\".\n_A tune that stays in the mind is sometimes called an ＊|earworm\n_Advertisers use famous pop songs to make a product seem ＊|fashionable\n?What is said about sound logos?|People recognise them very quickly.|They are longer than jingles.|They are cheaper than pop songs.|They are played at the start of adverts.\n##14|Matching headings|Tiêu đề bẫy ở mức khó hơn\n!Tiêu đề bẫy thường lấy đúng một từ nổi bật trong đoạn (\"coal\" ở đoạn D) nhưng nói sai ý của đoạn.\n!Câu chủ đề không phải lúc nào cũng là câu đầu. Đoạn mở bằng \"Even so\" thì phải đọc hết mới thấy ý chính.\n!Gặp hai tiêu đề gần giống nhau: tìm điểm khác biệt rồi soát lại đoạn.\nT:Wind power: promise and problems\n[A] Thirty years ago, wind turbines were small, expensive and unreliable, and few governments took them seriously. Since then, the cost of wind electricity has fallen dramatically, mainly because turbines have become much larger. A single modern turbine at sea can supply thousands of homes.\n[B] Wind has an obvious weakness: it does not blow all the time. On calm days, countries that rely on turbines must switch on gas power stations or buy electricity from their neighbours. Engineers are therefore working on giant batteries that can store energy for the days when it is needed.\n[C] Not everyone welcomes the new machines. People who live near wind farms sometimes complain about the noise and say that the turbines spoil the view. Birds can also be killed by the blades. In response, more and more wind farms are being built far out at sea, where nobody can see or hear them.\n[D] Even so, wind alone will not solve the energy problem. Most experts expect that future electricity will come from a mixture of sources, including solar and nuclear power. What is clear is that the age of coal is ending, and that wind will play a major part in what replaces it.\n^Choose the correct heading for each paragraph from the list, then answer the question.\n&i Objections from local communities|ii Wind as one part of the answer|iii How turbines are manufactured|iv From minor technology to cheap power|v The problem of an irregular supply|vi Why coal is still necessary|vii Jobs created by wind farms\n:Paragraph A|iv\n:Paragraph B|v\n:Paragraph C|i\n:Paragraph D|ii\n?What solution to the problem in paragraph B is being developed?|large batteries|bigger turbines|new gas power stations|undersea cables\n##15|Matching sentence endings|Ghép nửa đầu câu với phần kết\n!Nửa đầu câu đi theo thứ tự bài. Tìm chỗ nhắc đến nó, đọc kỹ rồi mới chọn phần kết.\n!Câu ghép xong phải vừa đúng ý bài vừa đúng ngữ pháp.\n!Số phần kết nhiều hơn số câu. Phần kết bẫy nghe hợp lý nhưng bài không nói, ví dụ \"received a prize\".\nT:Accidental discoveries\nMany important discoveries were not planned. In 1928, the scientist Alexander Fleming returned from holiday and found that mould was growing on one of his glass dishes. Around the mould, the bacteria had died. Instead of throwing the dish away, he studied it, and the result was penicillin, the first antibiotic.\nIn 1895, the German physicist Wilhelm Röntgen was experimenting with electricity in a dark room when he noticed that a screen on the other side of the room was glowing. Some unknown rays were passing through the air. He called them X-rays, because X is the symbol for something unknown.\nA more recent example comes from an American company. In 1968, a chemist named Spencer Silver tried to make a very strong glue but produced a very weak one. Nobody could think of a use for it until a colleague, Art Fry, put it on small pieces of paper to mark the pages of his song book. The sticky note was born.\nWhat these stories share is not luck alone. In each case, someone noticed something unexpected and was curious enough to ask why.\n^Complete each sentence with the correct ending, A–F.\n&A was trying to create a powerful glue.|B gave a name to something he did not understand.|C found a practical use for another person's invention.|D decided to examine a dish instead of throwing it away.|E received a prize for a discovery made by a colleague.|F asked questions about surprising results.\n:Alexander Fleming|D\n:Wilhelm Röntgen|B\n:Spencer Silver|A\n:Art Fry|C\n:Each of the people in the passage|F\n##16|Yes / No / Not Given · Multiple choice|Quan điểm tác giả ở bài lập luận\n#yn\n!Tìm \"giọng\" của tác giả: In my view, surprisingly, must, appear to be. Đáp án YES / NO nằm ở những chỗ đó.\n!Câu hỏi có từ tuyệt đối (all, strong evidence) phải được đối chiếu thật kỹ với mức độ tác giả dùng.\n!\"This does not mean that…\" là cách tác giả chặn một cách hiểu sai. Rất hay thành câu hỏi NO.\nT:Does prison work?\nPoliticians often promise to be \"tough on crime\" by building more prisons. It is easy to see why this is popular: voters want to feel safe. Yet the evidence that prison reduces crime is surprisingly thin. In several countries, more than half of prisoners commit another offence within a few years of leaving.\nIn my view, the explanation is simple. Prison removes people from their jobs and families, which are exactly the things that keep most of us out of trouble. A young man who enters prison for stealing may come out with no home, no work and a new group of criminal friends.\nThis does not mean that prisons should be closed. Violent offenders must be kept away from the public. For less serious crimes, however, punishments in the community, such as unpaid work, cost far less and appear to be at least as effective. Governments avoid them only because they fear looking weak.\n^Do the following statements agree with the views of the writer? Choose YES, NO or NOT GIVEN. Then choose the correct answer.\n=Y|It is understandable that building prisons is popular with the public. >> \"It is easy to see why this is popular\".\n=N|There is strong evidence that prison lowers the crime rate. >> Tác giả viết bằng chứng \"surprisingly thin\".\n=G|Prisons in the writer's country are overcrowded. >> Không được nhắc đến.\n=N|All prisons ought to be shut down. >> \"This does not mean that prisons should be closed\".\n=Y|Community punishments are cheaper than prison. >> \"cost far less\".\n?Why, according to the writer, do governments avoid community punishments?|They are afraid of appearing weak.|They cost too much.|The public has never heard of them.|They do not work for young offenders.\n##17|Matching information|Đoạn nào chứa thông tin này\n!Câu hỏi không theo thứ tự bài và được diễn đạt khái quát hơn: \"a natural resource\" chính là \"water\".\n!Đọc hết các mô tả trước, gạch từ khoá, rồi đọc từng đoạn và tự hỏi: đoạn này trả lời được mô tả nào?\n!Một đoạn có thể dùng hai lần. Đề thật sẽ ghi \"You may use any letter more than once\".\nT:Tourism and the small island\n[A] Twenty years ago, the island of Maru had one hotel and a weekly ferry. Today it receives 400,000 visitors a year, more than a hundred times its population. Tourism now provides four out of every five jobs.\n[B] The money has transformed daily life. The island has a new hospital and a secondary school, so teenagers no longer have to leave home at twelve to study on the mainland.\n[C] But success has brought difficulties. In summer, visitors use so much water that the supply to local homes is sometimes cut off for hours. House prices have risen so fast that young islanders cannot afford to buy a home in the village where they were born.\n[D] Traditional culture has also changed. Fishing boats now take tourists to see dolphins, and the old harvest festival has been moved from October to August, when more visitors can watch it. Some older residents feel that it has become a show rather than a celebration.\n[E] The island council is now trying to limit the damage. From next year, the number of ferry passengers will be capped at 2,000 a day, and every visitor will pay a small tax to fund water projects.\n^Which paragraph contains the following information? You may use any letter more than once.\n&A|B|C|D|E\n:an example of an event whose date was changed|D\n:a description of measures planned for the future|E\n:a comparison between the number of tourists and residents|A\n:a reference to a shortage of a natural resource|C\n:a benefit for young people's education|B\n:a mention of a problem in the housing market|C\n##18|Summary completion with a word list|Điền tóm tắt bằng từ trong khung\n!Dạng có khung từ: đáp án là chữ cái. Từ trong khung có thể là từ đồng nghĩa hoặc chính từ trong bài.\n!Loại trước những từ sai từ loại. Sau \"better\" cần danh từ; trước \"people\" cần tính từ.\n!Khung luôn thừa từ, và thường có cặp trái nghĩa (older, younger) để bẫy.\nT:Why do we live longer?\nIn 1900, the average person in Western Europe could expect to live for less than fifty years. A century later, life expectancy had risen to almost eighty. It is tempting to think that this was the work of brilliant doctors and new medicines, but historians give most of the credit to something less exciting: clean water. When cities built sewers and began to filter drinking water, diseases such as cholera almost disappeared.\nBetter food played a part too. Children who had enough to eat were stronger and more likely to survive infections. Vaccines, which became widely available in the middle of the century, then protected them from illnesses that had once killed thousands every year.\nModern medicine matters most in later life. Operations and drugs for heart disease have added years to the lives of older people. The next big gains, experts say, will not come from hospitals at all but from changes in behaviour, such as smoking less and exercising more.\n^Complete the summary using the list of words, A–H.\n&A behaviour|B water|C doctors|D vaccines|E food|F hospitals|G older|H younger\n:Historians believe the main cause of longer lives was cleaner …|B\n:Children also became stronger because they had better …|E\n:From the middle of the twentieth century, … prevented many deadly illnesses.|D\n:Heart operations and drugs mostly help … people.|G\n:In future, the biggest improvements will come from changes in …|A\n##19|Mixed|Kiểu Passage 3: bài lập luận có phản biện\n!Passage 3 thường là bài lập luận: một quan điểm, bằng chứng, rồi ý kiến phản biện. Nhận ra khung này giúp định vị nhanh.\n!Chú ý ai nói gì: economists, researchers, Schwartz, critics. Câu hỏi hay gán ý cho sai người.\n!Trong đề thật hãy dành 20–23 phút cho Passage 3 vì nó khó nhất. Đừng để Passage 1 ăn mất thời gian.\nT:The paradox of choice\nEconomists have traditionally assumed that more choice is always better for consumers. A famous experiment in a Californian supermarket challenged this idea. Researchers set up a table where shoppers could taste jam. On some days there were twenty-four flavours; on others, only six. The larger display attracted more people, but only 3% of them bought a jar. At the smaller display, 30% did.\nThe psychologist Barry Schwartz calls this \"the paradox of choice\". He argues that when we face too many options, we worry about making the wrong decision and often end up choosing nothing. Even when we do choose, we feel less satisfied, because we keep imagining the alternatives we rejected.\nNot all researchers are convinced. Later studies have sometimes failed to repeat the jam result, and critics suggest that the effect depends on how well customers already know the product. An expert may enjoy a hundred options that would confuse a beginner. For businesses, the practical lesson is perhaps not to offer less, but to make choosing easier.\n^Question 1 and 6: choose the correct answer. Question 2: write A NUMBER. Questions 3–5: choose TRUE, FALSE or NOT GIVEN.\n?What was surprising about the jam experiment?|Fewer options led to more sales.|Shoppers preferred the larger display.|Most shoppers bought nothing at either table.|Shoppers could not tell the flavours apart.\n_At the display with six flavours, ＊% of people bought jam|30/thirty\n=T|Schwartz believes too much choice can stop people from deciding at all. >> \"often end up choosing nothing\".\n=F|According to Schwartz, people are happier with their decision when they have many options. >> \"we feel less satisfied\".\n=N|Schwartz carried out the jam experiment himself. >> Bài chỉ viết \"Researchers\", không nói đó là ai.\n?What do critics say about the effect?|It may depend on how much the customer knows.|It only happens in supermarkets.|It has been proved many times.|It is stronger for experts.\n##20|Mixed|Quản lý thời gian như đề thật\n!Đề thật: 60 phút cho 3 bài, nên chia khoảng 17, 20 và 23 phút. Không có thêm giờ chép đáp án.\n!Câu nào quá 90 giây chưa ra thì chọn tạm, đánh dấu, làm tiếp rồi quay lại sau.\n!Nội dung bài đọc này cũng là lý do lộ trình có mục \"Ôn bài cũ\" mỗi ngày.\nT:Why do we forget?\nIn 1885 the German psychologist Hermann Ebbinghaus carried out a simple but exhausting experiment on himself. He memorised lists of meaningless syllables, such as \"zof\" and \"kaf\", and then tested how many he could still remember after different periods of time. The results, which he drew as a graph, became known as the \"forgetting curve\".\nThe curve shows that forgetting is fastest immediately after learning. Within a day, Ebbinghaus had lost more than half of what he had learned. After that, the rate slowed down, and the small amount that remained after a week was still there a month later.\nEbbinghaus also discovered a solution. Each time he reviewed a list, he forgot it more slowly than before. Reviewing after one day, then after a few days, then after a couple of weeks kept the information in his memory with surprisingly little effort. This idea, now called spaced repetition, is used in many language-learning apps. It is also the reason why studying a little every day works better than a single long session before an exam.\n^Questions 1–2: write ONE WORD ONLY from the passage. Questions 3–5: choose TRUE, FALSE or NOT GIVEN. Question 6: choose the correct answer.\n_Ebbinghaus memorised lists of meaningless ＊|syllables\n_His graph became known as the forgetting ＊|curve\n=T|People forget most quickly soon after they have learned something. >> \"forgetting is fastest immediately after learning\".\n=F|After one day, Ebbinghaus still remembered most of what he had learned. >> Ông đã quên hơn một nửa.\n=N|Ebbinghaus tested his method on his students. >> Bài chỉ nói ông tự thí nghiệm trên chính mình.\n?What happens each time information is reviewed?|It is forgotten more slowly.|It takes longer to review.|It becomes harder to recall.|It replaces older memories.\n##21|True / False / Not Given|Xe đạp công cộng ở một thành phố\n!Câu về giá tiền cần đọc kỹ điều kiện: phí năm, 30 phút đầu, mỗi nửa giờ thêm.\n!NOT GIVEN: bài không nói ai dùng nhiều nhất hay xe sản xuất ở đâu.\nT:Bike sharing in Greenville\nIn 2019 the city of Greenville introduced a bicycle-sharing scheme with 500 bikes and 40 docking stations. Residents pay a small annual fee and can then use a bike free of charge for up to thirty minutes. Longer journeys cost one dollar for each extra half hour.\nThe scheme was popular from the start. In the first year, more than 200,000 trips were made, and a survey showed that one in five users had replaced a car journey. However, there were problems. Bikes collected at the bottom of the city's hills, because few people wanted to ride up, and the council had to pay for trucks to move them back each night.\nIn 2022 the council added 150 electric bikes. These cost more to use, but they solved the hill problem almost immediately. The city now plans to extend the scheme to the suburbs.\n^Do the following statements agree with the information in the text? Choose TRUE, FALSE or NOT GIVEN.\n=F|Users must pay each time they take a bike. >> Người dùng trả phí năm; 30 phút đầu miễn phí.\n=T|A journey of twenty minutes costs nothing extra. >> \"free of charge for up to thirty minutes\".\n=T|Some people used the bikes instead of driving. >> \"one in five users had replaced a car journey\".\n=N|Most users of the scheme are students. >> Bài không nói người dùng là ai.\n=F|Riders were happy to cycle up the hills. >> \"few people wanted to ride up\".\n=T|Electric bikes are more expensive to use than ordinary ones. >> \"These cost more to use\".\n=N|The electric bikes were made in Greenville. >> Không có thông tin về nơi sản xuất.\n##22|Matching headings|Tuần làm việc bốn ngày\n!Tự tóm mỗi đoạn bằng ba, bốn từ trước khi nhìn danh sách tiêu đề.\n!Tiêu đề iv và vi nhắc những thứ bài không hề bàn đến: đó là tiêu đề thừa.\nT:The four-day week\n[A] For most of the last century, a full-time job has meant working five days a week. Recently, however, a number of companies have begun to test a shorter week, in which staff work four days but receive the same pay.\n[B] Supporters claim that the results are impressive. When employees have a three-day weekend, they return to work rested, take fewer days off sick and are less likely to leave the company. Several firms that tested the idea reported that the amount of work completed did not fall.\n[C] The model does not suit every business. A hospital or a restaurant cannot simply close for an extra day, so it must hire more staff, which raises costs. Some workers also complain that squeezing five days of tasks into four makes each day more stressful.\n[D] For this reason, experts advise companies to change how they work before they change the timetable. Shorter meetings, fewer emails and clear priorities can save hours each week. Without such changes, a four-day week is likely to fail.\n^Choose the correct heading for each paragraph from the list, then answer the question.\n&i Why some organisations struggle|ii Preparing for success|iii A new pattern of work|iv The cost of office buildings|v Benefits reported so far|vi How governments reacted\n:Paragraph A|iii\n:Paragraph B|v\n:Paragraph C|i\n:Paragraph D|ii\n?According to paragraph C, what do some workers dislike?|Their working days feel more pressured.|They earn less money.|They must work at weekends.|They have fewer colleagues.\n##23|Summary completion|Ong làm mật như thế nào\n!Bài tả một quy trình: tóm tắt đi theo đúng thứ tự các bước trong bài.\n!Mỗi ô chỉ một từ lấy nguyên từ bài, đúng dạng số ít hay số nhiều.\nT:How bees make honey\nHoney begins as nectar, a sweet liquid found in flowers. A worker bee visits hundreds of flowers on each trip and stores the nectar in a special second stomach. When it is full, the bee flies back to the hive.\nThere, it passes the nectar to younger bees, which chew it for about half an hour. During this time, substances in their mouths change the sugars in the nectar and make it easier to store. The bees then place the liquid in the small wax cells of the honeycomb.\nAt this point the nectar is still too watery. To dry it, the bees beat their wings rapidly, moving air across the cells until most of the water has gone. Finally, each cell is closed with a lid of wax. The honey can now be kept for months and feeds the colony through the winter.\n^Complete the summary. Choose ONE WORD ONLY from the passage for each answer.\n_A worker bee carries nectar in a second ＊|stomach\n_Younger bees ＊ the nectar for about thirty minutes|chew\n_The liquid is put into wax ＊ in the honeycomb|cells\n_The bees move air over the liquid with their ＊|wings\n_Each cell is closed with a wax ＊|lid\n_The honey feeds the colony during the ＊|winter\n##24|Multiple choice|Người lớn học ngoại ngữ\n!Câu hỏi về mục đích chính của tác giả nên làm sau cùng, khi đã hiểu cả bài.\n!Lựa chọn sai thường đúng với trẻ em nhưng bị gán cho người lớn, hoặc ngược lại.\nT:Learning a language as an adult\nMany adults believe they are too old to learn a new language. It is true that young children usually develop a more natural accent, probably because their ears are still sensitive to unfamiliar sounds. In other areas, though, adults have real advantages. They already understand how grammar works in their first language, they can read, and they know how to organise their own study. In the first year of a course, adults typically make faster progress than children.\nThe real difference is time. A child who moves abroad is surrounded by the language for many hours a day, at school and in the playground. An adult with a job may manage three hours a week. Unsurprisingly, the child overtakes the adult in the end.\nResearchers therefore advise adult learners to worry less about age and more about regular contact with the language. Twenty minutes a day, they say, is more effective than a single long lesson at the weekend, particularly if the learner speaks as well as listens.\n^Choose the correct answer.\n?What advantage do young children have?|better pronunciation|faster reading|stronger motivation|a larger vocabulary\n?According to the writer, adults in their first year of study|usually learn more quickly than children.|learn at the same speed as children.|find grammar harder than children do.|need more help from teachers.\n?Why do children who move abroad eventually do better?|They spend far more time with the language.|Their teachers are better trained.|They are not afraid of mistakes.|They study grammar at school.\n?What do researchers recommend?|short daily practice|one long weekly lesson|starting before a certain age|studying only with native speakers\n?What is the writer's main purpose?|to show that age matters less than people think|to explain why children should learn languages early|to compare different language courses|to describe how the brain stores sounds\n##25|Yes / No / Not Given|Bài tập về nhà có quá nhiều không\n#yn\n!Tác giả có quan điểm khác nhau cho hai nhóm tuổi. Đọc kỹ câu hỏi đang nói về nhóm nào.\n!\"More is not always better\" là cách tác giả phủ định một ý tuyệt đối.\nT:Too much homework?\nEvery evening, millions of children sit down to an hour or more of homework. Schools defend the practice as essential, but I am not convinced. For pupils under eleven, studies have found almost no link between the amount of homework and exam results. What young children need after school is play, sleep and conversation with their families.\nFor teenagers the picture is different. A reasonable amount of independent study clearly helps them to prepare for exams. Even here, however, more is not always better. Once homework passes about two hours a night, the benefits disappear and stress increases.\nHomework also widens the gap between rich and poor. A child with a quiet bedroom, a computer and parents who can explain the maths has an obvious advantage over one who has none of these. If schools want to be fair, they should make sure that the most important learning happens in the classroom.\n^Do the following statements agree with the views of the writer? Choose YES, NO or NOT GIVEN.\n=N|Homework is essential for primary school pupils. >> Đó là ý của nhà trường; tác giả viết \"I am not convinced\".\n=Y|Young children benefit from time with their families after school. >> \"What young children need… conversation with their families\".\n=Y|Some homework is useful for teenagers. >> \"A reasonable amount… clearly helps\".\n=N|The more homework teenagers do, the better their results. >> \"more is not always better\".\n=G|Teachers spend too much time marking homework. >> Tác giả không nhắc đến việc chấm bài.\n=Y|Homework gives an advantage to children from richer homes. >> \"widens the gap between rich and poor\".\n##26|Matching features · Sentence completion|Ba cách làm mát thành phố\n!Mỗi chuyên gia có một ưu điểm và một nhược điểm. Câu hỏi có thể hỏi một trong hai.\n!Một người có thể được chọn hai lần.\nT:Three ways to cool a city\nAs summers grow hotter, cities are searching for ways to lower temperatures. Dr Ana Ruiz, an environmental scientist, argues that trees are the best solution. A street lined with trees, she says, can be several degrees cooler than one without, and the shade encourages people to walk instead of drive. The drawback is that trees take at least ten years to grow.\nProfessor Ken Ito prefers a faster method. He recommends painting roofs white so that they reflect sunlight rather than absorbing it. In his experiments, rooms under white roofs needed far less air conditioning. Critics point out that the paint becomes dirty and must be renewed every few years.\nDr Sara Bell believes that cities have forgotten the value of water. Fountains, canals and ponds cool the air around them as the water evaporates. She admits that this approach is unsuitable for dry regions, where water is too precious to use in this way.\n^Match each statement with the correct expert, A, B or C. Then complete the sentences with ONE WORD ONLY from the passage.\n&A Dr Ruiz|B Professor Ito|C Dr Bell\n:This method reduces the energy used inside buildings.|B\n:This method is not appropriate everywhere.|C\n:This method changes how people travel.|A\n:The results of this method take a long time to appear.|A\n_White roofs ＊ sunlight instead of absorbing it|reflect\n_Roof paint must be renewed because it becomes ＊|dirty\n", "w": "##1|Nền tảng|Viết câu đơn đúng: chủ ngữ, động từ, dấu câu\nMọi bài viết IELTS đều xây từ câu đúng. Một câu tiếng Anh tối thiểu cần chủ ngữ và động từ đã chia, mở đầu bằng chữ hoa và kết thúc bằng dấu chấm. Thứ tự cơ bản là Chủ ngữ + Động từ + Tân ngữ + Nơi chốn + Thời gian.\nỞ band 3, phần lớn điểm bị mất vì câu thiếu động từ (\"My hometown very beautiful\") hoặc thiếu chủ ngữ (\"Is very crowded\"). Tuần này chỉ cần một mục tiêu: viết câu ngắn nhưng không sai.\n~My hometown is + tính từ = Quê tôi thì …\n~There is / There are + danh từ = Ở đó có …\n~I like it because + mệnh đề = Tôi thích nó vì …\n~It is famous for + danh từ = Nó nổi tiếng về …\n%Viết 5 câu giới thiệu quê hương của bạn: ở đâu, to hay nhỏ, có gì, nổi tiếng về điều gì, bạn thích điều gì nhất.|40|10|s\n$My hometown is Hai Phong. It is a large city in the north of Vietnam, about one hundred kilometres from Hanoi. There are many old streets and a busy port. The city is famous for its seafood. I like it because the people are friendly.\n?Câu nào đúng ngữ pháp?|My hometown is very peaceful.|My hometown very peaceful.|My hometown it very peaceful.|Is very peaceful my hometown.\n?Câu nào đúng?|There are two markets near my house.|There is two markets near my house.|Have two markets near my house.|There are two market near my house.\n?Câu nào viết đúng chữ hoa và dấu câu?|I live in Da Nang with my family.|i live in da nang with my family|I live in Da nang with my family|I live in Da Nang, With my family.\n##2|Nền tảng|Câu ghép với and, but, so, because\nToàn câu đơn thì bài viết sẽ rời rạc và điểm Grammar không vượt quá 4. Bước đầu tiên là nối hai câu đơn: and (thêm ý), but (ý trái ngược), so (kết quả), because (lý do).\nTrước but và so, khi nối hai mệnh đề, đặt dấu phẩy. Không bắt đầu câu bằng \"Because\" rồi chấm ngay: \"Because I am busy.\" không phải là một câu hoàn chỉnh.\n~…, but … = … nhưng …\n~…, so … = … nên …\n~… because … = … vì …\n~… and … = … và …\n%Viết 6 câu về một ngày bình thường của bạn. Dùng mỗi từ and, but, so, because ít nhất một lần.|60|12|s\n$I get up at six and have breakfast with my family. I go to work by motorbike because the bus is slow. My office is small, but my colleagues are friendly. I finish work at five, so I have time to cook dinner. In the evening I usually study English and listen to music. I want to stay up late, but I am always tired.\n?Chọn từ nối đúng: \"I was tired, ___ I went to bed early.\"|so|but|because|and\n?Chọn từ nối đúng: \"I like coffee, ___ I do not drink it at night.\"|but|so|because|or\n?Câu nào là câu hoàn chỉnh?|I stayed at home because it was raining.|Because it was raining.|Because raining, I stayed at home.|I stayed at home because raining.\n##3|Nền tảng|Đoạn văn: câu chủ đề, giải thích, ví dụ\nMột đoạn văn tốt nói về đúng một ý. Câu đầu (topic sentence) nêu ý đó; hai, ba câu sau giải thích; rồi một ví dụ cụ thể. Đây chính là khung của mỗi đoạn thân bài trong Task 2 sau này.\nNgười chấm tìm sự phát triển ý: viết ba câu cho một ý tốt hơn ba ý mỗi ý một câu.\n~The person I admire most is … = Người tôi ngưỡng mộ nhất là …\n~One reason is that … = Một lý do là …\n~For example, … = Ví dụ, …\n~That is why … = Đó là lý do …\n%Viết một đoạn văn về một người trong gia đình mà bạn ngưỡng mộ. Mở bằng câu chủ đề, đưa ra hai lý do và một ví dụ.|80|15|p\n$The person I admire most in my family is my grandmother. One reason is that she is very hard-working. She looked after five children and ran a small shop at the same time. Another reason is that she is generous. For example, when our neighbour was ill last year, she cooked for his family every day for a month. She never complains, and she always has time to listen to me. That is why I want to be like her when I am older.\n?Câu nào là câu chủ đề tốt nhất cho đoạn văn về lợi ích của việc sống cùng ông bà?|Living with grandparents has several benefits for children.|My grandmother is 70 years old.|For example, they tell old stories.|I visited my grandparents last week.\n?Sau câu chủ đề, câu tiếp theo nên làm gì?|giải thích hoặc nêu lý do cho ý vừa đưa ra|nêu ngay một ý hoàn toàn mới|chép lại câu chủ đề bằng chữ in hoa|viết kết luận cho cả bài\n?Cụm nào dùng để đưa ví dụ?|For example,|That is why|However,|In conclusion,\n##4|Task 1|Ngôn ngữ mô tả số liệu: tăng, giảm, giữ nguyên\nTask 1 yêu cầu mô tả biểu đồ trong ít nhất 150 từ, 20 phút. Trước khi viết cả bài, cần thuộc bộ từ chỉ thay đổi và giới từ đi với số.\nĐộng từ: rise / increase / grow (tăng), fall / decrease / drop (giảm), remain stable (giữ nguyên), peak at (đạt đỉnh). Trạng từ: sharply (mạnh), steadily (đều), slightly (nhẹ).\nGiới từ: from 80 to 100 (từ … đến), rise by 20 (tăng thêm 20), stand at 100 (ở mức 100), a rise of 20 (mức tăng 20).\n~The number of … rose from A to B = Số … tăng từ A lên B\n~It remained stable at … = Nó giữ nguyên ở mức …\n~There was a sharp increase in … = Có sự tăng mạnh về …\n~… peaked at … on Saturday = … đạt đỉnh … vào thứ Bảy\n@line|Customers at Sunrise Café in one week|people|Mon,Tue,Wed,Thu,Fri,Sat,Sun|Customers:80,90,100,100,140,180,120\n%Nhìn biểu đồ và viết 4–5 câu mô tả sự thay đổi số khách trong tuần. Mỗi câu phải có số liệu.|50|12|s\n$The number of customers rose slightly from 80 on Monday to 100 on Wednesday. It remained stable at 100 on Thursday. After that, there was a sharp increase, and the figure peaked at 180 on Saturday. Finally, the number of customers fell to 120 on Sunday. Overall, the café was much busier at the weekend than during the week.\n?Chọn giới từ đúng: \"Sales rose ___ 80 to 100.\"|from|by|at|of\n?Chọn câu đúng.|The figure remained stable at 100.|The figure remained stably at 100.|The figure was remain stable at 100.|The figure remained stable in 100.\n?\"Peaked at 180\" nghĩa là gì?|đạt mức cao nhất là 180|giảm xuống còn 180|tăng thêm 180|dao động quanh 180\n##5|Task 1|Biểu đồ cột: so sánh các hạng mục\nBiểu đồ cột thường đòi hỏi so sánh giữa các hạng mục nhiều hơn là mô tả xu hướng. Dùng so sánh hơn, so sánh nhất và các cụm twice as many as, the same as.\nKhông liệt kê mọi con số. Chọn số lớn nhất, nhỏ nhất, thay đổi lớn nhất và điểm giống nhau.\n~The most popular … was … = … phổ biến nhất là …\n~A was three times as high as B = A cao gấp ba B\n~… , compared with only … = … , so với chỉ …\n~The figure for … doubled = Con số của … tăng gấp đôi\n@bar|How people in Milltown travelled to work|%|Car,Bus,Train,Bicycle,Walking|2000:60,20,10,5,5|2020:45,25,15,10,5\n%Viết 5–6 câu so sánh cách đi làm của người dân Milltown năm 2000 và 2020.|80|15|p\n$In both years, the car was the most popular way to travel to work in Milltown. However, the percentage of people who drove fell from 60% in 2000 to 45% in 2020. By contrast, public transport became more common: bus use rose from 20% to 25%, and train use increased from 10% to 15%. The figure for cycling doubled, from 5% to 10%. Walking was the least popular option in 2020, and it remained unchanged at 5%. In 2000, three times as many people travelled by car as by bus.\n?Câu nào đúng với biểu đồ?|Fewer people drove to work in 2020 than in 2000.|More people drove to work in 2020 than in 2000.|Cycling was more popular than the bus in 2020.|Walking increased over the period.\n?Chọn câu đúng ngữ pháp.|The car was more popular than the bus.|The car was popular than the bus.|The car was more popular that the bus.|The car was most popular than the bus.\n?\"The figure for cycling doubled\" nghĩa là|con số tăng gấp đôi|con số giảm một nửa|con số không đổi|con số tăng thêm 2%\n##6|Task 1|Mở bài và câu tổng quan (overview)\nBài Task 1 có bốn phần: mở bài (viết lại đề bằng lời của mình), tổng quan, và hai đoạn chi tiết. Câu tổng quan nêu một, hai đặc điểm nổi bật nhất và không có số liệu. Thiếu overview, điểm Task Achievement không thể vượt quá 5.\nCách viết lại đề: đổi \"shows\" thành \"illustrates / gives information about\", đổi \"the number of students\" thành \"how many students\", đổi \"from 2010 to 2020\" thành \"between 2010 and 2020\".\n~The line graph illustrates … = Biểu đồ đường thể hiện …\n~Overall, … = Nhìn chung, …\n~… , while … = … , trong khi …\n~… saw the biggest increase = … có mức tăng lớn nhất\n@line|Students at Central College by subject|students|2010,2015,2020|Business:300,350,420|Computing:150,300,450|History:250,200,150\n%Đề: \"The graph shows the number of students studying three subjects at Central College from 2010 to 2020.\" Viết mở bài (1 câu) và tổng quan (2 câu).|45|10|p\n$The line graph illustrates how many students took three different subjects at Central College between 2010 and 2020. Overall, the number of students studying Business and Computing increased over the period, while History became less popular. Computing saw the biggest growth and had overtaken Business by 2020.\n?Câu nào là overview tốt nhất cho biểu đồ này?|Overall, Business and Computing grew, while History declined.|In 2010, there were 300 Business students.|Overall, the graph shows three subjects.|Computing rose from 150 to 450.\n?Overview có nên chứa số liệu chi tiết không?|Không, chỉ nêu xu hướng chính|Có, càng nhiều số càng tốt|Chỉ cần chép lại đề bài|Chỉ nêu ý kiến cá nhân\n?Cách viết lại nào đúng cho \"shows the number of students\"?|illustrates how many students|illustrates how much students|shows the amount of students|is show the number of students\n##7|Task 1|Biểu đồ đường: viết bài hoàn chỉnh 150 từ\nBố cục chuẩn: mở bài, tổng quan, đoạn chi tiết 1, đoạn chi tiết 2. Chia chi tiết theo nhóm có ý nghĩa: ở đây là hai nước tăng nhanh và nước tăng chậm.\nDùng thì quá khứ đơn cho mốc thời gian đã qua. Mỗi đoạn chi tiết cần điểm đầu, điểm cuối và thay đổi đáng chú ý ở giữa. Đừng tả từng năm một.\n~… rose steadily to … = … tăng đều lên …\n~… , reaching 95% in 2020 = … , đạt 95% vào năm 2020\n~By contrast, … = Ngược lại, …\n~… stood at … by the end of the period = … ở mức … vào cuối giai đoạn\n@line|Households with internet access|%|2000,2005,2010,2015,2020|Norland:40,60,80,90,95|Sudria:10,25,50,75,90|Estovia:5,8,15,30,55\n%The graph shows the percentage of households with internet access in three countries between 2000 and 2020. Summarise the information by selecting and reporting the main features, and make comparisons where relevant.|150|20|t1\n$The line graph shows the percentage of households with internet access in three countries between 2000 and 2020.\n$Overall, internet access increased in all three countries over the period. Norland had the highest figures throughout, while Estovia remained the lowest despite rapid growth after 2010.\n$In 2000, 40% of homes in Norland were online, compared with only 10% in Sudria and 5% in Estovia. The figure for Norland rose steadily to 80% in 2010 and then grew more slowly, reaching 95% in 2020. Sudria saw the most dramatic change: access climbed from 10% to 50% in the first ten years and continued to rise sharply, almost catching up with Norland at 90% in 2020.\n$By contrast, growth in Estovia was slow at first, with only 15% of households connected in 2010. After that, the figure increased more quickly and stood at 55% by the end of the period, which was still well below the other two countries.\n?Vì sao bài mẫu gộp Norland và Sudria vào một đoạn?|Vì cả hai đều đạt mức rất cao vào năm 2020|Vì hai nước có số liệu giống hệt nhau|Vì đề bài yêu cầu như vậy|Vì Estovia không quan trọng\n?Thì nào dùng cho số liệu từ 2000 đến 2020?|quá khứ đơn|hiện tại đơn|tương lai đơn|hiện tại tiếp diễn\n?Câu nào thuộc phần tổng quan?|Internet access increased in all three countries.|In 2000, 40% of homes in Norland were online.|Sudria reached 90% in 2020.|Estovia stood at 55%.\n##8|Task 1|Quy trình: câu bị động và từ chỉ trình tự\nDạng quy trình không có số liệu và không có xu hướng. Bạn tả các bước theo thứ tự, chủ yếu bằng câu bị động ở hiện tại đơn (is collected, are sorted). Tổng quan nêu số bước, bước đầu và bước cuối.\nDùng từ chỉ trình tự để nối: First, At the second stage, After that, Then, In the following stage, Finally.\n~The diagram illustrates how … is made = Sơ đồ mô tả cách … được làm ra\n~There are six main stages, beginning with … and ending with … = Có sáu bước chính, bắt đầu bằng … và kết thúc bằng …\n~After that, … is mixed with … = Sau đó, … được trộn với …\n~Finally, … are delivered to … = Cuối cùng, … được chuyển đến …\n@flow|How paper is recycled|Waste paper collected>Sorted by type>Mixed with water to make pulp>Ink removed>Pressed and dried into sheets>Rolled and delivered to printers\n%The diagram shows how paper is recycled. Summarise the information by selecting and reporting the main features.|150|20|t1\n$The diagram illustrates how waste paper is recycled to make new paper.\n$Overall, there are six main stages in the process, beginning with the collection of used paper and ending with the delivery of new paper rolls to printers.\n$First, waste paper is collected from homes and offices and taken to a recycling plant. At the second stage, it is sorted by type, so that newspapers, cardboard and office paper are separated. After that, the paper is mixed with water and turned into a soft, wet material which is called pulp.\n$In the following stage, the ink is removed from the pulp so that the new paper will be clean. The pulp is then pressed in order to squeeze out the water, and it is dried to form large sheets. Finally, the sheets are rolled and delivered to printers, where they are used to make new products such as newspapers and magazines. At this point the cycle can begin again.\n?Chọn câu đúng.|The paper is sorted by type.|The paper sorts by type.|The paper is sort by type.|The paper are sorted by type.\n?Tổng quan của bài quy trình nên nêu gì?|số bước, bước đầu và bước cuối|ý kiến của bạn về tái chế|số liệu chi tiết từng bước|lịch sử của ngành giấy\n?Từ nào KHÔNG dùng để chỉ trình tự?|However|After that|Finally|Then\n##9|Task 2|Hiểu đề và viết mở bài\nTask 2 là bài luận ít nhất 250 từ trong 40 phút và chiếm hai phần ba điểm Writing. Có năm dạng đề chính: nêu ý kiến (agree or disagree), bàn hai quan điểm (discuss both views), nguyên nhân và giải pháp, lợi và hại, và đề hai câu hỏi.\nMở bài chỉ cần hai câu: câu 1 viết lại đề bằng lời của mình, câu 2 nêu quan điểm hoặc cho biết bài sẽ bàn gì. Không chép lại đề, không mở bằng câu chung chung kiểu \"Nowadays, in modern society…\".\n~It is often argued that … = Người ta thường cho rằng …\n~I completely agree / I partly agree with this view because … = Tôi hoàn toàn / phần nào đồng ý với quan điểm này vì …\n~This essay will discuss both views before giving my own opinion. = Bài viết sẽ bàn cả hai quan điểm trước khi nêu ý kiến của tôi.\n%Viết mở bài (2 câu) cho từng đề sau. Đề 1: \"Some people think that everyone should exercise every day. To what extent do you agree or disagree?\" Đề 2: \"Some people prefer to play team sports, while others prefer individual sports. Discuss both views and give your opinion.\"|60|12|p\n$It is often argued that daily exercise is necessary for all people. I completely agree with this view because regular physical activity improves both physical and mental health.\n$People have different opinions about whether it is better to take part in team sports or to do sports alone. This essay will discuss both views before explaining why I believe team sports are more beneficial.\n?Đề \"To what extent do you agree or disagree?\" yêu cầu gì?|nêu rõ quan điểm của bạn và bảo vệ nó|chỉ liệt kê hai phía, không nêu ý kiến|tả một biểu đồ|kể một câu chuyện cá nhân\n?Câu nào là cách viết lại tốt cho \"everyone should exercise every day\"?|daily exercise is necessary for all people|everyone should exercise every day|exercise is a sport|all days people must exercises\n?Mở bài nên dài khoảng bao nhiêu?|2 câu, khoảng 40–50 từ|1 từ|nửa trang|dài bằng thân bài\n##10|Task 2|Đoạn thân bài theo khung PEEL\nMỗi đoạn thân bài phát triển một ý theo bốn bước PEEL: Point (câu chủ đề nêu ý), Explain (giải thích vì sao), Example (ví dụ cụ thể), Link (câu chốt nối về đề bài).\nBài 250 từ chỉ cần hai đoạn thân bài, mỗi đoạn khoảng 90 từ. Một ý được giải thích kỹ ăn điểm hơn ba ý nêu vội.\n~One reason why … is that … = Một lý do khiến … là …\n~This is because … = Điều này là vì …\n~For instance, … = Chẳng hạn, …\n~As a result, … = Kết quả là …\n%Viết một đoạn thân bài (khoảng 90 từ) theo khung PEEL cho ý: \"Many people prefer to live in cities because there are more job opportunities.\"|90|15|p\n$One reason why many people prefer to live in cities is that there are more job opportunities. This is because most large companies, banks and hospitals are located in urban areas, so there is a wider range of work for people with different skills. For instance, a young graduate in a big city can choose between hundreds of employers, whereas someone in a small village may find only farming or shop work. As a result, people move to cities in order to earn a higher salary and build a better career.\n?Trong PEEL, chữ E thứ hai (Example) là gì?|một ví dụ cụ thể minh hoạ cho ý|câu chủ đề|câu kết luận cả bài|một câu hỏi tu từ\n?Câu nào là câu chủ đề (Point) tốt?|One advantage of living in a city is better healthcare.|For instance, my uncle lives in Hanoi.|As a result, they are healthier.|This is because hospitals are large.\n?Một bài Task 2 nên có mấy đoạn thân bài?|hai đoạn, mỗi đoạn phát triển kỹ một ý|năm đoạn ngắn|một đoạn duy nhất|không cần thân bài\n##11|Task 2|Bài nêu ý kiến hoàn chỉnh (agree or disagree)\nBố cục bốn đoạn: mở bài nêu quan điểm, thân bài 1 (lý do chính), thân bài 2 (lý do thứ hai hoặc nhượng bộ rồi phản biện), kết bài nhắc lại quan điểm bằng từ khác. Quan điểm phải nhất quán từ đầu đến cuối bài.\nChia thời gian: 5 phút lập dàn ý, 30 phút viết, 5 phút soát lỗi. Viết dưới 250 từ sẽ bị trừ điểm; không cần viết quá 290 từ.\n~Although I understand this view, I disagree that … = Dù hiểu quan điểm này, tôi không đồng ý rằng …\n~The main reason is … = Lý do chính là …\n~However, I accept that … = Tuy nhiên, tôi thừa nhận rằng …\n~In conclusion, I do not agree that … = Tóm lại, tôi không đồng ý rằng …\n%Some people believe that university education should be free for everyone. To what extent do you agree or disagree? Give reasons for your answer and include any relevant examples from your own knowledge or experience.|250|40|t2\n$Many people argue that governments should pay for all university courses so that students do not have to. Although I understand this view, I disagree that higher education should be completely free for everyone.\n$The main reason is cost. Universities need expensive buildings, laboratories and well-qualified teachers. If the government paid for every student, it would have to raise taxes or spend less on other services such as hospitals and primary schools. This seems unfair, because many taxpayers never go to university themselves. In addition, when something is free, people may not value it. Students who pay at least part of their fees tend to choose their course more carefully and work harder to finish it.\n$However, I accept that high fees can stop talented young people from poor families from studying. For example, a student whose parents are farmers may not be able to afford several thousand dollars a year, even if he or she has excellent marks. For this reason, I believe that governments should offer scholarships and cheap loans to students who really need them. In this way, public money helps the people who need it most, instead of paying for wealthy families who can easily afford the fees. Systems of this kind already work well in several countries.\n$In conclusion, I do not agree that university should be free for all students. In my opinion, a fairer system is one in which students who can pay contribute to the cost, while those from low-income families receive financial support from the government.\n?Quan điểm của người viết bài mẫu là gì?|Không đồng ý miễn phí cho tất cả, nhưng ủng hộ hỗ trợ người nghèo|Hoàn toàn đồng ý đại học nên miễn phí|Không nêu quan điểm|Cho rằng nên đóng cửa các trường đại học\n?Đoạn thân bài 2 mở bằng \"However, I accept that…\" để làm gì?|thừa nhận mặt còn lại rồi đưa ra giải pháp phù hợp với quan điểm|đổi hẳn quan điểm|kết thúc bài|chép lại đề\n?Nên dành bao lâu để lập dàn ý?|khoảng 5 phút|không cần dàn ý|20 phút|đúng 1 phút\n##12|Task 1|Biểu đồ tròn: tỉ lệ và phân số\nBiểu đồ tròn nói về tỉ lệ trong một tổng thể. Thay vì lặp \"percent\" liên tục, dùng phân số và cụm từ chỉ tỉ lệ: a quarter (25%), a third (khoảng 33%), half (50%), one fifth (20%), the majority, a small minority.\nĐộng từ hay dùng: account for, make up (chiếm). \"Respectively\" dùng khi liệt kê hai số theo đúng thứ tự hai đối tượng vừa nêu.\n~Rent accounted for 40% of … = Tiền thuê nhà chiếm 40% …\n~A quarter of the budget went on … = Một phần tư ngân sách dành cho …\n~… made up 15% = … chiếm 15%\n~… were 12% and 8% respectively = … lần lượt là 12% và 8%\n@pie|Student spending in 2010|Rent:40,Food:25,Transport:15,Entertainment:12,Other:8\n@pie|Student spending in 2020|Rent:50,Food:20,Transport:8,Entertainment:12,Other:10\n%The pie charts show how students at one university spent their money in 2010 and 2020. Summarise the information by selecting and reporting the main features, and make comparisons where relevant.|150|20|t1\n$The pie charts compare how students at one university spent their money in 2010 and 2020.\n$Overall, rent was the largest expense in both years and its share increased, whereas the proportions spent on food and transport fell. Spending on entertainment did not change.\n$In 2010, rent accounted for 40% of students' spending. A quarter of their budget went on food, while transport made up 15%. Entertainment and other costs were responsible for 12% and 8% respectively.\n$Ten years later, exactly half of all student spending was on rent, which was a rise of ten percentage points. By contrast, the figure for food dropped to one fifth of the total, and the share for transport almost halved, falling to only 8%. The proportion spent on entertainment remained the same at 12%, and other costs rose slightly to 10%. In other words, by 2020 students had less money left for everything except housing.\n?\"A quarter\" bằng bao nhiêu phần trăm?|25%|20%|33%|40%\n?Chọn câu đúng.|Rent accounted for 40% of spending.|Rent accounted 40% of spending.|Rent was accounted for 40% of spending.|Rent accounts by 40% of spending.\n?\"12% and 8% respectively\" trong bài mẫu nghĩa là|entertainment 12% và other 8%, theo đúng thứ tự vừa nêu|cả hai đều là 12%|tổng là 20% cho mỗi mục|12% năm 2010 và 8% năm 2020\n##13|Task 2|Liên kết ý và viết kết bài\nCoherence and Cohesion chiếm một phần tư điểm. Người chấm xem bài có chia đoạn rõ không, mỗi đoạn có một ý chính không, và các câu có nối với nhau tự nhiên không. Dùng từ nối vừa đủ: mỗi đoạn hai, ba từ nối đúng chỗ là đạt band 6.\nKết bài chỉ một, hai câu: nhắc lại quan điểm bằng từ khác và tóm ý chính. Không đưa ý mới vào kết bài.\n~Firstly, … / Secondly, … / Finally, … = Thứ nhất / Thứ hai / Cuối cùng\n~In addition, … / Moreover, … = Thêm vào đó\n~For this reason, … = Vì lý do này\n~In conclusion, … = Tóm lại\n%Some people think that advertising aimed at children should be banned. To what extent do you agree or disagree? Viết bài hoàn chỉnh, gạch chân các từ nối bạn dùng và đếm xem mỗi đoạn có mấy từ nối.|250|40|t2\n$Dàn ý mẫu. Mở bài: viết lại đề; tôi đồng ý phần lớn. Thân bài 1: trẻ nhỏ chưa phân biệt được quảng cáo với sự thật, nên dễ bị thuyết phục; ví dụ quảng cáo đồ ăn vặt dẫn đến thói quen ăn uống xấu. Thân bài 2: quảng cáo tạo áp lực cho cha mẹ vì con đòi mua; tuy nhiên cấm hoàn toàn khó thực hiện trên internet, nên cần cấm trên TV giờ trẻ em và dạy trẻ hiểu về quảng cáo.\n$Kết bài mẫu: In conclusion, I largely agree that advertising to children should be banned, because young children cannot judge these messages and families suffer as a result. However, since a total ban is difficult to enforce online, it should be combined with education at school and at home.\n?Kết bài nên làm gì?|nhắc lại quan điểm và tóm ý chính bằng từ khác|đưa thêm một lý do mới|đặt một câu hỏi cho người đọc|chép lại nguyên mở bài\n?Chọn từ nối đúng: \"Adverts make children want toys. ___, parents feel pressure to buy them.\"|As a result|However|For example|Although\n?Dùng từ nối thế nào là hợp lý ở band 6?|vừa đủ và đúng nghĩa, mỗi đoạn hai, ba từ|mỗi câu mở bằng một từ nối|không dùng từ nối nào|chỉ dùng \"and\"\n##14|Task 2|Bàn hai quan điểm và nêu ý kiến\nĐề \"Discuss both views and give your own opinion\" bắt buộc ba việc: trình bày quan điểm A, trình bày quan điểm B, và nêu ý kiến của bạn. Thiếu một trong ba, Task Response không vượt quá 5.\nBố cục an toàn: mở bài; thân bài 1 về quan điểm A (On the one hand); thân bài 2 về quan điểm B (On the other hand); một đoạn ngắn hoặc kết bài nêu rõ bạn nghiêng về phía nào và vì sao.\n~On the one hand, … = Một mặt, …\n~On the other hand, … = Mặt khác, …\n~Those who support this view argue that … = Những người ủng hộ quan điểm này cho rằng …\n~In my opinion, both sides are … = Theo tôi, cả hai phía đều …\n%Some people think that individuals can do little to protect the environment, and that only governments and large companies can make a real difference. Others believe that individual actions are important. Discuss both views and give your own opinion.|250|40|t2\n$People have different views about who should be responsible for protecting the environment. While some argue that only governments and big companies have the power to solve the problem, others think that ordinary people also play an important role. This essay will discuss both views before giving my own opinion.\n$On the one hand, it is true that the largest sources of pollution are factories, power stations and transport systems. One person who cycles to work cannot reduce emissions as much as a law that closes a coal power plant. Governments can also tax products that damage the environment and invest in clean energy, which individuals cannot do. For this reason, many people feel that their own efforts are too small to matter.\n$On the other hand, companies only produce what customers buy. If millions of people choose to eat less meat, refuse plastic bags or buy electric cars, businesses will have to change their products. In addition, individuals vote for politicians. When citizens show that they care about the environment, governments are more likely to pass strong laws. Small actions can therefore lead to large changes.\n$In my opinion, both sides are necessary. Governments and companies have the greatest power, but they usually act only when the public demands it. Individual actions are important not just because they reduce waste directly, but because they put pressure on those who make the big decisions.\n$In conclusion, although the main responsibility lies with governments and large companies, I believe that individuals can and should contribute to protecting the environment.\n?Đề \"Discuss both views and give your own opinion\" yêu cầu mấy việc?|ba: quan điểm A, quan điểm B, ý kiến của bạn|một: chỉ nêu ý kiến của bạn|hai: chỉ hai quan điểm, không cần ý kiến|bốn: thêm cả giải pháp\n?Trong bài mẫu, ý kiến của người viết là gì?|Cả hai đều cần, và hành động cá nhân tạo áp lực lên bên có quyền|Chỉ chính phủ mới có vai trò|Cá nhân không làm được gì|Không nêu ý kiến\n?Cụm nào mở đầu đoạn về quan điểm thứ hai?|On the other hand,|In conclusion,|For instance,|As a result,\n##15|Task 1|Bảng số liệu: chọn lọc và gom nhóm\nBảng có nhiều con số hơn mức cần tả. Kỹ năng được chấm là chọn lọc: tìm số lớn nhất, nhỏ nhất, thay đổi lớn nhất, và gom các hàng có xu hướng giống nhau vào một đoạn.\nTrước khi viết, dành 2 phút khoanh những số sẽ dùng. Tổng quan phải trả lời được: cái gì tăng, cái gì giảm, cái gì nổi bật nhất?\n~The table gives information about … = Bảng cung cấp thông tin về …\n~…, followed by … = …, tiếp theo là …\n~By 2023 the figure had fallen to … = Đến năm 2023 con số đã giảm xuống …\n~In terms of cost, … = Xét về chi phí, …\n@table|Visitors to three museums (thousands) and ticket prices|Museum,2015,2023,Ticket in 2023|Science Museum,450,620,£12|History Museum,500,380,free|Art Gallery,300,310,£8\n%The table shows the number of visitors to three museums in one city in 2015 and 2023, and the price of a ticket in 2023. Summarise the information by selecting and reporting the main features, and make comparisons where relevant.|150|20|t1\n$The table gives information about the number of visitors to three museums in one city in 2015 and 2023, together with their ticket prices in 2023.\n$Overall, the Science Museum became the most popular attraction, while the History Museum lost visitors even though entry was free. Visitor numbers at the Art Gallery hardly changed.\n$In 2015, the History Museum received the most visitors, at 500,000, followed by the Science Museum with 450,000. However, by 2023 the figure for the History Museum had fallen to 380,000, whereas the Science Museum had risen considerably to 620,000, an increase of 170,000.\n$The Art Gallery attracted far fewer people than the other two in 2015, at 300,000, and this number rose only slightly to 310,000 eight years later. In terms of cost, the Science Museum was the most expensive at £12 per ticket, compared with £8 for the Art Gallery. Interestingly, the only museum with no entry charge was the one whose visitor numbers declined.\n?Khi tả bảng, bạn nên làm gì với các con số?|chọn số nổi bật và gom nhóm theo xu hướng|chép lại tất cả theo thứ tự|bỏ hết số, chỉ nêu nhận xét|chỉ tả hàng đầu tiên\n?Chọn câu đúng với bảng.|The History Museum lost visitors between 2015 and 2023.|The Art Gallery was free in 2023.|The Science Museum had the fewest visitors in 2023.|All three museums gained visitors.\n?\"By 2023 the figure had fallen\" dùng thì gì?|quá khứ hoàn thành, vì việc xảy ra trước mốc 2023|hiện tại hoàn thành|tương lai đơn|hiện tại đơn\n##16|Task 2|Nguyên nhân và giải pháp\nĐề dạng này hỏi hai câu: vì sao có vấn đề, và làm gì để giải quyết. Dành một đoạn thân bài cho nguyên nhân, một đoạn cho giải pháp. Mỗi giải pháp nên trả lời đúng một nguyên nhân đã nêu, như vậy bài mới chặt chẽ.\nNêu rõ ai làm: governments should…, schools could…, parents need to… Và dùng câu điều kiện để cho thấy kết quả của giải pháp.\n~One major cause is … = Một nguyên nhân lớn là …\n~As a result, … = Kết quả là …\n~There are several ways to deal with this issue. = Có vài cách giải quyết vấn đề này.\n~If …, … would be less likely to … = Nếu …, … sẽ ít có khả năng … hơn\n%In many cities, the number of young people who commit crimes is increasing. What are the causes of this problem and what solutions can you suggest?|250|40|t2\n$In many urban areas, youth crime has become a serious concern. This essay will examine two main causes of the problem and suggest some possible solutions.\n$One major cause is a lack of opportunities. Young people who leave school without qualifications often cannot find a job, so they have no income and a great deal of free time. As a result, some of them may start stealing or selling drugs to earn money. Another cause is the influence of friends. Teenagers want to be accepted by their peers, and if their friends break the law, they may feel pressure to do the same, especially when parents work long hours and cannot supervise them.\n$There are several ways to deal with this issue. Firstly, governments should invest in training programmes that teach practical skills, such as cooking or repairing cars. If young people could earn money legally, they would be less likely to commit crimes. Secondly, cities should provide free sports clubs and youth centres which are open in the evenings. These places give teenagers something positive to do and allow them to meet adults who can guide them. Finally, schools could invite former prisoners to talk about the real consequences of crime, which may be more effective than a warning from a teacher.\n$In conclusion, youth crime is mainly caused by unemployment and negative peer pressure. However, I believe the problem can be reduced if governments create more opportunities for training and provide safe places where young people can spend their free time.\n?Giải pháp \"training programmes\" trả lời cho nguyên nhân nào trong bài mẫu?|thiếu cơ hội việc làm|ảnh hưởng của bạn bè|cha mẹ quá nghiêm khắc|phim ảnh bạo lực\n?Bố cục hợp lý cho dạng đề này là gì?|một đoạn nguyên nhân, một đoạn giải pháp|hai đoạn đều về nguyên nhân|chỉ viết giải pháp|mỗi câu một đoạn\n?Chọn câu đúng.|Governments should invest in training.|Governments should to invest in training.|Governments should investing in training.|Governments should invests in training.\n##17|Task 1|Bản đồ: mô tả sự thay đổi\nDạng bản đồ thường cho hai mốc thời gian. Bạn tả cái gì đã thay đổi, cái gì giữ nguyên, và ở đâu. Thay đổi đã hoàn tất tính đến hiện tại thì dùng hiện tại hoàn thành bị động (has been built). Hai mốc đều ở quá khứ thì dùng quá khứ đơn bị động.\nChia đoạn theo khu vực (phía bắc, phía nam), không tả lần lượt từng bản đồ.\n~… has been replaced by … = … đã được thay bằng …\n~… has been turned into … = … đã được chuyển thành …\n~A … has been built in the north-east = Một … đã được xây ở phía đông bắc\n~… has been extended / demolished = … đã được mở rộng / phá bỏ\n@map|Greenhill in 2000|Farmland:0.5,0.5,4,2.5;Forest:7.5,0.5,4,2.5;Houses:4.5,3.6,3,1.8;Post office:0.8,5.9,2.8,1.4;School:8.6,5.9,2.8,1.4\n@map|Greenhill today|Supermarket:0.5,0.5,4,2.5;Sports centre:7,0.5,2.3,2.5;Forest:9.5,0.5,2,2.5;Houses:4.5,3.6,3,1.8;Flats:0.8,5.9,2.8,1.4;School:7.4,5.9,4,1.4\n%The maps show the village of Greenhill in 2000 and today. Summarise the information by selecting and reporting the main features, and make comparisons where relevant.|150|20|t1\n$The two maps show how the village of Greenhill has changed since 2000.\n$Overall, the village has become more developed. Farmland and part of the forest have been replaced by new facilities, while the houses in the centre have stayed the same.\n$In 2000, the north-west of the village was farmland. This area has been turned into a supermarket. In the north-east, there used to be a large forest, but about half of it has been cut down, and a sports centre has been built on the western side of the remaining trees.\n$The south of the village has also changed. The post office in the south-west corner has been demolished and replaced by a block of flats. In the south-east, the school has been extended and is now considerably larger than before. By contrast, the houses in the centre of the village have not changed at all during this period, so the centre looks the same as it did before.\n?Chọn câu đúng.|A sports centre has been built in the north-east.|A sports centre has built in the north-east.|A sports centre have been built in the north-east.|A sports centre has been build in the north-east.\n?Nên chia đoạn chi tiết của bài bản đồ theo cách nào?|theo khu vực, ví dụ phía bắc rồi phía nam|tả hết bản đồ 1 rồi mới sang bản đồ 2|theo bảng chữ cái|không cần chia đoạn\n?\"The post office has been demolished\" nghĩa là|bưu điện đã bị phá bỏ|bưu điện đã được mở rộng|bưu điện được xây mới|bưu điện chuyển sang chỗ khác\n##18|Task 2|Lợi và hại: outweigh\nCâu hỏi \"Do the advantages outweigh the disadvantages?\" bắt buộc bạn chọn phía: lợi nhiều hơn hay hại nhiều hơn. Nêu lựa chọn ngay ở mở bài, và viết đoạn về phía bạn ủng hộ dài hơn, kỹ hơn đoạn còn lại.\nBố cục thường dùng: thân bài 1 về phía yếu hơn (thừa nhận), thân bài 2 về phía mạnh hơn (bảo vệ quan điểm).\n~The advantages of … outweigh the disadvantages. = Lợi ích của … lớn hơn bất lợi.\n~The main drawback is … = Bất lợi chính là …\n~Nevertheless, there are important benefits. = Tuy vậy, có những lợi ích quan trọng.\n~This is outweighed by … = Điều này không bằng được …\n%In many countries, people are living longer than ever before. Do the advantages of this trend outweigh the disadvantages?|250|40|t2\n$Thanks to better food and healthcare, life expectancy has risen in most parts of the world. Although an ageing population creates some difficulties, I believe that the advantages of longer lives are greater than the disadvantages.\n$The main drawback is economic. When people live for twenty or thirty years after they retire, governments must spend more on pensions and hospitals. At the same time, there are fewer young workers paying taxes, so the cost for each worker increases. Families may also face pressure, since adult children often have to look after elderly parents while working full-time.\n$Nevertheless, there are important benefits. Firstly, older people have a great deal of knowledge and experience. Many continue to work, run businesses or do volunteer work in schools and hospitals, which helps the whole community. Secondly, grandparents often take care of young children, so that parents can go out to work. This saves families a significant amount of money. Finally, from a personal point of view, a longer life gives people more time to enjoy their families, travel and learn new things after decades of hard work.\n$Moreover, the economic problems can be reduced. If people stay healthy, they can retire later, and governments can encourage this by offering part-time work to those over sixty.\n$In conclusion, while a growing number of elderly people puts pressure on public spending, I think this is outweighed by the contribution that older people make to their families and to society, as well as by the simple value of a longer life.\n?\"The advantages outweigh the disadvantages\" nghĩa là gì?|lợi nhiều hơn hại|hại nhiều hơn lợi|lợi và hại ngang nhau|không có lợi ích nào\n?Trong bài mẫu, đoạn nào dài và kỹ hơn?|đoạn về lợi ích, vì đó là phía người viết ủng hộ|đoạn về bất lợi|mở bài|hai đoạn dài bằng nhau\n?Với dạng đề này, nên nêu lựa chọn của mình ở đâu?|ngay trong mở bài và nhắc lại ở kết bài|chỉ ở câu cuối cùng|không cần nêu|ở giữa thân bài 1\n##19|Task 2|Đề hai câu hỏi\nMột số đề đặt thẳng hai câu hỏi, ví dụ \"Why does this happen? Is this a positive or negative development?\". Cách làm đơn giản nhất: mỗi câu hỏi một đoạn thân bài, và mở bài báo trước câu trả lời cho cả hai.\nLỗi thường gặp nhất là trả lời rất kỹ câu thứ nhất rồi chỉ viết một câu cho câu thứ hai. Hai câu hỏi phải được trả lời cân bằng.\n~There are two main reasons for this. = Có hai lý do chính cho điều này.\n~In my view, this trend does more harm than good. = Theo tôi, xu hướng này hại nhiều hơn lợi.\n~It is true that … However, … = Đúng là … Tuy nhiên, …\n~… is not sustainable in the long term. = … không bền vững về lâu dài.\n%Nowadays many people buy things they do not really need. Why does this happen? Is this a positive or negative development?|250|40|t2\n$In modern society, shopping has become a hobby, and people often purchase products that they do not actually need. This essay will explain why this happens and argue that it is mainly a negative development.\n$There are two main reasons for this behaviour. The first is advertising. People see hundreds of advertisements every day on television and social media, and these persuade them that a new phone or a fashionable pair of shoes will make them happier. The second reason is that buying has become extremely easy. With online shops and credit cards, a customer can order something in a few seconds without leaving home and pay for it later.\n$In my view, this trend does more harm than good. For individuals, spending money on unnecessary goods can lead to debt, and many people feel stressed because they owe money to banks. It is also damaging for the environment. Factories use energy and natural resources to make these products, and when people get bored of them, they are thrown away, which creates huge amounts of waste. It is true that consumer spending creates jobs and helps the economy to grow. However, I believe an economy that depends on waste is not sustainable in the long term.\n$In conclusion, people buy things they do not need because of the influence of advertising and the convenience of modern shopping. Although this supports businesses, I think it is a negative development overall, since it causes financial problems for individuals and serious damage to the planet.\n?Cách chia thân bài hợp lý cho đề hai câu hỏi là gì?|mỗi câu hỏi một đoạn|cả hai câu trong một câu văn|chỉ trả lời câu dễ hơn|ba đoạn cho câu thứ nhất\n?Trong bài mẫu, \"purchase products that they do not actually need\" là cách viết lại của cụm nào trong đề?|buy things they do not really need|a positive or negative development|why does this happen|nowadays many people\n?Chọn câu đúng.|Spending too much can lead to debt.|Spending too much can lead to be in debt.|Spending too much can leads to debt.|Spending too much can lead debt.\n##20|Task 1 + Task 2|Làm đủ 60 phút và soát lỗi\nĐề thật cho 60 phút cho cả hai bài và không báo khi nào nên chuyển bài. Hãy tự chia 20 phút cho Task 1 và 40 phút cho Task 2. Task 2 chiếm hai phần ba điểm, nên nếu thiếu giờ, hãy cắt bớt Task 1.\nBa phút cuối mỗi bài để soát lỗi theo từng loại: động từ có chia đúng không, danh từ số nhiều có s chưa, mạo từ, và giới từ đi với số. Thi trên máy có sẵn bộ đếm từ, nhưng không có kiểm tra chính tả.\n~Task 1: mở bài, tổng quan, hai đoạn chi tiết = khoảng 160–180 từ\n~Task 2: mở bài, hai thân bài, kết bài = khoảng 260–280 từ\n@bar|Hours of exercise per week by age group|hours|16–24,25–44,45–64,65+|Men:5,3,2.5,3|Women:4,2.5,3,3.5\n%Task 1. The chart shows the average number of hours of exercise per week taken by men and women in four age groups. Summarise the information by selecting and reporting the main features, and make comparisons where relevant.|150|20|t1\n%Task 2. Some people think governments should spend money on improving public transport rather than building new roads. To what extent do you agree or disagree?|250|40|t2\n$Gợi ý Task 1. Tổng quan: nhóm 16–24 tập nhiều nhất ở cả hai giới; nam tập nhiều hơn nữ ở hai nhóm trẻ, nhưng từ 45 tuổi trở lên nữ lại tập nhiều hơn. Chi tiết 1: hai nhóm trẻ (5 và 4 giờ; 3 và 2.5 giờ). Chi tiết 2: hai nhóm lớn tuổi (nam chạm đáy 2.5 giờ ở nhóm 45–64 rồi lên 3; nữ tăng đều lên 3.5).\n$Gợi ý Task 2. Quan điểm: đồng ý phần lớn. Thân bài 1: giao thông công cộng chở được nhiều người hơn, giảm tắc đường và ô nhiễm; thêm đường chỉ kéo thêm xe. Thân bài 2: tuy vậy vùng nông thôn vẫn cần đường tốt để chở hàng và đến bệnh viện, nên ngân sách đường nên ưu tiên cho các vùng đó.\n?Thiếu thời gian, nên ưu tiên bài nào?|Task 2, vì chiếm hai phần ba điểm Writing|Task 1, vì dễ hơn|bài nào viết dở trước|không bài nào, nộp luôn\n?Câu nào còn lỗi cần sửa?|The number of car have
