<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lộ trình IELTS 3.0 lên 6.0 trong 24 tuần</title>
<meta name="description" content="Lộ trình 24 tuần ôn IELTS Academic từ 3.0 lên 6.0: từ vựng, ngữ pháp, Listening, Reading, Writing, Speaking theo đúng dạng đề thật, có đề tổng hợp tính giờ và sổ điểm đề Cambridge.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F2F4F8;--card:#FFFFFF;--ink:#15202F;--mute:#566375;--line:#D3DAE5;--pri:#1D3A6B;--pri-soft:#E4EBF7;--hl:#FFE873;--bad:#BF3327;--bad-soft:#FBE7E4;--ok:#17734F;--ok-soft:#DFF2E9;
 --cL:#2460B9;--cR:#19805A;--cW:#A8560C;--cS:#8B3D9E;--s1:#1D3A6B;--s2:#D98A1F;--s3:#19805A;--s4:#8B3D9E;--s5:#8A96A8;
 --ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--en:"Source Serif 4",Georgia,"Times New Roman",serif;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#10161F;--card:#18212D;--ink:#E6ECF2;--mute:#9AA7B6;--line:#2B3848;--pri:#9DBBF0;--pri-soft:#1C2B45;--hl:#6B5A12;--bad:#F0786A;--bad-soft:#3A201D;--ok:#5CC79B;--ok-soft:#173529;--cL:#7FB0F5;--cR:#5CC79B;--cW:#E5A25A;--cS:#CE8FE0;--s1:#9DBBF0;--s2:#E5A25A;--s3:#5CC79B;--s4:#CE8FE0;--s5:#7C8898}}
:root[data-theme="dark"]{--paper:#10161F;--card:#18212D;--ink:#E6ECF2;--mute:#9AA7B6;--line:#2B3848;--pri:#9DBBF0;--pri-soft:#1C2B45;--hl:#6B5A12;--bad:#F0786A;--bad-soft:#3A201D;--ok:#5CC79B;--ok-soft:#173529;--cL:#7FB0F5;--cR:#5CC79B;--cW:#E5A25A;--cS:#CE8FE0;--s1:#9DBBF0;--s2:#E5A25A;--s3:#5CC79B;--s4:#CE8FE0;--s5:#7C8898}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--ui);-webkit-text-size-adjust:100%}
.en{font-family:var(--en);font-size:1.07em;line-height:1.65}
a{color:var(--pri)}
h1{font-size:1.7rem;line-height:1.25;margin:.2em 0 .4em;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:1.2rem;margin:0 0 .6em;display:flex;align-items:center;gap:.5em;flex-wrap:wrap}
h3{font-size:1.08rem;margin:0 0 .3em}
p{margin:.4em 0 .8em;max-width:70ch}
ul,ol{max-width:70ch}
.mute{color:var(--mute);font-size:.92rem}.lead{font-size:1.05rem}
mark{background:var(--hl);color:inherit;padding:0 .15em;border-radius:3px}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
[hidden]{display:none!important}
#app{display:grid;grid-template-columns:212px minmax(0,1fr);min-height:100vh}
.nav{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));padding:20px 12px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;background:var(--card)}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500}
.nav svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav a.on{background:var(--pri-soft);color:var(--pri)}
.nav .brand{font-weight:700;margin-bottom:14px;display:block;line-height:1.25}
.nav .brand b{display:block;font:600 1.5rem var(--en);letter-spacing:.01em}
.nav .brand span{font-size:.82rem;font-weight:500;color:var(--mute)}
main{padding:28px clamp(16px,4vw,48px) 96px;max-width:920px;width:100%}
.onb{max-width:520px;margin:0 auto;padding:7vh 20px;grid-column:1/-1}
.onb label,.form label{display:block;font-weight:500;margin:14px 0}
input:not([type=checkbox]),select,textarea{display:block;width:100%;margin-top:4px;padding:10px 12px;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:8px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border:1.5px solid var(--pri);border-radius:8px;background:var(--pri);color:var(--card);font:600 1rem var(--ui);text-decoration:none;cursor:pointer}
.btn.line{background:transparent;color:var(--pri)}.btn.sm{padding:6px 12px;font-size:.88rem}.btn.wide{width:100%;margin-top:10px}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0}
.note{background:var(--bad-soft);border-left:4px solid var(--bad);padding:10px 14px;border-radius:0 8px 8px 0;max-width:none}
.info{background:var(--pri-soft);padding:10px 14px;border-radius:8px;max-width:none}
.tip{background:var(--hl);padding:8px 12px;border-radius:8px;font-size:.95rem;max-width:none}
.sec{margin:32px 0;padding-top:22px;border-top:1.5px solid var(--line)}
.crumb{font-size:.88rem;color:var(--mute);margin:0}
/* Thang band */
.ladder{margin:34px 0 20px;position:relative;max-width:640px}
.ltrack{height:14px;border-radius:7px;background:var(--line);position:relative;overflow:visible}
.ltrack i{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:var(--pri)}
.ltrack u{position:absolute;top:-5px;width:4px;height:24px;margin-left:-2px;background:var(--cW);border-radius:2px}
.lmk{position:absolute;top:-30px;white-space:nowrap;font-size:.8rem;color:var(--mute);line-height:1.2}
.lmk b{font:600 1.15rem var(--en);color:var(--ink);background:var(--hl);padding:0 6px;border-radius:4px;margin-right:6px}
.lticks{display:flex;justify-content:space-between;margin-top:6px;font:600 .95rem var(--en)}
.lticks span{width:0;display:flex;justify-content:center;position:relative}
.lticks span::before{content:"";position:absolute;top:-10px;width:1.5px;height:6px;background:var(--mute)}
.lph{display:flex;margin-top:4px;font-size:.78rem;color:var(--mute)}.lph span{flex:1;text-align:center;border-top:1px dashed var(--line);padding-top:4px;margin:0 3px}
/* Ô lịch kiểu phiếu trả lời */
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));flex:1}
.cell{aspect-ratio:1;border:1.5px solid var(--line);margin:0 -1.5px -1.5px 0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:3px;text-decoration:none;color:var(--ink);background:var(--card);position:relative;min-width:0}
.cell small{font-size:.62rem;color:var(--mute);line-height:1.2}.cell b{font:600 clamp(1rem,3.2vw,1.5rem)/1 var(--en)}
.cell.tL b{color:var(--cL)}.cell.tR b{color:var(--cR)}.cell.tW b{color:var(--cW)}.cell.tS b{color:var(--cS)}.cell.tT b,.cell.tD b,.cell.tM b{color:var(--bad)}.cell.tN b{color:var(--line)}
.cell.today{outline:3px solid var(--pri);outline-offset:-3px;z-index:1}
.cell.done{background:var(--ok-soft)}
.cell .tick{position:absolute;right:3px;top:1px;color:var(--ok);font-weight:700;font-size:.8rem}
.wk{display:flex;align-items:center;gap:10px;margin-bottom:1.5px}.wkl{width:150px;flex:none;font-weight:600;font-size:.84rem;line-height:1.3}.wkl small{display:block;font-weight:400;color:var(--mute);font-size:.72rem}
.keyl{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.84rem;color:var(--mute);margin:10px 0}.keyl b{font:600 1rem var(--en);margin-right:4px}
.done-mark{display:inline-grid;place-items:center;width:1.5em;height:1.5em;border-radius:50%;background:var(--ok);color:var(--card);font-size:.8rem;font-weight:700;flex:none}
.todo,.outl,.vlist,.gx{list-style:none;padding:0;margin:10px 0;max-width:none}
.todo li,.outl li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:9px 2px;border-bottom:1px dashed var(--line)}
.todo li.done a{color:var(--mute);text-decoration:line-through}.todo span{color:var(--mute);font-size:.9rem}
.outl li>span{flex:1;color:var(--mute)}.outl li>b{min-width:8em}.outl small{color:var(--bad)}
.pbar{display:grid;grid-template-columns:90px 1fr 70px;gap:10px;align-items:center;margin:6px 0;font-size:.9rem}
.pbar div,.qbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.pbar i,.qbar i{display:block;height:100%;background:var(--ok)}
.gcard{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:16px 18px;margin:14px 0}
.gcard h3{font:600 1.3rem var(--en);color:var(--pri)}.gm{font-weight:600;margin:0 0 8px}
.gs{background:var(--pri-soft);padding:8px 12px;border-radius:8px;max-width:none}
.gx li,.vlist li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px dashed var(--line)}
.gx .vi{display:block;color:var(--mute);font-size:.93rem;font-family:var(--ui)}
.say{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:transparent;color:var(--pri);display:grid;place-items:center;cursor:pointer;margin-top:2px}
.vlist li{cursor:pointer;display:grid;grid-template-columns:30px minmax(8em,13em) 1fr;align-items:start}
.vlist .vx{grid-column:2/-1;color:var(--mute);font-size:.98rem}
.vlist.hidden li:not(.show) .vm{filter:blur(6px)}
.chk{display:flex;gap:8px;align-items:flex-start;margin:10px 0;font-size:.95rem}.chk input{margin-top:.35em}
.kwl .spk{flex:none;min-width:26px;height:26px;border-radius:13px;padding:0 6px;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center;font-size:.8rem;margin-top:4px}
.kwl.veil div{filter:blur(7px);user-select:none}
.guide{padding-left:1.3em}.guide li{margin:.45em 0}
.cue{background:var(--card);border:1.5px solid var(--ink);border-radius:6px;padding:14px 18px;margin:12px 0;max-width:520px}
.cue ul{margin:.3em 0;padding-left:1.2em}.cue p{margin:.2em 0}
.pn{display:flex;justify-content:space-between;margin-top:40px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin:18px 0}
.pcard{display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px 16px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;text-decoration:none;cursor:pointer}
.pcard:hover{border-color:var(--pri)}.pcard b{color:var(--pri)}.pcard span{color:var(--mute);font-size:.9rem}
.tb{width:100%;border-collapse:collapse;margin:14px 0;font-size:.93rem;text-align:left}
.tb th,.tb td{border:1px solid var(--line);padding:7px 10px;vertical-align:top}.tb th{background:var(--pri-soft)}
.scroll{overflow-x:auto}
/* Biểu đồ */
.fig{margin:14px 0;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;max-width:620px}
.fig figcaption{font:600 1rem var(--en);margin-bottom:6px}
.ch{display:block;width:100%;min-width:300px;height:auto}
.ch text{font:11px var(--ui);fill:var(--mute)}.ch .vl{fill:var(--ink);font-weight:600}
.ch .gl{stroke:var(--line);stroke-width:1}
.ch .ln{fill:none;stroke-width:2.5}.ch .l1{stroke-dasharray:8 4}.ch .l2{stroke-dasharray:2 4}
.map .mb{fill:var(--pri-soft);stroke:var(--pri);stroke-width:1.5}.map .ml{fill:var(--card);stroke:var(--ink);stroke-width:1.5;stroke-dasharray:5 4}
.map text{font:600 13px var(--ui);fill:var(--ink)}.map .mlt{font:600 20px var(--en)}
.map .cmp path{fill:none;stroke:var(--mute);stroke-width:2}
.leg{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.85rem;margin:6px 0 0}.leg i{display:inline-block;width:14px;height:10px;margin-right:6px;border-radius:2px}
.dat{font-size:.88rem;margin-top:6px}.dat summary{cursor:pointer;color:var(--pri)}
.flow{list-style:none;counter-reset:f;display:flex;flex-wrap:wrap;gap:8px 26px;padding:0;margin:6px 0}
.flow li{counter-increment:f;position:relative;border:1.5px solid var(--pri);border-radius:8px;padding:8px 12px;font:1rem var(--en);background:var(--pri-soft)}
.flow li::before{content:counter(f) ". ";font-weight:600}
.flow li:not(:last-child)::after{content:"";position:absolute;right:-20px;top:50%;width:12px;height:2px;background:var(--pri)}
.pies{display:flex;flex-wrap:wrap;gap:14px}.pies .fig{flex:1 1 240px}
.pie{width:150px;height:150px;display:block;margin:4px auto}
/* Làm bài */
#modal,#quiz{position:fixed;inset:0;z-index:50;display:none;overflow:auto}
#modal.on{display:grid;place-items:center;background:rgba(10,18,28,.55);padding:16px}
.sheet{background:var(--paper);border-radius:12px;padding:22px;width:min(680px,100%);max-height:92vh;overflow:auto;position:relative}
.x{width:36px;height:36px;border:0;background:transparent;font-size:1.6rem;color:var(--mute);cursor:pointer}
.sheet .x{position:absolute;top:8px;right:10px}
#quiz.on{display:block;background:var(--paper);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.qwrap{max-width:720px;margin:0 auto;padding:12px 18px 80px}
.qhead{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:6px 0 10px;position:sticky;top:0;background:var(--paper);z-index:2}.qhead b{flex:1}
#qtime,#wtime{font:600 1.05rem var(--en);background:var(--ink);color:var(--paper);padding:1px 8px;border-radius:4px}
.qtag{display:inline-block;margin:16px 0 6px;font-size:.82rem;font-weight:600;color:var(--pri);background:var(--pri-soft);padding:2px 10px;border-radius:99px}
.qtag.L{color:var(--cL)}.qtag.R{color:var(--cR)}.qtag.W{color:var(--cW)}.qtag.S{color:var(--cS)}
.qtext{font-size:1.02rem}.qs{font-size:1.3rem;line-height:1.7;margin:10px 0}
.instr{font-weight:600;margin:.4em 0}
.bl{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--ink);margin:0 3px}
.opts{display:grid;gap:10px;margin:16px 0}
.opt{display:flex;gap:12px;align-items:center;text-align:left;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:1.02rem/1.5 var(--ui);cursor:pointer}
.opt.en{font:1.12rem/1.5 var(--en)}
.opt .on{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:600 .8rem var(--ui);flex:none}
.opt:not(:disabled):hover{border-color:var(--pri)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.fb{padding:12px 16px;border-radius:10px;margin:10px 0}.fb.good{background:var(--ok-soft)}.fb.bad{background:var(--bad-soft)}.fb p{margin:.3em 0;max-width:none}
.fb.good>b{color:var(--ok)}.fb.bad>b{color:var(--bad)}
.result{text-align:center;padding:10px 0 20px}.result p{margin-inline:auto}.result h2{justify-content:center}
.bandbig{display:inline-grid;place-items:center;min-width:5.2rem;height:5.2rem;padding:0 12px;border:3px solid var(--ink);border-radius:8px;font:600 2.2rem var(--en);margin:10px auto;background:var(--card)}
.bandbig.fail{border-color:var(--mute);color:var(--mute)}
.rev{border-top:1px dashed var(--line);padding:10px 0}.rev .qs{font-size:1.1rem}
span.ok{color:var(--ok)}span.no{color:var(--bad)}
.pass{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:14px 18px;margin-bottom:12px}
.pass h3{font:600 1.25rem var(--en)}.pass p{max-width:none}.pk{display:inline-block;background:var(--ink);color:var(--card);padding:0 7px;border-radius:3px;font-family:var(--ui);font-size:.85em}
.it{padding:10px 0 6px;border-top:1px dashed var(--line)}
.iq{margin:.2em 0 .5em;max-width:none}.num{display:inline-grid;place-items:center;min-width:1.7em;height:1.7em;border:1.5px solid var(--ink);border-radius:4px;margin-right:8px;font:600 .82rem var(--ui)}
.it.ok .num{background:var(--ok);border-color:var(--ok);color:var(--card)}.it.no .num{background:var(--bad);border-color:var(--bad);color:var(--card)}
.iopts{display:grid;gap:6px;margin:0 0 6px}.iopts.tf{grid-template-columns:repeat(3,auto);justify-content:start}
.io{text-align:left;padding:7px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer}
.iopts.tf .io{font:600 .88rem var(--ui)}
.io.sel{border-color:var(--pri);background:var(--pri-soft)}.io.ok{border-color:var(--ok);background:var(--ok-soft)}.io.no{border-color:var(--bad);background:var(--bad-soft)}
.gin{display:inline-block!important;width:11em!important;max-width:60vw;margin:0 4px!important;padding:4px 8px!important}
.gsel{display:inline-block!important;width:auto!important;margin:0 4px!important;padding:4px 8px!important}
.ia{font-size:.92rem;color:var(--mute);margin:.2em 0 .4em;max-width:none}.it.no .ia b{color:var(--ok)}
.olist{list-style:none;padding:10px 14px;margin:10px 0;border:1.5px solid var(--line);border-radius:8px;background:var(--card);max-width:none}.olist b{font-family:var(--ui);margin-right:6px}
#din{font-size:1.15rem;padding:12px 14px;margin-top:12px}
.flash{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:26px 18px;text-align:center;margin:14px 0;min-height:170px}
.flash .qs{font-size:1.9rem}.flash p{margin-inline:auto}.fback{border-top:1px dashed var(--line);margin-top:16px;padding-top:14px}
.clockbig{font:600 3rem var(--en);text-align:center;margin:14px 0}
.wbox{margin:18px 0;padding-top:14px;border-top:1.5px solid var(--line)}
.wbox textarea{min-height:240px;font:1.08rem/1.7 var(--en);resize:vertical}
.wc{font-size:.9rem;color:var(--mute)}.wc.low{color:var(--bad)}.wc.good{color:var(--ok)}
.model{background:var(--card);border-left:4px solid var(--ok);padding:10px 16px;border-radius:0 8px 8px 0;margin:12px 0}.model p{max-width:none}
.yours{background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:10px 16px;white-space:pre-wrap}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:99;font-size:.92rem;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (min-width:1000px){
 .qwrap.split{max-width:1240px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 28px;align-items:start}
 .qwrap.split>.qhead,.qwrap.split>.qbar{grid-column:1/-1}
 .qwrap.split>.pcol{position:sticky;top:60px;max-height:calc(100vh - 80px);overflow:auto}
}
@media (max-width:820px){
 #app{display:block}
 .nav{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));border:0;border-top:1px solid var(--line);z-index:20}
 .nav .brand{display:none}.nav a{flex-direction:column;gap:2px;font-size:.64rem;padding:4px 3px}
 main{padding-top:18px}h1{font-size:1.4rem}
 .wk{flex-direction:column;align-items:stretch;gap:2px;margin-bottom:12px}.wkl{width:auto}.wkl small{display:inline;margin-left:8px}
 .vlist li{grid-template-columns:30px 1fr}.vlist .vm,.vlist .vx{grid-column:2}
 .outl li{flex-wrap:wrap}.tb{font-size:.84rem}.iopts.tf{grid-template-columns:1fr 1fr 1fr}
 .lmk small{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.chipsb,.ordout{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.ordout{min-height:54px;padding:8px;border:1.5px dashed var(--line);border-radius:10px;align-items:center}

đi ngủ lúc mười một giờ.\n>He 【is never|never is|never be|does never】 late for class.=Anh ấy không bao giờ đi học muộn.\n@Present continuous|Thì hiện tại tiếp diễn|S + am/is/are + V-ing\nDùng cho việc đang diễn ra lúc nói hoặc tạm thời quanh thời điểm này. Động từ chỉ trạng thái (like, know, want, need) không dùng dạng V-ing.\n>Look! It 【is raining|rains|raining|is rain】 outside.=Nhìn kìa! Ngoài trời đang mưa.\n>This month I 【am working|work|working|am work】 at my uncle's shop.=Tháng này tôi đang làm ở cửa hàng của chú.\n>I 【want|am wanting|wanting|am want】 to improve my English.=Tôi muốn cải thiện tiếng Anh.\n+We 【sometimes eat|eat sometimes|are sometimes eat|sometimes eating】 out at weekends.=Cuối tuần thỉnh thoảng chúng tôi đi ăn ngoài.\n+Be quiet, please. The baby 【is sleeping|sleeps|sleeping|sleep】.=Trật tự nào. Em bé đang ngủ.\n##3\n@Past simple|Thì quá khứ đơn|S + V-ed / V2 · S + did not + V · Did + S + V?\nDùng cho việc đã kết thúc ở một thời điểm xác định trong quá khứ (yesterday, last year, in 2020, two days ago). Speaking Part 2 kể chuyện gần như luôn cần thì này.\n!Sau did / didn't động từ phải về nguyên mẫu: \"I didn't went\" là sai. Học thuộc dần động từ bất quy tắc: go–went, buy–bought, see–saw, take–took.\n>We 【moved|move|were move|have move】 to Da Nang in 2019.=Chúng tôi chuyển đến Đà Nẵng năm 2019.\n>I 【didn't see|didn't saw|wasn't see|not saw】 her at the party last night.=Tối qua tôi không thấy cô ấy ở bữa tiệc.\n>Where 【did you go|did you went|you went|were you go】 last summer?=Hè năm ngoái bạn đã đi đâu?\n@was / were|Động từ \"be\" ở quá khứ|I/he/she/it + was · you/we/they + were\nDùng với tính từ, danh từ, nơi chốn. Không dùng did với be.\n>When I was a child, my grandparents 【were|was|did|are】 very kind to me.=Khi tôi còn nhỏ, ông bà rất hiền với tôi.\n>The film 【wasn't|didn't|weren't|didn't be】 very interesting.=Bộ phim không thú vị lắm.\n+She 【bought|buyed|buys|was buy】 a new phone two days ago.=Hai ngày trước cô ấy mua điện thoại mới.\n+【Did they enjoy|Did they enjoyed|Were they enjoy|They enjoyed】 the trip?=Họ có thích chuyến đi không?\n##4\n@Countable and uncountable nouns|Danh từ đếm được và không đếm được|many / a few + N số nhiều · much / a little + N không đếm được · some (khẳng định) · any (phủ định, nghi vấn)\nDanh từ không đếm được (water, rice, information, advice, traffic, money, furniture, homework) không có số nhiều và không đi với a/an.\n!\"Informations\", \"advices\", \"many money\", \"a homework\" đều sai. Đây là lỗi làm mất điểm Grammar ở Writing.\n>How 【much|many|a lot|few】 water do you drink every day?=Mỗi ngày bạn uống bao nhiêu nước?\n>There aren't 【many|much|a little|some】 vegetables in the fridge.=Trong tủ lạnh không còn nhiều rau.\n>Can you give me some 【advice|advices|an advice|advise】 about my diet?=Bạn cho tôi vài lời khuyên về chế độ ăn được không?\n>I only eat 【a little|a few|many|few】 sugar.=Tôi chỉ ăn một chút đường.\n>We don't have 【any|some|a|many】 milk left.=Chúng tôi không còn chút sữa nào.\n+She has 【a few|a little|much|any】 friends who are vegetarian.=Cô ấy có vài người bạn ăn chay.\n+The website gives useful 【information|informations|an information|informationes】 about healthy food.=Trang web cung cấp thông tin hữu ích về thực phẩm lành mạnh.\n##5\n@Comparatives|So sánh hơn|tính từ ngắn + er + than · more + tính từ dài + than · bất quy tắc: good–better, bad–worse, far–further\nDùng để so sánh hai đối tượng. Đây là ngữ pháp xương sống của Writing Task 1 và Speaking Part 3.\n!Không dùng \"more\" cùng \"-er\" (more cheaper). Tính từ hai âm tiết tận cùng y đổi thành ier: easy–easier, busy–busier.\n>The train is 【faster than|more fast than|faster that|fast than】 the bus.=Tàu nhanh hơn xe buýt.\n>Living in the city is 【more expensive than|expensiver than|more expensive that|most expensive than】 living in a village.=Sống ở thành phố đắt hơn ở làng quê.\n>The traffic today is 【worse|badder|more bad|worst】 than yesterday.=Giao thông hôm nay tệ hơn hôm qua.\n@Superlatives|So sánh nhất|the + tính từ ngắn + est · the most + tính từ dài · the best, the worst\nDùng khi so sánh từ ba đối tượng trở lên. Luôn có \"the\".\n>It is 【the most beautiful|the more beautiful|most beautiful|the beautifulest】 beach in the country.=Đó là bãi biển đẹp nhất nước.\n>July is 【the hottest|the most hot|hottest|the hotter】 month of the year.=Tháng Bảy là tháng nóng nhất năm.\n+Taxis are 【more convenient than|convenienter than|more convenient that|the most convenient than】 buses at night.=Ban đêm taxi tiện hơn xe buýt.\n+This is 【the cheapest|the most cheap|cheapest|the cheaper】 hotel near the station.=Đây là khách sạn rẻ nhất gần ga.\n##6\n@will and be going to|Hai cách nói về tương lai|will + V: dự đoán, quyết định ngay lúc nói · am/is/are going to + V: kế hoạch đã định, dự đoán có căn cứ\nSpeaking Part 1 hay hỏi về kế hoạch (\"What will you do after you graduate?\"). Kế hoạch đã có sẵn thì dùng be going to.\n!Sau will là động từ nguyên mẫu không \"to\": \"I will to study\" là sai.\n>I think it 【will rain|will to rain|is rain|rains will】 tomorrow.=Tôi nghĩ mai trời sẽ mưa.\n>After this course I 【am going to apply|am going apply|will going to apply|going to apply】 for a scholarship.=Sau khoá này tôi định nộp đơn xin học bổng.\n@can, should, have to|Động từ khuyết thiếu cơ bản|can + V: có thể · should + V: nên · have to + V: phải (do quy định, hoàn cảnh)\nSau động từ khuyết thiếu luôn là động từ nguyên mẫu. Với he, she, it dùng \"has to\".\n>Students 【have to|has to|must to|should to】 hand in the assignment by Friday.=Sinh viên phải nộp bài trước thứ Sáu.\n>You 【should revise|should to revise|should revising|should revised】 a little every day.=Bạn nên ôn mỗi ngày một ít.\n>She 【can speak|can speaks|cans speak|can to speak】 three languages.=Cô ấy nói được ba thứ tiếng.\n+Look at those clouds. It 【is going to rain|will raining|going to rain|is going rain】.=Nhìn mây kìa. Trời sắp mưa rồi.\n+He 【has to|have to|must to|has】 work part-time to pay his fees.=Anh ấy phải làm thêm để trả học phí.\n##7\n@Present perfect|Thì hiện tại hoàn thành|S + have/has + V3 · for + khoảng thời gian · since + mốc thời gian\nDùng cho việc bắt đầu trong quá khứ và còn kéo đến hiện tại, kinh nghiệm (ever, never), hoặc việc vừa xảy ra (just, already, yet). Có thời điểm quá khứ cụ thể (yesterday, in 2020) thì phải dùng quá khứ đơn.\n!\"I have bought it last week\" là sai vì \"last week\" là thời điểm đã kết thúc. Đúng: \"I bought it last week\".\n>I 【have lived|live|am living|lived】 here since 2015.=Tôi sống ở đây từ năm 2015.\n>She 【has used|have used|is use|uses】 this phone for three years.=Cô ấy đã dùng chiếc điện thoại này ba năm.\n>Have you ever 【tried|try|tryed|trying】 online learning?=Bạn đã bao giờ thử học trực tuyến chưa?\n>We 【bought|have bought|buy|have buy】 our first computer in 2010.=Chúng tôi mua chiếc máy tính đầu tiên năm 2010.\n>The number of internet users 【has increased|have increased|increased|is increase】 since 2000.=Số người dùng internet đã tăng kể từ năm 2000.\n+He has worked for this company 【for|since|from|in】 ten years.=Anh ấy đã làm cho công ty này mười năm.\n+I 【haven't finished|didn't finished|haven't finish|don't finished】 my assignment yet.=Tôi chưa làm xong bài.\n##8\n@Passive voice|Câu bị động|Hiện tại: am/is/are + V3 · Quá khứ: was/were + V3 · Sau modal: can/must/should + be + V3\nDùng khi hành động quan trọng hơn người làm, hoặc không biết ai làm. Bắt buộc phải thành thạo để viết Task 1 dạng quy trình (process) và rất hay gặp trong bài đọc khoa học.\n!Thiếu \"be\" là lỗi phổ biến: \"Plastic bottles collected\" phải là \"Plastic bottles are collected\".\n>Glass bottles 【are collected|collect|is collected|are collect】 every Monday.=Chai thuỷ tinh được thu gom vào thứ Hai hằng tuần.\n>The factory 【was built|built|was build|is build】 in 1995.=Nhà máy được xây năm 1995.\n>A lot of energy 【is wasted|wastes|are wasted|is waste】 in old buildings.=Rất nhiều năng lượng bị lãng phí trong các toà nhà cũ.\n>Wild animals should 【be protected|protected|be protect|been protected】 by law.=Động vật hoang dã cần được pháp luật bảo vệ.\n>After that, the paper 【is cut|cuts|is cutted|are cut】 into small pieces.=Sau đó giấy được cắt thành mảnh nhỏ.\n+These forests 【were destroyed|destroyed|was destroyed|were destroy】 by fire last year.=Những khu rừng này bị lửa thiêu rụi năm ngoái.\n+The waste 【is taken|takes|is took|are taken】 to a recycling centre.=Rác được đưa đến trung tâm tái chế.\n##9\n@Relative clauses|Mệnh đề quan hệ|who: người · which: vật · that: người hoặc vật · where: nơi chốn · whose: sở hữu\nDùng để nối hai câu và nói rõ ta đang nhắc đến ai, cái gì. Đây là cách dễ nhất để có \"câu phức\", một yêu cầu để đạt 6.0 Grammar ở cả Writing lẫn Speaking.\n!Không lặp lại chủ ngữ hoặc tân ngữ: \"The man who he lives next door\" là sai.\n>The teacher 【who|which|where|whose】 taught me English was very patient.=Giáo viên dạy tôi tiếng Anh rất kiên nhẫn.\n>Swimming is a sport 【which|who|where|what】 uses every muscle.=Bơi là môn thể thao dùng đến mọi cơ bắp.\n>This is the gym 【where|which|who|that】 I work out every evening.=Đây là phòng gym nơi tôi tập mỗi tối.\n>People 【who exercise|which exercise|who exercises|exercise who】 regularly sleep better.=Những người tập thể dục đều đặn ngủ ngon hơn.\n>I have a friend 【whose|who|which|who's】 brother is a professional footballer.=Tôi có một người bạn có anh trai là cầu thủ chuyên nghiệp.\n+The book 【that I bought|that I bought it|who I bought|I bought it】 yesterday is about nutrition.=Cuốn sách tôi mua hôm qua nói về dinh dưỡng.\n+She is the coach 【who|which|where|whom she】 trained the national team.=Cô ấy là huấn luyện viên đã dẫn dắt đội tuyển quốc gia.\n##10\n@Zero and first conditional|Câu điều kiện loại 0 và loại 1|Loại 0: If + hiện tại đơn, hiện tại đơn (sự thật) · Loại 1: If + hiện tại đơn, will + V (khả năng có thật ở tương lai) · unless = if … not\nDùng để nói về kết quả, hệ quả. Rất hữu ích cho Writing Task 2 khi giải thích một lập luận (\"If cities build more houses, rents will fall\").\n!Không dùng will trong mệnh đề if: \"If it will rain\" là sai.\n>If you 【heat|will heat|heated|heating】 ice, it melts.=Nếu bạn làm nóng đá thì nó tan.\n>If the rent goes up again, we 【will move|move|moved|would moved】 to a cheaper area.=Nếu tiền nhà lại tăng, chúng tôi sẽ chuyển sang khu rẻ hơn.\n>If the city 【builds|will build|built|building】 more parks, residents will be healthier.=Nếu thành phố xây thêm công viên, cư dân sẽ khoẻ mạnh hơn.\n>You will miss the bus 【unless|if|when|because】 you leave now.=Bạn sẽ lỡ xe buýt nếu không đi ngay.\n>If people 【don't have|won't have|not have|doesn't have】 jobs, they cannot pay rent.=Nếu không có việc làm, người ta không thể trả tiền thuê nhà.\n+If public transport 【is|will be|was|be】 cheap, more people will use it.=Nếu giao thông công cộng rẻ, nhiều người sẽ dùng hơn.\n+Unless the government 【acts|will act|doesn't act|acted】, the housing problem will get worse.=Nếu chính phủ không hành động, vấn đề nhà ở sẽ tệ hơn.\n##11\n@Modals of possibility|Nói về khả năng và sự thận trọng|may / might / could + V: có thể · must + V: chắc hẳn · tend to + V: có xu hướng\nTrong bài luận học thuật không nên khẳng định tuyệt đối. Thay vì \"Children who play games fail exams\", hãy viết \"Children who play too many games may get lower marks\". Cách nói thận trọng này (hedging) giúp lập luận thuyết phục hơn ở Task 2 và Part 3.\n!Sau may, might, could, must là động từ nguyên mẫu, không có \"to\" và không thêm s.\n>Online courses 【may not suit|may not to suit|may not suits|don't may suit】 every student.=Khoá học trực tuyến có thể không hợp với mọi học sinh.\n>Young children 【tend to learn|tend learn|tends to learn|tend to learning】 languages quickly.=Trẻ nhỏ thường học ngôn ngữ nhanh.\n>He got full marks. He 【must be|must to be|can be|must is】 very clever.=Cậu ấy được điểm tối đa. Hẳn là cậu ấy rất thông minh.\n>Without good teachers, students 【might lose|might to lose|might loses|might losing】 interest.=Không có giáo viên giỏi, học sinh có thể mất hứng thú.\n+Homework 【can help|can helps|can to help|cans help】 children remember the lesson.=Bài tập về nhà có thể giúp trẻ nhớ bài.\n+This 【could lead|could leads|could to lead|could leading】 to higher fees in the future.=Điều này có thể dẫn đến học phí cao hơn trong tương lai.\n##12\n@Gerund or infinitive|Động từ theo sau: V-ing hay to V|+ V-ing: enjoy, avoid, finish, consider, suggest, mind, keep · + to V: want, decide, hope, plan, need, agree, afford · Sau giới từ luôn là V-ing\nĐộng từ đứng làm chủ ngữ cũng dùng V-ing: \"Working from home saves time\".\n!\"I enjoy to work\" và \"interested in learn\" là hai lỗi rất hay gặp.\n>I enjoy 【working|to work|work|worked】 with customers.=Tôi thích làm việc với khách hàng.\n>She decided 【to apply|applying|apply|applied】 for the job.=Cô ấy quyết định nộp đơn xin việc.\n>He is interested in 【starting|start|to start|started】 his own business.=Anh ấy muốn khởi nghiệp riêng.\n>【Working|Work|To working|Worked】 long hours can cause stress.=Làm việc nhiều giờ có thể gây căng thẳng.\n>Many people cannot afford 【to retire|retiring|retire|retired】 early.=Nhiều người không đủ điều kiện nghỉ hưu sớm.\n+You should avoid 【making|to make|make|made】 the same mistake.=Bạn nên tránh mắc lại lỗi đó.\n+They hope 【to increase|increasing|increase|increased】 profits next year.=Họ hy vọng tăng lợi nhuận vào năm tới.\n##13\n@Linking words|Từ nối chỉ đối lập, nguyên nhân, kết quả|although + mệnh đề · despite / because of + danh từ hoặc V-ing · However, / Therefore, + mệnh đề (đứng đầu câu, có dấu phẩy)\nTiêu chí Coherence and Cohesion chiếm 25% điểm Writing. Dùng đúng vài từ nối cơ bản tốt hơn nhiều so với dùng sai từ nối \"sang\".\n!Không dùng \"although\" và \"but\" trong cùng một câu. \"Despite\" không đi với mệnh đề: \"despite it was expensive\" là sai.\n>【Although|Despite|However|Because of】 advertising is expensive, most companies use it.=Mặc dù quảng cáo đắt, hầu hết công ty vẫn dùng.\n>【Despite|Although|However|Because】 the high price, the phone sold well.=Bất chấp giá cao, chiếc điện thoại vẫn bán chạy.\n>TV news is fast. 【However,|Although|Despite|Because of】 it is not always accurate.=Tin truyền hình nhanh. Tuy nhiên, nó không phải lúc nào cũng chính xác.\n>The match was cancelled 【because of|because|although|despite of】 the storm.=Trận đấu bị huỷ vì cơn bão.\n>Children see many adverts. 【Therefore,|However,|Although|Despite】 parents should talk to them about advertising.=Trẻ em xem rất nhiều quảng cáo. Vì vậy, cha mẹ nên nói chuyện với con về quảng cáo.\n+【Although|Despite|But|However】 he is a journalist, he rarely watches the news.=Tuy là nhà báo, anh ấy hiếm khi xem tin tức.\n+Sales fell 【because|because of|despite|although of】 the advert was misleading.=Doanh số giảm vì quảng cáo gây hiểu lầm.\n##14\n@Second conditional|Câu điều kiện loại 2|If + S + V quá khứ đơn, S + would / could + V\nDùng cho tình huống giả định, không có thật ở hiện tại. Speaking Part 3 rất hay hỏi kiểu \"What would happen if…?\" và \"If you were the mayor, what would you do?\".\n!Mệnh đề if dùng quá khứ đơn chứ không dùng would. Với be, dùng \"were\" cho mọi ngôi trong văn trang trọng: \"If I were…\".\n>If I 【were|am|would be|will be】 the mayor, I would ban cars from the centre.=Nếu tôi là thị trưởng, tôi sẽ cấm ô tô vào trung tâm.\n>If everyone used solar power, emissions 【would fall|will fall|fell|would fell】.=Nếu mọi người dùng điện mặt trời, khí thải sẽ giảm.\n>If petrol 【cost|costs|would cost|will cost】 more, people would drive less.=Nếu xăng đắt hơn, người ta sẽ lái xe ít đi.\n>What 【would you do|will you do|did you do|would you did】 if there were no electricity?=Bạn sẽ làm gì nếu không có điện?\n>If we 【didn't burn|don't burn|wouldn't burn|not burned】 fossil fuels, the air would be cleaner.=Nếu chúng ta không đốt nhiên liệu hoá thạch, không khí sẽ sạch hơn.\n+If I had more money, I 【would buy|will buy|bought|would bought】 an electric car.=Nếu có nhiều tiền hơn, tôi sẽ mua xe điện.\n+If governments 【invested|invest|would invest|will invest】 more in wind energy, we could close coal plants.=Nếu các chính phủ đầu tư nhiều hơn vào điện gió, ta có thể đóng cửa nhà máy than.\n##15\n@Noun phrases for data|Cụm danh từ khi mô tả số liệu|the number of + N đếm được số nhiều (+ động từ số ít) · the amount of + N không đếm được · the proportion / percentage of + N · a rise / fall / increase / decrease in + N\nVăn học thuật ưa dùng cụm danh từ hơn động từ. \"There was a sharp increase in research funding\" nghe học thuật hơn \"Research funding increased sharply\", và biết cả hai cách giúp bạn tránh lặp ở Task 1.\n!\"The number of students are\" là sai; chủ ngữ thật là \"the number\" nên động từ chia số ít: \"The number of students is rising\".\n>The number of scientists 【has grown|have grown|grow|are growing】 since 2000.=Số nhà khoa học đã tăng kể từ năm 2000.\n>【The amount of|The number of|Many|A few】 data collected was enormous.=Lượng dữ liệu thu được là khổng lồ.\n>There was a sharp increase 【in|of|at|on】 spending on research.=Chi tiêu cho nghiên cứu tăng mạnh.\n>【The proportion of|The number|The amount|Percent of】 women in science rose from 20% to 35%.=Tỉ lệ phụ nữ làm khoa học tăng từ 20% lên 35%.\n>There was 【a gradual decline|a gradually decline|gradual declined|a decline gradual】 in the cost of solar panels.=Giá pin mặt trời giảm dần.\n+The number of experiments 【was|were|are|have been】 limited by the budget.=Số thí nghiệm bị giới hạn bởi ngân sách.\n+The figure shows a steady rise 【in|of|on|for】 the use of robots.=Số liệu cho thấy việc dùng robot tăng đều.\n##16\n@Contrast and concession|Đối lập và nhượng bộ|while / whereas + mệnh đề: so sánh hai vế · even though + mệnh đề · in contrast, / on the other hand, + mệnh đề · in spite of + N / V-ing\nDạng bài \"Discuss both views\" đòi hỏi bạn đặt hai quan điểm cạnh nhau một cách rõ ràng. Task 1 cũng cần while/whereas để so sánh hai nhóm số liệu trong một câu.\n!\"Whereas\" nối hai mệnh đề trong cùng một câu; không đặt dấu chấm rồi mới viết \"Whereas…\" thành câu riêng.\n>Some people think prison is the best punishment, 【whereas|however|despite|in spite of】 others prefer community work.=Một số người cho rằng tù giam là hình phạt tốt nhất, trong khi người khác chuộng lao động công ích.\n>【Even though|In spite of|However|In contrast】 the law is strict, people still break it.=Dù luật nghiêm, người ta vẫn vi phạm.\n>Crime fell in the north. 【In contrast,|Whereas|Even though|In spite of】 it rose in the south.=Tội phạm giảm ở miền bắc. Ngược lại, ở miền nam lại tăng.\n>【In spite of|Even though|Whereas|Although】 higher taxes, the government is still short of money.=Dù thuế cao hơn, chính phủ vẫn thiếu tiền.\n>【While|Despite|However|In contrast】 taxes are unpopular, they pay for schools and hospitals.=Tuy thuế không được ưa chuộng, chúng chi trả cho trường học và bệnh viện.\n+The rich are getting richer, 【while|however|in spite of|even】 the poor are getting poorer.=Người giàu ngày càng giàu, còn người nghèo ngày càng nghèo.\n+【Even though|In spite of|Whereas of|Despite】 he committed a serious crime, he was not sent to prison.=Dù phạm tội nghiêm trọng, anh ta không bị bỏ tù.\n##17\n@Articles|Mạo từ a/an, the và không mạo từ|a/an: nhắc lần đầu, một trong nhiều · the: đã xác định, duy nhất (the sun, the government, the internet) · không mạo từ: danh từ số nhiều hoặc không đếm được khi nói chung chung\nTiếng Việt không có mạo từ nên đây là lỗi dai dẳng nhất của người Việt. Danh từ đếm được số ít gần như không bao giờ đứng một mình: phải có a/an, the, my, this…\n!Nói chung chung thì không dùng \"the\": \"Tourism is important\" (không phải \"The tourism\"), \"Tourists bring money\" (không phải \"The tourists\").\n>She works as 【a|the|an|—】 tour guide.=Cô ấy làm hướng dẫn viên du lịch.\n>【Tourism|The tourism|A tourism|Tourisms】 creates many jobs.=Du lịch tạo ra nhiều việc làm.\n>We visited a temple. 【The|A|An|—】 temple was 600 years old.=Chúng tôi thăm một ngôi đền. Ngôi đền đó 600 năm tuổi.\n>It was 【an|a|the|—】 unforgettable experience.=Đó là một trải nghiệm khó quên.\n>【The|A|An|—】 internet has made the world smaller.=Internet đã làm thế giới nhỏ lại.\n+I bought 【a|the|an|—】 souvenir at the market.=Tôi mua một món quà lưu niệm ở chợ.\n+【Young people|The young peoples|A young people|Young peoples】 often prefer foreign brands.=Giới trẻ thường chuộng thương hiệu ngoại.\n##18\n@Cause and effect|Diễn đạt nguyên nhân và kết quả|Nguyên nhân + lead to / result in / cause + kết quả · Kết quả + result from + nguyên nhân · due to / owing to + N · As a result, / Consequently, + mệnh đề\nDạng bài \"Causes and solutions\" và mọi câu hỏi \"Why…?\" ở Part 3 đều cần nhóm cấu trúc này. Biết ba, bốn cách khác nhau giúp bạn không lặp \"because\".\n!\"Lead to\" đi với danh từ hoặc V-ing: \"lead to people live longer\" là sai, phải là \"lead to longer lives\" hoặc \"lead to people living longer\".\n>Poor diet can 【lead to|lead|leads to|lead for】 heart disease.=Ăn uống kém có thể dẫn đến bệnh tim.\n>Many illnesses 【result from|result in|result|lead to】 a lack of clean water.=Nhiều bệnh xuất phát từ việc thiếu nước sạch.\n>The clinic closed 【due to|because|as a result|result in】 a shortage of doctors.=Phòng khám đóng cửa do thiếu bác sĩ.\n>People are living longer. 【As a result,|Due to|Because of|Result in】 the cost of healthcare is rising.=Người dân sống thọ hơn. Do đó, chi phí y tế đang tăng.\n>Better vaccines have 【resulted in|resulted from|resulted|leaded to】 fewer deaths.=Vắc-xin tốt hơn đã giúp giảm số ca tử vong.\n+Smoking 【causes|causes to|is cause|cause】 serious lung disease.=Hút thuốc gây ra bệnh phổi nghiêm trọng.\n+The falling birth rate will lead to 【a smaller workforce|the workforce is smaller|smaller the workforce|workforce be smaller】.=Tỉ lệ sinh giảm sẽ dẫn đến lực lượng lao động nhỏ hơn.\n##19\n@Paraphrasing|Diễn đạt lại bằng cách khác|Đổi từ loại: increase (v) ↔ an increase (n) · Đổi cấu trúc: chủ động ↔ bị động · Dùng từ đồng nghĩa: buy ↔ purchase, about ↔ approximately\nĐề thi IELTS hiếm khi lặp lại nguyên văn: đáp án Listening và Reading gần như luôn là cách nói khác của điều bạn nghe, đọc. Trong Writing, mở bài phải viết lại đề bằng lời của mình. Kỹ năng này quyết định bạn dừng ở 5.0 hay lên 6.0.\n!Chỉ thay từ khi chắc nghĩa. \"Purchase\" thay cho \"buy\" được, nhưng \"children\" không thể thành \"kids\" trong bài luận.\n>Prices rose sharply. = There was 【a sharp rise in prices|a sharply rise in prices|a sharp rise of prices|sharp rise prices】.=Giá tăng mạnh.\n>People spend more money on luxury goods. = More money 【is spent|spends|is spending|spent】 on luxury goods.=Nhiều tiền hơn được chi cho hàng xa xỉ.\n>Many people cannot afford a house. = Houses are 【too expensive for|too cheap for|affordable for|enough expensive to】 many people.=Nhiều người không đủ tiền mua nhà.\n>The economy grew slowly. = Economic 【growth was slow|grow was slow|growth was slowly|growing slow】.=Kinh tế tăng trưởng chậm.\n>About half of consumers shop online. = 【Approximately 50%|Exactly 50%|The majority|A minority】 of consumers shop online.=Khoảng một nửa người tiêu dùng mua sắm trực tuyến.\n+Sales fell dramatically. = There was 【a dramatic fall in sales|a dramatically fall in sales|a dramatic fall of sale|dramatic falling sales】.=Doanh số giảm mạnh.\n+The government increased taxes. = Taxes 【were increased|increased by|was increased|were increase】 by the government.=Thuế đã được chính phủ tăng.\n##20\n@Common errors|Soát lỗi: những lỗi làm mất điểm nhiều nhất|Chủ ngữ số ít + V(s) · Danh từ đếm được số nhiều phải có s · Giữ nhất quán thì · rise to (đến mức) / rise by (tăng thêm) / stand at (ở mức)\nỞ band 6, giám khảo chấp nhận còn lỗi, miễn là lỗi không gây khó hiểu và có nhiều câu hoàn toàn đúng. Dành 3 phút cuối mỗi bài viết để soát đúng bốn loại lỗi này.\n!Đọc lại bài theo từng loại lỗi, mỗi lượt chỉ soát một loại: lượt 1 soát động từ, lượt 2 soát danh từ số nhiều và mạo từ.\n>Each of the charts 【shows|show|showing|are show】 a different trend.=Mỗi biểu đồ cho thấy một xu hướng khác nhau.\n>There are many 【reasons|reason|a reason|reasones】 for this problem.=Có nhiều lý do cho vấn đề này.\n>In 2010 the figure 【stood at|stood by|stands on|was stand at】 20%.=Năm 2010 con số ở mức 20%.\n>Sales rose 【by|to|at|in】 5%, from 20% to 25%.=Doanh số tăng thêm 5%, từ 20% lên 25%.\n>Last year the company opened two new shops and 【hired|hires|hire|has hire】 50 people.=Năm ngoái công ty mở hai cửa hàng mới và tuyển 50 người.\n>One of the main 【factors is|factor is|factors are|factor are】 cost.=Một trong những yếu tố chính là chi phí.\n+The majority of people 【agree|agrees|is agree|agreeing】 with this view.=Đa số mọi người đồng ý với quan điểm này.\n+The price fell 【to|by|at|on】 10 dollars, its lowest level.=Giá giảm xuống còn 10 đô la, mức thấp nhất.\n", "l": "##1|1|Form completion|Điền form: đánh vần tên và số điện thoại\n!Trước khi nghe có khoảng 30 giây: đọc form và đoán mỗi ô cần tên, số hay ngày tháng.\n!Tên riêng luôn được đánh vần. \"Double T\" là hai chữ T liền nhau; số 0 trong số điện thoại đọc là \"oh\".\n!Người nói thường nêu hai lựa chọn rồi mới chốt một. Chờ đến lúc họ quyết định mới điền.\n^Complete the form below. Write ONE WORD AND/OR A NUMBER for each answer.\nA:Good morning, Riverside Sports Centre. How can I help you?\nB:Hi, I'd like to join the gym, please.\nA:Of course. Can I take your surname?\nB:Yes, it's Hartley. That's H, A, R, T, L, E, Y.\nA:Thank you. And your phone number?\nB:It's oh seven seven, double oh, nine double oh, one four two.\nA:Great. Which membership would you like? Full membership is forty pounds a month, and off-peak is twenty-five.\nB:I work in the evenings, so I'll come during the day. Off-peak is fine.\nA:When would you like to start?\nB:Next Monday, the third of March.\nA:Lovely. Please bring a photo with you on your first visit.\n_Surname: ＊|Hartley\n_Phone number: ＊|07700 900 142\n_Type of membership: ＊|off-peak/off peak\n_Monthly cost: £＊|25/twenty-five\n_Start date: Monday ＊ March|3/3rd/third\n_Bring on first visit: a ＊|photo/photograph\n##2|1|Form completion|Điền form: ngày, giờ và giá tiền\n!Bẫy đổi ý: \"it used to… but now…\", \"sorry, I mean…\". Đáp án là thông tin được nói sau.\n!Phân biệt fifteen và fifty: số \"-teen\" nhấn âm cuối, số \"-ty\" nhấn âm đầu.\n!Giá tiền \"nine pounds fifty\" viết là 9.50.\n^Complete the notes below. Write ONE WORD AND/OR A NUMBER for each answer.\nA:Hello, City Leisure Club.\nB:Hello. I'm calling about the evening yoga classes.\nA:Sure. There's a beginners' class on Tuesdays and Thursdays.\nB:What time does it start?\nA:It used to start at six, but now it begins at half past six and finishes at eight.\nB:OK. And how much is it?\nA:It's nine pounds fifty per class, or seventy pounds for ten classes.\nB:I'll take the ten classes. When does the next course begin?\nA:On the fifteenth of September.\nB:Fine. Where is the class held?\nA:In Studio four, on the second floor. And please bring your own mat. We don't provide them.\n_Class days: Tuesdays and ＊|Thursdays/Thursday\n_Start time: ＊ p.m.|6.30/6:30/half past six\n_Price for ten classes: £＊|70/seventy\n_Next course begins: ＊ September|15/15th/fifteenth\n_Room: Studio ＊, second floor|4/four\n_Students must bring a ＊|mat\n##3|1|Note completion|Địa chỉ, mã bưu điện và bẫy sửa lời\n!Mã bưu điện ở Anh gồm chữ và số xen kẽ. Viết hoa và chép đúng từng ký tự.\n!Nghe thấy \"oh, sorry\" hoặc \"actually\" nghĩa là thông tin vừa nói bị huỷ.\n!Sai chính tả là mất điểm. Tên riêng và thứ trong tuần phải viết hoa chữ đầu.\n^Complete the form below. Write ONE WORD AND/OR A NUMBER for each answer.\nA:Good afternoon, Parkside Furniture. How can I help?\nB:Hi, I ordered a desk and I'd like to arrange delivery.\nA:Certainly. What's the name?\nB:Michael Byrne. That's B, Y, R, N, E.\nA:And the delivery address?\nB:Twenty-seven Linton Road. L, I, N, T, O, N.\nA:Postcode?\nB:N, W, six, four, T, H.\nA:Thank you. We can deliver on Thursday or Saturday.\nB:Thursday is no good, I'm at work. Saturday, please.\nA:Morning or afternoon?\nB:Morning. Oh, sorry, I have a dentist's appointment then. Make it the afternoon.\nA:No problem. Delivery costs twelve pounds, and the driver will call you thirty minutes before he arrives.\n_Customer's surname: ＊|Byrne\n_Address: 27 ＊ Road|Linton\n_Postcode: ＊|NW6 4TH\n_Delivery day: ＊|Saturday\n?Delivery time|afternoon|morning|evening\n_Delivery charge: £＊|12/twelve\n##4|2|Multiple choice|Một người nói: chọn A, B hoặc C\n!Part 2 chỉ có một người nói. Gạch chân từ khoá trong câu hỏi, đừng mải đọc đáp án.\n!Cả ba lựa chọn thường đều được nhắc đến. Chỉ một cái trả lời đúng câu hỏi.\n!Đáp án đúng hiếm khi lặp nguyên từ trong băng: \"no meat\" được nói thành \"completely vegetarian\".\n^Choose the correct answer.\nN:Welcome to Greenfield Community Kitchen. My name is Sara and I run the weekend courses. Let me tell you about today.\nN:We'll start in the garden, where you'll pick the vegetables for lunch. Most people expect to cook meat, but today's menu is completely vegetarian.\nN:After that we move to the main kitchen. Please wash your hands before you touch anything. That is the most important rule here. Aprons are provided, so you don't need to bring one.\nN:Lunch will be at one o'clock, not twelve thirty as it says on the website.\nN:One last thing: the car park is closed for repairs, so please use the street parking behind the library.\n?Where does the day begin?|in the garden|in the main kitchen|in the dining room\n?What will the group cook today?|a meal without meat|a meat dish|bread\n?What is the most important rule?|washing your hands|wearing an apron|arriving on time\n?What time is lunch?|1.00|12.30|1.30\n?Where should visitors park?|behind the library|in the car park|in front of the kitchen\n##5|2|Map labelling|Gắn nhãn bản đồ: hướng và vị trí\n!Xác định điểm xuất phát (thường là entrance) và hướng la bàn trước khi băng chạy.\n!Thuộc các cụm chỉ vị trí: opposite, next to, on the far side of, in the corner, to the west of.\n!Đáp án đi theo đúng thứ tự câu hỏi. Lỡ một câu thì bỏ, bám ngay câu tiếp theo.\n^Label the map below. Choose the correct letter, A–F, for each place.\n@map|Westbrook Park|Entrance:5,7,2,0.9;Lake:4,3,4,2;Car park:8.6,6.3,3,1.4;A:2.3,6.3,2.2,1.4;B:5,0.5,2,1.3;C:0.6,3.2,2.2,1.5;D:9.2,3.2,2.2,1.5;E:9.2,0.5,2.2,1.5;F:0.6,0.5,2.2,1.5\nN:Good morning and welcome to Westbrook Park. Let me explain where everything is. You are standing at the entrance, at the bottom of your map.\nN:The building just to your left is the information centre, where you can pick up a free guide.\nN:If you walk straight ahead, you will reach the lake in the middle of the park. The café is on the far side of the lake, directly opposite the entrance, so you can enjoy the view of the water.\nN:For families, the playground is to the west of the lake. On the other side, to the east of the lake, you will find the rose garden.\nN:Finally, the tennis courts are in the north-east corner of the park, behind the rose garden. The car park is on your right.\n&A|B|C|D|E|F\n:Information centre|A\n:Café|B\n:Playground|C\n:Rose garden|D\n:Tennis courts|E\n##6|1|Form completion|Bài Part 1 thu nhỏ, nghe một lần\n!Làm như thi thật: chỉ bấm nghe một lần rồi mới xem lời thoại.\n!Hai con số đi liền nhau (340 và 300): đọc kỹ ô trống hỏi con số nào.\n!Thi trên máy không có 10 phút chép đáp án. Gõ ngay trong lúc nghe; cuối bài chỉ có 2 phút soát lại.\n^Complete the notes below. Write ONE WORD AND/OR A NUMBER for each answer.\nA:Good morning, Central College, admissions office.\nB:Hello, I'd like some information about your English evening course.\nA:Certainly. The course runs for twelve weeks, starting on the ninth of January.\nB:How many hours a week?\nA:Six hours: Monday and Wednesday evenings, from six to nine.\nB:And what's the cost?\nA:The fee is three hundred and forty pounds, but if you register before the first of December, it's three hundred.\nB:Good. Is there a test?\nA:Yes, a short placement test. Just speaking and writing, no listening.\nB:Do I need to buy a book?\nA:The coursebook is included, but you'll need a dictionary.\nB:OK. Who should I contact?\nA:Email Mrs Okafor. That's O, K, A, F, O, R.\n_Length of course: ＊ weeks|12/twelve\n_Start date: ＊ January|9/9th/ninth\n_Class days: Monday and ＊|Wednesday\n_Fee for early registration: £＊|300/three hundred\n?The placement test includes|speaking and writing|listening and speaking|reading and writing\n_Students must buy a ＊|dictionary\n_Contact: Mrs ＊|Okafor\n##7|2|Matching|Nối thông tin với danh sách A–E\n!Đọc danh sách A–E trước và gạch từ khoá. Các mục cần nối (tên phòng) xuất hiện theo đúng thứ tự trong băng.\n!Lựa chọn luôn được diễn đạt lại: \"control a robot arm themselves\" = \"operate a machine\".\n!Luôn có lựa chọn thừa. Đừng cố dùng hết danh sách.\n^What does the speaker say about each gallery? Choose the correct letter, A–E.\nN:Thank you for visiting the Science and Technology Museum. Before you go in, here is a quick guide to our four galleries.\nN:The Robot Zone is the favourite with children, because they can control a real robot arm themselves.\nN:Next door, the Space Gallery is closed this morning for cleaning, but it will open again at two o'clock.\nN:If you like history, go to the Communication Hall, where a guide gives a free talk every hour about the first telephones.\nN:Finally, the Future Lab is the only gallery where you have to pay extra. Tickets are three pounds from the front desk. Photography is allowed everywhere except in the Future Lab.\n&A visitors must buy a ticket|B there is a guided talk|C it is closed for part of the day|D visitors can operate a machine|E it has a café\n:Robot Zone|D\n:Space Gallery|C\n:Communication Hall|B\n:Future Lab|A\n?Where is photography NOT allowed?|in the Future Lab|in the Space Gallery|in the Robot Zone\n##8|3|Multiple choice|Hai sinh viên bàn bài tập: ai quyết định gì\n!Part 3 có hai, ba người bàn chuyện học. Câu hỏi thường hỏi quyết định cuối cùng của cả nhóm.\n!Một ý được nêu ra chưa phải đáp án. Chờ người kia đồng ý (\"Good idea\", \"Fine\") hay bác bỏ (\"Hmm, but…\").\n!Từ báo đổi hướng: but, instead, actually, what about.\n^Choose the correct answer.\nA:So, Tom, have you chosen a topic for the environment project?\nB:I wanted to do air pollution, but the tutor said too many groups are doing that. So I'm thinking about plastic waste in rivers.\nA:Good idea. Should we collect our own data?\nB:I'd love to, but we only have three weeks. Let's use the government reports instead.\nA:OK. How shall we present it? A poster?\nB:Everyone does posters. What about a short video?\nA:Hmm, neither of us can edit video. Let's just give a talk with slides.\nB:Fine. I'll write the introduction.\nA:And I'll do the charts. When shall we meet again?\nB:The library is closed on Friday, so, Thursday afternoon?\nA:Perfect.\n?What topic do the students choose?|plastic waste in rivers|air pollution|recycling at home\n?Why will they not collect their own data?|They do not have enough time.|It costs too much.|The tutor does not allow it.\n?How will they present the project?|as a talk with slides|as a poster|as a short video\n?What will the woman do?|prepare the charts|write the introduction|edit the video\n?When will they meet next?|on Thursday|on Friday|on Saturday\n##9|3|Matching|Nối ý kiến với từng lựa chọn A–F\n!Đọc lướt A–F và nghĩ sẵn từ đồng nghĩa: \"costs too much\" có thể được nói là \"too expensive\".\n!Mỗi môn chỉ được nhắc một lần và rất nhanh. Chọn ngay, đừng chờ nghe lại.\n!Nghe lý do đi kèm, không chỉ nghe tên môn: lý do mới là thứ khớp với danh sách.\n^What comment is made about each sport? Choose the correct letter, A–F.\nA:Jack, the university sports fair is tomorrow. Which clubs are you thinking of joining?\nB:Well, I looked at swimming, but the sessions start at six in the morning. That's far too early for me.\nA:What about the running club?\nB:My flatmate goes. She says it's a great place to meet people, so I'll probably try it.\nA:I'm interested in yoga. My doctor said it would help my back.\nB:And tennis?\nA:I'd love to, but you have to buy your own racket and pay for the courts. I can't afford it.\nB:True. Oh, there's also the climbing club.\nA:I tried it last year. Honestly, I was frightened the whole time. Never again!\n&A it costs too much|B the time is not convenient|C it is good for making friends|D it was a frightening experience|E it helps with a health problem|F it is too crowded\n:Swimming|B\n:Running|C\n:Yoga|E\n:Tennis|A\n:Climbing|D\n##10|4|Note completion|Bài giảng: điền ghi chú\n!Part 4 là một bài giảng liền mạch, không nghỉ giữa chừng. Phần ghi chú trên đề chính là dàn ý của bài nói.\n!Nghe từ dẫn đường: \"The first reason\", \"However\", \"Another problem\". Chúng cho biết bạn đang ở dòng nào.\n!Trước khi nghe, đoán từ loại của mỗi ô: danh từ, số hay tính từ.\n^Complete the notes below. Write ONE WORD AND/OR A NUMBER for each answer.\nN:Today I'm going to talk about how cities grow. Two hundred years ago, only about three per cent of the world's population lived in cities. Today the figure is more than half.\nN:Why did this happen? The first reason is jobs. When factories were built in the nineteenth century, people moved from farms to towns to find work. The second reason is services: cities offer better hospitals and schools.\nN:However, rapid growth creates problems. The most serious one is housing. When too many people arrive, rents go up and poor families are pushed to the edge of the city.\nN:Another problem is traffic, which wastes time and pollutes the air. Many cities are now trying to solve this by building underground railways.\n_200 years ago, about ＊% of people lived in cities|3/three\n_Main reason for moving to towns: to find ＊|work/jobs\n_Cities offer better hospitals and ＊|schools\n_The most serious problem is ＊|housing\n_Traffic wastes time and pollutes the ＊|air\n_Solution in many cities: underground ＊|railways/railway\n##11|4|Note completion|Bài giảng có mốc First, Second, Third\n!Bài giảng có cấu trúc rõ: First… Second… The third… Mỗi mốc ứng với một nhóm ghi chú.\n!Đáp án phải khớp ngữ pháp với câu: \"the ＊ effective method\" cần một từ so sánh nhất.\n!Giới hạn từ là luật: viết thừa một từ là sai dù đúng nghĩa.\n^Complete the notes below. Write ONE WORD AND/OR A NUMBER for each answer.\nN:In this lecture I want to look at three study methods and what research says about them.\nN:First, re-reading. Most students read their notes again and again. It feels useful, but studies show it is the least effective method.\nN:Second, testing yourself. When you close the book and try to answer questions, your memory becomes stronger. In one experiment, students who tested themselves remembered fifty per cent more after a week.\nN:The third method is spacing: studying a little every day instead of everything in one night. Sleep is also important here, because the brain stores new information while we sleep.\nN:So my advice is simple: make your own questions, spread your study over several days, and do not stay up all night before an exam.\n_Re-reading notes is the ＊ effective method|least\n_Testing yourself makes your ＊ stronger|memory\n_Students who tested themselves remembered ＊% more after one week|50/fifty\n_Spacing means studying a little every ＊|day\n_The brain stores new information during ＊|sleep\n?What is the lecturer's final advice?|Do not study all night before an exam.|Read your notes many times.|Study everything in one evening.\n##12|2|Table completion|Điền bảng: nghe theo từng hàng\n!Bảng cho sẵn cấu trúc. Nghe theo từng hàng (ở đây là thứ trong tuần), mỗi hàng một đáp án.\n!Tên riêng lạ sẽ được đánh vần; từ thông dụng như \"boots\", \"test\" thì không.\n!Chú ý \"except\": lunch is free every day except Friday.\n^Complete the table below. Write ONE WORD AND/OR A NUMBER for each answer.\nN:Welcome to your first day at Brightway Supermarkets. Let me orts cannot be about ＊|sport/sports\n_The closing date is ＊ May|20/20th/twentieth\n?How should reports be sent?|by email|by post|by hand\n_First prize is a day with the news team and a ＊|laptop\n##14|3|Multiple choice|Nghe thái độ và ý kiến\n!Câu hỏi về thái độ, ý kiến: nghe tính từ đánh giá (excellent, weakness, not necessary) và giọng điệu.\n!Lựa chọn sai thường dùng đúng từ trong băng nhưng gán cho ý khác: \"introduction\" có được nhắc, nhưng là điểm yếu.\n!Câu trả lời đúng thường là bản diễn đạt lại: \"spent ten minutes on the introduction\" = \"managed his time badly\".\n^Choose the correct answer, or write ONE WORD AND/OR A NUMBER.\nA:Come in, Leo. Let's talk about your presentation on wind energy.\nB:Thanks. I was quite nervous, to be honest.\nA:It didn't show. Your slides were clear, and the examples from Denmark were excellent. The main weakness was timing. You spent ten minutes on the introduction.\nB:Yes, I ran out of time for the conclusion.\nA:Exactly. Now, for your written report, I suggest you focus on the cost of wind farms rather than the technology.\nB:Why's that?\nA:Because the newest research is about cost, and you'll find more sources.\nB:I see. I was planning to interview an engineer.\nA:That's not necessary. Reading two or three recent articles is enough.\nB:OK. When is the deadline?\nA:It was the tenth, but I've extended it to the seventeenth.\n?How did Leo feel during the presentation?|nervous|confident|bored\n?What did the tutor like most?|the examples|the introduction|the conclusion\n?What was the main problem?|He managed his time badly.|His slides were unclear.|He spoke too quietly.\n?What should the written report focus on?|cost|technology|history\n?What does the tutor say about interviewing an engineer?|It is not needed.|It is a very good idea.|It must be done before the deadline.\n_New deadline: the ＊|17th/17/seventeenth\n##15|4|Sentence completion|Bài giảng khoa học: năm và tên đồ vật\n!Đoán trước loại thông tin của mỗi ô: năm, đồ vật small children because|they need to keep silent.|the tower is dangerous.|it finishes too late.\n_The next event is in ＊|May\n##24|2|Matching|Ngày hội mở của trường: toà nhà nào có gì\n!Đọc trước A–F và nghĩ từ đồng nghĩa: \"advice about costs\" có thể là \"explain fees\".\n!Có sáu lựa chọn cho năm toà nhà: một lựa chọn không dùng.\n^What can visitors do in each building? Choose the correct letter, A–F.\nN:Welcome to the open day at Northfield College. Here is what's happening in each building.\nN:In the Science Block, teachers are doing live experiments every thirty minutes, so you can watch one at any time.\nN:The Library is where you can speak to current students and ask what life here is really like.\nN:If you're worried about money, go to the Main Hall. Staff there will explain fees and how to apply for financial help.\nN:The Sports Centre is offering a free trial session in the gym, but you need to book a place at reception first.\nN:Finally, the Arts Studio has an exhibition of last year's student paintings. It's open all day and there's no need to book.\n&A get advice about costs|B see work made by students|C watch a demonstration|D reserve a place first|E talk to people who study there|F buy lunch\n:Science Block|C\n:Library|E\n:Main Hall|A\n:Sports Centre|D\n:Arts Studio|B\n##25|3|Multiple choice|Hai sinh viên lên kế hoạch thuyết trình\n!Đáp án là điều cả hai thống nhất sau cùng (\"Fair enough\", \"Deal\"), không phải đề xuất đầu tiên.\n!Câu hỏi về thời lượng cần một phép trừ: tổng thời gian trừ phần hỏi đáp.\n^Choose the correct answer.\nA:Right, Sam, we need to plan our presentation on social media and teenagers.\nB:Yes. I think we should start with some statistics, to get people's attention.\nA:I'd rather begin with a short story about one teenager. Numbers are easy to forget.\nB:Fair enough, a story first. Then the statistics.\nA:How long have we got?\nB:Fifteen minutes, including five for questions. So ten minutes of talking.\nA:OK. What should the main message be? That social media is harmful?\nB:That's too simple. The research says it depends on how you use it. Chatting with friends is fine. Comparing yourself with strangers isn't.\nA:Good point. Let's say that. Who'll make the slides?\nB:I did them last time. Could you do them, and I'll write the handout?\nA:Deal. Let's practise on Tuesday. The room is free after lunch.\n?How will the presentation begin?|with a story|with statistics|with a question\n?How long will the students speak for?|ten minutes|five minutes|fifteen minutes\n?What is their main message about social media?|Its effect depends on how it is used.|It is harmful for teenagers.|It helps teenagers make friends.\n?What will the man prepare?|the handout|the slides|the statistics\n?When will they practise?|on Tuesday afternoon|on Tuesday morning|on Thursday afternoon\n##26|3|Sentence completion|Giảng viên nhận xét bài luận\n!Lời nhận xét đi theo cặp khen rồi chê: \"The structure is clear… But…\". Đáp án hay nằm sau \"But\".\n!Hạn nộp được nới: sinh viên đề nghị một ngày, giảng viên cho ngày khác.\n^Complete the sentences below. Write ONE WORD ONLY for each answer.\nA:Hello, Daniel. I've read your essay on tourism in small towns.\nB:Thanks. What did you think?\nA:The structure is clear, and your introduction is strong. But the second paragraph needs more evidence. You say tourism raises prices, but you give no figures.\nB:I found some data on house prices. Shall I add that?\nA:Yes, a short table would help. Also, check your references. Two of the websites you used are not reliable.\nB:Should I use books instead?\nA:Journal articles would be better. The library has a guide for finding them.\nB:OK. And the length?\nA:It's three hundred words over the limit. Cut the part about history. It isn't relevant.\nB:Right. Can I send you the new version by Friday?\nA:Monday is fine. There's no hurry.\n_The tutor says the ＊ is strong|introduction\n_The second paragraph needs more ＊|evidence\n_Daniel should add a short ＊ about house prices|table\n_Better sources would be journal ＊|articles\n_Daniel should cut the section about ＊|history\n_The new version is due on ＊|Monday\n##27|4|Note completion|Bài giảng về giấc ngủ\n!Bài giảng đi theo khung: sự thật, các giai đoạn, vấn đề, lời khuyên. Ghi chú trên đề theo đúng khung đó.\n!Giới hạn ở đây là hai từ. \"Phone screens\" và \"screens\" đều được chấp nhận.\n^Complete the notes below. Write NO MORE THAN TWO WORDS for each answer.\nN:Today we're looking at sleep, something we do for about a third of our lives. Most adults need between seven and nine hours a night, while teenagers need a little more.\nN:Sleep has several stages. During deep sleep, the body repairs muscles and builds up energy. Later comes a lighter stage in which we dream. Scientists believe this stage helps the brain to organise memories.\nN:Modern life makes good sleep difficult. The light from phone screens tells the brain that it is still daytime, so we fall asleep later. Coffee is another problem, because caffeine stays in the body for many hours.\nN:So what can we do? The most important advice is to go to bed at the same time every night. A cool, dark bedroom also helps. And if you cannot sleep, get up and read a book rather than looking at your phone.\n_We sleep for about a ＊ of our lives|third\n_During deep sleep the body repairs ＊|muscles\n_The dreaming stage helps the brain organise ＊|memories\n_Light from ＊ makes people fall asleep later|phone screens/screens/phones\n_Most important advice: go to bed at the same ＊ every night|time\n_If you cannot sleep, read a ＊|book\n##28|4|Sentence completion|Bài giảng về nông trại trong thành phố\n!Nghe cặp ưu điểm và nhược điểm: \"There are clear advantages… However, there is one major disadvantage\".\n!Câu cuối hỏi loại cây đang được trồng, không phải loại cây chưa trồng được.\n^Complete the sentences below. Write ONE WORD ONLY for each answer. Then choose the correct answer.\nN:In this talk I'd like to introduce the idea of city farming, that is, growing food inside towns rather than in the countryside.\nN:The simplest form is the roof garden, where vegetables are grown on top of offices and blocks of flats. A newer method is the vertical farm. Here, plants grow indoors on shelves, one above another, under special lamps instead of sunlight.\nN:There are clear advantages. Food travels a shorter distance, so it is fresher when it reaches the shops. Indoor farms also use much less water, and because there are no insects, farmers do not need chemicals.\nN:However, there is one major disadvantage. The lamps use a great deal of electricity, which makes the food expensive. At the moment, vertical farms mostly grow salad leaves and herbs. Crops such as wheat and rice still need open fields.\n_Roof gardens are on top of offices and blocks of ＊|flats\n_In a vertical farm, plants grow indoors on ＊|shelves\n_Special ＊ are used instead of sunlight|lamps\n_Indoor farms need much less ＊|water\n_The main disadvantage is the cost of ＊|electricity\n?Which crops do vertical farms mainly grow now?|salad leaves and herbs|wheat and rice|fruit trees\n", "r": "##1|Sentence completion|Scanning: quét tìm thông tin cụ thể\n!Scanning là quét tìm một chi tiết (số, tên, ngày) chứ không đọc từng chữ. Đọc câu hỏi trước, xác định từ khoá, rồi mới lướt bài.\n!Chữ số và chữ viết hoa nổi bật trên trang. Dùng chúng làm điểm neo.\n!Chép từ đúng như trong bài, không đổi dạng từ.\nT:Hillside Community Library: information for new members\nHillside Community Library is open from 9 a.m. to 7 p.m., Monday to Friday, and from 10 a.m. to 4 p.m. on Saturdays. It is closed on Sundays and public holidays.\nMembership is free for local residents. To join, bring a photo ID and a letter that shows your home address. Members can borrow up to eight books for three weeks. If a book is late, the fine is 20 pence a day.\nThe library has twelve computers on the first floor. Members can use them for one hour a day, and printing costs 10 pence a page. A children's story club meets every Wednesday at 4 p.m. in the reading room.\n^Complete the sentences. Write ONE WORD AND/OR A NUMBER from the text for each answer.\n_On Saturdays the library closes at ＊ p.m.|4/four\n_To join, you need a photo ID and a ＊ showing your address|letter\n_Members can borrow a maximum of ＊ books|8/eight\n_The fine for a late book is ＊ pence a day|20/twenty\n_The computers are on the ＊ floor|first/1st\n_The story club meets every ＊|Wednesday\n##2|Matching headings|Skimming: đọc lướt lấy ý chính\n!Skimming là đọc lướt lấy ý chính: đọc tiêu đề, câu đầu và câu cuối mỗi đoạn, bỏ qua chi tiết.\n!Ý chính của đoạn thường nằm ở câu đầu. Các từ However, But báo hiệu ý đổi hướng.\n!Bài đọc thật dài 700–900 từ. Hãy skim cả bài trong 2–3 phút trước khi làm câu hỏi.\nT:How we spend our free time\n[A] Fifty years ago, most people spent their free time with others. They visited neighbours, played cards or joined a local club. Today, a large part of our leisure time is spent alone in front of a screen. A recent survey found that adults watch about three hours of video a day.\n[B] Not everyone is happy with this change. Doctors say that sitting for many hours is bad for our health, and some psychologists believe that online friends cannot replace real ones. People who spend the most time on their phones often say they feel lonely.\n[C] However, the news is not all bad. Screens have also helped people to find new hobbies. Many people now learn to cook, paint or play the guitar by watching free lessons online, and then meet others who share their interest. Technology has changed our free time, but it has not ended it.\n^Choose the correct heading for each paragraph from the list, then answer the questions.\n&i Old hobbies that have disappeared|ii A positive side of technology|iii How free time has changed|iv Worries about the new habits|v The cost of modern hobbies\n:Paragraph A|iii\n:Paragraph B|iv\n:Paragraph C|ii\n?According to the survey, how much video do adults watch each day?|about three hours|about one hour|about five hours|about half an hour\n?What is the writer's main message?|Technology has changed leisure in both bad and good ways.|People should stop using screens in their free time.|Free time was more enjoyable fifty years ago.|Online lessons are better than local clubs.\n##3|True / False / Not Given|Làm quen với TRUE, FALSE, NOT GIVEN\n!TRUE: bài nói đúng như vậy, thường bằng từ khác. FALSE: bài nói điều ngược lại. NOT GIVEN: bài không nói, bạn không thể kiểm chứng.\n!Không dùng hiểu biết riêng. Chỉ dựa vào chữ trong bài.\n!Câu hỏi đi theo thứ tự thông tin trong bài: tìm được câu 1 thì câu 2 nằm phía sau.\nT:Grandparents as carers\nIn many countries, grandparents play a big part in family life. In Vietnam, three generations often live in the same house, and grandparents look after young children while the parents work. This saves the family money, because childcare is expensive. It also means that children hear old stories and learn family traditions.\nIn Britain, the situation is different. Most grandparents live in a separate house, sometimes in another city. Even so, about 40% of British grandparents help with childcare at least once a week. Many of them say it keeps them active, although some complain that they feel tired.\nResearchers have found that children who spend time with their grandparents usually have better language skills. However, they also watch more television when they stay at their grandparents' home.\n^Do the following statements agree with the information in the text? Choose TRUE, FALSE or NOT GIVEN.\n=T|In Vietnam, it is common for grandparents to live with their grandchildren. >> Bài viết: \"three generations often live in the same house\".\n=F|Paying for childcare is cheap. >> Bài viết: \"childcare is expensive\".\n=N|Vietnamese grandparents are paid by the parents. >> Bài không hề nhắc đến chuyện trả tiền.\n=F|Most British grandparents live with their children. >> \"Most grandparents live in a separate house\".\n=T|Some British grandparents find childcare tiring. >> \"some complain that they feel tired\".\n=N|Children prefer their grandparents' home to their own. >> Bài chỉ nói trẻ xem TV nhiều hơn, không nói thích nơi nào hơn.\n##4|Sentence completion|Hoàn thành câu với giới hạn từ\n!Giới hạn từ ghi ngay trong đề. Viết thừa một từ là sai.\n!Đáp án lấy nguyên từ trong bài, và câu sau khi điền phải đúng ngữ pháp.\n!Tìm từ khoá không thể diễn đạt lại (tên riêng, năm) để định vị, rồi đọc kỹ câu chứa nó.\nT:The story of instant noodles\nInstant noodles were invented in Japan in 1958 by a businessman called Momofuku Ando. After the Second World War, food was hard to find, and Ando saw long queues of people waiting for a bowl of hot noodles. He wanted to make noodles that were cheap, tasty and quick to prepare.\nHe worked for a year in a small hut behind his house. The main problem was how to dry the noodles so that they could be kept for months. He found the answer when he watched his wife frying food in hot oil. Frying removed the water from the noodles and left tiny holes, so they became soft again in hot water.\nAt first the new product was more expensive than fresh noodles, and shops did not want to sell it. However, busy families liked it, and sales grew quickly. In 1971 Ando introduced noodles in a cup, which could be eaten anywhere. Today more than 100 billion servings are eaten around the world every year.\n^Complete the sentences. Write NO MORE THAN TWO WORDS AND/OR A NUMBER from the text.\n_Instant noodles were invented in the year ＊|1958\n_After the war, Ando saw long ＊ of people waiting for noodles|queues\n_He did his experiments in a small ＊ behind his house|hut\n_He got his idea from watching his wife fry food in ＊|hot oil/oil\n_At first, ＊ did not want to sell the noodles|shops\n_Noodles in a ＊ were introduced in 1971|cup\n##5|Matching information · Short answer|Tìm đoạn chứa thông tin và trả lời ngắn\n!Matching information: câu hỏi không theo thứ tự bài. Đọc hết các mô tả trước, rồi vừa đọc từng đoạn vừa đối chiếu.\n!Mô tả là bản diễn đạt lại: \"the final service\" chính là \"the last bus\".\n!Câu trả lời ngắn: dùng từ trong bài, không viết cả câu, tuân thủ giới hạn từ.\nT:Getting around Porto Verde\n[A] Porto Verde is a small city, and most visitors explore the old town on foot. The streets are narrow and many are closed to cars, so walking is often faster than driving. Free maps are available at the tourist office opposite the station.\n[B] For longer journeys, the tram is the best choice. Line 1 runs along the coast from the harbour to the beach every ten minutes. A single ticket costs two euros, but a day pass for five euros is better value if you make three or more trips.\n[C] Buses go to the villages in the hills. They are cheap but slow, and the last bus back leaves at 6 p.m., so check the timetable carefully.\n[D] Taxis are easy to find at the airport and the station. A journey from the airport to the centre takes about twenty minutes and should cost no more than fifteen euros. Always ask for a receipt.\n^Which paragraph contains the following information? Then answer the questions with NO MORE THAN TWO WORDS AND/OR A NUMBER.\n&A|B|C|D\n:a warning about the time of the final service|C\n:advice about a ticket that saves money|B\n:a place where visitors can get something free|A\n_How often does the tram on Line 1 run? Every ＊|ten minutes/10 minutes\n_What should passengers ask taxi drivers for? A ＊|receipt\n_How much does a day pass cost? ＊ euros|5/five\n##6|True / False / Not Given|Bẫy diễn đạt lại và từ chỉ mức độ\n!Soi kỹ từ chỉ mức độ: all, some, most, only, mainly. Đổi \"some\" thành \"all\" là kiểu câu FALSE kinh điển.\n!NOT GIVEN thường nghe rất hợp lý. Tự hỏi: \"Câu nào trong bài nói điều này?\" Không chỉ ra được thì là NOT GIVEN.\n!Câu hỏi có so sánh (higher than, more than) thì bài phải nhắc đủ cả hai vế mới kết luận được.\nT:Working while studying\nMore and more university students now have a part-time job. In a survey of 2,000 students at British universities, 55% said they worked during term time, compared with only a third ten years ago. The main reason is the rising cost of rent and food.\nWorking has clear advantages. Students earn money, gain experience and learn to manage their time. Employers often prefer graduates who have already had a job.\nHowever, there are risks. The survey found that students who worked more than fifteen hours a week were more likely to miss lectures and to get lower marks. Students from poorer families worked the longest hours. Some universities now advise students to work no more than ten hours a week, and a few have opened job centres that only advertise work on campus.\n^Do the following statements agree with the information in the text? Choose TRUE, FALSE or NOT GIVEN.\n=T|A larger proportion of students have jobs now than a decade ago. >> 55% hiện nay so với \"a third\" (khoảng 33%) mười năm trước.\n=F|Students mainly work in order to gain experience. >> Lý do chính là chi phí thuê nhà và ăn uống tăng.\n=T|Having had a job can help graduates when they look for work. >> \"Employers often prefer graduates who have already had a job\".\n=N|Students who work fewer than fifteen hours get higher marks than students with no job. >> Bài chỉ nói về nhóm làm trên 15 giờ, không so với nhóm không đi làm.\n=F|All universities tell students to work no more than ten hours a week. >> Bài viết \"Some universities\", không phải tất cả.\n=N|Jobs on campus pay more than jobs in the city. >> Không có thông tin nào về mức lương.\n##7|Matching headings|Chọn tiêu đề cho từng đoạn\n!Đọc danh sách tiêu đề trước. Với mỗi đoạn, tự tóm ý chính bằng ba, bốn từ của mình rồi mới chọn.\n!Tiêu đề phải bao trùm cả đoạn. Tiêu đề chỉ khớp một chi tiết nhỏ là bẫy.\n!Luôn có tiêu đề thừa. Làm đoạn dễ trước để loại dần.\nT:Smartphones in the classroom\n[A] When mobile phones first appeared in schools, most teachers sa
