 increased.|The number of cars has increased.|Public transport is cheaper than driving.|Many people travel by bus.\n?Khi thi trên máy, công cụ nào có sẵn trong phần Writing?|bộ đếm từ|kiểm tra chính tả|từ điển|gợi ý ngữ pháp\n", "s": "##1|1|Quê hương và nơi ở\nPart 1 dài 4–5 phút. Giám khảo hỏi khoảng 10–12 câu về ba chủ đề quen thuộc như quê hương, công việc, sở thích. Mỗi câu chỉ cần trả lời hai, ba câu: trả lời thẳng vào câu hỏi, thêm một lý do hoặc chi tiết, nếu được thì thêm một ví dụ.\nĐừng học thuộc lòng câu trả lời. Giám khảo nhận ra ngay và sẽ đổi câu hỏi. Hãy học khung câu và thay nội dung của chính bạn vào.\n~I come from … = Tôi đến từ …\n~It's known for … = Nơi đó nổi tiếng về …\n~What I like most is … = Điều tôi thích nhất là …\n~To be honest, … = Thật lòng thì …\nQ:Where is your hometown?\nA:I come from Nam Dinh, a small city about ninety kilometres from Hanoi. It's known for its traditional food, especially pho.\nQ:What do you like about it?\nA:What I like most is that it's peaceful. There isn't much traffic, and people are friendly, so it's a nice place to relax.\nQ:Is it a good place for young people?\nA:To be honest, not really. There aren't many jobs or universities, so most young people move to bigger cities after school.\nQ:Do you live in a house or a flat?\nA:I live in a small flat with my sister. It only has two rooms, but it's convenient because it's near my office.\n?Câu trả lời nào tốt nhất cho \"Do you like your hometown?\"|Yes, I do. It's quiet and the people are friendly, so I always feel relaxed there.|Yes.|Yes, I like. Because good.|My hometown is Nam Dinh.\n?Ở Part 1, mỗi câu trả lời nên dài bao nhiêu?|hai đến ba câu|một từ|ít nhất một phút|càng dài càng tốt\n##2|1|Thói quen hằng ngày và sở thích\nCâu hỏi về thói quen cần trạng từ tần suất (usually, sometimes, hardly ever) và thì hiện tại đơn. Câu hỏi về sở thích cần like, enjoy, be into + V-ing.\nKéo dài câu trả lời bằng because, so, especially, for example. Nếu không nghe rõ, cứ hỏi ays cooked a big lunch for everyone.\nQ:Do you prefer spending time with family or with friends?\nA:Both are important, but these days I spend more time with friends, because my family lives far away.\n?Chọn câu đúng để nói về thói quen trong quá khứ.|We used to play football after school.|We use to played football after school.|We used to playing football after school.|We were used play football after school.\n?\"I'm closest to my mother\" nghĩa là|tôi thân với mẹ nhất|tôi sống gần mẹ nhất|tôi giống mẹ nhất|tôi gần bằng tuổi mẹ\n##4|1|Ăn uống: nói về thích và không thích\nĐừng lặp \"I like\" cho mọi câu. Lexical Resource được chấm qua độ đa dạng: I'm a big fan of, I'm keen on, I can't stand, it's not really my thing, I'd rather… than…\nSau mỗi ý thích hoặc không thích, luôn thêm lý do. Một câu trả lời có lý do là câu trả lời band 5 trở lên.\n~I'm a big fan of … = Tôi rất thích …\n~I can't stand … = Tôi không chịu nổi …\n~I'd rather … than … = Tôi thích … hơn là …\n~It's not really my thing. = Đó không phải gu của tôi.\nQ:What kind of food do you like?\nA:I'm a big fan of noodle dishes, especially bun cha. I like food that is fresh and not too oily.\nQ:Is there any food you dislike?\nA:Yes, I can't stand bitter food. For example, I never eat bitter melon, although my mother says it's nutritious.\nQ:Do you prefer eating at home or in restaurants?\nA:I'd rather eat at home than in a restaurant. It's cheaper and healthier, and I know exactly what the ingredients are.\nQ:Who cooks in your family?\nA:My father does most of the cooking, which is unusual in my country. He learned from my grandmother, and he's really good at it.\n?Câu nào thể hiện \"rất không thích\"?|I can't stand fast food.|I'm a big fan of fast food.|I'd rather eat fast food.|I'm keen on fast food.\n?Chọn câu đúng.|I'd rather cook at home than eat out.|I'd rather to cook at home than eat out.|I'd rather cooking at home than eating out.|I rather cook at home than eat out.\n##5|2|Làm quen với Part 2: tả một nơi chốn\nỞ Part 2, giám khảo đưa một thẻ đề. Bạn có 1 phút chuẩn bị và giấy bút để ghi chú, sau đó nói một mình trong 1–2 phút. Hãy cố nói gần đủ 2 phút; giám khảo sẽ ngắt khi hết giờ.\nTrong 1 phút chuẩn bị, ghi hai, ba từ khoá cho mỗi gợi ý trên thẻ, không viết thành câu. Khi nói, đi lần lượt theo các gợi ý và dành nhiều thời gian nhất cho ý cuối \"explain why\".\n~I'd like to talk about … = Tôi muốn nói về …\n~It's located in … = Nó nằm ở …\n~When I'm there, I normally … = Khi ở đó, tôi thường …\n~The main reason I like it is that … = Lý do chính tôi thích nó là …\nC:Describe a place you like to visit in your free time.|where it is|how often you go there|what you do there|and explain why you like it\nA:I'd like to talk about a small lake near my house, called Thanh Cong Lake. It's located in the middle of a busy area in Hanoi, about ten minutes from my flat on foot. I go there quite regularly, maybe three or four times a week, usually early in the morning before work. At that time the air is fresh and it's not too crowded. When I'm there, I normally walk around the lake twice, which takes about half an hour. Sometimes I sit on a bench and listen to a podcast, and at the weekend I meet my friend there and we have coffee at a little café opposite the water. The main reason I like this place is that it's peaceful. My job is quite stressful, and walking by the lake helps me clear my mind. It's also convenient, because I don't need to pay anything or travel far. So for me it's the best place in the city to relax.\n?Trong 1 phút chuẩn bị Part 2, nên làm gì?|ghi vài từ khoá cho từng gợi ý trên thẻ|viết ra cả bài nói|ngồi nghĩ, không ghi gì|xin giám khảo đổi đề\n?Ở Part 2, bạn nên nói trong bao lâu?|từ 1 đến 2 phút, cố gắng gần đủ 2 phút|khoảng 20 giây|ít nhất 5 phút|hết ý thì dừng, bao lâu cũng được\n##6|1|Học tập, công việc và kế hoạch\nChủ đề work or study gần như chắc chắn xuất hiện ở Part 1. Chuẩn bị sẵn nội dung thật của bạn: làm gì, bao lâu rồi, thích gì, không thích gì, dự định gì.\nKế hoạch đã định dùng be going to hoặc be planning to. Mong muốn dùng hope to, would like to. Việc kéo dài đến nay dùng hiện tại hoàn thành với for hoặc since.\n~I'm currently working as … = Hiện tôi đang làm …\n~I chose it because … = Tôi chọn nó vì …\n~I'm planning to … = Tôi dự định …\n~I hope to … one day. = Tôi hy vọng một ngày nào đó sẽ …\nQ:Do you work or are you a student?\nA:I'm currently working as an accountant for a small company. I've been there for about two years.\nQ:Why did you choose that job?\nA:I chose it because I've always been good at maths. Also, there are a lot of jobs in this field, so it's quite stable.\nQ:What do you like about your job?\nA:I like my colleagues the most. They're supportive, and I learn something new from them every week. The salary could be better, though.\nQ:What are your plans for the future?\nA:I'm planning to take the IELTS test next year, and then I'm going to apply for a master's degree abroad. I hope to work for an international company one day.\n?Chọn câu đúng.|I'm going to apply for a scholarship next year.|I'm going apply for a scholarship next year.|I will to apply for a scholarship next year.|I going to apply for a scholarship next year.\n?Vì sao câu \"I've been there for two years\" dùng hiện tại hoàn thành?|Vì việc bắt đầu trong quá khứ và vẫn tiếp diễn|Vì việc đã kết thúc hẳn|Vì đó là kế hoạch tương lai|Vì đó là thói quen hằng ngày\n##7|2|Part 2: tả một đồ vật\nĐề tả đồ vật thường hỏi: nó là gì, có từ khi nào, dùng làm gì, vì sao quan trọng. Dùng quá khứ đơn khi kể lúc có được nó, hiện tại đơn khi nói cách dùng.\nNếu hết ý mà chưa đủ thời gian, hãy thêm một trong ba thứ: một ví dụ cụ thể, cảm xúc của bạn, hoặc dự định tương lai liên quan đến món đồ.\n~It was a present from … = Đó là quà của …\n~I use it for … = Tôi dùng nó để …\n~What makes it important is that … = Điều khiến nó quan trọng là …\n~I can't imagine life without it. = Tôi không hình dung nổi cuộc sống thiếu nó.\nC:Describe a piece of technology you use every day.|what it is|when you got it|what you use it for|and explain why it is important to you\nA:I'm going to describe my laptop, which I use every single day. It's a silver one, quite light, and I've had it for about three years. I got it when I started university. Actually, it was a present from my parents. They saved money for several months to buy it, so it means a lot to me. I use it for almost everything. During the day I use it for work, for example writing reports and joining online meetings. In the evening I use it to learn English. I watch videos, do practice tests and sometimes talk to a tutor online. At the weekend I also use it to watch films. What makes it important is that it connects me to opportunities. Without it, I couldn't study or apply for jobs. It's getting a bit slow now, and the battery only lasts two hours, but I can't imagine life without it. I'll probably keep using it until it stops working.\n?Khi kể bạn có món đồ từ lúc nào, câu nào đúng?|I got it three years ago.|I get it three years ago.|I have got it three years ago.|I am getting it three years ago.\n?Nói hết ý mà mới được 1 phút, nên làm gì?|thêm ví dụ, cảm xúc hoặc dự định liên quan|dừng lại và im lặng|nói lại từ đầu|xin lỗi giám khảo\n##8|3|Làm quen với Part 3: ý kiến, lý do, ví dụ\nPart 3 dài 4–5 phút. Giám khảo hỏi những câu rộng hơn, mang tính xã hội, cùng chủ đề với Part 2. Đây là phần quyết định bạn ở band 5 hay band 6.\nMỗi câu trả lời nên có bốn, năm câu theo khung: ý kiến, lý do, ví dụ, và nếu được thì một ý ngược lại. Nói về \"people\", \"society\", \"in my country\" chứ không chỉ kể chuyện bản thân.\n~In my opinion, … = Theo tôi, …\n~I think the main reason is … = Tôi nghĩ lý do chính là …\n~For example, … = Ví dụ, …\n~However, in general, … = Tuy nhiên, nhìn chung, …\nQ:Do you think people in your country care about the environment?\nA:I think more people care now than in the past, especially young people. For example, many of my friends bring their own bags when they go shopping. However, in general, people still use too much plastic because it's cheap and convenient.\nQ:What can individuals do to reduce pollution?\nA:In my opinion, the easiest thing is to change how we travel. If people used buses or bicycles for short trips, the air would be much cleaner. People can also recycle and save electricity at home. These are small actions, but they make a difference when millions of people do them.\nQ:Should children learn about the environment at school?\nA:Yes, definitely. I think habits start when we are young. If children learn to sort rubbish and save water at school, they will keep doing it as adults. They can also teach their parents, which often happens in my country.\n?Khung nào phù hợp cho một câu trả lời Part 3?|ý kiến, lý do, ví dụ|chỉ một câu ngắn|một câu chuyện cá nhân thật dài|đọc thuộc một bài mẫu\n?Câu nào phù hợp để mở đầu câu trả lời Part 3?|In my opinion, the main cause is traffic.|Yes.|I don't know about this.|It's difficult. Next question, please.\n##9|2|Part 2: tả một người\nĐề tả người hỏi: người đó là ai, bạn biết họ thế nào, họ làm gì, và vì sao bạn ngưỡng mộ hay nhớ họ. Mệnh đề quan hệ (who, which) giúp bạn có câu phức một cách tự nhiên.\nĐừng chỉ liệt kê tính từ. Mỗi tính từ nên đi kèm một việc làm cụ thể chứng minh cho nó.\n~The person I'd like to describe is … = Người tôi muốn tả là …\n~He's the kind of person who … = Chú ấy là kiểu người …\n~What I admire about him is … = Điều tôi ngưỡng mộ ở chú là …\n~He inspired me to … = Chú đã truyền cảm hứng để tôi …\nC:Describe a person you know who has a healthy lifestyle.|who this person is|how you know them|what they do to stay healthy|and explain why you admire their lifestyle\nA:The person I'd like to describe is my uncle Minh, who is my mother's younger brother. He's fifty-two, but he looks much younger. I've known him all my life, of course, and when I was a student I lived in his house for two years, so I saw his daily routine very closely. He's the kind of person who never skips exercise. He gets up at five every morning and runs around a park which is near his house. After that he has a simple breakfast, usually eggs and fruit. He doesn't smoke, and he rarely eats processed food. He also goes to bed before ten, which is quite unusual in my family. What I admire about him is his discipline. Many people start exercising and then give up after a few weeks, but he has done it for more than twenty years. He actually inspired me to take up running last year. I'm still slow, but I feel much fitter, and that's thanks to him.\n?Chọn câu đúng.|He is the kind of person who never gives up.|He is the kind of person which never gives up.|He is the kind of person who never give up.|He is the kind of person never gives up who.\n?Trong Part 2, phần nào nên nói nhiều nhất?|phần \"explain why\", nơi bạn thể hiện ý kiến và cảm xúc|phần giới thiệu tên|phần chào hỏi|các phần phải dài đúng bằng nhau\n##10|3|Part 3: so sánh và dự đoán\nGiám khảo rất hay yêu cầu so sánh (thành phố với nông thôn, xưa với nay) và dự đoán tương lai. So sánh dùng more… than, far more, compared with. Dự đoán dùng will, be likely to, I expect.\nThêm một câu về mặt ngược lại (\"On the other hand…\") cho thấy bạn nhìn vấn đề từ hai phía.\n~Compared with …, … = So với …, …\n~… is far more … than … = … hơn hẳn …\n~On the other hand, … = Mặt khác, …\n~I expect … will … = Tôi cho rằng … sẽ …\nQ:What are the advantages of living in a big city?\nA:The biggest advantage is opportunity. Cities have far more jobs, universities and hospitals than rural areas. For example, in my country most international companies are in Hanoi or Ho Chi Minh City. Life is also more convenient, because shops and public transport are everywhere.\nQ:Why do some people prefer the countryside?\nA:I think the main reason is the quality of life. Compared with cities, the countryside is quieter and the air is cleaner. The cost of living is also lower, so people feel less stress about money. On the other hand, there are fewer facilities, so it suits older people better than young ones.\nQ:How will cities change in the future?\nA:I think cities will become even more crowded, so governments will have to build more high-rise buildings and better public transport. If they don't, traffic and pollution will get worse. I also expect more people to work from home, which might reduce the pressure a little.\n?Chọn câu so sánh đúng.|Cities are far more crowded than villages.|Cities are far crowded than villages.|Cities are more crowded that villages.|Cities are the more crowded than villages.\n?Khi được hỏi về tương lai, câu nào đúng?|I think cities will become more crowded.|I think cities became more crowded.|I think cities are become more crowded.|I think cities becoming more crowded.\n##11|3|Part 3: đồng ý một phần và nói thận trọng\nKhông phải câu nào cũng trả lời \"yes\" hay \"no\". Câu trả lời tốt thường là \"it depends\" kèm giải thích phụ thuộc vào điều gì. Dùng might, may, could để nói về khả năng thay vì khẳng định tuyệt đối.\nCần thêm thời gian suy nghĩ thì dùng một câu đệm tự nhiên, đừng im lặng quá ba giây.\n~Generally speaking, … = Nói chung, …\n~I partly agree, but … = Tôi đồng ý một phần, nhưng …\n~That's an interesting question. Let me think. = Câu hỏi thú vị đấy. Để tôi nghĩ một chút.\n~It might … = Có thể nó sẽ …\nQ:Is it better to study alone or in a group?\nA:Generally speaking, I think it depends on the task. If you need to memorise something, studying alone is more effective because there are no distractions. However, for difficult subjects, a group can help, because your classmates might explain things in a simpler way than the teacher.\nQ:Do you think online learning will replace schools?\nA:I don't think so. Online courses are convenient and cheap, and they might replace some university lectures. But schools also teach social skills, like working in a team. Young children especially need a teacher who can motivate them face to face.\nQ:Should all students learn a foreign language?\nA:Yes, I believe it should be compulsory. A foreign language helps people find better jobs and understand other cultures. Some people say translation apps make this unnecessary, and I partly agree, but an app cannot build a real relationship between people.\n?Cụm nào giúp bạn có thêm thời gian suy nghĩ một cách tự nhiên?|That's an interesting question. Let me think.|Uh… uh… uh…|I don't know.|Next question, please.\n?\"It might replace some lectures\" thể hiện điều gì?|một khả năng, chưa chắc chắn|điều chắc chắn sẽ xảy ra|điều đã xảy ra rồi|một mệnh lệnh\n##12|2|Part 2: kể một trải nghiệm\nĐề kể trải nghiệm cần một câu chuyện có đầu, giữa, cuối. Thì chủ đạo là quá khứ đơn. Các mốc At first, Then, Luckily, In the end, Looking back giúp người nghe theo được mạch chuyện, và đó chính là tiêu chí Coherence.\nChi tiết nhỏ và cảm xúc làm bài nói thật và dễ kéo dài: bạn đã sợ thế nào, ai nói gì, kết quả ra sao.\n~It happened about … ago. = Chuyện xảy ra khoảng … trước.\n~At first, … but then … = Lúc đầu … nhưng rồi …\n~In the end, … = Cuối cùng, …\n~Looking back, … = Giờ nhìn lại, …\nC:Describe a time when you learned a new skill.|what the skill was|when and where you learned it|who helped you|and explain how you felt about learning it\nA:I'd like to talk about the time I learned to give presentations. It happened about two years ago, when I started my first job at a marketing company. In my first month, my manager asked me to present a report to ten colleagues. I was terrified, because I had never spoken in front of a group before. At first, I wrote every word on paper and tried to memorise it, but when I practised, I sounded like a robot. Luckily, an experienced colleague called Lan offered to help me. She told me to use only key words on my slides and to practise in front of her three times. She also recorded me on her phone, so I could see my mistakes, for example speaking too fast. In the end, the presentation went quite well. I forgot one point, but nobody noticed. I felt really proud and relieved. Looking back, it was one of the most useful skills I've learned, because now I present something almost every month, and I'm not nervous any more.\n?Khi kể một trải nghiệm đã qua, thì chủ đạo là gì?|quá khứ đơn|hiện tại đơn|tương lai đơn|hiện tại tiếp diễn\n?Cụm nào dùng để kết thúc câu chuyện?|In the end, …|At first, …|For example, …|On the other hand, …\n##13|1+2|Thi thử Part 1 và Part 2 liền nhau\nTuần này làm liền Part 1 và Part 2 như thi thật, khoảng 7 phút. Mục tiêu là nói liên tục: lỡ sai một từ thì sửa nhanh rồi nói tiếp, không dừng hẳn và không xin nói lại từ đầu.\nCác từ đệm tự nhiên như Well, Actually, What I mean is giúp bạn giữ mạch nói. Giám khảo chấm theo bốn tiêu chí, mỗi tiêu chí 25%: Fluency and Coherence, Lexical Resource, Grammatical Range and Accuracy, Pronunciation.\n~Well, … = À thì, …\n~Actually, … = Thật ra, …\n~What I mean is … = Ý tôi là …\n~Sorry, let me rephrase that. = Xin lỗi, để tôi nói lại ý đó.\nQ:How do you usually get the news?\nA:Well, mostly from my phone. I read a news app on the bus every morning, and I sometimes watch short videos on social media. I rarely watch TV news now.\nQ:Do you trust what you read online?\nA:Not completely. Actually, I always check the source, because some websites publish misleading headlines just to get attention.\nQ:Do you like watching advertisements?\nA:To be honest, no. Most of them are annoying, especially when they interrupt a video. But a few are funny, and I do remember those brands.\nC:Describe an advertisement you remember well.|what it was for|where you saw it|what happened in it|and explain why you remember it\nA:I'd like to describe an advertisement for a milk brand, which I saw on TV around Tet a few years ago. It told the story of a young man who worked in a big city and was too busy to go home for the holiday. In the advert, his mother called him, and he said he couldn't come. Then he saw an old woman on the street who looked like his mother, and suddenly he changed his mind. In the last scene, he arrived home at midnight, and the whole family drank milk together. It sounds a bit silly, but it was very emotional. I remember it well for two reasons. First, the music was beautiful, and I can still sing it. Second, the story was similar to my own life, because I also work far from my family. What I mean is, it didn't really sell milk; it sold the feeling of going home. I think that's why it was so effective.\n?Lỡ nói sai một từ giữa chừng, bạn nên làm gì?|sửa nhanh rồi nói tiếp: \"Sorry, I mean…\"|dừng lại và xin nói lại từ đầu|im lặng|bỏ luôn câu đó và cười\n?Điều nào KHÔNG phải là tiêu chí chấm Speaking?|ý tưởng có độc đáo hay không|Fluency and Coherence|Lexical Resource|Pronunciation\n##14|3|Part 3: tình huống giả định\nCâu hỏi kiểu \"What would happen if…?\" hay \"If you were…, what would you do?\" kiểm tra câu điều kiện loại 2: If + quá khứ đơn, would + V. Dùng đúng cấu trúc này vài lần là bằng chứng rõ ràng về \"câu phức\" cho band 6.\nSau khi nêu việc sẽ làm, thêm kết quả dự kiến (That would probably lead to…) và một khó khăn có thể gặp.\n~If I were …, I would … = Nếu tôi là …, tôi sẽ …\n~It would be better if … = Sẽ tốt hơn nếu …\n~I suppose … = Tôi cho là …\n~That would probably lead to … = Điều đó có lẽ sẽ dẫn đến …\nQ:If you were the leader of your city, what would you do about pollution?\nA:If I were the mayor, I would start with transport, because most air pollution in my city comes from motorbikes. I would build more bus lanes and make buses free for students. It would be expensive, but I suppose it would save money on healthcare later.\nQ:What would happen if petrol became very expensive?\nA:I think people would change their habits quickly. They would share vehicles, use public transport or buy electric bikes. That would probably lead to cleaner air. However, it would be hard for poor families and for people in rural areas, where there are no buses.\nQ:Do you think people would accept higher taxes to protect the environment?\nA:Honestly, most people wouldn't be happy. It would be better if the government explained clearly how the money was used. If people could see new parks or cleaner rivers, I think they would accept it.\n?Chọn câu đúng.|If I were the mayor, I would ban cars in the centre.|If I am the mayor, I would ban cars in the centre.|If I were the mayor, I will ban cars in the centre.|If I would be the mayor, I banned cars in the centre.\n?Câu hỏi \"What would happen if…?\" yêu cầu bạn làm gì?|suy đoán về một tình huống giả định|kể một chuyện đã xảy ra|tả thói quen hằng ngày|đọc số liệu\n##15|2|Part 2: nói trôi chảy khi không chắc thông tin\nBài thi không chấm kiến thức. Bạn không cần biết chính xác năm phát minh hay tên người phát minh. Hãy nói điều đó một cách tự nhiên bằng \"I'm not sure exactly, but…\" rồi nói tiếp.\nKhi bí từ, đừng dừng lại: giải thích bằng từ đơn giản hơn (\"In other words…\", \"It's a kind of…\"). Khả năng diễn đạt vòng như vậy được tính vào Lexical Resource ở band 6.\n~As far as I know, … = Theo tôi biết thì …\n~I'm not sure exactly, but … = Tôi không chắc chính xác, nhưng …\n~In other words, … = Nói cách khác, …\n~All in all, … = Nhìn chung, …\nC:Describe an invention that has changed people's lives.|what it is|when it became popular|how people use it|and explain why you think it is important\nA:I'm going to talk about the motorbike, which may not sound very modern, but it has completely changed life in my country. I'm not sure exactly when it was invented, but as far as I know it became popular in Vietnam in the 1990s, when prices fell and ordinary families could afford one. Before that, most people travelled by bicycle. Today almost every family has at least one. People use motorbikes to commute, to take children to school and even to carry goods. For example, in my city you can see a motorbike carrying a fridge or twenty boxes of eggs, which always surprises tourists. Many people also earn money as delivery drivers. I think it's important because it gave people freedom. In other words, they could live further from their work, visit relatives and start small businesses. Of course, motorbikes also cause pollution and traffic jams, so I hope electric ones will replace them soon. All in all, though, I can't think of another invention that has changed daily life here so much.\n?Khi không chắc một thông tin, cách nói nào tự nhiên nhất?|I'm not sure exactly, but I think it was in the 1990s.|I don't know.|Nói bừa một con số thật tự tin|Bỏ qua và im lặng\n?\"In other words\" dùng để làm gì?|diễn đạt lại ý vừa nói bằng cách khác|đưa ra ý trái ngược|kết thúc bài nói|đưa ví dụ\n##16|3|Part 3: nguyên nhân, hệ quả và giải pháp\nCâu hỏi \"Why…?\" cần nguyên nhân; \"What can be done…?\" cần giải pháp. Nêu rõ ai nên làm gì (the government, schools, parents) và kết quả mong đợi.\nDùng lại các cấu trúc nguyên nhân và kết quả đã học: one of the main causes is, this can lead to, as a result.\n~One of the main causes is … = Một trong những nguyên nhân chính là …\n~This can lead to … = Điều này có thể dẫn đến …\n~One possible solution would be … = Một giải pháp khả thi là …\n~Prevention is cheaper than punishment. = Phòng ngừa rẻ hơn trừng phạt.\nQ:Why do some young people commit crimes?\nA:I think one of the main causes is a lack of opportunities. If teenagers leave school early and can't find work, they have a lot of free time and no money. This can lead to stealing or joining gangs. Peer pressure is another reason, because young people want to be accepted by their friends.\nQ:Is prison the best way to reduce crime?\nA:For violent crimes, yes, because society needs to be protected. But for minor crimes, I don't think so. People often learn worse habits in prison. One possible solution would be community work, where they repair something they damaged, so they understand the result of their actions.\nQ:What can schools do to prevent crime?\nA:Schools can do a lot. They should teach practical skills so that weaker students still have a future. They could also keep sports clubs open in the evening, so teenagers have a safe place to go. In my opinion, prevention is cheaper than punishment.\n?Chọn câu đúng.|Unemployment can lead to crime.|Unemployment can lead crime.|Unemployment can leads to crime.|Unemployment can lead to commit crime.\n?Câu trả lời Part 3 nên nói chủ yếu về ai?|con người và xã hội nói chung|chỉ bản thân bạn|giám khảo|một người nổi tiếng\n##17|2+3|Part 2 nối sang Part 3: du lịch và văn hoá\nSau khi bạn nói xong Part 2, giám khảo có thể hỏi một câu ngắn rồi chuyển sang Part 3 với các câu hỏi rộng hơn về cùng chủ đề. Hãy chuyển từ \"tôi\" sang \"mọi người\": từ chuyến đi của bạn sang tác động của du lịch.\nQuá khứ hoàn thành (had + V3) dùng cho việc xảy ra trước một mốc quá khứ: \"It was the first time I had travelled alone\".\n~It was the first time I had … = Đó là lần đầu tôi …\n~What struck me most was … = Điều gây ấn tượng với tôi nhất là …\n~I'd definitely recommend it to … = Tôi chắc chắn sẽ giới thiệu nó cho …\n~Tourism has both positive and negative effects. = Du lịch có cả tác động tích cực lẫn tiêu cực.\nC:Describe a trip you enjoyed.|where you went|who you went with|what you did there|and explain why you enjoyed it\nA:I'd like to tell you about a trip to Hoi An, which I took with two close friends last spring. It was the first time I had travelled without my family, so I was really excited. We stayed there for three days in a small guesthouse near the old town. During the day we rented bicycles and rode to the beach and through the rice fields. In the evening we walked around the old streets, which were full of colourful lanterns, and tried the local food. I still remember a noodle dish called cao lau, which you can only find there. On the last day we joined a cooking class, where a local woman showed us how to make spring rolls. Mine looked terrible, but they tasted good. What struck me most was how well the town has preserved its heritage. There are no high-rise buildings and no cars in the centre. I enjoyed the trip because it was relaxing and I learned a lot about traditional culture. I'd definitely recommend it to anyone who visits Vietnam.\nQ:What are the effects of tourism on local people?\nA:Tourism has both positive and negative effects. On the positive side, it creates jobs in hotels and restaurants and brings money to the area. On the negative side, prices go up, so local people may not be able to afford housing. Popular places can also become overcrowded and lose their traditional character.\nQ:Why do people like to visit historical places?\nA:I think people are curious about how others lived in the past. Old buildings also make a place different from anywhere else, whereas modern cities often look the same. For example, tourists come to my country to see old temples, not shopping centres.\n?\"What struck me most was…\" nghĩa là|điều gây ấn tượng với tôi nhất là…|điều làm tôi bị thương là…|điều tôi ghét nhất là…|điều tôi đã quên mất là…\n?Sau Part 2, giám khảo thường làm gì?|chuyển sang Part 3 với câu hỏi rộng hơn về cùng chủ đề|kết thúc bài thi|yêu cầu nói lại Part 2|thông báo điểm ngay\n##18|3|Part 3: đánh giá và trả lời cân bằng\nỞ band 6, bạn cần cho thấy mình cân nhắc được hai mặt của vấn đề. Mẫu an toàn: nêu mặt thứ nhất, nêu mặt thứ hai bằng However hoặc But, rồi chốt bạn nghiêng về phía nào.\nCác cụm To some extent, There are two sides to this, It's hard to say giúp mở đầu loại câu trả lời này.\n~There are two sides to this. = Chuyện này có hai mặt.\n~To some extent, yes. = Ở một mức độ nào đó thì đúng.\n~It's hard to say, but I'd choose … = Khó nói, nhưng tôi sẽ chọn …\n~The benefits outweigh the costs. = Lợi ích lớn hơn chi phí.\nQ:Who should take care of elderly people: the family or the government?\nA:There are two sides to this. Traditionally, in my country the family takes care of old people, and I think that is still the best option emotionally. However, many adult children now work long hours in other cities. So the government should provide support, such as nurses who visit elderly people at home.\nQ:Do you think people today are healthier than in the past?\nA:To some extent, yes. Thanks to vaccines and better healthcare, people live much longer. But lifestyles are worse in some ways. People sit all day, eat more processed food and feel more stress. So we live longer, but I'm not sure we are fitter.\nQ:Should governments spend more on preventing illness or on treating it?\nA:It's hard to say, but I'd choose prevention. Teaching people to eat well and exercise is much cheaper than surgery. Of course, hospitals are still necessary, but in the long term the benefits of prevention outweigh the costs.\n?\"To some extent, yes\" nghĩa là|đồng ý một phần|hoàn toàn đồng ý|hoàn toàn phản đối|không hiểu câu hỏi\n?Thế nào là một câu trả lời cân bằng?|nêu cả hai mặt rồi cho biết bạn nghiêng về phía nào|không nêu ý kiến gì|chỉ nói một mặt|chuyển sang chủ đề khác\n##19|1+2+3|Thi thử trọn bài Speaking\nLàm trọn ba phần trong 11–14 phút như thi thật. Hãy ghi âm cả bài bằng điện thoại, sau đó nghe lại và tự chấm theo bốn tiêu chí.\nKhi nghe lại, đếm ba thứ: số lần ngập ngừng quá ba giây, số câu sai thì, và số lần lặp cùng một từ (good, like, very). Đó là ba thứ cần giảm để lên band 6.\n~Mostly … these days. = Dạo này chủ yếu là …\n~It was good value for money. = Nó đáng đồng tiền.\n~I'd say a balance is best. = Tôi cho rằng cân bằng là tốt nhất.\nQ:Do you enjoy shopping?\nA:Yes, but only for certain things. I love buying books and food, but I find shopping for clothes quite boring.\nQ:Do you prefer shopping online or in shops?\nA:Mostly online these days, because it saves time and it's easy to compare prices. For shoes, though, I still go to a shop to try them on.\nQ:Are you good at saving money?\nA:Not really, to be honest. I try to save about ten per cent of my salary, but there's always some unexpected expense.\nC:Describe something you bought that you were pleased with.|what it was|where you bought it|how much it cost|and explain why you were pleased with it\nA:I'd like to talk about a pair of running shoes that I bought about six months ago. I'd wanted to take up running for a long time, but my old shoes hurt my feet. So one weekend I went to a sports shop in a shopping centre near my office. The shop assistant was really helpful. He asked me to run on a machine for a minute and then suggested three pairs. The pair I chose cost about two million dong, which is roughly eighty dollars. That was a lot for me, because I normally spend less than half of that on shoes. I thought about it for twenty minutes before I paid. I'm pleased with them for a few reasons. They're light and comfortable, so I no longer have any pain. Because they were expensive, I also felt I had to use them, so I've been running three times a week ever since. In fact, I've lost four kilos. So although the price was high, I think it was good value for money.\nQ:Why do people buy things they don't need?\nA:I think advertising is the main reason. Companies are very good at making us feel that a new product will improve our lives. Social media makes it worse, because we see what other people have and we want the same. Also, buying is so easy now that people don't stop to think.\nQ:Is it better to save money or to spend it?\nA:I'd say a balance is best. Saving is important for emergencies and for big goals like buying a house. But if people never spend, they can't enjoy life, and the economy suffers too. So I think people should save first and then spend what is left.\n?Bài thi Speaking thật kéo dài bao lâu?|11 đến 14 phút|khoảng 5 phút|30 phút|1 giờ\n?\"Good value for money\" nghĩa là|đáng đồng tiền bỏ ra|rất rẻ|rất đắt|đang được giảm giá\n##20|2|Phát âm và độ trôi chảy\nPronunciation chiếm 25% điểm Speaking. Bạn không cần giọng Anh hay giọng Mỹ; bạn cần nói rõ để người nghe hiểu mà không phải cố. Với người Việt, ba thứ cải thiện điểm nhanh nhất là: phát âm đủ âm cuối (s, t, k, d, ed), nhấn đúng trọng âm từ, và ngắt nghỉ theo cụm ý chứ không ngắt từng từ.\nLuyện bằng cách đọc đuổi (shadowing) các câu dưới đây: bấm loa, nói theo ngay sau giọng đọc, bắt chước cả nhịp lẫn chỗ nhấn. Sau đó làm một bài Part 2 và ghi âm lại.\n~Last week I worked late, watched a film and walked home. = Âm cuối -ed đọc là /t/: worked, watched, walked\n~She likes books about science and art. = Đủ âm cuối: likes, books, about, art\n~I'd like to apply for a master's course abroad. = Nối âm: like‿to, apply‿for‿a\n~Education is important for economic development. = Trọng âm: eduCAtion, imPORtant, ecoNOmic, deVElopment\nC:Describe a goal you would like to achieve in the future.|what the goal is|when you hope to achieve it|what you need to do to achieve it|and explain why this goal is important to you\nA:I'd like to talk about a goal that I'm working on right now, which is to get band six in the IELTS test. I hope to achieve it by the end of this year. I've given myself about six months, because I started from quite a low level. To reach this goal, I need to do three things. First, I study for about two hours every day, following a plan. Second, I practise speaking by recording myself and listening to my mistakes, which is uncomfortable but useful. Third, in the last month I'm going to do a full practice test every week, so that I get used to the time pressure. This goal is important to me because it will open many doors. With band six, I can apply for a master's course abroad, and I'll also have a better chance of promotion at work. But it's not only about the certificate. I want to prove to myself that I can finish something difficult. When I get the result, I think I'll be really proud.\n?Người Việt hay mắc lỗi phát âm nào nhất khi nói tiếng Anh?|bỏ mất âm cuối như s, t, k, ed|nói quá chậm|nhấn quá nhiều từ|đặt quá nhiều câu hỏi\n?Để đạt band 6 Pronunciation, bạn cần gì?|nói rõ, dễ hiểu, dù vẫn còn giọng Việt|giọng chuẩn như người bản xứ|nói thật nhanh|không được ngập ngừng lần nào\n"};
</script>
<script>
'use strict';
let RNG=Math.random;
const $=s=>document.querySelector(s);
const rnd=n=>Math.floor(RNG()*n);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const uniq=a=>[...new Set(a)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lines=s=>s.split('\n').map(x=>x.trim()).filter(Boolean);

/* ================= Dữ liệu ================= */
const V={},G={},LI={},RD={},WR={},SP={},W={},GEX={},WL=[];
function parseItem(ln,ctx,out){
  const c=ln[0];
  if(c==='&'){ctx.opts=ln.slice(1).split('|').map(x=>{const i=x.indexOf(' ');return i<0?{k:x,t:''}:{k:x.slice(0,i),t:x.slice(i+1)}});return true}
  if(!'?_=:'.includes(c))return false;
  let exp='';const j=ln.indexOf(' >> ');if(j>0){exp=ln.slice(j+4);ln=ln.slice(0,j)}
  const p=ln.slice(1).split('|');
  if(c==='?')out.push({t:'mc',q:p[0],opts:p.slice(1),exp});
  else if(c==='_')out.push({t:'gap',q:p[0],ans:p[1].split('/'),exp});
  else if(c==='=')out.push({t:'tf',ans:p[0],q:p[1],yn:!!ctx.yn,exp});
  else out.push({t:'sel',q:p[0],ans:p[1],opts:ctx.opts,exp});
  return true;
}
const phrase=r=>{const j=r.lastIndexOf(' = ');return {en:r.slice(0,j),vi:r.slice(j+3)}};
(function load(){
  let cur,pt,ctx,w,last='';
  for(const ln of lines(RAW.v)){
    if(ln[0]==='#'){const p=ln.slice(1).split('|');w=+p[0];cur=V[w]={w,theme:p[1],items:[],sets:{a:{t:p[1],items:[]}}};continue}
    const [a,m,ex]=ln.split('|'),o={w:a,m,ex,W:w,S:'a',key:'w:'+a};W[a]=o;cur.items.push(o);cur.sets.a.items.push(o);WL.push(o);
  }
  let st='b';
  for(const ln of lines(RAW.v2)){
    if(ln[0]==='#'){const m=ln.match(/^#(\d+)([bc])\|(.*)$/);w=+m[1];st=m[2];V[w].sets[st]={t:m[3],items:[]};continue}
    const [a,m,ex]=ln.split('|');if(W[a])continue;const o={w:a,m,ex,W:w,S:st,key:'w:'+a};W[a]=o;V[w].items.push(o);V[w].sets[st].items.push(o);WL.push(o);
  }
  for(const ln of lines(RAW.g)){
    if(ln.startsWith('##')){w=+ln.slice(2);G[w]=[];continue}
    const c=ln[0];
    if(c==='@'){const [t,m,s]=ln.slice(1).split('|');pt={t,m,s,ex:'',tip:'',x:[]};G[w].push(pt);continue}
    if(c==='!'){pt.tip=ln.slice(1);continue}
    if(c==='>'||c==='+'){const j=ln.lastIndexOf('=');let opts=null;
      const raw=ln.slice(1,j).replace(/【([^】]+)】/,(_,s)=>{opts=s.split('|');return '\u0001'});
      const e={raw,opts,vi:ln.slice(j+1),g:pt,W:w,fresh:c==='+',key:`g:${w}:${G[w].length-1}:${pt.x.length}`};pt.x.push(e);GEX[e.key]=e;continue}
    pt.ex+=(pt.ex?' ':'')+ln;
  }
  for(const ln of lines(RAW.l)){
    if(ln.startsWith('##')){const p=ln.slice(2).split('|');w=+p[0];ctx={};cur=LI[w]={w,part:p[1],type:p[2],title:p[3],tips:[],instr:'',lines:[],vis:[],items:[]};continue}
    const c=ln[0];
    if(c==='!')cur.tips.push(ln.slice(1));else if(c==='^')cur.instr=ln.slice(1);else if(c==='@')cur.vis.push(ln.slice(1));
    else if(/^[ABN]:/.test(ln))cur.lines.push({s:c,t:ln.slice(2)});
    else parseItem(ln,ctx,cur.items);
  }
  for(const ln of lines(RAW.r)){
    if(ln.startsWith('##')){const p=ln.slice(2).split('|');w=+p[0];ctx={};cur=RD[w]={w,type:p[1],title:p[2],tips:[],instr:'',pt:'',paras:[],items:[]};continue}
    const c=ln[0];
    if(ln==='#yn')ctx.yn=true;else if(c==='!')cur.tips.push(ln.slice(1));else if(c==='^')cur.instr=ln.slice(1);else if(ln.startsWith('T:'))cur.pt=ln.slice(2);
    else if(!parseItem(ln,ctx,cur.items)){const m=ln.match(/^\[([A-Z])\] (.*)$/);cur.paras.push(m?{k:m[1],t:m[2]}:{k:'',t:ln})}
  }
  for(const ln of lines(RAW.w)){
    if(ln.startsWith('##')){const p=ln.slice(2).split('|');w=+p[0];cur=WR[w]={w,tag:p[1],title:p[2],ex:[],phr:[],vis:[],prompts:[],model:[],qs:[]};continue}
    const c=ln[0],r=ln.slice(1);
    if(c==='~')cur.phr.push(phrase(r));else if(c==='@')cur.vis.push(r);
    else if(c==='%'){const p=r.split('|');cur.prompts.push({text:p[0],min:+p[1],mins:+p[2],type:p[3]})}
    else if(c==='$')cur.model.push(r);
    else if(c==='?'){const p=r.split('|');cur.qs.push({q:p[0],opts:p.slice(1)})}
    else cur.ex.push(ln);
  }
  for(const ln of lines(RAW.s)){
    if(ln.startsWith('##')){const p=ln.slice(2).split('|');w=+p[0];cur=SP[w]={w,part:p[1],title:p[2],ex:[],phr:[],qa:[],cue:null,cueA:'',qs:[]};last='';continue}
    const c=ln[0],r=ln.slice(1);
    if(c==='~')cur.phr.push(phrase(r));
    else if(ln.startsWith('Q:')){cur.qa.push({q:ln.slice(2),a:'',p3:!!cur.cue||cur.part==='3'});last='Q'}
    else if(ln.startsWith('C:')){const p=ln.slice(2).split('|');cur.cue={title:p[0],pts:p.slice(1)};last='C'}
    else if(ln.startsWith('A:')){if(last==='C')cur.cueA=ln.slice(2);else cur.qa[cur.qa.length-1].a=ln.slice(2)}
    else if(c==='?'){const p=r.split('|');cur.qs.push({q:p[0],opts:p.slice(1)})}
    else cur.ex.push(ln);
  }
})();

/* ================= Lộ trình ================= */
const PH=[
 {id:'p1',name:'Nền móng',w:6,a:3,b:4,desc:'Xây lại câu, thì cơ bản và vốn từ thiết yếu. Listening tập trung vào Part 1 (đánh vần, số, ngày giờ), Reading học quét và lướt, Writing đi từ câu đến đoạn, Speaking luyện Part 1.'},
 {id:'p2',name:'Dạng bài',w:7,a:4,b:5,desc:'Học lần lượt từng dạng câu hỏi của đề thật ở Listening và Reading. Writing bắt đầu Task 1 hoàn chỉnh và các khối của Task 2; Speaking thêm Part 2 và Part 3.'},
 {id:'p3',name:'Tăng tốc',w:7,a:5,b:6,desc:'Các dạng khó hơn (Y/N/NG, matching headings có bẫy, Part 3 và Part 4), đủ bốn kiểu đề Task 2, câu phức và diễn đạt lại. Bắt đầu bấm giờ như thi thật.'},
 {id:'p4',name:'Luyện đề',w:4,a:6,b:6,desc:'Mỗi tuần một đề thật trọn vẹn trong sách Cambridge IELTS, một buổi Writing 60 phút, một buổi Speaking mô phỏng và một đề tổng hợp có tính giờ ngay trong trang. Xen kẽ là các buổi chữa đề.'}];
const TOTAL=168,TEACH=20,STUDY=144;
const TY=['vg','L','R','W','S','test','rest'],TY4=['real','fix','fw','fs','mix','rev','rest'];
const cache={};
function D(n){
  if(cache[n])return cache[n];
  const w=Math.ceil(n/7),dow=(n-1)%7;let acc=0,ph=PH[3],pw=0;
  for(const p of PH){if(w<=acc+p.w){ph=p;pw=acc;break}acc+=p.w}
  return cache[n]={n,w,dow,ph,pw,type:w<=TEACH?TY[dow]:TY4[dow],k:w>TEACH?w-TEACH:0};
}
const planBand=n=>{const d=D(n),p=d.ph;return p.a+(p.b-p.a)*Math.min(1,(n-1-d.pw*7)/(p.w*7))};
function secs(d){
  const r=d.n>1?['r']:[];
  switch(d.type){
    case 'vg':return [...r,'v','g','q'];case 'L':return [...r,'u','l','d'];case 'R':return [...r,'y','e','z'];
    case 'W':return [...r,'w','p'];case 'S':return [...r,'s','k'];
    case 'test':case 'fix':case 'rev':case 'mix':return ['q'];
    case 'real':return ['c'];case 'fw':return ['p'];case 'fs':return ['k'];default:return [];
  }
}
const SECN={u:'Từ vựng bổ sung 1',y:'Từ vựng bổ sung 2',r:'Ôn bài cũ',v:'Từ vựng',g:'Ngữ pháp',q:'Bài tổng kết',l:'Bài nghe',d:'Chép chính tả',e:'Bài đọc',z:'Chính tả từ vựng',w:'Bài tập viết',p:'Bài viết',s:'Bài tập nói',k:'Luyện nói',c:'Ghi điểm đề thật'};
const GLY={vg:'V',L:'L',R:'R',W:'W',S:'S',test:'T',rest:'·',real:'Đ',fix:'C',fw:'W',fs:'S',mix:'M',rev:'Ô'};
const TCL={vg:'tV',L:'tL',R:'tR',W:'tW',S:'tS',test:'tT',rest:'tN',real:'tD',fix:'tC',fw:'tW',fs:'tS',mix:'tM',rev:'tV'};
function dayLabel(d){
  const w=d.w;
  switch(d.type){
    case 'vg':return 'Từ vựng và ngữ pháp: '+V[w].theme;
    case 'L':return `Listening Part ${LI[w].part}: ${LI[w].title}`;
    case 'R':return 'Reading: '+RD[w].title;
    case 'W':return 'Writing: '+WR[w].title;
    case 'S':return 'Speaking: '+SP[w].title;
    case 'test':return 'Kiểm tra tuần '+w;
    case 'real':return 'Đề thật: Listening và Reading';
    case 'fix':return 'Chữa đề và luyện sổ lỗi';
    case 'fw':return 'Writing đủ 60 phút';
    case 'fs':return 'Speaking mô phỏng đủ ba phần';
    case 'mix':return 'Đề tổng hợp có tính giờ';
    case 'rev':return 'Tổng ôn từ vựng và ngữ pháp';
    default:return 'Nghỉ hoặc học bù';
  }
}
const weekTitle=w=>w<=TEACH?V[w].theme:'Luyện đề, vòng '+(w-TEACH);

/* Tiện ích ngày tháng */
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return d};
const diff=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const fmt=d=>`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;
const fmtY=d=>`${fmt(d)}/${d.getFullYear()}`;
const today=()=>iso(new Date());

      ...gramOf([w],true).map(qGram),...shuf(gramOf([w],false)).slice(0,3).map(qGram),...shuf(gramOf(old)).slice(0,2).map(qGram),
      ...shuf(dictPool(w)).slice(0,2).map((s,i)=>i?qDict(s):qDictGap(s)),...WR[w].qs.slice(0,2).map(x=>qMC(x,'Writing')),...SP[w].qs.slice(0,1).map(x=>qMC(x,'Speaking'))];
    if(w>1)qs.push(Object.assign(setL(w-1,true),{tag:`Nghe lại bài tuần trước, Part ${LI[w-1].part}`}));
  }else{
    const all=Array.from({length:TEACH},(_,i)=>i+1),wr=shuf(Object.keys(ST.wrong)).slice(0,8).map(qFromKey).filter(Boolean);
    qs=[...wr,...shuf(WL).slice(0,12).map(x=>qWord(x)),...shuf(gramOf(all)).slice(0,10).map(qGram),...shuf(all.flatMap(dictPool)).slice(0,3).map((s,i)=>i?qDictGap(s):qDict(s))];
  }
  return qs.filter(Boolean);
}

  $('#quiz').classList.add('on');drawW();
}
function wcShow(i){const o=OV,p=o.cfg.prompts[i],n=wcount(o.texts[i]),e=$('#wc'+i);if(e){e.textContent=`${n} từ (yêu cầu ít nhất ${p.min})`;e.className='wc'+(n>=p.min?' good':n?' low':'')}}
function wSave(){const o=OV;o.texts.forEach((t,i)=>{ST.drafts[o.cfg.id+':'+i]=t.slice(0,8000)});save()}
const checklist=items=>items.map(c=>`<label class="chk"><input type="checkbox" class="ck"> ${esc(c)}</label>`).join('');

  const o=OV,c=o.cfg;

  if(o.phase===0){
    h+=vis(c.vis);
    c.prompts.forEach((p,i)=>{h+=`<section class="wbox"><p class="qtag W">${p.type==='t1'?'Task 1':p.type==='t2'?'Task 2':'Bài viết'}: ít nhất ${p.min} từ, khoảng ${p.mins} phút</p><p class="lead${isVi(p.text)?'':' en'}">${esc(p.text)}</p>${vis(p.vis)}
      <textarea id="wt${i}" data-i="${i}" spellcheck="false" autocapitalize="sentences" placeholder="Viết bài của bạn ở đây">${esc(o.texts[i])}</textarea><p class="wc" id="wc${i}"></p></section>`});
    h+=`<div class="row"><button class="btn line" data-act="wstart" ${o.timer?'disabled':''}>${o.timer?'Đang tính giờ':'Bắt đầu tính giờ'}</button><button class="btn" data-act="wsubmit">Nộp bài và xem bài mẫu</button></div>
    <p class="mute">Bản nháp được lưu tự động. Thi thật có bộ đếm từ nhưng không có kiểm tra chính tả, nên ô viết ở đây cũng tắt tính năng đó.</p>`;
  }else{
    h+='<h3>Bài của bạn</h3>'+c.prompts.map((p,i)=>`<p class="mute">${c.prompts.length>1?(p.type==='t1'?'Task 1: ':'Task 2: '):''}${wcount(o.texts[i])} từ, yêu cầu ít nhất ${p.min}.</p><div class="yours en">${esc(o.texts[i])||'(chưa viết)'}</div>`).join('');
    if(c.model&&c.model.length)h+=`<h3 style="margin-top:22px">Bài mẫu và gợi ý</h3><div class="model">${c.model.map(m=>`<p class="${isVi(m)?'':'en'}">${esc(m)}</p>`).join('')}</div><p class="mute">Bài mẫu viết ở mức khoảng band 6 đến 6.5 để bạn thấy đích cần tới: ý rõ, có chia đoạn, câu không quá cầu kỳ. So bài của bạn với bài mẫu về bố cục trước, từ vựng sau.</p>`;
    else h+='<p class="info" style="margin-top:22px">Đề này không kèm bài mẫu. Hãy tự chấm theo bảng dưới, và nếu có thể, nhờ giáo viên hoặc người học cùng đọc giúp.</p>';
    if(AI)h+=`<h3 style="margin-top:22px">Nhận xét của Claude</h3><p class="mute">Claude đọc bài và ước lượng band theo bốn tiêu chí, chỉ ra lỗi quan trọng nhất và viết lại một đoạn. Đây là nhận xét tham khảo của AI, không phải điểm chính thức.</p><div class="row"><button class="btn line" data-act="aifb">Nhờ Claude nhận xét bài viết</button></div><div id="aifb" class="yours" hidden></div>`;
    h+=`<h3 style="margin-top:22px">Tự chấm</h3><p class="mute">Đánh dấu những điều bài của bạn đã làm được.</p>${checklist(uniq(c.prompts.flatMap(p=>CHK[p.type])))}
    <div class="row"><button class="btn" data-act="wdone">Lưu kết quả</button><button class="btn line" data-act="wback">Sửa lại bài</button></div>`;
  }
  $('#quiz').innerHTML=h+'</div>';
  if(o.phase===0)c.prompts.forEach((_,i)=>wcShow(i));else $('#quiz').scrollTop=0;

const ckPct=()=>{const a=[...document.querySelectorAll('#quiz .ck')];return a.length?Math.round(a.filter(x=>x.checked).length/a.length*100):100};

function spSteps(w){
  const s=SP[w],st=[];
  s.qa.filter(x=>!x.p3).forEach(x=>st.push({t:'q',part:1,q:x.q,a:x.a}));
  if(s.cue)st.push({t:'cue',cue:s.cue,a:s.cueA});
  s.qa.filter(x=>x.p3).forEach(x=>st.push({t:'q',part:3,q:x.q,a:x.a}));
  return st;
}
const cueHtml=c=>`<div class="cue en"><p><b>${esc(c.title)}</b></p><p>You should say:</p><ul>${c.pts.slice(0,-1).map(p=>`<li>${esc(p)}</li>`).join('')}</ul><p>${esc(c.pts[c.pts.length-1])}.</p></div>`;
const cueSay=c=>c.title+' You should say: '+c.pts.join(', ')+'.';
function openSpeak(cfg){tOn();stopAudio();OV={k:'s',cfg,i:0,sec:0,mode:'',timer:null};$('#quiz').classList.add('on');drawS(true)}
function sTick(){
  const o=OV,e=$('#sclock');if(!e)return;
  if(o.mode==='up')o.sec++;else{o.sec--;
    if(o.sec<=0){if(o.mode==='prep'){o.mode='talk';o.sec=120;toast('Hết 1 phút chuẩn bị. Bắt đầu nói.');const l=$('#slabel');if(l)l.textContent='Đang nói, tối đa 2 phút'}
      else{clearInterval(o.timer);o.timer=null;o.sec=0;toast('Hết 2 phút. Giám khảo sẽ ngắt bạn ở đây.')}}}
  e.textContent=clock(o.sec);
}
function drawS(auto){
  const o=OV,c=o.cfg,s=c.steps[o.i],N=c.steps.length;clearInterval(o.timer);o.timer=null;o.sec=0;o.mode='';
  let h=`<div class="qwrap"><header class="qhead"><button class="x" data-act="ovclose" aria-label="Thoát">×</button><b>${esc(c.title)}</b><span>${Math.min(o.i+1,N)}/${N}</span></header><div class="qbar"><i style="width:${o.i/N*100}%"></i></div>`;
  if(!s){
    h+=`<h3 style="margin-top:22px">Tự chấm</h3><p class="mute">Đánh dấu những điều bạn đã làm được trong buổi nói này.</p>${checklist(CHK.k)}<div class="row"><button class="btn" data-act="sdone">Lưu kết quả</button></div>`;
  }else if(s.t==='q'){
    h+=`<p class="qtag S">Part ${s.part}</p><div class="row"><button class="btn line" data-act="sask">${SPK}<span> Nghe giám khảo hỏi</span></button><button class="btn line sm" data-act="sshow" data-id="sq">Hiện chữ câu hỏi</button></div>
    <p class="qs en" id="sq" hidden>${esc(s.q)}</p><p class="mute">Trả lời thành tiếng, như đang ngồi trước giám khảo. ${s.part===1?'Part 1: hai đến ba câu, khoảng 15–25 giây.':'Part 3: bốn đến năm câu theo khung ý kiến, lý do, ví dụ; khoảng 30–50 giây.'}</p>
    <div class="clockbig" id="sclock">0:00</div>
    <div class="row"><button class="btn" data-act="sgo">Bắt đầu trả lời</button><button class="btn line" data-act="sshow" data-id="sa">${s.a?'Xem câu trả lời mẫu':'Xem gợi ý'}</button></div>
    <div id="sa" hidden>${s.a?`<div class="model"><p class="en">${esc(s.a)}</p></div><div class="row">${sayBtn(s.a)}<span class="mute">Nghe mẫu rồi nói lại câu trả lời của chính bạn một lần nữa.</span></div>`:'<p class="info">Câu này không có đáp án mẫu. Trả lời theo khung: ý kiến của bạn, một lý do, một ví dụ, rồi một câu về mặt ngược lại.</p>'}</div>
    <button class="btn wide" data-act="snext">${o.i+1<N?'Câu tiếp theo':'Sang phần tự chấm'}</button>`;
  }else{
    h+=`<p class="qtag S">Part 2</p>${cueHtml(s.cue)}<p class="mute" id="slabel">Bạn có 1 phút chuẩn bị (ghi từ khoá ra giấy), sau đó nói 1 đến 2 phút.</p>
    <div class="clockbig" id="sclock">1:00</div>
    <div class="row"><button class="btn" data-act="sprep">Bắt đầu 1 phút chuẩn bị</button><button class="btn line" data-act="stalk">Bỏ qua, nói luôn</button><button class="btn line" data-act="sshow" data-id="sa">${s.a?'Xem bài nói mẫu':'Xem gợi ý'}</button></div>
    <div id="sa" hidden>${s.a?`<div class="model"><p class="en">${esc(s.a)}</p></div><div class="row">${sayBtn(s.a)}<span class="mute">Bài mẫu dài khoảng 1 phút 45 giây ở tốc độ nói vừa phải.</span></div>`:'<p class="info">Đề này không có bài mẫu. Đi lần lượt theo bốn gợi ý trên thẻ, dành nhiều thời gian nhất cho ý cuối, và thêm ví dụ hoặc cảm xúc nếu còn thời gian.</p>'}</div>
    <button class="btn wide" data-act="snext">${o.i+1<N?'Câu tiếp theo':'Sang phần tự chấm'}</button>`;
  }
  $('#quiz').innerHTML=h+'</div>';$('#quiz').scrollTop=0;
  if(auto&&s&&s.t==='q')say(s.q);
}

function qOrder(sent,vi,key){
  const sol=sent.trim().split(/\s+/);if(sol.length<4||sol.length>12)return null;
  let ch=shuf(sol.map((_,i)=>i));if(ch.every((v,i)=>v===i))ch.reverse();
  return {kind:'order',tag:'Xếp câu',html:`Bấm các từ theo đúng thứ tự để thành một câu${vi?` có nghĩa: “${esc(vi)}”`:''}.`,sol,ch,vi,key};
}
const qOrderG=e=>/ = |—/.test(fullSent(e))?null:qOrder(fullSent(e),e.vi,e.key);
function qRW(e){

function vItems(items,text){
  const out=[];
  (Array.isArray(items)?items:[]).forEach(it=>{
    if(!it||typeof it.q!=='string'||!it.q.trim())return;const exp=typeof it.exp==='string'?it.exp:'';
    if(it.t==='mc'&&Array.isArray(it.opts)){const o=uniq(it.opts.map(x=>String(x).trim()).filter(Boolean)).slice(0,4);if(o.length>=3)out.push({t:'mc',q:it.q,opts:o,exp})}
    else if(it.t==='tf'&&['T','F','N'].includes(it.ans))out.push({t:'tf',q:it.q,ans:it.ans,yn:false,exp});
    else if(it.t==='gap'&&/_{2,}/.test(it.q)){const ans=(Array.isArray(it.ans)?it.ans:[it.ans]).map(x=>String(x==null?'':x).trim()).filter(Boolean);
      if(ans.length&&(!text||ans.some(a=>text.toLowerCase().includes(a.toLowerCase()))))out.push({t:'gap',q:it.q.replace(/_{2,}/,'＊').replace(/_{2,}/g,''),ans,exp})}
  });
  return out;
}
const ITEMJ='"items":[{"t":"tf","q":"statement","ans":"T","exp":""},{"t":"mc","q":"question","opts":["correct option","wrong","wrong","wrong"],"exp":""},{"t":"gap","q":"sentence with ___ for the missing word","ans":["answer"],"exp":""}]';
const ITEML='"items":[{"t":"gap","q":"note or sentence with ___ for the missing word","ans":["answer","variant"],"exp":""},{"t":"mc","q":"question","opts":["correct option","wrong","wrong"],"exp":""}]';
const RTYPES={mix:['Trộn ba dạng','2 True/False/Not Given statements, 2 multiple-choice questions and 2 sentence-completion gaps'],tf:['True / False / Not Given','6 True/False/Not Given statements, with at least one T, one F and two N'],mc:['Multiple choice','6 multiple-choice questions with four options'],gap:['Sentence completion','6 sentence-completion gaps']};
function instrFor(items,listen){
  const k=uniq(items.map(i=>i.t)),p=[];
  if(k.includes('tf'))p.push('Choose TRUE, FALSE or NOT GIVEN.');if(k.includes('mc'))p.push('Choose the correct answer.');
  if(k.includes('gap'))p.push(listen?'Write ONE WORD AND/OR A NUMBER for each gap.':'Write NO MORE THAN TWO WORDS from the passage for each gap.');
  return p.join(' ');
}

  if(!r)return;const paras=(Array.isArray(r.paras)?r.paras:[]).map(String).filter(x=>x.trim()),items=vItems(r.items,paras.join(' '));

}

const chkBtn=()=>{const z=QZ,a=z.ans[z.i]||[],q=z.qs[z.i];answer(a,a.length===q.sol.length&&a.map(c=>q.sol[c]).join(' ')===q.sol.join(' '))};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,z=QZ,S=(x,k)=>shuf(x).slice(0,k);
  if(a==='ordadd'){z.ans[z.i].push(+t.dataset.c);drawQ()}
  else if(a==='ordrm'){z.ans[z.i].splice(+t.dataset.k,1);drawQ()}
  else if(a==='ordcheck')chkBtn();
  else if(a==='dgcheck')dgCheck();
  else if(a==='hadd'){const v=+$('#xh').value;if(!(v>0)){toast('Hãy nhập số giờ.');return}ST.xh=(ST.xh||0)+Math.min(12,v);ST.act[today()]=1;save();render(true);toast('Đã ghi giờ tự học.')}
  else if(a==='aistop'){if(aiAbort)aiAbort.abort()}
  else if(a==='aifb')aiFeedback();
  else if(a==='pv'){const sel=$('#pv-w').value,m=t.dataset.m,sm=sel.match(/^(\d+)([abc])$/),ws=sel==='0'?scopeWeeks().flatMap(w=>V[w].items):sel==='my'?V.my.items:sm?V[+sm[1]].sets[sm[2]].items:V[+sel].items;
    const qs=S(ws,sm||sel==='my'?ws.length:20).map(x=>m==='f'?fW(x):qWord(x,m==='x'?null:m));startQuiz('Từ vựng: '+(sel==='0'?'trộn':sel==='my'?'từ của tôi':sm?V[+sm[1]].sets[sm[2]].t:V[+sel].theme),qs,{})}
  else if(a==='pg'){const w=+t.dataset.w,m=t.dataset.m,es=w?G[w][+t.dataset.p].x:S(gramOf(scopeWeeks()),m==='c'?15:30),f={c:qGram,o:qOrderG,rw:qRW,tr:qTrans}[m];
    startQuiz('Ngữ pháp: '+(w?G[w][+t.dataset.p].t:'trộn'),shuf(es).map(f).filter(Boolean).slice(0,15))}
  else if(a==='pl'){const w=+t.dataset.w;startQuiz(LI[w].title,[setL(w,t.dataset.m==='1')],{id:'L'+w})}
  else if(a==='pr'){const w=+t.dataset.w;startQuiz(RD[w].title,[setR(w)],{id:'R'+w})}
  else if(a==='pd'){const w=+t.dataset.w;DMODE=t.dataset.dm||$('#pd-m').value;if(w>0)startQuiz('Chép chính tả: '+LI[w].title,S(dictPool(w),8).map(mkD));
    else{const sel=+$('#pd-w').value,n=+$('#pd-n').value;startQuiz('Chép chính tả',S(sel?dictPool(sel):scopeWeeks().flatMap(dictPool),n).map(mkD))}}
  else if(a==='pw'){const x=wItems().find(i=>i.id===t.dataset.id);if(x)openWriter(x.cfg())}
  else if(a==='ps'){const x=sItems().find(i=>i.id===t.dataset.id);if(x)openSpeak(x.cfg())}
  else if(a==='pgen'){const g=(ST.gen||[]).find(x=>x.id===t.dataset.id);if(g)runGen(g)}
  else if(a==='pgendel'){ST.gen=(ST.gen||[]).filter(x=>x.id!==t.dataset.id);save();render(true)}
  else if(a==='air')genR($('#ai-rt').value,$('#ai-rtp').value);
  else if(a==='ail')genL(+$('#ai-lp').value);
  else if(a==='aiv')genV($('#ai-vt').value);
  else if(a==='ais')genS($('#ai-st').value);
});

    h+='</section>';
  }

function backupData(){
  try{
    const url=URL.createObjectURL(new Blob([JSON.stringify(ST)],{type:'application/json'}));
    const a=document.createElement('a');a.href=url;a.download='ielts-backup.json';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
    toast('Đã tải file sao lưu.');
  }catch(e){toast('Không thể tải sao lưu.')}
}
let lastHash=null;

  const [r,a]=(location.hash.slice(2)||'').split('/'),y=scrollY;
  const v=r==='plan'?plan():r==='day'?day(+a||todayN()):r==='prac'?pracV(a):r==='exam'?examV():r==='score'?scoreV():r==='wrong'?wrongV():r==='set'?setV():home();
  app.innerHTML=`<nav class="nav" aria-label="Điều hướng"><a class="brand" href="#/"><b>3.0 → 6.0</b><span>Lộ trình IELTS 24 tuần</span></a>${NAV.map(([h,t])=>`<a href="#/${h}" class="${(r||'')===h||(h==='plan'&&r==='day')||(h==='prac'&&r==='wrong')?'on':''}"><svg viewBox="0 0 24 24" aria-hidden="true">${IC[h]}</svg>${t}</a>`).join('')}</nav>
  <main>${LSX.ok||cloud?'':'<p class="note">Trình duyệt đang chặn lưu trữ ở chế độ xem này nên tiến độ sẽ mất khi đóng trang.</p>'}${v}</main>`;
  for(const k in UI){const el=document.getElementById(k);if(el&&[...el.options].some(o=>o.value===UI[k]))el.value=UI[k]}
  scrollTo(0,keep&&lastHash===location.hash?y:0);lastHash=location.hash;
}

let wT=null;
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,z=QZ,q=z&&z.qs&&z.qs[z.i],o=OV;
  if(a==='create'){const s=$('#o-start').value;if(!s){toast('Hãy chọn ngày bắt đầu.');return}ST.name=$('#o-name').value.trim()||'bạn';ST.start=s;save();location.hash='#/';render()}
  else if(a==='say'){e.stopPropagation();say(t.dataset.t)}
  else if(a==='reveal')t.classList.toggle('show');
  else if(a==='veil')t.closest('.sec').querySelectorAll('.kwl').forEach(x=>x.classList.toggle('veil'));
  else if(a==='quiz'){const n=+t.dataset.n,s=t.dataset.sec,d=D(n);if(t.dataset.dm)DMODE=t.dataset.dm;startQuiz(`Ngày ${n}: ${d.type==='test'?dayLabel(d):SECN[s]}`,buildSec(n,s),{done:p=>markDone(n,s,p)})}
  else if(a==='flashw')startQuiz('Thẻ từ vựng',shuf(V[+t.dataset.w].sets[t.dataset.s||'a'].items).map(fW));
  else if(a==='write'){const n=+t.dataset.n;openWriter(wrCfg(D(n).w,p=>markDone(n,'p',p)))}
  else if(a==='speak'){const n=+t.dataset.n,w=D(n).w;openSpeak({title:'Luyện nói: '+SP[w].title,steps:spSteps(w),done:p=>markDone(n,'k',p)})}
  else if(a==='xwrite'){const k=+t.dataset.k,n=+t.dataset.n;openWriter(xwCfg(k,p=>{ST.exams['w'+k]={d:today(),p};if(n)markDone(n,'p',p);else save()}))}
  else if(a==='xspeak'){const k=+t.dataset.k,n=+t.dataset.n;openSpeak(xsCfg(k,p=>{ST.exams['s'+k]={d:today(),p};if(n)markDone(n,'k',p);else save()}))}
  else if(a==='mix'){const n=+t.dataset.n;startMix(+t.dataset.k,n?p=>markDone(n,'q',p):null)}
  else if(a==='exgo'){const ex=EXS,pt=ex.parts[ex.i];startQuiz(`Đề tổng hợp ${ex.k}: ${pt.title}`,pt.qs,{exam:true,limit:pt.min*60,chain:zz=>{ex.done.push(zz);QZ=null;if(++ex.i<2)examIntro();else examResult()}})}
  else if(a==='wquiz')startQuiz('Luyện lại sổ lỗi',shuf(Object.keys(ST.wrong)).slice(0,20).map(qFromKey));
  else if(a==='qplay')playQ();
  else if(a==='peek'){$('#peek').innerHTML=`<details class="dat" open><summary>Lời thoại</summary>${scriptHtml(q.script)}</details>`;t.remove()}
  else if(a==='pick'){if(!z.shown)answer(+t.dataset.i,+t.dataset.i===q.a)}
  else if(a==='isel'){if(z.shown)return;const st=z.ans[z.i]||(z.ans[z.i]={});st[+t.dataset.j]=+t.dataset.i;t.parentNode.querySelectorAll('.io').forEach(b=>b.classList.toggle('sel',b===t));
    if(q.items.length===1&&!z.opt.exam)checkSet()}
  else if(a==='scheck')checkSet();
  else if(a==='dcheck'){const v=$('#din').value;answer(v,dictOk(q,v))}
  else if(a==='flip'){z.flip=true;drawQ();if(q.say)say(q.say)}
  else if(a==='fyes'||a==='fno'){z.res[z.i]={c:a==='fyes'?1:0,n:1};nextQ()}
  else if(a==='qnext')nextQ();
  else if(a==='qclose'){if((EXS||(z&&!z.fin&&z.res&&z.res.length))&&!confirm('Thoát bài đang làm? Kết quả sẽ không được lưu.'))return;closeQuiz()}
  else if(a==='ovclose'){if(o&&o.k==='w')wSave();closeQuiz()}
  else if(a==='wstart'){if(o.timer)return;t.disabled=true;t.textContent='Đang tính giờ';o.timer=setInterval(()=>{o.left--;const el=$('#wtime');if(el)el.textContent=clock(o.left);if(o.left===0)toast('Hết giờ. Trong bài thi thật bạn phải dừng viết ở đây.')},1000)}
  else if(a==='wsubmit'){clearInterval(o.timer);o.timer=null;wSave();o.phase=1;drawW()}
  else if(a==='wback'){o.phase=0;drawW()}
  else if(a==='wdone'){const p=ckPct();if(o.cfg.done)o.cfg.done(p);ST.act[today()]=1;save();closeQuiz();toast('Đã lưu kết quả bài viết.')}
  else if(a==='sask'){const s=o.cfg.steps[o.i];say(s.q)}
  else if(a==='sshow'){const el=$('#'+t.dataset.id);if(el)el.hidden=!el.hidden}
  else if(a==='sgo'){clearInterval(o.timer);stopAudio();o.mode='up';o.sec=0;$('#sclock').textContent='0:00';o.timer=setInterval(sTick,1000)}
  else if(a==='sprep'||a==='stalk'){clearInterval(o.timer);stopAudio();o.mode=a==='sprep'?'prep':'talk';o.sec=a==='sprep'?60:120;$('#sclock').textContent=clock(o.sec);$('#slabel').textContent=a==='sprep'?'Đang chuẩn bị: ghi từ khoá cho từng gợi ý':'Đang nói, tối đa 2 phút';o.timer=setInterval(sTick,1000)}
  else if(a==='snext'){stopAudio();o.i++;drawS(true)}
  else if(a==='sdone'){const p=ckPct();if(o.cfg.done)o.cfg.done(p);ST.act[today()]=1;save();closeQuiz();toast('Đã lưu kết quả buổi nói.')}
  else if(a==='logadd'){
    const num=id=>{const v=$('#'+id).value;return v===''?null:Math.max(0,Math.min(40,Math.round(+v)))},bv=id=>{const v=$('#'+id).value;return v===''?null:+v};
    const L=num('lg-l'),R=num('lg-r'),Wb=bv('lg-w'),Sb=bv('lg-s'),n=+t.dataset.n;
    if([L,R,Wb,Sb].every(v=>v==null)){toast('Hãy nhập ít nhất một điểm.');return}
    if(n&&(L==null||R==null)){toast('Hãy nhập số câu đúng của cả Listening và Reading.');return}
    ST.logs.push({t:Date.now(),d:$('#lg-d').value||today(),name:$('#lg-name').value.trim(),L,R,W:Wb,S:Sb});
    if(n)markDone(n,'c',Math.round((L+R)/80*100));else{ST.act[today()]=1;save()}
    render(true);toast('Đã lưu điểm.')}
  else if(a==='logdel'){if(confirm('Xoá lần ghi điểm này?')){ST.logs=ST.logs.filter(l=>String(l.t)!==t.dataset.t);save();render(true)}}
  else if(a==='saveset'){const s=$('#s-start').value;if(!s){toast('Hãy chọn ngày bắt đầu.');return}ST.name=$('#s-name').value.trim()||ST.name;ST.start=s;save();render();toast('Đã lưu thay đổi.')}
  else if(a==='backup')backupData();
  else if(a==='restore'){$('#restore-file').click()}
  else if(a==='ttstest')speak([{t:'Good morning. Can I take your surname, please?',v:'f'},{t:'Yes, it is Hartley. H, A, R, T, L, E, Y.',v:'m'}]);
  else if(a==='reset'){if(confirm('Xoá toàn bộ tiến độ, sổ lỗi, điểm số và bài viết nháp?')){const keep={name:ST.name,start:ST.start,theme:ST.theme,rate:ST.rate};ST=Object.assign(blank(),keep);loadMy();save();render();toast('Đã xoá tiến độ.')}}
});
document.addEventListener('change',e=>{
  const t=e.target,a=t.dataset.act;
  if(a==='hide')t.closest('.sec').querySelector('.vlist').classList.toggle('hidden',t.checked);
  else if(a==='theme'){ST.theme=t.value;save();render(true)}
  else if(a==='rate'){ST.rate=+t.value;save()}
  else if(a==='scope'){ST.scope=t.value;save();render(true)}
  else if(a==='import'){
    const f=t.files&&t.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const obj=JSON.parse(rd.result);
        if(!obj||typeof obj!=='object'||Array.isArray(obj))throw 0;
        ST=Object.assign(blank(),obj);loadMy();save();render(true);
        toast('Đã khôi phục dữ liệu.');
      }catch(err){toast('File sao lưu không hợp lệ.')}
      t.value='';
    };
    rd.onerror=()=>{toast('Không đọc được file.');t.value=''};
    rd.readAsText(f);
  }
});
document.addEventListener('input',e=>{
  const t=e.target;if(!OV||OV.k!=='w'||t.tagName!=='TEXTAREA')return;
  const i=+t.dataset.i;OV.texts[i]=t.value;wcShow(i);clearTimeout(wT);wT=setTimeout(()=>{if(OV&&OV.k==='w')wSave()},2500);
});
document.addEventListener('keydown',e=>{
  const z=QZ;if(!z||z.fin||!z.qs)return;const q=z.qs[z.i],k=q.kind,tg=e.target.tagName;
  if(k==='mc'&&/^[1-4]$/.test(e.key)&&!z.shown&&+e.key<=q.opts.length)answer(+e.key-1,+e.key-1===q.a);
  else if(e.key==='Enter'&&tg!=='BUTTON'&&tg!=='TEXTAREA'&&tg!=='SELECT'){
    if(z.shown){e.preventDefault();nextQ()}
    else if(k==='dict'){e.preventDefault();const v=$('#din').value;answer(v,dictOk(q,v))}
    else if(k==='set'&&q.items.length===1&&q.items[0].t==='gap'){e.preventDefault();checkSet()}
  }
});
addEventListener('hashchange',()=>{if(!QZ&&!OV)render()});
render();initCloud();
