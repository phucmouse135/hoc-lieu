document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,p=P(),z=QZ,q=z&&z.qs&&z.qs[z.i];
  if(a==='create'){const s=$('#o-start').value;if(!s){toast('Hãy chọn ngày bắt đầu.');return}newProfile($('#o-name').value.trim()||'Bạn',s);location.hash='#/';render()}
  else if(a==='back'){DB.cur=Object.keys(DB.profiles)[0];render()}
  else if(a==='close')closeModal();
  else if(a==='askyes'){const f=ASK;closeModal();if(f)f()}
  else if(a==='reveal')t.classList.toggle('show');
  else if(a==='read'){markDone(+t.dataset.n,'l',100);render(true);toast('Đã đánh dấu đọc xong phần lý thuyết.')}
  else if(a==='quiz'){const n=+t.dataset.n,s=t.dataset.sec,d=D(n);startQuiz(`Ngày ${n}: ${d.type==='lesson'?SECN[s]:dayLabel(d)}`,buildSec(n,s),{done:pct=>markDone(n,s,pct)})}
  else if(a==='exam'){const n=+t.dataset.n;startExam(+t.dataset.no,n?pct=>markDone(n,'q',pct):null)}
  else if(a==='exgo')startExam.go();
  else if(a==='prac')practice(t.dataset.m);
  else if(a==='wquiz')startQuiz('Luyện lại sổ lỗi',dedupe(shuf(Object.keys(p.wrong)).slice(0,20).map(qFromKey)));
  else if(a==='pick'){if(z.shown||z.fin)return;const i=+t.dataset.i;
    if(q.kind==='multi'){const s=z.ans[z.i]||(z.ans[z.i]=[]),j=s.indexOf(i);
      if(j>=0)s.splice(j,1);else if(s.length<q.a.length)s.push(i);else{toast(`Câu này chỉ chọn ${q.a.length} đáp án. Bỏ chọn một đáp án trước.`);return}
      drawQ()}
    else if(z.opt.exam){z.ans[z.i]=z.ans[z.i]===i?null:i;drawQ()}
    else answer(i,i===q.a)}
  else if(a==='mcheck')answer(z.ans[z.i],grade(q,z.ans[z.i]));
  else if(a==='qprev'){if(z.i>0){z.i--;drawQ(true)}}
  else if(a==='qfwd'){if(z.i+1<z.qs.length){z.i++;drawQ(true)}}
  else if(a==='qgo'){z.i=+t.dataset.i;drawQ(true)}
  else if(a==='qflag'){z.flag[z.i]=!z.flag[z.i];drawQ()}
  else if(a==='qsubmit'){const miss=z.qs.filter((x,i)=>!answered(x,z.ans[i])).length;ask(miss?`Còn ${miss} câu chưa trả lời. Nộp bài luôn?`:'Nộp bài và xem kết quả?','Nộp bài',finishQuiz)}
  else if(a==='flip'){z.flip=true;drawQ()}
  else if(a==='fyes'||a==='fno'){z.res[z.i]=a==='fyes';nextQ()}
  else if(a==='qnext')nextQ();
  else if(a==='qclose'){if(z&&!z.fin&&(z.opt.exam||z.res.length))ask('Thoát bài đang làm? Kết quả sẽ không được lưu.','Thoát',closeQuiz);else closeQuiz()}
  else if(a==='saveset'){const s=$('#s-start').value;if(!s){toast('Hãy chọn ngày bắt đầu.');return}p.name=$('#s-name').value.trim()||p.name;p.start=s;save();render();toast('Đã lưu thay đổi.')}
  else if(a==='switch'){DB.cur=t.dataset.id;save();render();toast('Đã chuyển hồ sơ.')}
  else if(a==='addp'){DB.cur=null;render()}
  else if(a==='export')exportData();
  else if(a==='reset')ask('Xoá toàn bộ tiến độ và sổ lỗi của hồ sơ này?','Xoá tiến độ',()=>{p.done={};p.wrong={};p.act={};p.exams={};save();render();toast('Đã xoá tiến độ.')});
  else if(a==='delp')ask(`Xoá hồ sơ “${p.name}”?`,'Xoá hồ sơ',()=>{delete DB.profiles[p.id];DB.cur=Object.keys(DB.profiles)[0];save();render();toast('Đã xoá hồ sơ.')});
});
document.addEventListener('change',e=>{
  const t=e.target,a=t.dataset.act;
  if(a==='hide')t.closest('.sec').querySelector('.vlist').classList.toggle('hidden',t.checked);
  else if(a==='theme'){P().theme=t.value;save();render(true)}
  else if(a==='scope'){P().scope=t.value;save()}
  else if(t.id==='imp'&&t.files[0]){const f=new FileReader();f.onload=()=>{try{const d=JSON.parse(f.result);if(!d.profiles||!Object.keys(d.profiles).length)throw 0;DB=d;if(!P())DB.cur=Object.keys(DB.profiles)[0];save();render();toast('Đã khôi phục dữ liệu.')}catch(x){toast('Tệp không đúng định dạng sao lưu.')}};f.readAsText(t.files[0])}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#modal').classList.contains('on'))closeModal();return}
  const z=QZ;if(!z||z.fin||!z.qs||$('#modal').classList.contains('on'))return;const q=z.qs[z.i];
  if(q.kind==='flash'){if(e.key==='Enter'||e.key===' '){e.preventDefault();if(!z.flip){z.flip=true;drawQ()}}return}
  const k=e.key.toLowerCase(),i=/^[1-8]$/.test(k)?+k-1:/^[a-h]$/.test(k)&&!e.ctrlKey&&!e.metaKey&&!e.altKey?k.charCodeAt(0)-97:-1;
  if(i>=0&&i<q.opts.length&&!z.shown){const b=document.querySelector(`#quiz .opt[data-i="${i}"]`);if(b)b.click()}
  else if(e.key==='Enter'){e.preventDefault();
    if(z.opt.exam){if(z.i+1<z.qs.length){z.i++;drawQ(true)}}
    else if(z.shown)nextQ();
    else if(q.kind==='multi'&&z.ans[z.i]&&z.ans[z.i].length===q.a.length)answer(z.ans[z.i],grade(q,z.ans[z.i]))}
});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
addEventListener('hashchange',()=>{if(!QZ)render()});
if(!P()&&Object.keys(DB.profiles).length)DB.cur=Object.keys(DB.profiles)[0];
render();
