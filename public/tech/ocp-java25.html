~Ba họ collection đầu tiên: danh sách có thứ tự, tập không trùng, và hàng đợi hai đầu. Phần lớn câu hỏi xoay quanh phương thức nào ném ngoại lệ và phương thức nào trả null.
@List và các bản không sửa được|ArrayList thay đổi tự do; List.of bất biến; Arrays.asList cố định kích thước.
`List` giữ thứ tự chèn, cho phép trùng, truy cập theo chỉ số. `ArrayList` là lựa chọn thông thường; `LinkedList` vừa là List vừa là Deque.
`List.of(...)` và `List.copyOf(...)` tạo danh sách bất biến: `add`, `set`, `remove` đều ném `UnsupportedOperationException`, và không chứa được `null`. `Arrays.asList(mảng)` tạo danh sách kích thước cố định bọc ngoài mảng: `set` được (và sửa luôn mảng gốc), nhưng `add` và `remove` ném `UnsupportedOperationException`.
```
List<String> a = Arrays.asList("x", "y");
a.set(0, "z");        // hợp lệ
a.add("w");           // ném UnsupportedOperationException

List<String> b = List.of("x", "y");
b.set(0, "z");        // ném UnsupportedOperationException
List.of(1, null);     // ném NullPointerException
```
@Bẫy remove trên List số nguyên|remove(int) xoá theo vị trí; remove(Object) xoá theo giá trị.
`List` có hai phương thức `remove` nạp chồng. Truyền một `int` thì Java chọn bản nhận chỉ số, vì khớp chính xác được ưu tiên hơn đóng hộp. Muốn xoá theo giá trị, truyền một `Integer`.
Các phương thức tiện ích khác: `removeIf(predicate)`, `replaceAll(operator)`, `add(index, e)`, `set(index, e)`, `indexOf`, `contains`.
```
List<Integer> list = new ArrayList<>(List.of(3, 1, 2, 1));
list.remove(1);                     // xoá phần tử ở vị trí 1: [3, 2, 1]
list.remove(Integer.valueOf(1));    // xoá giá trị 1 đầu tiên: [3, 2]
```
@Set|Set không chứa phần tử trùng; add trả false khi phần tử đã có.
`HashSet` không bảo đảm thứ tự. `LinkedHashSet` giữ thứ tự chèn. `TreeSet` luôn sắp xếp theo thứ tự tự nhiên hoặc theo Comparator được cung cấp, và không nhận `null`. Với String, thứ tự tự nhiên xếp chữ hoa trước chữ thường.
```
Set<String> set = new TreeSet<>();
set.add("pear");      // true
set.add("apple");     // true
set.add("pear");      // false: đã có
set.add("Fig");
// set = [Fig, apple, pear]
```
@Queue và Deque|Mỗi thao tác có hai phiên bản: một bản ném ngoại lệ, một bản trả giá trị đặc biệt.
Với `Queue`: thêm bằng `add` hoặc `offer`; lấy ra bằng `remove` (ném `NoSuchElementException` khi rỗng) hoặc `poll` (trả `null`); xem đầu hàng bằng `element` (ném ngoại lệ) hoặc `peek` (trả `null`).
`Deque` thao tác được ở cả hai đầu: `offerFirst`, `offerLast`, `pollFirst`, `pollLast`, `peekFirst`, `peekLast`. Dùng như ngăn xếp thì `push` thêm vào đầu, `pop` lấy từ đầu, `peek` xem đầu. `ArrayDeque` không nhận `null`.
```
Deque<Integer> d = new ArrayDeque<>();
d.push(1);          // [1]
d.offer(2);         // [1, 2]: offer thêm vào cuối
d.push(3);          // [3, 1, 2]: push thêm vào đầu
d.pop();            // 3
d.pollLast();       // 2
```
=ArrayList|List thay đổi được, dựa trên mảng, truy cập theo chỉ số nhanh
=List.of|Tạo danh sách bất biến; không nhận null, mọi thao tác sửa đều ném ngoại lệ
=Arrays.asList|Danh sách kích thước cố định bọc ngoài mảng; set được, add và remove thì không
=UnsupportedOperationException|Ngoại lệ khi gọi thao tác sửa trên collection không hỗ trợ
=TreeSet|Set luôn được sắp xếp; không nhận null
=poll() và peek()|Lấy ra hoặc xem phần tử đầu hàng đợi; trả null khi rỗng
=remove() và element()|Lấy ra hoặc xem phần tử đầu hàng đợi; ném NoSuchElementException khi rỗng
=push() và pop()|Thêm vào và lấy ra ở đầu Deque, dùng Deque như ngăn xếp

##22
~Map lưu cặp khoá và giá trị, và có nhóm phương thức merge, compute rất hay bị hỏi. Phần sau là sequenced collection của Java 21: một bộ tên thống nhất cho phần tử đầu và cuối.
@Map cơ bản|put trả về giá trị cũ; get trả null khi không có khoá.
`HashMap` không bảo đảm thứ tự và nhận một khoá `null`. `LinkedHashMap` giữ thứ tự chèn. `TreeMap` sắp xếp theo khoá và không nhận khoá `null`. `Map.of(...)` tạo map bất biến; khoá trùng làm nó ném `IllegalArgumentException`.
`put` trả giá trị cũ của khoá (hoặc `null` nếu khoá mới). `getOrDefault(k, d)` trả d khi không có khoá. `putIfAbsent` chỉ ghi khi khoá chưa có. Duyệt bằng `keySet()`, `values()`, `entrySet()` hoặc `forEach((k, v) -> ...)`.
```
Map<String, Integer> m = new HashMap<>();
m.put("k", 1);              // trả null
m.put("k", 2);              // trả 1, giá trị mới là 2
m.getOrDefault("z", -1);    // -1
m.putIfAbsent("k", 9);      // không đổi gì
```
@merge và họ compute|merge gộp giá trị mới vào giá trị cũ; hàm trả null thì khoá bị xoá.
`merge(k, v, hàm)`: nếu khoá chưa có thì đặt giá trị v; nếu đã có thì đặt kết quả của hàm với giá trị cũ và v. Nếu hàm trả `null`, khoá bị xoá khỏi map.
`computeIfAbsent(k, hàm)` chỉ chạy hàm khi khoá chưa có. `computeIfPresent(k, hàm)` chỉ chạy khi khoá đã có. `compute(k, hàm)` luôn chạy, nhận giá trị cũ có thể là `null`.
```
Map<String, Integer> m = new TreeMap<>();
m.put("b", 1);
m.merge("b", 5, Integer::sum);       // b = 6
m.merge("a", 5, Integer::sum);       // a = 5: khoá mới, lấy thẳng giá trị
m.merge("b", 0, (x, y) -> null);     // b bị xoá
```
@SequencedCollection (Java 21)|Mọi collection có thứ tự xác định đều có chung getFirst, getLast, addFirst, addLast, removeFirst, removeLast và reversed.
`SequencedCollection` được hiện thực bởi `List`, `Deque`, `LinkedHashSet` và `TreeSet`. `HashSet` không có thứ tự nên không có các phương thức này.
`getFirst`, `getLast`, `removeFirst`, `removeLast` ném `NoSuchElementException` khi collection rỗng. `reversed()` trả về một khung nhìn đảo ngược, không phải bản sao: thay đổi ở danh sách gốc hiện ra ngay trong khung nhìn. Với `TreeSet`, vị trí do thứ tự sắp xếp quyết định, nên `addFirst` và `addLast` ném `UnsupportedOperationException`.
```
List<String> list = new ArrayList<>(List.of("b", "c"));
list.addFirst("a");            // [a, b, c]
list.getLast();                // c
list.reversed();               // [c, b, a]

new TreeSet<>(List.of(5, 1, 3)).getFirst();    // 1
new HashSet<>(List.of(1, 2)).getFirst();       // KHÔNG biên dịch
```
@SequencedMap (Java 21)|LinkedHashMap và TreeMap có firstEntry, lastEntry, pollFirstEntry, pollLastEntry, putFirst, putLast và reversed.
`firstEntry()` và `lastEntry()` trả về một entry, hoặc `null` nếu map rỗng. `pollFirstEntry()` và `pollLastEntry()` lấy ra và xoá. `putFirst` và `putLast` đặt cặp khoá giá trị vào đầu hoặc cuối. Ghi lại một khoá đã có bằng `put` thông thường thì chỉ đổi giá trị, vị trí giữ nguyên.
```
var m = new LinkedHashMap<String, Integer>();
m.put("b", 2);
m.put("a", 1);
m.putFirst("c", 3);       // {c=3, b=2, a=1}
m.put("b", 20);           // {c=3, b=20, a=1}: vị trí của b không đổi
m.pollLastEntry();        // a=1
```

=getOrDefault|Trả giá trị của khoá, hoặc giá trị mặc định nếu không có khoá

=computeIfAbsent|Chỉ tính và ghi giá trị khi khoá chưa có

##23
~Sắp xếp có hai con đường: lớp tự biết so sánh (Comparable), hoặc truyền luật so sánh từ ngoài vào (Comparator). Đề thi kiểm tra bạn phân biệt lỗi lúc biên dịch với lỗi lúc chạy.
@Comparable|compareTo trả số âm, 0 hoặc dương: âm nghĩa là đối tượng hiện tại đứng trước.
`Comparable<T>` nằm trong `java.lang`, có một phương thức `compareTo(T o)`. Nó định nghĩa thứ tự tự nhiên của lớp. Các lớp như `String`, `Integer`, `LocalDate` đã hiện thực sẵn. Nên giữ `compareTo` nhất quán với `equals`: trả 0 khi và chỉ khi hai đối tượng equals.
```
record Duck(String name, int weight) implements Comparable<Duck> {
    public int compareTo(Duck o) { return name.compareTo(o.name); }   // xếp theo tên
}
Integer.compare(3, 8);    // -1
"b".compareTo("a");       // 1
```
@Comparator|Comparator đứng ngoài lớp, có phương thức compare(a, b) và nhiều phương thức dựng sẵn.
`Comparator<T>` nằm trong `java.util`. Tạo nhanh bằng `Comparator.comparing(hàm lấy khoá)` hoặc bản nguyên thủy `comparingInt`. Nối tiêu chí phụ bằng `thenComparing`. `reversed()` đảo ngược toàn bộ comparator đứng trước nó trong chuỗi, kể cả các tiêu chí phụ. `Comparator.naturalOrder()` và `Comparator.reverseOrder()` dùng cho kiểu đã Comparable.
```
Comparator<Duck> byWeight = Comparator.comparingInt(Duck::weight);
Comparator<Duck> c = Comparator.comparing(Duck::weight).thenComparing(Duck::name).reversed();
// c: cân nặng giảm dần, cùng cân nặng thì tên giảm dần
```
!`a.thenComparing(b).reversed()` đảo cả a lẫn b. Muốn chỉ đảo b, viết `a.thenComparing(b.reversed())` hoặc `a.thenComparing(Comparator.reverseOrder())`.
@Sắp xếp List và các cấu trúc tự sắp xếp|Thiếu Comparable: Collections.sort báo lỗi lúc biên dịch, còn TreeSet báo lỗi lúc chạy.
`Collections.sort(list)` yêu cầu phần tử là Comparable, và trình biên dịch kiểm tra điều đó qua generic. `list.sort(comparator)` nhận một Comparator; truyền `null` thì dùng thứ tự tự nhiên.
`TreeSet` và `TreeMap` không ràng buộc kiểu lúc biên dịch. Nếu phần tử không Comparable và không có Comparator, lần `add` hoặc `put` đầu tiên ném `ClassCastException`.
```
record Cat(String name) { }

Collections.sort(new ArrayList<Cat>());          // KHÔNG biên dịch: Cat không Comparable
new TreeSet<Cat>().add(new Cat("Tom"));          // biên dịch được, ném ClassCastException
new TreeSet<Cat>(Comparator.comparing(Cat::name)).add(new Cat("Tom"));   // hợp lệ
```
@Tìm kiếm nhị phân trên List|Collections.binarySearch cần danh sách đã sắp xếp theo đúng thứ tự dùng để tìm.
Quy tắc giống `Arrays.binarySearch`: thấy thì trả chỉ số, không thấy thì trả `-(vị trí chèn) - 1`. Nếu danh sách được sắp bằng một Comparator, phải truyền chính Comparator đó làm tham số thứ ba. Tìm trên danh sách chưa sắp xếp cho kết quả không xác định.
```
List<Integer> nums = new ArrayList<>(List.of(8, 3, 5));
Collections.sort(nums);                   // [3, 5, 8]
Collections.binarySearch(nums, 5);        // 1
Collections.binarySearch(nums, 4);        // -2: lẽ ra chèn ở vị trí 1
```
=Comparable|Interface trong java.lang, định nghĩa thứ tự tự nhiên bằng compareTo(T)
=Comparator|Interface trong java.util, định nghĩa một thứ tự bên ngoài lớp bằng compare(T, T)
=thứ tự tự nhiên|Thứ tự do compareTo của chính lớp quy định
=Comparator.comparing|Tạo Comparator từ một hàm lấy khoá so sánh
=thenComparing|Thêm tiêu chí phụ, dùng khi tiêu chí trước cho kết quả bằng nhau
=reversed()|Đảo ngược toàn bộ Comparator đứng trước nó trong chuỗi lời gọi
=Comparator.reverseOrder()|Comparator ngược với thứ tự tự nhiên

~Generic cho phép viết một lớp hay phương thức dùng được với nhiều kiểu mà vẫn được kiểm tra lúc biên dịch. Phần gây nhầm nhiều nhất là wildcard: khi nào đọc được, khi nào thêm được.
@Lớp và phương thức generic|Tham số kiểu của lớp đặt sau tên lớp; của phương thức đặt ngay trước kiểu trả về.
`class Box<T>` khai báo tham số kiểu T dùng trong cả lớp. Khi tạo đối tượng, toán tử kim cương `<>` để trình biên dịch tự suy kiểu. Phương thức generic khai báo tham số kiểu riêng, đặt trước kiểu trả về: `static <T> T first(List<T> list)`. Record và interface cũng generic được.
Giới hạn tham số kiểu bằng `extends`: `<T extends Comparable<T>>` chỉ nhận kiểu so sánh được.
```
record Pair<A, B>(A first, B second) {
    static <T> Pair<T, T> twin(T t) { return new Pair<>(t, t); }
}
static <T> T first(List<T> list) { return list.get(0); }        // hợp lệ
static T <T> last(List<T> list) { return list.get(0); }         // KHÔNG biên dịch: <T> đặt sai chỗ
```
@Xoá kiểu và những việc không làm được|Thông tin generic chỉ tồn tại lúc biên dịch; lúc chạy, List<String> và List<Integer> là cùng một lớp.
Trình biên dịch thay tham số kiểu bằng `Object` (hoặc bằng cận trên của nó) rồi tự chèn phép ép kiểu. Vì kiểu T không còn lúc chạy, bên trong `class Box<T>` không viết được `new T()`, `new T[3]`, hay khai báo trường `static T`. Đối số kiểu cũng không thể là kiểu nguyên thủy: phải viết `List<Integer>`, không phải `List<int>`.

```

List<?> d = new ArrayList<String>();          // hợp lệ
static void show(List<Object> list) { }       // không nhận được List<String>
static void any(List<?> list) { }             // nhận mọi List
```
@Wildcard có cận|extends để đọc ra; super để ghi vào.
`List<? extends Number>` là danh sách của một kiểu con nào đó của Number. Đọc ra được dưới dạng `Number`, nhưng không thêm được gì (trừ `null`) vì trình biên dịch không biết kiểu chính xác. `List<? super Integer>` là danh sách của Integer hoặc một kiểu cha của nó. Thêm `Integer` vào được, nhưng đọc ra chỉ được coi là `Object`. `List<?>` chỉ đọc ra `Object` và không thêm được gì.
```
List<? extends Number> up = new ArrayList<Integer>();
Number n = up.get(0);     // hợp lệ
up.add(3);                // KHÔNG biên dịch

List<? super Integer> low = new ArrayList<Number>();
low.add(5);               // hợp lệ

```

##25
~Stream là một dây chuyền xử lý dữ liệu: nguồn, các bước trung gian, và một bước kết thúc. Trước khi vào stream, bài này học Optional, kiểu mà nhiều bước kết thúc trả về.
@Optional|Optional là chiếc hộp có thể rỗng; lấy giá trị từ hộp rỗng bằng get() thì ném NoSuchElementException.
Tạo bằng `Optional.of(giá trị)` (truyền `null` thì ném `NullPointerException`), `Optional.ofNullable(giá trị)` hoặc `Optional.empty()`. Kiểm tra bằng `isPresent()` và `isEmpty()`. `ifPresent(consumer)` chỉ chạy khi có giá trị. `map` và `filter` biến đổi giá trị bên trong và trả về Optional mới.
Lấy giá trị kèm phương án dự phòng: `orElse(giá trị)`, `orElseGet(supplier)`, `orElseThrow()`. Đối số của `orElse` luôn được tính, kể cả khi Optional có giá trị; supplier của `orElseGet` chỉ chạy khi Optional rỗng.
```
Optional<String> a = Optional.of("x");
Optional<String> b = Optional.empty();
a.map(String::toUpperCase).orElse("none");   // X
b.map(String::toUpperCase).orElse("none");   // none
b.get();                                     // ném NoSuchElementException
```
@Nguồn stream và tính lười|Các bước trung gian chỉ được ghi nhận; không có bước kết thúc thì không có gì chạy.
Nguồn hữu hạn: `Stream.of(...)`, `Stream.empty()`, `collection.stream()`. Nguồn vô hạn: `Stream.generate(supplier)` và `Stream.iterate(khởi đầu, hàm)`. Bản ba tham số `Stream.iterate(khởi đầu, điều kiện, hàm)` dừng khi điều kiện sai.
Một stream chỉ dùng được một lần. Gọi bước kết thúc thứ hai trên cùng stream ném `IllegalStateException`.
```
Stream<String> s = Stream.of("a", "b", "c").filter(x -> !x.equals("b"));   // chưa chạy gì
long n = s.count();     // lúc này pipeline mới chạy: 2
s.count();              // ném IllegalStateException
```
@Các bước kết thúc|count, min, max, findFirst, findAny, các phép match, forEach, reduce và collect.
`count()` trả `long`. `min(comparator)` và `max(comparator)` bắt buộc có Comparator và trả `Optional`. `findFirst()` và `findAny()` trả `Optional`. `anyMatch`, `allMatch`, `noneMatch` trả `boolean` và dừng ngay khi biết kết quả. `forEach` trả `void`.
Trên stream vô hạn, `findFirst` và `anyMatch` có thể dừng được, nhưng `allMatch` hay `noneMatch` sẽ chạy mãi nếu không bao giờ gặp phần tử quyết định kết quả.
```
List<Integer> nums = List.of(3, 8, 5, 12);
nums.stream().anyMatch(n -> n > 10);                // true
nums.stream().allMatch(n -> n > 3);                 // false
nums.stream().min(Comparator.naturalOrder()).get(); // 3
```
@reduce|reduce gộp cả stream thành một giá trị; có giá trị khởi đầu thì trả thẳng kết quả, không có thì trả Optional.
`reduce(khởi đầu, hàm gộp)` trả về kiểu của phần tử; stream rỗng thì kết quả là giá trị khởi đầu. `reduce(hàm gộp)` trả `Optional`, rỗng khi stream rỗng. Bản ba tham số `reduce(khởi đầu, hàm tích luỹ, hàm kết hợp)` dùng khi kiểu kết quả khác kiểu phần tử.
```
Stream.iterate(1, x -> x * 2).limit(5).reduce(0, Integer::sum);   // 1+2+4+8+16 = 31
Stream.<Integer>empty().reduce(Integer::sum);                     // Optional rỗng
Stream.of("a", "b", "c").reduce("", String::concat);              // abc
```
=Optional|Hộp chứa một giá trị hoặc rỗng; tránh phải trả về null
=orElse và orElseGet|orElse luôn tính đối số; orElseGet chỉ chạy supplier khi Optional rỗng
=tính lười (lazy evaluation)|Các bước trung gian chỉ chạy khi có bước kết thúc
=bước kết thúc (terminal operation)|Thao tác khởi động pipeline và cho ra kết quả, như count, collect, forEach
=Stream.iterate|Tạo stream từ giá trị khởi đầu và hàm tính phần tử kế tiếp; vô hạn nếu không có điều kiện dừng

~Các bước trung gian biến đổi dòng dữ liệu, và mỗi bước trả về một stream mới. Stream nguyên thủy có thêm các phép tính số học mà Stream thường không có.
@Lọc và cắt|filter, distinct, limit, skip, takeWhile, dropWhile giữ lại một phần của stream.
`filter(predicate)` giữ phần tử thoả điều kiện. `distinct()` bỏ phần tử trùng theo `equals`. `skip(n)` bỏ n phần tử đầu, `limit(n)` chỉ lấy n phần tử. `takeWhile` lấy cho tới phần tử đầu tiên không thoả rồi dừng hẳn; `dropWhile` bỏ cho tới phần tử đầu tiên không thoả rồi lấy tất cả phần còn lại.
```
List<Integer> n = List.of(1, 2, 5, 3, 1);
n.stream().takeWhile(x -> x < 5).toList();   // [1, 2]
n.stream().dropWhile(x -> x < 5).toList();   // [5, 3, 1]
n.stream().filter(x -> x < 5).toList();      // [1, 2, 3, 1]
```
@Biến đổi và sắp xếp|map đổi từng phần tử; flatMap trải phẳng các stream con; sorted cần thấy hết dữ liệu.
`map(hàm)` biến mỗi phần tử thành một phần tử. `flatMap(hàm)` biến mỗi phần tử thành một stream rồi nối tất cả lại, nhờ đó danh sách rỗng tự biến mất. `sorted()` dùng thứ tự tự nhiên, `sorted(comparator)` dùng thứ tự cho trước. `peek(consumer)` nhìn phần tử đi qua mà không đổi stream.
`sorted()` phải gom đủ dữ liệu mới sắp được, nên đặt nó trên stream vô hạn trước `limit` sẽ không bao giờ xong.
```
List<List<Integer>> nested = List.of(List.of(1, 2), List.of(), List.of(3));
nested.stream().flatMap(List::stream).toList();   // [1, 2, 3]
nested.stream().map(List::size).toList();         // [2, 0, 1]
```
@Mỗi phần tử đi hết dây chuyền|Stream xử lý theo chiều dọc: một phần tử đi qua mọi bước rồi mới tới phần tử kế tiếp.
Stream không chạy xong bước filter cho cả danh sách rồi mới sang map. Từng phần tử lần lượt đi từ trên xuống. Vì thế `limit` có thể cắt dây chuyền sớm: các phần tử phía sau không hề được filter hay map.
```
Stream.of(5, 2, 8, 1)
      .filter(x -> x > 1)     // 5 qua, 2 qua; 8 và 1 không bao giờ tới đây
      .limit(2)
      .forEach(System.out::print);   // 52
```
!`stream.toList()` trả danh sách bất biến. `collect(Collectors.toList())` thì không cam kết điều đó, và trên thực tế trả về `ArrayList` sửa được.
@Stream nguyên thủy|IntStream, LongStream, DoubleStream có sum, average, max, min và các kiểu Optional riêng.
Tạo bằng `IntStream.of(...)`, `IntStream.range(a, b)` (không gồm b), `IntStream.rangeClosed(a, b)` (gồm b), hoặc từ stream đối tượng bằng `mapToInt`. Chuyển ngược lại bằng `boxed()` hoặc `mapToObj`. Lưu ý `map` trên `IntStream` vẫn trả `IntStream`.
`sum()` trả thẳng `int`, `long` hoặc `double`. `average()` luôn trả `OptionalDouble`. `max()` và `min()` trả `OptionalInt`, không cần Comparator. Lấy giá trị bằng `getAsInt()`, `getAsDouble()`. `summaryStatistics()` tính một lượt cả min, max, tổng, trung bình và số lượng.
```
IntStream.rangeClosed(1, 4).sum();              // 10
IntStream.range(1, 4).average().getAsDouble();  // 2.0
IntStream.empty().max().isPresent();            // false
Stream<Integer> s = IntStream.of(1, 2).boxed();
```
=bước trung gian (intermediate operation)|Thao tác trả về một stream mới và chỉ chạy khi có bước kết thúc
=flatMap|Biến mỗi phần tử thành một stream rồi nối tất cả thành một stream duy nhất
=takeWhile|Lấy phần tử cho tới khi gặp phần tử đầu tiên không thoả điều kiện, rồi dừng
=peek|Chạy một hành động trên từng phần tử đi qua mà không thay đổi stream
=IntStream.range(a, b)|Các số nguyên từ a đến trước b
=mapToInt và boxed|Chuyển Stream đối tượng sang IntStream, và ngược lại
=OptionalDouble|Kiểu trả về của average(); lấy giá trị bằng getAsDouble()
=summaryStatistics|Tính một lượt min, max, tổng, trung bình và số phần tử của stream nguyên thủy

##27
~Collector quyết định kết quả cuối cùng của stream có hình dạng gì. Stream Gatherers của Java 24 làm điều tương tự cho bước trung gian: bạn tự định nghĩa cách gom và biến đổi dòng dữ liệu.
@Collector cơ bản|collect nhận một Collector để gom stream thành collection, chuỗi hoặc một con số.
`Collectors.toList()`, `toSet()`, `joining(ngăn cách, đầu, cuối)`, `counting()` (trả `Long`), `summingInt`, `averagingInt` (trả `Double`), `minBy` và `maxBy` (trả `Optional`).
`toMap(hàm khoá, hàm giá trị)` ném `IllegalStateException` khi hai phần tử cho cùng một khoá. Thêm tham số thứ ba là hàm gộp để xử lý khoá trùng, và tham số thứ tư để chọn loại Map.
```
Stream.of("a", "b", "c").collect(Collectors.joining("-", "[", "]"));     // [a-b-c]
Stream.of("aa", "b", "cc").collect(Collectors.toMap(String::length, s -> s));
// ném IllegalStateException: "aa" và "cc" cùng khoá 2
Stream.of("aa", "b", "cc").collect(Collectors.toMap(String::length, s -> s, (x, y) -> x + y));
// {1=b, 2=aacc}
```
@groupingBy, partitioningBy và teeing|groupingBy chia theo khoá bất kỳ; partitioningBy luôn chia đúng hai nhóm true và false.
`groupingBy(hàm phân loại)` trả `Map<K, List<T>>`. Thêm collector thứ hai để xử lý từng nhóm, ví dụ `counting()` hay `mapping(...)`. Bản ba tham số nhận loại Map ở giữa: `groupingBy(hàm, TreeMap::new, collector)`.
`partitioningBy(predicate)` trả `Map<Boolean, List<T>>` và luôn có cả hai khoá, kể cả khi một nhóm rỗng. `teeing(c1, c2, hàm gộp)` đưa stream qua hai collector cùng lúc rồi gộp hai kết quả.
```
Stream.of(1, 2, 3, 4, 5).collect(Collectors.partitioningBy(x -> x > 9, Collectors.counting()));
// {false=5, true=0}: khoá true vẫn có mặt
Stream.of(4, 8, 6).collect(Collectors.teeing(Collectors.counting(), Collectors.summingInt(x -> x), (c, s) -> s / c));
// 6: tổng 18 chia cho số lượng 3
```
@Stream Gatherers (Java 24)|gather là bước trung gian nhận một Gatherer, cho phép biến đổi mà map và filter không làm được.
`stream.gather(gatherer)` trả về một stream mới, nên vẫn cần một bước kết thúc phía sau. Khác với `map`, một gatherer có thể giữ trạng thái giữa các phần tử, phát ra nhiều hoặc ít phần tử hơn số nhận vào, và dừng sớm. Lớp `Gatherers` cung cấp sẵn năm gatherer; bạn cũng có thể tự viết bằng `Gatherer.of(...)` hoặc `Gatherer.ofSequential(...)`, và nối hai gatherer bằng `andThen`.
`windowFixed(n)` cắt stream thành các danh sách n phần tử liền nhau, nhóm cuối có thể ngắn hơn. `windowSliding(n)` tạo các cửa sổ n phần tử, mỗi lần trượt một phần tử; nếu stream có ít hơn n phần tử thì cho một cửa sổ chứa tất cả. Kích thước nhỏ hơn 1 ném `IllegalArgumentException`. Các cửa sổ là danh sách không sửa được.
```
Stream.of(1, 2, 3, 4, 5).gather(Gatherers.windowFixed(2)).toList();    // [[1, 2], [3, 4], [5]]
Stream.of(1, 2, 3, 4).gather(Gatherers.windowSliding(3)).toList();     // [[1, 2, 3], [2, 3, 4]]
Stream.of(1, 2).gather(Gatherers.windowSliding(3)).toList();           // [[1, 2]]
```
@fold, scan và mapConcurrent|fold cho một kết quả cuối; scan cho mọi kết quả trung gian.
`Gatherers.fold(khởi đầu, hàm)` tích luỹ như `reduce` nhưng là bước trung gian: nó phát ra đúng một phần tử khi stream hết, và stream rỗng thì phát ra chính giá trị khởi đầu. `Gatherers.scan(khởi đầu, hàm)` phát ra giá trị tích luỹ sau mỗi phần tử; giá trị khởi đầu không được phát ra. `Gatherers.mapConcurrent(n, hàm)` áp dụng hàm trên tối đa n thread ảo cùng lúc mà vẫn giữ thứ tự của stream.
```
Stream.of(1, 2, 3, 4).gather(Gatherers.scan(() -> 0, Integer::sum)).toList();   // [1, 3, 6, 10]
Stream.of(1, 2, 3, 4).gather(Gatherers.fold(() -> 0, Integer::sum)).toList();   // [10]
```
!Tham số đầu của `fold` và `scan` là một `Supplier`, viết `() -> 0`, không phải giá trị `0` như ở `reduce`.

~Ngoại lệ chiếm một nhóm mục tiêu riêng trong đề. Phải thuộc lớp nào là checked, và nhìn một khối try là biết ngay nó có biên dịch được không.
@Phân cấp ngoại lệ|Checked exception buộc phải xử lý hoặc khai báo; RuntimeException và Error thì không.
`Throwable` có hai nhánh: `Error` (lỗi nghiêm trọng của JVM, không nên bắt) và `Exception`. Trong `Exception`, nhánh `RuntimeException` là unchecked; mọi lớp còn lại là checked.
Checked hay gặp: `IOException`, `FileNotFoundException` (con của IOException), `SQLException`, `ParseException`. Unchecked hay gặp: `ArithmeticException`, `ArrayIndexOutOfBoundsException`, `ClassCastException`, `NullPointerException`, `IllegalArgumentException`, `NumberFormatException` (con của IllegalArgumentException), `IllegalStateException`, `UnsupportedOperationException`. Error hay gặp: `StackOverflowError`, `OutOfMemoryError`, `ExceptionInInitializerError`.
```
class Loader {
    void read() throws IOException { }
    void open() { read(); }                    // KHÔNG biên dịch: chưa xử lý, chưa khai báo
    void close() throws Exception { read(); }  // hợp lệ: khai báo kiểu rộng hơn
}
```
@try, catch và finally|catch của lớp con phải đứng trước catch của lớp cha; finally luôn chạy.
Khối `try` thông thường cần ít nhất một `catch` hoặc một `finally`. Các `catch` được xét từ trên xuống; đặt lớp cha trước lớp con khiến catch phía sau không bao giờ tới được, và đó là lỗi biên dịch.
Bắt một checked exception mà thân `try` không thể ném ra cũng là lỗi biên dịch. Quy tắc này không áp dụng cho `Exception`, `Throwable` và các unchecked exception.
```
try {
    Integer.parseInt("1");
} catch (RuntimeException e) {
} catch (NumberFormatException e) { }     // KHÔNG biên dịch: đã bị catch phía trên bắt hết

try {
    System.out.println("ok");
} catch (IOException e) { }               // KHÔNG biên dịch: thân try không ném IOException
```
@finally và return|finally chạy cả khi try hoặc catch đã return; return trong finally ghi đè mọi kết quả trước đó.
`finally` chạy sau `try` và `catch`, dù có ngoại lệ hay không, dù có `return` hay không. Chỉ `System.exit` mới bỏ qua được nó. Nếu `finally` tự `return` hoặc ném ngoại lệ, giá trị trả về hoặc ngoại lệ trước đó bị thay thế.
```
static int g() {
    try {
        throw new IllegalStateException();
    } catch (IllegalStateException e) {
        return 2;
    } finally {
        return 3;      // kết quả cuối cùng là 3
    }
}
```
@Multi-catch và ngoại lệ tự định nghĩa|Các kiểu trong một multi-catch không được có quan hệ cha con với nhau.
`catch (A | B e)` xử lý chung nhiều kiểu. Hai kiểu có quan hệ kế thừa, như `FileNotFoundException | IOException`, là lỗi biên dịch vì kiểu con thừa. Biến `e` trong multi-catch ngầm định là final nên không gán lại được.
Ngoại lệ tự định nghĩa kế thừa `Exception` thì là checked, kế thừa `RuntimeException` thì là unchecked. Thông thường chỉ cần viết constructor chuyển thông điệp lên lớp cha.
```
class StockException extends Exception {            // checked
    StockException(String m) { super(m); }
}
try { ... } catch (IllegalArgumentException | NullPointerException e) { }   // hợp lệ
try { ... } catch (FileNotFoundException | IOException e) { }               // KHÔNG biên dịch
```
=checked exception|Ngoại lệ kế thừa Exception nhưng không kế thừa RuntimeException; phải xử lý hoặc khai báo
=unchecked exception|RuntimeException và các lớp con; không bắt buộc xử lý
=Error|Lỗi nghiêm trọng của JVM như StackOverflowError; không nên bắt
=throws|Từ khoá trong khai báo phương thức, báo phương thức có thể ném ngoại lệ nào
=throw|Câu lệnh ném một đối tượng ngoại lệ
=finally|Khối luôn chạy sau try và catch, dù có ngoại lệ hay return
=multi-catch|Một khối catch cho nhiều kiểu ngoại lệ không liên quan nhau, viết A | B
=NumberFormatException|Unchecked, con của IllegalArgumentException; ném khi chuyển chuỗi không hợp lệ thành số

~try-with-resources tự đóng tài nguyên cho bạn. Đề thi hỏi rất kỹ ba điều: đóng theo thứ tự nào, đóng vào lúc nào, và ngoại lệ nào thắng khi cả thân try lẫn close() đều ném.
@AutoCloseable và cú pháp|Mọi tài nguyên khai báo trong ngoặc của try phải hiện thực AutoCloseable.
`AutoCloseable` có một phương thức `close() throws Exception`. `Closeable` là interface con của nó, với `close() throws IOException`. Lớp hiện thực được phép thu hẹp hoặc bỏ hẳn mệnh đề `throws`.
Khác với `try` thường, try-with-resources không bắt buộc có `catch` hay `finally`. Nhưng nếu `close()` của tài nguyên khai báo một checked exception, mã của bạn vẫn phải bắt hoặc khai báo ngoại lệ đó, dù không gọi `close()` trực tiếp.
```
class Door implements AutoCloseable {
    public void close() throws Exception { }
}
try (Door d = new Door()) {
    System.out.println("in");
}       // KHÔNG biên dịch nếu phương thức bao ngoài không bắt hoặc khai báo Exception
```
@Thứ tự đóng|Tài nguyên được đóng theo thứ tự ngược với khai báo, ngay khi thân try kết thúc, trước catch và finally.
Trình tự đầy đủ: thân `try` chạy; các tài nguyên đóng lần lượt từ cuối về đầu; rồi mới tới `catch` (nếu có ngoại lệ); cuối cùng là `finally`. Vì vậy trong `catch` và `finally`, tài nguyên đã đóng xong và biến tài nguyên cũng đã ra khỏi phạm vi.
```
try (Res a = new Res("A"); Res b = new Res("B")) {
    System.out.print("body ");
    throw new RuntimeException();
} catch (RuntimeException e) {
    System.out.print("catch ");
} finally {
    System.out.print("finally");
}
// body, đóng B, đóng A, catch, finally
```
@Biến tài nguyên|Biến tài nguyên ngầm định là final; có thể dùng lại một biến có sẵn nếu nó effectively final.
Biến khai báo trong ngoặc của `try` không gán lại được. Từ Java 9, bạn được viết tên một biến đã khai báo trước đó, miễn là biến ấy final hoặc effectively final: `try (shared) { }`. Biến đó vẫn dùng được sau khối try, nhưng tài nguyên nó trỏ tới đã bị đóng.
```
Conn c = new Conn();
try (c) {
    // dùng c
}
// c vẫn trong phạm vi, nhưng đã đóng

try (Res r = new Res("A")) {
    r = new Res("B");      // KHÔNG biên dịch: r ngầm định là final
}
```
@Ngoại lệ bị nén (suppressed)|Ngoại lệ từ thân try là ngoại lệ chính; ngoại lệ từ close() được gắn kèm vào nó.
Khi thân `try` ném ngoại lệ và sau đó `close()` cũng ném, ngoại lệ của thân try được truyền ra ngoài, còn ngoại lệ của `close()` được thêm vào danh sách suppressed của nó. Lấy danh sách này bằng `getSuppressed()`, trả về một mảng.
Nếu thân try chạy êm và chỉ `close()` ném, thì ngoại lệ của `close()` là ngoại lệ chính, và danh sách suppressed rỗng.
```
class Pipe implements AutoCloseable {
    public void close() { throw new IllegalStateException("close"); }
}
try (Pipe p = new Pipe()) {
    throw new RuntimeException("body");
} catch (Exception e) {
    e.getMessage();                      // body
    e.getSuppressed()[0].getMessage();   // close
}
```
!Ngoại lệ ném từ khối `finally` thì khác hẳn: nó thay thế ngoại lệ trước đó, không có gì được giữ lại trong suppressed.
=AutoCloseable|Interface với close() throws Exception; điều kiện để dùng trong try-with-resources
=Closeable|Interface con của AutoCloseable, với close() throws IOException
=try-with-resources|Khối try khai báo tài nguyên trong ngoặc và tự gọi close() khi kết thúc
=thứ tự đóng tài nguyên|Ngược với thứ tự khai báo, và diễn ra trước khi catch và finally chạy
=suppressed exception|Ngoại lệ từ close() được gắn kèm vào ngoại lệ chính của thân try
=getSuppressed()|Trả về mảng các ngoại lệ bị nén của một ngoại lệ
=biến tài nguyên|Biến trong ngoặc của try-with-resources; ngầm định là final

~Cùng một con số hay một ngày tháng, mỗi nước viết một kiểu. Bài này học cách định dạng theo Locale và cách Java chọn tệp tài nguyên, phần có quy tắc tìm kiếm cần thuộc lòng.
@Locale|Locale gồm mã ngôn ngữ viết thường, có thể kèm mã quốc gia viết hoa.
Tạo bằng `Locale.of("vi", "VN")`, bằng hằng dựng sẵn như `Locale.US`, `Locale.GERMANY`, `Locale.FRENCH`, hoặc bằng `Locale.Builder`. In ra có dạng `vi_VN`: ngôn ngữ trước, quốc gia sau, nối bằng gạch dưới. Chỉ có ngôn ngữ cũng hợp lệ, ví dụ `fr`.
`Locale.getDefault()` trả Locale mặc định của máy, đổi bằng `Locale.setDefault(...)`. Có thể đổi riêng từng nhóm qua `Locale.Category.FORMAT` (định dạng số, ngày) và `Locale.Category.DISPLAY` (tên hiển thị).
```
Locale vn = Locale.of("vi", "VN");     // vi_VN
Locale fr = Locale.FRENCH;             // fr

##31
~Module là lớp đóng gói nằm trên package: nó nói rõ mình cần gì và cho bên ngoài thấy gì. Câu hỏi về module chủ yếu kiểm tra từ khoá trong module-info và cú pháp dòng lệnh.
@Tệp module-info.java|Mỗi module có đúng một tệp module-info.java đặt ở thư mục gốc của nó.
Tệp bắt đầu bằng `module tên { }`. Tên module theo quy tắc tên package: được có dấu chấm, không được có dấu gạch ngang. Thân tệp có thể rỗng. Mọi module đều tự động phụ thuộc `java.base`, không cần ghi ra.
Không có `exports` thì không package nào của module được bên ngoài nhìn thấy, kể cả các lớp `public`.
```
// zoo.animal/module-info.java
module zoo.animal {
    exports zoo.animal.feeding;      // bên ngoài dùng được các kiểu public của package này
}
// zoo.animal/zoo/animal/feeding/Task.java
// zoo.animal/zoo/animal/internal/Helper.java   <- không export: bên ngoài không thấy
```
@exports, requires và opens|exports nhận tên package; requires nhận tên module.
`exports gói;` cho mọi module khác dùng các kiểu public của package. `exports gói to moduleA, moduleB;` chỉ cho những module được nêu tên. `requires module;` khai báo phụ thuộc. `requires transitive module;` còn chuyển tiếp quyền đọc: ai requires module này cũng tự động đọc được module kia.
`opens gói;` cho phép reflection lúc chạy lên mọi thành viên của package, kể cả private, mà không cho biên dịch dựa vào nó. Cũng có dạng `opens gói to module;`. Đặt `open` trước từ khoá `module` thì mở toàn bộ module.
```
module zoo.care {
    exports zoo.care.medical;
    exports zoo.care.diet to zoo.staff;       // chỉ zoo.staff thấy
    requires transitive zoo.animal;           // ai dùng zoo.care cũng đọc được zoo.animal
    opens zoo.care.records to zoo.audit;      // cho reflection
}
```
!Hai module `requires` lẫn nhau tạo thành phụ thuộc vòng, và đó là lỗi biên dịch. Ghi `requires` cùng một module hai lần cũng là lỗi.
@Biên dịch, đóng gói và chạy|Đường dẫn module là -p hoặc --module-path; module cần chạy là -m hoặc --module.
Biên dịch: `javac -p mods -d out ...` trong đó `-p` trỏ tới nơi chứa các module phụ thuộc. Đóng gói: `jar -cvf mods/zoo.animal.jar -C out/ .` Chạy: `java -p mods -m zoo.animal/zoo.animal.feeding.Task`, tức tên module, dấu gạch chéo, rồi tên đầy đủ của lớp có main.
Dạng dài tương đương: `--module-path` thay cho `-p`, `--module` thay cho `-m`. Với `javac`, `-d` là thư mục đích. Lưu ý `-cp` là classpath, không phải module path.
```
javac -p mods -d out zoo.staff/module-info.java zoo.staff/zoo/staff/*.java
jar -cvf mods/zoo.staff.jar -C out/ .
java --module-path mods --module zoo.staff/zoo.staff.Main
```
@Xem thông tin module|java có các tuỳ chọn mô tả module, liệt kê module và hiện quá trình phân giải.
`java -p mods -d zoo.animal` hoặc `--describe-module` in ra nội dung khai báo của một module. `jar --file mods/zoo.animal.jar --describe-module` làm điều tương tự với một tệp JAR. `java --list-modules` liệt kê các module có sẵn. `java --show-module-resolution -p mods -m ...` in từng bước phân giải module khi khởi chạy.
Với lệnh `java`, `-d` nghĩa là describe-module. Với lệnh `javac`, `-d` lại là thư mục đích.
=module-info.java|Tệp khai báo module, đặt ở thư mục gốc của module
=exports|Chỉ thị cho module khác dùng các kiểu public của một package
=requires|Chỉ thị khai báo module này phụ thuộc một module khác

##32
~Phần hai của module: cơ chế service để nối lỏng các module, ba loại module cùng tồn tại trong lúc di trú, và bộ công cụ dòng lệnh đi kèm.
@Service: uses và provides|Bên cung cấp khai báo provides ... with; bên tìm kiếm khai báo uses.
Một service gồm bốn vai. Interface dịch vụ nằm trong một module và được `exports`. Module cung cấp khai báo `provides Interface with LớpHiệnThực;` và không cần export lớp hiện thực. Module tìm kiếm khai báo `uses Interface;` rồi gọi `ServiceLoader.load(Interface.class)`. Module tiêu dùng chỉ cần requires module tìm kiếm.
`ServiceLoader` duyệt được bằng for-each. Phương thức `stream()` của nó trả về các `Provider`, gọi `get()` để lấy đối tượng. Thêm một module cung cấp mới không đòi hỏi biên dịch lại các module còn lại.
```
module zoo.tours.api      { exports zoo.tours.api; }
module zoo.tours.agency   { requires zoo.tours.api;
                            provides zoo.tours.api.Tour with zoo.tours.agency.TourImpl; }
module zoo.tours.reserve  { requires zoo.tours.api;
                            exports zoo.tours.reserve;
                            uses zoo.tours.api.Tour; }
```
@Ba loại module|Named có module-info và nằm trên module path; automatic không có module-info nhưng nằm trên module path; unnamed là mọi thứ trên classpath.
Named module: chỉ export những gì nó khai báo, chỉ đọc những gì nó requires. Automatic module: một JAR thường đặt trên module path; nó export mọi package của mình và đọc được mọi module khác. Unnamed module: toàn bộ mã trên classpath; nó đọc được mọi module, nhưng named module không đọc được nó.
Tên của automatic module lấy từ dòng `Automatic-Module-Name` trong MANIFEST nếu có. Nếu không, tên suy ra từ tên tệp: bỏ đuôi `.jar`, bỏ phần phiên bản ở cuối, đổi mọi ký tự không phải chữ và số thành dấu chấm.

~Thread là đơn vị chạy song song nhỏ nhất. Java 21 thêm thread ảo, và Java 24 gỡ bỏ hạn chế lớn nhất của chúng khi dùng với synchronized.
@Tạo và khởi chạy thread|start() tạo một luồng chạy mới; gọi thẳng run() thì mã chạy ngay trên thread hiện tại.
Cách cơ bản: tạo `Thread` với một `Runnable` rồi gọi `start()`. Gọi `run()` chỉ là một lời gọi phương thức bình thường, không có thread mới nào. Một thread chỉ `start()` được một lần; gọi lần hai ném `IllegalThreadStateException`.
Các cách tạo qua builder: `Thread.ofPlatform().start(r)`, `Thread.ofVirtual().start(r)`, `Thread.startVirtualThread(r)`. Dùng `unstarted(r)` thay cho `start(r)` nếu chưa muốn chạy ngay.
```
Thread t = new Thread(() -> System.out.print(Thread.currentThread().getName()));
t.setName("worker");
t.run();      // in ra main: chạy trên thread đang gọi
t.start();    // in ra worker: chạy trên thread mới
```
@Vòng đời và các phương thức điều phối|Sáu trạng thái: NEW, RUNNABLE, BLOCKED, WAITING, TIMED_WAITING, TERMINATED.
Thread mới tạo ở trạng thái `NEW`, sau `start()` là `RUNNABLE`, chờ khoá là `BLOCKED`, chờ vô thời hạn (như `join()`) là `WAITING`, chờ có thời hạn (như `sleep`) là `TIMED_WAITING`, chạy xong là `TERMINATED`.
`join()` đợi thread khác kết thúc. `Thread.sleep(ms)` tạm dừng thread hiện tại. Cả hai khai báo ném `InterruptedException`, một checked exception. `interrupt()` bật cờ ngắt của thread; nếu thread đó đang `sleep`, `join` hoặc `wait` thì nó nhận `InterruptedException` và cờ ngắt được xoá về false.
```
Thread t = new Thread(() -> {
    try { Thread.sleep(10_000); }
    catch (InterruptedException e) { /* cờ ngắt lúc này đã là false */ }
});
t.start();
t.interrupt();    // đánh thức t khỏi sleep
t.join();         // đợi t xong
```
@Thread nền tảng, thread ảo và daemon|Thread ảo rất nhẹ, do JVM lập lịch, luôn là daemon và có độ ưu tiên cố định.
Thread nền tảng (platform thread) gắn một một với thread của hệ điều hành. Thread ảo (virtual thread) chạy nhờ trên một số ít thread nền gọi là carrier; khi thread ảo bị chặn bởi I/O hay `sleep`, nó nhả carrier cho thread ảo khác. Nhờ vậy có thể tạo hàng triệu thread ảo. Chúng hợp với tác vụ chờ I/O nhiều, không làm tác vụ tính toán nặng chạy nhanh hơn.
JVM thoát khi mọi thread không phải daemon đã kết thúc. Thread ảo luôn là daemon: `setDaemon(false)` trên thread ảo ném `IllegalArgumentException`. `isVirtual()` cho biết loại thread.
```
Thread v = Thread.ofVirtual().unstarted(() -> { });
v.isVirtual();    // true
v.isDaemon();     // true
v.getState();     // NEW
```
!Không gom thread ảo vào pool. Chúng rẻ tới mức mỗi tác vụ nên có một thread ảo riêng, ví dụ qua `Executors.newVirtualThreadPerTaskExecutor()`.
@synchronized không còn ghim thread ảo (Java 24)|Từ Java 24, thread ảo chờ trong khối synchronized vẫn nhả được carrier.
Ở Java 21, khi một thread ảo bị chặn bên trong khối hoặc phương thức `synchronized`, nó bị ghim (pinned) vào carrier: thread nền đó không phục vụ được thread ảo nào khác, làm giảm khả năng mở rộng. Lời khuyên khi ấy là thay `synchronized` bằng `ReentrantLock`.
Java 24 bỏ hạn chế này: thread ảo chờ khoá hoặc bị chặn trong `synchronized` sẽ tách khỏi carrier như bình thường. Không còn lý do hiệu năng để tránh `synchronized` với thread ảo. Việc ghim chỉ còn xảy ra trong vài trường hợp hiếm, như khi đang chạy mã native.
=Thread.start()|Khởi chạy một luồng thực thi mới; gọi lần hai ném IllegalThreadStateException
=join()|Đợi cho tới khi thread khác kết thúc
=InterruptedException|Checked exception do sleep, join, wait ném khi thread bị ngắt
=thread ảo (virtual thread)|Thread nhẹ do JVM lập lịch, chạy nhờ trên các thread nền
=carrier|Thread nền tảng đang chở một thread ảo
=daemon thread|Thread không giữ JVM lại; JVM thoát khi chỉ còn daemon thread
=ghim (pinning)|Tình trạng thread ảo bị chặn mà không nhả được carrier; từ Java 24 synchronized không còn gây ra
=TIMED_WAITING|Trạng thái của thread đang chờ có thời hạn, ví dụ trong sleep

##34
~Thay vì tự tạo thread, bạn giao tác vụ cho một ExecutorService và nhận lại Future. Java 25 có thêm hai cập nhật nhỏ cho ForkJoinPool và CompletableFuture.
@Các loại ExecutorService|Lớp Executors có sẵn các phương thức tạo pool; mọi ExecutorService đều phải được đóng.
`newSingleThreadExecutor()` chạy tuần tự từng tác vụ. `newFixedThreadPool(n)` có n thread. `newCachedThreadPool()` tạo thread theo nhu cầu. `newScheduledThreadPool(n)` cho tác vụ hẹn giờ. `newVirtualThreadPerTaskExecutor()` cấp cho mỗi tác vụ một thread ảo.
`shutdown()` ngừng nhận tác vụ mới nhưng để các tác vụ đã nhận chạy xong. `shutdownNow()` cố dừng tác vụ đang chạy và trả về danh sách tác vụ chưa bắt đầu. Gửi tác vụ sau khi đã shutdown ném `RejectedExecutionException`. `ExecutorService` hiện thực `AutoCloseable`: dùng trong try-with-resources thì `close()` gọi shutdown rồi đợi mọi tác vụ xong.
```
try (ExecutorService ex = Executors.newFixedThreadPool(4)) {
    ex.execute(() -> System.out.println("việc 1"));
}   // close(): đợi tác vụ xong rồi mới đi tiếp
```
@Runnable, Callable và Future|execute chỉ nhận Runnable; submit nhận cả hai và trả về Future.
`Runnable.run()` không trả giá trị và không ném checked exception. `Callable<V>.call()` trả về V và được ném `Exception`. `execute(runnable)` trả `void`. `submit(...)` trả `Future`; với Runnable, `get()` của Future đó trả `null`.
`Future.get()` chặn cho tới khi có kết quả, và khai báo hai checked exception: `InterruptedException` và `ExecutionException`. Nếu tác vụ ném ngoại lệ, `get()` ném `ExecutionException` bọc ngoại lệ gốc, lấy ra bằng `getCause()`. `get(thời hạn, đơn vị)` ném thêm `TimeoutException`.
```
Future<Integer> a = ex.submit(() -> 6 * 7);                      // Callable<Integer>
Future<?> b = ex.submit(() -> System.out.print("run "));         // Runnable
a.get();    // 42
b.get();    // null
```
@invokeAll, invokeAny và lên lịch|invokeAll đợi tất cả và giữ đúng thứ tự; invokeAny trả kết quả của một tác vụ thành công.
`invokeAll(danh sách Callable)` chặn tới khi mọi tác vụ xong, trả `List<Future>` theo đúng thứ tự danh sách đầu vào, bất kể tác vụ nào xong trước. `invokeAny` trả thẳng kết quả của một tác vụ hoàn thành và huỷ phần còn lại.
`ScheduledExecutorService` có `schedule(tác vụ, trễ, đơn vị)` nhận Runnable hoặc Callable. `scheduleAtFixedRate` và `scheduleWithFixedDelay` chỉ nhận Runnable: bản đầu tính chu kỳ từ lúc bắt đầu lần chạy trước, bản sau tính từ lúc lần chạy trước kết thúc.
```
ScheduledExecutorService ses = Executors.newScheduledThreadPool(1);
ScheduledFuture<String> f = ses.schedule(() -> "late", 50, TimeUnit.MILLISECONDS);
ses.scheduleAtFixedRate(() -> System.out.print("."), 0, 1, TimeUnit.SECONDS);
```
@ForkJoinPool và CompletableFuture trong Java 25|ForkJoinPool nay cũng là một ScheduledExecutorService và có thêm submitWithTimeout.
Từ Java 25, `ForkJoinPool` hiện thực `ScheduledExecutorService`, nên gọi được `schedule`, `scheduleAtFixedRate` trên nó, kể cả trên `ForkJoinPool.commonPool()`. Phương thức mới `submitWithTimeout(callable, thời hạn, đơn vị, hành động)` gửi một tác vụ và tự huỷ nó nếu quá hạn mà chưa xong.
`CompletableFuture` chạy tác vụ bất đồng bộ bằng `supplyAsync` hoặc `runAsync`, nối tiếp bằng `thenApply`, `thenAccept`, `thenCombine`, lấy kết quả bằng `join()` (không ném checked exception). Từ Java 25, các phương thức async không truyền Executor luôn chạy trên common pool của ForkJoinPool; trước đó, khi common pool có độ song song nhỏ hơn 2, mỗi tác vụ được cấp một thread mới.
```
try (ForkJoinPool pool = new ForkJoinPool(2)) {
    ScheduledExecutorService ses = pool;          // hợp lệ từ Java 25
    ses.schedule(() -> "late", 50, TimeUnit.MILLISECONDS).get();
}
CompletableFuture.supplyAsync(() -> 20).thenApply(x -> x + 1).join();   // 21
```

~Khi nhiều thread cùng đụng vào một dữ liệu, kết quả có thể sai mà không báo lỗi. Bài này học các công cụ bảo vệ dữ liệu chung, và scoped values của Java 25: cách chia sẻ dữ liệu bất biến trong một phạm vi lời gọi.
@Race condition và synchronized|count++ gồm ba bước đọc, cộng, ghi; hai thread chen vào giữa sẽ làm mất một lần tăng.
`synchronized` bảo đảm mỗi lúc chỉ một thread chạy đoạn mã được bảo vệ. Phương thức instance `synchronized` khoá trên `this`; phương thức `static synchronized` khoá trên đối tượng Class; khối `synchronized (đốiTượng) { }` khoá trên đối tượng được nêu. Hai đoạn mã chỉ loại trừ nhau khi dùng chung một đối tượng khoá.
```
int count;
synchronized void inc() { count++; }       // khoá trên this

void incBlock() {
    synchronized (this) { count++; }       // tương đương
}
```
@Lớp atomic và Lock|AtomicInteger cho phép tăng giảm an toàn mà không cần khoá; Lock cho quyền kiểm soát tường minh.
`AtomicInteger`: `incrementAndGet()` tăng rồi trả giá trị mới, `getAndIncrement()` trả giá trị cũ rồi tăng, `compareAndSet(mong đợi, mới)` chỉ ghi khi giá trị hiện tại đúng bằng giá trị mong đợi và trả về boolean.
`ReentrantLock`: gọi `lock()` trước, và `unlock()` trong khối `finally`. `tryLock()` thử lấy khoá và trả ngay boolean. Thread đang giữ khoá lấy lại chính khoá đó được (reentrant), và phải unlock đủ số lần. Gọi `unlock()` khi không giữ khoá ném `IllegalMonitorStateException`.
```
AtomicInteger n = new AtomicInteger(5);
n.getAndIncrement();        // trả 5, n = 6
n.incrementAndGet();        // trả 7, n = 7
n.compareAndSet(7, 10);     // true, n = 10

Lock lock = new ReentrantLock();
lock.lock();
try { /* vùng được bảo vệ */ } finally { lock.unlock(); }
```
@Collection đồng thời|Collection thường bị sửa trong lúc duyệt thì ném ConcurrentModificationException; collection đồng thời thì không.
`ConcurrentHashMap`, `ConcurrentLinkedQueue`, `ConcurrentSkipListMap` (có sắp xếp) an toàn cho nhiều thread và cho phép sửa trong lúc duyệt. `CopyOnWriteArrayList` sao chép toàn bộ mảng mỗi lần ghi; vòng lặp đang duyệt chỉ thấy bản chụp tại thời điểm bắt đầu duyệt. `LinkedBlockingQueue` có `offer` và `poll` kèm thời hạn chờ. `Collections.synchronizedList(...)` bọc một collection thường bằng khoá.
```
List<Integer> a = new CopyOnWriteArrayList<>(List.of(1, 2, 3));
for (Integer x : a) a.add(x * 10);     // hợp lệ: vòng lặp chỉ thấy 1, 2, 3; sau đó a có 6 phần tử

List<Integer> b = new ArrayList<>(List.of(1, 2, 3));
for (Integer x : b) b.add(x * 10);     // ném ConcurrentModificationException
```
@Scoped values (Java 25)|ScopedValue gắn một giá trị bất biến cho toàn bộ chuỗi lời gọi bên trong run() hoặc call().
Khai báo một lần, thường là `static final`: `ScopedValue<String> USER = ScopedValue.newInstance();`. Gắn giá trị và chạy mã bằng `ScopedValue.where(USER, "an").run(() -> ...)`; dùng `call(...)` nếu cần trả về kết quả. Bên trong, mọi phương thức được gọi tới đều đọc được bằng `USER.get()` mà không cần truyền tham số.
Giá trị chỉ tồn tại trong lúc `run` hoặc `call` đang chạy, sau đó tự mất, không cần dọn dẹp. Không có phương thức `set`: muốn giá trị khác thì lồng thêm một `where(...).run(...)`, và khi khối trong kết thúc, giá trị của khối ngoài trở lại. Gọi `get()` khi chưa gắn ném `NoSuchElementException`; kiểm tra bằng `isBound()` hoặc dùng `orElse(mặc định)`.
```
static final ScopedValue<String> USER = ScopedValue.newInstance();

ScopedValue.where(USER, "an").run(() -> {
    USER.get();                                               // an
    ScopedValue.where(USER, "binh").run(() -> USER.get());    // binh
    USER.get();                                               // lại là an
});
USER.isBound();        // false
USER.orElse("x");      // x
```
!Một thread tạo bằng `new Thread(...)` bên trong `run` không thừa hưởng giá trị đã gắn. So với `ThreadLocal`, scoped value bất biến, có thời gian sống rõ ràng và rẻ hơn khi dùng với thread ảo.

##36
~Bài cuối của phần đa luồng: bốn kiểu sự cố kinh điển và parallel stream. Với parallel stream, câu hỏi luôn là kết quả có còn xác định không.
@Bốn vấn đề đa luồng|Deadlock đứng yên; livelock chạy mà không tiến; starvation không tới lượt; race condition cho kết quả sai.
Deadlock: hai hay nhiều thread giữ khoá của nhau và chờ nhau mãi mãi. Livelock: các thread vẫn hoạt động, liên tục phản ứng với nhau, nhưng không ai tiến được bước nào. Starvation: một thread không bao giờ được cấp tài nguyên vì các thread khác luôn chiếm trước. Race condition: nhiều thread cùng truy cập một dữ liệu mà không đồng bộ, khiến kết quả phụ thuộc thứ tự xen kẽ.
Cách tránh deadlock thông dụng là luôn lấy các khoá theo cùng một thứ tự ở mọi thread.
```
// Thread 1                       // Thread 2
synchronized (a) {                synchronized (b) {
    synchronized (b) { }              synchronized (a) { }
}                                 }
// Thread 1 giữ a chờ b, thread 2 giữ b chờ a: deadlock
```
@Tạo parallel stream và thứ tự|forEach trên parallel stream không bảo đảm thứ tự; forEachOrdered thì có.
Tạo bằng `collection.parallelStream()` hoặc `stream.parallel()`. `isParallel()` cho biết stream có song song không. Các phần tử được chia cho nhiều thread nên `forEach` in ra theo thứ tự không đoán trước được, còn `forEachOrdered` giữ thứ tự của nguồn với giá là mất bớt lợi ích song song.
Trên stream có thứ tự, `findFirst`, `limit`, `skip` vẫn cho kết quả đúng như khi chạy tuần tự. `findAny` thì có thể trả bất kỳ phần tử nào. `collect(Collectors.toList())` và `toList()` vẫn giữ thứ tự nguồn.
```
List.of(1, 2, 3, 4).parallelStream().forEach(System.out::print);          // thứ tự bất kỳ
List.of(1, 2, 3, 4).parallelStream().forEachOrdered(System.out::print);   // 1234
List.of(3, 1, 2).parallelStream().findFirst().get();                      // 3
```
@reduce trên parallel stream|Giá trị khởi đầu phải trung hoà và hàm gộp phải kết hợp, nếu không kết quả đổi theo cách chia.
Parallel stream chia dữ liệu thành nhiều phần, reduce từng phần với giá trị khởi đầu, rồi gộp các kết quả lại. Để kết quả giống chạy tuần tự, giá trị khởi đầu phải không làm đổi kết quả (0 với phép cộng, 1 với phép nhân, chuỗi rỗng với phép nối), và hàm gộp phải có tính kết hợp: `(a op b) op c` bằng `a op (b op c)`.
Phép trừ không kết hợp, nên `reduce(0, (a, b) -> a - b)` cho kết quả khác nhau. `reduce(1, Integer::sum)` cũng sai vì số 1 bị cộng thêm ở mỗi phần.
```
IntStream.rangeClosed(1, 100).parallel().sum();                       // 5050: luôn đúng
List.of(1, 2, 3, 4).parallelStream().reduce(0, (a, b) -> a - b);      // không xác định
List.of(1, 2, 3, 4).parallelStream().reduce(1, Integer::sum);         // có thể lớn hơn 11
```

@Tạo Path và đọc các thành phần|Path bất biến; các tên được đánh số từ 0 và không tính thư mục gốc.
Tạo bằng `Path.of("a", "b.txt")` hoặc `Paths.get(...)`. Chuyển đổi với kiểu cũ bằng `path.toFile()` và `file.toPath()`. Mọi phương thức biến đổi của Path trả về Path mới.
`getFileName()` là phần tên cuối. `getParent()` là phần đứng trước, hoặc `null` nếu không có. `getRoot()` là gốc, hoặc `null` với đường dẫn tương đối. `getNameCount()` đếm số tên, `getName(i)` lấy tên thứ i, `subpath(đầu, cuối)` lấy một đoạn và không gồm vị trí cuối. Các ký hiệu `.` và `..` cũng được đếm là tên.
```
Path p = Path.of("/zoo/animals/../birds/./owl.txt");
p.getNameCount();      // 6: zoo, animals, .., birds, ., owl.txt
p.getName(0);          // zoo (gốc / không được tính)
p.subpath(1, 3);       // animals/..
p.getFileName();       // owl.txt
Path.of("a.txt").getParent();   // null
```
@resolve, relativize và normalize|resolve nối hai đường dẫn; relativize tìm đường đi từ cái này tới cái kia; normalize dọn . và ..
`a.resolve(b)` nối b vào sau a. Nếu b là đường dẫn tuyệt đối thì kết quả chính là b. `resolveSibling` thay phần tên cuối. `a.relativize(b)` cho đường dẫn tương đối đi từ a tới b; cả hai phải cùng tuyệt đối hoặc cùng tương đối, nếu không ném `IllegalArgumentException`.
`normalize()` bỏ các `.` và triệt tiêu `..` với tên đứng trước nó. Nó chỉ xử lý chuỗi, không kiểm tra tệp có tồn tại không. `toRealPath()` thì có truy cập hệ thống tệp và ném `IOException` nếu đường dẫn không tồn tại.
```

base.resolve("/tmp/x");        // /tmp/x

Path.of("a").resolve("../b").normalize();                             // b
```
@Kiểm tra, tạo, sao chép, di chuyển, xoá|Phần lớn phương thức của Files ném IOException, một checked exception.
Kiểm tra: `Files.exists`, `isDirectory`, `isRegularFile`. Tạo thư mục: `createDirectory` cần thư mục cha đã tồn tại (thiếu thì ném `NoSuchFileException`), còn `createDirectories` tạo luôn cả chuỗi thư mục cha.
`Files.copy(nguồn, đích)` và `Files.move(nguồn, đích)` ném `FileAlreadyExistsException` nếu đích đã có, trừ khi thêm `StandardCopyOption.REPLACE_EXISTING`. Sao chép thư mục chỉ tạo thư mục rỗng, không kèm nội dung bên trong. `Files.delete` ném `NoSuchFileException` nếu không có tệp, còn `deleteIfExists` trả về boolean. Xoá thư mục còn chứa tệp ném `DirectoryNotEmptyException`.
```

Path a = Files.writeString(dir.resolve("a.txt"), "hi");

Files.copy(a, dir.resolve("b.txt"), StandardCopyOption.REPLACE_EXISTING);   // ghi đè
Files.deleteIfExists(a);    // true
Files.deleteIfExists(a);    // false
```
!Gọi `p.resolve("x");` hay `p.normalize();` mà không gán kết quả thì p vẫn như cũ. Path bất biến giống String.

~I/O stream là dòng dữ liệu chảy qua chương trình, chia thành dòng byte và dòng ký tự. Tên lớp cho bạn biết nó thuộc loại nào và bọc được cái gì.
@Byte stream và character stream|Tên kết thúc bằng InputStream hoặc OutputStream là dòng byte; kết thúc bằng Reader hoặc Writer là dòng ký tự.
Dòng byte: `FileInputStream`, `FileOutputStream`, `BufferedInputStream`, `ObjectInputStream`. Dòng ký tự: `FileReader`, `FileWriter`, `BufferedReader`, `BufferedWriter`, `PrintWriter`. Hai lớp cầu nối `InputStreamReader` và `OutputStreamWriter` biến dòng byte thành dòng ký tự.
Lớp bọc chỉ nhận đúng loại của nó: lớp Buffered cho byte bọc dòng byte, lớp Buffered cho ký tự bọc dòng ký tự. Trộn hai loại là lỗi biên dịch.
```
new BufferedReader(new FileReader("x.txt"));              // hợp lệ: ký tự bọc ký tự
new BufferedInputStream(new FileInputStream("x.txt"));    // hợp lệ: byte bọc byte
new InputStreamReader(new FileInputStream("x.txt"));      // hợp lệ: cầu nối byte sang ký tự
new BufferedWriter(new FileOutputStream("y.txt"));        // KHÔNG biên dịch: Writer bọc OutputStream
```
@Đọc và ghi|read() trả -1 khi hết dữ liệu; readLine() trả null khi hết dòng.
`read()` trả về một `int`: giá trị byte hoặc ký tự, hoặc `-1` khi hết. `BufferedReader.readLine()` trả từng dòng không kèm ký tự xuống dòng, hết thì trả `null`. `BufferedWriter.newLine()` ghi ký tự xuống dòng của hệ điều hành. `skip(n)` bỏ qua n đơn vị. `mark(giới hạn)` đánh dấu vị trí, `reset()` quay lại đó; chỉ dùng khi `markSupported()` trả true. `transferTo(đích)` chép toàn bộ phần còn lại sang đích.
`PrintWriter` và `PrintStream` có `print`, `println`, `printf`, và không ném `IOException`.

try (BufferedReader r = Files.newBufferedReader(path)) {
    String line;
    while ((line = r.readLine()) != null) { /* xử lý từng dòng */ }

```
@Các phương thức tiện lợi của Files|readAllLines nạp hết vào bộ nhớ; lines đọc lười và phải được đóng.
`Files.readString(path)` và `Files.writeString(path, chuỗi)` làm việc với cả tệp trong một lời gọi. `Files.readAllLines(path)` trả `List<String>`. `Files.lines(path)` trả `Stream<String>` đọc dần từng dòng, nên dùng trong try-with-resources để đóng tệp. `Files.newBufferedReader` và `newBufferedWriter` trả về lớp Buffered tương ứng. `Files.readAllBytes` và `Files.write` làm việc với mảng byte.

    s.filter(x -> x.startsWith("t")).count();       // 2
}

~Tuần tự hoá biến đối tượng thành dòng byte và ngược lại, với những quy tắc riêng về constructor. Phần sau là ba cách nói chuyện với người dùng qua bàn phím: System.in, Console và lớp IO mới.
@Serializable và transient|Chỉ đối tượng của lớp Serializable mới ghi được; trường transient và trường static không được ghi.
`Serializable` là interface đánh dấu, không có phương thức nào. Ghi bằng `ObjectOutputStream.writeObject(đốiTượng)`, đọc bằng `ObjectInputStream.readObject()`, phương thức này trả `Object` và khai báo thêm checked exception `ClassNotFoundException`.
Trường `transient` bị bỏ qua khi ghi; khi đọc lại nó mang giá trị mặc định của kiểu (`0`, `false`, `null`), không phải giá trị khởi tạo viết trong lớp. Trường `static` thuộc về lớp nên cũng không được ghi. Mọi trường instance còn lại phải Serializable; gặp một trường không Serializable, `writeObject` ném `NotSerializableException` lúc chạy. `serialVersionUID` là số phiên bản của lớp, nên khai báo tường minh.
```
static class Zebra implements Serializable {
    private static final long serialVersionUID = 1L;
    String name = "none";
    transient int age = 5;     // không được ghi; đọc lại sẽ là 0
    static int count = 1;      // không được ghi
}
```
@Constructor khi đọc lại đối tượng|Khi đọc lại, constructor và bộ khởi tạo của lớp Serializable không chạy.
Java dựng lại đối tượng từ dữ liệu đã ghi mà không gọi constructor, không chạy khối khởi tạo hay giá trị khởi tạo trường của các lớp Serializable. Ngoại lệ: nếu có lớp cha không Serializable, constructor không tham số của lớp cha gần nhất không Serializable sẽ được gọi, và các trường của lớp cha đó nhận giá trị do constructor ấy đặt chứ không phải giá trị lúc ghi.
Record thì khác: record Serializable luôn được dựng lại qua constructor chính tắc của nó, nên mọi kiểm tra trong đó vẫn chạy.
```
static class Animal { String kind = "animal"; Animal() { kind = "reset"; } }
static class Dog extends Animal implements Serializable { String name = "Rex"; }
// Ghi một Dog có kind = "dog", name = "Max", rồi đọc lại:
// kind = "reset" (constructor của Animal chạy), name = "Max" (lấy từ dữ liệu đã ghi)
```
@Console|System.console() trả null khi chương trình không gắn với thiết bị đầu cuối.
`System.console()` trả về đối tượng `Console` duy nhất, hoặc `null` nếu đầu vào hay đầu ra bị chuyển hướng, nên luôn phải kiểm tra null. `readLine()` trả `String`. `readPassword()` không hiện ký tự gõ vào và trả `char[]`, để có thể xoá mật khẩu khỏi bộ nhớ sau khi dùng. `printf` và `format` in có định dạng; `writer()` trả `PrintWriter`, `reader()` trả `Reader`.
Java 23 thêm các bản nhận `Locale` làm tham số đầu: `printf(Locale, mẫu, ...)`, `format(Locale, mẫu, ...)`, `readLine(Locale, mẫu, ...)`, `readPassword(Locale, mẫu, ...)`. Nhờ đó lời nhắc và số liệu được định dạng theo Locale chỉ định thay vì Locale mặc định.

    c.printf(Locale.FRANCE, "%.2f%n", 3.14159);          // 3,14
    String name = c.readLine(Locale.FRANCE, "Nom: ");
    char[] pw = c.readPassword("Mot de passe: ");

```
@Lớp java.lang.IO (Java 25)|IO có đúng năm phương thức static: print, hai bản println và hai bản readln.
`IO.print(Object)`, `IO.println(Object)`, `IO.println()`, `IO.readln()`, `IO.readln(String lờiNhắc)`. Lớp nằm trong `java.lang` nên dùng được ở mọi nơi không cần import. Nó làm việc trên `System.in` và `System.out`, nên vẫn chạy được khi chương trình bị chuyển hướng, khác với `Console`.
`readln` trả về một dòng không kèm ký tự xuống dòng, hoặc `null` khi hết dữ liệu đầu vào. Các phương thức này không khai báo checked exception. `IO` không có `printf` và không có phương thức đọc số: muốn có số thì tự chuyển bằng `Integer.parseInt`.
```

    int age = Integer.parseInt(s);
    IO.println("Sang năm bạn " + (age + 1) + " tuổi");
}
```

##40
~Phần còn lại của NIO.2: đọc thuộc tính tệp và duyệt cây thư mục bằng stream. Điểm chung cần nhớ là các stream này giữ tài nguyên của hệ điều hành và phải được đóng.
@Thuộc tính tệp|Đọc nhiều thuộc tính thì gom một lần bằng readAttributes thay vì gọi lẻ từng phương thức.
Các phương thức lẻ: `Files.isDirectory`, `isRegularFile`, `isSymbolicLink`, `isHidden`, `isReadable`, `isWritable`, `size`, `getLastModifiedTime`. Mỗi lời gọi là một lần hỏi hệ thống tệp.
`Files.readAttributes(path, BasicFileAttributes.class)` đọc một lượt và trả về đối tượng chỉ đọc có `size()`, `isDirectory()`, `isRegularFile()`, `isSymbolicLink()`, `creationTime()`, `lastModifiedTime()`. Muốn sửa thuộc tính thì lấy `BasicFileAttributeView` bằng `Files.getFileAttributeView` rồi gọi `setTimes`.
```
BasicFileAttributes at = Files.readAttributes(f, BasicFileAttributes.class);
at.size();             // số byte
at.isRegularFile();    // true với tệp thường
```
@Files.list và Files.walk|list chỉ nhìn một cấp; walk đi hết cây theo chiều sâu và tính cả điểm xuất phát.
`Files.list(dir)` trả `Stream<Path>` gồm các mục con trực tiếp của thư mục; gọi trên một tệp thường thì ném `NotDirectoryException`. `Files.walk(start)` duyệt toàn bộ cây bên dưới, phần tử đầu tiên là chính `start`; gọi trên một tệp thường thì stream chỉ có đúng tệp đó. `Files.walk(start, độSâu)` giới hạn số cấp: độ sâu 0 chỉ có `start`, độ sâu 1 thêm các mục con trực tiếp.
Mặc định `walk` không đi theo symbolic link. Thêm `FileVisitOption.FOLLOW_LINKS` thì có, và nếu liên kết tạo thành vòng lặp nó ném `FileSystemLoopException`.
```
// Cây: root/a/x.txt, root/a/b/y.txt, root/z.log
Files.list(root).count();       // 2: a và z.log
Files.walk(root).count();       // 6: root, a, a/b, a/x.txt, a/b/y.txt, z.log
Files.walk(root, 1).count();    // 3: root, a, z.log

Biến và pattern không tên (Java 22): dấu `_` cho biến cục bộ, tham số catch, tham số lambda, biến pattern mà bạn không dùng tới. Import module (Java 25): `import module java.base;` lấy mọi package module đó export. Compact source file (Java 25): tệp chỉ có phương thức và trường, không cần khai báo lớp, tự động import java.base. Instance main (Java 25): `void main()` không cần public, static hay tham số. Flexible constructor bodies (Java 25): được viết câu lệnh trước `super(...)` hoặc `this(...)`, miễn là không dùng tới đối tượng đang tạo.

~Bài cuối không có kiến thức mới. Nó nói về cách đọc một câu hỏi có code, cách chia 120 phút, và mười cái bẫy đã gặp rải rác trong 41 bài trước.
@Trình tự đọc một câu có code|Tìm lỗi biên dịch trước, rồi ngoại lệ lúc chạy, cuối cùng mới tính kết quả in ra.
Nhìn các đáp án trước khi đọc code. Nếu có đáp án "không biên dịch", hãy rà lỗi biên dịch trước tiên: biến ngoài phạm vi, biến cục bộ chưa gán, kiểu không tương thích, checked exception chưa xử lý, mã không tới được, modifier sai chỗ. Chỉ khi chắc chắn mã biên dịch được mới chuyển sang tìm ngoại lệ lúc chạy, rồi mới lần theo giá trị từng biến.
Khi lần theo giá trị, viết ra giấy nháp trạng thái của từng biến sau mỗi dòng. Đừng tính nhẩm với các biểu thức có `++`, nối chuỗi hay vòng lặp lồng nhau.
```
int total = 0;
for (int i = 0; i < 3; i++) {
    int step = i * 2;
    total += step;
}
System.out.println(total + step);   // step đã ra khỏi phạm vi: lỗi biên dịch, không cần tính gì thêm
```
@Câu chọn nhiều đáp án|Đề luôn cho biết phải chọn mấy đáp án; hãy xét từng phương án như một câu đúng sai riêng.
Với câu yêu cầu chọn hai hoặc ba, đừng tìm "cặp hợp nhau" mà đánh giá độc lập từng phương án là đúng hay sai. Nếu số phương án bạn cho là đúng không khớp với số đề yêu cầu, bạn đã hiểu sai ít nhất một phương án: đọc lại những phương án có từ tuyệt đối như "luôn", "không bao giờ", "bắt buộc".
Trong ứng dụng này, câu chọn nhiều đáp án chỉ được tính đúng khi chọn đúng toàn bộ.
@Quản lý 120 phút|Trung bình 2,4 phút mỗi câu; câu nào quá ba phút thì đánh dấu và đi tiếp.

record Num(int v) implements Expr { }
record Add(Expr l, Expr r) implements Expr { }

function parseContent(txt){

      else{L=LES[+id];L.has=true}

    else if(c==='@'){const j=r.indexOf('|');con={t:j<0?r:r.slice(0,j),s:j<0?'':r.slice(j+1),parts:[]};L.con.push(con);q=null}
    else if(c==='='){const j=r.indexOf('|'),t={t:r.slice(0,j),m:r.slice(j+1),L:L.n,key:`t:${L.n}:${L.terms.length}`};L.terms.push(t);TERMS.push(t);TK[t.key]=t}
    else if(c==='?'){let i=0,held=false,nw=false,grp=L.grp;
      while(r[i]==='*'||r[i]==='^'){if(r[i]==='*')held=true;else nw=true;i++}
      if(r[i]==='{'){grp=r[i+1];i+=3}
      const j=r.indexOf('|',i);q={tag:r.slice(i,j),text:r.slice(j+1),code:null,opts:[],exp:'',held,nw,L:L.n,grp,key:`q:${L.n}:${L.qs.length}`};L.qs.push(q);QK[q.key]=q;con=null}
    else if((c==='+'||c==='-')&&ln[1]===' '&&q)q.opts.push({t:ln.slice(2),ok:c==='+'});
    else if(c==='>'&&q)q.exp=r;
    else if(c==='%')continue;
    else if(c==='!'&&con)con.parts.push({tip:r});
    else if(con)con.parts.push({p:ln});
  }
}

let QZ=null;
const clock=s=>{s=Math.max(0,s);return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};
const grade=(q,a)=>q.kind==='multi'?!!a&&a.length===q.a.length&&q.a.every(x=>a.includes(x)):a===q.a;
const answered=(q,a)=>q.kind==='multi'?!!a&&a.length>0:a!=null;
function startQuiz(title,qs,opt={}){
  qs=qs.filter(Boolean);if(!qs.length){toast('Chưa có câu hỏi cho phần này. Hãy học thêm bài hoặc đổi phạm vi luyện tập.');return}
  if(QZ)clearInterval(QZ.timer);QZ={title,qs,i:0,ans:[],res:[],flag:{},opt,left:opt.limit||0,shown:false,flip:false};
  if(opt.limit)QZ.timer=setInterval(()=>{QZ.left--;const e=$('#qtime');if(e)e.textContent=clock(QZ.left);if(QZ.left<=0)finishQuiz()},1000);
  $('#quiz').classList.add('on');drawQ(true);
}
function drawQ(top){
  const z=QZ,q=z.qs[z.i],show=z.shown,ex=z.opt.exam,a=z.ans[z.i],last=z.i+1>=z.qs.length;let body='',fb='';
  if(q.kind==='flash')body=`<div class="flash">${q.front}${z.flip?`<div class="fback">${q.back}</div>`:''}</div>`+(z.flip?'<div class="row"><button class="btn line" data-act="fno">Chưa nhớ</button><button class="btn" data-act="fyes">Đã nhớ</button></div>':'<button class="btn wide" data-act="flip">Lật thẻ</button>');
  else{
    const multi=q.kind==='multi',sel=multi?(a||[]):(a==null?[]:[a]),okS=multi?q.a:[q.a];
    body=(multi&&!/\(Chọn \d+\)/.test(q.html)?`<p class="mute">Câu này có ${q.a.length} đáp án đúng. Chọn đủ ${q.a.length}.</p>`:'')+
      `<div class="opts">${q.opts.map((o,i)=>`<button class="opt${!show&&sel.includes(i)?' sel':''}${show&&okS.includes(i)?' ok':''}${show&&sel.includes(i)&&!okS.includes(i)?' no':''}" data-act="pick" data-i="${i}" ${show?'disabled':''}><span class="on">${LET[i]}</span><span>${md(o)}</span></button>`).join('')}</div>`;
    if(!show&&!ex&&multi)body+=`<div class="row"><button class="btn" data-act="mcheck" ${sel.length===q.a.length?'':'disabled'}>Kiểm tra</button></div>`;
  }
  if(show){const ok=z.res[z.i];
    fb=`<div class="fb ${ok?'good':'bad'}"><b>${ok?'Đúng':'Chưa đúng'}</b>${q.exp?`<p>${q.exp}</p>`:''}</div><button class="btn wide" data-act="qnext">${last?'Xem kết quả':'Câu tiếp theo'}</button>`}
  if(ex)fb=`<div class="row"><button class="btn line" data-act="qprev" ${z.i?'':'disabled'}>Câu trước</button><button class="btn line" data-act="qflag">${z.flag[z.i]?'Bỏ đánh dấu':'Đánh dấu xem lại'}</button>${last?'':'<button class="btn" data-act="qfwd">Câu tiếp</button>'}<button class="btn${last?'':' line'}" data-act="qsubmit">Nộp bài</button></div>
    <div class="qnav" aria-label="Danh sách câu">${z.qs.map((x,i)=>`<button class="${answered(x,z.ans[i])?'did':''}${z.flag[i]?' flag':''}${i===z.i?' cur':''}" data-act="qgo" data-i="${i}" aria-label="Câu ${i+1}">${i+1}</button>`).join('')}</div>
    <p class="mute">Ô tô màu là câu đã trả lời, ô viền cam là câu đánh dấu xem lại.</p>`;
  $('#quiz').innerHTML=`<div class="qwrap"><header class="qhead"><button class="x" data-act="qclose" aria-label="Thoát">×</button><b>${esc(z.title)}</b><span>${z.opt.limit?`<span id="qtime" class="mono">${clock(z.left)}</span>, `:''}câu ${z.i+1}/${z.qs.length}</span></header>
  <div class="qbar"><i style="width:${(ex?z.qs.filter((x,i)=>answered(x,z.ans[i])).length:z.i)/z.qs.length*100}%"></i></div><p class="qtag">${esc(q.tag)}</p>${q.nw?' <span class="newtag">Mới từ Java 22–25</span>':''}${q.html?`<div class="qtext">${q.html}</div>`:''}${body}${fb}</div>`;
  if(top)$('#quiz').scrollTop=0;
}
function answer(val,ok){const z=QZ;z.ans[z.i]=val;z.res[z.i]=ok;z.shown=true;drawQ()}
function nextQ(){const z=QZ;z.shown=false;z.flip=false;if(++z.i>=z.qs.length)finishQuiz();else drawQ(true)}
function revItem(q,a){
  const h=`<div class="rev"><p class="qtag">${esc(q.tag)}</p>`;
  if(q.kind==='flash')return h+q.front+q.back+'</div>';
  const pick=q.kind==='multi'?(a||[]):(a==null?[]:[a]),ok=q.kind==='multi'?q.a:[q.a],f=s=>s.map(i=>`${LET[i]}. ${md(q.opts[i])}`).join('<br>');
  return h+`<div class="qtext">${q.html}</div><p>Bạn chọn:<br><span class="no">${pick.length?f(pick):'(bỏ trống)'}</span></p><p>Đáp án:<br><span class="ok">${f(ok)}</span></p>${q.exp?`<p class="mute">${q.exp}</p>`:''}</div>`;
}
function finishQuiz(){
  const z=QZ;clearInterval(z.timer);closeModal();const p=P();let ok=0;
  if(z.opt.exam)z.qs.forEach((q,i)=>z.res[i]=grade(q,z.ans[i]));
  z.qs.forEach((q,i)=>{const r=z.res[i]===true;if(r)ok++;
    if(q.key){if(r){if(p.wrong[q.key]&&--p.wrong[q.key]<=0)delete p.wrong[q.key]}else p.wrong[q.key]=(p.wrong[q.key]||0)+1}});
  p.act[today()]=1;
  const pct=Math.round(ok/z.qs.length*100),pass=pct>=PASS;
  if(z.opt.exam)(p.exams=p.exams||{})[z.opt.no]={d:today(),pct,ok,n:z.qs.length,pass};
  save();if(z.opt.done)z.opt.done(pct);
  let grp='';
  if(z.opt.exam){const g={};z.qs.forEach((q,i)=>{const k=q.grp||'O';(g[k]=g[k]||[0,0])[1]++;if(z.res[i])g[k][0]++});
    grp=`<div class="tbw"><table class="tb"><tr><th>Nhóm mục tiêu</th><th>Số câu đúng</th></tr>${Object.keys(g).map(k=>`<tr><td>${GRP[k]}</td><td>${g[k][0]}/${g[k][1]}</td></tr>`).join('')}</table></div>`}
  const bad=z.qs.map((q,i)=>z.res[i]===true?'':revItem(q,z.ans[i])).join('');
  $('#quiz').innerHTML=`<div class="qwrap"><header class="qhead"><button class="x" data-act="qclose" aria-label="Đóng">×</button><b>${esc(z.title)}</b><span></span></header>
  <div class="result"><div class="stamp big ${pass?'':'fail'}">${pass?'ĐẠT':'LẠI'}</div><h2 style="justify-content:center">${ok}/${z.qs.length} câu đúng (${pct}%)</h2>
  <p>${z.opt.exam?`Ngưỡng đỗ của đề 1Z0-831 là ${PASS}%. ${pass?'Bạn đã vượt ngưỡng ở lượt này.':'Lượt này chưa đạt. Xem lại các câu sai bên dưới, chúng đã được ghi vào Sổ lỗi.'}`:pct>=85?'Rất tốt. Bạn đã nắm chắc phần này.':pass?`Đạt ngưỡng ${PASS}%. Xem lại các câu sai bên dưới trước khi học tiếp.`:`Chưa đạt ${PASS}%. Đọc lại lý thuyết rồi làm lại nhé.`}</p></div>
  ${grp}${bad?'<h3>Câu cần xem lại</h3>'+bad:''}<div class="row"><button class="btn" data-act="qclose">Xong</button></div></div>`;
  $('#quiz').scrollTop=0;z.fin=true;
}
function closeQuiz(){if(QZ)clearInterval(QZ.timer);closeModal();$('#quiz').classList.remove('on');$('#quiz').innerHTML='';QZ=null;render(true)}

/* ================= Đề thi thử ================= */
function startExam(no,cb){
  const fixed=no>0&&EXAMS[no],qs=(fixed?shuf(EXAMS[no].qs):shuf(pool(allLessons(),true)).slice(0,50)).map(mkQ);
  if(!qs.length){toast('Chưa có câu hỏi để dựng đề.');return}
  const min=fixed?120:Math.max(5,Math.ceil(qs.length*2.4));
  openModal(`<h3>${fixed?'Đề thi thử số '+no:'Đề ngẫu nhiên'}</h3><p>${qs.length} câu trong ${min} phút. Không hiện đáp án giữa chừng. Bạn có thể quay lại câu trước, đánh dấu câu để xem lại và nộp bài bất cứ lúc nào. Hết giờ bài tự nộp.</p>
  <div class="row"><button class="btn" data-act="exgo">Bắt đầu làm bài</button></div>`);
  startExam.go=()=>{closeModal();startQuiz(fixed?'Đề thi thử số '+no:'Đề ngẫu nhiên',qs,{exam:true,no:fixed?no:0,limit:min*60,done:cb})};
}

/* ================= Luyện tập tự do ================= */
const PR=[['tf','Thẻ thuật ngữ','Lật thẻ, tự chấm đã nhớ hay chưa. 20 thẻ mỗi lượt.'],['tq','Trắc nghiệm thuật ngữ','Ghép khái niệm với mô tả. 15 câu.'],
 ['cq','Đọc code','Đoán kết quả hoặc tìm dòng lỗi biên dịch. 10 câu.'],['lq','Câu hỏi quy tắc','Câu hỏi không kèm code, kể cả câu chọn nhiều đáp án. 10 câu.'],
 ['nw','Điểm mới Java 22–25','Chỉ những câu về tính năng có sau Java 21. 10 câu.']];
function practice(m){
  const p=P(),tn=todayN(),ls=allLessons().filter(l=>p.scope==='all'||dayOf(l.n)<=tn),S=(a,n)=>shuf(a).slice(0,n);
  const qs=ls.flatMap(l=>l.qs.filter(q=>!q.held||p.scope==='all'||isDone(l.w*7))),ts=ls.flatMap(l=>l.terms);
  const out=m==='tf'?S(ts,20).map(fT):m==='tq'?S(ts,15).map(t=>qTerm(t)):m==='cq'?S(qs.filter(q=>q.code),10).map(mkQ):m==='lq'?S(qs.filter(q=>!q.code),10).map(mkQ):S(qs.filter(q=>q.nw),10).map(mkQ);
  startQuiz(PR.find(x=>x[0]===m)[1],out);
}

const NAV=[['','Hôm nay','now'],['plan','Lộ trình','map'],['prac','Luyện tập','run'],['exam','Đề thi','831'],['ref','Sổ tay','doc'],['set','Cài đặt','cfg']];
const stamp=(on,cls='')=>on?`<span class="stamp ${cls}" title="Đã xong">OK</span>`:'';

const dayGlyph=d=>d.type==='review'?'test':d.type==='mock'?'đề '+d.exam:d.type==='final'?'ôn':d.les.g;
const dayLabel=d=>d.type==='review'?'Kiểm tra tuần '+d.w:d.type==='mock'?'Đề thi thử số '+d.exam:d.type==='final'?'Tổng ôn':d.les.title;
const HELLO='void main() {\n    IO.println("Xin chào, OCP 25!");\n}';

  <p>Mỗi ngày một bài cho đề 1Z0-831: lý thuyết kèm code, thuật ngữ cần nhớ và bài tập đúng kiểu đề thi. Cuối mỗi tuần có bài kiểm tra, tuần cuối dành cho luyện đề.</p>
  <label>Tên của bạn<input id="o-name" placeholder="Ví dụ: Minh" autocomplete="off"></label>

}
function cell(n,tn){
  if(n<1||n>TOTAL)return '<span></span>';
  const d=D(n);return `<a class="cell ${d.type}${n===tn?' today':''}${avail(n)?'':' off'}${d.les&&d.les.isNew?' nw':''}" href="#/day/${n}" title="Ngày ${n}: ${esc(dayLabel(d))}"><small>${n}</small><b>${esc(dayGlyph(d))}</b><small>${fmt(dayDate(n))}</small>${stamp(isDone(n))}</a>`;
}
function home(){
  const p=P(),n=todayN(),d=D(n),fu=firstUndone(n),ss=secs(d),x=p.done[n]||{},wk=n-d.dow,end=dayDate(TOTAL),left=diff(today(),iso(end));

  <a class="btn" href="#/day/${n}">${isDone(n)?'Xem lại bài hôm nay':'Học bài hôm nay'}</a></div></section>

  ${ok?`<ul class="todo">${ss.map(s=>`<li class="${x[s]!=null?'done':''}"><a href="#/day/${n}">${d.type==='lesson'?SECN[s]:dayLabel(d)}</a><span>${x[s]!=null?(s==='l'?'đã đọc':x[s]+'%'):'chưa làm'}</span></li>`).join('')}</ul>`:'<p class="mute">Bài của ngày này chưa có nội dung chi tiết trong bản hiện tại. Bạn có thể ôn lại các bài đã có ở mục Luyện tập.</p>'}</section>
  <section class="sec"><h2>Tuần này</h2><div class="grid7">${[0,1,2,3,4,5,6].map(i=>cell(wk+i,n)).join('')}</div></section>
  <section class="sec"><h2>Tiến độ</h2><p class="mute">${doneCount}/${TOTAL} ngày đã hoàn thành, chuỗi học liên tục ${streak()} ngày, <a href="#/wrong">${Object.keys(p.wrong).length} mục trong sổ lỗi</a>.</p>
  <div class="pbar"><span>Lộ trình</span><div><i style="width:${doneCount/TOTAL*100}%"></i></div><span>${doneCount}/${TOTAL}</span></div></section>`;
}
function plan(){
  const tn=todayN(),nl=allLessons().length;let n=1,h=`<h1>Lộ trình 8 tuần</h1><p class="lead">Mỗi ô là một ngày. Sáu ngày bài mới, ngày thứ bảy kiểm tra tuần, tuần cuối luyện đề. Ô có góc cam là bài chứa điểm mới của Java 22–25. Ô được đóng dấu OK khi bạn làm xong mọi phần của ngày đó.</p>
  ${nl<NLES?`<p class="note">Bản này đã có nội dung chi tiết cho ${nl}/${NLES} bài. Các ô mờ mới có dàn ý, phần lý thuyết và bài tập sẽ được bổ sung theo từng tuần.</p>`:''}`;
  for(const w of WKS){
    h+=`<section class="sec"><h2>Tuần ${w.w}: ${esc(w.title)}</h2><p>${esc(w.desc)}</p><div class="wk"><span class="wkl">Tuần ${w.w}<small>${fmt(dayDate(n))}–${fmt(dayDate(n+6))}</small></span><div class="grid7">${[0,1,2,3,4,5,6].map(i=>cell(n+i,tn)).join('')}</div></div>
    <ul class="outl">${w.ls.map(L=>`<li><a href="#/day/${dayOf(L)}">Bài ${L}</a><span>${esc(LES[L].title)}</span>${LES[L].isNew?'<small>có điểm mới</small>':''}</li>`).join('')}</ul></section>`;n+=7;
  }
  h+=`<section class="sec"><h2>Tuần 8: Luyện đề</h2><p>Ba đề thi thử 50 câu trong 120 phút như đề thật, xen kẽ các ngày tổng ôn và chữa lỗi.</p><div class="wk"><span class="wkl">Tuần 8<small>${fmt(dayDate(50))}–${fmt(dayDate(56))}</small></span><div class="grid7">${[0,1,2,3,4,5,6].map(i=>cell(50+i,tn)).join('')}</div></div></section>`;
  return h;

const conCard=c=>`<article class="gcard"><h3>${md(c.t)}</h3><p class="gm">${md(c.s)}</p>${c.parts.map(p=>p.c!=null?codeBox(p.c):p.tip?`<p class="tip">${md(p.tip)}</p>`:`<p>${md(p.p)}</p>`).join('')}</article>`;
function day(n){
  n=Math.max(1,Math.min(TOTAL,n));const d=D(n),x=P().done[n]||{},dt=dayDate(n);
  const qb=(s,label)=>`<div class="row"><button class="btn${x[s]!=null?' line':''}" data-act="quiz" data-n="${n}" data-sec="${s}">${label}</button>${x[s]!=null?`<span class="mute">Lần gần nhất: ${x[s]}%</span>`:''}</div>`;
  let h=`<p class="crumb"><a href="#/plan">Lộ trình</a> / Tuần ${d.w}</p><h1>Ngày ${n}: ${esc(dayLabel(d))} ${stamp(isDone(n))}</h1><p class="mute">${DOW[dt.getDay()]}, ${fmtY(dt)}${d.type==='lesson'&&d.les.has?', khoảng 60 đến 80 phút':''}</p>`;
  if(d.type==='lesson'){const l=d.les;
    h+=`<p class="chips"><span>Bài ${l.n}/${NLES}</span><span>${GRP[l.grp]}</span>${l.isNew?'<span class="new">Có điểm mới Java 22–25</span>':''}</p>`;

    else{
      h+=`<p class="lead">${md(l.intro)}</p>`;
      if(prevLessons(l.n).length)h+=`<section class="sec"><h2>Ôn bài cũ ${stamp(x.r!=null,'sm')}</h2><p>10 câu lấy từ các bài cách đây 1, 2, 4, 7, 14 và 30 bài, cộng với những câu bạn từng làm sai.</p>${qb('r','Ôn bài cũ')}</section>`;

      <section class="sec"><h2>Ghi nhớ nhanh ${stamp(x.k!=null,'sm')}</h2><p class="mute">${l.terms.length} khái niệm của bài.</p><label class="chk"><input type="checkbox" data-act="hide"> Che mô tả để tự kiểm tra (bấm vào từng dòng để hiện)</label>
      <ul class="vlist">${l.terms.map(t=>`<li data-act="reveal"><span class="mono">${esc(t.t)}</span><span class="vm">${esc(t.m)}</span></li>`).join('')}</ul>${qb('k','Luyện thuật ngữ')}</section>
      <section class="sec"><h2>Bài tập ${stamp(x.q!=null,'sm')}</h2><p>${pool([l],false).length} câu theo kiểu đề 1Z0-831: đoán kết quả, tìm dòng không biên dịch và câu chọn nhiều đáp án. Mọi đoạn code trong bài đã được chạy thử trên JDK 25. Còn ${l.qs.filter(q=>q.held).length} câu của bài này được giữ lại cho bài kiểm tra cuối tuần.</p>${qb('q','Làm bài tập')}</section>`;
    }
  }else if(d.type==='review'){
    const ls=weekLessons(d.w);

let lastHash=null;

  const app=$('#app');

  app.innerHTML=`<nav class="nav" aria-label="Điều hướng"><a class="brand" href="#/"><span class="mono">OCP 25</span>Java SE 25 Developer</a>${NAV.map(([h,t,g])=>`<a href="#/${h}" class="${(r||'')===h||(h==='plan'&&r==='day')||(h==='prac'&&r==='wrong')?'on':''}"><span class="mono">${g}</span>${t}</a>`).join('')}</nav>
  <main>${LS.ok?'':'<p class="note">Trình duyệt đang chặn lưu trữ ở chế độ xem này nên tiến độ có thể mất khi đóng trang. Hãy tải bản sao lưu trong mục Cài đặt sau mỗi buổi học.</p>'}${v}</main>`;

async function exportData(){
  const data=JSON.stringify(DB),filename='ocp-java25-sao-luu.json';

  try{const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));l.download=filename;l.click();toast('Đã tải bản sao lưu.')}
  catch(e){toast('Không tải được tệp ở chế độ xem này.')}
}
