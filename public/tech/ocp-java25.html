<style>

 --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;--ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--paper:#10171F;--card:#18212C;--ink:#E6ECF2;--mute:#97A5B3;--line:#2A3747;--grid:#3D5878;--ai:#8FB6F0;--ai-soft:#1C2B43;--shu:#F2985A;--shu-soft:#3A2617;--hl:#574C12;--ok:#5CC79B;--ok-soft:#173529;--code:#121A24}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}

.mono,code,pre{font-family:var(--mono)}
code{font-size:.88em;background:var(--ai-soft);color:var(--ai);padding:.08em .35em;border-radius:4px;overflow-wrap:anywhere}
a{color:var(--ai)}
h1{font-size:1.75rem;line-height:1.25;margin:.2em 0 .3em;letter-spacing:-.01em}

p{margin:.4em 0 .8em;max-width:70ch}

#app{display:grid;grid-template-columns:214px minmax(0,1fr);min-height:100vh}

.onb{max-width:480px;margin:0 auto;padding:7vh 20px;grid-column:1/-1}

input:not([type=checkbox]),select{display:block;width:100%;margin-top:4px;padding:10px 12px;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:8px}

.btn.line{background:transparent;color:var(--ai)}.btn.sm{padding:6px 12px;font-size:.88rem}.btn.wide{width:100%;margin-top:10px}

.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0}
.note{background:var(--shu-soft);border-left:4px solid var(--shu);padding:10px 14px;border-radius:0 8px 8px 0;max-width:none}

.hero{display:flex;gap:28px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.tile{width:clamp(96px,20vw,136px);aspect-ratio:1;border:1.5px solid var(--grid);background:var(--card);display:grid;place-items:center;font:600 clamp(1.3rem,4.6vw,2rem) var(--mono);color:var(--shu);position:relative}
.tile::before,.tile::after{content:"";position:absolute;background:var(--grid);opacity:.55}
.tile::before{left:0;right:0;top:50%;height:1px}.tile::after{top:0;bottom:0;left:50%;width:1px}

.stamp.sm{font-size:.72rem}.stamp.big{width:5.4rem;height:5.4rem;font-size:1.25rem;border-width:3px;margin:10px auto}
.stamp.fail{border-color:var(--mute);color:var(--mute)}
.todo,.outl,.vlist{list-style:none;padding:0;margin:10px 0}
.todo li,.outl li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:9px 2px;border-bottom:1px dashed var(--line)}
.todo li.done a{color:var(--mute);text-decoration:line-through}.todo span{color:var(--mute);font-size:.9rem}
.outl li>span{flex:1;color:var(--mute)}.outl li>b{min-width:9em}.outl small{color:var(--shu);white-space:nowrap}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));flex:1}
.cell{aspect-ratio:1;border:1.5px solid var(--grid);margin:0 -1.5px -1.5px 0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:3px;text-decoration:none;color:var(--ink);background:var(--card);position:relative;min-width:0;overflow:hidden}
.cell small{font-size:.62rem;color:var(--mute);line-height:1.2}.cell b{font:600 clamp(.62rem,2.3vw,1.02rem)/1 var(--mono);opacity:.9;white-space:nowrap}
.cell.review b,.cell.mock b,.cell.final b{color:var(--ai)}
.cell.off{background:transparent}.cell.off b{opacity:.45}
.cell.nw::after{content:"";position:absolute;top:0;right:0;border:6px solid var(--shu);border-left-color:transparent;border-bottom-color:transparent}
.cell.today{outline:3px solid var(--ai);outline-offset:-3px;z-index:1}
.cell .stamp{position:absolute;inset:0;margin:auto;width:70%;height:70%;font-size:clamp(.7rem,2.4vw,1.05rem);background:color-mix(in srgb,var(--card) 72%,transparent)}
.wk{display:flex;align-items:center;gap:10px;margin-bottom:1.5px}.wkl{width:74px;flex:none;font-weight:600;font-size:.85rem}.wkl small{display:block;font-weight:400;color:var(--mute);font-size:.7rem}
.pbar{display:grid;grid-template-columns:70px 1fr 60px;gap:10px;align-items:center;margin:6px 0;font-size:.9rem}
.pbar div,.qbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.pbar i,.qbar i{display:block;height:100%;background:var(--ok)}
.gcard{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:16px 18px;margin:14px 0}
.gcard h3{font-size:1.18rem;color:var(--ai)}.gm{font-weight:600;margin:0 0 8px}
.gcard p{max-width:none}
pre.code{background:var(--code);border:1px solid var(--line);border-radius:8px;margin:10px 0;padding:10px 0;overflow-x:auto;font-size:.84rem;line-height:1.55;tab-size:4}
pre.code code{display:block;min-width:max-content;background:transparent;color:var(--ink);padding:0;font-size:inherit;counter-reset:l;overflow-wrap:normal}
.ln{display:block;padding:0 14px 0 0;counter-increment:l;white-space:pre}
.ln::before{content:counter(l);display:inline-block;width:2.6em;margin-right:12px;padding-right:8px;text-align:right;color:var(--mute);opacity:.7;border-right:1px solid var(--line);user-select:none}
.kw{color:var(--ai);font-weight:600}.st{color:var(--ok)}.cm{color:var(--mute);font-style:italic}.nu,.an{color:var(--shu)}
.vlist li{display:flex;gap:14px;align-items:baseline;padding:9px 0;border-top:1px dashed var(--line);cursor:pointer}
.vlist .mono{font-weight:600;font-size:.9rem;flex:0 0 38%;overflow-wrap:anywhere}
.vlist.hidden li:not(.show) .vm{filter:blur(6px)}
.chk{display:flex;gap:8px;align-items:center;margin:10px 0;font-size:.95rem}
.chips{margin:.5em 0}.chips span{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:0 10px;font-size:.8rem;margin:0 6px 4px 0;color:var(--mute)}
.chips span.new,.newtag{border-color:var(--shu);color:var(--shu)}
.newtag{display:inline-block;border:1px solid;border-radius:99px;padding:0 8px;font-size:.72rem;font-weight:600;vertical-align:middle}
.pn{display:flex;justify-content:space-between;margin-top:40px}
#modal,#quiz{position:fixed;inset:0;z-index:50;display:none;overflow:auto}
#modal{z-index:60}
#modal.on{display:grid;place-items:center;background:rgba(10,18,28,.55);padding:16px}
.sheet{background:var(--paper);border-radius:12px;padding:22px;width:min(520px,100%);max-height:92vh;overflow:auto;position:relative}
.x{position:absolute;top:8px;right:10px;width:36px;height:36px;border:0;background:transparent;font-size:1.6rem;color:var(--mute);cursor:pointer;z-index:2}
#quiz.on{display:block;background:var(--paper);padding-top:env(safe-area-inset-top,0px)}
.qwrap{max-width:760px;margin:0 auto;padding:16px 18px 80px}
.qhead{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:6px 0 10px}.qhead .x{position:static}.qhead b{flex:1}
.qtag{display:inline-block;margin:18px 0 6px;font-size:.82rem;font-weight:600;color:var(--ai);background:var(--ai-soft);padding:2px 10px;border-radius:99px}
.qtext{font-size:1.05rem}.qs{font-size:1.15rem;line-height:1.7;margin:10px 0}
.opts{display:grid;gap:10px;margin:16px 0}
.opt{display:flex;gap:12px;align-items:center;text-align:left;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:1rem;cursor:pointer;line-height:1.55}
.opt .on{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:600 .8rem var(--mono);flex:none}
.opt code{background:transparent;color:inherit;padding:0;font-size:.9em}
.opt:not(:disabled):hover{border-color:var(--ai)}
.opt.sel{border-color:var(--ai);background:var(--ai-soft)}.opt.sel .on{background:var(--ai);border-color:var(--ai);color:var(--card)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.no{border-color:var(--shu);background:var(--shu-soft)}
.fb{padding:12px 16px;border-radius:10px;margin:8px 0}.fb.good{background:var(--ok-soft)}.fb.bad{background:var(--shu-soft)}.fb p{margin:.3em 0;max-width:none}
.fb.good b{color:var(--ok)}.fb.bad b{color:var(--shu)}
.result{text-align:center;padding:10px 0 20px}.result p{margin-inline:auto}
.rev{border-top:1px dashed var(--line);padding:10px 0}.rev p{max-width:none}
span.ok{color:var(--ok)}span.no{color:var(--shu)}
.qnav{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:4px;margin:18px 0 6px}
.qnav button{height:34px;border:1.5px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:600 .8rem var(--mono);cursor:pointer;padding:0}
.qnav button.did{background:var(--ai-soft);border-color:var(--grid)}.qnav button.flag{border-color:var(--shu);color:var(--shu)}.qnav button.cur{outline:2px solid var(--ai);outline-offset:1px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:99;font-size:.92rem;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
.guide{padding-left:1.3em;max-width:70ch}.guide li{margin:.35em 0}
.flash{background:var(--card);border:1.5px solid var(--grid);border-radius:10px;padding:26px 18px;text-align:center;margin:14px 0;min-height:170px}
.flash p{margin-inline:auto}.fback{border-top:1px dashed var(--line);margin-top:16px;padding-top:14px}
.tbw{overflow-x:auto;margin:14px 0}
.tb{width:100%;border-collapse:collapse;font-size:.93rem;text-align:left}
.tb th,.tb td{border:1px solid var(--line);padding:7px 10px;vertical-align:top}.tb th{background:var(--ai-soft)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin:18px 0}
.pcard{display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px 16px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;text-decoration:none;cursor:pointer}
.pcard:hover{border-color:var(--ai)}.pcard b{color:var(--ai)}.pcard span{color:var(--mute);font-size:.9rem}
.pcard:disabled{opacity:.55;cursor:default}
@media (max-width:820px){
 #app{display:block}
 .nav{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));border:0;border-top:1px solid var(--line);z-index:20}
 .nav .brand{display:none}.nav a{flex-direction:column;gap:2px;font-size:.62rem;padding:4px 2px}.nav a .mono{width:28px;height:26px}
 main{padding-top:18px}h1{font-size:1.45rem}
 .wk{flex-direction:column;align-items:stretch;gap:2px;margin-bottom:10px}.wkl{width:auto}.wkl small{display:inline;margin-left:8px}
 .outl li{flex-wrap:wrap}.tb{font-size:.82rem}
 .vlist li{flex-direction:column;gap:2px}.vlist .mono{flex:none}
 pre.code{font-size:.76rem}.ln::before{width:2em;margin-right:8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script type="text/plain" id="d-meta">
#W1 Nền tảng ngôn ngữ|Cấu trúc chương trình, kiểu dữ liệu, toán tử và điều khiển luồng. Có ba điểm mới của Java 25: compact source file, instance main và import module.
1|main|Cấu trúc lớp, main() và compact source file|O|N|Thành phần của một lớp và quy tắc đặt tên tệp;Các dạng main() hợp lệ, instance main (Java 25);Compact source file và lớp ngầm định (Java 25);Lớp java.lang.IO, biên dịch và chạy bằng javac/java
2|imp|Package, import và import module|M|N|Import đơn và import theo yêu cầu (wildcard);Xung đột tên và thứ tự ưu tiên;Static import;Import module (Java 25);Classpath và lệnh chạy có package
3|var|Kiểu nguyên thủy, wrapper, var và text block|T||Tám kiểu nguyên thủy và literal;Wrapper, autoboxing và bộ đệm Integer;Suy luận kiểu với var;Giá trị mặc định, phạm vi biến;Text block
4|+=|Toán tử và ép kiểu|T||Thứ tự ưu tiên, tăng giảm trước và sau;Numeric promotion;Phép gán kép và ép kiểu ngầm;Toán tử logic, short-circuit, ternary;Chia, chia dư và toán tử bit
5|sw|if, switch và pattern matching|F||if/else và pattern matching với instanceof;switch statement và fall-through;switch expression và yield;Pattern switch, when, dominance, case null
6|for|Vòng lặp, nhãn và biến không tên|F|N|while, do-while, for;for-each;break, continue, nhãn và mã không tới được;Biến và pattern không tên với dấu _ (Java 22)
#W2 Core API và phương thức|Chuỗi, mảng, Math, Date-Time và cách thiết kế phương thức.
7|str|String và các phương thức xử lý chuỗi|T||Tính bất biến và nối chuỗi;Các phương thức hay gặp: substring, indexOf, strip, replace;indent, stripIndent, translateEscapes;Method chaining và format
8|sb|StringBuilder, so sánh bằng và string pool|T|N|StringBuilder: append, insert, delete, reverse;== và equals;String pool và intern;CharSequence.getChars (Java 25)
9|[]|Mảng và Math API|C||Khai báo, khởi tạo mảng một và nhiều chiều;Arrays.sort, binarySearch, compare, mismatch;Math: round, ceil, floor, pow, min, max, random
10|date|Date-Time API|T|N|LocalDate, LocalTime, LocalDateTime, ZonedDateTime;Period và Duration;Instant và Instant.until (Java 23);Giờ mùa hè (DST)
11|fn|Thiết kế phương thức, access modifier, static|O||Các thành phần của khai báo phương thức;private, package, protected, public;Thành viên static và khởi tạo static;Varargs
12|ovl|Truyền tham trị và nạp chồng phương thức|O||Java luôn truyền tham trị;Autoboxing khi gọi phương thức;Thứ tự chọn phương thức nạp chồng;Nạp chồng với varargs và generic
#W3 Hướng đối tượng|Kế thừa, khởi tạo, interface, enum, sealed, record và lớp lồng nhau. Điểm mới Java 25: flexible constructor bodies.
13|ctor|Kế thừa, constructor và flexible constructor bodies|O|N|extends, this và super;Constructor mặc định và chuỗi gọi constructor;Câu lệnh trước super()/this() (Java 25);Những gì không được làm trong phần mở đầu constructor
14|init|Thứ tự khởi tạo và final|O||Khối khởi tạo static và instance;Thứ tự khởi tạo lớp và đối tượng;Trường final và khởi tạo trễ
15|abs|Ghi đè, che giấu, lớp trừu tượng và đối tượng bất biến|O||Quy tắc ghi đè phương thức;Che giấu phương thức static và biến;Lớp và phương thức abstract;Thiết kế lớp bất biến
16|itf|Interface|O||Khai báo và hiện thực interface;Phương thức default, static, private;Kế thừa nhiều interface và xung đột default
17|enum|Enum và lớp sealed|O||Enum với trường, constructor, phương thức;Enum trong switch;sealed, permits, final, non-sealed
18|rec|Record, lớp lồng nhau và đa hình|O||Record, compact constructor, record pattern;Bốn loại lớp lồng nhau;Đa hình, ép kiểu tham chiếu, instanceof
#W4 Lambda, Collection và Generic|Lập trình hàm, các cấu trúc dữ liệu và kiểu tổng quát.
19|λ|Lambda và functional interface|S||Cú pháp lambda;Functional interface và @FunctionalInterface;Biến effectively final trong lambda
20|::|Method reference và functional interface dựng sẵn|S||Bốn dạng method reference;Supplier, Consumer, Predicate, Function, Operator;Phương thức tiện ích: andThen, compose, negate

Một lớp gồm trường (field), phương thức (method) và constructor. Trong tệp, thứ tự bắt buộc là `package`, rồi `import`, rồi mới đến khai báo kiểu. Một tệp có thể chứa nhiều lớp cấp cao nhất, nhưng chỉ một lớp được là `public`, và khi đó tên tệp phải là tên lớp ấy cộng đuôi `.java`.
```
package zoo;                 // 1. package (không bắt buộc)
import java.util.List;       // 2. import (không bắt buộc)

public class Zoo {           // 3. kiểu public: tệp phải tên Zoo.java

```

Dạng kinh điển là `public static void main(String[] args)`. Tham số có thể viết `String... args` hoặc `String args[]`, có thể thêm `final`. Java 25 nới lỏng: phương thức khởi chạy chỉ cần tên `main`, trả về `void` và không phải `private`. Nó có thể là phương thức instance và có thể không có tham số.
JVM chọn theo thứ tự: nếu có `main(String[])` thì dùng nó, nếu không mới dùng `main()`. Khi phương thức được chọn là instance, JVM tạo đối tượng bằng constructor không tham số, vì vậy lớp phải có constructor không tham số và không private.
```

    static void main(String[] args) { System.out.print("B"); }  // được ưu tiên vì có String[]

```

##2
~Import quyết định một tên ngắn như Date hay List trỏ tới lớp nào. Java 25 thêm import module, và kéo theo một bậc ưu tiên mới cần thuộc.
@Import đơn và import theo yêu cầu|Dấu * chỉ lấy các kiểu nằm trực tiếp trong package, không lấy package con.
`import java.util.List;` là import đơn. `import java.util.*;` là import theo yêu cầu (wildcard): lấy mọi kiểu public trực tiếp trong `java.util`, nhưng không lấy `java.util.concurrent` hay các package con khác. Package `java.lang` luôn được import sẵn. Import thừa hoặc import trùng không gây lỗi.
```
import java.util.*;                       // có List, Map, nhưng không có AtomicInteger
import java.util.concurrent.atomic.*;     // phải import riêng package con

public class Counter {
    List<String> names;
    AtomicInteger hits;
}
```
!Wildcard chỉ được đứng ở cuối và chỉ có một dấu: `import java.*.List;` và `import java.util.*.*;` đều không biên dịch.
@Xung đột tên và thứ tự ưu tiên|Import đơn thắng wildcard; hai wildcard cùng cho một tên thì lỗi khi tên đó được dùng.
`java.util` và `java.sql` đều có lớp `Date`. Nếu import cả hai bằng wildcard rồi dùng `Date`, trình biên dịch báo tham chiếu không rõ ràng. Lỗi chỉ xuất hiện khi tên đó thực sự được dùng. Thêm một import đơn sẽ giải quyết vì import đơn có ưu tiên cao hơn. Hai import đơn cho cùng một tên ngắn thì lỗi ngay tại dòng import.
```
import java.util.*;
import java.sql.*;
import java.util.Date;      // import đơn: Date là java.util.Date

public class Report {
    Date created;           // hợp lệ
}
```
@Static import|import static đưa thành viên static vào tầm dùng trực tiếp.
Cú pháp là `import static`, không phải `static import`. Nó import phương thức và trường static, không import lớp. Có thể import một thành viên hoặc dùng wildcard cho mọi thành viên static của lớp.
```
import static java.util.Arrays.asList;    // một thành viên
import static java.lang.Math.*;           // mọi thành viên static của Math

public class Calc {
    double r = sqrt(max(4, 9));           // gọi không cần tiền tố Math
}
```
!Sau `import static java.util.Arrays.asList;` thì `asList(...)` dùng được, nhưng `Arrays.asList(...)` thì không, vì lớp `Arrays` chưa được import.
@Import module (Java 25)|Một dòng import module lấy mọi package mà module đó export, kể cả qua requires transitive.
`import module M;` import theo yêu cầu mọi kiểu public cấp cao nhất trong các package mà module `M` export, cộng với các package của những module mà `M` khai báo `requires transitive`. Dùng được trong mọi tệp nguồn, không đòi hỏi mã của bạn nằm trong module.
Thứ tự ưu tiên khi trùng tên, từ cao xuống thấp: import đơn, rồi wildcard của package, rồi import module. Hai import module cùng cho một tên thì lỗi không rõ ràng, giống hai wildcard.
```
import module java.base;     // có java.util.Date
import module java.sql;      // có java.sql.Date
import java.util.*;          // wildcard package che import module

public class Pick {
    Date d;                  // java.util.Date
}
```
!`import module java.sql;` không kéo theo `java.util.List`. Module java.sql chỉ `requires transitive` java.logging, java.xml và java.transaction.xa; java.base không nằm trong số đó.
@Classpath và lệnh chạy có package|Tên lớp khi chạy phải là tên đầy đủ gồm package, tính từ gốc classpath.
Với lớp `zoo.Animal`, biên dịch bằng `javac -d out src/zoo/Animal.java` sẽ tạo `out/zoo/Animal.class`. Khi chạy, classpath trỏ tới thư mục gốc chứa cây package, và tên lớp viết bằng dấu chấm: `java -cp out zoo.Animal`. Ba cách viết classpath tương đương là `-cp`, `-classpath` và `--class-path`.

=requires transitive|Khai báo trong module khiến bên dùng module này cũng đọc được module kia

~Phần kiểu dữ liệu có nhiều câu "dòng nào không biên dịch". Nắm chắc giới hạn của literal, của var và hành vi của wrapper là lấy được điểm.
@Tám kiểu nguyên thủy và literal|Literal số nguyên mặc định là int, số thực mặc định là double.
Kích thước: `byte` 8 bit, `short` 16, `int` 32, `long` 64, `float` 32, `double` 64, `char` 16 bit không dấu, `boolean`. Literal nguyên vượt phạm vi int phải có hậu tố `L`. Literal thực gán cho `float` phải có `f`. Hệ cơ số: `017` là bát phân, `0x1F` thập lục phân, `0b101` nhị phân.
Dấu gạch dưới làm số dễ đọc, nhưng không được đứng đầu, đứng cuối, hoặc sát dấu chấm thập phân.
```
int a = 1_000_000;        // hợp lệ
int b = 0b1_01;           // hợp lệ, bằng 5
long c = 3_000_000_000L;  // phải có L
float d = 2.5f;           // phải có f
double e = 1_.5;          // KHÔNG biên dịch: gạch dưới sát dấu chấm
```
@Wrapper, autoboxing và bộ đệm|parseXxx trả về kiểu nguyên thủy, valueOf trả về wrapper.
Mỗi kiểu nguyên thủy có một lớp wrapper: `Integer`, `Long`, `Double`, `Character`, `Boolean`... `Integer.parseInt("12")` trả về `int`, còn `Integer.valueOf("12")` trả về `Integer`. Autoboxing tự chuyển qua lại giữa hai dạng. Mở hộp một tham chiếu `null` ném `NullPointerException`.
`Integer.valueOf` và autoboxing dùng lại đối tượng cho các giá trị từ -128 đến 127, nên `==` giữa hai `Integer` trong khoảng này cho `true`. Ngoài khoảng đó, `==` so sánh hai đối tượng khác nhau.
```
Integer a = 127, b = 127, c = 128, d = 128;
System.out.println(a == b);       // true: cùng đối tượng trong bộ đệm
System.out.println(c == d);       // false: hai đối tượng khác nhau
System.out.println(c.equals(d));  // true: so sánh giá trị
```
@Suy luận kiểu với var|var chỉ dùng cho biến cục bộ có giá trị khởi tạo ngay trên cùng câu lệnh.
Trình biên dịch suy ra kiểu từ vế phải, và kiểu đó không đổi về sau. Không dùng `var` cho trường, tham số phương thức hay kiểu trả về. Không khởi tạo bằng `null` trần, không khai báo nhiều biến trên một dòng, không dùng với khởi tạo mảng rút gọn hay lambda.
```
var list = new ArrayList<String>();   // ArrayList<String>
var n = (String) null;                // hợp lệ: kiểu String
for (var i = 0; i < 3; i++) { }       // hợp lệ

var x = null;         // KHÔNG biên dịch
var a = 1, b = 2;     // KHÔNG biên dịch
var arr = {1, 2};     // KHÔNG biên dịch
var f = () -> 1;      // KHÔNG biên dịch
```
!`var` không phải từ khoá dành riêng. `var var = 3;` biên dịch được. Nhưng không được đặt tên lớp hay interface là `var`.
@Giá trị mặc định và phạm vi biến|Trường có giá trị mặc định; biến cục bộ thì không.
Trường instance và static tự nhận `0`, `0.0`, `false`, `'\u0000'` hoặc `null`. Biến cục bộ phải được gán chắc chắn trên mọi nhánh trước khi đọc, nếu không sẽ lỗi biên dịch. Biến cục bộ chỉ sống trong khối `{ }` nơi nó được khai báo.
Một đối tượng đủ điều kiện để thu gom rác khi không còn tham chiếu nào tới được nó. `System.gc()` chỉ là gợi ý, JVM không buộc phải chạy.
```

if (Math.random() > 0.5) x = 1;
System.out.println(x);    // KHÔNG biên dịch: x có thể chưa được gán
```
@Text block|Ba dấu nháy kép mở phải xuống dòng ngay; khoảng trắng thừa bên trái bị cắt theo dòng thụt ít nhất.
Text block bắt đầu bằng `"""` rồi xuống dòng. Trình biên dịch lấy dòng thụt vào ít nhất (tính cả dòng chứa `"""` đóng) làm mốc và cắt bỏ phần thụt chung đó. Nếu `"""` đóng nằm riêng một dòng, chuỗi kết thúc bằng ký tự xuống dòng. `\` ở cuối dòng nối dòng tiếp theo vào, `\s` giữ một dấu cách.
```

       b

```
!`String s = """abc""";` không biên dịch: sau ba dấu nháy mở phải là xuống dòng.

##4
~Câu hỏi về toán tử hiếm khi khó về ý tưởng, nhưng dễ sai vì tính nhẩm vội. Hãy tập viết ra giá trị của từng biến sau mỗi bước.
@Thứ tự ưu tiên và phép tăng giảm|Toán tử một ngôi tính trước, rồi nhân chia, cộng trừ, dịch bit, so sánh, bit, logic, ternary, cuối cùng là gán.
Thứ tự từ cao xuống thấp: hậu tố `x++ x--`; tiền tố và một ngôi `++x --x + - ! ~` cùng ép kiểu; `* / %`; `+ -`; `<< >> >>>`; `< > <= >= instanceof`; `== !=`; `&`; `^`; `|`; `&&`; `||`; `? :`; các phép gán. Các toán hạng luôn được tính từ trái sang phải.
`x++` trả về giá trị cũ rồi mới tăng. `++x` tăng rồi trả về giá trị mới.
```
int x = 3;
int y = x++ + ++x * 2;
// x++ trả 3 (x thành 4); ++x đưa x lên 5 và trả 5; 5 * 2 = 10; y = 3 + 10 = 13
System.out.println(x + " " + y);   // 5 13
```
@Numeric promotion|byte, short và char luôn được nâng lên int khi tham gia phép toán hai ngôi.
Bốn quy tắc: hai toán hạng khác kiểu thì kiểu nhỏ được nâng lên kiểu lớn; nguyên gặp thực thì nâng lên thực; `byte`, `short`, `char` được nâng lên `int` trước khi tính, kể cả khi hai toán hạng cùng kiểu; kết quả mang kiểu đã nâng.
```
short a = 10, b = 3;
short c = a * b;          // KHÔNG biên dịch: a * b có kiểu int
short d = (short) (a * b);  // hợp lệ
long big = Integer.MAX_VALUE + 1;   // tràn số ở kiểu int trước, rồi mới gán: -2147483648
```
!Hằng số biên dịch được thì được thu hẹp ngầm nếu vừa kiểu đích: `char ch = 'a' + 1;` hợp lệ và cho 'b'. Còn `char ch = c + 1;` với c là biến char thì không biên dịch.
@Gán, gán kép và ép kiểu|Phép gán kép tự chèn một phép ép kiểu về kiểu của biến bên trái.
`b += 5` tương đương `b = (byte) (b + 5)`, nên biên dịch được dù `b + 5` có kiểu `int`. Viết `b = b + 5` thì không. Ép kiểu thu hẹp cắt bớt bit: `(byte) 200` cho `-56`. Phép gán là một biểu thức có giá trị, nên `(x = 5)` cho ra 5.
Với phép gán kép, giá trị bên trái được lấy trước khi tính vế phải.
```
byte b = 10;
b += 5;           // hợp lệ, b = 15
// b = b + 5;     // KHÔNG biên dịch

int k = 10;
k += k++ + (k > 10 ? 1 : 2);   // k = 10 + (10 + 1) = 21
```
@Toán tử logic, short-circuit và ternary|&& và || bỏ qua vế phải khi vế trái đã quyết định kết quả; & và | thì luôn tính cả hai.
`&`, `|`, `^` trên boolean luôn tính cả hai vế. `&&` dừng khi vế trái là `false`, `||` dừng khi vế trái là `true`. Lưu ý `|` có ưu tiên cao hơn `&&`. Toán tử ternary chỉ tính một trong hai nhánh.
`instanceof` với `null` luôn cho `false`. Nếu hai kiểu không thể có quan hệ kế thừa (ví dụ `Integer` và `String`), biểu thức không biên dịch.
```
int a = 5, b = 5;
boolean r = (a++ > 5) && (b++ > 5) | (++a > 6);
// hiểu là (a++ > 5) && ((b++ > 5) | (++a > 6)); vế trái false nên vế phải bị bỏ qua
System.out.println(a + " " + b + " " + r);   // 6 5 false
```
@Chia, chia dư và toán tử bit|Chia số nguyên cắt bỏ phần thập phân; chia dư mang dấu của số bị chia.
`7 / 2` là `3`, `7 / 2.0` là `3.5`, `-7 % 3` là `-1`. Chia số nguyên cho 0 ném `ArithmeticException`; chia số thực cho 0 cho `Infinity` hoặc `NaN`.
Toán tử bit: `&` (và), `|` (hoặc), `^` (xor), `~` (đảo bit, `~n` bằng `-n - 1`). Dịch bit: `<<` dịch trái, `>>` dịch phải giữ dấu, `>>>` dịch phải chèn 0.
```
System.out.println((5 & 3) + " " + (5 | 3) + " " + (5 ^ 3));  // 1 7 6
System.out.println((-8 >> 1) + " " + (-8 >>> 28) + " " + ~5); // -4 15 -6
```
=numeric promotion|Tự nâng toán hạng lên kiểu lớn hơn trước khi tính; byte, short, char luôn thành int
=phép gán kép (compound assignment)|+=, -=, *=... có sẵn phép ép kiểu ngầm về kiểu biến bên trái
=short-circuit|&& và || không tính vế phải khi vế trái đã đủ quyết định kết quả
=toán tử ternary|điều kiện ? giá trị nếu đúng : giá trị nếu sai; chỉ một nhánh được tính
=x++ và ++x|x++ trả giá trị cũ rồi tăng; ++x tăng rồi trả giá trị mới
=>>>|Dịch phải không dấu: luôn chèn bit 0 vào bên trái
=ArithmeticException|Ngoại lệ khi chia số nguyên cho 0

int y = x++ + ++x * 2;
System.out.println(x + " " + y);
```

##5
~Từ Java 21, switch làm được nhiều hơn hẳn: trả về giá trị, khớp theo kiểu, có điều kiện when. Đề thi khai thác kỹ các quy tắc đầy đủ nhánh và thứ tự case.
@if/else và pattern matching với instanceof|Biến pattern chỉ dùng được ở nơi trình biên dịch chắc chắn phép khớp đã thành công.
Điều kiện của `if` phải có kiểu boolean. `else` luôn gắn với `if` gần nhất chưa có `else`. Với `o instanceof String s`, nếu khớp thì `s` được gán sẵn và đã ép kiểu. Phạm vi của `s` theo luồng chạy: dùng được sau `&&`, không dùng được sau `||`. Nếu nhánh không khớp chắc chắn thoát ra (return, throw) thì `s` còn dùng được ở phần mã phía sau.
```
static String f(Object o) {
    if (!(o instanceof String s)) return "no";
    return s.isEmpty() ? "empty" : s;      // s vẫn trong phạm vi
}

if (o instanceof String s && s.length() > 3) { }   // hợp lệ
if (o instanceof String s || s.length() > 3) { }   // KHÔNG biên dịch
```
!Từ Java 21, kiểu của pattern được phép trùng hoặc là kiểu cha của biến: với `Integer n`, cả `n instanceof Integer i` lẫn `n instanceof Number m` đều biên dịch.
@switch statement và fall-through|Với cú pháp dấu hai chấm, chạy từ case khớp xuống hết cho tới khi gặp break.
Kiểu của biểu thức switch truyền thống: `byte`, `short`, `char`, `int`, các wrapper của chúng, `String`, enum. Không dùng `long`, `float`, `double`, `boolean`. Giá trị trong `case` phải là hằng số lúc biên dịch. `default` đặt ở đâu cũng được và cũng tham gia fall-through.
```
int day = 2; String r = "";
switch (day) {
    case 1: r += "A";
    case 2: r += "B";       // bắt đầu chạy từ đây
    default: r += "D";      // chạy tiếp
    case 3: r += "C"; break;  // chạy tiếp rồi dừng
    case 4: r += "E";
}
// r = "BDC"
```
!Cú pháp mũi tên `case 1 -> ...` không có fall-through. Không được trộn `:` và `->` trong cùng một switch.
@switch expression và yield|switch expression trả về giá trị, phải bao phủ mọi khả năng và kết thúc bằng dấu chấm phẩy.
Một `case` có thể liệt kê nhiều giá trị, cách nhau bằng dấu phẩy. Vế phải của `->` là một biểu thức, một khối `{ }` hoặc một câu lệnh `throw`. Trong khối, dùng `yield` để trả giá trị. Nếu các case chưa bao phủ hết giá trị có thể có thì cần `default`, trừ khi switch trên enum hoặc kiểu sealed đã liệt kê đủ.
```
int n = 4;
int r = switch (n % 3) {
    case 0 -> 10;
    case 1 -> { int t = n * 2; yield t + 1; }   // khối phải yield
    default -> -1;
};      // r = 9
```
@Pattern switch: kiểu, when, dominance và null|Case đứng trước không được che mất case đứng sau.
Khi `case` là pattern kiểu, biểu thức switch có thể mang bất kỳ kiểu tham chiếu nào. Thêm điều kiện bằng `when`. Thứ tự rất quan trọng: case của kiểu cha đứng trước sẽ che (dominate) case của kiểu con đứng sau và gây lỗi biên dịch. Case có `when` phải đứng trước case cùng kiểu không có `when`.
Biểu thức switch là `null` mà không có `case null` thì ném `NullPointerException`, kể cả khi có `default`. Có thể viết gộp `case null, default ->`.
```
String s = switch (o) {
    case null -> "null";
    case Integer i when i > 50 -> "big";
    case Integer i -> "int";
    case Number n -> "num";       // đặt trước Integer sẽ lỗi biên dịch
    default -> "obj";
};
```
!Pattern trên kiểu nguyên thủy, kể cả `switch` trên `long` hay `boolean`, vẫn là tính năng preview trong Java 25 và không nằm trong phạm vi đề thi.

=yield|Trả giá trị từ một khối trong switch expression
=biến pattern|Biến được khai báo ngay trong phép khớp, ví dụ s trong o instanceof String s
=flow scoping|Biến pattern chỉ nằm trong phạm vi ở những nơi phép khớp chắc chắn đã thành công

=dominance|Case đứng trước bao trùm case đứng sau, khiến case sau không bao giờ chạy; là lỗi biên dịch
=case null|Nhánh xử lý khi biểu thức switch là null; thiếu nó thì ném NullPointerException

##6
~Vòng lặp là nơi đề thi hay giấu lỗi biên dịch do mã không tới được. Bài này cũng học dấu gạch dưới, cách Java 22 cho phép bỏ tên những biến không dùng.
@while, do-while và for|do-while luôn chạy thân ít nhất một lần; cả ba phần của for đều có thể bỏ trống.
`while` kiểm tra điều kiện trước khi chạy thân. `do { } while (điều kiện);` chạy thân rồi mới kiểm tra, và phải có dấu chấm phẩy ở cuối. Vòng `for` gồm khởi tạo, điều kiện, cập nhật. Phần khởi tạo khai báo được nhiều biến nhưng chúng phải cùng kiểu. `for (;;)` là vòng lặp vô hạn hợp lệ.
```
int x = 10;
do { x -= 3; } while (x > 10);     // chạy một lần: x = 7

for (int i = 0, j = 5; i < j; i++, j--) { }     // hợp lệ
for (int i = 0, long k = 1; i < 3; i++) { }     // KHÔNG biên dịch: hai kiểu khác nhau
```
!`while (y++ < 3) { }` vẫn tăng y ở lần kiểm tra cuối cùng (lần cho kết quả false). Bắt đầu từ 0 thì kết thúc với y bằng 4, không phải 3.
@for-each|Biến lặp là bản sao của phần tử; gán lại nó không làm đổi mảng.
Vế phải của for-each phải là mảng hoặc đối tượng `Iterable`. Một `Map` không lặp trực tiếp được, phải qua `keySet()`, `values()` hoặc `entrySet()`. Với mảng kiểu nguyên thủy, biến lặp nhận bản sao giá trị.
```
int[] nums = {1, 2, 3};
for (int n : nums) n *= 2;     // nums vẫn là {1, 2, 3}
```
@break, continue, nhãn và mã không tới được|Câu lệnh mà trình biên dịch chứng minh được là không bao giờ chạy tới sẽ gây lỗi biên dịch.
`break` thoát khỏi vòng lặp hoặc switch gần nhất, `continue` nhảy sang lần lặp kế tiếp. Gắn nhãn cho vòng ngoài để `break NHÃN` hoặc `continue NHÃN` tác động lên vòng đó.
Câu lệnh đứng ngay sau `break`, `continue`, `return`, hoặc sau một vòng `while (true)` không có `break`, là mã không tới được và không biên dịch. Ngoại lệ: `if (false) { ... }` được chấp nhận.
```
OUTER:
for (int i = 0; i < 3; i++) {
    for (int j = 0; j < 3; j++) {
        if (j == 1) continue OUTER;   // sang lần lặp kế của vòng i
        if (i == 2) break OUTER;      // thoát cả hai vòng
    }
}
```
@Biến và pattern không tên (Java 22)|Dấu _ đánh dấu một biến bắt buộc phải khai báo nhưng không được dùng tới.
Dùng `_` thay tên cho: biến cục bộ, biến của for và for-each, tham số của `catch`, tài nguyên trong try-with-resources, tham số lambda, và biến trong pattern. Được khai báo nhiều `_` trong cùng phạm vi. Không bao giờ đọc được `_`. Không dùng `_` cho trường hay tham số của phương thức.
Trong record pattern, `_` đứng một mình khớp với thành phần bất kỳ mà không cần ghi kiểu. Một nhãn case được gộp nhiều pattern nếu không pattern nào khai báo biến có tên.
```
for (var _ : names) total++;
try { Integer.parseInt("x"); } catch (NumberFormatException _) { total += 10; }
BiFunction<Integer, Integer, Integer> second = (_, v) -> v;

String s = switch (o) {
    case Point(int x, _) when x > 5 -> "far";
    case Integer _, String _ -> "simple";     // gộp được vì không có biến có tên
    default -> "?";
};
```
!`int _ = 5; int _ = 6;` biên dịch được. `System.out.println(_);` thì không: gạch dưới không phải là một tên để đọc.

~StringBuilder thay đổi được, String thì không. Bài này cũng phân biệt == với equals và giải thích vì sao hai chuỗi giống hệt nhau đôi khi lại không ==.
@StringBuilder thay đổi tại chỗ|Các phương thức sửa trực tiếp đối tượng và trả về chính nó, nên nối chuỗi lời gọi được.
`append(x)` thêm vào cuối, `insert(offset, x)` chèn trước vị trí offset, `delete(start, end)` và `deleteCharAt(i)` xoá, `replace(start, end, str)` thay đoạn từ start đến trước end, `reverse()` đảo ngược. Tất cả đều trả về chính đối tượng đó.
Riêng `substring` trả về một String mới và không làm thay đổi StringBuilder.
```
var sb = new StringBuilder("abcde");
sb.insert(2, "-")       // ab-cde
  .delete(0, 1)         // b-cde
  .replace(1, 3, "XY")  // bXYde
  .reverse();           // edYXb
```
!Hai biến cùng trỏ tới một StringBuilder thì sửa qua biến nào cũng thấy ở biến kia: `StringBuilder b = a.append("y");` khiến `a == b` là true.
@== và equals|== so sánh tham chiếu; equals của String so sánh nội dung, còn StringBuilder không ghi đè equals.
Với kiểu tham chiếu, `==` hỏi hai biến có trỏ tới cùng một đối tượng không. `String.equals` so sánh từng ký tự. `StringBuilder` dùng `equals` thừa kế từ `Object`, nên hai StringBuilder cùng nội dung vẫn không equals.
`s.equals(sb)` với s là String và sb là StringBuilder biên dịch được nhưng luôn false. Còn `s == sb` không biên dịch vì hai kiểu không liên quan. Muốn so nội dung, dùng `s.contentEquals(sb)`.
```
new StringBuilder("a").equals(new StringBuilder("a"));   // false
"a".equals(new StringBuilder("a"));                      // false, nhưng biên dịch được
"a".contentEquals(new StringBuilder("a"));               // true
```
@String pool|Literal và hằng số lúc biên dịch nằm trong pool; chuỗi tạo ra lúc chạy thì không.
Các literal giống nhau dùng chung một đối tượng trong pool. Biểu thức chỉ gồm literal và biến `final` đã khởi tạo bằng hằng số cũng được tính lúc biên dịch và đưa vào pool. Chuỗi được nối lúc chạy, hoặc tạo bằng `new String(...)`, là đối tượng riêng. `intern()` trả về bản nằm trong pool.
```
String x = "ab", y = "a";
final String f = "a";
x == "a" + "b";          // true: hằng số lúc biên dịch
x == y + "b";            // false: nối lúc chạy
x == f + "b";            // true: f là hằng số
x == (y + "b").intern(); // true
x == new String("ab");   // false
```
@CharSequence.getChars (Java 25)|Từ Java 25, mọi CharSequence đều chép được ký tự vào mảng char bằng getChars.
`String`, `StringBuilder` và `StringBuffer` đều hiện thực `CharSequence`. Trước đây `getChars` chỉ có trên từng lớp cụ thể. Java 25 đưa nó lên `CharSequence` dưới dạng phương thức default, nên gọi được qua biến kiểu `CharSequence`.
Chữ ký: `getChars(int srcBegin, int srcEnd, char[] dst, int dstBegin)`. Chép các ký tự từ srcBegin đến trước srcEnd vào mảng dst, bắt đầu tại dstBegin. Chỉ số sai hoặc mảng đích không đủ chỗ thì ném `IndexOutOfBoundsException`.
```
CharSequence cs = new StringBuilder("Java25");
char[] buf = {'-', '-', '-', '-', '-'};
cs.getChars(0, 4, buf, 1);      // buf thành -Java
```

~Mảng có cú pháp khai báo dễ gây nhầm, còn lớp Arrays và Math thì hỏi thẳng vào giá trị trả về. Cần nhớ chính xác từng trường hợp.
@Khai báo và khởi tạo mảng|Kích thước và danh sách giá trị không được viết cùng lúc.
Ba cách tạo: `new int[3]` (các phần tử nhận giá trị mặc định), `new int[]{1, 2, 3}`, hoặc `{1, 2, 3}` ngay tại khai báo. Dấu `[]` đặt sau kiểu hay sau tên biến đều được, nhưng ý nghĩa khác nhau khi khai báo nhiều biến.
Mảng có trường `length`, không có dấu ngoặc. Truy cập ngoài phạm vi ném `ArrayIndexOutOfBoundsException`.
```
int[] a = new int[3];           // {0, 0, 0}
int[] b = {1, 2, 3};
int[] c = new int[3]{1, 2, 3};  // KHÔNG biên dịch
int[] x, y;                     // cả hai là mảng int
int p[], q;                     // p là mảng, q là int
int[] m, n[];                   // m là int[], n là int[][]
```
!Mảng nhớ kiểu phần tử thật của nó. `Object[] o = new String[2]; o[0] = 1;` biên dịch được nhưng ném `ArrayStoreException` khi chạy.
@Mảng nhiều chiều|Mảng hai chiều là mảng của các mảng; các hàng có thể dài khác nhau.
Khi tạo mảng nhiều chiều, kích thước chiều đầu tiên là bắt buộc, các chiều sau có thể để trống và gán sau. Hàng chưa gán có giá trị `null`.
```
int[][] m = new int[2][];       // hai hàng, chưa có hàng nào
m[0] = new int[]{1, 2, 3};
m[1] = new int[1];
// m.length = 2, m[0].length = 3, m[1][0] = 0

int[][] bad = new int[][3];     // KHÔNG biên dịch: thiếu chiều đầu
```
@Lớp Arrays: sort, binarySearch, compare, mismatch|binarySearch chỉ có nghĩa trên mảng đã sắp xếp; không thấy thì trả về số âm cho biết chỗ chèn.
`Arrays.sort` sắp xếp tại chỗ. Với String, thứ tự là chữ số, rồi chữ hoa, rồi chữ thường. `Arrays.binarySearch` trả về chỉ số nếu thấy; nếu không, trả về `-(vị trí chèn) - 1`.
`Arrays.compare(a, b)` trả số âm, 0 hoặc dương. So từng phần tử; nếu một mảng là phần đầu của mảng kia thì mảng ngắn hơn nhỏ hơn. `Arrays.mismatch(a, b)` trả chỉ số đầu tiên khác nhau, hoặc `-1` nếu hai mảng bằng nhau. `Arrays.equals` so nội dung, còn `a.equals(b)` và `a == b` so tham chiếu.
```
int[] a = {5, 1, 9, 3};
Arrays.sort(a);                    // {1, 3, 5, 9}
Arrays.binarySearch(a, 3);         // 1
Arrays.binarySearch(a, 4);         // -3: lẽ ra chèn ở vị trí 2
Arrays.compare(new int[]{1, 2}, new int[]{1, 2, 3});    // -1
Arrays.mismatch(new int[]{1, 2}, new int[]{1, 2, 3});   // 2
```
@Math API|round trả về số nguyên; ceil, floor và pow trả về double.
`Math.round(double)` trả `long`, `Math.round(float)` trả `int`; số có phần lẻ đúng .5 được làm tròn lên phía dương vô cùng. `Math.ceil` làm tròn lên, `Math.floor` làm tròn xuống, cả hai trả `double`. `Math.pow(a, b)` trả `double`. `Math.min` và `Math.max` trả kiểu lớn hơn trong hai tham số. `Math.random()` trả `double` từ 0 đến nhỏ hơn 1.
```
Math.round(2.5);     // 3
Math.round(-2.5);    // -2
Math.ceil(-1.2);     // -1.0
Math.floor(-1.2);    // -2.0
Math.pow(2, 3);      // 8.0
int n = Math.round(2.4);   // KHÔNG biên dịch: long không gán thẳng cho int
```

~Mọi lớp trong java.time đều bất biến và không có constructor công khai. Phần khó nhất là giờ mùa hè; phần mới là Instant.until của Java 23.
@LocalDate, LocalTime, LocalDateTime, ZonedDateTime|Tạo bằng phương thức static như of() và now(); mọi phép cộng trừ trả về đối tượng mới.
`LocalDate` chỉ có ngày, `LocalTime` chỉ có giờ, `LocalDateTime` có cả hai, `ZonedDateTime` thêm múi giờ. Constructor của chúng đều private nên `new LocalDate(...)` không biên dịch. Tháng tính từ 1, hoặc dùng enum `Month`. Giá trị không hợp lệ như ngày 30 tháng 2 ném `DateTimeException`.
Các phương thức `plusDays`, `minusMonths`, `withYear`... trả về đối tượng mới. Cộng tháng vào ngày 31 sẽ lùi về ngày cuối của tháng đích.
```
LocalDate d = LocalDate.of(2025, 1, 31);
d.plusDays(1);                      // kết quả bị bỏ đi, d không đổi
LocalDate e = d.plusMonths(1);      // 2025-02-28
LocalTime.of(23, 30).plusHours(2);  // 01:30, quay vòng qua nửa đêm
```
@Period và Duration|Period đo bằng năm, tháng, ngày; Duration đo bằng giờ, phút, giây.
`Period.of(1, 2, 3)` in ra `P1Y2M3D`. `Duration.ofMinutes(90)` in ra `PT1H30M`. `Period` dùng cho ngày, `Duration` dùng cho giờ. Cộng `Duration` vào `LocalDate`, hoặc cộng `Period` vào `LocalTime`, biên dịch được nhưng ném `UnsupportedTemporalTypeException` khi chạy.
`Period.between(a, b)` cho khoảng cách dạng năm, tháng, ngày. `ChronoUnit.DAYS.between(a, b)` cho tổng số ngày.
```
Period.between(LocalDate.of(2025, 1, 31), LocalDate.of(2025, 3, 1));      // P1M1D
ChronoUnit.DAYS.between(LocalDate.of(2025, 1, 31), LocalDate.of(2025, 3, 1)); // 29
```
!Các phương thức `ofYears`, `ofWeeks`... là static, không nối chuỗi được: `Period.ofYears(1).ofWeeks(1)` chỉ còn là một tuần, in ra `P7D`.
@Instant và Instant.until (Java 23)|Instant là một điểm trên trục thời gian UTC; until(Instant) trả về Duration giữa hai điểm.
`Instant.now()` hoặc `zonedDateTime.toInstant()` cho một thời điểm tuyệt đối. `Instant` cộng trừ được theo đơn vị từ ngày trở xuống; cộng tháng hay năm ném `UnsupportedTemporalTypeException`.
Java 23 thêm `until(Instant end)` trả về `Duration`, tương đương `Duration.between(this, end)`. Kết quả âm nếu điểm cuối đứng trước. Dạng cũ `until(end, ChronoUnit.MINUTES)` vẫn còn và trả về `long`.
```
Instant a = Instant.parse("2025-01-01T10:00:00Z");
Instant b = Instant.parse("2025-01-01T12:30:00Z");
Duration d = a.until(b);               // PT2H30M
long m = a.until(b, ChronoUnit.MINUTES); // 150
b.until(a);                            // PT-2H-30M
```
@Giờ mùa hè (DST)|Khi đồng hồ nhảy tới, một giờ biến mất; khi lùi lại, một giờ lặp hai lần.
Ở múi giờ America/New_York năm 2025: ngày 9/3 lúc 2:00 đồng hồ nhảy lên 3:00 (độ lệch UTC từ -05:00 sang -04:00), và ngày 2/11 lúc 2:00 lùi về 1:00 (từ -04:00 về -05:00). `ZonedDateTime` tính đúng theo thời gian thực: cộng một giờ là cộng một giờ thật.
Tạo một thời điểm rơi vào khoảng không tồn tại (ví dụ 2:30 ngày 9/3) thì Java tự đẩy lên 3:30.
```
var zone = ZoneId.of("America/New_York");
var t = ZonedDateTime.of(LocalDate.of(2025, 3, 9), LocalTime.of(1, 30), zone);
t.plusHours(1);    // 03:30-04:00: giờ thứ 2 không tồn tại

var u = ZonedDateTime.of(LocalDate.of(2025, 11, 2), LocalTime.of(1, 30), zone);
u.plusHours(1);    // 01:30-05:00: vẫn 1 giờ 30 nhưng độ lệch đã đổi
```
!Ngày 9/3/2025 ở New York chỉ dài 23 giờ, còn ngày 2/11/2025 dài 25 giờ.

##11
~Khai báo phương thức có trật tự chặt chẽ, và mỗi mức truy cập mở ra đúng một phạm vi. Đề thi thích nhất là protected và static, hai chỗ dễ đoán sai nhất.
@Các thành phần của khai báo phương thức|Thứ tự giữa các modifier tự do, nhưng kiểu trả về phải đứng ngay trước tên phương thức.
Một khai báo gồm: mức truy cập, các specifier tuỳ chọn (`static`, `final`, `abstract`, `synchronized`, `native`, `default`), kiểu trả về, tên, danh sách tham số, mệnh đề `throws` và thân. Kiểu trả về là bắt buộc, không trả gì thì ghi `void`. Mức truy cập và specifier đổi chỗ cho nhau được, nhưng tất cả phải đứng trước kiểu trả về.
Biến cục bộ chỉ nhận một modifier duy nhất là `final`. Biến cục bộ không bị gán lại lần nào sau khi khởi tạo được gọi là effectively final.
```
public final static void run() { }    // hợp lệ
final static public void walk() { }   // hợp lệ: thứ tự modifier tự do
void public jump() { }                // KHÔNG biên dịch: modifier đứng sau kiểu trả về
public swim() { }                     // KHÔNG biên dịch: thiếu kiểu trả về
```
@Bốn mức truy cập|private trong lớp; mặc định trong package; protected thêm lớp con; public ở mọi nơi.
`private`: chỉ trong cùng lớp. Không ghi gì (package access): các lớp cùng package. `protected`: cùng package, cộng với lớp con ở package khác. `public`: mọi nơi.
Điểm khó của `protected`: lớp con ở package khác chỉ dùng được thành viên protected qua kế thừa, tức qua `this`, `super`, hoặc qua tham chiếu có kiểu là chính lớp con đó. Qua một tham chiếu kiểu lớp cha thì không được.
```
package swan;
import bird.Bird;                 // Bird có: protected void fly() { }

public class Swan extends Bird {
    void test() {
        fly();                    // hợp lệ: thừa kế
        new Swan().fly();         // hợp lệ: tham chiếu kiểu Swan
        Bird b = new Swan();
        b.fly();                  // KHÔNG biên dịch: tham chiếu kiểu Bird
    }
}
```
@Thành viên static|Thành viên static thuộc về lớp, không thuộc về đối tượng nào.
Gọi thành viên static qua tên lớp. Gọi qua một biến tham chiếu cũng biên dịch được, và trình biên dịch chỉ nhìn kiểu của biến: biến đó có là `null` cũng không gây `NullPointerException`.

@Java luôn truyền tham trị|Phương thức nhận bản sao của giá trị; với đối tượng, bản sao đó là bản sao của tham chiếu.
Gán lại tham số bên trong phương thức không ảnh hưởng tới biến của nơi gọi. Nhưng vì bản sao tham chiếu vẫn trỏ tới cùng đối tượng, nên gọi phương thức làm thay đổi đối tượng (như `sb.append`) thì nơi gọi thấy được.
Giá trị trả về chỉ có tác dụng khi nơi gọi gán nó lại.
```
static void change(int n, StringBuilder sb, String s) {
    n = 99;                          // chỉ đổi bản sao
    sb.append("!");                  // đổi đối tượng chung: nơi gọi thấy
    s = s + "!";                     // tạo String mới, gán cho bản sao
    sb = new StringBuilder("new");   // chỉ đổi bản sao tham chiếu
}
// Gọi với n = 1, sb = "hi", s = "hi"  ->  sau đó: 1, "hi!", "hi"
```
@Nạp chồng phương thức|Các phương thức nạp chồng cùng tên nhưng khác danh sách tham số.
Khác kiểu trả về, khác mức truy cập hay khác tên tham số đều không đủ để nạp chồng. `int[] a` và `int... a` được coi là cùng một chữ ký. Hai tham số generic chỉ khác đối số kiểu, như `List<String>` và `List<Integer>`, cũng trùng nhau sau khi xoá kiểu.
```
void run(int[] a) { }
void run(int... a) { }            // KHÔNG biên dịch: trùng với dòng trên
void run(List<String> a) { }      // hợp lệ: khác kiểu tham số
int run(String a) { return 0; }   // hợp lệ: tham số khác; kiểu trả về khác cũng không sao
```
@Thứ tự chọn phương thức|Khớp chính xác, rồi nới rộng kiểu nguyên thủy, rồi autoboxing, cuối cùng mới tới varargs.
Với đối số nguyên thủy, Java thử lần lượt: kiểu khớp chính xác; kiểu nguyên thủy lớn hơn (`int` sang `long`, `float`, `double`); đóng hộp (`int` sang `Integer`, rồi lên `Number`, `Object`); và sau cùng là varargs.
Java không làm hai bước theo chiều nới rộng rồi đóng hộp: `int` không tự thành `Long`. Chiều ngược lại thì được: `Integer` mở hộp thành `int` rồi nới rộng thành `long`.
```

static String f(Integer x) { return "Integer"; }
static String f(int... x) { return "varargs"; }
static String f(Object x) { return "Object"; }

f(5);      // long: nới rộng được ưu tiên hơn đóng hộp
f(5.0);    // Object: double đóng hộp thành Double
f();       // varargs
```
!Với `void g(Long x)`, lời gọi `g(5)` không biên dịch. Phải viết `g(5L)`.
@Kiểu tham chiếu và null|Java chọn phương thức có kiểu tham số cụ thể nhất; hai ứng viên không hơn kém nhau thì lỗi.
Kiểu của biến lúc biên dịch quyết định phương thức nạp chồng nào được gọi, không phải kiểu thật của đối tượng. Với `null`, Java chọn kiểu cụ thể nhất: giữa `Object` và `String` thì chọn `String`. Nếu hai kiểu không có quan hệ kế thừa, như `String` và `StringBuilder`, lời gọi với `null` là không rõ ràng và không biên dịch.
```

static String f(String s) { return "String"; }

Object o = "text";
f(o);        // Object: theo kiểu của biến
f("text");   // String
f(null);     // String: cụ thể hơn Object
```

##13
~Kế thừa bắt đầu từ constructor. Java 25 gỡ bỏ một quy tắc có từ bản 1.0: super() và this() không còn buộc phải là câu lệnh đầu tiên.
@extends, this và super|Mỗi lớp kế thừa đúng một lớp cha; this chỉ đối tượng hiện tại, super chỉ phần thừa hưởng từ lớp cha.
Java chỉ cho đơn kế thừa lớp: `class Dog extends Animal`. Lớp không ghi `extends` thì kế thừa `Object`. Lớp con thừa hưởng các thành viên `public`, `protected` và (nếu cùng package) package access; thành viên `private` không được thừa hưởng.
`this.x` chỉ trường của đối tượng hiện tại, dùng khi tham số trùng tên trường. `super.x` và `super.method()` truy cập bản của lớp cha. `this(...)` gọi constructor khác của cùng lớp, `super(...)` gọi constructor của lớp cha.
```
class Animal {
    String name;
    Animal(String name) { this.name = name; }
}
class Dog extends Animal {
    Dog() { this("Rex"); }             // gọi constructor khác của Dog
    Dog(String name) { super(name); }  // gọi constructor của Animal
}
```
@Constructor mặc định và chuỗi gọi constructor|Không viết lời gọi nào thì trình biên dịch tự chèn super() không tham số.
Lớp không khai báo constructor nào sẽ được cấp một constructor mặc định không tham số. Chỉ cần khai báo một constructor bất kỳ là constructor mặc định biến mất.
Mỗi constructor có nhiều nhất một lời gọi `this(...)` hoặc `super(...)`, không thể có cả hai. Nếu không có, trình biên dịch chèn `super()`. Vì thế khi lớp cha không có constructor không tham số, mọi constructor của lớp con phải tự gọi `super(...)` với đối số. Các constructor gọi vòng tròn lẫn nhau bằng `this(...)` là lỗi biên dịch.
```
class A {
    A() { this("x"); System.out.print("1"); }
    A(String s) { System.out.print("2"); }
}
class B extends A {
    B() { this(5); System.out.print("3"); }
    B(int n) { System.out.print("4"); }     // super() được chèn ngầm ở đây
}
// new B() in ra 2143: lớp cha chạy xong trước, rồi mới tới thân constructor lớp con
```
@Flexible constructor bodies (Java 25)|Được viết câu lệnh trước super(...) hoặc this(...), miễn là chưa đụng tới đối tượng đang tạo.
Phần mã đứng trước lời gọi constructor gọi là phần mở đầu (prologue). Ở đó bạn có thể kiểm tra tham số, tính toán giá trị trung gian, gọi phương thức static, ném ngoại lệ, và gán giá trị cho trường của chính lớp đó nếu trường không có giá trị khởi tạo tại khai báo.
Gán trường trước `super()` giải quyết một lỗi kinh điển: constructor lớp cha gọi một phương thức bị lớp con ghi đè, và phương thức đó đọc trường của lớp con khi trường chưa kịp được gán.
```
class Base {
    Base() { show(); }
    void show() { System.out.println("base"); }
}
class Sub extends Base {
    final int x;
    Sub(int x) {
        if (x < 0) throw new IllegalArgumentException();   // kiểm tra trước
        this.x = x;                                         // gán trường trước
        super();                                            // rồi mới gọi lớp cha
    }
    void show() { System.out.println("x=" + x); }
}

@Những gì không được làm trong phần mở đầu|Trước super(...), đối tượng chưa tồn tại trọn vẹn nên không được đọc hay dùng this.
Trong phần mở đầu, các việc sau gây lỗi biên dịch: đọc một trường instance; gọi một phương thức instance; dùng `this` làm giá trị (kể cả bên trong lambda); dùng `super.trường` hoặc `super.phươngThức()`; tạo đối tượng của lớp inner; gán cho trường đã có giá trị khởi tạo tại khai báo; và dùng `return`.
```
class Account {
    int balance;
    int bonus = 10;
    void log() { }
    Account(int amount) {
        int checked = Math.max(amount, 0);   // hợp lệ: biến cục bộ, phương thức static
        this.balance = checked;              // hợp lệ: trường chưa có giá trị khởi tạo
        // this.bonus = 20;                  // KHÔNG biên dịch: bonus đã khởi tạo tại khai báo
        // log();                            // KHÔNG biên dịch: phương thức instance
        // int b = balance;                  // KHÔNG biên dịch: đọc trường
        super();
    }
}
```
!Lời gọi `super(...)` hoặc `this(...)` vẫn phải nằm trực tiếp trong thân constructor, không được đặt trong `if`, `try` hay vòng lặp, và mỗi constructor chỉ có một lời gọi.
=constructor mặc định|Constructor không tham số do trình biên dịch sinh ra khi lớp không khai báo constructor nào
=super()|Lời gọi constructor của lớp cha; được chèn ngầm nếu constructor không có this(...) hay super(...)
=this(...)|Lời gọi một constructor khác của cùng lớp
=flexible constructor bodies|Tính năng Java 25 cho phép viết câu lệnh trước super(...) hoặc this(...)
=phần mở đầu (prologue)|Các câu lệnh của constructor đứng trước lời gọi super(...) hoặc this(...)
=phần kết (epilogue)|Các câu lệnh của constructor đứng sau lời gọi super(...) hoặc this(...); ở đây dùng this tự do
=đơn kế thừa|Mỗi lớp chỉ extends đúng một lớp cha

##14
~Khi một câu hỏi in ra chuỗi ký tự từ nhiều khối khởi tạo, bạn chỉ cần thuộc đúng một trình tự. Bài này luyện trình tự đó và các quy tắc của final.
@Khởi tạo lớp: phần static|Phần static của lớp chạy đúng một lần, khi lớp được dùng lần đầu, lớp cha trước lớp con.
Khi lớp được dùng lần đầu (tạo đối tượng, gọi phương thức static, đọc trường static không phải hằng số), JVM khởi tạo lớp: trước hết là lớp cha nếu chưa khởi tạo, rồi các khai báo trường static và các khối `static { }` theo đúng thứ tự xuất hiện trong tệp.
```
public class Order {
    static { System.out.print("A"); }
    { System.out.print("B"); }
    Order() { System.out.print("C"); }
    static { System.out.print("D"); }
    public static void main(String[] args) {
        System.out.print("F");
        new Order();
    }
}
// In ra ADFBC: hai khối static chạy trước cả main
```
@Khởi tạo đối tượng: phần instance|Lớp cha xong trước; rồi tới trường và khối instance theo thứ tự trong tệp; cuối cùng là phần còn lại của constructor.
Mỗi lần `new`, trình tự là: lời gọi `super(...)` (toàn bộ quá trình khởi tạo của lớp cha); các khai báo trường instance và khối `{ }` theo thứ tự xuất hiện; phần thân constructor sau `super(...)`.
Gộp cả hai tầng, với `new Child()` lần đầu: static của cha, static của con, instance của cha, constructor của cha, instance của con, constructor của con.
```
class Cup {
    int size = 1;          // bước 1
    { size += 2; }         // bước 2: 3
    Cup() { size *= 3; }   // bước 4: 12
    { size += 1; }         // bước 3: 4
}
```
!Khối instance và trường instance chạy trước thân constructor, dù trong tệp chúng được viết phía dưới constructor.
@Thứ tự khai báo và tham chiếu tới trước|Trường khai báo phía dưới vẫn mang giá trị mặc định khi một trường phía trên được khởi tạo.
Bộ khởi tạo của một trường không được đọc trực tiếp một trường khai báo sau nó: đó là lỗi tham chiếu tới trước. Nhưng nếu đọc gián tiếp qua một phương thức thì biên dịch được, và phương thức sẽ thấy giá trị mặc định.
```
public class Seq {
    int a = next();     // next() chạy khi b còn là 0: a = 1
    int b = 5;
    int c = next();     // lúc này b = 5: c = 6
    int next() { return b + 1; }
    // int d = e + 1;   // KHÔNG biên dịch: tham chiếu tới trước
    // int e = 2;
}
```
@final với trường và biến|Trường final phải được gán đúng một lần trước khi quá trình khởi tạo kết thúc.
Trường instance `final` được gán tại khai báo, trong khối instance, hoặc trong constructor; mọi constructor đều phải bảo đảm trường được gán, và không gán hai lần. Trường `static final` được gán tại khai báo hoặc trong khối static.
`final` trên biến tham chiếu chỉ khoá phép gán lại biến. Đối tượng mà biến trỏ tới vẫn thay đổi được.
```

sb.append("b");                   // hợp lệ: sửa đối tượng
final int[] arr = {1, 2};
arr[0] = 9;                       // hợp lệ: sửa phần tử
sb = new StringBuilder("c");      // KHÔNG biên dịch: gán lại biến final
```
=khối khởi tạo instance|Khối { } đặt trực tiếp trong lớp, chạy mỗi lần tạo đối tượng, trước thân constructor
=khối khởi tạo static|Khối static { } chạy một lần khi lớp được khởi tạo

=trường final|Trường phải được gán đúng một lần, muộn nhất là khi constructor kết thúc
=tham chiếu final|Biến không gán lại được, nhưng đối tượng nó trỏ tới vẫn có thể thay đổi
=thứ tự khởi tạo đối tượng|super(...), rồi trường và khối instance, rồi phần còn lại của constructor

##15
~Ghi đè và che giấu trông giống nhau trong mã nguồn nhưng chạy khác hẳn. Bài này gom bốn quy tắc ghi đè, lớp abstract và cách viết một lớp bất biến.
@Bốn quy tắc ghi đè phương thức|Bản ghi đè không được chặt hơn về truy cập, không ném thêm checked exception, và kiểu trả về phải tương thích.
Để ghi đè, phương thức lớp con phải cùng chữ ký với phương thức lớp cha. Ngoài ra: mức truy cập phải bằng hoặc rộng hơn; không được khai báo checked exception mới hoặc rộng hơn (ít hơn hoặc hẹp hơn thì được); kiểu trả về phải giống hoặc là kiểu con (kiểu trả về hiệp biến).
Phương thức `final` không ghi đè được. Phương thức `private` không được thừa hưởng, nên khai báo lại cùng tên ở lớp con chỉ là một phương thức mới, không liên quan.
```
class Bird {
    protected Number size() throws java.io.IOException { return 1; }
    void sing() { }
}
class Robin extends Bird {
    public Integer size() { return 2; }   // hợp lệ: rộng hơn, kiểu con, bỏ bớt ngoại lệ
    private void sing() { }               // KHÔNG biên dịch: truy cập chặt hơn
}
```
@Che giấu phương thức static và trường|Phương thức instance được chọn theo đối tượng thật; phương thức static và trường được chọn theo kiểu của biến.
Phương thức static cùng chữ ký ở lớp con che giấu (hide) bản của lớp cha chứ không ghi đè. Trường trùng tên ở lớp con cũng che giấu trường của lớp cha. Với cả hai, bản nào được dùng là do kiểu khai báo của biến quyết định lúc biên dịch.
Không được trộn hai loại: phương thức instance không ghi đè được phương thức static, và ngược lại. Cả hai trường hợp đều là lỗi biên dịch.
```
Animal a = new Cat();   // Cat khai báo lại name, kind() static và sound()
a.name;                 // trường của Animal: theo kiểu biến
a.kind();               // bản static của Animal: theo kiểu biến
a.sound();              // bản của Cat: theo đối tượng thật
```
@Lớp và phương thức abstract|Lớp abstract không tạo được đối tượng; lớp cụ thể đầu tiên kế thừa nó phải hiện thực mọi phương thức abstract.
Phương thức `abstract` không có thân và chỉ được khai báo trong lớp abstract hoặc interface. Lớp abstract vẫn có constructor, và constructor đó chạy khi lớp con được tạo. Lớp abstract có thể không có phương thức abstract nào.
Các tổ hợp không hợp lệ: `abstract` cùng `final` (không ai ghi đè được), `abstract` cùng `private` (lớp con không thấy), `abstract` cùng `static` (static không ghi đè được).
```
abstract class Shape {
    abstract double area();                 // không có thân
    void print() { System.out.println(area()); }
}
class Circle extends Shape {
    double area() { return 3.14; }          // bắt buộc, nếu không Circle phải abstract
}
```
!Constructor lớp cha gọi một phương thức abstract thì bản của lớp con chạy khi các trường của lớp con chưa được khởi tạo. Kết quả thường là `null` hoặc `0`.
@Thiết kế lớp bất biến|Lớp final, trường private final, không setter, và sao chép phòng vệ cho dữ liệu thay đổi được.
Năm bước: khai báo lớp `final` (hoặc mọi constructor private); mọi trường `private final`; không có phương thức thay đổi trạng thái; constructor sao chép các đối tượng thay đổi được mà nó nhận vào; getter không trả thẳng tham chiếu tới đối tượng thay đổi được bên trong.
```
final class Team {
    private final List<String> members;
    Team(List<String> members) { this.members = new ArrayList<>(members); }   // sao chép đầu vào
    List<String> members() { return List.copyOf(members); }                   // trả bản chỉ đọc
}
```
=ghi đè (override)|Lớp con định nghĩa lại phương thức instance của lớp cha với cùng chữ ký
=che giấu (hide)|Lớp con khai báo lại phương thức static hoặc trường trùng tên; bản được dùng tuỳ kiểu của biến
=kiểu trả về hiệp biến (covariant)|Bản ghi đè được trả về kiểu con của kiểu trả về gốc
=abstract|Lớp không tạo được đối tượng, hoặc phương thức không có thân chờ lớp con hiện thực
=lớp cụ thể (concrete)|Lớp không abstract; phải hiện thực mọi phương thức abstract thừa hưởng
=sao chép phòng vệ (defensive copy)|Tạo bản sao của đối tượng thay đổi được khi nhận vào hoặc trả ra, để bảo vệ trạng thái bên trong
=List.copyOf|Trả về danh sách bất biến chứa các phần tử của collection đã cho

##16
~Interface có nhiều modifier ngầm định mà đề thi chờ bạn quên. Từ Java 8 và 9 nó còn có phương thức default, static và private, mỗi loại một bộ quy tắc.
@Modifier ngầm định|Phương thức không thân trong interface là public abstract; trường là public static final.
Interface tự nó là `abstract`. Phương thức không có thân mặc nhiên `public abstract`. Mọi trường mặc nhiên `public static final`, tức là hằng số và phải có giá trị ngay.
Hệ quả: lớp hiện thực phải khai báo phương thức đó là `public`, vì bỏ trống mức truy cập nghĩa là thu hẹp xuống package access. Và không gán lại được trường của interface.
```
interface Flyer {
    void fly();          // public abstract
    int SPEED = 10;      // public static final
}
class Bat implements Flyer {
    public void fly() { }     // bắt buộc public
    // void fly() { }         // KHÔNG biên dịch: truy cập chặt hơn
}
```
!Trong interface không dùng được `protected` hay `final` cho phương thức. Một lớp `implements` nhiều interface; một interface `extends` nhiều interface.
@Phương thức default|Phương thức default có thân, mặc nhiên public, và được lớp hiện thực thừa hưởng.
`default` chỉ dùng trong interface và bắt buộc có thân. Lớp hiện thực có thể ghi đè hoặc dùng luôn. Nếu lớp thừa hưởng cùng một phương thức từ lớp cha và từ một default của interface, bản của lớp cha thắng.
Nếu hai interface cùng cung cấp default trùng chữ ký, lớp hiện thực cả hai phải tự ghi đè, nếu không sẽ lỗi biên dịch. Trong bản ghi đè, gọi bản của từng interface bằng `TênInterface.super.phươngThức()`.
```
interface A { default String m() { return "A"; } }
interface B { default String m() { return "B"; } }
class C implements A, B {
    public String m() { return A.super.m() + B.super.m(); }   // bắt buộc ghi đè
}
```
@Phương thức static của interface|Chỉ gọi được qua tên interface; không được lớp hiện thực thừa hưởng.
Phương thức `static` trong interface mặc nhiên `public` và phải có thân. Khác với phương thức static của lớp, nó không được thừa hưởng: không gọi qua tên lớp hiện thực, cũng không gọi qua một biến tham chiếu.
```
interface Tool {
    static String name() { return "tool"; }
    default String use() { return "use " + name(); }   // gọi được trong chính interface
}
class Hammer implements Tool { }

Tool.name();             // hợp lệ
new Hammer().name();     // KHÔNG biên dịch
```
@Phương thức private của interface|private và private static dùng để chia sẻ mã giữa các phương thức có thân trong interface.
Phương thức `private` của interface phải có thân, chỉ gọi được từ các phương thức `default` và `private` khác trong cùng interface. Phương thức `private static` gọi được từ mọi phương thức có thân trong interface, kể cả phương thức static.
```
interface Counter {
    private int base() { return 10; }
    private static int twice(int n) { return n * 2; }
    default int value() { return twice(base()) + extra(); }
    int extra();          // phương thức abstract duy nhất
}
```
=public abstract|Modifier ngầm định của phương thức không có thân trong interface
=public static final|Modifier ngầm định của mọi trường trong interface
=phương thức default|Phương thức có thân trong interface, được lớp hiện thực thừa hưởng và có thể ghi đè
=A.super.m()|Cú pháp gọi bản default của interface A từ lớp hiện thực
=phương thức static của interface|Chỉ gọi qua tên interface; không được thừa hưởng
=phương thức private của interface|Phương thức có thân, chỉ dùng nội bộ trong interface
=lớp thắng interface|Khi lớp cha và một default của interface cùng cung cấp một phương thức, bản của lớp cha được dùng

##17
~Enum và sealed cùng trả lời một câu hỏi: tập giá trị hoặc tập lớp con có đóng không. Khi tập đó đóng, switch không cần default nữa.
@Enum cơ bản|Enum là một tập hằng số cố định; mỗi hằng là một đối tượng duy nhất nên so sánh bằng == được.
`values()` trả mảng các hằng theo thứ tự khai báo. `valueOf("TÊN")` trả hằng có đúng tên đó, phân biệt hoa thường; sai tên thì ném `IllegalArgumentException`. `ordinal()` là vị trí tính từ 0, `name()` là tên. `compareTo` so theo ordinal.
Enum không `extends` được lớp nào (nó đã ngầm kế thừa `java.lang.Enum`) nhưng `implements` được interface.
```
enum Level { LOW, MID, HIGH }

Level l = Level.valueOf("MID");
l.ordinal();                 // 1
l.compareTo(Level.HIGH);     // -1
Level.values().length;       // 3
l == Level.MID;              // true
```
@Enum có trường, constructor và phương thức|Constructor của enum ngầm định private và chạy đúng một lần cho mỗi hằng.
Khi enum có thêm thành viên, danh sách hằng phải đứng đầu và kết thúc bằng dấu chấm phẩy. Constructor chỉ được `private` hoặc không ghi gì; ghi `public` là lỗi biên dịch. Toàn bộ hằng được tạo khi enum được dùng lần đầu, theo thứ tự khai báo.
Mỗi hằng có thể có thân riêng để hiện thực phương thức abstract của enum.
```
enum Coin {
    PENNY(1), DIME(10);                 // dấu chấm phẩy bắt buộc vì còn thành viên phía sau
    final int cents;
    Coin(int cents) { this.cents = cents; }
}
enum Op {
    ADD { int apply(int a, int b) { return a + b; } },
    MUL { int apply(int a, int b) { return a * b; } };
    abstract int apply(int a, int b);
}
```
@Enum trong switch|switch expression trên enum không cần default nếu đã liệt kê đủ mọi hằng.
Trong `case`, viết tên hằng trần như `RED`. Từ Java 21 cũng được viết tên đầy đủ như `Light.GREEN`. Với switch expression, thiếu một hằng mà không có `default` là lỗi biên dịch.
```
enum Light { RED, YELLOW, GREEN }

String s = switch (l) {
    case RED -> "stop";
    case YELLOW -> "wait";
    case Light.GREEN -> "go";     // tên đầy đủ: hợp lệ từ Java 21
};                                // đủ ba hằng, không cần default
```
@Lớp và interface sealed|sealed giới hạn ai được kế thừa; mỗi lớp con trực tiếp phải là final, sealed hoặc non-sealed.
`sealed class Shape permits Circle, Square` chỉ cho hai lớp đó kế thừa trực tiếp. Lớp con phải cùng package với lớp sealed (hoặc cùng module, nếu là module có tên) và phải ghi một trong ba modifier: `final`, `sealed` (tiếp tục giới hạn), hoặc `non-sealed` (mở lại cho mọi lớp). Nếu các lớp con nằm cùng tệp với lớp sealed thì được bỏ mệnh đề `permits`.
Record ngầm định `final` nên hiện thực interface sealed mà không cần ghi thêm gì. Khi switch dạng pattern đã bao phủ mọi kiểu con được phép, không cần `default`.
```
sealed interface Pet permits Dog, Cat { }
record Dog(String name) implements Pet { }
record Cat(int lives) implements Pet { }

String s = switch (p) {            // p kiểu Pet
    case Dog d -> d.name();
    case Cat c -> "cat" + c.lives();
};                                 // đã đủ, không cần default
```
!Quên modifier trên lớp con, ví dụ `class Square extends Shape { }`, là lỗi biên dịch dù Square có tên trong `permits`.
=values()|Phương thức static của enum, trả mảng mọi hằng theo thứ tự khai báo
=valueOf(String)|Trả hằng enum có đúng tên đã cho; sai tên thì ném IllegalArgumentException

~Bài cuối của tuần hướng đối tượng: record thay cho lớp dữ liệu, bốn kiểu lớp lồng nhau, và cách Java quyết định phương thức nào chạy.
@Record|Record là lớp dữ liệu bất biến: trình biên dịch sinh sẵn trường, constructor, accessor, equals, hashCode và toString.
`record Point(int x, int y) { }` tạo hai trường `private final`, một constructor chính tắc nhận đủ hai tham số, accessor `x()` và `y()` (không có tiền tố get), cùng `equals`, `hashCode`, `toString` dựa trên giá trị. Record ngầm định `final`, không `extends` được lớp nào nhưng `implements` được interface.
Record không được khai báo thêm trường instance. Trường static, phương thức static và phương thức instance thì được.
```
record Point(int x, int y) {
    static int count;                    // hợp lệ
    int sum() { return x + y; }          // hợp lệ
    // int z;                            // KHÔNG biên dịch: trường instance
}
new Point(1, 2).toString();              // Point[x=1, y=2]
new Point(1, 2).equals(new Point(1, 2)); // true
```
@Compact constructor và record pattern|Compact constructor không có danh sách tham số; nó sửa tham số, còn việc gán vào trường diễn ra tự động sau đó.
Compact constructor viết là `Point { ... }`. Bên trong, bạn kiểm tra hoặc gán lại các tham số. Trình biên dịch tự gán tham số vào trường khi khối kết thúc, nên viết `this.x = x` trong compact constructor là lỗi biên dịch.
Record pattern tách record thành các thành phần ngay trong `instanceof` hoặc `case`, và lồng nhau được. Dùng `var` để khỏi ghi kiểu.
```
record Point(int x, int y) {
    Point {
        if (x < 0) x = 0;        // sửa tham số, không phải trường
    }
}
record Line(Point from, Point to) { }

if (o instanceof Line(Point(var a, var b), Point p) && a < p.x()) { }
```
@Bốn kiểu lớp lồng nhau|Lớp inner cần một đối tượng của lớp ngoài; lớp static nested thì không.
Lớp inner (không static): gắn với một đối tượng lớp ngoài, đọc được cả thành viên private của nó. Tạo từ bên ngoài bằng `outer.new Inner()`. Khi trùng tên, `Outer.this.x` chỉ trường của lớp ngoài. Lớp static nested: tạo bằng `new Outer.Nested()`, không cần đối tượng lớp ngoài.
Lớp cục bộ khai báo trong phương thức, và lớp vô danh tạo ngay tại chỗ bằng `new Kiểu() { ... }`. Cả hai chỉ dùng được biến cục bộ final hoặc effectively final.
```
public class Outer {
    private int x = 10;
    class Inner {
        int x = 20;
        String show() { int x = 30; return x + " " + this.x + " " + Outer.this.x; }   // 30 20 10
    }
    static class Tag { }
}
Outer.Inner in = new Outer().new Inner();
Outer.Tag t = new Outer.Tag();
```
!Trong một phương thức static của lớp ngoài, viết `new Inner()` không biên dịch vì không có đối tượng lớp ngoài nào để gắn vào.
@Đa hình và ép kiểu tham chiếu|Kiểu của biến quyết định gọi được gì; đối tượng thật quyết định bản phương thức nào chạy.
Một biến kiểu cha trỏ được tới đối tượng kiểu con. Qua biến đó chỉ gọi được những thành viên mà kiểu cha khai báo, nhưng phương thức instance bị ghi đè thì chạy bản của đối tượng thật.
Ép xuống kiểu con cần viết tường minh. Nếu hai kiểu có thể có quan hệ, mã biên dịch được và JVM kiểm tra lúc chạy: sai thì ném `ClassCastException`. Nếu hai lớp chắc chắn không liên quan, trình biên dịch từ chối luôn. Dùng `instanceof` để kiểm tra trước khi ép.
```
Animal a = new Dog();
Dog d = (Dog) a;        // hợp lệ: đối tượng thật là Dog
Cat c = (Cat) a;        // biên dịch được, nhưng ném ClassCastException khi chạy
String s = (String) a;  // KHÔNG biên dịch: Animal và String không liên quan
```

=constructor chính tắc (canonical)|Constructor của record nhận đủ mọi thành phần theo đúng thứ tự khai báo

##19
~Lambda là cách viết gọn một đối tượng chỉ có một phương thức. Đề thi hỏi ba thứ: cú pháp nào hợp lệ, interface nào nhận được lambda, và lambda dùng được biến nào.
@Cú pháp lambda|Tham số, mũi tên, rồi thân; dấu ngoặc và từ khoá return chỉ bỏ được trong những trường hợp nhất định.
Một tham số không ghi kiểu thì bỏ được ngoặc tròn: `a -> a.isEmpty()`. Không có tham số hoặc có từ hai tham số trở lên thì bắt buộc có ngoặc. Thân là một biểu thức thì không viết `return` và dấu chấm phẩy; thân là khối `{ }` thì phải viết đủ.
Kiểu tham số phải nhất quán: hoặc tất cả không ghi kiểu, hoặc tất cả ghi kiểu, hoặc tất cả dùng `var`. Trộn lẫn là lỗi biên dịch.
```
a -> a.isEmpty()                      // hợp lệ
(a, b) -> a + b                       // hợp lệ
(String a, String b) -> a + b         // hợp lệ
(var a, var b) -> { return a + b; }   // hợp lệ
a, b -> a + b                         // KHÔNG biên dịch: thiếu ngoặc
(var a, b) -> a + b                   // KHÔNG biên dịch: trộn var với không kiểu
a -> { a.isEmpty() }                  // KHÔNG biên dịch: khối thiếu return và chấm phẩy
```
@Functional interface|Interface có đúng một phương thức abstract thì nhận được lambda.
Khi đếm phương thức abstract, bỏ qua phương thức `default`, `static`, `private`, và cả những phương thức trùng với phương thức public của `Object` như `equals`, `hashCode`, `toString`. Annotation `@FunctionalInterface` không bắt buộc, nhưng nếu ghi mà interface không đạt điều kiện thì lỗi biên dịch.
Lambda tự nó không có kiểu: phải gán vào biến hoặc tham số có kiểu là functional interface. Vì vậy `var f = () -> 1;` và `Object o = () -> 1;` đều không biên dịch.
```
@FunctionalInterface
interface Checker {
    boolean test(int x);            // phương thức abstract duy nhất
    boolean equals(Object o);       // không tính: trùng với Object
    default Checker not() { return x -> !test(x); }   // không tính
}
Checker even = x -> x % 2 == 0;
```
@Lambda và biến xung quanh|Lambda chỉ đọc được biến cục bộ effectively final, nhưng đọc và sửa được trường.
Biến cục bộ và tham số phương thức mà lambda dùng tới phải là final hoặc effectively final, nghĩa là không bị gán lại ở bất cứ đâu, kể cả sau khi lambda đã được tạo. Trường instance và trường static thì lambda đọc và sửa tự do.
Tham số của lambda không được trùng tên với một biến cục bộ đang trong phạm vi. Trong lambda, `this` vẫn là đối tượng bao ngoài; còn trong lớp vô danh, `this` là chính đối tượng vô danh.
```
int base = 10;
Supplier<Integer> s = () -> base + 1;   // KHÔNG biên dịch nếu base bị gán lại ở đâu đó
base++;                                 // chính dòng này làm base hết effectively final

String name = "a";
Function<String, Integer> f = name -> name.length();   // KHÔNG biên dịch: trùng tên biến cục bộ
```
@Lambda chạy trễ|Viết lambda chưa làm gì cả; mã bên trong chỉ chạy khi phương thức của interface được gọi.
Gán một lambda cho biến chỉ tạo ra đối tượng. Thân lambda chạy mỗi lần phương thức abstract được gọi, và chạy lại từ đầu mỗi lần. Khi lần theo kết quả in ra, hãy chú ý thời điểm gọi chứ không phải thời điểm khai báo.
```
List<String> log = new ArrayList<>();
Supplier<String> s = () -> { log.add("run"); return "v"; };   // chưa chạy
log.add("start");
s.get();          // lúc này mới thêm "run"
// log = [start, run]
```
=lambda|Biểu thức tạo ra một đối tượng hiện thực functional interface, viết dạng tham số -> thân
=functional interface|Interface có đúng một phương thức abstract
=@FunctionalInterface|Annotation yêu cầu trình biên dịch kiểm tra interface có đúng một phương thức abstract

~Method reference là lambda viết gọn hơn nữa. Kèm theo là bộ functional interface dựng sẵn trong java.util.function mà mọi câu hỏi về stream đều dùng tới.
@Bốn dạng method reference|Dấu :: trỏ tới một phương thức có sẵn; ngữ cảnh quyết định tham số được truyền thế nào.
Phương thức static: `Integer::parseInt` tương đương `s -> Integer.parseInt(s)`. Phương thức instance trên một đối tượng cụ thể: `prefix::equals` tương đương `s -> prefix.equals(s)`. Phương thức instance trên tham số đầu tiên: `String::isEmpty` tương đương `s -> s.isEmpty()`. Constructor: `ArrayList::new` tương đương `() -> new ArrayList<>()`.
Với dạng thứ ba, tham số đầu của functional interface trở thành đối tượng nhận lời gọi, các tham số còn lại thành đối số.
```
Function<String, Integer> f = Integer::parseInt;        // static
String prefix = "ja";
Predicate<String> q = prefix::equals;                   // đối tượng cụ thể
BiPredicate<String, String> p = String::startsWith;     // (a, b) -> a.startsWith(b)
Supplier<List<String>> s = ArrayList::new;              // constructor
```
!`Supplier<Integer> d = String::length;` không biên dịch: `length` cần một String để gọi, mà Supplier không cung cấp tham số nào.
@Các functional interface dựng sẵn|Tên interface cho biết số tham số và có trả về hay không.
`Supplier<T>`: không tham số, trả T, phương thức `get`. `Consumer<T>` và `BiConsumer<T, U>`: nhận vào, không trả gì, phương thức `accept`. `Predicate<T>` và `BiPredicate<T, U>`: trả boolean, phương thức `test`. `Function<T, R>` và `BiFunction<T, U, R>`: biến đổi, phương thức `apply`. `UnaryOperator<T>` là Function có đầu vào và đầu ra cùng kiểu; `BinaryOperator<T>` là BiFunction với cả ba cùng kiểu.
Lambda phải khớp cả số tham số lẫn kiểu trả về. Riêng với interface trả `void`, thân lambda là một lời gọi phương thức có trả giá trị vẫn được chấp nhận, giá trị đó bị bỏ đi.
```
Supplier<String> a = () -> "x";
Consumer<String> b = s -> s.length();       // hợp lệ: giá trị trả về bị bỏ
Predicate<String> c = s -> s.length();      // KHÔNG biên dịch: int không phải boolean
UnaryOperator<String> d = String::trim;
BinaryOperator<Integer> e = Math::max;
```
@Interface cho kiểu nguyên thủy|Bản nguyên thủy tránh đóng hộp và có tên phương thức riêng.
Có ba họ cho `int`, `long`, `double`. Tiền tố kiểu chỉ đầu vào: `IntPredicate`, `IntFunction<R>`, `IntUnaryOperator`, `IntBinaryOperator`, `IntConsumer`. Tiền tố `To` chỉ đầu ra: `ToIntFunction<T>`. `IntSupplier` trả `int`, và `BooleanSupplier` là trường hợp riêng cho boolean.
Tên phương thức thay đổi theo kiểu trả về: `applyAsInt`, `getAsInt`, `getAsBoolean`, `applyAsDouble`.
```
IntBinaryOperator op = (a, b) -> a * b;
op.applyAsInt(3, 4);                  // 12
ToIntFunction<String> len = String::length;
len.applyAsInt("java");               // 4
```
@Phương thức ghép nối|andThen chạy mình trước; compose chạy tham số trước.
`Function`: `f.andThen(g)` tính f rồi đưa kết quả cho g; `f.compose(g)` tính g trước rồi mới tới f. `Consumer.andThen` chạy lần lượt hai consumer trên cùng một giá trị. `Predicate` có `and`, `or`, `negate` và phương thức static `Predicate.not`.
```
Function<Integer, Integer> add = x -> x + 2;
Function<Integer, Integer> mul = x -> x * 3;
add.andThen(mul).apply(1);    // (1 + 2) * 3 = 9
add.compose(mul).apply(1);    // (1 * 3) + 2 = 5
```

=Predicate<T>|Nhận T, trả boolean; phương thức test()
=Function<T, R>|Nhận T, trả R; phương thức apply()
=UnaryOperator<T>|Function có đầu vào và đầu ra cùng kiểu T
=BinaryOperator<T>|Nhận hai giá trị kiểu T, trả về T
=andThen và compose|f.andThen(g) chạy f trước; f.compose(g) chạy g trước
