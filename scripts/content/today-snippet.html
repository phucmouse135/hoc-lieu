<!-- Luyện hôm nay: một chạm trộn câu đến hạn ôn, câu trong sổ lỗi và câu ôn từ các bài gần nhất -->
<script>
(function(){
  const EN=__EN__,N=20;
  const T=EN?{h:'Today\'s practice',d:(a,b,c)=>`${a} due for review · ${b} in the error notebook · the rest from recent lessons`,go:'Start 20 questions',none:'Nothing to practise yet. Finish today\'s lesson first.',t:'Today\'s practice',done:(p,n)=>`Done: ${p}% correct. ${n} item(s) still due.`}
  :{h:'Luyện hôm nay',d:(a,b,c)=>`${a} mục đến hạn ôn · ${b} mục trong sổ lỗi · phần còn lại ôn từ các bài gần nhất`,go:'Bắt đầu 20 câu',none:'Chưa có gì để luyện. Hãy học bài hôm nay trước.',t:'Luyện hôm nay',done:(p,n)=>`Xong: đúng ${p}%. Còn ${n} mục đến hạn ôn.`};
  const S=()=>{try{if(typeof P==='function'){const p=P();if(p)return p}}catch(e){}try{if(typeof ST==='object'&&ST)return ST}catch(e){}return null};
  const tday=()=>{try{return today()}catch(e){return new Date().toISOString().slice(0,10)}};
  const dueKeys=()=>{const s=S();if(!s)return [];const m=Object.assign({},s.mem||{},s.srs||{}),t=tday();return Object.keys(m).filter(k=>m[k]&&m[k].d<=t).sort((a,b)=>(m[a].b||0)-(m[b].b||0))};
  const wrongKeys=()=>{const s=S();return s&&s.wrong?Object.keys(s.wrong).sort((a,b)=>s.wrong[b]-s.wrong[a]):[]};
  const fromKey=k=>{try{return qFromKey(k)}catch(e){return null}};
  function fill(k){
    if(k<=0)return [];const ok=a=>Array.isArray(a)?a.filter(Boolean):[];
    try{if(typeof lessonBefore==='function'||typeof TEACH!=='undefined')return ok(reviewQs(todayN(),k))}catch(e){}
    try{if(typeof D==='function'&&typeof todayN==='function')for(let n=todayN();n>=1;n--){const d=D(n);if(d&&d.les){let r=ok(reviewQs(d.les.n,k));if(!r.length&&typeof pool==='function'&&typeof mkQ==='function')r=ok(shuf(pool([d.les],false)).slice(0,k).map(mkQ));return r}}}catch(e){}
    try{if(typeof LS!=='undefined'&&Array.isArray(LS)&&LS.length&&S()){const s=S(),done=LS.filter(L=>s.done&&s.done[L.id]);return ok(reviewQs(done.length?done[done.length-1]:LS[0],k))}}catch(e){}
    return [];
  }
  function build(){
    const seen=new Set(),out=[],add=q=>{if(q&&out.length<N&&!(q.key&&seen.has(q.key))){if(q.key)seen.add(q.key);out.push(q)}};
    dueKeys().slice(0,10).map(fromKey).forEach(add);
    wrongKeys().slice(0,5).map(fromKey).forEach(add);
    fill(N-out.length+4).forEach(add);
    try{return shuf(out)}catch(e){return out}
  }
  function box(){
    const s=S();if(!s)return '';
    return `<section class="sec todaybox" style="border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin:0 0 16px;background:var(--card)"><h2 style="margin:0 0 4px">${T.h}</h2>
      <p class="mute" style="margin:0 0 8px">${T.d(Math.min(10,dueKeys().length),Math.min(5,wrongKeys().length))}</p><div class="row"><button class="btn" data-today="go">${T.go}</button></div></section>`;
  }
  const wrap=n=>{try{const o=window[n];if(typeof o!=='function')return;window[n]=function(){const h=o.apply(this,arguments);return typeof h==='string'&&!arguments[0]?box()+h:h}}catch(e){}};
  wrap('home');wrap('pracV');
  document.addEventListener('click',e=>{const b=e.target.closest('[data-today="go"]');if(!b)return;e.preventDefault();
    const qs=build();if(!qs.length){toast(T.none);return}
    startQuiz(T.t,qs,{done:p=>{try{toast(T.done(p,dueKeys().length))}catch(x){}}})});
  try{if(/^#\/?(prac)?$/.test(location.hash||'#/'))render()}catch(e){}
})();
</script>
