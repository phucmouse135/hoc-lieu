<!-- Khôi phục sao lưu: kiểm tra đúng ứng dụng, xem trước, gộp hoặc thay thế -->
<div id="bkpop" hidden role="dialog" aria-modal="true"><div class="bk-box" id="bk-box"></div></div>
<style>#bkpop{position:fixed;inset:0;z-index:2100;background:rgba(10,15,25,.55);display:flex;align-items:center;justify-content:center;padding:16px}#bkpop[hidden]{display:none}#bkpop .bk-box{background:var(--card,#fff);color:var(--ink,#15202F);width:min(520px,100%);max-height:90vh;overflow:auto;border-radius:16px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.35);font:15px/1.55 var(--ui,system-ui,sans-serif)}#bkpop h3{margin:0 0 8px;font-size:1.1rem}#bkpop ul{margin:6px 0 10px;padding-left:20px}#bkpop .bk-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}#bkpop button{font:600 14px/1 var(--ui,system-ui,sans-serif);border:1px solid var(--line,#d3dae5);background:transparent;color:inherit;padding:10px 14px;border-radius:999px;cursor:pointer}#bkpop button.pri{background:var(--ai,#26497F);border-color:var(--ai,#26497F);color:#fff}#bkpop .bk-mute{opacity:.75;font-size:13.5px}#bkpop .bk-err{color:var(--shu,#C23B22)}</style>
<script>
(function(){
  const APP='__APP__',EN=__EN__;
  const T=EN?{title:'Restore from backup',other:a=>`This backup belongs to another course (${a}). Open that course to restore it.`,bad:'That file is not a backup from this course.',old:'This file was made by an older version, so its course cannot be confirmed. Only restore it if you are sure it comes from this course.',
    has:(n,f)=>`The file has ${n} profile(s)${f?', exported '+f:''}:`,prof:p=>`${p.name||'(no name)'}: ${Object.keys(p.done||{}).length} days done, ${Object.keys(p.exams||{}).length} mock exams`,
    merge:'Merge into this device',replace:'Replace everything',cancel:'Cancel',note:'Merge keeps the profiles already on this device and adds the ones from the file; a profile with the same ID is replaced by the file version. Replace drops everything on this device.',
    okM:'Backup merged.',okR:'Progress restored.'}
  :{title:'Khôi phục từ bản sao lưu',other:a=>`Đây là bản sao lưu của lộ trình khác (${a}). Hãy mở đúng lộ trình đó để khôi phục.`,bad:'Tệp không đúng định dạng sao lưu của lộ trình này.',old:'Tệp được tạo từ phiên bản cũ nên không xác định được thuộc lộ trình nào. Chỉ khôi phục khi bạn chắc tệp là của lộ trình này.',
    has:(n,f)=>`Tệp có ${n} hồ sơ${f?', tạo ngày '+f:''}:`,prof:p=>`${p.name||'(chưa đặt tên)'}: ${Object.keys(p.done||{}).length} ngày đã xong, ${Object.keys(p.exams||{}).length} đề thi thử`,
    merge:'Gộp vào máy này',replace:'Thay thế toàn bộ',cancel:'Huỷ',note:'Gộp: giữ các hồ sơ đang có trên máy và thêm hồ sơ trong tệp; hồ sơ trùng mã sẽ lấy bản trong tệp. Thay thế: bỏ toàn bộ dữ liệu đang có trên máy này.',
    okM:'Đã gộp bản sao lưu.',okR:'Đã khôi phục dữ liệu.'};
  try{if(DB&&typeof DB==='object')DB.app=APP}catch(e){}
  const pop=document.getElementById('bkpop'),box=document.getElementById('bk-box'),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const close=()=>{pop.hidden=true;box.innerHTML=''};
  const show=h=>{box.innerHTML=`<h3>${T.title}</h3>`+h;pop.hidden=false};
  let PEND=null;
  window.bkRestore=function(file){
    const f=new FileReader();
    f.onload=()=>{let d=null;try{d=JSON.parse(f.result)}catch(e){}
      if(!d||typeof d!=='object'||!d.profiles||typeof d.profiles!=='object'||!Object.keys(d.profiles).length){show(`<p class="bk-err">${T.bad}</p><div class="bk-row"><button data-bk="x">${T.cancel}</button></div>`);return}
      if(d.app&&d.app!==APP){show(`<p class="bk-err">${esc(T.other(d.app))}</p><div class="bk-row"><button data-bk="x">${T.cancel}</button></div>`);return}
      PEND=d;const ps=Object.values(d.profiles),ts=d.t||d.ts,has=DB&&DB.profiles&&Object.keys(DB.profiles).length;
      show(`${d.app?'':`<p class="bk-mute">${T.old}</p>`}<p>${esc(T.has(ps.length,ts?new Date(ts).toLocaleDateString():''))}</p><ul>${ps.map(p=>`<li>${esc(T.prof(p))}</li>`).join('')}</ul>
        <div class="bk-row">${has?`<button class="pri" data-bk="m">${T.merge}</button><button data-bk="r">${T.replace}</button>`:`<button class="pri" data-bk="r">${T.replace}</button>`}<button data-bk="x">${T.cancel}</button></div>${has?`<p class="bk-mute">${T.note}</p>`:''}`);
    };
    f.readAsText(file);
  };
  pop.addEventListener('click',e=>{
    const b=e.target.closest('[data-bk]');if(e.target===pop||b&&b.dataset.bk==='x'){close();return}if(!b||!PEND)return;
    const d=PEND;PEND=null;delete d.app;
    if(b.dataset.bk==='m'){Object.assign(DB.profiles,d.profiles)}else{DB=d}
    DB.app=APP;try{if(typeof migrate==='function')migrate()}catch(x){}
    if(!DB.cur||!DB.profiles[DB.cur])DB.cur=Object.keys(DB.profiles)[0];
    save();close();render();toast(b.dataset.bk==='m'?T.okM:T.okR);
  });
  addEventListener('keydown',e=>{if(e.key==='Escape'&&!pop.hidden)close()});
})();
</script>
